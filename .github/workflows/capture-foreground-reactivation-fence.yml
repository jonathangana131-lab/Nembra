name: Tighten Capture Foreground Reactivation Fence

on:
  push:
    branches:
      - sol/v14-capture-foreground-integrity-4b41-r3

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-foreground-integrity-4b41-r3
          fetch-depth: 0

      - name: Guard reviewed foreground repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'e953f5ac5d00df8c8a2c223006db91d9cea2b38a'
          grep -Fq 'func appDidLoseForeground()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'foregroundIntegrityLossHandled = false' NembraApp/App/NembraCaptureEntrypoint.swift
          ! sed -n '/func activateMembershipRequestsForView()/,/func abandonCorrelationForViewExit()/p' NembraApp/App/NembraCaptureEntrypoint.swift | grep -Fq 'guard currentConnectionToken == nil else { return }'

      - name: Apply and verify reactivation fence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tighten_capture_foreground_reactivation.py
          python3 -m py_compile scripts/ci/tighten_capture_foreground_reactivation.py
          git diff --check
          sed -n '/func activateMembershipRequestsForView()/,/func abandonCorrelationForViewExit()/p' NembraApp/App/NembraCaptureEntrypoint.swift | grep -Fq 'guard currentConnectionToken == nil else { return }'

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          construction_parent='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          rm .github/workflows/capture-foreground-reactivation-fence.yml
          rm scripts/ci/tighten_capture_foreground_reactivation.py
          git add -A
          changed="$(git diff --cached "$construction_parent" --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$construction_parent" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): fence foreground reactivation during retirement'
          git push origin HEAD:sol/v14-capture-foreground-integrity-4b41-r3
