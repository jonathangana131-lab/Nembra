name: V14 Capture Private Build Window B615

on:
  push:
    branches:
      - fix/v14-capture-private-build-window-b615-sol

permissions:
  contents: write

jobs:
  materialize-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v14-capture-private-build-window-b615-sol

      - name: Assert exact product ancestry and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='b615375e12e43abc55e111deb5dc36f3790c7506'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/v14-capture-private-build-window-b615.yml
          Scripts/capture_tuya_private_input_build_guard.py
          scripts/ci/tests/test_capture_field_installer_build_window_guard_source.py
          scripts/ci/tests/test_capture_tuya_private_input_build_guard.py
          tools/v14_capture_build_window_guard_materialize.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Materialize field installer wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v14_capture_build_window_guard_materialize.py
          bash -n scripts/field/install_one_time_capture.command

      - name: Parse and unit-test build guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Scripts/capture_tuya_private_input_build_guard.py \
            scripts/ci/tests/test_capture_tuya_private_input_build_guard.py \
            scripts/ci/tests/test_capture_field_installer_build_window_guard_source.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_build_guard.py
          python3 scripts/ci/tests/test_capture_field_installer_build_window_guard_source.py

      - name: Existing private provenance suite
        run: python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
      - name: Existing record snapshot suite
        run: python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
      - name: Existing final snapshot suite
        run: python3 scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py
      - name: Existing cross-authority suite
        run: python3 scripts/ci/tests/test_capture_tuya_private_input_record_tree_cross_authority.py
      - name: Existing field installer source suite
        run: python3 scripts/ci/tests/test_capture_field_installer_source.py
      - name: Existing private device suite
        run: python3 scripts/ci/tests/test_capture_field_installer_private_device.py
      - name: Existing CoreDevice suite
        run: python3 scripts/ci/tests/test_capture_field_installer_coredevice.py
      - name: Existing identity custody suite
        run: python3 scripts/ci/tests/test_capture_field_installer_identity_custody.py
      - name: Existing signed artifact source suite
        run: python3 scripts/ci/tests/test_capture_signed_field_artifact_source.py

      - name: Prove exact effective product scope
        shell: bash
        run: |
          set -euo pipefail
          GUARD='Scripts/capture_tuya_private_input_build_guard.py'
          INSTALLER='scripts/field/install_one_time_capture.command'
          TEST1='scripts/ci/tests/test_capture_tuya_private_input_build_guard.py'
          TEST2='scripts/ci/tests/test_capture_field_installer_build_window_guard_source.py'
          git add "$GUARD" "$INSTALLER" "$TEST1" "$TEST2"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '4'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$GUARD"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$INSTALLER"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST1"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST2"

      - name: Commit durable repair and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-capture-private-build-window-b615.yml tools/v14_capture_build_window_guard_materialize.py
          git commit -m 'fix(capture): guard private inputs through xcodebuild'
          git push origin HEAD:fix/v14-capture-private-build-window-b615-sol
