name: V14 Capture Private Build Window B615

on:
  push:
    branches:
      - fix/v14-capture-private-build-window-b615-sol

permissions:
  contents: write

jobs:
  materialize-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v14-capture-private-build-window-b615-sol

      - name: Assert exact product ancestry and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='b615375e12e43abc55e111deb5dc36f3790c7506'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/v14-capture-private-build-window-b615.yml
          Scripts/capture_tuya_private_input_build_guard.py
          scripts/ci/tests/test_capture_field_installer_build_window_guard_source.py
          scripts/ci/tests/test_capture_tuya_private_input_build_guard.py
          tools/v14_capture_build_window_guard_materialize.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Materialize field installer wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v14_capture_build_window_guard_materialize.py
          bash -n scripts/field/install_one_time_capture.command

      - name: Parse and unit-test build guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Scripts/capture_tuya_private_input_build_guard.py \
            scripts/ci/tests/test_capture_tuya_private_input_build_guard.py \
            scripts/ci/tests/test_capture_field_installer_build_window_guard_source.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_build_guard.py
          python3 scripts/ci/tests/test_capture_field_installer_build_window_guard_source.py

      - name: Existing private provenance suite
        run: python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
      - name: Existing post-path descriptor suite
        run: python3 scripts/ci/tests/test_capture_tuya_private_input_post_path_descriptor_custody.py
      - name: Existing record snapshot suite
        run: python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
      - name: Existing final snapshot suite
        run: python3 scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py
      - name: Existing tree-generation suite
        run: python3 scripts/ci/tests/test_capture_tuya_private_input_record_tree_generation.py
      - name: Existing cross-authority suite
        run: python3 scripts/ci/tests/test_capture_tuya_private_input_record_tree_cross_authority.py
      - name: Current signed field candidate source suite
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
      - name: Current intended-device suite
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
      - name: Current process-startup custody suite
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_process_startup_custody.py
      - name: Current Python custody source suite
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_python_custody_source.py
      - name: Current build-setting authority suite
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_build_setting_authority.py
      - name: Current descriptor subject custody suite
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_descriptor_subject_custody_source.py
      - name: Current signed artifact exact-subject suite
        run: python3 scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
      - name: Current Apple process custody suite
        run: python3 scripts/ci/tests/test_es80_signed_field_artifact_apple_process_custody.py
      - name: Current Apple tool custody source suite
        run: python3 scripts/ci/tests/test_es80_signed_field_artifact_apple_tool_custody_source.py
      - name: Current field authorization atomic publication suite
        run: python3 scripts/ci/tests/test_es80_field_authorization_atomic_publication.py
      - name: Current field authorization signer custody suite
        run: python3 scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py
      - name: Current TODAY research field candidate suite
        run: python3 scripts/ci/tests/test_xcode27_today_research_field_candidate.py

      - name: Prove final tree scope and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='b615375e12e43abc55e111deb5dc36f3790c7506'
          GUARD='Scripts/capture_tuya_private_input_build_guard.py'
          INSTALLER='scripts/field/install_one_time_capture.command'
          TEST1='scripts/ci/tests/test_capture_tuya_private_input_build_guard.py'
          TEST2='scripts/ci/tests/test_capture_field_installer_build_window_guard_source.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-capture-private-build-window-b615.yml tools/v14_capture_build_window_guard_materialize.py
          git add "$GUARD" "$INSTALLER" "$TEST1" "$TEST2"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --name-only "$BASE" -- "$GUARD" "$INSTALLER" "$TEST1" "$TEST2")
          test "${#EFFECTIVE[@]}" = '4'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$GUARD"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$INSTALLER"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST1"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST2"
          test -z "$(git diff --name-only "$BASE" | grep -E '^(.github/workflows/v14-capture-private-build-window-b615.yml|tools/v14_capture_build_window_guard_materialize.py)$' || true)"
          git commit -m 'fix(capture): guard private inputs through xcodebuild'
          git push origin HEAD:fix/v14-capture-private-build-window-b615-sol
