name: Apply Phase 9 lock safety

on:
  push:
    branches:
      - feature/landscape-dashboard

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/landscape-dashboard
          fetch-depth: 0

      - name: Apply safety patch
        run: python3 scripts/patch_phase9_lock_safety.py

      - name: Validate core safety behavior
        working-directory: Packages/NembraCore
        run: swift test

      - name: Validate patch anchors and Swift source
        run: |
          grep -q 'unknownSpeedRejectsLockButAllowsUnlock' Packages/NembraCore/Tests/NembraCoreTests/SimulatedScooterServiceTests.swift
          grep -q 'movementDuringLockAcknowledgementRejectsCommit' Packages/NembraCore/Tests/NembraCoreTests/SimulatedScooterServiceTests.swift
          grep -q 'SPEED UNAVAILABLE' NembraApp/Features/Dashboard/DashboardView.swift
          grep -q 'Speed unavailable' NembraApp/Features/Home/HomeView.swift

      - name: Commit validated safety patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-phase9-lock-safety.yml scripts/patch_phase9_lock_safety.py
          git add Packages/NembraCore/Sources/NembraCore/SimulatedScooterService.swift \
                  Packages/NembraCore/Tests/NembraCoreTests/SimulatedScooterServiceTests.swift \
                  NembraApp/Features/Home/HomeView.swift \
                  NembraApp/Features/Dashboard/DashboardView.swift
          git commit -m 'fix: require confirmed stationary speed before locking'
          git push origin HEAD:feature/landscape-dashboard
