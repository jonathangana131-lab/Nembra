name: Capture Darwin native private lease one-shot

on:
  push:
    branches:
      - repair/v17-capture-darwin-native-private-lease-gpt56sol-20260817
    paths:
      - .github/workflows/capture-darwin-native-private-lease-one-shot.yml
  pull_request:
    branches:
      - repair/v17-capture-seeded-acl-baseline-coherence-gpt56sol-20260817
    paths:
      - .github/workflows/capture-darwin-native-private-lease-one-shot.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact coherence parent
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          parent='e3cefd4c14db6f3de07ec3acfb241307ca1f8425'
          branch='repair/v17-capture-darwin-native-private-lease-gpt56sol-20260817'
          test "$EXPECTED_BRANCH" = "$branch"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          /usr/bin/git merge-base --is-ancestor "$parent" HEAD
          changed="$(/usr/bin/git diff --name-only "$parent"...HEAD)"
          test "$changed" = '.github/workflows/capture-darwin-native-private-lease-one-shot.yml'
          /usr/bin/git diff --check "$parent"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize Darwin-native lease selection
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          orchestrator = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py')
          replace_once(
              orchestrator,
              '        self._use_native_darwin_acl = bool(use_native_darwin_acl)\n',
              '''        # Current Darwin has mechanically rejected shell ACL mutation through\n        # /dev/fd/<n>. Native canonical-path grant + held-fd rollback is therefore\n        # the platform transport for every real macOS lease, not a strict-root option.\n        self._use_native_darwin_acl = (\n            sys.platform == "darwin" or bool(use_native_darwin_acl)\n        )\n''',
              'lease platform selection',
          )
          replace_once(
              orchestrator,
              '            use_native_darwin_acl=(accepted_root is not None),\n',
              '            use_native_darwin_acl=(sys.platform == "darwin"),\n',
              'orchestration native selection',
          )

          selected = Path('scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py')
          replace_once(
              selected,
              '            self.assertFalse(FakeLease.instances[0].use_native_darwin_acl)\n',
              '            self.assertTrue(FakeLease.instances[0].use_native_darwin_acl)\n',
              'selected-Xcode native contract',
          )

          real = Path('scripts/ci/tests/test_capture_private_build_uid_read_lease_current.py')
          replace_once(
              real,
              '''            lease = orchestrator._PrivateReadLease((build_root,), repo)\n            lease.grant(name)\n''',
              '''            lease = orchestrator._PrivateReadLease((build_root,), repo)\n            self.assertTrue(lease._use_native_darwin_acl)\n            lease.grant(name)\n''',
              'real macOS native lease assertion',
          )

      - name: Enforce exact permanent scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_build_uid_read_lease_current.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          grep -q 'sys.platform == "darwin" or bool(use_native_darwin_acl)' scripts/ci/capture_selected_xcode_build_orchestrator.py
          grep -q 'use_native_darwin_acl=(sys.platform == "darwin")' scripts/ci/capture_selected_xcode_build_orchestrator.py
          git diff --check

      - name: Run portable authority regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-private-read-lease-pycache"
          /usr/bin/python3 -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_build_uid_read_lease_current.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_descriptor_transport.py

      - name: Prove real Darwin dedicated UID lease
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-private-read-lease-pycache"
          sudo -E /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_build_uid_read_lease_current.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Publish clean product ingredient
        shell: bash
        env:
          AUTHORING_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUTHORING_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm .github/workflows/capture-darwin-native-private-lease-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Capture: use native ACL lease on Darwin'
          materialized="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fetch origin "$AUTHORING_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$AUTHORING_HEAD_SHA"
          git push origin HEAD:"$AUTHORING_BRANCH"
          echo "NEMBRA_DARWIN_NATIVE_PRIVATE_LEASE exactHead=$materialized realMacOS=true shellDevFdAuthority=false physicalAuthorityCreated=false"
