name: Materialize Capture Current Foreground Integrity

on:
  push:
    branches:
      - fix/v14-capture-current-truth-two-red-870-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-current-truth-two-red-870-sol
          fetch-depth: 0

      - name: Guard exact clean two-fix predecessor
        shell: bash
        run: |
          set -euo pipefail
          predecessor='4efa0a68b5a3e542b44f569b92a50f729a3e9955'
          git merge-base --is-ancestor "$predecessor" HEAD
          git diff --quiet "$predecessor" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift

      - name: Apply foreground-integrity closure
        run: python3 scripts/ci/materialize_capture_foreground_integrity_current.py apply

      - name: Verify bounded closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_foreground_integrity_current.py verify
          python3 -m py_compile scripts/ci/materialize_capture_foreground_integrity_current.py
          git diff --check

      - name: Publish clean current truth candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-foreground-integrity-current-materialize.yml
          rm scripts/ci/materialize_capture_foreground_integrity_current.py
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-foreground-integrity-current-materialize.yml' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift' \
            'scripts/ci/materialize_capture_foreground_integrity_current.py' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): fail closed on foreground loss'
          git push origin HEAD:fix/v14-capture-current-truth-two-red-870-sol
