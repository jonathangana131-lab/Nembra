name: Capture Experiment One strict post-admission ordering

on:
  push:
    branches:
      - feature/capture-exp1-recoverable-admission-current-v14

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/capture-exp1-recoverable-admission-current-v14
          fetch-depth: 0
      - name: Fail closed when monotonic receipt equals admission issuance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift')
          controller = controller_path.read_text()
          old = 'latestAdvertisement.receivedAtUptimeNanoseconds >= preview.issuedAtUptimeNanoseconds'
          new = 'latestAdvertisement.receivedAtUptimeNanoseconds > preview.issuedAtUptimeNanoseconds'
          assert controller.count(old) == 1
          controller = controller.replace(old, new, 1)
          controller = controller.replace(
              'The sealed admission must be joined to a controller observation received after\n            // that handoff.',
              'The sealed admission must be joined to a controller observation received strictly after\n            // that handoff. Equality does not prove ordering when two monotonic reads share one tick.',
              1
          )
          controller_path.write_text(controller)

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneRecoverableRediscoveryTests.swift')
          tests = test_path.read_text()
          old = 'let freshness = try #require(method.range(of: "receivedAtUptimeNanoseconds >="))'
          new = 'let freshness = try #require(method.range(of: "receivedAtUptimeNanoseconds > preview.issuedAtUptimeNanoseconds"))'
          assert tests.count(old) == 1
          tests = tests.replace(old, new, 1)
          marker = '''        #expect(freshness.lowerBound < consume.lowerBound)\n\n        // Consumption remains the irreversible ownership handoff'''
          replacement = '''        #expect(freshness.lowerBound < consume.lowerBound)\n        #expect(!method.contains("receivedAtUptimeNanoseconds >= preview.issuedAtUptimeNanoseconds"))\n\n        // Equality is intentionally recoverable/fail-closed: sharing one monotonic clock tick\n        // with issuance cannot prove that the callback receipt happened afterward.\n\n        // Consumption remains the irreversible ownership handoff'''
          assert marker in tests
          test_path.write_text(tests.replace(marker, replacement, 1))
          PY
          git diff --check
          grep -F 'receivedAtUptimeNanoseconds > preview.issuedAtUptimeNanoseconds' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          rm .github/workflows/capture-exp1-strict-order-current-v14.yml
      - name: Commit strict current-spine product
        shell: bash
        run: |
          git config user.name "nembra-go-worker"
          git config user.email "nembra-go-worker@users.noreply.github.com"
          git add -A
          git commit -m "[Capture Experiment One] Require strict post-admission receipt order"
          git push origin HEAD:feature/capture-exp1-recoverable-admission-current-v14
