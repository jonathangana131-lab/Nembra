name: Patch Ready post-recorder foreground integrity

on:
  push:
    branches:
      - cell/capture-ready-post-recorder-foreground-repair/gpt56-thinking

permissions:
  contents: write

jobs:
  patch-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify exact parent and apply narrow repair
        env:
          EXPECTED_PARENT: 4f959a29b9902e76da68e9a8c17959a5f7796ecc
          WORKFLOW_PATH: .github/workflows/patch-capture-ready-post-recorder-foreground-gpt56-thinking.yml
          CONTROLLER: Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          TEST_PATH: Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerReadyPostRecorderForegroundIntegrityTests.swift
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_PATH"

          python3 - <<'PY'
          from pathlib import Path
          controller = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          source = controller.read_text()
          old = """                    case let .recorded(recordedReady):\n                        do {\n                            // This typed queue commit is intentionally the immediate\n"""
          new = """                    case let .recorded(recordedReady):\n                        do {\n                            try self.requireForegroundEvidenceIntegrity()\n                            // This typed queue commit is intentionally the immediate\n"""
          if source.count(old) != 1:
              raise SystemExit(f"expected one Ready recorded commit site, found {source.count(old)}")
          controller.write_text(source.replace(old, new, 1))

          test = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerReadyPostRecorderForegroundIntegrityTests.swift")
          test.write_text('''import Foundation
          import Testing

          @Suite("Foreground CoreBluetooth Ready post-recorder foreground integrity")
          struct ForegroundCoreBluetoothCaptureControllerReadyPostRecorderForegroundIntegrityTests {
              private static func controllerSource() throws -> String {
                  let testFile = URL(fileURLWithPath: #filePath)
                  let packageRoot = testFile
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(
                      contentsOf: packageRoot
                          .appendingPathComponent("Sources")
                          .appendingPathComponent("NembraBluetoothCapture")
                          .appendingPathComponent("ForegroundCoreBluetoothCaptureController.swift"),
                      encoding: .utf8
                  )
              }

              @Test("foreground loss during Ready recorder actor hop is rechecked before typed queue commit")
              func recordedReadyCannotCommitAfterForegroundLoss() throws {
                  let source = try Self.controllerSource()
                  let readyFunction = try #require(source.range(of: "private func beginFiniteAcquisitionReadyBoundaryIfNeeded()"))
                  let recorderReturn = try #require(source.range(
                      of: "let outcome = try await admission.recordBoundaryWithMutationOutcome(on: recorder)",
                      range: readyFunction.lowerBound..<source.endIndex
                  ))
                  let queueCommit = try #require(source.range(
                      of: "recordedReady.markBoundaryRecorded(",
                      range: recorderReturn.upperBound..<source.endIndex
                  ))
                  let section = source[recorderReturn.upperBound..<queueCommit.lowerBound]
                  #expect(section.contains("requireForegroundEvidenceIntegrity()"))
              }

              @Test("post-recorder Ready failure quarantines exact durable Ready without suppressing recovery failure")
              func recordedReadyPostRecorderFailureUsesExplicitRecoveryPrecedence() throws {
                  let source = try Self.controllerSource()
                  let readyFunction = try #require(source.range(of: "private func beginFiniteAcquisitionReadyBoundaryIfNeeded()"))
                  let recorderReturn = try #require(source.range(
                      of: "let outcome = try await admission.recordBoundaryWithMutationOutcome(on: recorder)",
                      range: readyFunction.lowerBound..<source.endIndex
                  ))
                  let functionEnd = try #require(source.range(
                      of: "    private func requireForegroundEvidenceIntegrity() throws",
                      range: recorderReturn.upperBound..<source.endIndex
                  ))
                  let section = source[recorderReturn.upperBound..<functionEnd.lowerBound]
                  #expect(section.contains("abortRecordedReadyBeforeGateCommit"))
                  #expect(!section.contains("try? self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit"))
              }
          }
          ''')
          PY

          git diff --check
          git rm "$WORKFLOW_PATH"
          git add "$CONTROLLER" "$TEST_PATH"
          git diff --cached --check
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git commit -m '[Capture] recheck Ready foreground after recorder actor hop'
          git push origin HEAD:cell/capture-ready-post-recorder-foreground-repair/gpt56-thinking
