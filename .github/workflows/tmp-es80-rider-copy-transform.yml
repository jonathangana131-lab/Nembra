name: Temporary ES80 rider-copy transform

on:
  push:
    branches:
      - agent/es80-v14-human-first-rider-copy

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed rider-language closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin worker/GPT56-NEMBRA-V14-RIDERLANG/capture-rider-language-qa/e1 --depth=1
          git show FETCH_HEAD:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift")
          test_source = test_path.read_text(encoding="utf-8")
          old_boundary = 'let beginning = try #require(source.range(of: "private var passiveSafetyPanel"))'
          new_boundary = 'let beginning = try #require(source.range(of: "private func hero(for phase: Phase)"))'
          if test_source.count(old_boundary) != 1:
              raise SystemExit("expected-red rider-language test boundary changed unexpectedly")
          test_path.write_text(test_source.replace(old_boundary, new_boundary), encoding="utf-8")

          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          source = path.read_text(encoding="utf-8")
          replacements = {
              'Text("One sealed evidence life")': 'Text("One continuous capture")',
              'Text("Nembra carries the same package-owned Experiment One authority from repeated Bluetooth correlation into passive capture and immutable Horizon sealing. It performs no application characteristic-value writes and never turns a display name, RSSI, or service hint into target authority.")': 'Text("Nembra keeps one continuous Capture run from the four OFF / ON checks through passive observation and sealing. It never sends scooter commands, and it will not identify the scooter from its name, signal strength, or service hints alone.")',
              'message: "The package-owned physical execution gate is closed. No OFF / ON window, connection, capture, or seal action can advance through this coordinator.",': 'message: "This build is locked for field capture. OFF / ON checks, connection, observation, and sealing stay unavailable until this exact build is approved.",',
              'message: "Nembra is waiting for this exact window to report Bluetooth powered-on and active scanning. The producer\'s evidence clock has not started yet.",': 'message: "Nembra is opening a fresh Bluetooth observation window. Timing begins only after Bluetooth scanning is actually active.",',
              '.accessibilityHint("The package producer, not this timer, decides whether the window has enough evidence.")': '.accessibilityHint("Nembra, not this display timer, decides when enough observation has been recorded.")',
              'guidanceFootnote("This countdown is display guidance only. The package producer accepts the window only from its own monotonic receipt boundary; tapping early cannot create evidence.")': 'guidanceFootnote("This countdown is guidance only. Completing early cannot create or shorten the required observation.")',
              'message: "No selectable full Bluetooth identifier was absent in both OFF windows and repeated in both ON windows. Nembra will not guess from name, signal strength, service hints, or short IDs.",': 'message: "No Bluetooth signal was consistently absent in both OFF windows and present in both ON windows. Nembra will not guess from name, signal strength, services, or short IDs.",',
              'message: "More than one selectable full Bluetooth identifier repeated the OFF / ON pattern. Nembra refuses to break the tie with display name, RSSI, services, or a short identifier.",': 'message: "More than one Bluetooth signal followed the same OFF / ON pattern. Nembra will not guess between them from name, signal strength, services, or short IDs.",',
              'message: "One full CoreBluetooth identifier was selectable in both ON windows and absent from both OFF catalogs under this exact package-owned observation series. Treat it only as a correlated Bluetooth target.",': 'message: "One Bluetooth signal matched both OFF / ON cycles in this run. It is a repeatable target for this capture, not proof of the scooter\'s permanent identity.",',
              'message: "A fresh post-admission scan is looking for the exact full identifier that passed both OFF / ON cycles. Keep the scooter in the ON state from the final window.",': 'message: "Nembra is looking again for the signal that matched both OFF / ON cycles. Keep the scooter ON as it was in the final window.",',
              'message: "The same full CoreBluetooth identifier reappeared in the fresh scan epoch created after the sealed admission. This remains local correlation evidence, not permanent hardware authentication.",': 'message: "The same signal was seen again in a fresh scan. It is ready for passive observation, but this still does not prove permanent scooter identity.",',
              'message: "Nembra is connecting only to the package-owned correlated target. No application characteristic-value writes are permitted by this workflow.",': 'message: "Nembra is opening a read-only connection to the matched signal. This Capture flow does not send scooter commands.",',
              'eyebrow: "PASSIVE ACQUISITION",': 'eyebrow: "PASSIVE DISCOVERY",',
              'title: "Learning the readable surface",': 'title: "Preparing observation",',
              'message: "Nembra is passively discovering services, characteristics, descriptors, reads, and notifications for the exact run-owned target session. Ready is not shown until finite acquisition is mechanically complete.",': 'message: "Nembra is checking the read-only Bluetooth information available in this run. Observation begins only after discovery is complete.",',
              'title: remaining == 0 ? "Waiting for accepted Horizon authority" : "Hold observation — \\(remaining)s",': 'title: remaining == 0 ? "Observation time complete" : "Hold observation — \\(remaining)s",',
              'message: "Finite acquisition is Ready. Keep Nembra foregrounded and the scooter stationary while the accepted monotonic observation interval matures. The displayed timer is guidance only.",': 'message: "Discovery is complete. Keep Nembra foregrounded and the scooter stationary until the required observation time is accepted. The displayed timer is guidance only.",',
              '? "Display guidance complete; waiting for accepted Horizon authority"': '? "Display guidance complete; waiting for the seal to become available"',
              ': "Unavailable; waiting for accepted Horizon authority"': ': "Unavailable; waiting for the required observation"',
              '.accessibilityHint("Available only after the package accepts the required monotonic observation duration.")': '.accessibilityHint("Available only after the required observation duration is accepted.")',
              'eyebrow: "HORIZON READY",': 'eyebrow: "READY TO SEAL",',
              'message: "The package-owned Ready epoch and required monotonic observation duration are both accepted. Finishing now requests one immutable Horizon from this same authority life.",': 'message: "The required observation is complete. Seal Capture now to freeze this run\'s accepted evidence.",',
              'title: "Freezing immutable evidence",': 'title: "Finishing the capture",',
              'message: "Nembra is draining the accepted cutoff, committing Horizon, checking final authority, and materializing the immutable JSON artifact. Do not leave the app while this finishes.",': 'message: "Nembra is finishing the accepted event cutoff, verifying the sealed evidence, and preparing the final Capture artifact. Keep the app open until this finishes.",',
              'title: "Evidence failed closed",': 'title: "Capture stopped safely",',
              'Text("Nembra is recording the bounded CoreBluetooth advertisement catalog for this exact window. Keep the phone nearby and the app foregrounded; do not open the stock scooter app during this series.")': 'Text("Nembra is recording Bluetooth activity for this window. Keep the phone nearby and the app foregrounded; do not open the stock scooter app during this series.")',
              'healthItem("FINITE", value: observationReady ? "READY" : "WAIT")': 'healthItem("DISCOVERY", value: observationReady ? "READY" : "WAIT")',
              'healthItem("HORIZON", value: horizonReady ? "READY" : "HOLD")': 'healthItem("SEAL", value: horizonReady ? "READY" : "HOLD")',
              '"Capture health. Target \\(connection == .connected ? "bound" : "waiting"). Finite acquisition \\(observationReady ? "ready" : "waiting"). Horizon \\(horizonReady ? "ready" : "waiting")."': '"Capture health. Target \\(connection == .connected ? "bound" : "waiting"). Discovery \\(observationReady ? "ready" : "waiting"). Seal \\(horizonReady ? "ready" : "waiting")."',
              'Text("The exact \\(report.finalShareByteCount.formatted())-byte final Share artifact passed the package-owned outer, SoftwareExport, and immutable Capture integrity checks. No protocol field meaning is claimed yet.")': 'Text("The exact \\(report.finalShareByteCount.formatted())-byte final Share artifact passed all required Capture integrity checks. No protocol field meaning is claimed yet.")',
              'Text("\\(artifact.captureJSON.count.formatted()) immutable capture bytes are sealed from this Experiment One authority. Analysis readiness is not earned until the package verifies the exact final Share bytes and their nested evidence.")': 'Text("\\(artifact.captureJSON.count.formatted()) capture bytes are sealed from this Experiment One run. Analysis readiness is not earned until Nembra verifies the exact final Share bytes and nested capture evidence.")',
              'return .failed("Nembra left the active foreground after Experiment One began. This evidence life cannot regain capture authority; start a fresh Experiment One.")': 'return .failed("Nembra left the foreground after Experiment One began. This capture cannot safely continue; start a fresh Experiment One.")',
              'return .failed(coordinator.lastDiagnostic ?? "The passive target connection ended before an accepted observation could be sealed. Start a fresh Experiment One rather than replaying consumed authority.")': 'return .failed(coordinator.lastDiagnostic ?? "The passive connection ended before observation could be sealed. Start a fresh Experiment One.")',
              'return .bluetoothUnavailable("The package-owned CoreBluetooth controller is unavailable for this coordinator.")': 'return .bluetoothUnavailable("Bluetooth capture is unavailable in this build.")',
              'return .correlationFailed("The four windows did not preserve one valid package-issued observation authority and required OFF 1, ON 1, OFF 2, ON 2 ordering.")': 'return .correlationFailed("The four windows did not preserve the required OFF 1, ON 1, OFF 2, ON 2 pattern. Start again from OFF 1.")',
              'return .correlationFailed("The package-owned Experiment One workflow has no active correlation progress and no final result.")': 'return .correlationFailed("Experiment One has no active OFF / ON progress. Start a fresh run.")',
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match for {old!r}, found {count}")
              source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")

          beginning = source.index("private func hero(for phase: Phase)")
          details = source.index("private var captureDetailsSheet", beginning)
          rider = source[beginning:details]
          forbidden = [
              "One sealed evidence life",
              "package-owned Experiment One authority",
              "package-owned physical execution gate",
              "producer's evidence clock",
              "producer accepts the window only from its own monotonic receipt boundary",
              "full CoreBluetooth identifier",
              "post-admission scan",
              "fresh scan epoch created after the sealed admission",
              "package-owned correlated target",
              "finite acquisition",
              "accepted Horizon authority",
              "accepted monotonic observation interval",
              "package-owned Ready epoch",
              "committing Horizon",
              "immutable JSON artifact",
              "Evidence failed closed",
              "bounded CoreBluetooth advertisement catalog",
              "package-owned outer, SoftwareExport, and immutable Capture integrity checks",
          ]
          leaked = [phrase for phrase in forbidden if phrase in rider]
          if leaked:
              raise SystemExit(f"engineering phrases remain in rider surface: {leaked!r}")
          for required in ("PASSIVE / READ ONLY", "Scooter OFF", "Scooter ON", "Share Capture", "View Details"):
              if required not in rider:
                  raise SystemExit(f"required rider copy disappeared: {required}")
          details_source = source[details:]
          for required in ("Truth boundary", "CoreBluetooth", "Software Export SHA-256", "Runtime executable SHA-256", "does not authenticate the physical ES80"):
              if required not in details_source:
                  raise SystemExit(f"required engineering truth disappeared from Details: {required}")
          PY
          git diff --check
          git status --short
          git config user.name "nembra-go-worker"
          git config user.email "nembra-go-worker@users.noreply.github.com"
          git add NembraApp/Features/Research/ES80CaptureShellView.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift
          git rm .github/workflows/tmp-es80-rider-copy-transform.yml
          git commit -m "Capture: make primary field flow human-first"
          git push origin HEAD:agent/es80-v14-human-first-rider-copy
