name: Materialize Capture Event Custody Race ba3a

on:
  push:
    branches:
      - sol/v14-capture-event-custody-race-ba3a
    paths:
      - .nembra/materialize-capture-event-custody-race-ba3a.trigger

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-event-custody-race-ba3a
          fetch-depth: 0

      - name: Guard exact live-product ancestry and source blob
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ba3a1eeae36caca6dd84beaabd0f15f4f0b57925 HEAD
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "d3075d4fe7bc96ff11079d9f54982ca4c8d90746"

      - name: Materialize admission-custody race closure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_capture_event_custody_race_ba3a.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyAdmissionRaceSourceTests.swift
          git diff --check

      - name: Remove scaffolding and verify effective scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/materialize_capture_event_custody_race_ba3a.py
          rm -f .github/workflows/materialize-capture-event-custody-race-ba3a.yml
          rm -f .nembra/materialize-capture-event-custody-race-ba3a.trigger
          git diff --check
          mapfile -t paths < <(git diff --name-only ba3a1eeae36caca6dd84beaabd0f15f4f0b57925 -- | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = "NembraApp/App/NembraCaptureEntrypoint.swift"
          test "${paths[1]}" = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyAdmissionRaceSourceTests.swift"

      - name: Publish clean repair checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): bind event custody to admission lease"
          git push origin HEAD:sol/v14-capture-event-custody-race-ba3a
