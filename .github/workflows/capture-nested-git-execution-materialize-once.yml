name: Capture nested accepted-Git execution materializer

on:
  push:
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - .github/workflows/capture-nested-git-execution-materialize-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: product/capture-1-0-main-20260818
      AUTHORING_WORKFLOW: .github/workflows/capture-nested-git-execution-materialize-once.yml
      PATCHER: .github/capture-nested-git-execution-patcher.py
      INSTALLER: scripts/field/install_one_time_capture.command
      EXPECTED_INSTALLER_BLOB: a42d9e9b93d9692ec61fbd714d5664d0a0afba67
      EXPECTED_PATCHER_BLOB: 555bdb4fb7bd26d47bbc6ee087b9d10723092d49
    steps:
      - uses: actions/checkout@v6
        with:
          ref: product/capture-1-0-main-20260818
          fetch-depth: 0
          persist-credentials: true

      - name: Bind bounded authoring subjects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD:"$INSTALLER")" = "$EXPECTED_INSTALLER_BLOB"
          test "$(git rev-parse HEAD:"$PATCHER")" = "$EXPECTED_PATCHER_BLOB"
          test -n "$(git rev-parse HEAD:"$AUTHORING_WORKFLOW")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize one authenticated capture primitive for nested repo tools
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 "$PATCHER"

      - name: Enforce execution-custody and NO-GO contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          /bin/bash -n "$INSTALLER"
          /usr/bin/python3 scripts/ci/tests/test_capture_field_nested_execution_subject_closure.py
          grep -Fq 'PREINSTALL_RETAINED_SUBJECTS_BOUND_NOT_INSTALL_AUTHORITY' "$INSTALLER"
          grep -Fq 'Installation remains blocked:' "$INSTALLER"
          test "$(grep -Fc '$(capture_accepted_git_source_base64' "$INSTALLER")" = 3
          test "$(grep -Fc 'xcrun devicectl' "$INSTALLER")" = 0
          test "$(grep -Fc 'device install app' "$INSTALLER")" = 0
          test "$(grep -Fc 'device process launch' "$INSTALLER")" = 0

      - name: Publish tested installer and retire authoring files
        shell: bash
        run: |
          set -euo pipefail
          authoring_head="$(git rev-parse HEAD)"
          workflow_blob="$(git rev-parse HEAD:"$AUTHORING_WORKFLOW")"
          patched_installer="$(mktemp)"
          cp "$INSTALLER" "$patched_installer"

          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse FETCH_HEAD)"
          test "$(git rev-parse FETCH_HEAD:"$INSTALLER")" = "$EXPECTED_INSTALLER_BLOB"
          test "$(git rev-parse FETCH_HEAD:"$PATCHER")" = "$EXPECTED_PATCHER_BLOB"
          test "$(git rev-parse FETCH_HEAD:"$AUTHORING_WORKFLOW")" = "$workflow_blob"

          git reset --hard FETCH_HEAD
          cp "$patched_installer" "$INSTALLER"
          rm -f "$patched_installer" "$PATCHER" "$AUTHORING_WORKFLOW"
          git add -- "$INSTALLER" "$PATCHER" "$AUTHORING_WORKFLOW"
          permanent="$(git diff --cached --name-only | sort)"
          test "$permanent" = "$INSTALLER"
          git diff --check --cached

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): capture nested field tools from accepted Git bytes'
          materialized="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$remote_head" origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CAPTURE_NESTED_EXECUTION_CUSTODY materialized=%s absorbed=%s authoring=%s physicalAuthorityCreated=false\n' "$materialized" "$remote_head" "$authoring_head"
