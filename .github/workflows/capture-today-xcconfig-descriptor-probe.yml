name: Capture TODAY Xcconfig Descriptor Probe

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/capture-today-xcconfig-descriptor-probe.yml

permissions:
  contents: read

jobs:
  retirement-sentinel:
    name: Retire deferred descriptor probe without Mac
    runs-on: ubuntu-latest
    concurrency:
      group: nembra-capture-today-xcconfig-fd-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Preserve V14 P0 runner priority
        run: |
          echo 'Descriptor-custody validation is deferred until post-capture hardening.'
          echo 'This sentinel exists only to retire the older queued xcode-27 probe in the same PR concurrency group.'
          echo 'No product, signing, Capture, BLE, or physical authority is accepted by this run.'
