name: V14 refresh terminal handoff ready authority

on:
  push:
    branches:
      - integration/es80-v14-terminal-controller-fresh-handoff/gpt56-go

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge exact current flagship head
        run: |
          set -euo pipefail
          git config user.name nembra-v14-gpt56
          git config user.email actions@users.noreply.github.com
          git merge --no-edit 4f959a29b9902e76da68e9a8c17959a5f7796ecc
          rm .github/workflows/v14-refresh-terminal-handoff-ready-authority.yml
          git add -A
          git commit --amend --no-edit
          git diff --check
          git push origin HEAD:integration/es80-v14-terminal-controller-fresh-handoff/gpt56-go
