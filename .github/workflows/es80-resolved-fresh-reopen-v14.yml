name: ES80 resolved fresh reopen v14

on:
  push:
    branches:
      - parallel/es80-resolved-fresh-reopen-v14/chat-gpt56
    paths:
      - .github/workflows/es80-resolved-fresh-reopen-v14.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-resolved-fresh-reopen-v14/chat-gpt56
          fetch-depth: 0

      - name: Add resolution-gated exact fresh-session reopen
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift')
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              '        case horizonArtifactNotReady\n',
              '        case horizonArtifactNotReady\n'
              '        case freshTargetSessionRequired\n'
              '        case resolvedQueueTailChanged(expected: UInt64, actual: UInt64)\n',
              'errors',
          )

          replace_once(
              '    private var committedReadyTransaction: Transaction?\n',
              '    private var committedReadyTransaction: Transaction?\n'
              '    // Recovery binds exactly one already-created fresh durable target session.\n'
              '    // Normal reset cannot erase this admission requirement.\n'
              '    private var requiredReadyTargetSessionGeneration: UInt64?\n',
              'fresh-session state',
          )

          replace_once(
              '        guard processedQueueSequence == nil else {\n'
              '            throw StateError.invalidTransition\n'
              '        }\n'
              '        guard nextRevision != UInt64.max else {\n',
              '        guard processedQueueSequence == nil else {\n'
              '            throw StateError.invalidTransition\n'
              '        }\n'
              '        if let requiredReadyTargetSessionGeneration {\n'
              '            guard authority.targetSessionGeneration == requiredReadyTargetSessionGeneration else {\n'
              '                throw StateError.freshTargetSessionRequired\n'
              '            }\n'
              '        }\n'
              '        guard nextRevision != UInt64.max else {\n',
              'Ready generation admission',
          )

          replace_once(
              '        phase = .drainingReady(transaction)\n'
              '        nextRevision += 1\n',
              '        requiredReadyTargetSessionGeneration = nil\n'
              '        phase = .drainingReady(transaction)\n'
              '        nextRevision += 1\n',
              'Ready binding consumption',
          )

          bottom = source.find('    /// Abort quarantine is intentionally irreversible in this slice.')
          if bottom < 0:
              raise SystemExit('recovery-tail anchor missing')
          if not source.rstrip().endswith('}'):
              raise SystemExit('gate source does not end with struct close')

          replacement = '''    /// Reopens an abandoned Ready/Horizon lifecycle only after the separate
              /// retirement producer has been converted into explicit globally-resolved FIFO
              /// authority. Retired positions remain resolved-by-retirement, never recorder writes.
              /// A callback accepted after resolution invalidates the receipt before mutation.
              ///
              /// The controller must create the fresh durable recorder/target session first, then
              /// resolve and consume this receipt synchronously on MainActor with no intervening await.
              mutating func reopenAfterAbortedQueueResolution(
                  _ resolution: PassiveCoreBluetoothAbortedQueueResolution.Receipt,
                  currentLastEnqueuedEventSequence: UInt64,
                  freshTargetSessionGeneration: UInt64
              ) throws {
                  guard case let .abortQuarantined(currentAbort) = phase else {
                      throw StateError.invalidTransition
                  }
                  guard resolution.abortReceipt == currentAbort else {
                      throw StateError.staleTransaction
                  }
                  guard resolution.resolvedThroughQueueSequence == currentLastEnqueuedEventSequence else {
                      throw StateError.resolvedQueueTailChanged(
                          expected: resolution.resolvedThroughQueueSequence,
                          actual: currentLastEnqueuedEventSequence
                      )
                  }
                  guard freshTargetSessionGeneration > currentAbort.abandonedTargetSessionGeneration else {
                      throw StateError.freshTargetSessionRequired
                  }

                  committedReadyTransaction = nil
                  requiredReadyTargetSessionGeneration = freshTargetSessionGeneration
                  phase = .awaitingReady
              }

              /// Reopens after a successful terminal Horizon only from producer-issued terminal
              /// resolution proof for the exact sealed transaction and an unchanged global tail.
              /// The next Ready is bound to one exact strictly newer durable target session.
              mutating func reopenAfterTerminalQueueResolution(
                  _ resolution: PassiveCoreBluetoothTerminalQueueResolution.Receipt,
                  currentLastEnqueuedEventSequence: UInt64,
                  freshTargetSessionGeneration: UInt64
              ) throws {
                  guard case let .terminal(transaction) = phase else {
                      throw StateError.invalidTransition
                  }
                  guard resolution.terminalTransactionRevision == transaction.revision,
                        resolution.horizonQueueCutoff == transaction.queueCutoff,
                        resolution.previouslyResolvedThroughQueueSequence == transaction.queueCutoff else {
                      throw StateError.staleTransaction
                  }
                  guard resolution.terminalAuthority == transaction.authority else {
                      throw StateError.authorityChanged
                  }
                  guard resolution.resolvedThroughQueueSequence == currentLastEnqueuedEventSequence else {
                      throw StateError.resolvedQueueTailChanged(
                          expected: resolution.resolvedThroughQueueSequence,
                          actual: currentLastEnqueuedEventSequence
                      )
                  }
                  guard freshTargetSessionGeneration > transaction.authority.targetSessionGeneration else {
                      throw StateError.freshTargetSessionRequired
                  }

                  committedReadyTransaction = nil
                  requiredReadyTargetSessionGeneration = freshTargetSessionGeneration
                  phase = .awaitingReady
              }

              /// Reset is intentionally weak: it can only act while already awaiting Ready and
              /// cannot erase an exact fresh-session binding installed by either recovery path.
              @discardableResult
              mutating func resetForNewCaptureSession() -> Bool {
                  guard phase == .awaitingReady else { return false }
                  committedReadyTransaction = nil
                  return true
              }
          }
          '''
          source = source[:bottom] + replacement
          path.write_text(source)
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateResolvedFreshReopenTests.swift <<'SWIFT'
          import Foundation
          import NembraCore
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Passive CoreBluetooth resolution-gated fresh-session reopen")
          struct PassiveCoreBluetoothObservationBoundaryQueueGateResolvedFreshReopenTests {
              private typealias Gate = PassiveCoreBluetoothObservationBoundaryQueueGate

              private struct Event: Equatable {
                  let queueSequence: UInt64
                  let authority: PassiveCoreBluetoothArtifactAuthorityContext
              }

              private let authority = PassiveCoreBluetoothArtifactAuthorityContext(
                  targetSessionGeneration: 7,
                  authorityGeneration: 11
              )

              private let es80 = VehicleIdentity(
                  manufacturer: "AOVOPRO",
                  model: "ES80",
                  displayName: "AOVOPRO ES80",
                  protocolFamily: "Tuya / AOVOPRO (hardware validation pending)"
              )

              @Test("aborted lifecycle consumes resolved FIFO proof and binds exactly one fresh session")
              @MainActor
              func abortedResolutionBindsExactFreshSession() async throws {
                  var gate = Gate()
                  let epoch = try await committedReady(gate: &gate)
                  _ = try gate.abortObservationEpoch(epoch)

                  var pending = [Event(queueSequence: 3, authority: authority)]
                  let retirement = try PassiveCoreBluetoothAbortedObservationQueueRetirement.retire(
                      from: &pending,
                      currentLastEnqueuedEventSequence: 3,
                      currentSettledQueueSequence: 2,
                      drainIsIdle: true,
                      abortedGate: gate,
                      identity: { .init(queueSequence: $0.queueSequence, authority: $0.authority) }
                  )
                  let resolution = try PassiveCoreBluetoothAbortedQueueResolution.resolve(
                      currentResolvedThroughQueueSequence: 2,
                      currentLastEnqueuedEventSequence: 3,
                      retirementReceipt: retirement,
                      abortedGate: gate
                  )
                  #expect(pending.isEmpty)

                  try gate.reopenAfterAbortedQueueResolution(
                      resolution,
                      currentLastEnqueuedEventSequence: 3,
                      freshTargetSessionGeneration: 8
                  )
                  #expect(gate.phase == .awaitingReady)
                  #expect(gate.resetForNewCaptureSession())

                  #expect(throws: Gate.StateError.freshTargetSessionRequired) {
                      _ = try gate.begin(
                          .finiteAcquisitionReady,
                          through: 3,
                          authority: .init(targetSessionGeneration: 7, authorityGeneration: 99)
                      )
                  }
                  #expect(throws: Gate.StateError.freshTargetSessionRequired) {
                      _ = try gate.begin(
                          .finiteAcquisitionReady,
                          through: 3,
                          authority: .init(targetSessionGeneration: 9, authorityGeneration: 1)
                      )
                  }
                  let next = try gate.begin(
                      .finiteAcquisitionReady,
                      through: 3,
                      authority: .init(targetSessionGeneration: 8, authorityGeneration: 1)
                  )
                  #expect(next.revision == 2)
              }

              @Test("aborted resolution becomes stale if a callback advances the global tail")
              @MainActor
              func abortedResolutionRejectsTailDrift() async throws {
                  var gate = Gate()
                  let epoch = try await committedReady(gate: &gate)
                  _ = try gate.abortObservationEpoch(epoch)
                  var pending = [Event(queueSequence: 3, authority: authority)]
                  let retirement = try PassiveCoreBluetoothAbortedObservationQueueRetirement.retire(
                      from: &pending,
                      currentLastEnqueuedEventSequence: 3,
                      currentSettledQueueSequence: 2,
                      drainIsIdle: true,
                      abortedGate: gate,
                      identity: { .init(queueSequence: $0.queueSequence, authority: $0.authority) }
                  )
                  let resolution = try PassiveCoreBluetoothAbortedQueueResolution.resolve(
                      currentResolvedThroughQueueSequence: 2,
                      currentLastEnqueuedEventSequence: 3,
                      retirementReceipt: retirement,
                      abortedGate: gate
                  )

                  #expect(throws: Gate.StateError.resolvedQueueTailChanged(expected: 3, actual: 4)) {
                      try gate.reopenAfterAbortedQueueResolution(
                          resolution,
                          currentLastEnqueuedEventSequence: 4,
                          freshTargetSessionGeneration: 8
                      )
                  }
                  #expect(gate.isAbortQuarantined)
              }

              @Test("terminal resolution binds exact fresh session and preserves monotonic gate revision")
              @MainActor
              func terminalResolutionBindsExactFreshSession() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12)
                  var gate = terminal.gate
                  var events = [
                      Event(queueSequence: 13, authority: authority),
                      Event(queueSequence: 14, authority: authority)
                  ]
                  let resolution = try terminalResolution(
                      events: &events,
                      currentTail: 14,
                      gate: gate
                  )
                  #expect(events.isEmpty)

                  try gate.reopenAfterTerminalQueueResolution(
                      resolution,
                      currentLastEnqueuedEventSequence: 14,
                      freshTargetSessionGeneration: 8
                  )
                  #expect(gate.phase == .awaitingReady)
                  #expect(gate.resetForNewCaptureSession())

                  #expect(throws: Gate.StateError.freshTargetSessionRequired) {
                      _ = try gate.begin(
                          .finiteAcquisitionReady,
                          through: 14,
                          authority: .init(targetSessionGeneration: 9, authorityGeneration: 1)
                      )
                  }
                  let next = try gate.begin(
                      .finiteAcquisitionReady,
                      through: 14,
                      authority: .init(targetSessionGeneration: 8, authorityGeneration: 1)
                  )
                  #expect(next.revision == terminal.horizon.revision + 1)
                  #expect(next.revision == 3)
              }

              @Test("terminal resolution rejects tail drift and nonfresh session atomically")
              @MainActor
              func terminalResolutionRejectsStaleOrNonfreshAdmission() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12)
                  var gate = terminal.gate
                  var events: [Event] = []
                  let resolution = try terminalResolution(events: &events, currentTail: 12, gate: gate)

                  #expect(throws: Gate.StateError.resolvedQueueTailChanged(expected: 12, actual: 13)) {
                      try gate.reopenAfterTerminalQueueResolution(
                          resolution,
                          currentLastEnqueuedEventSequence: 13,
                          freshTargetSessionGeneration: 8
                      )
                  }
                  #expect(gate.phase == .terminal(terminal.horizon))

                  #expect(throws: Gate.StateError.freshTargetSessionRequired) {
                      try gate.reopenAfterTerminalQueueResolution(
                          resolution,
                          currentLastEnqueuedEventSequence: 12,
                          freshTargetSessionGeneration: 7
                      )
                  }
                  #expect(gate.phase == .terminal(terminal.horizon))
              }

              @MainActor
              private func committedReady(
                  gate: inout Gate,
                  cutoff: UInt64 = 2
              ) async throws -> PassiveCoreBluetoothObservationBoundaryTransactionDecision.CommittedReadyEpoch {
                  let recorder = try PassiveCoreBluetoothCaptureRecorder(
                      vehicleIdentity: es80,
                      startedAt: Date(timeIntervalSince1970: 1)
                  )
                  let fence = PassiveCoreBluetoothArtifactAuthorityFence(authority: authority)
                  let admission = try PassiveCoreBluetoothObservationBoundaryTransactionDecision.beginReady(
                      queueCutoff: cutoff,
                      processedThrough: cutoff,
                      authorityFence: fence,
                      gate: &gate
                  )
                  let recorded = try await admission.recordBoundary(on: recorder)
                  return try recorded.markBoundaryRecorded(
                      on: &gate,
                      lastProcessedQueueSequence: cutoff
                  )
              }

              @MainActor
              private func terminalGate(
                  horizonQueueCutoff: UInt64
              ) throws -> (gate: Gate, horizon: Gate.Transaction) {
                  var gate = Gate()
                  let ready = try gate.begin(
                      .finiteAcquisitionReady,
                      through: 5,
                      authority: authority
                  )
                  try gate.markBoundaryRecorded(
                      ready,
                      lastProcessedQueueSequence: 5,
                      currentAuthority: authority
                  )
                  let horizon = try gate.beginObservationHorizon(
                      through: horizonQueueCutoff,
                      processedThrough: 8,
                      authority: authority,
                      establishedByReadyRevision: ready.revision,
                      establishedByReadyIdentity: ready.identity
                  )
                  try gate.markBoundaryRecorded(
                      horizon,
                      lastProcessedQueueSequence: horizonQueueCutoff,
                      currentAuthority: authority
                  )
                  try gate.completeHorizonArtifactFreeze(
                      horizon,
                      currentAuthority: authority
                  )
                  return (gate, horizon)
              }

              @MainActor
              private func terminalResolution(
                  events: inout [Event],
                  currentTail: UInt64,
                  gate: Gate
              ) throws -> PassiveCoreBluetoothTerminalQueueResolution.Receipt {
                  let retirement = try PassiveCoreBluetoothTerminalQueueRetirement.retire(
                      from: &events,
                      currentLastEnqueuedEventSequence: currentTail,
                      terminalGate: gate,
                      identity: { .init(queueSequence: $0.queueSequence, authority: $0.authority) }
                  )
                  return try PassiveCoreBluetoothTerminalQueueResolution.resolve(
                      currentResolvedThroughQueueSequence: retirement.horizonQueueCutoff,
                      currentLastEnqueuedEventSequence: currentTail,
                      retirementReceipt: retirement,
                      terminalGate: gate
                  )
              }
          }
          SWIFT

          python3 <<'PY'
          from pathlib import Path
          source = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift').read_text()
          assert 'private var requiredReadyTargetSessionGeneration: UInt64?' in source
          assert 'mutating func reopenAfterAbortedQueueResolution(' in source
          assert 'PassiveCoreBluetoothAbortedQueueResolution.Receipt' in source
          assert 'mutating func reopenAfterTerminalQueueResolution(' in source
          assert 'PassiveCoreBluetoothTerminalQueueResolution.Receipt' in source
          assert source.index('if let requiredReadyTargetSessionGeneration') < source.index('let transaction = Transaction(')
          tail = source[source.index('mutating func resetForNewCaptureSession()'):]
          assert 'requiredReadyTargetSessionGeneration = nil' not in tail
          PY

          git diff --check

      - name: Commit product checkpoint and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-chat-gpt56"
          git config user.email "nembra-chat-gpt56@users.noreply.github.com"
          rm .github/workflows/es80-resolved-fresh-reopen-v14.yml
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateResolvedFreshReopenTests.swift \
                  .github/workflows/es80-resolved-fresh-reopen-v14.yml
          git diff --cached --check
          git commit -m "feat: bind resolved Capture recovery to exact fresh session"
          git push origin HEAD:parallel/es80-resolved-fresh-reopen-v14/chat-gpt56
