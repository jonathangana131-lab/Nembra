name: Temp ES80 rider-language transform

on:
  push:
    branches:
      - integration/es80-v14-rider-language-current-gpt56-go

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Replace primary rider copy without touching engineering Details
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          text = path.read_text(encoding="utf-8")
          start = text.index("    private func hero(for phase: Phase)")
          end = text.index("    private var captureDetailsSheet", start)
          surface = text[start:end]

          replacements = {
              'Text("One sealed evidence life")': 'Text("One capture, start to finish")',
              'Text("Nembra carries the same package-owned Experiment One authority from repeated Bluetooth correlation into passive capture and immutable Horizon sealing. It performs no application characteristic-value writes and never turns a display name, RSSI, or service hint into target authority.")': 'Text("Nembra keeps one continuous capture from the OFF / ON signal check through passive observation and final sealing. It never sends scooter commands, and a name, signal strength, or Bluetooth hint alone can never identify the scooter.")',
              'message: "The package-owned physical execution gate is closed. No OFF / ON window, connection, capture, or seal action can advance through this coordinator."': 'message: "This build is locked for field capture. OFF / ON observation, connection, capture, and sealing stay unavailable until an accepted field build is installed."',
              'message: "Nembra is waiting for this exact window to report Bluetooth powered-on and active scanning. The producer\'s evidence clock has not started yet."': 'message: "Nembra is opening a fresh Bluetooth observation window. Timing begins only after Bluetooth is ready and scanning."',
              'guidanceFootnote("This countdown is display guidance only. The package producer accepts the window only from its own monotonic receipt boundary; tapping early cannot create evidence.")': 'guidanceFootnote("This countdown is guidance only. Nembra records the real observation timing separately; tapping early cannot create evidence.")',
              'message: "One full CoreBluetooth identifier was selectable in both ON windows and absent from both OFF catalogs under this exact package-owned observation series. Treat it only as a correlated Bluetooth target."': 'message: "One Bluetooth signal appeared in both ON windows and was absent from both OFF windows. Treat it only as a correlated Bluetooth target, not verified scooter identity."',
              'message: "A fresh post-admission scan is looking for the exact full identifier that passed both OFF / ON cycles. Keep the scooter in the ON state from the final window."': 'message: "Nembra is looking again for the same correlated Bluetooth signal. Keep the scooter ON from the final window."',
              'message: "The same full CoreBluetooth identifier reappeared in the fresh scan epoch created after the sealed admission. This remains local correlation evidence, not permanent hardware authentication."': 'message: "The same Bluetooth signal appeared again in a fresh scan after confirmation. This is still correlation evidence, not permanent scooter identity."',
              'message: "Nembra is connecting only to the package-owned correlated target. No application characteristic-value writes are permitted by this workflow."': 'message: "Nembra is connecting only to the correlated Bluetooth target. This Capture flow remains read only and sends no scooter commands."',
              'message: "Nembra is passively discovering services, characteristics, descriptors, reads, and notifications for the exact run-owned target session. Ready is not shown until finite acquisition is mechanically complete."': 'message: "Nembra is passively checking the Bluetooth data the scooter exposes. Ready appears only after that read-only setup finishes."',
              'title: remaining == 0 ? "Waiting for accepted Horizon authority" : "Hold observation — \\(remaining)s"': 'title: remaining == 0 ? "Observation complete — checking readiness" : "Hold observation — \\(remaining)s"',
              'message: "Finite acquisition is Ready. Keep Nembra foregrounded and the scooter stationary while the accepted monotonic observation interval matures. The displayed timer is guidance only."': 'message: "Passive observation is ready. Keep Nembra foregrounded and the scooter stationary until the required observation time is accepted. The displayed timer is guidance only."',
              '? "Display guidance complete; waiting for accepted Horizon authority"': '? "Display guidance complete; checking capture readiness"',
              '.accessibilityHint("Available only after the package accepts the required monotonic observation duration.")': '.accessibilityHint("Available only after Nembra accepts the required observation duration.")',
              'message: "The package-owned Ready epoch and required monotonic observation duration are both accepted. Finishing now requests one immutable Horizon from this same authority life."': 'message: "The required observation is complete and this capture can now be sealed. Finishing preserves this exact session as one final capture file."',
              'title: "Freezing immutable evidence"': 'title: "Sealing capture evidence"',
              'message: "Nembra is draining the accepted cutoff, committing Horizon, checking final authority, and materializing the immutable JSON artifact. Do not leave the app while this finishes."': 'message: "Nembra is finishing the accepted observation, checking integrity, and sealing the final capture file. Keep Nembra open until this finishes."',
              'title: "Evidence failed closed"': 'title: "Capture stopped safely"',
              'Text("Nembra is recording the bounded CoreBluetooth advertisement catalog for this exact window. Keep the phone nearby and the app foregrounded; do not open the stock scooter app during this series.")': 'Text("Nembra is recording the Bluetooth signals seen during this window. Keep the phone nearby and Nembra foregrounded; do not open the stock scooter app during this series.")',
              'Text("The exact \\(report.finalShareByteCount.formatted())-byte final Share artifact passed the package-owned outer, SoftwareExport, and immutable Capture integrity checks. No protocol field meaning is claimed yet.")': 'Text("The exact \\(report.finalShareByteCount.formatted())-byte Share Capture file passed all required integrity checks. No scooter data-field meaning is claimed yet.")',
              'Text("\\(artifact.captureJSON.count.formatted()) immutable capture bytes are sealed from this Experiment One authority. Analysis readiness is not earned until the package verifies the exact final Share bytes and their nested evidence.")': 'Text("\\(artifact.captureJSON.count.formatted()) capture bytes are sealed. Ready for analysis appears only after Nembra verifies the exact Share Capture file and its included evidence.")',
          }

          for old, new in replacements.items():
              count = surface.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one rider-copy match, got {count}: {old}")
              surface = surface.replace(old, new)

          horizon_phrase = "accepted Horizon authority"
          horizon_count = surface.count(horizon_phrase)
          if horizon_count != 1:
              raise SystemExit(f"expected one remaining Horizon phrase after structured replacements, got {horizon_count}")
          surface = surface.replace(horizon_phrase, "capture readiness")

          banned = [
              "One sealed evidence life",
              "package-owned Experiment One authority",
              "package-owned physical execution gate",
              "producer's evidence clock",
              "producer accepts the window only from its own monotonic receipt boundary",
              "full CoreBluetooth identifier",
              "post-admission scan",
              "fresh scan epoch created after the sealed admission",
              "package-owned correlated target",
              "finite acquisition",
              "accepted Horizon authority",
              "accepted monotonic observation interval",
              "package-owned Ready epoch",
              "committing Horizon",
              "immutable JSON artifact",
              "Evidence failed closed",
              "bounded CoreBluetooth advertisement catalog",
              "package-owned outer, SoftwareExport, and immutable Capture integrity checks",
          ]
          leftovers = [phrase for phrase in banned if phrase in surface]
          if leftovers:
              raise SystemExit(f"primary rider copy still exposes engineering phrases: {leftovers}")

          for required in ["PASSIVE / READ ONLY", "Scooter OFF", "Scooter ON", "Share Capture", "View Details"]:
              if required not in surface:
                  raise SystemExit(f"required rider-facing copy disappeared: {required}")

          text = text[:start] + surface + text[end:]
          path.write_text(text, encoding="utf-8")

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift")
          test_text = test_path.read_text(encoding="utf-8")
          stale_boundary = 'let beginning = try #require(source.range(of: "private var passiveSafetyPanel"))'
          live_boundary = 'let beginning = try #require(source.range(of: "private func hero(for phase: Phase)"))'
          if test_text.count(stale_boundary) != 1:
              raise SystemExit("rider-language test boundary no longer matches expected stale contract")
          test_text = test_text.replace(stale_boundary, live_boundary)
          test_path.write_text(test_text, encoding="utf-8")
          PY

      - name: Verify bounded diff and remove temporary workflow
        run: |
          git diff --check
          git diff -- NembraApp/Features/Research/ES80CaptureShellView.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift
          rm .github/workflows/_temp_es80_rider_language_transform.yml
          git config user.name "nembra-v14-bot"
          git config user.email "nembra-v14-bot@users.noreply.github.com"
          git add NembraApp/Features/Research/ES80CaptureShellView.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift .github/workflows/_temp_es80_rider_language_transform.yml
          git commit -m "[Capture product v14] Make primary field copy rider-first"
          git push origin HEAD:integration/es80-v14-rider-language-current-gpt56-go
