name: Materialize Capture Current Truth UID Closure 8ff

on:
  push:
    branches:
      - "integration/v14-capture-current-truth-closure-8ff-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact integration parent
        shell: bash
        run: |
          set -euo pipefail
          parent='8ff67f8217b78f3aae2f64510e5d73004b254265'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-current-truth-uid-closure-8ff-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift'

      - name: Bind accepted application evidence to verified account UID custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          receiver_marker = '    private func receivedApplicationUpdate(\n'
          if source.count(receiver_marker) != 1:
              raise SystemExit('receivedApplicationUpdate marker is ambiguous')
          if '<redacted-account-uid>' in source:
              raise SystemExit('account UID custody repair already present or ambiguous')
          helper_lines = [
              '    private func applicationUpdateForEventCustody(_ update: [String: String]) -> [String: String]? {',
              '        guard let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),',
              '              !verifiedAccountUID.isEmpty else { return nil }',
              '',
              '        var redacted: [String: String] = [:]',
              '        for key in update.keys.sorted() {',
              '            guard let value = update[key] else { continue }',
              '            let safeKey = key.replacingOccurrences(',
              '                of: verifiedAccountUID,',
              '                with: "<redacted-account-uid>",',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '            let safeValue = value.replacingOccurrences(',
              '                of: verifiedAccountUID,',
              '                with: "<redacted-account-uid>",',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '',
              '            // Malformed UID-bearing keys may collapse after redaction. Preserve every field under',
              '            // a deterministic non-authoritative suffix rather than silently dropping evidence.',
              '            var uniqueKey = safeKey',
              '            var collisionSuffix = 2',
              '            while redacted[uniqueKey] != nil {',
              '                uniqueKey = "\\(safeKey)#\\(collisionSuffix)"',
              '                collisionSuffix += 1',
              '            }',
              '            redacted[uniqueKey] = safeValue',
              '        }',
              '        return redacted',
              '    }',
              '',
          ]
          helper = '\n'.join(helper_lines) + '\n'
          source = source.replace(receiver_marker, helper + receiver_marker, 1)
          receiver_start = source.index('    private func receivedApplicationUpdate(')
          receiver_end = source.index('    private func startWatchdog', receiver_start)
          receiver = source[receiver_start:receiver_end]
          admission_marker = '        applicationUpdateAdmissionsInFlight += 1\n        defer { applicationUpdateAdmissionsInFlight -= 1 }\n\n        do {\n'
          safe_admission_lines = [
              '        guard let custodySafeUpdate = applicationUpdateForEventCustody(update) else {',
              '            await invalidateSourceAuthority(',
              '                token: token,',
              '                message: "Verified Tuya account identity became unavailable before application evidence could enter immutable custody.",',
              '                kind: "sdk_account_uid_custody_unavailable"',
              '            )',
              '            return',
              '        }',
              '',
              '        applicationUpdateAdmissionsInFlight += 1',
              '        defer { applicationUpdateAdmissionsInFlight -= 1 }',
              '',
              '        do {',
              '',
          ]
          safe_admission = '\n'.join(safe_admission_lines)
          if receiver.count(admission_marker) != 1:
              raise SystemExit('application admission point changed or is ambiguous')
          receiver = receiver.replace(admission_marker, safe_admission, 1)
          log_marker = '            log("tuya_application_update", update.merging([\n                "generation": String(token.diagnosticGeneration)\n            ]) { _, trusted in trusted })'
          safe_log = '            log("tuya_application_update", custodySafeUpdate.merging([\n                "generation": String(token.diagnosticGeneration)\n            ]) { _, trusted in trusted })'
          if receiver.count(log_marker) != 1:
              raise SystemExit('trusted application-event merge shape changed or is ambiguous')
          receiver = receiver.replace(log_marker, safe_log, 1)
          source = source[:receiver_start] + receiver + source[receiver_end:]
          duplicate = '        "refreshtoken",\n        "sessionkey",\n        "authkey",'
          if source.count(duplicate) != 1:
              raise SystemExit('expected duplicated sessionkey tail shape not found exactly once')
          source = source.replace(duplicate, '        "refreshtoken",\n        "authkey",', 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify combined truth closure and narrow scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          helper_start = s.index('private func applicationUpdateForEventCustody(')
          receiver_start = s.index('private func receivedApplicationUpdate(', helper_start)
          receiver_end = s.index('private func startWatchdog', receiver_start)
          helper = s[helper_start:receiver_start]
          receiver = s[receiver_start:receiver_end]
          assert 'membershipAccountUID?.trimmingCharacters' in helper
          assert '<redacted-account-uid>' in helper
          assert 'update.keys.sorted()' in helper
          assert 'while redacted[uniqueKey] != nil' in helper
          assert 'guard let custodySafeUpdate = applicationUpdateForEventCustody(update)' in receiver
          assert 'sdk_account_uid_custody_unavailable' in receiver
          assert 'log("tuya_application_update", custodySafeUpdate.merging([' in receiver
          assert 'log("tuya_application_update", update.merging([' not in receiver
          assert ']) { _, trusted in trusted })' in receiver
          assert ']) { current, _ in current })' not in receiver
          exit_start = s.index('func abandonCorrelationForViewExit()')
          fg_start = s.index('func appDidLoseForeground()', exit_start)
          private_start = s.index('var privateConfig: Bool', fg_start)
          exit_cleanup = s[exit_start:fg_start]
          fg_cleanup = s[fg_start:private_start]
          for cleanup in (exit_cleanup, fg_cleanup):
              clear = cleanup.index('sdkDeviceMembershipVerified = false')
              status = cleanup.index('membershipStatus =')
              revoke = cleanup.index('membershipRequestID = UUID()')
              assert clear < status < revoke
              assert 'membership verified and leased' not in cleanup.lower()
          completed = fg_cleanup.index('if phase == .correlated || phase == .selected')
          token = fg_cleanup.index('guard let token = currentConnectionToken else')
          assert completed < token
          branch = fg_cleanup[completed:token]
          assert 'resetDiscoverySessionOnly()' in branch
          assert 'foreground_integrity_lost_after_target_correlation' in branch
          assert 'Restart from OFF1' in branch
          assert 'guard !foregroundIntegrityLossHandled else { return }' in fg_cleanup
          assert 'Task { @MainActor [self] in' in fg_cleanup
          assert 'guard self.currentConnectionToken == token else { return }' in fg_cleanup
          assert '@Environment(\\.scenePhase) private var scenePhase' in s
          driver_start = s.index('@MainActor\nprivate final class SmartLifeDriver')
          driver_end = s.index('#endif\n\nprivate enum AppleAccountAuthorizationError', driver_start)
          driver = s[driver_start:driver_end]
          fragments_start = driver.index('private static let secretKeyFragments')
          fragments_end = driver.index('private static func redactApplicationSecrets', fragments_start)
          fragments = driver[fragments_start:fragments_end]
          assert fragments.count('"sessionkey"') == 1
          assert '"uid",' not in fragments
          assert '"uid"\n' not in fragments
          for block in (helper, receiver, exit_cleanup, fg_cleanup):
              for forbidden in ('queryDps','publishDps','writeValue','writeWithoutResponse','disconnectBLE','endConnection('):
                  assert forbidden not in block, forbidden
          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift')
          assert test_path.exists()
          print('Capture combined current-truth closure contract: PASS')
          PY
          git diff --check

      - name: Collapse materializer into clean product child
        shell: bash
        run: |
          set -euo pipefail
          parent='8ff67f8217b78f3aae2f64510e5d73004b254265'
          rm .github/workflows/materialize-capture-current-truth-uid-closure-8ff-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git add -u .github/workflows/materialize-capture-current-truth-uid-closure-8ff-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): close account UID custody on current truth head'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:integration/v14-capture-current-truth-closure-8ff-sol
