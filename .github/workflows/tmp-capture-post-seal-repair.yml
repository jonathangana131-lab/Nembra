name: Temporary Capture Post-Seal Repair

on:
  push:
    branches:
      - "agent/capture-post-seal-transport-recheck-sol"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Entrypoint
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          anchor = "                        try await sessionLedger.sealAcceptedObservation(for: token)\n"
          insertion = """                        guard self.currentConnectionToken == token,
                              self.driver === driver else {
                            self.currentConnectionToken = nil
                            self.localBLESettlementToken = nil
                            self.sdkLocalBLEOnline = false
                            self.driver = nil
                            self.phase = .failed
                            self.message = \"Authenticated-session ownership changed while canonical acceptance was sealing. Restart from OFF1; no accepted artifact was published.\"
                            self.log(\"session_owner_changed_during_acceptance_seal\", [
                                \"generation\": String(token.diagnosticGeneration)
                            ])
                            return
                        }
                        self.sdkLocalBLEOnline = driver.isLocallyConnected(uuid: self.tuyaUUID)
                        guard self.sdkLocalBLEOnline else {
                            self.currentConnectionToken = nil
                            self.localBLESettlementToken = nil
                            self.driver = nil
                            self.phase = .failed
                            self.message = \"Tuya local-BLE authority was no longer current after canonical sealing. Restart from OFF1; the sealed package chronology remains diagnostic only.\"
                            self.log(\"sdk_local_ble_offline_after_acceptance_seal\", [
                                \"generation\": String(token.diagnosticGeneration)
                            ])
                            return
                        }
          """
          count = source.count(anchor)
          print(f"anchor count: {count}")
          if count != 1:
              raise SystemExit(11)
          if "sdk_local_ble_offline_after_acceptance_seal" in source:
              raise SystemExit(12)
          path.write_text(source.replace(anchor, anchor + insertion, 1))
          PY
      - name: Verify product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift
          grep -q 'driver.isLocallyConnected(uuid: self.tuyaUUID)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -q 'sdk_local_ble_offline_after_acceptance_seal' NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-capture-post-seal-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/tmp-capture-post-seal-repair.yml
          git commit -m "fix(capture): recheck local BLE after seal"
      - name: Push repair
        shell: bash
        run: git push origin HEAD:agent/capture-post-seal-transport-recheck-sol
