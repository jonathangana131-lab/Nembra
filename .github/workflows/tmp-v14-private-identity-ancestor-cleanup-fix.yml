name: TEMP Capture Private Identity Ancestor Cleanup Fix

on:
  push:
    branches:
      - repair/v14-private-identity-payload-clean-sol-20260811
    paths:
      - .github/workflows/tmp-v14-private-identity-ancestor-cleanup-fix.yml
      - scripts/tmp_v14_private_identity_ancestor_cleanup_patch.py

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-private-identity-payload-clean-sol-20260811
          fetch-depth: 0
      - name: Bind exact repair input
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize current-root cleanup repair
        run: python3 scripts/tmp_v14_private_identity_ancestor_cleanup_patch.py
      - name: Validate all publication custody regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          python3 Scripts/provision_capture_tuya_identity_writer.py --self-test
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_publication_races.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_destination_ancestor_swap_current.py
          python3 -I scripts/ci/tests/test_capture_private_identity_publication_races.py
          python3 -I scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py
          python3 -I scripts/ci/tests/test_capture_private_identity_destination_ancestor_swap_current.py
          bash -n Scripts/provision_capture_tuya_identity.sh
          git diff --check
      - name: Publish validated non-workflow repair
        shell: bash
        run: |
          set -euo pipefail
          find Scripts scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Scripts/provision_capture_tuya_identity_writer.py \
            Scripts/provision_capture_tuya_identity.sh \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift
          git diff --cached --quiet && { echo 'ERROR: no destination cleanup repair delta' >&2; exit 1; }
          git commit -m 'Capture: bind rejected identity cleanup to current root'
          git push origin HEAD:repair/v14-private-identity-payload-clean-sol-20260811
