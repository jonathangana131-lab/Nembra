name: V14 Capture UID Reentrancy V2

on:
  push:
    branches:
      - repair/v14-capture-account-uid-reentrancy-ba3a-sol2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: repair/v14-capture-account-uid-reentrancy-ba3a-sol2
      - name: Materialize and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = 'ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          python3 tools/v14_uid_reentrancy_materialize.py
          TEST_PATH='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift'
          git add NembraApp/App/NembraCaptureEntrypoint.swift "$TEST_PATH"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '2'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx 'NembraApp/App/NembraCaptureEntrypoint.swift'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST_PATH"
          test -z "$(git status --short | grep '^??' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-capture-account-uid-reentrancy-materializer-v2.yml tools/v14_uid_reentrancy_materialize.py
          git commit -m 'fix(capture): snapshot UID custody across suspension'
          git push origin HEAD:repair/v14-capture-account-uid-reentrancy-ba3a-sol2
