name: Capture Trusted Retained Verifier Bash Env Red

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/capture-xcode27-trusted-command.yml
      - scripts/ci/tests/test_capture_trusted_retained_verifier_bash_environment_red.py
      - .github/workflows/capture-trusted-retained-verifier-bash-env-red.yml

permissions:
  contents: read

jobs:
  retained-verifier-red:
    name: Reject inherited Bash startup in retained verifier
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile expected-red regression
        run: python3 -m py_compile scripts/ci/tests/test_capture_trusted_retained_verifier_bash_environment_red.py
      - name: Require retained verifier startup custody
        run: python3 scripts/ci/tests/test_capture_trusted_retained_verifier_bash_environment_red.py -v
