name: Capture Stage Rail Accepted Contract Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/capture-stage-rail-accepted-contract-diagnostic.yml'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureStageRailAcceptedAccessibilitySourceTests.swift'

permissions:
  contents: read

jobs:
  focused-stage-rail:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Bind to exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run focused accepted stage-rail contract
        run: |
          cd Packages/NembraBluetoothCapture
          swift test --filter CaptureStageRailAcceptedAccessibilitySourceTests
