name: Materialize Capture failed stage rail 9695

on:
  push:
    branches:
      - fix/v14-capture-failed-stage-rail-9695-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '9695af19c21c93b3eb4bc867613a6df0c9a3b3d4'

      - name: Materialize terminal failed-stage product semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = app_path.read_text()

          old_open = '''    @ViewBuilder
              private var stageRail: some View {
                  if dynamicTypeSize.isAccessibilitySize {
          '''
          new_open = '''    @ViewBuilder
              private var stageRail: some View {
                  if test.phase == .failed {
                      HStack(alignment: .center, spacing: 12) {
                          Image(systemName: "stop.circle.fill")
                              .font(.title2.weight(.semibold))
                              .foregroundStyle(heroAccent)
                              .accessibilityHidden(true)
                          VStack(alignment: .leading, spacing: 3) {
                              Text("CAPTURE STOPPED")
                                  .font(.caption2.bold())
                                  .tracking(1.1)
                                  .foregroundStyle(heroAccent)
                              Text("No Capture step is current")
                                  .font(.headline)
                              Text(test.canRestartFromFreshOFF1
                                   ? "Clear the blocker, then begin again from scooter OFF."
                                   : "Relaunch Capture before another attempt.")
                                  .font(.caption)
                                  .foregroundStyle(.secondary)
                                  .fixedSize(horizontal: false, vertical: true)
                          }
                          Spacer(minLength: 0)
                      }
                      .accessibilityElement(children: .ignore)
                      .accessibilityLabel("Capture stopped. No Capture step is current.")
                      .accessibilityValue(test.canRestartFromFreshOFF1
                                          ? "Clear the blocker, then begin again from scooter off"
                                          : "Relaunch Capture before another attempt")
                  } else if dynamicTypeSize.isAccessibilitySize {
          '''
          if source.count(old_open) != 1:
              raise SystemExit(f'failed-stage opening drifted: {source.count(old_open)}')
          source = source.replace(old_open, new_open, 1)

          paused = '"Capture paused"'
          if source.count(paused) != 3:
              raise SystemExit(f'expected exactly three failed-state paused labels; observed {source.count(paused)}')
          source = source.replace(paused, '"Capture stopped"')
          app_path.write_text(source)

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFailedStageRailAccessibilitySourceTests.swift')
          test_path.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture failed stage-rail accessibility truth")
          struct CaptureFailedStageRailAccessibilitySourceTests {
              @Test("failed Capture intercepts the normal procedure rail with terminal semantics")
              func failedRailDoesNotPresentAnyProcedureStepAsCurrent() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let rail = String(try section(
                      in: source,
                      from: "private var stageRail: some View",
                      to: "private var primarySurface: some View"
                  ))

                  let failed = try #require(rail.range(of: "if test.phase == .failed"))
                  let normal = try #require(rail.range(of: "else if dynamicTypeSize.isAccessibilitySize"))
                  #expect(failed.lowerBound < normal.lowerBound)

                  let terminal = String(rail[..<normal.lowerBound])
                  #expect(terminal.contains("CAPTURE STOPPED"))
                  #expect(terminal.contains("No Capture step is current"))
                  #expect(terminal.contains("Clear the blocker, then begin again from scooter OFF."))
                  #expect(terminal.contains("Relaunch Capture before another attempt."))
                  #expect(terminal.contains("accessibilityLabel"))
                  #expect(terminal.contains("accessibilityValue"))
                  #expect(!terminal.contains("Step 1"))
                  #expect(!terminal.contains("Target, current"))
              }

              @Test("all visible failed-state titles use terminal stopped language")
              func failedHeroAndPanelsCannotImplyResumability() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let phaseTitle = String(try section(
                      in: source,
                      from: "private var phaseTitle: String",
                      to: "private var phaseSubtitle: String"
                  ))
                  let panels = String(try section(
                      in: source,
                      from: "private var failureRecoveryContextPanel: some View",
                      to: "private var failureDiagnosticsControls: some View"
                  ))

                  #expect(phaseTitle.contains("case .failed: return \"Capture stopped\""))
                  #expect(!phaseTitle.contains("Capture paused"))
                  #expect(!panels.contains("Capture paused"))
                  #expect(panels.components(separatedBy: "Capture stopped").count - 1 == 2)
                  #expect(panels.contains("This stopped attempt will not be reused."))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          ''')
          PY

      - name: Verify focused contract and Swift syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFailedStageRailAccessibilitySourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          rail = s[s.index('private var stageRail: some View'):s.index('private var primarySurface: some View')]
          assert rail.index('if test.phase == .failed') < rail.index('else if dynamicTypeSize.isAccessibilitySize')
          assert 'No Capture step is current' in rail
          assert 'Capture stopped. No Capture step is current.' in rail
          assert 'case .failed: return "Capture stopped"' in s
          failed_panels = s[s.index('private var failureRecoveryContextPanel: some View'):s.index('private var failureDiagnosticsControls: some View')]
          assert 'Capture paused' not in failed_panels
          PY

      - name: Publish clean exact-current checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-failed-stage-rail-9695.yml
          git config user.name 'nembra-sol'
          git config user.email 'nembra-sol@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFailedStageRailAccessibilitySourceTests.swift \
                  .github/workflows/materialize-capture-failed-stage-rail-9695.yml
          git diff --cached --check
          git commit -m 'fix(capture): make failed stage semantics terminal'
          git push origin HEAD:fix/v14-capture-failed-stage-rail-9695-sol
