name: Materialize Capture final truth product

on:
  push:
    branches:
      - product/v14-capture-guided-final-truth-gpt56sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply correlation presentation truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/apply_v14_capture_final_truth.py
          python3 scripts/ci/apply_v14_capture_final_truth.py

      - name: Verify composed source contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift
          grep -Fq 'procedureIdentifier == Self.fieldProcedureIdentifier' NembraApp/App/NembraCaptureBuildIdentity.swift
          grep -Fq 'INFOPLIST_KEY_NembraCaptureProcedureIdentifier=$PROCEDURE_ID' scripts/field/install_one_time_capture.command
          grep -Fq 'test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Text("\(correlationDisplayedWindowOrdinal)/4")' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'Text("\(min(test.correlationCompletedWindowCount + 1, 4))/4")' NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --check

      - name: Publish clean product tree
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/apply_v14_capture_final_truth.py
          rm .github/workflows/materialize-v14-capture-final-truth.yml
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'ERROR: no materialized product delta' >&2; exit 1; }
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): bind final guided truth and procedure custody'
          git push origin HEAD:product/v14-capture-guided-final-truth-gpt56sol
