name: Capture direct entrypoint authorization materializer

on:
  push:
    branches:
      - capture/entrypoint-auth-lifecycle-direct-gpt56sol-20260820
    paths:
      - .github/workflows/capture-direct-entrypoint-materialize-gpt56sol.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      TARGET_BRANCH: capture/entrypoint-auth-lifecycle-direct-gpt56sol-20260820
      SOURCE_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
      SELF_WORKFLOW: .github/workflows/capture-direct-entrypoint-materialize-gpt56sol.yml
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact branch and reviewed transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test -f "$SOURCE_WORKFLOW"
          test -f "$APP_SOURCE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize reviewed lifecycle into production source
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow_path = Path(".github/workflows/capture-app-authorization-close-one-shot.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          step_marker = "      - name: Materialize field authorization into real SecureLink lifecycle\n"
          next_marker = "\n      - name: Enforce truth-preserving source shape\n"
          step = workflow.index(step_marker)
          run_marker = "        run: |\n"
          start = workflow.index(run_marker, step) + len(run_marker)
          end = workflow.index(next_marker, start)
          script = textwrap.dedent(workflow[start:end])
          if "NembraCaptureFieldAuthorizationController" not in script:
              raise SystemExit("reviewed lifecycle transform did not contain the authorization controller")
          exec(compile(script, str(workflow_path), "exec"), {})

      - name: Enforce truth-preserving direct source shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = "$APP_SOURCE"
          grep -Fq 'private let fieldAuthorization = NembraCaptureFieldAuthorizationController()' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage != .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          test "$(grep -Fc 'fieldAuthorization?.' "$APP_SOURCE" || true)" = 0
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE" || true)" = 0

      - name: Run focused authorization and artifact contracts
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NembraCaptureDirectAuthorization" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish tested direct source and retire authoring machinery
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm -- "$SOURCE_WORKFLOW" "$SELF_WORKFLOW"
          git add -- "$APP_SOURCE"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(capture): wire field authorization into real lifecycle'
          materialized="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CAPTURE_DIRECT_AUTHORIZATION materialized=%s trigger=%s physicalAuthorityCreated=false\n' "$materialized" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
