name: Capture AX Sentinel Self-Reference Bootstrap

on:
  push:
    branches:
      - fix/capture-ax-sentinel-selfref-c00d-gpt56

permissions:
  contents: write

jobs:
  patch-exact-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: fix/capture-ax-sentinel-selfref-c00d-gpt56
          fetch-depth: 3

      - name: Verify exact flagship base and bootstrap-only drift
        shell: bash
        run: |
          set -euo pipefail
          base='c00d169aedea29bc9f53d16d258fe8714a5e9d80'
          git merge-base --is-ancestor "$base" HEAD
          drift="$(git diff --name-only "$base"..HEAD)"
          test "$drift" = '.github/workflows/capture-ax-sentinel-selfref-bootstrap-gpt56.yml' || {
            echo "Unexpected drift from exact flagship base:" >&2
            printf '%s\n' "$drift" >&2
            exit 1
          }

      - name: Remove self-referential sentinel literals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraUITests/ES80ResearchCaptureUITests.swift')
          source = path.read_text()

          old = '''    func testAccessibilityLaunchUsesSupportedXXXLCategoryName() throws {
              let source = try repositorySource(at: "NembraUITests/ES80ResearchCaptureUITests.swift")
              XCTAssertFalse(
                  source.contains("UICTContentSizeCategoryAccessibilityExtraExtraExtraLarge"),
                  "Capture UI tests must not use the unsupported long-form content-size token that silently falls back to normal text size."
              )
              let supportedToken = "UICTContentSizeCategoryAccessibilityXXXL"
              XCTAssertEqual(
                  source.components(separatedBy: supportedToken).count - 1,
                  4,
                  "Every Capture Accessibility XXXL launch must use the supported UIKit category token."
              )
          }'''

          new = '''    func testAccessibilityLaunchUsesSupportedXXXLCategoryName() throws {
              let source = try repositorySource(at: "NembraUITests/ES80ResearchCaptureUITests.swift")
              let unsupportedToken = "UICTContentSizeCategoryAccessibility" + "ExtraExtraExtraLarge"
              XCTAssertFalse(
                  source.contains(unsupportedToken),
                  "Capture UI tests must not use the unsupported long-form content-size token that silently falls back to normal text size."
              )
              let supportedToken = "UICTContentSizeCategoryAccessibility" + "XXXL"
              XCTAssertEqual(
                  source.components(separatedBy: supportedToken).count - 1,
                  4,
                  "Every Capture Accessibility XXXL launch must use the supported UIKit category token."
              )
          }'''

          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one self-referential AX sentinel block, found {source.count(old)}')
          source = source.replace(old, new)
          path.write_text(source)
          PY

          ! grep -q 'source.contains("UICTContentSizeCategoryAccessibilityExtraExtraExtraLarge")' NembraUITests/ES80ResearchCaptureUITests.swift
          ! grep -q 'let supportedToken = "UICTContentSizeCategoryAccessibilityXXXL"' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'let unsupportedToken = "UICTContentSizeCategoryAccessibility" + "ExtraExtraExtraLarge"' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'let supportedToken = "UICTContentSizeCategoryAccessibility" + "XXXL"' NembraUITests/ES80ResearchCaptureUITests.swift
          test "$(grep -c '"UICTContentSizeCategoryAccessibilityXXXL"' NembraUITests/ES80ResearchCaptureUITests.swift)" -eq 4
          ! grep -q '"UICTContentSizeCategoryAccessibilityExtraExtraExtraLarge"' NembraUITests/ES80ResearchCaptureUITests.swift
          git diff --check

      - name: Remove bootstrap and commit only durable test repair
        shell: bash
        run: |
          set -euo pipefail
          base='c00d169aedea29bc9f53d16d258fe8714a5e9d80'
          rm .github/workflows/capture-ax-sentinel-selfref-bootstrap-gpt56.yml
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' '.github/workflows/capture-ax-sentinel-selfref-bootstrap-gpt56.yml' 'NembraUITests/ES80ResearchCaptureUITests.swift' | sort)"
          test "$changed" = "$expected" || {
            echo "Unexpected bootstrap commit paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git config user.name 'nembra-v14-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '[Capture TODAY] Fix AX source-sentinel self-reference'
          final_drift="$(git diff --name-only "$base"..HEAD)"
          test "$final_drift" = 'NembraUITests/ES80ResearchCaptureUITests.swift' || {
            echo "Final branch would contain unexpected durable paths:" >&2
            printf '%s\n' "$final_drift" >&2
            exit 1
          }
          git push origin HEAD:fix/capture-ax-sentinel-selfref-c00d-gpt56
