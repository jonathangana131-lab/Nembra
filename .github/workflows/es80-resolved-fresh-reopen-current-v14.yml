name: ES80 resolved fresh reopen current v14

on:
  push:
    branches:
      - parallel/es80-resolved-fresh-reopen-v14/chat-gpt56-3
    paths:
      - .github/workflows/es80-resolved-fresh-reopen-current-v14.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-resolved-fresh-reopen-v14/chat-gpt56-3
          fetch-depth: 0

      - name: Apply resolution-gated exact fresh-session recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift')
          s = p.read_text()

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {n}')
              s = s.replace(old, new, 1)

          one(
              '        case horizonArtifactNotReady\n',
              '        case horizonArtifactNotReady\n        case freshTargetSessionRequired\n        case resolvedQueueTailChanged(expected: UInt64, actual: UInt64)\n',
              'errors'
          )
          one(
              '    private var committedReadyTransaction: Transaction?\n',
              '    private var committedReadyTransaction: Transaction?\n    /// Exact already-created durable target session required by recovery.\n    /// Reset cannot erase this binding.\n    private var requiredReadyTargetSessionGeneration: UInt64?\n',
              'state'
          )
          one(
              '        guard processedQueueSequence == nil else {\n            throw StateError.invalidTransition\n        }\n        guard nextRevision != UInt64.max else {\n',
              '        guard processedQueueSequence == nil else {\n            throw StateError.invalidTransition\n        }\n        if let requiredReadyTargetSessionGeneration {\n            guard authority.targetSessionGeneration == requiredReadyTargetSessionGeneration else {\n                throw StateError.freshTargetSessionRequired\n            }\n        }\n        guard nextRevision != UInt64.max else {\n',
              'Ready admission'
          )
          one(
              '        phase = .drainingReady(transaction)\n        nextRevision += 1\n',
              '        requiredReadyTargetSessionGeneration = nil\n        phase = .drainingReady(transaction)\n        nextRevision += 1\n',
              'Ready consume'
          )

          anchor = '    /// Abort quarantine is intentionally irreversible in this slice.'
          i = s.find(anchor)
          if i < 0:
              raise SystemExit('recovery-tail anchor missing')
          tail = '''    /// Reopens an abandoned Ready/Horizon lifecycle only after producer-issued
    /// globally-resolved FIFO authority and an unchanged global enqueue tail. The
    /// controller must create the fresh durable target session first, then consume
    /// resolution + reopen synchronously with no authority-changing await.
    mutating func reopenAfterAbortedQueueResolution(
        _ resolution: PassiveCoreBluetoothAbortedQueueResolution.Receipt,
        currentLastEnqueuedEventSequence: UInt64,
        freshTargetSessionGeneration: UInt64
    ) throws {
        guard case let .abortQuarantined(currentAbort) = phase else {
            throw StateError.invalidTransition
        }
        guard resolution.abortReceipt == currentAbort else {
            throw StateError.staleTransaction
        }
        guard resolution.resolvedThroughQueueSequence == currentLastEnqueuedEventSequence else {
            throw StateError.resolvedQueueTailChanged(
                expected: resolution.resolvedThroughQueueSequence,
                actual: currentLastEnqueuedEventSequence
            )
        }
        guard freshTargetSessionGeneration > currentAbort.abandonedTargetSessionGeneration else {
            throw StateError.freshTargetSessionRequired
        }

        committedReadyTransaction = nil
        requiredReadyTargetSessionGeneration = freshTargetSessionGeneration
        phase = .awaitingReady
    }

    /// Reopens a successful terminal Horizon only from exact terminal-resolution
    /// proof, an unchanged global tail, and one already-created strictly newer durable
    /// target session. Retired positions remain resolved-by-retirement, never recorder writes.
    mutating func reopenAfterTerminalQueueResolution(
        _ resolution: PassiveCoreBluetoothTerminalQueueResolution.Receipt,
        currentLastEnqueuedEventSequence: UInt64,
        freshTargetSessionGeneration: UInt64
    ) throws {
        guard case let .terminal(transaction) = phase else {
            throw StateError.invalidTransition
        }
        guard resolution.terminalTransactionRevision == transaction.revision,
              resolution.horizonQueueCutoff == transaction.queueCutoff,
              resolution.previouslyResolvedThroughQueueSequence == transaction.queueCutoff else {
            throw StateError.staleTransaction
        }
        guard resolution.terminalAuthority == transaction.authority else {
            throw StateError.authorityChanged
        }
        guard resolution.resolvedThroughQueueSequence == currentLastEnqueuedEventSequence else {
            throw StateError.resolvedQueueTailChanged(
                expected: resolution.resolvedThroughQueueSequence,
                actual: currentLastEnqueuedEventSequence
            )
        }
        guard freshTargetSessionGeneration > transaction.authority.targetSessionGeneration else {
            throw StateError.freshTargetSessionRequired
        }

        committedReadyTransaction = nil
        requiredReadyTargetSessionGeneration = freshTargetSessionGeneration
        phase = .awaitingReady
    }

    /// Weak reset cannot reopen quarantine/terminal and cannot erase recovery binding.
    @discardableResult
    mutating func resetForNewCaptureSession() -> Bool {
        guard phase == .awaitingReady else { return false }
        committedReadyTransaction = nil
        return true
    }
}
'''
          s = s[:i] + tail
          p.write_text(s)
          PY

          test_path='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateResolvedFreshReopenTests.swift'
          git fetch --no-tags origin parallel/es80-resolved-fresh-reopen-v14/chat-gpt56-2
          git show "FETCH_HEAD:${test_path}" > "${test_path}"

          python3 <<'PY'
          from pathlib import Path
          s = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift').read_text()
          assert 'uncommittedHorizonAbandonedBeforeRecorderMutation' in s, 'lost #568 four-state Horizon state'
          assert 'abortUncommittedHorizon(\n        after abandonment:' in s, 'lost #568 pre-attempt producer consumer'
          assert 'private var requiredReadyTargetSessionGeneration: UInt64?' in s
          assert 'reopenAfterAbortedQueueResolution(' in s
          assert 'reopenAfterTerminalQueueResolution(' in s
          begin = s[s.index('    mutating func begin('):s.index('    /// Opens Horizon only when', s.index('    mutating func begin('))]
          assert 'authority.targetSessionGeneration == requiredReadyTargetSessionGeneration' in begin
          reset = s[s.index('    mutating func resetForNewCaptureSession()'):]
          assert 'requiredReadyTargetSessionGeneration = nil' not in reset
          PY
          git diff --check

      - name: Commit clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-chat-gpt56'
          git config user.email 'nembra-chat-gpt56@users.noreply.github.com'
          rm .github/workflows/es80-resolved-fresh-reopen-current-v14.yml
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateResolvedFreshReopenTests.swift \
                  .github/workflows/es80-resolved-fresh-reopen-current-v14.yml
          git diff --cached --check
          git commit -m 'feat: bind resolved Capture recovery to exact fresh session on four-state gate'
          git push origin HEAD:parallel/es80-resolved-fresh-reopen-v14/chat-gpt56-3
