name: TEMP Capture R3 Parent Blob Custody Fix

on:
  push:
    branches:
      - repair/v14-r3-parent-module-execution-sol

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-r3-parent-module-execution-sol
          fetch-depth: 1

      - name: Materialize blob-pinned parent execution repair
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tmp_fix_r3_parent_blob.py

      - name: Compile repaired R3 authority
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py

      - name: Run canonical R3 unit authority suite
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py

      - name: Prove parent execution custody
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py

      - name: Preserve helper execution custody
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py

      - name: Preserve generated workflow release authority
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py

      - name: Validate production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: Commit non-workflow production repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py
          git diff --cached --check
          git commit -m 'Capture: pin R3 parent execution to exact Git blob'

      - name: Push non-workflow production repair
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:repair/v14-r3-parent-module-execution-sol
