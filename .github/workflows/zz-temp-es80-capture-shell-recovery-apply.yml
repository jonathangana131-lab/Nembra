          )

          replace_once(
              "                        detailRow(\"Recipe\", value: PassiveBluetoothExperimentOneFieldExecutionGate.recipeID.rawValue)\n                        detailRow(\"Correlation\", value: correlationDetailValue)",
              "                        detailRow(\"Correlation\", value: correlationDetailValue)"
          )
          replace_once(
              "                            detailRow(\"Analysis readiness\", value: \"Ready\")\n                            detailRow(\"Procedure\", value: report.procedureVersion)",
              "                            detailRow(\"Analysis readiness\", value: \"Ready\")\n                            detailRow(\"Recipe\", value: report.experimentRecipeID.rawValue)\n                            detailRow(\"Procedure\", value: report.procedureVersion)"
          )

