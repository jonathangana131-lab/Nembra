              "        finalShareData = artifact.json\n        finalShareFilename = artifact.suggestedFilename\n        finalShareIntegrityReport = report\n        sharePreparationWarning = nil"
          )

          replace_once("        shareURL = nil\n        finalShareData = nil", "        finalShareData = nil")
          replace_once(
              "        finalShareIntegrityReport = nil\n        sharePreparationWarning = nil\n        declaredStationarySetup = nil",
              "        finalShareIntegrityReport = nil\n        sharePreparationWarning = nil\n        didPresentAnalysisReadySemantics = false\n        declaredStationarySetup = nil"
          )

          replace_once(
