name: TEMP ES80 Capture shell recovery apply

on:
  push:
    branches:
      - recovery/es80-v14-capture-shell-current-spine/chatgpt56-thinking-go-3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact shell parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/Features/Research/ES80CaptureShellView.swift)" = "48de9a115382a9db5eb42c4e6bf81aee3f865117"
          git merge-base --is-ancestor 246ac110d1c8f8c2b245c6666076b792a2c01b7e HEAD

      - name: Apply guarded product convergence
