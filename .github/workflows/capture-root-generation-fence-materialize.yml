name: Capture Root Generation Fence Materializer

on:
  push:
    branches:
      - repair/v17-capture-generated-root-generation-fence-gpt56

permissions:
  contents: write

env:
  EXACT_PARENT: 385e311807fbc832b03fe894eec19f4ed624167e
  TESTS_B64: 

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-generated-root-generation-fence-gpt56
          fetch-depth: 0

      - name: Bind exact serial parent
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          test "$(git diff --name-only "$EXACT_PARENT"...HEAD)" = '.github/workflows/capture-root-generation-fence-materialize.yml'

      - name: Apply operation-level root generation fence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          helper = Path('scripts/ci/capture_accepted_build_input_snapshot.py')
          text = helper.read_text()
          canonical_anchor = '    root_fd = _open_repository_root(root)\n    directory_cache: dict[Path, tuple[int, os.stat_result]] = {}\n'
          copy_anchor = '    root_fd = _open_repository_root(source_root)\n    directory_cache: dict[Path, tuple[int, os.stat_result]] = {}\n'
          if text.count(canonical_anchor) != 1 or text.count(copy_anchor) != 1:
              raise SystemExit('root-generation insertion anchor mismatch')
          text = text.replace(canonical_anchor, '    root_fd = _open_repository_root(root)\n    root_generation = os.fstat(root_fd)\n    directory_cache: dict[Path, tuple[int, os.stat_result]] = {}\n', 1)
          text = text.replace(copy_anchor, '    root_fd = _open_repository_root(source_root)\n    root_generation = os.fstat(root_fd)\n    directory_cache: dict[Path, tuple[int, os.stat_result]] = {}\n', 1)
          open_anchor = '            descriptor, metadata, kind = _open_subject(root_fd, subject, directory_cache)\n            try:\n'
          if text.count(open_anchor) != 2:
              raise SystemExit('subject-use insertion anchor mismatch')
          text = text.replace(open_anchor, open_anchor + '                _assert_directory_generation(root_fd, root_generation, Path("."))\n')
          helper.write_text(text)

          test = Path('scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py')
          text = test.read_text()
          marker = '    def test_cache_dup_failure_closes_newly_opened_child_descriptor(self) -> None:\n'
          if text.count(marker) != 1 or 'test_manifest_rejects_generated_root_sibling_membership_splice' in text:
              raise SystemExit('permanent root-generation regression insertion mismatch')
          methods = base64.b64decode(os.environ['TESTS_B64']).decode()
          test.write_text(text.replace(marker, methods + '\n' + marker, 1))
          PY

      - name: Verify focused and inherited regressions
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m py_compile scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish clean two-file serial repair
        run: |
          set -euo pipefail
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git rm .github/workflows/capture-root-generation-fence-materialize.yml
          git commit -m 'fix(capture): fence generated root membership generation'
          git push origin HEAD:repair/v17-capture-generated-root-generation-fence-gpt56
