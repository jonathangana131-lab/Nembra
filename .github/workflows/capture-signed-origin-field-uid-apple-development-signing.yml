name: Capture Signed Origin Field UID Apple Development Signing

on:
  push:
    branches:
      - validation/v14-field-uid-apple-development-codesign-gpt56-sol-20260812
    paths:
      - scripts/ci/tests/test_capture_signed_app_field_uid_apple_development_signing.py
      - scripts/field/run_apple_signing_context_preflight.command
      - .github/workflows/capture-signed-origin-field-uid-apple-development-signing.yml
      - .github/workflows/capture-apple-signing-preflight-redaction.yml
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_signed_app_field_uid_apple_development_signing.py
      - scripts/field/run_apple_signing_context_preflight.command
      - .github/workflows/capture-signed-origin-field-uid-apple-development-signing.yml
      - .github/workflows/capture-apple-signing-preflight-redaction.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-field-uid-apple-signing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apple-development-signing:
    name: Prove Apple Development signing under field UID + fresh primary GID
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      EXACT_PARENT: 2e3754518163e12c3cfcb47267e604aaae3d7556
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/nembra-field-uid-apple-signing-pycache
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind accepted signing bridge and exact four-path validation delta
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          printf '%s\n' \
            .github/workflows/capture-apple-signing-preflight-redaction.yml \
            .github/workflows/capture-signed-origin-field-uid-apple-development-signing.yml \
            scripts/ci/tests/test_capture_signed_app_field_uid_apple_development_signing.py \
            scripts/field/run_apple_signing_context_preflight.command \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          /usr/bin/xcodebuild -version

      - name: Compile and source-review Apple signing oracle and field transport
        shell: bash
        run: |
          set -euo pipefail
          oracle=scripts/ci/tests/test_capture_signed_app_field_uid_apple_development_signing.py
          preflight=scripts/field/run_apple_signing_context_preflight.command
          /usr/bin/python3 -m py_compile "$oracle"
          /bin/bash -n "$preflight"

          grep -Fq 'security", "find-identity", "-v", "-p", "codesigning"' "$oracle"
          grep -Fq 'Apple Development:' "$oracle"
          grep -Fq 'credentials(field_uid, field_gid, field_active_groups)' "$oracle"
          grep -Fq 'credentials(field_uid, capability_gid, [])' "$oracle"
          grep -Fq 'rawSupplementaryGroups' "$oracle"
          grep -Fq 'fieldBaselinePreservedExact' "$oracle"
          grep -Fq 'ordinary field identity mutated Apple signing subject' "$oracle"
          grep -Fq 'selectedIdentityFingerprintSHA256' "$oracle"
          grep -Fq 'selectedIdentityLabelSHA256' "$oracle"
          grep -Fq 'identityDetailsRedacted' "$oracle"
          grep -Fq 'appleDevelopmentAuthorityPresent' "$oracle"
          grep -Fq 'adHocSignaturePresent' "$oracle"
          grep -Fq '"automaticProvisioningExercised": False' "$oracle"
          grep -Fq '"privateTuyaInputExercised": False' "$oracle"
          grep -Fq '"productionAcceptanceClaimed": False' "$oracle"
          grep -Fq '"physicalAuthorityCreated": False' "$oracle"

          grep -Fq 'ORACLE_PATH="scripts/ci/tests/test_capture_signed_app_field_uid_apple_development_signing.py"' "$preflight"
          grep -Fq 'GIT_NO_REPLACE_OBJECTS=1' "$preflight"
          grep -Fq 'cat-file blob "$ORACLE_BLOB"' "$preflight"
          grep -Fq 'hashlib.sha1(b"blob "' "$preflight"
          grep -Fq '/usr/bin/python3 -B -I -c "$ROOT_MATERIALIZER"' "$preflight"
          grep -Fq 'ORACLE_OWNER' "$preflight"
          grep -Fq '"identityDetailsRedacted": True' "$preflight"
          grep -Fq '"tuyaBootstrapExercised": False' "$preflight"
          grep -Fq '"privateTuyaInputExercised": False' "$preflight"
          grep -Fq '"xcodebuildExercised": False' "$preflight"
          grep -Fq '"automaticProvisioningExercised": False' "$preflight"
          grep -Fq '"deviceDiscoveryExercised": False' "$preflight"
          grep -Fq '"coreDeviceExercised": False' "$preflight"
          grep -Fq '"deviceInstallExercised": False' "$preflight"
          grep -Fq '"bluetoothExercised": False' "$preflight"
          grep -Fq '"physicalAuthorityCreated": False' "$preflight"
          ! grep -Fq '/usr/bin/xcodebuild' "$preflight"
          ! grep -Fq 'xcrun ' "$preflight"
          ! grep -Fq -- '-allowProvisioningUpdates' "$preflight"
          ! grep -Fq -- '-allowProvisioningDeviceRegistration' "$preflight"
          ! grep -Fq 'devicectl' "$preflight"
          ! grep -Fq 'bootstrap_capture_tuya_sdk.sh' "$preflight"
          ! grep -Fq 'LocalSecrets' "$preflight"
          ! grep -Fq 'install_one_time_capture.command' "$preflight"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run hosted Apple Development signing-context oracle
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/nembra-field-uid-apple-signing-output.txt"
          set +e
          /usr/bin/python3 -B -I \
            scripts/ci/tests/test_capture_signed_app_field_uid_apple_development_signing.py \
            >"$output" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/nembra-field-uid-apple-signing-rc.txt"
          cat "$output"
          if [[ "$rc" != 0 ]]; then
            diagnostic="$(tail -n 200 "$output" | /usr/bin/python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            printf '::error title=Hosted field-UID Apple signing oracle red::%s\n' "$diagnostic"
          fi
          exit "$rc"

      - name: Seal green or red Apple-signing evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/NembraFieldUIDAppleSigningEvidence"
          mkdir -p "$evidence"
          output="$RUNNER_TEMP/nembra-field-uid-apple-signing-output.txt"
          rc_file="$RUNNER_TEMP/nembra-field-uid-apple-signing-rc.txt"
          [[ -f "$output" ]] && cp "$output" "$evidence/probe-output.txt" || printf '%s\n' 'probe output unavailable' > "$evidence/probe-output.txt"
          [[ -f "$rc_file" ]] && cp "$rc_file" "$evidence/probe-return-code.txt" || printf '%s\n' 'missing' > "$evidence/probe-return-code.txt"
          /usr/bin/python3 - "$evidence/manifest.json" "$evidence/probe-output.txt" "$evidence/probe-return-code.txt" "$(git rev-parse HEAD)" "$EXACT_PARENT" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          manifest, output_path, rc_path, head, parent = sys.argv[1:]
          output = Path(output_path).read_text(encoding="utf-8", errors="replace")
          raw_rc = Path(rc_path).read_text(encoding="utf-8", errors="replace").strip()
          try:
              rc = int(raw_rc)
          except ValueError:
              rc = None
          record = {
              "schemaVersion": 2,
              "authority": "capture-field-uid-apple-development-signing-validation-only",
              "exactValidationHead": head.lower(),
              "exactAcceptedParent": parent.lower(),
              "probeReturnCode": rc,
              "successEvidencePresent": "NEMBRA_FIELD_UID_APPLE_SIGNING_JSON=" in output,
              "redEvidencePresent": "NEMBRA_FIELD_UID_APPLE_SIGNING_ERROR=" in output,
              "fieldMacExactBytePreflightIncluded": True,
              "identityDetailsRedacted": True,
              "automaticProvisioningExercised": False,
              "privateTuyaInputExercised": False,
              "productionAcceptanceClaimed": False,
              "physicalAuthorityCreated": False,
              "probeOutputSHA256": hashlib.sha256(output.encode("utf-8")).hexdigest(),
          }
          Path(manifest).write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          shasum -a 256 "$evidence"/* > "$evidence/SHA256SUMS.txt"

      - name: Upload Apple-signing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-field-uid-apple-signing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/NembraFieldUIDAppleSigningEvidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce hosted Apple signing verdict and hygiene
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          # This remains a real runtime verdict: hosted xcode-27 currently has no Apple
          # Development identity, so a red here is retained evidence rather than waived.
          test "$PROBE_OUTCOME" = success
          test "$(cat "$RUNNER_TEMP/nembra-field-uid-apple-signing-rc.txt")" = 0
          output="$RUNNER_TEMP/nembra-field-uid-apple-signing-output.txt"
          grep -q '^NEMBRA_FIELD_UID_APPLE_SIGNING_JSON=' "$output"
          grep -q '"fieldBaselinePreservedExact": true' "$output"
          grep -q '"unexpectedGroupsBeyondFieldBaseline": \[\]' "$output"
          grep -q '"missingFieldBaselineGroups": \[\]' "$output"
          grep -q '"appleDevelopmentAuthorityPresent": true' "$output"
          grep -q '"adHocSignaturePresent": false' "$output"
          grep -q '"codesignReturnCode": 0' "$output"
          grep -q '"strictVerifyReturnCode": 0' "$output"
          grep -q '"physicalAuthorityCreated": false' "$output"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"