name: ES80 Reanchor iOS Preflight

on:
  push:
    branches:
      - 'cell/es80-passive-reanchor/ci/chat-t8n4q-ios-preflight-*'

permissions:
  contents: read

concurrency:
  group: nembra-es80-reanchor-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test current-main composition on Xcode 27
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
      - name: Guard passive adapter against application writes
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 capture adapter must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi
      - name: Test composed NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture
      - name: Build composed NembraBluetoothCapture for iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
