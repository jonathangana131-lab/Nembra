name: Capture Postcheck Sibling Splice Oracle

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_postcheck_sibling_splice_oracle.py
      - .github/workflows/capture-postcheck-sibling-splice-oracle.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_PRODUCT_PARENT: f1be1b584e8b568fb8c3998adad3ee0b29004fdc

jobs:
  exploit-oracle:
    name: Composed postcheck sibling splice exploit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact composed vulnerable parent
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PRODUCT_PARENT")" = "$EXACT_PRODUCT_PARENT"
          changed="$(git diff --name-only "$EXACT_PRODUCT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-postcheck-sibling-splice-oracle.yml \
            scripts/ci/tests/test_capture_postcheck_sibling_splice_oracle.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PRODUCT_PARENT"...HEAD

      - name: Reproduce postcheck SDK-A plus Runtime-B splice
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_postcheck_sibling_splice_oracle.py

      - name: Require clean checkout
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
