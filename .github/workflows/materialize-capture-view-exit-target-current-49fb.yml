name: Materialize Current Capture View-Exit Target Retirement 49FB

on:
  push:
    branches: [agent/capture-view-exit-target-current-49fb]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-view-exit-target-current-49fb
          fetch-depth: 0
      - name: Apply reviewed residual
        shell: bash
        run: |
          set -euo pipefail
          parent='49fb833b87883f4cb3d9d39b332f6157a0ff51fe'
          reviewed='e9bdc467b3785c297afdf17a7431aa8252178eea'
          test "$(git rev-parse HEAD^)" = "$parent"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s=p.read_text()
          old='''        // Foreground loss already owns the terminal retirement for this view lifetime.\n        // Avoid racing a second terminal task when backgrounding is followed by onDisappear.\n        if foregroundIntegrityLossHandled { return }\n\n        if let token = currentConnectionToken {\n'''
          new='''        // Foreground loss already owns the terminal retirement for this view lifetime.\n        // Avoid racing a second terminal task when backgrounding is followed by onDisappear.\n        if foregroundIntegrityLossHandled { return }\n        // A normal navigation exit owns this view-lifetime terminal too. A later scene callback\n        // must not schedule a second/different package terminal while this one is still in flight.\n        foregroundIntegrityLossHandled = true\n\n        if let token = currentConnectionToken {\n'''
          if s.count(old)!=1: raise SystemExit('view terminal anchor drifted')
          s=s.replace(old,new,1)
          old='''        guard processCorrelationLease != nil || correlationSession != nil else { return }\n        // Existing helper stops package transport before releasing this controller's lease.\n        abandonPackageCorrelation()\n        phase = .failed\n        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."\n        log("target_correlation_abandoned_on_view_exit")\n    }\n'''
          new='''        if processCorrelationLease != nil || correlationSession != nil {\n            // Match foreground loss: full discovery reset stops package scanning before lease release\n            // and erases every actionable target-selection bit earned by the interrupted attempt.\n            resetDiscoverySessionOnly()\n            phase = .failed\n            message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."\n            log("target_correlation_abandoned_on_view_exit")\n            return\n        }\n\n        if phase == .correlated || phase == .selected {\n            // Final-window sealing already retired scanner/lease, but correlated/selected target\n            // authority remains mutable current-attempt evidence and cannot cross view lifetime.\n            resetDiscoverySessionOnly()\n            phase = .failed\n            message = "Target correlation was retired because Capture left Secure Link. Restart from OFF1; a pre-exit correlated target is never reusable authority."\n            log("target_correlation_retired_on_view_exit")\n        }\n    }\n'''
          if s.count(old)!=1: raise SystemExit('view target anchor drifted')
          p.write_text(s.replace(old,new,1))
          PY
          git checkout "$reviewed" -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureViewExitTargetRevocationSourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          a=s.index('func abandonCorrelationForViewExit()'); b=s.index('func appDidLoseForeground()',a); x=s[a:b]
          for q in ['foregroundIntegrityLossHandled = true','if processCorrelationLease != nil || correlationSession != nil','if phase == .correlated || phase == .selected','target_correlation_retired_on_view_exit']:
              assert q in x,q
          assert x.count('resetDiscoverySessionOnly()') == 2
          for q in ['disconnectBLE','recordObservedTransportLoss','endConnection(','writeValue','publishDps','queryDps']:
              assert q not in x,q
          # Ensure current event-custody admission work remains present elsewhere in the file.
          for q in ['applicationEventAdmissionToken','redactedApplicationEventDetails(update)','eventDetails["generation"] = String(token.diagnosticGeneration)']:
              assert q in s,q
          print('view-exit target residual: PASS')
          PY
          git diff --check
          rm .github/workflows/materialize-capture-view-exit-target-current-49fb.yml
          git config user.name nembra-v14-bot
          git config user.email nembra-v14-bot@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureViewExitTargetRevocationSourceTests.swift .github/workflows/materialize-capture-view-exit-target-current-49fb.yml
          git diff --cached --check
          git commit -m 'fix(capture): retire target authority on view exit'
          git push origin HEAD:agent/capture-view-exit-target-current-49fb
