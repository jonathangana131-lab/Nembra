name: Apply deterministic command safety fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-command-gate-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged patch
        run: |
          set -euo pipefail
          git apply --check .ci-patches/command-gate.patch
          git apply .ci-patches/command-gate.patch

      - name: Run NembraCore tests
        working-directory: Packages/NembraCore
        run: swift test

      - name: Commit deterministic test fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/NembraCore/Sources/NembraCore/SimulatedScooterService.swift Packages/NembraCore/Tests/NembraCoreTests/SimulatedScooterServiceTests.swift
          git commit -m "test: make command safety interleavings deterministic"
          git push origin HEAD:main
