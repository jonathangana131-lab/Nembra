name: Apply deterministic command-gate fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/command-gate.patch.b64 <<'PATCH'
          
PATCH
          tr -d '[:space:]' < /tmp/command-gate.patch.b64 | base64 --decode > /tmp/command-gate.patch
          echo "42f072abaf488378e9610ee361b42e6c5ca73a457a1f02c2fc30dd572ebc30dc  /tmp/command-gate.patch" | sha256sum -c -
          git apply --check /tmp/command-gate.patch
          git apply /tmp/command-gate.patch

      - name: Validate core package
        working-directory: Packages/NembraCore
        run: swift test

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/NembraCore/Sources/NembraCore/SimulatedScooterService.swift Packages/NembraCore/Tests/NembraCoreTests/SimulatedScooterServiceTests.swift
          git commit -m "test: make command safety interleavings deterministic"
          git push origin HEAD:main
