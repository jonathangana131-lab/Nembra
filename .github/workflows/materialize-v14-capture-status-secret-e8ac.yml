name: Materialize Capture status secret custody

on:
  push:
    branches:
      - fix/v14-capture-status-secret-e8ac-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply status redaction repair
        run: python3 scripts/ci/apply_v14_capture_status_secret_redaction.py
      - name: Validate secret custody and current bridge truth
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/Features/Research/TuyaAccountBridge.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/Features/Research/TuyaAccountBridge.swift').read_text(encoding='utf-8')
          assert 'selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]' in source
          assert '"status": Self.redactSecrets(selectedDeviceStatus ?? [:])' in source
          assert 'selectedDeviceStatus = statusMap' not in source
          assert '"status": selectedDeviceStatus ?? [:]' not in source
          for key in ('localkey','accesstoken','refreshtoken','seckey','authkey'):
              assert f'"{key}"' in source
          assert 'guard devices.contains(where: { $0.id == device.id }) else' in source
          assert 'generation == operationGeneration' in source
          PY
          git diff --check
      - name: Publish clean custody repair
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/apply_v14_capture_status_secret_redaction.py
          rm .github/workflows/materialize-v14-capture-status-secret-e8ac.yml
          git add -A
          git diff --cached --check
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): redact status metadata at admission and export'
          git push origin HEAD:fix/v14-capture-status-secret-e8ac-sol
