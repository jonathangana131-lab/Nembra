name: Temporary Capture Export Envelope R2 Patch

on:
  push:
    branches:
      - repair/v14-capture-sealed-export-envelope-r2-sol

permissions:
  contents: write

concurrency:
  group: v14-capture-export-envelope-r2-patch
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-sealed-export-envelope-r2-sol
          fetch-depth: 0

      - name: Apply strict live-spine source patch
        run: python3 scripts/ci/tmp_patch_capture_export_envelope_r2.py

      - name: Verify source shape and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedExportEnvelopeSealSourceTests.swift').read_text()
          required = [
              'private var sealedAcceptedExportSnapshot: Export?',
              'private var acceptanceSourceAuthorityIsStillAuthorized: Bool',
              'let acceptedExportSnapshotAtCut = self.makeExportSnapshot(',
              'guard self.acceptanceSourceAuthorityIsStillAuthorized',
              'self.sealedAcceptedExportSnapshot = acceptedExportSnapshotAtCut',
              'guard var acceptedSnapshot = self.sealedAcceptedExportSnapshot',
              'acceptedSnapshot.exportedAt = Date()',
              'sealedAcceptedExportSnapshot = nil',
          ]
          for token in required:
              assert token in app, token
          assert 'acceptanceCutFreezesCandidateEnvelopeBeforeSeal' in test
          assert 'packageSealCannotPromoteAChangedSDKLease' in test
          assert 'acceptedArtifactDoesNotDependOnLiveMembershipAfterSeal' in test
          PY

      - name: Parse patched Swift sources
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          xcrun swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedExportEnvelopeSealSourceTests.swift

      - name: Run focused package source contracts
        shell: bash
        run: |
          set -euo pipefail
          cd Packages/NembraBluetoothCapture
          swift test --filter 'TuyaAcceptedApplicationEvidenceSealSourceTests|TuyaAcceptedExportEnvelopeSealSourceTests'

      - name: Commit only durable product and regression files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/tmp_patch_capture_export_envelope_r2.py
          rm .github/workflows/tmp_v14_capture_export_envelope_r2_patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): seal full accepted export envelope'
          git push origin HEAD:repair/v14-capture-sealed-export-envelope-r2-sol
