name: Capture Component Walk macOS Temp Canonical Materialize Once

on:
  push:
    branches:
      - repair/v17-capture-component-walk-macos-temp-canonical-sol-20260815
    paths:
      - .github/workflows/capture-component-walk-macos-temp-canonical-materialize-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-component-walk-macos-temp-canonical-materialize
  cancel-in-progress: false

env:
  EXACT_PARENT: 474507966619ce39288b20de29066711088cd986

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind one-shot authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = ".github/workflows/capture-component-walk-macos-temp-canonical-materialize-once.yml"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prepare canonical temporary fixture roots
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path
          path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py")
          source = path.read_text(encoding="utf-8")
          old = "Path(raw)"
          new = "Path(raw).resolve(strict=True)"
          count = source.count(old)
          if count != 6:
              raise SystemExit(f"expected exactly 6 tempfile roots, found {count}")
          source = source.replace(old, new)
          compile(source, str(path), "exec", dont_inherit=True)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Test real directory and regular file
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import importlib.util, unittest
          from pathlib import Path
          path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py").resolve()
          spec = importlib.util.spec_from_file_location("component_walk_test", path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.TestSuite([module.CapturePrivateReadLeaseComponentWalkTests("test_real_directory_and_regular_file_still_open")])
          raise SystemExit(0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)
          PY

      - name: Test intermediate symlink swap
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import importlib.util, unittest
          from pathlib import Path
          path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py").resolve()
          spec = importlib.util.spec_from_file_location("component_walk_test", path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.TestSuite([module.CapturePrivateReadLeaseComponentWalkTests("test_intermediate_symlink_swap_is_rejected_after_plan")])
          raise SystemExit(0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)
          PY

      - name: Test planned identity replacement
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import importlib.util, unittest
          from pathlib import Path
          path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py").resolve()
          spec = importlib.util.spec_from_file_location("component_walk_test", path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.TestSuite([module.CapturePrivateReadLeaseComponentWalkTests("test_real_directory_replacement_is_rejected_against_planned_identity")])
          raise SystemExit(0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)
          PY

      - name: Test descriptor mixed-generation rejection
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import importlib.util, unittest
          from pathlib import Path
          path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py").resolve()
          spec = importlib.util.spec_from_file_location("component_walk_test", path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.TestSuite([module.CapturePrivateReadLeaseComponentWalkTests("test_descriptor_plan_rejects_mixed_generation_descendant")])
          raise SystemExit(0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)
          PY

      - name: Test grant mixed-generation rejection
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import importlib.util, unittest
          from pathlib import Path
          path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py").resolve()
          spec = importlib.util.spec_from_file_location("component_walk_test", path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.TestSuite([module.CapturePrivateReadLeaseComponentWalkTests("test_actual_grant_rejects_mixed_generation_before_acl_mutation")])
          raise SystemExit(0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)
          PY

      - name: Test held descriptor inode reuse resistance
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import importlib.util, unittest
          from pathlib import Path
          path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py").resolve()
          spec = importlib.util.spec_from_file_location("component_walk_test", path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.TestSuite([module.CapturePrivateReadLeaseComponentWalkTests("test_held_descriptor_prevents_inode_reuse_after_admission")])
          raise SystemExit(0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)
          PY

      - name: Test production source contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import importlib.util, unittest
          from pathlib import Path
          path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py").resolve()
          spec = importlib.util.spec_from_file_location("component_walk_test", path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          suite = unittest.TestSuite([module.CapturePrivateReadLeaseComponentWalkTests("test_source_production_grant_consumes_held_descriptor_plan")])
          raise SystemExit(0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)
          PY

      - name: Run neighboring lease regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py

      - name: Publish permanent one-file harness repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/capture-component-walk-macos-temp-canonical-materialize-once.yml
          git add scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git diff --cached --check
          changed="$(git diff --cached --name-only "$EXACT_PARENT")"
          test "$changed" = "scripts/ci/tests/test_capture_private_read_lease_component_walk.py"
          git config user.name "nembra-capture-swarm"
          git config user.email "nembra-capture-swarm@users.noreply.github.com"
          git commit -m "test(capture): canonicalize macOS component-walk fixtures"
          git push origin HEAD:repair/v17-capture-component-walk-macos-temp-canonical-sol-20260815
