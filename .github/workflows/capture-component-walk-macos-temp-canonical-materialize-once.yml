name: Capture Component Walk macOS Temp Canonical Materialize Once

on:
  push:
    branches:
      - repair/v17-capture-component-walk-macos-temp-canonical-sol-20260815
    paths:
      - .github/workflows/capture-component-walk-macos-temp-canonical-materialize-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-component-walk-macos-temp-canonical-materialize
  cancel-in-progress: false

env:
  EXACT_PARENT: 474507966619ce39288b20de29066711088cd986

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind one-shot authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = ".github/workflows/capture-component-walk-macos-temp-canonical-materialize-once.yml"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Canonicalize temporary fixture roots without weakening production
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py")
          source = path.read_text(encoding="utf-8")
          old = "Path(raw)"
          new = "Path(raw).resolve(strict=True)"
          count = source.count(old)
          if count != 6:
              raise SystemExit(f"expected exactly 6 tempfile roots, found {count}")
          source = source.replace(old, new)
          compile(source, str(path), "exec", dont_inherit=True)
          path.write_text(source, encoding="utf-8")
          PY

          /usr/bin/python3 -B - <<'PY'
          import os, tempfile
          from pathlib import Path
          raw = Path(tempfile.mkdtemp(prefix="nembra-macos-path-diagnostic-"))
          resolved = raw.resolve(strict=True)
          print(f"rawTemp={raw}")
          print(f"resolvedTemp={resolved}")
          print(f"openDirFdSupported={os.open in os.supports_dir_fd}")
          print(f"oNoFollow={getattr(os, 'O_NOFOLLOW', 0)}")
          print(f"oDirectory={getattr(os, 'O_DIRECTORY', 0)}")
          raw.rmdir()
          PY

          run_test() {
            local label="$1"
            local test_path="$2"
            local output
            if ! output=$(/usr/bin/python3 -B -I "$test_path" 2>&1); then
              local escaped
              escaped="${output//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error title=${label}::${escaped}"
              return 1
            fi
            printf '%s\n' "$output"
          }

          run_test component-walk-macos scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          run_test selected-xcode-regression scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          run_test rollback-regression scripts/ci/tests/test_capture_private_read_lease_rollback.py
          run_test host-ancestry-regression scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py

      - name: Publish permanent one-file harness repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/capture-component-walk-macos-temp-canonical-materialize-once.yml
          git add scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git diff --cached --check
          changed="$(git diff --cached --name-only "$EXACT_PARENT")"
          test "$changed" = "scripts/ci/tests/test_capture_private_read_lease_component_walk.py"
          git config user.name "nembra-capture-swarm"
          git config user.email "nembra-capture-swarm@users.noreply.github.com"
          git commit -m "test(capture): canonicalize macOS component-walk fixtures"
          git push origin HEAD:repair/v17-capture-component-walk-macos-temp-canonical-sol-20260815
