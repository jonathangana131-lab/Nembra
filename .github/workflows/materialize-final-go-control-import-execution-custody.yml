name: Materialize Final-GO Control Import Execution Custody

on:
  push:
    branches:
      - repair/v14-final-go-control-import-execution-custody-sol
    paths:
      - .github/workflows/materialize-final-go-control-import-execution-custody.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/v14-final-go-control-import-execution-custody-sol
          fetch-depth: 0

      - name: Require exact accepted issuer parent
        run: |
          git merge-base --is-ancestor 6549e6a2ebc72512e7594df061dd3ba6ea09dfa8 HEAD
          test "$(git hash-object --no-filters -- scripts/ci/es80_authenticated_stationary_final_go.py)" = 2832251d874a09c542fa25d41a9c27455ca9b363

      - name: Apply production repair
        run: python3 scripts/ci/materialize_final_go_control_import_execution_custody.py

      - name: Validate repair and canonical authority tests
        run: |
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_final_go_control_import_execution_custody.py
          python3 scripts/ci/tests/test_es80_final_go_control_import_execution_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py

      - name: Commit clean production repair
        run: |
          git rm \
            .github/workflows/materialize-final-go-control-import-execution-custody.yml \
            scripts/ci/materialize_final_go_control_import_execution_custody.py
          git config user.name "nembra-capture-bot"
          git config user.email "capture-bot@nembra.invalid"
          git add \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_final_go_control_import_execution_custody.py
          git diff --cached --check
          git commit -m "fix(capture): pin Final-GO control module execution"
          git push origin HEAD:repair/v14-final-go-control-import-execution-custody-sol
