name: Capture exact-device callback one-shot

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
    paths:
      - .github/workflows/capture-exact-device-callback-one-shot.yml

permissions:
  contents: write

concurrency:
  group: capture-exact-device-callback-one-shot
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'jonathangana131-lab/Nembra'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bind exact authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "capture/one-time-ble-dump-gpt56"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Materialize exact callback source fence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()
          old = '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              guard let dps, !dps.isEmpty else { return }
          '''
          new = '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              // Application evidence belongs to the exact ThingSmartDevice instance created
              // from the freshly re-verified Tuya device ID for this attempt. A nil, stale,
              // or foreign delegate callback must never mint payload authority.
              guard let callbackDevice = device,
                    let boundDevice = self.device,
                    callbackDevice === boundDevice else { return }
              guard let dps, !dps.isEmpty else { return }
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one dpsUpdate admission anchor, found {count}")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Enforce read-only source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          s = p.read_text()
          required = [
              "callbackDevice === boundDevice else { return }",
              "device = ThingSmartDevice(deviceId: deviceID)",
              "device?.delegate = self",
              "func device(_ device: ThingSmartDevice?, dpsUpdate dps:",
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f"missing exact-device callback fence contract: {needle}")
          driver = s[s.index("private final class SmartLifeDriver"):s.index("private enum AppleAccountAuthorizationError")]
          for forbidden in ("publishDps(", "writeValue(", "resetFactory", "removeDevice"):
              if forbidden in driver:
                  raise SystemExit(f"forbidden mutating SmartLifeDriver surface: {forbidden}")
          PY

      - name: Verify narrow product delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "NembraApp/App/NembraCaptureEntrypoint.swift"
          git diff --check
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Publish coherent product repair and retire one-shot
        shell: bash
        env:
          TARGET_BRANCH: capture/one-time-ble-dump-gpt56
        run: |
          set -euo pipefail
          rm .github/workflows/capture-exact-device-callback-one-shot.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/capture-exact-device-callback-one-shot.yml
          git diff --cached --check
          git config user.name "nembra-gpt56"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capture: bind Tuya callbacks to exact selected device"
          git push origin "HEAD:${TARGET_BRANCH}"
