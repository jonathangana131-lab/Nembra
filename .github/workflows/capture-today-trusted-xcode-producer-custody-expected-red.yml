name: Capture TODAY Trusted Xcode Producer Custody Expected Red

on:
  push:
    branches:
      - validation/v14-trusted-xcode-producer-custody/gpt56-go
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/tests/test_es80_today_trusted_xcode_producer_custody_expected_red.py
      - .github/workflows/capture-xcode27-trusted-command.yml
      - .github/workflows/capture-today-trusted-xcode-producer-custody-expected-red.yml

permissions:
  contents: read

jobs:
  producer-custody-expected-red:
    name: Require independent Simulator evidence-producer custody
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile producer-custody regression
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_trusted_capture_xcode_subject.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_trusted_capture_xcode_subject.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_trusted_xcode_producer_custody_expected_red.py
      - name: Prove trusted subject rejects candidate-mutated evidence producer
        run: python3 scripts/ci/tests/test_es80_today_trusted_xcode_producer_custody_expected_red.py -v
