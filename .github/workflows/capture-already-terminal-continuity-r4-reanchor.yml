name: Capture Already-Terminal Continuity R4 Reanchor

on:
  push:
    branches:
      - fix/v14-capture-already-terminal-continuity-r4-sol
    paths:
      - .github/workflows/capture-already-terminal-continuity-r4-reanchor.yml

permissions:
  contents: write

jobs:
  reanchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-already-terminal-continuity-r4-sol
          fetch-depth: 0
      - name: Apply reviewed two-path repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/v14-capture-already-terminal-continuity-r3-sol
          git diff 6a29b5f0be79db680e0fd5dde22fa2b4aa321eeb 04482bdd3070ac51ae625b4daf9ff5268d8574c3 -- \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift \
            > /tmp/continuity.patch
          test -s /tmp/continuity.patch
          git apply --3way /tmp/continuity.patch
          rm .github/workflows/capture-already-terminal-continuity-r4-reanchor.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --name-only | grep -qx 'NembraApp/App/NembraCaptureEntrypoint.swift'
          git diff --cached --name-only | grep -qx 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift'
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'mirrorAlreadyTerminalObservationContinuity'
          git diff --cached -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift | grep -q 'package continuity error retires token before it throws'
          git commit -m "fix(capture): mirror package-terminal continuity once"
          git push origin HEAD:fix/v14-capture-already-terminal-continuity-r4-sol
