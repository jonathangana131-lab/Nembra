name: Temporary ES80 recovery surface QA hot-swap

on:
  push:
    branches:
      - product/es80-v14-recovery-surface-qa/gpt56-go

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/es80-v14-recovery-surface-qa/gpt56-go
          fetch-depth: 0

      - name: Make runtime recovery copy rider-first
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '"Start a fresh Experiment One"',
                  '"Start a fresh Capture"',
              ),
              (
                  'return .failed("Nembra left the active foreground after Experiment One began. This evidence life cannot regain capture authority; start a fresh Experiment One.")',
                  'return .failed("Nembra left the foreground after Capture began. This run is no longer valid. Start a fresh Capture.")',
              ),
              (
                  'return .failed(coordinator.lastDiagnostic ?? "The passive target connection ended before an accepted observation could be sealed. Start a fresh Experiment One rather than replaying consumed authority.")',
                  'return .failed("The Bluetooth connection ended before Capture could be sealed. Start a fresh Capture.")',
              ),
              (
                  'return .bluetoothUnavailable("The package-owned CoreBluetooth controller is unavailable for this coordinator.")',
                  'return .bluetoothUnavailable("Bluetooth capture is unavailable for this run.")',
              ),
              (
                  'return .correlationFailed("The four windows did not preserve one valid package-issued observation authority and required OFF 1, ON 1, OFF 2, ON 2 ordering.")',
                  'return .correlationFailed("The four OFF / ON steps did not preserve one valid sequence. Start a fresh Capture.")',
              ),
              (
                  'return .correlationFailed("The package-owned Experiment One workflow has no active correlation progress and no final result.")',
                  'return .correlationFailed("Capture could not determine the current OFF / ON step. Start a fresh Capture.")',
              ),
              (
                  'return .failed("Simulator QA interruption fixture. This synthetic state represents a foreground-invalidated evidence life; it is not physical evidence.")',
                  'return .failed("Capture was interrupted when Nembra left the foreground. This synthetic run is no longer valid. Start a fresh Capture.")',
              ),
              (
                  'localFailureMessage = "Nembra could not create a fresh package-owned Experiment One workflow: \\(String(describing: error))"',
                  'localFailureMessage = "Nembra could not start a fresh Capture. Close and reopen Nembra, then try again."',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source occurrence, found {count}: {old}")
              source = source.replace(old, new, 1)

          required = [
              "Capture stopped safely",
              "Start a fresh Capture",
              "Nembra left the foreground after Capture began.",
              "Bluetooth capture is unavailable for this run.",
              "The four OFF / ON steps did not preserve one valid sequence.",
              "Capture could not determine the current OFF / ON step.",
              "Capture was interrupted when Nembra left the foreground.",
              "Nembra could not start a fresh Capture. Close and reopen Nembra, then try again.",
              "guard status.physicalProcedurePermitted else",
              "coordinator.invalidateForForegroundLoss()",
              "es80.capture.restart-experiment",
          ]
          for phrase in required:
              if phrase not in source:
                  raise SystemExit(f"required recovery/truth contract disappeared: {phrase}")

          path.write_text(source, encoding="utf-8")
          PY

      - name: Add retained foreground-interruption Simulator acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraUITests/ES80ResearchCaptureUITests.swift")
          source = path.read_text(encoding="utf-8")
          marker = "    private func assertVisibleInScreenshotViewport("
          if source.count(marker) != 1:
              raise SystemExit("UI helper insertion boundary is not unique")

          test = r'''
    @MainActor
    func testV14SimulatorQARendersForegroundInterruptionAsRecoverableRiderState() {
        let app = XCUIApplication()
        app.launchArguments = [
            "--es80-passive-capture-simulator-qa",
            "--es80-capture-qa-scenario=foregroundInterrupted"
        ]
        app.launch()

        XCTAssertTrue(
            app.descendants(matching: .any)["es80.capture-shell"].waitForExistence(timeout: 5),
            "The real Capture shell must render the synthetic interruption state."
        )
        XCTAssertTrue(
            app.descendants(matching: .any)["es80.capture.simulator-qa"].waitForExistence(timeout: 3),
            "Synthetic interruption QA must remain visibly disclosed as Simulator-only."
        )
        XCTAssertTrue(
            app.staticTexts["Capture stopped safely"].waitForExistence(timeout: 3),
            "Foreground loss must present a calm, explicit stopped state."
        )
        XCTAssertTrue(
            app.staticTexts["Capture was interrupted when Nembra left the foreground. This synthetic run is no longer valid. Start a fresh Capture."].waitForExistence(timeout: 3),
            "The recovery explanation must be rider-readable and must not expose evidence-lifecycle jargon."
        )

        let restart = app.descendants(matching: .any)["es80.capture.restart-experiment"]
        XCTAssertTrue(restart.waitForExistence(timeout: 3))
        XCTAssertTrue(app.buttons["Start a fresh Capture"].exists)
        XCTAssertFalse(app.descendants(matching: .any)["es80.capture.begin-window"].exists)
        XCTAssertFalse(app.descendants(matching: .any)["es80.capture.finish"].exists)
        XCTAssertFalse(app.descendants(matching: .any)["es80.capture.share"].exists)
        XCTAssertFalse(app.buttons["Vehicle controls"].exists)

        let attachment = XCTAttachment(screenshot: app.screenshot())
        attachment.name = "Nembra Capture V14 — SIMULATOR QA — Foreground Interruption Recovery"
        attachment.lifetime = .keepAlways
        add(attachment)
    }

'''
          source = source.replace(marker, test + marker, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify effective source shape
        shell: bash
        run: |
          git diff --check
          grep -F 'foregroundInterrupted' NembraUITests/ES80ResearchCaptureUITests.swift >/dev/null
          grep -F 'Start a fresh Capture' NembraApp/Features/Research/ES80CaptureShellView.swift >/dev/null
          grep -F 'String(describing: error)' NembraApp/Features/Research/ES80CaptureShellView.swift >/dev/null || true

      - name: Commit product recovery repair and self-delete transformer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_es80_recovery_surface_qa.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift NembraUITests/ES80ResearchCaptureUITests.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRecoveryLanguageAcceptanceTests.swift
          git diff --cached --check
          git commit -m "Capture UX: close foreground interruption recovery surface"
          git push origin HEAD:product/es80-v14-recovery-surface-qa/gpt56-go
