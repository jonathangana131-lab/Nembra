name: Validate Current Apple Custody Contract

on:
  push:
    branches:
      - sol/v14-capture-current-apple-custody-contract-518fe
    paths:
      - .github/workflows/capture-current-apple-custody-contract.yml
      - scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-current-apple-custody-contract-518fe
          fetch-depth: 0
      - name: Guard exact product parent and test-only product scope
        shell: bash
        run: |
          set -euo pipefail
          parent='518fe048b11a1e666e04976a7f7bd4fcb1a4af69'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- scripts/field/install_one_time_capture.command
          git diff --quiet "$parent" HEAD -- NembraCapture.xcodeproj/project.pbxproj
          git diff --quiet "$parent" HEAD -- NembraCapture.entitlements
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-current-apple-custody-contract.yml' 'scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py' | sort)"
          test "$actual" = "$expected"
      - name: Run focused current-product custody contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check 518fe048b11a1e666e04976a7f7bd4fcb1a4af69...HEAD
