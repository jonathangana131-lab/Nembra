name: Capture Current Accepted Root ACL Transport Probe

on:
  pull_request:
    paths:
      - .github/workflows/capture-current-accepted-root-acl-transport-probe.yml
      - scripts/ci/capture_selected_xcode_build_orchestrator.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'integration/v17-capture-current-accepted-root-compiler-gpt56sol-20260815'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Probe legacy Darwin ACL descriptor and pathname shell transport
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          field_user="$(/usr/bin/id -un)"
          set +e
          output="$(/usr/bin/sudo -n env \
            NEMBRA_TEST_FIELD_USER="$field_user" \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -B -I - <<'PY' 2>&1
          from __future__ import annotations
          import importlib.util
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          repo = Path.cwd()
          helper_path = repo / 'scripts/ci/capture_selected_xcode_build_orchestrator.py'
          spec = importlib.util.spec_from_file_location('nembra_acl_probe', helper_path)
          if spec is None or spec.loader is None:
              raise SystemExit('could not load orchestrator')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)

          principal = os.environ['NEMBRA_TEST_FIELD_USER']
          outer = Path(tempfile.mkdtemp(prefix='nembra-acl-transport-', dir='/private/tmp'))
          os.chown(outer, 0, 0)
          os.chmod(outer, 0o700)
          descriptor = os.open(str(outer), os.O_RDONLY | getattr(os, 'O_DIRECTORY', 0))
          descriptor_path = f'/dev/fd/{descriptor}'

          def run(argv, *, pass_descriptor=False):
              completed = subprocess.run(
                  argv,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
                  pass_fds=((descriptor,) if pass_descriptor else ()),
              )
              return completed.returncode, completed.stdout, completed.stderr

          def listing(target, *, pass_descriptor=False):
              return run(['/bin/ls', '-Hlde', target], pass_descriptor=pass_descriptor)

          def emit(label, value):
              print(f'--- {label} ---')
              if isinstance(value, tuple):
                  code, stdout, stderr = value
                  print(f'rc={code}')
                  print('stdout=' + repr(stdout))
                  print('stderr=' + repr(stderr))
              else:
                  print(value)

          try:
              emit('principal', principal)
              emit('host-only helper acl', helper._acl_text(principal, True, True))
              emit('normal directory helper acl', helper._acl_text(principal, True, False))
              emit('before descriptor', listing(descriptor_path, pass_descriptor=True))
              emit('before pathname', listing(str(outer)))

              for rights in ('search', 'list,search', 'list,search,readattr,readextattr,readsecurity'):
                  acl = f'user:{principal} allow {rights}'
                  emit(f'descriptor +a {rights}', run(['/bin/chmod', '+a', acl, descriptor_path], pass_descriptor=True))
                  fd_after = listing(descriptor_path, pass_descriptor=True)
                  path_after = listing(str(outer))
                  emit(f'descriptor after {rights}', fd_after)
                  emit(f'pathname after descriptor {rights}', path_after)
                  emit(f'parser after descriptor {rights}', helper._principal_already_present(fd_after[1], principal))
                  emit(f'descriptor -a {rights}', run(['/bin/chmod', '-a', acl, descriptor_path], pass_descriptor=True))
                  emit(f'descriptor after remove {rights}', listing(descriptor_path, pass_descriptor=True))
                  run(['/bin/chmod', '-N', str(outer)])

              for rights in ('search', 'list,search', 'list,search,readattr,readextattr,readsecurity'):
                  acl = f'user:{principal} allow {rights}'
                  emit(f'pathname +a {rights}', run(['/bin/chmod', '+a', acl, str(outer)]))
                  path_after = listing(str(outer))
                  fd_after = listing(descriptor_path, pass_descriptor=True)
                  emit(f'pathname after {rights}', path_after)
                  emit(f'descriptor after pathname {rights}', fd_after)
                  emit(f'parser after pathname {rights}', helper._principal_already_present(path_after[1], principal))
                  emit(f'pathname -a {rights}', run(['/bin/chmod', '-a', acl, str(outer)]))
                  emit(f'pathname after remove {rights}', listing(str(outer)))
                  run(['/bin/chmod', '-N', str(outer)])
          finally:
              os.close(descriptor)
              shutil.rmtree(outer, ignore_errors=True)
          PY
          )"
          status=$?
          set -e
          printf '%s\n' "$output"
          detail="$(printf '%s\n' "$output" | tail -c 30000)"
          detail="${detail//'%'/'%25'}"
          detail="${detail//$'\r'/'%0D'}"
          detail="${detail//$'\n'/'%0A'}"
          printf '::warning file=scripts/ci/capture_selected_xcode_build_orchestrator.py,title=Legacy Darwin ACL shell transport remains diagnostic::%s\n' "$detail"
          # Legacy /dev/fd shell transport is known non-authorizing. Preserve its
          # evidence without forcing the newer native classifier red.
          exit "$status"

      - name: Classify native Darwin ACL views and prove exact original-object revoke
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          field_user="$(/usr/bin/id -un)"
          work="$(mktemp -d "$RUNNER_TEMP/nembra-native-acl.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          cat > "$work/acl_native.c" <<'C'
          #include <sys/types.h>
          #include <sys/acl.h>
          #include <errno.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static void die(const char *label) {
              fprintf(stderr, "%s: %s\n", label, strerror(errno));
              exit(2);
          }

          static char *read_all(const char *path) {
              FILE *f = fopen(path, "rb");
              if (!f) die("fopen");
              if (fseek(f, 0, SEEK_END) != 0) die("fseek");
              long n = ftell(f);
              if (n < 0) die("ftell");
              rewind(f);
              char *buf = calloc((size_t)n + 1, 1);
              if (!buf) die("calloc");
              if (n && fread(buf, 1, (size_t)n, f) != (size_t)n) die("fread");
              fclose(f);
              return buf;
          }

          static void print_acl(acl_t acl) {
              if (!acl) die("acl_get");
              ssize_t len = 0;
              char *text = acl_to_text(acl, &len);
              if (!text) die("acl_to_text");
              if (fwrite(text, 1, (size_t)len, stdout) != (size_t)len) die("fwrite");
              fputc('\n', stdout);
              acl_free(text);
              acl_free(acl);
          }

          int main(int argc, char **argv) {
              if (argc < 3) return 64;

              if (!strcmp(argv[1], "get-fd")) {
                  int fd = atoi(argv[2]);
                  print_acl(acl_get_fd(fd));
                  return 0;
              }

              if (!strcmp(argv[1], "get-path")) {
                  print_acl(acl_get_file(argv[2], ACL_TYPE_EXTENDED));
                  return 0;
              }

              if (!strcmp(argv[1], "set-fd")) {
                  if (argc != 4) return 64;
                  int fd = atoi(argv[2]);
                  char *text = read_all(argv[3]);
                  acl_t acl = acl_from_text(text);
                  if (!acl) {
                      int only_space = 1;
                      for (char *p = text; *p; ++p) {
                          if (*p != ' ' && *p != '\t' && *p != '\r' && *p != '\n') {
                              only_space = 0;
                              break;
                          }
                      }
                      if (!only_space) die("acl_from_text");
                      acl = acl_init(0);
                      if (!acl) die("acl_init");
                  }
                  if (acl_set_fd(fd, acl) != 0) die("acl_set_fd");
                  acl_free(acl);
                  free(text);
                  return 0;
              }

              return 64;
          }
          C
          /usr/bin/clang -Wall -Wextra -Werror "$work/acl_native.c" -o "$work/acl_native"

          /usr/bin/sudo -n env \
            NEMBRA_TEST_FIELD_USER="$field_user" \
            NEMBRA_ACL_NATIVE_TOOL="$work/acl_native" \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -B -I - <<'PY'
          from __future__ import annotations
          import os
          from pathlib import Path
          import shutil
          import stat
          import subprocess
          import tempfile

          principal = os.environ['NEMBRA_TEST_FIELD_USER']
          tool = Path(os.environ['NEMBRA_ACL_NATIVE_TOOL'])
          root = Path(tempfile.mkdtemp(prefix='nembra-native-acl-view-', dir='/private/tmp'))
          subject = root / 'accepted-root'
          moved = root / 'accepted-root.moved'
          subject.mkdir(mode=0o700)
          fd = os.open(str(subject), os.O_RDONLY | getattr(os, 'O_DIRECTORY', 0))

          def run(argv, *, pass_fd=False, check=True):
              completed = subprocess.run(
                  [str(x) for x in argv],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
                  pass_fds=((fd,) if pass_fd else ()),
              )
              if check and completed.returncode != 0:
                  raise SystemExit(
                      f"command failed rc={completed.returncode} argv={list(map(str, argv))!r} "
                      f"stdout={completed.stdout!r} stderr={completed.stderr!r}"
                  )
              return completed

          def identity_from_stat(value):
              return (value.st_dev, value.st_ino, stat.S_IFMT(value.st_mode))

          def require_same_object(path):
              fd_identity = identity_from_stat(os.fstat(fd))
              path_identity = identity_from_stat(os.stat(path, follow_symlinks=False))
              if fd_identity != path_identity:
                  raise SystemExit(
                      f'pathname/fd identity diverged: fd={fd_identity!r} path={path_identity!r}'
                  )

          try:
              require_same_object(subject)
              baseline_fd = run((tool, 'get-fd', fd), pass_fd=True).stdout
              baseline_path = run((tool, 'get-path', subject)).stdout
              baseline_file = root / 'baseline-path.acl'
              baseline_file.write_text(baseline_path, encoding='utf-8')
              shell_baseline = run(('/bin/ls', '-Hlde', subject)).stdout

              acl = f'user:{principal} allow list,search,readattr,readextattr,readsecurity'
              run(('/bin/chmod', '+a', acl, subject))
              require_same_object(subject)

              path_after_grant = run((tool, 'get-path', subject)).stdout
              fd_after_grant = run((tool, 'get-fd', fd), pass_fd=True).stdout
              shell_after_grant = run(('/bin/ls', '-Hlde', subject)).stdout
              if path_after_grant == baseline_path:
                  raise SystemExit('path-native ACL readback did not observe canonical-path grant')
              if shell_after_grant == shell_baseline or principal not in shell_after_grant:
                  raise SystemExit('shell pathname ACL readback did not observe canonical-path grant')

              fd_observed_grant = fd_after_grant != baseline_fd
              print(
                  'NEMBRA_NATIVE_ACL_VIEW '
                  'pathGrantObserved=true '
                  f'fdGrantObserved={str(fd_observed_grant).lower()} '
                  'identityStable=true'
              )

              subject.rename(moved)
              subject.mkdir(mode=0o700)
              replacement_before_native = run((tool, 'get-path', subject)).stdout
              replacement_before_shell = run(('/bin/ls', '-Hlde', subject)).stdout

              require_same_object(moved)
              run((tool, 'set-fd', fd, baseline_file), pass_fd=True)
              require_same_object(moved)

              moved_after_native = run((tool, 'get-path', moved)).stdout
              moved_after_shell = run(('/bin/ls', '-Hlde', moved)).stdout
              replacement_after_native = run((tool, 'get-path', subject)).stdout
              replacement_after_shell = run(('/bin/ls', '-Hlde', subject)).stdout

              if moved_after_native != baseline_path:
                  raise SystemExit(
                      'fd-native revoke did not restore exact path-native baseline on moved accepted object'
                  )
              if principal in moved_after_shell:
                  raise SystemExit('fd-native revoke left principal authority on moved accepted object')
              if replacement_after_native != replacement_before_native:
                  raise SystemExit('fd-native revoke changed attacker replacement native ACL')
              if replacement_after_shell != replacement_before_shell:
                  raise SystemExit('fd-native revoke changed attacker replacement shell ACL')

              print(
                  'NEMBRA_NATIVE_ACL_REVOKE '
                  'pathReplaced=true originalIdentityReproved=true '
                  'exactOriginalObjectRollback=true replacementUntouched=true'
              )
          finally:
              os.close(fd)
              shutil.rmtree(root, ignore_errors=True)
          PY

      - name: Preserve diagnostic-only boundary
        if: always()
        shell: bash
        run: echo 'NEMBRA_ACL_TRANSPORT_PROBE validationOnly=true productAuthorityChanged=false physicalAuthorityCreated=false'
