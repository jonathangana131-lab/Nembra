name: Capture Current Accepted Root ACL Transport Probe

on:
  pull_request:
    paths:
      - .github/workflows/capture-current-accepted-root-acl-transport-probe.yml
      - scripts/ci/capture_selected_xcode_build_orchestrator.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.head_ref == 'integration/v17-capture-current-accepted-root-compiler-gpt56sol-20260815' ||
      github.head_ref == 'repair/v17-capture-acl-transport-probe-sdk-wrapper-gpt56sol-20260818'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact diagnostic repair scope
        shell: bash
        env:
          REPAIR_PARENT: c489b96b8a42af60cbfcebb345b88660b2ec5317
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$REPAIR_PARENT" HEAD
          if [[ "${{ github.head_ref }}" == 'repair/v17-capture-acl-transport-probe-sdk-wrapper-gpt56sol-20260818' ]]; then
            actual="$(git diff --name-only "$REPAIR_PARENT"...HEAD)"
            test "$actual" = '.github/workflows/capture-current-accepted-root-acl-transport-probe.yml'
            git diff --check "$REPAIR_PARENT"...HEAD
          fi

      - name: Record xcode-27 ACL descriptor declarations
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
          echo "NEMBRA_NATIVE_ACL_SDK=$sdk"
          /usr/bin/grep -nE 'acl_(get|set|valid)_(fd|fd_np)' "$sdk/usr/include/sys/acl.h" || true

      - name: Classify native Darwin ACL views and prove exact original-object revoke
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          field_user="$(/usr/bin/id -un)"
          work="$(mktemp -d "$RUNNER_TEMP/nembra-native-acl.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          cat > "$work/acl_native.c" <<'C'
          #include <sys/types.h>
          #include <sys/acl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stdbool.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static void die(const char *label) {
              fprintf(stderr, "%s: %s\n", label, strerror(errno));
              exit(2);
          }

          static void fail(const char *message) {
              fprintf(stderr, "%s\n", message);
              exit(3);
          }

          static char *acl_text(acl_t acl) {
              ssize_t len = 0;
              char *raw = acl_to_text(acl, &len);
              if (!raw) die("acl_to_text");
              char *copy = calloc((size_t)len + 1, 1);
              if (!copy) die("calloc acl text");
              memcpy(copy, raw, (size_t)len);
              acl_free(raw);
              return copy;
          }

          static acl_t get_fd_acl(int fd) {
              acl_t acl = acl_get_fd(fd);
              if (!acl) die("acl_get_fd");
              return acl;
          }

          static acl_t get_path_acl(const char *path) {
              acl_t acl = acl_get_file(path, ACL_TYPE_EXTENDED);
              if (!acl) die("acl_get_file");
              return acl;
          }

          static void assert_same_object(int fd, const char *path, const char *label) {
              struct stat by_fd;
              struct stat by_path;
              if (fstat(fd, &by_fd) != 0) die("fstat");
              if (lstat(path, &by_path) != 0) die("lstat");
              if (by_fd.st_dev != by_path.st_dev ||
                  by_fd.st_ino != by_path.st_ino ||
                  ((by_fd.st_mode & S_IFMT) != (by_path.st_mode & S_IFMT))) {
                  fprintf(stderr, "%s: fd/path identity diverged\n", label);
                  exit(4);
              }
          }

          static void run_chmod(const char *operation, const char *acl, const char *path) {
              pid_t pid = fork();
              if (pid < 0) die("fork chmod");
              if (pid == 0) {
                  execl("/bin/chmod", "chmod", operation, acl, path, (char *)NULL);
                  _exit(127);
              }
              int status = 0;
              if (waitpid(pid, &status, 0) < 0) die("waitpid chmod");
              if (!WIFEXITED(status) || WEXITSTATUS(status) != 0) fail("chmod ACL operation failed");
          }

          static char *capture_ls(const char *path) {
              int pipefd[2];
              if (pipe(pipefd) != 0) die("pipe ls");
              pid_t pid = fork();
              if (pid < 0) die("fork ls");
              if (pid == 0) {
                  close(pipefd[0]);
                  if (dup2(pipefd[1], STDOUT_FILENO) < 0) _exit(126);
                  if (dup2(pipefd[1], STDERR_FILENO) < 0) _exit(126);
                  close(pipefd[1]);
                  execl("/bin/ls", "ls", "-Hlde", path, (char *)NULL);
                  _exit(127);
              }
              close(pipefd[1]);
              size_t cap = 4096;
              size_t used = 0;
              char *buffer = calloc(cap, 1);
              if (!buffer) die("calloc ls");
              for (;;) {
                  if (used + 2048 + 1 > cap) {
                      cap *= 2;
                      char *grown = realloc(buffer, cap);
                      if (!grown) die("realloc ls");
                      buffer = grown;
                  }
                  ssize_t n = read(pipefd[0], buffer + used, cap - used - 1);
                  if (n < 0) die("read ls");
                  if (n == 0) break;
                  used += (size_t)n;
                  buffer[used] = '\0';
              }
              close(pipefd[0]);
              int status = 0;
              if (waitpid(pid, &status, 0) < 0) die("waitpid ls");
              if (!WIFEXITED(status) || WEXITSTATUS(status) != 0) fail("ls ACL capture failed");
              return buffer;
          }

          int main(int argc, char **argv) {
              if (argc != 2) return 64;
              const char *principal = argv[1];
              char root_template[] = "/private/tmp/nembra-native-acl-probe.XXXXXX";
              char *root = mkdtemp(root_template);
              if (!root) die("mkdtemp");

              char subject[1024];
              char moved[1024];
              if (snprintf(subject, sizeof(subject), "%s/accepted-root", root) >= (int)sizeof(subject)) fail("subject path too long");
              if (snprintf(moved, sizeof(moved), "%s/accepted-root.moved", root) >= (int)sizeof(moved)) fail("moved path too long");
              if (mkdir(subject, 0700) != 0) die("mkdir subject");

              int fd = open(subject, O_RDONLY | O_DIRECTORY);
              if (fd < 0) die("open subject");
              assert_same_object(fd, subject, "pre-grant");

              acl_t baseline_fd_acl = get_fd_acl(fd);
              acl_t baseline_path_acl = get_path_acl(subject);
              char *baseline_path_text = acl_text(baseline_path_acl);
              char *baseline_shell = capture_ls(subject);

              char ace[1024];
              if (snprintf(ace, sizeof(ace), "user:%s allow list,search,readattr,readextattr,readsecurity", principal) >= (int)sizeof(ace)) fail("ACE too long");

              assert_same_object(fd, subject, "immediately-before-grant");
              run_chmod("+a", ace, subject);
              assert_same_object(fd, subject, "immediately-after-grant");

              acl_t after_path_acl = get_path_acl(subject);
              char *after_path_text = acl_text(after_path_acl);
              char *after_shell = capture_ls(subject);
              if (strcmp(after_path_text, baseline_path_text) == 0) fail("path-native ACL readback did not observe canonical-path grant");
              if (strcmp(after_shell, baseline_shell) == 0 || strstr(after_shell, principal) == NULL) fail("ls -Hlde did not observe canonical-path grant");

              if (rename(subject, moved) != 0) die("rename subject");
              if (mkdir(subject, 0700) != 0) die("mkdir replacement");

              acl_t replacement_before_acl = get_path_acl(subject);
              char *replacement_before_text = acl_text(replacement_before_acl);
              char *replacement_before_shell = capture_ls(subject);

              assert_same_object(fd, moved, "before-held-fd-restore");
              if (acl_set_fd(fd, baseline_fd_acl) != 0) die("acl_set_fd baseline restore");
              assert_same_object(fd, moved, "after-held-fd-restore");

              acl_t moved_after_acl = get_path_acl(moved);
              char *moved_after_text = acl_text(moved_after_acl);
              char *moved_after_shell = capture_ls(moved);
              acl_t replacement_after_acl = get_path_acl(subject);
              char *replacement_after_text = acl_text(replacement_after_acl);
              char *replacement_after_shell = capture_ls(subject);

              if (strcmp(moved_after_text, baseline_path_text) != 0) fail("held-fd revoke did not restore exact moved-object path-native baseline");
              if (strstr(moved_after_shell, principal) != NULL) fail("held-fd revoke left principal authority on moved accepted object");
              if (strcmp(replacement_after_text, replacement_before_text) != 0) fail("held-fd revoke changed attacker replacement native ACL");
              if (strcmp(replacement_after_shell, replacement_before_shell) != 0) fail("held-fd revoke changed attacker replacement shell ACL");

              printf("NEMBRA_NATIVE_ACL_REVOKE sdkWrappers=true pathGrantObserved=true originalIdentityReproved=true exactOriginalObjectRollback=true replacementUntouched=true physicalAuthorityCreated=false\n");

              acl_free(baseline_fd_acl);
              free(baseline_path_text);
              free(baseline_shell);
              free(after_path_text);
              free(after_shell);
              free(replacement_before_text);
              free(replacement_before_shell);
              free(moved_after_text);
              free(moved_after_shell);
              free(replacement_after_text);
              free(replacement_after_shell);
              close(fd);
              rmdir(subject);
              rmdir(moved);
              rmdir(root);
              return 0;
          }
          C

          /usr/bin/clang -Wall -Wextra -Werror "$work/acl_native.c" -o "$work/acl_native"
          /usr/bin/sudo -n "$work/acl_native" "$field_user"

      - name: Preserve diagnostic-only boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'NEMBRA_ACL_TRANSPORT_PROBE validationOnly=true productAuthorityChanged=false physicalAuthorityCreated=false'
