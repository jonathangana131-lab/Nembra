name: V14 Capture Binary Procedure Rendezvous Materialize

on:
  push:
    branches:
      - repair/v14-capture-binary-procedure-rendezvous-gpt56sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-binary-procedure-rendezvous-gpt56sol
          fetch-depth: 0

      - name: Materialize and prove binary-bound procedure authority
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/materialize_capture_binary_procedure_rendezvous_v14.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check

          identity='NembraApp/App/NembraCaptureBuildIdentity.swift'
          entrypoint='NembraApp/App/NembraCaptureEntrypoint.swift'
          project='NembraCapture.xcodeproj/project.pbxproj'
          installer='scripts/field/install_one_time_capture.command'
          workflow='.github/workflows/capture-field-build-provenance.yml'
          testfile='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift'

          grep -Fq 'static let fieldProcedureIdentifierInfoKey = "NembraCaptureProcedureIdentifier"' "$identity"
          grep -Fq 'let compiledProcedureIdentifier: String' "$identity"
          grep -Fq 'compiledProcedureIdentifier == Self.fieldProcedureIdentifier' "$identity"
          grep -Fq 'var fieldProcedureIdentifier: String { buildIdentity.compiledProcedureIdentifier }' "$entrypoint"
          grep -Fq 'procedureIdentifier: buildIdentity.compiledProcedureIdentifier' "$entrypoint"
          test "$(grep -Fc 'INFOPLIST_KEY_NembraCaptureProcedureIdentifier = "$(NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER)";' "$project")" = '2'
          grep -Fq '"NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER=$PROCEDURE_ID"' "$installer"
          grep -Fq 'plutil -extract NembraCaptureProcedureIdentifier raw -o - "$APP_INFO_PLIST"' "$installer"
          grep -Fq '[[ "$BUILT_PROCEDURE_IDENTIFIER" == "$PROCEDURE_ID" ]]' "$installer"
          grep -Fq 'NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER="ES80-AUTHENTICATED-STATIONARY-v1"' "$workflow"
          grep -Fq 'plutil -extract NembraCaptureProcedureIdentifier raw -o - "$plist"' "$workflow"
          grep -Fq 'procedureIdentifier: buildIdentity.compiledProcedureIdentifier' "$testfile"
          ! grep -Fq 'procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier' "$entrypoint"

      - name: Preserve workflow blob at a non-workflow path
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/capture-field-build-provenance.yml Scripts/capture_field_build_provenance.binary_procedure.generated.yml
          git checkout -- .github/workflows/capture-field-build-provenance.yml
          git diff --check

      - name: Commit only validated non-workflow product blobs
        shell: bash
        run: |
          set -euo pipefail
          git add \
            NembraApp/App/NembraCaptureBuildIdentity.swift \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            NembraCapture.xcodeproj/project.pbxproj \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift \
            scripts/field/install_one_time_capture.command \
            Scripts/capture_field_build_provenance.binary_procedure.generated.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): bind stationary procedure to built binary'
          git push origin HEAD:repair/v14-capture-binary-procedure-rendezvous-gpt56sol
