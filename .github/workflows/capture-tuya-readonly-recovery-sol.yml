name: Capture Tuya read-only recovery Sol

on:
  push:
    branches:
      - capture/tuya-readonly-preflight-recovery-sol-20260814

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/tuya-readonly-preflight-recovery-sol-20260814
          fetch-depth: 0

      - name: Apply deterministic app truth repair
        shell: bash
        run: |
          set -euo pipefail
          APP=NembraApp/App/NembraCaptureEntrypoint.swift
          if grep -q 'mirrorAlreadyTerminalIncompleteObservationHorizon' "$APP" \
             && ! grep -q 'markApplicationObservationTimedOut(for: token)' "$APP" \
             && grep -q 'Repeated application evidence' "$APP" \
             && grep -q 'applicationEvidenceSurvivedHistoricalWindow' "$APP"; then
            echo 'Capture app truth repair already present.'
          else
            python3 scripts/capture_tuya_readonly_recovery_sol.py
          fi
          git diff --check

      - name: Run focused Capture truth contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaAppIncompleteHorizonTerminalSourceTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaAuthenticatedReadOnlyHorizonTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaAuthenticatedReadOnlySessionLedgerTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaAuthenticatedTerminalHorizonTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaDeviceSharingAuthenticationAuthorityTests

      - name: Publish recovery product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          if git diff --cached --quiet; then
            echo 'No product diff to publish.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix(capture-app): mirror package-owned incomplete horizon'
          git push origin HEAD:capture/tuya-readonly-preflight-recovery-sol-20260814
