          contract = "\n".join(line[10:] if line.startswith("          ") else line for line in contract.splitlines()) + "\n"

          permanent_workflow = r'''name: Capture Full Numeric Principal Production

          on:
            pull_request:
              paths:
                - scripts/ci/capture_signed_app_build_origin_custody.py
                - scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
                - scripts/ci/tests/test_capture_full_numeric_principal_production.py
                - .github/workflows/capture-full-numeric-principal-production.yml
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: capture-full-numeric-principal-production-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          env:
            EXACT_PARENT: c2211115ccc1bbe8a5dedff1544f1de73277c65d

          jobs:
            portable-contract:
              runs-on: ubuntu-latest
              timeout-minutes: 8
              steps:
                - uses: actions/checkout@v6
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0
                    persist-credentials: false
                - name: Bind exact serial delta
                  shell: bash
                  run: |
                    set -euo pipefail
                    expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "$expected_head"
                    test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
                    changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
                    expected="$(printf '%s\n' \
                      .github/workflows/capture-full-numeric-principal-production.yml \
                      scripts/ci/capture_signed_app_build_origin_custody.py \
                      scripts/ci/tests/test_capture_full_numeric_principal_production.py \
                      scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py | LC_ALL=C sort)"
                    test "$changed" = "$expected"
                    git diff --check "$EXACT_PARENT"...HEAD
                    test -z "$(git status --porcelain=v1 --untracked-files=all)"
                - name: Compile without workspace artifacts
                  shell: bash
                  run: |
                    set -euo pipefail
                    /usr/bin/python3 -B -I - <<'PY'
                    from pathlib import Path
                    for raw in (
                        "scripts/ci/capture_signed_app_build_origin_custody.py",
                        "scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py",
                        "scripts/ci/tests/test_capture_full_numeric_principal_production.py",
                    ):
                        path = Path(raw)
                        compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
                    PY
                - name: Run production authority regressions
                  shell: bash
                  run: |
                    set -euo pipefail
                    export PYTHONDONTWRITEBYTECODE=1
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_full_numeric_principal_production.py
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
                    test -z "$(git status --porcelain=v1 --untracked-files=all)"

            macos-runtime:
              runs-on: macos-15
              timeout-minutes: 8
              steps:
                - uses: actions/checkout@v6
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0
                    persist-credentials: false
                - name: Exercise production full credential scanner on current Darwin
                  shell: bash
                  run: |
                    set -euo pipefail
                    export PYTHONDONTWRITEBYTECODE=1
                    /usr/bin/python3 -B -I - <<'PY'
                    import importlib.util
                    import os
                    from pathlib import Path
                    import tempfile

                    path = Path("scripts/ci/capture_signed_app_build_origin_custody.py").resolve()
                    spec = importlib.util.spec_from_file_location("nembra_full_numeric_runtime", path)
                    if spec is None or spec.loader is None:
                        raise SystemExit("could not load production helper")
                    helper = importlib.util.module_from_spec(spec)
                    spec.loader.exec_module(helper)
                    uid = os.getuid()
                    gid = os.getgid()
                    if uid <= 0 or gid <= 0:
                        raise SystemExit("runtime witness requires ordinary macOS runner identity")
                    with tempfile.TemporaryDirectory(prefix="nembra-full-principal-runtime.") as raw:
                        root = Path(raw)
                        scanner = helper._compile_numeric_principal_group_scanner(root)
                        uid_matches = helper._full_numeric_principal_matches(scanner, uid)
                        gid_matches = helper._full_numeric_principal_matches(scanner, gid)
                        pid = os.getpid()
                        if pid not in uid_matches:
                            raise SystemExit(f"production scanner missed witness UID slots: pid={pid} matches={uid_matches}")
                        if pid not in gid_matches:
                            raise SystemExit(f"production scanner missed witness GID/group slots: pid={pid} matches={gid_matches}")
                        free = None
                        for candidate in range(52000, 62000):
                            if helper._id_in_use(candidate):
                                continue
                            if not helper._full_numeric_principal_matches(scanner, candidate):
                                free = candidate
                                break
                        if free is None:
                            raise SystemExit("production scanner found no credential-free high numeric principal")
                        print(
                            "NEMBRA_FULL_NUMERIC_PRINCIPAL_RUNTIME "
                            f"uidSlotsObserved=true gidSlotsObserved=true processFreeCandidate={free} "
                            "directoryServicesMutated=false sudoUsed=false deviceTouched=false "
                            "bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false "
                            "physicalAuthorityCreated=false"
                        )
                    PY
                    test -z "$(git status --porcelain=v1 --untracked-files=all)"
          '''
          permanent_workflow = "\n".join(line[10:] if line.startswith("          ") else line for line in permanent_workflow.splitlines()) + "\n"

          helper_path.write_text(helper, encoding="utf-8")
          test_path.write_text(tests, encoding="utf-8")
