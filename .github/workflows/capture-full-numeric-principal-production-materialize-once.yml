          Path(".github/workflows/capture-full-numeric-principal-production.yml").write_text(permanent_workflow, encoding="utf-8")

          for path in (
              helper_path,
              test_path,
              Path("scripts/ci/tests/test_capture_full_numeric_principal_production.py"),
          ):
