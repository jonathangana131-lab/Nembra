name: Capture Full Numeric Principal Production Materialize Once

on:
  pull_request:
    paths:
      - .github/workflows/capture-full-numeric-principal-production-materialize-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-full-numeric-principal-production-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  EXACT_PARENT: c2211115ccc1bbe8a5dedff1544f1de73277c65d

jobs:
  materialize:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind one-shot authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = ".github/workflows/capture-full-numeric-principal-production-materialize-once.yml"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize full credential admission and retirement
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path

          helper_path = Path("scripts/ci/capture_signed_app_build_origin_custody.py")
          test_path = Path("scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py")
          helper = helper_path.read_text(encoding="utf-8")
          tests = test_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              begin = text.find(start)
              if begin < 0:
                  raise SystemExit(f"{label}: start anchor missing")
              finish = text.find(end, begin)
              if finish < 0:
                  raise SystemExit(f"{label}: end anchor missing")
              return text[:begin] + replacement + text[finish:]

          identity_block = r'''PROCESS_CREDENTIAL_GROUP_LIST = 1 << 6
          PROCESS_CREDENTIAL_RUID = 1 << 0
          PROCESS_CREDENTIAL_EUID = 1 << 1
          PROCESS_CREDENTIAL_SVUID = 1 << 2
          PROCESS_CREDENTIAL_RGID = 1 << 3
          PROCESS_CREDENTIAL_EGID = 1 << 4
          PROCESS_CREDENTIAL_SVGID = 1 << 5
          PROCESS_CREDENTIAL_PID_MARKER = "NEMBRA_KERN_PROC_PID="
          PROCESS_CREDENTIAL_MATCH_MARKER = "NEMBRA_PROCESS_CREDENTIAL_MATCH="

          PROCESS_CREDENTIAL_GROUP_SCANNER_SOURCE = r"""
          #include <sys/types.h>
          #include <sys/param.h>
          #include <sys/sysctl.h>
          #include <errno.h>
          #include <inttypes.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          #define GROUP_LIST_BIT (1u << 6)

          static void die(const char *message) {
              fprintf(stderr, "credential inventory error: %s (errno=%d: %s)\n", message, errno, strerror(errno));
              exit(70);
          }

          static struct kinfo_proc *snapshot_processes(size_t *count_out) {
              int mib[3] = {CTL_KERN, KERN_PROC, KERN_PROC_ALL};
              for (int attempt = 0; attempt < 8; ++attempt) {
                  size_t needed = 0;
                  if (sysctl(mib, 3, NULL, &needed, NULL, 0) != 0) {
                      die("KERN_PROC_ALL size query failed");
                  }
                  if (needed == 0) {
                      fprintf(stderr, "credential inventory error: KERN_PROC_ALL returned zero bytes\n");
                      exit(70);
                  }
                  size_t capacity = needed + (32u * sizeof(struct kinfo_proc));
                  struct kinfo_proc *entries = calloc(1, capacity);
                  if (entries == NULL) {
                      die("could not allocate KERN_PROC_ALL buffer");
                  }
                  size_t actual = capacity;
                  if (sysctl(mib, 3, entries, &actual, NULL, 0) == 0) {
                      if (actual == 0 || actual % sizeof(struct kinfo_proc) != 0) {
                          free(entries);
                          fprintf(stderr, "credential inventory error: KERN_PROC_ALL byte count is unclassifiable\n");
                          exit(70);
                      }
                      *count_out = actual / sizeof(struct kinfo_proc);
                      return entries;
                  }
                  int saved_errno = errno;
                  free(entries);
                  if (saved_errno != ENOMEM) {
                      errno = saved_errno;
                      die("KERN_PROC_ALL snapshot failed");
                  }
              }
              fprintf(stderr, "credential inventory error: KERN_PROC_ALL did not converge after retries\n");
              exit(70);
          }

          int main(int argc, char **argv) {
              if (argc != 2) {
                  fprintf(stderr, "usage: %s NUMERIC_ID\n", argv[0]);
                  return 64;
              }
              char *end = NULL;
              errno = 0;
              unsigned long parsed = strtoul(argv[1], &end, 10);
              if (errno != 0 || end == argv[1] || *end != '\0' || parsed > UINT32_MAX) {
                  fprintf(stderr, "invalid numeric principal: %s\n", argv[1]);
                  return 64;
              }
              uint32_t candidate = (uint32_t)parsed;
              if (candidate == 0) {
                  fprintf(stderr, "root numeric principal is never admissible\n");
                  return 64;
              }

              size_t count = 0;
              struct kinfo_proc *entries = snapshot_processes(&count);
              for (size_t index = 0; index < count; ++index) {
                  const struct kinfo_proc *entry = &entries[index];
                  const struct _ucred *ucred = &entry->kp_eproc.e_ucred;
                  pid_t pid = entry->kp_proc.p_pid;
                  if (pid < 0) {
                      free(entries);
                      fprintf(stderr, "credential inventory error: invalid pid in KERN_PROC_ALL\n");
                      return 70;
                  }
                  if (ucred->cr_ngroups <= 0 || ucred->cr_ngroups > NGROUPS) {
                      free(entries);
                      fprintf(stderr, "credential inventory error: pid=%d has invalid group count=%d\n",
                              pid, (int)ucred->cr_ngroups);
                      return 70;
                  }
                  printf("NEMBRA_KERN_PROC_PID=%d\n", pid);
                  for (int group_index = 0; group_index < ucred->cr_ngroups; ++group_index) {
                      if ((uint32_t)ucred->cr_groups[group_index] == candidate) {
                          printf("NEMBRA_PROCESS_CREDENTIAL_MATCH=%d,%u\n", pid, GROUP_LIST_BIT);
                          break;
                      }
                  }
              }
              free(entries);
              return 0;
          }
          """


def _id_in_use(candidate: int) -> bool:
              try:
                  pwd.getpwuid(candidate)
                  return True
              except KeyError:
                  pass
              try:
                  grp.getgrgid(candidate)
                  return True
              except KeyError:
                  return False


def _process_state_for_uid(uid: int) -> tuple[tuple[int, ...], tuple[int, ...]]:
              """Legacy effective-UID diagnostic; never sufficient for production admission."""
              if uid <= 0:
                  raise BuildOriginCustodyError("cannot inspect process authority for root or invalid UID")
              completed = subprocess.run(
                  ["/bin/ps", "-axo", "pid=,uid=,state="],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              if completed.returncode != 0:
                  detail = (completed.stderr or "").strip()
                  raise BuildOriginCustodyError(
                      "could not inspect numeric build-principal process authority"
                      + (f": {detail[-1000:]}" if detail else "")
                  )
              live: list[int] = []
              zombies: list[int] = []
              for raw_line in completed.stdout.splitlines():
                  line = raw_line.strip()
                  if not line:
                      continue
                  parts = line.split()
                  if len(parts) != 3:
                      raise BuildOriginCustodyError("process authority inventory was malformed")
                  try:
                      pid = int(parts[0])
                      owner = int(parts[1])
                  except ValueError as error:
                      raise BuildOriginCustodyError(
                          "process authority inventory contained non-numeric identity"
                      ) from error
                  if pid <= 0 or owner < 0 or not parts[2]:
                      raise BuildOriginCustodyError("process authority inventory contained invalid identity/state")
                  if owner != uid:
                      continue
                  if parts[2].upper().startswith("Z"):
                      zombies.append(pid)
                  else:
                      live.append(pid)
              return tuple(sorted(live)), tuple(sorted(zombies))


def _compile_numeric_principal_group_scanner(directory: Path) -> Path:
              if sys.platform != "darwin":
                  raise BuildOriginCustodyError("full numeric-principal inventory requires macOS")
              try:
                  metadata = directory.lstat()
              except OSError as error:
                  raise BuildOriginCustodyError("numeric-principal inventory directory is unavailable") from error
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                  raise BuildOriginCustodyError("numeric-principal inventory root is not one real directory")
              source = directory / "process-credential-group-scanner.c"
              binary = directory / "process-credential-group-scanner"
              source.write_text(PROCESS_CREDENTIAL_GROUP_SCANNER_SOURCE, encoding="utf-8")
              os.chmod(source, 0o600, follow_symlinks=False)
              completed = subprocess.run(
                  [
                      "/usr/bin/clang",
                      "-std=c11",
                      "-O2",
                      "-Wall",
                      "-Wextra",
                      "-Werror",
                      str(source),
                      "-o",
                      str(binary),
                  ],
                  env={"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "LANG": "C", "LC_ALL": "C"},
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              try:
                  source.unlink()
              except OSError as error:
                  raise BuildOriginCustodyError("could not retire numeric-principal scanner source") from error
              if completed.returncode != 0:
                  detail = ((completed.stdout or "") + "\n" + (completed.stderr or "")).strip()
                  raise BuildOriginCustodyError(
                      "could not compile full numeric-principal credential scanner"
                      + (f": {detail[-1600:]}" if detail else "")
                  )
              try:
                  result = binary.lstat()
              except OSError as error:
                  raise BuildOriginCustodyError("numeric-principal scanner binary is unavailable") from error
              if stat.S_ISLNK(result.st_mode) or not stat.S_ISREG(result.st_mode):
                  raise BuildOriginCustodyError("numeric-principal scanner binary is not one real regular file")
              os.chmod(binary, 0o700, follow_symlinks=False)
              return binary


def _kernel_group_snapshot(group_scanner: Path, candidate: int) -> tuple[set[int], dict[int, int]]:
              if candidate <= 0:
                  raise BuildOriginCustodyError("root or invalid numeric principal is never admissible")
              completed = subprocess.run(
                  [str(group_scanner), str(candidate)],
                  env={"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "LANG": "C", "LC_ALL": "C"},
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              if completed.returncode != 0:
                  detail = ((completed.stdout or "") + "\n" + (completed.stderr or "")).strip()
                  raise BuildOriginCustodyError(
                      "KERN_PROC_ALL supplementary-group inventory failed"
                      + (f": {detail[-1600:]}" if detail else "")
                  )
              pids: set[int] = set()
              matches: dict[int, int] = {}
              for raw_line in completed.stdout.splitlines():
                  if raw_line.startswith(PROCESS_CREDENTIAL_PID_MARKER):
                      try:
                          pid = int(raw_line[len(PROCESS_CREDENTIAL_PID_MARKER):], 10)
                      except ValueError as error:
                          raise BuildOriginCustodyError("kernel credential scanner emitted non-numeric PID") from error
                      if pid < 0 or pid in pids:
                          raise BuildOriginCustodyError("kernel credential scanner emitted invalid/duplicate PID")
                      pids.add(pid)
                  elif raw_line.startswith(PROCESS_CREDENTIAL_MATCH_MARKER):
                      fields = raw_line[len(PROCESS_CREDENTIAL_MATCH_MARKER):].split(",")
                      if len(fields) != 2:
                          raise BuildOriginCustodyError("kernel credential scanner emitted malformed match")
                      try:
                          pid = int(fields[0], 10)
                          slots = int(fields[1], 10)
                      except ValueError as error:
                          raise BuildOriginCustodyError("kernel credential scanner emitted non-numeric match") from error
                      if pid < 0 or slots != PROCESS_CREDENTIAL_GROUP_LIST:
                          raise BuildOriginCustodyError("kernel credential scanner emitted invalid group match")
                      matches[pid] = matches.get(pid, 0) | slots
                  elif raw_line.strip():
                      raise BuildOriginCustodyError("kernel credential scanner emitted unknown output")
              if not pids or not set(matches).issubset(pids):
                  raise BuildOriginCustodyError("kernel credential scanner did not produce one coherent PID snapshot")
              return pids, matches


def _ps_scalar_snapshot(candidate: int) -> tuple[set[int], dict[int, int]]:
              completed = subprocess.run(
                  [
                      "/bin/ps", "-A",
                      "-o", "pid=",
                      "-o", "uid=",
                      "-o", "ruid=",
                      "-o", "svuid=",
                      "-o", "gid=",
                      "-o", "rgid=",
                      "-o", "svgid=",
                  ],
                  env={"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "LANG": "C", "LC_ALL": "C"},
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              if completed.returncode != 0:
                  detail = (completed.stderr or "").strip()
                  raise BuildOriginCustodyError(
                      "system ps full credential inventory failed"
                      + (f": {detail[-1600:]}" if detail else "")
                  )
              pids: set[int] = set()
              matches: dict[int, int] = {}
              for raw_line in completed.stdout.splitlines():
                  fields = raw_line.split()
                  if len(fields) != 7:
                      raise BuildOriginCustodyError("system ps emitted malformed full credential row")
                  try:
                      pid, euid, ruid, svuid, egid, rgid, svgid = [int(field, 10) for field in fields]
                  except ValueError as error:
                      raise BuildOriginCustodyError("system ps emitted non-numeric full credential row") from error
                  if pid <= 0 or min(euid, ruid, svuid, egid, rgid, svgid) < 0 or pid in pids:
                      raise BuildOriginCustodyError("system ps emitted invalid/duplicate full credential row")
                  pids.add(pid)
                  slots = 0
                  if ruid == candidate:
                      slots |= PROCESS_CREDENTIAL_RUID
                  if euid == candidate:
                      slots |= PROCESS_CREDENTIAL_EUID
                  if svuid == candidate:
                      slots |= PROCESS_CREDENTIAL_SVUID
                  if rgid == candidate:
                      slots |= PROCESS_CREDENTIAL_RGID
                  if egid == candidate:
                      slots |= PROCESS_CREDENTIAL_EGID
                  if svgid == candidate:
                      slots |= PROCESS_CREDENTIAL_SVGID
                  if slots:
                      matches[pid] = slots
              if not pids:
                  raise BuildOriginCustodyError("system ps emitted no process IDs")
              return pids, matches


def _pid_still_exists(pid: int) -> bool:
              if pid <= 0:
                  raise BuildOriginCustodyError("PID liveness probe requires one positive PID")
              try:
                  os.kill(pid, 0)
              except ProcessLookupError:
                  return False
              except PermissionError:
                  return True
              except OSError as error:
                  if error.errno == errno.ESRCH:
                      return False
                  if error.errno == errno.EPERM:
                      return True
                  raise BuildOriginCustodyError(
                      f"process-existence probe failed pid={pid} errno={error.errno}"
                  ) from error
              return True


def _full_numeric_principal_matches(group_scanner: Path, candidate: int) -> dict[int, int]:
              if candidate <= 0:
                  raise BuildOriginCustodyError("root or invalid numeric principal is never admissible")
              for attempt in range(8):
                  kernel_pids, group_matches = _kernel_group_snapshot(group_scanner, candidate)
                  ps_pids, scalar_matches = _ps_scalar_snapshot(candidate)
                  # Current Darwin includes kernel PID 0 in KERN_PROC_ALL while /bin/ps omits it.
                  # Keep PID 0's supplementary-group collision authority, but never probe kill(0, 0).
                  persistent_kernel_only = sorted(
                      pid for pid in kernel_pids - ps_pids if pid > 0 and _pid_still_exists(pid)
                  )
                  persistent_ps_only = sorted(
                      pid for pid in ps_pids - kernel_pids if _pid_still_exists(pid)
                  )
                  if persistent_kernel_only or persistent_ps_only:
                      if attempt == 7:
                          raise BuildOriginCustodyError(
                              "KERN_PROC_ALL/ps credential snapshots did not converge for live processes: "
                              f"kernel_only={persistent_kernel_only[:24]} ps_only={persistent_ps_only[:24]}"
                          )
                      continue
                  matches = dict(group_matches)
                  for pid, slots in scalar_matches.items():
                      matches[pid] = matches.get(pid, 0) | slots
                  return matches
              raise BuildOriginCustodyError("full numeric-principal credential snapshots did not converge")


def _numeric_principal_in_use(candidate: int, group_scanner: Path) -> bool:
              if candidate <= 0 or _id_in_use(candidate):
                  return True
              return bool(_full_numeric_principal_matches(group_scanner, candidate))


def _choose_ephemeral_id(group_scanner: Path) -> int:
              start = 52000 + (os.getpid() % 7000)
              for candidate in range(start, 62000):
                  if not _numeric_principal_in_use(candidate, group_scanner):
                      return candidate
              for candidate in range(52000, start):
                  if not _numeric_principal_in_use(candidate, group_scanner):
                      return candidate
              raise BuildOriginCustodyError("could not allocate one fully isolated ephemeral build UID/GID")


'''
          helper = replace_between(
              helper,
              "def _id_in_use(candidate: int) -> bool:\n",
              "def _run_root_checked(argv: Sequence[str]) -> subprocess.CompletedProcess[str]:\n",
              identity_block,
              "identity inventory block",
          )

          retirement_block = r'''def _identity_lookup_survivors(name: str, uid: int) -> tuple[str, ...]:
              survivors: list[str] = []
              checks = (
                  (pwd.getpwnam, name, "build user name"),
                  (pwd.getpwuid, uid, "build user UID"),
                  (grp.getgrnam, name, "build group name"),
                  (grp.getgrgid, uid, "build group GID"),
              )
              for lookup, key, label in checks:
                  try:
                      lookup(key)
                  except KeyError:
                      continue
                  survivors.append(label)
              return tuple(survivors)


def _wait_for_no_live_uid(uid: int, *, timeout: float = 6.0) -> tuple[int, ...]:
              """Legacy effective-UID diagnostic retained for focused regression only."""
              if uid <= 0:
                  raise BuildOriginCustodyError("cannot verify process retirement for a missing build UID")
              deadline = time.monotonic() + timeout
              latest_live: tuple[int, ...] = ()
              latest_zombies: tuple[int, ...] = ()
              while True:
                  latest_live, latest_zombies = _process_state_for_uid(uid)
                  if not latest_live:
                      return latest_zombies
                  if time.monotonic() >= deadline:
                      raise BuildOriginCustodyError(
                          "live build-principal processes survived legacy UID diagnostic: "
                          f"live_pids={list(latest_live)} zombie_pids={list(latest_zombies)}"
                      )
                  time.sleep(0.05)


def _wait_for_numeric_principal_clear(
              group_scanner: Path,
              uid: int,
              *,
              timeout: float = 6.0,
          ) -> None:
              if uid <= 0:
                  raise BuildOriginCustodyError("cannot verify full retirement for a missing build UID/GID")
              deadline = time.monotonic() + timeout
              latest: dict[int, int] = {}
              while True:
                  latest = _full_numeric_principal_matches(group_scanner, uid)
                  if not latest:
                      return
                  if time.monotonic() >= deadline:
                      raise BuildOriginCustodyError(
                          "numeric build principal survived full credential retirement: "
                          f"matches={dict(sorted(latest.items()))}"
                      )
                  time.sleep(0.05)


def _direct_local_identity_record_exists(kind: str, name: str) -> bool:
              completed = subprocess.run(
                  ["/usr/bin/dscl", ".", "-read", f"/{kind}/{name}"],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              detail = ((completed.stdout or "") + "\n" + (completed.stderr or "")).strip()
              if completed.returncode == 0:
                  return True
              if "eDSRecordNotFound" in detail or "-14136" in detail:
                  return False
              raise BuildOriginCustodyError(
                  f"could not classify direct Directory Services {kind} record: "
                  f"rc={completed.returncode} detail={detail[-800:]!r}"
              )


def _assert_local_build_identity_retired(
              name: str,
              uid: int,
              group_scanner: Path,
              *,
              timeout: float = 6.0,
          ) -> None:
              if uid <= 0:
                  raise BuildOriginCustodyError("cannot verify retirement for a missing build UID/GID")
              deadline = time.monotonic() + timeout
              latest_matches: dict[int, int] = {}
              latest_user_record = True
              latest_group_record = True
              while True:
                  latest_matches = _full_numeric_principal_matches(group_scanner, uid)
                  latest_user_record = _direct_local_identity_record_exists("Users", name)
                  latest_group_record = _direct_local_identity_record_exists("Groups", name)
                  if not latest_matches and not latest_user_record and not latest_group_record:
                      return
                  if time.monotonic() >= deadline:
                      break
                  subprocess.run(
                      ["/usr/bin/dscacheutil", "-flushcache"],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                  )
                  time.sleep(0.05)
              raise BuildOriginCustodyError(
                  "ephemeral build destructive authority survived retirement: "
                  f"credential_matches={dict(sorted(latest_matches.items()))} "
                  f"user_record={latest_user_record} group_record={latest_group_record}"
              )


def _remove_local_build_identity(
              name: str,
              uid: int | None,
              *,
              group_scanner: Path | None = None,
              require_absent: bool = False,
          ) -> None:
              if sys.platform != "darwin":
                  return
              if require_absent and (uid is None or uid <= 0 or group_scanner is None):
                  raise BuildOriginCustodyError(
                      "strict retirement requires one build UID/GID and full credential scanner"
                  )
              if uid is not None and uid > 0:
                  killed = subprocess.run(
                      ["/usr/bin/pkill", "-9", "-u", str(uid), ".*"],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                  )
                  if require_absent and killed.returncode not in (0, 1):
                      raise BuildOriginCustodyError(
                          f"could not request initial build-principal process retirement: pkill exit {killed.returncode}"
                      )
              if require_absent:
                  assert uid is not None and group_scanner is not None
                  # Do not delete the Directory Services reservation while any process still
                  # carries this integer as real/effective/saved UID/GID or supplementary GID.
                  _wait_for_numeric_principal_clear(group_scanner, uid)
              subprocess.run(
                  ["/usr/bin/dscl", ".", "-delete", f"/Users/{name}"],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              subprocess.run(
                  ["/usr/bin/dscl", ".", "-delete", f"/Groups/{name}"],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              subprocess.run(["/usr/bin/dscacheutil", "-flushcache"], check=False)
              if require_absent:
                  assert uid is not None and group_scanner is not None
                  final_kill = subprocess.run(
                      ["/usr/bin/pkill", "-9", "-u", str(uid), ".*"],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                  )
                  if final_kill.returncode not in (0, 1):
                      raise BuildOriginCustodyError(
                          f"could not request final build-principal process retirement: pkill exit {final_kill.returncode}"
                      )
                  _wait_for_numeric_principal_clear(group_scanner, uid)
                  _assert_local_build_identity_retired(name, uid, group_scanner)


'''
          helper = replace_between(
              helper,
              "def _identity_lookup_survivors(name: str, uid: int) -> tuple[str, ...]:\n",
              "def _create_local_build_identity(name: str, uid: int, gid: int, home: Path) -> None:\n",
              retirement_block,
              "retirement block",
          )

          helper = replace_once(
              helper,
