              return module

          class CaptureFullNumericPrincipalProductionTests(unittest.TestCase):
              def test_full_inventory_merges_pid0_group_and_all_scalar_slots(self) -> None:
                  helper = load()
                  scanner = Path("/private/tmp/scanner")
                  kernel = ({0, 100, 200}, {0: helper.PROCESS_CREDENTIAL_GROUP_LIST, 200: helper.PROCESS_CREDENTIAL_GROUP_LIST})
                  scalar = ({100, 200}, {100: helper.PROCESS_CREDENTIAL_RUID | helper.PROCESS_CREDENTIAL_EUID | helper.PROCESS_CREDENTIAL_SVUID, 200: helper.PROCESS_CREDENTIAL_RGID | helper.PROCESS_CREDENTIAL_EGID | helper.PROCESS_CREDENTIAL_SVGID})
                  with (
                      mock.patch.object(helper, "_kernel_group_snapshot", return_value=kernel),
                      mock.patch.object(helper, "_ps_scalar_snapshot", return_value=scalar),
