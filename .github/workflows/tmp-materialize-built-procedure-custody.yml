name: Temporary materialize built procedure custody

on:
  push:
    branches:
      - repair/v14-capture-built-procedure-custody-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-built-procedure-custody-sol
          fetch-depth: 3

      - name: Apply exact product-only built-procedure custody repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "8b9c1cabeeffdec7cb12f9a74f53320c11e7eae0"
          test "$(git hash-object NembraApp/App/NembraCaptureBuildIdentity.swift)" = "931f4ef257673691a9c08c6a0f7be8783719e867"
          test "$(git hash-object scripts/field/install_one_time_capture.command)" = "393e4bfb353c4488e4eb6d09c0c611ab481390f1"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift)" = "b5ebb27cd22c6c12e4ac43dfa0e1700f10827285"

          python3 - <<'PY'
          from pathlib import Path

          def once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {n}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          identity = "NembraApp/App/NembraCaptureBuildIdentity.swift"
          once(identity,
               '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n    static let fieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"\n',
               '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n    static let procedureIdentifierInfoKey = "NembraCaptureProcedureIdentifier"\n    static let fieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"\n')
          once(identity,
               '    let tuyaDependencyLockSHA256: String\n',
               '    let tuyaDependencyLockSHA256: String\n    let procedureIdentifier: String\n')
          once(identity,
               '            sourceCommitSHA: ((infoDictionary[sourceCommitSHAInfoKey] as? String) ?? "").lowercased(),\n            tuyaDependencyLockSHA256: ((infoDictionary[tuyaDependencyLockSHA256InfoKey] as? String) ?? "").lowercased()\n',
               '            sourceCommitSHA: ((infoDictionary[sourceCommitSHAInfoKey] as? String) ?? "").lowercased(),\n            tuyaDependencyLockSHA256: ((infoDictionary[tuyaDependencyLockSHA256InfoKey] as? String) ?? "").lowercased(),\n            procedureIdentifier: (infoDictionary[procedureIdentifierInfoKey] as? String) ?? ""\n')
          once(identity,
               '              tuyaDependencyLockSHA256.utf8.allSatisfy({ byte in\n                  (byte >= 48 && byte <= 57) || (byte >= 97 && byte <= 102)\n              }) else { return false }\n',
               '              tuyaDependencyLockSHA256.utf8.allSatisfy({ byte in\n                  (byte >= 48 && byte <= 57) || (byte >= 97 && byte <= 102)\n              }),\n              procedureIdentifier == Self.fieldProcedureIdentifier else { return false }\n')
          once(identity,
               '            return "This build has no valid exact Git + reviewed Tuya dependency provenance. Install Capture through the repository field installer before physical evidence collection."\n',
               '            return "This build has no valid exact Git + reviewed Tuya dependency + canonical stationary procedure provenance. Install Capture through the repository field installer before physical evidence collection."\n')

          installer = "scripts/field/install_one_time_capture.command"
          once(installer,
               '    "NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256=$TUYA_DEPENDENCY_LOCK_SHA256" \\\n    build\n',
               '    "NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256=$TUYA_DEPENDENCY_LOCK_SHA256" \\\n    "INFOPLIST_KEY_NembraCaptureProcedureIdentifier=$PROCEDURE_ID" \\\n    build\n')
          once(installer,
               'BUILT_TUYA_DEPENDENCY_LOCK_SHA256="$(/usr/bin/plutil -extract NembraCaptureTuyaDependencyLockSHA256 raw -o - "$APP_INFO_PLIST" 2>/dev/null || true)"\nBUILT_BUNDLE_ID=',
               'BUILT_TUYA_DEPENDENCY_LOCK_SHA256="$(/usr/bin/plutil -extract NembraCaptureTuyaDependencyLockSHA256 raw -o - "$APP_INFO_PLIST" 2>/dev/null || true)"\nBUILT_PROCEDURE_IDENTIFIER="$(/usr/bin/plutil -extract NembraCaptureProcedureIdentifier raw -o - "$APP_INFO_PLIST" 2>/dev/null || true)"\nBUILT_BUNDLE_ID=')
          once(installer,
               '[[ "$BUILT_TUYA_DEPENDENCY_LOCK_SHA256" == "$TUYA_DEPENDENCY_LOCK_SHA256" ]] || die "Built Capture app Tuya dependency-lock fingerprint does not match the exact resolved private workspace. Discard this candidate."\n[[ "$BUILT_BUNDLE_ID" == "$BUNDLE_ID" ]]',
               '[[ "$BUILT_TUYA_DEPENDENCY_LOCK_SHA256" == "$TUYA_DEPENDENCY_LOCK_SHA256" ]] || die "Built Capture app Tuya dependency-lock fingerprint does not match the exact resolved private workspace. Discard this candidate."\n[[ "$BUILT_PROCEDURE_IDENTIFIER" == "$PROCEDURE_ID" ]] || die "Built Capture app procedure identity does not match the canonical stationary procedure. Discard this candidate."\n[[ "$BUILT_BUNDLE_ID" == "$BUNDLE_ID" ]]')
          once(installer,
               'say "Built app provenance matched exact requested source, reviewed Tuya dependency lock, and field product"\nunset BUILT_BUILD_IDENTIFIER BUILT_SOURCE_SHA BUILT_TUYA_DEPENDENCY_LOCK_SHA256 BUILT_BUNDLE_ID APP_INFO_PLIST\n',
               'say "Built app provenance matched exact requested source, reviewed Tuya dependency lock, canonical stationary procedure, and field product"\nunset BUILT_BUILD_IDENTIFIER BUILT_SOURCE_SHA BUILT_TUYA_DEPENDENCY_LOCK_SHA256 BUILT_PROCEDURE_IDENTIFIER BUILT_BUNDLE_ID APP_INFO_PLIST\n')
          once(installer,
               '    "The exact built device app was read back before installation and matched the requested source SHA, field-build identifier, and standalone bundle identifier." \\\n',
               '    "The exact built device app was read back before installation and matched the requested source SHA, field-build identifier, canonical stationary procedure, and standalone bundle identifier." \\\n')

          test = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift"
          once(test,
               '        #expect(identity.contains("fieldProcedureIdentifier"))\n        #expect(identity.contains(Self.procedure))\n',
               '        #expect(identity.contains("fieldProcedureIdentifier"))\n        #expect(identity.contains(Self.procedure))\n        #expect(identity.contains("procedureIdentifierInfoKey = \\\"NembraCaptureProcedureIdentifier\\\""))\n        #expect(identity.contains("let procedureIdentifier: String"))\n        #expect(identity.contains("procedureIdentifier == Self.fieldProcedureIdentifier"))\n')
          once(test,
               '        #expect(installer.contains("Field procedure: $PROCEDURE_ID"))\n',
               '        #expect(installer.contains("Field procedure: $PROCEDURE_ID"))\n        #expect(installer.contains("INFOPLIST_KEY_NembraCaptureProcedureIdentifier=$PROCEDURE_ID"))\n        #expect(installer.contains("plutil -extract NembraCaptureProcedureIdentifier"))\n        let readback = try #require(installer.range(of: "BUILT_PROCEDURE_IDENTIFIER=\\\"$(/usr/bin/plutil"))\n        let check = try #require(installer.range(of: "[[ \\\"$BUILT_PROCEDURE_IDENTIFIER\\\" == \\\"$PROCEDURE_ID\\\" ]]"))\n        let install = try #require(installer.range(of: "Installing SDK-integrated Capture on the intended iPhone"))\n        #expect(readback.lowerBound < check.lowerBound)\n        #expect(check.lowerBound < install.lowerBound)\n')
          PY

          bash -n scripts/field/install_one_time_capture.command
          swiftc -parse NembraApp/App/NembraCaptureBuildIdentity.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift
          git diff --check

      - name: Commit product-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-capture-bot"
          git config user.email "nembra-capture-bot@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureBuildIdentity.swift scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git diff --cached --check
          git commit -m "fix(capture): bind built procedure custody"
          git push origin HEAD:repair/v14-capture-built-procedure-custody-sol
