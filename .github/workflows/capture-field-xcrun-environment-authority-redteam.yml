name: Capture Field Xcrun Environment Authority Red Team

on:
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_field_xcrun_environment_authority.py
      - .github/workflows/capture-field-xcrun-environment-authority-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcrun-environment-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact diagnostic checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Require closed xcrun selector environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/tests/test_capture_field_xcrun_environment_authority.py
          python3 scripts/ci/tests/test_capture_field_xcrun_environment_authority.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check
