name: Materialize Capture Application Secret Value Custody 172d
on:
  push:
    branches: [sol/v14-capture-application-secret-value-custody-172d]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-application-secret-value-custody-172d
          fetch-depth: 0
      - name: Guard exact current parent
        run: |
          set -euo pipefail
          parent=172dca56a1bc018e192feec197ceb17f81db5dab
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Apply and validate custody
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_application_secret_value_custody_172d.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift
          git diff --check
      - name: Publish clean two-path repair
        run: |
          set -euo pipefail
          parent=172dca56a1bc018e192feec197ceb17f81db5dab
          rm .github/workflows/capture-application-secret-value-custody-172d-materialize.yml scripts/ci/materialize_capture_application_secret_value_custody_172d.py
          git add -A
          changed="$(git diff --cached "$parent" --name-only | sort)"
          expected="$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$parent" --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): bind exact private app secrets before event custody'
          git push origin HEAD:sol/v14-capture-application-secret-value-custody-172d
