name: Capture Ready pre-attempt current-spine integration

on:
  push:
    branches:
      - integration/es80-v14-current-ready-pre-attempt-gpt56
    paths:
      - .github/workflows/capture-ready-pre-attempt-current-spine-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-current-ready-pre-attempt-gpt56
          fetch-depth: 2

      - name: Verify exact staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "430704f4aee530e6e60608882d8ee98e5ac549f3"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-ready-pre-attempt-current-spine-integration.yml"

      - name: Apply exact Ready pre-attempt quarantine repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          transaction = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift")
          source = transaction.read_text()
          old = '''    enum ReadyRecorderMutationOutcome: Equatable, Sendable {
          '''
          new = '''    /// Producer-issued proof that the exact Ready admission was deliberately
              /// abandoned before any recorder attempt. Claiming this receipt consumes the
              /// same shared one-shot permit as recording, so no copy can later append Ready.
              struct ReadyPreAttemptAbandonmentReceipt: Equatable, Sendable {
                  let queueCutoff: UInt64
                  let authority: PassiveCoreBluetoothArtifactAuthorityContext
                  let transactionRevision: UInt64
                  let transactionIdentity: UUID

                  fileprivate init(
                      decision: PassiveCoreBluetoothObservationBoundaryDecision,
                      transaction: PassiveCoreBluetoothObservationBoundaryQueueGate.Transaction
                  ) {
                      queueCutoff = decision.queueCutoff
                      authority = decision.authority
                      transactionRevision = transaction.revision
                      transactionIdentity = transaction.identity
                  }
              }

              enum ReadyRecorderMutationOutcome: Equatable, Sendable {
          '''
          if source.count(old) != 1:
              raise SystemExit(f"Ready receipt insertion: expected one site, found {source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''    func recordBoundary(
                  on recorder: PassiveCoreBluetoothCaptureRecorder
              ) async throws -> RecordedReadyBoundary {
          '''
          new = '''    /// Deliberately abandons this exact Ready admission before any recorder call.
              /// The shared permit proves no value copy has already attempted Ready mutation
              /// and is consumed permanently so later recording/rejection cannot be fabricated.
              func abandonBeforeRecorderAttempt() throws -> ReadyPreAttemptAbandonmentReceipt {
                  try mutationPermit.claim()
                  return ReadyPreAttemptAbandonmentReceipt(
                      decision: decision,
                      transaction: transaction
                  )
              }

              func recordBoundary(
                  on recorder: PassiveCoreBluetoothCaptureRecorder
              ) async throws -> RecordedReadyBoundary {
          '''
          if source.count(old) != 1:
              raise SystemExit(f"Ready abandonment insertion: expected one site, found {source.count(old)}")
          source = source.replace(old, new, 1)
          transaction.write_text(source)

          gate = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift")
          source = gate.read_text()
          old = '''        enum Origin: Equatable, Sendable {
                      case uncommittedReadyRejectedBeforeRecorderMutation
          '''
          new = '''        enum Origin: Equatable, Sendable {
                      case uncommittedReadyAbandonedBeforeRecorderAttempt
                      case uncommittedReadyRejectedBeforeRecorderMutation
          '''
          if source.count(old) != 1:
              raise SystemExit(f"Ready abort origin: expected one site, found {source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''        /// Furthest queue prefix already represented by durable lifecycle evidence in
                  /// this abandoned epoch. Recorded/committed Horizon extends it through H; a
                  /// zero-mutation Horizon abandonment/rejection leaves Ready as the boundary.
          '''
          new = '''        /// Furthest queue prefix already settled before quarantine and therefore no longer
                  /// allowed to re-enter the pending FIFO. For pre-attempt Ready abandonment this
                  /// is drained raw-event chronology only and MUST NOT be read as a durable
                  /// `finiteAcquisitionReady` marker. Recorded/committed Horizon extends the
                  /// settled prefix through H; zero-H abandonment/rejection leaves it at Ready.
          '''
          if source.count(old) != 1:
              raise SystemExit(f"Ready settled-prefix wording: expected one site, found {source.count(old)}")
          source = source.replace(old, new, 1)

          marker = '''    /// Abandons Ready only when #440 proves its authority-fenced recorder mutation was
          '''
          insertion = '''    /// Abandons an exact Ready admission before any recorder attempt only when the
              /// admission itself proves its shared one-shot mutation permit was still unused and
              /// is now permanently consumed. The Ready cutoff may already be FIFO-settled, but
              /// this receipt never fabricates a durable finiteAcquisitionReady lifecycle marker.
              @discardableResult
              mutating func abortReadyBeforeRecorderAttempt(
                  after abandonment: PassiveCoreBluetoothObservationBoundaryTransactionDecision.ReadyPreAttemptAbandonmentReceipt
              ) throws -> ObservationEpochAbortReceipt {
                  guard case let .drainingReady(current) = phase else {
                      throw StateError.invalidTransition
                  }
                  guard current.authority == abandonment.authority,
                        current.queueCutoff == abandonment.queueCutoff,
                        current.revision == abandonment.transactionRevision,
                        current.identity == abandonment.transactionIdentity else {
                      throw StateError.staleTransaction
                  }
                  let receipt = ObservationEpochAbortReceipt(
                      abandonedReadyTransaction: current,
                      origin: .uncommittedReadyAbandonedBeforeRecorderAttempt
                  )
                  phase = .abortQuarantined(receipt)
                  return receipt
              }

          '''
          if source.count(marker) != 1:
              raise SystemExit(f"Ready gate insertion marker: expected one site, found {source.count(marker)}")
          source = source.replace(marker, insertion + marker, 1)
          gate.write_text(source)

          controller = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          source = controller.read_text()
          old = '''                do {
                              try self.ensureCaptureHealthy()
                              let outcome = try await admission.recordBoundaryWithMutationOutcome(on: recorder)
          '''
          new = '''                do {
                              // The Ready FIFO drain is an actor suspension. Foreground loss may
                              // poison this exact durable capture while it is suspended, so prove
                              // foreground integrity and generic health before the first recorder
                              // attempt. If either fails, consume the exact unused Ready admission
                              // and quarantine its transaction rather than leaving `.drainingReady`.
                              do {
                                  try self.requireForegroundEvidenceIntegrity()
                                  try self.ensureCaptureHealthy()
                              } catch {
                                  let preAttemptFailure = error
                                  do {
                                      let abandonment = try admission.abandonBeforeRecorderAttempt()
                                      try self.observationBoundaryQueueGate.abortReadyBeforeRecorderAttempt(
                                          after: abandonment
                                      )
                                  } catch {
                                      // Exact lifecycle-quarantine failure is stronger than the
                                      // triggering foreground/health error. Keep capture fail-closed.
                                      throw error
                                  }
                                  throw preAttemptFailure
                              }

                              let outcome = try await admission.recordBoundaryWithMutationOutcome(on: recorder)
          '''
          if source.count(old) != 1:
              raise SystemExit(f"Ready controller interlock: expected one site, found {source.count(old)}")
          source = source.replace(old, new, 1)
          controller.write_text(source)

          Path(".github/workflows/capture-ready-pre-attempt-current-spine-integration.yml").unlink()
          PY

          git diff --check
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          transaction=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift
          gate=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          test "$(grep -c 'let abandonment = try admission.abandonBeforeRecorderAttempt()' "$controller")" = "1"
          test "$(grep -c 'abortReadyBeforeRecorderAttempt(' "$controller")" = "1"
          test "$(grep -c 'func abandonBeforeRecorderAttempt()' "$transaction")" = "1"
          test "$(grep -c 'struct ReadyPreAttemptAbandonmentReceipt' "$transaction")" = "1"
          test "$(grep -c 'mutating func abortReadyBeforeRecorderAttempt' "$gate")" = "1"
          test "$(grep -c 'case uncommittedReadyAbandonedBeforeRecorderAttempt' "$gate")" = "1"
          test "$(grep -c 'let recordedReadyFailure = error' "$controller")" = "1"
          test "$(grep -c 'let recordedHorizonFailure = error' "$controller")" = "1"
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerPreAttemptReadyRecoveryTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothReadyPreAttemptAbandonmentTests.swift
          test ! -e .github/workflows/capture-ready-pre-attempt-current-spine-integration.yml

      - name: Commit exact product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-gpt56-v14"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: quarantine allocated Ready before recorder attempt"
          git push origin HEAD:integration/es80-v14-current-ready-pre-attempt-gpt56
