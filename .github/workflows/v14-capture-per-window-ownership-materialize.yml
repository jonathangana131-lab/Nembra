name: V14 Capture Per Window Ownership Materialize

on:
  push:
    branches:
      - fix/v14-capture-per-window-tuya-ownership-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-per-window-tuya-ownership-sol
          fetch-depth: 0
      - name: Apply guarded source repair
        run: python3 scripts/ci/materialize_capture_per_window_tuya_ownership_sol.py
      - name: Verify generated diff
        run: git diff --check
      - name: Commit clean successor
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-per-window-ownership-materialize.yml
          rm scripts/ci/materialize_capture_per_window_tuya_ownership_sol.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): fence correlation window ownership"
          git push origin HEAD:fix/v14-capture-per-window-tuya-ownership-sol
