name: Capture AX5 Current Product Materializer
# Recovery lineage: the only authoring fix is the fail-closed first-fold insertion seam.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/capture-ax5-current-product-materializer.yml'

permissions:
  contents: write

concurrency:
  group: capture-ax5-current-product-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.number != 0
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact current Capture product parent
        shell: bash
        run: |
          set -euo pipefail
          base='ba615954b2afdf2e011f485c0ecbc9152614d21e'
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          test_file='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFirstFoldCopySourceTests.swift'
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "$(git rev-parse "$base:$app")" = '398533d348bacbe61e8a11415e5dff5ed1d6c95c'
          test "$(git rev-parse "$base:$test_file")" = '5464f3ac29a3939f8d532fd594653c22bd35b815'
          changed="$(git diff --name-only "$base"...HEAD)"
          test "$changed" = '.github/workflows/capture-ax5-current-product-materializer.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compose validated AX5 VoiceOver lock priority and regression
        shell: bash
        run: |
          set -euo pipefail
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          test_file='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFirstFoldCopySourceTests.swift'
          /usr/bin/python3 -B -I - "$app" "$test_file" <<'PY'
          from pathlib import Path
          import sys

          app_path = Path(sys.argv[1])
          test_path = Path(sys.argv[2])

          app = app_path.read_text(encoding='utf-8')
          old = '''        .accessibilityElement(children: .combine)\n        .accessibilityLabel(fieldBuildIsAuthoritative ? "Build provenance ready" : "Physical capture locked")'''
          new = '''        .accessibilityElement(children: .combine)\n        .accessibilitySortPriority(isAccessibilityLayout ? 100 : 0)\n        .accessibilityLabel(fieldBuildIsAuthoritative ? "Build provenance ready" : "Physical capture locked")'''
          if app.count(old) != 1:
              raise SystemExit(f'validated build-authority accessibility seam count changed: {app.count(old)}')
          app = app.replace(old, new)
          marker = '.accessibilitySortPriority(isAccessibilityLayout ? 100 : 0)'
          if app.count(marker) != 1:
              raise SystemExit('AX5 lock priority did not materialize exactly once')
          app_path.write_text(app, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          anchor = '        #expect(app.contains(readOnlyKey))\n'
          replacement = '''        #expect(app.contains(readOnlyKey))\n        #expect(app.contains(".accessibilitySortPriority(isAccessibilityLayout ? 100 : 0)"))\n'''
          if test.count(anchor) != 1:
              raise SystemExit(f'first-fold regression insertion seam count changed: {test.count(anchor)}')
          test = test.replace(anchor, replacement)
          test_path.write_text(test, encoding='utf-8')
          PY
          git diff --check -- "$app" "$test_file"
          test "$(git diff --name-only | LC_ALL=C sort)" = $'NembraApp/App/NembraCaptureEntrypoint.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFirstFoldCopySourceTests.swift'

      - name: Commit product and source regression only
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          test_file='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFirstFoldCopySourceTests.swift'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$app" "$test_file"
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = $'NembraApp/App/NembraCaptureEntrypoint.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFirstFoldCopySourceTests.swift'
          git commit -m 'Capture accessibility: prioritize AX5 lock authority'

          workflow='.github/workflows/capture-ax5-current-product-materializer.yml'
          git rm -- "$workflow"
          git commit -m 'Capture accessibility: remove one-shot materializer'
          git push origin "HEAD:$HEAD_BRANCH"
