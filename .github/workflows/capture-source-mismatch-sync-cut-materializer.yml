name: Capture source-mismatch sync-cut materializer

on:
  push:
    branches:
      - repair/v161-capture-callback-authority-convergence-sol-20260814

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v161-capture-callback-authority-convergence-sol-20260814
          fetch-depth: 2
          persist-credentials: true
      - name: Close mismatched source authority before retirement task
        env:
          EXPECTED_PARENT: 9d70ceba3101c637b509ff17da66145da1144432
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -f scripts/ci/materialize_capture_source_mismatch_sync_cut.py
          python3 scripts/ci/materialize_capture_source_mismatch_sync_cut.py
          test ! -e scripts/ci/materialize_capture_source_mismatch_sync_cut.py
          test ! -e .github/workflows/capture-source-mismatch-sync-cut-materializer.yml
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Capture V16.1: synchronously cut mismatched SmartLife source authority'
          git push origin HEAD:repair/v161-capture-callback-authority-convergence-sol-20260814
