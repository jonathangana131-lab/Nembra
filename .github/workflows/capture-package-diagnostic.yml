name: Capture Package Exact Failure Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  capture-package-diagnostic:
    name: Diagnose Capture package exact head
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          printf 'Expected exact PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"

      - name: Run Capture package with failure annotations
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee "$RUNNER_TEMP/nembra-capture-package.log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/nembra-capture-package.log" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
          patterns = re.compile(
              r"(?:\berror:|\bfatal error:|\bfailed\b|\bfailure\b|XCTAssert|Test Case .* failed|✘|×)",
              re.IGNORECASE,
          )
          matches = [line.strip() for line in lines if patterns.search(line)]
          if not matches:
              matches = lines[-40:]
          for line in matches[-60:]:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Capture package exact-head failure::{escaped}")
          PY
            exit "$status"
          fi
