name: Materialize Reanchored Capture Cross-Controller BLE Lease

on:
  push:
    branches:
      - agent/capture-cross-controller-ble-lease-r2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/capture-cross-controller-ble-lease-r2
      - name: Materialize exact current-product lease repair
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "2f72ba928ccbe9b48744998b834cd68fe73a6bea" ]]
          [[ "$(git merge-base HEAD 1b12dc56ec20a7dad30760b57a81106644ffc263)" == "1b12dc56ec20a7dad30760b57a81106644ffc263" ]]

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = p.read_text(encoding='utf-8')
          if 'activePackageCorrelationOwner' in s or 'processCorrelationLease' in s:
              raise SystemExit('lease already materialized')

          def one(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label} anchor count={s.count(old)}')
              s = s.replace(old, new, 1)

          one(
              '    private var correlationSession: PassiveBluetoothPowerCycleObservationSession?\n',
              '    private var correlationSession: PassiveBluetoothPowerCycleObservationSession?\n    private var processCorrelationLease: UUID?\n',
              'controller lease field',
          )

          # Centralize existing package-scanner retirement. These pairs are semantically identical
          # and must stop transport before releasing the process owner token.
          s, n1 = re.subn(
              r'(?m)^(\s*)correlationSession\?\.abandonCurrentWindow\(\)\n\1correlationSession = nil$',
              r'\1abandonPackageCorrelation()', s,
          )
          s, n2 = re.subn(
              r'(?m)^(\s*)session\.abandonCurrentWindow\(\)\n\1correlationSession = nil$',
              r'\1abandonPackageCorrelation()', s,
          )
          if n1 < 3 or n2 < 3:
              raise SystemExit(f'abandon pair drift n1={n1} n2={n2}')

          one(
              '        guard correlationProgress?.isSeriesInvalidated == true else { return }\n        correlationSession = nil\n        failLocally(\n',
              '        guard correlationProgress?.isSeriesInvalidated == true else { return }\n        abandonPackageCorrelation()\n        failLocally(\n',
              'async invalidation cleanup',
          )

          old_copy = '"Tuya BLE ownership was already attempted in this app process. Relaunch Capture with the scooter OFF before a fresh OFF1→ON1→OFF2→ON2 series. Package-owned correlation cannot restart in-process after Tuya BLE ownership."'
          new_copy = '"Package Bluetooth correlation is already active elsewhere in Capture, or Tuya BLE ownership was already attempted in this app process. Finish the active attempt or relaunch with the scooter OFF before a fresh OFF1→ON1→OFF2→ON2 series."'
          one(old_copy, new_copy, 'process blocker copy')

          one(
              '        resetDiscoverySessionOnly()\n        do {\n            correlationSession = try PassiveBluetoothPowerCycleObservationSession(minimumWindowDuration: 10)\n',
              '''        resetDiscoverySessionOnly()\n        guard let processLease = OfficialTuyaFactory.acquirePackageCorrelationLease() else {\n            failLocally(\n                "Another Capture controller already owns package Bluetooth correlation, or Tuya BLE ownership was attempted in this app process. Finish/relaunch before a fresh OFF1 series.",\n                "process_package_correlation_ownership_unavailable"\n            )\n            return\n        }\n        processCorrelationLease = processLease\n        do {\n            correlationSession = try PassiveBluetoothPowerCycleObservationSession(minimumWindowDuration: 10)\n''',
              'OFF1 acquisition',
          )

          one(
              '    private func finishCorrelationSeries(_ result: PassiveBluetoothPowerCycleObservationResult) {\n        // Preserve the package-issued receipts + exact catalogs before releasing the live scanner.\n',
              '''    private func finishCorrelationSeries(_ result: PassiveBluetoothPowerCycleObservationResult) {\n        // `finishCurrentWindow()` has already synchronously retired the final package scanner.\n        // Release the process lease only after that radio transport is no longer live, so another\n        // controller can never acquire Tuya ownership while package scanning still exists.\n        correlationSession = nil\n        releasePackageCorrelationLease()\n\n        // Preserve the package-issued receipts + exact catalogs before releasing the live scanner.\n''',
              'successful series release',
          )

          one(
              '    private func resetDiscoverySessionOnly() {\n',
              '''    private func abandonPackageCorrelation() {\n        // Radio transport first, process lease second. The owner token prevents an old controller\n        // from clearing a lease that belongs to a newer correlation attempt.\n        correlationSession?.abandonCurrentWindow()\n        correlationSession = nil\n        releasePackageCorrelationLease()\n    }\n\n    private func releasePackageCorrelationLease() {\n        guard let processCorrelationLease else { return }\n        OfficialTuyaFactory.releasePackageCorrelationLease(processCorrelationLease)\n        self.processCorrelationLease = nil\n    }\n\n    private func resetDiscoverySessionOnly() {\n''',
              'lease release helpers',
          )

          old_fail = '''    private func failLocally(_ text: String, _ kind: String) {\n        if phase == .baseline || phase == .powerOn || phase == .scanning || phase == .correlated {\n            abandonPackageCorrelation()\n        }\n'''
          new_fail = '''    private func failLocally(_ text: String, _ kind: String) {\n        // A process lease is acquired before the first window advances presentation `phase`.\n        // Session construction/start failures must therefore release by lease ownership too.\n        if processCorrelationLease != nil || phase == .baseline || phase == .powerOn || phase == .scanning || phase == .correlated {\n            abandonPackageCorrelation()\n        }\n'''
          one(old_fail, new_fail, 'pre-window failure cleanup')

          one(
              '''private enum OfficialTuyaFactory {\n    private static var didBootstrap = false\n    private static var packageCorrelationRetiredForProcess = false\n\n    static var packageCorrelationMayStart: Bool {\n        !packageCorrelationRetiredForProcess\n    }\n''',
              '''private enum OfficialTuyaFactory {\n    private static var didBootstrap = false\n    private static var packageCorrelationRetiredForProcess = false\n    private static var activePackageCorrelationOwner: UUID?\n\n    static var packageCorrelationMayStart: Bool {\n        !packageCorrelationRetiredForProcess && activePackageCorrelationOwner == nil\n    }\n\n    static func acquirePackageCorrelationLease() -> UUID? {\n        guard !packageCorrelationRetiredForProcess, activePackageCorrelationOwner == nil else { return nil }\n        let lease = UUID()\n        activePackageCorrelationOwner = lease\n        return lease\n    }\n\n    static func releasePackageCorrelationLease(_ lease: UUID) {\n        guard activePackageCorrelationOwner == lease else { return }\n        activePackageCorrelationOwner = nil\n    }\n''',
              'factory lease state',
          )

          one(
              '        guard bootstrap(), accountLoggedIn, currentAccountUID != nil else { return nil }\n        // A process-global Tuya BLE manager may outlive any one controller. Once a\n',
              '''        guard activePackageCorrelationOwner == nil,\n              bootstrap(),\n              accountLoggedIn,\n              currentAccountUID != nil else { return nil }\n        // A process-global Tuya BLE manager may outlive any one controller. Once a\n''',
              'atomic Tuya handoff guard',
          )

          # Assert the safety shape before publishing.
          required = [
              'private static var activePackageCorrelationOwner: UUID?',
              'guard !packageCorrelationRetiredForProcess, activePackageCorrelationOwner == nil else { return nil }',
              'guard activePackageCorrelationOwner == lease else { return }',
              'guard activePackageCorrelationOwner == nil,',
              'if processCorrelationLease != nil || phase == .baseline',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'missing invariant: {token}')
          if s.count('OfficialTuyaFactory.acquirePackageCorrelationLease()') != 1:
              raise SystemExit('lease acquire count mismatch')
          if s.count('OfficialTuyaFactory.releasePackageCorrelationLease(processCorrelationLease)') != 1:
              raise SystemExit('token release count mismatch')
          if s.count('activePackageCorrelationOwner = nil') != 1:
              raise SystemExit('factory clear count mismatch')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          grep -Fq 'pre-window failure cannot strand an acquired process lease' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipLeaseSourceTests.swift
          grep -Fq 'guard activePackageCorrelationOwner == nil,' NembraApp/App/NembraCaptureEntrypoint.swift
          rm .github/workflows/materialize-capture-cross-controller-ble-lease-r2.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/materialize-capture-cross-controller-ble-lease-r2.yml
          git diff --cached --check
          git commit -m 'fix(capture): serialize process BLE ownership'
          git push origin HEAD:agent/capture-cross-controller-ble-lease-r2
