name: chat-k4m7v guarded abort receipt access fix

on:
  push:
    branches:
      - 'parallel/es80-preh-observation-abort/chat-k4m7v'
    paths:
      - '.github/workflows/chat-k4m7v-preh-abort-access-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-preh-observation-abort/chat-k4m7v
          fetch-depth: 0
      - name: Repair receipt initializer access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift')
          text = path.read_text()
          old = '        private init(abandonedReadyTransaction: Transaction) {'
          new = '        fileprivate init(abandonedReadyTransaction: Transaction) {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one private abort receipt initializer, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/chat-k4m7v-preh-abort-access-fix.yml
          git config user.name 'nembra-chat-k4m7v'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          git commit -m 'fix: keep abort receipt construction file-scoped'
          git push origin HEAD:parallel/es80-preh-observation-abort/chat-k4m7v
