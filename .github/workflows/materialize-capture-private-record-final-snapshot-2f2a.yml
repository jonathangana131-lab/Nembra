name: Materialize Capture private record final snapshot 2f2a

on:
  push:
    branches:
      - fix/v14-capture-private-record-final-snapshot-coherence-2f2a-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '2f2a2e8268830259a6dc6ac0e9dae38905ef5021'

      - name: Make each whole-record generation snapshot self-revalidating
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('Scripts/capture_tuya_private_input_provenance.py')
          source = helper.read_text(encoding='utf-8')
          old = '''def _private_input_record_generation_snapshot(
              *,
              lockfile: Path,
              security_podspec: Path,
              security_build: Path,
              identity_podspec: Path,
              identity_sources: Path,
          ) -> tuple[object, ...]:
              return (
                  ("podfile_lock", _regular_file_generation_identity(lockfile)),
                  ("security_podspec", _regular_file_generation_identity(security_podspec)),
                  ("security_build", _tree_generation_snapshot(security_build)),
                  ("identity_podspec", _regular_file_generation_identity(identity_podspec)),
                  ("identity_sources", _tree_generation_snapshot(identity_sources)),
              )
          '''
          # Source is four-space indented, not the YAML indentation shown above.
          old = old.replace('          ', '')
          new = '''def _private_input_record_generation_snapshot(
    *,
    lockfile: Path,
    security_podspec: Path,
    security_build: Path,
    identity_podspec: Path,
    identity_sources: Path,
) -> tuple[object, ...]:
    lockfile_identity = _regular_file_generation_identity(lockfile)
    security_podspec_identity = _regular_file_generation_identity(security_podspec)
    security_build_snapshot = _tree_generation_snapshot(security_build)
    identity_podspec_identity = _regular_file_generation_identity(identity_podspec)
    identity_sources_snapshot = _tree_generation_snapshot(identity_sources)

    # The whole-record witness is stronger than five individually stable reads.
    # Revalidate earlier standalone authorities after both tree walks so a
    # mutate-and-restore during the tail of this same snapshot cannot be hidden
    # behind a stale identity captured near the beginning of the snapshot.
    standalone_authorities = (
        (lockfile, lockfile_identity),
        (security_podspec, security_podspec_identity),
        (identity_podspec, identity_podspec_identity),
    )
    for path, expected_identity in standalone_authorities:
        if _regular_file_generation_identity(path) != expected_identity:
            raise ProvenanceError(
                "private build inputs changed while their record generation was snapshotted"
            )

    # Rewalk both trees only after all five initial authorities were captured.
    # Each tree snapshot already revalidates every pathname, type, symlink
    # target, stat identity, and directory membership before it returns.
    if _tree_generation_snapshot(security_build) != security_build_snapshot:
        raise ProvenanceError(
            "private build inputs changed while their record generation was snapshotted"
        )
    if _tree_generation_snapshot(identity_sources) != identity_sources_snapshot:
        raise ProvenanceError(
            "private build inputs changed while their record generation was snapshotted"
        )

    # A tree rewalk is itself nonzero work. Recheck standalone generations once
    # more at the return boundary so a change during those final tree walks is
    # not promoted as one coherent five-authority witness.
    for path, expected_identity in standalone_authorities:
        if _regular_file_generation_identity(path) != expected_identity:
            raise ProvenanceError(
                "private build inputs changed during final record-generation revalidation"
            )

    return (
        ("podfile_lock", lockfile_identity),
        ("security_podspec", security_podspec_identity),
        ("security_build", security_build_snapshot),
        ("identity_podspec", identity_podspec_identity),
        ("identity_sources", identity_sources_snapshot),
    )
'''
          if source.count(old) != 1:
              raise SystemExit(f'whole-record snapshot seam drifted: {source.count(old)}')
          helper.write_text(source.replace(old, new, 1), encoding='utf-8')

          red = Path('scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py')
          red.write_text('''#!/usr/bin/env python3
from __future__ import annotations

import importlib.util
import tempfile
import unittest
from pathlib import Path
from unittest import mock

REPOSITORY_ROOT = Path(__file__).resolve().parents[3]
HELPER_PATH = REPOSITORY_ROOT / "Scripts" / "capture_tuya_private_input_provenance.py"
SPEC = importlib.util.spec_from_file_location("capture_tuya_private_input_provenance", HELPER_PATH)
if SPEC is None or SPEC.loader is None:
    raise RuntimeError("could not load Capture private-input provenance helper")
provenance = importlib.util.module_from_spec(SPEC)
SPEC.loader.exec_module(provenance)


class CaptureTuyaPrivateInputFinalSnapshotCoherenceTests(unittest.TestCase):
    def setUp(self) -> None:
        self.temporary = tempfile.TemporaryDirectory()
        self.root = Path(self.temporary.name)
        self.sdk = self.root / "TuyaSDK"
        self.identity = self.root / "TuyaRuntime"
        self.security_build = self.sdk / "Build"
        self.identity_sources = self.identity / "Sources" / "NembraTuyaPrivateConfig"
        self.security_build.mkdir(parents=True)
        self.identity_sources.mkdir(parents=True)
        self.security_podspec = self.sdk / "ThingSmartCryption.podspec"
        self.identity_podspec = self.identity / "NembraTuyaPrivateConfig.podspec"
        self.lockfile = self.root / "Podfile.lock"
        self.security_podspec.write_text("security-podspec-v1", encoding="utf-8")
        (self.security_build / "ThingSmartCryption.bin").write_bytes(b"security-bytes-v1")
        self.identity_podspec.write_text("private-config-podspec-v1", encoding="utf-8")
        (self.identity_sources / "NembraTuyaPrivateIdentity.swift").write_text(
            'private let encodedAppKey = "TOPSECRET-APPKEY"\\n'
            'private let encodedAppSecret = "TOPSECRET-APPSECRET"\\n',
            encoding="utf-8",
        )
        self.original_lockfile = (
            "  - ThingSmartHomeKit (7.8.0)\\n"
            "  - ThingSmartBusinessExtensionKit (7.8.0)\\n"
        )
        self.lockfile.write_text(self.original_lockfile, encoding="utf-8")

    def tearDown(self) -> None:
        self.temporary.cleanup()

    def test_final_generation_snapshot_revalidates_earlier_authorities_after_later_tree_walk(self) -> None:
        original_tree_generation_snapshot = provenance._tree_generation_snapshot
        tree_generation_calls = 0
        mutated_and_restored = False

        def tree_snapshot_with_final_cross_input_mutation(path: Path):
            nonlocal tree_generation_calls, mutated_and_restored
            tree_generation_calls += 1
            result = original_tree_generation_snapshot(path)
            if tree_generation_calls == 8:
                # build_record's second self-coherent whole-record snapshot starts
                # after the first snapshot + digest work. Its final initial tree
                # walk occurs here before that snapshot's global revalidation.
                self.assertEqual(path, self.identity_sources)
                self.lockfile.write_text("transient different resolution", encoding="utf-8")
                self.lockfile.write_text(self.original_lockfile, encoding="utf-8")
                mutated_and_restored = True
            return result

        with mock.patch.object(
            provenance,
            "_tree_generation_snapshot",
            side_effect=tree_snapshot_with_final_cross_input_mutation,
        ):
            with self.assertRaises(provenance.ProvenanceError):
                provenance.build_record(
                    lockfile=self.lockfile,
                    security_podspec=self.security_podspec,
                    security_build=self.security_build,
                    identity_podspec=self.identity_podspec,
                    identity_sources=self.identity_sources,
                )

        self.assertTrue(mutated_and_restored)
        self.assertEqual(tree_generation_calls, 8)

    def test_generation_snapshot_source_has_a_global_revalidation_phase(self) -> None:
        source = HELPER_PATH.read_text(encoding="utf-8")
        start = source.index("def _private_input_record_generation_snapshot(")
        end = source.index("\\ndef build_record(", start)
        snapshot_source = source[start:end]
        self.assertIn("standalone_authorities", snapshot_source)
        self.assertIn("_tree_generation_snapshot(security_build) != security_build_snapshot", snapshot_source)
        self.assertIn("_tree_generation_snapshot(identity_sources) != identity_sources_snapshot", snapshot_source)
        self.assertGreaterEqual(snapshot_source.count("_regular_file_generation_identity(path) != expected_identity"), 2)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY

      - name: Verify adversarial provenance suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py \
            scripts/ci/tests/test_capture_tuya_private_input_record_tree_generation.py \
            scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_tree_generation.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py
          git diff --check

      - name: Publish clean current-head repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-private-record-final-snapshot-2f2a.yml
          git config user.name 'nembra-sol'
          git config user.email 'nembra-sol@users.noreply.github.com'
          git add Scripts/capture_tuya_private_input_provenance.py \
                  scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py \
                  .github/workflows/materialize-capture-private-record-final-snapshot-2f2a.yml
          git diff --cached --check
          git commit -m 'fix(capture): revalidate final private record snapshot'
          git push origin HEAD:fix/v14-capture-private-record-final-snapshot-coherence-2f2a-sol
