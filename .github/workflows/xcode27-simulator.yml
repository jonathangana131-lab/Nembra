name: Xcode 27 Simulator QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: nembra-xcode27-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTS_DIR: ${{ github.workspace }}/Artifacts/Xcode27Simulator

jobs:
  simulator-qa:
    name: Build, test, and capture iOS 27 Simulator
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify pristine Capture build inputs
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            echo "Capture provenance refuses tracked or non-ignored untracked build inputs." >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Validate project structure
        run: |
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py
          bash -n scripts/ci/xcode27_simulator_capture.sh

      - name: Validate core package
        working-directory: Packages/NembraCore
        run: swift test

      - name: Build, test, and capture Simulator states
        run: scripts/ci/xcode27_simulator_capture.sh

      - name: Verify retained Capture build evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("Artifacts/Xcode27Simulator")
          record = json.loads((root / "NembraCaptureExternalBuildRecord.json").read_text(encoding="utf-8"))
          expected_keys = {
              "schemaVersion",
              "buildIdentifier",
              "buildInstanceID",
              "sourceCommitSHA",
              "executableSHA256",
              "infoPlistSHA256",
              "experimentRecipeID",
              "procedureVersion",
          }
          if set(record) != expected_keys or record.get("schemaVersion") != 3:
              raise SystemExit("Capture external build record is not the exact closed-world schema v3 shape")

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          executable = root / "build-evidence" / "Nembra"
          info_plist = root / "build-evidence" / "Info.plist"
          if sha256(executable) != record["executableSHA256"]:
              raise SystemExit("Retained Capture executable no longer matches the attested external record")
          if sha256(info_plist) != record["infoPlistSHA256"]:
              raise SystemExit("Retained Capture Info.plist no longer matches the attested external record")
          PY

      - name: Attest external Capture build record
        uses: actions/attest@v4
        with:
          subject-path: Artifacts/Xcode27Simulator/NembraCaptureExternalBuildRecord.json

      - name: Attest retained exact Capture executable
        uses: actions/attest@v4
        with:
          subject-path: Artifacts/Xcode27Simulator/build-evidence/Nembra

      - name: Upload Simulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-xcode27-simulator-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/Xcode27Simulator
          if-no-files-found: warn
          retention-days: 30
