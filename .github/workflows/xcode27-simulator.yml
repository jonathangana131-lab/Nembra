name: Xcode 27 Simulator QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: nembra-xcode27-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTS_DIR: ${{ github.workspace }}/Artifacts/Xcode27Simulator

jobs:
  simulator-qa:
    name: Build, test, and capture iOS 27 Simulator
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate project structure
        run: |
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py
          bash -n scripts/ci/xcode27_simulator_capture.sh

      - name: Validate core package
        working-directory: Packages/NembraCore
        run: swift test

      - name: Build, test, and capture Simulator states
        run: scripts/ci/xcode27_simulator_capture.sh

      - name: Resolve Capture executable digest
        id: capture-provenance
        run: |
          digest="$(python3 -c 'import json; print(json.load(open("Artifacts/Xcode27Simulator/NembraCaptureExternalBuildRecord.json", encoding="utf-8"))["executableSHA256"])')"
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Capture external build record did not contain a valid executable SHA-256." >&2
            exit 1
          fi
          echo "executable_sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest external Capture build record
        uses: actions/attest@v4
        with:
          subject-path: Artifacts/Xcode27Simulator/NembraCaptureExternalBuildRecord.json

      - name: Attest exact Capture executable digest
        uses: actions/attest@v4
        with:
          subject-name: Nembra.capture-executable
          subject-digest: sha256:${{ steps.capture-provenance.outputs.executable_sha256 }}

      - name: Upload Simulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-xcode27-simulator-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/Xcode27Simulator
          if-no-files-found: warn
          retention-days: 30
