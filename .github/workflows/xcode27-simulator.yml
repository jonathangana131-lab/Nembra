name: Xcode 27 Simulator QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'scripts/ci/xcode27_queue_janitor.py'
      - 'scripts/ci/capture_trusted_queue_janitor.py'
      - '.github/workflows/xcode27-queue-janitor.yml'

permissions:
  contents: read

concurrency:
  group: nembra-xcode27-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTS_DIR: ${{ github.workspace }}/Artifacts/Xcode27Simulator

jobs:
  admission:
    name: Classify Xcode 27 admission
    runs-on: ubuntu-latest
    outputs:
      requires_xcode: ${{ steps.classify.outputs.requires_xcode }}
    steps:
      - name: Checkout admission range
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Classify changed paths before reserving the Mac
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'requires_xcode=true' >> "$GITHUB_OUTPUT"
            echo 'Manual dispatch explicitly requests full Xcode 27 Simulator QA.'
            exit 0
          fi

          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'requires_xcode=true' >> "$GITHUB_OUTPUT"
            echo 'No trustworthy before-SHA; fail open to full Xcode QA.'
            exit 0
          fi

          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi

          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          printf 'Changed paths (%s):\n' "${#changed[@]}"
          printf '  %s\n' "${changed[@]}"

          if [[ ${#changed[@]} -eq 0 ]]; then
            echo 'requires_xcode=false' >> "$GITHUB_OUTPUT"
            echo 'No changed paths; do not reserve xcode-27.'
            exit 0
          fi

          for path in "${changed[@]}"; do
            case "$path" in
              *.md|\
              scripts/ci/xcode27_queue_janitor.py|\
              scripts/ci/capture_trusted_queue_janitor.py|\
              .github/workflows/xcode27-queue-janitor.yml|\
              .github/workflows/xcode27-simulator.yml)
                ;;
              *)
                echo 'requires_xcode=true' >> "$GITHUB_OUTPUT"
                echo "Product/build-relevant path requires xcode-27: $path"
                exit 0
                ;;
            esac
          done

          echo 'requires_xcode=false' >> "$GITHUB_OUTPUT"
          echo 'Only documentation/queue-control/Simulator-workflow paths changed; do not reserve xcode-27.'

  simulator-qa:
    name: Build, test, and capture iOS 27 Simulator
    needs: admission
    if: needs.admission.outputs.requires_xcode == 'true'
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate project structure
        run: |
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py
          bash -n scripts/ci/xcode27_simulator_capture.sh

      - name: Validate core package
        working-directory: Packages/NembraCore
        run: swift test

      - name: Build, test, and capture Simulator states
        run: scripts/ci/xcode27_simulator_capture.sh

      - name: Upload Simulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-xcode27-simulator-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/Xcode27Simulator
          if-no-files-found: warn
          retention-days: 30
