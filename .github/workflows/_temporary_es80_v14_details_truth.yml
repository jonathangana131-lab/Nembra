name: Temporary ES80 V14 Details truth repair

on:
  push:
    branches:
      - product/es80-v14-rider-details-boundary/gpt56-thinking-go

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair exact Details truth paragraph
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('NembraApp/Features/Research/ES80CaptureShellView.swift')
          source = path.read_text()
          old = 'This artifact is passive software evidence. File and build hashes are software provenance, not independent field authorization. Repeated full-UUID correlation does not authenticate the physical ES80, and this screen does not assign GATT, Tuya/DP, battery, current, power, speed, regen, or command semantics.'
          new = 'This artifact is passive software evidence. File and build hashes are software provenance, not independent field authorization. CoreBluetooth correlation uses full peripheral identity, but it does not authenticate the physical ES80. This screen does not assign GATT, Tuya/DP, battery, current, power, speed, regen, or command semantics.'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Details truth anchor, found {count}')
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          git diff --check

      - name: Commit clean result and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_temporary_es80_v14_details_truth.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git diff --cached --check
          git commit -m 'fix(capture): keep CoreBluetooth truth inside Details'
          git push origin HEAD:product/es80-v14-rider-details-boundary/gpt56-thinking-go
