name: V14 Capture Post-Seal Local BLE Patch

on:
  push:
    branches:
      - integration/v14-capture-post-seal-local-ble-sol

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-post-seal-local-ble-sol
          fetch-depth: 0

      - name: Apply guarded post-seal authority repair
        shell: python
        run: |
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()
          old = "\n".join([
              "                        try await sessionLedger.sealAcceptedObservation(for: token)",
              "                        guard self.buildIdentity.isAuthoritativeFieldBuild,",
          ])
          new = "\n".join([
              "                        try await sessionLedger.sealAcceptedObservation(for: token)",
              "                        let postSealLocalBLEOnline = driver.isLocallyConnected(uuid: self.tuyaUUID)",
              "                        self.sdkLocalBLEOnline = postSealLocalBLEOnline",
              "                        guard postSealLocalBLEOnline else {",
              "                            self.currentConnectionToken = nil",
              "                            self.localBLESettlementToken = nil",
              "                            self.driver = nil",
              "                            self.phase = .failed",
              "                            self.message = \"Official Tuya local-BLE currentness was no longer present after canonical seal. The sealed package chronology remains diagnostic only; restart from OFF1.\"",
              "                            self.log(\"local_ble_authority_lost_during_acceptance_seal\", [",
              "                                \"generation\": String(token.diagnosticGeneration)",
              "                            ])",
              "                            return",
              "                        }",
              "                        guard self.buildIdentity.isAuthoritativeFieldBuild,",
          ])
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"guard failed: expected exact seal/source-authority seam once, found {count}")
          path.write_text(text.replace(old, new, 1))

      - name: Validate exact post-seal boundary
        shell: python
        run: |
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          marker = "try await sessionLedger.sealAcceptedObservation(for: token)"
          seal = source.index(marker)
          recheck = source.index("driver.isLocallyConnected(uuid: self.tuyaUUID)", seal + len(marker))
          freeze = source.index("self.sealedAcceptedExport = self.makeExport(", recheck)
          between = source[seal + len(marker):recheck]
          if "await " in between:
              raise SystemExit("suspension introduced before post-seal local-BLE recheck")
          window = source[seal:freeze]
          required = [
              "self.sdkLocalBLEOnline = postSealLocalBLEOnline",
              "guard postSealLocalBLEOnline else",
              "self.phase = .failed",
              "local_ble_authority_lost_during_acceptance_seal",
          ]
          missing = [item for item in required if item not in window]
          if missing:
              raise SystemExit(f"missing post-seal authority contract: {missing}")
          forbidden = [
              "sessionLedger.endConnection",
              "markAuthenticationFailed",
              "markSourceAuthorityInvalidated",
              "markObservationContinuityInvalidated",
              "markInternalLifecycleFailure",
          ]
          present = [item for item in forbidden if item in window]
          if present:
              raise SystemExit(f"post-seal path manufactured a second ledger terminal: {present}")

      - name: Commit production delta
        run: |
          git diff --check
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m "fix(capture): recheck local BLE after canonical seal"
          git push origin HEAD:integration/v14-capture-post-seal-local-ble-sol
