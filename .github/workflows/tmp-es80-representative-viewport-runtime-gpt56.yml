name: Temporary ES80 representative viewport repair

on:
  push:
    branches:
      - fix/es80-v14-representative-viewport-runtime/gpt56-thinking

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact visual parent
        run: test "$(git rev-parse HEAD^)" = "d6f8d13e0859740f2d151ce9e5bc0ebaa8e9459f"

      - name: Replace representative matrix with viewport-proven evidence
        env:
          METHOD_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path("NembraUITests/ES80ResearchCaptureUITests.swift")
          source = path.read_text(encoding="utf-8")
          start_token = "    @MainActor\n    func testV14SimulatorQACapturesRepresentativeInProgressAndRecoveryStates() {"
          end_token = "    func testSimulatorQAAppSeamIsCompileBoundedAndProductionRouteRemainsLocked() throws {"
          start = source.find(start_token)
          end = source.find(end_token, start)
          if start < 0 or end < 0:
              raise SystemExit("representative matrix replacement boundary not found")
          replacement = base64.b64decode(os.environ["METHOD_B64"]).decode("utf-8")
          updated = source[:start] + replacement + source[end:]
          if updated.count("testV14SimulatorQACapturesRepresentativeInProgressAndRecoveryStates") != 1:
              raise SystemExit("representative matrix method count changed unexpectedly")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Verify viewport contract shape and exact scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "NembraUITests/ES80ResearchCaptureUITests.swift"
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraUITests/ES80ResearchCaptureUITests.swift").read_text()
          start = source.index("func testV14SimulatorQACapturesRepresentativeInProgressAndRecoveryStates()")
          end = source.index("func testSimulatorQAAppSeamIsCompileBoundedAndProductionRouteRemainsLocked()", start)
          matrix = source[start:end]
          assert matrix.count("assertVisibleInScreenshotViewport(") >= 3
          assert matrix.count("bringIntoScreenshotViewport(") >= 2
          assert matrix.index("assertVisibleInScreenshotViewport(") < matrix.index("XCTAttachment(screenshot: app.screenshot())")
          assert "es80.capture.simulator-qa" in matrix
          assert "expectation.requiredText" in matrix
          assert "expectation.requiredIdentifier" in matrix
          PY

      - name: Commit runtime repair and self-delete transformer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-representative-viewport-runtime-gpt56.yml
          git add NembraUITests/ES80ResearchCaptureUITests.swift
          git commit -m "Capture visual QA: prove representative screenshot viewports"
          git push origin HEAD:fix/es80-v14-representative-viewport-runtime/gpt56-thinking
