name: Materialize Capture Foreground Target Revocation

on:
  push:
    branches: [fix/v14-capture-foreground-target-revocation-sol]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-foreground-target-revocation-sol
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact merged foreground product source
        run: |
          set -euo pipefail
          parent=1c40853f6991b4d09206df1d25ecff021458b7eb
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Materialize and validate foreground authority repair
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_foreground_target_revocation.py
          python3 -m py_compile scripts/ci/materialize_capture_foreground_target_revocation.py
          git diff --check
      - name: Publish clean two-path repair
        run: |
          set -euo pipefail
          parent=1c40853f6991b4d09206df1d25ecff021458b7eb
          rm .github/workflows/materialize-capture-foreground-target-revocation.yml
          rm scripts/ci/materialize_capture_foreground_target_revocation.py
          git add -A
          git diff --cached --check
          git config user.name nembra-sol
          git config user.email nembra-sol@users.noreply.github.com
          git commit -m 'fix(capture): revoke target authority on foreground loss'
          test "$(git diff --name-only "$parent" HEAD | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift' | sort)"
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-foreground-target-revocation-sol
