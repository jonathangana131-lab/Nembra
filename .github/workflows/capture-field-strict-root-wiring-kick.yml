# V17 execution nudge: workflow already exists on this branch, so this push is eligible.
name: Capture field strict-root wiring kick

on:
  push:
    branches:
      - repair/v17-capture-field-strict-root-wiring-gpt56sol-20260817
    paths:
      - .github/workflows/capture-field-strict-root-wiring-kick.yml

permissions:
  contents: write

jobs:
  rearm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Re-arm reviewed materializer and self-delete
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/capture-field-strict-root-wiring-materialize.yml')
          text = path.read_text()
          old = '''on:
  pull_request:
    paths:
      - .github/capture-field-strict-root-wiring.trigger
'''
          new = '''on:
  push:
    branches:
      - repair/v17-capture-field-strict-root-wiring-gpt56sol-20260817
'''
          if text.count(old) != 1:
              raise SystemExit('materializer event anchor drifted')
          text = text.replace(old, new, 1)
          text = text.replace(
              "    if: github.head_ref == 'repair/v17-capture-field-strict-root-wiring-gpt56sol-20260817'",
              "    if: github.ref_name == 'repair/v17-capture-field-strict-root-wiring-gpt56sol-20260817'",
              1,
          )
          text = text.replace('github.event.pull_request.head.sha', 'github.sha')
          path.write_text(text)
      - name: Publish re-arm
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/capture-field-strict-root-wiring-materialize.yml
          git rm .github/workflows/capture-field-strict-root-wiring-kick.yml
          git diff --cached --check
          git commit -m 'ci: re-arm field strict-root materializer'
          git push origin HEAD:repair/v17-capture-field-strict-root-wiring-gpt56sol-20260817