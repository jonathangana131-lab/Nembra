name: Apply Phase 9 unknown-speed QA

on:
  push:
    branches:
      - feature/landscape-dashboard

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/landscape-dashboard
          fetch-depth: 0

      - name: Apply QA scenario patch
        run: python3 scripts/patch_phase9_unknown_speed_qa.py

      - name: Validate core package
        working-directory: Packages/NembraCore
        run: swift test

      - name: Validate QA wiring
        run: |
          grep -q 'connectedSpeedUnknown = "connected-speed-unknown"' Packages/NembraCore/Sources/NembraCore/SimulatedScooterService.swift
          grep -q 'testConnectedUnknownSpeedDoesNotPretendScooterIsStopped' NembraUITests/NembraUITests.swift
          grep -q 'testLandscapeUnknownSpeedSuppressesStoppedControls' NembraUITests/NembraUITests.swift
          grep -q 'connected-speed-unknown' scripts/ci/xcode27_simulator_capture.sh
          bash -n scripts/ci/xcode27_simulator_capture.sh

      - name: Commit validated QA scenario
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-phase9-unknown-speed-qa.yml scripts/patch_phase9_unknown_speed_qa.py
          git add Packages/NembraCore/Sources/NembraCore/SimulatedScooterService.swift \
                  Packages/NembraCore/Tests/NembraCoreTests/SimulatedScooterServiceTests.swift \
                  NembraUITests/NembraUITests.swift \
                  scripts/ci/xcode27_simulator_capture.sh
          git commit -m 'test: prove connected unknown-speed safety state'
          git push origin HEAD:feature/landscape-dashboard
