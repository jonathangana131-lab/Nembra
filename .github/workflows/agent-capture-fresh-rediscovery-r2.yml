name: Agent Capture Fresh Rediscovery R2
on:
  push:
    branches: [agent/capture-experiment-one-fresh-rediscovery-v14-r2]
permissions:
  contents: write
jobs:
  reanchor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/capture-experiment-one-fresh-rediscovery-v14-r2
          fetch-depth: 0
      - name: Re-anchor exact three-path product delta
        run: |
          set -euo pipefail
          git fetch origin agent/capture-experiment-one-fresh-rediscovery-v14
          git diff 4bf932d106e8ecef990991aeb672f24c73cdef3b..2b0a603be8a063b7eddc57062b033b605a57e3ee -- \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift \
            | git apply --3way
          git diff --check
          git rm .github/workflows/agent-capture-fresh-rediscovery-r2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift
          git commit -m "[Capture Experiment One] Re-anchor post-admission rediscovery"
          git push origin HEAD:agent/capture-experiment-one-fresh-rediscovery-v14-r2
