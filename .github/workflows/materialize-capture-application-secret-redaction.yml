name: Materialize Capture Application Secret Redaction

on:
  push:
    branches:
      - red/v14-capture-application-secret-redaction-current-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: red/v14-capture-application-secret-redaction-current-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact product ancestry and untouched driver source
        shell: bash
        run: |
          set -euo pipefail
          parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-application-secret-redaction.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift'

      - name: Redact credential-shaped application values before controller custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          old = "\n".join([
              '    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {',
              '        guard let dps, !dps.isEmpty else { return }',
              '        var sanitized: [String: String] = [:]',
              '        for (key, value) in dps {',
              '            sanitized[String(describing: key)] = String(describing: value)',
              '        }',
              '        onApplicationUpdate?(sanitized)',
              '    }',
          ])
          if source.count(old) != 1:
              raise SystemExit('expected current dpsUpdate projection exactly once')
          new = "\n".join([
              '    private static let secretKeyFragments = [',
              '        "localkey",',
              '        "accesstoken",',
              '        "refreshtoken",',
              '        "authkey",',
              '        "seckey"',
              '    ]',
              '',
              '    private static func normalizedApplicationKey(_ key: Any) -> String {',
              '        String(describing: key).lowercased().filter { $0.isLetter || $0.isNumber }',
              '    }',
              '',
              '    private static func isCredentialShapedApplicationKey(_ key: Any) -> Bool {',
              '        let normalized = normalizedApplicationKey(key)',
              '        return secretKeyFragments.contains { normalized.contains($0) }',
              '    }',
              '',
              '    private static func redactApplicationSecrets(_ object: Any) -> Any {',
              '        if let dictionary = object as? [AnyHashable: Any] {',
              '            var sanitized: [String: Any] = [:]',
              '            for (key, value) in dictionary {',
              '                let keyString = String(describing: key)',
              '                if isCredentialShapedApplicationKey(key) {',
              '                    sanitized[keyString] = "<redacted>"',
              '                } else {',
              '                    sanitized[keyString] = redactApplicationSecrets(value)',
              '                }',
              '            }',
              '            return sanitized',
              '        }',
              '        if let array = object as? [Any] {',
              '            return array.map(redactApplicationSecrets)',
              '        }',
              '        return object',
              '    }',
              '',
              '    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {',
              '        guard let dps, !dps.isEmpty else { return }',
              '        var sanitized: [String: String] = [:]',
              '        for (key, value) in dps {',
              '            let keyString = String(describing: key)',
              '            if Self.isCredentialShapedApplicationKey(key) {',
              '                sanitized[keyString] = "<redacted>"',
              '            } else {',
              '                sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))',
              '            }',
              '        }',
              '        onApplicationUpdate?(sanitized)',
              '    }',
          ])
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate secret-custody contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('@MainActor\nprivate final class SmartLifeDriver')
          end = s.index('#endif\n\nprivate enum AppleAccountAuthorizationError', start)
          driver = s[start:end]
          for needle in ('private static func redactApplicationSecrets(_ object: Any) -> Any', 'secretKeyFragments', 'localkey', 'accesstoken', 'refreshtoken', 'authkey', 'seckey', 'key).lowercased().filter' ):
              pass
          required = [
              'private static func redactApplicationSecrets(_ object: Any) -> Any',
              'secretKeyFragments', 'localkey', 'accesstoken', 'refreshtoken', 'authkey', 'seckey',
              'lowercased().filter { $0.isLetter || $0.isNumber }',
              'array.map(redactApplicationSecrets)',
              'String(describing: Self.redactApplicationSecrets(value))',
              'sanitized[keyString] = "<redacted>"',
              'onApplicationUpdate?(sanitized)',
          ]
          for needle in required:
              assert needle in driver, needle
          assert 'sanitized[String(describing: key)] = String(describing: value)' not in driver
          assert 'publishDps' not in driver and 'queryDps' not in driver and 'writeValue' not in driver
          print('authenticated application secret custody: PASS')
          PY
          git diff --check

      - name: Publish clean two-path repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-application-secret-redaction.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          git diff --cached --check
          git commit -m 'fix(capture): redact authenticated application secrets'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:red/v14-capture-application-secret-redaction-current-sol
