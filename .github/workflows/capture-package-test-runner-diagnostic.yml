name: Capture Package Test Runner Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/capture-package-test-runner-diagnostic.yml'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/**'

permissions:
  contents: read

jobs:
  isolate-range-abort:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact clean head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED" "$actual"
          test "$actual" = "$EXPECTED"
          test -z "$(git status --porcelain)"

      - name: Run full package serially
        id: serial
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/capture-package-runner-diagnostic"
          mkdir -p "$root"
          log="$root/full-package-serial.log"
          set +e
          (cd Packages/NembraBluetoothCapture && swift test --no-parallel) 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if grep -q 'Range requires lowerBound <= upperBound' "$log"; then
            echo 'range_abort=1' >> "$GITHUB_OUTPUT"
          else
            echo 'range_abort=0' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Run same built package with default scheduling
        id: default
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/capture-package-runner-diagnostic"
          log="$root/full-package-default.log"
          set +e
          (cd Packages/NembraBluetoothCapture && swift test --skip-build) 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if grep -q 'Range requires lowerBound <= upperBound' "$log"; then
            echo 'range_abort=1' >> "$GITHUB_OUTPUT"
          else
            echo 'range_abort=0' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Report serial versus default truth
        env:
          SERIAL_STATUS: ${{ steps.serial.outputs.status }}
          SERIAL_RANGE_ABORT: ${{ steps.serial.outputs.range_abort }}
          DEFAULT_STATUS: ${{ steps.default.outputs.status }}
          DEFAULT_RANGE_ABORT: ${{ steps.default.outputs.range_abort }}
        run: |
          printf 'serial_status=%s\nserial_range_abort=%s\ndefault_status=%s\ndefault_range_abort=%s\n' \
            "$SERIAL_STATUS" "$SERIAL_RANGE_ABORT" "$DEFAULT_STATUS" "$DEFAULT_RANGE_ABORT"

          if [[ "$SERIAL_STATUS" == "0" && "$DEFAULT_STATUS" == "0" ]]; then
            echo 'Both serial and default full-package executions are green on this exact head.'
            exit 0
          fi

          if [[ "$SERIAL_STATUS" == "0" && "$DEFAULT_STATUS" != "0" && "$DEFAULT_RANGE_ABORT" == "1" ]]; then
            echo '::error::Serial execution is green while default scheduling reproduces the Range abort. This is concurrency/runner interaction evidence; do not weaken assertions or silently waive the default red gate.'
            exit 1
          fi

          if [[ "$SERIAL_STATUS" != "0" && "$SERIAL_RANGE_ABORT" == "1" ]]; then
            echo '::error::The Range abort reproduces even with serial execution. Continue source-test isolation; parallel scheduling is not required to trigger it.'
            exit 1
          fi

          echo '::error::Serial/default executions disagree or remain red for a non-Range reason; inspect retained exact-head logs before changing acceptance behavior.'
          exit 1

      - name: Upload exact diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capture-package-runner-diagnostic-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/capture-package-runner-diagnostic
          retention-days: 7
          if-no-files-found: error
