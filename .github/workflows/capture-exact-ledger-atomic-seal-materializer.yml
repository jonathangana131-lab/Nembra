name: Capture exact-ledger atomic seal donor

on:
  push:
    branches:
      - capture/atomic-seal-cut-donor-sol-20260814

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/atomic-seal-cut-donor-sol-20260814
          fetch-depth: 2
          persist-credentials: true
      - name: Atomically cut exact-ledger receipt issuance before seal sampling
        env:
          EXPECTED_PARENT: 31a2cef4d6b6e33f64b3e407c7bfd465d726acca
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -f scripts/ci/materialize_capture_exact_ledger_atomic_seal.py
          python3 scripts/ci/materialize_capture_exact_ledger_atomic_seal.py
          test ! -e scripts/ci/materialize_capture_exact_ledger_atomic_seal.py
          test ! -e .github/workflows/capture-exact-ledger-atomic-seal-materializer.yml
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Capture V16.1: atomically cut exact-ledger receipt authority before seal'
          git push origin HEAD:capture/atomic-seal-cut-donor-sol-20260814
