name: TEMP Capture Tuya Approval Race Materializer
on:
  push:
    branches: [agent/v14-capture-tuya-approval-failclosed-sol]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'jonathangana131-lab/Nembra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-tuya-approval-failclosed-sol
          fetch-depth: 2
      - name: Verify exact parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3e30fce57cc23422f43164827036e917b45f4d74"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tmp-capture-tuya-approval-race-materialize.yml"
      - name: Fence concurrent approval callbacks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NembraApp/Features/Research/TuyaAccountBridge.swift')
          s=p.read_text()
          old='''            if approvalSucceeded {
                          phase = .failed
                          statusMessage = "Tuya approved, but the account session was rejected: \\(Self.readable(error)) Reset the account link, then create a fresh QR."
                          pollTask?.cancel()
                          pollTask = nil
                      } else if phase == .waitingForApproval {'''
          new='''            if approvalSucceeded {
                          // Make every sibling approval callback stale before publishing the terminal.
                          invalidateAsyncOperations()
                          phase = .failed
                          statusMessage = "Tuya approved, but the account session was rejected: \\(Self.readable(error)) Reset the account link, then create a fresh QR."
                      } else if phase == .waitingForApproval {'''
          if s.count(old)!=1: raise SystemExit('rejection block drifted')
          p.write_text(s.replace(old,new,1))
          t=Path('scripts/ci/tests/test_tuya_account_transport_source.py')
          q=t.read_text()
          anchor="        self.assertNotIn('Tap Try again to make a fresh QR.', SOURCE)\n        self.assertIn('pollTask?.cancel()', SOURCE)"
          repl="        self.assertNotIn('Tap Try again to make a fresh QR.', SOURCE)\n        self.assertIn('if approvalSucceeded {\\n                // Make every sibling approval callback stale', SOURCE)\n        self.assertIn('invalidateAsyncOperations()\\n                phase = .failed', SOURCE)\n        self.assertNotIn('if approvalSucceeded {\\n                phase = .failed', SOURCE)"
          if q.count(anchor)!=1: raise SystemExit('test anchor drifted')
          t.write_text(q.replace(anchor,repl,1))
          PY
          python3 scripts/ci/tests/test_tuya_account_transport_source.py
      - name: Commit and self-delete
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-capture-tuya-approval-race-materialize.yml
          git config user.name jonathangana131-lab
          git config user.email jonathangana131@gmail.com
          git add NembraApp/Features/Research/TuyaAccountBridge.swift scripts/ci/tests/test_tuya_account_transport_source.py .github/workflows/tmp-capture-tuya-approval-race-materialize.yml
          git commit -m "fix(capture): invalidate concurrent rejected approvals"
          git push origin HEAD:agent/v14-capture-tuya-approval-failclosed-sol
