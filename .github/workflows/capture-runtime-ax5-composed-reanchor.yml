name: Capture Runtime AX5 Composed Re-anchor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/capture-runtime-ax5-composed-reanchor.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: capture-runtime-ax5-composed-reanchor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-ax5-composed:
    name: Exact ff779 iPhone 12 Standard + AX5 VoiceOver
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PRODUCT_PARENT_SHA: ff77967e1089a1da9c862c894396cf64d145236d
      PRODUCT_SOURCE_BLOB: 59124f9528421ee060f11df706b565099fd397be
      PREDECESSOR_RUN_ID: '31662581043'
      PREDECESSOR_ARTIFACT_ID: '9167148414'
      PREDECESSOR_ARTIFACT_DIGEST: sha256:065ffc149e2ca5f57b7d140534fb9d94dd5a5ff30a939bee1a104595c170539a
      PREDECESSOR_WITNESS_SHA256: c5025b0cda387947b5024c962bca4387cfa1694ade06141051e47e573613d9f6

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation child and committed composed product bytes
        shell: bash
        run: |
          set -euo pipefail
          exact_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$exact_head"
          git cat-file -e "${PRODUCT_PARENT_SHA}^{commit}"
          test "$(git merge-base "$PRODUCT_PARENT_SHA" HEAD)" = "$PRODUCT_PARENT_SHA"
          test "$(git diff --name-only "$PRODUCT_PARENT_SHA"...HEAD)" = '.github/workflows/capture-runtime-ax5-composed-reanchor.yml'
          test "$(git rev-parse "${PRODUCT_PARENT_SHA}:NembraApp/App/NembraCaptureEntrypoint.swift")" = "$PRODUCT_SOURCE_BLOB"
          test "$(git rev-parse "HEAD:NembraApp/App/NembraCaptureEntrypoint.swift")" = "$PRODUCT_SOURCE_BLOB"
          test "$(grep -Fc '.accessibilitySortPriority(isAccessibilityLayout ? 100 : 0)' NembraApp/App/NembraCaptureEntrypoint.swift)" = 1
          test -f docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md
          grep -Fq 'Status: **PHYSICAL NO-GO.**' docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md
          git diff --check "$PRODUCT_PARENT_SHA"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'NEMBRA_AX5_VALIDATION_HEAD=%s\n' "$exact_head" >> "$GITHUB_ENV"
          printf 'NEMBRA_AX5_PRODUCT_SOURCE_SHA256=%s\n' "$(shasum -a 256 NembraApp/App/NembraCaptureEntrypoint.swift | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Download exact predecessor VoiceOver witness
        uses: actions/download-artifact@v5
        with:
          name: nembra-capture-runtime-voiceover-prefix-f557-3210-1
          path: ${{ runner.temp }}/voiceover-predecessor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31662581043

      - name: Verify immutable runtime witness
        shell: bash
        run: |
          set -euo pipefail
          witness="$RUNNER_TEMP/voiceover-predecessor/generated-runtime-witness.swift"
          test -f "$witness"
          test "$(shasum -a 256 "$witness" | awk '{print $1}')" = "$PREDECESSOR_WITNESS_SHA256"
          grep -Fq '"Physical capture locked"' "$witness"
          grep -Fq 'performSemanticOverrideAwareAccessibilityAudit' "$witness"
          grep -Fq 'classifiedVoiceOverCode3' "$witness"
          printf 'NEMBRA_AX5_WITNESS=%s\n' "$witness" >> "$GITHUB_ENV"

      - name: Record exact toolchain and build committed composed product
        shell: bash
        run: |
          set -euo pipefail
          {
            xcodebuild -version
            sw_vers
            xcrun simctl version || true
          } > "$RUNNER_TEMP/CaptureAX5Composed.toolchain.txt" 2>&1
          procedure='ES80-AUTHENTICATED-STATIONARY-v1'
          label="capture-v17-${PRODUCT_PARENT_SHA:0:12}"
          rm -rf /tmp/NembraCaptureAX5ComposedDerived
          xcodebuild -project NembraCapture.xcodeproj -scheme 'Nembra Capture' -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureAX5ComposedDerived CODE_SIGNING_ALLOWED=NO \
            NEMBRA_CAPTURE_BUILD_IDENTIFIER="$label" \
            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$PRODUCT_PARENT_SHA" \
            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="" \
            NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER="$procedure" build
          plist='/tmp/NembraCaptureAX5ComposedDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app/Info.plist'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = 'com.jonathangana131.nembra.capturelearn'
          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$PRODUCT_PARENT_SHA"
          test -z "$(plutil -extract NembraCaptureTuyaDependencyLockSHA256 raw -o - "$plist" 2>/dev/null || true)"

      - name: Create exact iPhone 12 iOS 27 baseline and install product
        shell: bash
        run: |
          set -euo pipefail
          runtime="$({ xcrun simctl list runtimes -j | /usr/bin/python3 -c '
          import json,sys
          rows=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable", True) and str(r.get("identifier", "")).startswith("com.apple.CoreSimulator.SimRuntime.iOS-27")]
          if not rows: raise SystemExit(1)
          rows.sort(key=lambda r: tuple(int(p) for p in str(r.get("version","0")).split(".") if p.isdigit()), reverse=True)
          print(rows[0]["identifier"])
          '; } 2>/dev/null)"
          device_type="$({ xcrun simctl list devicetypes -j | /usr/bin/python3 -c '
          import json,sys
          for row in json.load(sys.stdin)["devicetypes"]:
              if row.get("name") == "iPhone 12": print(row["identifier"]); raise SystemExit(0)
          raise SystemExit(1)
          '; } 2>/dev/null)"
          test "$device_type" = 'com.apple.CoreSimulator.SimDeviceType.iPhone-12'
          udid="$(xcrun simctl create "Nembra Capture AX5 Composed ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$device_type" "$runtime")"
          printf 'NEMBRA_AX5_UDID=%s\n' "$udid" >> "$GITHUB_ENV"
          printf 'NEMBRA_AX5_RUNTIME=%s\n' "$runtime" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl ui "$udid" content_size large
          xcrun simctl install "$udid" '/tmp/NembraCaptureAX5ComposedDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app'

          test -f NembraUITests/NembraUITests.swift
          cp NembraUITests/NembraUITests.swift "$RUNNER_TEMP/NembraUITests.original.swift"
          printf '\n' >> NembraUITests/NembraUITests.swift
          cat "$NEMBRA_AX5_WITNESS" >> NembraUITests/NembraUITests.swift
          git diff --check -- NembraUITests/NembraUITests.swift

      - name: Run Standard and Accessibility XXXL real-VoiceOver contracts
        shell: bash
        run: |
          set -euo pipefail
          bundle='com.jonathangana131.nembra.capturelearn'
          rm -rf /tmp/NembraAX5ComposedUITests
          for state in standard ax5; do
            if [[ "$state" == standard ]]; then
              size='large'
              test_id='testStandaloneCaptureStandardVoiceOverPreservesFirstFoldAuthority'
            else
              size='accessibility-extra-extra-extra-large'
              test_id='testStandaloneCaptureAccessibilityXXXLVoiceOverRemainsActionFirst'
            fi
            result="$RUNNER_TEMP/CaptureAX5Composed.${state}.xcresult"
            rm -rf "$result"
            xcrun simctl ui "$NEMBRA_AX5_UDID" content_size "$size"
            xcrun simctl terminate "$NEMBRA_AX5_UDID" "$bundle" >/dev/null 2>&1 || true
            set +e
            xcodebuild test -project Nembra.xcodeproj -scheme Nembra -configuration Debug \
              -destination "platform=iOS Simulator,id=$NEMBRA_AX5_UDID" \
              -derivedDataPath /tmp/NembraAX5ComposedUITests \
              -resultBundlePath "$result" CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
              -only-testing:NembraUITests/CaptureRuntimeVoiceOverUITests/"$test_id"
            status=$?
            set -e
            printf '%s\n' "$status" > "$RUNNER_TEMP/CaptureAX5Composed.${state}.exit-status.txt"
          done
          test "$(cat "$RUNNER_TEMP/CaptureAX5Composed.standard.exit-status.txt")" = 0
          test "$(cat "$RUNNER_TEMP/CaptureAX5Composed.ax5.exit-status.txt")" = 0

      - name: Seal exact composed-product runtime evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/CaptureAX5ComposedEvidence"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/CaptureAX5Composed.toolchain.txt" "$evidence/"
          cp "$NEMBRA_AX5_WITNESS" "$evidence/generated-runtime-witness.swift"
          for state in standard ax5; do
            result="$RUNNER_TEMP/CaptureAX5Composed.${state}.xcresult"
            test -d "$result"
            xcrun xcresulttool get test-results tests --path "$result" --compact > "$evidence/${state}.tests.json"
            xcrun xcresulttool get object --legacy --path "$result" --format json > "$evidence/${state}.legacy-root.json"
            cp "$RUNNER_TEMP/CaptureAX5Composed.${state}.exit-status.txt" "$evidence/"
            ditto -c -k --sequesterRsrc --keepParent "$result" "$evidence/${state}.xcresult.zip"
          done
          /usr/bin/python3 -B -I - "$evidence" <<'PY'
          import hashlib, json, os, pathlib, sys
          evidence=pathlib.Path(sys.argv[1])
          ids={'standard':'testStandaloneCaptureStandardVoiceOverPreservesFirstFoldAuthority','ax5':'testStandaloneCaptureAccessibilityXXXLVoiceOverRemainsActionFirst'}
          states=[]
          for state, needle in ids.items():
              legacy=json.loads((evidence/f'{state}.legacy-root.json').read_text())
              count=int(legacy['metrics']['testsCount']['_value'])
              status=int((evidence/f'CaptureAX5Composed.{state}.exit-status.txt').read_text())
              states.append({'state':state,'targetedTestIdentifier':needle,'executedTestCount':count,'xcodebuildExitStatus':status,'xcresultZipSHA256':hashlib.sha256((evidence/f'{state}.xcresult.zip').read_bytes()).hexdigest()})
          manifest={'schemaVersion':2,'authority':'capture-runtime-accessibility-composed-reanchor','validationHeadSHA':os.environ['NEMBRA_AX5_VALIDATION_HEAD'],'productHeadSHA':os.environ['PRODUCT_PARENT_SHA'],'productSourceBlob':os.environ['PRODUCT_SOURCE_BLOB'],'productSourceSHA256':os.environ['NEMBRA_AX5_PRODUCT_SOURCE_SHA256'],'baselineDevice':'iPhone 12','baselineOS':'iOS 27','simulatorRuntime':os.environ['NEMBRA_AX5_RUNTIME'],'predecessorRunID':int(os.environ['PREDECESSOR_RUN_ID']),'predecessorArtifactID':int(os.environ['PREDECESSOR_ARTIFACT_ID']),'predecessorArtifactDigest':os.environ['PREDECESSOR_ARTIFACT_DIGEST'],'generatedWitnessSHA256':os.environ['PREDECESSOR_WITNESS_SHA256'],'productBytesCommittedOnParent':True,'validationBranchProductDelta':False,'stationaryRunbookAuthorityInherited':True,'physicalAuthorityCreated':False,'protocolAuthorityCreated':False,'states':states}
          (evidence/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          if any(s['executedTestCount'] != 1 for s in states): raise SystemExit('targeted test count changed')
          if any(s['xcodebuildExitStatus'] != 0 for s in states): raise SystemExit('runtime product matrix not green')
          PY

      - name: Restore workspace and require validation-only delta
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/NembraUITests.original.swift" ]]; then
            cp "$RUNNER_TEMP/NembraUITests.original.swift" NembraUITests/NembraUITests.swift
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git diff --name-only "$PRODUCT_PARENT_SHA"...HEAD)" = '.github/workflows/capture-runtime-ax5-composed-reanchor.yml'

      - name: Upload retained exact-composed AX5 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nembra-capture-runtime-ax5-composed-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/CaptureAX5ComposedEvidence
          if-no-files-found: error
          retention-days: 14

      - name: Delete temporary Simulator
        if: always()
        shell: bash
        run: |
          if [[ -n "${NEMBRA_AX5_UDID:-}" ]]; then
            xcrun simctl shutdown "$NEMBRA_AX5_UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$NEMBRA_AX5_UDID" >/dev/null 2>&1 || true
          fi
