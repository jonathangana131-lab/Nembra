name: Capture recorded-boundary recovery exact-product QA

on:
  push:
    branches:
      - cell/capture-recorded-recovery-precedence/ci/gpt56

permissions:
  contents: read

jobs:
  recorded-recovery-qa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify immutable product parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8d517976bd95a7d8b8917e17713ccda89af55409"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/qa-capture-recorded-recovery-precedence-gpt56.yml"

      - name: Report Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Reject application characteristic writes
        run: |
          set -euo pipefail
          if grep -R --include='*.swift' -nE '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Application characteristic-value write path detected.' >&2
            exit 1
          fi

      - name: Verify recovery precedence source contract
        run: |
          set -euo pipefail
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -q 'let recordedHorizonFailure = error' "$controller"
          grep -q 'throw recordedHorizonFailure' "$controller"
          grep -q 'let recordedReadyFailure = error' "$controller"
          grep -q 'throw recordedReadyFailure' "$controller"
          if grep -q 'try? observationBoundaryQueueGate.abortRecordedHorizonBeforeGateCommit' "$controller"; then exit 1; fi
          if grep -q 'try? self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit' "$controller"; then exit 1; fi

      - name: Run NembraCore warnings-as-errors tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors

      - name: Run full Capture warnings-as-errors tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Build Capture package for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture -destination 'generic/platform=iOS Simulator' SWIFT_TREAT_WARNINGS_AS_ERRORS=YES CODE_SIGNING_ALLOWED=NO build

      - name: Build Nembra app for generic iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild -project Nembra.xcodeproj -scheme Nembra -destination 'generic/platform=iOS Simulator' SWIFT_TREAT_WARNINGS_AS_ERRORS=YES CODE_SIGNING_ALLOWED=NO build

      - name: Build ES80 Research app for generic iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild -project Nembra.xcodeproj -scheme 'Nembra ES80 Research' -destination 'generic/platform=iOS Simulator' SWIFT_TREAT_WARNINGS_AS_ERRORS=YES CODE_SIGNING_ALLOWED=NO build
