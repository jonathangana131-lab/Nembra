name: Materialize Capture Mid-Series BLE Ownership R2

on:
  push:
    branches:
      - fix/v14-capture-midseries-ble-ownership-a480-sol2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v14-capture-midseries-ble-ownership-a480-sol2

      - name: Guard and materialize
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a480923c9263389923e334fdca0c8df59ad1b822"
          python3 scripts/ci/materialize_capture_midseries_ble_ownership.py
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMidSeriesBLEOwnershipSourceTests.swift

      - name: Pin truth boundaries
        shell: bash
        run: |
          set -euo pipefail
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          test_file='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMidSeriesBLEOwnershipSourceTests.swift'
          grep -Fq 'sdk_local_ble_reacquired_during_target_correlation' "$app"
          grep -Fq 'sdk_local_ble_ownership_blocks_correlation_window' "$app"
          grep -Fq 'sdk_local_ble_ownership_invalidates_correlation_window' "$app"
          grep -Fq 'Task.sleep(nanoseconds: 250_000_000)' "$app"
          grep -Fq 'let appleNickname = credential.fullName?.nickname' "$app"
          grep -Fq 'One guided setup establishes the account and bound-device context Nembra will use before passive target correlation begins.' "$app"
          grep -Fq 'ownership fence remains observation-only' "$test_file"

      - name: Publish clean product child
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ci/materialize_capture_midseries_ble_ownership.py .github/workflows/v14-materialize-capture-midseries-ble-ownership.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): fence Tuya BLE across correlation windows'
          git push origin HEAD:fix/v14-capture-midseries-ble-ownership-a480-sol2
