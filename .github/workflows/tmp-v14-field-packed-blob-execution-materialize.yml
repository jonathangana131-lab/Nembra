name: tmp v14 field packed blob execution materialize

on:
  push:
    branches:
      - repair/v14-field-packed-blob-execution-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind temporary construction scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor d0b134ca2a49edc029f114660dfb8e216ece682e HEAD
          mapfile -t changed < <(git diff --name-only d0b134ca2a49edc029f114660dfb8e216ece682e...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/tmp-v14-field-packed-blob-execution-materialize.yml"
          test "${changed[1]}" = "scripts/ci/tmp_materialize_field_packed_blob_execution.py"

      - name: Materialize exact diagnostic and production repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B scripts/ci/tmp_materialize_field_packed_blob_execution.py
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path
          path = Path("scripts/field/install_one_time_capture.command")
          source = path.read_text(encoding="utf-8")
          old = r'b"\\0"'
          new = r'b"\x00"'
          count = source.count(old)
          if count != 3:
              raise SystemExit(f"expected three generated Git blob framing literals, found {count}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Validate packed-object execution closure
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B scripts/ci/tests/test_capture_field_git_packed_blob_execution_red_team.py
          test -f scripts/ci/tests/test_capture_field_private_runner_execution_red_team.py && \
            /usr/bin/python3 -B scripts/ci/tests/test_capture_field_private_runner_execution_red_team.py || true
          test -f scripts/ci/tests/test_capture_tuya_private_input_provenance.py && \
            /usr/bin/python3 -B scripts/ci/tests/test_capture_tuya_private_input_provenance.py || true
          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path
          source = Path("scripts/field/install_one_time_capture.command").read_text(encoding="utf-8")
          required = (
              "accepted_source_blob_oid()",
              "NEMBRA_ACCEPTED_PRIVATE_RUNNER_BLOB_OID",
              "accepted Bash Git payload does not match its accepted blob identity",
              "accepted private intended-device reader payload does not match its accepted blob identity",
              "accepted source helper payload does not match its accepted blob identity",
              'b"\\x00"',
          )
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit(f"packed-object repair markers missing: {missing}")
          if 'run_authority_git show "$SOURCE_SHA:$relative_path" |\n        /bin/bash' in source:
              raise SystemExit("direct unverified accepted Bash stream survived")
          PY
          git diff --check
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"

      - name: Publish clean repair head
        shell: bash
        env:
          TARGET_BRANCH: repair/v14-field-packed-blob-execution-sol-20260811
        run: |
          set -euo pipefail
          git config user.name "nembra-sol-worker"
          git config user.email "nembra-sol-worker@users.noreply.github.com"
          git add scripts/field/install_one_time_capture.command \
                  scripts/ci/tests/test_capture_field_git_packed_blob_execution_red_team.py \
                  .github/workflows/capture-field-git-packed-blob-execution-red-team.yml
          git commit -m "Bind accepted Git execution bytes to blob identity"
          git rm .github/workflows/tmp-v14-field-packed-blob-execution-materialize.yml \
                 scripts/ci/tmp_materialize_field_packed_blob_execution.py
          git commit -m "Remove one-shot packed-blob materializer"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check d0b134ca2a49edc029f114660dfb8e216ece682e..HEAD
          mapfile -t final_changed < <(git diff --name-only d0b134ca2a49edc029f114660dfb8e216ece682e..HEAD | sort)
          printf '%s\n' "${final_changed[@]}"
          test "${#final_changed[@]}" -eq 3
          test "${final_changed[0]}" = ".github/workflows/capture-field-git-packed-blob-execution-red-team.yml"
          test "${final_changed[1]}" = "scripts/ci/tests/test_capture_field_git_packed_blob_execution_red_team.py"
          test "${final_changed[2]}" = "scripts/field/install_one_time_capture.command"
          git push origin "HEAD:${TARGET_BRANCH}"
