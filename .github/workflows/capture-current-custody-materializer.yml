name: Capture current custody materializer

on:
  push:
    branches:
      - repair/v14-capture-current-custody-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact-current Capture repair
        run: python3 .github/materializers/capture_current_custody.py
