name: Capture Darwin ACL Acquisition Split

on:
  pull_request:
    paths:
      - .github/workflows/capture-darwin-acl-acquisition-split.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    if: github.head_ref == 'validation/v17-capture-darwin-acl-acquisition-split-sol-20260817'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact attacked parent and validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          parent='f85b8c586d59fe036c4fc1a5f7624cc19bcfbbe5'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/capture-darwin-acl-acquisition-split.yml'

      - name: Record xcode-27 ACL declarations
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
          echo "NEMBRA_DARWIN_ACL_SDK=$sdk"
          /usr/bin/grep -nE 'acl_get_(fd|file)' "$sdk/usr/include/sys/acl.h" || true

      - name: Classify pathname-native and held-fd extended ACL views
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          field_user="$(/usr/bin/id -un)"
          work="$(mktemp -d "$RUNNER_TEMP/nembra-acl-acquisition.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          cat > "$work/acquire.c" <<'C'
          #include <sys/types.h>
          #include <sys/acl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static void die(const char *label) {
              fprintf(stderr, "%s: %s\n", label, strerror(errno));
              exit(2);
          }

          static char *acl_text(acl_t acl) {
              if (!acl) die("acl acquisition");
              ssize_t len = 0;
              char *text = acl_to_text(acl, &len);
              if (!text) die("acl_to_text");
              char *copy = calloc((size_t)len + 1, 1);
              if (!copy) die("calloc");
              memcpy(copy, text, (size_t)len);
              acl_free(text);
              acl_free(acl);
              return copy;
          }

          static int run_chmod(const char *mode, const char *acl, const char *path) {
              pid_t pid = fork();
              if (pid < 0) die("fork");
              if (pid == 0) {
                  if (acl) {
                      execl("/bin/chmod", "chmod", mode, acl, path, (char *)NULL);
                  } else {
                      execl("/bin/chmod", "chmod", mode, path, (char *)NULL);
                  }
                  _exit(127);
              }
              int status = 0;
              if (waitpid(pid, &status, 0) < 0) die("waitpid");
              return WIFEXITED(status) ? WEXITSTATUS(status) : 126;
          }

          int main(int argc, char **argv) {
              if (argc != 3) return 64;
              const char *path = argv[1];
              const char *principal = argv[2];
              int fd = open(path, O_RDONLY | O_DIRECTORY);
              if (fd < 0) die("open");

              struct stat before_path, before_fd, after_path, after_fd;
              if (stat(path, &before_path) != 0) die("stat before");
              if (fstat(fd, &before_fd) != 0) die("fstat before");
              if (before_path.st_dev != before_fd.st_dev || before_path.st_ino != before_fd.st_ino) {
                  fprintf(stderr, "initial pathname/fd identity mismatch\n");
                  return 3;
              }

              char *baseline_path = acl_text(acl_get_file(path, ACL_TYPE_EXTENDED));
              char *baseline_fd = acl_text(acl_get_fd(fd));

              char ace[1024];
              if (snprintf(ace, sizeof(ace), "user:%s allow list,search,readattr,readextattr,readsecurity", principal) >= (int)sizeof(ace)) {
                  fprintf(stderr, "principal too long\n");
                  return 4;
              }
              if (run_chmod("+a", ace, path) != 0) {
                  fprintf(stderr, "pathname chmod +a failed\n");
                  return 5;
              }

              if (stat(path, &after_path) != 0) die("stat after");
              if (fstat(fd, &after_fd) != 0) die("fstat after");
              if (after_path.st_dev != after_fd.st_dev || after_path.st_ino != after_fd.st_ino ||
                  before_fd.st_dev != after_fd.st_dev || before_fd.st_ino != after_fd.st_ino) {
                  fprintf(stderr, "pathname/fd identity changed during acquisition classification\n");
                  return 6;
              }

              char *path_after = acl_text(acl_get_file(path, ACL_TYPE_EXTENDED));
              char *fd_after = acl_text(acl_get_fd(fd));
              int pathname_saw = strstr(path_after, principal) != NULL;
              int fd_saw = strstr(fd_after, principal) != NULL;

              printf("--- baseline pathname ---\n%s\n", baseline_path);
              printf("--- baseline fd ---\n%s\n", baseline_fd);
              printf("--- pathname after grant ---\n%s\n", path_after);
              printf("--- fd after grant ---\n%s\n", fd_after);
              printf("NEMBRA_DARWIN_ACL_ACQUISITION identityStable=true pathnameNativeSawGrant=%s fdNativeSawGrant=%s fdExtendedAclReadbackUsable=%s\n",
                     pathname_saw ? "true" : "false",
                     fd_saw ? "true" : "false",
                     (pathname_saw && fd_saw) ? "true" : "false");

              int cleanup = run_chmod("-N", NULL, path);
              close(fd);
              free(baseline_path);
              free(baseline_fd);
              free(path_after);
              free(fd_after);

              if (cleanup != 0) {
                  fprintf(stderr, "cleanup chmod -N failed\n");
                  return 7;
              }
              if (!pathname_saw) {
                  fprintf(stderr, "pathname-native ACL readback did not observe materialized grant\n");
                  return 8;
              }
              return 0;
          }
          C

          /usr/bin/clang -Wall -Wextra -Werror "$work/acquire.c" -o "$work/acquire"
          subject="/private/tmp/nembra-acl-acquisition-$RANDOM-$$"
          /usr/bin/sudo -n /bin/mkdir -m 0700 "$subject"
          trap '/usr/bin/sudo -n /bin/chmod -N "$subject" 2>/dev/null || true; /usr/bin/sudo -n /bin/rm -rf "$subject" 2>/dev/null || true; rm -rf "$work"' EXIT
          /usr/bin/sudo -n "$work/acquire" "$subject" "$field_user"

      - name: Preserve validation-only truth boundary
        if: always()
        shell: bash
        run: echo 'NEMBRA_DARWIN_ACL_ACQUISITION validationOnly=true productionBytesChanged=false physicalAuthorityCreated=false'
