name: Temporary Capture primary-helper copy r6

on:
  push:
    branches:
      - agent/capture-primary-helper-copy-v14-r6

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/capture-primary-helper-copy-v14-r6
          fetch-depth: 0

      - name: Apply only copy gaps surviving current flagship
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell_path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          shell = shell_path.read_text(encoding="utf-8")
          app_path = Path("NembraApp/App/NembraApp.swift")
          app = app_path.read_text(encoding="utf-8")

          replacements = [
              ('title: "Learning the readable surface",', 'title: "Reading available data",'),
              ('title: "Freezing final evidence",', 'title: "Sealing capture",'),
              (
                  'message: "Nembra is sealing the final evidence cutoff, checking capture integrity, and preparing the final capture artifact. Do not leave the app while this finishes.",',
                  'message: "Nembra is finishing the accepted read-only observations, checking capture integrity, and preparing the final Share file. Keep Nembra open until this finishes.",',
              ),
              (
                  'Text("The exact \\(report.finalShareByteCount.formatted())-byte final Share artifact passed the final Share and nested capture integrity checks. No protocol field meaning is claimed yet.")',
                  'Text("The exact \\(report.finalShareByteCount.formatted())-byte Capture passed every required integrity check and is ready to share for analysis. No protocol field meaning is claimed yet.")',
              ),
              (
                  'Text("\\(artifact.captureJSON.count.formatted()) capture bytes are sealed from this run. Analysis readiness is not earned until Nembra verifies the exact final Share bytes and their nested evidence.")',
                  'Text("\\(artifact.captureJSON.count.formatted()) capture bytes are sealed from this run. Nembra still needs to verify the final Share file before this capture is ready for analysis.")',
              ),
              ('case .complete: return "Evidence, sealed."', 'case .complete: return "Capture, sealed."'),
              ('case .readyToSeal, .observing: return "Hold the evidence line."', 'case .readyToSeal, .observing: return "Keep it steady."'),
              ('case .acquiring, .connecting, .rediscoveringTarget, .targetReacquired: return "Bind the real signal."', 'case .acquiring, .connecting, .rediscoveringTarget, .targetReacquired: return "Stay with this signal."'),
              ('default: return "Find the real scooter signal."', 'default: return "Find the scooter signal."'),
          ]

          for old, new in replacements:
              count = shell.count(old)
              if count != 1:
                  raise SystemExit(f"shell guard failed: expected exactly one occurrence, found {count}: {old}")
              shell = shell.replace(old, new)

          preflight_old = 'detail: "Required for ES80-FINGERPRINT-v1",'
          preflight_new = 'detail: "Required for this capture",'
          if app.count(preflight_old) != 1:
              raise SystemExit(f"app guard failed: expected one rider-facing recipe token, found {app.count(preflight_old)}")
          app = app.replace(preflight_old, preflight_new)

          # Preserve newer upstream product choices and mechanics.
          required_current = [
              'eyebrow: "CAPTURE LOCKED",',
              'title: "This build is not ready for a field capture",',
              'return .failed("The passive Bluetooth connection ended before capture could be sealed. Start a fresh capture.")',
              'return .correlationFailed("Bluetooth scanning or a foreground interruption invalidated this OFF / ON series. Start a fresh capture.")',
              'localFailureMessage = "Nembra could not start a fresh capture. Close and reopen Nembra, then try again."',
              'healthItem("DISCOVERY", value: observationReady ? "READY" : "WAIT")',
              'healthItem("SEAL", value: horizonReady ? "READY" : "HOLD")',
          ]
          missing = [value for value in required_current if value not in shell]
          if missing:
              raise SystemExit(f"shell guard failed: newer flagship semantics disappeared: {missing}")

          forbidden = [
              "Learning the readable surface",
              "Freezing final evidence",
              "final evidence cutoff",
              'case .complete: return "Evidence, sealed."',
              'case .readyToSeal, .observing: return "Hold the evidence line."',
              'return "Bind the real signal."',
              'return "Find the real scooter signal."',
          ]
          leaked = [fragment for fragment in forbidden if fragment in shell]
          if leaked:
              raise SystemExit(f"shell guard failed: surviving helper copy leaks remain: {leaked}")

          preflight_start = app.index("private struct ES80ExperimentOneStationaryPreflightView")
          preflight_end = app.index("private struct ES80ExperimentOneFieldNoGoView", preflight_start)
          preflight = app[preflight_start:preflight_end]
          if "ES80-FINGERPRINT-v1" in preflight:
              raise SystemExit("app guard failed: engineering recipe token remains in primary stationary preflight")

          required_truth = [
              "PASSIVE / READ ONLY",
              "Share Capture",
              "View Details",
              "guard status.physicalProcedurePermitted else",
              "PassiveBluetoothExperimentOneFinalShareIntegrity.inspect(artifact.json)",
              "finalShareIntegrityReport != nil",
              "Truth boundary",
              "CoreBluetooth",
              "Software Export SHA-256",
              "Runtime executable SHA-256",
              "does not authenticate the physical ES80",
          ]
          missing = [value for value in required_truth if value not in shell]
          if missing:
              raise SystemExit(f"shell truth/action contract disappeared: {missing}")

          required_preflight = [
              'detail: "Required for this capture"',
              'title: "Disconnected"',
              'title: "Connected"',
              'Text("Disconnect charger to continue")',
              'PassiveBluetoothExperimentOneFieldExecutionGate.permitsPhysicalProcedure',
              'selectedChargerState = nil',
              'disconnectedDeclarationAccepted = false',
          ]
          missing = [value for value in required_preflight if value not in app]
          if missing:
              raise SystemExit(f"preflight truth/action contract disappeared: {missing}")

          shell_path.write_text(shell, encoding="utf-8")
          app_path.write_text(app, encoding="utf-8")
          PY
          git diff --check

      - name: Commit product-only delta and remove transformer
        run: |
          git config user.name "nembra-v14-primary-helper-copy"
          git config user.email "noreply@github.com"
          git add NembraApp/App/NembraApp.swift NembraApp/Features/Research/ES80CaptureShellView.swift
          git rm .github/workflows/temporary-primary-helper-copy-r6.yml
          git diff --cached --check
          git commit -m "capture: close surviving helper and preflight copy gaps"
          git push origin HEAD:agent/capture-primary-helper-copy-v14-r6
