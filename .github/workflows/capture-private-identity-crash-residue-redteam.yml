name: Capture Private Identity Crash Residue Red Team

on:
  push:
    branches:
      - adversarial/v14-private-identity-crash-residue-sol-20260811
    paths:
      - Scripts/provision_capture_tuya_identity_writer.py
      - scripts/ci/tests/test_capture_private_identity_crash_residue.py
      - .github/workflows/capture-private-identity-crash-residue-redteam.yml

permissions:
  contents: read

jobs:
  hard-exit:
    name: Residue authority / hard exit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact head and compile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_crash_residue.py
      - name: Reject hidden hard-exit credential residue
        shell: bash
        run: NEMBRA_CRASH_RESIDUE_CASE=hard-exit python3 -I scripts/ci/tests/test_capture_private_identity_crash_residue.py

  symlink:
    name: Residue authority / symlink alias
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact head and compile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_crash_residue.py
      - name: Reject ignored reserved symlink
        shell: bash
        run: NEMBRA_CRASH_RESIDUE_CASE=symlink python3 -I scripts/ci/tests/test_capture_private_identity_crash_residue.py

  hardlink:
    name: Residue authority / hard-link alias
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact head and compile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_crash_residue.py
      - name: Reject destructive hard-link recovery
        shell: bash
        run: NEMBRA_CRASH_RESIDUE_CASE=hardlink python3 -I scripts/ci/tests/test_capture_private_identity_crash_residue.py

  directory:
    name: Residue authority / nonempty directory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact head and compile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_crash_residue.py
      - name: Fail closed on nonempty reserved directory
        shell: bash
        run: NEMBRA_CRASH_RESIDUE_CASE=directory python3 -I scripts/ci/tests/test_capture_private_identity_crash_residue.py
