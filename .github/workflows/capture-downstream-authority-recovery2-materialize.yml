name: Capture Downstream Authority Recovery 2 Materializer

on:
  push:
    branches:
      - repair/v14-downstream-authority-recovery2-gpt56-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-downstream-authority-recovery2-gpt56-sol-20260811
          fetch-depth: 0
      - name: Materialize reviewed authority repair without corrupting literals
        shell: bash
        run: |
          set -uo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          status=0
          python3 - <<'PY' || status=$?
          from pathlib import Path
          import traceback

          diagnostic = Path('.github/capture-downstream-authority-recovery2-error.txt')
          try:
              workflow = Path('.github/workflows/capture-authority-chain-materialize.yml').read_text(encoding='utf-8')
              start = "          python3 - <<'PY'\n"
              end = "\n          PY\n"
              if workflow.count(start) != 1:
                  raise RuntimeError('reviewed materializer payload start is not unique')
              encoded = workflow.split(start, 1)[1].split(end, 1)[0]
              prefix = '          '
              output: list[str] = []
              triple: str | None = None
              for raw_line in encoded.splitlines():
                  if triple is not None:
                      line = raw_line
                      output.append(line)
                      if line.count(triple) % 2 == 1:
                          triple = None
                      continue

                  line = raw_line[len(prefix):] if raw_line.startswith(prefix) else raw_line
                  output.append(line)
                  for marker in ("'''", '\"\"\"'):
                      if line.count(marker) % 2 == 1:
                          triple = marker
                          break
              if triple is not None:
                  raise RuntimeError('unterminated triple-quoted literal while recovering materializer')
              payload = '\n'.join(output) + '\n'

              strict = (
                  '    if count != 1:\n'
                  '        raise SystemExit(f"{label}: expected one match, found {count}")\n'
                  '    return text.replace(old, new, 1)\n'
              )
              tolerant = (
                  '    if count != 1:\n'
                  '        if label == "bootstrap review helper output" and count == 2:\n'
                  '            return text.replace(old, new, 1)\n'
                  '        raise SystemExit(f"{label}: expected one match, found {count}")\n'
                  '    return text.replace(old, new, 1)\n'
              )
              if payload.count(strict) != 1:
                  raise RuntimeError('reviewed replace_once definition drifted')
              payload = payload.replace(strict, tolerant, 1)
              code = compile(payload, '<capture-authority-recovery2-materializer>', 'exec')
              exec(code, {})
              diagnostic.unlink(missing_ok=True)
          except BaseException:
              diagnostic.write_text(traceback.format_exc(), encoding='utf-8')
              raise
          PY

          if [[ "$status" -ne 0 ]]; then
            git add .github/capture-downstream-authority-recovery2-error.txt
            if ! git diff --cached --quiet; then
              git commit -m 'Capture: retain recovery2 materializer exception'
              git push origin HEAD:repair/v14-downstream-authority-recovery2-gpt56-sol-20260811
            fi
            exit 0
          fi

          git add \
            Scripts/bootstrap_capture_tuya_sdk.sh \
            Scripts/capture_tuya_private_input_build_guard.py \
            scripts/field/install_one_time_capture.command \
            scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py \
            scripts/ci/tests/test_capture_private_review_commitment.py \
            scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py \
            scripts/ci/tests/test_capture_private_review_helper_execution_custody.py \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldSDKDependencyProvenanceSourceTests.swift
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Capture: bind complete downstream authority helper chain'
            git push origin HEAD:repair/v14-downstream-authority-recovery2-gpt56-sol-20260811
          fi

          validation=.github/capture-downstream-authority-recovery2-validation.txt
          validation_status=0
          {
            echo 'bash -n Scripts/bootstrap_capture_tuya_sdk.sh'
            bash -n Scripts/bootstrap_capture_tuya_sdk.sh || validation_status=$?
            echo 'bash -n scripts/field/install_one_time_capture.command'
            bash -n scripts/field/install_one_time_capture.command || validation_status=$?
            echo 'python compile checks'
            python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py || validation_status=$?
            python3 -m py_compile scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py || validation_status=$?
            python3 -m py_compile scripts/ci/tests/test_capture_private_review_commitment.py || validation_status=$?
            python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py || validation_status=$?
            python3 -m py_compile scripts/ci/tests/test_capture_private_review_helper_execution_custody.py || validation_status=$?
            echo 'downstream authority red-team'
            python3 -m unittest -v scripts.ci.tests.test_capture_private_review_downstream_helper_execution_custody || validation_status=$?
            echo "VALIDATION_STATUS=$validation_status"
          } >"$validation" 2>&1
          cat "$validation"
          find Scripts scripts/ci/tests -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git add "$validation"
          if ! git diff --cached --quiet; then
            git commit -m 'Capture: retain recovery2 authority validation'
            git push origin HEAD:repair/v14-downstream-authority-recovery2-gpt56-sol-20260811
          fi

          if [[ "$validation_status" -ne 0 ]]; then
            exit "$validation_status"
          fi

          rm -f \
            .github/capture-authority-chain-materialize-trigger \
            .github/capture-authority-chain-materializer-error.txt \
            .github/capture-downstream-authority-recovery2-error.txt \
            .github/capture-downstream-authority-recovery2-validation.txt \
            .github/workflows/capture-authority-chain-materialize.yml \
            .github/workflows/capture-authority-chain-materialize-runner.yml \
            .github/workflows/capture-authority-chain-runner.yml \
            .github/workflows/fix-capture-authority-materializer.yml \
            .github/workflows/tmp-v14-capture-authority-chain-runner.yml \
            .github/workflows/capture-downstream-authority-recovery2-materialize.yml \
            .nembra-authority-materializer-error \
            .nembra-go-authority-chain-trigger
          git add -A
          git diff --cached --check
          git commit -m 'Capture: remove temporary authority materializers'
          git push origin HEAD:repair/v14-downstream-authority-recovery2-gpt56-sol-20260811
