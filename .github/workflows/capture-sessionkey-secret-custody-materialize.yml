name: Materialize Capture Session-Key Secret Custody

on:
  push:
    branches:
      - fix/v14-capture-sessionkey-secret-custody-782-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-sessionkey-secret-custody-782-sol
          fetch-depth: 0

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          product_parent='782deb76ac501363aab972de9f1246cf2b28705b'
          git merge-base --is-ancestor "$product_parent" HEAD
          git diff --quiet "$product_parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift NembraApp/Features/Research/TuyaAccountBridge.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift

      - name: Apply session-key custody repair
        run: python3 scripts/ci/materialize_capture_sessionkey_secret_custody.py apply

      - name: Verify bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_sessionkey_secret_custody.py verify
          python3 -m py_compile scripts/ci/materialize_capture_sessionkey_secret_custody.py
          git diff --check

      - name: Publish clean product and regression bytes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-sessionkey-secret-custody-materialize.yml
          rm scripts/ci/materialize_capture_sessionkey_secret_custody.py
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-sessionkey-secret-custody-materialize.yml' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'NembraApp/Features/Research/TuyaAccountBridge.swift' \
            'scripts/ci/materialize_capture_sessionkey_secret_custody.py' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): redact session-key shaped evidence'
          git push origin HEAD:fix/v14-capture-sessionkey-secret-custody-782-sol
