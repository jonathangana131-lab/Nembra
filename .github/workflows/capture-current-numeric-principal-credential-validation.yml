name: Capture Current Numeric Principal Credential Validation

on:
  pull_request:
    paths:
      - .github/workflows/capture-current-numeric-principal-credential-validation.yml
      - scripts/ci/tests/test_capture_numeric_principal_process_credentials.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-current-numeric-principal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 9ee14559b591423abdfcf8539be10225add9f165
  WITNESS_BLOB: ce95748ac133039635d95ac4e14277e895af237d

jobs:
  full-process-credential-inventory:
    name: Prove full Darwin numeric-principal credential inventory
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact current-carrier validation child
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-current-numeric-principal-credential-validation.yml \
            scripts/ci/tests/test_capture_numeric_principal_process_credentials.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          test "$(git hash-object scripts/ci/tests/test_capture_numeric_principal_process_credentials.py)" = "$WITNESS_BLOB"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Pin fail-closed read-only witness contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -m py_compile scripts/ci/tests/test_capture_numeric_principal_process_credentials.py
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          source=Path('scripts/ci/tests/test_capture_numeric_principal_process_credentials.py').read_text(encoding='utf-8')
          required=(
              'KERN_PROC_ALL', 'struct kinfo_proc',
              'cr_ngroups', 'cr_groups',
              'Path("/bin/ps")', '"pid="', '"uid="', '"ruid="', '"svuid="',
              '"gid="', '"rgid="', '"svgid="',
              'def pid_still_exists(', 'errno.ESRCH', 'errno.EPERM',
              'persistent_kernel_only', 'persistent_ps_only',
              'supplementaryGroupOnlyCollisionObserved',
              'usedSystemPSCredentialScalars', 'usedProcPidTBSDInfo',
              'persistentPIDSetsReconciled', 'vanishedPIDsAreOnlySkippableAfterESRCH',
              'directoryServicesMutated": False', 'sudoUsed": False',
              'physicalAuthorityCreated": False',
          )
          missing=[item for item in required if item not in source]
          if missing:
              raise SystemExit('missing process-credential invariant(s): '+repr(missing))
          obsolete=(
              'proc_pidinfo(', 'PROC_PIDTBSDINFO', 'struct proc_bsdinfo', '<libproc.h>',
              'pcred->p_rgid', 'pcred->p_svgid',
          )
          leaked=[item for item in obsolete if item in source]
          if leaked:
              raise SystemExit('obsolete/protected credential probe survived: '+repr(leaked))
          for forbidden in ('/usr/bin/sudo','/usr/bin/dscl','/usr/bin/pkill','/bin/launchctl','CoreBluetooth','CBCentralManager','NEMBRA_TUYA_APP_KEY','NEMBRA_TUYA_APP_SECRET','devicectl'):
              if forbidden in source:
                  raise SystemExit('read-only witness crossed forbidden boundary: '+forbidden)
          PY

      - name: Execute full Darwin credential inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          out="$RUNNER_TEMP/nembra-numeric-principal-current.log"
          set +e
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_numeric_principal_process_credentials.py >"$out" 2>&1
          witness_status=$?
          set -e
          /bin/cat "$out"
          if [[ "$witness_status" != "0" ]]; then
            /usr/bin/python3 -B -I - "$out" "$witness_status" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          status = sys.argv[2]
          lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
          detail = lines[-12:] or ['numeric-principal witness produced no diagnostic output']
          for line in detail:
              safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Numeric principal witness failed (exit {status})::{safe}')
          PY
            exit "$witness_status"
          fi
          /usr/bin/python3 -B -I - "$out" <<'PY'
          import json,sys
          from pathlib import Path
          marker='NEMBRA_NUMERIC_PROCESS_CREDENTIAL_JSON='
          lines=[line for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines() if line.startswith(marker)]
          assert len(lines)==1, lines
          payload=json.loads(lines[0][len(marker):])
          assert payload['schema']==3
          assert payload['uidSlotsObserved'] is True
          assert payload['primaryGIDSlotsObserved'] is True
          assert payload['supplementaryGroupOnlyCollisionObserved'] is True
          assert payload['processFreeCandidateMatchCount']==0
          assert payload['usedKernProcAllKinfoProc'] is True
          assert payload['usedSystemPSCredentialScalars'] is True
          assert payload['usedProcPidTBSDInfo'] is False
          assert payload['persistentPIDSetsReconciled'] is True
          assert payload['vanishedPIDsAreOnlySkippableAfterESRCH'] is True
          assert payload['directoryServicesMutated'] is False
          assert payload['sudoUsed'] is False
          assert payload['physicalAuthorityCreated'] is False
          print('NEMBRA_CURRENT_NUMERIC_PRINCIPAL_VALIDATION_ACCEPTED physicalAuthorityCreated=false')
          PY