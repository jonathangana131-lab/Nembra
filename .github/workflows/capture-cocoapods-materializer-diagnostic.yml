name: Capture CocoaPods Materializer Diagnostic

on:
  push:
    branches:
      - redteam/v14-capture-cocoapods-symlink-target-custody-sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Materialize production field gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/_materialize_cocoapods_build_subject.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/capture-field-build-provenance.yml')
          text = path.read_text()
          if 'test_capture_cocoapods_symlink_target_custody.py' not in text:
              old = '      - scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py\n      - scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py\n'
              new = '      - scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py\n      - scripts/ci/tests/test_capture_cocoapods_symlink_target_custody.py\n      - scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py\n'
              if text.count(old) != 1:
                  raise SystemExit('field workflow symlink path anchor missing')
              text = text.replace(old, new, 1)
              old = '          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py\n'
              new = old + '          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_symlink_target_custody.py\n'
              if text.count(old) != 1:
                  raise SystemExit('field workflow symlink execution anchor missing')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          python3 -m py_compile \
            Scripts/capture_cocoapods_build_subject.py \
            scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py \
            scripts/ci/tests/test_capture_cocoapods_symlink_target_custody.py
          python3 -I Scripts/capture_cocoapods_build_subject.py --self-test
          python3 scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          python3 scripts/ci/tests/test_capture_cocoapods_symlink_target_custody.py
          git diff --check
      - name: Commit production field gate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/capture-field-build-provenance.yml; then
            echo 'Production field gate already materialized.'
            exit 0
          fi
          git config user.name 'nembra-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/capture-field-build-provenance.yml
          git commit -m 'ci(capture): enforce generated build-subject gate'
          git push origin HEAD:redteam/v14-capture-cocoapods-symlink-target-custody-sol
