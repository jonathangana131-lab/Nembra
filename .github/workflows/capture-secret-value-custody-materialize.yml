name: Capture secret-value custody materializer

on:
  push:
    branches:
      - agent/v14-capture-secret-value-custody-sol
    paths:
      - .github/workflows/capture-secret-value-custody-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v14-capture-secret-value-custody-sol
          fetch-depth: 0

      - name: Bind exact current parent
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 29000f240d1b5710bbe116de94a22c030d10da8e HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Bind exact private secrets to recursive event custody
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          s=p.read_text()
          a=s.index("@MainActor\nprivate final class SmartLifeDriver")
          b=s.index("#endif\n\nprivate enum AppleAccountAuthorizationError",a)
          driver=s[a:b]

          old_callback='''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              guard let dps, !dps.isEmpty else { return }
              var sanitized: [String: String] = [:]
              for (key, value) in dps {
                  let keyString = String(describing: key)
                  let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }
                  if Self.secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {
                      sanitized[keyString] = "<redacted>"
                  } else {
                      sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))
                  }
              }
              onApplicationUpdate?(sanitized)
          }
          '''
          new_callback='''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              guard let dps, !dps.isEmpty else { return }
              var sanitized: [String: String] = [:]
              for (key, value) in dps {
                  let keyString = String(describing: key)
                  let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }
                  let baseCustodyKey = Self.redactKnownSecretValues(in: keyString)
                  var custodyKey = baseCustodyKey
                  var collisionIndex = 2
                  while sanitized[custodyKey] != nil {
                      custodyKey = "\\(baseCustodyKey)#\\(collisionIndex)"
                      collisionIndex += 1
                  }
                  if Self.secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {
                      sanitized[custodyKey] = "<redacted>"
                  } else {
                      sanitized[custodyKey] = Self.redactedApplicationDescription(value)
                  }
              }
              onApplicationUpdate?(sanitized)
          }
          '''
          if driver.count(old_callback)!=1:
              raise SystemExit(f"SmartLife callback source shape changed: {driver.count(old_callback)}")
          driver=driver.replace(old_callback,new_callback,1)

          marker='''    private static func redactApplicationSecrets(_ object: Any) -> Any {
          '''
          if driver.count(marker)!=1:
              raise SystemExit("recursive sanitizer marker changed")
          helpers='''    private static var exactSecretValues: [String] {
          #if canImport(NembraTuyaPrivateConfig)
              [NembraTuyaPrivateIdentity.appKey, NembraTuyaPrivateIdentity.appSecret]
                  .filter { !$0.isEmpty }
          #else
              []
          #endif
          }

          private static func redactKnownSecretValues(in text: String) -> String {
              var redacted = text
              for secret in exactSecretValues {
                  redacted = redacted.replacingOccurrences(of: secret, with: "<redacted>")
              }
              return redacted
          }

          private static func redactedApplicationDescription(_ object: Any) -> String {
              redactKnownSecretValues(in: String(describing: redactApplicationSecrets(object)))
          }

          '''
          driver=driver.replace(marker,helpers+marker,1)

          old_dict='''                let keyString = String(describing: key)
                  let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }
                  if secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {
                      sanitized[keyString] = "<redacted>"
                  } else {
                      sanitized[keyString] = redactApplicationSecrets(value)
                  }
          '''
          new_dict='''                let keyString = String(describing: key)
                  let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }
                  let baseCustodyKey = redactKnownSecretValues(in: keyString)
                  var custodyKey = baseCustodyKey
                  var collisionIndex = 2
                  while sanitized[custodyKey] != nil {
                      custodyKey = "\\(baseCustodyKey)#\\(collisionIndex)"
                      collisionIndex += 1
                  }
                  if secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {
                      sanitized[custodyKey] = "<redacted>"
                  } else {
                      sanitized[custodyKey] = redactApplicationSecrets(value)
                  }
          '''
          if driver.count(old_dict)!=1:
              raise SystemExit(f"recursive dictionary sanitizer shape changed: {driver.count(old_dict)}")
          driver=driver.replace(old_dict,new_dict,1)

          old_tail='''        if let array = object as? [Any] {
              return array.map(redactApplicationSecrets)
          }
          return object
          '''
          new_tail='''        if let array = object as? [Any] {
              return array.map(redactApplicationSecrets)
          }
          let description = String(describing: object)
          let redactedDescription = redactKnownSecretValues(in: description)
          return redactedDescription == description ? object : redactedDescription
          '''
          if driver.count(old_tail)!=1:
              raise SystemExit("recursive sanitizer scalar tail changed")
          driver=driver.replace(old_tail,new_tail,1)

          p.write_text(s[:a]+driver+s[b:])
          PY
          git diff --check

      - name: Verify credential-value custody contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          a=s.index("@MainActor\nprivate final class SmartLifeDriver")
          b=s.index("#endif\n\nprivate enum AppleAccountAuthorizationError",a)
          d=s[a:b]
          callback=d[d.index("    func device(_ device: ThingSmartDevice?, dpsUpdate"):d.index("    private static let secretKeyFragments")]
          sanitizer=d[d.index("    private static let secretKeyFragments"):]
          for token in ("NembraTuyaPrivateIdentity.appKey","NembraTuyaPrivateIdentity.appSecret","exactSecretValues","replacingOccurrences","redactedApplicationDescription(value)"):
              assert token in d, token
          assert "String(describing: Self.redactApplicationSecrets(value))" not in callback
          assert "redactKnownSecretValues(in: keyString)" in callback
          assert "redactKnownSecretValues(in: keyString)" in sanitizer
          assert "while sanitized[custodyKey] != nil" in callback
          for fragment in ("localkey","sessionkey","appkey","appsecret","password","accounttoken","accesstoken","refreshtoken","authkey","seckey"):
              assert f'"{fragment}"' in d, fragment
          PY

      - name: Commit repair and retire materializer
        run: |
          set -euo pipefail
          rm .github/workflows/capture-secret-value-custody-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/capture-secret-value-custody-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): bind private secrets to event custody"
          git push origin HEAD:agent/v14-capture-secret-value-custody-sol
