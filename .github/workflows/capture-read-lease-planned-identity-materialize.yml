name: Capture Read Lease Planned Identity Materializer

on:
  push:
    branches:
      - hardening/v17-capture-read-lease-planned-identity-sol-20260814
    paths:
      - .github/workflows/capture-read-lease-planned-identity-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  EXACT_PARENT: 64d3433e2ae5a507ec685e6703996bb8e7aec868
  MATERIALIZER: .github/workflows/capture-read-lease-planned-identity-materialize.yml

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact clean authoring input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = "$MATERIALIZER"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Carry planned vnode identity into anchored admission
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/materialize.py" <<'PY'
          from pathlib import Path

          helper_path = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          source = helper_path.read_text(encoding="utf-8")

          def replace_region(text: str, start: str, end: str, replacement: str) -> str:
              begin = text.find(start)
              if begin < 0:
                  raise SystemExit(f"missing start marker: {start!r}")
              finish = text.find(end, begin)
              if finish < 0:
                  raise SystemExit(f"missing end marker: {end!r}")
              return text[:begin] + replacement.rstrip() + "\n\n" + text[finish:]

          planning = r'''def _metadata_signature(metadata: os.stat_result) -> tuple[int, int, int]:
              return metadata.st_dev, metadata.st_ino, stat.S_IFMT(metadata.st_mode)


          def _subject_entries(subject: Path) -> tuple[tuple[Path, bool, tuple[int, int, int]], ...]:
              try:
                  root_metadata = subject.lstat()
              except OSError as error:
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease subject is unavailable: {subject}"
                  ) from error
              if stat.S_ISLNK(root_metadata.st_mode):
                  raise SelectedXcodeBuildOrchestratorError("private read-lease subject root may not be a symlink")
              root_signature = _metadata_signature(root_metadata)
              if stat.S_ISREG(root_metadata.st_mode):
                  return ((subject, False, root_signature),)
              if not stat.S_ISDIR(root_metadata.st_mode):
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease subject root has unsupported type: {subject}"
                  )

              entries: list[tuple[Path, bool, tuple[int, int, int]]] = [
                  (subject, True, root_signature)
              ]
              for current_raw, directory_names, file_names in os.walk(
                  subject, topdown=True, followlinks=False
              ):
                  current = Path(current_raw)
                  kept_directories: list[str] = []
                  for name in directory_names:
                      candidate = current / name
                      metadata = candidate.lstat()
                      if stat.S_ISLNK(metadata.st_mode):
                          _validate_internal_symlink(candidate, subject)
                          continue
                      if not stat.S_ISDIR(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease directory entry changed type: {candidate}"
                          )
                      entries.append((candidate, True, _metadata_signature(metadata)))
                      kept_directories.append(name)
                  directory_names[:] = kept_directories
                  for name in file_names:
                      candidate = current / name
                      metadata = candidate.lstat()
                      if stat.S_ISLNK(metadata.st_mode):
                          _validate_internal_symlink(candidate, subject)
                          continue
                      if not stat.S_ISREG(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease file entry is not regular: {candidate}"
                          )
                      entries.append((candidate, False, _metadata_signature(metadata)))
              return tuple(entries)


          def _lease_plan(
              subjects: Sequence[Path], repo: Path
          ) -> tuple[tuple[Path, bool, tuple[int, int, int]], ...]:
              """Bind every admitted pathname to the exact object validated during planning."""

              repo = _absolute_lexical(repo)
              repo_metadata = _require_real_directory(repo, "repository root")
              if not subjects:
                  raise SelectedXcodeBuildOrchestratorError("private read lease has no subjects")

              ordered: list[tuple[Path, bool, tuple[int, int, int]]] = []
              seen: dict[Path, tuple[int, int, int]] = {}

              def remember(
                  path: Path,
                  host_only: bool,
                  is_directory: bool,
                  signature: tuple[int, int, int],
              ) -> None:
                  expected_type = stat.S_IFDIR if is_directory else stat.S_IFREG
                  if signature[2] != expected_type:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease planned type changed while validating: {path}"
                      )
                  previous = seen.get(path)
                  if previous is not None:
                      if previous != signature:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease object changed identity while planning: {path}"
                          )
                      return
                  ordered.append((path, host_only, signature))
                  seen[path] = signature

              current = repo.parent
              private_hosts: list[tuple[Path, tuple[int, int, int]]] = []
              while current != current.parent:
                  metadata = _require_real_directory(current, "repository host ancestry")
                  if metadata.st_mode & stat.S_IXOTH:
                      break
                  private_hosts.append((current, _metadata_signature(metadata)))
                  current = current.parent
              for path, signature in reversed(private_hosts):
                  remember(path, True, True, signature)

              remember(repo, False, True, _metadata_signature(repo_metadata))

              for raw_subject in subjects:
                  subject = _absolute_lexical(raw_subject)
                  try:
                      relative = subject.relative_to(repo)
                  except ValueError as error:
                      raise SelectedXcodeBuildOrchestratorError(
                          "private read-lease subject escaped the repository"
                      ) from error
                  if not relative.parts:
                      raise SelectedXcodeBuildOrchestratorError(
                          "private read-lease subject may not be the repository root"
                      )

                  cursor = repo
                  for component in relative.parts:
                      if component in ("", ".", ".."):
                          raise SelectedXcodeBuildOrchestratorError(
                              "private read-lease subject has unsafe ancestry"
                          )
                      cursor = cursor / component
                      try:
                          metadata = cursor.lstat()
                      except OSError as error:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease subject ancestry is unavailable: {cursor}"
                          ) from error
                      if stat.S_ISLNK(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease subject ancestry contains a symlink: {cursor}"
                          )
                      is_directory = stat.S_ISDIR(metadata.st_mode)
                      if cursor != subject and not is_directory:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease subject ancestry is not a directory: {cursor}"
                          )
                      if cursor == subject and not is_directory and not stat.S_ISREG(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease subject root has unsupported type: {cursor}"
                          )
                      remember(cursor, False, is_directory, _metadata_signature(metadata))

                  for path, is_directory, signature in _subject_entries(subject):
                      remember(path, False, is_directory, signature)

              return tuple(ordered)


          def _lease_paths(subjects: Sequence[Path], repo: Path) -> tuple[tuple[Path, bool], ...]:
              """Compatibility view of the identity-bound lease plan for policy tests."""
              return tuple(
                  (path, host_only)
                  for path, host_only, _signature in _lease_plan(subjects, repo)
              )'''
          planning = "\n".join(line[10:] if line.startswith("          ") else line for line in planning.splitlines())
          source = replace_region(source, "def _subject_entries(", "def _acl_text(", planning)

          opener = r'''def _open_pinned_path(
              path: Path,
              is_directory: bool,
              expected_signature: tuple[int, int, int],
          ) -> int:
              """Open one planned lease object without following any path component."""
              path = _absolute_lexical(path)
              if (
                  len(expected_signature) != 3
                  or any(type(value) is not int for value in expected_signature)
                  or expected_signature[2] not in (stat.S_IFDIR, stat.S_IFREG)
              ):
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease planned object identity is malformed: {path}"
                  )
              if is_directory != (expected_signature[2] == stat.S_IFDIR):
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease planned type disagrees with identity: {path}"
                  )

              parts = path.parts
              if len(parts) < 2 or parts[0] != os.sep:
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease path has no admissible absolute component walk: {path}"
                  )
              if os.open not in os.supports_dir_fd:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease component walk requires openat/dir_fd support"
                  )
              nofollow = getattr(os, "O_NOFOLLOW", 0)
              odirectory = getattr(os, "O_DIRECTORY", 0)
              if nofollow == 0 or odirectory == 0:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease component walk requires O_NOFOLLOW and O_DIRECTORY"
                  )

              common = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | nofollow
              current = -1
              descriptor = -1
              try:
                  current = os.open(
                      os.sep,
                      os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | odirectory,
                  )
                  for index, component in enumerate(parts[1:]):
                      if component in ("", ".", "..") or os.sep in component:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease path contains an unsafe component: {path}"
                          )
                      final = index == len(parts) - 2
                      flags = common
                      if not final or is_directory:
                          flags |= odirectory
                      try:
                          next_descriptor = os.open(component, flags, dir_fd=current)
                      except OSError as error:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease component could not be pinned without following links: {path}"
                          ) from error
                      os.close(current)
                      current = next_descriptor

                  descriptor = current
                  current = -1
                  mode = os.fstat(descriptor).st_mode
                  if is_directory != stat.S_ISDIR(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease descriptor type disagrees with plan: {path}"
                      )
                  if not is_directory and not stat.S_ISREG(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease file descriptor is not regular: {path}"
                      )
                  opened_signature = _descriptor_signature(descriptor)
                  if opened_signature != expected_signature:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease opened object differs from admitted plan: {path}"
                      )
                  # Full-path lookup is only a post-selection liveness/rename diagnostic.
                  if opened_signature != _path_signature(path):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease pathname changed during anchored component walk: {path}"
                      )
                  result = descriptor
                  descriptor = -1
                  return result
              except Exception:
                  if current >= 0:
                      os.close(current)
                  if descriptor >= 0:
                      os.close(descriptor)
                  raise'''
          opener = "\n".join(line[10:] if line.startswith("          ") else line for line in opener.splitlines())
          source = replace_region(source, "def _open_pinned_path(", "def _descriptor_path(", opener)

          old_grant = '''            for path, host_only in _lease_paths(self._subjects, self._repository):
                      metadata = path.lstat()
                      if stat.S_ISLNK(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease plan targeted a symlink: {path}"
                          )
                      is_directory = stat.S_ISDIR(metadata.st_mode)
                      if not is_directory and not stat.S_ISREG(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease plan targeted unsupported type: {path}"
                          )
                      descriptor = _open_pinned_path(path, is_directory)'''
          old_grant = "\n".join(line[12:] if line.startswith("            ") else line for line in old_grant.splitlines())
          new_grant = '''for path, host_only, expected_signature in _lease_plan(
                          self._subjects, self._repository
                      ):
                          planned_type = expected_signature[2]
                          is_directory = planned_type == stat.S_IFDIR
                          if not is_directory and planned_type != stat.S_IFREG:
                              raise SelectedXcodeBuildOrchestratorError(
                                  f"private read-lease plan targeted unsupported type: {path}"
                              )
                          descriptor = _open_pinned_path(
                              path, is_directory, expected_signature
                          )'''
          if old_grant not in source:
              raise SystemExit("grant admission marker drifted")
          source = source.replace(old_grant, new_grant, 1)
          helper_path.write_text(source, encoding="utf-8")

          test_path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py")
          test_path.write_text(r'''#!/usr/bin/env python3
          """Portable regression for component-anchored, identity-bound private read leases."""
          from __future__ import annotations

          import importlib.util
          import inspect
          import os
          from pathlib import Path
          import tempfile
          import unittest

          REPO = Path(__file__).resolve().parents[3]
          HELPER = REPO / "scripts/ci/capture_selected_xcode_build_orchestrator.py"


          def load():
              spec = importlib.util.spec_from_file_location("nembra_component_walk", HELPER)
              if spec is None or spec.loader is None:
                  raise RuntimeError("could not load selected-Xcode orchestrator")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          def planned_signature(helper, subject: Path, repo: Path) -> tuple[int, int, int]:
              matches = [
                  signature
                  for path, _host_only, signature in helper._lease_plan((subject,), repo)
                  if path == subject
              ]
              if len(matches) != 1:
                  raise AssertionError(f"expected one planned identity for {subject}, got {matches}")
              return matches[0]


          class CapturePrivateReadLeaseComponentWalkTests(unittest.TestCase):
              def test_intermediate_symlink_swap_is_rejected_after_plan(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-walk-") as raw:
                      outer = Path(raw)
                      repo = outer / "repo"
                      legitimate = repo / "LocalSecrets/TuyaSDK/Build"
                      legitimate.mkdir(parents=True)
                      expected = planned_signature(helper, legitimate, repo)

                      sdk = repo / "LocalSecrets/TuyaSDK"
                      original = repo / "LocalSecrets/TuyaSDK.original"
                      sdk.rename(original)
                      attacker = outer / "attacker/TuyaSDK"
                      attacker_build = attacker / "Build"
                      attacker_build.mkdir(parents=True)
                      sdk.symlink_to(attacker, target_is_directory=True)

                      plain = os.open(legitimate, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
                      try:
                          self.assertEqual(os.fstat(plain).st_ino, attacker_build.stat().st_ino)
                      finally:
                          os.close(plain)

                      with self.assertRaises(helper.SelectedXcodeBuildOrchestratorError):
                          helper._open_pinned_path(legitimate, True, expected)

              def test_real_directory_substitution_is_rejected_against_planned_identity(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-real-swap-") as raw:
                      outer = Path(raw)
                      repo = outer / "repo"
                      legitimate = repo / "LocalSecrets/TuyaSDK/Build"
                      legitimate.mkdir(parents=True)
                      (legitimate / "accepted.bin").write_bytes(b"accepted\n")
                      expected = planned_signature(helper, legitimate, repo)

                      sdk = repo / "LocalSecrets/TuyaSDK"
                      sdk.rename(repo / "LocalSecrets/TuyaSDK.accepted")
                      attacker_sdk = outer / "attacker/TuyaSDK"
                      attacker_build = attacker_sdk / "Build"
                      attacker_build.mkdir(parents=True)
                      (attacker_build / "substituted.bin").write_bytes(b"substituted\n")
                      attacker_sdk.rename(sdk)
                      self.assertFalse(sdk.is_symlink())
                      self.assertNotEqual(helper._path_signature(legitimate), expected)

                      with self.assertRaisesRegex(
                          helper.SelectedXcodeBuildOrchestratorError,
                          "differs from admitted plan",
                      ):
                          helper._open_pinned_path(legitimate, True, expected)

              def test_real_directory_and_regular_file_still_open(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-walk-control-") as raw:
                      root = Path(raw)
                      directory = root / "a/b/c"
                      directory.mkdir(parents=True)
                      file = directory / "private.fixture"
                      file.write_bytes(b"fixture\n")
                      for path, is_directory in ((directory, True), (file, False)):
                          expected = helper._path_signature(path)
                          descriptor = helper._open_pinned_path(path, is_directory, expected)
                          try:
                              self.assertEqual(helper._descriptor_signature(descriptor), expected)
                          finally:
                              os.close(descriptor)

              def test_source_binds_plan_identity_before_path_diagnostic(self) -> None:
                  helper = load()
                  parameters = tuple(inspect.signature(helper._open_pinned_path).parameters)
                  self.assertEqual(parameters, ("path", "is_directory", "expected_signature"))
                  source = inspect.getsource(helper._open_pinned_path)
                  self.assertIn("dir_fd=current", source)
                  self.assertIn("os.supports_dir_fd", source)
                  self.assertIn("O_NOFOLLOW", source)
                  self.assertIn("opened_signature != expected_signature", source)
                  self.assertNotIn("os.open(path,", source)
                  self.assertLess(
                      source.index("opened_signature != expected_signature"),
                      source.index("_path_signature(path)"),
                  )
                  grant_source = inspect.getsource(helper._PrivateReadLease.grant)
                  self.assertIn("_lease_plan", grant_source)
                  self.assertIn("expected_signature", grant_source)
                  self.assertNotIn("path.lstat()", grant_source)


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          '''.replace("          ", ""), encoding="utf-8")
          PY
          /usr/bin/python3 -B -I "$RUNNER_TEMP/materialize.py"

          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^ M ' || true)"

      - name: Publish permanent serial repair and retire materializer
        shell: bash
        env:
          HEAD_REF: hardening/v17-capture-read-lease-planned-identity-sol-20260814
        run: |
          set -euo pipefail
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git diff --cached --check
          git commit -m 'capture: bind private lease to planned object identity'
          git rm "$MATERIALIZER"
          git commit -m 'ci(capture): retire planned-identity materializer'
          actual="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_private_read_lease_component_walk.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$HEAD_REF"
