name: Capture Private Read Lease Planned Identity Materializer

on:
  pull_request:
    paths:
      - .github/workflows/capture-read-lease-planned-identity-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-read-lease-planned-identity-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 092e109853eeb6cb3ade6c7a9d401c0f55598d99

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact authoring parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = ".github/workflows/capture-read-lease-planned-identity-materialize.yml"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize production identity continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper_path = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          source = helper_path.read_text()

          if "from dataclasses import dataclass\n" not in source:
              needle = "import base64\n"
              if source.count(needle) != 1:
                  raise SystemExit("unexpected base64 import shape")
              source = source.replace(needle, needle + "from dataclasses import dataclass\n", 1)

          start = source.index("def _subject_entries(")
          end = source.index("\ndef _acl_text(", start)
          plan_block = '''@dataclass(frozen=True)
          class _LeasePlanEntry:
              path: Path
              host_only: bool
              signature: tuple[int, int, int]

              def __iter__(self):
                  # Preserve the established `(path, host_only)` policy view for
                  # diagnostics such as dict(_lease_paths(...)); object identity is
                  # additional admission authority, not a replacement for that ABI.
                  yield self.path
                  yield self.host_only


          def _stat_signature(metadata: os.stat_result) -> tuple[int, int, int]:
              return metadata.st_dev, metadata.st_ino, stat.S_IFMT(metadata.st_mode)


          def _subject_entries(subject: Path) -> tuple[tuple[Path, bool, tuple[int, int, int]], ...]:
              try:
                  root_metadata = subject.lstat()
              except OSError as error:
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease subject is unavailable: {subject}"
                  ) from error
              if stat.S_ISLNK(root_metadata.st_mode):
                  raise SelectedXcodeBuildOrchestratorError("private read-lease subject root may not be a symlink")
              if stat.S_ISREG(root_metadata.st_mode):
                  return ((subject, False, _stat_signature(root_metadata)),)
              if not stat.S_ISDIR(root_metadata.st_mode):
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease subject root has unsupported type: {subject}"
                  )

              entries: list[tuple[Path, bool, tuple[int, int, int]]] = [
                  (subject, True, _stat_signature(root_metadata))
              ]
              for current_raw, directory_names, file_names in os.walk(subject, topdown=True, followlinks=False):
                  current = Path(current_raw)
                  kept_directories: list[str] = []
                  for name in directory_names:
                      candidate = current / name
                      metadata = candidate.lstat()
                      if stat.S_ISLNK(metadata.st_mode):
                          _validate_internal_symlink(candidate, subject)
                          continue
                      if not stat.S_ISDIR(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease directory entry changed type: {candidate}"
                          )
                      entries.append((candidate, True, _stat_signature(metadata)))
                      kept_directories.append(name)
                  directory_names[:] = kept_directories
                  for name in file_names:
                      candidate = current / name
                      metadata = candidate.lstat()
                      if stat.S_ISLNK(metadata.st_mode):
                          _validate_internal_symlink(candidate, subject)
                          continue
                      if not stat.S_ISREG(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease file entry is not regular: {candidate}"
                          )
                      entries.append((candidate, False, _stat_signature(metadata)))
              return tuple(entries)


          def _lease_paths(subjects: Sequence[Path], repo: Path) -> tuple[_LeasePlanEntry, ...]:
              """Plan exact ACL subjects and freeze their accepted object identities."""

              repo = _absolute_lexical(repo)
              repo_metadata = _require_real_directory(repo, "repository root")
              if not subjects:
                  raise SelectedXcodeBuildOrchestratorError("private read lease has no subjects")

              ordered: list[_LeasePlanEntry] = []
              seen: set[Path] = set()

              # Widen host traversal only until the first ancestor already searchable by all.
              current = repo.parent
              private_hosts: list[tuple[Path, tuple[int, int, int]]] = []
              while current != current.parent:
                  metadata = _require_real_directory(current, "repository host ancestry")
                  if metadata.st_mode & stat.S_IXOTH:
                      break
                  private_hosts.append((current, _stat_signature(metadata)))
                  current = current.parent
              for path, signature in reversed(private_hosts):
                  ordered.append(_LeasePlanEntry(path, True, signature))
                  seen.add(path)

              ordered.append(_LeasePlanEntry(repo, False, _stat_signature(repo_metadata)))
              seen.add(repo)

              for raw_subject in subjects:
                  subject = _absolute_lexical(raw_subject)
                  try:
                      relative = subject.relative_to(repo)
                  except ValueError as error:
                      raise SelectedXcodeBuildOrchestratorError(
                          "private read-lease subject escaped the repository"
                      ) from error
                  if not relative.parts:
                      raise SelectedXcodeBuildOrchestratorError(
                          "private read-lease subject may not be the repository root"
                      )

                  cursor = repo
                  for component in relative.parts:
                      if component in ("", ".", ".."):
                          raise SelectedXcodeBuildOrchestratorError(
                              "private read-lease subject has unsafe ancestry"
                          )
                      cursor = cursor / component
                      try:
                          metadata = cursor.lstat()
                      except OSError as error:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease subject ancestry is unavailable: {cursor}"
                          ) from error
                      if stat.S_ISLNK(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease subject ancestry contains a symlink: {cursor}"
                          )
                      if cursor != subject and not stat.S_ISDIR(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease subject ancestry is not a directory: {cursor}"
                          )
                      if cursor not in seen:
                          ordered.append(_LeasePlanEntry(cursor, False, _stat_signature(metadata)))
                          seen.add(cursor)

                  for path, _is_directory, signature in _subject_entries(subject):
                      if path not in seen:
                          ordered.append(_LeasePlanEntry(path, False, signature))
                          seen.add(path)

              return tuple(ordered)

          '''
          plan_block = plan_block.replace("          ", "")
          source = source[:start] + plan_block + source[end + 1:]

          open_start = source.index("def _open_pinned_path(")
          open_end = source.index("\ndef _descriptor_path(", open_start)
          open_block = '''def _open_pinned_path(path: Path, planned_signature: tuple[int, int, int]) -> int:
              """Open one planned lease subject without following any path component."""
              path = _absolute_lexical(path)
              if (
                  not isinstance(planned_signature, tuple)
                  or len(planned_signature) != 3
                  or any(type(value) is not int for value in planned_signature)
              ):
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease planned identity is malformed"
                  )
              planned_type = planned_signature[2]
              if planned_type not in (stat.S_IFDIR, stat.S_IFREG):
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease planned identity has unsupported type"
                  )
              is_directory = planned_type == stat.S_IFDIR
              parts = path.parts
              if len(parts) < 2 or parts[0] != os.sep:
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease path has no admissible absolute component walk: {path}"
                  )
              if os.open not in os.supports_dir_fd:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease component walk requires openat/dir_fd support"
                  )
              nofollow = getattr(os, "O_NOFOLLOW", 0)
              odirectory = getattr(os, "O_DIRECTORY", 0)
              if nofollow == 0 or odirectory == 0:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease component walk requires O_NOFOLLOW and O_DIRECTORY"
                  )

              common = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | nofollow
              current = -1
              descriptor = -1
              try:
                  current = os.open(
                      os.sep,
                      os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | odirectory,
                  )
                  for index, component in enumerate(parts[1:]):
                      if component in ("", ".", "..") or os.sep in component:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease path contains an unsafe component: {path}"
                          )
                      final = index == len(parts) - 2
                      flags = common
                      if not final or is_directory:
                          flags |= odirectory
                      try:
                          next_descriptor = os.open(component, flags, dir_fd=current)
                      except OSError as error:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease component could not be pinned without following links: {path}"
                          ) from error
                      os.close(current)
                      current = next_descriptor

                  descriptor = current
                  current = -1
                  opened_signature = _descriptor_signature(descriptor)
                  if opened_signature != planned_signature:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease object changed after planning: {path}"
                      )
                  mode = os.fstat(descriptor).st_mode
                  if is_directory != stat.S_ISDIR(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease descriptor type disagrees with plan: {path}"
                      )
                  if not is_directory and not stat.S_ISREG(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease file descriptor is not regular: {path}"
                      )
                  # Current-path agreement is only a second fail-closed liveness diagnostic;
                  # selection authority comes from the identity frozen during planning.
                  if opened_signature != _path_signature(path):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease pathname changed during anchored component walk: {path}"
                      )
                  result = descriptor
                  descriptor = -1
                  return result
              except Exception:
                  if current >= 0:
                      os.close(current)
                  if descriptor >= 0:
                      os.close(descriptor)
                  raise

          '''
          open_block = open_block.replace("              ", "")
          source = source[:open_start] + open_block + source[open_end + 1:]

          old_grant = '''            for path, host_only in _lease_paths(self._subjects, self._repository):
                  metadata = path.lstat()
                  if stat.S_ISLNK(metadata.st_mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease plan targeted a symlink: {path}"
                      )
                  is_directory = stat.S_ISDIR(metadata.st_mode)
                  if not is_directory and not stat.S_ISREG(metadata.st_mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease plan targeted unsupported type: {path}"
                      )
                  descriptor = _open_pinned_path(path, is_directory)
          '''.replace("          ", "")
          new_grant = '''            for planned in _lease_paths(self._subjects, self._repository):
                  path = planned.path
                  host_only = planned.host_only
                  planned_signature = planned.signature
                  is_directory = planned_signature[2] == stat.S_IFDIR
                  descriptor = _open_pinned_path(path, planned_signature)
          '''.replace("          ", "")
          if source.count(old_grant) != 1:
              raise SystemExit("unexpected private-read grant admission shape")
          source = source.replace(old_grant, new_grant, 1)
          helper_path.write_text(source)

          test_path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py")
          test_path.write_text(r'''#!/usr/bin/env python3
          """Portable regression for identity-bound component private read-lease admission."""
          from __future__ import annotations

          import importlib.util
          import inspect
          import os
          from pathlib import Path
          import tempfile
          import unittest

          REPO = Path(__file__).resolve().parents[3]
          HELPER = REPO / "scripts/ci/capture_selected_xcode_build_orchestrator.py"


          def load():
              spec = importlib.util.spec_from_file_location("nembra_component_walk", HELPER)
              if spec is None or spec.loader is None:
                  raise RuntimeError("could not load selected-Xcode orchestrator")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          def plan_for(helper, planned, path: Path):
              return next(entry for entry in planned if entry.path == path)


          class CapturePrivateReadLeaseComponentWalkTests(unittest.TestCase):
              def test_intermediate_symlink_swap_is_rejected_after_plan(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-walk-") as raw:
                      outer = Path(raw)
                      repo = outer / "repo"
                      legitimate = repo / "LocalSecrets/TuyaSDK/Build"
                      legitimate.mkdir(parents=True)
                      planned = helper._lease_paths((legitimate,), repo)
                      accepted = plan_for(helper, planned, legitimate)

                      sdk = repo / "LocalSecrets/TuyaSDK"
                      original = repo / "LocalSecrets/TuyaSDK.original"
                      sdk.rename(original)
                      attacker = outer / "attacker/TuyaSDK"
                      attacker_build = attacker / "Build"
                      attacker_build.mkdir(parents=True)
                      sdk.symlink_to(attacker, target_is_directory=True)

                      plain = os.open(legitimate, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
                      try:
                          self.assertEqual(os.fstat(plain).st_ino, attacker_build.stat().st_ino)
                      finally:
                          os.close(plain)

                      with self.assertRaises(helper.SelectedXcodeBuildOrchestratorError):
                          helper._open_pinned_path(legitimate, accepted.signature)

              def test_real_directory_replacement_is_rejected_after_plan(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-real-directory-swap-") as raw:
                      outer = Path(raw)
                      repo = outer / "repo"
                      legitimate = repo / "LocalSecrets/TuyaSDK/Build"
                      legitimate.mkdir(parents=True)
                      planned = helper._lease_paths((legitimate,), repo)
                      accepted = plan_for(helper, planned, legitimate)
                      self.assertEqual(accepted.signature, helper._path_signature(legitimate))

                      sdk = repo / "LocalSecrets/TuyaSDK"
                      original = repo / "LocalSecrets/TuyaSDK.accepted"
                      sdk.rename(original)
                      replacement = repo / "LocalSecrets/TuyaSDK/Build"
                      replacement.mkdir(parents=True)
                      self.assertFalse((repo / "LocalSecrets/TuyaSDK").is_symlink())
                      self.assertFalse(replacement.is_symlink())
                      self.assertNotEqual(accepted.signature, helper._path_signature(replacement))

                      with self.assertRaises(helper.SelectedXcodeBuildOrchestratorError):
                          helper._open_pinned_path(legitimate, accepted.signature)

              def test_real_directory_and_regular_file_still_open(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-walk-control-") as raw:
                      root = Path(raw)
                      directory = root / "a/b/c"
                      directory.mkdir(parents=True)
                      file = directory / "private.fixture"
                      file.write_bytes(b"fixture\n")
                      for path in (directory, file):
                          signature = helper._path_signature(path)
                          descriptor = helper._open_pinned_path(path, signature)
                          try:
                              self.assertEqual(helper._descriptor_signature(descriptor), signature)
                          finally:
                              os.close(descriptor)

              def test_plan_transports_identity_without_breaking_policy_view(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-plan-identity-") as raw:
                      repo = Path(raw) / "repo"
                      subject = repo / "LocalSecrets/TuyaSDK/Build"
                      subject.mkdir(parents=True)
                      entries = helper._lease_paths((subject,), repo)
                      accepted = plan_for(helper, entries, subject)
                      self.assertEqual(accepted.signature, helper._path_signature(subject))
                      self.assertIs(dict(entries).get(subject), False)

              def test_source_binds_plan_before_path_diagnostic_and_grant_mutation(self) -> None:
                  helper = load()
                  source = inspect.getsource(helper._open_pinned_path)
                  self.assertIn("dir_fd=current", source)
                  self.assertIn("os.supports_dir_fd", source)
                  self.assertIn("O_NOFOLLOW", source)
                  self.assertIn("opened_signature != planned_signature", source)
                  self.assertNotIn("os.open(path,", source)
                  self.assertLess(
                      source.index("opened_signature != planned_signature"),
                      source.index("_path_signature(path)"),
                  )

                  grant = inspect.getsource(helper._PrivateReadLease.grant)
                  self.assertIn("planned.signature", grant)
                  self.assertIn("_open_pinned_path(path, planned_signature)", grant)
                  self.assertNotIn("metadata = path.lstat()", grant)


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          '''.replace("          ", ""))
          PY

          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Run focused portable authority regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py

      - name: Publish permanent repair bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-capture-authority-bot"
          git config user.email "nembra-capture-authority-bot@users.noreply.github.com"
          git add \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git commit -m "fix(capture): bind planned identity into private lease admission"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "NEMBRA_PLANNED_IDENTITY_MATERIALIZED productionChanged=true validationOnly=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false"
