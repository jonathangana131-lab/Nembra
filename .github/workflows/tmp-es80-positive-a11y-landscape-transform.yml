name: TEMP ES80 positive Capture a11y landscape transform

on:
  push:
    branches:
      - test/es80-v14-positive-a11y-landscape/gpt56-thinking-go

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Add positive Simulator visual acceptance states
        shell: bash
        env:
          TESTS_B64: 
          HELPER_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path("NembraUITests/ES80ResearchCaptureUITests.swift")
          text = path.read_text(encoding="utf-8")
          marker = "\n    func testSimulatorQAAppSeamIsCompileBoundedAndProductionRouteRemainsLocked() throws {\n"
          helper_marker = "\n    private func assertVisibleInScreenshotViewport(\n"
          if marker not in text or helper_marker not in text:
              raise SystemExit("UI-test insertion marker not found")
          if "testV14SimulatorQACaptureCompleteAccessibilityXXXLKeepsTruthAndActionsLegible" in text:
              raise SystemExit("positive visual QA already present")
          tests = base64.b64decode(os.environ["TESTS_B64"]).decode("utf-8")
          helper = base64.b64decode(os.environ["HELPER_B64"]).decode("utf-8")
          text = text.replace(marker, tests + marker, 1)
          text = text.replace(helper_marker, helper + helper_marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
          grep -q 'testV14SimulatorQACaptureCompleteAccessibilityXXXLKeepsTruthAndActionsLegible' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'testV14SimulatorQAHorizonReadyLandscapeKeepsTruthAndSealActionLegible' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'UICTContentSizeCategoryAccessibilityExtraExtraExtraLarge' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'XCUIDevice.shared.orientation = .landscapeLeft' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'bringIntoScreenshotViewport' NembraUITests/ES80ResearchCaptureUITests.swift
          git diff --check
          rm .github/workflows/tmp-es80-positive-a11y-landscape-transform.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[Capture visual QA v14] Add positive XXXL and landscape acceptance"
          git push origin HEAD:${{ github.ref_name }}
