name: Reanchor guided Capture visual child to 6abc089

on:
  push:
    branches:
      - validation/v14-capture-guided-visual-522716b-sol

permissions:
  contents: write

jobs:
  reanchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/v14-capture-guided-visual-522716b-sol
          fetch-depth: 0

      - name: Merge exact product subject and remove helper
        shell: bash
        run: |
          set -euo pipefail
          validation_parent='8c4b9f381525bcd9ba9570ae741fe2d419b09451'
          product='6abc08900b7257eebc5111a6272a4c4748b06a4c'
          workflow='.github/workflows/reanchor-v14-capture-guided-visual-6abc089.yml'
          test "$(git rev-parse HEAD^)" = "$validation_parent"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"

          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git fetch origin 'refs/heads/product/v14-capture-guided-truth-current-sol:refs/remotes/origin/product/v14-capture-guided-truth-current-sol'
          test "$(git rev-parse refs/remotes/origin/product/v14-capture-guided-truth-current-sol)" = "$product"

          git merge --no-commit --no-ff "$product"
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm "$workflow"
          git diff --check

          # The reanchored child must differ from exact product only by the three QA paths.
          expected_paths="$(printf '%s\n' \
            '.github/workflows/capture-standalone-visual-evidence.yml' \
            'scripts/ci/capture_standalone_visual_evidence.sh' \
            'scripts/ci/tests/test_capture_standalone_visual_evidence.py' | sort)"
          actual_paths="$(git diff --name-only "$product" | sort)"
          test "$actual_paths" = "$expected_paths"

          git commit -m 'merge(capture): reanchor visual child to exact product 6abc089' -m 'Validation-only child: exact product bytes plus the three standalone iPhone 12 visual-evidence paths. Physical/protocol authority remains false.'
          git push origin HEAD:validation/v14-capture-guided-visual-522716b-sol
