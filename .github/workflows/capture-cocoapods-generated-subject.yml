name: Capture CocoaPods Generated Subject

on:
  push:
    branches:
      - repair/v14-capture-cocoapods-generated-subject-go56
  pull_request:
    paths:
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - Scripts/capture_cocoapods_generated_subject.py
      - Scripts/capture_tuya_private_input_provenance.py
      - Scripts/capture_tuya_private_input_build_guard.py
      - scripts/ci/tests/test_capture_cocoapods_generated_subject_authority.py
      - .github/workflows/capture-cocoapods-generated-subject.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-subject-authority:
    name: Bind generated build graph before xcodebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind job to exact source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'Exact generated-subject source: %s\n' "$actual"

      - name: Validate generated-subject authority
        shell: bash
        run: |
          set -euo pipefail
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          /usr/bin/python3 -m py_compile \
            Scripts/capture_cocoapods_generated_subject.py \
            Scripts/capture_tuya_private_input_build_guard.py \
            scripts/ci/tests/test_capture_cocoapods_generated_subject_authority.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_cocoapods_generated_subject_authority.py

      - name: Preserve physical truth boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'This bootstrap still does NOT authorize the physical experiment.' Scripts/bootstrap_capture_tuya_sdk.sh
          grep -Fq 'normal field bootstrap never re-runs CocoaPods after review' Scripts/bootstrap_capture_tuya_sdk.sh
          grep -Fq 'NEMBRA_CAPTURE_ACCEPTED_TUYA_GENERATED_SUBJECT_SHA256' Scripts/capture_tuya_private_input_build_guard.py
          printf '%s\n' 'Generated-subject validation creates no BLE, telemetry, command, or physical authority.'
