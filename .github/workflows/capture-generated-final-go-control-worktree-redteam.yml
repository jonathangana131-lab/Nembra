name: Capture Generated Final GO Control Worktree Red Team

on:
  push:
    branches:
      - adversarial/v14-generated-final-go-control-worktree-sol
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py
      - scripts/ci/es80_authenticated_stationary_generated_subject_final_go_2709.py
      - scripts/ci/tests/test_es80_generated_subject_control_worktree_custody_redteam.py
      - .github/workflows/capture-generated-final-go-control-worktree-redteam.yml

permissions:
  contents: read

jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact-current diagnostic
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go_2709.py \
            scripts/ci/tests/test_es80_generated_subject_control_worktree_custody_redteam.py
      - name: Require child authority worktree bytes to match accepted blobs
        run: python3 scripts/ci/tests/test_es80_generated_subject_control_worktree_custody_redteam.py
