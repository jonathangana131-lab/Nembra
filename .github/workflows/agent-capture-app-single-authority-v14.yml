name: Agent Capture App Single Authority V14

on:
  push:
    branches:
      - agent/capture-app-single-authority-v14

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/capture-app-single-authority-v14
          fetch-depth: 0
      - name: Apply guarded app-visible Capture composition
        run: python3 .github/app_single_authority_transform.py
      - name: Check product authority surface
        run: |
          set -euo pipefail
          shell=NembraApp/Features/Research/ES80CaptureShellView.swift
          app=NembraApp/App/NembraApp.swift
          coordinator=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCoordinator.swift
          ! grep -q 'PassiveBluetoothPowerCycleObservationSession(' "$shell"
          ! grep -q 'Passive capture binding not available in this build' "$shell"
          ! grep -q 'try? ForegroundCoreBluetoothCaptureController(' "$app"
          grep -q 'PassiveBluetoothExperimentOneCoordinator()' "$app"
          grep -q 'prepareCaptureRediscovery()' "$shell"
          grep -q 'connectPreparedCapture()' "$shell"
          grep -q 'encodedFinalizedObservationHorizonJSON' "$shell"
          grep -q 'ShareLink(item: finalizedCaptureURL)' "$shell"
          grep -q 'public convenience init() throws' "$coordinator"
          git diff --cached --check
      - name: Commit product-only delta
        run: |
          set -euo pipefail
          git rm .github/app_single_authority_transform.py .github/workflows/agent-capture-app-single-authority-v14.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m '[Capture app] Wire one Experiment One authority through seal and share'
          git push origin HEAD:agent/capture-app-single-authority-v14
