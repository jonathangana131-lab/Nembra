name: Apply Capture cross-controller BLE ownership fence

on:
  push:
    branches:
      - fix/v14-capture-cross-controller-ble-ownership-gpt56sol

permissions:
  contents: write

concurrency:
  group: capture-cross-controller-ble-ownership-gpt56sol
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-cross-controller-ble-ownership-gpt56sol
          fetch-depth: 0

      - name: Guard frozen current-product source and child scope
        shell: bash
        run: |
          set -euo pipefail
          parent='f6ad602ae178ac58416d3a636193f51489c8f638'
          test "$(git merge-base HEAD "$parent")" = "$parent"
          unexpected="$(git diff --name-only "$parent"...HEAD | grep -Ev '^(.github/workflows/apply-capture-cross-controller-ble-ownership-gpt56sol.yml|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipSourceTests.swift)$' || true)"
          test -z "$unexpected"
          test "$(git rev-parse "$parent:NembraApp/App/NembraCaptureEntrypoint.swift")" = '651947d3190eda4f9913386a53767f972dd42b49'
          test "$(git rev-parse HEAD:NembraApp/App/NembraCaptureEntrypoint.swift)" = '651947d3190eda4f9913386a53767f972dd42b49'

      - name: Apply fail-closed global Tuya BLE admission
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text(encoding="utf-8")

          begin_anchor = "        guard currentConnectionToken == nil else {\n"
          begin_guard = (
              "        guard !OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID) else {\n"
              "            failLocally(\n"
              "                \"Tuya still reports a current local-BLE session for this scooter. Power the scooter OFF and wait for that session to clear, or relaunch Capture. Package-owned correlation will not scan while Tuya still owns local BLE.\",\n"
              "                \"existing_sdk_local_ble_ownership_blocks_scan\"\n"
              "            )\n"
              "            return\n"
              "        }\n"
          )
          begin = text.index("    private func beginCorrelationSeries()")
          next_func = text.index("    func startNextCorrelationWindow()", begin)
          section = text[begin:next_func]
          if section.count(begin_anchor) != 1:
              raise SystemExit(f"beginCorrelationSeries token guard anchor count != 1: {section.count(begin_anchor)}")
          if "OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)" in section:
              raise SystemExit("global Tuya BLE admission already exists")
          section = section.replace(begin_anchor, begin_guard + begin_anchor, 1)
          text = text[:begin] + section + text[next_func:]

          factory_anchor = "    static func make() -> OfficialTuyaDriver? {\n"
          factory_method = (
              "    static func isLocallyConnected(uuid: String) -> Bool {\n"
              "#if canImport(ThingSmartHomeKit) && canImport(NembraTuyaPrivateConfig)\n"
              "        guard bootstrap(), !uuid.isEmpty else { return false }\n"
              "        return ThingSmartBLEManager.sharedInstance().deviceStatue(withUUID: uuid)\n"
              "#else\n"
              "        return false\n"
              "#endif\n"
              "    }\n\n"
          )
          factory = text.index("private enum OfficialTuyaFactory")
          probe = text.index("#if canImport(ThingSmartHomeKit)\n@MainActor\nprivate final class OfficialTuyaMembershipProbe", factory)
          factory_section = text[factory:probe]
          if factory_section.count(factory_anchor) != 1:
              raise SystemExit(f"OfficialTuyaFactory make anchor count != 1: {factory_section.count(factory_anchor)}")
          if "static func isLocallyConnected(uuid: String) -> Bool" in factory_section:
              raise SystemExit("global Tuya BLE read already exists")
          factory_section = factory_section.replace(factory_anchor, factory_method + factory_anchor, 1)
          text = text[:factory] + factory_section + text[probe:]

          path.write_text(text, encoding="utf-8")

      - name: Verify portable source contracts
        shell: python
        run: |
          from pathlib import Path

          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")
          test = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipSourceTests.swift").read_text(encoding="utf-8")
          begin_start = app.index("private func beginCorrelationSeries()")
          begin_end = app.index("func startNextCorrelationWindow()", begin_start)
          begin = app[begin_start:begin_end]
          read = begin.index("OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)")
          scan = begin.index("resetDiscoverySessionOnly()")
          if read >= scan:
              raise SystemExit("global Tuya local-BLE read is not before package scanner creation")
          between = begin[read:scan]
          for needle in (
              "existing_sdk_local_ble_ownership_blocks_scan",
              "Package-owned correlation will not scan while Tuya still owns local BLE",
              "return",
          ):
              if needle not in between:
                  raise SystemExit(f"missing pre-scan ownership contract: {needle}")
          for prohibited in ("disconnectBLE", "publishDps", "queryDps", "sessionLedger.endConnection"):
              if prohibited in begin:
                  raise SystemExit(f"pre-scan fence must remain observation-only: {prohibited}")

          factory_start = app.index("private enum OfficialTuyaFactory")
          factory_end = app.index("private final class OfficialTuyaMembershipProbe", factory_start)
          factory = app[factory_start:factory_end]
          for needle in (
              "static func isLocallyConnected(uuid: String) -> Bool",
              "ThingSmartBLEManager.sharedInstance().deviceStatue(withUUID: uuid)",
          ):
              if needle not in factory:
                  raise SystemExit(f"missing official Tuya global ownership read: {needle}")

          for needle in (
              "package correlation refuses to scan while Tuya still owns same-device local BLE",
              "global ownership read uses the same official Tuya local-BLE authority as authenticated observation",
              "pre-scan ownership gate does not manufacture a disconnect or command",
          ):
              if needle not in test:
                  raise SystemExit(f"missing Swift adversarial regression: {needle}")

      - name: Commit clean product repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/apply-capture-cross-controller-ble-ownership-gpt56sol.yml
          git config user.name nembra-go-bot
          git config user.email nembra-go-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): fence cross-controller Tuya BLE ownership' \
            -m 'Before package-owned OFF1 correlation creates its CoreBluetooth scanner, synchronously observe the official Tuya manager same-device local-BLE status and fail closed if Tuya still owns the transport. This closes accepted-view/reentry ownership leakage without manufacturing a disconnect, BLE write, DP query, or command. Physical status remains NO-GO.'
          git push origin HEAD:fix/v14-capture-cross-controller-ble-ownership-gpt56sol
