name: Strengthen ES80 marker-fence contract

on:
  push:
    branches:
      - parallel/recover-es80-passive-lifecycle-marker-fence/chat-c7r4m

permissions:
  contents: write

jobs:
  apply-contract-strengthening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 8
      - name: Verify exact product ancestry
        run: |
          set -euo pipefail
          PRODUCT_PARENT=86f814e9326499a5d56ac7db400cc43386156b87
          WORKFLOW=.github/workflows/recover-es80-marker-fence-contract-chat-c7r4m.yml
          git merge-base --is-ancestor "$PRODUCT_PARENT" HEAD
          test "$(git diff --name-only "$PRODUCT_PARENT" HEAD)" = "$WORKFLOW"
      - name: Strengthen authoritative ordering regression
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerSourceContractTests.swift")
          source = path.read_text()
          method_start_marker = "    func finalizedTeardownQuarantineRejectsMarkersBeforeTerminalCallback() throws {\n"
          method_end_marker = "    @Test\n    func acquisitionWatchdogRetainsOneSpecificFenceWithoutGenericCancel() throws {\n"
          start = source.find(method_start_marker)
          if start < 0:
              raise SystemExit("finalized teardown marker regression method not found")
          end = source.find(method_end_marker, start)
          if end < 0:
              raise SystemExit("watchdog regression boundary not found")
          method = source[start:end]
          if "let finalizationAuthorizationOffset" in method:
              raise SystemExit("authoritative ordering assertions already present")

          needle = "        let source = try Self.controllerSource()\n"
          if method.count(needle) != 1:
              raise SystemExit(f"expected one controller-source seam, found {method.count(needle)}")

          addition = (
              needle
              + "\n"
              + "        let artifactReads = try Self.section(\n"
              + "            in: source,\n"
              + "            from: \"    public func captureSnapshot() async throws -> PassiveBluetoothCaptureSession {\",\n"
              + "            to: \"    private func beginTargetSessionIfNeeded(for identifier: UUID) throws {\"\n"
              + "        )\n"
              + "        #expect(artifactReads.contains(\"lastFinalizedArtifactAuthority = context.authority\"))\n"
              + "\n"
              + "        let teardown = try Self.section(\n"
              + "            in: source,\n"
              + "            from: \"    public func teardownActiveConnectionAfterFinalization() throws {\",\n"
              + "            to: \"    private func cancelActiveConnection(cause:\"\n"
              + "        )\n"
              + "        let finalizationAuthorizationOffset = try Self.offset(\n"
              + "            of: \"guard let finalizedAuthority = lastFinalizedArtifactAuthority,\",\n"
              + "            in: teardown\n"
              + "        )\n"
              + "        let finalizedTeardownOffset = try Self.offset(\n"
              + "            of: \"cancelActiveConnection(cause: .finalizedArtifactTeardown)\",\n"
              + "            in: teardown\n"
              + "        )\n"
              + "        #expect(finalizationAuthorizationOffset < finalizedTeardownOffset)\n"
          )
          method = method.replace(needle, addition, 1)
          source = source[:start] + method + source[end:]
          path.write_text(source)
          PY
          grep -Fq 'let finalizationAuthorizationOffset' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerSourceContractTests.swift
          grep -Fq 'cancelActiveConnection(cause: .finalizedArtifactTeardown)' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerSourceContractTests.swift
      - name: Commit product-only test delta and remove workflow
        run: |
          set -euo pipefail
          PRODUCT_PARENT=86f814e9326499a5d56ac7db400cc43386156b87
          WORKFLOW=.github/workflows/recover-es80-marker-fence-contract-chat-c7r4m.yml
          TESTS=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerSourceContractTests.swift
          git rm "$WORKFLOW"
          test "$(git diff --name-only "$PRODUCT_PARENT")" = "$TESTS"
          git add "$TESTS"
          git config user.name "nembra-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "[recover es80 passive lifecycle] Model finalized marker boundary"
          git push origin "HEAD:${GITHUB_REF_NAME}"
