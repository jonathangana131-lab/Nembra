name: Apply Capture readiness single-scanner recovery

on:
  push:
    branches:
      - agent/v14-capture-readiness-single-scanner-r2-sol

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact app parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6a29b5f0be79db680e0fd5dde22fa2b4aa321eeb HEAD
          test "$(git rev-parse 6a29b5f0be79db680e0fd5dde22fa2b4aa321eeb:NembraApp/App/NembraCaptureEntrypoint.swift)" = "20909f767c9151a77eea4426ddce31aa532145c6"
          test "$(git rev-parse HEAD:NembraApp/App/NembraCaptureEntrypoint.swift)" = "20909f767c9151a77eea4426ddce31aa532145c6"
      - name: Apply deterministic app transform
        run: python3 scripts/ci/apply_capture_readiness_single_scanner_r2.py
      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaCorrelationProgressPresentationSourceTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaPackageOwnedCorrelationSingleScannerSourceTests
      - name: Commit product and self-retire transform
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/apply_capture_readiness_single_scanner_r2.py
          rm .github/workflows/apply-capture-readiness-single-scanner-r2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): publish scan readiness and retire duplicate scanner"
          git push origin HEAD:${GITHUB_REF_NAME}
