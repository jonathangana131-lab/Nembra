name: ES80 current pre-H recovery exact-product QA

on:
  push:
    branches:
      - cell/recover-es80-preh-observation-abort/ci/chat-g5v6-3

permissions:
  contents: read

jobs:
  recovery-qa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - name: Verify exact product parent and workflow-only mirror
        env:
          EXPECTED_PRODUCT_SHA: 5da68c3c3f24058292f3b6472f784b6a4eed6c51
          EXPECTED_WORKFLOW_PATH: .github/workflows/qa-recover-es80-preh-abort-chat-g5v6-3.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$EXPECTED_WORKFLOW_PATH"
      - name: Verify dependency-relative Capture scope
        env:
          BASE_SHA: 2c4d87f35698b1ca58d2b818330c609536b68dcf
          PRODUCT_SHA: 5da68c3c3f24058292f3b6472f784b6a4eed6c51
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$BASE_SHA" "$PRODUCT_SHA" | sort)"
          expected="$(printf '%s\n' \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothAbortedObservationQueueRetirement.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothPreHObservationRecoveryTests.swift | sort)"
          test "$actual" = "$expected"
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Reject application characteristic writes
        run: |
          set -euo pipefail
          if grep -R --include='*.swift' -nE '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            exit 1
          fi
      - name: Reject stale raw-retirement reopen contracts
        run: |
          set -euo pipefail
          ! git grep -n -E 'completeAbortedObservationRecovery|freshTargetSessionRequired' -- \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests
      - name: Run NembraCore tests
        run: swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors
      - name: Run full capture package tests
        run: swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors
      - name: Build capture package for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          xcodebuild -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
