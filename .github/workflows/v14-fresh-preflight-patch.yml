name: V14 Fresh Preflight Patch

on:
  push:
    branches:
      - fix/es80-v14-fresh-preflight-per-experiment-gpt56

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-v14-fresh-preflight-per-experiment-gpt56
          fetch-depth: 0

      - name: Apply fresh-preflight ownership repair
        run: python3 .github/scripts/v14_fresh_preflight_patch.py

      - name: Validate authority source contract
        shell: bash
        run: |
          grep -q 'onRequestFreshExperiment: resetForFreshExperiment' NembraApp/App/NembraApp.swift
          grep -q 'disconnectedDeclarationAccepted = false' NembraApp/App/NembraApp.swift
          grep -q 'private let onRequestFreshExperiment: () -> Void' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -q 'onRequestFreshExperiment()' NembraApp/Features/Research/ES80CaptureShellView.swift
          ! grep -q 'coordinator = try PassiveBluetoothExperimentOneCoordinator()' NembraApp/Features/Research/ES80CaptureShellView.swift

      - name: Remove one-shot editor files
        run: rm .github/workflows/v14-fresh-preflight-patch.yml .github/scripts/v14_fresh_preflight_patch.py

      - name: Commit transformed product tree
        shell: bash
        run: |
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): require fresh charger preflight per experiment"
          git push origin HEAD:fix/es80-v14-fresh-preflight-per-experiment-gpt56
