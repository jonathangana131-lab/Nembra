name: TEMP V14 Field Installer Git Authority Materialize Sol

on:
  push:
    branches:
      - repair/v14-capture-field-installer-git-authority-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-field-installer-git-authority-sol-20260811
          fetch-depth: 0
      - name: Bind exact construction ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b9311fb105981c2a098f682fb4a95f1b7fdff9e5 HEAD
          test "$(git rev-parse HEAD:scripts/field/install_one_time_capture.command)" = 114d01363d96352ca0d7c5c8a3faf90bd127b1ae
          test "$(git rev-parse HEAD:Scripts/bootstrap_capture_tuya_sdk.sh)" = cd441df5b154e508668b76fc11758412579f1631
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize exact repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tmp_materialize_field_installer_git_authority_sol.py
      - name: Verify materializer self-deletion
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/ci/tmp_materialize_field_installer_git_authority_sol.py
          test ! -e .github/workflows/tmp-v14-field-installer-git-authority-materialize-sol.yml
      - name: Verify repaired shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
      - name: Verify permanent Git authority regression
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py
      - name: Verify diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
      - name: Remove construction-only bytecode
        shell: bash
        run: |
          set -euo pipefail
          /bin/rm -rf -- scripts/ci/tests/__pycache__
      - name: Verify exact materialized path set
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          /usr/bin/python3 - <<'PY'
          import subprocess
          expected = {
              "Scripts/bootstrap_capture_tuya_sdk.sh",
              "scripts/field/install_one_time_capture.command",
              ".github/workflows/tmp-v14-field-installer-git-authority-materialize-sol.yml",
              "scripts/ci/tmp_materialize_field_installer_git_authority_sol.py",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected materialized path set: {sorted(actual)}")
          PY
      - name: Publish permanent result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nembra V14 Sol"
          git config user.email "nembra-v14-sol@users.noreply.github.com"
          git commit -m "Capture: bind field installer Git authority to executed source"
          git push origin HEAD:repair/v14-capture-field-installer-git-authority-sol-20260811
