name: ES80 installed-recorder reopen gate v14

on:
  push:
    branches:
      - parallel/es80-recovery-installed-recorder-gate-v14/chat-gpt56
    paths:
      - .github/workflows/es80-installed-recorder-reopen-gate-v14.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-recovery-installed-recorder-gate-v14/chat-gpt56
          fetch-depth: 0
      - name: Patch recovery gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift')
          s = p.read_text()
          def one(old,new,label):
              global s
              if s.count(old) != 1: raise SystemExit(label)
              s = s.replace(old,new,1)
          one('        case horizonArtifactNotReady\n','        case horizonArtifactNotReady\n        case freshTargetSessionRequired\n        case recoveryResolvedFrontierNotApplied(expected: UInt64, actual: UInt64)\n        case recoveryQueueTailChanged(expected: UInt64, actual: UInt64)\n        case freshRecorderNotInstalled\n        case freshRecorderSessionMismatch\n','errors')
          one('    private var committedReadyTransaction: Transaction?\n','    private var committedReadyTransaction: Transaction?\n    private var requiredReadyTargetSessionGeneration: UInt64?\n','state')
          one('        guard processedQueueSequence == nil else {\n            throw StateError.invalidTransition\n        }\n        guard nextRevision != UInt64.max else {\n','        guard processedQueueSequence == nil else {\n            throw StateError.invalidTransition\n        }\n        if let requiredReadyTargetSessionGeneration {\n            guard authority.targetSessionGeneration == requiredReadyTargetSessionGeneration else { throw StateError.freshTargetSessionRequired }\n        }\n        guard nextRevision != UInt64.max else {\n','ready-check')
          one('        phase = .drainingReady(transaction)\n        nextRevision += 1\n','        requiredReadyTargetSessionGeneration = nil\n        phase = .drainingReady(transaction)\n        nextRevision += 1\n','ready-consume')
          anchor='    /// Abort quarantine is intentionally irreversible in this slice.'
          i=s.find(anchor)
          if i<0: raise SystemExit('tail')
          lines=[
          '    @MainActor','    mutating func reopenAfterAbortedFreshTargetSession(','        _ fresh: PassiveCoreBluetoothAbortedFreshTargetSession.Receipt,','        currentResolvedThroughQueueSequence: UInt64,','        currentLastEnqueuedEventSequence: UInt64,','        installedRecorderIdentity: ObjectIdentifier,','        installedRecorderSessionID: UUID','    ) throws {','        guard case let .abortQuarantined(currentAbort) = phase else { throw StateError.invalidTransition }','        let resolution = fresh.abortedResolution','        guard resolution.abortReceipt == currentAbort else { throw StateError.staleTransaction }','        guard currentResolvedThroughQueueSequence == resolution.resolvedThroughQueueSequence else {','            throw StateError.recoveryResolvedFrontierNotApplied(expected: resolution.resolvedThroughQueueSequence, actual: currentResolvedThroughQueueSequence)','        }','        guard currentLastEnqueuedEventSequence == resolution.resolvedThroughQueueSequence else {','            throw StateError.recoveryQueueTailChanged(expected: resolution.resolvedThroughQueueSequence, actual: currentLastEnqueuedEventSequence)','        }','        guard installedRecorderIdentity == fresh.recorderIdentity else { throw StateError.freshRecorderNotInstalled }','        guard installedRecorderSessionID == fresh.sessionID else { throw StateError.freshRecorderSessionMismatch }','        guard fresh.targetSessionGeneration > currentAbort.abandonedTargetSessionGeneration else { throw StateError.freshTargetSessionRequired }','        committedReadyTransaction = nil','        requiredReadyTargetSessionGeneration = fresh.targetSessionGeneration','        phase = .awaitingReady','    }','',
          '    @MainActor','    mutating func reopenAfterTerminalFreshTargetSession(','        _ fresh: PassiveCoreBluetoothTerminalFreshTargetSession.Receipt,','        currentResolvedThroughQueueSequence: UInt64,','        currentLastEnqueuedEventSequence: UInt64,','        installedRecorderIdentity: ObjectIdentifier,','        installedRecorderSessionID: UUID','    ) throws {','        guard case let .terminal(transaction) = phase else { throw StateError.invalidTransition }','        let resolution = fresh.terminalResolution','        guard resolution.terminalTransactionRevision == transaction.revision,','              resolution.terminalTransactionIdentity == transaction.identity,','              resolution.horizonQueueCutoff == transaction.queueCutoff,','              resolution.previouslyResolvedThroughQueueSequence == transaction.queueCutoff else { throw StateError.staleTransaction }','        guard resolution.terminalAuthority == transaction.authority else { throw StateError.authorityChanged }','        guard currentResolvedThroughQueueSequence == resolution.resolvedThroughQueueSequence else {','            throw StateError.recoveryResolvedFrontierNotApplied(expected: resolution.resolvedThroughQueueSequence, actual: currentResolvedThroughQueueSequence)','        }','        guard currentLastEnqueuedEventSequence == resolution.resolvedThroughQueueSequence else {','            throw StateError.recoveryQueueTailChanged(expected: resolution.resolvedThroughQueueSequence, actual: currentLastEnqueuedEventSequence)','        }','        guard installedRecorderIdentity == fresh.recorderIdentity else { throw StateError.freshRecorderNotInstalled }','        guard installedRecorderSessionID == fresh.sessionID else { throw StateError.freshRecorderSessionMismatch }','        guard fresh.targetSessionGeneration > transaction.authority.targetSessionGeneration else { throw StateError.freshTargetSessionRequired }','        committedReadyTransaction = nil','        requiredReadyTargetSessionGeneration = fresh.targetSessionGeneration','        phase = .awaitingReady','    }','',
          '    @discardableResult','    mutating func resetForNewCaptureSession() -> Bool {','        guard phase == .awaitingReady else { return false }','        committedReadyTransaction = nil','        return true','    }','}','']
          p.write_text(s[:i]+'\n'.join(lines))
          PY
          python3 <<'PY'
          from pathlib import Path
          s=Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift').read_text()
          assert 'uncommittedHorizonAbandonedBeforeRecorderMutation' in s
          assert 'PassiveCoreBluetoothAbortedFreshTargetSession.Receipt' in s
          assert 'PassiveCoreBluetoothTerminalFreshTargetSession.Receipt' in s
          assert 'terminalTransactionIdentity == transaction.identity' in s
          assert 'installedRecorderIdentity == fresh.recorderIdentity' in s
          assert 'installedRecorderSessionID == fresh.sessionID' in s
          assert 'freshTargetSessionGeneration:' not in s[s.index('reopenAfterAbortedFreshTargetSession'):]
          PY
          git diff --check
      - name: Commit clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-chat-gpt56'
          git config user.email 'nembra-chat-gpt56@users.noreply.github.com'
          rm .github/workflows/es80-installed-recorder-reopen-gate-v14.yml
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift .github/workflows/es80-installed-recorder-reopen-gate-v14.yml
          git diff --cached --check
          git commit -m 'feat: reopen Capture only from installed fresh-recorder proof'
          git push origin HEAD:parallel/es80-recovery-installed-recorder-gate-v14/chat-gpt56
