name: Materialize Capture Field Python Isolation C38

on:
  push:
    branches:
      - sol/v14-capture-field-python-isolation-c38-r1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          expected='c38cb8f4c66ec1e1e8f6cdbe7fb77955daf18b5e'
          test "$(git rev-parse HEAD^)" = "$expected"
          test "$(git diff --name-only "$expected"..HEAD)" = '.github/workflows/materialize-capture-field-python-isolation-c38.yml'

      - name: Apply reviewed Python isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, textwrap
          targets=[Path('Scripts/bootstrap_capture_tuya_sdk.sh'),Path('scripts/field/install_one_time_capture.command')]
          for path in targets:
              source=path.read_text()
              updated=re.sub(r'/usr/bin/python3 (?!-I\b)', '/usr/bin/python3 -I ', source)
              updated=updated.replace('[[ -x /usr/bin/python3 -I ]]','[[ -x /usr/bin/python3 ]]')
              if updated==source: raise SystemExit(f'no unisolated execution found in {path}')
              path.write_text(updated)
          bootstrap=targets[0].read_text(); installer=targets[1].read_text()
          assert '/usr/bin/python3 -I "$PROVENANCE_HELPER" snapshot' in bootstrap
          assert '/usr/bin/python3 -I "$TUYA_PROVENANCE_HELPER" verify' in installer
          for source in (bootstrap,installer):
              for line in source.splitlines():
                  s=line.strip()
                  if '/usr/bin/python3' in s and not s.startswith('[[ -x /usr/bin/python3 ]]'):
                      assert '/usr/bin/python3 -I' in s, s
          test_path=Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldPythonIsolationSourceTests.swift')
          if test_path.exists(): raise SystemExit('isolation regression already exists')
          test_path.write_text(textwrap.dedent(r'''
              import Foundation
              import Testing
              @testable import NembraBluetoothCapture

              @Suite("Capture field Python interpreter isolation")
              struct TuyaFieldPythonIsolationSourceTests {
                  @Test("private Tuya input snapshot and verification ignore caller Python environment")
                  func privateInputProvenanceUsesIsolatedSystemPython() throws {
                      let bootstrap = try readRepositoryFile("Scripts/bootstrap_capture_tuya_sdk.sh")
                      let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")
                      #expect(bootstrap.contains("/usr/bin/python3 -I \"$PROVENANCE_HELPER\" snapshot"))
                      #expect(installer.contains("/usr/bin/python3 -I \"$TUYA_PROVENANCE_HELPER\" verify"))
                      #expect(!bootstrap.contains("/usr/bin/python3 \"$PROVENANCE_HELPER\" snapshot"))
                      #expect(!installer.contains("/usr/bin/python3 \"$TUYA_PROVENANCE_HELPER\" verify"))
                  }

                  @Test("every installer system-Python execution is isolated")
                  func intendedDeviceAndDiagnosticParsersCannotImportFromCallerPythonPath() throws {
                      let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")
                      let executablePythonLines = installer.split(separator: "\n").filter { rawLine in
                          let line = rawLine.trimmingCharacters(in: .whitespaces)
                          return line.contains("/usr/bin/python3") && !line.hasPrefix("[[ -x /usr/bin/python3 ]]")
                      }
                      #expect(!executablePythonLines.isEmpty)
                      for line in executablePythonLines { #expect(line.contains("/usr/bin/python3 -I")) }
                      #expect(!installer.contains("/usr/bin/python3 -c"))
                      #expect(installer.contains("DEVICE_ROWS=\"$(xcrun xctrace list devices 2>/dev/null | /usr/bin/python3 -I -c"))
                      #expect(installer.contains("COREDEVICE_MATCH=\"$(printf '%s\\0%s' \"$DEVICE_UDID\" \"$COREDEVICE_ROWS\" | /usr/bin/python3 -I -c"))
                  }

                  private func readRepositoryFile(_ relativePath: String) throws -> String {
                      let repositoryRoot = URL(fileURLWithPath: #filePath)
                          .deletingLastPathComponent().deletingLastPathComponent()
                          .deletingLastPathComponent().deletingLastPathComponent()
                          .deletingLastPathComponent()
                      return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
                  }
              }
          ''').lstrip())
          PY

      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-field-python-isolation-c38.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/bootstrap_capture_tuya_sdk.sh scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldPythonIsolationSourceTests.swift .github/workflows/materialize-capture-field-python-isolation-c38.yml
          git commit -m 'fix(capture): isolate field Python authority'
          git push origin HEAD:sol/v14-capture-field-python-isolation-c38-r1
