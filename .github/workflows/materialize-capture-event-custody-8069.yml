name: Materialize Capture Event Custody 8069

on:
  push:
    branches:
      - sol/v14-capture-event-custody-8069
    paths:
      - .nembra/materialize-capture-event-custody-8069.trigger
  pull_request:
    branches:
      - product/v14-capture-guided-truth-current-sol
    paths:
      - .nembra/materialize-capture-event-custody-8069.trigger

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-event-custody-8069
          fetch-depth: 0

      - name: Guard exact live-product ancestry and source blob
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8069c0ffec496cacbe263016d8a7f4ca15ddc64e HEAD
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "66c1e0294787ac3110139a17cee20f746782e96f"

      - name: Materialize event-custody closure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_capture_event_custody_8069.py
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyClosureSourceTests.swift
          fi
          git diff --check

      - name: Remove scaffolding and verify effective scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/materialize_capture_event_custody_8069.py
          rm -f .github/workflows/materialize-capture-event-custody-8069.yml
          rm -f .nembra/materialize-capture-event-custody-8069.trigger
          git diff --check
          mapfile -t paths < <(git diff --name-only 8069c0ffec496cacbe263016d8a7f4ca15ddc64e -- | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = "NembraApp/App/NembraCaptureEntrypoint.swift"
          test "${paths[1]}" = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyClosureSourceTests.swift"

      - name: Publish clean repair checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): close application event custody"
          git push origin HEAD:sol/v14-capture-event-custody-8069
