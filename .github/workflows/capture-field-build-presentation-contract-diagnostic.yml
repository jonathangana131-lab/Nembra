name: Capture Field-Build Presentation Contract Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  package:
    name: Capture package field-build presentation differential
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Run Capture package
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee "$RUNNER_TEMP/capture-field-build-presentation-contract.log"
          status=${PIPESTATUS[0]}
          set -e
          grep -E 'Test run with [0-9]+ tests in [0-9]+ suites' "$RUNNER_TEMP/capture-field-build-presentation-contract.log" | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      - name: Upload exact package log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-field-build-presentation-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/capture-field-build-presentation-contract.log
          retention-days: 7
          if-no-files-found: error
