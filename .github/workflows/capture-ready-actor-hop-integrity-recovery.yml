name: Capture Ready actor-hop integrity recovery

on:
  push:
    branches:
      - agent/es80-ready-actor-hop-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/es80-ready-actor-hop-integrity
          fetch-depth: 4

      - name: Verify exact recovery ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base --is-ancestor ddc4e7fb1d02073173695b83200f6c70f2dd1382 HEAD; echo $?)" = "0"
          test "$(git rev-list --count ddc4e7fb1d02073173695b83200f6c70f2dd1382..HEAD)" = "3"
          test "$(git diff --name-only ddc4e7fb1d02073173695b83200f6c70f2dd1382 HEAD | sort)" = "$(printf '%s\n' \
            '.github/workflows/capture-ready-actor-hop-integrity-recovery.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerReadyActorHopIntegrityTests.swift' | sort)"

      - name: Apply exact Ready interlock repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          source = path.read_text()

          old_pre = '''                        try self.requireForegroundEvidenceIntegrity()
                        try self.ensureCaptureHealthy()
'''
          new_pre = '''                        try self.requireForegroundEvidenceIntegrity()
                        try self.ensureCaptureHealthy()
                        try self.validateBoundaryAuthority(admission.authority)
'''
          count = source.count(old_pre)
          if count != 1:
              raise SystemExit(f"Ready pre-attempt interlock: expected one patch site, found {count}")
          source = source.replace(old_pre, new_pre, 1)

          old_recorded = '''                    case let .recorded(recordedReady):
                        do {
                            // This typed queue commit is intentionally the immediate
                            // MainActor statement after the recorder actor returns.
                            // No await is permitted in this interlock.
                            self.committedReadyEpoch = try recordedReady.markBoundaryRecorded(
                                on: &self.observationBoundaryQueueGate,
                                lastProcessedQueueSequence: self.lastProcessedEventSequence
                            )
                        } catch {
                            // Recorder mutation already happened, so quarantine with
                            // the distinct recorded-before-commit origin. Never label
                            // this a zero-mutation rejection.
                            _ = try? self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit(recordedReady)
                            throw error
                        }
'''
          new_recorded = '''                    case let .recorded(recordedReady):
                        do {
                            // The Ready recorder mutation is an actor hop. Foreground loss may
                            // poison this exact durable capture while the recorder owns the append,
                            // so recheck immediately before typed queue commit with no further await.
                            try self.requireForegroundEvidenceIntegrity()
                            // This typed queue commit is intentionally the immediate lifecycle
                            // promotion after the post-recorder integrity check.
                            self.committedReadyEpoch = try recordedReady.markBoundaryRecorded(
                                on: &self.observationBoundaryQueueGate,
                                lastProcessedQueueSequence: self.lastProcessedEventSequence
                            )
                        } catch {
                            let recordedReadyFailure = error
                            do {
                                // Recorder mutation already happened, so quarantine with
                                // the distinct recorded-before-commit origin. Never label
                                // this a zero-mutation rejection.
                                _ = try self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit(
                                    recordedReady
                                )
                            } catch {
                                // Failed exact quarantine is stronger lifecycle evidence than the
                                // triggering foreground/queue-commit failure. Never suppress it.
                                throw error
                            }
                            throw recordedReadyFailure
                        }
'''
          count = source.count(old_recorded)
          if count != 1:
              raise SystemExit(f"Recorded Ready interlock: expected one patch site, found {count}")
          source = source.replace(old_recorded, new_recorded, 1)

          path.write_text(source)
          Path(".github/workflows/capture-ready-actor-hop-integrity-recovery.yml").unlink()
          PY

          git diff --check
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          test "$(grep -c 'try self.validateBoundaryAuthority(admission.authority)' "$controller")" -ge 1
          test "$(grep -c 'let recordedReadyFailure = error' "$controller")" = "1"
          test "$(grep -c 'try? self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit' "$controller" || true)" = "0"
          test ! -e .github/workflows/capture-ready-actor-hop-integrity-recovery.yml

      - name: Commit clean product result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-chatgpt56"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve Ready authority across actor hops"
          git push origin HEAD:agent/es80-ready-actor-hop-integrity
