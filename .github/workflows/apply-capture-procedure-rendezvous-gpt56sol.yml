name: Apply Capture procedure rendezvous GPT56 Sol

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/v14-capture-procedure-rendezvous-gpt56sol'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact binary procedure rendezvous
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          expected_parent='dee52e17577d25dd6d928378b2fb530f321923bb'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent" || {
            echo "ERROR: materializer parent drifted: $actual_parent != $expected_parent" >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          PROCEDURE = "ES80-AUTHENTICATED-STATIONARY-v1"

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all_exact(path: str, old: str, new: str, expected_count: int) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(f"{path}: expected {expected_count} matches, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # Compiled build identity: the binary must carry the exact procedure in Info.plist,
          # and field admission is authoritative only if the compiled value matches the one
          # canonical procedure constant used by accepted export.
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n',
              '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n'
              '    static let fieldProcedureIdentifierInfoKey = "NembraCaptureFieldProcedureIdentifier"\n'
              f'    static let fieldProcedureIdentifier = "{PROCEDURE}"\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              '    let tuyaDependencyLockSHA256: String\n',
              '    let tuyaDependencyLockSHA256: String\n    let compiledFieldProcedureIdentifier: String\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              '            tuyaDependencyLockSHA256: ((infoDictionary[tuyaDependencyLockSHA256InfoKey] as? String) ?? "").lowercased()\n',
              '            tuyaDependencyLockSHA256: ((infoDictionary[tuyaDependencyLockSHA256InfoKey] as? String) ?? "").lowercased(),\n'
              '            compiledFieldProcedureIdentifier: (infoDictionary[fieldProcedureIdentifierInfoKey] as? String) ?? ""\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              '              tuyaDependencyLockSHA256.utf8.allSatisfy({ byte in\n                  (byte >= 48 && byte <= 57) || (byte >= 97 && byte <= 102)\n              }) else { return false }\n',
              '              tuyaDependencyLockSHA256.utf8.allSatisfy({ byte in\n                  (byte >= 48 && byte <= 57) || (byte >= 97 && byte <= 102)\n              }),\n'
              '              compiledFieldProcedureIdentifier == Self.fieldProcedureIdentifier else { return false }\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              'This build has no valid exact Git + reviewed Tuya dependency provenance.',
              'This build has no valid exact Git + reviewed Tuya dependency + stationary procedure provenance.'
          )

          # Generated Info.plist receives the procedure build setting in both target configs.
          replace_all_exact(
              "NembraCapture.xcodeproj/project.pbxproj",
              '\t\t\t\tINFOPLIST_KEY_NembraCaptureBuildIdentifier = "$(NEMBRA_CAPTURE_BUILD_IDENTIFIER)";\n',
              '\t\t\t\tINFOPLIST_KEY_NembraCaptureBuildIdentifier = "$(NEMBRA_CAPTURE_BUILD_IDENTIFIER)";\n'
              '\t\t\t\tINFOPLIST_KEY_NembraCaptureFieldProcedureIdentifier = "$(NEMBRA_CAPTURE_FIELD_PROCEDURE_IDENTIFIER)";\n',
              2
          )

          # Immutable artifact + user-visible authority surface.
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '        let tuyaDependencyLockSHA256: String\n        let tuyaDeviceID: String\n',
              '        let tuyaDependencyLockSHA256: String\n        let procedureIdentifier: String\n        let tuyaDeviceID: String\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '    var fieldBuildSourceCommitSHA: String { buildIdentity.sourceCommitSHA }\n    var sdkAccountLoggedIn: Bool',
              '    var fieldBuildSourceCommitSHA: String { buildIdentity.sourceCommitSHA }\n'
              '    var fieldProcedureIdentifier: String { buildIdentity.compiledFieldProcedureIdentifier }\n'
              '    var sdkAccountLoggedIn: Bool'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '            schemaVersion: 9,\n',
              '            schemaVersion: 10,\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n            tuyaDeviceID: deviceID,\n',
              '            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n'
              '            procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier,\n'
              '            tuyaDeviceID: deviceID,\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '            LabeledContent("Source commit", value: test.fieldBuildSourceCommitSHA)\n            LabeledContent("Private SDK config", value: test.privateConfig ? "Present" : "Missing")\n',
              '            LabeledContent("Source commit", value: test.fieldBuildSourceCommitSHA)\n'
              '            LabeledContent("Procedure", value: test.fieldProcedureIdentifier)\n'
              '            LabeledContent("Private SDK config", value: test.privateConfig ? "Present" : "Missing")\n'
          )

          # Canonical operator procedure.
          replace_once(
              "docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md",
              '# Nembra Capture P0 — secure-link gate\n\n',
              f'# Nembra Capture P0 — secure-link gate\n\nPROCEDURE_ID: `{PROCEDURE}`\n\n'
          )

          # Field build stamps the same value, reads it back from the produced app, and only
          # then permits install/launch custody to continue.
          replace_once(
              "scripts/field/install_one_time_capture.command",
              'EXPECTED_SOURCE_SHA="${1:-${NEMBRA_CAPTURE_EXPECTED_SOURCE_SHA:-}}"\n',
              f'PROCEDURE_ID="{PROCEDURE}"\nEXPECTED_SOURCE_SHA="${{1:-${{NEMBRA_CAPTURE_EXPECTED_SOURCE_SHA:-}}}}"\n'
          )
          replace_once(
              "scripts/field/install_one_time_capture.command",
              '    "NEMBRA_CAPTURE_BUILD_COMMIT_SHA=$SOURCE_SHA" \\\n    "NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256=$TUYA_DEPENDENCY_LOCK_SHA256" \\\n',
              '    "NEMBRA_CAPTURE_BUILD_COMMIT_SHA=$SOURCE_SHA" \\\n'
              '    "NEMBRA_CAPTURE_FIELD_PROCEDURE_IDENTIFIER=$PROCEDURE_ID" \\\n'
              '    "NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256=$TUYA_DEPENDENCY_LOCK_SHA256" \\\n'
          )
          replace_once(
              "scripts/field/install_one_time_capture.command",
              'BUILT_SOURCE_SHA="$(/usr/bin/plutil -extract NembraCaptureSourceCommitSHA raw -o - "$APP_INFO_PLIST" 2>/dev/null || true)"\n'
              'BUILT_TUYA_DEPENDENCY_LOCK_SHA256=',
              'BUILT_SOURCE_SHA="$(/usr/bin/plutil -extract NembraCaptureSourceCommitSHA raw -o - "$APP_INFO_PLIST" 2>/dev/null || true)"\n'
              'BUILT_PROCEDURE_ID="$(/usr/bin/plutil -extract NembraCaptureFieldProcedureIdentifier raw -o - "$APP_INFO_PLIST" 2>/dev/null || true)"\n'
              'BUILT_TUYA_DEPENDENCY_LOCK_SHA256='
          )
          replace_once(
              "scripts/field/install_one_time_capture.command",
              '[[ "$BUILT_SOURCE_SHA" == "$SOURCE_SHA" ]] || die "Built Capture app source SHA does not match the exact requested source. Discard this candidate."\n'
              '[[ "$BUILT_TUYA_DEPENDENCY_LOCK_SHA256" == "$TUYA_DEPENDENCY_LOCK_SHA256" ]]',
              '[[ "$BUILT_SOURCE_SHA" == "$SOURCE_SHA" ]] || die "Built Capture app source SHA does not match the exact requested source. Discard this candidate."\n'
              '[[ "$BUILT_PROCEDURE_ID" == "$PROCEDURE_ID" ]] || die "Built Capture app procedure identifier does not match the accepted stationary procedure. Discard this candidate."\n'
              '[[ "$BUILT_TUYA_DEPENDENCY_LOCK_SHA256" == "$TUYA_DEPENDENCY_LOCK_SHA256" ]]'
          )
          replace_once(
              "scripts/field/install_one_time_capture.command",
              'say "Built app provenance matched exact requested source, reviewed Tuya dependency lock, and field product"\n'
              'unset BUILT_BUILD_IDENTIFIER BUILT_SOURCE_SHA BUILT_TUYA_DEPENDENCY_LOCK_SHA256 BUILT_BUNDLE_ID APP_INFO_PLIST\n',
              'say "Built app provenance matched exact requested source, stationary procedure, reviewed Tuya dependency lock, and field product"\n'
              'unset BUILT_BUILD_IDENTIFIER BUILT_SOURCE_SHA BUILT_PROCEDURE_ID BUILT_TUYA_DEPENDENCY_LOCK_SHA256 BUILT_BUNDLE_ID APP_INFO_PLIST\n'
          )
          replace_once(
              "scripts/field/install_one_time_capture.command",
              'say "SDK-INTEGRATED CAPTURE LAUNCHED"\nprintf \'%s\\n\' \\\n',
              'say "SDK-INTEGRATED CAPTURE LAUNCHED"\nprintf \'%s\\n\' \\\n    "Field procedure: $PROCEDURE_ID" \\\n'
          )

          # Provenance gate must fail if any binary/runbook/installer rendezvous drifts.
          wf = ".github/workflows/capture-field-build-provenance.yml"
          replace_once(
              wf,
              "      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldDependencyProvenanceSourceTests.swift\n",
              "      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldDependencyProvenanceSourceTests.swift\n"
              "      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift\n"
          )
          replace_once(
              wf,
              "          installer='scripts/field/install_one_time_capture.command'\n",
              "          installer='scripts/field/install_one_time_capture.command'\n          runbook='docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md'\n"
          )
          replace_once(
              wf,
              "          grep -Fq 'NEMBRA_CAPTURE_BUILD_COMMIT_SHA=\"$SOURCE_SHA\"' \"$installer\"\n",
              "          grep -Fq 'NEMBRA_CAPTURE_BUILD_COMMIT_SHA=\"$SOURCE_SHA\"' \"$installer\"\n"
              f"          grep -Fq 'PROCEDURE_ID=\"{PROCEDURE}\"' \"$installer\"\n"
              "          grep -Fq 'NEMBRA_CAPTURE_FIELD_PROCEDURE_IDENTIFIER=$PROCEDURE_ID' \"$installer\"\n"
          )
          replace_once(
              wf,
              "          grep -Fq 'plutil -extract NembraCaptureSourceCommitSHA raw -o - \"$APP_INFO_PLIST\"' \"$installer\"\n",
              "          grep -Fq 'plutil -extract NembraCaptureSourceCommitSHA raw -o - \"$APP_INFO_PLIST\"' \"$installer\"\n"
              "          grep -Fq 'plutil -extract NembraCaptureFieldProcedureIdentifier raw -o - \"$APP_INFO_PLIST\"' \"$installer\"\n"
          )
          replace_once(
              wf,
              "          grep -Fq '[[ \"$BUILT_SOURCE_SHA\" == \"$SOURCE_SHA\" ]]' \"$installer\"\n",
              "          grep -Fq '[[ \"$BUILT_SOURCE_SHA\" == \"$SOURCE_SHA\" ]]' \"$installer\"\n"
              "          grep -Fq '[[ \"$BUILT_PROCEDURE_ID\" == \"$PROCEDURE_ID\" ]]' \"$installer\"\n"
          )
          replace_once(
              wf,
              "          grep -Fq 'INFOPLIST_KEY_NembraCaptureBuildIdentifier = \"$(NEMBRA_CAPTURE_BUILD_IDENTIFIER)\";' \"$project\"\n",
              "          grep -Fq 'INFOPLIST_KEY_NembraCaptureBuildIdentifier = \"$(NEMBRA_CAPTURE_BUILD_IDENTIFIER)\";' \"$project\"\n"
              "          grep -Fq 'INFOPLIST_KEY_NembraCaptureFieldProcedureIdentifier = \"$(NEMBRA_CAPTURE_FIELD_PROCEDURE_IDENTIFIER)\";' \"$project\"\n"
          )
          replace_once(
              wf,
              "          grep -Fq 'static let tuyaDependencyLockSHA256InfoKey = \"NembraCaptureTuyaDependencyLockSHA256\"' \"$identity\"\n",
              "          grep -Fq 'static let tuyaDependencyLockSHA256InfoKey = \"NembraCaptureTuyaDependencyLockSHA256\"' \"$identity\"\n"
              f"          grep -Fq 'static let fieldProcedureIdentifier = \"{PROCEDURE}\"' \"$identity\"\n"
              "          grep -Fq 'compiledFieldProcedureIdentifier == Self.fieldProcedureIdentifier' \"$identity\"\n"
          )
          replace_once(
              wf,
              "          grep -Fq 'tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256' \"$entrypoint\"\n",
              "          grep -Fq 'tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256' \"$entrypoint\"\n"
              "          grep -Fq 'procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier' \"$entrypoint\"\n"
              "          grep -Fq 'schemaVersion: 10' \"$entrypoint\"\n"
              f"          grep -Fq 'PROCEDURE_ID: `{PROCEDURE}`' \"$runbook\"\n"
          )
          replace_once(
              wf,
              '          label=\'capture-v14-0123456789ab\'\n',
              f'          label=\'capture-v14-0123456789ab\'\n          procedure=\'{PROCEDURE}\'\n'
          )
          replace_once(
              wf,
              '            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$sha" \\\n            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="$dependency_sha" \\\n',
              '            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$sha" \\\n'
              '            NEMBRA_CAPTURE_FIELD_PROCEDURE_IDENTIFIER="$procedure" \\\n'
              '            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="$dependency_sha" \\\n'
          )
          replace_once(
              wf,
              '          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$sha"\n',
              '          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$sha"\n'
              '          test "$(plutil -extract NembraCaptureFieldProcedureIdentifier raw -o - "$plist")" = "$procedure"\n'
          )

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift")
          if test_path.exists():
              raise SystemExit(f"{test_path}: unexpected pre-existing procedure source contract")
          test_path.write_text(f'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture field procedure rendezvous")
          struct TuyaFieldProcedureRendezvousSourceTests {{
              private static let procedure = "{PROCEDURE}"

              @Test("binary build identity and immutable accepted export share one exact procedure")
              func binaryAndAcceptedArtifactShareCanonicalProcedure() throws {{
                  let identity = try readRepositoryFile("NembraApp/App/NembraCaptureBuildIdentity.swift")
                  let project = try readRepositoryFile("NembraCapture.xcodeproj/project.pbxproj")
                  let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")

                  #expect(identity.contains("fieldProcedureIdentifier"))
                  #expect(identity.contains(Self.procedure))
                  #expect(identity.contains("compiledFieldProcedureIdentifier == Self.fieldProcedureIdentifier"))
                  #expect(project.contains("INFOPLIST_KEY_NembraCaptureFieldProcedureIdentifier"))
                  #expect(app.contains("let procedureIdentifier: String"))
                  #expect(app.contains("procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier"))
                  #expect(app.contains("LabeledContent(\\\"Procedure\\\""))
                  #expect(app.contains("schemaVersion: 10"))
              }}

              @Test("runbook installer and provenance gate pin the same procedure")
              func fieldSurfacesShareCanonicalProcedure() throws {{
                  let runbook = try readRepositoryFile("docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md")
                  let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")
                  let workflow = try readRepositoryFile(".github/workflows/capture-field-build-provenance.yml")

                  #expect(runbook.contains("PROCEDURE_ID: `\\(Self.procedure)`"))
                  #expect(installer.contains("PROCEDURE_ID=\\\"\\(Self.procedure)\\\""))
                  #expect(installer.contains("NEMBRA_CAPTURE_FIELD_PROCEDURE_IDENTIFIER=$PROCEDURE_ID"))
                  #expect(installer.contains("plutil -extract NembraCaptureFieldProcedureIdentifier"))
                  #expect(installer.contains("BUILT_PROCEDURE_ID"))
                  #expect(workflow.contains("NEMBRA_CAPTURE_FIELD_PROCEDURE_IDENTIFIER"))
                  #expect(workflow.contains("plutil -extract NembraCaptureFieldProcedureIdentifier"))
              }}

              private func readRepositoryFile(_ relativePath: String) throws -> String {{
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }}
          }}
          '''.replace("          ", ""), encoding="utf-8")

          # Self-delete: the durable product commit contains no materializer workflow.
          Path(".github/workflows/apply-capture-procedure-rendezvous-gpt56sol.yml").unlink()

          # Local static assertions before committing.
          sources = {
              "identity": Path("NembraApp/App/NembraCaptureBuildIdentity.swift").read_text(),
              "project": Path("NembraCapture.xcodeproj/project.pbxproj").read_text(),
              "app": Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(),
              "runbook": Path("docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md").read_text(),
              "installer": Path("scripts/field/install_one_time_capture.command").read_text(),
              "workflow": Path(".github/workflows/capture-field-build-provenance.yml").read_text(),
          }
          for name, text in sources.items():
              if PROCEDURE not in text and name not in {"project"}:
                  raise SystemExit(f"procedure identity absent from {name}")
          if 'schemaVersion: 10' not in sources['app']:
              raise SystemExit('accepted export schema did not advance to 10')
          PY

          bash -n scripts/field/install_one_time_capture.command
          git diff --check
          git add -A
          git diff --cached --exit-code && { echo 'ERROR: no procedure product delta created' >&2; exit 1; }
          git commit -m 'fix(capture): bind canonical stationary procedure to binary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
