name: Agent Capture App Single Authority R2

on:
  push:
    branches:
      - agent/capture-app-single-authority-v14-r2

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/capture-app-single-authority-v14-r2
          fetch-depth: 0
      - name: Apply app-only product delta from reviewed child
        run: |
          set -euo pipefail
          source_base=26078c59713ce87d2b810b0110059e42869115dc
          source_head=68ddd3cf24ac4708b1cc02c658ee31352156d1f4
          app=NembraApp/App/NembraApp.swift
          shell=NembraApp/Features/Research/ES80CaptureShellView.swift
          tests=NembraAppTests/NembraAppTests.swift
          git fetch --no-tags origin "$source_base" "$source_head"
          git diff --binary "$source_base" "$source_head" -- "$app" "$shell" "$tests" > /tmp/app-authority.patch
          test -s /tmp/app-authority.patch
          git apply --3way --index /tmp/app-authority.patch
          python3 <<'PY'
          from pathlib import Path
          for path in [Path('NembraApp/App/NembraApp.swift'), Path('NembraApp/Features/Research/ES80CaptureShellView.swift')]:
              s = path.read_text()
              s = s.replace('try? PassiveBluetoothExperimentOneCoordinator()', 'try? PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()')
              s = s.replace('try PassiveBluetoothExperimentOneCoordinator()', 'try PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()')
              path.write_text(s)
          PY
          git add "$app" "$shell" "$tests"
          ! grep -q 'PassiveBluetoothPowerCycleObservationSession(' "$shell"
          ! grep -q 'Passive capture binding not available in this build' "$shell"
          ! grep -q 'try? ForegroundCoreBluetoothCaptureController(' "$app"
          grep -q 'PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()' "$app"
          grep -q 'PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()' "$shell"
          grep -q 'coordinator.prepareCaptureRediscovery()' "$shell"
          grep -q 'coordinator.connectPreparedCapture()' "$shell"
          grep -q 'encodedFinalizedObservationHorizonJSON' "$shell"
          grep -q 'ShareLink(item: finalizedCaptureURL)' "$shell"
          grep -q 'testCaptureShellContinuesSameAuthorityThroughSealAndShare' "$tests"
          git diff --cached --check
      - name: Commit product-only reanchor
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-capture-app-single-authority-r2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m '[Capture app] Continue canonical Experiment One through seal and share'
          git push origin HEAD:agent/capture-app-single-authority-v14-r2
