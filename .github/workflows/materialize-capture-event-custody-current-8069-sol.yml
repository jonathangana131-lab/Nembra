name: Materialize Capture Event Custody Current 8069

on:
  push:
    branches:
      - converge/v14-capture-event-custody-current-8069-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/v14-capture-event-custody-current-8069-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact product parent and import red contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8069c0ffec496cacbe263016d8a7f4ca15ddc64e"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-capture-event-custody-current-8069-sol.yml"
          for sha in \
            a8eb9b93eea7e5de1a9c80468cadf378989b5edd \
            8010d108a043fbe2ff03fa3bb0d1518aa7047c08 \
            078c43bba35dee1dd522ed04f8aaa18e6eda4d21
          do
            git fetch --no-tags origin "$sha"
          done
          git show a8eb9b93eea7e5de1a9c80468cadf378989b5edd:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git show 8010d108a043fbe2ff03fa3bb0d1518aa7047c08:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          git show 078c43bba35dee1dd522ed04f8aaa18e6eda4d21:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift \
            > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift

      - name: Materialize remaining current truth repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def lines(*items: str) -> str:
              return "\n".join(items)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          def replace_in_section(text: str, start: str, end: str, old: str, new: str, label: str) -> str:
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{label}: start marker missing')
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f'{label}: end marker missing')
              section = text[a:b]
              count = section.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one section anchor, found {count}')
              return text[:a] + section.replace(old, new, 1) + text[b:]

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          view_exit_anchor = '        guard processCorrelationLease != nil || correlationSession != nil else { return }'
          view_exit_repair = lines(
              '        if phase == .correlated || phase == .selected {',
              '            // Final-window sealing can retire the scanner before this view exits. Do not',
              '            // let that already-earned target selection cross a Secure Link view lifetime.',
              '            resetDiscoverySessionOnly()',
              '            phase = .failed',
              '            message = "Capture left Secure Link after Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; the prior target cannot cross a view lifetime."',
              '            log("target_correlation_abandoned_on_view_exit")',
              '            return',
              '        }',
              '',
              view_exit_anchor
          )
          source = replace_in_section(
              source,
              '    func abandonCorrelationForViewExit() {',
              '    func appDidLoseForeground() {',
              view_exit_anchor,
              view_exit_repair,
              'view-exit correlated target revocation'
          )

          event_guard_old = lines(
              '        guard sdkAccountLoggedIn,',
              '              sdkDeviceMembershipVerified,',
              '              accountIdentityLeaseIsAuthorized,',
              '              let driver else {'
          )
          event_guard_new = lines(
              '        guard sdkAccountLoggedIn,',
              '              sdkDeviceMembershipVerified,',
              '              accountIdentityLeaseIsAuthorized,',
              '              let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),',
              '              !verifiedAccountUID.isEmpty,',
              '              let driver else {'
          )
          source = replace_in_section(
              source,
              '    private func receivedApplicationUpdate(',
              '    private func startWatchdog(',
              event_guard_old,
              event_guard_new,
              'verified account UID event lease'
          )

          event_log_old = lines(
              '            log("tuya_application_update", update.merging([',
              '                "generation": String(token.diagnosticGeneration)',
              '            ]) { current, _ in current })'
          )
          event_log_new = lines(
              '            let eventDetails = redactVerifiedAccountUID(',
              '                from: update,',
              '                verifiedAccountUID: verifiedAccountUID',
              '            )',
              '            log("tuya_application_update", eventDetails.merging([',
              '                "generation": String(token.diagnosticGeneration)',
              '            ]) { _, trusted in trusted })'
          )
          source = replace_in_section(
              source,
              '    private func receivedApplicationUpdate(',
              '    private func startWatchdog(',
              event_log_old,
              event_log_new,
              'trusted generation and account UID event custody'
          )

          watchdog_anchor = '    private func startWatchdog(token: TuyaReadOnlyConnectionToken) {'
          uid_helper = lines(
              '    private func redactVerifiedAccountUID(',
              '        from update: [String: String],',
              '        verifiedAccountUID: String',
              '    ) -> [String: String] {',
              '        var redacted: [String: String] = [:]',
              '        for (key, value) in update {',
              '            let redactedKey = key.replacingOccurrences(of: verifiedAccountUID, with: "<redacted-account-uid>")',
              '            let redactedValue = value.replacingOccurrences(of: verifiedAccountUID, with: "<redacted-account-uid>")',
              '            var uniqueKey = redactedKey',
              '            var suffix = 2',
              '            while redacted[uniqueKey] != nil {',
              '                uniqueKey = "\\(redactedKey)#\\(suffix)"',
              '                suffix += 1',
              '            }',
              '            redacted[uniqueKey] = redactedValue',
              '        }',
              '        return redacted',
              '    }',
              '',
              watchdog_anchor
          )
          source = replace_once(source, watchdog_anchor, uid_helper, 'account UID helper insertion')

          duplicate_session = lines(
              '        "accesstoken",',
              '        "refreshtoken",',
              '        "sessionkey",',
              '        "authkey",'
          )
          simplified_session = lines(
              '        "accesstoken",',
              '        "refreshtoken",',
              '        "authkey",'
          )
          source = replace_in_section(
              source,
              'private final class SmartLifeDriver',
              '#endif\n\nprivate enum AppleAccountAuthorizationError',
              duplicate_session,
              simplified_session,
              'duplicate sessionkey simplification'
          )
          path.write_text(source, encoding='utf-8')

          bridge_path = Path('NembraApp/Features/Research/TuyaAccountBridge.swift')
          bridge = bridge_path.read_text(encoding='utf-8')
          bridge = replace_once(
              bridge,
              'let secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "sessionkey", "seckey", "authkey"]',
              'let secretKeyFragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "seckey", "authkey"]',
              'metadata/export secret classifier parity'
          )
          bridge_path.write_text(bridge, encoding='utf-8')

          foreground_test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift')
          foreground_test = foreground_test_path.read_text(encoding='utf-8')
          test_anchor = '    @Test("foreground reactivation cannot reopen membership after official driver handoff")\n'
          test_insert = '''    @Test("view exit cannot retain an already-correlated or selected target")
              func viewExitCannotCarryTargetAcrossLifetime() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = String(try section(
                      in: source,
                      from: "private final class SecureLinkController",
                      to: "@MainActor\\nprivate protocol OfficialTuyaDriver"
                  ))
                  let cleanup = String(try section(
                      in: controller,
                      from: "func abandonCorrelationForViewExit()",
                      to: "func appDidLoseForeground()"
                  ))

                  #expect(cleanup.contains("phase == .correlated || phase == .selected"))
                  #expect(cleanup.contains("resetDiscoverySessionOnly()"))
                  #expect(cleanup.contains("target_correlation_abandoned_on_view_exit"))
              }

          '''
          if foreground_test.count(test_anchor) != 1:
              raise SystemExit('foreground target regression insertion anchor missing')
          foreground_test_path.write_text(foreground_test.replace(test_anchor, test_insert + test_anchor, 1), encoding='utf-8')
          PY

      - name: Verify source contracts and parse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          bridge = Path('NembraApp/Features/Research/TuyaAccountBridge.swift').read_text(encoding='utf-8').lower()
          for token in [
              'phase == .correlated || phase == .selected',
              'target_correlation_abandoned_on_view_exit',
              '<redacted-account-uid>',
              'redactVerifiedAccountUID(',
              'eventDetails.merging([',
              ']) { _, trusted in trusted })',
          ]:
              if token not in source:
                  raise SystemExit(f'missing current event-custody contract: {token}')
          if 'log("tuya_application_update", update.merging([' in source or ']) { current, _ in current })' in source:
              raise SystemExit('untrusted application event precedence remains')
          smartlife = source[source.index('private final class SmartLifeDriver'):source.index('#endif\n\nprivate enum AppleAccountAuthorizationError')]
          if smartlife.count('"sessionkey"') != 1:
              raise SystemExit('SmartLifeDriver must contain exactly one sessionkey classifier')
          for token in ['localkey','sessionkey','appkey','appsecret','password','accounttoken','accesstoken','refreshtoken','authkey','seckey']:
              if token not in bridge:
                  raise SystemExit(f'metadata sanitizer missing promised secret class: {token}')
          print('Capture current event-custody convergence source contract: PASS')
          PY
          git diff --check
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse NembraApp/Features/Research/TuyaAccountBridge.swift
          for test in \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift
          do
            swiftc -parse "$test"
          done

      - name: Collapse helper into current product donor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-event-custody-current-8069-sol.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): close current event and metadata custody seams'
          git push origin HEAD:converge/v14-capture-event-custody-current-8069-sol
