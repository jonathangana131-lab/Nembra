name: Capture fa22 secret-value custody materializer

on:
  push:
    branches:
      - agent/v14-capture-secret-value-fa22-sol
    paths:
      - .github/workflows/capture-secret-value-fa22-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v14-capture-secret-value-fa22-sol
          fetch-depth: 0

      - name: Bind exact current parent
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fa22b1666e423aa6b5f00d52c62a357881416a1a HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply minimal secret-value custody patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          class_start = source.index("@MainActor\nprivate final class SmartLifeDriver")
          class_end = source.index("#endif\n\nprivate enum AppleAccountAuthorizationError", class_start)
          driver = source[class_start:class_end]

          old_callback = "\n".join([
              "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {",
              "        guard let dps, !dps.isEmpty else { return }",
              "        var sanitized: [String: String] = [:]",
              "        for (key, value) in dps {",
              "            let keyString = String(describing: key)",
              "            let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }",
              "            if Self.secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {",
              "                sanitized[keyString] = \"<redacted>\"",
              "            } else {",
              "                sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))",
              "            }",
              "        }",
              "        onApplicationUpdate?(sanitized)",
              "    }",
          ])
          new_callback = "\n".join([
              "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {",
              "        guard let dps, !dps.isEmpty else { return }",
              "        var sanitized: [String: String] = [:]",
              "        for (key, value) in dps {",
              "            let keyString = String(describing: key)",
              "            let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }",
              "            let baseCustodyKey = Self.redactKnownSecretValues(in: keyString)",
              "            var custodyKey = baseCustodyKey",
              "            var collisionIndex = 2",
              "            while sanitized[custodyKey] != nil {",
              "                custodyKey = \"\\(baseCustodyKey)#\\(collisionIndex)\"",
              "                collisionIndex += 1",
              "            }",
              "            if Self.secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {",
              "                sanitized[custodyKey] = \"<redacted>\"",
              "            } else {",
              "                sanitized[custodyKey] = Self.redactedApplicationDescription(value)",
              "            }",
              "        }",
              "        onApplicationUpdate?(sanitized)",
              "    }",
          ])
          if driver.count(old_callback) != 1:
              raise SystemExit(f"expected exact unsafe callback once; found {driver.count(old_callback)}")
          driver = driver.replace(old_callback, new_callback, 1)

          old_sanitizer = "\n".join([
              "    private static func redactApplicationSecrets(_ object: Any) -> Any {",
              "        if let dictionary = object as? [AnyHashable: Any] {",
              "            var sanitized: [String: Any] = [:]",
              "            for (key, value) in dictionary {",
              "                let keyString = String(describing: key)",
              "                let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }",
              "                if secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {",
              "                    sanitized[keyString] = \"<redacted>\"",
              "                } else {",
              "                    sanitized[keyString] = redactApplicationSecrets(value)",
              "                }",
              "            }",
              "            return sanitized",
              "        }",
              "        if let array = object as? [Any] {",
              "            return array.map(redactApplicationSecrets)",
              "        }",
              "        return object",
              "    }",
          ])
          new_sanitizer = "\n".join([
              "    private static var exactSecretValues: [String] {",
              "#if canImport(NembraTuyaPrivateConfig)",
              "        [NembraTuyaPrivateIdentity.appKey, NembraTuyaPrivateIdentity.appSecret]",
              "            .filter { !$0.isEmpty }",
              "#else",
              "        []",
              "#endif",
              "    }",
              "",
              "    private static func redactKnownSecretValues(in text: String) -> String {",
              "        var redacted = text",
              "        for secret in exactSecretValues {",
              "            redacted = redacted.replacingOccurrences(of: secret, with: \"<redacted>\")",
              "        }",
              "        return redacted",
              "    }",
              "",
              "    private static func redactedApplicationDescription(_ object: Any) -> String {",
              "        redactKnownSecretValues(in: String(describing: redactApplicationSecrets(object)))",
              "    }",
              "",
              "    private static func redactApplicationSecrets(_ object: Any) -> Any {",
              "        if let dictionary = object as? [AnyHashable: Any] {",
              "            var sanitized: [String: Any] = [:]",
              "            for (key, value) in dictionary {",
              "                let keyString = String(describing: key)",
              "                let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }",
              "                let baseCustodyKey = redactKnownSecretValues(in: keyString)",
              "                var custodyKey = baseCustodyKey",
              "                var collisionIndex = 2",
              "                while sanitized[custodyKey] != nil {",
              "                    custodyKey = \"\\(baseCustodyKey)#\\(collisionIndex)\"",
              "                    collisionIndex += 1",
              "                }",
              "                if secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {",
              "                    sanitized[custodyKey] = \"<redacted>\"",
              "                } else {",
              "                    sanitized[custodyKey] = redactApplicationSecrets(value)",
              "                }",
              "            }",
              "            return sanitized",
              "        }",
              "        if let array = object as? [Any] {",
              "            return array.map(redactApplicationSecrets)",
              "        }",
              "        let description = String(describing: object)",
              "        let redactedDescription = redactKnownSecretValues(in: description)",
              "        return redactedDescription == description ? object : redactedDescription",
              "    }",
          ])
          if driver.count(old_sanitizer) != 1:
              raise SystemExit(f"expected exact unsafe recursive sanitizer once; found {driver.count(old_sanitizer)}")
          driver = driver.replace(old_sanitizer, new_sanitizer, 1)

          path.write_text(source[:class_start] + driver + source[class_end:])
          PY
          git diff --check

      - name: Verify exact secrecy contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          a = s.index("@MainActor\nprivate final class SmartLifeDriver")
          b = s.index("#endif\n\nprivate enum AppleAccountAuthorizationError", a)
          d = s[a:b]
          callback = d[d.index("    func device(_ device: ThingSmartDevice?, dpsUpdate"):d.index("    private static let secretKeyFragments")]
          sanitizer = d[d.index("    private static let secretKeyFragments"):]
          for token in (
              "NembraTuyaPrivateIdentity.appKey",
              "NembraTuyaPrivateIdentity.appSecret",
              "private static var exactSecretValues",
              "replacingOccurrences(of: secret, with: \"<redacted>\")",
              "Self.redactedApplicationDescription(value)",
          ):
              assert token in d, token
          assert "String(describing: Self.redactApplicationSecrets(value))" not in callback
          assert "redactKnownSecretValues(in: keyString)" in callback
          assert "redactKnownSecretValues(in: keyString)" in sanitizer
          assert "#if canImport(NembraTuyaPrivateConfig)" in sanitizer
          assert callback.count("while sanitized[custodyKey] != nil") == 1
          assert sanitizer.count("while sanitized[custodyKey] != nil") == 1
          for fragment in ("localkey","sessionkey","appkey","appsecret","password","accounttoken","accesstoken","refreshtoken","authkey","seckey"):
              assert f'"{fragment}"' in d, fragment
          PY

      - name: Commit repair and retire materializer
        run: |
          set -euo pipefail
          rm .github/workflows/capture-secret-value-fa22-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/capture-secret-value-fa22-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): bind private secrets to application-event custody"
          git push origin HEAD:agent/v14-capture-secret-value-fa22-sol
