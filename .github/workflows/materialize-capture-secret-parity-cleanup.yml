name: Materialize Capture Secret Parity Cleanup

on:
  push:
    branches:
      - sol/v14-capture-secret-parity-cleanup-870f20-20260810

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-secret-parity-cleanup-870f20-20260810
          fetch-depth: 0
      - name: Guard exact product parent
        run: |
          set -euo pipefail
          parent='870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --quiet "$parent" HEAD -- NembraApp/Features/Research/TuyaAccountBridge.swift
          git diff --quiet "$parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift
      - name: Apply parity cleanup
        run: python3 scripts/ci/materialize_capture_secret_parity_cleanup.py apply
      - name: Verify parity cleanup
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_secret_parity_cleanup.py verify
          python3 -m py_compile scripts/ci/materialize_capture_secret_parity_cleanup.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse NembraApp/Features/Research/TuyaAccountBridge.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift
          git diff --check
      - name: Publish clean three-path checkpoint
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-secret-parity-cleanup.yml
          rm scripts/ci/materialize_capture_secret_parity_cleanup.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): align metadata secret custody with export promise'
          git push origin HEAD:sol/v14-capture-secret-parity-cleanup-870f20-20260810
