name: TEMP Recover ES80 Acceptance Harness 1331

on:
  push:
    branches:
      - agent/es80-recover-acceptance-harness-1331-7be1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transplant exact reviewed test blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "7be1ff363e654e242abedd839317853a3a0bf0dd"

          git show 0273a2059a5f9d5e7782ef4a5f273b6b9ceb70ff:NembraAppTests/NembraAppTests.swift > NembraAppTests/NembraAppTests.swift
          git show 0273a2059a5f9d5e7782ef4a5f273b6b9ceb70ff:NembraUITests/ES80ResearchCaptureUITests.swift > NembraUITests/ES80ResearchCaptureUITests.swift

          python3 - <<'PY'
          from pathlib import Path
          app_tests = Path("NembraAppTests/NembraAppTests.swift").read_text(encoding="utf-8")
          ui_tests = Path("NembraUITests/ES80ResearchCaptureUITests.swift").read_text(encoding="utf-8")

          required_app = (
              "This timer is guidance only. Nembra verifies the required observation before accepting this check.",
              "finishing early cannot create a valid result",
              "Unavailable; waiting for the required observation period",
          )
          for marker in required_app:
              if marker not in app_tests:
                  raise SystemExit(f"missing reviewed timer contract: {marker}")

          if 'source.contains("guard let data = finalShareData")' not in ui_tests:
              raise SystemExit("retained Share source contract regressed")
          if ui_tests.count("XCUIDevice.shared.orientation = .portrait") < 9:
              raise SystemExit("reviewed portrait isolation set is incomplete")
          PY

          rm .github/workflows/temp-es80-recover-acceptance-harness-1331.yml
          git diff --check
          git diff --stat

      - name: Commit clean recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-go-applicator"
          git config user.email "nembra-go-applicator@users.noreply.github.com"
          git add NembraAppTests/NembraAppTests.swift NembraUITests/ES80ResearchCaptureUITests.swift .github/workflows/temp-es80-recover-acceptance-harness-1331.yml
          git commit -m "test(capture): isolate exact-head acceptance harness"
          git push origin HEAD:"$GITHUB_REF_NAME"
