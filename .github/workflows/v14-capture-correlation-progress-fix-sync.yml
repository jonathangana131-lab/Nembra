name: V14 Capture Correlation Progress Fix Sync

on:
  push:
    branches:
      - fix/v14-capture-correlation-progress-current-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-correlation-progress-current-sol
          fetch-depth: 0

      - name: Guard exact current product ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "5e96004ec565a5a19df8312f64985862a0443cdc"

      - name: Repair completed correlation presentation chronology
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          old_counter = '                    Text("\\(min(test.correlationCompletedWindowCount + 1, 4))/4")'
          new_counter = '                    Text("\\(correlationDisplayedWindowOrdinal)/4")'
          if text.count(old_counter) != 1:
              raise SystemExit(f"counter guard failed: found {text.count(old_counter)} matches")
          text = text.replace(old_counter, new_counter, 1)

          marker = '    private var correlationPanel: some View {\n'
          ordinal = '''    private var correlationDisplayedWindowOrdinal: Int {
              test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)
          }

          '''
          ordinal = "\n".join(line[4:] if line.startswith("    ") else line for line in ordinal.splitlines())
          if text.count(marker) != 1:
              raise SystemExit(f"panel insertion guard failed: found {text.count(marker)} matches")
          text = text.replace(marker, ordinal + marker, 1)
          path.write_text(text)

      - name: Verify source truth contract
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          surface = app[app.index('private struct SecureLinkView: View'):app.index('private struct SecureTransfer: Transferable')]
          assert 'Text("\\(min(test.correlationCompletedWindowCount + 1, 4))/4")' not in surface
          assert 'private var correlationDisplayedWindowOrdinal: Int {' in surface
          assert 'test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)' in surface
          assert 'Text("\\(correlationDisplayedWindowOrdinal)/4")' in surface
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift').read_text()
          assert 'completed OFF1 ON1 OFF2 ON2 correlation presents four of four' in test
          assert 'min(test.correlationCompletedWindowCount + 1, 4)' in test
          print('Capture correlation progress presentation source contract: PASS')
          PY

      - name: Commit clean repair
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-correlation-progress-fix-sync.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): show completed correlation as four of four"
          git push origin HEAD:fix/v14-capture-correlation-progress-current-sol
