name: Temporary Capture Auth Transport Repair

on:
  push:
    branches:
      - repair/v14-capture-auth-transport-field-gates-sol
    paths:
      - .github/workflows/tmp-capture-auth-transport-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-auth-transport-field-gates-sol
          fetch-depth: 0

      - name: Apply focused Capture security repair
        shell: bash
        env:
          EXPECTED_BASE: fcaf1b0f29f7b6e5a7e379cbe1b7df2b207caf13
          BRANCH: repair/v14-capture-auth-transport-field-gates-sol
        run: |
          set -euo pipefail
          trigger="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$trigger"
          test "$(git diff --name-only "$EXPECTED_BASE" "$trigger")" = '.github/workflows/tmp-capture-auth-transport-repair.yml'

          python3 - <<'PY'
          from pathlib import Path

          installer = Path('scripts/field/install_one_time_capture.command')
          text = installer.read_text()
          old = '/usr/bin/python3 -I - "$PRIVATE_DEVICE_RUNNER" "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" "$ROOT"'
          new = '/usr/bin/python3 -I -B - "$PRIVATE_DEVICE_RUNNER" "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" "$ROOT"'
          if text.count(old) != 1 or new in text:
              raise SystemExit('unexpected private-reader invocation')
          installer.write_text(text.replace(old, new, 1))

          bridge = Path('NembraApp/Features/Research/TuyaAccountBridge.swift')
          text = bridge.read_text()
          old = (
              '            let rawEndpoint = result["endpoint"] as? String ?? ""\n'
              '            let endpoint = rawEndpoint.hasPrefix("http") ? rawEndpoint : "https://\\(rawEndpoint)"\n'
              '            guard !access.isEmpty, !refresh.isEmpty, !uid.isEmpty, !endpoint.isEmpty else {\n'
              '                throw BridgeError.malformed("Tuya approval succeeded but the account session was incomplete.")\n'
              '            }\n'
          )
          new = (
              '            let rawEndpoint = result["endpoint"] as? String ?? ""\n'
              '            guard let endpoint = Self.secureTuyaEndpoint(rawEndpoint) else {\n'
              '                phase = .failed\n'
              '                statusMessage = "Tuya returned a connection endpoint Nembra could not safely use. Account credentials were not sent."\n'
              '                pollTask?.cancel()\n'
              '                pollTask = nil\n'
              '                manualApprovalTask?.cancel()\n'
              '                manualApprovalTask = nil\n'
              '                return\n'
              '            }\n'
              '            guard !access.isEmpty, !refresh.isEmpty, !uid.isEmpty else {\n'
              '                throw BridgeError.malformed("Tuya approval succeeded but the account session was incomplete.")\n'
              '            }\n'
          )
          if text.count(old) != 1:
              raise SystemExit('unexpected Tuya endpoint admission block')
          text = text.replace(old, new, 1)

          old = '        guard let url = components.url else { throw BridgeError.invalidURL }\n\n        var request = URLRequest(url: url)'
          new = (
              '        guard let url = components.url,\n'
              '              url.scheme?.lowercased() == "https",\n'
              '              let host = url.host,\n'
              '              !host.isEmpty else { throw BridgeError.invalidURL }\n\n'
              '        var request = URLRequest(url: url)'
          )
          if text.count(old) != 1:
              raise SystemExit('unexpected signed request URL guard')
          text = text.replace(old, new, 1)

          marker = '    private static func makeDevice(_ raw: [String: Any]) -> LinkedDevice {'
          helper = '''    private static func secureTuyaEndpoint(_ rawEndpoint: String) -> String? {
              let trimmed = rawEndpoint.trimmingCharacters(in: .whitespacesAndNewlines)
              guard !trimmed.isEmpty else { return nil }
          
              let candidate: String
              if let parsed = URLComponents(string: trimmed), parsed.scheme != nil {
                  candidate = trimmed
              } else {
                  candidate = "https://\\(trimmed)"
              }
          
              guard var components = URLComponents(string: candidate),
                    components.scheme?.lowercased() == "https",
                    let host = components.host,
                    !host.isEmpty,
                    components.user == nil,
                    components.password == nil,
                    components.query == nil,
                    components.fragment == nil,
                    components.path.isEmpty || components.path == "/" else {
                  return nil
              }
              components.scheme = "https"
              components.path = ""
              guard let url = components.url else { return nil }
              return url.absoluteString
          }
          
          '''.replace('\n          ', '\n')
          if text.count(marker) != 1 or 'private static func secureTuyaEndpoint' in text:
              raise SystemExit('unexpected secure endpoint helper insertion point')
          text = text.replace(marker, helper + marker, 1)
          bridge.write_text(text)
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedTransportSourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture authenticated Tuya transport custody")
          struct TuyaAuthenticatedTransportSourceTests {
              @Test("server endpoint cannot downgrade X-token transport to plaintext")
              func endpointRequiresHTTPSBeforeSessionPublication() throws {
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  #expect(!bridge.contains("rawEndpoint.hasPrefix(\"http\")"))
                  #expect(bridge.contains("guard let endpoint = Self.secureTuyaEndpoint(rawEndpoint)"))
                  #expect(bridge.contains("components.scheme?.lowercased() == \"https\""))
                  #expect(bridge.contains("let host = components.host"))
                  #expect(bridge.contains("components.user == nil"))
                  #expect(bridge.contains("components.password == nil"))
                  #expect(bridge.contains("components.query == nil"))
                  #expect(bridge.contains("components.fragment == nil"))
                  let admission = try #require(bridge.range(of: "guard let endpoint = Self.secureTuyaEndpoint(rawEndpoint)"))
                  let publication = try #require(bridge.range(of: "session = Session("))
                  #expect(admission.lowerBound < publication.lowerBound)
              }

              @Test("signed request and private reader stay fail-closed at execution seams")
              func signedRequestAndReaderSeamsAreGuarded() throws {
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")
                  let signedStart = try #require(bridge.range(of: "private func signedGET("))
                  let signed = String(bridge[signedStart.lowerBound...])
                  let secureGuard = try #require(signed.range(of: "url.scheme?.lowercased() == \"https\""))
                  let request = try #require(signed.range(of: "var request = URLRequest(url: url)"))
                  #expect(secureGuard.lowerBound < request.lowerBound)
                  #expect(installer.contains("/usr/bin/python3 -I -B - \"$PRIVATE_DEVICE_RUNNER\""))
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path
          bridge = Path('NembraApp/Features/Research/TuyaAccountBridge.swift').read_text()
          installer = Path('scripts/field/install_one_time_capture.command').read_text()
          assert 'rawEndpoint.hasPrefix("http")' not in bridge
          assert 'guard let endpoint = Self.secureTuyaEndpoint(rawEndpoint)' in bridge
          assert 'components.scheme?.lowercased() == "https"' in bridge
          assert 'components.user == nil' in bridge
          assert 'components.password == nil' in bridge
          assert 'components.query == nil' in bridge
          assert 'components.fragment == nil' in bridge
          signed = bridge[bridge.index('private func signedGET('):]
          assert signed.index('url.scheme?.lowercased() == "https"') < signed.index('var request = URLRequest(url: url)')
          assert '/usr/bin/python3 -I -B - "$PRIVATE_DEVICE_RUNNER"' in installer
          PY
          bash -n scripts/field/install_one_time_capture.command
          git diff --check

          rm .github/workflows/tmp-capture-auth-transport-repair.yml
          expected="$(cat <<'EOF' | sort
          NembraApp/Features/Research/TuyaAccountBridge.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedTransportSourceTests.swift
          scripts/field/install_one_time_capture.command
          EOF
          )"
          actual="$(git status --porcelain=v1 | sed -E 's/^...//' | sort)"
          test "$actual" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): fail closed on insecure auth transport'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$trigger"
          git push origin HEAD:"$BRANCH"