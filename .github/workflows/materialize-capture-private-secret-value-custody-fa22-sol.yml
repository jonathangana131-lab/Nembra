name: Materialize Capture Private Secret Value Custody FA22 Sol

on:
  push:
    branches:
      - "fix/v14-capture-private-secret-value-custody-fa22-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          expected="fa22b1666e423aa6b5f00d52c62a357881416a1a"
          test "$(git rev-parse HEAD^)" = "$expected"

      - name: Reapply validated two-path semantic donor
        shell: bash
        run: |
          set -euo pipefail
          parent="c38cb8f4c66ec1e1e8f6cdbe7fb77955daf18b5e"
          donor="dd8bd186197e2f885486d86ed44054454f68c1b3"
          git fetch --no-tags origin "$parent" "$donor"
          git diff --binary "$parent" "$donor" -- \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift \
            > /tmp/secret-value.patch
          test -s /tmp/secret-value.patch
          git apply --3way --index /tmp/secret-value.patch

      - name: Validate reanchored source invariants
        shell: bash
        run: |
          set -euo pipefail
          app="NembraApp/App/NembraCaptureEntrypoint.swift"
          test_file="Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift"
          swiftc -frontend -parse "$app"
          swiftc -frontend -parse "$test_file"
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")
          start = s.index("@MainActor\nprivate final class SmartLifeDriver")
          end = s.index("#endif\n\nprivate enum AppleAccountAuthorizationError", start)
          d = s[start:end]
          required = [
              "NembraTuyaPrivateIdentity.appKey",
              "NembraTuyaPrivateIdentity.appSecret",
              "private static var exactSecretValues: [String]",
              ".filter { !$0.isEmpty }",
              "if $0.count != $1.count { return $0.count > $1.count }",
              "options: [.literal]",
              "<redacted-private-application-secret>",
              "let exactSecretValues = Self.exactSecretValues",
              "uniqueCustodyKey",
              "while sanitized[custodyKey] != nil",
          ]
          missing = [x for x in required if x not in d]
          if missing:
              raise SystemExit(f"missing reanchored secret custody invariants: {missing}")
          if "sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))" in d:
              raise SystemExit("unsafe key-only secret projection remains")
          for fragment in ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey"]:
              if f'"{fragment}"' not in d:
                  raise SystemExit(f"lost credential key classifier: {fragment}")
          print("FA22 exact secret-value reanchor invariants: PASS")
          PY
          git diff --cached --check

      - name: Commit clean reanchored repair
        shell: bash
        run: |
          set -euo pipefail
          product="fa22b1666e423aa6b5f00d52c62a357881416a1a"
          rm .github/workflows/materialize-capture-private-secret-value-custody-fa22-sol.yml
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$product" | sort)
          expected=(
            "NembraApp/App/NembraCaptureEntrypoint.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}" || {
            printf 'Unexpected effective paths:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          }
          git config user.name "Nembra V14 Sol"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): bind exact private secret values before custody"
          git push origin HEAD:fix/v14-capture-private-secret-value-custody-fa22-sol
