name: Capture app truth one-shot repair
# One-shot execution marker; this workflow deletes itself before publishing the coherent repair.

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'GO apply canonical Capture app truth repairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/current-main-tuya-readonly-convergence-gpt56
          fetch-depth: 0

      - name: Repair Capture app truth
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin capture/current-main-tuya-readonly-convergence-gpt56
          git merge --ff-only origin/capture/current-main-tuya-readonly-convergence-gpt56
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = p.read_text()

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              s = s.replace(old, new, 1)

          one(
              'Waiting for a genuine application update and the canonical 45-second horizon…',
              'Waiting for repeated same-generation scooter data, including data that stays live beyond the startup rejection window, plus the canonical 45-second observation horizon…',
              'auth copy'
          )
          one(
              '    var preflightVerdict: TuyaAuthenticatedReadOnlyPreflight.Verdict {\n',
              '    var applicationEvidenceSurvivedHistoricalWindow: Bool {\n'
              '        guard let authenticatedAt = ledgerSnapshot.authenticatedAtUptimeNanoseconds,\n'
              '              let latestPayload = ledgerSnapshot.latestApplicationPayloadUptimeNanoseconds,\n'
              '              latestPayload >= authenticatedAt else { return false }\n'
              '        return latestPayload - authenticatedAt >= TuyaAuthenticatedReadOnlyPreflight.minimumPostAuthenticationPayloadSurvivalNanoseconds\n'
              '    }\n\n'
              '    var preflightVerdict: TuyaAuthenticatedReadOnlyPreflight.Verdict {\n',
              'application-survival presentation predicate'
          )
          one(
              'requirementRow("Scooter data received", ready: test.applicationUpdateCount > 0)',
              'requirementRow("Repeated scooter data", ready: test.applicationUpdateCount >= TuyaAuthenticatedReadOnlyPreflight.minimumAuthenticatedApplicationPayloadCount)\n'
              '                    requirementRow("Scooter data stayed live", ready: test.applicationEvidenceSurvivedHistoricalWindow)',
              'observation checklist'
          )

          receipt_anchor = '\n'.join([
              '        } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {',
              '            log("stale_application_update_ignored", ["generation": String(token.diagnosticGeneration)])'
          ])
          receipt_catch = '\n'.join([
              '        } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached {',
              '            await mirrorAlreadyTerminalIncompleteObservationHorizon(',
              '                token: token,',
              '                message: "Application receipt reached the 60-second incomplete-evidence horizon without earning canonical stationary-mapping readiness. Required repeated application evidence remained incomplete. The package already retired this exact generation without another liveness sample or a Bluetooth-disconnect claim. Relaunch Capture and start again from scooter OFF.",',
              '                kind: "application_authenticated_incomplete_readiness_horizon_reached"',
              '            )',
              '          '
          ])
          one(receipt_anchor, receipt_catch + receipt_anchor, 'application horizon catch')

          watchdog_anchor = '\n'.join([
              '                } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {',
              '                    self.log("stale_watchdog_generation_retired", ["generation": String(token.diagnosticGeneration)])'
          ])
          watchdog_catch = '\n'.join([
              '                } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached {',
              '                    await self.mirrorAlreadyTerminalIncompleteObservationHorizon(',
              '                        token: token,',
              '                        message: "Authenticated observation reached the 60-second incomplete-evidence horizon without earning canonical stationary-mapping readiness. Required repeated application evidence remained incomplete. The package already retired this exact generation without another liveness sample or a Bluetooth-disconnect claim. Relaunch Capture and start again from scooter OFF.",',
              '                        kind: "session_authenticated_incomplete_readiness_horizon_reached"',
              '                    )',
              '                    return',
              '          '
          ])
          one(watchdog_anchor, watchdog_catch + watchdog_anchor, 'watchdog horizon catch')

          helper_anchor = '\n'.join([
              '    private func invalidateObservationContinuity(',
              '        token: TuyaReadOnlyConnectionToken,'
          ])
          helper = '\n'.join([
              '    /// Mirrors the bounded incomplete-readiness terminal already committed atomically by the',
              '    /// package mutation that threw `incompleteObservationHorizonReached`. The package has already',
              '    /// revoked callback authority, so this helper performs app-local cleanup only and never issues',
              '    /// another ledger mutation, liveness receipt, transport-loss inference, or disconnect claim.',
              '    private func mirrorAlreadyTerminalIncompleteObservationHorizon(',
              '        token: TuyaReadOnlyConnectionToken,',
              '        message: String,',
              '        kind: String',
              '    ) async {',
              '        guard currentConnectionToken == token else { return }',
              '        watchdog?.cancel()',
              '        watchdog = nil',
              '        currentConnectionToken = nil',
              '        localBLESettlementToken = nil',
              '        // Clear current local-BLE proof only. In product copy/export semantics false means',
              '        // “Not proven”; this does not create an observed transport-loss receipt.',
              '        sdkLocalBLEOnline = false',
              '        driver = nil',
              '        await refreshLedgerSnapshot()',
              '        phase = .failed',
              '        self.message = message',
              '        log(kind, ["generation": String(token.diagnosticGeneration)])',
              '    }',
              '',
              ''
          ])
          one(helper_anchor, helper + helper_anchor, 'incomplete-horizon mirror helper')

          legacy_start = '\n                if self.applicationUpdateAdmissionsInFlight == 0,\n'
          legacy_end = '\n                try? await Task.sleep(for: .seconds(1))'
          if s.count(legacy_start) != 1:
              raise SystemExit(f'legacy timeout start count: {s.count(legacy_start)}')
          start = s.index(legacy_start)
          end = s.index(legacy_end, start)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY

          git fetch origin refs/pull/3246/head:refs/remotes/origin/capture-ui-3246
          git checkout refs/remotes/origin/capture-ui-3246 -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonAppIntegrationTests.swift
          git fetch origin refs/pull/3251/head:refs/remotes/origin/capture-semantic-3251
          git checkout refs/remotes/origin/capture-semantic-3251 -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaIncompleteObservationSemanticTerminalTests.swift

          python3 - <<'PY'
          from pathlib import Path

          p = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonAppIntegrationTests.swift')
          s = p.read_text()
          old = '\n'.join([
              '        let exposesApplicationSurvival =',
              '            panel.contains("TuyaAuthenticatedReadOnlyPreflight.minimumPostAuthenticationPayloadSurvivalNanoseconds")',
              '            && panel.contains("latestApplicationPayloadUptimeNanoseconds")',
              '            && panel.contains("authenticatedAtUptimeNanoseconds")',
              '        let derivesCanonicalVerdict = panel.contains("TuyaAuthenticatedReadOnlyPreflight.verdict")',
              '        #expect(exposesApplicationSurvival || derivesCanonicalVerdict)',
              ''
          ])
          new = '\n'.join([
              '        #expect(panel.contains("test.applicationEvidenceSurvivedHistoricalWindow"))',
              '        #expect(source.contains("var applicationEvidenceSurvivedHistoricalWindow: Bool"))',
              '        #expect(source.contains("TuyaAuthenticatedReadOnlyPreflight.minimumPostAuthenticationPayloadSurvivalNanoseconds"))',
              '        #expect(source.contains("latestApplicationPayloadUptimeNanoseconds"))',
              '        #expect(source.contains("authenticatedAtUptimeNanoseconds"))',
              ''
          ])
          if s.count(old) != 1:
              raise SystemExit(f'app-survival oracle anchor count: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          terminal = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedTerminalHorizonTests.swift')
          t = terminal.read_text()
          old_reason = 'Authenticated session produced no application update before the observation deadline.'
          new_reason = 'Authenticated session ended because required repeated application evidence did not become sufficient before the observation deadline.'
          if t.count(old_reason) != 2:
              raise SystemExit(f'terminal-horizon stale reason count: {t.count(old_reason)}')
          t = t.replace(old_reason, new_reason)
          t = t.replace('@Test("no-application deadline is terminal without inventing disconnect")', '@Test("incomplete-evidence deadline is terminal without inventing disconnect")')
          terminal.write_text(t)

          gate = Path('.github/workflows/capture-v16-standalone.yml')
          g = gate.read_text()
          anchor = '          swift test --filter TuyaAppIncompleteHorizonTerminalSourceTests\n'
          if g.count(anchor) != 1:
              raise SystemExit(f'standalone app-terminal filter anchor count: {g.count(anchor)}')
          addition = (
              anchor
              + '          swift test --filter TuyaAuthenticatedReadOnlyHorizonTestsAppIntegration\n'
              + '          swift test --filter TuyaAlreadyTerminalObservationContinuitySourceTests\n'
          )
          if 'swift test --filter TuyaAuthenticatedReadOnlyHorizonTestsAppIntegration' not in g:
              gate.write_text(g.replace(anchor, addition, 1))
          PY

          rm .github/workflows/capture-app-horizon-patch-go.yml
          git diff --check

      - name: Run focused truth contracts
        shell: bash
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --filter TuyaAuthenticatedReadOnlySessionLedgerTests
          swift test --filter TuyaAuthenticatedTerminalHorizonTests
          swift test --filter TuyaAuthenticatedReadOnlyHorizonTests
          swift test --filter TuyaAuthenticatedReadOnlyHorizonTestsAppIntegration
          swift test --filter TuyaAppIncompleteHorizonTerminalSourceTests
          swift test --filter TuyaAlreadyTerminalObservationContinuitySourceTests
          swift test --filter TuyaDeviceSharingAuthenticationAuthorityTests

      - name: Publish coherent canonical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Capture V16.1: mirror package horizon and expose full app truth'
          git push origin HEAD:capture/current-main-tuya-readonly-convergence-gpt56