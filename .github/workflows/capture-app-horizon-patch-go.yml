name: Capture app truth one-shot repair

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'GO apply canonical Capture app truth repairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/current-main-tuya-readonly-convergence-gpt56
          fetch-depth: 0

      - name: Repair Capture app truth
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin capture/current-main-tuya-readonly-convergence-gpt56
          git merge --ff-only origin/capture/current-main-tuya-readonly-convergence-gpt56
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = p.read_text()

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              s = s.replace(old, new, 1)

          one(
              'Waiting for a genuine application update and the canonical 45-second horizon…',
              'Waiting for repeated same-generation application evidence and the canonical 45-second observation horizon…',
              'auth copy'
          )
          one(
              'requirementRow("Scooter data received", ready: test.applicationUpdateCount > 0)',
              'requirementRow("Repeated scooter data", ready: test.applicationUpdateCount >= TuyaAuthenticatedReadOnlyPreflight.minimumAuthenticatedApplicationPayloadCount)',
              'observation checklist'
          )

          receipt_anchor = '''        } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {
            log("stale_application_update_ignored", ["generation": String(token.diagnosticGeneration)])'''
          receipt_catch = '''        } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached {
            await invalidateInternalLifecycle(
                token: token,
                message: "Application receipt reached the 60-second incomplete-evidence horizon without earning canonical stationary-mapping readiness. Required repeated application evidence remained incomplete. The exact generation was retired without another liveness sample or a Bluetooth-disconnect claim. Relaunch Capture and start again from scooter OFF.",
                kind: "application_authenticated_incomplete_readiness_horizon_reached"
            )
          '''
          one(receipt_anchor, receipt_catch + receipt_anchor, 'application horizon catch')

          watchdog_anchor = '''                } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {
                    self.log("stale_watchdog_generation_retired", ["generation": String(token.diagnosticGeneration)])'''
          watchdog_catch = '''                } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached {
                    await self.invalidateInternalLifecycle(
                        token: token,
                        message: "Authenticated observation reached the 60-second incomplete-evidence horizon without earning canonical stationary-mapping readiness. Required repeated application evidence remained incomplete. The exact generation was retired without another liveness sample or a Bluetooth-disconnect claim. Relaunch Capture and start again from scooter OFF.",
                        kind: "session_authenticated_incomplete_readiness_horizon_reached"
                    )
                    return
          '''
          one(watchdog_anchor, watchdog_catch + watchdog_anchor, 'watchdog horizon catch')
          p.write_text(s)
          PY

          git fetch origin refs/pull/3249/head:refs/remotes/origin/capture-prefix-3249
          git checkout refs/remotes/origin/capture-prefix-3249 -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonTests.swift
          git fetch origin refs/pull/3246/head:refs/remotes/origin/capture-ui-3246
          git checkout refs/remotes/origin/capture-ui-3246 -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonAppIntegrationTests.swift
          git fetch origin refs/pull/3250/head:refs/remotes/origin/capture-receipt-3250
          git checkout refs/remotes/origin/capture-receipt-3250 -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppIncompleteHorizonApplicationReceiptSourceTests.swift

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/capture-v16-standalone.yml')
          s = p.read_text()
          needle = '          swift test --filter TuyaAppIncompleteHorizonTerminalSourceTests\n'
          if s.count(needle) != 1:
              raise SystemExit(f'standalone oracle anchor count: {s.count(needle)}')
          s = s.replace(needle, needle + '          swift test --filter TuyaAppIncompleteHorizonApplicationReceiptSourceTests\n', 1)
          p.write_text(s)
          PY

          rm .github/workflows/capture-app-horizon-patch-go.yml
          git diff --check

      - name: Run focused truth contracts
        shell: bash
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --filter TuyaAuthenticatedReadOnlyHorizonTests
          swift test --filter TuyaAuthenticatedReadOnlyHorizonTestsAppIntegration
          swift test --filter TuyaAppIncompleteHorizonTerminalSourceTests
          swift test --filter TuyaAppIncompleteHorizonApplicationReceiptSourceTests
          swift test --filter TuyaDeviceSharingAuthenticationAuthorityTests

      - name: Publish coherent canonical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Capture V16.1: close incomplete-readiness app truth'
          git push origin HEAD:capture/current-main-tuya-readonly-convergence-gpt56
