name: Capture Experiment One recoverable admission repair

on:
  push:
    branches:
      - feature/capture-exp1-recoverable-admission-v14

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/capture-exp1-recoverable-admission-v14
          fetch-depth: 0
      - name: Apply guarded Experiment One repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          run_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift')
          run = run_path.read_text()
          if 'import Dispatch\n' not in run:
              run = run.replace('import Foundation\n', 'import Dispatch\nimport Foundation\n', 1)

          old = '''    private let payload: Payload\n    private var hasBeenConsumed = false\n\n    fileprivate init(\n'''
          new = '''    /// Read-only package-owned staging view used by the foreground controller before\n    /// it burns the one-shot admission. It exposes only the exact producer identity,\n    /// correlated full CoreBluetooth UUID, and local monotonic issuance boundary needed\n    /// to prove that recoverable current-catalog checks refer to this same admission.\n    /// It carries no recorder and cannot be constructed outside this producer file.\n    struct StagingPreview: Equatable, Sendable {\n        let admissionIdentity: UUID\n        let peripheralIdentifier: UUID\n        let issuedAtUptimeNanoseconds: UInt64\n\n        fileprivate init(payload: Payload) {\n            admissionIdentity = payload.admissionIdentity\n            peripheralIdentifier = payload.peripheralIdentifier\n            issuedAtUptimeNanoseconds = payload.issuedAtUptimeNanoseconds\n        }\n    }\n\n    private let payload: Payload\n    private var hasBeenConsumed = false\n\n    fileprivate init(\n'''
          assert old in run
          run = run.replace(old, new, 1)

          old = '''    func consume() throws -> Payload {\n        guard !hasBeenConsumed else {\n            throw ConsumptionError.alreadyConsumed\n        }\n        hasBeenConsumed = true\n        return payload\n    }\n'''
          new = '''    /// Allows the package controller to perform only recoverable staging checks before\n    /// the irreversible ownership handoff. Aliases of an already-consumed admission\n    /// cannot obtain a fresh preview.\n    func previewForControllerStaging() throws -> StagingPreview {\n        guard !hasBeenConsumed else {\n            throw ConsumptionError.alreadyConsumed\n        }\n        return StagingPreview(payload: payload)\n    }\n\n    func consume() throws -> Payload {\n        guard !hasBeenConsumed else {\n            throw ConsumptionError.alreadyConsumed\n        }\n        hasBeenConsumed = true\n        return payload\n    }\n'''
          assert old in run
          run = run.replace(old, new, 1)
          run_path.write_text(run)

          controller_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift')
          controller = controller_path.read_text()
          old = '''        let payload = try admission.consume()\n        guard case let .singleRepeatableCandidate(correlatedIdentifier) =\n                payload.powerCycleEvidence.result.correlation.disposition,\n              correlatedIdentifier == payload.peripheralIdentifier else {\n            throw ControllerError.targetSessionChanged\n        }\n        guard let peripheral = peripheralByIdentifier[payload.peripheralIdentifier],\n              let discovery = latestDiscoveryByIdentifier[payload.peripheralIdentifier] else {\n            throw ControllerError.unknownPeripheral(payload.peripheralIdentifier)\n        }\n        if discovery.isConnectable == false {\n            throw ControllerError.peripheralNotConnectable(payload.peripheralIdentifier)\n        }\n\n        do {\n            try targetState.validateCanBeginAttempt(for: payload.peripheralIdentifier)\n        } catch PassiveCoreBluetoothTargetState.StateError.peripheralAwaitingTerminalCallback(let identifier) {\n            throw ControllerError.peripheralAwaitingTerminalCallback(identifier)\n        } catch PassiveCoreBluetoothTargetState.StateError.generationExhausted {\n            throw ControllerError.attemptGenerationExhausted\n        } catch {\n            throw ControllerError.targetNotSelected\n        }\n\n        guard let latestAdvertisement = latestAdvertisementByIdentifier[payload.peripheralIdentifier],\n              latestAdvertisement.receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds else {\n            // The sealed admission must be joined to a controller observation received after\n            // that handoff. Replaying an older cached advertisement would splice two software\n            // chronology lives and could enqueue evidence that predates this recorder.\n            throw ControllerError.unknownPeripheral(payload.peripheralIdentifier)\n        }\n'''
          new = '''        let preview = try admission.previewForControllerStaging()\n        guard let peripheral = peripheralByIdentifier[preview.peripheralIdentifier],\n              let discovery = latestDiscoveryByIdentifier[preview.peripheralIdentifier] else {\n            throw ControllerError.unknownPeripheral(preview.peripheralIdentifier)\n        }\n        if discovery.isConnectable == false {\n            throw ControllerError.peripheralNotConnectable(preview.peripheralIdentifier)\n        }\n\n        do {\n            try targetState.validateCanBeginAttempt(for: preview.peripheralIdentifier)\n        } catch PassiveCoreBluetoothTargetState.StateError.peripheralAwaitingTerminalCallback(let identifier) {\n            throw ControllerError.peripheralAwaitingTerminalCallback(identifier)\n        } catch PassiveCoreBluetoothTargetState.StateError.generationExhausted {\n            throw ControllerError.attemptGenerationExhausted\n        } catch {\n            throw ControllerError.targetNotSelected\n        }\n\n        guard let latestAdvertisement = latestAdvertisementByIdentifier[preview.peripheralIdentifier],\n              latestAdvertisement.receivedAtUptimeNanoseconds > preview.issuedAtUptimeNanoseconds else {\n            // Missing/not-yet-fresh target evidence is recoverable: keep scanning and retry\n            // this same sealed admission. Equality also fails closed because two monotonic\n            // reads sharing one clock tick do not prove callback receipt happened afterward.\n            throw ControllerError.unknownPeripheral(preview.peripheralIdentifier)\n        }\n\n        let payload = try admission.consume()\n        guard payload.admissionIdentity == preview.admissionIdentity,\n              payload.peripheralIdentifier == preview.peripheralIdentifier,\n              payload.issuedAtUptimeNanoseconds == preview.issuedAtUptimeNanoseconds,\n              case let .singleRepeatableCandidate(correlatedIdentifier) =\n                payload.powerCycleEvidence.result.correlation.disposition,\n              correlatedIdentifier == preview.peripheralIdentifier else {\n            throw ControllerError.targetSessionChanged\n        }\n'''
          assert old in controller
          controller = controller.replace(old, new, 1)
          controller_path.write_text(controller)

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneRecoverableRediscoveryTests.swift')
          test_path.write_text('''import Foundation\nimport Testing\n\n@Suite("Experiment One recoverable rediscovery admission")\nstruct ForegroundCoreBluetoothCaptureControllerExperimentOneRecoverableRediscoveryTests {\n    private static func source(named filename: String) throws -> String {\n        let testFile = URL(fileURLWithPath: #filePath)\n        let packageRoot = testFile.deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent()\n        return try String(contentsOf: packageRoot.appendingPathComponent("Sources").appendingPathComponent("NembraBluetoothCapture").appendingPathComponent(filename), encoding: .utf8)\n    }\n\n    private static func controllerMethodSource() throws -> String {\n        let source = try source(named: "ForegroundCoreBluetoothCaptureController.swift")\n        let start = try #require(source.range(of: "func connectUsingExperimentOneAdmission("))\n        let end = try #require(source.range(of: "public func cancelActiveConnection()", range: start.lowerBound..<source.endIndex))\n        return String(source[start.lowerBound..<end.lowerBound])\n    }\n\n    private static func codeOnly(_ source: String) -> String {\n        source.split(separator: "\\n", omittingEmptySubsequences: false).map { line in\n            guard let comment = line.range(of: "//") else { return String(line) }\n            return String(line[..<comment.lowerBound])\n        }.joined(separator: "\\n")\n    }\n\n    @Test("recoverable target staging completes before the sealed one-shot admission is consumed")\n    func rediscoveryMissDoesNotBurnExperimentOneAdmission() throws {\n        let method = Self.codeOnly(try Self.controllerMethodSource())\n        let preview = try #require(method.range(of: "admission.previewForControllerStaging()"))\n        let catalog = try #require(method.range(of: "peripheralByIdentifier[preview.peripheralIdentifier]"))\n        let discovery = try #require(method.range(of: "latestDiscoveryByIdentifier[preview.peripheralIdentifier]"))\n        let attempt = try #require(method.range(of: "targetState.validateCanBeginAttempt(for: preview.peripheralIdentifier)"))\n        let advertisement = try #require(method.range(of: "latestAdvertisementByIdentifier[preview.peripheralIdentifier]"))\n        let freshness = try #require(method.range(of: "receivedAtUptimeNanoseconds > preview.issuedAtUptimeNanoseconds"))\n        let consume = try #require(method.range(of: "admission.consume()"))\n        let publication = try #require(method.range(of: "recorder = payload.recorder"))\n\n        #expect(preview.lowerBound < catalog.lowerBound)\n        #expect(catalog.lowerBound < consume.lowerBound)\n        #expect(discovery.lowerBound < consume.lowerBound)\n        #expect(attempt.lowerBound < consume.lowerBound)\n        #expect(advertisement.lowerBound < consume.lowerBound)\n        #expect(freshness.lowerBound < consume.lowerBound)\n        #expect(consume.lowerBound < publication.lowerBound)\n    }\n\n    @Test("consumed payload must match the producer-owned staging preview")\n    func consumedPayloadMatchesPreviewBeforePublication() throws {\n        let method = Self.codeOnly(try Self.controllerMethodSource())\n        let consume = try #require(method.range(of: "let payload = try admission.consume()"))\n        let identity = try #require(method.range(of: "payload.admissionIdentity == preview.admissionIdentity"))\n        let target = try #require(method.range(of: "payload.peripheralIdentifier == preview.peripheralIdentifier"))\n        let clock = try #require(method.range(of: "payload.issuedAtUptimeNanoseconds == preview.issuedAtUptimeNanoseconds"))\n        let publication = try #require(method.range(of: "recorder = payload.recorder"))\n        #expect(consume.lowerBound < identity.lowerBound)\n        #expect(identity.lowerBound < publication.lowerBound)\n        #expect(target.lowerBound < publication.lowerBound)\n        #expect(clock.lowerBound < publication.lowerBound)\n    }\n\n    @Test("staging preview stays package-internal and producer-constructed")\n    func previewAuthoritySurfaceIsSealed() throws {\n        let source = try Self.source(named: "PassiveBluetoothExperimentOneRun.swift")\n        #expect(source.contains("struct StagingPreview: Equatable, Sendable"))\n        #expect(source.contains("fileprivate init(payload: Payload)"))\n        #expect(source.contains("func previewForControllerStaging() throws -> StagingPreview"))\n        #expect(!source.contains("public struct StagingPreview"))\n        #expect(!source.contains("public func previewForControllerStaging"))\n    }\n}\n''')
          PY
          git diff --check
          rm .github/workflows/capture-exp1-recoverable-admission-v14.yml
          git status --short
      - name: Commit durable product repair
        shell: bash
        run: |
          git config user.name "nembra-go-worker"
          git config user.email "nembra-go-worker@users.noreply.github.com"
          git add -A
          git commit -m "[Capture Experiment One] Preserve admission across rediscovery"
          git push origin HEAD:feature/capture-exp1-recoverable-admission-v14
