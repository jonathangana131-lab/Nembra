name: Capture R4 Current Parent Repair Materializer

on:
  push:
    branches:
      - repair/v14-r4-private-review-current-parent-exec-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-r4-private-review-current-parent-exec-sol-20260811
          fetch-depth: 0
      - name: Re-anchor R4 and close parent execution custody
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin control/v14-auth-stationary-private-review-r4-sol:refs/remotes/origin/r4-source
          git fetch --no-tags origin adversarial/v14-private-review-parent-module-exec-sol:refs/remotes/origin/r4-red
          git show refs/remotes/origin/r4-source:scripts/ci/es80_authenticated_stationary_private_review_final_go.py > scripts/ci/es80_authenticated_stationary_private_review_final_go.py
          git show refs/remotes/origin/r4-source:scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py > scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py
          git show refs/remotes/origin/r4-source:.github/workflows/capture-authenticated-stationary-private-review-final-go.yml > .github/workflows/capture-authenticated-stationary-private-review-final-go.yml
          git show refs/remotes/origin/r4-red:scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py > scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py
          python3 - <<'PY'
          import base64
          from pathlib import Path

          source = Path('scripts/ci/es80_authenticated_stationary_private_review_final_go.py')
          text = source.read_text(encoding='utf-8')
          if text.count('import importlib.util\n') != 1:
              raise SystemExit('R4 import anchor drifted')
          text = text.replace('import importlib.util\n', 'import subprocess\nimport types\n', 1)
          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'R4 mutable parent loader count drifted: {text.count(old)}')
          text = text.replace(old, new, 1)
          authority_anchor = '    "scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py",\n)'
          authority_replacement = '    "scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py",\n    "scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py",\n)'
          if text.count(authority_anchor) != 1:
              raise SystemExit('R4 authority path anchor drifted')
          source.write_text(text.replace(authority_anchor, authority_replacement, 1), encoding='utf-8')

          workflow = Path('.github/workflows/capture-authenticated-stationary-private-review-final-go.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace('control/v14-auth-stationary-private-review-r4-sol', 'repair/v14-r4-private-review-current-parent-exec-sol-20260811')
          test_path = '      - scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py\n'
          if text.count(test_path) != 2:
              raise SystemExit(f'R4 workflow test path anchor drifted: {text.count(test_path)}')
          text = text.replace(test_path, test_path + '      - scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py\n')
          compile_anchor = '            scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py\n'
          if text.count(compile_anchor) != 1:
              raise SystemExit('R4 workflow compile anchor drifted')
          text = text.replace(compile_anchor, '            scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \\\n            scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py\n', 1)
          run_anchor = '          python3 scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py\n'
          if text.count(run_anchor) != 1:
              raise SystemExit('R4 workflow run anchor drifted')
          text = text.replace(run_anchor, run_anchor + '          python3 scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py\n', 1)
          workflow.write_text(text, encoding='utf-8')
          PY
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py
          python3 scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py \
            .github/workflows/capture-authenticated-stationary-private-review-final-go.yml
          git commit -m 'Capture: re-anchor R4 and pin generated parent execution'
          git push origin HEAD:repair/v14-r4-private-review-current-parent-exec-sol-20260811
