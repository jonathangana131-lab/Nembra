name: ES80 Experiment One Capture Evidence QA

on:
  push:
    branches:
      - parallel/es80-experiment-one-readiness/chat-b3m8p

permissions:
  contents: read

jobs:
  capture-package:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Verify immutable pushed head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          printf 'Expected exact head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"

      - name: Test Bluetooth capture package with warnings as errors
        working-directory: Packages/NembraBluetoothCapture
        run: swift test -Xswiftc -warnings-as-errors

      - name: Guard experiment-one slice against characteristic writes
        run: |
          if grep -R -n -E 'writeValue[[:space:]]*\(' \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCaptureEvidenceAssessment.swift; then
            echo 'Experiment-one capture evidence slice must remain read-only.' >&2
            exit 1
          fi
