name: Capture Symlink Lifetime Materialize Once

on:
  push:
    branches:
      - repair/v17-capture-read-lease-symlink-lifetime-sol-20260815
    paths:
      - .github/workflows/capture-symlink-lifetime-materialize-once.yml

permissions:
  contents: write

concurrency:
  group: capture-symlink-lifetime-materialize-${{ github.ref }}
  cancel-in-progress: false

env:
  EXACT_PARENT: 16e6ccf5d9736a8c47d4e78eaba86f1cffd02e9c
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind one-shot authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = ".github/workflows/capture-symlink-lifetime-materialize-once.yml"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize lifetime-bound namespace custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          helper_path = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          helper = helper_path.read_text(encoding="utf-8")

          validator_start = helper.index("def _validate_subject_symlinks_from_descriptor(\n")
          validator_end = helper.index("\n\ndef _lease_paths(\n", validator_start)
          old_validator = helper[validator_start:validator_end]
          new_validator = textwrap.dedent(r'''
          def _directory_namespace_generation(
              descriptor: int,
          ) -> tuple[int, int, int, int, int]:
              """Return an unforgeable-by-normal-owner generation witness for one held directory."""
              metadata = os.fstat(descriptor)
              if not stat.S_ISDIR(metadata.st_mode):
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease namespace witness targeted a non-directory"
                  )
              ctime_ns = int(
                  getattr(metadata, "st_ctime_ns", int(metadata.st_ctime * 1_000_000_000))
              )
              mtime_ns = int(
                  getattr(metadata, "st_mtime_ns", int(metadata.st_mtime * 1_000_000_000))
              )
              return (
                  metadata.st_dev,
                  metadata.st_ino,
                  stat.S_IFMT(metadata.st_mode),
                  ctime_ns,
                  mtime_ns,
              )


          def _verify_namespace_generation_witnesses(
              witnesses: Sequence[tuple[Path, int, tuple[int, int, int, int, int]]],
          ) -> None:
              for path, descriptor, expected in witnesses:
                  actual = _directory_namespace_generation(descriptor)
                  if actual != expected:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease namespace generation changed: {path}"
                      )


          def _validate_subject_symlinks_from_descriptor(
              subject: Path,
              subject_descriptor: int,
          ) -> dict[tuple[str, ...], tuple[int, int, int, int, int]]:
              """Classify symlinks and return stable generations for every held directory scanned."""
              root_metadata = os.fstat(subject_descriptor)
              if stat.S_ISREG(root_metadata.st_mode):
                  return {}
              if not stat.S_ISDIR(root_metadata.st_mode):
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease held subject has unsupported type"
                  )
              if os.stat not in os.supports_dir_fd or os.readlink not in os.supports_dir_fd:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease held symlink policy requires descriptor-relative stat/readlink"
                  )

              generations: dict[tuple[str, ...], tuple[int, int, int, int, int]] = {}

              def walk(directory_descriptor: int, relative_parts: tuple[str, ...]) -> None:
                  before_generation = _directory_namespace_generation(directory_descriptor)
                  try:
                      names = sorted(os.listdir(directory_descriptor))
                  except (OSError, TypeError) as error:
                      raise SelectedXcodeBuildOrchestratorError(
                          "private read-lease held directory could not be enumerated"
                      ) from error
                  for name in names:
                      if name in ("", ".", "..") or "/" in name or "\x00" in name:
                          raise SelectedXcodeBuildOrchestratorError(
                              "private read-lease held directory exposed an unsafe entry name"
                          )
                      try:
                          metadata = os.stat(
                              name,
                              dir_fd=directory_descriptor,
                              follow_symlinks=False,
                          )
                      except OSError as error:
                          raise SelectedXcodeBuildOrchestratorError(
                              "private read-lease held entry changed during symlink validation"
                          ) from error
                      entry_parts = (*relative_parts, name)
                      if stat.S_ISLNK(metadata.st_mode):
                          try:
                              target_text = os.readlink(name, dir_fd=directory_descriptor)
                          except OSError as error:
                              raise SelectedXcodeBuildOrchestratorError(
                                  "private read-lease held symlink changed during validation"
                              ) from error
                          target_parts = _normalize_held_symlink_target(
                              subject,
                              entry_parts,
                              target_text,
                          )
                          _validate_held_symlink_target(
                              subject,
                              subject_descriptor,
                              target_parts,
                          )
                          continue
                      if stat.S_ISREG(metadata.st_mode):
                          continue
                      if not stat.S_ISDIR(metadata.st_mode):
                          raise SelectedXcodeBuildOrchestratorError(
                              "private read-lease held entry has unsupported type"
                          )
                      child = _open_pinned_child(
                          directory_descriptor,
                          name,
                          True,
                          _metadata_signature(metadata),
                      )
                      try:
                          walk(child, entry_parts)
                      finally:
                          os.close(child)

                  after_generation = _directory_namespace_generation(directory_descriptor)
                  if after_generation != before_generation:
                      raise SelectedXcodeBuildOrchestratorError(
                          "private read-lease held directory changed during symlink validation"
                      )
                  generations[relative_parts] = after_generation

              walk(subject_descriptor, ())
              return generations


          def _validated_namespace_witnesses(
              subjects: Sequence[Path],
              plan: Sequence[tuple[Path, bool, tuple[int, int, int], int]],
          ) -> tuple[tuple[Path, int, tuple[int, int, int, int, int]], ...]:
              """Validate current symlink policy and bind it to held directory generations."""
              by_path = {Path(entry[0]): entry for entry in plan}
              expectations: dict[Path, tuple[int, int, int, int, int]] = {}
              for raw_subject in subjects:
                  subject = _absolute_lexical(Path(raw_subject))
                  held_subject = by_path.get(subject)
                  if held_subject is None:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease held subject descriptor is unavailable: {subject}"
                      )
                  signature = held_subject[2]
                  if stat.S_ISREG(signature[2]):
                      continue
                  if not stat.S_ISDIR(signature[2]):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease held subject has unsupported type: {subject}"
                      )
                  generations = _validate_subject_symlinks_from_descriptor(
                      subject,
                      int(held_subject[3]),
                  )
                  if not isinstance(generations, dict):
                      raise SelectedXcodeBuildOrchestratorError(
                          "private read-lease symlink validator returned malformed generation evidence"
                      )
                  for relative_parts, generation in generations.items():
                      if not isinstance(relative_parts, tuple) or any(
                          not isinstance(part, str)
                          or part in ("", ".", "..")
                          or os.sep in part
                          for part in relative_parts
                      ):
                          raise SelectedXcodeBuildOrchestratorError(
                              "private read-lease namespace witness has an unsafe relative path"
                          )
                      path = subject.joinpath(*relative_parts)
                      held_entry = by_path.get(path)
                      if held_entry is None or not stat.S_ISDIR(held_entry[2][2]):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease namespace witness has no held directory: {path}"
                          )
                      previous = expectations.get(path)
                      if previous is not None and previous != generation:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease overlapping namespace witnesses disagree: {path}"
                          )
                      expectations[path] = generation

              witnesses = tuple(
                  (
                      path,
                      int(by_path[path][3]),
                      generation,
                  )
                  for path, generation in sorted(
                      expectations.items(), key=lambda item: str(item[0])
                  )
              )
              _verify_namespace_generation_witnesses(witnesses)
              return witnesses
          ''').lstrip("\n")
          helper = helper[:validator_start] + new_validator + helper[validator_end:]

          helper = replace_once(
              helper,
              "    include_signatures: bool = False,\n    include_descriptors: bool = False,\n) -> tuple:\n",
              "    include_signatures: bool = False,\n    include_descriptors: bool = False,\n    namespace_witnesses_out: list[tuple] | None = None,\n) -> tuple:\n",
              "lease-path witness output signature",
          )
          helper = replace_once(
              helper,
              "    if include_signatures and include_descriptors:\n        raise SelectedXcodeBuildOrchestratorError(\n            \"private read-lease plan cannot request signatures and descriptors together\"\n        )\n\n",
              "    if include_signatures and include_descriptors:\n        raise SelectedXcodeBuildOrchestratorError(\n            \"private read-lease plan cannot request signatures and descriptors together\"\n        )\n    if namespace_witnesses_out is not None and not include_descriptors:\n        raise SelectedXcodeBuildOrchestratorError(\n            \"private read-lease namespace witnesses require descriptor mode\"\n        )\n\n",
              "witness output mode guard",
          )
          helper = replace_once(
              helper,
              "        if include_descriptors:\n            _verify_descriptor_plan(tuple(ordered))\n        return tuple(ordered)\n",
              "        if include_descriptors:\n            plan = tuple(ordered)\n            _verify_descriptor_plan(plan)\n            namespace_witnesses = _validated_namespace_witnesses(subjects, plan)\n            _verify_descriptor_plan(plan)\n            if namespace_witnesses_out is not None:\n                namespace_witnesses_out.clear()\n                namespace_witnesses_out.extend(namespace_witnesses)\n        return tuple(ordered)\n",
              "final namespace admission",
          )

          helper = replace_once(
              helper,
              "        self._opened: list[dict[str, object]] = []\n        self._principal = \"\"\n",
              "        self._opened: list[dict[str, object]] = []\n        self._namespace_witnesses: list[tuple] = []\n        self._principal = \"\"\n",
              "lease namespace state",
          )
          helper = replace_once(
              helper,
              "        if self._opened or self._principal:\n            raise SelectedXcodeBuildOrchestratorError(\"private read lease is already active\")\n",
              "        if self._opened or self._principal or self._namespace_witnesses:\n            raise SelectedXcodeBuildOrchestratorError(\"private read lease is already active\")\n",
              "active lease witness guard",
          )
          helper = replace_once(
              helper,
              "        self._principal = principal\n        try:\n            pinned_plan = _lease_paths(\n                self._subjects,\n                self._repository,\n                include_descriptors=True,\n            )\n",
              "        self._principal = principal\n        try:\n            admission_namespace_witnesses: list[tuple] = []\n            pinned_plan = _lease_paths(\n                self._subjects,\n                self._repository,\n                include_descriptors=True,\n                namespace_witnesses_out=admission_namespace_witnesses,\n            )\n            _verify_namespace_generation_witnesses(admission_namespace_witnesses)\n",
              "grant admission witness",
          )
          helper = replace_once(
              helper,
              "                diagnostic = _open_pinned_path(\n                    path, is_directory, accepted_signature\n                )\n                os.close(diagnostic)\n        except Exception as error:\n",
              "                diagnostic = _open_pinned_path(\n                    path, is_directory, accepted_signature\n                )\n                os.close(diagnostic)\n\n            # ACL metadata changes can legitimately advance directory ctime. Revalidate\n            # the exact held namespace after all grants, then use that post-ACL stable\n            # generation as the build-window baseline. Any later symlink retarget, even\n            # one restored before revoke, changes the parent directory generation.\n            self._namespace_witnesses = list(\n                _validated_namespace_witnesses(self._subjects, pinned_plan)\n            )\n        except Exception as error:\n",
              "post-ACL namespace baseline",
          )
          helper = replace_once(
              helper,
              "    def revoke(self, *, suppress_errors: bool = False) -> None:\n        failures: list[str] = []\n        for record in reversed(self._opened):\n",
              "    def revoke(self, *, suppress_errors: bool = False) -> None:\n        failures: list[str] = []\n        if self._namespace_witnesses:\n            try:\n                _verify_namespace_generation_witnesses(self._namespace_witnesses)\n            except Exception as error:\n                # Cleanup must still remove every ACL from its held descriptor. The\n                # namespace failure is surfaced only after exact rollback completes.\n                failures.append(\n                    f\"private read-lease namespace changed during guarded build: {error}\"\n                )\n        for record in reversed(self._opened):\n",
              "revoke lifetime verification",
          )
          helper = replace_once(
              helper,
              "        self._opened.clear()\n        self._principal = \"\"\n",
              "        self._opened.clear()\n        self._namespace_witnesses.clear()\n        self._principal = \"\"\n",
              "lease witness cleanup",
          )
          helper = helper.replace(
              "if lease._opened or lease._principal:",
              "if lease._opened or lease._principal or lease._namespace_witnesses:",
          )
          compile(helper, str(helper_path), "exec", dont_inherit=True)
          helper_path.write_text(helper, encoding="utf-8")

          test_path = Path("scripts/ci/tests/test_capture_private_read_lease_component_walk.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              "import tempfile\nimport unittest\n",
              "import tempfile\nimport time\nimport unittest\n",
              "test time import",
          )
          insertion_anchor = "    def test_held_descriptor_prevents_inode_reuse_after_admission(self) -> None:\n"
          if tests.count(insertion_anchor) != 1:
              raise SystemExit("lifetime regression insertion anchor is not unique")
          regression = textwrap.dedent(r'''
              def test_post_validation_retarget_is_rejected_before_acl_mutation(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-post-validate-retarget-") as raw:
                      outer = Path(raw)
                      repo = outer / "repo"
                      subject = repo / "LocalSecrets/TuyaSDK/Build"
                      inside = subject / "inside"
                      inside.mkdir(parents=True)
                      (inside / "inside.fixture").write_text("inside\n", encoding="utf-8")
                      external = outer / "outside-subject"
                      external.mkdir()
                      (external / "outside.fixture").write_text("outside\n", encoding="utf-8")
                      link = subject / "escape"
                      link.symlink_to("inside", target_is_directory=True)

                      real_validator = helper._validate_subject_symlinks_from_descriptor
                      retargeted = False

                      def validate_safe_then_retarget(admitted_subject: Path, descriptor: int):
                          nonlocal retargeted
                          generations = real_validator(admitted_subject, descriptor)
                          if not retargeted:
                              link.unlink()
                              link.symlink_to(external, target_is_directory=True)
                              retargeted = True
                          return generations

                      def unexpected_acl(_descriptor: int) -> str:
                          raise AssertionError("post-validation retarget reached ACL inspection")

                      lease = helper._PrivateReadLease((subject,), repo)
                      with (
                          mock.patch.object(
                              helper,
                              "_validate_subject_symlinks_from_descriptor",
                              side_effect=validate_safe_then_retarget,
                          ),
                          mock.patch.object(helper, "_acl_listing", side_effect=unexpected_acl),
                      ):
                          with self.assertRaisesRegex(
                              helper.SelectedXcodeBuildOrchestratorError,
                              "namespace generation changed|symlink escaped|symlink target",
                          ):
                              lease.grant("nembrapostvalidate")
                      self.assertTrue(retargeted)
                      self.assertFalse(lease._opened)
                      self.assertFalse(lease._namespace_witnesses)
                      self.assertEqual(lease._principal, "")

              def test_build_window_symlink_retarget_restore_invalidates_after_cleanup(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-build-window-retarget-") as raw:
                      outer = Path(raw)
                      repo = outer / "repo"
                      subject = repo / "LocalSecrets/TuyaSDK/Build"
                      inside = subject / "inside"
                      inside.mkdir(parents=True)
                      (inside / "inside.fixture").write_text("inside\n", encoding="utf-8")
                      external = outer / "outside-subject"
                      external.mkdir()
                      link = subject / "escape"
                      link.symlink_to("inside", target_is_directory=True)

                      acl_state: dict[int, str] = {}

                      def fake_acl_listing(descriptor: int) -> str:
                          return acl_state.get(descriptor, "")

                      def fake_chmod_acl(descriptor: int, operation: str, acl: str) -> None:
                          if operation == "+a":
                              acl_state[descriptor] = f"0: {acl}"
                          elif operation == "-a":
                              acl_state[descriptor] = ""
                          else:
                              raise AssertionError(f"unexpected ACL operation: {operation}")

                      lease = helper._PrivateReadLease((subject,), repo)
                      with (
                          mock.patch.object(helper, "_acl_listing", side_effect=fake_acl_listing),
                          mock.patch.object(helper, "_chmod_acl", side_effect=fake_chmod_acl),
                      ):
                          lease.grant("nembralifetime")
                          self.assertTrue(lease._opened)
                          self.assertTrue(lease._namespace_witnesses)

                          # Retarget and restore the exact pathname before revoke. A
                          # final pathname reread would see the safe text again; the
                          # held parent-directory generation must still remember it.
                          time.sleep(0.01)
                          link.unlink()
                          link.symlink_to(external, target_is_directory=True)
                          link.unlink()
                          link.symlink_to("inside", target_is_directory=True)

                          with self.assertRaisesRegex(
                              helper.SelectedXcodeBuildOrchestratorError,
                              "namespace changed during guarded build",
                          ):
                              lease.revoke()

                      self.assertTrue(all(value == "" for value in acl_state.values()))
                      self.assertFalse(lease._opened)
                      self.assertFalse(lease._namespace_witnesses)
                      self.assertEqual(lease._principal, "")
                      self.assertEqual(link.readlink(), Path("inside"))

          ''').replace("\n  def ", "\n    def ")
          # textwrap produces class-peer methods at column zero; indent the whole block.
          regression = textwrap.indent(regression.lstrip("\n"), "    ")
          tests = tests.replace(insertion_anchor, regression + insertion_anchor, 1)

          source_anchor = "        grant = inspect.getsource(helper._PrivateReadLease.grant)\n"
          tests = replace_once(
              tests,
              source_anchor,
              "        namespace_validator = inspect.getsource(helper._validated_namespace_witnesses)\n        namespace_verifier = inspect.getsource(helper._verify_namespace_generation_witnesses)\n        grant = inspect.getsource(helper._PrivateReadLease.grant)\n        revoke = inspect.getsource(helper._PrivateReadLease.revoke)\n",
              "source lifetime helpers",
          )
          tests = replace_once(
              tests,
              "        self.assertIn(\"include_descriptors=True\", grant)\n        self.assertIn(\"accepted_signature, descriptor\", grant)\n        self.assertNotIn(\"include_signatures=True\", grant)\n",
              "        self.assertIn(\"include_descriptors=True\", grant)\n        self.assertIn(\"accepted_signature, descriptor\", grant)\n        self.assertNotIn(\"include_signatures=True\", grant)\n        self.assertIn(\"_validated_namespace_witnesses\", namespace_validator)\n        self.assertIn(\"_verify_namespace_generation_witnesses\", namespace_validator)\n        self.assertIn(\"namespace_witnesses_out\", lease_paths)\n        self.assertIn(\"_validated_namespace_witnesses\", lease_paths)\n        self.assertIn(\"_validated_namespace_witnesses\", grant)\n        self.assertIn(\"_verify_namespace_generation_witnesses\", namespace_verifier)\n        self.assertIn(\"_verify_namespace_generation_witnesses\", revoke)\n        self.assertLess(\n            revoke.index(\"_verify_namespace_generation_witnesses\"),\n            revoke.index(\"_chmod_acl\"),\n        )\n",
              "source lifetime assertions",
          )
          compile(tests, str(test_path), "exec", dont_inherit=True)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Verify product bytes before publication
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          git diff --check "$EXACT_PARENT"

      - name: Publish non-workflow product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git commit -m "Hold private symlink namespace through build lifetime"
          git push origin HEAD:repair/v17-capture-read-lease-symlink-lifetime-sol-20260815
