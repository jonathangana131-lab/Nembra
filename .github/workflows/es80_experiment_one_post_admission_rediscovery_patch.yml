name: ES80 Experiment One post-admission rediscovery patch

on:
  push:
    branches:
      - integration/es80-v14-experiment-one-post-admission-rediscovery/chatgpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/es80-v14-experiment-one-post-admission-rediscovery/chatgpt56-go

      - name: Apply exact guarded product patch
        run: python3 scripts/ci/es80_experiment_one_post_admission_rediscovery_patch.py

      - name: Validate product contract and self-clean tooling
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'issuedAtUptimeNanoseconds: DispatchTime.now().uptimeNanoseconds' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift
          grep -F 'latestAdvertisement.receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -F 'foregroundEvidenceIntegrityValid = true' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          rm -f .github/workflows/es80_experiment_one_post_admission_rediscovery_patch.yml
          rm -f scripts/ci/es80_experiment_one_post_admission_rediscovery_patch.py
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift \
                  Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift \
                  .github/workflows/es80_experiment_one_post_admission_rediscovery_patch.yml \
                  scripts/ci/es80_experiment_one_post_admission_rediscovery_patch.py
          git commit -m '[Capture Experiment One] require post-admission rediscovery'
          git push origin HEAD:integration/es80-v14-experiment-one-post-admission-rediscovery/chatgpt56-go
