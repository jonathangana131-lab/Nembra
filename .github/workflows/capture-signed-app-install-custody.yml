name: Capture Signed App Install Custody

on:
  push:
    branches:
      - repair/v14-capture-signed-app-install-custody-sol
  pull_request:
    paths:
      - scripts/ci/es80_signed_app_install_guard.py
      - scripts/ci/tests/test_es80_signed_app_install_guard.py
      - scripts/ci/tests/test_capture_signed_app_install_custody_source.py
      - scripts/field/install_one_time_capture.command
      - .github/workflows/capture-signed-app-install-custody.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-contract:
    name: Validate portable signed app install custody
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile custody helper and tests
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/es80_signed_app_install_guard.py scripts/ci/tests/test_es80_signed_app_install_guard.py scripts/ci/tests/test_capture_signed_app_install_custody_source.py
          bash -n scripts/field/install_one_time_capture.command

      - name: Exercise portable custody invariants
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_signed_app_install_guard.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_custody_source.py

  macos-kqueue-contract:
    name: Validate macOS vnode install custody
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Exercise real kqueue swap-restore rejection
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/es80_signed_app_install_guard.py scripts/ci/tests/test_es80_signed_app_install_guard.py scripts/ci/tests/test_capture_signed_app_install_custody_source.py
          /usr/bin/python3 -I scripts/ci/tests/test_es80_signed_app_install_guard.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_custody_source.py
          bash -n scripts/field/install_one_time_capture.command
