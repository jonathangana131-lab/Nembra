name: Capture Signed App Install Custody

on:
  push:
    branches:
      - repair/v14-capture-signed-app-install-custody-gpt56-sol
      - repair/v14-capture-private-device-runner-execution-sol
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/capture_signed_app_install_custody.py
      - scripts/ci/tests/test_capture_signed_app_install_custody.py
      - scripts/ci/tests/test_capture_private_device_runner_execution_subject.py
      - .github/workflows/capture-signed-app-install-custody.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-install-subject:
    name: Require protected exact app at devicectl boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind QA to exact checked-out source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'Exact install-custody source: %s\n' "$actual"

      - name: Run portable source and fingerprint regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-capture-install-pycache"
          /usr/bin/python3 -m py_compile \
            scripts/ci/capture_signed_app_install_custody.py \
            scripts/ci/tests/test_capture_signed_app_install_custody.py \
            scripts/ci/tests/test_capture_private_device_runner_execution_subject.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_install_custody.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_device_runner_execution_subject.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove root-owned stage rejects same-UID mutation
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(mktemp -d)"
          stage_root=""
          cleanup() {
            rm -rf -- "$source_root"
            if [[ -n "$stage_root" ]]; then sudo /bin/rm -rf -- "$stage_root"; fi
          }
          trap cleanup EXIT

          mkdir -p "$source_root/Nembra Capture.app"
          printf 'accepted signed subject\n' > "$source_root/Nembra Capture.app/subject.txt"
          source_sha="$(/usr/bin/python3 -B -I scripts/ci/capture_signed_app_install_custody.py fingerprint --app "$source_root/Nembra Capture.app")"

          sudo /bin/mkdir -p /private/tmp
          stage_root="$(sudo /usr/bin/mktemp -d /private/tmp/nembra-authenticated-capture-install.XXXXXX)"
          sudo /bin/cp -a "$source_root/Nembra Capture.app" "$stage_root/Nembra Capture.app"
          sudo /usr/bin/chown -R root:root "$stage_root"
          sudo /bin/chmod 0755 "$stage_root"

          staged_sha="$(/usr/bin/python3 -B -I scripts/ci/capture_signed_app_install_custody.py verify-stage \
            --stage-root "$stage_root" \
            --app "$stage_root/Nembra Capture.app" \
            --expected "$source_sha")"
          test "$staged_sha" = "$source_sha"

          if printf 'substituted\n' > "$stage_root/Nembra Capture.app/subject.txt" 2>/dev/null; then
            echo 'ERROR: non-root runner mutated the protected install subject' >&2
            exit 1
          fi
          final_sha="$(/usr/bin/python3 -B -I scripts/ci/capture_signed_app_install_custody.py verify-stage \
            --stage-root "$stage_root" \
            --app "$stage_root/Nembra Capture.app" \
            --expected "$source_sha")"
          test "$final_sha" = "$source_sha"

  macos-acl-strip-custody:
    name: Reject inherited ACL authority on real macOS
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind ACL evidence to exact checked-out source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove protected ditto snapshot strips inherited ACLs
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          stage_root=""
          cleanup() {
            rm -rf -- "$fixture"
            if [[ -n "$stage_root" ]]; then sudo /bin/rm -rf -- "$stage_root"; fi
          }
          trap cleanup EXIT

          source_app="$fixture/Nembra Capture.app"
          mkdir -p "$source_app"
          printf 'accepted signed subject\n' > "$source_app/subject.txt"
          /bin/chmod +a "$(id -un) allow write,delete,add_file,add_subdirectory,file_inherit,directory_inherit" "$source_app"
          /usr/bin/find "$source_app" -acl -print -quit | /usr/bin/grep -q .

          sudo /bin/mkdir -p /private/tmp
          stage_root="$(sudo /usr/bin/mktemp -d /private/tmp/nembra-authenticated-capture-install.XXXXXX)"
          sudo /usr/bin/ditto --noacl "$source_app" "$stage_root/Nembra Capture.app"
          staged_acl="$(sudo /usr/bin/find "$stage_root" -acl -print -quit)"
          test -z "$staged_acl"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  accepted-runner-transport:
    name: Require exact private-device runner Git blob transport
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind transport test to exact checked-out source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove accepted runner bytes survive exact macOS transport
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          relative='scripts/ci/es80_signed_field_artifact_private_runner.py'
          blob="$(GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git rev-parse "$source_sha:$relative")"
          [[ "$blob" =~ ^[0-9a-f]{40}$ ]]
          encoded="$(GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git cat-file blob "$blob" | /usr/bin/base64 | /usr/bin/tr -d '\r\n')"
          test -n "$encoded"
          decoded_blob="$(printf '%s' "$encoded" | /usr/bin/base64 -D | GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git hash-object --stdin)"
          test "$decoded_blob" = "$blob"
          /usr/bin/python3 -B -I - "$encoded" <<'PY'
          import base64
          import sys

          runner_source = base64.b64decode(sys.argv[1], validate=True)
          namespace = {
              "__name__": "nembra_private_device_reader",
              "__file__": "<accepted-private-device-runner>",
          }
          exec(
              compile(runner_source, "<accepted-private-device-runner>", "exec", dont_inherit=True),
              namespace,
          )
          if not callable(namespace.get("read_private_identifier")):
              raise SystemExit("accepted private-device runner did not expose read_private_identifier")
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
