name: Capture Signed App Install Custody

on:
  push:
    branches:
      - repair/v14-capture-signed-app-install-custody-r2-sol
  pull_request:
    paths:
      - Scripts/capture_signed_app_install_guard.py
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_signed_app_install_guard.py
      - scripts/ci/tests/test_capture_signed_app_install_subject.py
      - .github/workflows/capture-signed-app-install-custody.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-app-install-custody:
    name: Bind verified signed app to devicectl install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind to exact checked-out source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate signed-app install custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_signed_app_install_guard.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_signed_app_install_guard.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_signed_app_install_subject.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_guard.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_subject.py
          bash -n scripts/field/install_one_time_capture.command
          grep -Fq 'SIGNED_APP_SUBJECT_SHA256="$(/usr/bin/python3 -I "$SIGNED_APP_INSTALL_GUARD" --digest-only --app "$APP")"' scripts/field/install_one_time_capture.command
          grep -Fq -- '--expected-sha256 "$SIGNED_APP_SUBJECT_SHA256"' scripts/field/install_one_time_capture.command
          grep -Fq 'KQ_FILTER_VNODE' Scripts/capture_signed_app_install_guard.py
          grep -Fq 'fingerprint_bundle(app) != expected' Scripts/capture_signed_app_install_guard.py
