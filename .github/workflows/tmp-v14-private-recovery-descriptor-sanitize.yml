name: TMP V14 Private Recovery Descriptor Sanitize

on:
  push:
    branches:
      - repair/v14-private-recovery-descriptor-sanitize-sol-20260811
    paths:
      - scripts/ci/tmp_materialize_private_recovery_descriptor_sanitize.py
      - .github/workflows/tmp-v14-private-recovery-descriptor-sanitize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-recovery-descriptor-sanitize-sol-20260811
          fetch-depth: 0

      - name: Bind exact branch head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize production repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tmp_materialize_private_recovery_descriptor_sanitize.py
          /usr/bin/python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_crash_residue.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_recovery_unlink_race.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_crash_residue.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_recovery_unlink_race.py
          /usr/bin/python3 Scripts/provision_capture_tuya_identity_writer.py --self-test
          /bin/bash -n Scripts/provision_capture_tuya_identity.sh
          git diff --check

      - name: Publish durable successor bytes
        shell: bash
        env:
          BRANCH: repair/v14-private-recovery-descriptor-sanitize-sol-20260811
        run: |
          set -euo pipefail
          git add Scripts/provision_capture_tuya_identity_writer.py
          git add Scripts/provision_capture_tuya_identity.sh
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift
          git add scripts/ci/tests/test_capture_private_identity_crash_residue.py
          git add scripts/ci/tests/test_capture_private_identity_recovery_unlink_race.py
          git diff --cached --check
          git config user.name "Nembra V14 Swarm"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): sanitize crash residue by descriptor"
          git push origin "HEAD:$BRANCH"
