name: Capture private input external boundary v3

on:
  push:
    branches:
      - agent/capture-private-input-external-boundary-v14

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard v2 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1afc53e9f8f1cc7176417565d53850d381ef6b11"

      - name: Apply reviewed v2 transform and align final regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/zz-capture-private-input-external-boundary-v2.yml")
          text = workflow.read_text(encoding="utf-8")
          opener = "          python3 - <<'PY'\n"
          start = text.index(opener) + len(opener)
          end = text.index("\n          PY", start)
          transform = textwrap.dedent(text[start:end])
          exec(compile(transform, "<external-private-input-transform-v3>", "exec"), {})

          intended_test = Path("scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py")
          source = intended_test.read_text(encoding="utf-8")
          old = "        self.assertIn('resolved_path.relative_to(resolved_repository)', runner)\n"
          new = "        self.assertIn('os.path.commonpath([path_text, repository_text]) == repository_text', runner)\n"
          if source.count(old) != 1:
              raise SystemExit("final external-boundary assertion did not match v2 transform output")
          intended_test.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate final privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_private_runner.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
          git diff --check

      - name: Commit product hardening and remove transformer files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-capture-private-input-external-boundary.yml
          rm .github/workflows/zz-capture-private-input-external-boundary-v2.yml
          rm .github/workflows/zz-capture-private-input-external-boundary-v3.yml
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/es80_signed_field_artifact_private_runner.py \
                  scripts/ci/xcode27_signed_field_candidate.sh \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_source.py \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py \
                  .github/workflows/zz-capture-private-input-external-boundary.yml \
                  .github/workflows/zz-capture-private-input-external-boundary-v2.yml \
                  .github/workflows/zz-capture-private-input-external-boundary-v3.yml
          git diff --cached --check
          git commit -m "fix(capture): require external private device input"
          git push origin HEAD:agent/capture-private-input-external-boundary-v14
