name: Materialize Capture final metadata export custody

on:
  push:
    branches:
      - repair/v14-capture-final-metadata-export-custody-ba3a-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact product parent and scaffold scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ba3a1eeae36caca6dd84beaabd0f15f4f0b57925"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-capture-final-metadata-export-custody-sol.yml"
      - name: Apply final export custody repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bridge_path = Path("NembraApp/Features/Research/TuyaAccountBridge.swift")
          bridge = bridge_path.read_text()
          replacements = [
              ('            "specifications": selectedDeviceSpecifications ?? [:],',
               '            "specifications": Self.redactSecrets(selectedDeviceSpecifications ?? [:]),'),
              ('            "localStrategy": selectedDeviceLocalStrategy ?? [:],',
               '            "localStrategy": Self.redactSecrets(selectedDeviceLocalStrategy ?? [:]),'),
          ]
          for old, new in replacements:
              if bridge.count(old) != 1:
                  raise SystemExit(f"expected export custody anchor once: {old}")
              bridge = bridge.replace(old, new, 1)
          bridge_path.write_text(bridge)

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift")
          test = test_path.read_text()
          anchor = '    @Test("linked device UI state does not retain raw device dictionaries or local key")\n'
          addition = '''    @Test("final metadata export re-sanitizes every opaque payload at custody")
              func finalExportReSanitizesOpaquePayloads() throws {
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let export = try section(
                      in: bridge,
                      from: "func prepareRedactedExport()",
                      to: "func resetLink()"
                  )
                  let body = String(export)

                  #expect(body.contains("\\\"status\\\": Self.redactSecrets(selectedDeviceStatus ?? [:])"))
                  #expect(body.contains("\\\"specifications\\\": Self.redactSecrets(selectedDeviceSpecifications ?? [:])"))
                  #expect(body.contains("\\\"localStrategy\\\": Self.redactSecrets(selectedDeviceLocalStrategy ?? [:])"))
                  #expect(body.contains("envelope[\\\"deviceDetailRedacted\\\"] = Self.redactSecrets(selectedDeviceMetadata)"))
                  #expect(!body.contains("\\\"specifications\\\": selectedDeviceSpecifications ?? [:]"))
                  #expect(!body.contains("\\\"localStrategy\\\": selectedDeviceLocalStrategy ?? [:]"))
              }

          '''
          if test.count(anchor) != 1:
              raise SystemExit("expected linked-device test anchor once")
          test_path.write_text(test.replace(anchor, addition + anchor, 1))
          PY
          git diff --check
          swiftc -parse NembraApp/Features/Research/TuyaAccountBridge.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift
          grep -q '"specifications": Self.redactSecrets(selectedDeviceSpecifications ?? \[:\])' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -q '"localStrategy": Self.redactSecrets(selectedDeviceLocalStrategy ?? \[:\])' NembraApp/Features/Research/TuyaAccountBridge.swift
      - name: Publish clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-final-metadata-export-custody-sol.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): re-sanitize metadata at final export custody'
          git push origin HEAD:repair/v14-capture-final-metadata-export-custody-ba3a-sol
