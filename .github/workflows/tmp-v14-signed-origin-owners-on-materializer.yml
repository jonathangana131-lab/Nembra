name: Temporary V14 signed-origin owners-on materializer

on:
  push:
    branches:
      - repair/v14-signed-origin-owners-on-sol-20260812-go2

permissions:
  contents: write

concurrency:
  group: tmp-v14-signed-origin-owners-on-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact stacked parent
        shell: bash
        env:
          EXACT_PARENT: f4863bded2f9ca9b41f1e5d17c3f37a592efbe3f
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          actual="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$actual" = ".github/workflows/tmp-v14-signed-origin-owners-on-materializer.yml"

      - name: Materialize accepted ownership invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path("scripts/ci/capture_signed_app_build_origin_custody.py")
          text = helper.read_text(encoding="utf-8")
          old = '''        "-plist",
                  "-nobrowse",
                  "-mountpoint",
          '''
          new = '''        "-plist",
                  "-nobrowse",
                  "-owners",
                  "on",
                  "-mountpoint",
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one production APFS attach command shape")
          helper.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py")
          source = test.read_text(encoding="utf-8")
          marker = '        self.assertIn("build_gid = build_uid", source)\n'
          insertion = '''        owners = source.find('"-owners",')
                  mountpoint = source.find('"-mountpoint",')
                  self.assertGreaterEqual(owners, 0)
                  self.assertGreaterEqual(mountpoint, 0)
                  self.assertLess(owners, mountpoint)
                  self.assertEqual(source.count('"-owners",'), 1)
          '''
          if source.count(marker) != 1:
              raise SystemExit("expected exactly one pre-stage production marker")
          test.write_text(source.replace(marker, insertion + marker, 1), encoding="utf-8")
          PY

          rm .github/workflows/tmp-v14-signed-origin-owners-on-materializer.yml

      - name: Validate focused custody contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          python3 scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py -v
          python3 - <<'PY'
          from pathlib import Path
          source = Path("scripts/ci/capture_signed_app_build_origin_custody.py").read_text(encoding="utf-8")
          assert source.count('"-owners",') == 1
          owners = source.index('"-owners",')
          enabled = source.index('"on",', owners)
          mountpoint = source.index('"-mountpoint",', enabled)
          assert owners < enabled < mountpoint
          PY
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/tmp-v14-signed-origin-owners-on-materializer.yml \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish clean product delta
        shell: bash
        env:
          BRANCH: repair/v14-signed-origin-owners-on-sol-20260812-go2
        run: |
          set -euo pipefail
          git config user.name "nembra-swarm"
          git config user.email "nembra-swarm@users.noreply.github.com"
          git add -A -- \
            .github/workflows/tmp-v14-signed-origin-owners-on-materializer.yml \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          git commit -m "Capture P0: enforce APFS ownership on compiler output"
          git push origin "HEAD:$BRANCH"
