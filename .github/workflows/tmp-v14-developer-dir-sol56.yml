name: Temporary V14 Developer Dir Repair Compiler

on:
  push:
    branches:
      - repair/v14-field-developer-dir-authority-sol56-20260811

permissions:
  contents: write

jobs:
  compile-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-field-developer-dir-authority-sol56-20260811
      - name: Patch, verify, and store immutable tested blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/field/install_one_time_capture.command')
          source = path.read_text(encoding='utf-8')
          needle = 'unset BASH_ENV ENV CDPATH || true\n'
          replacement = 'unset BASH_ENV ENV CDPATH || true\nunset DEVELOPER_DIR || true\n'
          if source.count(needle) != 1:
              raise SystemExit('expected startup environment fence exactly once')
          path.write_text(source.replace(needle, replacement, 1), encoding='utf-8')
          PY
          /bin/bash -n scripts/field/install_one_time_capture.command
          python3 scripts/ci/tests/test_capture_field_developer_dir_authority.py
          git diff --check -- scripts/field/install_one_time_capture.command
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          payload = {
              'content': base64.b64encode(Path('scripts/field/install_one_time_capture.command').read_bytes()).decode('ascii'),
              'encoding': 'base64',
          }
          Path('/tmp/blob.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary @/tmp/blob.json > /tmp/blob-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path('/tmp/blob-response.json').read_text(encoding='utf-8'))
          sha = response.get('sha', '')
          if len(sha) != 40:
              raise SystemExit('GitHub did not return one immutable blob SHA')
          print('NEMBRA_TESTED_INSTALLER_BLOB=' + sha)
          PY
