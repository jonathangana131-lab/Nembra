name: Capture Final Premium Root Patch Once

on:
  push:
    branches:
      - agent/v14-capture-final-premium-root-convergence-sol

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'harden final Capture premium root patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Preserve AX semantics on premium root
        shell: bash
        run: |
          set -euo pipefail
          file='NembraApp/App/NembraCaptureEntrypoint.swift'
          expected_blob='4259fcbb0d79b78711b0e7b179827008f2df74ae'
          test "$(git hash-object "$file")" = "$expected_blob"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          start = source.index('private struct CaptureP0Root: View')
          end = source.index('@MainActor\nprivate final class SecureLinkController', start)
          root = source[start:end]

          hero = '.font(dynamicTypeSize.isAccessibilitySize ? .title2.bold() : .largeTitle.bold())\n            .fixedSize(horizontal: false, vertical: true)'
          hero_new = hero + '\n            .accessibilityAddTraits(.isHeader)'
          assert root.count(hero) == 1, ('hero', root.count(hero))
          root = root.replace(hero, hero_new, 1)

          combine = '        .accessibilityElement(children: .combine)\n'
          assert root.count(combine) >= 2, ('combine', root.count(combine))
          root = root.replace(combine, '', 1)

          pattern = re.compile(r'(?m)^(\s*)\.accessibilityHint\("Creates the account-metadata approval QR\. It does not start Bluetooth or physical Capture\."\)$')
          matches = list(pattern.finditer(root))
          assert len(matches) == 1, ('hint', len(matches))
          match = matches[0]
          indent = match.group(1)
          insertion = indent + '.accessibilityIdentifier("nembra.capture.root.account-link-action")\n'
          root = root[:match.start()] + insertion + root[match.start():]

          assert root.count('.accessibilityAddTraits(.isHeader)') == 1
          assert root.count('nembra.capture.root.account-link-action') == 1
          assert 'private func rootSection<Content: View>' in root
          assert 'private func rootPanel<Content: View>' not in root
          updated = source[:start] + root + source[end:]
          path.write_text(updated, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = 1
          test "$(git diff --name-only)" = 'NembraApp/App/NembraCaptureEntrypoint.swift'

          git config user.name 'Nembra Capture Closure'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git rm .github/workflows/_capture_final_premium_patch_once.yml
          git commit -m 'ui(capture): preserve premium root AX semantics'
          git push origin HEAD:${GITHUB_REF_NAME}
