name: Swarm V16.2 PR Admission

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  GITHUB_REPOSITORY: ${{ github.repository }}

concurrency:
  group: swarm-v16-2-pr-admission-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target sees untrusted PR metadata. Execute only code from
      # the current default branch; never checkout or run PR-head bytes here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind trusted admission code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "${{ github.event.repository.default_branch }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -m py_compile scripts/swarm_control.py scripts/swarm_v16_1_pr_admission.py scripts/swarmcp/*.py

      - name: Enforce V16.2 canonical absorption topology
        shell: bash
        run: python3 scripts/swarm_v16_1_pr_admission.py
