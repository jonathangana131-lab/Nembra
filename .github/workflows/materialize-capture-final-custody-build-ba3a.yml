name: Materialize Capture Final Custody Build ba3a

on:
  push:
    branches:
      - fix/v14-capture-final-custody-build-ba3a-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-final-custody-build-ba3a-sol
          fetch-depth: 0

      - name: Guard exact lineage and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          base='ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"...HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/scripts/materialize_capture_final_custody_build_ba3a.py' \
            '.github/workflows/materialize-capture-final-custody-build-ba3a.yml' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Apply and verify repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize_capture_final_custody_build_ba3a.py apply
          python3 .github/scripts/materialize_capture_final_custody_build_ba3a.py verify
          python3 -m py_compile .github/scripts/materialize_capture_final_custody_build_ba3a.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDAdmissionSnapshotSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAccountIdentityLeaseAppSourceIntegrationTests.swift
          git diff --check

      - name: Publish clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-final-custody-build-ba3a.yml
          rm .github/scripts/materialize_capture_final_custody_build_ba3a.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): freeze account UID custody before suspension'
          git push origin HEAD:fix/v14-capture-final-custody-build-ba3a-sol
