name: Capture final private pathname fence materializer

on:
  push:
    branches:
      - agent/v14-capture-private-path-final-fence-sol
    paths:
      - .github/workflows/capture-private-path-final-fence-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v14-capture-private-path-final-fence-sol
          fetch-depth: 0

      - name: Bind exact current parent
        run: |
          set -euo pipefail
          base='3a90503b9f668c1bc696fa32ee8937e646dff12d'
          git merge-base --is-ancestor "$base" HEAD
          test -z "$(git diff --name-only "$base" HEAD -- ':!.github/workflows/capture-private-path-final-fence-materialize.yml')"

      - name: Close final same-inode pathname race
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path("Scripts/capture_tuya_private_input_provenance.py")
          source = helper.read_text()
          old = (
              "            or current_path.st_dev != after.st_dev\n"
              "            or current_path.st_ino != after.st_ino\n"
          )
          new = "            or _stat_identity(current_path) != _stat_identity(after)\n"
          if source.count(old) != 1:
              raise SystemExit(f"expected current final pathname fence exactly once; found {source.count(old)}")
          helper.write_text(source.replace(old, new, 1))

          tests = Path("scripts/ci/tests/test_capture_tuya_private_input_provenance.py")
          test_source = tests.read_text()
          marker = "    def test_tree_rejects_file_replacement_after_individual_fingerprint(self) -> None:\n"
          if test_source.count(marker) != 1:
              raise SystemExit("provenance test insertion marker changed")
          lines = [
              "    def test_file_fingerprint_rejects_same_inode_mutation_after_final_descriptor_stat(self) -> None:",
              "        target = self.security_podspec",
              "        size = target.stat().st_size",
              "        inode = target.stat().st_ino",
              "        original_lstat = Path.lstat",
              "        mutated = False",
              "",
              "        def mutate_then_lstat(path: Path) -> os.stat_result:",
              "            nonlocal mutated",
              "            if path == target and not mutated:",
              "                mutated = True",
              "                target.write_bytes(b\"Q\" * size)",
              "            return original_lstat(path)",
              "",
              "        with mock.patch.object(Path, \"lstat\", autospec=True, side_effect=mutate_then_lstat):",
              "            with self.assertRaises(provenance.ProvenanceError):",
              "                provenance._file_fingerprint(target)",
              "",
              "        self.assertTrue(mutated)",
              "        self.assertEqual(target.stat().st_ino, inode)",
              "",
              "",
          ]
          regression = "\n".join(lines)
          tests.write_text(test_source.replace(marker, regression + marker, 1))
          PY
          git diff --check

      - name: Run provenance suite and residual contract
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          python3 -m py_compile scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("Scripts/capture_tuya_private_input_provenance.py").read_text()
          t=Path("scripts/ci/tests/test_capture_tuya_private_input_provenance.py").read_text()
          assert "_stat_identity(current_path) != _stat_identity(after)" in s
          assert "current_path.st_dev != after.st_dev" not in s
          assert "current_path.st_ino != after.st_ino" not in s
          assert "test_file_fingerprint_rejects_same_inode_mutation_after_final_descriptor_stat" in t
          PY

      - name: Collapse to exact two-path residual repair
        run: |
          set -euo pipefail
          base='3a90503b9f668c1bc696fa32ee8937e646dff12d'
          rm .github/workflows/capture-private-path-final-fence-materialize.yml
          git add -A
          git diff --cached --check "$base"
          git diff --cached --name-only "$base" | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          Scripts/capture_tuya_private_input_provenance.py
          scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): close final private pathname fingerprint race'
          git push origin HEAD:agent/v14-capture-private-path-final-fence-sol
