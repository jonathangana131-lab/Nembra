name: Capture 2709 Vnode Attribute Cleanup
on:
  push:
    branches:
      - repair/v14-capture-2709-vnode-attrib-sol
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wire canonical regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/capture-cocoapods-build-subject-redteam.yml')
          s=p.read_text()
          path='      - scripts/ci/tests/test_capture_cocoapods_coherent_generation.py\n'
          if 'test_capture_cocoapods_vnode_attribute_custody.py' not in s:
              s=s.replace(path,path+'      - scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n',1)
              compile='          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_coherent_generation.py\n'
              s=s.replace(compile,compile+'          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n',1)
              s+='\n      - name: Require vnode attribute custody\n        shell: bash\n        run: python3 scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n'
          p.write_text(s)
          PY
          python3 scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py
          git diff --check
      - name: Remove temporary workflows and publish clean diff
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/capture-2709-vnode-attrib-materializer.yml .github/workflows/capture-2709-vnode-attrib-retry.yml .github/workflows/capture-2709-vnode-attrib-publish.yml .github/workflows/capture-2709-vnode-attrib-finalize.yml .github/workflows/capture-2709-vnode-attrib-cleanup.yml
          git add .github/workflows/capture-cocoapods-build-subject-redteam.yml Scripts/capture_tuya_private_input_build_guard.py scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py
          git diff --cached --check
          git config user.name jonathangana131-lab
          git config user.email jonathangana131@gmail.com
          git commit -m 'ci(capture): retain vnode attribute custody regression'
          git push origin HEAD:repair/v14-capture-2709-vnode-attrib-sol
