name: Capture Standalone Visual Acceptance

on:
  push:
    branches:
      - product/v14-capture-premium-secure-link-current-sol
  pull_request:
    paths:
      - NembraApp/App/NembraCaptureBuildIdentity.swift
      - NembraApp/App/NembraCaptureEntrypoint.swift
      - NembraCapture.xcodeproj/project.pbxproj
      - scripts/ci/capture_standalone_visual_evidence.sh
      - scripts/ci/tests/test_capture_standalone_visual_evidence.py
      - .github/workflows/capture-standalone-visual-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-visual:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.actor == 'github-actions[bot]'
    name: Real standalone Capture presentation
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind job to exact visual-review source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'CAPTURE_VISUAL_SOURCE_SHA=%s\n' "$actual" >> "$GITHUB_ENV"
          printf 'Exact visual-review source: %s\n' "$actual"

      - name: Verify visual-evidence harness source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_standalone_visual_evidence.py
          /usr/bin/python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py

      - name: Build exact standalone Capture Simulator app
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${CAPTURE_VISUAL_SOURCE_SHA:?exact source was not established}"
          label="capture-v14-${source_sha:0:12}"
          rm -rf /tmp/NembraCaptureProvenanceDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureProvenanceDerived \
            CODE_SIGNING_ALLOWED=NO \
            NEMBRA_CAPTURE_BUILD_IDENTIFIER="$label" \
            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$source_sha" \
            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="" \
            build

          plist='/tmp/NembraCaptureProvenanceDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app/Info.plist'
          test -f "$plist"
          test "$(plutil -extract NembraCaptureBuildIdentifier raw -o - "$plist")" = "$label"
          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$source_sha"
          embedded_dependency="$(plutil -extract NembraCaptureTuyaDependencyLockSHA256 raw -o - "$plist" 2>/dev/null || true)"
          test -z "$embedded_dependency"

      - name: Launch real standalone app and capture fail-closed presentation
        shell: bash
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/NembraCaptureStandaloneVisualEvidence
        run: |
          set -euo pipefail
          EVIDENCE_PROFILE=public-unprovisioned \
          EXPECTED_SOURCE_SHA="$CAPTURE_VISUAL_SOURCE_SHA" \
          bash scripts/ci/capture_standalone_visual_evidence.sh

      - name: Verify retained evidence rendezvous
        shell: bash
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/NembraCaptureStandaloneVisualEvidence
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$ARTIFACTS_DIR/NembraCaptureStandaloneVisualEvidence.json" "$CAPTURE_VISUAL_SOURCE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          record = json.loads(Path(sys.argv[1]).read_text())
          expected_sha = sys.argv[2].lower()
          assert record["schemaVersion"] == 2
          assert record["authority"] == "standalone-capture-simulator-presentation-only"
          assert record["evidenceProfile"] == "public-unprovisioned"
          assert record["sourceCommitSHA"] == expected_sha
          assert record["buildIdentifier"] == f"capture-v14-{expected_sha[:12]}"
          assert record["tuyaDependencyLockSHA256"] is None
          assert record["tuyaDependencyProvenanceClass"] == "deliberately-absent-public-ci"
          assert record["expectedFieldBuildAuthority"] is False
          assert record["syntheticAuthorityEnvironmentRejected"] is True
          assert record["physicalAuthorityCreated"] is False
          assert record["protocolAuthorityCreated"] is False
          assert record["visualAcceptanceRequiresHumanReview"] is True
          screenshot = Path(sys.argv[1]).parent / record["screenshot"]["relativePath"]
          assert screenshot.is_file() and screenshot.stat().st_size > 0
          PY

      - name: Upload standalone visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-capture-standalone-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/NembraCaptureStandaloneVisualEvidence
          if-no-files-found: ignore
          retention-days: 14