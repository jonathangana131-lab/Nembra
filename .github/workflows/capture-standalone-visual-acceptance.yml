name: Capture Standalone Visual Acceptance

on:
  pull_request:
    paths:
      - NembraApp/App/NembraCaptureEntrypoint.swift
      - NembraApp/App/NembraCaptureBuildIdentity.swift
      - NembraCapture.xcodeproj/project.pbxproj
      - scripts/ci/capture_standalone_visual_evidence.sh
      - scripts/ci/tests/test_capture_standalone_visual_evidence.py
      - .github/workflows/capture-standalone-visual-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-visual:
    name: Build and capture standalone Nembra Capture
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Validate standalone visual evidence source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          /usr/bin/python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py

      - name: Build exact-head stamped standalone Simulator app
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          event_head='${{ github.event.pull_request.head.sha }}'
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Checkout HEAD is not one lowercase 40-hex SHA: $source_sha" >&2
            exit 1
          fi
          if [[ -n "$event_head" && "$source_sha" != "$event_head" ]]; then
            echo "Checked-out source does not match the pull-request head." >&2
            exit 1
          fi

          label="capture-v14-${source_sha:0:12}"
          # This public/unprovisioned Simulator build cannot possess the private field
          # dependency record. Use a deterministic visual-only fixture; the produced
          # evidence is mechanically marked as presentation-only and non-physical.
          dependency_sha="$(printf '%s' 'nembra-capture-public-unprovisioned-visual-v1' | shasum -a 256 | awk '{print $1}')"

          rm -rf /tmp/NembraCaptureStandaloneVisualDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureStandaloneVisualDerived \
            CODE_SIGNING_ALLOWED=NO \
            NEMBRA_CAPTURE_BUILD_IDENTIFIER="$label" \
            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$source_sha" \
            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="$dependency_sha" \
            build

          app='/tmp/NembraCaptureStandaloneVisualDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app'
          plist="$app/Info.plist"
          test -d "$app"
          test -f "$plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = 'com.jonathangana131.nembra.capturelearn'
          test "$(plutil -extract NembraCaptureBuildIdentifier raw -o - "$plist")" = "$label"
          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$source_sha"
          test "$(plutil -extract NembraCaptureTuyaDependencyLockSHA256 raw -o - "$plist")" = "$dependency_sha"

      - name: Capture real standalone fail-closed presentation
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH='/tmp/NembraCaptureStandaloneVisualDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app' \
          ARTIFACTS_DIR="$RUNNER_TEMP/NembraCaptureStandaloneVisualEvidence" \
          bash scripts/ci/capture_standalone_visual_evidence.sh

      - name: Verify exact-head evidence custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "NembraCaptureStandaloneVisualEvidence"
          record = json.loads((root / "NembraCaptureStandaloneVisualEvidence.json").read_text(encoding="utf-8"))
          expected_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          expected_build = f"capture-v14-{expected_sha[:12]}"

          assert record["sourceCommitSHA"] == expected_sha
          assert record["buildIdentifier"] == expected_build
          assert record["bundleIdentifier"] == "com.jonathangana131.nembra.capturelearn"
          assert record["authority"] == "standalone-capture-simulator-presentation-only"
          assert record["syntheticAuthorityEnvironmentRejected"] is True
          assert record["visualAcceptanceRequiresHumanReview"] is True
          assert record["physicalAuthorityCreated"] is False
          assert record["protocolAuthorityCreated"] is False
          assert (root / record["screenshot"]["relativePath"]).is_file()
          print(f"standalone Capture visual evidence exact-head custody: PASS {expected_sha}")
          PY

      - name: Upload standalone visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: nembra-capture-standalone-visual-${{ github.run_id }}
          path: ${{ runner.temp }}/NembraCaptureStandaloneVisualEvidence
          if-no-files-found: error
          retention-days: 14
