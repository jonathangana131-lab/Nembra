name: V14 Capture Guided Truth Fix Sol

on:
  push:
    branches:
      - fix/v14-capture-guided-truth-current-sol

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-guided-truth-current-sol
          fetch-depth: 0
      - name: Materialize repair
        run: python3 scripts/ci/materialize_capture_guided_truth_fix_sol.py
      - name: Verify diff
        run: git diff --check
      - name: Commit clean successor
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-guided-truth-fix-sol.yml
          rm scripts/ci/materialize_capture_guided_truth_fix_sol.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): close guided chronology and recovery truth"
          git push origin HEAD:fix/v14-capture-guided-truth-current-sol
