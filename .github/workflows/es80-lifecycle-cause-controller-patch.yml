name: ES80 Lifecycle Cause Controller Patch

on:
  push:
    branches:
      - 'cell/es80-passive-capture/patch/chat-n7q4m-cause-1'

permissions:
  contents: write

jobs:
  patch-owned-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: parallel/es80-passive-lifecycle-fences/chat-n7q4m
      EXPECTED_TARGET_HEAD: 2a62a5e9146340d78c38f8b88cff6927124a218d
      EXPECTED_CONTROLLER_BLOB: 95aee26d010e296f374c9d25bec962f50d2b495a
      CONTROLLER_PATH: Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch exact owned product head
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_TARGET_HEAD"
          git checkout -B product "origin/$TARGET_BRANCH"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          source = path.read_text()

          old = '''    public func cancelActiveConnection() {
              cancelActiveConnection(boundary: .recordCancellationRequest)
          }

          private func cancelActiveConnection(boundary: PassiveCoreBluetoothCancellationBoundary) {
              connectionTimeoutTask?.cancel()
              connectionTimeoutTask = nil
              guard let peripheral = activePeripheral else { return }
              lastDiagnostic = "Connection cancellation requested."

              if targetState.selectedTargetIdentifier == peripheral.identifier {
                  if boundary.shouldRecordCancellationRequest {
                      enqueueInterruption("connection cancellation requested")
                  }
          '''
          new = '''    public func cancelActiveConnection() {
              cancelActiveConnection(cause: .operatorRequest)
          }

          /// Fails the live foreground-only evidence boundary with a cause-specific
          /// interruption before transport teardown. Product shells should use this
          /// instead of presenting foreground integrity loss as an operator cancel.
          public func invalidateActiveCaptureForForegroundLoss() {
              cancelActiveConnection(cause: .foregroundIntegrityLoss)
          }

          /// Ends transport only after the caller has already frozen its immutable
          /// artifact. This intentionally adds no new interruption to that finalized
          /// evidence timeline.
          public func teardownActiveConnectionAfterFinalization() {
              cancelActiveConnection(cause: .finalizedArtifactTeardown)
          }

          private func cancelActiveConnection(cause: PassiveCoreBluetoothCancellationCause) {
              connectionTimeoutTask?.cancel()
              connectionTimeoutTask = nil
              guard let peripheral = activePeripheral else { return }
              if let diagnosticMessage = cause.diagnosticMessage {
                  lastDiagnostic = diagnosticMessage
              }

              if targetState.selectedTargetIdentifier == peripheral.identifier {
                  if let interruptionReason = cause.interruptionReason {
                      enqueueInterruption(interruptionReason)
                  }
          '''

          if source.count(old) != 1:
              raise SystemExit("expected exactly one legacy cancellation block")
          source = source.replace(old, new, 1)

          old_watchdog = "self.cancelActiveConnection(boundary: .interruptionAlreadyRecorded)"
          new_watchdog = "self.cancelActiveConnection(cause: .interruptionAlreadyRecorded)"
          if source.count(old_watchdog) != 1:
              raise SystemExit("expected exactly one watchdog cancellation call")
          source = source.replace(old_watchdog, new_watchdog, 1)

          path.write_text(source)
          PY

          git diff --check
          test "$(git hash-object "$CONTROLLER_PATH")" = "$EXPECTED_CONTROLLER_BLOB"
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "$CONTROLLER_PATH"
          if grep -n -E '\.writeValue[[:space:]]*\(' "$CONTROLLER_PATH"; then
            echo 'Passive controller must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

          git config user.name 'nembra-lifecycle-bot'
          git config user.email 'nembra-lifecycle-bot@users.noreply.github.com'
          git add "$CONTROLLER_PATH"
          git commit -m '[es80 passive lifecycle] Split transport cancellation causes'
          git push origin HEAD:"$TARGET_BRANCH"
