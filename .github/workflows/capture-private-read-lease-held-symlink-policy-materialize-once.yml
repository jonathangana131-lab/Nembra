name: Capture Private Read Lease Held Symlink Policy Materialize Once

on:
  pull_request:
    branches:
      - hardening/v17-capture-read-lease-held-descriptor-plan-sol-20260814
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: capture-held-symlink-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'repair/v17-capture-read-lease-held-symlink-policy-sol-20260815'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact serial parent and author repair
        shell: bash
        env:
          EXACT_PARENT: 474507966619ce39288b20de29066711088cd986
          MATERIALIZER: .github/workflows/capture-private-read-lease-held-symlink-policy-materialize-once.yml
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          mapfile -t initial_paths < <(git diff --name-only "$EXACT_PARENT"...HEAD)
          test "${#initial_paths[@]}" -eq 1
          test "${initial_paths[0]}" = "$MATERIALIZER"

          python3 <<'PY'
          from pathlib import Path

          helper_path = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py')
          source = helper_path.read_text(encoding='utf-8')

          marker = '\n\ndef _lease_paths(\n'
          if source.count(marker) != 1:
              raise SystemExit('lease-path insertion marker drifted')

          helper_block = r'''

def _normalize_descriptor_symlink_target(
    subject: Path,
    link_relative_parts: tuple[str, ...],
    target_text: str,
) -> tuple[str, ...]:
    """Map one symlink target into the held subject namespace without resolving live paths."""
    if not target_text or "\x00" in target_text:
        raise SelectedXcodeBuildOrchestratorError(
            "private read-lease symlink target is malformed"
        )
    subject = _absolute_lexical(subject)
    target = PurePosixPath(target_text)
    if target.is_absolute():
        lexical_target = Path(os.path.normpath(target_text))
        try:
            relative = lexical_target.relative_to(subject)
        except ValueError as error:
            raise SelectedXcodeBuildOrchestratorError(
                "private read-lease symlink escaped its admitted subject"
            ) from error
        raw_parts = list(relative.parts)
    else:
        raw_parts = [*link_relative_parts[:-1], *target.parts]

    normalized: list[str] = []
    for component in raw_parts:
        if component in ("", "."):
            continue
        if component in (os.sep, "/"):
            continue
        if component == "..":
            if not normalized:
                raise SelectedXcodeBuildOrchestratorError(
                    "private read-lease symlink escaped its admitted subject"
                )
            normalized.pop()
            continue
        if "/" in component or "\x00" in component:
            raise SelectedXcodeBuildOrchestratorError(
                "private read-lease symlink target contains an unsafe component"
            )
        normalized.append(component)
    return tuple(normalized)


def _resolve_descriptor_internal_target(
    subject: Path,
    subject_descriptor: int,
    initial_parts: tuple[str, ...],
) -> None:
    """Require a symlink target to resolve inside one held subject generation."""
    if os.stat not in os.supports_dir_fd or os.readlink not in os.supports_dir_fd:
        raise SelectedXcodeBuildOrchestratorError(
            "private read-lease symlink policy requires descriptor-relative stat/readlink"
        )

    pending = list(initial_parts)
    symlink_hops = 0
    while True:
        if not pending:
            return
        current = os.dup(subject_descriptor)
        resolved: list[str] = []
        restart = False
        try:
            for index, component in enumerate(pending):
                try:
                    metadata = os.stat(
                        component,
                        dir_fd=current,
                        follow_symlinks=False,
                    )
                except OSError as error:
                    raise SelectedXcodeBuildOrchestratorError(
                        "private read-lease symlink target is unavailable in the held subject"
                    ) from error

                if stat.S_ISLNK(metadata.st_mode):
                    symlink_hops += 1
                    if symlink_hops > 40:
                        raise SelectedXcodeBuildOrchestratorError(
                            "private read-lease symlink target exceeded the resolution limit"
                        )
                    try:
                        target_text = os.readlink(component, dir_fd=current)
                    except OSError as error:
                        raise SelectedXcodeBuildOrchestratorError(
                            "private read-lease symlink target changed during descriptor validation"
                        ) from error
                    link_parts = tuple([*resolved, component])
                    rewritten = _normalize_descriptor_symlink_target(
                        subject,
                        link_parts,
                        target_text,
                    )
                    pending = [*rewritten, *pending[index + 1 :]]
                    restart = True
                    break

                is_final = index == len(pending) - 1
                if is_final:
                    if not (stat.S_ISDIR(metadata.st_mode) or stat.S_ISREG(metadata.st_mode)):
                        raise SelectedXcodeBuildOrchestratorError(
                            "private read-lease symlink target has unsupported type"
                        )
                    return
                if not stat.S_ISDIR(metadata.st_mode):
                    raise SelectedXcodeBuildOrchestratorError(
                        "private read-lease symlink target ancestry is not a directory"
                    )
                child = _open_pinned_child(
                    current,
                    component,
                    True,
                    _metadata_signature(metadata),
                )
                os.close(current)
                current = child
                resolved.append(component)
        finally:
            os.close(current)
        if not restart:
            return


def _subject_descriptor_entries(subject: Path, subject_descriptor: int) -> tuple:
    """Enumerate descendants and validate symlinks through the held subject descriptor."""
    subject = _absolute_lexical(subject)
    root_metadata = os.fstat(subject_descriptor)
    if stat.S_ISREG(root_metadata.st_mode):
        return ()
    if not stat.S_ISDIR(root_metadata.st_mode):
        raise SelectedXcodeBuildOrchestratorError(
            "private read-lease held subject has unsupported type"
        )
    if os.stat not in os.supports_dir_fd or os.readlink not in os.supports_dir_fd:
        raise SelectedXcodeBuildOrchestratorError(
            "private read-lease held enumeration requires descriptor-relative stat/readlink"
        )

    entries: list[tuple[Path, bool, tuple[int, int, int], int]] = []

    def walk(directory_descriptor: int, relative_parts: tuple[str, ...]) -> None:
        try:
            names = sorted(os.listdir(directory_descriptor))
        except (OSError, TypeError) as error:
            raise SelectedXcodeBuildOrchestratorError(
                "private read-lease held directory could not be enumerated"
            ) from error
        for name in names:
            if name in ("", ".", "..") or "/" in name or "\x00" in name:
                raise SelectedXcodeBuildOrchestratorError(
                    "private read-lease held directory exposed an unsafe entry name"
                )
            try:
                metadata = os.stat(
                    name,
                    dir_fd=directory_descriptor,
                    follow_symlinks=False,
                )
            except OSError as error:
                raise SelectedXcodeBuildOrchestratorError(
                    "private read-lease held entry changed during enumeration"
                ) from error
            entry_parts = (*relative_parts, name)
            if stat.S_ISLNK(metadata.st_mode):
                try:
                    target_text = os.readlink(name, dir_fd=directory_descriptor)
                except OSError as error:
                    raise SelectedXcodeBuildOrchestratorError(
                        "private read-lease held symlink changed during enumeration"
                    ) from error
                target_parts = _normalize_descriptor_symlink_target(
                    subject,
                    entry_parts,
                    target_text,
                )
                _resolve_descriptor_internal_target(
                    subject,
                    subject_descriptor,
                    target_parts,
                )
                continue

            is_directory = stat.S_ISDIR(metadata.st_mode)
            if not is_directory and not stat.S_ISREG(metadata.st_mode):
                raise SelectedXcodeBuildOrchestratorError(
                    "private read-lease held entry has unsupported type"
                )
            descriptor = _open_pinned_child(
                directory_descriptor,
                name,
                is_directory,
                _metadata_signature(metadata),
            )
            entries.append(
                (
                    subject.joinpath(*entry_parts),
                    is_directory,
                    _descriptor_signature(descriptor),
                    descriptor,
                )
            )
            if is_directory:
                walk(descriptor, entry_parts)

    try:
        walk(subject_descriptor, ())
        return tuple(entries)
    except Exception:
        for _path, _is_directory, _signature, descriptor in reversed(entries):
            try:
                os.close(int(descriptor))
            except OSError:
                pass
        raise
'''

          source = source.replace('from pathlib import Path\n', 'from pathlib import Path, PurePosixPath\n', 1)
          source = source.replace(marker, helper_block + marker, 1)

          old = '''            subject_entries = _subject_entries(
                subject,
                include_signatures=(include_signatures or include_descriptors),
            )
