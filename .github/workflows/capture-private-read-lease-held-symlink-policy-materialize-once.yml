                else:
                    path, is_directory = entry
                    signature = None
                if path in seen:
                    continue
                if include_signatures:
                    ordered.append((path, False, signature))
                else:
                    ordered.append((path, False))
                seen.add(path)
'''
          if source.count(old) != 1:
              raise SystemExit('subject-entry authority block drifted')
          source = source.replace(old, new, 1)
          helper_path.write_text(source, encoding='utf-8')

          test_path = Path('scripts/ci/tests/test_capture_private_read_lease_held_symlink_policy.py')
          test_path.write_text(r'''#!/usr/bin/env python3
"""Regress descriptor-bound internal-symlink policy for the private read lease."""
from __future__ import annotations

import importlib.util
import inspect
import os
from pathlib import Path
import tempfile
import unittest
from unittest import mock

REPO = Path(__file__).resolve().parents[3]
HELPER = REPO / "scripts/ci/capture_selected_xcode_build_orchestrator.py"


def load():
    spec = importlib.util.spec_from_file_location("nembra_held_symlink_policy", HELPER)
    if spec is None or spec.loader is None:
        raise RuntimeError("could not load selected-Xcode orchestrator")
    module = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(module)
    return module


class CapturePrivateReadLeaseHeldSymlinkPolicyTests(unittest.TestCase):
    def test_pathname_generation_swap_cannot_hide_external_symlink_from_held_subject(self) -> None:
        helper = load()
        with tempfile.TemporaryDirectory(prefix="nembra-held-symlink-policy-") as raw:
            outer = Path(raw)
            outer.chmod(0o711)
            repo = outer / "repo"
            subject = repo / "LocalSecrets/TuyaSDK/Build"
            subject.mkdir(parents=True)
            external = outer / "outside"
            external.mkdir()
            (external / "outside.fixture").write_text("outside\n", encoding="utf-8")
            (subject / "escape").symlink_to(external, target_is_directory=True)

            accepted_hold = repo / "LocalSecrets/TuyaSDK/Build.accepted-hold"
            replacement = outer / "replacement-build"
            replacement.mkdir()
            (replacement / "escape").symlink_to(".", target_is_directory=True)

            original_subject_entries = helper._subject_entries
            raced = False

            def classify_replacement_then_restore(path: Path, *, include_signatures: bool = False):
                nonlocal raced
                candidate = Path(path)
                if candidate != subject or raced:
                    return original_subject_entries(candidate, include_signatures=include_signatures)
                subject.rename(accepted_hold)
                replacement.rename(subject)
                try:
                    entries = original_subject_entries(subject, include_signatures=include_signatures)
                finally:
                    subject.rename(replacement)
                    accepted_hold.rename(subject)
                raced = True
                return entries

            def unexpected_acl(_descriptor: int) -> str:
                raise AssertionError("external held symlink reached ACL inspection")

            lease = helper._PrivateReadLease((subject,), repo)
            with (
                mock.patch.object(helper, "_subject_entries", side_effect=classify_replacement_then_restore),
                mock.patch.object(helper, "_acl_listing", side_effect=unexpected_acl),
            ):
                with self.assertRaisesRegex(
                    helper.SelectedXcodeBuildOrchestratorError,
                    "symlink escaped|symlink target",
                ):
                    lease.grant("nembraheldsymlink")
            self.assertTrue(raced)
            self.assertFalse(lease._opened)
            self.assertEqual(lease._principal, "")

    def test_internal_framework_style_symlinks_are_validated_through_held_generation(self) -> None:
        helper = load()
        with tempfile.TemporaryDirectory(prefix="nembra-held-symlink-control-") as raw:
            repo = Path(raw) / "repo"
            subject = repo / "LocalSecrets/TuyaSDK/Build"
            version = subject / "Thing.framework/Versions/A"
            headers = version / "Headers"
            headers.mkdir(parents=True)
            (headers / "Thing.h").write_text("// fixture\n", encoding="utf-8")
            current = subject / "Thing.framework/Versions/Current"
            current.symlink_to("A", target_is_directory=True)
            public_headers = subject / "Thing.framework/Headers"
            public_headers.symlink_to("Versions/Current/Headers", target_is_directory=True)

            plan = helper._lease_paths((subject,), repo, include_descriptors=True)
            try:
                paths = {entry[0] for entry in plan}
                self.assertIn(headers, paths)
                self.assertIn(headers / "Thing.h", paths)
                self.assertNotIn(current, paths)
                self.assertNotIn(public_headers, paths)
            finally:
                for _path, _host_only, _signature, descriptor in reversed(plan):
                    os.close(int(descriptor))

    def test_source_production_descriptor_policy_rechecks_symlinks_from_held_fd(self) -> None:
        helper = load()
        plan = inspect.getsource(helper._lease_paths)
        enumerator = inspect.getsource(helper._subject_descriptor_entries)
        resolver = inspect.getsource(helper._resolve_descriptor_internal_target)
        self.assertIn("_subject_descriptor_entries", plan)
        self.assertIn("os.listdir(directory_descriptor)", enumerator)
        self.assertIn("os.readlink(name, dir_fd=directory_descriptor)", enumerator)
        self.assertIn("subject_descriptor", resolver)
        self.assertIn("_open_pinned_child", resolver)
        self.assertNotIn(".resolve(strict=True)", enumerator)
        self.assertNotIn(".resolve(strict=True)", resolver)


if __name__ == "__main__":
    unittest.main(verbosity=2)
''', encoding='utf-8')

