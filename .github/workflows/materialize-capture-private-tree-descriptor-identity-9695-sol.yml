name: Materialize Capture Private Tree Descriptor Identity 9695

on:
  push:
    branches:
      - fix/v14-capture-private-tree-descriptor-identity-9695-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-private-tree-descriptor-identity-9695-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact lineage and bind descriptor reads to admitted identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9695af19c21c93b3eb4bc867613a6df0c9a3b3d4 HEAD
          test "$(git diff --name-only 9695af19c21c93b3eb4bc867613a6df0c9a3b3d4 HEAD)" = ".github/workflows/materialize-capture-private-tree-descriptor-identity-9695-sol.yml"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Scripts/capture_tuya_private_input_provenance.py')
          source = path.read_text(encoding='utf-8')

          def once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              source = source.replace(old, new, 1)

          once(
              'def _read_stable_regular_file_sha256(path: Path) -> tuple[os.stat_result, str]:',
              'def _read_stable_regular_file_sha256(\n    path: Path,\n    *,\n    expected_identity: tuple[int, ...] | None = None,\n) -> tuple[os.stat_result, str]:',
              'stable-read signature',
          )
          once(
              '        digest = hashlib.sha256()\n        bytes_read = 0\n',
              '        before_identity = _stat_identity(before)\n'
              '        if expected_identity is not None and before_identity != expected_identity:\n'
              '            raise ProvenanceError("private build tree changed before an admitted file was opened")\n\n'
              '        digest = hashlib.sha256()\n        bytes_read = 0\n',
              'pre-read expected identity fence',
          )
          once(
              '        after = os.fstat(descriptor)\n'
              '        if _stat_identity(before) != _stat_identity(after) or bytes_read != after.st_size:\n'
              '            raise ProvenanceError(f"private build input changed while it was fingerprinted: {path.name}")\n',
              '        after = os.fstat(descriptor)\n'
              '        after_identity = _stat_identity(after)\n'
              '        if before_identity != after_identity or bytes_read != after.st_size:\n'
              '            raise ProvenanceError(f"private build input changed while it was fingerprinted: {path.name}")\n'
              '        if expected_identity is not None and after_identity != expected_identity:\n'
              '            raise ProvenanceError("private build tree changed while an admitted file was fingerprinted")\n',
              'post-read expected identity fence',
          )
          once(
              'def _file_fingerprint(path: Path) -> str:\n    metadata, content_sha256 = _read_stable_regular_file_sha256(path)\n',
              'def _file_fingerprint(\n'
              '    path: Path,\n'
              '    *,\n'
              '    expected_identity: tuple[int, ...] | None = None,\n'
              ') -> str:\n'
              '    metadata, content_sha256 = _read_stable_regular_file_sha256(\n'
              '        path,\n'
              '        expected_identity=expected_identity,\n'
              '    )\n',
              'file fingerprint identity plumbing',
          )
          once(
              '                fingerprint = _file_fingerprint(path)',
              '                fingerprint = _file_fingerprint(path, expected_identity=identity)',
              'tree-to-descriptor identity binding',
          )
          path.write_text(source, encoding='utf-8')

          test_path = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py')
          tests = test_path.read_text(encoding='utf-8')
          for helper in ('fingerprint_then_replace', 'fingerprint_then_add'):
              old = f'        def {helper}(path: Path) -> str:\n'
              new = f'        def {helper}(path: Path, **kwargs: object) -> str:\n'
              if tests.count(old) != 1:
                  raise SystemExit(f'{helper}: expected one mock helper anchor')
              tests = tests.replace(old, new, 1)
          old_forward = '            result = original_fingerprint(path)\n'
          if tests.count(old_forward) != 2:
              raise SystemExit(f'expected two legacy fingerprint mock forwards, found {tests.count(old_forward)}')
          tests = tests.replace(old_forward, '            result = original_fingerprint(path, **kwargs)\n')

          anchor = '    def test_tree_rejects_entry_added_after_directory_enumeration(self) -> None:\n'
          if tests.count(anchor) != 1:
              raise SystemExit('ABA regression insertion anchor missing')
          regression = ''.join([
              '    def test_tree_binds_open_descriptor_to_enumerated_file_identity(self) -> None:\n',
              '        target = self.security_build / "ThingSmartCryption.bin"\n',
              '        replacement = self.root / "replacement-before-open.bin"\n',
              '        replacement.write_bytes(b"attacker-replacement-bytes")\n',
              '        original_open = provenance.os.open\n',
              '        original_lstat = Path.lstat\n',
              '        substituted_open = False\n',
              '        post_open_target_lstat_calls = 0\n\n',
              '        def open_replacement(path: object, flags: int, *args: object, **kwargs: object) -> int:\n',
              '            nonlocal substituted_open\n',
              '            if Path(path) == target:\n',
              '                substituted_open = True\n',
              '                return original_open(replacement, flags, *args, **kwargs)\n',
              '            return original_open(path, flags, *args, **kwargs)\n\n',
              '        def lstat_aba(path: Path) -> os.stat_result:\n',
              '            nonlocal post_open_target_lstat_calls\n',
              '            if path == target and substituted_open and post_open_target_lstat_calls == 0:\n',
              '                post_open_target_lstat_calls += 1\n',
              '                return original_lstat(replacement)\n',
              '            return original_lstat(path)\n\n',
              '        with mock.patch.object(provenance.os, "open", side_effect=open_replacement), mock.patch.object(\n',
              '            Path, "lstat", autospec=True, side_effect=lstat_aba\n',
              '        ):\n',
              '            with self.assertRaises(provenance.ProvenanceError):\n',
              '                provenance._tree_fingerprint(self.security_build)\n\n',
              '        self.assertTrue(substituted_open)\n',
              '        self.assertEqual(target.read_bytes(), b"security-bytes-v1")\n\n',
          ])
          test_path.write_text(tests.replace(anchor, regression + anchor, 1), encoding='utf-8')
          PY

      - name: Verify focused provenance custody
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Scripts/capture_tuya_private_input_provenance.py').read_text(encoding='utf-8')
          tests = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py').read_text(encoding='utf-8')
          for token in [
              'expected_identity: tuple[int, ...] | None = None',
              'before_identity != expected_identity',
              'after_identity != expected_identity',
              '_file_fingerprint(path, expected_identity=identity)',
          ]:
              if token not in source:
                  raise SystemExit(f'descriptor/enumeration identity contract missing: {token}')
          if 'test_tree_binds_open_descriptor_to_enumerated_file_identity' not in tests:
              raise SystemExit('pre-open descriptor substitution regression missing')
          print('Capture private-tree descriptor/enumeration identity contract: PASS')
          PY
          git diff --check

      - name: Collapse helper into product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-private-tree-descriptor-identity-9695-sol.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): bind private tree reads to admitted inode'
          git push origin HEAD:fix/v14-capture-private-tree-descriptor-identity-9695-sol
