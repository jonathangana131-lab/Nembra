name: Materialize Capture Private Tree Descriptor Identity 9695

on:
  push:
    branches:
      - fix/v14-capture-private-tree-descriptor-identity-9695-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-private-tree-descriptor-identity-9695-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact product parent and bind descriptor reads to enumeration identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9695af19c21c93b3eb4bc867613a6df0c9a3b3d4"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-capture-private-tree-descriptor-identity-9695-sol.yml"
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('Scripts/capture_tuya_private_input_provenance.py')
          source = source_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              'def _read_stable_regular_file_sha256(path: Path) -> tuple[os.stat_result, str]:',
              'def _read_stable_regular_file_sha256(\n    path: Path,\n    *,\n    expected_identity: tuple[int, ...] | None = None,\n) -> tuple[os.stat_result, str]:',
              'stable-read signature',
          )

          source = replace_once(
              source,
              '''        before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode):
                      raise ProvenanceError(f"required private build input is not a regular file: {path.name}")

                  digest = hashlib.sha256()
          ''',
              '''        before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode):
                      raise ProvenanceError(f"required private build input is not a regular file: {path.name}")
                  before_identity = _stat_identity(before)
                  if expected_identity is not None and before_identity != expected_identity:
                      raise ProvenanceError("private build tree changed before an admitted file was opened")

                  digest = hashlib.sha256()
          ''',
              'pre-read expected identity fence',
          )

          source = replace_once(
              source,
              '''        after = os.fstat(descriptor)
                  if _stat_identity(before) != _stat_identity(after) or bytes_read != after.st_size:
                      raise ProvenanceError(f"private build input changed while it was fingerprinted: {path.name}")

                  try:
          ''',
              '''        after = os.fstat(descriptor)
                  after_identity = _stat_identity(after)
                  if before_identity != after_identity or bytes_read != after.st_size:
                      raise ProvenanceError(f"private build input changed while it was fingerprinted: {path.name}")
                  if expected_identity is not None and after_identity != expected_identity:
                      raise ProvenanceError("private build tree changed while an admitted file was fingerprinted")

                  try:
          ''',
              'post-read expected identity fence',
          )

          source = replace_once(
              source,
              '''def _file_fingerprint(path: Path) -> str:
                  metadata, content_sha256 = _read_stable_regular_file_sha256(path)
          ''',
              '''def _file_fingerprint(
                  path: Path,
                  *,
                  expected_identity: tuple[int, ...] | None = None,
              ) -> str:
                  metadata, content_sha256 = _read_stable_regular_file_sha256(
                      path,
                      expected_identity=expected_identity,
                  )
          ''',
              'file fingerprint expected identity plumbing',
          )

          source = replace_once(
              source,
              '                fingerprint = _file_fingerprint(path)',
              '                fingerprint = _file_fingerprint(path, expected_identity=identity)',
              'tree file admission binding',
          )
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '    def test_tree_rejects_entry_added_after_directory_enumeration(self) -> None:\n'
          if tests.count(anchor) != 1:
              raise SystemExit('ABA regression insertion anchor missing')
          regression = '''    def test_tree_binds_open_descriptor_to_enumerated_file_identity(self) -> None:
              target = self.security_build / "ThingSmartCryption.bin"
              replacement = self.root / "replacement-before-open.bin"
              replacement.write_bytes(b"attacker-replacement-bytes")
              original_open = provenance.os.open
              original_lstat = Path.lstat
              substituted_open = False
              post_open_target_lstat_calls = 0

              def open_replacement(path: object, flags: int, *args: object, **kwargs: object) -> int:
                  nonlocal substituted_open
                  if Path(path) == target:
                      substituted_open = True
                      return original_open(replacement, flags, *args, **kwargs)
                  return original_open(path, flags, *args, **kwargs)

              def lstat_aba(path: Path) -> os.stat_result:
                  nonlocal post_open_target_lstat_calls
                  if path == target and substituted_open and post_open_target_lstat_calls == 0:
                      post_open_target_lstat_calls += 1
                      return original_lstat(replacement)
                  return original_lstat(path)

              with mock.patch.object(provenance.os, "open", side_effect=open_replacement), mock.patch.object(
                  Path,
                  "lstat",
                  autospec=True,
                  side_effect=lstat_aba,
              ):
                  with self.assertRaises(provenance.ProvenanceError):
                      provenance._tree_fingerprint(self.security_build)

              self.assertTrue(substituted_open)
              self.assertEqual(target.read_bytes(), b"security-bytes-v1")

          '''.replace('          ', '')
          test_path.write_text(tests.replace(anchor, regression + anchor, 1), encoding='utf-8')
          PY

      - name: Verify focused provenance custody
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Scripts/capture_tuya_private_input_provenance.py').read_text(encoding='utf-8')
          for token in [
              'expected_identity: tuple[int, ...] | None = None',
              'before_identity != expected_identity',
              'after_identity != expected_identity',
              '_file_fingerprint(path, expected_identity=identity)',
          ]:
              if token not in source:
                  raise SystemExit(f'descriptor/enumeration identity contract missing: {token}')
          print('Capture private-tree descriptor/enumeration identity contract: PASS')
          PY
          git diff --check

      - name: Collapse helper into product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-private-tree-descriptor-identity-9695-sol.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): bind private tree reads to admitted inode'
          git push origin HEAD:fix/v14-capture-private-tree-descriptor-identity-9695-sol
