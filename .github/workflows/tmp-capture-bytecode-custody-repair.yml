name: Temporary Capture Bytecode Custody Repair

on:
  push:
    branches:
      - agent/v14-capture-final-bytecode-provenance-sol
    paths:
      - .github/workflows/tmp-capture-bytecode-custody-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-final-bytecode-provenance-sol
          fetch-depth: 0

      - name: Disable private-reader bytecode writes
        shell: bash
        env:
          EXPECTED_PARENT: b7581ca6090276025e2bcde16429e193aeaff39c
          BRANCH: agent/v14-capture-final-bytecode-provenance-sol
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" "$actual")" = '.github/workflows/tmp-capture-bytecode-custody-repair.yml'

          python3 - <<'PY'
          from pathlib import Path

          installer = Path('scripts/field/install_one_time_capture.command')
          text = installer.read_text()
          old = '/usr/bin/python3 -I - "$PRIVATE_DEVICE_RUNNER" "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" "$ROOT"'
          new = '/usr/bin/python3 -I -B - "$PRIVATE_DEVICE_RUNNER" "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" "$ROOT"'
          if text.count(old) != 1:
              raise SystemExit('installer private-reader invocation did not match exact expected pre-repair form')
          if new in text:
              raise SystemExit('installer already contains hardened private-reader invocation')
          installer.write_text(text.replace(old, new, 1))
          PY

          bash -n scripts/field/install_one_time_capture.command
          grep -Fq '/usr/bin/python3 -I -B - "$PRIVATE_DEVICE_RUNNER" "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" "$ROOT"' scripts/field/install_one_time_capture.command
          ! grep -Fq '/usr/bin/python3 -I - "$PRIVATE_DEVICE_RUNNER" "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" "$ROOT"' scripts/field/install_one_time_capture.command

          git config user.name 'nembra-v14-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/field/install_one_time_capture.command
          test "$(git diff --cached --name-only)" = 'scripts/field/install_one_time_capture.command'
          git commit -m 'fix(capture): suppress private reader bytecode writes'
          git push origin "HEAD:$BRANCH"
