name: Materialize Capture delivery receipt primitive

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/materialize-capture-delivery-receipt-primitive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXACT_PARENT: 29fb304613c142ba99e1259e9d612c1919309145
      LEDGER_PATH: Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift
      TEST_PATH: Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationDeliveryReceiptLedgerTests.swift
      WORKFLOW_PATH: .github/workflows/materialize-capture-delivery-receipt-primitive.yml
      EXPECTED_LEDGER_BLOB: 0c63683d44f39429b4c145e6f3433bc5c4375173
    steps:
      - name: Checkout immutable child head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact parent and one-shot input
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          test "$(git rev-parse "$EXACT_PARENT:$LEDGER_PATH")" = "$EXPECTED_LEDGER_BLOB"
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          printf '%s\n' "$WORKFLOW_PATH" | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git diff --check "$EXACT_PARENT"...HEAD
          test ! -e "$TEST_PATH"

      - name: Materialize opaque token-bound receipt primitive
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift')
          text = path.read_text(encoding='utf-8')

          actor_marker = '''/// Owns the non-secret chronology consumed by `TuyaAuthenticatedReadOnlyPreflight`.\n'''
          if text.count(actor_marker) != 1:
              raise SystemExit('receipt insertion marker must match exactly once')
          receipt = '''/// Opaque package-owned monotonic receipt captured at trusted application-callback delivery.\n///\n/// The caller may request a receipt for an already-issued connection token, but cannot choose or\n/// rewrite its monotonic timestamp. `recordApplicationUpdate` also revalidates exact token ownership\n/// before the receipt may move accepted chronology.\npublic struct TuyaReadOnlyApplicationReceipt: Sendable {\n    fileprivate let token: TuyaReadOnlyConnectionToken\n    fileprivate let receivedAtUptimeNanoseconds: UInt64\n\n    fileprivate init(\n        token: TuyaReadOnlyConnectionToken,\n        receivedAtUptimeNanoseconds: UInt64\n    ) {\n        self.token = token\n        self.receivedAtUptimeNanoseconds = receivedAtUptimeNanoseconds\n    }\n\n    public static func capture(for token: TuyaReadOnlyConnectionToken) -> Self {\n        Self(\n            token: token,\n            receivedAtUptimeNanoseconds: DispatchTime.now().uptimeNanoseconds\n        )\n    }\n}\n\n'''
          text = text.replace(actor_marker, receipt + actor_marker, 1)

          start_marker = '    public func recordApplicationUpdate(\n'
          end_marker = '    /// Advances only the non-secret liveness observation for the current authenticated connection.\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('recordApplicationUpdate start marker missing')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('recordApplicationUpdate end marker missing')
          old = text[start:end]
          if old.count('public func recordApplicationUpdate(') != 1:
              raise SystemExit('expected exactly one legacy application-update mutation in replacement section')
          for required in [
              'let now = try nextMonotonicObservation()',
              'try requireContinuousAuthenticatedObservation(at: now)',
              'try requireIncompleteObservationHorizonOpen(at: now)',
              'applicationPayloadCount += 1',
          ]:
              if required not in old:
                  raise SystemExit(f'legacy mutation shape drifted: {required}')
          if 'TuyaReadOnlyApplicationReceipt' in old:
              raise SystemExit('receipt primitive already present in legacy mutation')

          replacement = '''    /// Compatibility admission for callers that do not own an earlier trusted delivery boundary.\n    /// It preserves the historical actor-entry chronology by sampling the ledger clock only after\n    /// exact-token/authentication/non-empty validation. The field app should prefer the explicit\n    /// receipt overload when it has a synchronous SDK callback-delivery boundary.\n    public func recordApplicationUpdate(\n        isNonEmpty: Bool,\n        for token: TuyaReadOnlyConnectionToken\n    ) throws {\n        try requireCurrent(token)\n        guard case .authenticated = authenticationState else {\n            throw MutationError.authenticationRequired\n        }\n        guard isNonEmpty else {\n            throw MutationError.emptyApplicationUpdate\n        }\n\n        let legacyReceipt = TuyaReadOnlyApplicationReceipt(\n            token: token,\n            receivedAtUptimeNanoseconds: try nextMonotonicObservation()\n        )\n        try admitApplicationUpdate(receipt: legacyReceipt)\n    }\n\n    /// Records a non-empty application update at its package-owned delivery receipt instant.\n    ///\n    /// The opaque receipt is bound to the exact connection token and carries no caller-selected\n    /// scalar time. Continuity and the strict incomplete-session horizon are evaluated against that\n    /// captured delivery instant, so later actor scheduling cannot move a pre-cut callback past the\n    /// cutoff or rescue a genuinely post-cut callback.\n    public func recordApplicationUpdate(\n        isNonEmpty: Bool,\n        receipt: TuyaReadOnlyApplicationReceipt,\n        for token: TuyaReadOnlyConnectionToken\n    ) throws {\n        try requireCurrent(token)\n        guard receipt.token == token else {\n            throw MutationError.staleConnection\n        }\n        guard case .authenticated = authenticationState else {\n            throw MutationError.authenticationRequired\n        }\n        guard isNonEmpty else {\n            throw MutationError.emptyApplicationUpdate\n        }\n\n        try admitApplicationUpdate(receipt: receipt)\n    }\n\n    private func admitApplicationUpdate(receipt: TuyaReadOnlyApplicationReceipt) throws {\n        let now = receipt.receivedAtUptimeNanoseconds\n        try requireContinuousAuthenticatedObservation(at: now)\n        try requireIncompleteObservationHorizonOpen(at: now)\n        guard let authenticatedAt = authenticatedAtUptimeNanoseconds,\n              now >= authenticatedAt else {\n            throw MutationError.monotonicClockRegressed\n        }\n        guard applicationPayloadCount < Int.max else {\n            throw MutationError.applicationPayloadCountExhausted\n        }\n\n        applicationPayloadCount += 1\n        latestApplicationPayloadUptimeNanoseconds = now\n        latestObservedUptimeNanoseconds = now\n    }\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          cat > "$TEST_PATH" <<'SWIFT'
          import Dispatch
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          extension TuyaAuthenticatedReadOnlySessionLedgerTests {
              @Test("opaque receipt preserves callback delivery time across delayed actor admission")
              func applicationReceiptPreservesDeliveryInstant() async throws {
                  let baseline = DispatchTime.now().uptimeNanoseconds
                  let clock = TestUptimeClock(baseline)
                  let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
                  let token = try await ledger.beginConnection()
                  try await ledger.markAuthenticationStarted(for: token)
                  try await ledger.markAuthenticated(for: token, method: .smartLifeAppSDK)

                  let receipt = TuyaReadOnlyApplicationReceipt.capture(for: token)

                  // Move the actor's injected execution clock beyond the strict incomplete-session
                  // horizon. The explicit receipt path must still evaluate the already-delivered
                  // callback at its earlier package-owned receipt instant rather than this later
                  // actor execution time.
                  clock.advance(
                      to: baseline
                          + TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds
                          + 1
                  )
                  try await ledger.recordApplicationUpdate(
                      isNonEmpty: true,
                      receipt: receipt,
                      for: token
                  )

                  let snapshot = await ledger.currentPreflightSnapshot()
                  #expect(snapshot.applicationPayloadCount == 1)
                  let payloadTime = try #require(snapshot.latestApplicationPayloadUptimeNanoseconds)
                  #expect(payloadTime >= baseline)
                  #expect(
                      payloadTime - baseline
                          < TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds
                  )
              }

              @Test("application receipt cannot cross exact connection-token ownership")
              func applicationReceiptIsBoundToExactConnectionToken() async throws {
                  let firstLedger = TuyaAuthenticatedReadOnlySessionLedger()
                  let secondLedger = TuyaAuthenticatedReadOnlySessionLedger()
                  let first = try await firstLedger.beginConnection()
                  let second = try await secondLedger.beginConnection()
                  try await secondLedger.markAuthenticationStarted(for: second)
                  try await secondLedger.markAuthenticated(for: second, method: .smartLifeAppSDK)

                  let foreignReceipt = TuyaReadOnlyApplicationReceipt.capture(for: first)
                  await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection) {
                      try await secondLedger.recordApplicationUpdate(
                          isNonEmpty: true,
                          receipt: foreignReceipt,
                          for: second
                      )
                  }

                  let snapshot = await secondLedger.currentPreflightSnapshot()
                  #expect(snapshot.applicationPayloadCount == 0)
                  #expect(snapshot.latestApplicationPayloadUptimeNanoseconds == nil)
              }

              @Test("receipt source surface exposes no caller-selected timestamp initializer")
              func applicationReceiptSourceIsOpaqueAndPackageTimed() throws {
                  let source = try readDeliveryReceiptRepositoryFile(
                      "Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift"
                  )
                  let receipt = try deliveryReceiptSection(
                      in: source,
                      from: "public struct TuyaReadOnlyApplicationReceipt",
                      to: "public actor TuyaAuthenticatedReadOnlySessionLedger"
                  )
                  let mutation = try deliveryReceiptSection(
                      in: source,
                      from: "public func recordApplicationUpdate(",
                      to: "public func observeCurrentConnection("
                  )

                  #expect(receipt.contains("fileprivate let token: TuyaReadOnlyConnectionToken"))
                  #expect(receipt.contains("fileprivate let receivedAtUptimeNanoseconds: UInt64"))
                  #expect(receipt.contains("public static func capture(for token: TuyaReadOnlyConnectionToken)"))
                  #expect(receipt.contains("DispatchTime.now().uptimeNanoseconds"))
                  #expect(!receipt.contains("public init("))
                  #expect(!receipt.contains("public static func capture(for token: TuyaReadOnlyConnectionToken, receivedAtUptimeNanoseconds:"))

                  #expect(mutation.contains("receipt: TuyaReadOnlyApplicationReceipt"))
                  #expect(mutation.contains("receipt.token == token"))
                  #expect(mutation.contains("let now = receipt.receivedAtUptimeNanoseconds"))
                  #expect(mutation.contains("try requireContinuousAuthenticatedObservation(at: now)"))
                  #expect(mutation.contains("try requireIncompleteObservationHorizonOpen(at: now)"))
                  #expect(!mutation.contains("public func recordApplicationUpdate(\n        isNonEmpty: Bool,\n        receipt: TuyaReadOnlyApplicationReceipt,\n        receivedAtUptimeNanoseconds:"))
              }
          }

          private func deliveryReceiptSection(in source: String, from start: String, to end: String) throws -> String {
              guard let a = source.range(of: start),
                    let b = source.range(of: end, range: a.upperBound..<source.endIndex) else {
                  Issue.record("Expected delivery-receipt source section missing: \(start) ... \(end)")
                  throw DeliveryReceiptSourceError.sectionMissing
              }
              return String(source[a.lowerBound..<b.lowerBound])
          }

          private func readDeliveryReceiptRepositoryFile(_ relativePath: String) throws -> String {
              let root = URL(fileURLWithPath: #filePath)
                  .deletingLastPathComponent()
                  .deletingLastPathComponent()
                  .deletingLastPathComponent()
                  .deletingLastPathComponent()
                  .deletingLastPathComponent()
              return try String(contentsOf: root.appendingPathComponent(relativePath), encoding: .utf8)
          }

          private enum DeliveryReceiptSourceError: Error {
              case sectionMissing
          }
          SWIFT

          rm "$WORKFLOW_PATH"

      - name: Verify final package-only delta
        run: |
          set -euo pipefail
          git diff --check
          # Stage the generated test and workflow deletion before comparing to the construction
          # parent; ordinary `git diff <commit>` deliberately ignores untracked files.
          git add -A "$LEDGER_PATH" "$TEST_PATH" "$WORKFLOW_PATH"
          git diff --cached --name-only "$EXACT_PARENT" | LC_ALL=C sort > "$RUNNER_TEMP/final-actual"
          printf '%s\n' "$LEDGER_PATH" "$TEST_PATH" | LC_ALL=C sort > "$RUNNER_TEMP/final-expected"
          diff -u "$RUNNER_TEMP/final-expected" "$RUNNER_TEMP/final-actual"
          git diff --cached --check "$EXACT_PARENT"
          grep -Fq 'public struct TuyaReadOnlyApplicationReceipt' "$LEDGER_PATH"
          grep -Fq 'public static func capture(for token: TuyaReadOnlyConnectionToken)' "$LEDGER_PATH"
          grep -Fq 'receipt.token == token' "$LEDGER_PATH"
          grep -Fq 'let now = receipt.receivedAtUptimeNanoseconds' "$LEDGER_PATH"
          grep -Fq 'applicationReceiptPreservesDeliveryInstant' "$TEST_PATH"
          grep -Fq 'applicationReceiptIsBoundToExactConnectionToken' "$TEST_PATH"

      - name: Commit product primitive and retire materializer
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'nembra-delivery-receipt-materializer'
          git config user.email 'nembra-delivery-receipt-materializer@users.noreply.github.com'
          git commit -m 'capture: preserve trusted application callback receipt time'
          git push origin "HEAD:$BRANCH"
