name: Temporary retained-generation prerequisite recovery fix

on:
  push:
    branches:
      - red/v14-capture-retained-prerequisite-recovery-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: red/v14-capture-retained-prerequisite-recovery-sol
          fetch-depth: 0

      - name: Guard exact isolated ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e7af19bf1d9b21c2b184c2a8c403d0d86dbc06c7 HEAD
          changed="$(git diff --name-only e7af19bf1d9b21c2b184c2a8c403d0d86dbc06c7..HEAD | sort)"
          expected=$(printf '%s\n' \
            '.github/workflows/tmp-retained-prerequisite-recovery-fix.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaRetainedGenerationPrerequisiteRecoverySourceTests.swift' | sort)
          test "$changed" = "$expected"

      - name: Tighten failed prerequisite routing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()
          replacements = {
              "            } else if !sdkAccount.loggedIn || !test.sdkAccountLoggedIn {":
              "            } else if test.canRestartFromFreshOFF1 && (!sdkAccount.loggedIn || !test.sdkAccountLoggedIn) {",
              "            } else if !test.sdkDeviceMembershipVerified || !test.accountIdentityLeaseIsAuthorized {":
              "            } else if test.canRestartFromFreshOFF1 && test.sdkAccountLoggedIn && (!test.sdkDeviceMembershipVerified || !test.accountIdentityLeaseIsAuthorized) {",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one recovery anchor, found {count}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Align recovery regressions with the retired-generation authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          current_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFailedPrerequisiteRecoverySourceTests.swift")
          current = current_path.read_text()
          old1 = '#expect(body.contains("!sdkAccount.loggedIn || !test.sdkAccountLoggedIn"))'
          new1 = '#expect(body.contains("test.canRestartFromFreshOFF1 && (!sdkAccount.loggedIn || !test.sdkAccountLoggedIn)"))'
          old2 = '#expect(body.contains("!test.sdkDeviceMembershipVerified || !test.accountIdentityLeaseIsAuthorized"))'
          new2 = '#expect(body.contains("test.canRestartFromFreshOFF1 && test.sdkAccountLoggedIn && (!test.sdkDeviceMembershipVerified || !test.accountIdentityLeaseIsAuthorized)"))'
          if current.count(old1) != 1 or current.count(old2) != 1:
              raise SystemExit("current recovery regression anchors changed")
          current_path.write_text(current.replace(old1, new1, 1).replace(old2, new2, 1))

          red_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaRetainedGenerationPrerequisiteRecoverySourceTests.swift")
          red = red_path.read_text()
          red = red.replace(
              "test.canRestartFromFreshOFF1 && test.privateConfig && (!sdkAccount.loggedIn || !test.sdkAccountLoggedIn)",
              "test.canRestartFromFreshOFF1 && (!sdkAccount.loggedIn || !test.sdkAccountLoggedIn)",
          )
          red_path.write_text(red)
          PY

      - name: Validate invariant
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          red = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaRetainedGenerationPrerequisiteRecoverySourceTests.swift').read_text()
          current = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFailedPrerequisiteRecoverySourceTests.swift').read_text()
          login = 'test.canRestartFromFreshOFF1 && (!sdkAccount.loggedIn || !test.sdkAccountLoggedIn)'
          membership = 'test.canRestartFromFreshOFF1 && test.sdkAccountLoggedIn && (!test.sdkDeviceMembershipVerified || !test.accountIdentityLeaseIsAuthorized)'
          for source in (app, red, current):
              assert login in source
              assert membership in source
          assert 'phase == .failed && currentConnectionToken == nil && localBLESettlementToken == nil && driver == nil' in app
          assert 'procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier' in app
          assert 'schemaVersion: 10' in app
          PY
          git diff --check

      - name: Commit clean fix
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-retained-prerequisite-recovery-fix.yml
          git config user.name nembra-go-bot
          git config user.email nembra-go-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): gate prerequisite recovery by retired generation'
          git push origin HEAD:red/v14-capture-retained-prerequisite-recovery-sol
