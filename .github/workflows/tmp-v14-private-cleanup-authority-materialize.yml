name: tmp V14 Private Failure Cleanup Authority Materializer

on:
  push:
    branches:
      - repair/v14-private-recovery-unlink-race-sol-4f57unlink-20260811
    paths:
      - .github/workflows/tmp-v14-private-cleanup-authority-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5

      - name: Bind expected-red construction lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'd02180056ae2922453c73c127ddf71ea1fa68eac'
          test "$(git rev-parse HEAD^^)" = '2f8f3aa939dab85c8231d44047dcfc42b0064da5'
          changed="$(git diff --name-only 2f8f3aa939dab85c8231d44047dcfc42b0064da5...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-v14-private-cleanup-authority-materialize.yml' \
            'scripts/ci/tmp_v14_private_cleanup_authority_materialize.py' | sort)"
          test "$changed" = "$expected"

      - name: Materialize descriptor-only failure sanitation
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tmp_v14_private_cleanup_authority_materialize.py

      - name: Validate full private publication adversarial suite
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_recovery_unlink_race.py
          /usr/bin/python3 -I Scripts/provision_capture_tuya_identity_writer.py --self-test
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_publication_races.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_destination_ancestor_swap_current.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_crash_residue.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_recovery_unlink_race.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_final_name_binding_2874.py
          /bin/bash -n Scripts/provision_capture_tuya_identity.sh
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib

          writer = Path('Scripts/provision_capture_tuya_identity_writer.py').read_bytes()
          digest = hashlib.sha256(writer).hexdigest()
          shell = Path('Scripts/provision_capture_tuya_identity.sh').read_text(encoding='utf-8')
          swift = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift').read_text(encoding='utf-8')
          assert f'WRITER_SHA256="{digest}"' in shell
          assert digest in swift
          PY
          git diff --check

      - name: Publish durable non-temporary bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nembra Swarm'
          git config user.email 'noreply@users.noreply.github.com'
          git add \
            Scripts/provision_capture_tuya_identity_writer.py \
            Scripts/provision_capture_tuya_identity.sh \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift \
            scripts/ci/tests/test_capture_private_identity_recovery_unlink_race.py
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Capture P0: keep failure cleanup on held inode authority'
          git push origin "HEAD:${GITHUB_REF_NAME}"
