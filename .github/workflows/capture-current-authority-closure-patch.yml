name: Capture Current Authority Closure Patch

on:
  push:
    branches:
      - integration/v14-capture-current-authority-closure-sol
    paths:
      - .github/workflows/capture-current-authority-closure-patch.yml
      - Scripts/apply_capture_current_authority_closure.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-current-authority-closure-sol
          fetch-depth: 0
      - name: Apply authority closure and self-retire
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 Scripts/apply_capture_current_authority_closure.py 2>PATCH_FAILURE.txt; then
            git config user.name nembra-v14-integration
            git config user.email actions@users.noreply.github.com
            git add PATCH_FAILURE.txt
            git commit -m "chore(capture): persist authority patch failure label"
            git push origin HEAD:integration/v14-capture-current-authority-closure-sol
            exit 0
          fi
          rm -f PATCH_FAILURE.txt
          rm Scripts/apply_capture_current_authority_closure.py
          rm .github/workflows/capture-current-authority-closure-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): close target and preflight authority gaps"
          git push origin HEAD:integration/v14-capture-current-authority-closure-sol
