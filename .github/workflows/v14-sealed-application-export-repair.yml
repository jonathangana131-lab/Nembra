name: V14 sealed application export repair

on:
  push:
    branches:
      - repair/v14-capture-sealed-application-export-prefix-v2-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Verify exact flagship parent
        run: test "$(git rev-parse HEAD^^)" = "6efc2677ad9c83cbd8c2b84b152dd98a7d1c8b8b"

      - name: Patch and validate portable contracts
        run: |
          python3 scripts/ci/v14_sealed_application_export_prefix_patch.py
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift

      - name: Commit clean product delta
        env:
          BRANCH: repair/v14-capture-sealed-application-export-prefix-v2-sol
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EVENT_SHA"
          rm scripts/ci/v14_sealed_application_export_prefix_patch.py
          rm .github/workflows/v14-sealed-application-export-repair.yml
          git config user.name "nembra-v14-integration"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift scripts/ci/v14_sealed_application_export_prefix_patch.py .github/workflows/v14-sealed-application-export-repair.yml
          git commit -m "fix(capture): freeze accepted structured application evidence"
          git push origin "HEAD:$BRANCH"
