name: Capture terminal controller semantic exact-current convergence

on:
  push:
    branches:
      - feature/capture-v14-terminal-fresh-handoff-current-gpt56
    paths:
      - .github/workflows/capture-terminal-controller-semantic-current-gpt56.yml

permissions:
  contents: write

jobs:
  compose-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/capture-v14-terminal-fresh-handoff-current-gpt56
          fetch-depth: 2

      - name: Verify exact staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0e30036959fe805c2151f20dbad5156ce3f81448"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-terminal-controller-semantic-current-gpt56.yml"

      - name: Compose controller terminal handoff on current truth
        shell: bash
        run: |
          set -euo pipefail
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          controller_test=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerTerminalFreshSessionConsumerTests.swift
          helper=scripts/ci/capture_terminal_controller_semantic_current_gpt56.py

          python3 "$helper"
          git fetch --no-tags origin ee875d3207f456658b9967b89f80e1f7a65b4353
          git show ee875d3207f456658b9967b89f80e1f7a65b4353:$controller_test > "$controller_test"
          git add "$controller" "$controller_test"

          rm .github/workflows/capture-terminal-controller-semantic-current-gpt56.yml "$helper"
          git add -u .github/workflows/capture-terminal-controller-semantic-current-gpt56.yml "$helper"
          git diff --cached --check

          test "$(grep -c 'pendingTerminalQueueResolution' "$controller")" -ge "4"
          test "$(grep -c 'completeTerminalFreshTargetSessionIfReady' "$controller")" -ge "3"
          grep -q 'PassiveCoreBluetoothTerminalFreshTargetSession.create' "$controller"
          grep -q 'reopenAfterTerminalFreshTargetSession' "$controller"
          grep -q 'pendingTerminalQueueResolution = terminalResolution' "$controller"
          grep -q 'pendingTerminalQueueResolution = nil' "$controller"

          test "$(grep -c 'func connectUsingExperimentOneAdmission(' "$controller")" = "1"
          test "$(grep -c 'admission.consume()' "$controller")" = "1"
          test "$(grep -c 'latestAdvertisement.receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds' "$controller")" = "1"
          test "$(grep -c 'recorder = payload.recorder' "$controller")" = "1"
          grep -q 'validateBoundaryAuthority(admission.authority)' "$controller"
          test "$(grep -c 'try self.requireForegroundEvidenceIntegrity()' "$controller")" -ge "4"
          grep -q 'let recordedReadyFailure = error' "$controller"
          grep -q 'let recordedHorizonFailure = error' "$controller"
          test "$(grep -c 'foregroundEvidenceIntegrityValid = false' "$controller")" = "1"
          test "$(grep -c 'try? self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit' "$controller" || true)" = "0"
          test "$(grep -c 'try? observationBoundaryQueueGate.abortRecordedHorizonBeforeGateCommit' "$controller" || true)" = "0"

          test -f "$controller_test"
          test ! -e .github/workflows/capture-terminal-controller-semantic-current-gpt56.yml
          test ! -e "$helper"

      - name: Commit product-only controller convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-chatgpt56-thinking"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: consume terminal resolution into exact fresh recorder"
          git push origin HEAD:feature/capture-v14-terminal-fresh-handoff-current-gpt56
