name: Capture final staging ownership hot-swap

on:
  push:
    branches:
      - fix/es80-v14-final-staging-cleanup-ownership-r2/gpt56-thinking-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-v14-final-staging-cleanup-ownership-r2/gpt56-thinking-go
          fetch-depth: 0

      - name: Bind staging cleanup to successful ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          producer = Path("scripts/ci/xcode27_signed_field_candidate.sh")
          test_path = Path("scripts/ci/tests/test_xcode27_signed_field_candidate_source.py")
          text = producer.read_text(encoding="utf-8")
          tests = test_path.read_text(encoding="utf-8")
          if "FINAL_STAGING_OWNED" in text:
              raise SystemExit("staging ownership guard already present")
          declaration = 'FINAL_STAGING_DIR="$ARTIFACTS_PARENT/.nembra-field-candidate-$BUILD_INSTANCE_ID.staging"\n'
          if text.count(declaration) != 1:
              raise SystemExit("unexpected final staging declaration")
          text = text.replace(declaration, declaration + 'FINAL_STAGING_OWNED=0\n', 1)
          cleanup = '  if [[ -n "${FINAL_STAGING_DIR:-}" && -e "$FINAL_STAGING_DIR" ]]; then\n    rm -rf "$FINAL_STAGING_DIR"\n  fi\n'
          guarded_cleanup = '  if [[ "${FINAL_STAGING_OWNED:-0}" == "1" && -n "${FINAL_STAGING_DIR:-}" && -e "$FINAL_STAGING_DIR" ]]; then\n    rm -rf "$FINAL_STAGING_DIR"\n  fi\n'
          if text.count(cleanup) != 1:
              raise SystemExit("unexpected final staging cleanup block")
          text = text.replace(cleanup, guarded_cleanup, 1)
          mkdir_line = 'mkdir "$FINAL_STAGING_DIR"\n'
          if text.count(mkdir_line) != 1:
              raise SystemExit("unexpected final staging mkdir")
          text = text.replace(mkdir_line, mkdir_line + 'FINAL_STAGING_OWNED=1\n', 1)
          handoff = 'FINAL_STAGING_DIR=""\n\necho "Signed Nembra iOS field-build CANDIDATE retained at: $ARTIFACTS_DIR"\n'
          replacement = 'FINAL_STAGING_DIR=""\nFINAL_STAGING_OWNED=0\n\necho "Signed Nembra iOS field-build CANDIDATE retained at: $ARTIFACTS_DIR"\n'
          if text.count(handoff) != 1:
              raise SystemExit("unexpected final staging ownership handoff")
          text = text.replace(handoff, replacement, 1)
          test_anchor = '        self.assertIn(\'FINAL_STAGING_DIR="$ARTIFACTS_PARENT/.nembra-field-candidate-$BUILD_INSTANCE_ID.staging"\', self.source)\n'
          if tests.count(test_anchor) != 1:
              raise SystemExit("unexpected atomic publication test anchor")
          additions = (
              test_anchor
              + '        self.assertIn(\'FINAL_STAGING_OWNED=0\', self.source)\n'
              + '        self.assertIn(\'if [[ "${FINAL_STAGING_OWNED:-0}" == "1" && -n "${FINAL_STAGING_DIR:-}" && -e "$FINAL_STAGING_DIR" ]]\', self.source)\n'
              + '        self.assertIn(\'mkdir "$FINAL_STAGING_DIR"\\nFINAL_STAGING_OWNED=1\', self.source)\n'
              + '        self.assertIn(\'FINAL_STAGING_DIR=""\\nFINAL_STAGING_OWNED=0\', self.source)\n'
          )
          tests = tests.replace(test_anchor, additions, 1)
          producer.write_text(text, encoding="utf-8")
          test_path.write_text(tests, encoding="utf-8")
          subprocess.run(["bash", "-n", str(producer)], check=True)
          subprocess.run([sys.executable, str(test_path)], check=True)
          PY
          test "$(stat -c '%a' scripts/ci/xcode27_signed_field_candidate.sh)" = "755"
          test "$(stat -c '%a' scripts/ci/tests/test_xcode27_signed_field_candidate_source.py)" = "755"
          git diff --check

      - name: Commit repair and remove transformer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-final-staging-ownership-hot-swap.yml
          git config user.name "nembra-v14-transform"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/xcode27_signed_field_candidate.sh scripts/ci/tests/test_xcode27_signed_field_candidate_source.py .github/workflows/capture-final-staging-ownership-hot-swap.yml
          git diff --cached --check
          git commit -m "[Capture producer v14] Own staging cleanup before deletion"
          git push origin HEAD:fix/es80-v14-final-staging-cleanup-ownership-r2/gpt56-thinking-go
