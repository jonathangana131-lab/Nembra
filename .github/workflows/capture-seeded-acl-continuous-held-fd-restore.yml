name: Capture Seeded ACL Continuous Held-FD Restore

on:
  pull_request:
    paths:
      - .github/workflows/capture-seeded-acl-continuous-held-fd-restore.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  classify-seeded-held-fd-restore:
    if: github.head_ref == 'validation/v17-capture-seeded-acl-continuous-held-fd-sol-20260817'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          parent='5a6ecdf76917ec1e447d816941ada060bd4d44bd'
          /usr/bin/git merge-base --is-ancestor "$parent" HEAD
          changed="$(/usr/bin/git diff --name-only "$parent"...HEAD)"
          test "$changed" = '.github/workflows/capture-seeded-acl-continuous-held-fd-restore.yml'
          /usr/bin/git diff --check "$parent"...HEAD
          /usr/bin/git diff --quiet "$parent"...HEAD -- scripts/ci/capture_selected_xcode_build_orchestrator.py

      - name: Prove captured seeded baseline restores through continuously held original fd
        id: oracle
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          field_user="$(/usr/bin/id -un)"
          field_uid="$(/usr/bin/id -u)"
          field_gid="$(/usr/bin/id -g)"
          test "$field_uid" != '0'

          work="$(mktemp -d "$RUNNER_TEMP/nembra-seeded-held-fd.XXXXXX")"
          root="$(/usr/bin/sudo -n /usr/bin/mktemp -d /private/tmp/nembra-seeded-held-fd.XXXXXX)"
          trap '/usr/bin/sudo -n /bin/rm -rf "$root" >/dev/null 2>&1 || true; /bin/rm -rf "$work"' EXIT
          /usr/bin/sudo -n /bin/chmod 0711 "$root"
          subject="$root/accepted-root"
          moved="$root/accepted-root.moved"
          replacement="$root/accepted-root"
          /usr/bin/sudo -n /bin/mkdir -m 0700 "$subject"

          cat > "$work/seeded_held_fd_restore.c" <<'C'
          #include <sys/types.h>
          #include <sys/acl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <dirent.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <grp.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static void die_errno(const char *label) {
              fprintf(stderr, "%s: %s\n", label, strerror(errno));
              exit(2);
          }

          static void fail(const char *message) {
              fprintf(stderr, "%s\n", message);
              exit(3);
          }

          static void require_same_identity(int fd, const char *path, const char *label) {
              struct stat by_fd;
              struct stat by_path;
              if (fstat(fd, &by_fd) != 0) die_errno("fstat");
              if (lstat(path, &by_path) != 0) die_errno("lstat");
              if (by_fd.st_dev != by_path.st_dev ||
                  by_fd.st_ino != by_path.st_ino ||
                  (by_fd.st_mode & S_IFMT) != (by_path.st_mode & S_IFMT)) {
                  fprintf(stderr, "%s: descriptor/path identity diverged\n", label);
                  exit(4);
              }
          }

          static int list_as(const char *path, uid_t uid, gid_t gid) {
              pid_t child = fork();
              if (child < 0) die_errno("fork access probe");
              if (child == 0) {
                  if (setgroups(0, NULL) != 0) _exit(120);
                  if (setgid(gid) != 0) _exit(121);
                  if (setuid(uid) != 0) _exit(122);
                  DIR *dir = opendir(path);
                  if (!dir) _exit(10);
                  while (readdir(dir) != NULL) { }
                  if (closedir(dir) != 0) _exit(11);
                  _exit(0);
              }
              int status = 0;
              if (waitpid(child, &status, 0) < 0) die_errno("waitpid access probe");
              if (!WIFEXITED(status)) return 125;
              return WEXITSTATUS(status);
          }

          static void chmod_add_ace(const char *path, const char *ace) {
              pid_t child = fork();
              if (child < 0) die_errno("fork chmod");
              if (child == 0) {
                  execl("/bin/chmod", "chmod", "+a", ace, path, (char *)NULL);
                  _exit(127);
              }
              int status = 0;
              if (waitpid(child, &status, 0) < 0) die_errno("waitpid chmod");
              if (!WIFEXITED(status) || WEXITSTATUS(status) != 0) {
                  fail("canonical-path chmod +a failed");
              }
          }

          static char *acl_text_copy(acl_t acl) {
              ssize_t length = 0;
              char *text = acl_to_text(acl, &length);
              if (!text) die_errno("acl_to_text");
              char *copy = malloc((size_t)length + 1);
              if (!copy) die_errno("malloc ACL text");
              memcpy(copy, text, (size_t)length);
              copy[length] = '\0';
              if (acl_free(text) != 0) die_errno("acl_free text");
              return copy;
          }

          static acl_t get_path_acl_required(const char *path) {
              acl_t acl = acl_get_file(path, ACL_TYPE_EXTENDED);
              if (!acl) die_errno("acl_get_file required");
              return acl;
          }

          static void require_no_extended_acl(const char *path, const char *label) {
              errno = 0;
              acl_t acl = acl_get_file(path, ACL_TYPE_EXTENDED);
              int saved_errno = errno;
              if (acl != NULL) {
                  acl_free(acl);
                  fprintf(stderr, "%s: replacement unexpectedly has extended ACL\n", label);
                  exit(5);
              }
              if (saved_errno != ENOENT) {
                  fprintf(stderr, "%s: expected ACL absence errno=%d got=%d\n", label, ENOENT, saved_errno);
                  exit(6);
              }
          }

          int main(int argc, char **argv) {
              if (argc != 7) {
                  fprintf(stderr, "usage: %s PRINCIPAL UID GID SUBJECT MOVED REPLACEMENT\n", argv[0]);
                  return 64;
              }
              const char *principal = argv[1];
              uid_t uid = (uid_t)strtoul(argv[2], NULL, 10);
              gid_t gid = (gid_t)strtoul(argv[3], NULL, 10);
              const char *subject = argv[4];
              const char *moved = argv[5];
              const char *replacement = argv[6];

              chmod_add_ace(subject, "user:root allow readattr");
              if (list_as(subject, uid, gid) == 0) {
                  fail("field identity unexpectedly listed seeded baseline subject");
              }

              int fd = open(subject, O_RDONLY | O_DIRECTORY | O_NOFOLLOW | O_CLOEXEC);
              if (fd < 0) die_errno("open accepted root");
              require_same_identity(fd, subject, "pre-baseline-capture");

              acl_t baseline_fd = acl_get_fd(fd);
              if (!baseline_fd) die_errno("acl_get_fd seeded baseline");
              acl_t baseline_restore = acl_dup(baseline_fd);
              if (!baseline_restore) die_errno("acl_dup seeded baseline");
              char *baseline_fd_text = acl_text_copy(baseline_fd);
              if (acl_free(baseline_fd) != 0) die_errno("acl_free baseline fd");

              acl_t baseline_path = get_path_acl_required(subject);
              char *baseline_path_text = acl_text_copy(baseline_path);
              if (acl_free(baseline_path) != 0) die_errno("acl_free baseline path");
              if (strcmp(baseline_fd_text, baseline_path_text) != 0) {
                  fprintf(stderr, "seeded baseline descriptor/path ACL mismatch\nfd=%s\npath=%s\n",
                          baseline_fd_text, baseline_path_text);
                  exit(7);
              }
              require_same_identity(fd, subject, "post-baseline-capture");

              char grant[1024];
              if (snprintf(
                      grant,
                      sizeof(grant),
                      "user:%s allow list,search,readattr,readextattr,readsecurity",
                      principal
                  ) >= (int)sizeof(grant)) {
                  fail("grant ACE is too long");
              }
              require_same_identity(fd, subject, "pre-grant");
              chmod_add_ace(subject, grant);
              require_same_identity(fd, subject, "post-grant");

              acl_t granted_path = get_path_acl_required(subject);
              char *granted_path_text = acl_text_copy(granted_path);
              if (acl_free(granted_path) != 0) die_errno("acl_free granted path");
              if (strcmp(granted_path_text, baseline_path_text) == 0) {
                  fail("canonical-path grant did not change path-native ACL");
              }
              free(granted_path_text);
              if (list_as(subject, uid, gid) != 0) {
                  fail("field identity could not list subject after canonical-path grant");
              }

              if (rename(subject, moved) != 0) die_errno("rename accepted root");
              if (mkdir(replacement, 0700) != 0) die_errno("mkdir attacker replacement");
              require_same_identity(fd, moved, "post-replacement original identity");
              require_no_extended_acl(replacement, "replacement-before-restore");

              if (list_as(moved, uid, gid) != 0) {
                  fail("moved original lost granted field access before restore");
              }
              if (list_as(replacement, uid, gid) == 0) {
                  fail("attacker replacement unexpectedly grants field access");
              }

              errno = 0;
              int restore_result = acl_set_fd(fd, baseline_restore);
              int restore_errno = errno;
              printf("NEMBRA_SEEDED_ACL_SET_FD result=%d errno=%d\n", restore_result, restore_errno);
              if (restore_result != 0) {
                  errno = restore_errno;
                  die_errno("acl_set_fd captured seeded baseline restore");
              }
              if (acl_free(baseline_restore) != 0) die_errno("acl_free baseline restore");
              require_same_identity(fd, moved, "post-restore original identity");

              acl_t restored_path = get_path_acl_required(moved);
              char *restored_path_text = acl_text_copy(restored_path);
              if (acl_free(restored_path) != 0) die_errno("acl_free restored path");
              if (strcmp(restored_path_text, baseline_path_text) != 0) {
                  fprintf(stderr, "moved original ACL not exactly restored\nexpected=%s\nactual=%s\n",
                          baseline_path_text, restored_path_text);
                  exit(8);
              }
              free(restored_path_text);

              require_no_extended_acl(replacement, "replacement-after-restore");
              if (list_as(moved, uid, gid) == 0) {
                  fail("field identity retained access after seeded baseline restore");
              }
              if (list_as(replacement, uid, gid) == 0) {
                  fail("attacker replacement gained access during seeded baseline restore");
              }

              puts(
                  "NEMBRA_SEEDED_ACL_CONTINUOUS_HELD_FD "
                  "baselineCapturedFromOriginalFd=true baselinePathCoherent=true canonicalPathGrant=true "
                  "separateUIDGrantObserved=true pathReplaced=true originalFdContinuouslyHeld=true "
                  "capturedBaselineRestoredViaSameFd=true exactSeededBaselineRestored=true "
                  "separateUIDRevoked=true replacementUntouched=true"
              );

              free(baseline_fd_text);
              free(baseline_path_text);
              if (close(fd) != 0) die_errno("close accepted-root fd");
              return 0;
          }
          C

          /usr/bin/clang -Wall -Wextra -Werror "$work/seeded_held_fd_restore.c" -o "$work/seeded_held_fd_restore"

          set +e
          output="$(/usr/bin/sudo -n "$work/seeded_held_fd_restore" \
            "$field_user" "$field_uid" "$field_gid" \
            "$subject" "$moved" "$replacement" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$status" > "$RUNNER_TEMP/nembra-seeded-held-fd-status.txt"
          printf '%s\n' "$output" > "$RUNNER_TEMP/nembra-seeded-held-fd-output.txt"
          exit "$status"

      - name: Publish exact classifier result to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const statusPath = path.join(process.env.RUNNER_TEMP, 'nembra-seeded-held-fd-status.txt');
            const outputPath = path.join(process.env.RUNNER_TEMP, 'nembra-seeded-held-fd-output.txt');
            const status = fs.existsSync(statusPath) ? fs.readFileSync(statusPath, 'utf8').trim() : 'missing';
            let output = fs.existsSync(outputPath) ? fs.readFileSync(outputPath, 'utf8') : 'classifier did not persist output';
            output = output.slice(-12000).replaceAll('```', '~~~');
            const body = [
              `NEMBRA_SEEDED_ACL_CONTINUOUS_HELD_FD_DIAGNOSTIC exactHead=${process.env.EXACT_HEAD} exit=${status}`,
              '',
              '```text',
              output,
              '```',
              '',
              'Validation only. Production `_PrivateReadLease` unchanged. PHYSICAL NO-GO.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Reassert classifier result after durable diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/nembra-seeded-held-fd-status.txt"
          test -f "$status_file"
          test "$(cat "$status_file")" = '0'

      - name: Preserve validation-only boundary
        if: always()
        shell: bash
        run: |
          echo 'NEMBRA_SEEDED_ACL_CONTINUOUS_HELD_FD validationOnly=true productionLeaseChanged=false physicalAuthorityCreated=false'
          echo 'No install, device, Bluetooth, Tuya, DP, telemetry, command, or riding authority is created by this classifier.'
