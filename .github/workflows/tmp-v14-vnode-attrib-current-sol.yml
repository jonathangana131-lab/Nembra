name: TEMP V14 Vnode Attribute Current Materializer

on:
  push:
    branches:
      - repair/v14-capture-vnode-attrib-current-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-capture-vnode-attrib-current-sol-20260811
          fetch-depth: 0

      - name: Materialize vnode attribute custody on exact current authority
        shell: bash
        env:
          EXPECTED_BASE: 642c10758c55e730fb1583fdf4545207f5147952
          SOURCE_COMMIT: bc1a75bbd75829ecdc9477b42fad2422a47f9296
          BRANCH: repair/v14-capture-vnode-attrib-current-sol-20260811
        run: |
          set -euo pipefail
          materializer='.github/workflows/tmp-v14-vnode-attrib-current-sol.yml'
          vnode_workflow='.github/workflows/capture-cocoapods-vnode-attribute-current.yml'
          vnode_test='scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py'
          python_test='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldPythonIsolationSourceTests.swift'
          provenance_test='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateFieldInputProvenanceSourceTests.swift'
          guard='Scripts/capture_tuya_private_input_build_guard.py'

          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          test "$(git diff --name-only "$EXPECTED_BASE"...HEAD)" = "$materializer"
          test "$(git rev-parse "HEAD:$python_test")" = '2dbaab1ad38fe0e93b74d51dfafb75153c28ca0d'
          test "$(git rev-parse "HEAD:$provenance_test")" = '33cd7a49ebb680a4d298fe5309dde0036da24c71'
          test "$(git rev-parse "HEAD:$guard")" = 'f15f0809e33ccd8a15cd1d149d59481248a019d5'

          git cat-file -e "$SOURCE_COMMIT^{commit}" 2>/dev/null || git fetch origin "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT:$vnode_workflow")" = '20ae3580ec1317b6bbbba671ed2c1b0b1dff3185'
          test "$(git rev-parse "$SOURCE_COMMIT:$vnode_test")" = '4ca4f539ee7c6eb019d1efc5cf075561b28d8314'
          test "$(git rev-parse "$SOURCE_COMMIT:$python_test")" = 'e41d12aee9d9e2ce888bcd34b1e8a8884a7c97d5'
          test "$(git rev-parse "$SOURCE_COMMIT:$provenance_test")" = '57ec17cdb828dfb46128f7385bdd643d0c03bfe5'

          mkdir -p "$(dirname "$vnode_workflow")" "$(dirname "$vnode_test")"
          git show "$SOURCE_COMMIT:$vnode_workflow" > "$vnode_workflow"
          git show "$SOURCE_COMMIT:$vnode_test" > "$vnode_test"
          git show "$SOURCE_COMMIT:$python_test" > "$python_test"
          git show "$SOURCE_COMMIT:$provenance_test" > "$provenance_test"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('Scripts/capture_tuya_private_input_build_guard.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '            "KQ_NOTE_EXTEND",\n            "KQ_NOTE_LINK",',
              '            "KQ_NOTE_EXTEND",\n            "KQ_NOTE_ATTRIB",\n            "KQ_NOTE_LINK",',
              'required vnode attribute capability',
          )
          replace_once(
              '            | select.KQ_NOTE_EXTEND\n            | select.KQ_NOTE_LINK',
              '            | select.KQ_NOTE_EXTEND\n            | select.KQ_NOTE_ATTRIB\n            | select.KQ_NOTE_LINK',
              'vnode attribute event subscription',
          )
          path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile "$guard" "$vnode_test"
          python3 "$vnode_test"
          grep -Fq '"KQ_NOTE_ATTRIB"' "$guard"
          grep -Fq '| select.KQ_NOTE_ATTRIB' "$guard"
          grep -Fq 'run_accepted_python_helper \"$PROVENANCE_HELPER\" \"$PROVENANCE_HELPER_SHA256\" snapshot' "$python_test"
          grep -Fq 'run_accepted_source_python \"$TUYA_PROVENANCE_HELPER_RELATIVE\" verify' "$python_test"
          grep -Fq 'run_accepted_python_helper \"$PROVENANCE_HELPER\" \"$PROVENANCE_HELPER_SHA256\" snapshot' "$provenance_test"

          if ! diff_check="$(git diff --check 2>&1)"; then
            encoded="${diff_check//'%'/'%25'}"
            encoded="${encoded//$'\r'/'%0D'}"
            encoded="${encoded//$'\n'/'%0A'}"
            printf '::error title=Vnode materializer diff-check::%s\n' "$encoded"
            exit 1
          fi

          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' "$vnode_workflow" "$vnode_test" "$python_test" "$provenance_test" "$guard" | sort)"
          if [[ "$changed" != "$expected" ]]; then
            printf '::error title=Vnode materializer changed-path mismatch::expected=%q actual=%q\n' "$expected" "$changed"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$vnode_workflow" "$vnode_test" "$python_test" "$provenance_test" "$guard"
          git commit -m 'Capture: close vnode attribute custody on current authority'
          git rm "$materializer"
          git commit -m 'Capture: remove vnode attribute materializer'
          git push origin HEAD:"$BRANCH"
