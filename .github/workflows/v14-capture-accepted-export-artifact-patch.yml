name: V14 Capture Accepted Export Artifact Patch

on:
  push:
    branches:
      - integration/v14-capture-accepted-export-artifact-sol

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-accepted-export-artifact-sol
          fetch-depth: 0

      - name: Apply guarded accepted artifact repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guard failed: expected exactly one match, found {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "    private var events: [Event] = []\n    private var sealedAcceptedEventPrefix: [Event]?\n    private var watchdog: Task<Void, Never>?",
              "    private var events: [Event] = []\n    private var sealedAcceptedEventPrefix: [Event]?\n    private var sealedAcceptedExport: Export?\n    private var watchdog: Task<Void, Never>?"
          )

          replace_once(
              "                        try await sessionLedger.sealAcceptedObservation(for: token)\n                        self.sealedAcceptedEventPrefix = self.events\n                        self.currentConnectionToken = nil\n                        await self.refreshLedgerSnapshot()\n                        self.phase = .accepted",
              "                        try await sessionLedger.sealAcceptedObservation(for: token)\n                        let acceptedEventPrefix = self.events\n                        self.sealedAcceptedEventPrefix = acceptedEventPrefix\n                        self.currentConnectionToken = nil\n                        await self.refreshLedgerSnapshot()\n                        self.sealedAcceptedExport = self.makeExport(\n                            exportedAt: Date(),\n                            phase: .accepted,\n                            events: acceptedEventPrefix\n                        )\n                        self.exportData = nil\n                        self.phase = .accepted"
          )

          replace_once(
              "    private func refreshLedgerSnapshot() async {\n        ledgerSnapshot = await sessionLedger.currentPreflightSnapshot()\n    }",
              "    private func invalidatePreparedMutableExport() {\n        guard phase != .accepted else { return }\n        exportData = nil\n    }\n\n    private func refreshLedgerSnapshot() async {\n        ledgerSnapshot = await sessionLedger.currentPreflightSnapshot()\n        invalidatePreparedMutableExport()\n    }"
          )

          start_marker = "    func prepareExport() {\n"
          end_marker = "    private func resetDiscoverySessionOnly() {\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("guard failed: prepareExport/reset section not found")

          replacement_lines = [
              "    private func makeExport(exportedAt: Date, phase: Phase, events: [Event]) -> Export {",
              "        Export(",
              "            schemaVersion: 8,",
              "            purpose: \"Sanitized Tuya authenticated read-only stationary preflight\",",
              "            exportedAt: exportedAt,",
              "            buildIdentifier: buildIdentity.buildIdentifier,",
              "            sourceCommitSHA: buildIdentity.sourceCommitSHA,",
              "            tuyaDeviceID: deviceID,",
              "            tuyaUUID: tuyaUUID,",
              "            productID: productID,",
              "            selectedPeripheralID: selectedID?.uuidString,",
              "            targetCorrelationMethod: targetCorrelationMethod,",
              "            targetCorrelationWindowCount: targetCorrelationWindowCount,",
              "            targetCorrelationOperatorConfirmed: targetCorrelationOperatorConfirmed,",
              "            targetCorrelationProvenance: correlationProvenance,",
              "            phase: phase,",
              "            privateConfigPresent: privateConfig,",
              "            sdkAccountLoggedIn: sdkAccountLoggedIn,",
              "            sdkDeviceMembershipVerified: sdkDeviceMembershipVerified,",
              "            secureSessionEstablished: secureSessionEstablished,",
              "            canonicalObservedAgeSeconds: canonicalObservedAgeSeconds,",
              "            sdkLocalBLEOnline: sdkLocalBLEOnline,",
              "            applicationUpdateCount: applicationUpdateCount,",
              "            connectionGeneration: ledgerSnapshot.connectionGeneration,",
              "            authenticationMethod: ledgerSnapshot.authenticationMethod?.rawValue,",
              "            preflightVerdict: preflightVerdictText,",
              "            applicationValueRepresentation: \"ThingSmartDeviceDelegate dpsUpdate values projected with String(describing:); application-level SDK data, not byte-exact or raw FD50 transport\",",
              "            rawFD50BytesCaptured: false,",
              "            secretsRedacted: true,",
              "            dpQueriesSent: false,",
              "            dpCommandsSent: false,",
              "            candidates: candidates,",
              "            events: events",
              "        )",
              "    }",
              "",
              "    func prepareExport() {",
              "        let envelope: Export",
              "        if phase == .accepted {",
              "            guard let sealedAcceptedExport else {",
              "                exportData = nil",
              "                message = \"Accepted diagnostics cannot be exported because the immutable accepted artifact is unavailable. Restart from OFF1 rather than rebuilding accepted evidence from mutable post-seal state.\"",
              "                return",
              "            }",
              "            envelope = sealedAcceptedExport",
              "        } else {",
              "            envelope = makeExport(",
              "                exportedAt: Date(),",
              "                phase: phase,",
              "                events: events",
              "            )",
              "        }",
              "",
              "        do {",
              "            let encoder = JSONEncoder()",
              "            encoder.outputFormatting = [.prettyPrinted, .sortedKeys, .withoutEscapingSlashes]",
              "            encoder.dateEncodingStrategy = .iso8601",
              "            exportData = try encoder.encode(envelope)",
              "            exportName = \"Nembra-Secure-Link-\\(deviceID.prefix(8))-Diagnostics.json\"",
              "            message = \"Sanitized diagnostics ready with exact compiled build provenance. No account UID, AppKey/AppSecret, password, account token, local_key, session key, raw FD50 claim, DP query, or DP command is exported.\"",
              "        } catch {",
              "            exportData = nil",
              "            message = \"Diagnostic export failed: \\(error.localizedDescription)\"",
              "        }",
              "    }",
              "",
          ]
          replacement = "\n".join(replacement_lines) + "\n"
          text = text[:start] + replacement + text[end:]

          replace_once(
              "    private func resetDiscoverySessionOnly() {\n        sealedAcceptedEventPrefix = nil",
              "    private func resetDiscoverySessionOnly() {\n        sealedAcceptedEventPrefix = nil\n        sealedAcceptedExport = nil"
          )

          replace_once(
              "    private func log(_ kind: String, _ details: [String: String] = [:]) {\n        events.append(Event(at: Date(), kind: kind, details: details))\n    }",
              "    private func log(_ kind: String, _ details: [String: String] = [:]) {\n        invalidatePreparedMutableExport()\n        events.append(Event(at: Date(), kind: kind, details: details))\n    }"
          )

          path.write_text(text)

      - name: Validate source contract shape
        shell: python
        run: |
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          required = [
              "private var sealedAcceptedExport: Export?",
              "self.sealedAcceptedEventPrefix = acceptedEventPrefix",
              "self.sealedAcceptedExport = self.makeExport(",
              "phase: .accepted",
              "events: acceptedEventPrefix",
              "guard let sealedAcceptedExport else",
              "envelope = sealedAcceptedExport",
              "private func invalidatePreparedMutableExport()",
              "guard phase != .accepted else { return }",
              "sealedAcceptedExport = nil",
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"missing expected accepted-export contract: {missing}")

      - name: Commit production delta
        run: |
          git diff --check
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m "fix(capture): freeze complete accepted export artifact"
          git push origin HEAD:integration/v14-capture-accepted-export-artifact-sol
