name: Capture Private Runner Blob Retry

on:
  push:
    branches:
      - repair/v14-capture-private-device-runner-blob-sol

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replace mutable runner reopen with accepted blob execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/field/install_one_time_capture.command')
          s=p.read_text()
          begin=s.index('PRIVATE_DEVICE_RUNNER="$ROOT/scripts/ci/es80_signed_field_artifact_private_runner.py"\n')
          end_marker=')"; then\n    die "The intended-device verification file failed private custody validation."\nfi\n'
          end=s.index(end_marker,begin)+len(end_marker)
          new='''PRIVATE_DEVICE_RUNNER_PATH="scripts/ci/es80_signed_field_artifact_private_runner.py"
          PRIVATE_DEVICE_RUNNER_BLOB="$(/usr/bin/git rev-parse "$SOURCE_SHA:$PRIVATE_DEVICE_RUNNER_PATH" 2>/dev/null)" || die "Private-device authority runner is missing from the exact accepted Git tree."
          [[ "$PRIVATE_DEVICE_RUNNER_BLOB" =~ ^[0-9a-f]{40}$ ]] || die "Private-device authority runner Git blob identity is malformed."
          PRIVATE_DEVICE_RUNNER_BASE64="$(/usr/bin/git cat-file blob "$PRIVATE_DEVICE_RUNNER_BLOB" | /usr/bin/base64)" || die "Could not capture private-device authority runner from accepted Git bytes."
          [[ -n "$PRIVATE_DEVICE_RUNNER_BASE64" ]] || die "Captured private-device authority runner is empty."
          if ! DEVICE_UDID="$(/usr/bin/python3 -I -B - "$PRIVATE_DEVICE_RUNNER_BASE64" "$PRIVATE_DEVICE_RUNNER_BLOB" "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" "$ROOT" <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import re
          import sys
          from pathlib import Path
          from types import ModuleType

          runner_bytes = base64.b64decode(sys.argv[1], validate=True)
          expected_runner_blob = sys.argv[2]
          if re.fullmatch(r"[0-9a-f]{40}", expected_runner_blob) is None:
              raise RuntimeError("accepted private-device runner Git blob is malformed")
          git_blob_payload = b"blob " + str(len(runner_bytes)).encode("ascii") + b"\\0" + runner_bytes
          actual_runner_blob = hashlib.sha1(git_blob_payload).hexdigest()
          if not hmac.compare_digest(actual_runner_blob, expected_runner_blob):
              raise RuntimeError("private-device runner bytes do not match accepted Git authority")
          module = ModuleType("nembra_private_device_reader")
          module.__file__ = "<es80_signed_field_artifact_private_runner.py:accepted-git-blob>"
          exec(compile(runner_bytes, module.__file__, "exec"), module.__dict__)
          reader = getattr(module, "read_private_identifier", None)
          if not callable(reader):
              raise RuntimeError("accepted private-device runner does not expose the expected reader")
          value = reader(Path(sys.argv[3]), Path(sys.argv[4]))
          expected_digest = os.environ.get("NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256", "")
          if re.fullmatch(r"[0-9a-f]{64}", expected_digest) is None:
              raise RuntimeError("expected intended-device digest is unavailable or malformed")
          actual_digest = hashlib.sha256(value.encode("utf-8")).hexdigest()
          if not hmac.compare_digest(actual_digest, expected_digest):
              raise RuntimeError("private intended-device identifier does not match Final GO authority")
          sys.stdout.write(value)
          PY
          )"; then
              die "The intended-device verification file failed private custody validation."
          fi
          '''
          p.write_text(s[:begin]+new+s[end:])
          PY

      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          python3 scripts/ci/tests/test_capture_private_device_runner_execution_subject.py
          python3 scripts/ci/tests/test_capture_signed_app_install_custody.py
          ! grep -Fq 'spec_from_file_location("nembra_private_device_reader", runner_path)' scripts/field/install_one_time_capture.command
          grep -Fq 'accepted-git-blob' scripts/field/install_one_time_capture.command
          git diff --check

      - name: Publish clean repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/capture-private-runner-blob-materializer.yml .github/workflows/capture-private-runner-blob-retry.yml
          git add scripts/field/install_one_time_capture.command .github/workflows/capture-signed-app-install-custody.yml scripts/ci/tests/test_capture_private_device_runner_execution_subject.py
          git diff --cached --check
          git config user.name jonathangana131-lab
          git config user.email jonathangana131@gmail.com
          git commit -m 'fix(capture): execute private-device runner from accepted blob'
          git push origin HEAD:repair/v14-capture-private-device-runner-blob-sol
