name: Capture Authority Chain Materializer

on:
  push:
    branches:
      - repair/v14-private-review-hmac-helper-execution-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-review-hmac-helper-execution-sol
          fetch-depth: 0
      - name: Materialize exact downstream authority repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Bootstrap: bind every authority-bearing Python helper to reviewed
          # source bytes and execute only the descriptor-captured bytes.
          # ------------------------------------------------------------------
          path = Path("Scripts/bootstrap_capture_tuya_sdk.sh")
          text = path.read_text()
          text = replace_once(text,
              '  : "${NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256:?Set NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256 to the preaccepted 64-hex private-review verifier source SHA-256 before field bootstrap.}"\n',
              '  : "${NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256:?Set NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256 to the preaccepted 64-hex private-review verifier source SHA-256 before field bootstrap.}"\n'
              '  : "${NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256:?Set NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256 to the preaccepted 64-hex private-input provenance helper source SHA-256 before field bootstrap.}"\n'
              '  : "${NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256:?Set NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256 to the preaccepted 64-hex generated-build-subject helper source SHA-256 before field bootstrap.}"\n',
              "bootstrap helper requirements")
          text = replace_once(text,
              '  [[ "$NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || {\n'
              '    echo "ERROR: NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256 must be exactly 64 hex characters." >&2\n'
              '    exit 1\n'
              '  }\n',
              '  [[ "$NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || {\n'
              '    echo "ERROR: NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256 must be exactly 64 hex characters." >&2\n'
              '    exit 1\n'
              '  }\n'
              '  [[ "$NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || {\n'
              '    echo "ERROR: NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256 must be exactly 64 hex characters." >&2\n'
              '    exit 1\n'
              '  }\n'
              '  [[ "$NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || {\n'
              '    echo "ERROR: NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256 must be exactly 64 hex characters." >&2\n'
              '    exit 1\n'
              '  }\n',
              "bootstrap helper validation")
          text = replace_once(text,
              '  ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256="$(printf \'%s\' "$NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256" | tr \'[:upper:]\' \'[:lower:]\')"\n',
              '  ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256="$(printf \'%s\' "$NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256" | tr \'[:upper:]\' \'[:lower:]\')"\n'
              '  ACCEPTED_PROVENANCE_HELPER_SHA256="$(printf \'%s\' "$NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256" | tr \'[:upper:]\' \'[:lower:]\')"\n'
              '  ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256="$(printf \'%s\' "$NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256" | tr \'[:upper:]\' \'[:lower:]\')"\n',
              "bootstrap helper normalization")
          text = replace_once(text,
              '    NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_COMMITMENT_SHA256 \\\n    NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256 || true\n',
              '    NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_COMMITMENT_SHA256 \\\n    NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256 \\\n    NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256 \\\n    NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256 || true\n',
              "bootstrap review unset env")
          text = replace_once(text,
              '  ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256=""\n',
              '  ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256=""\n'
              '  ACCEPTED_PROVENANCE_HELPER_SHA256=""\n'
              '  ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256=""\n',
              "bootstrap review empty authority")
          text = replace_once(text,
              'run_accepted_private_review_helper() {\n'
              '  local expected_sha256="$1"\n'
              '  shift\n'
              '  /usr/bin/python3 -I - "$PRIVATE_REVIEW_HELPER" "$expected_sha256" "$@" <<\'PY\'\n',
              'run_accepted_python_helper() {\n'
              '  local helper_path="$1"\n'
              '  shift\n'
              '  local expected_sha256="$1"\n'
              '  shift\n'
              '  /usr/bin/python3 -I - "$helper_path" "$expected_sha256" "$@" <<\'PY\'\n',
              "bootstrap generic accepted runner")
          text = replace_once(text,
              'if [[ "$REVIEW_ONLY" == "1" ]]; then\n'
              '  /usr/bin/python3 -I "$PROVENANCE_HELPER" snapshot \\\n',
              'if [[ "$REVIEW_ONLY" == "1" ]]; then\n'
              '  PROVENANCE_HELPER_SHA256="$(shasum -a 256 "$PROVENANCE_HELPER" | awk \'{print $1}\' | tr \'[:upper:]\' \'[:lower:]\')"\n'
              '  PRIVATE_REVIEW_HELPER_SHA256="$(shasum -a 256 "$PRIVATE_REVIEW_HELPER" | awk \'{print $1}\' | tr \'[:upper:]\' \'[:lower:]\')"\n'
              '  GENERATED_BUILD_SUBJECT_HELPER_SHA256="$(shasum -a 256 "$GENERATED_BUILD_SUBJECT_HELPER" | awk \'{print $1}\' | tr \'[:upper:]\' \'[:lower:]\')"\n'
              '  run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" snapshot \\\n',
              "bootstrap review provenance execution")
          text = replace_once(text,
              '  PRIVATE_REVIEW_COMMITMENT_SHA256="$(/usr/bin/python3 -I "$PRIVATE_REVIEW_HELPER" create \\\n',
              '  PRIVATE_REVIEW_COMMITMENT_SHA256="$(run_accepted_python_helper "$PRIVATE_REVIEW_HELPER" "$PRIVATE_REVIEW_HELPER_SHA256" create \\\n',
              "bootstrap review private helper execution")
          text = replace_once(text,
              '  PRIVATE_REVIEW_HELPER_SHA256="$(shasum -a 256 "$PRIVATE_REVIEW_HELPER" | awk \'{print $1}\' | tr \'[:upper:]\' \'[:lower:]\')"\n'
              'else\n'
              '  run_accepted_private_review_helper "$ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256" verify \\\n',
              'else\n'
              '  PRIVATE_REVIEW_HELPER_SHA256="$ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256"\n'
              '  PROVENANCE_HELPER_SHA256="$ACCEPTED_PROVENANCE_HELPER_SHA256"\n'
              '  GENERATED_BUILD_SUBJECT_HELPER_SHA256="$ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256"\n'
              '  run_accepted_python_helper "$PRIVATE_REVIEW_HELPER" "$PRIVATE_REVIEW_HELPER_SHA256" verify \\\n',
              "bootstrap normal private helper execution")
          text = replace_once(text,
              '  PRIVATE_REVIEW_HELPER_SHA256="$ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256"\n\n'
              '  /usr/bin/python3 -I "$PROVENANCE_HELPER" verify \\\n',
              '  run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" verify \\\n',
              "bootstrap normal provenance execution")
          text = replace_once(text,
              'GENERATED_BUILD_SUBJECT_SHA256="$(/usr/bin/python3 -I "$GENERATED_BUILD_SUBJECT_HELPER" \\\n',
              'GENERATED_BUILD_SUBJECT_SHA256="$(run_accepted_python_helper "$GENERATED_BUILD_SUBJECT_HELPER" "$GENERATED_BUILD_SUBJECT_HELPER_SHA256" \\\n',
              "bootstrap generated subject execution")
          text = replace_once(text,
              '  Private review verifier source SHA-256: $PRIVATE_REVIEW_HELPER_SHA256\n',
              '  Private review verifier source SHA-256: $PRIVATE_REVIEW_HELPER_SHA256\n'
              '  Private-input provenance helper source SHA-256: $PROVENANCE_HELPER_SHA256\n'
              '  Generated-build-subject helper source SHA-256: $GENERATED_BUILD_SUBJECT_HELPER_SHA256\n',
              "bootstrap review helper output")
          text = replace_once(text, 'Review and bind all FOUR public authority values', 'Review and bind all SIX public authority values', "bootstrap authority count")
          text = replace_once(text,
              "printf 'Externally accepted private review verifier source matched: %s\\n' \"$PRIVATE_REVIEW_HELPER_SHA256\"\n",
              "printf 'Externally accepted private review verifier source matched: %s\\n' \"$PRIVATE_REVIEW_HELPER_SHA256\"\n"
              "printf 'Externally accepted private-input provenance helper source matched: %s\\n' \"$PROVENANCE_HELPER_SHA256\"\n"
              "printf 'Externally accepted generated-build-subject helper source matched: %s\\n' \"$GENERATED_BUILD_SUBJECT_HELPER_SHA256\"\n",
              "bootstrap normal helper output")
          text = replace_once(text,
              'unset ACCEPTED_LOCK_SHA256 ACCEPTED_GENERATED_BUILD_SUBJECT_SHA256 ACCEPTED_PRIVATE_REVIEW_COMMITMENT_SHA256 ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256 \\\n',
              'unset ACCEPTED_LOCK_SHA256 ACCEPTED_GENERATED_BUILD_SUBJECT_SHA256 ACCEPTED_PRIVATE_REVIEW_COMMITMENT_SHA256 ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256 ACCEPTED_PROVENANCE_HELPER_SHA256 ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256 \\\n',
              "bootstrap normal unset locals")
          text = replace_once(text,
              '  NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_COMMITMENT_SHA256 \\\n  NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256 || true\n',
              '  NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_COMMITMENT_SHA256 \\\n  NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256 \\\n  NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256 \\\n  NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256 || true\n',
              "bootstrap normal unset env")
          text = replace_once(text,
              '  Private review verifier source SHA-256: $PRIVATE_REVIEW_HELPER_SHA256\n\nNEXT BUILD RULE:',
              '  Private review verifier source SHA-256: $PRIVATE_REVIEW_HELPER_SHA256\n'
              '  Private-input provenance helper source SHA-256: $PROVENANCE_HELPER_SHA256\n'
              '  Generated-build-subject helper source SHA-256: $GENERATED_BUILD_SUBJECT_HELPER_SHA256\n\nNEXT BUILD RULE:',
              "bootstrap verified helper summary")
          path.write_text(text if text.endswith("\n") else text + "\n")

          # ------------------------------------------------------------------
          # Build guard: no authority helper executes at import time. Production
          # CLI explicitly locks both downstream modules to captured, reviewed
          # bytes before any helper-owned type/function is touched.
          # ------------------------------------------------------------------
          path = Path("Scripts/capture_tuya_private_input_build_guard.py")
          text = path.read_text()
          text = replace_once(text,
              'class BuildGuardError(RuntimeError):\n    pass\n\n\n',
              'class BuildGuardError(RuntimeError):\n    pass\n\n\n'
              'def _stat_identity(metadata: os.stat_result) -> tuple[int, ...]:\n'
              '    return (metadata.st_dev, metadata.st_ino, metadata.st_mode, metadata.st_uid, metadata.st_gid, metadata.st_size, metadata.st_mtime_ns, metadata.st_ctime_ns)\n\n\n',
              "guard local stat identity")
          old = '''provenance = _load_neighbor_module(
    "capture_tuya_private_input_provenance.py",
    "capture_tuya_private_input_provenance",
)
generated_build = _load_neighbor_module(
    "capture_cocoapods_generated_build_subject.py",
    "capture_cocoapods_generated_build_subject",
)
PRIVATE_REVIEW_HELPER_ENV = "NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256"
PRIVATE_REVIEW_HELPER_MAX_BYTES = 262_144


def _load_accepted_private_review_module():
'''
          new = '''PRIVATE_REVIEW_HELPER_ENV = "NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256"
PROVENANCE_HELPER_ENV = "NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256"
GENERATED_BUILD_SUBJECT_HELPER_ENV = "NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256"
AUTHORITY_HELPER_MAX_BYTES = 262_144


def _load_accepted_helper_module(filename: str, module_name: str, environment_name: str):
    expected = os.environ.get(environment_name, "").lower()
    if len(expected) != 64 or any(character not in "0123456789abcdef" for character in expected):
        raise BuildGuardError(f"{environment_name} must remain available as exactly 64 hex characters through build-window admission")
    helper = Path(__file__).with_name(filename)
    flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
    try:
        descriptor = os.open(helper, flags)
    except OSError as error:
        raise BuildGuardError(f"accepted authority helper could not be opened under descriptor custody: {filename}") from error
    try:
        before = os.fstat(descriptor)
        if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1:
            raise BuildGuardError(f"accepted authority helper is not one regular single-link file: {filename}")
        if before.st_size <= 0 or before.st_size > AUTHORITY_HELPER_MAX_BYTES:
            raise BuildGuardError(f"accepted authority helper size is outside the accepted bound: {filename}")
        chunks: list[bytes] = []
        remaining = before.st_size
        while remaining:
            chunk = os.read(descriptor, min(65_536, remaining))
            if not chunk:
                raise BuildGuardError(f"accepted authority helper changed during descriptor read: {filename}")
            chunks.append(chunk)
            remaining -= len(chunk)
        source = b"".join(chunks)
        after = os.fstat(descriptor)
        if _stat_identity(before) != _stat_identity(after):
            raise BuildGuardError(f"accepted authority helper changed during descriptor custody: {filename}")
    finally:
        os.close(descriptor)
    actual = hashlib.sha256(source).hexdigest()
    if not hmac.compare_digest(actual, expected):
        raise BuildGuardError(f"accepted authority helper source does not match externally reviewed authority: {filename}")
    module = types.ModuleType(module_name)
    module.__file__ = f"<accepted-{filename}>"
    try:
        exec(compile(source, module.__file__, "exec"), module.__dict__)
    except Exception as error:
        raise BuildGuardError(f"accepted authority helper source could not be loaded: {filename}") from error
    return module


class _AuthorityHelperProxy:
    def __init__(self, filename: str, module_name: str, environment_name: str) -> None:
        self._filename = filename
        self._module_name = module_name
        self._environment_name = environment_name
        self._module = None
        self._accepted = False

    def require_accepted(self):
        self._module = _load_accepted_helper_module(self._filename, self._module_name, self._environment_name)
        self._accepted = True
        return self._module

    def __getattr__(self, name: str):
        if self._module is None:
            # Compatibility only for isolated package/unit callers. The physical
            # field CLI requires accepted authority helpers before any access.
            self._module = _load_neighbor_module(self._filename, self._module_name)
        return getattr(self._module, name)


provenance = _AuthorityHelperProxy(
    "capture_tuya_private_input_provenance.py",
    "capture_tuya_private_input_provenance",
    PROVENANCE_HELPER_ENV,
)
generated_build = _AuthorityHelperProxy(
    "capture_cocoapods_generated_build_subject.py",
    "capture_cocoapods_generated_build_subject",
    GENERATED_BUILD_SUBJECT_HELPER_ENV,
)


def _load_accepted_private_review_module():
'''
          text = replace_once(text, old, new, "guard lazy authority modules")
          pattern = re.compile(r'def _load_accepted_private_review_module\(\):\n.*?\n    return module\n\n\n@dataclass', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit("guard private loader body not found")
          replacement = '''def _load_accepted_private_review_module():
    return _load_accepted_helper_module(
        "capture_private_review_commitment.py",
        "capture_private_review_commitment_accepted",
        PRIVATE_REVIEW_HELPER_ENV,
    )


@dataclass'''
          text = text[:match.start()] + replacement + text[match.end():]
          text = text.replace("provenance._stat_identity", "_stat_identity")
          text = replace_once(text,
              '    require_accepted_private_review_commitment: bool = False,\n) -> int:\n',
              '    require_accepted_private_review_commitment: bool = False,\n'
              '    require_accepted_authority_helpers: bool = False,\n) -> int:\n',
              "guard accepted authority argument")
          text = replace_once(text,
              '    if not command:\n        raise BuildGuardError("no build command was supplied")\n\n'
              '    if require_accepted_generated_subject:\n',
              '    if not command:\n        raise BuildGuardError("no build command was supplied")\n\n'
              '    if require_accepted_authority_helpers:\n'
              '        provenance.require_accepted()\n'
              '        generated_build.require_accepted()\n\n'
              '    if require_accepted_generated_subject:\n',
              "guard authority admission")
          text = replace_once(text,
              '            require_accepted_generated_subject=True,\n'
              '            require_accepted_private_review_commitment=True,\n',
              '            require_accepted_generated_subject=True,\n'
              '            require_accepted_private_review_commitment=True,\n'
              '            require_accepted_authority_helpers=True,\n',
              "guard production authority flag")
          path.write_text(text)

          # ------------------------------------------------------------------
          # Real field installer: execute provenance and the build guard from the
          # exact accepted Git commit bytes. No mutable worktree pathname is the
          # executable authority at either field boundary.
          # ------------------------------------------------------------------
          path = Path("scripts/field/install_one_time_capture.command")
          text = path.read_text()
          anchor = 'TUYA_PROVENANCE_HELPER="$ROOT/Scripts/capture_tuya_private_input_provenance.py"\nTUYA_BUILD_WINDOW_GUARD="$ROOT/Scripts/capture_tuya_private_input_build_guard.py"\n'
          replacement = '''TUYA_PROVENANCE_HELPER_RELATIVE="Scripts/capture_tuya_private_input_provenance.py"
TUYA_BUILD_WINDOW_GUARD_RELATIVE="Scripts/capture_tuya_private_input_build_guard.py"
run_accepted_source_python() {
    local relative_path="$1"
    shift
    /usr/bin/python3 -I - "$ROOT" "$SOURCE_SHA" "$relative_path" "$@" <<'PY'
import subprocess
import sys
from pathlib import Path

root = Path(sys.argv[1])
source_sha = sys.argv[2]
relative_path = sys.argv[3]
helper_argv = sys.argv[4:]
try:
    source = subprocess.check_output(
        ["/usr/bin/git", "show", f"{source_sha}:{relative_path}"],
        cwd=root,
        stderr=subprocess.DEVNULL,
    )
except subprocess.CalledProcessError as error:
    raise SystemExit(f"accepted source helper is unavailable from exact Git authority: {relative_path}") from error
namespace = {"__name__": "__main__", "__file__": str(root / relative_path)}
sys.argv = [str(root / relative_path), *helper_argv]
exec(compile(source, f"<accepted-{source_sha}:{relative_path}>", "exec"), namespace)
PY
}
'''
          text = replace_once(text, anchor, replacement, "installer accepted source runner")
          text = replace_once(text,
              '    /usr/bin/python3 -I "$TUYA_PROVENANCE_HELPER" verify \\\n',
              '    run_accepted_source_python "$TUYA_PROVENANCE_HELPER_RELATIVE" verify \\\n',
              "installer provenance execution")
          text = replace_once(text,
              '/usr/bin/python3 -I "$TUYA_BUILD_WINDOW_GUARD" \\\n',
              'run_accepted_source_python "$TUYA_BUILD_WINDOW_GUARD_RELATIVE" \\\n',
              "installer guard execution")
          path.write_text(text)

          # ------------------------------------------------------------------
          # Portable acceptance fixtures: successful normal-mode calls now carry
          # all reviewed helper identities. The imported red-team therefore can
          # only turn green by rejecting substituted A->B helper bytes, not by a
          # trivially missing environment variable.
          # ------------------------------------------------------------------
          for filename in [
              "scripts/ci/tests/test_capture_private_review_commitment.py",
              "scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py",
              "scripts/ci/tests/test_capture_private_review_helper_execution_custody.py",
          ]:
              p = Path(filename)
              t = p.read_text()
              if "self.accepted_provenance_helper" not in t:
                  if "self.accepted_helper =" in t:
                      marker = next(line for line in t.splitlines(True) if "self.accepted_helper =" in line)
                  else:
                      marker = next(line for line in t.splitlines(True) if "self.accepted_private_review_helper =" in line)
                  indent = marker[:len(marker)-len(marker.lstrip())]
                  addition = (
                      marker +
                      f'{indent}self.accepted_provenance_helper = hashlib.sha256((scripts / PROVENANCE.name).read_bytes()).hexdigest()\n' +
                      f'{indent}self.accepted_generated_helper = hashlib.sha256((scripts / {"GENERATED" if "PRIVATE_REVIEW" not in t else "SUBJECT_HELPER"}.name).read_bytes()).hexdigest()\n'
                  )
                  t = replace_once(t, marker, addition, f"{filename} helper digests")
              env_marker = 'environment["NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256"] = '
              if env_marker in t and 'environment["NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256"]' not in t:
                  line = next(line for line in t.splitlines(True) if env_marker in line)
                  indent = line[:len(line)-len(line.lstrip())]
                  t = replace_once(t, line, line +
                      f'{indent}environment["NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256"] = self.accepted_provenance_helper\n' +
                      f'{indent}environment["NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256"] = self.accepted_generated_helper\n',
                      f"{filename} bootstrap helper env")
              # One fixture uses local variable `env` rather than `environment`.
              env_marker2 = 'env[HELPER_ENV] = self.accepted_helper\n'
              if env_marker2 in t and 'env["NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256"]' not in t:
                  t = replace_once(t, env_marker2, env_marker2 +
                      '            env["NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256"] = self.accepted_provenance_helper\n'
                      '            env["NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256"] = self.accepted_generated_helper\n',
                      f"{filename} helper env alt")
              p.write_text(t)

          # Update explicit guard environment in private-review acceptance fixture.
          p = Path("scripts/ci/tests/test_capture_private_review_commitment.py")
          t = p.read_text()
          marker = '                "NEMBRA_CAPTURE_ACCEPTED_PRIVATE_REVIEW_HELPER_SHA256": self.accepted_helper,\n'
          if marker in t and '"NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256": self.accepted_provenance_helper,' not in t:
              t = replace_once(t, marker, marker +
                  '                "NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256": self.accepted_provenance_helper,\n'
                  '                "NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_SUBJECT_HELPER_SHA256": self.accepted_generated_helper,\n',
                  "private review guard accepted helpers")
