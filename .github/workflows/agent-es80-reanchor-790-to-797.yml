name: Agent ES80 reanchor exact sequence on current flagship

on:
  push:
    branches:
      - integration/es80-v14-share-structural-exact-sequence/gpt56-thinking-go

permissions:
  contents: write

jobs:
  reanchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-share-structural-exact-sequence/gpt56-thinking-go
          fetch-depth: 0

      - name: Compose current flagship lineage
        shell: bash
        run: |
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin integration/es80-v14-abort-recovery-current-shell/chatgpt56
          git merge --no-ff origin/integration/es80-v14-abort-recovery-current-shell/chatgpt56 -m 'merge(capture): reanchor exact sequence on current #797 flagship'
          rm .github/workflows/agent-es80-reanchor-790-to-797.yml
          git add .github/workflows/agent-es80-reanchor-790-to-797.yml
          git commit -m 'chore(capture): remove temporary reanchor workflow'
          git push origin HEAD:integration/es80-v14-share-structural-exact-sequence/gpt56-thinking-go
