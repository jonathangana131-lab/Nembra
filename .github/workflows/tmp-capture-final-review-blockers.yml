name: Temporary Capture final review blocker materializer

on:
  push:
    branches:
      - fix/v14-capture-final-review-blockers-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify helper-only branch state
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='2495f51030b9a80859635df6d48cb7074b9eea6e'
          changed="$(git diff --name-only "$expected_parent"..HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/tmp-capture-final-review-blockers.yml \
            scripts/ci/tmp_capture_final_review_blockers.py | sort)"
          test "$changed" = "$expected"

      - name: Apply final review repairs
        run: python3 scripts/ci/tmp_capture_final_review_blockers.py

      - name: Commit durable repair and self-delete helpers
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='2495f51030b9a80859635df6d48cb7074b9eea6e'
          git rm \
            .github/workflows/tmp-capture-final-review-blockers.yml \
            scripts/ci/tmp_capture_final_review_blockers.py
          git add \
            .github/workflows/capture-field-build-provenance.yml \
            NembraApp/Features/Research/TuyaAccountBridge.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          git diff --cached --check
          changed="$(git diff --name-only "$expected_parent" | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-field-build-provenance.yml \
            NembraApp/Features/Research/TuyaAccountBridge.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift | sort)"
          test "$changed" = "$expected"
          git config user.name 'nembra-v14-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(capture): preserve metadata truth and provenance coverage'
          git push origin HEAD:fix/v14-capture-final-review-blockers-sol