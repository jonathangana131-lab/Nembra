name: Capture Experiment One strict receipt r3

on:
  push:
    branches:
      - agent/capture-exp1-strict-receipt-v14-r3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard workflow-only staging and apply narrow truth repair
        shell: bash
        run: |
          set -euo pipefail
          base='c3e03f82d43e0cf0bfa6f4a5fc74810ee4f35256'
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD)"
          test "$changed" = '.github/workflows/capture-exp1-strict-receipt-r3.yml'

          python3 - <<'PY'
          from pathlib import Path

          controller = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift')
          text = controller.read_text()
          old = 'latestAdvertisement.receivedAtUptimeNanoseconds >= preview.issuedAtUptimeNanoseconds'
          new = 'latestAdvertisement.receivedAtUptimeNanoseconds > preview.issuedAtUptimeNanoseconds'
          assert text.count(old) == 1, text.count(old)
          controller.write_text(text.replace(old, new))

          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneRecoverableRediscoveryTests.swift')
          source = test.read_text()
          old_test = 'let freshness = try #require(method.range(of: "receivedAtUptimeNanoseconds >="))'
          new_test = 'let freshness = try #require(method.range(of: "receivedAtUptimeNanoseconds > preview.issuedAtUptimeNanoseconds"))'
          assert source.count(old_test) == 1, source.count(old_test)
          source = source.replace(old_test, new_test)
          marker = '        #expect(freshness.lowerBound < consume.lowerBound)\n'
          assert source.count(marker) == 1
          source = source.replace(marker, marker + '        #expect(method.range(of: "receivedAtUptimeNanoseconds >=") == nil)\n')
          test.write_text(source)
          PY

          git diff --check
          grep -F 'receivedAtUptimeNanoseconds > preview.issuedAtUptimeNanoseconds' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          ! grep -F 'receivedAtUptimeNanoseconds >= preview.issuedAtUptimeNanoseconds' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          rm .github/workflows/capture-exp1-strict-receipt-r3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneRecoverableRediscoveryTests.swift .github/workflows/capture-exp1-strict-receipt-r3.yml
          git commit -m '[Capture Experiment One v14] Require strictly post-admission receipt'
          git push origin HEAD:agent/capture-exp1-strict-receipt-v14-r3
