name: Apply Dashboard Gate Fixes

on:
  push:
    branches:
      - feature/landscape-dashboard
    paths:
      - .github/workflows/fix-dashboard-gate.yml

permissions:
  contents: write

jobs:
  fix-dashboard-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/landscape-dashboard
          fetch-depth: 0

      - name: Apply targeted fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path('NembraApp/Features/Dashboard/DashboardView.swift')
          text = dashboard.read_text()
          old = '''        switch battery {\n        case ...15: "battery.0percent"\n        case ...35: "battery.25percent"\n        case ...60: "battery.50percent"\n        case ...85: "battery.75percent"\n        default: "battery.100percent"\n        }\n'''
          new = '''        return switch battery {\n        case ...15: "battery.0percent"\n        case ...35: "battery.25percent"\n        case ...60: "battery.50percent"\n        case ...85: "battery.75percent"\n        default: "battery.100percent"\n        }\n'''
          if old not in text:
              raise SystemExit('Dashboard battery icon getter did not match expected source')
          dashboard.write_text(text.replace(old, new, 1))

          home = Path('NembraApp/Features/Home/HomeView.swift')
          text = home.read_text()
          old = '''                    .buttonStyle(.plain)\n                    .disabled(vehicle.state.connection != .connected || vehicle.isVehicleCommandPending)\n                }\n            }\n            .padding(4)\n            .background(\n                Color.primary.opacity(0.055),\n                in: RoundedRectangle(cornerRadius: 17, style: .continuous)\n            )\n            .accessibilityLabel("Ride mode")\n'''
          new = '''                    .buttonStyle(.plain)\n                    .disabled(vehicle.state.connection != .connected || vehicle.isVehicleCommandPending)\n                    .accessibilityLabel(mode.displayName)\n                    .accessibilityIdentifier("home.mode.\\(mode.displayName.lowercased())")\n                }\n            }\n            .padding(4)\n            .background(\n                Color.primary.opacity(0.055),\n                in: RoundedRectangle(cornerRadius: 17, style: .continuous)\n            )\n'''
          if old not in text:
              raise SystemExit('Inherited Home mode selector context did not match expected source')
          home.write_text(text.replace(old, new, 1))

          tests = Path('NembraUITests/NembraUITests.swift')
          text = tests.read_text()
          if 'final class NembraUITests: XCTestCase {' in text:
              text = text.replace('final class NembraUITests: XCTestCase {', '@MainActor\nfinal class NembraUITests: XCTestCase {', 1)
          old = '        let drive = app.buttons["Drive"]\n'
          new = '        let drive = app.buttons["home.mode.drive"]\n'
          if old not in text:
              raise SystemExit('Inherited Home Drive query did not match expected source')
          tests.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/Features/Dashboard/DashboardView.swift NembraApp/Features/Home/HomeView.swift NembraUITests/NembraUITests.swift
          git commit -m "fix: clear Dashboard compile and accessibility gates"
          git push origin HEAD:feature/landscape-dashboard
