name: Validate Acceleration Archive

on:
  push:
    branches:
      - parallel/validate-acceleration-archive/chat-q7m4

permissions:
  contents: read

jobs:
  nembra-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
