name: Capture Final GO Control Worktree Current

on:
  push:
    branches:
      - repair/v14-final-go-control-worktree-custody-r2-sol
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/tests/test_es80_final_go_control_worktree_custody_current.py
      - .github/workflows/capture-final-go-control-worktree-current.yml

permissions:
  contents: read

jobs:
  control-worktree-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind to exact checked-out head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile regression
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_final_go_control_worktree_custody_current.py
      - name: Require accepted control worktree bytes
        run: python3 scripts/ci/tests/test_es80_final_go_control_worktree_custody_current.py
