name: Materialize Capture secret classifier simplification

on:
  push:
    branches:
      - sol/v14-capture-membership-status-current-1c408

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0bd2eff9daffcf36fdbc3b66223b9c5171dab97c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-capture-sessionkey-dedup.yml"

      - name: Remove duplicate classifier and validate source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()
          old = '''        "refreshtoken",
                  "sessionkey",
                  "authkey",'''
          new = '''        "refreshtoken",
                  "authkey",'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one duplicate sessionkey tail, found {source.count(old)}')
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          test "$(grep -Foc '"'"'sessionkey'"'"',' NembraApp/App/NembraCaptureEntrypoint.swift)" -ge 1
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --check

      - name: Publish clean checkpoint
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-sessionkey-dedup.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/materialize-capture-sessionkey-dedup.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor(capture): deduplicate session-key classifier'
          git push origin HEAD:sol/v14-capture-membership-status-current-1c408
