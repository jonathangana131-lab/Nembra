name: TEMP R3 Generated Helper R4 Materializer

on:
  push:
    branches:
      - repair/v14-r3-generated-helper-execution-r4-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exact Git-object helper execution on current R3
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 40f835a28e3f61b125c47c1922d7da2af20eba63 HEAD
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py')
          source = path.read_text()
          old = '''def _current_generated_subject(root: Path) -> str:\n    helper = root / GENERATED_HELPER_PATH\n    try:\n        process = subprocess.run(\n            [\n                "/usr/bin/python3",\n                "-I",\n                "-B",\n                str(helper),\n                "--lockfile",\n                str(root / "Podfile.lock"),\n                "--pods",\n                str(root / "Pods"),\n                "--workspace",\n                str(root / "NembraCapture.xcworkspace"),\n            ],\n            cwd=root,\n            env={"PATH": "/usr/bin:/bin"},\n            text=True,\n            stdout=subprocess.PIPE,\n            stderr=subprocess.PIPE,\n            check=False,\n        )\n    except OSError as error:\n        raise GeneratedSubjectGoError("generated CocoaPods build-subject helper could not run") from error\n    value = process.stdout.strip()\n    if process.returncode != 0 or not HEX64.fullmatch(value) or value != value.lower():\n        raise GeneratedSubjectGoError("generated CocoaPods build subject could not be re-derived exactly")\n    return value\n'''
          new = '''def _accepted_helper_blob_bytes(root: Path, source: str, accepted_blob: str) -> bytes:\n    source = source.lower()\n    accepted_blob = accepted_blob.lower()\n    if not re.fullmatch(r"[0-9a-f]{40}", source):\n        raise GeneratedSubjectGoError("generated helper source identity is not exact SHA-1 commit authority")\n    if not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", accepted_blob):\n        raise GeneratedSubjectGoError("generated helper accepted Git blob identity is invalid")\n    environment = {"PATH": "/usr/bin:/bin", "GIT_NO_REPLACE_OBJECTS": "1"}\n    try:\n        owned = subprocess.run(\n            ["/usr/bin/git", "-C", str(root), "rev-parse", f"{source}:{GENERATED_HELPER_PATH}"],\n            env=environment, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True,\n        ).stdout.decode("ascii").strip().lower()\n        if owned != accepted_blob:\n            raise GeneratedSubjectGoError("generated helper blob is not owned by exact accepted source path")\n        raw = subprocess.run(\n            ["/usr/bin/git", "-C", str(root), "cat-file", "blob", accepted_blob],\n            env=environment, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True,\n        ).stdout\n        verified = subprocess.run(\n            ["/usr/bin/git", "-C", str(root), "hash-object", "--stdin"],\n            env=environment, input=raw, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True,\n        ).stdout.decode("ascii").strip().lower()\n    except (OSError, subprocess.CalledProcessError, UnicodeDecodeError) as error:\n        raise GeneratedSubjectGoError("generated helper accepted Git object could not be read exactly") from error\n    if verified != accepted_blob:\n        raise GeneratedSubjectGoError("generated helper Git-object bytes failed exact identity verification")\n    return raw\n\n\ndef _current_generated_subject(root: Path, *, source: str, accepted_blob: str) -> str:\n    helper_bytes = _accepted_helper_blob_bytes(root, source, accepted_blob)\n    try:\n        process = subprocess.run(\n            [\n                "/usr/bin/python3", "-I", "-B", "-",\n                "--lockfile", str(root / "Podfile.lock"),\n                "--pods", str(root / "Pods"),\n                "--workspace", str(root / "NembraCapture.xcworkspace"),\n            ],\n            cwd=root, env={"PATH": "/usr/bin:/bin"}, input=helper_bytes,\n            stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False,\n        )\n    except OSError as error:\n        raise GeneratedSubjectGoError("generated CocoaPods build-subject accepted helper bytes could not run") from error\n    try:\n        value = process.stdout.decode("utf-8").strip()\n    except UnicodeDecodeError as error:\n        raise GeneratedSubjectGoError("generated CocoaPods build-subject helper output is not UTF-8") from error\n    if process.returncode != 0 or not HEX64.fullmatch(value) or value != value.lower():\n        raise GeneratedSubjectGoError("generated CocoaPods build subject could not be re-derived exactly")\n    return value\n'''
          if source.count(old) != 1:
              raise SystemExit('current R3 generated helper execution block not found exactly once')
          source = source.replace(old, new, 1)
          old_call = '    current = derive_subject(root)\n'
          new_call = '''    if derive_subject is _current_generated_subject:\n        current = derive_subject(root, source=source, accepted_blob=blobs[GENERATED_HELPER_PATH])\n    else:\n        current = derive_subject(root)\n'''
          if source.count(old_call) != 1:
              raise SystemExit('current R3 derive call not found exactly once')
          source = source.replace(old_call, new_call, 1)
          path.write_text(source)
          PY

          python3 -B -m py_compile \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py \
            scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
          python3 -B scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py
          python3 -B scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py
          python3 -B scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
          git diff --check

      - name: Publish current source repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py; then
            exit 0
          fi
          git config user.name 'nembra-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py
          git commit -m 'fix(capture): pin current R3 helper execution bytes'
          git push origin HEAD:repair/v14-r3-generated-helper-execution-r4-sol
