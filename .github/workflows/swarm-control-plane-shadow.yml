name: Swarm Control Plane Shadow

on:
  pull_request:
    paths:
      - '.swarm/**'
      - 'SWARM_GO.md'
      - 'SWARM_COORDINATION.md'
      - 'scripts/swarm_control.py'
      - 'scripts/swarm_v16_dogfood.py'
      - 'scripts/swarm_v16_activate.py'
      - 'scripts/swarm_v16_review.py'
      - 'scripts/swarmcp/**'
      - 'scripts/ci/tests/test_swarm_*.py'
      - 'docs/SWARM_CONTROL_PLANE.md'
      - 'docs/SWARM_OPERATING_SYSTEM.md'
      - 'docs/adr/ADR-0015-github-native-swarm-control-plane.md'
      - '.github/workflows/swarm-control-plane-shadow.yml'
      - '.github/workflows/swarm-v16-activate.yml'
  push:
    branches:
      - main
    paths:
      - '.swarm/**'
      - 'SWARM_GO.md'
      - 'SWARM_COORDINATION.md'
      - 'scripts/swarm_control.py'
      - 'scripts/swarm_v16_dogfood.py'
      - 'scripts/swarm_v16_activate.py'
      - 'scripts/swarm_v16_review.py'
      - 'scripts/swarmcp/**'
      - 'scripts/ci/tests/test_swarm_*.py'
      - 'docs/SWARM_CONTROL_PLANE.md'
      - 'docs/SWARM_OPERATING_SYSTEM.md'
      - 'docs/adr/ADR-0015-github-native-swarm-control-plane.md'
      - '.github/workflows/swarm-control-plane-shadow.yml'
      - '.github/workflows/swarm-v16-activate.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  deterministic-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind validation to exact checked-out head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile trusted control-plane code
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/swarm_control.py \
            scripts/swarm_v16_dogfood.py \
            scripts/swarm_v16_activate.py \
            scripts/swarm_v16_review.py \
            scripts/swarmcp/*.py \
            scripts/ci/tests/test_swarm_*.py
      - name: Validate trusted static config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'scripts')
          import swarm_control
          with open('.swarm/config.json', encoding='utf-8') as handle:
              swarm_control.validate_config(json.load(handle))
          print('static swarm config valid')
          PY
      - name: Run adversarial control-plane tests
        run: python3 -m unittest discover -v scripts/ci/tests 'test_swarm_*.py'
      - name: Prove V15 30-worker deterministic race simulation
        run: python3 scripts/swarm_control.py simulate --workers 30
      - name: Prove V16 Mission Graph 30-worker convergence simulation
        run: python3 scripts/swarm_control.py v16-simulate --workers 30

  independent-v16-review:
    needs: deterministic-control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run independent safety and architecture invariant review
        run: python3 scripts/swarm_v16_review.py

  live-v16-dogfood:
    if: github.event_name == 'pull_request'
    needs: [deterministic-control-plane, independent-v16-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Ingest current legacy state and active PR topology
        run: |
          set -euo pipefail
          python3 scripts/swarm_v16_dogfood.py \
            --self-integration-proof \
            --output /tmp/swarm-v16-dogfood.json
      - name: Publish dogfood evidence
        uses: actions/upload-artifact@v4
        with:
          name: swarm-v16-dogfood-${{ github.event.pull_request.head.sha }}
          path: /tmp/swarm-v16-dogfood.json
          if-no-files-found: error
          retention-days: 14

  pr-metadata-shadow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Observe swarm metadata without breaking legacy PRs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          import swarm_control
          try:
              metadata = swarm_control.validate_pr_metadata(os.environ.get('PR_BODY', ''))
          except swarm_control.ValidationError as exc:
              print(f'::warning title=Swarm shadow metadata::{exc}')
          else:
              print('controlled PR metadata:', metadata)
          PY
