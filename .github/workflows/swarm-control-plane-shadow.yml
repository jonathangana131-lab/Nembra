name: Swarm Control Plane

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main
    paths:
      - '.swarm/**'
      - 'SWARM_GO.md'
      - 'scripts/swarm_control.py'
      - 'scripts/swarmcp/**'
      - 'scripts/ci/tests/test_swarm_*.py'
      - 'docs/SWARM_CONTROL_PLANE.md'
      - 'docs/adr/ADR-0015-github-native-swarm-control-plane.md'
      - '.github/workflows/swarm-control-plane-shadow.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-control-plane:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind validation to exact checked-out head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile trusted control-plane code
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/swarm_control.py \
            scripts/swarmcp/*.py \
            scripts/ci/tests/test_swarm_*.py
      - name: Validate trusted static config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'scripts')
          import swarm_control
          with open('.swarm/config.json', encoding='utf-8') as handle:
              swarm_control.validate_config(json.load(handle))
          print('static swarm config valid')
          PY
      - name: Run adversarial control-plane tests
        run: python3 -m unittest discover -v scripts/ci/tests 'test_swarm_*.py'
      - name: Prove 30-worker deterministic race simulation
        run: python3 scripts/swarm_control.py simulate --workers 30

  controlled-pr-enforcement:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch trusted base and live swarm state
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          git fetch origin swarm-state:refs/remotes/origin/swarm-state
      - name: Materialize exact live state with trusted base config
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nembra-swarm-live"
          TRUSTED="$RUNNER_TEMP/nembra-swarm-trusted"
          mkdir -p "$ROOT/.swarm" "$TRUSTED"
          git show "origin/${GITHUB_BASE_REF}:.swarm/config.json" > "$ROOT/.swarm/config.json"
          git archive origin/swarm-state .swarm/runtime | tar -x -C "$ROOT"
          git archive "origin/${GITHUB_BASE_REF}" scripts/swarm_control.py scripts/swarmcp | tar -x -C "$TRUSTED"
          echo "SWARM_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "TRUSTED_ROOT=$TRUSTED" >> "$GITHUB_ENV"
      - name: Collect exact changed-file set
        run: |
          set -euo pipefail
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > "$RUNNER_TEMP/nembra-swarm-changed-files.txt"
      - name: Enforce ownership using trusted base generation
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [[ -f "$TRUSTED_ROOT/scripts/swarmcp/maximum.py" ]]; then
            PYTHONPATH="$TRUSTED_ROOT/scripts" python3 -m swarmcp.maximum render --root "$SWARM_ROOT"
            PYTHONPATH="$TRUSTED_ROOT/scripts" python3 -m swarmcp.maximum pr-check \
              --root "$SWARM_ROOT" \
              --event "$GITHUB_EVENT_PATH" \
              --changed-files "$RUNNER_TEMP/nembra-swarm-changed-files.txt"
          else
            # One bootstrap generation: the old trusted base did not yet contain
            # V16 enforcement. It may validate metadata, but cannot use PR-head
            # code to police itself. After V16 lands, every later PR takes the
            # hardened trusted-base path above.
            PYTHONPATH="$TRUSTED_ROOT/scripts" python3 - <<'PY'
          import os
          import swarm_control
          body = os.environ.get('PR_BODY', '')
          try:
              meta = swarm_control.validate_pr_metadata(body)
          except swarm_control.ValidationError as exc:
              print(f'::warning title=V16 bootstrap shadow::{exc}')
          else:
              print('V16 bootstrap metadata:', meta)
          PY
          fi

  state-projection:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Materialize live swarm-state snapshot
        run: |
          set -euo pipefail
          git fetch origin swarm-state:refs/remotes/origin/swarm-state
          CONTROL_SHA="$(git rev-parse origin/swarm-state)"
          echo "CONTROL_SHA=$CONTROL_SHA" >> "$GITHUB_ENV"
          ROOT="$RUNNER_TEMP/nembra-swarm-projection"
          mkdir -p "$ROOT/.swarm"
          cp .swarm/config.json "$ROOT/.swarm/config.json"
          git archive "$CONTROL_SHA" .swarm/runtime | tar -x -C "$ROOT"
          echo "SWARM_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Validate and rebuild digest-fenced projection
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -m swarmcp.maximum validate-local --root "$SWARM_ROOT"
          PYTHONPATH=scripts python3 -m swarmcp.maximum render --root "$SWARM_ROOT"
          PYTHONPATH=scripts python3 -m swarmcp.maximum verify-fence --root "$SWARM_ROOT"
      - name: Publish generated projection without overwriting newer state
        run: |
          set -euo pipefail
          EXPECTED="${CONTROL_SHA:?materialized swarm-state SHA missing}"
          git switch --detach "$EXPECTED"
          mkdir -p .swarm/runtime/generated
          rm -rf .swarm/runtime/generated/*
          cp -R "$SWARM_ROOT/.swarm/runtime/generated/." .swarm/runtime/generated/
          [[ -n "$(git status --porcelain -- .swarm/runtime/generated)" ]] || exit 0
          git config user.name nembra-swarm-control
          git config user.email actions@users.noreply.github.com
          git add .swarm/runtime/generated
          git commit -m 'chore(swarm): publish validated V16 projection [swarm-generated]'
          git fetch origin swarm-state:refs/remotes/origin/swarm-state
          [[ "$(git rev-parse origin/swarm-state)" == "$EXPECTED" ]] || { echo 'swarm-state advanced; refusing stale projection'; exit 1; }
          git push origin HEAD:swarm-state
