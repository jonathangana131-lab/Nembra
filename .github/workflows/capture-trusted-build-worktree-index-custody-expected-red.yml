name: Capture Trusted Build Worktree Index Custody Expected Red

on:
  push:
    branches:
      - validation/v14-trusted-build-worktree-index-custody/gpt56-go
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/capture-xcode27-trusted-command.yml
      - scripts/ci/xcode27_simulator_capture.sh
      - scripts/ci/tests/test_capture_trusted_build_worktree_index_custody_expected_red.py
      - .github/workflows/capture-trusted-build-worktree-index-custody-expected-red.yml

permissions:
  contents: read

jobs:
  expected-red:
    name: Reject hidden-index exact-source bypass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
      - name: Compile worktree-index custody regression
        run: python3 -m py_compile scripts/ci/tests/test_capture_trusted_build_worktree_index_custody_expected_red.py
      - name: Require final build boundary to reject hidden tracked divergence
        run: python3 scripts/ci/tests/test_capture_trusted_build_worktree_index_custody_expected_red.py -v
