name: TEMP ES80 Authority Final Share Convergence

on:
  push:
    branches:
      - temp/es80-authority-finalshare-convergence-a198-gpt56

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/es80-authority-finalshare-convergence-a198-gpt56
          fetch-depth: 0
      - name: Materialize audited convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path('NembraApp/App/NembraApp.swift')
          s = app.read_text(encoding='utf-8')
          old = '''    private var researchBuildForRendezvous: PassiveBluetoothExperimentOneFieldExecutionGate.ResearchBuild? {
        switch coordinator.status.fieldExecutionStatus {
        case let .goPrivateResearchBuild(build):
            return build
        case .noGo:
            return nil
        }
    }
'''
          new = '''    private var researchBuildForRendezvous: PassiveBluetoothExperimentOneFieldExecutionGate.ResearchBuild? {
        let status = coordinator.status
        guard status.physicalProcedurePermitted else { return nil }
        switch status.fieldExecutionStatus {
        case let .goPrivateResearchBuild(build):
            return build
        case .noGo:
            return nil
        }
    }
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one preflight authority block, found {s.count(old)}')
          app.write_text(s.replace(old, new, 1), encoding='utf-8')

          focused = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureFieldRuntimeRendezvousTests.swift')
          s = focused.read_text(encoding='utf-8')
          old = '        #expect(preflight.contains("coordinator.status.fieldExecutionStatus"))\n'
          new = '''        #expect(preflight.contains("let status = coordinator.status"))
        #expect(preflight.contains("guard status.physicalProcedurePermitted else"))
        #expect(preflight.contains("switch status.fieldExecutionStatus"))
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one field-status assertion, found {s.count(old)}')
          focused.write_text(s.replace(old, new, 1), encoding='utf-8')

          ui = Path('NembraUITests/ES80ResearchCaptureUITests.swift')
          s = ui.read_text(encoding='utf-8')
          old = '''        XCTAssertTrue(
            source.contains("guard let data = finalShareData"),
            "A temporary Share-file retry must reuse retained verified bytes rather than mint a new evidence artifact."
        )
'''
          new = '''        XCTAssertTrue(
            source.contains("if finalShareData != nil,"),
            "A temporary Share-file retry must require retained verified final Share bytes."
        )
        XCTAssertTrue(
            source.contains("finalShareIntegrityReport != nil,"),
            "A temporary Share-file retry must retain the exact integrity report rather than mint new evidence."
        )
        XCTAssertTrue(
            source.contains("finalShareFilename != nil {"),
            "A temporary Share-file retry must retain the verified filename alongside the verified bytes."
        )
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale Final Share assertion block, found {s.count(old)}')
          ui.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit materialized blobs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraApp.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureFieldRuntimeRendezvousTests.swift NembraUITests/ES80ResearchCaptureUITests.swift
          git commit -m 'temp: materialize authority final-share convergence'
          git push origin HEAD:temp/es80-authority-finalshare-convergence-a198-gpt56
