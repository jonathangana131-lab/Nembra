name: Temporary Retire Passive Final GO CLI v5

on:
  push:
    branches:
      - repair/v14-retire-passive-final-go-cli-sol
    paths:
      - .github/workflows/tmp-retire-passive-final-go-cli-v5.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-retire-passive-final-go-cli-sol
          fetch-depth: 0

      - name: Apply and validate retirement
        env:
          EXPECTED_BASE: 8292b51e5df90744950e7f0d4a04684523520563
          BRANCH: repair/v14-retire-passive-final-go-cli-sol
        run: |
          set -euo pipefail
          trigger="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git diff --name-only "$EXPECTED_BASE" HEAD)" = '.github/workflows/tmp-retire-passive-final-go-cli-v5.yml'

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          script = Path('scripts/ci/es80_today_final_go_hardened.py')
          text = script.read_text()
          start = text.index('def main(argv: list[str] | None = None) -> int:\n')
          end = text.index('\n\nif __name__ == "__main__":\n', start)
          replacement = dedent('''\
          RETIRED_DIRECT_EXECUTION_MESSAGE = (
              "retired ES80-FINGERPRINT-v1 Final GO authority is non-authorizing; "
              "current physical authorization requires the external reviewed "
              "ES80-AUTHENTICATED-STATIONARY-v1 control plane"
          )


          def main(argv: list[str] | None = None) -> int:
              arguments = sys.argv[1:] if argv is None else list(argv)
              if any(argument in {"-h", "--help"} for argument in arguments):
                  # Preserve the historical self-documentation checked by legacy QA.
                  _args(arguments)
                  return 0
              print(f"TODAY Final GO: NO-GO: {RETIRED_DIRECT_EXECUTION_MESSAGE}", file=sys.stderr)
              return 2''')
          script.write_text(text[:start] + replacement + text[end:])

          tests = Path('scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py')
          text = tests.read_text()
          marker = '    def test_public_foundation_imported_builder_is_non_authorizing(self):\n'
          addition = dedent('''\
          def test_retired_hardened_real_execution_is_non_authorizing(self):
              completed = subprocess.run(
                  [sys.executable, str(CI_DIR / "es80_today_final_go_hardened.py"), "--output", "/tmp/retired-final-go.json"],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              self.assertEqual(completed.returncode, 2)
              self.assertEqual(completed.stdout, "")
              self.assertIn("retired ES80-FINGERPRINT-v1 Final GO authority is non-authorizing", completed.stderr)
              self.assertIn("ES80-AUTHENTICATED-STATIONARY-v1", completed.stderr)
              self.assertNotIn("TODAY Final GO record:", completed.stderr)

          ''')
          addition = ''.join(('    ' + line if line.strip() else line) for line in addition.splitlines(keepends=True))
          if text.count(marker) != 1 or 'test_retired_hardened_real_execution_is_non_authorizing' in text:
              raise SystemExit('retirement regression insertion mismatch')
          tests.write_text(text.replace(marker, addition + marker, 1))
          PY

          git diff --check
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py
          python3 scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py -v
          python3 scripts/ci/tests/test_es80_today_final_go_hardened.py -v
          python3 scripts/ci/tests/test_es80_today_final_go_legacy_entrypoint.py -v
          help="$(python3 scripts/ci/es80_today_final_go_hardened.py --help)"
          grep -Fq -- '--operator-attestation' <<<"$help"
          grep -Fq -- '--trusted-xcode-run-id' <<<"$help"
          grep -Fq -- '--trusted-xcode-job-id' <<<"$help"
          grep -Fq -- '--trusted-xcode-artifact-id' <<<"$help"

          rm .github/workflows/tmp-retire-passive-final-go-cli-v5.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): retire passive Final-GO executable authority'

          expected="$(printf '%s\n' scripts/ci/es80_today_final_go_hardened.py scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py | sort)"
          actual="$(git diff --name-only "$EXPECTED_BASE" HEAD | sort)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$trigger"
          git push origin HEAD:"$BRANCH"