name: Apply Home Mode Accessibility Fix

on:
  push:
    branches:
      - feature/home-rebuild
    paths:
      - .github/workflows/fix-home-mode-accessibility.yml

permissions:
  contents: write

jobs:
  fix-home-mode-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/home-rebuild
          fetch-depth: 0

      - name: Make each ride mode independently accessible
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('NembraApp/Features/Home/HomeView.swift')
          text = home.read_text()
          old = '''                    .buttonStyle(.plain)\n                    .disabled(vehicle.state.connection != .connected || vehicle.isVehicleCommandPending)\n                }\n            }\n            .padding(4)\n            .background(\n                Color.primary.opacity(0.055),\n                in: RoundedRectangle(cornerRadius: 17, style: .continuous)\n            )\n            .accessibilityLabel("Ride mode")\n'''
          new = '''                    .buttonStyle(.plain)\n                    .disabled(vehicle.state.connection != .connected || vehicle.isVehicleCommandPending)\n                    .accessibilityLabel(mode.displayName)\n                    .accessibilityIdentifier("home.mode.\\(mode.displayName.lowercased())")\n                }\n            }\n            .padding(4)\n            .background(\n                Color.primary.opacity(0.055),\n                in: RoundedRectangle(cornerRadius: 17, style: .continuous)\n            )\n'''
          if old not in text:
              raise SystemExit('Home mode selector context did not match expected source')
          home.write_text(text.replace(old, new, 1))

          tests = Path('NembraUITests/NembraUITests.swift')
          text = tests.read_text()
          old = '        let drive = app.buttons["Drive"]\n'
          new = '        let drive = app.buttons["home.mode.drive"]\n'
          if old not in text:
              raise SystemExit('Home UI test Drive query did not match expected source')
          tests.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/Features/Home/HomeView.swift NembraUITests/NembraUITests.swift
          git commit -m "fix: expose Home ride modes to accessibility"
          git push origin HEAD:feature/home-rebuild
