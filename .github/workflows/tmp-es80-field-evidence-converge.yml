name: Temporary ES80 field evidence convergence

on:
  push:
    branches:
      - integration/es80-v14-field-evidence-convergence-current/chatgpt56-thinking-go

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/es80-v14-field-evidence-convergence-current/chatgpt56-thinking-go

      - name: Copy reviewed repair blobs from staging lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            refs/heads/integration/es80-v14-field-evidence-convergence/chatgpt56-thinking-go:refs/remotes/origin/es80-field-evidence-reviewed
          git show origin/es80-field-evidence-reviewed:scripts/ci/es80_signed_field_artifact_evidence.py \
            > scripts/ci/es80_signed_field_artifact_evidence.py
          git show origin/es80-field-evidence-reviewed:docs/ES80_SIGNED_FIELD_ARTIFACT_EVIDENCE.md \
            > docs/ES80_SIGNED_FIELD_ARTIFACT_EVIDENCE.md

      - name: Validate exact repaired producer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_evidence.py
          python3 scripts/ci/es80_signed_field_artifact_evidence.py --self-test

      - name: Publish functional two-file delta and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-es80-field-evidence-converge.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/ci/es80_signed_field_artifact_evidence.py \
                  docs/ES80_SIGNED_FIELD_ARTIFACT_EVIDENCE.md \
                  .github/workflows/tmp-es80-field-evidence-converge.yml
          git diff --cached --check
          git commit -m '[Capture field provenance v14] Reanchor canonical atomic field evidence'
          git push origin HEAD:integration/es80-v14-field-evidence-convergence-current/chatgpt56-thinking-go
