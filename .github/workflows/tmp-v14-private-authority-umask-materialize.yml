name: tmp V14 Private Authority Umask Materializer

on:
  push:
    branches:
      - repair/v14-private-recovery-unlink-race-sol-4f57unlink-20260811
    paths:
      - .github/workflows/tmp-v14-private-authority-umask-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Bind materializer to reviewed exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '4242a18e699285bd5078357b36bc610adc79496f'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/tmp-v14-private-authority-umask-materialize.yml'

      - name: Materialize umask-safe protected authority directory
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib

          helper_path = Path('Scripts/capture_tuya_private_identity_authority.py')
          test_path = Path('scripts/ci/tests/test_capture_private_identity_authority_receipt.py')
          pin_paths = [
              Path('Scripts/provision_capture_tuya_identity.sh'),
              Path('Scripts/bootstrap_capture_tuya_sdk.sh'),
              Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift'),
              Path('scripts/ci/tests/test_capture_private_identity_failed_bootstrap_authority.py'),
          ]
          old_digest = 'ca8491135545ad97ef4dc8e995f307720f25e3265ded0881fbfdf37ca845e9a1'

          helper = helper_path.read_text(encoding='utf-8')
          start = helper.index('def _authority_directory_fd(')
          end = helper.index('\ndef _receipt_name(', start)
          replacement = '''def _authority_directory_fd(\n    authority_root: Path,\n    *,\n    create: bool,\n    authority_uid: int,\n) -> int | None:\n    created = False\n    try:\n        metadata = authority_root.lstat()\n    except FileNotFoundError:\n        if not create:\n            return None\n        try:\n            # The caller intentionally runs with umask 077. Create privately\n            # first, admit the exact root-owned directory by descriptor, then\n            # relax only that held inode to the non-secret verifier mode 0755.\n            os.mkdir(authority_root, 0o700)\n            created = True\n            metadata = authority_root.lstat()\n        except OSError as exc:\n            raise AuthorityError(\"could not create the protected private identity authority directory\") from exc\n    except OSError as exc:\n        raise AuthorityError(\"could not inspect the private identity authority directory\") from exc\n\n    if (\n        stat.S_ISLNK(metadata.st_mode)\n        or not stat.S_ISDIR(metadata.st_mode)\n        or metadata.st_uid != authority_uid\n    ):\n        raise AuthorityError(\"private identity authority directory is not protected by expected ownership\")\n\n    mode = stat.S_IMODE(metadata.st_mode)\n    normalize_private_creation = create and mode == 0o700\n    if not created and mode != 0o755 and not normalize_private_creation:\n        raise AuthorityError(\"private identity authority directory is not protected by expected ownership\")\n\n    try:\n        descriptor = os.open(authority_root, _directory_flags())\n    except OSError as exc:\n        raise AuthorityError(\"could not open the private identity authority directory\") from exc\n    try:\n        held = os.fstat(descriptor)\n        current = authority_root.lstat()\n        if (\n            not stat.S_ISDIR(held.st_mode)\n            or held.st_uid != authority_uid\n            or _stat_identity(held) != _stat_identity(current)\n        ):\n            raise AuthorityError(\"private identity authority directory changed during admission\")\n\n        if created or normalize_private_creation:\n            # fchmod targets the already-admitted inode. This also repairs a\n            # root-owned 0700 directory stranded by the pre-fix umask path.\n            os.fchmod(descriptor, 0o755)\n            held = os.fstat(descriptor)\n            current = authority_root.lstat()\n            if (\n                not stat.S_ISDIR(held.st_mode)\n                or held.st_uid != authority_uid\n                or stat.S_IMODE(held.st_mode) != 0o755\n                or _stat_identity(held) != _stat_identity(current)\n            ):\n                raise AuthorityError(\"private identity authority directory mode could not be normalized safely\")\n        elif stat.S_IMODE(held.st_mode) != 0o755:\n            raise AuthorityError(\"private identity authority directory mode changed during admission\")\n        return descriptor\n    except Exception:\n        os.close(descriptor)\n        raise\n\n'''
          helper = helper[:start] + replacement + helper[end + 1:]
          helper_path.write_text(helper, encoding='utf-8')
          new_digest = hashlib.sha256(helper.encode('utf-8')).hexdigest()

          test = test_path.read_text(encoding='utf-8')
          if 'import stat\n' not in test:
              test = test.replace('import os\n', 'import os\nimport stat\n', 1)
          old_test = '''    def test_unprotected_authority_directory_is_rejected(self) -> None:\n        with tempfile.TemporaryDirectory(prefix=\"nembra-private-authority-mode-\") as temporary:\n            helper, checkout, authority_root, uid, writer_sha, podspec_sha, identity_sha, _, _ = self.make_subject(temporary)\n            authority_root.mkdir(mode=0o700)\n            authority_root.chmod(0o700)\n            with self.assertRaises(helper.AuthorityError):\n                helper._seal_current_subject(\n                    checkout,\n                    operator_uid=uid,\n                    expected_writer_sha256=writer_sha,\n                    expected_podspec_sha256=podspec_sha,\n                    expected_identity_sha256=identity_sha,\n                    authority_root=authority_root,\n                    authority_uid=uid,\n                )\n'''
          new_test = '''    def test_strict_umask_creation_is_normalized_for_unprivileged_verify(self) -> None:\n        with tempfile.TemporaryDirectory(prefix=\"nembra-private-authority-umask-\") as temporary:\n            helper, checkout, authority_root, uid, writer_sha, podspec_sha, identity_sha, _, _ = self.make_subject(temporary)\n            previous_umask = os.umask(0o077)\n            try:\n                receipt = helper._seal_current_subject(\n                    checkout,\n                    operator_uid=uid,\n                    expected_writer_sha256=writer_sha,\n                    expected_podspec_sha256=podspec_sha,\n                    expected_identity_sha256=identity_sha,\n                    authority_root=authority_root,\n                    authority_uid=uid,\n                )\n            finally:\n                os.umask(previous_umask)\n            self.assertTrue(receipt.is_file())\n            self.assertEqual(stat.S_IMODE(authority_root.stat().st_mode), 0o755)\n            self.assertEqual(\n                helper._verify_current_subject(\n                    checkout,\n                    operator_uid=uid,\n                    expected_writer_sha256=writer_sha,\n                    authority_root=authority_root,\n                    authority_uid=uid,\n                ),\n                receipt,\n            )\n\n    def test_root_owned_private_mode_residue_is_normalized_on_next_seal(self) -> None:\n        with tempfile.TemporaryDirectory(prefix=\"nembra-private-authority-mode-recovery-\") as temporary:\n            helper, checkout, authority_root, uid, writer_sha, podspec_sha, identity_sha, _, _ = self.make_subject(temporary)\n            authority_root.mkdir(mode=0o700)\n            authority_root.chmod(0o700)\n            helper._seal_current_subject(\n                checkout,\n                operator_uid=uid,\n                expected_writer_sha256=writer_sha,\n                expected_podspec_sha256=podspec_sha,\n                expected_identity_sha256=identity_sha,\n                authority_root=authority_root,\n                authority_uid=uid,\n            )\n            self.assertEqual(stat.S_IMODE(authority_root.stat().st_mode), 0o755)\n\n    def test_world_writable_authority_directory_is_rejected(self) -> None:\n        with tempfile.TemporaryDirectory(prefix=\"nembra-private-authority-mode-\") as temporary:\n            helper, checkout, authority_root, uid, writer_sha, podspec_sha, identity_sha, _, _ = self.make_subject(temporary)\n            authority_root.mkdir(mode=0o700)\n            authority_root.chmod(0o777)\n            with self.assertRaises(helper.AuthorityError):\n                helper._seal_current_subject(\n                    checkout,\n                    operator_uid=uid,\n                    expected_writer_sha256=writer_sha,\n                    expected_podspec_sha256=podspec_sha,\n                    expected_identity_sha256=identity_sha,\n                    authority_root=authority_root,\n                    authority_uid=uid,\n                )\n'''
          if test.count(old_test) != 1:
              raise SystemExit('unexpected authority directory regression block')
          test_path.write_text(test.replace(old_test, new_test, 1), encoding='utf-8')

          for path in pin_paths:
              text = path.read_text(encoding='utf-8')
              if old_digest not in text:
                  raise SystemExit(f'missing prior authority digest pin in {path}')
              path.write_text(text.replace(old_digest, new_digest), encoding='utf-8')

          print(f'authority_sha256={new_digest}')
          PY

      - name: Validate authority lifecycle and downstream admission
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_identity_authority.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_authority_receipt.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_failed_bootstrap_authority.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_authority_receipt.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_failed_bootstrap_authority.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_publication_races.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_destination_ancestor_swap_current.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_crash_residue.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_recovery_unlink_race.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_final_name_binding_2874.py
          /bin/bash -n Scripts/provision_capture_tuya_identity.sh
          /bin/bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          git diff --check

      - name: Publish durable umask repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nembra Swarm'
          git config user.email 'noreply@users.noreply.github.com'
          git add \
            Scripts/capture_tuya_private_identity_authority.py \
            scripts/ci/tests/test_capture_private_identity_authority_receipt.py \
            Scripts/provision_capture_tuya_identity.sh \
            Scripts/bootstrap_capture_tuya_sdk.sh \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift \
            scripts/ci/tests/test_capture_private_identity_failed_bootstrap_authority.py
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Capture P0: normalize root authority mode after strict umask'
          git push origin "HEAD:${GITHUB_REF_NAME}"
