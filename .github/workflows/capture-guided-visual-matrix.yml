name: Capture Guided Visual Matrix

on:
  pull_request:
    paths:
      - NembraApp/App/NembraCaptureEntrypoint.swift
      - scripts/ci/capture_guided_visual_matrix.sh
      - scripts/ci/tests/test_capture_guided_visual_matrix.py
      - .github/workflows/capture-guided-visual-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guided-visual:
    name: Exact iPhone 12 guided Capture matrix
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact QA subject and source fence
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$source_sha" = "${{ github.event.pull_request.head.sha }}"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'NEMBRA_GUIDED_VISUAL_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_guided_visual_matrix.py
          /usr/bin/python3 scripts/ci/tests/test_capture_guided_visual_matrix.py
          bash -n scripts/ci/capture_guided_visual_matrix.sh
          grep -Fq '#if targetEnvironment(simulator)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'NEMBRA_CAPTURE_GUIDED_VISUAL_STATE' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Build exact public presentation app
        shell: bash
        run: |
          set -euo pipefail
          procedure='ES80-AUTHENTICATED-STATIONARY-v1'
          label="capture-v14-${NEMBRA_GUIDED_VISUAL_SOURCE_SHA:0:12}"
          rm -rf /tmp/NembraCaptureGuidedVisualDerived
          xcodebuild -project NembraCapture.xcodeproj -scheme 'Nembra Capture' -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureGuidedVisualDerived CODE_SIGNING_ALLOWED=NO \
            NEMBRA_CAPTURE_BUILD_IDENTIFIER="$label" \
            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$NEMBRA_GUIDED_VISUAL_SOURCE_SHA" \
            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="" \
            NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER="$procedure" build
          plist='/tmp/NembraCaptureGuidedVisualDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app/Info.plist'
          test "$(plutil -extract NembraCaptureBuildIdentifier raw -o - "$plist")" = "$label"
          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$NEMBRA_GUIDED_VISUAL_SOURCE_SHA"
          test "$(plutil -extract NembraCaptureProcedureIdentifier raw -o - "$plist")" = "$procedure"
          test -z "$(plutil -extract NembraCaptureTuyaDependencyLockSHA256 raw -o - "$plist" 2>/dev/null || true)"

      - name: Capture guided presentation matrix
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH='/tmp/NembraCaptureGuidedVisualDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app' \
          ARTIFACTS_DIR="$RUNNER_TEMP/NembraCaptureGuidedVisualMatrix" \
            scripts/ci/capture_guided_visual_matrix.sh
          manifest="$RUNNER_TEMP/NembraCaptureGuidedVisualMatrix/NembraCaptureGuidedVisualMatrix.json"
          /usr/bin/python3 - "$manifest" "$NEMBRA_GUIDED_VISUAL_SOURCE_SHA" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          assert r['schemaVersion']==1
          assert r['authority']=='guided-capture-simulator-presentation-only'
          assert r['sourceCommitSHA']==sys.argv[2]
          assert r['baselineDevice']=='iPhone 12' and r['baselineOS']=='iOS 27'
          assert r['procedureIdentifier']=='ES80-AUTHENTICATED-STATIONARY-v1'
          assert r['tuyaDependencyLockSHA256']==''
          assert r['fixtureCompileBoundary']=='targetEnvironment(simulator)'
          assert r['fixtureAuthorityCreated'] is False
          assert r['protocolAuthorityCreated'] is False and r['physicalAuthorityCreated'] is False
          assert r['visualAcceptanceRequiresHumanReview'] is True
          assert len(r['screenshots'])==9
          PY

      - name: Upload guided evidence
        uses: actions/upload-artifact@v4
        with:
          name: nembra-capture-guided-visual-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/NembraCaptureGuidedVisualMatrix
          if-no-files-found: error
          retention-days: 14
