name: Capture Trusted Xcode Workflow Pin QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/capture-xcode27-trusted-command.yml
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/tests/test_capture_trusted_xcode_workflow_blob_pin.py
      - .github/workflows/capture-trusted-xcode-workflow-pin-qa.yml

permissions:
  contents: read

jobs:
  workflow-pin:
    name: Require Final GO workflow pin to equal checked-in Git blob
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile workflow-pin regression
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_trusted_capture_xcode_subject.py
          python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_workflow_blob_pin.py
      - name: Validate workflow bytes match Final GO authority pin
        run: python3 scripts/ci/tests/test_capture_trusted_xcode_workflow_blob_pin.py -v
