name: V14 Capture Apple Auth E618 Materialize

on:
  push:
    branches:
      - recovery/v14-capture-apple-auth-e618-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-apple-auth-e618-sol
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e618f4d0b6507078a4505238ac6439f98fe1bbd1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply reviewed Apple account delta three-way
        shell: bash
        run: |
          set -euo pipefail
          donor_base='502cfc43d8943bacb446f287b58d46463df3a7ca'
          donor_head='7503591f5523e552b10208be464eadd9071450c0'
          git diff --binary "$donor_base" "$donor_head" -- \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            NembraCapture.entitlements \
            NembraCapture.xcodeproj/project.pbxproj \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppleAccountLoginSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppleOAuthCredentialCustodySourceTests.swift \
            docs/CAPTURE_P0_APPLE_ACCOUNT_LOGIN.md \
            docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md \
            > /tmp/apple-auth.patch
          test -s /tmp/apple-auth.patch
          git apply --3way --index /tmp/apple-auth.patch
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Verify merged current truth and Apple custody
        shell: bash
        run: |
          set -euo pipefail
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          identity='NembraApp/App/NembraCaptureBuildIdentity.swift'
          project='NembraCapture.xcodeproj/project.pbxproj'
          entitlements='NembraCapture.entitlements'
          login_test='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppleAccountLoginSourceTests.swift'
          custody_test='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppleOAuthCredentialCustodySourceTests.swift'

          grep -Fq 'import AuthenticationServices' "$app"
          grep -Fq 'SignInWithAppleButton(.signIn)' "$app"
          grep -Fq 'func loginWithApple(credential: ASAuthorizationAppleIDCredential)' "$app"
          grep -Fq 'loginByAuth2(' "$app"
          grep -Fq 'withType: "ap"' "$app"
          grep -Fq 'submittedIdentityToken: identityToken' "$app"
          grep -Fq 'appleUserIdentifier: appleUserIdentifier' "$app"
          grep -Fq 'func signOut()' "$app"
          grep -Fq 'Button("Use a different Tuya account")' "$app"
          grep -Fq '.onChange(of: sdkAccount.loggedIn)' "$app"
          grep -Fq 'else { test.invalidateSDKMembership() }' "$app"
          grep -Fq 'private var correlationDisplayedWindowOrdinal: Int' "$app"
          grep -Fq 'failureRecoveryContextPanel' "$app"
          grep -Fq 'func retry()' "$app"
          grep -Fq 'static let requiredFieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"' "$identity"
          grep -Fq 'static var fieldProcedureIdentifier: String' "$identity"
          grep -Fq 'current.procedureIdentifier' "$identity"
          grep -Fq 'CODE_SIGN_ENTITLEMENTS = NembraCapture.entitlements;' "$project"
          grep -Fq '<key>com.apple.developer.applesignin</key>' "$entitlements"
          grep -Fq 'Apple-backed Tuya account transport' "$login_test"
          grep -Fq 'identity token' "$custody_test"
          grep -Fq 'Sign in with Apple' docs/CAPTURE_P0_APPLE_ACCOUNT_LOGIN.md
          grep -Fq 'ES80-AUTHENTICATED-STATIONARY-v1' docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md

          swiftc -frontend -parse "$app"
          swiftc -frontend -parse "$login_test"
          swiftc -frontend -parse "$custody_test"
          git diff --cached --check

      - name: Commit clean seven-path product successor
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/v14-capture-apple-auth-e618-materialize.yml'
          git rm "$workflow"
          git add -A
          git diff --cached --check
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git commit -m 'feat(capture): add Apple-backed Tuya account entry on current truth'
          git push origin HEAD:recovery/v14-capture-apple-auth-e618-sol
