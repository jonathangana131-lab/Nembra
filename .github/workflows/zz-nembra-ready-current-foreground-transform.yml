name: Nembra Ready current-spine transform

"on":
  push:
    branches:
      - integration/es80-v14-ready-current-foreground/chat-gpt56-go3

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact controller source
        shell: bash
        run: |
          set -euo pipefail
          file=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          test "$(git hash-object "$file")" = "2b8585c02a8fb97844a81d491cbdbcd5c0d2bfb6"

      - name: Apply exact Ready pre-attempt recovery transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          source = path.read_text()
          needle = (
              "                do {\n"
              "                    try self.ensureCaptureHealthy()\n"
              "                    let outcome = try await admission.recordBoundaryWithMutationOutcome(on: recorder)\n"
          )
          replacement = (
              "                do {\n"
              "                    do {\n"
              "                        try self.requireForegroundEvidenceIntegrity()\n"
              "                        try self.ensureCaptureHealthy()\n"
              "                        try self.validateBoundaryAuthority(admission.authority)\n"
              "                    } catch {\n"
              "                        let preAttemptFailure = error\n"
              "                        do {\n"
              "                            let abandonment = try admission.abandonBeforeRecorderMutation()\n"
              "                            try self.observationBoundaryQueueGate.abortUncommittedReady(after: abandonment)\n"
              "                        } catch {\n"
              "                            // Exact quarantine failure is stronger than the triggering\n"
              "                            // pre-attempt failure because allocated Ready could not be\n"
              "                            // proven abandoned before recorder mutation.\n"
              "                            throw error\n"
              "                        }\n"
              "                        throw preAttemptFailure\n"
              "                    }\n"
              "\n"
              "                    let outcome = try await admission.recordBoundaryWithMutationOutcome(on: recorder)\n"
          )
          count = source.count(needle)
          if count != 1:
              raise SystemExit(f"expected exactly one pinned Ready pre-attempt block, found {count}")
          path.write_text(source.replace(needle, replacement, 1))
          PY

      - name: Assert exact recovery grammar
        shell: bash
        run: |
          set -euo pipefail
          file=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -Fq 'try self.requireForegroundEvidenceIntegrity()' "$file"
          grep -Fq 'try self.ensureCaptureHealthy()' "$file"
          grep -Fq 'try self.validateBoundaryAuthority(admission.authority)' "$file"
          grep -Fq 'let abandonment = try admission.abandonBeforeRecorderMutation()' "$file"
          grep -Fq 'try self.observationBoundaryQueueGate.abortUncommittedReady(after: abandonment)' "$file"
          ! grep -Fq 'try? self.observationBoundaryQueueGate.abortUncommittedReady(after: abandonment)' "$file"

      - name: Remove one-shot workflow and commit product
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-nembra-ready-current-foreground-transform.yml
          git config user.name 'nembra-chatgpt56-go3'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
                  .github/workflows/zz-nembra-ready-current-foreground-transform.yml
          git diff --cached --check
          git commit -m 'fix: quarantine Ready before recorder attempt on exact authority drift'
          git push origin HEAD:integration/es80-v14-ready-current-foreground/chat-gpt56-go3
