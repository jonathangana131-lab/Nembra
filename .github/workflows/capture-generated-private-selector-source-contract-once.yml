name: Capture Generated Private Selector Source Contract Once

on:
  push:
    branches:
      - repair/v17-capture-generated-private-selector-fd-custody-sol-20260814
    paths:
      - .github/workflows/capture-generated-private-selector-source-contract-once.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Preserve established hash-only source contract spelling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 23f50c498e116422f131848392d6a33354464227
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/capture_accepted_build_input_snapshot.py')
          text = path.read_text(encoding='utf-8')
          old = '''        records.append(\n            {\n                "path": relative.as_posix(),\n                "type": "file",\n                "sha256": digest,\n                "size": size,\n                "executable": bool(before.st_mode & (stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)),\n            }\n        )\n        return\n'''
          new = '''        record: dict[str, object] = {"path": relative.as_posix()}\n        record.update(\n            type="file",\n            sha256=digest,\n            size=size,\n            executable=bool(before.st_mode & (stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)),\n        )\n        records.append(record)\n        return\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one descriptor file-record source block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 -B scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          grep -Fq 'sha256=digest' scripts/ci/capture_accepted_build_input_snapshot.py
          git diff --check

      - name: Publish permanent two-file repair lineage
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-generated-private-selector-source-contract-once.yml
          git config user.name "nembra-capture-materializer"
          git config user.email "capture-materializer@users.noreply.github.com"
          git add -A
          staged="$(git diff --cached --name-only ff169cf7400d67d421a451d6d0d1d860353bf9e0 | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            'scripts/ci/capture_accepted_build_input_snapshot.py' \
            'scripts/ci/tests/test_capture_accepted_build_input_snapshot.py' | LC_ALL=C sort)"
          test "$staged" = "$expected"
          git commit -m "Preserve accepted input hash-only source contract"
          git push origin HEAD:repair/v17-capture-generated-private-selector-fd-custody-sol-20260814
