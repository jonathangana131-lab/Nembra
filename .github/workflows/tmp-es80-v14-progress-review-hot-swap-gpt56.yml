name: "Temporary ES80 progress review hot swap"

on:
  push:
    branches:
      - "product/es80-v14-progress-review-hot-swap/gpt56-thinking-go"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply guarded transform
        shell: bash
        env:
          EXPECTED_PARENT: "ef14bf66dcc0fa36d92e38ba53fd86c46a4fb5d6"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 scripts/ci/tmp_es80_v14_progress_review_hot_swap_gpt56.py
          git diff --check
          git config user.name "gpt56-thinking-go"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-v14-progress-review-hot-swap-gpt56.yml
          git rm scripts/ci/tmp_es80_v14_progress_review_hot_swap_gpt56.py
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git add NembraUITests/ES80ResearchCaptureUITests.swift
          git commit -m "fix(capture): keep progress readable at large type"
          git push origin HEAD:"${GITHUB_REF_NAME}"
