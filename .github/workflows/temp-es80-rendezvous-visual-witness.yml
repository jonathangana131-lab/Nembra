name: Temp ES80 rendezvous visual witness

on:
  push:
    branches:
      - tooling/es80-rendezvous-visual-witness-gpt56

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add Simulator-only rendezvous presentation witness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraApp.swift')
          app = app_path.read_text()

          body_anchor = '''                    if let researchBuild = researchBuildForRendezvous {
                        fieldBuildRendezvous(researchBuild)
                    } else if simulatorQAEvidenceLabel == nil {
                        fieldBuildRendezvousUnavailable
                    }
'''
          body_replacement = '''#if DEBUG && targetEnvironment(simulator)
                    if simulatorQASnapshot != nil {
                        fieldBuildRendezvousSimulatorQAPreview
                    }
#endif
                    if let researchBuild = researchBuildForRendezvous {
                        fieldBuildRendezvous(researchBuild)
                    } else if simulatorQAEvidenceLabel == nil {
                        fieldBuildRendezvousUnavailable
                    }
'''
          if app.count(body_anchor) != 1:
              raise SystemExit(f'expected one preflight rendezvous body anchor, found {app.count(body_anchor)}')
          app = app.replace(body_anchor, body_replacement, 1)

          function_anchor = '''    private func fieldBuildRendezvous(
        _ build: PassiveBluetoothExperimentOneFieldExecutionGate.ResearchBuild
    ) -> some View {
'''
          simulator_preview = '''#if DEBUG && targetEnvironment(simulator)
    private var fieldBuildRendezvousSimulatorQAPreview: some View {
        VStack(alignment: .leading, spacing: 14) {
            HStack(alignment: .top, spacing: 12) {
                Image(systemName: "checkmark.shield.fill")
                    .font(.title3.weight(.semibold))
                    .foregroundStyle(.white)
                    .accessibilityHidden(true)

                VStack(alignment: .leading, spacing: 4) {
                    Text("SIMULATOR QA / PROVENANCE PREVIEW")
                        .font(.caption.monospaced().weight(.bold))
                        .tracking(1.0)
                        .foregroundStyle(.orange)
                    Text("Synthetic runtime provenance")
                        .font(.headline)
                        .foregroundStyle(.white)
                    Text("Layout and accessibility preview only. These values are synthetic and are not package research admission.")
                        .font(.footnote)
                        .foregroundStyle(.secondary)
                        .fixedSize(horizontal: false, vertical: true)
                }
            }

            Divider().overlay(.white.opacity(0.12))

            provenanceRow(
                title: "Recipe",
                value: PassiveBluetoothExperimentOneFieldExecutionGate.recipeID.rawValue,
                identifier: "es80.capture.preflight.field-recipe-simulator-qa"
            )
            provenanceRow(
                title: "Build",
                value: "Capture Build V14-0123456789ab",
                identifier: "es80.capture.preflight.field-build-identifier-simulator-qa"
            )
            provenanceRow(
                title: "Source commit",
                value: "0123456789abcdef0123456789abcdef01234567",
                identifier: "es80.capture.preflight.field-source-sha-simulator-qa"
            )
            provenanceRow(
                title: "Build instance",
                value: "01234567-89ab-cdef-0123-456789abcdef",
                identifier: "es80.capture.preflight.field-build-instance-simulator-qa"
            )

            Text("Synthetic software state only. No package research admission is available, no field authority is created, and the physical ES80 procedure remains locked outside this QA fixture.")
                .font(.footnote)
                .foregroundStyle(.secondary)
                .fixedSize(horizontal: false, vertical: true)
        }
        .padding(18)
        .background(.white.opacity(0.055), in: RoundedRectangle(cornerRadius: 20, style: .continuous))
        .accessibilityIdentifier("es80.capture.preflight.field-rendezvous-simulator-qa")
    }
#endif

'''
          if app.count(function_anchor) != 1:
              raise SystemExit(f'expected one production rendezvous function anchor, found {app.count(function_anchor)}')
          app = app.replace(function_anchor, simulator_preview + function_anchor, 1)
          app_path.write_text(app)

          ui_path = Path('NembraUITests/NembraUITests.swift')
          ui = ui_path.read_text()
          audit_anchor = '''            try app.performAccessibilityAudit()

            if scenario == "stationaryPreflight" {
'''
          audit_replacement = '''            if scenario == "stationaryPreflight" {
                let rendezvousPreview = app.descendants(matching: .any)["es80.capture.preflight.field-rendezvous-simulator-qa"]
                XCTAssertTrue(
                    rendezvousPreview.waitForExistence(timeout: 2),
                    "Simulator QA must render the presentation-only Research Build rendezvous before OFF 1."
                )
                keepScreenshot(named: "Capture Research Build Rendezvous Synthetic")
            }

            try app.performAccessibilityAudit()

            if scenario == "stationaryPreflight" {
'''
          if ui.count(audit_anchor) != 1:
              raise SystemExit(f'expected one Capture audit anchor, found {ui.count(audit_anchor)}')
          ui = ui.replace(audit_anchor, audit_replacement, 1)
          ui_path.write_text(ui)

          source_test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureFieldRuntimeRendezvousTests.swift')
          source_test = source_test_path.read_text()
          test_anchor = '''        #expect(preflight.contains("case .noGo:"))
        #expect(preflight.contains("return nil"))
    }
}
'''
          test_replacement = '''        #expect(preflight.contains("case .noGo:"))
        #expect(preflight.contains("return nil"))
        #expect(preflight.contains("es80.capture.preflight.field-rendezvous-simulator-qa"))
        #expect(preflight.contains("No package research admission is available"))
        #expect(preflight.contains("no field authority is created"))
    }
}
'''
          if source_test.count(test_anchor) != 1:
              raise SystemExit(f'expected one Simulator truth test anchor, found {source_test.count(test_anchor)}')
          source_test = source_test.replace(test_anchor, test_replacement, 1)
          source_test_path.write_text(source_test)
          PY

          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraApp.swift' 'NembraUITests/NembraUITests.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureFieldRuntimeRendezvousTests.swift' | sort)"
          grep -F 'es80.capture.preflight.field-rendezvous-simulator-qa' NembraApp/App/NembraApp.swift
          grep -F 'Capture Research Build Rendezvous Synthetic' NembraUITests/NembraUITests.swift
          grep -F 'No package research admission is available' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureFieldRuntimeRendezvousTests.swift

      - name: Commit focused visual witness
        run: |
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git add NembraApp/App/NembraApp.swift NembraUITests/NembraUITests.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureFieldRuntimeRendezvousTests.swift
          git commit -m 'test(capture): retain field rendezvous visual witness'
          git push origin HEAD:tooling/es80-rendezvous-visual-witness-gpt56
