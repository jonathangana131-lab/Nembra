name: Capture App Authority Terminal Closure Patch

on:
  push:
    branches:
      - integration/v14-capture-app-authority-terminal-closure-sol
    paths:
      - .github/workflows/capture-app-authority-terminal-closure-patch.yml
      - Scripts/apply_capture_authority_terminal_closure.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-app-authority-terminal-closure-sol
          fetch-depth: 0
      - name: Apply authority and terminal closure
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 Scripts/apply_capture_authority_terminal_closure.py >PATCH_STDOUT.txt 2>PATCH_FAILURE.txt; then
            git config user.name nembra-v14-integration
            git config user.email actions@users.noreply.github.com
            git add PATCH_STDOUT.txt PATCH_FAILURE.txt
            git commit -m "chore(capture): persist authority closure patch failure"
            git push origin HEAD:integration/v14-capture-app-authority-terminal-closure-sol
            exit 0
          fi
          rm -f PATCH_STDOUT.txt PATCH_FAILURE.txt
          rm Scripts/apply_capture_authority_terminal_closure.py
          rm .github/workflows/capture-app-authority-terminal-closure-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): close app authority and lifecycle terminals"
          git push origin HEAD:integration/v14-capture-app-authority-terminal-closure-sol
