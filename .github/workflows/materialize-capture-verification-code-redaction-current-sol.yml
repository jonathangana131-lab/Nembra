name: Materialize Capture Verification Code Redaction Current Sol

on:
  push:
    branches:
      - "fix/v14-capture-verification-code-redaction-current-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Verify exact current-product parent
        shell: bash
        run: |
          set -euo pipefail
          product="4b41c9ad783f568d0d353acc9f7016a9bd0b64c2"
          test "$(git rev-parse HEAD^)" = "$product"

      - name: Materialize verification-code custody repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          login_failure_call = "self?.finishLoginFailure(error, submittedIdentity: identity)"
          if source.count(login_failure_call) != 2:
              raise SystemExit(f"expected two email/phone login failure callbacks, found {source.count(login_failure_call)}")
          source = source.replace(
              login_failure_call,
              "self?.finishLoginFailure(error, submittedIdentity: identity, submittedVerificationCode: code)"
          )

          send_code_scrub = "Self.redactedError(error, submittedIdentity: identity)"
          if source.count(send_code_scrub) != 2:
              raise SystemExit(f"expected two send-code scrubber calls, found {source.count(send_code_scrub)}")
          source = source.replace(
              send_code_scrub,
              'Self.redactedError(error, submittedIdentity: identity, submittedVerificationCode: "")'
          )

          logout_scrub = "Self.redactedError(error, submittedIdentity: submittedIdentity)"
          if source.count(logout_scrub) != 2:
              raise SystemExit(f"expected finish-login + logout scrubber calls before block replacement, found {source.count(logout_scrub)}")

          old_failure = (
              "    private func finishLoginFailure(_ error: Error?, submittedIdentity: String) {\n"
              "        busy = false\n"
              "        verificationCode = \"\"\n"
              "        loggedIn = OfficialTuyaFactory.accountLoggedIn\n"
              "        status = \"Tuya SDK login failed: \\(Self.redactedError(error, submittedIdentity: submittedIdentity))\"\n"
              "    }\n"
          )
          new_failure = (
              "    private func finishLoginFailure(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String) {\n"
              "        busy = false\n"
              "        verificationCode = \"\"\n"
              "        loggedIn = OfficialTuyaFactory.accountLoggedIn\n"
              "        status = \"Tuya SDK login failed: \\(Self.redactedError(error, submittedIdentity: submittedIdentity, submittedVerificationCode: submittedVerificationCode))\"\n"
              "    }\n"
          )
          if source.count(old_failure) != 1:
              raise SystemExit(f"expected one finishLoginFailure block, found {source.count(old_failure)}")
          source = source.replace(old_failure, new_failure)

          logout_call = "Self.redactedError(error, submittedIdentity: submittedIdentity)"
          if source.count(logout_call) != 1:
              raise SystemExit(f"expected one remaining logout scrubber call, found {source.count(logout_call)}")
          source = source.replace(
              logout_call,
              'Self.redactedError(error, submittedIdentity: submittedIdentity, submittedVerificationCode: "")'
          )

          old_scrubber = (
              "    private static func redactedError(_ error: Error?, submittedIdentity: String) -> String {\n"
              "        let raw = error?.localizedDescription ?? \"unknown error\"\n"
              "        let identity = submittedIdentity.trimmingCharacters(in: .whitespacesAndNewlines)\n"
              "        guard !identity.isEmpty else { return raw }\n"
              "        return raw.replacingOccurrences(\n"
              "            of: identity,\n"
              "            with: \"<redacted-account>\",\n"
              "            options: [.caseInsensitive, .literal]\n"
              "        )\n"
              "    }\n"
          )
          new_scrubber = (
              "    private static func redactedError(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String) -> String {\n"
              "        let raw = error?.localizedDescription ?? \"unknown error\"\n"
              "        let identity = submittedIdentity.trimmingCharacters(in: .whitespacesAndNewlines)\n"
              "        let verificationCode = submittedVerificationCode.trimmingCharacters(in: .whitespacesAndNewlines)\n"
              "        var redacted = raw\n"
              "        if !identity.isEmpty {\n"
              "            redacted = redacted.replacingOccurrences(\n"
              "                of: identity,\n"
              "                with: \"<redacted-account>\",\n"
              "                options: [.caseInsensitive, .literal]\n"
              "            )\n"
              "        }\n"
              "        if !verificationCode.isEmpty {\n"
              "            redacted = redacted.replacingOccurrences(\n"
              "                of: verificationCode,\n"
              "                with: \"<redacted-verification-code>\",\n"
              "                options: [.literal]\n"
              "            )\n"
              "        }\n"
              "        return redacted\n"
              "    }\n"
          )
          if source.count(old_scrubber) != 1:
              raise SystemExit(f"expected one account-only scrubber, found {source.count(old_scrubber)}")
          source = source.replace(old_scrubber, new_scrubber)
          path.write_text(source)
          PY

          red_head="84a5cc24cd9211ffcb9de2702f731630502ca865"
          git fetch --no-tags --depth=1 origin "$red_head"
          test_path="Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift"
          test ! -e "$test_path"
          git show "$red_head:$test_path" > "$test_path"

      - name: Validate source contract and scrubber behavior
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift

          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = source.index("@MainActor\nprivate final class OfficialTuyaAccountAuthorizer")
          end = source.index("#if canImport(ThingSmartHomeKit)\n@MainActor\nprivate final class OfficialTuyaMembershipProbe", start)
          authorizer = source[start:end]
          forwarded = "finishLoginFailure(error, submittedIdentity: identity, submittedVerificationCode: code)"
          if authorizer.count(forwarded) != 2:
              raise SystemExit("both email and phone failures must forward the snapshotted verification code")
          required = [
              "private func finishLoginFailure(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String)",
              "Self.redactedError(error, submittedIdentity: submittedIdentity, submittedVerificationCode: submittedVerificationCode)",
              "private static func redactedError(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String) -> String",
              "let verificationCode = submittedVerificationCode.trimmingCharacters(in: .whitespacesAndNewlines)",
              'with: "<redacted-verification-code>"',
              'with: "<redacted-account>"',
          ]
          missing = [token for token in required if token not in authorizer]
          if missing:
              raise SystemExit(f"missing verification-code custody invariants: {missing}")
          if authorizer.count('Self.redactedError(error, submittedIdentity: identity, submittedVerificationCode: "")') != 2:
              raise SystemExit("send-code errors must use the centralized scrubber without inventing a submitted login code")
          if authorizer.count('Self.redactedError(error, submittedIdentity: submittedIdentity, submittedVerificationCode: "")') != 1:
              raise SystemExit("logout error must preserve account redaction through the centralized scrubber")
          PY

          cat > /tmp/verification_code_redaction_probe.swift <<'SWIFT'
          import Foundation

          func redactedError(_ raw: String, submittedIdentity: String, submittedVerificationCode: String) -> String {
              let identity = submittedIdentity.trimmingCharacters(in: .whitespacesAndNewlines)
              let verificationCode = submittedVerificationCode.trimmingCharacters(in: .whitespacesAndNewlines)
              var redacted = raw
              if !identity.isEmpty {
                  redacted = redacted.replacingOccurrences(
                      of: identity,
                      with: "<redacted-account>",
                      options: [.caseInsensitive, .literal]
                  )
              }
              if !verificationCode.isEmpty {
                  redacted = redacted.replacingOccurrences(
                      of: verificationCode,
                      with: "<redacted-verification-code>",
                      options: [.literal]
                  )
              }
              return redacted
          }

          let output = redactedError(
              "Login rejected USER@example.com with verification code 483921; retry 483921",
              submittedIdentity: "user@example.com",
              submittedVerificationCode: " 483921 "
          )
          precondition(!output.localizedCaseInsensitiveContains("user@example.com"))
          precondition(!output.contains("483921"))
          precondition(output.contains("<redacted-account>"))
          precondition(output.components(separatedBy: "<redacted-verification-code>").count - 1 == 2)
          precondition(redactedError("ordinary failure", submittedIdentity: "", submittedVerificationCode: "") == "ordinary failure")
          SWIFT
          swift /tmp/verification_code_redaction_probe.swift
          git diff --check

      - name: Commit clean repair checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-verification-code-redaction-current-sol.yml
          git add -A
          git diff --cached --check
          product="4b41c9ad783f568d0d353acc9f7016a9bd0b64c2"
          mapfile -t changed < <(git diff --cached --name-only "$product" | sort)
          expected=(
            "NembraApp/App/NembraCaptureEntrypoint.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}" || {
            printf 'Unexpected effective paths:\n'; printf '  %s\n' "${changed[@]}"; exit 1;
          }
          git config user.name "Nembra V14 Sol"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): redact submitted Tuya verification codes"
          git push origin HEAD:fix/v14-capture-verification-code-redaction-current-sol
