name: Reanchor Capture single-driver fence to current product

on:
  push:
    branches:
      - repair/v14-capture-single-tuya-driver-handoff-current-sol
    paths:
      - .github/workflows/reanchor-capture-single-tuya-driver-handoff-sol.yml

permissions:
  contents: write

jobs:
  reanchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-single-tuya-driver-handoff-current-sol
          fetch-depth: 0

      - name: Merge exact current product without replaying stale bytes
        shell: bash
        run: |
          set -euo pipefail
          product='product/v14-capture-guided-truth-current-sol'
          expected='403f2c1901fc4793f22f755cfc447f6c28a9dd41'
          git fetch origin "$product"
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$expected"
          git config user.name "nembra-v14-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit "$expected"

      - name: Verify effective current-product delta
        shell: bash
        run: |
          set -euo pipefail
          product='403f2c1901fc4793f22f755cfc447f6c28a9dd41'
          python3 - <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")
          start = app.index("static func make() -> OfficialTuyaDriver?")
          end = app.index("\n    }\n}\n\n#if canImport(ThingSmartHomeKit)", start)
          make = app[start:end]
          assert make.index("guard !packageCorrelationRetiredForProcess,") < make.index("activePackageCorrelationOwner == nil,") < make.index("packageCorrelationRetiredForProcess = true") < make.index("return SmartLifeDriver()")
          for retained in ("func abandonCorrelationForViewExit()", "test.abandonCorrelationForViewExit()"):
              assert retained in app
          PY
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSingleOfficialDriverHandoffSourceTests.swift
          effective="$(git diff --name-only "$product"...HEAD | grep -v '^.github/workflows/reanchor-capture-single-tuya-driver-handoff-sol.yml$')"
          printf '%s\n' "$effective"
          test "$(printf '%s\n' "$effective" | sed '/^$/d' | wc -l | tr -d ' ')" = '2'
          printf '%s\n' "$effective" | grep -Fxq 'NembraApp/App/NembraCaptureEntrypoint.swift'
          printf '%s\n' "$effective" | grep -Fxq 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSingleOfficialDriverHandoffSourceTests.swift'
          git diff --check "$product"...HEAD

      - name: Remove helper and push clean reanchor
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reanchor-capture-single-tuya-driver-handoff-sol.yml
          git commit -m "chore(capture): finish current-product single-driver reanchor"
          git push origin HEAD:repair/v14-capture-single-tuya-driver-handoff-current-sol
