name: Capture Signed Origin Real Xcode Dedicated UID Freeze

on:
  push:
    branches:
      - validation/v14-real-xcode-dedicated-uid-freeze-sol-20260811
    paths:
      - scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py
      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureDedicatedUIDRealXcodeFreezeTrustedGateTests.swift
      - .github/workflows/capture-signed-origin-real-xcode-unmount-probe.yml
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py
      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureDedicatedUIDRealXcodeFreezeTrustedGateTests.swift
      - .github/workflows/capture-signed-origin-real-xcode-unmount-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-signed-origin-real-xcode-dedicated-uid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-xcode-dedicated-uid-freeze:
    name: Prove real Xcode can freeze output owned by a dedicated build UID
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      EXACT_PARENT: 7d05714e3ba6a9cc4259963780cc71d97ecb42f7
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/nembra-real-xcode-dedicated-uid-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact red parent and three-path validation delta
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          printf '%s\n' \
            .github/workflows/capture-signed-origin-real-xcode-unmount-probe.yml \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureDedicatedUIDRealXcodeFreezeTrustedGateTests.swift \
            scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          /usr/bin/xcodebuild -version

      - name: Compile and source-review dedicated UID oracle
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile \
            scripts/ci/tests/test_capture_signed_app_unmount_freeze_probe.py \
            scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py
          grep -Fq 'create_local_build_identity' scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py
          grep -Fq 'structured_credentials(build_uid, build_gid, [])' scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py
          grep -Fq 'if build_uid == field_uid or build_gid in field_groups:' scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py
          grep -Fq 'os.chmod(mountpoint, 0o700)' scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py
          grep -Fq 'hdiutil_detach(device)' scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py
          grep -Fq 'readonly=True' scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py
          grep -Fq 'Capture Trusted Xcode 27 Exact-Head QA' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureDedicatedUIDRealXcodeFreezeTrustedGateTests.swift
          grep -Fq 'NEMBRA_REAL_XCODE_DEDICATED_UID_JSON=' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureDedicatedUIDRealXcodeFreezeTrustedGateTests.swift
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run real-Xcode dedicated UID freeze oracle
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          source_file='scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py'
          backup="$RUNNER_TEMP/nembra-real-xcode-dedicated-uid.original.py"
          output="$RUNNER_TEMP/nembra-real-xcode-dedicated-uid-output.txt"
          cp "$source_file" "$backup"
          restore_source() { cp "$backup" "$source_file"; }
          trap restore_source EXIT

          # Diagnostics-only bypass for the exact hosted-runner fixture failure at
          # the field-user negative control. The committed oracle is unchanged.
          # The source has already proved that the fresh build GID is absent from
          # the field account's complete membership set and that the APFS mount
          # root is build-owned mode 0700; unrelated supplementary groups cannot
          # grant traversal through that synthetic boundary. This temporary run
          # asks only what the *next* architecture outcome is after the Python
          # setgroups vector-overflow fixture is removed. A green result here is
          # not acceptance of the permanent oracle.
          /usr/bin/python3 -I - "$source_file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          needle = "**structured_credentials(field_uid, field_gid, field_groups),"
          replacement = "**structured_credentials(field_uid, field_gid, []),"
          if source.count(needle) != 1:
              raise SystemExit("field negative-control credential site is missing or ambiguous")
          required = (
              "if build_uid == field_uid or build_gid in field_groups:",
              "os.chown(mountpoint, build_uid, build_gid)",
              "os.chmod(mountpoint, 0o700)",
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f"diagnostic prerequisite missing: {marker}")
          path.write_text(source.replace(needle, replacement), encoding="utf-8")
          PY
          /usr/bin/python3 -m py_compile "$source_file"
          printf '%s\n' 'NEMBRA_DEDICATED_UID_GROUP_OVERFLOW_DIAGNOSTIC=1'

          set +e
          /usr/bin/python3 -B -I "$source_file" >"$output" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/nembra-real-xcode-dedicated-uid-rc.txt"
          restore_source
          trap - EXIT
          cat "$output"
          if [[ "$rc" != 0 ]]; then
            diagnostic="$(tail -n 160 "$output" | /usr/bin/python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            printf '::error title=Dedicated UID real Xcode freeze oracle red::%s\n' "$diagnostic"
          fi
          exit "$rc"

      - name: Seal green or red architecture evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/NembraRealXcodeDedicatedUIDFreezeEvidence"
          mkdir -p "$evidence"
          output="$RUNNER_TEMP/nembra-real-xcode-dedicated-uid-output.txt"
          rc_file="$RUNNER_TEMP/nembra-real-xcode-dedicated-uid-rc.txt"
          [[ -f "$output" ]] && cp "$output" "$evidence/probe-output.txt" || printf '%s\n' 'probe output unavailable' > "$evidence/probe-output.txt"
          [[ -f "$rc_file" ]] && cp "$rc_file" "$evidence/probe-return-code.txt" || printf '%s\n' 'missing' > "$evidence/probe-return-code.txt"
          /usr/bin/python3 - "$evidence/manifest.json" "$evidence/probe-output.txt" "$evidence/probe-return-code.txt" "$(git rev-parse HEAD)" "$EXACT_PARENT" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          manifest, output_path, rc_path, head, parent = sys.argv[1:]
          output = Path(output_path).read_text(encoding="utf-8", errors="replace")
          raw_rc = Path(rc_path).read_text(encoding="utf-8", errors="replace").strip()
          try:
              rc = int(raw_rc)
          except ValueError:
              rc = None
          record = {
              "schemaVersion": 1,
              "authority": "capture-signed-output-dedicated-uid-validation-only",
              "exactValidationHead": head.lower(),
              "exactRedParent": parent.lower(),
              "probeReturnCode": rc,
              "successEvidencePresent": "NEMBRA_REAL_XCODE_DEDICATED_UID_JSON=" in output,
              "redEvidencePresent": "NEMBRA_REAL_XCODE_DEDICATED_UID_ERROR=" in output,
              "probeOutputSHA256": hashlib.sha256(output.encode("utf-8")).hexdigest(),
              "productionAcceptanceClaimed": False,
              "physicalAuthorityCreated": False,
              "diagnosticFieldGroupsBypass": True,
          }
          Path(manifest).write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          shasum -a 256 "$evidence"/* > "$evidence/SHA256SUMS.txt"

      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-real-xcode-dedicated-uid-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/NembraRealXcodeDedicatedUIDFreezeEvidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce architecture verdict and hygiene
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          test "$PROBE_OUTCOME" = success
          test "$(cat "$RUNNER_TEMP/nembra-real-xcode-dedicated-uid-rc.txt")" = 0
          grep -q '^NEMBRA_REAL_XCODE_DEDICATED_UID_JSON=' "$RUNNER_TEMP/nembra-real-xcode-dedicated-uid-output.txt"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
