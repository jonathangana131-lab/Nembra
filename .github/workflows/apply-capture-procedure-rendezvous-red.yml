name: Apply Capture procedure rendezvous repair

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'adversarial/v14-capture-procedure-rendezvous-red-sol'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconcile flagship and apply exact procedure rendezvous
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git fetch origin integration/v14-capture-final-stationary-convergence-sol
          flagship="$(git rev-parse FETCH_HEAD)"
          git merge --no-edit "$flagship"

          python3 - <<'PY'
          from pathlib import Path

          P = "ES80-AUTHENTICATED-STATIONARY-v1"

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          def replace_exact_count(path, old, new, expected):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old[:100]!r}")
              p.write_text(s.replace(old, new), encoding="utf-8")

          # Compiled build identity: procedure is an explicit Info.plist provenance field,
          # not merely a source-level constant. Authoritative field-build admission requires
          # the built value to equal the one canonical stationary procedure.
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n',
              '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n'
              '    static let procedureIdentifierInfoKey = "NembraCaptureProcedureIdentifier"\n'
              '    static let requiredProcedureIdentifier = "' + P + '"\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              '    let tuyaDependencyLockSHA256: String\n',
              '    let tuyaDependencyLockSHA256: String\n    let procedureIdentifier: String\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              '            tuyaDependencyLockSHA256: ((infoDictionary[tuyaDependencyLockSHA256InfoKey] as? String) ?? "").lowercased()\n',
              '            tuyaDependencyLockSHA256: ((infoDictionary[tuyaDependencyLockSHA256InfoKey] as? String) ?? "").lowercased(),\n'
              '            procedureIdentifier: (infoDictionary[procedureIdentifierInfoKey] as? String) ?? ""\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              '        guard sourceCommitSHA.count == 40,\n',
              '        guard procedureIdentifier == Self.requiredProcedureIdentifier,\n              sourceCommitSHA.count == 40,\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              '            return "This build has no valid exact Git + reviewed Tuya dependency provenance. Install Capture through the repository field installer before physical evidence collection."\n',
              '            return "This build has no valid exact Git + reviewed Tuya dependency + stationary procedure provenance. Install Capture through the repository field installer before physical evidence collection."\n'
          )

          # Stamp the procedure into the generated built-app Info.plist in both target configs.
          replace_exact_count(
              "NembraCapture.xcodeproj/project.pbxproj",
              '\t\t\t\tINFOPLIST_KEY_NembraCaptureTuyaDependencyLockSHA256 = "$(NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256)";\n',
              '\t\t\t\tINFOPLIST_KEY_NembraCaptureTuyaDependencyLockSHA256 = "$(NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256)";\n'
              '\t\t\t\tINFOPLIST_KEY_NembraCaptureProcedureIdentifier = "$(NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER)";\n',
              2
          )

          # Immutable accepted export + user-visible authority surface consume the exact compiled value.
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '        let tuyaDependencyLockSHA256: String\n        let tuyaDeviceID: String\n',
              '        let tuyaDependencyLockSHA256: String\n        let procedureIdentifier: String\n        let tuyaDeviceID: String\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '    var fieldBuildSourceCommitSHA: String { buildIdentity.sourceCommitSHA }\n    var sdkAccountLoggedIn: Bool',
              '    var fieldBuildSourceCommitSHA: String { buildIdentity.sourceCommitSHA }\n'
              '    var fieldProcedureIdentifier: String { buildIdentity.procedureIdentifier }\n'
              '    var sdkAccountLoggedIn: Bool'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '            schemaVersion: 9,\n            purpose: "Sanitized Tuya authenticated read-only stationary preflight",\n',
              '            schemaVersion: 10,\n            purpose: "Sanitized Tuya authenticated read-only stationary preflight",\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n            tuyaDeviceID: deviceID,\n',
              '            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n'
              '            procedureIdentifier: buildIdentity.procedureIdentifier,\n'
              '            tuyaDeviceID: deviceID,\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '            LabeledContent("Source commit", value: test.fieldBuildSourceCommitSHA)\n            LabeledContent("Private SDK config", value: test.privateConfig ? "Present" : "Missing")\n',
              '            LabeledContent("Source commit", value: test.fieldBuildSourceCommitSHA)\n'
              '            LabeledContent("Procedure", value: test.fieldProcedureIdentifier)\n'
              '            LabeledContent("Private SDK config", value: test.privateConfig ? "Present" : "Missing")\n'
          )

          # Canonical procedure is explicit in the exact runbook the field worker must follow.
          replace_once(
              "docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md",
              '# Nembra Capture P0 — secure-link gate\n\n',
              '# Nembra Capture P0 — secure-link gate\n\nPROCEDURE_ID: `' + P + '`\n\n'
          )

          # The installer supplies the procedure stamp to the signed build and reads it back
          # from that exact .app before installation; caller prose cannot mint procedure authority.
          replace_once(
              "scripts/field/install_one_time_capture.command",
              'EXPECTED_SOURCE_SHA="${1:-${NEMBRA_CAPTURE_EXPECTED_SOURCE_SHA:-}}"\n',
              'PROCEDURE_ID="' + P + '"\nEXPECTED_SOURCE_SHA="${1:-${NEMBRA_CAPTURE_EXPECTED_SOURCE_SHA:-}}"\n'
          )
          replace_once(
              "scripts/field/install_one_time_capture.command",
              '    "NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256=$TUYA_DEPENDENCY_LOCK_SHA256" \\\n    build\n',
              '    "NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256=$TUYA_DEPENDENCY_LOCK_SHA256" \\\n'
              '    "NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER=$PROCEDURE_ID" \\\n'
              '    build\n'
          )
          replace_once(
              "scripts/field/install_one_time_capture.command",
              'BUILT_TUYA_DEPENDENCY_LOCK_SHA256="$(/usr/bin/plutil -extract NembraCaptureTuyaDependencyLockSHA256 raw -o - "$APP_INFO_PLIST" 2>/dev/null || true)"\nBUILT_BUNDLE_ID=',
              'BUILT_TUYA_DEPENDENCY_LOCK_SHA256="$(/usr/bin/plutil -extract NembraCaptureTuyaDependencyLockSHA256 raw -o - "$APP_INFO_PLIST" 2>/dev/null || true)"\n'
              'BUILT_PROCEDURE_IDENTIFIER="$(/usr/bin/plutil -extract NembraCaptureProcedureIdentifier raw -o - "$APP_INFO_PLIST" 2>/dev/null || true)"\n'
              'BUILT_BUNDLE_ID='
          )
          replace_once(
              "scripts/field/install_one_time_capture.command",
              '[[ "$BUILT_TUYA_DEPENDENCY_LOCK_SHA256" == "$TUYA_DEPENDENCY_LOCK_SHA256" ]] || die "Built Capture app Tuya dependency-lock fingerprint does not match the exact resolved private workspace. Discard this candidate."\n[[ "$BUILT_BUNDLE_ID" == "$BUNDLE_ID" ]] || die "Built Capture app bundle identifier does not match the intended standalone field product. Discard this candidate."\nsay "Built app provenance matched exact requested source, reviewed Tuya dependency lock, and field product"\nunset BUILT_BUILD_IDENTIFIER BUILT_SOURCE_SHA BUILT_TUYA_DEPENDENCY_LOCK_SHA256 BUILT_BUNDLE_ID APP_INFO_PLIST\n',
              '[[ "$BUILT_TUYA_DEPENDENCY_LOCK_SHA256" == "$TUYA_DEPENDENCY_LOCK_SHA256" ]] || die "Built Capture app Tuya dependency-lock fingerprint does not match the exact resolved private workspace. Discard this candidate."\n'
              '[[ "$BUILT_PROCEDURE_IDENTIFIER" == "$PROCEDURE_ID" ]] || die "Built Capture app procedure identifier does not match the canonical stationary procedure. Discard this candidate."\n'
              '[[ "$BUILT_BUNDLE_ID" == "$BUNDLE_ID" ]] || die "Built Capture app bundle identifier does not match the intended standalone field product. Discard this candidate."\n'
              'say "Built app provenance matched exact requested source, reviewed Tuya dependency lock, canonical stationary procedure, and field product"\n'
              'unset BUILT_BUILD_IDENTIFIER BUILT_SOURCE_SHA BUILT_TUYA_DEPENDENCY_LOCK_SHA256 BUILT_PROCEDURE_IDENTIFIER BUILT_BUNDLE_ID APP_INFO_PLIST\n'
          )
          replace_once(
              "scripts/field/install_one_time_capture.command",
              'say "SDK-INTEGRATED CAPTURE LAUNCHED"\nprintf \'%s\\n\' \\\n',
              'say "SDK-INTEGRATED CAPTURE LAUNCHED"\nprintf \'%s\\n\' \\\n    "Field procedure: $PROCEDURE_ID" \\\n'
          )
          replace_once(
              "scripts/field/install_one_time_capture.command",
              '    "The exact built device app was read back before installation and matched the requested source SHA, field-build identifier, and standalone bundle identifier." \\\n',
              '    "The exact built device app was read back before installation and matched the requested source SHA, field-build identifier, Tuya dependency fingerprint, canonical stationary procedure, and standalone bundle identifier." \\\n'
          )

          # Replace the red source contract with the durable exact production contract.
          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift")
          test_path.write_text('''import Foundation
import Testing
@testable import NembraBluetoothCapture

@Suite("Capture field procedure rendezvous")
struct TuyaFieldProcedureRendezvousSourceTests {
    private static let procedure = "ES80-AUTHENTICATED-STATIONARY-v1"

    @Test("compiled build identity requires the exact canonical procedure")
    func compiledBuildIdentityRequiresCanonicalProcedure() throws {
        let identity = try readRepositoryFile("NembraApp/App/NembraCaptureBuildIdentity.swift")
        let project = try readRepositoryFile("NembraCapture.xcodeproj/project.pbxproj")

        #expect(identity.contains("procedureIdentifierInfoKey = \\"NembraCaptureProcedureIdentifier\\""))
        #expect(identity.contains("requiredProcedureIdentifier = \\"\\(Self.procedure)\\""))
        #expect(identity.contains("let procedureIdentifier: String"))
        #expect(identity.contains("procedureIdentifier == Self.requiredProcedureIdentifier"))
        #expect(project.components(separatedBy: "INFOPLIST_KEY_NembraCaptureProcedureIdentifier").count == 3)
        #expect(project.contains("INFOPLIST_KEY_NembraCaptureProcedureIdentifier = \\"$(NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER)\\";"))
    }

    @Test("immutable accepted artifact and authority UI consume the compiled procedure")
    func acceptedArtifactConsumesCompiledProcedure() throws {
        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")

        #expect(app.contains("let procedureIdentifier: String"))
        #expect(app.contains("fieldProcedureIdentifier: String { buildIdentity.procedureIdentifier }"))
        #expect(app.contains("procedureIdentifier: buildIdentity.procedureIdentifier"))
        #expect(app.contains("LabeledContent(\\"Procedure\\", value: test.fieldProcedureIdentifier)"))
        #expect(app.contains("schemaVersion: 10"))
    }

    @Test("field installer stamps and reads back the same canonical procedure")
    func installerProvesBuiltProcedureRendezvous() throws {
        let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")

        #expect(installer.contains("PROCEDURE_ID=\\"\\(Self.procedure)\\""))
        #expect(installer.contains("NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER=$PROCEDURE_ID"))
        #expect(installer.contains("plutil -extract NembraCaptureProcedureIdentifier"))
        #expect(installer.contains("[[ \\"$BUILT_PROCEDURE_IDENTIFIER\\" == \\"$PROCEDURE_ID\\" ]]"))
        #expect(installer.contains("Field procedure: $PROCEDURE_ID"))
    }

    @Test("canonical runbook pins the exact same procedure")
    func runbookPinsCanonicalProcedure() throws {
        let runbook = try readRepositoryFile("docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md")
        #expect(runbook.contains("PROCEDURE_ID: `\\(Self.procedure)`"))
    }

    private func readRepositoryFile(_ relativePath: String) throws -> String {
        let repositoryRoot = URL(fileURLWithPath: #filePath)
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
        return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
    }
}
''', encoding="utf-8")

          identity = Path("NembraApp/App/NembraCaptureBuildIdentity.swift").read_text(encoding="utf-8")
          project = Path("NembraCapture.xcodeproj/project.pbxproj").read_text(encoding="utf-8")
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")
          runbook = Path("docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md").read_text(encoding="utf-8")
          installer = Path("scripts/field/install_one_time_capture.command").read_text(encoding="utf-8")
          assert P in identity and P in runbook and P in installer
          assert "NembraCaptureProcedureIdentifier" in identity
          assert project.count("INFOPLIST_KEY_NembraCaptureProcedureIdentifier") == 2
          assert "procedureIdentifier == Self.requiredProcedureIdentifier" in identity
          assert "schemaVersion: 10" in app
          assert "procedureIdentifier: buildIdentity.procedureIdentifier" in app
          assert "NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER=$PROCEDURE_ID" in installer
          assert "plutil -extract NembraCaptureProcedureIdentifier" in installer
          PY

          rm -- .github/workflows/apply-capture-procedure-rendezvous-red.yml
          git diff --check
          git add -A
          git diff --cached --exit-code && { echo 'No procedure repair delta'; exit 1; }
          git commit -m 'fix(capture): bind canonical stationary procedure provenance'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
