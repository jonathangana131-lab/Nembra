name: Capture repeatable-correlation recovery

on:
  push:
    branches:
      - recovery/capture-repeatable-target-correlation-sol

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded source transform
        run: python3 Scripts/apply_capture_repeatable_correlation.py
      - name: Commit transformed app source
        run: |
          git diff --check
          git diff --exit-code -- NembraApp/App/NembraCaptureEntrypoint.swift && {
            echo "Expected app source transform produced no diff" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m "Capture: wire repeatable target correlation into app"
          git push origin HEAD:${GITHUB_REF_NAME}
