name: Capture Field Installer Git Authority Current

on:
  pull_request:
    paths:
      - 'scripts/field/install_one_time_capture.command'
      - 'Scripts/bootstrap_capture_tuya_sdk.sh'
      - 'scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py'
      - 'scripts/ci/tests/test_capture_field_installer_git_authority_current.py'
      - '.github/workflows/capture-field-installer-git-authority-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-git-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind acceptance to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate shell and Python source
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          python3 -m py_compile \
            scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py \
            scripts/ci/tests/test_capture_field_installer_git_authority_current.py

      - name: Replay original authority split witnesses
        run: python3 scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py

      - name: Exercise fenced Git and accepted bootstrap execution
        run: python3 scripts/ci/tests/test_capture_field_installer_git_authority_current.py
