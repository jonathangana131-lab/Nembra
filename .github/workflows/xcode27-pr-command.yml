name: Xcode 27 PR Exact-Head QA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

env:
  ARTIFACTS_DIR: ${{ github.workspace }}/Artifacts/Xcode27Simulator

jobs:
  resolve:
    name: Resolve trusted same-repo PR head
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/xcode27' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      same_repo: ${{ steps.pr.outputs.same_repo }}
      should_run: ${{ steps.pr.outputs.should_run }}
      automatic: ${{ steps.pr.outputs.automatic }}

    steps:
      - name: Resolve immutable PR head
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const automatic = context.eventName === 'pull_request_target'
            const pullNumber = automatic
              ? context.payload.pull_request.number
              : context.issue.number

            const { data: livePr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            })

            const repository = `${context.repo.owner}/${context.repo.repo}`
            const sameRepo = livePr.head.repo?.full_name === repository
            let shouldRun = sameRepo

            if (automatic) {
              const eventHeadSha = context.payload.pull_request.head.sha
              const stillCurrent = eventHeadSha === livePr.head.sha
              const liveAcceptanceReady = livePr.state === 'open' && livePr.draft === false

              if (!stillCurrent) {
                core.notice(`Skipping stale pull_request_target event head ${eventHeadSha}; live PR #${livePr.number} head is ${livePr.head.sha}.`)
              }
              if (!liveAcceptanceReady) {
                core.notice(`Skipping automatic gate for live PR #${livePr.number}: state=${livePr.state}, draft=${livePr.draft}.`)
              }

              shouldRun = sameRepo && stillCurrent && liveAcceptanceReady
            }

            core.setOutput('head_sha', livePr.head.sha)
            core.setOutput('pr_number', String(livePr.number))
            core.setOutput('same_repo', String(sameRepo))
            core.setOutput('should_run', String(shouldRun))
            core.setOutput('automatic', String(automatic))

  simulator-qa:
    name: Build, test, and capture exact PR head
    needs: resolve
    if: needs.resolve.outputs.same_repo == 'true' && needs.resolve.outputs.should_run == 'true'
    concurrency:
      group: nembra-xcode27-pr-command-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.head_sha }}
      cancel-in-progress: true
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Revalidate live PR head before checkout
        id: live
        uses: actions/github-script@v9
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          AUTOMATIC: ${{ needs.resolve.outputs.automatic }}
        with:
          script: |
            const { data: livePr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            })

            const repository = `${context.repo.owner}/${context.repo.repo}`
            const sameRepo = livePr.head.repo?.full_name === repository
            const stillCurrent = livePr.head.sha === process.env.EXPECTED_HEAD_SHA
            const automatic = process.env.AUTOMATIC === 'true'
            const liveAcceptanceReady = livePr.state === 'open' && livePr.draft === false
            const shouldRun = sameRepo && stillCurrent && (!automatic || liveAcceptanceReady)

            if (!stillCurrent) {
              core.notice(`Skipping queued stale head ${process.env.EXPECTED_HEAD_SHA}; live PR #${livePr.number} head is ${livePr.head.sha}.`)
            }
            if (automatic && !liveAcceptanceReady) {
              core.notice(`Skipping queued automatic gate for live PR #${livePr.number}: state=${livePr.state}, draft=${livePr.draft}.`)
            }
            if (!sameRepo) {
              core.notice(`Skipping queued gate because live PR #${livePr.number} is not a same-repository head.`)
            }

            core.setOutput('should_run', String(shouldRun))

      - name: Checkout immutable PR head
        if: steps.live.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}

      - name: Verify immutable PR head
        if: steps.live.outputs.should_run == 'true'
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          printf 'Expected exact PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"

      - name: Validate project structure
        if: steps.live.outputs.should_run == 'true'
        run: |
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py
          bash -n scripts/ci/xcode27_simulator_capture.sh

      - name: Validate core package
        if: steps.live.outputs.should_run == 'true'
        working-directory: Packages/NembraCore
        run: swift test

      - name: Validate Capture package when present
        if: steps.live.outputs.should_run == 'true'
        run: |
          if [[ -f Packages/NembraBluetoothCapture/Package.swift ]]; then
            (cd Packages/NembraBluetoothCapture && swift test)
          else
            echo 'NembraBluetoothCapture is not present on this candidate; Capture-package validation is not applicable.'
          fi

      - name: Validate signed field evidence tooling when present
        if: steps.live.outputs.should_run == 'true'
        run: |
          evidence='scripts/ci/es80_signed_field_artifact_evidence.py'
          if [[ -f "$evidence" ]]; then
            python3 -m py_compile "$evidence"
            python3 "$evidence" --self-test
          else
            echo 'Signed-field evidence tooling is not present on this candidate; evidence-tool validation is not applicable.'
          fi

      - name: Validate signed field candidate producer source when present
        if: steps.live.outputs.should_run == 'true'
        run: |
          producer='scripts/ci/xcode27_signed_field_candidate.sh'
          source_test='scripts/ci/tests/test_xcode27_signed_field_candidate_source.py'
          if [[ -f "$producer" || -f "$source_test" ]]; then
            test -f "$producer"
            test -f "$source_test"
            bash -n "$producer"
            python3 -m py_compile "$source_test"
            python3 "$source_test"
          else
            echo 'Signed-field candidate producer is not present on this candidate; producer validation is not applicable.'
          fi

      - name: Build, test, and capture Simulator states
        if: steps.live.outputs.should_run == 'true'
        run: scripts/ci/xcode27_simulator_capture.sh

      - name: Upload Simulator screenshots and logs
        if: always() && steps.live.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nembra-xcode27-pr-${{ needs.resolve.outputs.pr_number }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/Xcode27Simulator
          if-no-files-found: warn
          retention-days: 30
