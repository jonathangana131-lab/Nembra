name: Xcode 27 PR Exact-Head QA

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nembra-xcode27-pr-command-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  ARTIFACTS_DIR: ${{ github.workspace }}/Artifacts/Xcode27Simulator

jobs:
  resolve-pr:
    name: Resolve trusted same-repo PR head
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/xcode27' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      same_repo: ${{ steps.pr.outputs.same_repo }}

    steps:
      - name: Resolve immutable PR head
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })

            const repository = `${context.repo.owner}/${context.repo.repo}`
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('pr_number', String(pr.number))
            core.setOutput('same_repo', String(pr.head.repo.full_name === repository))

  simulator-qa:
    name: Build, test, and capture exact PR head
    needs: resolve-pr
    if: needs.resolve-pr.outputs.same_repo == 'true'
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-pr.outputs.head_sha }}

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Validate project structure
        run: |
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py
          bash -n scripts/ci/xcode27_simulator_capture.sh

      - name: Validate core package
        working-directory: Packages/NembraCore
        run: swift test

      - name: Build, test, and capture Simulator states
        run: scripts/ci/xcode27_simulator_capture.sh

      - name: Upload Simulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-xcode27-pr-${{ needs.resolve-pr.outputs.pr_number }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/Xcode27Simulator
          if-no-files-found: warn
          retention-days: 30
