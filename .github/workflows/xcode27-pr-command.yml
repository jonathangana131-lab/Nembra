name: Xcode 27 PR Exact-Head QA

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

env:
  ARTIFACTS_DIR: ${{ github.workspace }}/Artifacts/Xcode27Simulator

jobs:
  resolve:
    name: Resolve trusted same-repo PR head
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/xcode27' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      same_repo: ${{ steps.pr.outputs.same_repo }}

    steps:
      - name: Resolve immutable PR head
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            let pr
            if (context.eventName === 'pull_request') {
              pr = context.payload.pull_request
            } else {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              })
              pr = response.data
            }

            const repository = `${context.repo.owner}/${context.repo.repo}`
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('pr_number', String(pr.number))
            core.setOutput('same_repo', String(pr.head.repo.full_name === repository))

  authority-tooling-qa:
    name: Validate exact-head field authority tooling
    needs: resolve
    if: needs.resolve.outputs.same_repo == 'true'
    concurrency:
      group: nembra-field-authority-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          printf 'Expected exact PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"

      - name: Validate offline field authorization signer
        run: |
          python3 -m py_compile scripts/ci/es80_field_authorization_envelope.py
          python3 -m py_compile scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py
          python3 scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py
          python3 scripts/ci/es80_field_authorization_envelope.py --self-test

  simulator-qa:
    name: Build, test, and capture exact PR head
    needs: resolve
    if: needs.resolve.outputs.same_repo == 'true'
    # Parallel GO workers can legitimately request the same exact head. Queue those duplicates
    # behind the first attempt instead of cancelling the scarce Mac job before it executes.
    # A later product SHA gets a distinct group and the live-head check below fails stale work fast.
    concurrency:
      group: nembra-xcode27-pr-command-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.head_sha }}
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Reject stale PR head before scarce Mac work
        uses: actions/github-script@v9
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        with:
          script: |
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            })
            const currentHead = response.data.head.sha
            core.info(`Expected exact PR head: ${process.env.EXPECTED_HEAD_SHA}`)
            core.info(`Current live PR head: ${currentHead}`)
            if (currentHead !== process.env.EXPECTED_HEAD_SHA) {
              core.setFailed('PR head moved before the Mac acceptance job started; this run is stale non-evidence.')
            }

      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          printf 'Expected exact PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"

      - name: Validate project structure
        run: |
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py
          bash -n scripts/ci/xcode27_simulator_capture.sh

      - name: Validate core package
        working-directory: Packages/NembraCore
        run: swift test

      - name: Validate Capture package
        working-directory: Packages/NembraBluetoothCapture
        run: swift test

      - name: Validate signed field evidence tooling
        run: |
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_evidence.py
          python3 scripts/ci/es80_signed_field_artifact_evidence.py --self-test
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_private_runner.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          python3 -m py_compile scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
          python3 scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
          python3 -m py_compile scripts/ci/tests/test_es80_signed_field_artifact_apple_tool_custody_source.py
          python3 scripts/ci/tests/test_es80_signed_field_artifact_apple_tool_custody_source.py

      - name: Validate signed field candidate producer source
        run: |
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py

      - name: Validate offline field authorization signer
        run: |
          python3 -m py_compile scripts/ci/es80_field_authorization_envelope.py
          python3 -m py_compile scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py
          python3 scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py
          python3 scripts/ci/es80_field_authorization_envelope.py --self-test

      - name: Build, test, and capture Simulator states
        run: scripts/ci/xcode27_simulator_capture.sh

      - name: Verify retained Capture build evidence
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          /usr/bin/python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import plistlib
          import re
          import subprocess
          from pathlib import Path

          root = Path("Artifacts/Xcode27Simulator")
          record_path = root / "NembraCaptureExternalBuildRecord.json"
          executable = root / "build-evidence" / "Nembra"
          info_plist = root / "build-evidence" / "Info.plist"

          record = json.loads(record_path.read_text(encoding="utf-8"))
          expected_keys = {
              "schemaVersion",
              "buildIdentifier",
              "buildInstanceID",
              "sourceCommitSHA",
              "executableSHA256",
              "infoPlistSHA256",
              "experimentRecipeID",
              "procedureVersion",
          }
          if set(record) != expected_keys or record.get("schemaVersion") != 3:
              raise SystemExit("Capture external build record is not the exact closed-world schema v3 shape")

          expected_head = os.environ.get("EXPECTED_HEAD_SHA", "").strip()
          if re.fullmatch(r"[0-9a-f]{40}", expected_head) is None:
              raise SystemExit("Trusted resolver did not provide one exact lowercase 40-hex PR head SHA")

          checkout_head = subprocess.check_output(
              ["/usr/bin/git", "rev-parse", "--verify", "HEAD^{commit}"],
              text=True,
          ).strip()

          def verify_checkout_binding(resolver_head, observed_checkout_head):
              if re.fullmatch(r"[0-9a-f]{40}", resolver_head) is None:
                  raise ValueError("trusted resolver head is not canonical lowercase 40-hex")
              if re.fullmatch(r"[0-9a-f]{40}", observed_checkout_head) is None:
                  raise ValueError("checkout head is not canonical lowercase 40-hex")
              if observed_checkout_head != resolver_head:
                  raise ValueError("checkout HEAD moved after immutable resolver admission")

          try:
              verify_checkout_binding(expected_head, checkout_head)
          except ValueError as error:
              raise SystemExit(str(error)) from error

          retained_plist = plistlib.loads(info_plist.read_bytes())
          expected_recipe = "ES80-FINGERPRINT-v1"
          expected_procedure = "V14"
          build_instance_pattern = re.compile(
              r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
          )

          def verify_semantic_tuple(subject, plist, resolver_head):
              expected_label = f"Capture Build V14-{resolver_head[:12]}"
              if subject.get("sourceCommitSHA") != resolver_head:
                  raise ValueError("external record sourceCommitSHA does not match trusted resolver head")
              if subject.get("buildIdentifier") != expected_label:
                  raise ValueError("external record buildIdentifier does not match trusted resolver head")
              if subject.get("experimentRecipeID") != expected_recipe:
                  raise ValueError("external record experimentRecipeID is not canonical ES80-FINGERPRINT-v1")
              if subject.get("procedureVersion") != expected_procedure:
                  raise ValueError("external record procedureVersion is not canonical V14")

              build_instance = subject.get("buildInstanceID")
              if not isinstance(build_instance, str) or build_instance_pattern.fullmatch(build_instance) is None:
                  raise ValueError("external record buildInstanceID is not one canonical lowercase UUID")

              embedded = {
                  "buildIdentifier": plist.get("NembraCaptureBuildIdentifier"),
                  "buildInstanceID": plist.get("NembraCaptureBuildInstanceID"),
                  "sourceCommitSHA": plist.get("NembraCaptureBuildCommitSHA"),
                  "experimentRecipeID": plist.get("NembraCaptureFieldRecipe"),
              }
              for key, value in embedded.items():
                  if value != subject.get(key):
                      raise ValueError(f"retained Info.plist {key} does not match external record")

          try:
              verify_semantic_tuple(record, retained_plist, expected_head)
          except ValueError as error:
              raise SystemExit(str(error)) from error

          def require_rejected(label, mutated_record=None, mutated_plist=None):
              candidate_record = record if mutated_record is None else mutated_record
              candidate_plist = retained_plist if mutated_plist is None else mutated_plist
              try:
                  verify_semantic_tuple(candidate_record, candidate_plist, expected_head)
              except ValueError:
                  return
              raise SystemExit(f"semantic verifier self-test accepted {label}")

          moved_checkout = "0" * 40 if expected_head != "0" * 40 else "1" * 40
          try:
              verify_checkout_binding(expected_head, moved_checkout)
          except ValueError:
              pass
          else:
              raise SystemExit("checkout-binding self-test accepted a moved checkout-derived SHA")

          wrong_source = dict(record)
          wrong_source["sourceCommitSHA"] = "0" * 40 if expected_head != "0" * 40 else "1" * 40
          wrong_source["buildIdentifier"] = f"Capture Build V14-{wrong_source['sourceCommitSHA'][:12]}"
          require_rejected("a detached source/build label", mutated_record=wrong_source)

          wrong_instance = dict(record)
          wrong_instance["buildInstanceID"] = (
              "00000000-0000-0000-0000-000000000000"
              if record["buildInstanceID"] != "00000000-0000-0000-0000-000000000000"
              else "11111111-1111-1111-1111-111111111111"
          )
          require_rejected("a detached build-instance ID", mutated_record=wrong_instance)

          wrong_recipe = dict(record)
          wrong_recipe["experimentRecipeID"] = "ES80-FINGERPRINT-v2"
          require_rejected("a detached experiment recipe", mutated_record=wrong_recipe)

          wrong_procedure = dict(record)
          wrong_procedure["procedureVersion"] = "V15"
          require_rejected("a detached procedure version", mutated_record=wrong_procedure)

          wrong_plist = dict(retained_plist)
          wrong_plist["NembraCaptureBuildInstanceID"] = (
              "22222222-2222-2222-2222-222222222222"
              if record["buildInstanceID"] != "22222222-2222-2222-2222-222222222222"
              else "33333333-3333-3333-3333-333333333333"
          )
          require_rejected("detached retained Info.plist metadata", mutated_plist=wrong_plist)

          wrong_plist_recipe = dict(retained_plist)
          wrong_plist_recipe["NembraCaptureFieldRecipe"] = "ES80-FINGERPRINT-v2"
          require_rejected("detached retained Info.plist recipe", mutated_plist=wrong_plist_recipe)

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          if sha256(executable) != record["executableSHA256"]:
              raise SystemExit("Retained Capture executable no longer matches the exact-head external record")
          if sha256(info_plist) != record["infoPlistSHA256"]:
              raise SystemExit("Retained Capture Info.plist no longer matches the exact-head external record")
          PY

      - name: Upload Simulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-xcode27-pr-${{ needs.resolve.outputs.pr_number }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/Xcode27Simulator
          if-no-files-found: warn
          retention-days: 30
