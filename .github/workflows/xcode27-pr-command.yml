name: Xcode 27 PR Exact-Head QA

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

env:
  ARTIFACTS_DIR: ${{ github.workspace }}/Artifacts/Xcode27Simulator

jobs:
  materialize-a11y-release-gate-repair:
    name: Materialize exact accessibility release-gate repair
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'ready_for_review' &&
      github.event.pull_request.number == 3682 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/a11y-release-gate-20260820-sol'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/a11y-release-gate-20260820-sol
          fetch-depth: 0

      - name: Verify exact child head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "14f2f5f93e9c083bf97fcd9e67393c25a91553c2"

      - name: Apply narrow product repairs
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "NembraApp/Features/Dashboard/DashboardView.swift",
              ".frame(maxWidth: .infinity, minHeight: dynamicTypeSize.isAccessibilitySize ? 58 : 54)",
              ".frame(maxWidth: .infinity, minHeight: dynamicTypeSize.isAccessibilitySize ? 86 : 54)",
          )
          replace_exact(
              "NembraApp/Features/Dashboard/SpeedInstrumentModel.swift",
              "usesAccessibilityLayout ? 58 : 54,",
              "usesAccessibilityLayout ? 86 : 54,",
          )

          home = Path("NembraApp/Features/Home/HomeView.swift")
          text = home.read_text()
          anchor = '        let displayedState = available ? subtitle : "Unavailable"\n'
          if text.count(anchor) != 1:
              raise SystemExit("HomeView displayed-state anchor changed")
          text = text.replace(
              anchor,
              anchor
              + "        let isInteractive = vehicle.state.connection == .connected\n"
              + "            && !vehicle.isVehicleCommandPending\n"
              + "            && available\n"
              + "            && enabled\n",
          )
          old = """                    Text(displayedState)
                        .font(.caption)
                        .foregroundStyle(NembraColor.secondaryText)
"""
          new = """                    Text(displayedState)
                        .font(.caption)
                        .foregroundStyle(isInteractive ? NembraColor.secondaryText : NembraColor.primaryText)
"""
          if text.count(old) != 1:
              raise SystemExit("HomeView disabled-state styling anchor changed")
          text = text.replace(old, new)
          old = """        .disabled(
            vehicle.state.connection != .connected ||
            vehicle.isVehicleCommandPending ||
            !available ||
            !enabled
        )
"""
          if text.count(old) != 1:
              raise SystemExit("HomeView disabled predicate anchor changed")
          text = text.replace(old, "        .disabled(!isInteractive)\n")
          home.write_text(text)

      - name: Remove abandoned branch bootstrap
        run: git rm .github/workflows/zz-one-shot-a11y-release-gate-sol.yml

      - name: Verify exact source delta
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/zz-one-shot-a11y-release-gate-sol.yml \
            NembraApp/Features/Dashboard/DashboardView.swift \
            NembraApp/Features/Dashboard/SpeedInstrumentModel.swift \
            NembraApp/Features/Home/HomeView.swift | sort)"
          test "$changed" = "$expected"

      - name: Commit and push exact repair
        run: |
          git config user.name "nembra-sol-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: clear exact-head accessibility release gates"
          git push origin HEAD:fix/a11y-release-gate-20260820-sol

  resolve:
    name: Resolve trusted same-repo PR head
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/xcode27' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      same_repo: ${{ steps.pr.outputs.same_repo }}

    steps:
      - name: Resolve immutable PR head
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            let pr
            if (context.eventName === 'pull_request') {
              pr = context.payload.pull_request
            } else {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              })
              pr = response.data
            }

            const repository = `${context.repo.owner}/${context.repo.repo}`
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('pr_number', String(pr.number))
            core.setOutput('same_repo', String(pr.head.repo.full_name === repository))

  simulator-qa:
    name: Build, test, and capture exact PR head
    needs: resolve
    if: needs.resolve.outputs.same_repo == 'true'
    concurrency:
      group: nembra-xcode27-pr-command-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: true
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_SHA: ${{ needs.resolve.outputs.head_sha }}

    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          printf 'Expected exact PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"

      - name: Validate project structure
        run: |
          plutil -lint Nembra.xcodeproj/project.pbxproj
          /usr/bin/xmllint --noout 'Nembra.xcodeproj/xcshareddata/xcschemes/Nembra Performance.xcscheme'
          scripts/validate_pbxproj_references.py
          bash -n scripts/ci/xcode27_product_simulator_capture.sh
          python3 scripts/ci/validate_xcode27_dashboard_performance.py --self-test

      - name: Validate core package
        working-directory: Packages/NembraCore
        run: swift test

      - name: Build, test, and capture Simulator states
        run: scripts/ci/xcode27_product_simulator_capture.sh

      - name: Upload Simulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-xcode27-pr-${{ needs.resolve.outputs.pr_number }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/Xcode27Simulator
          if-no-files-found: warn
          retention-days: 30
