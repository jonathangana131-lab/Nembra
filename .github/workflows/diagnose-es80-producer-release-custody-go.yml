name: Diagnose ES80 Producer Release Custody GO

on:
  push:
    branches:
      - fix/es80-v14-producer-git-xcode-source-custody-go

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/es80-v14-producer-git-xcode-source-custody-go

      - name: Verify diagnostic parent
        run: |
          test "$(git rev-parse HEAD^)" = "d24fa173fcaa8b7ef57543c0ceb4a99601b856b8"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/diagnose-es80-producer-release-custody-go.yml"

      - name: Reuse exact guarded construction transform
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/construct-es80-producer-release-custody-go.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate full portable producer custody contract"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              if line == '':
                  lines.append('')
                  continue
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected constructor indentation: {line!r}')
              lines.append(line[10:])
          Path('/tmp/nembra-producer-constructor.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYEXTRACT
          python3 /tmp/nembra-producer-constructor.py

      - name: Shell syntax
        run: bash -n scripts/ci/xcode27_signed_field_candidate.sh

      - name: Existing Python custody
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_python_custody_source.py

      - name: Existing descriptor custody
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_descriptor_subject_custody_source.py

      - name: Existing process-startup custody
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_process_startup_custody.py

      - name: New Git environment custody
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_git_environment_custody_source.py

      - name: New Xcode environment custody
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_xcode_environment_custody_source.py

      - name: New raw source-tree custody
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source_tree_blob_custody_source.py

      - name: New selected-Xcode custody
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_developer_dir_custody_source.py

      - name: Existing producer source contract
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py

      - name: Existing intended-device contract
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py

      - name: Diff hygiene
        run: git diff --check
