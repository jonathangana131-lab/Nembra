name: Diagnose ES80 Producer Release Custody GO

on:
  push:
    branches:
      - fix/es80-v14-producer-git-xcode-source-custody-go

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/es80-v14-producer-git-xcode-source-custody-go

      - name: Verify diagnostic parent
        run: |
          test "$(git rev-parse HEAD^)" = "84848aeb7b21c5fcf4573c753e8faeca4a8e5705"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/diagnose-es80-producer-release-custody-go.yml"

      - name: Reuse exact guarded construction transform
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/construct-es80-producer-release-custody-go.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate full portable producer custody contract"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              if line == '':
                  lines.append('')
                  continue
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected constructor indentation: {line!r}')
              lines.append(line[10:])
          Path('/tmp/nembra-producer-constructor.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYEXTRACT
          python3 /tmp/nembra-producer-constructor.py

      - name: Selected Xcode derives from system selector
        run: >-
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_developer_dir_custody_source.py
          SignedFieldCandidateDeveloperDirectoryCustodySourceTests.test_developer_directory_is_selected_by_system_tool_not_caller_environment

      - name: Selected Xcode has root nonwritable ancestry
        run: >-
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_developer_dir_custody_source.py
          SignedFieldCandidateDeveloperDirectoryCustodySourceTests.test_selected_developer_directory_has_root_nonwritable_ancestry_custody

      - name: Version probe and archive share closed wrapper
        run: >-
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_developer_dir_custody_source.py
          SignedFieldCandidateDeveloperDirectoryCustodySourceTests.test_xcode_version_probe_and_archive_share_same_closed_wrapper

      - name: Closed Xcode child rejects override environment
        run: >-
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_developer_dir_custody_source.py
          SignedFieldCandidateDeveloperDirectoryCustodySourceTests.test_closed_xcode_child_does_not_reimport_toolchain_override_environment
