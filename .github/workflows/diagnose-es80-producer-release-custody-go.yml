name: Diagnose ES80 Producer Release Custody GO

on:
  push:
    branches:
      - fix/es80-v14-producer-git-xcode-source-custody-go

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/es80-v14-producer-git-xcode-source-custody-go

      - name: Verify repair parent
        run: |
          test "$(git rev-parse HEAD^)" = "ae50629cc0cc5d1c3d3f7011a61fca223a0c66b8"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/diagnose-es80-producer-release-custody-go.yml"

      - name: Reuse exact guarded construction transform
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/construct-es80-producer-release-custody-go.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate full portable producer custody contract"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              if line == '':
                  lines.append('')
                  continue
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected constructor indentation: {line!r}')
              lines.append(line[10:])
          Path('/tmp/nembra-producer-constructor.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYEXTRACT
          python3 /tmp/nembra-producer-constructor.py

      - name: Seal selected Xcode authority into producer-owned state
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path

          path = Path('scripts/ci/xcode27_signed_field_candidate.sh')
          source = path.read_text(encoding='utf-8')
          marker = '\n: "${NEMBRA_DEVELOPMENT_TEAM:?Set NEMBRA_DEVELOPMENT_TEAM to the Apple signing TeamIdentifier.}"\n'
          replacement = '''
          SELECTED_XCODE_DEVELOPER_DIR="$DEVELOPER_DIR"
          unset DEVELOPER_DIR

          : "${NEMBRA_DEVELOPMENT_TEAM:?Set NEMBRA_DEVELOPMENT_TEAM to the Apple signing TeamIdentifier.}"
          '''
          if source.count(marker) != 1:
              raise SystemExit('expected exactly one post-Xcode-selection input marker')
          source = source.replace(marker, replacement, 1)

          inherited = 'DEVELOPER_DIR="$DEVELOPER_DIR"'
          if source.count(inherited) != 2:
              raise SystemExit(f'expected two closed-child developer-dir assignments, found {source.count(inherited)}')
          source = source.replace(
              inherited,
              'DEVELOPER_DIR="$SELECTED_XCODE_DEVELOPER_DIR"',
          )
          path.write_text(source, encoding='utf-8')
          PYFIX

      - name: Validate full portable producer custody contract
        run: |
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_python_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_descriptor_subject_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_process_startup_custody.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_git_environment_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_xcode_environment_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source_tree_blob_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_developer_dir_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          git diff --check

      - name: Publish validated product repair and remove construction scaffolding
        run: |
          rm .github/workflows/construct-es80-producer-release-custody-go.yml
          rm .github/workflows/diagnose-es80-producer-release-custody-go.yml
          git config user.name "nembra-go-constructor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): isolate signed-field release authority"
          git push origin HEAD:fix/es80-v14-producer-git-xcode-source-custody-go
