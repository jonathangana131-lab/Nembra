name: Materialize Home accessibility controls

on:
  push:
    branches:
      - agent/v14-home-accessibility-metric-layout-sol
    paths:
      - .github/workflows/materialize-home-accessibility-controls.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail closed on Home source drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/Features/Home/HomeView.swift)" = "39f2cf1b5f943dc169a8908ac3931d2e02fe5717"
      - name: Patch real Home controls and add regression
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraApp/Features/Home/HomeView.swift")
          source = path.read_text()

          old_controls = '''            HStack(spacing: 12) {
                if vehicle.profile.capabilities.supportsHeadlight {
                    actionControl(
                        title: "Light",
                        subtitle: lightSubtitle,
                        icon: vehicle.state.isHeadlightOn == true ? "lightbulb.fill" : "lightbulb",
                        active: vehicle.state.isHeadlightOn == true,
                        pending: vehicle.pendingCommands.contains(.headlight),
                        available: vehicle.state.isHeadlightOn != nil,
                        enabled: true
                    ) {
                        guard let isOn = vehicle.state.isHeadlightOn else { return }
                        Task { await vehicle.setHeadlight(!isOn) }
                    }
                }

                if vehicle.profile.capabilities.supportsLock {
                    actionControl(
                        title: lockControlTitle,
                        subtitle: lockSubtitle,
                        icon: vehicle.state.isLocked == true ? "lock.fill" : "lock.open",
                        active: vehicle.state.isLocked == true,
                        pending: vehicle.pendingCommands.contains(.lock),
                        available: vehicle.state.isLocked != nil,
                        enabled: canChangeLockState
                    ) {
                        showLockConfirmation = true
                    }
                }
            }'''
          new_controls = '''            if dynamicTypeSize.isAccessibilitySize {
                VStack(spacing: 12) {
                    homeActionControls
                }
            } else {
                HStack(spacing: 12) {
                    homeActionControls
                }
            }'''
          if source.count(old_controls) != 1:
              raise SystemExit("controls source drift")
          source = source.replace(old_controls, new_controls)

          marker = '''    private func actionControl(
'''
          helper = '''    @ViewBuilder
    private var homeActionControls: some View {
        if vehicle.profile.capabilities.supportsHeadlight {
            actionControl(
                title: "Light",
                subtitle: lightSubtitle,
                icon: vehicle.state.isHeadlightOn == true ? "lightbulb.fill" : "lightbulb",
                active: vehicle.state.isHeadlightOn == true,
                pending: vehicle.pendingCommands.contains(.headlight),
                available: vehicle.state.isHeadlightOn != nil,
                enabled: true
            ) {
                guard let isOn = vehicle.state.isHeadlightOn else { return }
                Task { await vehicle.setHeadlight(!isOn) }
            }
        }

        if vehicle.profile.capabilities.supportsLock {
            actionControl(
                title: lockControlTitle,
                subtitle: lockSubtitle,
                icon: vehicle.state.isLocked == true ? "lock.fill" : "lock.open",
                active: vehicle.state.isLocked == true,
                pending: vehicle.pendingCommands.contains(.lock),
                available: vehicle.state.isLocked != nil,
                enabled: canChangeLockState
            ) {
                showLockConfirmation = true
            }
        }
    }

'''
          if source.count(marker) != 1:
              raise SystemExit("actionControl marker drift")
          source = source.replace(marker, helper + marker)

          old_layout = '''                    Text(available ? subtitle : "Unavailable")
                        .font(.caption)
                        .foregroundStyle(.secondary)
                        .lineLimit(1)
                }

                Spacer(minLength: 0)
            }
            .padding(.horizontal, 13)
            .frame(height: 58)
            .frame(maxWidth: .infinity)
'''
          new_layout = '''                    Text(available ? subtitle : "Unavailable")
                        .font(.caption)
                        .foregroundStyle(.secondary)
                        .lineLimit(dynamicTypeSize.isAccessibilitySize ? nil : 1)
                        .fixedSize(horizontal: false, vertical: dynamicTypeSize.isAccessibilitySize)
                }

                Spacer(minLength: 0)
            }
            .padding(.horizontal, 13)
            .padding(.vertical, dynamicTypeSize.isAccessibilitySize ? 12 : 0)
            .frame(minHeight: dynamicTypeSize.isAccessibilitySize ? 64 : 58)
            .frame(height: dynamicTypeSize.isAccessibilitySize ? nil : 58)
            .frame(maxWidth: .infinity)
'''
          if source.count(old_layout) != 1:
              raise SystemExit("action layout source drift")
          source = source.replace(old_layout, new_layout)
          path.write_text(source)

          test = Path("Packages/NembraCore/Tests/NembraCoreTests/HomeAccessibilityControlLayoutSourceTests.swift")
          test.write_text('''import Foundation\nimport Testing\n\n@Suite("Home accessibility control layout source")\nstruct HomeAccessibilityControlLayoutSourceTests {\n    @Test("Accessibility Dynamic Type stacks Home action controls and removes fixed-height clipping")\n    func adaptiveActionControls() throws {\n        let source = try String(contentsOf: homeViewURL, encoding: .utf8)\n        #expect(source.contains("if dynamicTypeSize.isAccessibilitySize {\\n                VStack(spacing: 12) {\\n                    homeActionControls"))\n        #expect(source.contains(".lineLimit(dynamicTypeSize.isAccessibilitySize ? nil : 1)"))\n        #expect(source.contains(".fixedSize(horizontal: false, vertical: dynamicTypeSize.isAccessibilitySize)"))\n        #expect(source.contains(".frame(minHeight: dynamicTypeSize.isAccessibilitySize ? 64 : 58)"))\n        #expect(source.contains(".frame(height: dynamicTypeSize.isAccessibilitySize ? nil : 58)"))\n    }\n\n    private var homeViewURL: URL {\n        URL(fileURLWithPath: #filePath)\n            .deletingLastPathComponent()\n            .deletingLastPathComponent()\n            .deletingLastPathComponent()\n            .deletingLastPathComponent()\n            .deletingLastPathComponent()\n            .appendingPathComponent("NembraApp/Features/Home/HomeView.swift")\n    }\n}\n''')
      - name: Commit product repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-home-accessibility-controls.yml
          git config user.name "nembra-product-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(home): adapt action controls for accessibility text"
          git push origin HEAD:agent/v14-home-accessibility-metric-layout-sol
