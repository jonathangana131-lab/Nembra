name: ES80 recorded-H + zero-H recovery v4 exact-product QA

on:
  push:
    branches:
      - cell/es80-recorded-horizon-recovery-v4/ci/chat-g5t9q

permissions:
  contents: read

jobs:
  recovery-qa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify exact product parent and workflow-only delta
        env:
          EXPECTED_PRODUCT_SHA: e2cf36a62f4e01c9d5e21f3875d282b0367a19e5
          EXPECTED_WORKFLOW_PATH: .github/workflows/qa-es80-recorded-horizon-recovery-v4-chat-g5t9q.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$EXPECTED_WORKFLOW_PATH"
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Reject application characteristic writes
        run: |
          set -euo pipefail
          if grep -R --include='*.swift' -nE '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            exit 1
          fi
      - name: Run NembraCore tests
        run: swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors
      - name: Run full capture package tests
        run: swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors
      - name: Build capture package for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          xcodebuild -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
