name: Capture TODAY Final GO Hardening QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_final_go_foundation.py
      - scripts/ci/_es80_today_final_go_foundation_impl.py
      - scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py
      - scripts/ci/tests/test_es80_today_final_go_private_impl_execution_disabled.py
      - scripts/ci/tests/test_es80_today_final_go_local_evidence_descriptor_custody.py
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/tests/test_es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/tests/test_es80_today_trusted_xcode_download_snapshot_custody.py
      - scripts/ci/tests/test_es80_today_trusted_xcode_preserves_external_record_contract.py
      - scripts/ci/tests/test_capture_trusted_xcode_producer_execution_custody.py
      - scripts/ci/tests/test_capture_trusted_xcode_bash_environment_custody.py
      - scripts/ci/es80_today_final_go_publication.py
      - scripts/ci/tests/test_es80_today_final_go_publication.py
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_final_go_git_custody.py
      - .github/workflows/capture-xcode27-trusted-command.yml
      - .github/workflows/capture-today-trusted-default-xcode-subject-qa.yml

permissions:
  contents: read

jobs:
  hardening:
    name: Validate hardened Final GO composition
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile Final GO hardening modules and tests
        run: |
          python3 -m py_compile scripts/ci/es80_today_final_go_foundation.py scripts/ci/_es80_today_final_go_foundation_impl.py scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py scripts/ci/tests/test_es80_today_final_go_private_impl_execution_disabled.py scripts/ci/tests/test_es80_today_final_go_local_evidence_descriptor_custody.py
          python3 -m py_compile scripts/ci/es80_today_trusted_capture_xcode_subject.py scripts/ci/tests/test_es80_today_trusted_capture_xcode_subject.py scripts/ci/tests/test_es80_today_trusted_xcode_download_snapshot_custody.py scripts/ci/tests/test_es80_today_trusted_xcode_preserves_external_record_contract.py scripts/ci/tests/test_capture_trusted_xcode_producer_execution_custody.py scripts/ci/tests/test_capture_trusted_xcode_bash_environment_custody.py
          python3 -m py_compile scripts/ci/es80_today_final_go_publication.py scripts/ci/tests/test_es80_today_final_go_publication.py
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py scripts/ci/tests/test_es80_today_final_go_hardened.py scripts/ci/tests/test_es80_today_final_go_git_custody.py
      - name: Reject direct/imported public Final GO execution surfaces
        run: python3 scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py -v
      - name: Reject direct private Final GO implementation execution
        run: python3 scripts/ci/tests/test_es80_today_final_go_private_impl_execution_disabled.py -v
      - name: Preserve descriptor-bound local evidence reads
        run: python3 scripts/ci/tests/test_es80_today_final_go_local_evidence_descriptor_custody.py -v
      - name: Run trusted subject adversarial suite
        run: python3 scripts/ci/tests/test_es80_today_trusted_capture_xcode_subject.py -v
      - name: Preserve downloaded trusted-Xcode single-snapshot custody
        run: python3 scripts/ci/tests/test_es80_today_trusted_xcode_download_snapshot_custody.py -v
      - name: Preserve retained artifact admission contract
        run: python3 scripts/ci/tests/test_es80_today_trusted_xcode_preserves_external_record_contract.py -v
      - name: Preserve pinned producer interpreter custody
        run: python3 scripts/ci/tests/test_capture_trusted_xcode_producer_execution_custody.py -v
      - name: Preserve closed Bash startup custody
        run: python3 scripts/ci/tests/test_capture_trusted_xcode_bash_environment_custody.py -v
      - name: Run failure-atomic publication adversarial suite
        run: python3 scripts/ci/tests/test_es80_today_final_go_publication.py -v
      - name: Run hardened composition suite
        run: python3 scripts/ci/tests/test_es80_today_final_go_hardened.py -v
      - name: Run closed Git custody suite
        run: python3 scripts/ci/tests/test_es80_today_final_go_git_custody.py -v
      - name: Pin hardened authority boundaries
        run: |
          set -euo pipefail
          grep -Fq 'TRUSTED_WORKFLOW_NAME = "Capture Trusted Xcode 27 Exact-Head QA"' scripts/ci/es80_today_trusted_capture_xcode_subject.py
          grep -Fq 'TRUSTED_WORKFLOW_PATH = ".github/workflows/capture-xcode27-trusted-command.yml"' scripts/ci/es80_today_trusted_capture_xcode_subject.py
          grep -Fq 'TRUSTED_WORKFLOW_BLOB_SHA = "9d6a63da8cfb52894f39451f916015a26b84ffd4"' scripts/ci/es80_today_trusted_capture_xcode_subject.py
          grep -Fq 'TRUSTED_SIMULATOR_EVIDENCE_PRODUCER_PATH = "scripts/ci/xcode27_simulator_capture.sh"' scripts/ci/es80_today_trusted_capture_xcode_subject.py
          grep -Fq 'TRUSTED_SIMULATOR_EVIDENCE_PRODUCER_BLOB_SHA = "4e9ae0cb6728dc68d9b8dd43aac7c50128702ed9"' scripts/ci/es80_today_trusted_capture_xcode_subject.py
          grep -Fq 'name: Verify trusted Simulator evidence-producer custody' .github/workflows/capture-xcode27-trusted-command.yml
          grep -Fq 'expected_blob="4e9ae0cb6728dc68d9b8dd43aac7c50128702ed9"' .github/workflows/capture-xcode27-trusted-command.yml
          grep -Fq 'shell: "/bin/bash --noprofile --norc -p -e -o pipefail {0}"' .github/workflows/capture-xcode27-trusted-command.yml
          grep -Fq 'BASH_ENV: ""' .github/workflows/capture-xcode27-trusted-command.yml
          grep -Fq 'ENV: ""' .github/workflows/capture-xcode27-trusted-command.yml
          grep -Fq '/usr/bin/git hash-object -- "$producer_path"' .github/workflows/capture-xcode27-trusted-command.yml
          grep -Fq '/usr/bin/git cat-file blob "$expected_blob"' .github/workflows/capture-xcode27-trusted-command.yml
          grep -Fq '| /usr/bin/env -i \' .github/workflows/capture-xcode27-trusted-command.yml
          grep -Fq "/bin/bash -c 'source /dev/stdin' \"\$GITHUB_WORKSPACE/\$producer_path\"" .github/workflows/capture-xcode27-trusted-command.yml
          grep -Fq 'public Final GO foundation builder is non-authorizing' scripts/ci/es80_today_final_go_foundation.py
          grep -Fq 'private foundation implementation is non-authorizing' scripts/ci/_es80_today_final_go_foundation_impl.py
          grep -Fq 'O_NOFOLLOW' scripts/ci/_es80_today_final_go_foundation_impl.py
          grep -Fq 'os.fstat(fd)' scripts/ci/_es80_today_final_go_foundation_impl.py
          grep -Fq 'foundation = _load(' scripts/ci/es80_today_final_go_hardened.py
          grep -Fq '"_es80_today_final_go_foundation_impl.py"' scripts/ci/es80_today_final_go_hardened.py
          grep -Fq 'run.get("event") == "issue_comment"' scripts/ci/es80_today_trusted_capture_xcode_subject.py
          grep -Fq 'run.get("head_branch") == DEFAULT_BRANCH' scripts/ci/es80_today_trusted_capture_xcode_subject.py
          grep -Fq 'AMBIGUOUS NO-GO' scripts/ci/es80_today_final_go_publication.py
          grep -Fq 'foundation._trusted_xcode_subject = trusted_subject_adapter' scripts/ci/es80_today_final_go_hardened.py
          grep -Fq 'foundation._git(tooling_repo, "rev-parse"' scripts/ci/es80_today_final_go_hardened.py
          grep -Fq 'publication.publish_record_no_replace' scripts/ci/es80_today_final_go_hardened.py
