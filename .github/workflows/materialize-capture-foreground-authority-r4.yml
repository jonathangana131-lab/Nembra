name: Materialize Capture Foreground Authority R4

on:
  push:
    branches:
      - sol/v14-capture-foreground-authority-r4

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-foreground-authority-r4
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --quiet "$parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/materialize-capture-foreground-authority-r4.yml' \
            'scripts/ci/materialize_capture_foreground_authority_r4.py' | sort)"
          test "$changed" = "$expected"

      - name: Apply foreground-authority repair
        run: python3 scripts/ci/materialize_capture_foreground_authority_r4.py apply

      - name: Verify bounded truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_foreground_authority_r4.py verify
          python3 -m py_compile scripts/ci/materialize_capture_foreground_authority_r4.py
          git diff --check

      - name: Publish clean product bytes
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          rm .github/workflows/materialize-capture-foreground-authority-r4.yml
          rm scripts/ci/materialize_capture_foreground_authority_r4.py
          git add -A
          changed="$(git diff --cached "$parent" --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$parent" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): retire foreground-bound target authority'
          git push origin HEAD:sol/v14-capture-foreground-authority-r4
