name: Materialize Capture Foreground Authority R4

on:
  push:
    branches:
      - sol/v14-capture-foreground-authority-r4

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact construction parent and helper-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1c40853f6991b4d09206df1d25ecff021458b7eb"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/materialize-capture-foreground-authority-r4.yml"

      - name: Materialize foreground evidence authority repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          app_path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          app = app_path.read_text()

          app = replace_once(
              app,
              '''    func activateMembershipRequestsForView() {
        // A fast inactive -> active transition must not reset the duplicate-retirement fence
        // while the exact authenticated generation from foreground loss is still terminalizing.
        guard currentConnectionToken == nil else { return }
        foregroundIntegrityLossHandled = false
        acceptsViewScopedMembershipRequests = true
    }
''',
              '''    func activateMembershipRequestsForView() {
        // A fast inactive -> active transition must not reset the duplicate-retirement fence
        // while an authenticated generation is terminalizing or after the one-shot official Tuya
        // handoff has retired package correlation for this process. Post-handoff recovery is relaunch.
        guard currentConnectionToken == nil,
              OfficialTuyaFactory.packageCorrelationMayStart else { return }
        foregroundIntegrityLossHandled = false
        acceptsViewScopedMembershipRequests = true
    }
''',
              "view membership reactivation fence",
          )

          app = replace_once(
              app,
              '''    func appDidLoseForeground() {
        guard !foregroundIntegrityLossHandled else { return }
        foregroundIntegrityLossHandled = true
''',
              '''    func appDidLoseForeground() {
        // A sealed accepted artifact is immutable historical evidence. Foreground loss after seal
        // must not revoke or rewrite the already-accepted subject merely for presentation lifecycle.
        guard phase != .accepted else { return }
        guard !foregroundIntegrityLossHandled else { return }
        foregroundIntegrityLossHandled = true
''',
              "sealed accepted foreground preservation",
          )

          app = replace_once(
              app,
              '''        if processCorrelationLease != nil || correlationSession != nil {
            // Existing helper stops package transport before releasing this controller's lease.
            abandonPackageCorrelation()
            phase = .failed
            message = "Capture left the foreground during Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; interrupted windows are never reusable evidence."
            log("foreground_integrity_lost_during_target_correlation")
            return
        }

        guard let token = currentConnectionToken else {
''',
              '''        if processCorrelationLease != nil || correlationSession != nil {
            // Existing helper stops package transport before releasing this controller's lease.
            abandonPackageCorrelation()
            phase = .failed
            message = "Capture left the foreground during Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; interrupted windows are never reusable evidence."
            log("foreground_integrity_lost_during_target_correlation")
            return
        }

        if phase == .correlated || phase == .selected {
            // The finite scanners are already retired by this point, but their correlation result
            // is still mutable current-attempt authority. It may not cross a foreground boundary.
            resetDiscoverySessionOnly()
            phase = .failed
            message = "Capture left the foreground after Bluetooth target correlation. Return to Capture, re-verify this scooter in the current Tuya account, and restart from OFF1; prior correlation/selection is not reusable evidence."
            log("foreground_integrity_lost_after_target_correlation")
            return
        }

        guard let token = currentConnectionToken else {
''',
              "sealed correlation foreground invalidation",
          )

          app_path.write_text(app)

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift")
          test = test_path.read_text()

          test = replace_once(
              test,
              '''        let retiredGenerationGate = try requiredOffset(
            containing: "guard currentConnectionToken == nil else { return }",
            in: activation
        )
        let resetForegroundFence = try requiredOffset(
            containing: "foregroundIntegrityLossHandled = false",
            in: activation
        )
        let reopenAdmission = try requiredOffset(
            containing: "acceptsViewScopedMembershipRequests = true",
            in: activation
        )
        #expect(retiredGenerationGate < resetForegroundFence)
        #expect(resetForegroundFence < reopenAdmission)
''',
              '''        let retiredGenerationGate = try requiredOffset(
            containing: "guard currentConnectionToken == nil,",
            in: activation
        )
        let processHandoffGate = try requiredOffset(
            containing: "OfficialTuyaFactory.packageCorrelationMayStart",
            in: activation
        )
        let resetForegroundFence = try requiredOffset(
            containing: "foregroundIntegrityLossHandled = false",
            in: activation
        )
        let reopenAdmission = try requiredOffset(
            containing: "acceptsViewScopedMembershipRequests = true",
            in: activation
        )
        #expect(retiredGenerationGate < processHandoffGate)
        #expect(processHandoffGate < resetForegroundFence)
        #expect(resetForegroundFence < reopenAdmission)
''',
              "reactivation test contract",
          )

          test = replace_once(
              test,
              '''        let correlationCheck = try requiredOffset(
            containing: "if processCorrelationLease != nil || correlationSession != nil",
            in: cleanup
        )
        let tokenCheck = try requiredOffset(
            containing: "guard let token = currentConnectionToken else",
            in: cleanup
        )
''',
              '''        let correlationCheck = try requiredOffset(
            containing: "if processCorrelationLease != nil || correlationSession != nil",
            in: cleanup
        )
        let sealedCorrelationCheck = try requiredOffset(
            containing: "if phase == .correlated || phase == .selected",
            in: cleanup
        )
        let tokenCheck = try requiredOffset(
            containing: "guard let token = currentConnectionToken else",
            in: cleanup
        )
''',
              "correlated-selected test ordering",
          )

          test = replace_once(
              test,
              '''        #expect(membershipRevoke < officialRevoke)
        #expect(officialRevoke < correlationCheck)
        #expect(officialRevoke < tokenCheck)
        #expect(cleanup.contains("membershipBusy = false"))
        #expect(cleanup.contains("membershipProbe = nil"))
        #expect(cleanup.contains("watchdog?.cancel()"))
        #expect(cleanup.contains("foregroundIntegrityLossHandled = true"))
''',
              '''        #expect(membershipRevoke < officialRevoke)
        #expect(officialRevoke < correlationCheck)
        #expect(correlationCheck < sealedCorrelationCheck)
        #expect(sealedCorrelationCheck < tokenCheck)
        #expect(cleanup.contains("membershipBusy = false"))
        #expect(cleanup.contains("membershipProbe = nil"))
        #expect(cleanup.contains("watchdog?.cancel()"))
        let acceptedPreservationGate = try requiredOffset(
            containing: "guard phase != .accepted else { return }",
            in: cleanup
        )
        let markForegroundLossHandled = try requiredOffset(
            containing: "foregroundIntegrityLossHandled = true",
            in: cleanup
        )
        #expect(acceptedPreservationGate < markForegroundLossHandled)
        #expect(cleanup.contains("resetDiscoverySessionOnly()"))
        #expect(cleanup.contains("foreground_integrity_lost_after_target_correlation"))
''',
              "accepted and correlated authority test contract",
          )

          test_path.write_text(test)
          PY

          rm .github/workflows/materialize-capture-foreground-authority-r4.yml

          test "$(git diff --name-only)" = $'NembraApp/App/NembraCaptureEntrypoint.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift'

          git config user.name "nembra-v14-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift \
            .github/workflows/materialize-capture-foreground-authority-r4.yml
          git commit -m "Capture: close foreground evidence authority"
          git push origin HEAD:sol/v14-capture-foreground-authority-r4
