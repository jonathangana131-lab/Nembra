name: Capture terminal recovery current b877 integration

on:
  push:
    branches:
      - integration/es80-v14-terminal-recovery-current-b877-gpt56
    paths:
      - .github/workflows/capture-terminal-recovery-current-b877-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-terminal-recovery-current-b877-gpt56
          fetch-depth: 2

      - name: Verify exact staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9a8df1c398ea34baeaaba482c7604d652511bada"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-terminal-recovery-current-b877-integration.yml"

      - name: Apply exact terminal recovery delta
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          gate = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift")
          source = gate.read_text()

          old = '''        case horizonArtifactNotReady\n'''
          new = '''        case horizonArtifactNotReady\n        case freshTargetSessionRequired\n        case freshRecorderIdentityMismatch\n        case terminalResolvedFrontierNotApplied(expected: UInt64, actual: UInt64)\n        case terminalQueueChangedAfterResolution(expected: UInt64, actual: UInt64)\n'''
          if source.count(old) != 1:
              raise SystemExit(f"gate StateError site count {source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''    private var committedReadyTransaction: Transaction?\n'''
          new = '''    private var committedReadyTransaction: Transaction?\n    /// Exact already-provisioned durable target session required after recovery.\n    /// Weak reset cannot erase this one-shot bind.\n    private var requiredReadyTargetSessionGeneration: UInt64?\n'''
          if source.count(old) != 1:
              raise SystemExit(f"gate bind state site count {source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''        guard processedQueueSequence == nil else {\n            throw StateError.invalidTransition\n        }\n        guard nextRevision != UInt64.max else {\n'''
          new = '''        guard processedQueueSequence == nil else {\n            throw StateError.invalidTransition\n        }\n        if let requiredReadyTargetSessionGeneration {\n            guard authority.targetSessionGeneration == requiredReadyTargetSessionGeneration else {\n                throw StateError.freshTargetSessionRequired\n            }\n        }\n        guard nextRevision != UInt64.max else {\n'''
          if source.count(old) != 1:
              raise SystemExit(f"gate Ready bind check site count {source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''        phase = .drainingReady(transaction)\n        nextRevision += 1\n'''
          new = '''        requiredReadyTargetSessionGeneration = nil\n        phase = .drainingReady(transaction)\n        nextRevision += 1\n'''
          if source.count(old) != 1:
              raise SystemExit(f"gate Ready bind consume site count {source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''    /// Abort quarantine is intentionally irreversible in this slice. Raw FIFO\n    /// retirement alone cannot reopen lifecycle admission because retired positions\n    /// still need a separate globally-resolved frontier update. #450 owns that\n    /// producer and its successor integration must make fresh-session reopen consume\n    /// the producer-issued resolution receipt. Until then reset and Ready both fail.\n    @discardableResult\n    mutating func resetForNewCaptureSession() -> Bool {\n'''
          new = '''    /// Reopens a successful terminal Horizon only after the controller has\n    /// installed the exact recorder whose construction earned producer-issued fresh-session\n    /// proof, applied the exact terminal resolution to its global resolved frontier, and\n    /// proved no callback advanced the FIFO tail afterward.\n    ///\n    /// This transition is synchronous on MainActor. It consumes the terminal transaction's\n    /// exact process-local UUID and binds the exact fresh target-session generation until\n    /// the next Ready begins. Receipt possession alone and a caller-chosen generation are\n    /// deliberately insufficient.\n    @MainActor\n    mutating func reopenAfterTerminalFreshTargetSession(\n        _ freshTargetSession: PassiveCoreBluetoothTerminalFreshTargetSession.Receipt,\n        installedRecorder: PassiveCoreBluetoothCaptureRecorder,\n        currentResolvedThroughQueueSequence: UInt64,\n        currentLastEnqueuedEventSequence: UInt64\n    ) throws {\n        guard case let .terminal(transaction) = phase else {\n            throw StateError.invalidTransition\n        }\n\n        let resolution = freshTargetSession.terminalResolution\n        guard resolution.terminalTransactionRevision == transaction.revision,\n              resolution.terminalTransactionIdentity == transaction.identity,\n              resolution.horizonQueueCutoff == transaction.queueCutoff,\n              resolution.previouslyResolvedThroughQueueSequence == transaction.queueCutoff else {\n            throw StateError.staleTransaction\n        }\n        guard resolution.terminalAuthority == transaction.authority else {\n            throw StateError.authorityChanged\n        }\n        guard freshTargetSession.recorderIdentity == ObjectIdentifier(installedRecorder) else {\n            throw StateError.freshRecorderIdentityMismatch\n        }\n        guard currentResolvedThroughQueueSequence == resolution.resolvedThroughQueueSequence else {\n            throw StateError.terminalResolvedFrontierNotApplied(\n                expected: resolution.resolvedThroughQueueSequence,\n                actual: currentResolvedThroughQueueSequence\n            )\n        }\n        guard currentLastEnqueuedEventSequence == resolution.resolvedThroughQueueSequence else {\n            throw StateError.terminalQueueChangedAfterResolution(\n                expected: resolution.resolvedThroughQueueSequence,\n                actual: currentLastEnqueuedEventSequence\n            )\n        }\n        guard freshTargetSession.targetSessionGeneration > transaction.authority.targetSessionGeneration else {\n            throw StateError.freshTargetSessionRequired\n        }\n\n        committedReadyTransaction = nil\n        requiredReadyTargetSessionGeneration = freshTargetSession.targetSessionGeneration\n        phase = .awaitingReady\n    }\n\n    /// Abort quarantine remains irreversible here. Its sibling real-recorder producer\n    /// is separately owned and must converge without weakening terminal authority.\n    @discardableResult\n    mutating func resetForNewCaptureSession() -> Bool {\n'''
          if source.count(old) != 1:
              raise SystemExit(f"gate terminal reopen insertion site count {source.count(old)}")
          source = source.replace(old, new, 1)
          gate.write_text(source)

          controller = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          source = controller.read_text()

          old = '''    private var lastFinalizedArtifactAuthority: PassiveCoreBluetoothArtifactAuthorityContext?\n'''
          new = '''    private var lastFinalizedArtifactAuthority: PassiveCoreBluetoothArtifactAuthorityContext?\n    /// Exact successful-terminal FIFO resolution retained after immutable artifact\n    /// return. It remains inert until transport teardown crosses the real terminal\n    /// CoreBluetooth callback and a producer-created fresh recorder is installed.\n    private var pendingTerminalQueueResolution: PassiveCoreBluetoothTerminalQueueResolution.Receipt?\n'''
          if source.count(old) != 1:
              raise SystemExit(f"controller pending terminal state site count {source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''    public func teardownActiveConnectionAfterFinalization() throws {\n        guard activePeripheral != nil else { return }\n        guard observationBoundaryQueueGate.isTerminal else {\n'''
          new = '''    public func teardownActiveConnectionAfterFinalization() throws {\n        guard activePeripheral != nil else {\n            _ = try completeTerminalFreshTargetSessionIfReady()\n            return\n        }\n        guard observationBoundaryQueueGate.isTerminal else {\n'''
          if source.count(old) != 1:
              raise SystemExit(f"controller teardown site count {source.count(old)}")
          source = source.replace(old, new, 1)

          old = '''            do {\n                _ = try resolveQueuedEvidenceAfterTerminalHorizon()\n            } catch {\n'''
          new = '''            do {\n                let terminalResolution = try resolveQueuedEvidenceAfterTerminalHorizon()\n                pendingTerminalQueueResolution = terminalResolution\n            } catch {\n'''
          if source.count(old) != 1:
              raise SystemExit(f"controller terminal resolution retention site count {source.count(old)}")
          source = source.replace(old, new, 1)

          marker = '''    private func beginTargetSessionIfNeeded(for identifier: UUID) throws {\n'''
          helper = '''    /// Consumes one sealed terminal lifecycle into the exact next durable recorder only\n    /// after transport is idle and same-target terminal-callback quarantine has cleared.\n    /// There is deliberately no actor suspension from recorder/authority publication through\n    /// gate consumption, so a late callback cannot be relabeled into the fresh session.\n    @discardableResult\n    private func completeTerminalFreshTargetSessionIfReady(\n        startedAt: Date = Date()\n    ) throws -> Bool {\n        guard observationBoundaryQueueGate.isTerminal,\n              let terminalResolution = pendingTerminalQueueResolution else {\n            return false\n        }\n        guard let finalizedAuthority = lastFinalizedArtifactAuthority,\n              finalizedAuthority == terminalResolution.terminalAuthority,\n              currentArtifactAuthorityContext() == terminalResolution.terminalAuthority else {\n            throw ControllerError.artifactNotFinalized\n        }\n        guard !artifactReadBarrier.isActive,\n              observationBoundaryTask == nil,\n              activePeripheral == nil,\n              connectionPhase == .idle else {\n            return false\n        }\n        guard targetState.selectedTargetIdentifier != nil else {\n            throw ControllerError.targetNotSelected\n        }\n        guard !isSelectedTargetAwaitingTerminalCallback else {\n            return false\n        }\n        guard pendingEvents.isEmpty,\n              lastResolvedEventSequence == terminalResolution.resolvedThroughQueueSequence,\n              lastEnqueuedEventSequence == terminalResolution.resolvedThroughQueueSequence else {\n            throw ControllerError.captureIncomplete\n        }\n\n        let freshSession = try PassiveCoreBluetoothTerminalFreshTargetSession.create(\n            after: terminalResolution,\n            vehicleIdentity: vehicleIdentity,\n            startedAt: startedAt\n        )\n        let previousAuthority = currentArtifactAuthorityContext()\n        let freshAuthority = PassiveCoreBluetoothArtifactAuthorityContext(\n            targetSessionGeneration: freshSession.receipt.targetSessionGeneration,\n            authorityGeneration: 1\n        )\n\n        do {\n            try artifactAuthorityFence.transition(\n                from: previousAuthority,\n                to: freshAuthority\n            )\n            targetSessionGeneration = freshAuthority.targetSessionGeneration\n            artifactAuthorityGeneration = freshAuthority.authorityGeneration\n            recorder = freshSession.recorder\n            hasUsedInitialSessionIdentity = true\n            acquisitionLedger.beginTargetSession()\n            gattIdentityRegistry.reset()\n            selectedTargetCancellationPending = false\n            foregroundEvidenceIntegrityValid = true\n            committedReadyEpoch = nil\n\n            try observationBoundaryQueueGate.reopenAfterTerminalFreshTargetSession(\n                freshSession.receipt,\n                installedRecorder: freshSession.recorder,\n                currentResolvedThroughQueueSequence: lastResolvedEventSequence,\n                currentLastEnqueuedEventSequence: lastEnqueuedEventSequence\n            )\n        } catch {\n            failCapture(error)\n            throw ControllerError.captureFailed\n        }\n\n        pendingTerminalQueueResolution = nil\n        lastFinalizedArtifactAuthority = nil\n        return true\n    }\n\n'''
          if source.count(marker) != 1:
              raise SystemExit(f"controller helper marker count {source.count(marker)}")
          source = source.replace(marker, helper + marker, 1)

          old = '''        // After Horizon admission/freeze, consume CoreBluetooth transport cleanup\n        // only. The finalized/closing artifact authority is immutable.\n        if observationBoundaryQueueGate.isTerminal || observationBoundaryBlocksArtifactMutation {\n            selectedTargetCancellationPending = false\n            if case .active = disposition {\n                clearActiveConnectionState(for: identifier)\n            }\n            return\n        }\n'''
          new = '''        // After Horizon admission/freeze, consume CoreBluetooth transport cleanup\n        // only. The finalized/closing artifact authority is immutable until a real\n        // terminal callback has released same-target quarantine. Only then may the\n        // exact producer-created fresh recorder consume terminal resolution authority.\n        if observationBoundaryQueueGate.isTerminal || observationBoundaryBlocksArtifactMutation {\n            selectedTargetCancellationPending = false\n            if case .active = disposition {\n                clearActiveConnectionState(for: identifier)\n            }\n            do {\n                _ = try completeTerminalFreshTargetSessionIfReady()\n            } catch {\n                failCapture(error)\n            }\n            return\n        }\n'''
          if source.count(old) != 1:
              raise SystemExit(f"controller terminal callback site count {source.count(old)}")
          source = source.replace(old, new, 1)
          controller.write_text(source)

          Path(".github/workflows/capture-terminal-recovery-current-b877-integration.yml").unlink()
          PY

          git diff --check
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          gate=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          fresh=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothTerminalFreshTargetSession.swift
          test "$(grep -c 'private var pendingTerminalQueueResolution' "$controller")" = "1"
          test "$(grep -c 'private func completeTerminalFreshTargetSessionIfReady' "$controller")" = "1"
          test "$(grep -c 'reopenAfterTerminalFreshTargetSession(' "$controller")" = "1"
          test "$(grep -c 'mutating func reopenAfterTerminalFreshTargetSession' "$gate")" = "1"
          test "$(grep -c 'requiredReadyTargetSessionGeneration' "$gate")" -ge "4"
          test "$(grep -c 'let recorder: PassiveCoreBluetoothCaptureRecorder' "$fresh")" -ge "2"
          test "$(grep -c 'let issuedAtUptimeNanoseconds' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift)" -ge "1"
          test "$(grep -c 'foregroundEvidenceIntegrityValid = true' "$controller")" -ge "3"
          test "$(grep -c 'latestAdvertisement.receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds' "$controller")" = "1"
          test "$(grep -c 'try requireForegroundEvidenceIntegrity()' "$controller")" -ge "3"
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerTerminalFreshSessionConsumerTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothTerminalRealRecorderReopenTests.swift
          test ! -e .github/workflows/capture-terminal-recovery-current-b877-integration.yml

      - name: Commit exact product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-gpt56-v14"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: compose terminal fresh-recorder recovery on current Capture spine"
          git push origin HEAD:integration/es80-v14-terminal-recovery-current-b877-gpt56
