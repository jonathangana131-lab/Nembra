name: V14 premium Secure Link materializer

on:
  push:
    branches:
      - product/v14-capture-premium-secure-link-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Verify exact product parent
        run: test "$(git rev-parse HEAD^^)" = "df30de17a95c6df3e6bd2fda14b0de9ddb1d0d25"

      - name: Apply product surface and validate portable contracts
        run: |
          python3 scripts/ci/v14_premium_secure_link_surface_patch.py
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkProductSurfaceSourceTests.swift
          python3 scripts/ci/v14_premium_secure_link_surface_patch.py || test $? -ne 0

      - name: Commit clean product delta and retire materializer
        env:
          BRANCH: product/v14-capture-premium-secure-link-sol
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')" = "$EVENT_SHA"
          rm scripts/ci/v14_premium_secure_link_surface_patch.py
          rm .github/workflows/v14-premium-secure-link-materialize.yml
          git config user.name "nembra-v14-product"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkProductSurfaceSourceTests.swift scripts/ci/v14_premium_secure_link_surface_patch.py .github/workflows/v14-premium-secure-link-materialize.yml
          git commit -m "feat(capture): transform Secure Link into guided product flow"
          git push origin "HEAD:$BRANCH"
