name: ES80 Experiment One Clean Product Validation

on:
  push:
    branches:
      - parallel/validate-es80-experiment-one-readiness/chat-b3m8p

permissions:
  contents: read

jobs:
  validate-clean-product:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout exact clean product head
        uses: actions/checkout@v6
        with:
          ref: d05d060978d0c89491799dbadae36bc0be52db67
          fetch-depth: 0

      - name: Verify immutable target and dependency-relative shape
        run: |
          target="d05d060978d0c89491799dbadae36bc0be52db67"
          base="320de702c607312cfac7bce05999e3dc5b44a30d"
          test "$(git rev-parse HEAD)" = "$target"
          git merge-base --is-ancestor "$base" "$target"
          changed="$(git diff --name-only "$base" "$target" | sort)"
          expected="$(printf '%s\n' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCaptureEvidenceAssessment.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneCaptureEvidenceAssessmentTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOnePublicAuthoritySurfaceTests.swift' | sort)"
          test "$changed" = "$expected"

      - name: Test Bluetooth capture package with warnings as errors
        working-directory: Packages/NembraBluetoothCapture
        run: swift test -Xswiftc -warnings-as-errors

      - name: Guard Experiment One authority slice against characteristic writes
        run: |
          if grep -R -n -E 'writeValue[[:space:]]*\(' \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOne*.swift; then
            echo 'Experiment One authority slice must remain read-only.' >&2
            exit 1
          fi

      - name: Guard unfinished authority surface from public exposure
        run: |
          compact_run="$(tr -d '[:space:]' < Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift)"
          compact_assessment="$(tr -d '[:space:]' < Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCaptureEvidenceAssessment.swift)"
          forbidden_run=(
            'publicfinalclassPassiveBluetoothExperimentOneRun'
            'publicstructPassiveBluetoothExperimentOnePowerCycleEvidence'
            'publicstructPassiveBluetoothExperimentOneCaptureEvidence'
            'publicfuncbeginCaptureRecorder('
            'publicfunccaptureEvidenceAssessment('
          )
          for token in "${forbidden_run[@]}"; do
            if printf '%s' "$compact_run" | grep -Fq "$token"; then
              echo "Unfinished Experiment One authority became public: $token" >&2
              exit 1
            fi
          done
          forbidden_assessment=(
            'publicstructPassiveBluetoothExperimentOneCaptureEvidenceAssessment'
            'publicstaticfuncassess('
          )
          for token in "${forbidden_assessment[@]}"; do
            if printf '%s' "$compact_assessment" | grep -Fq "$token"; then
              echo "Unfinished Experiment One PASS evaluator became public: $token" >&2
              exit 1
            fi
          done
