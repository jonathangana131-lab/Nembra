name: Temporary Capture Failed-Prerequisite Recovery

on:
  push:
    branches:
      - product/v14-capture-premium-secure-link-current-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v14-capture-premium-secure-link-current-sol
          fetch-depth: 2

      - name: Guard exact reviewed product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9a25002e58d351d9db952caa7cc5f4961c03a4fb"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tmp-capture-failed-prerequisite-recovery.yml"

      - name: Restore actionable failed prerequisites
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          old = """        case .failed:
            failurePanel"""
          new = """        case .failed:
            if test.privateConfig && (!sdkAccount.loggedIn || !test.sdkAccountLoggedIn) {
                VStack(spacing: 16) {
                    failureRecoveryContextPanel
                    sdkAuthorizationPanel
                }
            } else if test.sdkAccountLoggedIn && (!test.sdkDeviceMembershipVerified || !test.accountIdentityLeaseIsAuthorized) {
                VStack(spacing: 16) {
                    failureRecoveryContextPanel
                    preflightPanel
                }
            } else {
                failurePanel
            }"""
          if text.count(old) != 1:
              raise SystemExit(f"failed-state routing anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)

          anchor = """    private var failurePanel: some View {
"""
          context = """    private var failureRecoveryContextPanel: some View {
        panel {
            VStack(alignment: .leading, spacing: 10) {
                Label("Capture paused", systemImage: "exclamationmark.circle")
                    .font(.title2.bold())
                    .foregroundStyle(.orange)
                Text(test.message)
                    .foregroundStyle(.secondary)
                    .fixedSize(horizontal: false, vertical: true)
                Text("Restore the missing prerequisite below. Capture does not reuse the failed attempt as evidence.")
                    .font(.footnote)
                    .foregroundStyle(.secondary)
            }
        }
    }

"""
          if text.count(anchor) != 1:
              raise SystemExit(f"failure panel anchor count: {text.count(anchor)}")
          text = text.replace(anchor, context + anchor, 1)
          path.write_text(text)

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFailedPrerequisiteRecoverySourceTests.swift")
          test_path.write_text(r'''import Foundation
import Testing
@testable import NembraBluetoothCapture

@Suite("Capture failed-prerequisite product recovery")
struct TuyaFailedPrerequisiteRecoverySourceTests {
    @Test("failed state exposes the control that can restore missing account or membership authority")
    func failedStateRoutesToRestorablePrerequisite() throws {
        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
        let surface = try section(in: app, from: "private var primarySurface: some View", to: "private var preflightPanel: some View")
        let body = String(surface)
        #expect(body.contains("case .failed:"))
        #expect(body.contains("!sdkAccount.loggedIn || !test.sdkAccountLoggedIn"))
        #expect(body.contains("sdkAuthorizationPanel"))
        #expect(body.contains("!test.sdkDeviceMembershipVerified || !test.accountIdentityLeaseIsAuthorized"))
        #expect(body.contains("preflightPanel"))
        #expect(body.contains("failureRecoveryContextPanel"))
    }

    @Test("recovery context preserves the exact blocker and failed-attempt boundary")
    func recoveryContextPreservesFailureReason() throws {
        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
        let context = try section(in: app, from: "private var failureRecoveryContextPanel: some View", to: "private var failurePanel: some View")
        #expect(context.contains("Text(test.message)"))
        #expect(context.contains("Capture does not reuse the failed attempt as evidence."))
    }

    private func section(in source: String, from start: String, to end: String) throws -> Substring {
        guard let startRange = source.range(of: start),
              let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
            throw SourceContractError.sectionMissing
        }
        return source[startRange.lowerBound..<endRange.lowerBound]
    }

    private func readRepositoryFile(_ relativePath: String) throws -> String {
        let repositoryRoot = URL(fileURLWithPath: #filePath)
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
        return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
    }

    private enum SourceContractError: Error { case sectionMissing }
}
''')

      - name: Verify recovery without weakening authority
        shell: bash
        run: |
          set -euo pipefail
          entrypoint='NembraApp/App/NembraCaptureEntrypoint.swift'
          grep -Fq '!sdkAccount.loggedIn || !test.sdkAccountLoggedIn' "$entrypoint"
          grep -Fq '!test.sdkDeviceMembershipVerified || !test.accountIdentityLeaseIsAuthorized' "$entrypoint"
          grep -Fq 'failureRecoveryContextPanel' "$entrypoint"
          grep -Fq 'sdkAuthorizationPanel' "$entrypoint"
          grep -Fq 'preflightPanel' "$entrypoint"
          grep -Fq 'failedAttemptCanRestartFromOFF1' "$entrypoint"
          grep -Fq 'currentConnectionToken == nil' "$entrypoint"
          grep -Fq 'self.sdkLocalBLEOnline = driver.isLocallyConnected(uuid: self.tuyaUUID)' "$entrypoint"
          grep -Fq 'procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier' "$entrypoint"
          grep -Fq 'schemaVersion: 10' "$entrypoint"
          swiftc -parse "$entrypoint"
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFailedPrerequisiteRecoverySourceTests.swift
          git diff --check

      - name: Commit clean product repair
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/tmp-capture-failed-prerequisite-recovery.yml
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): restore failed prerequisite recovery'
          git push origin HEAD:product/v14-capture-premium-secure-link-current-sol
