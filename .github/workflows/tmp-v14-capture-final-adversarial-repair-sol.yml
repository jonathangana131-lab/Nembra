name: Temporary V14 Capture Final Adversarial Repair

on:
  push:
    branches:
      - agent/v14-capture-final-adversarial-repair-sol
    paths:
      - .github/workflows/tmp-v14-capture-final-adversarial-repair-sol.yml
      - .github/materializers/v14_capture_final_adversarial_repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-final-adversarial-repair-sol
          fetch-depth: 0
      - name: Materialize and validate
        run: python3 .github/materializers/v14_capture_final_adversarial_repair.py
