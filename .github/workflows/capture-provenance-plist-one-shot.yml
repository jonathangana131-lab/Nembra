name: Capture provenance plist one-shot

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56

permissions:
  contents: write

jobs:
  repair:
    name: Materialize product-only Xcode 27 provenance plist repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'capture/one-time-ble-dump-gpt56'
          parent="$(git rev-parse HEAD^)"
          test "$parent" = 'ca1e18727c293329136907bf8fc1937d96562448'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize product stamping repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          plist = Path('NembraCaptureProvenance.plist')
          if plist.exists():
              raise SystemExit('NembraCaptureProvenance.plist already exists')
          plist.write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NembraCaptureBuildIdentifier</key>
              <string>$(NEMBRA_CAPTURE_BUILD_IDENTIFIER)</string>
              <key>NembraCaptureSourceCommitSHA</key>
              <string>$(NEMBRA_CAPTURE_BUILD_COMMIT_SHA)</string>
              <key>NembraCaptureTuyaDependencyLockSHA256</key>
              <string>$(NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256)</string>
              <key>NembraCaptureProcedureIdentifier</key>
              <string>$(NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER)</string>
          </dict>
          </plist>
          ''')

          replace_exact(
              'scripts/field/install_one_time_capture.command',
              '    "NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256=$TUYA_DEPENDENCY_LOCK_SHA256" \\\n    "INFOPLIST_KEY_NembraCaptureProcedureIdentifier=$PROCEDURE_ID" \\\n',
              '    "NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256=$TUYA_DEPENDENCY_LOCK_SHA256" \\\n    "NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER=$PROCEDURE_ID" \\\n    "INFOPLIST_FILE=NembraCaptureProvenance.plist" \\\n'
          )
          replace_exact(
              'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift',
              '#expect(installer.contains("INFOPLIST_KEY_NembraCaptureProcedureIdentifier=$PROCEDURE_ID"))',
              '#expect(installer.contains("NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER=$PROCEDURE_ID"))\n        #expect(installer.contains("INFOPLIST_FILE=NembraCaptureProvenance.plist"))'
          )
          PY
          python3 - <<'PY'
          import plistlib
          with open('NembraCaptureProvenance.plist', 'rb') as f:
              data = plistlib.load(f)
          expected = {
              'NembraCaptureBuildIdentifier': '$(NEMBRA_CAPTURE_BUILD_IDENTIFIER)',
              'NembraCaptureSourceCommitSHA': '$(NEMBRA_CAPTURE_BUILD_COMMIT_SHA)',
              'NembraCaptureTuyaDependencyLockSHA256': '$(NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256)',
              'NembraCaptureProcedureIdentifier': '$(NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER)',
          }
          if data != expected:
              raise SystemExit(f'unexpected plist contents: {data!r}')
          PY
          bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Verify product-only delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)
          expected=(
            'NembraCaptureProvenance.plist'
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift'
            'scripts/field/install_one_time_capture.command'
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          ! grep -R -n -F 'publishDps(' NembraApp/App/NembraCaptureEntrypoint.swift NembraApp/Features/Research/TuyaAccountBridge.swift
          ! grep -R -n -F 'writeValue(' NembraApp/App/NembraCaptureEntrypoint.swift NembraApp/Features/Research/TuyaAccountBridge.swift

      - name: Publish product successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraCaptureProvenance.plist \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift \
            scripts/field/install_one_time_capture.command
          git commit -m 'Capture: stamp provenance through explicit plist input'
          git push origin HEAD:capture/one-time-ble-dump-gpt56
