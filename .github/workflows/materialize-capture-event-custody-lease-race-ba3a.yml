name: Materialize Capture Event Custody Lease Race ba3a

on:
  push:
    branches:
      - recovery/v14-capture-event-custody-lease-race-ba3a-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-event-custody-lease-race-ba3a-sol
          fetch-depth: 0

      - name: Materialize reviewed event-custody repair
        run: python3 scripts/ci/materialize_capture_event_custody_lease_race_ba3a.py

      - name: Verify clean effective product shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/ci/materialize_capture_event_custody_lease_race_ba3a.py
          test ! -e .github/workflows/materialize-capture-event-custody-lease-race-ba3a.yml
          grep -Fq 'let eventDetailsAtAdmission = redactedApplicationEventDetails(' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'currentLeasedAccountUID == leasedAccountUID' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'application_event_authority_changed_before_custody' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'while redacted[redactedKey] != nil' NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift

      - name: Commit clean current-head donor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Capture: freeze account UID privacy before async event custody'
          git push origin HEAD:recovery/v14-capture-event-custody-lease-race-ba3a-sol
