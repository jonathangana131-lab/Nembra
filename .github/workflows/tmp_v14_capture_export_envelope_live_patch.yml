name: Temporary Capture Accepted Envelope Live Patch

on:
  push:
    branches:
      - repair/v14-capture-sealed-export-envelope-live-sol

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-sealed-export-envelope-live-sol
          fetch-depth: 0

      - name: Install Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      - name: Apply strict current-spine patch and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = p.read_text()
          def once(a,b,label):
              global s
              n=s.count(a)
              if n != 1: raise SystemExit(f'{label}: expected 1, got {n}')
              s=s.replace(a,b,1)

          once('        let exportedAt: Date\n','        var exportedAt: Date\n','exportedAt')
          once('    private var sealedAcceptedEventPrefix: [Event]?\n',
               '    private var sealedAcceptedEventPrefix: [Event]?\n    private var sealedAcceptedExportSnapshot: Export?\n',
               'snapshot storage')
          once('    var secureSessionEstablished: Bool {\n',
               '    private var acceptanceSourceAuthorityIsStillAuthorized: Bool {\n        buildIdentity.isAuthoritativeFieldBuild\n            && privateConfig\n            && sdkAccountLoggedIn\n            && sdkDeviceMembershipVerified\n            && accountIdentityLeaseIsAuthorized\n    }\n\n    var secureSessionEstablished: Bool {\n',
               'source authority predicate')

          old='''                    self.acceptanceCutIsClosed = true
                    // Freeze only the current physical attempt. Older failed-attempt diagnostics stay
                    // available in the live controller log but cannot contaminate accepted evidence.
                    let acceptedEventPrefixAtCut = Array(self.events.dropFirst(self.captureAttemptEventStartIndex))
                    do {
                        try await sessionLedger.sealAcceptedObservation(for: token)
                        self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut
                        self.currentConnectionToken = nil
                        await self.refreshLedgerSnapshot()
                        self.phase = .accepted
'''
          new='''                    self.acceptanceCutIsClosed = true
                    // Freeze only the current physical attempt. Older failed-attempt diagnostics stay
                    // available in the live controller log but cannot contaminate accepted evidence.
                    let acceptedEventPrefixAtCut = Array(self.events.dropFirst(self.captureAttemptEventStartIndex))
                    // Freeze all acceptance-bound metadata at the same quiescent cut. This candidate
                    // becomes authoritative only after the package seal succeeds and source authority
                    // is rechecked after that suspension point.
                    let acceptedExportSnapshotAtCut = self.makeExportSnapshot(
                        phase: .accepted,
                        exportedAt: Date(),
                        events: acceptedEventPrefixAtCut
                    )
                    do {
                        try await sessionLedger.sealAcceptedObservation(for: token)
                        guard self.acceptanceSourceAuthorityIsStillAuthorized else {
                            self.sealedAcceptedEventPrefix = nil
                            self.sealedAcceptedExportSnapshot = nil
                            self.currentConnectionToken = nil
                            self.localBLESettlementToken = nil
                            self.sdkLocalBLEOnline = false
                            self.driver = nil
                            await self.refreshLedgerSnapshot()
                            self.phase = .failed
                            self.message = "Source authority changed while canonical acceptance was sealing. The package generation was retired, but no accepted artifact was published. Re-verify the exact SDK account/device and restart from OFF1."
                            self.log("source_authority_changed_during_acceptance_seal", [
                                "generation": String(token.diagnosticGeneration)
                            ])
                            return
                        }
                        self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut
                        self.sealedAcceptedExportSnapshot = acceptedExportSnapshotAtCut
                        self.currentConnectionToken = nil
                        await self.refreshLedgerSnapshot()
                        self.phase = .accepted
'''
          once(old,new,'acceptance block')

          start=s.index('    func prepareExport() {\n')
          end=s.index('    private func resetDiscoverySessionOnly() {\n', start)
          old_export=s[start:end]
          for t in ['sealedAcceptedEventPrefix = acceptedEventPrefix','events: sealedAcceptedEventPrefix','schemaVersion: 8']:
              if t not in old_export: raise SystemExit(f'old export missing {t}')
          new_export='''    private func makeExportSnapshot(
        phase: Phase,
        exportedAt: Date,
        events: [Event]
    ) -> Export {
        Export(
            schemaVersion: 8,
            purpose: "Sanitized Tuya authenticated read-only stationary preflight",
            exportedAt: exportedAt,
            buildIdentifier: buildIdentity.buildIdentifier,
            sourceCommitSHA: buildIdentity.sourceCommitSHA,
            tuyaDeviceID: deviceID,
            tuyaUUID: tuyaUUID,
            productID: productID,
            selectedPeripheralID: selectedID?.uuidString,
            targetCorrelationMethod: targetCorrelationMethod,
            targetCorrelationWindowCount: targetCorrelationWindowCount,
            targetCorrelationOperatorConfirmed: targetCorrelationOperatorConfirmed,
            targetCorrelationProvenance: correlationProvenance,
            phase: phase,
            privateConfigPresent: privateConfig,
            sdkAccountLoggedIn: sdkAccountLoggedIn,
            sdkDeviceMembershipVerified: sdkDeviceMembershipVerified,
            secureSessionEstablished: secureSessionEstablished,
            canonicalObservedAgeSeconds: canonicalObservedAgeSeconds,
            sdkLocalBLEOnline: sdkLocalBLEOnline,
            applicationUpdateCount: applicationUpdateCount,
            connectionGeneration: ledgerSnapshot.connectionGeneration,
            authenticationMethod: ledgerSnapshot.authenticationMethod?.rawValue,
            preflightVerdict: preflightVerdictText,
            applicationValueRepresentation: "ThingSmartDeviceDelegate dpsUpdate values projected with String(describing:); application-level SDK data, not byte-exact or raw FD50 transport",
            rawFD50BytesCaptured: false,
            secretsRedacted: true,
            dpQueriesSent: false,
            dpCommandsSent: false,
            candidates: candidates,
            events: events
        )
    }

    func prepareExport() {
        let sealedAcceptedEventPrefix: [Event]
        if phase == .accepted {
            guard let acceptedEventPrefix = self.sealedAcceptedEventPrefix else {
                exportData = nil
                message = "Accepted diagnostics cannot be exported because the immutable accepted event prefix is unavailable. Restart from OFF1 rather than exporting mutable post-seal diagnostics."
                return
            }
            sealedAcceptedEventPrefix = acceptedEventPrefix
        } else {
            sealedAcceptedEventPrefix = events
        }

        let envelope: Export
        if phase == .accepted {
            guard var acceptedSnapshot = self.sealedAcceptedExportSnapshot else {
                exportData = nil
                message = "Accepted diagnostics cannot be exported because the immutable accepted evidence envelope is unavailable. Restart from OFF1 rather than exporting mutable post-seal authority."
                return
            }
            acceptedSnapshot.exportedAt = Date()
            envelope = acceptedSnapshot
        } else {
            envelope = makeExportSnapshot(phase: phase, exportedAt: Date(), events: sealedAcceptedEventPrefix)
        }

        do {
            let encoder = JSONEncoder()
            encoder.outputFormatting = [.prettyPrinted, .sortedKeys, .withoutEscapingSlashes]
            encoder.dateEncodingStrategy = .iso8601
            exportData = try encoder.encode(envelope)
            exportName = "Nembra-Secure-Link-\\(deviceID.prefix(8))-Diagnostics.json"
            message = "Sanitized diagnostics ready with exact compiled build provenance. No account UID, AppKey/AppSecret, password, account token, local_key, session key, raw FD50 claim, DP query, or DP command is exported."
        } catch {
            message = "Diagnostic export failed: \\(error.localizedDescription)"
        }
    }

'''
          s=s[:start]+new_export+s[end:]
          once('        acceptanceCutIsClosed = false\n        sealedAcceptedEventPrefix = nil\n',
               '        acceptanceCutIsClosed = false\n        sealedAcceptedEventPrefix = nil\n        sealedAcceptedExportSnapshot = nil\n',
               'reset')
          p.write_text(s)

          test=Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedExportEnvelopeSealSourceTests.swift')
          test.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture accepted export envelope immutability")
          struct TuyaAcceptedExportEnvelopeSealSourceTests {
              @Test("current-attempt event cut also freezes the full accepted envelope")
              func fullEnvelopeUsesCurrentAttemptCut() throws {
                  let app = try read("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let watchdog = try section(app, "private func startWatchdog", "private func recordObservedTransportLoss")
                  let b = String(watchdog)
                  guard let cut=b.range(of:"let acceptedEventPrefixAtCut = Array(self.events.dropFirst(self.captureAttemptEventStartIndex))"),
                        let snap=b.range(of:"let acceptedExportSnapshotAtCut = self.makeExportSnapshot(",range:cut.upperBound..<b.endIndex),
                        let seal=b.range(of:"try await sessionLedger.sealAcceptedObservation(for: token)",range:snap.upperBound..<b.endIndex),
                        let recheck=b.range(of:"guard self.acceptanceSourceAuthorityIsStillAuthorized",range:seal.upperBound..<b.endIndex),
                        let publish=b.range(of:"self.sealedAcceptedExportSnapshot = acceptedExportSnapshotAtCut",range:recheck.upperBound..<b.endIndex) else { throw E.missing }
                  #expect(cut.lowerBound < snap.lowerBound && snap.lowerBound < seal.lowerBound && seal.lowerBound < recheck.lowerBound && recheck.lowerBound < publish.lowerBound)
              }

              @Test("accepted export never rereads mutable post-seal SDK authority")
              func acceptedExportUsesSnapshot() throws {
                  let app = try read("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let export = try section(app,"func prepareExport()","private func resetDiscoverySessionOnly()")
                  #expect(app.contains("private var sealedAcceptedExportSnapshot: Export?"))
                  #expect(export.contains("guard var acceptedSnapshot = self.sealedAcceptedExportSnapshot"))
                  #expect(export.contains("acceptedSnapshot.exportedAt = Date()"))
                  #expect(export.contains("envelope = acceptedSnapshot"))
              }

              @Test("post-seal membership mutation cannot rewrite accepted metadata")
              func postSealMembershipIsFrozen() throws {
                  let app = try read("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let invalidate = try section(app,"func invalidateSDKMembership()","func verifySDKMembership")
                  #expect(invalidate.contains("sdkDeviceMembershipVerified = false"))
                  #expect(!invalidate.contains(".accepted"))
                  #expect(app.contains("source_authority_changed_during_acceptance_seal"))
              }

              @Test("fresh attempt clears full sealed custody")
              func resetClearsBothSnapshots() throws {
                  let app = try read("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let reset = try section(app,"private func resetDiscoverySessionOnly()","private func failLocally")
                  #expect(reset.contains("sealedAcceptedEventPrefix = nil"))
                  #expect(reset.contains("sealedAcceptedExportSnapshot = nil"))
              }

              private func section(_ s:String,_ a:String,_ z:String)throws->Substring{guard let x=s.range(of:a),let y=s.range(of:z,range:x.upperBound..<s.endIndex)else{throw E.missing};return s[x.lowerBound..<y.lowerBound]}
              private func read(_ r:String)throws->String{let root=URL(fileURLWithPath:#filePath).deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent();return try String(contentsOf:root.appendingPathComponent(r),encoding:.utf8)}
              private enum E:Error{case missing}
          }
          '''.replace('\n          ','\n'))
          PY
          git diff --check

      - name: Parse and run focused source contracts
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedExportEnvelopeSealSourceTests.swift
          cd Packages/NembraBluetoothCapture
          swift test --filter TuyaAcceptedApplicationEvidenceSealSourceTests
          swift test --filter TuyaAcceptedExportEnvelopeSealSourceTests

      - name: Commit durable two-path repair only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp_v14_capture_export_envelope_live_patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): seal full accepted export envelope'
          git push origin HEAD:repair/v14-capture-sealed-export-envelope-live-sol
