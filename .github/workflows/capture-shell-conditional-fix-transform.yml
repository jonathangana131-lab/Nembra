name: Capture shell conditional-compilation repair

on:
  push:
    branches:
      - fix/capture-xcode27-conditional-compilation-051964

permissions:
  contents: write

concurrency:
  group: capture-shell-conditional-fix-transform
  cancel-in-progress: false

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Verify exact transformer ancestry and staging scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=0519647a51f1b8db8b4a55f1cafe2ad4d2c23b2e
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-shell-conditional-fix-transform.yml' 'scripts/ci/tmp_capture_shell_conditional_fix.py' | sort)"
          test "$actual" = "$expected"

      - name: Repair syntactically complete conditional branches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_capture_shell_conditional_fix.py
          git diff --check
          grep -Fq 'private var completionShareAction: some View' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -Fq 'private var completionEvidenceCopy: some View' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -Fq 'private var captureDetailsRows: some View' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -Fq 'guard status.physicalProcedurePermitted else' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -Fq 'PassiveBluetoothExperimentOneFinalShareIntegrity.inspect(artifact.json)' NembraApp/Features/Research/ES80CaptureShellView.swift

      - name: Commit effective source-only repair and self-delete transformer
        shell: bash
        run: |
          set -euo pipefail
          BASE=0519647a51f1b8db8b4a55f1cafe2ad4d2c23b2e
          rm .github/workflows/capture-shell-conditional-fix-transform.yml
          rm scripts/ci/tmp_capture_shell_conditional_fix.py
          git diff --check
          actual="$(git diff --name-only "$BASE" | sort)"
          test "$actual" = 'NembraApp/Features/Research/ES80CaptureShellView.swift'
          git config user.name 'nembra-capture-transform'
          git config user.email 'nembra-capture-transform@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): close simulator conditional branches'
          git push origin HEAD:fix/capture-xcode27-conditional-compilation-051964
