name: Capture shell conditional-compilation repair

on:
  push:
    branches:
      - fix/capture-xcode27-conditional-compilation-051964

permissions:
  contents: write

concurrency:
  group: capture-shell-conditional-fix-transform
  cancel-in-progress: false

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact transformer parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0519647a51f1b8db8b4a55f1cafe2ad4d2c23b2e"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-shell-conditional-fix-transform.yml"

