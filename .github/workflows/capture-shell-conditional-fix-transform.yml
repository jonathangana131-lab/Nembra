          test "$(git diff --name-only HEAD^ | sort)" = "NembraApp/Features/Research/ES80CaptureShellView.swift"
          git config user.name "nembra-capture-transform"
          git config user.email "nembra-capture-transform@users.noreply.github.com"
          git add NembraApp/Features/Research/ES80CaptureShellView.swift .github/workflows/capture-shell-conditional-fix-transform.yml
