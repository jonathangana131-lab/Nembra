name: Capture AX Activation Bootstrap

on:
  push:
    branches:
      - fix/capture-ax-activation-8fe-gpt56

permissions:
  contents: write

jobs:
  patch-exact-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: fix/capture-ax-activation-8fe-gpt56
          fetch-depth: 2

      - name: Verify exact flagship parent
        shell: bash
        run: |
          set -euo pipefail
          expected='8fe891fb66d3e78a0f455ff6d20343513af1f5e1'
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || {
            echo "Refusing stale bootstrap: expected parent $expected, got $actual" >&2
            exit 1
          }

      - name: Patch real Capture Dynamic Type acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraUITests/ES80ResearchCaptureUITests.swift')
          source = path.read_text()

          invalid = 'UICTContentSizeCategoryAccessibilityExtraExtraExtraLarge'
          valid = 'UICTContentSizeCategoryAccessibilityXXXL'
          count = source.count(invalid)
          if count != 4:
              raise SystemExit(f'expected exactly 4 invalid Capture content-size values, found {count}')
          source = source.replace(invalid, valid)

          needle = '''        XCTAssertTrue(passiveMode.waitForExistence(timeout: 3))
          XCTAssertTrue(progress.waitForExistence(timeout: 3))'''
          if source.count(needle) != 1:
              raise SystemExit(f'expected exactly one Horizon-ready AX activation insertion point, found {source.count(needle)}')

          replacement = '''        XCTAssertTrue(passiveMode.waitForExistence(timeout: 3))
          let heroStatus = app.staticTexts["Ready to seal"]
          XCTAssertTrue(heroStatus.waitForExistence(timeout: 3))
          XCTAssertGreaterThan(
              passiveMode.frame.minY,
              heroStatus.frame.maxY,
              "Accessibility XXXL must activate the stacked Capture hero layout before visual acceptance."
          )
          XCTAssertTrue(progress.waitForExistence(timeout: 3))'''
          source = source.replace(needle, replacement)
          path.write_text(source)
          PY

          test "$(grep -c 'UICTContentSizeCategoryAccessibilityXXXL' NembraUITests/ES80ResearchCaptureUITests.swift)" -eq 4
          ! grep -q 'UICTContentSizeCategoryAccessibilityExtraExtraExtraLarge' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'Accessibility XXXL must activate the stacked Capture hero layout before visual acceptance.' NembraUITests/ES80ResearchCaptureUITests.swift
          git diff --check

      - name: Remove bootstrap workflow and commit only durable test repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-ax-activation-bootstrap-gpt56.yml
          git add -A
          changed="$(git diff --cached --name-only)"
          test "$changed" = 'NembraUITests/ES80ResearchCaptureUITests.swift' || {
            echo "Unexpected durable diff:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git config user.name 'nembra-v14-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '[Capture TODAY] Prove Accessibility XXXL activation'
          git push origin HEAD:fix/capture-ax-activation-8fe-gpt56
