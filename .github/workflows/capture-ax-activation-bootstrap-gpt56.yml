name: Capture AX Activation Bootstrap

on:
  push:
    branches:
      - fix/capture-ax-activation-8fe-gpt56

permissions:
  contents: write

jobs:
  patch-exact-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: fix/capture-ax-activation-8fe-gpt56
          fetch-depth: 4

      - name: Verify exact flagship base and bootstrap-only drift
        shell: bash
        run: |
          set -euo pipefail
          base='8fe891fb66d3e78a0f455ff6d20343513af1f5e1'
          git merge-base --is-ancestor "$base" HEAD
          drift="$(git diff --name-only "$base"..HEAD)"
          test "$drift" = '.github/workflows/capture-ax-activation-bootstrap-gpt56.yml' || {
            echo "Refusing bootstrap with non-workflow drift from exact flagship base:" >&2
            printf '%s\n' "$drift" >&2
            exit 1
          }

      - name: Patch real Capture Dynamic Type acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('NembraUITests/ES80ResearchCaptureUITests.swift')
          source = path.read_text()

          invalid = 'UICTContentSizeCategoryAccessibilityExtraExtraExtraLarge'
          valid = 'UICTContentSizeCategoryAccessibilityXXXL'
          count = source.count(invalid)
          if count != 4:
              raise SystemExit(f'expected exactly 4 invalid Capture content-size values, found {count}')
          source = source.replace(invalid, valid)

          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)XCTAssertTrue\(passiveMode\.waitForExistence\(timeout: 3\)\)\n'
              r'(?P=indent)XCTAssertTrue\(progress\.waitForExistence\(timeout: 3\)\)$'
          )

          def add_activation_proof(match: re.Match[str]) -> str:
              indent = match.group('indent')
              return '\n'.join([
                  f'{indent}XCTAssertTrue(passiveMode.waitForExistence(timeout: 3))',
                  f'{indent}let heroStatus = app.staticTexts["Ready to seal"]',
                  f'{indent}XCTAssertTrue(heroStatus.waitForExistence(timeout: 3))',
                  f'{indent}XCTAssertGreaterThan(',
                  f'{indent}    passiveMode.frame.minY,',
                  f'{indent}    heroStatus.frame.maxY,',
                  f'{indent}    "Accessibility XXXL must activate the stacked Capture hero layout before visual acceptance."',
                  f'{indent})',
                  f'{indent}XCTAssertTrue(progress.waitForExistence(timeout: 3))',
              ])

          source, substitutions = pattern.subn(add_activation_proof, source)
          if substitutions != 1:
              raise SystemExit(f'expected exactly one Horizon-ready AX activation insertion point, found {substitutions}')

          path.write_text(source)
          PY

          test "$(grep -c 'UICTContentSizeCategoryAccessibilityXXXL' NembraUITests/ES80ResearchCaptureUITests.swift)" -eq 4
          ! grep -q 'UICTContentSizeCategoryAccessibilityExtraExtraExtraLarge' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'Accessibility XXXL must activate the stacked Capture hero layout before visual acceptance.' NembraUITests/ES80ResearchCaptureUITests.swift
          git diff --check

      - name: Remove bootstrap workflow and commit only durable test repair
        shell: bash
        run: |
          set -euo pipefail
          base='8fe891fb66d3e78a0f455ff6d20343513af1f5e1'
          rm .github/workflows/capture-ax-activation-bootstrap-gpt56.yml
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' '.github/workflows/capture-ax-activation-bootstrap-gpt56.yml' 'NembraUITests/ES80ResearchCaptureUITests.swift' | sort)"
          test "$changed" = "$expected" || {
            echo "Unexpected bootstrap commit paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git config user.name 'nembra-v14-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '[Capture TODAY] Prove Accessibility XXXL activation'
          final_drift="$(git diff --name-only "$base"..HEAD)"
          test "$final_drift" = 'NembraUITests/ES80ResearchCaptureUITests.swift' || {
            echo "Final branch would contain unexpected durable paths:" >&2
            printf '%s\n' "$final_drift" >&2
            exit 1
          }
          git push origin HEAD:fix/capture-ax-activation-8fe-gpt56
