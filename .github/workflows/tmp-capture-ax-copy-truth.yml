name: Temporary Capture AX copy truth materializer

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.repository == 'jonathangana131-lab/Nembra' &&
      github.event.pull_request.number == 2612 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/v14-capture-live-main-visual-acceptance-sol'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact admitted head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Guard exact root and patch truth copy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = 'b7320f8bdd1a82ebe4d8e7f6ed6c12b4efea7cca'
          python3 - <<'PY'
          from pathlib import Path

          root = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = root.read_text()
          old = 'Text("Account setup only in this public build.")'
          new = 'Text(fieldBuildIsAuthoritative ? "Account metadata only here. Bluetooth stays locked until preflight verifies account and scooter authority." : "Account setup only in this public build.")'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one public-only AX copy occurrence, found {source.count(old)}')
          root.write_text(source.replace(old, new, 1))

          test_file = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift')
          tests = test_file.read_text()
          old_test = '#expect(root.contains("Account setup only in this public build."))'
          new_test = '#expect(root.contains("fieldBuildIsAuthoritative ? \\"Account metadata only here. Bluetooth stays locked until preflight verifies account and scooter authority.\\" : \\"Account setup only in this public build.\\""))'
          if tests.count(old_test) != 1:
              raise SystemExit(f'expected exactly one AX copy source assertion, found {tests.count(old_test)}')
          test_file.write_text(tests.replace(old_test, new_test, 1))
          PY
          git diff --check
          grep -Fq 'Text(fieldBuildIsAuthoritative ? "Account metadata only here. Bluetooth stays locked until preflight verifies account and scooter authority." : "Account setup only in this public build.")' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Commit repair and remove all temporary materializers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-capture-ax-copy-truth.yml
          rm -f .github/workflows/tmp-capture-ax-copy-truth-repair.yml
          rm -f scripts/ci/tmp_capture_ax_copy_truth.py
          rm -f scripts/ci/tmp_capture_ax_copy_truth_v2.py
          git diff --check
          git config user.name 'Nembra Capture Closure'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): scope AX account copy to build authority'
          git push origin HEAD:agent/v14-capture-live-main-visual-acceptance-sol
