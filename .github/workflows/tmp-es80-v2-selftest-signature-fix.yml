name: Temporary ES80 v2 self-test signature repair

on:
  push:
    branches:
      - recovery/es80-v14-field-evidence-v2-closure-gpt56

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/es80-v14-field-evidence-v2-closure-gpt56
      - name: Repair built-in alias helper self-test call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ci/es80_signed_field_artifact_evidence.py')
          text = p.read_text()
          old = '''    duplicate_member = _safe_member_path("Payload/Nembra.app/Info.plist")
    seen_members: set[PurePosixPath] = set()
    _require_unique_member_path(duplicate_member, seen_members)
    try:
        _require_unique_member_path(duplicate_member, seen_members)
'''
          new = '''    duplicate_member = _safe_member_path("Payload/Nembra.app/Info.plist")
    seen_members: set[PurePosixPath] = set()
    seen_aliases: dict[tuple[str, ...], PurePosixPath] = {}
    _require_unique_member_path(duplicate_member, seen_members, seen_aliases)
    try:
        _require_unique_member_path(duplicate_member, seen_members, seen_aliases)
'''
          if old not in text:
              raise SystemExit('self-test duplicate-member block shape changed')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/ci/es80_signed_field_artifact_evidence.py --self-test
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-es80-v2-selftest-signature-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/ci/es80_signed_field_artifact_evidence.py .github/workflows/tmp-es80-v2-selftest-signature-fix.yml
          git diff --cached --check
          git commit -m '[Capture field provenance v14] Repair namespace self-test harness'
          git push origin HEAD:recovery/es80-v14-field-evidence-v2-closure-gpt56
