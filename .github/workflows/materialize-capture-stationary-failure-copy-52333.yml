name: Materialize Capture Stationary Recovery Copy 52333

on:
  push:
    branches:
      - sol/v14-capture-stationary-failure-copy-52333

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current-product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='52333deb09ea9a5964250097f83884d285f25d78'
          git merge-base --is-ancestor "$parent" HEAD
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 1
          test "${changed[0]}" = '.github/workflows/materialize-capture-stationary-failure-copy-52333.yml'
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift

      - name: Apply stationary-only recovery truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = app.read_text(encoding='utf-8')
          replacements = {
              'Source authority changed while canonical acceptance was sealing. Restart from OFF1; the sealed package chronology is diagnostic only.': 'Source authority changed while canonical acceptance was sealing. Relaunch Capture before a new stationary read-only attempt; the sealed package chronology is diagnostic only.',
              'Tuya local-BLE authority became unavailable after canonical acceptance sealed. Restart from OFF1; no disconnect time is inferred.': 'Tuya local-BLE authority became unavailable after canonical acceptance sealed. Relaunch Capture before a new stationary read-only attempt; no disconnect time is inferred.',
              'Tuya local-BLE authority was no longer current after canonical acceptance sealed. Restart from OFF1; no disconnect time is inferred.': 'Tuya local-BLE authority was no longer current after canonical acceptance sealed. Relaunch Capture before a new stationary read-only attempt; no disconnect time is inferred.',
              'Authenticated session produced no application update before the observation deadline. Export diagnostics; do not repeat the ride capture.': 'Authenticated session produced no application update before the observation deadline. Export diagnostics; relaunch Capture before any new stationary read-only attempt.',
              "Tuya's current local-BLE session ended before acceptance. Export diagnostics; do not repeat the outdoor ride capture.": "Tuya's current local-BLE session ended before acceptance. Export diagnostics; relaunch Capture before any new stationary read-only attempt.",
              'Accepted diagnostics cannot be exported because the immutable accepted artifact is unavailable. Restart from OFF1 rather than rebuilding accepted evidence from mutable post-seal state.': 'Accepted diagnostics cannot be exported because the immutable accepted artifact is unavailable. Relaunch Capture before a new stationary read-only attempt; do not rebuild accepted evidence from mutable post-seal state.',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one stale recovery string, found {count}: {old}')
              source = source.replace(old, new, 1)
          app.write_text(source, encoding='utf-8')
          PY
          printf '%s' '' | base64 -d > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift
          git diff --check

      - name: Verify recovery semantics and parse sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('private final class SecureLinkController')
          end = s.index('private protocol OfficialTuyaDriver', start)
          controller = s[start:end]
          assert 'ride capture' not in controller
          assert 'outdoor ride' not in controller
          recovery = 'Export diagnostics; relaunch Capture before any new stationary read-only attempt.'
          assert controller.count(recovery) == 2
          post = controller[controller.index('private func beginOfficialConnection(candidate: Candidate)'):]
          assert 'restart from off1' not in post.lower()
          print('stationary recovery source contract: PASS')
          PY
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift

      - name: Collapse helper and publish clean recovery branch
        shell: bash
        run: |
          set -euo pipefail
          parent='52333deb09ea9a5964250097f83884d285f25d78'
          rm .github/workflows/materialize-capture-stationary-failure-copy-52333.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift
          git add -u .github/workflows/materialize-capture-stationary-failure-copy-52333.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): keep recovery stationary after handoff'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:sol/v14-capture-stationary-failure-copy-52333
