name: ES80 queue resolution exact-product QA v1

on:
  push:
    branches:
      - cell/es80-queue-resolution/ci/chat-g5t8m-1

permissions:
  contents: read

jobs:
  queue-resolution-qa:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Checkout validation mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify exact product parent and workflow-only delta
        env:
          EXPECTED_PRODUCT_SHA: f98407bb0f67b798f62e523429edd63f9933617f
          EXPECTED_WORKFLOW_PATH: .github/workflows/qa-es80-queue-resolution-chat-g5t8m-1.yml
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          printf 'Expected product parent: %s\nActual product parent:   %s\n' "$EXPECTED_PRODUCT_SHA" "$actual_parent"
          test "$actual_parent" = "$EXPECTED_PRODUCT_SHA"
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf 'Validation-only delta:\n%s\n' "$changed"
          test "$changed" = "$EXPECTED_WORKFLOW_PATH"

      - name: Report Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Reject application characteristic writes
        run: |
          set -euo pipefail
          if grep -R --include='*.swift' -nE '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Application characteristic-value write path detected in Capture Sources.' >&2
            exit 1
          fi
          echo 'No application .writeValue(...) call found in Capture Sources.'

      - name: Verify queue-resolution source contract
        run: |
          set -euo pipefail
          source='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothAbortedQueueResolution.swift'
          tests='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothAbortedQueueResolutionTests.swift'
          grep -Fq 'guard case let .abortQuarantined(currentAbort) = abortedGate.phase' "$source"
          grep -Fq 'currentAbort == retirementReceipt.abortReceipt' "$source"
          grep -Fq 'currentResolvedThroughQueueSequence == settled' "$source"
          grep -Fq 'currentLastEnqueuedEventSequence == tail' "$source"
          grep -Fq 'retirementReceipt.retainedPendingEvidenceCount == 0' "$source"
          grep -Fq 'invalidRetirementCoverage' "$source"
          grep -Fq 'foreignGateReceiptFailsExactIdentity' "$tests"
          grep -Fq 'abandonedReadyTransactionIdentity != abortB.abandonedReadyTransactionIdentity' "$tests"
          if grep -Fq 'completeAbortedObservationRecovery' "$tests"; then
            echo 'Stale raw-retirement reopening fixture detected.' >&2
            exit 1
          fi

      - name: Run NembraCore tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors

      - name: Run full capture package tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Build capture package for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
