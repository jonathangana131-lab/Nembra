name: Capture Private Identity Same Inode Payload Current Red Team

on:
  push:
    branches:
      - adversarial/v14-private-identity-same-inode-payload-current-sol
  pull_request:
    paths:
      - Scripts/provision_capture_tuya_identity_writer.py
      - scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py
      - .github/workflows/capture-private-identity-same-inode-payload-current-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-inode-payload:
    name: Reject same-inode same-size payload mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind diagnostic to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exact writer and adversarial diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py

      - name: Require payload authority across publication seam
        shell: bash
        run: python3 -I scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py
