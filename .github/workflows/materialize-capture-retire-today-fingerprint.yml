name: Materialize Capture Legacy TODAY Field Retirement

on:
  push:
    branches:
      - sol/v14-capture-retire-today-fingerprint-3f269

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current-product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='3f26906d68c6d886fa5c19a3349f7c538e5392a6'
          test "$(git rev-parse HEAD^)" = "$parent"
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = '.github/workflows/materialize-capture-retire-today-fingerprint.yml'
          grep -Fq 'ACTIVE TODAY OVERRIDE' CAPTURE_TODAY_FIELD_READY_DIRECTIVE.md
          grep -Fq 'exec "$CANONICAL_PRODUCER" --nembra-today-research-build "$@"' scripts/ci/xcode27_today_research_field_candidate.sh
          grep -Fq 'TODAY_RESEARCH_BUILD_MODE=1' scripts/ci/xcode27_signed_field_candidate.sh
          grep -Fq 'PROCEDURE_ID="ES80-AUTHENTICATED-STATIONARY-v1"' scripts/field/install_one_time_capture.command
          grep -Fq 'static let requiredFieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"' NembraApp/App/NembraCaptureBuildIdentity.swift

      - name: Retire legacy TODAY authority
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > CAPTURE_TODAY_FIELD_READY_DIRECTIVE.md
          printf '%s' '' | base64 -d > scripts/ci/xcode27_today_research_field_candidate.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/xcode27_signed_field_candidate.sh')
          source = path.read_text(encoding='utf-8')
          old = '''TODAY_RESEARCH_BUILD_MODE=0
if [[ "${1:-}" == "--nembra-today-research-build" ]]; then
  TODAY_RESEARCH_BUILD_MODE=1
  shift
fi
unset XCODE_XCCONFIG_FILE OTHER_SWIFT_FLAGS SWIFT_ACTIVE_COMPILATION_CONDITIONS
if [[ "$TODAY_RESEARCH_BUILD_MODE" == "1" ]]; then
  RESEARCH_COMPILE_MODE="private-today-v1"
  RESEARCH_COMPILE_AUTHORITY="canonical-producer-explicit-mode"
  RESEARCH_COMPILE_CONDITION="NEMBRA_ES80_TODAY_RESEARCH"
else
  RESEARCH_COMPILE_MODE="standard"
  RESEARCH_COMPILE_AUTHORITY="none"
  RESEARCH_COMPILE_CONDITION="none"
fi'''
          new = '''if [[ "${1:-}" == "--nembra-today-research-build" ]]; then
  echo "SUPERSEDED: --nembra-today-research-build cannot authorize the current Capture procedure." >&2
  echo "Use scripts/field/install_one_time_capture.command for ES80-AUTHENTICATED-STATIONARY-v1 after exact current-product acceptance." >&2
  exit 64
fi
TODAY_RESEARCH_BUILD_MODE=0
unset XCODE_XCCONFIG_FILE OTHER_SWIFT_FLAGS SWIFT_ACTIVE_COMPILATION_CONDITIONS
RESEARCH_COMPILE_MODE="standard"
RESEARCH_COMPILE_AUTHORITY="none"
RESEARCH_COMPILE_CONDITION="none"'''
          if source.count(old) != 1:
              raise SystemExit('legacy Research mode block did not match exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          printf '%s' '' | base64 -d > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayFieldAuthorityRetirementSourceTests.swift
          git diff --check

      - name: Validate fail-closed retirement
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/xcode27_today_research_field_candidate.sh
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          set +e
          legacy_output="$(scripts/ci/xcode27_today_research_field_candidate.sh 2>&1)"
          legacy_status=$?
          producer_output="$(scripts/ci/xcode27_signed_field_candidate.sh --nembra-today-research-build 2>&1)"
          producer_status=$?
          set -e
          test "$legacy_status" = 64
          test "$producer_status" = 64
          grep -Fq 'SUPERSEDED:' <<< "$legacy_output"
          grep -Fq 'ES80-AUTHENTICATED-STATIONARY-v1' <<< "$legacy_output"
          grep -Fq 'SUPERSEDED: --nembra-today-research-build' <<< "$producer_output"
          python3 - <<'PY'
          from pathlib import Path
          directive = Path('CAPTURE_TODAY_FIELD_READY_DIRECTIVE.md').read_text()
          wrapper = Path('scripts/ci/xcode27_today_research_field_candidate.sh').read_text()
          producer = Path('scripts/ci/xcode27_signed_field_candidate.sh').read_text()
          installer = Path('scripts/field/install_one_time_capture.command').read_text()
          identity = Path('NembraApp/App/NembraCaptureBuildIdentity.swift').read_text()
          provenance = Path('.github/workflows/capture-field-build-provenance.yml').read_text()
          procedure = 'ES80-AUTHENTICATED-STATIONARY-v1'
          assert 'ACTIVE TODAY OVERRIDE' not in directive
          assert 'SUPERSEDED / NO FIELD AUTHORITY / PHYSICAL NO-GO' in directive
          assert procedure in directive
          assert 'CANONICAL_PRODUCER=' not in wrapper
          assert 'exec "$CANONICAL_PRODUCER"' not in wrapper
          assert 'exit 64' in wrapper
          assert 'TODAY_RESEARCH_BUILD_MODE=1' not in producer
          assert 'canonical-producer-explicit-mode' not in producer
          assert 'SUPERSEDED: --nembra-today-research-build' in producer
          assert f'PROCEDURE_ID="{procedure}"' in installer
          assert f'requiredFieldProcedureIdentifier = "{procedure}"' in identity
          assert f"procedure='{procedure}'" in provenance
          print('legacy TODAY authority retirement contract: PASS')
          PY
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayFieldAuthorityRetirementSourceTests.swift

      - name: Collapse helper and publish clean donor
        shell: bash
        run: |
          set -euo pipefail
          parent='3f26906d68c6d886fa5c19a3349f7c538e5392a6'
          rm .github/workflows/materialize-capture-retire-today-fingerprint.yml
          git add CAPTURE_TODAY_FIELD_READY_DIRECTIVE.md \
            scripts/ci/xcode27_today_research_field_candidate.sh \
            scripts/ci/xcode27_signed_field_candidate.sh \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayFieldAuthorityRetirementSourceTests.swift
          git add -u .github/workflows/materialize-capture-retire-today-fingerprint.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): retire legacy TODAY fingerprint authority'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 4
          test "${changed[0]}" = 'CAPTURE_TODAY_FIELD_READY_DIRECTIVE.md'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayFieldAuthorityRetirementSourceTests.swift'
          test "${changed[2]}" = 'scripts/ci/xcode27_signed_field_candidate.sh'
          test "${changed[3]}" = 'scripts/ci/xcode27_today_research_field_candidate.sh'
          git diff --check "$parent" HEAD
          git push origin HEAD:sol/v14-capture-retire-today-fingerprint-3f269
