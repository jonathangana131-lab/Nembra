name: Materialize current Capture export secret integration

on:
  push:
    branches:
      - agent/v14-capture-export-secret-integration-current-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Verify exact current-product ancestry and prerequisite-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected='ca43d7943027f04a1dfe4ab5f777c24a167ea96b'
          git merge-base --is-ancestor "$expected" HEAD
          actual="$(git diff --name-only "$expected" HEAD | sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/materialize-capture-export-secret-integration-current-sol.yml' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift' | sort)"
          test "$actual" = "$wanted"

      - name: Wire shared sanitizer into shipping SmartLife driver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()
          class_marker = '@MainActor\nprivate final class SmartLifeDriver'
          method_marker = '    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {'
          class_start = source.index(class_marker)
          method_start = source.index(method_marker, class_start)
          class_end = source.index('\n}\n#endif\n\nprivate enum AppleAccountAuthorizationError', method_start)
          old_tail = source[method_start:class_end]

          required_current = [
              'private static let secretKeyFragments = [',
              '"sessionkey",',
              'private static func redactApplicationSecrets(_ object: Any) -> Any',
              'onApplicationUpdate?(sanitized)',
          ]
          for needle in required_current:
              if needle not in old_tail:
                  raise SystemExit(f'current-parent sanitizer shape changed; missing {needle}')

          replacement = '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              guard let dps, !dps.isEmpty else { return }
              onApplicationUpdate?(
                  TuyaApplicationUpdateSecretSanitizer.sanitizeForStringProjection(dps)
              )
          }
          '''
          updated = source[:method_start] + replacement + source[class_end:]

          driver = updated[class_start:updated.index('#endif', class_start)]
          required_integrated = [
              'TuyaApplicationUpdateSecretSanitizer.sanitizeForStringProjection(dps)',
              'onApplicationUpdate?(',
          ]
          for needle in required_integrated:
              if needle not in driver:
                  raise SystemExit(f'integrated driver missing {needle}')
          forbidden = [
              'private static let secretKeyFragments',
              'private static func redactApplicationSecrets',
              'String(describing: value)',
          ]
          for needle in forbidden:
              if needle in driver:
                  raise SystemExit(f'duplicate/unsafe inline sanitizer survived: {needle}')

          path.write_text(updated)
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSharedSecretSanitizerSourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application update shared secret sanitizer app contract")
          struct TuyaApplicationUpdateSharedSecretSanitizerSourceTests {
              @Test("shipping SmartLife driver delegates application projection to package custody")
              func smartLifeDriverUsesSharedSanitizer() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))

                  #expect(driver.contains("TuyaApplicationUpdateSecretSanitizer.sanitizeForStringProjection(dps)"))
                  #expect(driver.contains("onApplicationUpdate?("))
                  #expect(!driver.contains("private static let secretKeyFragments"))
                  #expect(!driver.contains("private static func redactApplicationSecrets"))
                  #expect(!driver.contains("String(describing: value)"))
              }

              @Test("accepted export still asserts secret redaction while application events use shared custody")
              func exportPromiseRemainsCoupled() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  #expect(source.contains("secretsRedacted: true"))
                  #expect(source.contains("log(\"tuya_application_update\""))
                  #expect(source.contains("TuyaApplicationUpdateSecretSanitizer.sanitizeForStringProjection(dps)"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          SWIFT

          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSharedSecretSanitizerSourceTests.swift
          git diff --check

      - name: Verify full promise coverage before durable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          helper='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift'
          for fragment in localkey sessionkey appkey appsecret password accounttoken accesstoken refreshtoken authkey seckey; do
            grep -q "\"${fragment}\"" "$helper"
          done
          grep -q 'TuyaApplicationUpdateSecretSanitizer.sanitizeForStringProjection(dps)' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -A80 'private final class SmartLifeDriver' NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'private static let secretKeyFragments'
          grep -q 'secretsRedacted: true' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Retire helper and commit exact integrated product delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-export-secret-integration-current-sol.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only 'ca43d7943027f04a1dfe4ab5f777c24a167ea96b' | sort)"
          wanted="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSharedSecretSanitizerSourceTests.swift' | sort)"
          test "$actual" = "$wanted"
          git commit -m 'fix(capture): align application redaction with export promise'
          git push origin HEAD:agent/v14-capture-export-secret-integration-current-sol
