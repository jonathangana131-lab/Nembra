name: Materialize Capture View-Exit Target Revocation 1558

on:
  push:
    branches:
      - fix/v14-capture-view-exit-target-revocation-1558-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-view-exit-target-revocation-1558-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact product parent and materialize repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1558e1bf38c2aad809887a77a3bc4cabe1704e39"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-capture-view-exit-target-revocation-1558-sol.yml"
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = source_path.read_text(encoding='utf-8')
          start = source.index('    func abandonCorrelationForViewExit() {')
          end = source.index('    func appDidLoseForeground() {', start)
          section = source[start:end]
          anchor = '        guard processCorrelationLease != nil || correlationSession != nil else { return }'
          if section.count(anchor) != 1:
              raise SystemExit(f'expected one view-exit live-correlation guard, found {section.count(anchor)}')
          repair = (
              '        if phase == .correlated || phase == .selected {\n'
              '            // Final-window sealing can retire the scanner/lease before the view leaves. The\n'
              '            // already-earned target remains mutable current-attempt authority and must not cross\n'
              '            // a Secure Link view lifetime without a fresh OFF1→ON1→OFF2→ON2 correlation.\n'
              '            resetDiscoverySessionOnly()\n'
              '            phase = .failed\n'
              '            message = "Capture left Secure Link after Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; the prior target cannot cross a view lifetime."\n'
              '            log("target_correlation_abandoned_on_view_exit")\n'
              '            return\n'
              '        }\n\n'
          )
          section = section.replace(anchor, repair + anchor, 1)
          source_path.write_text(source[:start] + section + source[end:], encoding='utf-8')

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift')
          test = test_path.read_text(encoding='utf-8')
          insertion_anchor = '    @Test("foreground reactivation cannot reopen membership after official driver handoff")\n'
          if test.count(insertion_anchor) != 1:
              raise SystemExit('current target-revocation regression insertion anchor missing')
          regression = (
              '    @Test("view exit cannot retain an already-correlated or selected target")\n'
              '    func viewExitCannotCarryTargetAcrossLifetime() throws {\n'
              '        let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")\n'
              '        let controller = String(try section(\n'
              '            in: source,\n'
              '            from: "private final class SecureLinkController",\n'
              '            to: "@MainActor\\nprivate protocol OfficialTuyaDriver"\n'
              '        ))\n'
              '        let cleanup = String(try section(\n'
              '            in: controller,\n'
              '            from: "func abandonCorrelationForViewExit()",\n'
              '            to: "func appDidLoseForeground()"\n'
              '        ))\n\n'
              '        #expect(cleanup.contains("if phase == .correlated || phase == .selected"))\n'
              '        #expect(cleanup.contains("resetDiscoverySessionOnly()"))\n'
              '        #expect(cleanup.contains("target_correlation_abandoned_on_view_exit"))\n'
              '        #expect(cleanup.range(of: "resetDiscoverySessionOnly()")!.lowerBound < cleanup.range(of: "guard processCorrelationLease != nil || correlationSession != nil")!.lowerBound)\n'
              '        #expect(!cleanup.contains("releasePackageCorrelationLease()"))\n'
              '    }\n\n'
          )
          test_path.write_text(test.replace(insertion_anchor, regression + insertion_anchor, 1), encoding='utf-8')
          PY

      - name: Verify source contract, formatting, and syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = source.index('    func abandonCorrelationForViewExit() {')
          end = source.index('    func appDidLoseForeground() {', start)
          cleanup = source[start:end]
          reset = cleanup.index('        if phase == .correlated || phase == .selected {')
          live_guard = cleanup.index('        guard processCorrelationLease != nil || correlationSession != nil')
          if reset >= live_guard:
              raise SystemExit('already-correlated target retirement is still hidden behind live scanner/lease guard')
          for exact_line in [
              '            resetDiscoverySessionOnly()',
              '            phase = .failed',
              '            log("target_correlation_abandoned_on_view_exit")',
          ]:
              if exact_line not in cleanup:
                  raise SystemExit(f'format/source contract missing: {exact_line}')
          if 'releasePackageCorrelationLease()' in cleanup:
              raise SystemExit('view exit bypasses scanner-first package correlation retirement')
          print('Capture current view-exit target revocation: PASS')
          PY
          git diff --check
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift

      - name: Collapse helper into product donor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-view-exit-target-revocation-1558-sol.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): revoke correlated target on Secure Link exit'
          git push origin HEAD:fix/v14-capture-view-exit-target-revocation-1558-sol
