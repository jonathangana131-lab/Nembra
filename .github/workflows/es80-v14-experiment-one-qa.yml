name: ES80 V14 Experiment One QA

on:
  push:
    branches:
      - 'cell/es80-v14-experiment-one/ci/**'

permissions:
  contents: read

concurrency:
  group: nembra-es80-v14-experiment-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate exact Experiment One product
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify immutable checkout and exact product parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "ea0961e35874d0da5fb2cdeb5b811b445b6bb137"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/es80-v14-experiment-one-qa.yml"

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Guard passive package against application writes
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 research package must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

      - name: Verify V14 physical runbook remains NO-GO
        run: |
          set -euo pipefail
          grep -F 'NO-GO — PHYSICAL EXPERIMENT ONE MUST NOT RUN' docs/ES80_PHYSICAL_CAPTURE_RUNBOOK.md
          grep -F 'at least 60 seconds after accepted Ready' docs/ES80_PHYSICAL_CAPTURE_RUNBOOK.md
          grep -F 'OFF1 -> ON1 -> OFF2 -> ON2' docs/ES80_PHYSICAL_CAPTURE_RUNBOOK.md

      - name: Test NembraCore with warnings as errors
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors

      - name: Test NembraBluetoothCapture with warnings as errors
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Build NembraBluetoothCapture for iOS Simulator with warnings as errors
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
