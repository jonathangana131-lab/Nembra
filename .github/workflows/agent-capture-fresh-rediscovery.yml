name: Agent Capture Fresh Rediscovery

on:
  push:
    branches:
      - agent/capture-experiment-one-fresh-rediscovery-v14

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/capture-experiment-one-fresh-rediscovery-v14
          fetch-depth: 0
      - name: Apply guarded Experiment One freshness repair
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          run = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift')
          s = run.read_text()
          old = '''        let peripheralIdentifier: UUID\n        let recorder: PassiveCoreBluetoothCaptureRecorder\n\n        fileprivate init(\n            admissionIdentity: UUID,\n            powerCycleEvidence: PassiveBluetoothExperimentOnePowerCycleEvidence,\n            peripheralIdentifier: UUID,\n            recorder: PassiveCoreBluetoothCaptureRecorder\n        ) {\n            self.admissionIdentity = admissionIdentity\n            self.powerCycleEvidence = powerCycleEvidence\n            self.peripheralIdentifier = peripheralIdentifier\n            self.recorder = recorder\n        }'''
          new = '''        let peripheralIdentifier: UUID\n        let recorder: PassiveCoreBluetoothCaptureRecorder\n        /// Local monotonic handoff boundary. This is callback chronology only, never RF emission time.\n        let issuedAtUptimeNanoseconds: UInt64\n\n        fileprivate init(\n            admissionIdentity: UUID,\n            powerCycleEvidence: PassiveBluetoothExperimentOnePowerCycleEvidence,\n            peripheralIdentifier: UUID,\n            recorder: PassiveCoreBluetoothCaptureRecorder,\n            issuedAtUptimeNanoseconds: UInt64\n        ) {\n            self.admissionIdentity = admissionIdentity\n            self.powerCycleEvidence = powerCycleEvidence\n            self.peripheralIdentifier = peripheralIdentifier\n            self.recorder = recorder\n            self.issuedAtUptimeNanoseconds = issuedAtUptimeNanoseconds\n        }'''
          assert old in s, 'payload shape moved'
          s = s.replace(old, new, 1)
          old = '''            powerCycleEvidence: powerCycleEvidence,\n            peripheralIdentifier: peripheralIdentifier,\n            recorder: recorder\n        )'''
          new = '''            powerCycleEvidence: powerCycleEvidence,\n            peripheralIdentifier: peripheralIdentifier,\n            recorder: recorder,\n            issuedAtUptimeNanoseconds: DispatchTime.now().uptimeNanoseconds\n        )'''
          assert old in s, 'payload construction moved'
          s = s.replace(old, new, 1)
          run.write_text(s)

          controller = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift')
          s = controller.read_text()
          old = '''        let latestAdvertisement = latestAdvertisementByIdentifier[payload.peripheralIdentifier]\n        guard observationBoundaryQueueGate.resetForNewCaptureSession() else {'''
          new = '''        guard let latestAdvertisement = latestAdvertisementByIdentifier[payload.peripheralIdentifier],\n              latestAdvertisement.receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds else {\n            // The sealed admission must be joined to a controller observation received after\n            // that handoff. Replaying an older cached advertisement would splice two software\n            // chronology lives and could enqueue evidence that predates this recorder.\n            throw ControllerError.unknownPeripheral(payload.peripheralIdentifier)\n        }\n        guard observationBoundaryQueueGate.resetForNewCaptureSession() else {'''
          assert old in s, 'controller freshness insertion point moved'
          s = s.replace(old, new, 1)
          old = '''        if let latestAdvertisement {\n            enqueue(\n                .advertisement(latestAdvertisement.observation),\n                receivedAtUptimeNanoseconds: latestAdvertisement.receivedAtUptimeNanoseconds,\n                receivedAtDate: latestAdvertisement.receivedAtDate\n            )\n        }'''
          new = '''        enqueue(\n            .advertisement(latestAdvertisement.observation),\n            receivedAtUptimeNanoseconds: latestAdvertisement.receivedAtUptimeNanoseconds,\n            receivedAtDate: latestAdvertisement.receivedAtDate\n        )'''
          assert old in s, 'advertisement replay block moved'
          s = s.replace(old, new, 1)
          controller.write_text(s)
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          /// Software monotonic ordering only; no BLE/RF emission time or physical ES80 claim.
          struct ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests {
              private static func source(named filename: String) throws -> String {
                  let testFile = URL(fileURLWithPath: #filePath)
                  let packageRoot = testFile.deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent()
                  return try String(contentsOf: packageRoot.appendingPathComponent("Sources").appendingPathComponent("NembraBluetoothCapture").appendingPathComponent(filename), encoding: .utf8)
              }

              private static func consumerBody(_ source: String) throws -> Substring {
                  let start = try #require(source.range(of: "func connectUsingExperimentOneAdmission("))
                  let end = try #require(source.range(of: "public func cancelActiveConnection()", range: start.upperBound..<source.endIndex))
                  return source[start.lowerBound..<end.lowerBound]
              }

              @Test("sealed admission carries a producer-issued monotonic handoff boundary")
              func admissionCarriesIssuedUptime() throws {
                  let source = try Self.source(named: "PassiveBluetoothExperimentOneRun.swift")
                  #expect(source.contains("issuedAtUptimeNanoseconds"))
                  #expect(source.contains("DispatchTime.now().uptimeNanoseconds"))
              }

              @Test("controller requires rediscovery after admission before recorder installation")
              func currentCatalogMustBePostAdmissionEvidence() throws {
                  let body = try Self.consumerBody(try Self.source(named: "ForegroundCoreBluetoothCaptureController.swift"))
                  let latestAdvertisement = try #require(body.range(of: "latestAdvertisementByIdentifier[payload.peripheralIdentifier]"))
                  let freshness = try #require(body.range(of: "receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds"))
                  let selectTarget = try #require(body.range(of: "targetState.selectTarget(payload.peripheralIdentifier)"))
                  let installRecorder = try #require(body.range(of: "recorder = payload.recorder"))
                  #expect(latestAdvertisement.lowerBound < freshness.lowerBound)
                  #expect(freshness.lowerBound < selectTarget.lowerBound)
                  #expect(freshness.lowerBound < installRecorder.lowerBound)
              }
          }
          SWIFT

          git diff --check
          git rm .github/workflows/agent-capture-fresh-rediscovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift
          git commit -m "[Capture Experiment One] Require post-admission rediscovery"
          git push origin HEAD:agent/capture-experiment-one-fresh-rediscovery-v14
