name: TEMP ES80 positive viewport recovery transform

on:
  push:
    branches:
      - test/es80-v14-positive-viewport-scroll-aware-recovery/gpt56-thinking-go

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Preserve current coverage and transplant only scroll-aware positive states
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            test/es80-v14-positive-viewport-scroll-aware/gpt56-thinking-go:refs/remotes/origin/scroll-source

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          path = Path("NembraUITests/ES80ResearchCaptureUITests.swift")
          current = path.read_text(encoding="utf-8")
          source = subprocess.check_output(
              [
                  "git", "show",
                  "refs/remotes/origin/scroll-source:NembraUITests/ES80ResearchCaptureUITests.swift",
              ],
              text=True,
          )

          xxxl = "    @MainActor\n    func testV14SimulatorQACaptureCompleteRemainsActionableAtAccessibilityExtraExtraExtraLarge() {"
          landscape = "    @MainActor\n    func testV14SimulatorQAHorizonReadyLandscapeKeepsFinishAndTruthVisible() {"
          representative = "    @MainActor\n    func testV14SimulatorQACapturesRepresentativeInProgressAndRecoveryStates() {"
          current_next = representative
          source_next = "    func testSimulatorQAAppSeamIsCompileBoundedAndProductionRouteRemainsLocked() throws {"
          helper = "    @MainActor\n    private func bringIntoScreenshotViewport("
          assert_helper = "    private func assertVisibleInScreenshotViewport("

          source_xxxl_start = source.index(xxxl)
          source_landscape_start = source.index(landscape, source_xxxl_start)
          source_next_start = source.index(source_next, source_landscape_start)
          desired_xxxl = source[source_xxxl_start:source_landscape_start]
          desired_landscape = source[source_landscape_start:source_next_start]

          source_helper_start = source.index(helper)
          source_assert_start = source.index(assert_helper, source_helper_start)
          desired_helper = source[source_helper_start:source_assert_start]

          current_xxxl_start = current.index(xxxl)
          current_landscape_start = current.index(landscape, current_xxxl_start)
          current_rep_start = current.index(current_next, current_landscape_start)
          current = current[:current_xxxl_start] + desired_xxxl + current[current_landscape_start:]

          current_landscape_start = current.index(landscape, current_xxxl_start)
          current_rep_start = current.index(current_next, current_landscape_start)
          current = current[:current_landscape_start] + desired_landscape + current[current_rep_start:]

          if helper not in current:
              assert_start = current.index(assert_helper)
              current = current[:assert_start] + desired_helper + current[assert_start:]

          path.write_text(current, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          text = Path("NembraUITests/ES80ResearchCaptureUITests.swift").read_text(encoding="utf-8")
          required = [
              "testV14SimulatorQACaptureCompleteRemainsActionableAtAccessibilityExtraExtraExtraLarge",
              "testV14SimulatorQAHorizonReadyLandscapeKeepsFinishAndTruthVisible",
              "testV14SimulatorQACapturesRepresentativeInProgressAndRecoveryStates",
              "bringIntoScreenshotViewport",
              "Accessibility XXXL — Disclosure",
              "Accessibility XXXL — Analysis Ready",
              "Accessibility XXXL — Share",
              "Accessibility XXXL — View Details",
              "Horizon Ready — Landscape — Disclosure",
              "Horizon Ready — Landscape — Status",
              "Horizon Ready — Landscape — Seal",
              "OFF 2 Ready",
              "Scooter Signal Found",
              "Passive Connection",
              "Observation In Progress",
              "Foreground Interrupted",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"refreshed positive visual acceptance missing: {missing}")
          for method in (
              "testV14SimulatorQACaptureCompleteRemainsActionableAtAccessibilityExtraExtraExtraLarge",
              "testV14SimulatorQAHorizonReadyLandscapeKeepsFinishAndTruthVisible",
              "testV14SimulatorQACapturesRepresentativeInProgressAndRecoveryStates",
          ):
              if text.count(f"func {method}()") != 1:
                  raise SystemExit(f"method count invalid for {method}")
          if "physicalProcedurePermitted: true" in text or "mayUseBluetoothTransport: true" in text:
              raise SystemExit("UI acceptance must not manufacture physical or Bluetooth transport authority")
          PY

          git diff --check
          rm .github/workflows/tmp-es80-positive-viewport-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[Capture visual QA v14] Preserve coverage while making positive states scroll-aware"
          git push origin HEAD:${{ github.ref_name }}
