name: Materialize Capture Failed Prerequisite Recovery

on:
  push:
    branches:
      - product/v14-capture-failed-prerequisite-recovery-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v14-capture-failed-prerequisite-recovery-sol
          fetch-depth: 0

      - name: Guard unchanged product bytes
        run: |
          set -euo pipefail
          product_parent='522716b8112fda6456beba24a62a6a563e66629a'
          git merge-base --is-ancestor "$product_parent" HEAD
          git diff --quiet "$product_parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFailedPrerequisiteRecoverySourceTests.swift

      - name: Apply recovery repair
        run: python3 scripts/ci/materialize_capture_failed_prerequisite_recovery.py apply

      - name: Verify recovery repair
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_failed_prerequisite_recovery.py verify
          git diff --check

      - name: Publish clean product bytes
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-failed-prerequisite-recovery.yml
          rm scripts/ci/materialize_capture_failed_prerequisite_recovery.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): surface failed prerequisite recovery"
          git push origin HEAD:product/v14-capture-failed-prerequisite-recovery-sol
