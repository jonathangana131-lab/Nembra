name: V14 Capture Accepted Event Prefix Patch

on:
  push:
    branches:
      - integration/v14-capture-accepted-event-prefix-sol

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-accepted-event-prefix-sol
          fetch-depth: 0

      - name: Apply guarded Capture repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          replacements = [
              (
                  "    private var driver: OfficialTuyaDriver?\n    private var events: [Event] = []\n    private var watchdog: Task<Void, Never>?",
                  "    private var driver: OfficialTuyaDriver?\n    private var events: [Event] = []\n    private var sealedAcceptedEventPrefix: [Event]?\n    private var watchdog: Task<Void, Never>?",
              ),
              (
                  "                        try await sessionLedger.sealAcceptedObservation(for: token)\n                        self.currentConnectionToken = nil",
                  "                        try await sessionLedger.sealAcceptedObservation(for: token)\n                        self.sealedAcceptedEventPrefix = self.events\n                        self.currentConnectionToken = nil",
              ),
              (
                  "            candidates: candidates,\n            events: events\n        )",
                  "            candidates: candidates,\n            events: sealedAcceptedEventPrefix ?? events\n        )",
              ),
              (
                  "    private func resetDiscoverySessionOnly() {\n        correlationSession?.abandonCurrentWindow()",
                  "    private func resetDiscoverySessionOnly() {\n        sealedAcceptedEventPrefix = nil\n        correlationSession?.abandonCurrentWindow()",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guard failed: expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit exact production delta
        run: |
          git diff --check
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m "fix(capture): freeze accepted application export prefix"
          git push origin HEAD:integration/v14-capture-accepted-event-prefix-sol
