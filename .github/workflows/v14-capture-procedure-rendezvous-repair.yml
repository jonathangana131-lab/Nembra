name: V14 Capture Procedure Rendezvous Repair

on:
  push:
    branches:
      - repair/v14-capture-procedure-rendezvous-sol2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply procedure rendezvous patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/apply_capture_procedure_rendezvous.py
          python3 scripts/ci/apply_capture_procedure_rendezvous.py

      - name: Verify focused source contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift
          grep -Fq 'driver.isLocallyConnected(uuid: self.tuyaUUID)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'schemaVersion: 10' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'PROCEDURE_ID: `ES80-AUTHENTICATED-STATIONARY-v1`' docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md
          grep -Fq 'INFOPLIST_KEY_NembraCaptureProcedureIdentifier = "$(NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER)";' NembraCapture.xcodeproj/project.pbxproj
          git diff --check

      - name: Commit product tree and retire helper
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/apply_capture_procedure_rendezvous.py
          rm .github/workflows/v14-capture-procedure-rendezvous-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): bind exact stationary procedure provenance'
          git push origin HEAD:repair/v14-capture-procedure-rendezvous-sol2
