name: V14 Capture Procedure Rendezvous Materialize

on:
  push:
    branches:
      - recovery/v14-capture-procedure-materialize-gpt56sol

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply procedure rendezvous patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/apply_capture_procedure_rendezvous.py
          python3 scripts/ci/apply_capture_procedure_rendezvous.py

      - name: Verify focused source contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift
          grep -Fq 'driver.isLocallyConnected(uuid: self.tuyaUUID)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'schemaVersion: 10' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'PROCEDURE_ID: `ES80-AUTHENTICATED-STATIONARY-v1`' docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md
          grep -Fq 'INFOPLIST_KEY_NembraCaptureProcedureIdentifier = "$(NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER)";' NembraCapture.xcodeproj/project.pbxproj
          git diff --check

      - name: Stage validated product artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nembra-procedure-rendezvous
          mkdir -p /tmp/nembra-procedure-rendezvous
          while IFS= read -r path; do
            mkdir -p "/tmp/nembra-procedure-rendezvous/$(dirname "$path")"
            cp -p "$path" "/tmp/nembra-procedure-rendezvous/$path"
          done <<'EOF'
          NembraApp/App/NembraCaptureBuildIdentity.swift
          NembraApp/App/NembraCaptureEntrypoint.swift
          NembraCapture.xcodeproj/project.pbxproj
          docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md
          scripts/field/install_one_time_capture.command
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldDependencyProvenanceSourceTests.swift
          .github/workflows/capture-field-build-provenance.yml
          EOF
          test "$(find /tmp/nembra-procedure-rendezvous -type f | wc -l | tr -d ' ')" = 8

      - uses: actions/upload-artifact@v4
        with:
          name: capture-procedure-rendezvous-validated
          path: /tmp/nembra-procedure-rendezvous
          if-no-files-found: error
          retention-days: 1
