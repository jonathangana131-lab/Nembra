name: Materialize Capture Current Session-Key Secret Custody

on:
  push:
    branches:
      - fix/v14-capture-sessionkey-secret-custody-current-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-sessionkey-secret-custody-current-sol
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          product_parent='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          git merge-base --is-ancestor "$product_parent" HEAD
          git diff --quiet "$product_parent" HEAD -- \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            NembraApp/Features/Research/TuyaAccountBridge.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift

      - name: Apply session-key custody repair
        run: python3 scripts/ci/materialize_capture_sessionkey_secret_custody_current.py apply

      - name: Verify bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_sessionkey_secret_custody_current.py verify
          python3 -m py_compile scripts/ci/materialize_capture_sessionkey_secret_custody_current.py
          git diff --check

      - name: Publish clean four-path closure
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-sessionkey-secret-custody-current-materialize.yml
          rm scripts/ci/materialize_capture_sessionkey_secret_custody_current.py
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-sessionkey-secret-custody-current-materialize.yml' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'NembraApp/Features/Research/TuyaAccountBridge.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift' \
            'scripts/ci/materialize_capture_sessionkey_secret_custody_current.py' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): close session-key secret custody'
          git push origin HEAD:fix/v14-capture-sessionkey-secret-custody-current-sol
