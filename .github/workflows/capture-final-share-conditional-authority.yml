name: Capture Final Share Conditional Authority QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - NembraApp/Features/Research/ES80CaptureShellView.swift
      - .github/workflows/capture-final-share-retry-authority.yml
      - .github/workflows/capture-final-share-conditional-authority.yml

permissions:
  contents: read

jobs:
  exact-head-conditional-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          printf 'Expected exact PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Reject conditional compilation around final Share authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("NembraApp/Features/Research/ES80CaptureShellView.swift").read_text()
          signature = "private func prepareFinalShareForAnalysisAndSharing()"
          start = source.find(signature)
          if start < 0:
              raise SystemExit("missing prepareFinalShareForAnalysisAndSharing source")

          remainder = source[start:]
          next_member = remainder.find("\n    private ", len(signature))
          function_source = remainder if next_member < 0 else remainder[:next_member]

          # This authority-critical function must stay independent of Swift conditional compilation.
          # Failing closed on any directive in the isolated function avoids having to guess which
          # compile-time branch ships in the signed field build.
          directive = re.compile(
              r"(?m)^[ \t]*#[ \t]*(?:if|elseif|else|endif)\b"
          )

          if directive.search(function_source):
              raise SystemExit(
                  "final Share retry authority must not depend on Swift conditional compilation"
              )

          retained_anchor = "if finalShareData != nil,"
          retained_index = function_source.find(retained_anchor)
          if retained_index < 0:
              raise SystemExit("missing retained final Share retry branch")

          # Self-red-team the exact false-green reported in review: an otherwise direct retained
          # branch hidden behind an inactive #if must be rejected even though brace depth is unchanged.
          conditionally_excluded = (
              function_source[:retained_index]
              + "#if NEVER_ENABLED_IN_RELEASE\n"
              + function_source[retained_index:]
              + "\n#endif\n"
          )
          if directive.search(conditionally_excluded) is None:
              raise SystemExit(
                  "checker self-test failed to detect a conditionally excluded retained retry branch"
              )

          print("final Share conditional-compilation authority source contract: PASS")
          PY
