name: Cockpit locale and compact peak closure one-shot

on:
  push:
    branches:
      - product/cockpit-energy-rail-mainline-20260820
    paths:
      - .github/workflows/cockpit-locale-peak-label-closure-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: product/cockpit-energy-rail-mainline-20260820
      EXPECTED_PARENT: 81309b7f2cea0d8a30a359e99e5c3f07533f9de1
      EXPECTED_GRANDPARENT: 008d637b2d304623a2006ded19c4d87033772ce9
      SELF_WORKFLOW: .github/workflows/cockpit-locale-peak-label-closure-once.yml
      ROLLING_SOURCE: NembraApp/Features/Dashboard/RollingSpeedValueView.swift
      INSTRUMENT_SOURCE: NembraApp/Features/Dashboard/SpeedInstrumentModel.swift
      APP_TESTS: NembraAppTests/NembraAppTests.swift

    steps:
      - name: Checkout exact bounded authoring head
        uses: actions/checkout@v6
        with:
          ref: product/cockpit-energy-rail-mainline-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Bind one-shot authoring lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_GRANDPARENT"
          changed="$(git diff --name-only "$EXPECTED_PARENT"...HEAD)"
          test "$changed" = "$SELF_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize reviewed cockpit fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return source.replace(old, new, 1)

          rolling_path = Path("NembraApp/Features/Dashboard/RollingSpeedValueView.swift")
          rolling = rolling_path.read_text(encoding="utf-8")
          rolling = replace_once(
              rolling,
              "import NembraCore\nimport SwiftUI\n",
              "import Foundation\nimport NembraCore\nimport SwiftUI\n",
              "rolling imports",
          )
          rolling = replace_once(
              rolling,
              "    @Environment(\\.accessibilityReduceMotion) private var reduceMotion\n\n",
              "    @Environment(\\.accessibilityReduceMotion) private var reduceMotion\n"
              "    @Environment(\\.locale) private var locale\n\n",
              "rolling locale environment",
          )
          rolling = replace_once(
              rolling,
              "    private var validatedRenderValue: Double? {\n",
              "    static func decimalSeparator(for locale: Locale) -> String {\n"
              "        locale.decimalSeparator ?? \".\"\n"
              "    }\n\n"
              "    private var validatedRenderValue: Double? {\n",
              "rolling decimal helper",
          )
          rolling = replace_once(
              rolling,
              '                Text(".")\n',
              '                Text(Self.decimalSeparator(for: locale))\n',
              "visible decimal separator",
          )
          rolling_path.write_text(rolling, encoding="utf-8")

          instrument_path = Path("NembraApp/Features/Dashboard/SpeedInstrumentModel.swift")
          instrument = instrument_path.read_text(encoding="utf-8")
          energy_rail_anchor = "private struct DashboardEnergyRailView: View {"
          peak_label_policy = (
              "enum DashboardPowerPeakLabelPolicy {\n"
              "    static func frameHeight(for pointSize: CGFloat) -> CGFloat {\n"
              "        max(14, ceil(pointSize * 1.55))\n"
              "    }\n\n"
              "    static func centerY(\n"
              "        peakY: CGFloat,\n"
              "        railHeight: CGFloat,\n"
              "        pointSize: CGFloat,\n"
              "        usesAccessibilityLayout: Bool\n"
              "    ) -> CGFloat? {\n"
              "        guard peakY.isFinite,\n"
              "              railHeight.isFinite,\n"
              "              pointSize.isFinite,\n"
              "              railHeight > 0,\n"
              "              pointSize > 0 else {\n"
              "            return nil\n"
              "        }\n\n"
              "        let labelHeight = frameHeight(for: pointSize)\n"
              "        // At the 44pt accessibility floor, the transient text collides with the\n"
              "        // rail's lower legend/control boundary. Keep the peak marker and omit only\n"
              "        // this redundant visual label until the rail has enough vertical room.\n"
              "        guard railHeight >= max(56, labelHeight * 3) else { return nil }\n\n"
              "        let inset = max(3, labelHeight * 0.15)\n"
              "        let minimumCenter = inset + labelHeight / 2\n"
              "        let maximumCenter = railHeight - inset - labelHeight / 2\n"
              "        guard maximumCenter >= minimumCenter else { return nil }\n\n"
              "        let desiredCenter = peakY + (usesAccessibilityLayout ? 25 : 21)\n"
              "        return min(max(desiredCenter, minimumCenter), maximumCenter)\n"
              "    }\n"
              "}\n\n"
          )
          instrument = replace_once(
              instrument,
              energy_rail_anchor,
              peak_label_policy + energy_rail_anchor,
              "peak label policy insertion",
          )
          instrument = replace_once(
              instrument,
              "            if let peak = distinctPeakFraction(from: current) {\n"
              "                let peakPoint = geometry.point(at: Double(peak))\n",
              "            if let peak = distinctPeakFraction(from: current),\n"
              "               let peakLabelY = DashboardPowerPeakLabelPolicy.centerY(\n"
              "                   peakY: geometry.point(at: Double(peak)).y,\n"
              "                   railHeight: size.height,\n"
              "                   pointSize: microLabelSize,\n"
              "                   usesAccessibilityLayout: dynamicTypeSize.isAccessibilitySize\n"
              "               ) {\n"
              "                let peakPoint = geometry.point(at: Double(peak))\n",
              "compact peak label admission",
          )
          instrument = replace_once(
              instrument,
              "                        y: peakPoint.y + (dynamicTypeSize.isAccessibilitySize ? 25 : 21)\n",
              "                        y: peakLabelY\n",
              "peak label center",
          )
          instrument = replace_once(
              instrument,
              "                    .foregroundStyle(NembraColor.secondaryText.opacity(0.88))\n"
              "                    .position(\n"
              "                        x: min(max(peakPoint.x, 42), size.width - 42),\n"
              "                        y: peakLabelY\n",
              "                    .foregroundStyle(NembraColor.secondaryText.opacity(0.88))\n"
              "                    .frame(height: DashboardPowerPeakLabelPolicy.frameHeight(for: microLabelSize))\n"
              "                    .position(\n"
              "                        x: min(max(peakPoint.x, 42), size.width - 42),\n"
              "                        y: peakLabelY\n",
              "peak label bounded frame",
          )
          instrument_path.write_text(instrument, encoding="utf-8")

          tests_path = Path("NembraAppTests/NembraAppTests.swift")
          tests = tests_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              "import CoreGraphics\nimport Dispatch\nimport XCTest\n",
              "import CoreGraphics\nimport Dispatch\nimport Foundation\nimport XCTest\n",
              "test Foundation import",
          )
          locale_test = (
              "    func testCockpitRollingSpeedDecimalSeparatorMatchesLocale() {\n"
              "        XCTAssertEqual(\n"
              "            RollingSpeedValueView.decimalSeparator(for: Locale(identifier: \"en_US\")),\n"
              "            \".\"\n"
              "        )\n"
              "        XCTAssertEqual(\n"
              "            RollingSpeedValueView.decimalSeparator(for: Locale(identifier: \"de_DE\")),\n"
              "            \",\"\n"
              "        )\n"
              "    }\n\n"
          )
          tests = replace_once(
              tests,
              "    func testCockpitSpeedUnitsResolveFromPreferenceAndSystemPolicy() {\n",
              locale_test + "    func testCockpitSpeedUnitsResolveFromPreferenceAndSystemPolicy() {\n",
              "locale regression test",
          )
          peak_test = (
              "    func testPowerPeakLabelPolicyStaysInsideRailOrOmitsCompactLabel() throws {\n"
              "        XCTAssertNil(\n"
              "            DashboardPowerPeakLabelPolicy.centerY(\n"
              "                peakY: 25.5,\n"
              "                railHeight: 44,\n"
              "                pointSize: 13,\n"
              "                usesAccessibilityLayout: true\n"
              "            ),\n"
              "            \"The 44pt accessibility rail must omit the transient peak label instead of drawing it into the controls below.\"\n"
              "        )\n\n"
              "        let pointSize: CGFloat = 10\n"
              "        let railHeight: CGFloat = 82\n"
              "        let labelHeight = DashboardPowerPeakLabelPolicy.frameHeight(for: pointSize)\n"
              "        let centerY = try XCTUnwrap(\n"
              "            DashboardPowerPeakLabelPolicy.centerY(\n"
              "                peakY: 45,\n"
              "                railHeight: railHeight,\n"
              "                pointSize: pointSize,\n"
              "                usesAccessibilityLayout: false\n"
              "            )\n"
              "        )\n"
              "        XCTAssertGreaterThanOrEqual(centerY - labelHeight / 2, 0)\n"
              "        XCTAssertLessThanOrEqual(centerY + labelHeight / 2, railHeight)\n"
              "    }\n\n"
          )
          tests = replace_once(
              tests,
              "    func testPowerSemanticsKeepAcceptedNowSeparateFromIlluminationAndPeak() {\n",
              peak_test + "    func testPowerSemanticsKeepAcceptedNowSeparateFromIlluminationAndPeak() {\n",
              "compact peak label regression test",
          )
          tests_path.write_text(tests, encoding="utf-8")

      - name: Enforce bounded source delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' "$APP_TESTS" "$INSTRUMENT_SOURCE" "$ROLLING_SOURCE" | sort)"
          test "$actual" = "$expected"
          grep -Fq '@Environment(\.locale) private var locale' "$ROLLING_SOURCE"
          grep -Fq 'decimalSeparator(for locale: Locale)' "$ROLLING_SOURCE"
          test "$(grep -Fc 'Text(".")' "$ROLLING_SOURCE" || true)" = 0
          grep -Fq 'DashboardPowerPeakLabelPolicy.centerY' "$INSTRUMENT_SOURCE"
          grep -Fq 'railHeight >= max(56, labelHeight * 3)' "$INSTRUMENT_SOURCE"
          grep -Fq 'testCockpitRollingSpeedDecimalSeparatorMatchesLocale' "$APP_TESTS"
          grep -Fq 'testPowerPeakLabelPolicyStaysInsideRailOrOmitsCompactLabel' "$APP_TESTS"

      - name: Publish only if branch is still this exact head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm -- "$SELF_WORKFLOW"
          git add -- "$ROLLING_SOURCE" "$INSTRUMENT_SOURCE" "$APP_TESTS"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cockpit): localize speed and bound peak label'
          final_head="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_COCKPIT_REVIEW_FIX final=%s trigger=%s physicalTelemetryAuthorityCreated=false\n' "$final_head" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
