name: Materialize Capture Timeout Presentation 0EE

on:
  push:
    branches:
      - repair/v14-capture-timeout-terminal-presentation-0ee-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact parent and staged scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='0ee7aab76b4880c9871404b23755f27e539b5351'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          mapfile -t paths < <(git diff --name-only "$BASE"...HEAD)
          test "${#paths[@]}" -eq 2
          printf '%s\n' "${paths[@]}" | grep -Fxq '.github/workflows/materialize-capture-timeout-presentation-0ee.yml'
          printf '%s\n' "${paths[@]}" | grep -Fxq 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationTimeoutPresentationRaceSourceTests.swift'

      - name: Apply timeout terminal presentation fence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          terminal = 'try await sessionLedger.markApplicationObservationTimedOut(for: token)'
          start = source.find(terminal)
          if start < 0:
              raise SystemExit('application-timeout terminal mutation not found')
          line_end = source.find('\n', start)
          if line_end < 0:
              raise SystemExit('application-timeout line boundary not found')
          downstream = source[line_end:line_end + 1800]
          if 'stale_application_timeout_completion_ignored' in downstream:
              raise SystemExit('timeout presentation fence already exists')
          fence = '''                    guard self.currentConnectionToken == token,\n                          self.phase == .observing else {\n                        self.log("stale_application_timeout_completion_ignored", [\n                            "generation": String(token.diagnosticGeneration),\n                            "phase": self.phase.rawValue\n                        ])\n                        return\n                    }\n'''
          path.write_text(source[:line_end + 1] + fence + source[line_end + 1:], encoding='utf-8')
          PY

      - name: Verify source truth contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = source.index('if self.applicationUpdateAdmissionsInFlight == 0,')
          end = source.index('try? await Task.sleep(for: .seconds(1))', start)
          timeout = source[start:end]
          terminal = timeout.index('try await sessionLedger.markApplicationObservationTimedOut(for: token)')
          fence = timeout.index('guard self.currentConnectionToken == token', terminal)
          phase = timeout.index('self.phase == .observing', fence)
          message = timeout.index('Authenticated session produced no application update before the observation deadline.', phase)
          assert terminal < fence < phase < message
          assert 'stale_application_timeout_completion_ignored' in timeout
          PY
          git diff --check

      - name: Parse changed Swift
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationTimeoutPresentationRaceSourceTests.swift

      - name: Publish two-path donor
        shell: bash
        run: |
          set -euo pipefail
          BASE='0ee7aab76b4880c9871404b23755f27e539b5351'
          rm .github/workflows/materialize-capture-timeout-presentation-0ee.yml
          git add -A
          git diff --cached --check
          mapfile -t paths < <(git diff --cached --name-only "$BASE")
          test "${#paths[@]}" -eq 2
          printf '%s\n' "${paths[@]}" | grep -Fxq 'NembraApp/App/NembraCaptureEntrypoint.swift'
          printf '%s\n' "${paths[@]}" | grep -Fxq 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationTimeoutPresentationRaceSourceTests.swift'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): fence timeout terminal presentation ownership'
          git push origin HEAD:repair/v14-capture-timeout-terminal-presentation-0ee-sol
