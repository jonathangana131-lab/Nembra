name: Validate Capture Apple identity Python contract 518

on:
  push:
    branches:
      - fix/v14-capture-apple-python-contract-518-sol

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-apple-python-contract-518-sol
          fetch-depth: 0
      - name: Guard exact current product and run focused contract
        shell: bash
        run: |
          set -euo pipefail
          parent='518fe048b11a1e666e04976a7f7bd4fcb1a4af69'
          test "$(git merge-base HEAD "$parent")" = "$parent"
          unexpected="$(git diff --name-only "$parent"...HEAD | grep -Ev '^(.github/workflows/validate-capture-apple-python-contract-518-sol.yml|scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py)$' || true)"
          test -z "$unexpected"
          python3 -m py_compile scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          python3 scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check
      - name: Retire validation workflow
        shell: bash
        env:
          BRANCH: fix/v14-capture-apple-python-contract-518-sol
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-capture-apple-python-contract-518-sol.yml
          git commit -m "chore(capture): retire Apple Python-contract 518 validator"
          git push origin "HEAD:$BRANCH"
