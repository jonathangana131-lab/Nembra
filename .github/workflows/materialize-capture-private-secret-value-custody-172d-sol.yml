name: Materialize Capture Private Secret Value Custody 172D Sol

on:
  push:
    branches:
      - "fix/v14-capture-private-secret-value-custody-172d-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reapply validated exact-secret donor on exact product
        shell: bash
        run: |
          set -euo pipefail
          product="172dca56a1bc018e192feec197ceb17f81db5dab"
          donor_parent="c38cb8f4c66ec1e1e8f6cdbe7fb77955daf18b5e"
          donor="dd8bd186197e2f885486d86ed44054454f68c1b3"
          test "$(git rev-parse HEAD^)" = "$product"
          git fetch --no-tags origin "$donor_parent" "$donor"
          git diff --binary "$donor_parent" "$donor" -- \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift \
            > /tmp/secret.patch
          test -s /tmp/secret.patch
          git apply --3way --index /tmp/secret.patch

      - name: Validate and publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          app="NembraApp/App/NembraCaptureEntrypoint.swift"
          test_file="Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift"
          swiftc -frontend -parse "$app"
          swiftc -frontend -parse "$test_file"
          python3 - <<'PY'
          from pathlib import Path
          s=Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          a=s.index("@MainActor\nprivate final class SmartLifeDriver")
          b=s.index("#endif\n\nprivate enum AppleAccountAuthorizationError",a)
          d=s[a:b]
          for x in ["NembraTuyaPrivateIdentity.appKey","NembraTuyaPrivateIdentity.appSecret","private static var exactSecretValues: [String]","<redacted-private-application-secret>","options: [.literal]","uniqueCustodyKey","while sanitized[custodyKey] != nil"]:
              assert x in d, x
          assert "sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))" not in d
          for x in ["localkey","sessionkey","appkey","appsecret","password","accounttoken","accesstoken","refreshtoken","authkey","seckey"]:
              assert f'"{x}"' in d, x
          PY
          git diff --cached --check
          rm .github/workflows/materialize-capture-private-secret-value-custody-172d-sol.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only "172dca56a1bc018e192feec197ceb17f81db5dab" | sort)
          expected=("NembraApp/App/NembraCaptureEntrypoint.swift" "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift")
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${sorted_expected[*]}"
          git config user.name "Nembra V14 Sol"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): bind exact private secret values before custody"
          git push origin HEAD:fix/v14-capture-private-secret-value-custody-172d-sol
