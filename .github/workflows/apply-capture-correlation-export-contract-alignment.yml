name: Apply Capture correlation export contract alignment

on:
  push:
    branches:
      - agent/v14-capture-correlation-export-provenance-sol

permissions:
  contents: write

jobs:
  apply-product-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-correlation-export-provenance-sol
          fetch-depth: 0
      - name: Verify exact product parent and staging-only delta
        shell: bash
        run: |
          set -euo pipefail
          base='4a45755f7c0e3c9e442c55901b306daf4f9c71cb'
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base"...HEAD | sort)" = $'.github/workflows/apply-capture-correlation-export-contract-alignment.yml\nscripts/ci/apply_capture_correlation_export_contract_alignment.py'
      - name: Apply deterministic alignment patch
        run: python3 scripts/ci/apply_capture_correlation_export_contract_alignment.py
      - name: Verify export contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'targetCorrelationMethod: targetCorrelationMethod' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'targetCorrelationWindowCount: targetCorrelationWindowCount' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'targetCorrelationOperatorConfirmed: targetCorrelationOperatorConfirmed' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'targetCorrelationProvenance: correlationProvenance' NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Commit product and regression only
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/apply_capture_correlation_export_contract_alignment.py
          rm .github/workflows/apply-capture-correlation-export-contract-alignment.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(capture): align correlation export authority fields'
          git push origin HEAD:agent/v14-capture-correlation-export-provenance-sol
