name: Materialize Capture Cross-Controller BLE Lease

on:
  push:
    branches:
      - agent/capture-cross-controller-ble-lease

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/capture-cross-controller-ble-lease

      - name: Materialize process-global BLE ownership lease
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='e8acd80c6f220529a98a4a4829514829c3321daa'
          actual_parent="$(git rev-parse HEAD^)"
          [[ "$actual_parent" == "$expected_parent" ]] || {
            echo "Expected materializer commit directly above $expected_parent, got parent $actual_parent" >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          if 'activePackageCorrelationOwner' in source or 'processCorrelationLease' in source:
              raise SystemExit('cross-controller BLE lease already present; refuse duplicate materialization')

          needle = '    private var correlationSession: PassiveBluetoothPowerCycleObservationSession?\n'
          if source.count(needle) != 1:
              raise SystemExit('correlationSession field anchor drifted')
          source = source.replace(
              needle,
              needle + '    private var processCorrelationLease: UUID?\n',
              1,
          )

          # Any path that abandons a live package correlation must retire the radio transport
          # before releasing the process lease. Centralize those existing two-line abandon pairs.
          source, direct_count = re.subn(
              r'(?m)^(\s*)correlationSession\?\.abandonCurrentWindow\(\)\n\1correlationSession = nil$',
              r'\1abandonPackageCorrelation()',
              source,
          )
          source, local_count = re.subn(
              r'(?m)^(\s*)session\.abandonCurrentWindow\(\)\n\1correlationSession = nil$',
              r'\1abandonPackageCorrelation()',
              source,
          )
          if direct_count < 3 or local_count < 3:
              raise SystemExit(f'expected existing abandon pairs drifted: direct={direct_count} local={local_count}')

          async_anchor = '''        guard correlationProgress?.isSeriesInvalidated == true else { return }\n        correlationSession = nil\n        failLocally(\n'''
          if source.count(async_anchor) != 1:
              raise SystemExit('async correlation invalidation anchor drifted')
          source = source.replace(
              async_anchor,
              '''        guard correlationProgress?.isSeriesInvalidated == true else { return }\n        abandonPackageCorrelation()\n        failLocally(\n''',
              1,
          )

          reset_anchor = '''        resetDiscoverySessionOnly()\n        do {\n            correlationSession = try PassiveBluetoothPowerCycleObservationSession(minimumWindowDuration: 10)\n'''
          if source.count(reset_anchor) != 1:
              raise SystemExit('correlation creation anchor drifted')
          source = source.replace(
              reset_anchor,
              '''        resetDiscoverySessionOnly()\n        guard let processLease = OfficialTuyaFactory.acquirePackageCorrelationLease() else {\n            failLocally(\n                "Another Capture controller already owns package Bluetooth correlation, or Tuya BLE ownership was attempted in this app process. Finish/relaunch before a fresh OFF1 series.",\n                "process_package_correlation_ownership_unavailable"\n            )\n            return\n        }\n        processCorrelationLease = processLease\n        do {\n            correlationSession = try PassiveBluetoothPowerCycleObservationSession(minimumWindowDuration: 10)\n''',
              1,
          )

          finish_anchor = '''    private func finishCorrelationSeries(_ result: PassiveBluetoothPowerCycleObservationResult) {\n        // Preserve the package-issued receipts + exact catalogs before releasing the live scanner.\n'''
          if source.count(finish_anchor) != 1:
              raise SystemExit('finishCorrelationSeries anchor drifted')
          source = source.replace(
              finish_anchor,
              '''    private func finishCorrelationSeries(_ result: PassiveBluetoothPowerCycleObservationResult) {\n        // `finishCurrentWindow()` has already synchronously retired the final package scanner.\n        // Release the process lease only after that radio transport is no longer live, so another\n        // controller can never acquire Tuya ownership while package scanning still exists.\n        correlationSession = nil\n        releasePackageCorrelationLease()\n\n        // Preserve the package-issued receipts + exact catalogs before releasing the live scanner.\n''',
              1,
          )

          helper_anchor = '''    private func resetDiscoverySessionOnly() {\n'''
          if source.count(helper_anchor) != 1:
              raise SystemExit('reset helper anchor drifted')
          source = source.replace(
              helper_anchor,
              '''    private func abandonPackageCorrelation() {\n        // Radio transport first, process lease second. The owner token prevents an old controller\n        // from clearing a lease that belongs to a newer correlation attempt.\n        correlationSession?.abandonCurrentWindow()\n        correlationSession = nil\n        releasePackageCorrelationLease()\n    }\n\n    private func releasePackageCorrelationLease() {\n        guard let processCorrelationLease else { return }\n        OfficialTuyaFactory.releasePackageCorrelationLease(processCorrelationLease)\n        self.processCorrelationLease = nil\n    }\n\n    private func resetDiscoverySessionOnly() {\n''',
              1,
          )

          factory_anchor = '''private enum OfficialTuyaFactory {\n    private static var didBootstrap = false\n    private static var packageCorrelationRetiredForProcess = false\n\n    static var packageCorrelationMayStart: Bool {\n        !packageCorrelationRetiredForProcess\n    }\n'''
          if source.count(factory_anchor) != 1:
              raise SystemExit('OfficialTuyaFactory ownership anchor drifted')
          source = source.replace(
              factory_anchor,
              '''private enum OfficialTuyaFactory {\n    private static var didBootstrap = false\n    private static var packageCorrelationRetiredForProcess = false\n    private static var activePackageCorrelationOwner: UUID?\n\n    static var packageCorrelationMayStart: Bool {\n        !packageCorrelationRetiredForProcess && activePackageCorrelationOwner == nil\n    }\n\n    static func acquirePackageCorrelationLease() -> UUID? {\n        guard !packageCorrelationRetiredForProcess, activePackageCorrelationOwner == nil else { return nil }\n        let lease = UUID()\n        activePackageCorrelationOwner = lease\n        return lease\n    }\n\n    static func releasePackageCorrelationLease(_ lease: UUID) {\n        guard activePackageCorrelationOwner == lease else { return }\n        activePackageCorrelationOwner = nil\n    }\n''',
              1,
          )

          make_anchor = '''        guard bootstrap(), accountLoggedIn, currentAccountUID != nil else { return nil }\n        // A process-global Tuya BLE manager may outlive any one controller. Once a\n'''
          if source.count(make_anchor) != 1:
              raise SystemExit('OfficialTuyaFactory.make guard anchor drifted')
          source = source.replace(
              make_anchor,
              '''        guard activePackageCorrelationOwner == nil,\n              bootstrap(),\n              accountLoggedIn,\n              currentAccountUID != nil else { return nil }\n        // A process-global Tuya BLE manager may outlive any one controller. Once a\n''',
              1,
          )

          # Structural safety assertions: all package lease mutation is MainActor-serialized in
          # OfficialTuyaFactory, no caller can clear somebody else's owner, and Tuya driver creation
          # refuses to begin while package correlation owns the process BLE lane.
          factory = source[source.index('private enum OfficialTuyaFactory'):source.index('#if canImport(ThingSmartHomeKit)\n@MainActor\nprivate final class OfficialTuyaMembershipProbe')]
          required = [
              'private static var activePackageCorrelationOwner: UUID?',
              'guard !packageCorrelationRetiredForProcess, activePackageCorrelationOwner == nil else { return nil }',
              'activePackageCorrelationOwner = lease',
              'guard activePackageCorrelationOwner == lease else { return }',
              'activePackageCorrelationOwner = nil',
              'guard activePackageCorrelationOwner == nil,',
              'packageCorrelationRetiredForProcess = true',
          ]
          for token in required:
              if token not in factory:
                  raise SystemExit(f'missing ownership invariant: {token}')
          if factory.index('guard activePackageCorrelationOwner == nil,') > factory.index('packageCorrelationRetiredForProcess = true'):
              raise SystemExit('Tuya handoff must reject active package lease before retiring package correlation')

          if source.count('OfficialTuyaFactory.acquirePackageCorrelationLease()') != 1:
              raise SystemExit('package correlation lease must have one acquisition site')
          if source.count('OfficialTuyaFactory.releasePackageCorrelationLease(processCorrelationLease)') != 1:
              raise SystemExit('controller must have one token-bound release site')

          path.write_text(source, encoding='utf-8')
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipLeaseSourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture cross-controller BLE ownership lease")
          struct TuyaCrossControllerBLEOwnershipLeaseSourceTests {
              @Test("package correlation owns one process-global lease and Tuya handoff refuses overlap")
              func leaseSerializesPackageCorrelationAgainstTuyaHandoff() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let factory = String(try section(
                      in: source,
                      from: "private enum OfficialTuyaFactory",
                      to: "#if canImport(ThingSmartHomeKit)\n@MainActor\nprivate final class OfficialTuyaMembershipProbe"
                  ))

                  #expect(factory.contains("private static var activePackageCorrelationOwner: UUID?"))
                  #expect(factory.contains("guard !packageCorrelationRetiredForProcess, activePackageCorrelationOwner == nil else { return nil }"))
                  #expect(factory.contains("activePackageCorrelationOwner = lease"))
                  #expect(factory.contains("guard activePackageCorrelationOwner == lease else { return }"))
                  #expect(factory.contains("activePackageCorrelationOwner = nil"))

                  let make = try section(
                      in: factory,
                      from: "static func make() -> OfficialTuyaDriver?",
                      to: "}\n}\n\n#if canImport(ThingSmartHomeKit)"
                  )
                  let noPackageOwner = make.range(of: "guard activePackageCorrelationOwner == nil,")
                  let retirePackageForever = make.range(of: "packageCorrelationRetiredForProcess = true")
                  let driver = make.range(of: "return SmartLifeDriver()")
                  #expect(noPackageOwner != nil)
                  #expect(retirePackageForever != nil)
                  #expect(driver != nil)
                  if let noPackageOwner, let retirePackageForever, let driver {
                      #expect(noPackageOwner.lowerBound < retirePackageForever.lowerBound)
                      #expect(retirePackageForever.lowerBound < driver.lowerBound)
                  }
              }

              @Test("OFF1 acquires after reset and every release is owner-token bound")
              func correlationAcquiresAndReleasesTokenBoundLease() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = try section(
                      in: source,
                      from: "private final class SecureLinkController",
                      to: "@MainActor\nprivate protocol OfficialTuyaDriver"
                  )
                  #expect(controller.contains("private var processCorrelationLease: UUID?"))

                  let begin = try section(
                      in: controller,
                      from: "private func beginCorrelationSeries()",
                      to: "func startNextCorrelationWindow()"
                  )
                  let reset = begin.range(of: "resetDiscoverySessionOnly()")
                  let acquire = begin.range(of: "OfficialTuyaFactory.acquirePackageCorrelationLease()")
                  let store = begin.range(of: "processCorrelationLease = processLease")
                  let session = begin.range(of: "PassiveBluetoothPowerCycleObservationSession(minimumWindowDuration: 10)")
                  #expect(reset != nil)
                  #expect(acquire != nil)
                  #expect(store != nil)
                  #expect(session != nil)
                  if let reset, let acquire, let store, let session {
                      #expect(reset.lowerBound < acquire.lowerBound)
                      #expect(acquire.lowerBound < store.lowerBound)
                      #expect(store.lowerBound < session.lowerBound)
                  }

                  let release = try section(
                      in: controller,
                      from: "private func releasePackageCorrelationLease()",
                      to: "private func resetDiscoverySessionOnly()"
                  )
                  #expect(release.contains("guard let processCorrelationLease else { return }"))
                  #expect(release.contains("OfficialTuyaFactory.releasePackageCorrelationLease(processCorrelationLease)"))
                  #expect(release.contains("self.processCorrelationLease = nil"))
              }

              @Test("scanner is retired before process lease release and successful series also releases")
              func scannerRetiresBeforeLeaseRelease() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let abandon = try section(
                      in: source,
                      from: "private func abandonPackageCorrelation()",
                      to: "private func releasePackageCorrelationLease()"
                  )
                  let stop = abandon.range(of: "correlationSession?.abandonCurrentWindow()")
                  let clear = abandon.range(of: "correlationSession = nil")
                  let release = abandon.range(of: "releasePackageCorrelationLease()")
                  #expect(stop != nil)
                  #expect(clear != nil)
                  #expect(release != nil)
                  if let stop, let clear, let release {
                      #expect(stop.lowerBound < clear.lowerBound)
                      #expect(clear.lowerBound < release.lowerBound)
                  }

                  let finish = try section(
                      in: source,
                      from: "private func finishCorrelationSeries(_ result: PassiveBluetoothPowerCycleObservationResult)",
                      to: "func confirmCorrelatedTarget()"
                  )
                  let finishClear = finish.range(of: "correlationSession = nil")
                  let finishRelease = finish.range(of: "releasePackageCorrelationLease()")
                  #expect(finishClear != nil)
                  #expect(finishRelease != nil)
                  if let finishClear, let finishRelease {
                      #expect(finishClear.lowerBound < finishRelease.lowerBound)
                  }
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipLeaseSourceTests.swift').read_text(encoding='utf-8')
          forbidden = ('disconnectBLE', 'publishDps', 'writeValue', 'resetFactory', 'removeDevice')
          for token in forbidden:
              if token in test:
                  raise SystemExit(f'regression introduced forbidden authority token: {token}')
          if source.count('private static var activePackageCorrelationOwner: UUID?') != 1:
              raise SystemExit('process owner declaration count mismatch')
          if source.count('activePackageCorrelationOwner = nil') != 1:
              raise SystemExit('process owner must have exactly one runtime clear site')
          if 'guard activePackageCorrelationOwner == lease else { return }' not in source:
              raise SystemExit('stale controller could clear another owner')
          print('cross-controller BLE ownership lease source contract: PASS')
          PY

          git diff --check

          rm .github/workflows/materialize-capture-cross-controller-ble-lease.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipLeaseSourceTests.swift \
                  .github/workflows/materialize-capture-cross-controller-ble-lease.yml
          git diff --cached --check
          git commit -m 'fix(capture): serialize process BLE ownership'
          git push origin HEAD:agent/capture-cross-controller-ble-lease
