name: Capture recorded Ready recovery precedence integration

on:
  push:
    branches:
      - integration/es80-v14-current-foreground-finalization-integrity/chatgpt56-thinking-go
    paths:
      - .github/workflows/capture-recorded-ready-recovery-precedence-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-current-foreground-finalization-integrity/chatgpt56-thinking-go
          fetch-depth: 2

      - name: Verify exact staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "83f463a5a4584c0fd5dca61aadcf79f8341a2735"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-recorded-ready-recovery-precedence-integration.yml"

      - name: Apply exact recorded Ready precedence repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          controller = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          source = controller.read_text()
          old = "                            _ = try? self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit(recordedReady)\n                            throw error\n"
          new = (
              "                            let recordedReadyFailure = error\n"
              "                            do {\n"
              "                                _ = try self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit(\n"
              "                                    recordedReady\n"
              "                                )\n"
              "                            } catch {\n"
              "                                // Exact quarantine failure is stronger lifecycle evidence than\n"
              "                                // the triggering queue-commit failure. Never suppress it.\n"
              "                                throw error\n"
              "                            }\n"
              "                            throw recordedReadyFailure\n"
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"recorded Ready recovery: expected exactly one executable patch site, found {count}")
          controller.write_text(source.replace(old, new, 1))
          Path(".github/workflows/capture-recorded-ready-recovery-precedence-integration.yml").unlink()
          PY

          git diff --check
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          test "$(grep -c 'let recordedReadyFailure = error' "$controller")" = "1"
          test "$(grep -c 'throw recordedReadyFailure' "$controller")" = "1"
          test "$(grep -c 'try? self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit' "$controller" || true)" = "0"
          test "$(grep -c 'let recordedHorizonFailure = error' "$controller")" = "1"
          test "$(grep -c 'try? observationBoundaryQueueGate.abortRecordedHorizonBeforeGateCommit' "$controller" || true)" = "0"
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerRecoveryErrorPrecedenceTests.swift
          test ! -e .github/workflows/capture-recorded-ready-recovery-precedence-integration.yml

      - name: Commit exact product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-chatgpt56-thinking"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve recorded Ready recovery error precedence"
          git push origin HEAD:integration/es80-v14-current-foreground-finalization-integrity/chatgpt56-thinking-go
