name: Propulsion Freshness Focused QA

on:
  push:
    branches:
      - qa/propulsion-freshness/chat-p7m4q-d3bb87e

permissions:
  contents: read

jobs:
  swift-test:
    name: Swift 6.2 package build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout QA mirror
        uses: actions/checkout@v6

      - name: Set up Swift 6.2.1
        uses: swift-actions/setup-swift@65540b95f51493d65f5e59e97dcef9629ddf11bf
        with:
          swift-version: "6.2.1"

      - name: Verify source mirror parent
        env:
          EXPECTED_FEATURE_HEAD: d3bb87ea28bdd085a22bf02823702993139d1632
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FEATURE_HEAD"
          changed="$(git diff --name-only "$EXPECTED_FEATURE_HEAD" HEAD)"
          test "$changed" = ".github/workflows/propulsion-freshness-focused-qa.yml"

      - name: Verify Swift toolchain
        run: swift --version

      - name: Build and run NembraCore tests
        working-directory: Packages/NembraCore
        run: swift test
