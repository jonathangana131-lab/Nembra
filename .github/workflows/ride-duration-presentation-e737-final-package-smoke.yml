name: Ride Duration Presentation e737 Final Package Smoke

on:
  push:
    branches:
      - qa/ride-duration-presentation/chat-m4q8t-e737d64

permissions:
  contents: read

jobs:
  nembra-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify immutable product parent and workflow-only delta
        shell: bash
        run: |
          set -euo pipefail
          product_sha="e737d64671a4a085c84600f6cf0c2347db45c0ad"
          test "$(git rev-parse HEAD^)" = "$product_sha"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/ride-duration-presentation-e737-final-package-smoke.yml"

      - name: Run full NembraCore suite with Swift 6.2 warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/Packages/NembraCore \
            swift:6.2 \
            bash -lc 'swift --version && swift test -Xswiftc -warnings-as-errors'
