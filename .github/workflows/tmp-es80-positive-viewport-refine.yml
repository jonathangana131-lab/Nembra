name: TEMP ES80 positive viewport QA refinement

on:
  push:
    branches:
      - test/es80-v14-positive-a11y-landscape/gpt56-thinking-go

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OLD1: 
      NEW1: 
      OLD2: 
      NEW2: 
      OLD3: 
      NEW3: 
      OLD4: 
      NEW4: ICAgICAgICBhc3NlcnRWaXNpYmxlSW5TY3JlZW5zaG90Vmlld3BvcnQoCiAgICAgICAgICAgIGZpbmlzaCwK
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Make positive viewport acceptance scroll-aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path("NembraUITests/ES80ResearchCaptureUITests.swift")
          text = path.read_text(encoding="utf-8")
          for index in range(1, 5):
              old = base64.b64decode(os.environ[f"OLD{index}"]).decode("utf-8")
              new = base64.b64decode(os.environ[f"NEW{index}"]).decode("utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"viewport refinement marker {index} count={text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          grep -q 'Accessibility XXXL — Disclosure' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'Accessibility XXXL — View Details' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'Horizon Ready — Landscape — Disclosure' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'bringIntoScreenshotViewport' NembraUITests/ES80ResearchCaptureUITests.swift
          git diff --check
          rm .github/workflows/tmp-es80-positive-viewport-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[Capture visual QA v14] Make positive viewport checks scroll-aware"
          git push origin HEAD:${{ github.ref_name }}
