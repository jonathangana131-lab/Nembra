name: Temporary Capture AX compile repair

on:
  push:
    branches:
      - repair/v14-capture-root-two-file-closure-sol-20260811

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Repair secure-link AX disclosure scope
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          text = path.read_text(encoding='utf-8')
          old = 'Label(isAccessibilityLayout ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")'
          new = 'Label(dynamicTypeSize.isAccessibilitySize ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one out-of-scope SecureLinkView disclosure label, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'Label(dynamicTypeSize.isAccessibilitySize ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Compile standalone Capture after scope repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/NembraCaptureAXCompileRepair
          xcodebuild -project NembraCapture.xcodeproj -scheme 'Nembra Capture' -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureAXCompileRepair CODE_SIGNING_ALLOWED=NO build

      - name: Publish clean product commit and retire temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-capture-root-ax-compile-fix.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --cached --check
          git config user.name 'nembra-capture-bot'
          git config user.email 'capture@nembra.invalid'
          git commit -m 'Capture: fix secure-link AX disclosure scope'
          git push origin HEAD:repair/v14-capture-root-two-file-closure-sol-20260811
