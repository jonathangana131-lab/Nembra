name: Temporary V14 attest-exec 31f3 restack
on:
  push:
    branches: [repair/v14-attest-exec-31f3-restack-staging-sol-20260812-go2]
permissions:
  contents: write
jobs:
  restack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OWNER_HEAD: 31f3da411581bf99836287cd68b905f7c4368bc3
      PROVEN_HEAD: 4793d5441417892469e628143d7cc1ee3d1756a9
      OWNER_BRANCH: repair/v14-signed-origin-dedicated-uid-apfs-sol-20260812
      PR_BRANCH: repair/v14-signed-origin-attest-exec-c499-clean-sol-20260812-go2
      EXPECTED_OLD_PR_HEAD: 4793d5441417892469e628143d7cc1ee3d1756a9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Compose exact 31f3 product child
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nembra-swarm
          git config user.email nembra-swarm@users.noreply.github.com
          git reset --hard "$OWNER_HEAD"
          git checkout "$PROVEN_HEAD" -- \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py")
          s = path.read_text(encoding="utf-8")
          old = '''            "identity_create": "_create_local_build_identity(build_name, build_uid, build_gid, home)",
                      "group_attestation": "_attest_build_identity_groups(\\n            build_name,",
                      "image": "_create_apfs_image(image)",
                      "attach_rw": "writable_device = _attach_apfs(image, mountpoint, readonly=False)",
          '''
          new = '''            "identity_create": "_create_local_build_identity(build_name, build_uid, build_gid, home)",
                      "image": "_create_apfs_image(image)",
                      "attach_rw": "writable_device = _attach_apfs(image, mountpoint, readonly=False)",
                      "group_attestation": "attested_command = _credential_attesting_exec_command(\\n            guarded_command,",
          '''
          if s.count(old) != 1: raise SystemExit("expected one 31f3 marker block")
          s = s.replace(old, new, 1)
          old = '        self.assertLess(indexes["group_attestation"], indexes["image"])\n'
          new = '        self.assertLess(indexes["attach_rw"], indexes["group_attestation"])\n        self.assertLess(indexes["group_attestation"], indexes["spawn"])\n'
          if s.count(old) != 1: raise SystemExit("expected one 31f3 ordering assertion")
          s = s.replace(old, new, 1)
          old = '''        self.assertIn("if effective != expected:", source)
                  self.assertIn("if effective.intersection(field_only):", source)
          '''
          new = '''        self.assertIn("attested_command = _credential_attesting_exec_command(", source)
                  self.assertIn("build = subprocess.run(\\n            attested_command,", source)
                  self.assertIn("raw_groups=sorted(set(os.getgroups()))", source)
                  self.assertIn("if not identity_exact or not groups_exact or field_only_leak:", source)
                  self.assertIn("os.execve(command[0], command, os.environ)", source)
                  self.assertIn("effectiveZeroSupplementaryGroupsClaim':False", source)
                  self.assertNotIn("def _attest_build_identity_groups(", source)
          '''
          if s.count(old) != 1: raise SystemExit("expected one 31f3 legacy group assertion block")
          s = s.replace(old, new, 1)
          start = s.index("    def test_effective_build_groups_must_match_fresh_directory_service_baseline")
          end = s.index("    def test_verified_identity_retirement_requires_no_live_uid_or_identity_lookup", start)
          replacement = r'''    def test_credential_attesting_exec_binds_fresh_ds_baseline_to_same_compiler_process(self) -> None:
                  helper = load(ORIGIN_HELPER, "capture_signed_app_build_origin_custody_attest_exec")
                  with mock.patch.object(helper.os, "getgrouplist", return_value=[12, 61, 100, 701, 55001]):
                      wrapped = helper._credential_attesting_exec_command(
                          ["/usr/bin/true", "accepted-compiler-argument"],
                          name="nembrabuildtest",
                          uid=55001,
                          gid=55001,
                          field_groups=(20, 33, 61, 80, 701),
                      )
                  self.assertEqual(wrapped[:4], ["/usr/bin/python3", "-B", "-I", "-c"])
                  child_source = wrapped[4]
                  contract = helper.json.loads(wrapped[5])
                  self.assertEqual(contract["effectiveGroups"], [12, 61, 100, 701])
                  self.assertEqual(contract["fieldOnlyGroups"], [20, 33, 80])
                  self.assertEqual(wrapped[6:], ["/usr/bin/true", "accepted-compiler-argument"])
                  self.assertIn("os.getgroups()", child_source)
                  self.assertIn("raise SystemExit(126)", child_source)
                  self.assertIn("os.execve(command[0], command, os.environ)", child_source)
                  self.assertIn("effectiveZeroSupplementaryGroupsClaim", child_source)
                  with self.assertRaises(helper.BuildOriginCustodyError):
                      helper._credential_attesting_exec_command(
                          ["xcodebuild"], name="nembrabuildtest", uid=55001, gid=55001, field_groups=(),
                      )

          '''
          s = s[:start] + replacement + s[end:]
          path.write_text(s, encoding="utf-8")
          PY
          git add \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py \
            scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          git commit -m "Capture P0: bind credential attestation to compiler exec"
      - name: Validate composed 31f3 child
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py \
            scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          python3 scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py -v
          grep -Fq 'def _credential_attesting_exec_command(' scripts/ci/capture_signed_app_build_origin_custody.py
          grep -Fq 'os.execve(command[0], command, os.environ)' scripts/ci/capture_signed_app_build_origin_custody.py
          grep -Fq 'def _process_state_for_uid(' scripts/ci/capture_signed_app_build_origin_custody.py
          grep -Fq 'test_process_state_separates_live_and_zombie_numeric_uid_subjects' scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          grep -Fq 'timeout=0' scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          ! grep -Fq 'def _attest_build_identity_groups(' scripts/ci/capture_signed_app_build_origin_custody.py
          grep -Fq 'buildCredentialAttestationSameExecTransition' scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          git diff "$OWNER_HEAD"..HEAD --check
          actual="$(git diff --name-only "$OWNER_HEAD"..HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' scripts/ci/capture_signed_app_build_origin_custody.py scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - name: Require owner branch still exact 31f3
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$OWNER_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$OWNER_HEAD"
      - name: Retarget existing stacked PR atomically
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease="refs/heads/$PR_BRANCH:$EXPECTED_OLD_PR_HEAD" origin "HEAD:refs/heads/$PR_BRANCH"
