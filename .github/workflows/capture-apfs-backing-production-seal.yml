name: Capture APFS Backing Production Seal

on:
  pull_request:
    paths:
      - .github/workflows/capture-apfs-backing-production-seal.yml
      - .github/workflows/capture-full-numeric-principal-production-materialize-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-full-numeric-principal-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  EXACT_PARENT: c2211115ccc1bbe8a5dedff1544f1de73277c65d
  MATERIALIZER: .github/workflows/capture-full-numeric-principal-production-materialize-once.yml

jobs:
  portable-contract:
    name: Bootstrap full numeric-principal production materialization
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind temporary two-path authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-apfs-backing-production-seal.yml \
            .github/workflows/capture-full-numeric-principal-production-materialize-once.yml | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Extract and execute one-shot materializer body
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path

          materializer = Path(".github/workflows/capture-full-numeric-principal-production-materialize-once.yml")
          lines = materializer.read_text(encoding="utf-8").splitlines()
          anchor = "          /usr/bin/python3 -B - <<'PY'"
          try:
              start = lines.index(anchor) + 1
              end = lines.index("          PY", start)
          except ValueError as error:
              raise SystemExit("could not locate exact materializer Python body") from error
          body = lines[start:end]
          if not body or any(not line.startswith("          ") for line in body if line):
              raise SystemExit("materializer Python body indentation is not exact")
          script = "\n".join(line[10:] if line else "" for line in body) + "\n"

          # The temporary materializer was authored through a nested Python string
          # and one validation-only newline escaped into its emitted source. Repair
          # that exact one-shot authoring seam before compile; product/security
          # payload and permanent tests remain byte-for-byte otherwise unchanged.
          malformed = 'if extra:        raise SystemExit(\\n            "test file unexpected executable lines: "'
          repaired = 'if extra:\n    raise SystemExit(\n        "test file unexpected executable lines: "'
          count = script.count(malformed)
          if count != 1:
              raise SystemExit(f"expected one known materializer newline defect, found {count}")
          script = script.replace(malformed, repaired, 1)

          target = Path("/tmp/nembra-full-numeric-principal-materialize.py")
          target.write_text(script, encoding="utf-8")
          compile(script, str(target), "exec", dont_inherit=True)
          PY
          /usr/bin/python3 -B /tmp/nembra-full-numeric-principal-materialize.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_full_numeric_principal_production.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py

      - name: Restore bootstrap path and commit only permanent product delta
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$EXACT_PARENT" -- .github/workflows/capture-apfs-backing-production-seal.yml
          git rm "$MATERIALIZER"
          git add \
            .github/workflows/capture-full-numeric-principal-production.yml \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_full_numeric_principal_production.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          git diff --cached --check
          changed="$(git diff --cached --name-only "$EXACT_PARENT" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-full-numeric-principal-production.yml \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_full_numeric_principal_production.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git config user.name "nembra-capture-swarm"
          git config user.email "nembra-capture-swarm@users.noreply.github.com"
          git commit -m "security(capture): enforce full numeric-principal custody"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
