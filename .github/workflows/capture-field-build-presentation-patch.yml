name: Capture Field Build Presentation Patch

on:
  push:
    branches:
      - agent/v14-capture-field-build-presentation-authority-sol
    paths:
      - .github/workflows/capture-field-build-presentation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-field-build-presentation-authority-sol
          fetch-depth: 0
      - name: Apply production repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_field_build_presentation_patch.py
          rm Scripts/apply_capture_field_build_presentation_patch.py
          rm .github/workflows/capture-field-build-presentation-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'fieldBuildIsAuthoritative'
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'Source commit'
          git commit -m "fix(capture): make field-build preflight authority visible"
          git push origin HEAD:agent/v14-capture-field-build-presentation-authority-sol
