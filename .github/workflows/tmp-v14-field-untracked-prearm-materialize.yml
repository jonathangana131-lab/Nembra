name: Temporary V14 Field Untracked Prearm Materializer

on:
  push:
    branches:
      - repair/v14-field-untracked-prearm-sol-54c8arm-20260811

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-field-untracked-prearm-sol-54c8arm-20260811
          fetch-depth: 0

      - name: Bind selected parent and temporary-only staging
        shell: bash
        run: |
          set -euo pipefail
          base="d0b134ca2a49edc029f114660dfb8e216ece682e"
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-v14-field-untracked-prearm-materialize.yml' \
            'scripts/ci/tmp_materialize_field_untracked_prearm.py' | sort)"
          test "$actual" = "$expected"

      - name: Materialize post-arm raw source inventory
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tmp_materialize_field_untracked_prearm.py

      - name: Absorb exact #2913 witness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/2913/head:refs/remotes/origin/pr-2913
          git show refs/remotes/origin/pr-2913:scripts/ci/tests/test_capture_field_untracked_prearm_injection_red_team.py > scripts/ci/tests/test_capture_field_untracked_prearm_injection_red_team.py
          git show refs/remotes/origin/pr-2913:.github/workflows/capture-field-untracked-prearm-injection-red-team.yml > .github/workflows/capture-field-untracked-prearm-injection-red-team.yml

      - name: Validate repair before publication
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_untracked_prearm_injection_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_untracked_prearm_injection_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_window_authority.py
          git diff --check

      - name: Publish clean product successor
        shell: bash
        env:
          BRANCH: repair/v14-field-untracked-prearm-sol-54c8arm-20260811
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-v14-field-untracked-prearm-materialize.yml
          rm -f scripts/ci/tmp_materialize_field_untracked_prearm.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -Ec 'tmp-v14|tmp_materialize' || true)" = "2"
          git commit -m "Capture: reject untracked source after vnode arming"
          git push origin "HEAD:$BRANCH"
