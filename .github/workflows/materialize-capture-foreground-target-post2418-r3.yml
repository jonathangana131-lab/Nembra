name: Materialize Post-2418 Capture Lifecycle Residuals R3

on:
  push:
    branches: [agent/capture-foreground-target-post2418]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-foreground-target-post2418
          fetch-depth: 0
      - name: Apply residual lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          test "$(git merge-base HEAD "$parent")" = "$parent"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s=p.read_text(encoding='utf-8')

          proof='''        sdkDeviceMembershipVerified = false\n        membershipAccountUID = nil\n        membershipDeviceID = nil\n        membershipRequestID = UUID()\n'''
          if s.count(proof) != 2:
              raise SystemExit(f'expected view+foreground proof clear twice, found {s.count(proof)}')
          s=s.replace(proof, '''        sdkDeviceMembershipVerified = false\n        membershipAccountUID = nil\n        membershipDeviceID = nil\n        membershipStatus = "Secure Link left the active view. Exact scooter membership must be freshly verified before another attempt."\n        membershipRequestID = UUID()\n''', 1)

          old='''        if foregroundIntegrityLossHandled { return }\n\n        if let token = currentConnectionToken {\n'''
          if s.count(old)!=1: raise SystemExit('view idempotence anchor drifted')
          s=s.replace(old, '''        if foregroundIntegrityLossHandled { return }\n        foregroundIntegrityLossHandled = true\n\n        if let token = currentConnectionToken {\n''', 1)

          old='''        guard processCorrelationLease != nil || correlationSession != nil else { return }\n        // Existing helper stops package transport before releasing this controller's lease.\n        abandonPackageCorrelation()\n        phase = .failed\n        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."\n        log("target_correlation_abandoned_on_view_exit")\n    }\n\n    func appDidLoseForeground() {\n        guard !foregroundIntegrityLossHandled else { return }\n'''
          if s.count(old)!=1: raise SystemExit('view target/foreground entry anchor drifted')
          s=s.replace(old, '''        if processCorrelationLease != nil || correlationSession != nil {\n            // Existing helper stops package transport before releasing this controller's lease.\n            abandonPackageCorrelation()\n            phase = .failed\n            message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."\n            log("target_correlation_abandoned_on_view_exit")\n            return\n        }\n\n        if phase == .correlated || phase == .selected {\n            resetDiscoverySessionOnly()\n            phase = .failed\n            message = "Target correlation was retired because Capture left Secure Link. Restart from OFF1; a pre-exit correlated target is never reusable authority."\n            log("target_correlation_retired_on_view_exit")\n        }\n    }\n\n    func appDidLoseForeground() {\n        guard phase != .accepted else { return }\n        guard !foregroundIntegrityLossHandled else { return }\n''', 1)

          if s.count(proof) != 1:
              raise SystemExit(f'expected remaining foreground proof clear once, found {s.count(proof)}')
          s=s.replace(proof, '''        sdkDeviceMembershipVerified = false\n        membershipAccountUID = nil\n        membershipDeviceID = nil\n        membershipStatus = "Capture left the foreground. Exact scooter membership must be freshly verified after returning active."\n        membershipRequestID = UUID()\n''', 1)

          old='''        if processCorrelationLease != nil || correlationSession != nil {\n            // Existing helper stops package transport before releasing this controller's lease.\n            abandonPackageCorrelation()\n            phase = .failed\n            message = "Capture left the foreground during Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; interrupted windows are never reusable evidence."\n            log("foreground_integrity_lost_during_target_correlation")\n            return\n        }\n\n        guard let token = currentConnectionToken else {\n'''
          if s.count(old)!=1: raise SystemExit('foreground target anchor drifted')
          s=s.replace(old, '''        if processCorrelationLease != nil || correlationSession != nil {\n            // Existing helper stops package transport before releasing this controller's lease.\n            abandonPackageCorrelation()\n            phase = .failed\n            message = "Capture left the foreground during Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; interrupted windows are never reusable evidence."\n            log("foreground_integrity_lost_during_target_correlation")\n            return\n        }\n\n        if phase == .correlated || phase == .selected {\n            resetDiscoverySessionOnly()\n            phase = .failed\n            message = "Capture left the foreground after target correlation. Restart from OFF1; the pre-interruption correlated target was retired."\n            log("foreground_integrity_lost_after_target_correlation")\n            return\n        }\n\n        guard let token = currentConnectionToken else {\n''', 1)
          p.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          fg=s[s.index('func appDidLoseForeground()'):s.index('var privateConfig: Bool',s.index('func appDidLoseForeground()'))]
          ex=s[s.index('func abandonCorrelationForViewExit()'):s.index('func appDidLoseForeground()')]
          for token in ['guard phase != .accepted else { return }','membershipStatus =','phase == .correlated || phase == .selected','resetDiscoverySessionOnly()','foreground_integrity_lost_after_target_correlation','invalidateObservationContinuity(','invalidateInternalLifecycle(','Task { @MainActor [self] in']:
              if token not in fg: raise SystemExit('foreground missing '+token)
          for token in ['membershipStatus =','phase == .correlated || phase == .selected','resetDiscoverySessionOnly()','target_correlation_retired_on_view_exit','foregroundIntegrityLossHandled = true','Task { @MainActor [self] in']:
              if token not in ex: raise SystemExit('view exit missing '+token)
          for token in ['releasePackageCorrelationLease(','recordObservedTransportLoss','endConnection(','disconnectBLE']:
              if token in fg: raise SystemExit('foreground manufactured '+token)
          print('post-2418 lifecycle residuals: PASS')
          PY

          git diff --check
          rm .github/workflows/materialize-capture-foreground-target-post2418-r3.yml
          git config user.name nembra-v14-bot
          git config user.email nembra-v14-bot@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift \
                  .github/workflows/materialize-capture-foreground-target-post2418-r3.yml
          git diff --cached --check
          git commit -m 'fix(capture): retire target authority on lifecycle loss'
          git push origin HEAD:agent/capture-foreground-target-post2418
