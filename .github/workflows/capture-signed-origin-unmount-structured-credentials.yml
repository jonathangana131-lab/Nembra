name: Capture Signed Origin Unmount Structured Credentials

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_signed_app_unmount_freeze_probe.py
      - scripts/ci/tests/test_capture_signed_app_unmount_freeze_structured_credentials.py
      - .github/workflows/capture-signed-origin-unmount-freeze-probe.yml
      - .github/workflows/capture-signed-origin-unmount-structured-credentials.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-signed-origin-unmount-structured-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structured-credential-quiescence:
    name: Replay APFS quiescence without custom preexec credential shim
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind exact validation child to corrected #3004 parent
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UNMOUNT_PARENT_SHA: 3f404ab80c3c4029c3df2e1ce664504af9339362
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$UNMOUNT_PARENT_SHA" HEAD

          actual_paths="$RUNNER_TEMP/nembra-unmount-structured-paths.txt"
          expected_paths="$RUNNER_TEMP/nembra-unmount-structured-expected.txt"
          git diff --name-only "$UNMOUNT_PARENT_SHA"...HEAD | LC_ALL=C sort > "$actual_paths"
          cat > "$expected_paths" <<'EOF'
          .github/workflows/capture-signed-origin-unmount-structured-credentials.yml
          scripts/ci/tests/test_capture_signed_app_unmount_freeze_structured_credentials.py
          EOF
          LC_ALL=C sort -o "$expected_paths" "$expected_paths"
          diff -u "$expected_paths" "$actual_paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exact validation witness
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-unmount-structured-pycache"
          /usr/bin/python3 -m py_compile \
            scripts/ci/tests/test_capture_signed_app_unmount_freeze_probe.py \
            scripts/ci/tests/test_capture_signed_app_unmount_freeze_structured_credentials.py
          /usr/bin/python3 - <<'PY'
          import inspect, subprocess
          parameters = inspect.signature(subprocess.Popen).parameters
          required = {"user", "group", "extra_groups"}
          missing = sorted(required.difference(parameters))
          if missing:
              raise SystemExit(f"runner Python lacks structured POSIX credential arguments: {missing}")
          print("NEMBRA_STRUCTURED_CREDENTIAL_ARGS_PRESENT=1")
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Replay exact APFS quiescence oracle
        shell: bash
        run: |
          set -uo pipefail
          output_file="$RUNNER_TEMP/nembra-unmount-structured-output.txt"
          set +e
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_unmount_freeze_structured_credentials.py \
            >"$output_file" 2>&1
          rc=$?
          set -e
          cat "$output_file"
          if [[ "$rc" != 0 ]]; then
            diagnostic="$(tail -n 160 "$output_file" | /usr/bin/python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            printf '::error title=Structured-credential unmount validation failed::%s\n' "$diagnostic"
            exit "$rc"
          fi
          grep -q '^NEMBRA_UNMOUNT_STRUCTURED_CREDENTIAL_JSON=' "$output_file"

      - name: Retain structured-credential diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-unmount-structured-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ runner.temp }}/nembra-unmount-structured-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Diff hygiene
        if: always()
        shell: bash
        env:
          UNMOUNT_PARENT_SHA: 3f404ab80c3c4029c3df2e1ce664504af9339362
        run: |
          set -euo pipefail
          git diff --check "$UNMOUNT_PARENT_SHA" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
