name: Capture Signed Origin Unmount Structured Credentials

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_signed_app_unmount_freeze_probe.py
      - scripts/ci/tests/test_capture_signed_app_unmount_freeze_structured_credentials.py
      - scripts/ci/tests/test_capture_signed_app_unmount_freeze_minimal_groups.py
      - .github/workflows/capture-signed-origin-unmount-freeze-probe.yml
      - .github/workflows/capture-signed-origin-unmount-structured-credentials.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-signed-origin-unmount-structured-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structured-credential-quiescence:
    name: Replay APFS quiescence without custom preexec credential shim
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind exact validation child to corrected #3004 parent
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UNMOUNT_PARENT_SHA: 3f404ab80c3c4029c3df2e1ce664504af9339362
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$UNMOUNT_PARENT_SHA" HEAD

          actual_paths="$RUNNER_TEMP/nembra-unmount-structured-paths.txt"
          expected_paths="$RUNNER_TEMP/nembra-unmount-structured-expected.txt"
          git diff --name-only "$UNMOUNT_PARENT_SHA"...HEAD | LC_ALL=C sort > "$actual_paths"
          cat > "$expected_paths" <<'EOF'
          .github/workflows/capture-signed-origin-unmount-structured-credentials.yml
          scripts/ci/tests/test_capture_signed_app_unmount-freeze-minimal-groups-do-not-match
          EOF
          # Replace the sentinel above explicitly so a typo cannot silently widen
          # the exact validation-only path set.
          /usr/bin/python3 - "$expected_paths" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace(
              "scripts/ci/tests/test_capture_signed_app_unmount-freeze-minimal-groups-do-not-match",
              "scripts/ci/tests/test_capture_signed_app_unmount_freeze_minimal_groups.py\n"
              "scripts/ci/tests/test_capture_signed_app_unmount_freeze_structured_credentials.py",
          )
          path.write_text(text)
          PY
          LC_ALL=C sort -o "$expected_paths" "$expected_paths"
          diff -u "$expected_paths" "$actual_paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exact validation witness
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-unmount-structured-pycache"
          /usr/bin/python3 -m py_compile \
            scripts/ci/tests/test_capture_signed_app_unmount_freeze_probe.py \
            scripts/ci/tests/test_capture_signed_app_unmount_freeze_structured_credentials.py \
            scripts/ci/tests/test_capture_signed_app_unmount_freeze_minimal_groups.py
          /usr/bin/python3 - <<'PY'
          import inspect, subprocess
          parameters = inspect.signature(subprocess.Popen).parameters
          required = {"user", "group", "extra_groups"}
          missing = sorted(required.difference(parameters))
          if missing:
              raise SystemExit(f"runner Python lacks structured POSIX credential arguments: {missing}")
          print("NEMBRA_STRUCTURED_CREDENTIAL_ARGS_PRESENT=1")
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Replay exact APFS quiescence oracle with minimal groups
        shell: bash
        run: |
          set -uo pipefail
          output_file="$RUNNER_TEMP/nembra-unmount-structured-output.txt"
          set +e
          sudo -n /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_unmount_freeze_minimal_groups.py \
            >"$output_file" 2>&1
          rc=$?
          set -e
          cat "$output_file"
          if [[ "$rc" != 0 ]]; then
            diagnostic="$(tail -n 160 "$output_file" | /usr/bin/python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            printf '::error title=Structured-credential unmount validation failed::%s\n' "$diagnostic"
            exit "$rc"
          fi
          /usr/bin/python3 - "$output_file" <<'PY'
          import json
          from pathlib import Path
          import sys
          marker = "NEMBRA_UNMOUNT_STRUCTURED_CREDENTIAL_JSON="
          records = [
              line[len(marker):]
              for line in Path(sys.argv[1]).read_text().splitlines()
              if line.startswith(marker)
          ]
          if len(records) != 1:
              raise SystemExit(f"expected one APFS evidence record, found {len(records)}")
          evidence = json.loads(records[0])
          required = (
              evidence.get("structuredCredentialLaunch") is True
              and evidence.get("normalGroupsContainCapability") is False
              and evidence.get("pathAttackReturnCode") != 0
              and evidence.get("firstDetachReturnCode") != 0
              and evidence.get("heldDescriptorPostLockWrite") == "write-ok"
              and evidence.get("secondDetachReturnCode") == 0
              and isinstance(evidence.get("rootReadonlyWriteErrno"), int)
              and evidence.get("rootReadonlyWriteErrno") != 0
              and evidence.get("readonlyAttackReturnCode") != 0
              and evidence.get("physicalAuthorityCreated") is False
          )
          if not required:
              raise SystemExit(f"APFS evidence failed semantic checks: {evidence}")
          print("NEMBRA_UNMOUNT_STRUCTURED_CREDENTIAL_ACCEPTED=1")
          PY

      - name: Retain structured-credential diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-unmount-structured-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ runner.temp }}/nembra-unmount-structured-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Diff hygiene
        if: always()
        shell: bash
        env:
          UNMOUNT_PARENT_SHA: 3f404ab80c3c4029c3df2e1ce664504af9339362
        run: |
          set -euo pipefail
          git diff --check "$UNMOUNT_PARENT_SHA" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
