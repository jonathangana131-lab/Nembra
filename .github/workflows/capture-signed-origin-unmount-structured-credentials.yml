name: Capture Signed Origin Unmount Structured Credentials

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_signed_app_unmount_freeze_probe.py
      - scripts/ci/tests/test_capture_signed_app_unmount_freeze_structured_credentials.py
      - scripts/ci/tests/test_capture_signed_app_unmount_freeze_minimal_groups.py
      - .github/workflows/capture-signed-origin-unmount-freeze-probe.yml
      - .github/workflows/capture-signed-origin-unmount-structured-credentials.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-signed-origin-unmount-structured-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structured-credential-quiescence:
    name: Replay APFS quiescence without custom preexec credential shim
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind exact validation child to corrected #3004 parent
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UNMOUNT_PARENT_SHA: 3f404ab80c3c4029c3df2e1ce664504af9339362
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$UNMOUNT_PARENT_SHA" HEAD

          actual_paths="$RUNNER_TEMP/nembra-unmount-structured-paths.txt"
          expected_paths="$RUNNER_TEMP/nembra-unmount-structured-expected.txt"
          git diff --name-only "$UNMOUNT_PARENT_SHA"...HEAD | LC_ALL=C sort > "$actual_paths"
          cat > "$expected_paths" <<'EOF'
          .github/workflows/capture-signed-origin-unmount-structured-credentials.yml
          scripts/ci/tests/test_capture_signed_app_unmount_freeze_minimal_groups.py
          scripts/ci/tests/test_capture_signed_app_unmount_freeze_structured_credentials.py
          EOF
          LC_ALL=C sort -o "$expected_paths" "$expected_paths"
          diff -u "$expected_paths" "$actual_paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exact validation witness
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-unmount-structured-pycache"
          /usr/bin/python3 -m py_compile \
            scripts/ci/tests/test_capture_signed_app_unmount_freeze_probe.py \
            scripts/ci/tests/test_capture_signed_app_unmount_freeze_structured_credentials.py \
            scripts/ci/tests/test_capture_signed_app_unmount_freeze_minimal_groups.py
          /usr/bin/python3 - <<'PY'
          import inspect, subprocess
          parameters = inspect.signature(subprocess.Popen).parameters
          required = {"user", "group", "extra_groups"}
          missing = sorted(required.difference(parameters))
          if missing:
              raise SystemExit(f"runner Python lacks structured POSIX credential arguments: {missing}")
          print("NEMBRA_STRUCTURED_CREDENTIAL_ARGS_PRESENT=1")
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Retain pre-READY identity and APFS permission diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          diagnostic="$RUNNER_TEMP/nembra-structured-group-diagnostic.txt"
          sudo -n /usr/bin/python3 -B -I - >"$diagnostic" 2>&1 <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import pwd
          import shutil
          import subprocess
          import tempfile

          helper_path = Path("scripts/ci/tests/test_capture_signed_app_unmount_freeze_probe.py").resolve()
          spec = importlib.util.spec_from_file_location("nembra_unmount_group_diag_helper", helper_path)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load APFS helper")
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)

          uid = int(os.environ["SUDO_UID"])
          gid = int(os.environ["SUDO_GID"])
          account = pwd.getpwuid(uid)
          normal_groups = sorted(set(os.getgrouplist(account.pw_name, gid)))
          capability_gid = helper.choose_capability_gid(normal_groups)
          capability_groups = sorted(set(normal_groups) | {capability_gid})
          workspace = Path(tempfile.mkdtemp(prefix="nembra-unmount-identity-diag.", dir="/private/tmp"))
          image = workspace / "diag.sparseimage"
          mountpoint = workspace / "mount"
          mountpoint.mkdir()
          device = None
          try:
              os.chown(workspace, 0, capability_gid)
              os.chmod(workspace, 0o710)
              helper.hdiutil_create(image)
              device = helper.hdiutil_attach(image, mountpoint, readonly=False)
              os.chown(mountpoint, 0, capability_gid)
              os.chmod(mountpoint, 0o770)
              target = mountpoint / "compiler-output.bin"
              target.write_bytes(b"DIAGNOSTIC\n")
              os.chown(target, uid, capability_gid)
              os.chmod(target, 0o660)

              mount_output = subprocess.run(
                  ["/sbin/mount"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              ).stdout
              mount_line = next(
                  (line for line in mount_output.splitlines() if f" on {mountpoint} " in line),
                  "",
              )
              child_code = r'''
          import json
          import os
          from pathlib import Path
          import sys

          target = Path(sys.argv[1])
          paths = [target.parent.parent, target.parent, target]
          payload = {
              "uid": os.getuid(),
              "euid": os.geteuid(),
              "gid": os.getgid(),
              "egid": os.getegid(),
              "groups": os.getgroups(),
              "paths": [],
          }
          for path in paths:
              try:
                  stat = path.stat()
                  payload["paths"].append({
                      "path": str(path),
                      "uid": stat.st_uid,
                      "gid": stat.st_gid,
                      "mode": oct(stat.st_mode & 0o7777),
                      "read": os.access(path, os.R_OK),
                      "write": os.access(path, os.W_OK),
                      "execute": os.access(path, os.X_OK),
                  })
              except OSError as error:
                  payload["paths"].append({
                      "path": str(path),
                      "statErrno": error.errno,
                  })
          try:
              fd = os.open(target, os.O_WRONLY | os.O_APPEND)
              os.close(fd)
              payload["openSucceeded"] = True
          except OSError as error:
              payload["openSucceeded"] = False
              payload["openErrno"] = error.errno
          print("NEMBRA_STRUCTURED_GROUP_DIAGNOSTIC=" + json.dumps(payload, sort_keys=True))
          raise SystemExit(0 if payload["openSucceeded"] else 1)
          '''
              completed = subprocess.run(
                  ["/usr/bin/python3", "-I", "-c", child_code, str(target)],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
                  user=uid,
                  group=gid,
                  extra_groups=capability_groups,
              )
              parent_payload = {
                  "fieldUID": uid,
                  "fieldPrimaryGID": gid,
                  "normalGroups": normal_groups,
                  "capabilityGID": capability_gid,
                  "requestedGroups": capability_groups,
                  "mountLine": mount_line,
                  "childReturnCode": completed.returncode,
              }
              print("NEMBRA_STRUCTURED_GROUP_PARENT=" + json.dumps(parent_payload, sort_keys=True))
              print(completed.stdout, end="")
              print(completed.stderr, end="")
          finally:
              if device is not None:
                  helper.hdiutil_detach(device, force=True)
              shutil.rmtree(workspace, ignore_errors=True)
          PY
          rc=$?
          cat "$diagnostic"
          printf 'NEMBRA_STRUCTURED_GROUP_DIAGNOSTIC_RC=%s\n' "$rc"
          exit 0

      - name: Replay exact APFS quiescence oracle with minimal groups
        shell: bash
        run: |
          set -uo pipefail
          output_file="$RUNNER_TEMP/nembra-unmount-structured-output.txt"
          set +e
          sudo -n /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_unmount_freeze_minimal_groups.py \
            >"$output_file" 2>&1
          rc=$?
          set -e
          cat "$output_file"
          if [[ "$rc" != 0 ]]; then
            diagnostic="$(tail -n 160 "$output_file" | /usr/bin/python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            printf '::error title=Structured-credential unmount validation failed::%s\n' "$diagnostic"
            exit "$rc"
          fi
          /usr/bin/python3 - "$output_file" <<'PY'
          import json
          from pathlib import Path
          import sys
          marker = "NEMBRA_UNMOUNT_STRUCTURED_CREDENTIAL_JSON="
          records = [
              line[len(marker):]
              for line in Path(sys.argv[1]).read_text().splitlines()
              if line.startswith(marker)
          ]
          if len(records) != 1:
              raise SystemExit(f"expected one APFS evidence record, found {len(records)}")
          evidence = json.loads(records[0])
          required = (
              evidence.get("structuredCredentialLaunch") is True
              and evidence.get("normalGroupsContainCapability") is False
              and evidence.get("pathAttackReturnCode") != 0
              and evidence.get("firstDetachReturnCode") != 0
              and evidence.get("heldDescriptorPostLockWrite") == "write-ok"
              and evidence.get("secondDetachReturnCode") == 0
              and isinstance(evidence.get("rootReadonlyWriteErrno"), int)
              and evidence.get("rootReadonlyWriteErrno") != 0
              and evidence.get("readonlyAttackReturnCode") != 0
              and evidence.get("physicalAuthorityCreated") is False
          )
          if not required:
              raise SystemExit(f"APFS evidence failed semantic checks: {evidence}")
          print("NEMBRA_UNMOUNT_STRUCTURED_CREDENTIAL_ACCEPTED=1")
          PY

      - name: Retain structured-credential diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-unmount-structured-${{ github.event.pull_request.number || github.run_id }}
          path: |
            ${{ runner.temp }}/nembra-unmount-structured-output.txt
            ${{ runner.temp }}/nembra-structured-group-diagnostic.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Diff hygiene
        if: always()
        shell: bash
        env:
          UNMOUNT_PARENT_SHA: 3f404ab80c3c4029c3df2e1ce664504af9339362
        run: |
          set -euo pipefail
          git diff --check "$UNMOUNT_PARENT_SHA" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
