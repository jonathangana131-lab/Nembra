name: TEMP Capture Downstream Authority Recovery

on:
  push:
    branches:
      - repair/v14-capture-downstream-authority-recovery-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-downstream-authority-recovery-sol-20260811
          fetch-depth: 0
      - name: Bind recovery input head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize reviewed authority-chain payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow_path = Path('.github/workflows/capture-authority-chain-materialize.yml')
          lines = workflow_path.read_text().splitlines()
          marker = "          python3 - <<'PY'"
          starts = [index for index, line in enumerate(lines) if line == marker]
          if not starts:
              raise SystemExit('authority materializer payload start not found')
          start = starts[0]
          ends = [index for index, line in enumerate(lines) if index > start and line == '          PY']
          if not ends:
              raise SystemExit('authority materializer payload terminator not found')
          end = ends[-1]
          payload_lines = lines[start + 1:end]
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload_lines) + '\n'
          old_helper = (
              'def replace_once(text: str, old: str, new: str, label: str) -> str:\n'
              '    count = text.count(old)\n'
              '    if count != 1:\n'
              '        raise SystemExit(f"{label}: expected one match, found {count}")\n'
              '    return text.replace(old, new, 1)\n'
          )
          new_helper = (
              'def replace_once(text: str, old: str, new: str, label: str) -> str:\n'
              '    count = text.count(old)\n'
              '    if label == "bootstrap review helper output" and count == 2:\n'
              '        return text.replace(old, new, 1)\n'
              '    if count != 1:\n'
              '        raise SystemExit(f"{label}: expected one match, found {count}")\n'
              '    return text.replace(old, new, 1)\n'
          )
          if payload.count(old_helper) != 1:
              raise SystemExit('recovery replace_once definition is not unique')
          payload = payload.replace(old_helper, new_helper, 1)
          try:
              exec(compile(payload, '<capture-authority-materializer>', 'exec'), {})
          except BaseException as error:
              message = f'{type(error).__name__}: {error}'.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Authority materializer failure::{message}')
              raise
          PY
      - name: Normalize recovered authority loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Scripts/capture_tuya_private_input_build_guard.py')
          text = path.read_text()
          start_marker = 'def _load_accepted_helper_module(filename: str, module_name: str, environment_name: str):\n'
          end_marker = '@dataclass(frozen=True)\nclass PrivateInputs:'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('recovered authority-loader boundaries not found')
          replacement = """def _load_accepted_helper_module(filename: str, module_name: str, environment_name: str):
              expected = os.environ.get(environment_name, "").lower()
              if len(expected) != 64 or any(character not in "0123456789abcdef" for character in expected):
                  raise BuildGuardError(f"{environment_name} must remain available as exactly 64 hex characters through build-window admission")
              helper = Path(__file__).with_name(filename)
              flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
              try:
                  descriptor = os.open(helper, flags)
              except OSError as error:
                  raise BuildGuardError(f"accepted authority helper could not be opened under descriptor custody: {filename}") from error
              try:
                  before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1:
                      raise BuildGuardError(f"accepted authority helper is not one regular single-link file: {filename}")
                  if before.st_size <= 0 or before.st_size > AUTHORITY_HELPER_MAX_BYTES:
                      raise BuildGuardError(f"accepted authority helper size is outside the accepted bound: {filename}")
                  chunks: list[bytes] = []
                  remaining = before.st_size
                  while remaining:
                      chunk = os.read(descriptor, min(65_536, remaining))
                      if not chunk:
                          raise BuildGuardError(f"accepted authority helper changed during descriptor read: {filename}")
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  source = b"".join(chunks)
                  after = os.fstat(descriptor)
                  if _stat_identity(before) != _stat_identity(after):
                      raise BuildGuardError(f"accepted authority helper changed during descriptor custody: {filename}")
              finally:
                  os.close(descriptor)
              actual = hashlib.sha256(source).hexdigest()
              if not hmac.compare_digest(actual, expected):
                  raise BuildGuardError(f"accepted authority helper source does not match externally reviewed authority: {filename}")
              module = types.ModuleType(module_name)
              module.__file__ = f"<accepted-{filename}>"
              try:
                  exec(compile(source, module.__file__, "exec"), module.__dict__)
              except Exception as error:
                  raise BuildGuardError(f"accepted authority helper source could not be loaded: {filename}") from error
              return module


          class _AuthorityHelperProxy:
              def __init__(self, filename: str, module_name: str, environment_name: str) -> None:
                  self._filename = filename
                  self._module_name = module_name
                  self._environment_name = environment_name
                  self._module = None

              def require_accepted(self):
                  self._module = _load_accepted_helper_module(self._filename, self._module_name, self._environment_name)
                  return self._module

              def __getattr__(self, name: str):
                  if self._module is None:
                      self._module = _load_neighbor_module(self._filename, self._module_name)
                  return getattr(self._module, name)


          provenance = _AuthorityHelperProxy(
              "capture_tuya_private_input_provenance.py",
              "capture_tuya_private_input_provenance",
              PROVENANCE_HELPER_ENV,
          )
          generated_build = _AuthorityHelperProxy(
              "capture_cocoapods_generated_build_subject.py",
              "capture_cocoapods_generated_build_subject",
              GENERATED_BUILD_SUBJECT_HELPER_ENV,
          )


          def _load_accepted_private_review_module():
              return _load_accepted_helper_module(
                  "capture_private_review_commitment.py",
                  "capture_private_review_commitment_accepted",
                  PRIVATE_REVIEW_HELPER_ENV,
              )


          """
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          bash -n scripts/field/install_one_time_capture.command
      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            Scripts/capture_tuya_private_input_build_guard.py
            scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py
            scripts/ci/tests/test_capture_private_review_commitment.py
            scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
            scripts/ci/tests/test_capture_private_review_helper_execution_custody.py
          )
          for file in "${files[@]}"; do python3 -m py_compile "$file"; done
      - name: Downstream authority red team
        run: python3 -m unittest -v scripts.ci.tests.test_capture_private_review_downstream_helper_execution_custody
      - name: Existing private-review helper custody
        shell: bash
        run: |
          set -euo pipefail
          if ! output="$(python3 -m unittest -v scripts.ci.tests.test_capture_private_review_helper_execution_custody 2>&1)"; then
            message="$(printf '%s' "$output" | tail -80 | tr '\n' '|' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Private-review helper custody regression::$message"
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check
      - name: Publish clean recovery head
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/capture-authority-chain-materialize.yml
          rm -f .github/capture-authority-chain-materialize-trigger
          rm -f .github/workflows/tmp-v14-capture-downstream-authority-recovery.yml
          find scripts Scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Capture: bind downstream authority helper execution subjects'
          git push origin HEAD:repair/v14-capture-downstream-authority-recovery-sol-20260811
