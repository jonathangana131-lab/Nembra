name: Capture Signed Origin Detached Directory FD Red Team

on:
  pull_request:
    paths:
      - scripts/ci/capture_signed_app_build_origin_custody.py
      - scripts/ci/tests/test_capture_signed_app_detached_dirfd_red_team.py
      - .github/workflows/capture-signed-origin-detached-dirfd-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-signed-origin-detached-dirfd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detached-directory-fd:
    name: Prove nested directory FD survives top-level output lock
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact red-team child to current signed-origin production parent
        shell: bash
        env:
          PRODUCTION_PARENT: a71cc55dbc2281791e327888cf89ce0db6cf6193
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$PRODUCTION_PARENT" HEAD
          actual_paths="$RUNNER_TEMP/nembra-dirfd-paths.txt"
          expected_paths="$RUNNER_TEMP/nembra-dirfd-expected.txt"
          git diff --name-only "$PRODUCTION_PARENT"...HEAD | LC_ALL=C sort > "$actual_paths"
          cat > "$expected_paths" <<'EOF'
          .github/workflows/capture-signed-origin-detached-dirfd-redteam.yml
          scripts/ci/tests/test_capture_signed_app_detached_dirfd_red_team.py
          EOF
          LC_ALL=C sort -o "$expected_paths" "$expected_paths"
          diff -u "$expected_paths" "$actual_paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile detached-directory-FD witness
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-dirfd-pycache"
          /usr/bin/python3 -m py_compile \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_detached_dirfd_red_team.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Demonstrate retained nested directory authority after root lock
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_detached_dirfd_red_team.py

      - name: Diff hygiene
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PRODUCTION_PARENT" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
