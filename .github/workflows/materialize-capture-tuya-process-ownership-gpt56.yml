name: Materialize Capture Tuya Process Ownership Fence

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed process-lifetime ownership fence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()

          replacements = [
              (
                  '    private var driver: OfficialTuyaDriver?\n    private var events: [Event] = []',
                  '    private var driver: OfficialTuyaDriver?\n    // Once the official Tuya SDK begins BLE ownership, package-owned CoreBluetooth\n    // discovery stays closed for the rest of this app process. Relaunch is the only\n    // supported way to return to discovery; reset/unbind/disconnect commands are not used.\n    private var officialTuyaOwnershipStarted = false\n    private var events: [Event] = []'
              ),
              (
                  '''    func startBaseline() {\n        guard central.state == .poweredOn else {''',
                  '''    func startBaseline() {\n        guard !officialTuyaOwnershipStarted else {\n            fail(\n                "Tuya's official BLE ownership already started in this app process. Relaunch Nembra Capture before package discovery; Nembra will not reopen CoreBluetooth discovery.",\n                "package_discovery_blocked_after_tuya_ownership"\n            )\n            return\n        }\n        guard central.state == .poweredOn else {'''
              ),
              (
                  '''    func scanAfterPowerOn() {\n        guard central.state == .poweredOn else {''',
                  '''    func scanAfterPowerOn() {\n        guard !officialTuyaOwnershipStarted else {\n            fail(\n                "Tuya's official BLE ownership already started in this app process. Relaunch Nembra Capture before package discovery; Nembra will not reopen CoreBluetooth discovery.",\n                "package_discovery_blocked_after_tuya_ownership"\n            )\n            return\n        }\n        guard central.state == .poweredOn else {'''
              ),
              (
                  '''        central.stopScan()\n        driver = newDriver\n        watchdog?.cancel()''',
                  '''        // Latch before any supported Tuya connection work can begin. From this\n        // point onward Nembra must never start package-owned CoreBluetooth discovery\n        // again in this process, even if authentication later fails.\n        officialTuyaOwnershipStarted = true\n        central.stopScan()\n        driver = newDriver\n        watchdog?.cancel()'''
              ),
              (
                  '''    private func resetDiscovery() {\n        central.stopScan()''',
                  '''    private func resetDiscovery() {\n        guard !officialTuyaOwnershipStarted else {\n            central.stopScan()\n            log("discovery_reset_blocked_after_tuya_ownership")\n            return\n        }\n        central.stopScan()'''
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'guard failed: expected exactly one source match, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

      - name: Verify ownership invariant and read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          assert 'private var officialTuyaOwnershipStarted = false' in s
          assert s.count('guard !officialTuyaOwnershipStarted else {') >= 3
          connect = s.index('newDriver.connect(')
          latch = s.index('officialTuyaOwnershipStarted = true')
          assert latch < connect
          reset = s[s.index('private func resetDiscovery()'):s.index('private func fail(', s.index('private func resetDiscovery()'))]
          assert 'officialTuyaOwnershipStarted = false' not in reset
          for forbidden in ('.writeValue(', 'publishDps', 'queryDps', 'resetFactory', 'removeDevice(', 'unbindDevice('):
              assert forbidden not in s, forbidden
          assert 'connectBLE(' in s
          assert 'dpsUpdate' in s
          PY
          git diff --check

      - name: Remove one-shot materializer
        run: rm .github/workflows/materialize-capture-tuya-process-ownership-gpt56.yml

      - name: Commit runtime repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/materialize-capture-tuya-process-ownership-gpt56.yml
          git commit -m 'fix(capture): latch Tuya BLE ownership for process lifetime'
          git push origin HEAD:capture/one-time-ble-dump-gpt56
