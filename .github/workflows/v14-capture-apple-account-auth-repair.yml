name: V14 Capture Apple Account Auth Repair

on:
  push:
    branches:
      - product/v14-capture-guided-apple-auth-sol

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Apple-account auth patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/apply_capture_apple_account_auth.py
          python3 scripts/ci/apply_capture_apple_account_auth.py

      - name: Validate focused source contracts
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppleAccountLoginSourceTests.swift
          plutil -lint NembraCapture.entitlements || python3 - <<'PY'
          import plistlib
          with open('NembraCapture.entitlements', 'rb') as f:
              p = plistlib.load(f)
          assert p['com.apple.developer.applesignin'] == ['Default']
          PY
          grep -Fq 'SignInWithAppleButton(.signIn)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'withType: "ap"' NembraApp/App/NembraCaptureEntrypoint.swift
          test "$(grep -Fc 'CODE_SIGN_ENTITLEMENTS = NembraCapture.entitlements;' NembraCapture.xcodeproj/project.pbxproj)" = 2
          git diff --check

      - name: Commit validated product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            NembraCapture.xcodeproj/project.pbxproj \
            NembraCapture.entitlements \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppleAccountLoginSourceTests.swift \
            docs/CAPTURE_P0_APPLE_ACCOUNT_LOGIN.md
          git diff --cached --check
          git commit -m 'feat(capture): support Tuya Apple-account login'
          git push origin HEAD:product/v14-capture-guided-apple-auth-sol
