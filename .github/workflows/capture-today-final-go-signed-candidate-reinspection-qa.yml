name: Capture TODAY Final GO Signed Candidate Reinspection QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_signed_candidate_reinspection.py
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_signed_candidate_reinspection.py
      - scripts/ci/tests/test_es80_today_final_go_hardened.py
      - .github/workflows/capture-today-final-go-signed-candidate-reinspection-qa.yml

permissions:
  contents: read

jobs:
  signed-candidate-reinspection:
    name: Bind signed candidate to fresh accepted-source inspector
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(/usr/bin/git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Compile reinspection implementation and tests
        run: |
          python3 -m py_compile scripts/ci/es80_today_signed_candidate_reinspection.py scripts/ci/tests/test_es80_today_signed_candidate_reinspection.py
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py scripts/ci/tests/test_es80_today_final_go_hardened.py

      - name: Verify signed-candidate reinspection custody mechanics
        run: python3 scripts/ci/tests/test_es80_today_signed_candidate_reinspection.py -v

      - name: Preserve hardened Final GO composition
        run: python3 scripts/ci/tests/test_es80_today_final_go_hardened.py -v

      - name: Pin canonical reinspection contract
        run: |
          set -euo pipefail
          grep -Fq 'fresh-accepted-source-signed-inspector-v1' scripts/ci/es80_today_signed_candidate_reinspection.py
          grep -Fq '"cat-file", "blob", blob' scripts/ci/es80_today_signed_candidate_reinspection.py
          grep -Fq '"--canonical-inspector-fd"' scripts/ci/es80_today_signed_candidate_reinspection.py
          grep -Fq 'pass_fds=(descriptor,)' scripts/ci/es80_today_signed_candidate_reinspection.py
          grep -Fq 'retained {label} is not exact fresh accepted-source inspector output' scripts/ci/es80_today_signed_candidate_reinspection.py

      - name: Check patch whitespace
        run: /usr/bin/git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
