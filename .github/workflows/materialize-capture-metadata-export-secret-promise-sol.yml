name: Materialize Capture metadata export secret repair

on:
  push:
    branches:
      - repair/v14-capture-metadata-export-secret-promise-870-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact scaffold
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-capture-metadata-export-secret-promise-sol.yml"
      - name: Apply exact two-path repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bridge_path = Path("NembraApp/Features/Research/TuyaAccountBridge.swift")
          bridge = bridge_path.read_text()
          old_classifier = '            let secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "sessionkey", "seckey", "authkey"]\n'
          classifier_lines = [
              '            let secretKeyFragments = [',
              '                "localkey",',
              '                "sessionkey",',
              '                "appkey",',
              '                "appsecret",',
              '                "password",',
              '                "accounttoken",',
              '                "accesstoken",',
              '                "refreshtoken",',
              '                "seckey",',
              '                "authkey",',
              '            ]',
              '',
          ]
          if bridge.count(old_classifier) != 1:
              raise SystemExit("metadata classifier anchor mismatch")
          bridge = bridge.replace(old_classifier, "\n".join(classifier_lines), 1)

          replacements = [
              ('            "specifications": selectedDeviceSpecifications ?? [:],',
               '            "specifications": Self.redactSecrets(selectedDeviceSpecifications ?? [:]),'),
              ('            "localStrategy": selectedDeviceLocalStrategy ?? [:],',
               '            "localStrategy": Self.redactSecrets(selectedDeviceLocalStrategy ?? [:]),'),
          ]
          for old, new in replacements:
              if bridge.count(old) != 1:
                  raise SystemExit(f"metadata export anchor mismatch: {old}")
              bridge = bridge.replace(old, new, 1)
          bridge_path.write_text(bridge)

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift")
          test = test_path.read_text()
          expectation_anchor = '        #expect(body.contains("localkey"))\n'
          added_expectations = "".join([
              '        #expect(body.contains("appkey"))\n',
              '        #expect(body.contains("appsecret"))\n',
              '        #expect(body.contains("password"))\n',
              '        #expect(body.contains("accounttoken"))\n',
          ])
          if test.count(expectation_anchor) != 1:
              raise SystemExit("metadata regression expectation anchor mismatch")
          test = test.replace(expectation_anchor, expectation_anchor + added_expectations, 1)

          test_anchor = '    @Test("linked device UI state does not retain raw device dictionaries or local key")\n'
          extra_lines = [
              '    @Test("final metadata export re-sanitizes every opaque payload")',
              '    func finalExportReSanitizesAllOpaquePayloads() throws {',
              '        let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")',
              '        let export = String(try section(in: bridge, from: "func prepareRedactedExport()", to: "func resetLink()"))',
              '',
              '        #expect(export.contains("\\\"status\\\": Self.redactSecrets(selectedDeviceStatus ?? [:])"))',
              '        #expect(export.contains("\\\"specifications\\\": Self.redactSecrets(selectedDeviceSpecifications ?? [:])"))',
              '        #expect(export.contains("\\\"localStrategy\\\": Self.redactSecrets(selectedDeviceLocalStrategy ?? [:])"))',
              '        #expect(export.contains("envelope[\\\"deviceDetailRedacted\\\"] = Self.redactSecrets(selectedDeviceMetadata)"))',
              '    }',
              '',
              '',
          ]
          if test.count(test_anchor) != 1:
              raise SystemExit("metadata final-custody test anchor mismatch")
          test_path.write_text(test.replace(test_anchor, "\n".join(extra_lines) + test_anchor, 1))
          PY
          git diff --check
          swiftc -parse NembraApp/Features/Research/TuyaAccountBridge.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift
          grep -q '"appsecret"' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -q '"accounttoken"' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -q '"specifications": Self.redactSecrets' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -q '"localStrategy": Self.redactSecrets' NembraApp/Features/Research/TuyaAccountBridge.swift
      - name: Commit clean repair
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-metadata-export-secret-promise-sol.yml
          git config user.name "nembra-v14-sol"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git diff --cached --check
          git commit -m "fix(capture): harden metadata export secret custody"
          git push origin HEAD:repair/v14-capture-metadata-export-secret-promise-870-sol
