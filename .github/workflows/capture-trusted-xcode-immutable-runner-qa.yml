name: Capture Trusted Xcode Immutable Runner QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/capture-xcode27-trusted-command.yml
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/tests/test_es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/tests/test_capture_trusted_xcode_immutable_runner_execution.py
      - .github/workflows/capture-trusted-xcode-immutable-runner-qa.yml

permissions:
  contents: read

jobs:
  immutable-runner:
    name: Require immutable trusted Simulator runner execution
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable repair head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile trust verifier and regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_trusted_capture_xcode_subject.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_trusted_capture_xcode_subject.py
          python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_immutable_runner_execution.py
      - name: Validate trusted Xcode subject behavior
        run: python3 scripts/ci/tests/test_es80_today_trusted_capture_xcode_subject.py -v
      - name: Validate immutable authority runner execution
        run: python3 scripts/ci/tests/test_capture_trusted_xcode_immutable_runner_execution.py -v
