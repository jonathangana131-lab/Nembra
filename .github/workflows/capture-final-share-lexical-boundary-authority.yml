name: Capture Final Share Lexical Boundary Authority QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - NembraApp/Features/Research/ES80CaptureShellView.swift
      - .github/workflows/capture-final-share-conditional-authority.yml
      - .github/workflows/capture-final-share-regex-lexical-authority.yml
      - .github/workflows/capture-final-share-lexical-boundary-authority.yml

permissions:
  contents: read

jobs:
  exact-head-lexical-boundary-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          printf 'Expected exact PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Reject Swift lexical authority bypasses around final Share
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          class ContractViolation(Exception):
              pass

          signature = "private func prepareFinalShareForAnalysisAndSharing()"
          retained_anchor = "if finalShareData != nil,"
          directive = re.compile(r"(?m)^[ \t]*#[ \t]*(if|elseif|else|endif)\b")

          def mask_range(masked: list[str], start: int, end: int) -> None:
              for index in range(start, end):
                  if masked[index] != "\n":
                      masked[index] = " "

          def string_opener(text: str, index: int):
              cursor = index
              while cursor < len(text) and text[cursor] == "#":
                  cursor += 1
              hashes = cursor - index
              if text.startswith('"""', cursor):
                  return hashes, True, cursor + 3
              if cursor < len(text) and text[cursor] == '"':
                  return hashes, False, cursor + 1
              return None

          def mask_noncode(text: str) -> str:
              """Mask comments/string literal text while preserving executable interpolation code."""
              masked = list(text)

              def scan_line_comment(index: int) -> int:
                  mask_range(masked, index, index + 2)
                  index += 2
                  while index < len(text) and text[index] != "\n":
                      masked[index] = " "
                      index += 1
                  return index

              def scan_block_comment(index: int) -> int:
                  depth = 1
                  mask_range(masked, index, index + 2)
                  index += 2
                  while index < len(text):
                      if text.startswith("/*", index):
                          mask_range(masked, index, index + 2)
                          depth += 1
                          index += 2
                          continue
                      if text.startswith("*/", index):
                          mask_range(masked, index, index + 2)
                          depth -= 1
                          index += 2
                          if depth == 0:
                              return index
                          continue
                      if text[index] != "\n":
                          masked[index] = " "
                      index += 1
                  raise ContractViolation("unterminated Swift lexical state: block-comment")

              def scan_interpolation(index: int) -> int:
                  # The interpolation opener's '(' is already masked. Keep executable contents
                  # visible, recursively masking nested comments/strings, until its matching ')'.
                  parenthesis_depth = 1
                  while index < len(text):
                      if text.startswith("//", index):
                          index = scan_line_comment(index)
                          continue
                      if text.startswith("/*", index):
                          index = scan_block_comment(index)
                          continue

                      opener = string_opener(text, index)
                      if opener is not None:
                          hashes, multiline, end = opener
                          index = scan_string(index, hashes, multiline, end)
                          continue

                      character = text[index]
                      if character == "(":
                          parenthesis_depth += 1
                      elif character == ")":
                          parenthesis_depth -= 1
                          if parenthesis_depth == 0:
                              masked[index] = " "
                              return index + 1
                      index += 1
                  raise ContractViolation("unterminated Swift lexical state: string-interpolation")

              def scan_string(start: int, hashes: int, multiline: bool, content_start: int) -> int:
                  mask_range(masked, start, content_start)
                  index = content_start
                  quote = '"""' if multiline else '"'
                  closing = quote + ("#" * hashes)
                  interpolation = "\\" + ("#" * hashes) + "("

                  while index < len(text):
                      if text.startswith(closing, index):
                          mask_range(masked, index, index + len(closing))
                          return index + len(closing)

                      if text.startswith(interpolation, index):
                          mask_range(masked, index, index + len(interpolation))
                          index = scan_interpolation(index + len(interpolation))
                          continue

                      # Ordinary strings use backslash escapes. Extended/raw strings do not treat
                      # bare backslash as an escape; only the exact hash-count interpolation opener
                      # above crosses back into executable code.
                      if hashes == 0 and text[index] == "\\" and index + 1 < len(text):
                          mask_range(masked, index, index + 2)
                          index += 2
                          continue

                      if text[index] != "\n":
                          masked[index] = " "
                      index += 1

                  raise ContractViolation("unterminated Swift lexical state: string")

              index = 0
              while index < len(text):
                  if text.startswith("//", index):
                      index = scan_line_comment(index)
                      continue
                  if text.startswith("/*", index):
                      index = scan_block_comment(index)
                      continue

                  opener = string_opener(text, index)
                  if opener is not None:
                      hashes, multiline, end = opener
                      index = scan_string(index, hashes, multiline, end)
                      continue

                  index += 1

              return "".join(masked)

          def validate_source(source: str) -> tuple[int, int]:
              masked = mask_noncode(source)
              starts = [match.start() for match in re.finditer(re.escape(signature), masked)]
              if len(starts) != 1:
                  raise ContractViolation(
                      "expected exactly one lexical final Share authority declaration"
                  )

              start = starts[0]
              opening = masked.find("{", start + len(signature))
              if opening < 0:
                  raise ContractViolation("missing final Share function body")

              # A conditional that begins before the declaration can exclude the complete authority
              # function without adding braces. Reject any such enclosing compilation region.
              conditional_depth = 0
              for match in directive.finditer(masked):
                  if match.start() >= start:
                      break
                  kind = match.group(1)
                  if kind == "if":
                      conditional_depth += 1
                  elif kind == "endif":
                      conditional_depth -= 1
                      if conditional_depth < 0:
                          raise ContractViolation(
                              "unbalanced Swift conditional compilation before final Share function"
                          )
                  elif conditional_depth <= 0:
                      raise ContractViolation(
                          "orphan Swift conditional branch before final Share function"
                      )
              if conditional_depth != 0:
                  raise ContractViolation(
                      "final Share authority function must not be enclosed by Swift conditional compilation"
                  )

              # The authority function deliberately contains no code slash tokens. Reject a slash
              # before brace accounting can be confused by a Swift regex body containing braces.
              depth = 0
              end = None
              for index in range(opening, len(masked)):
                  character = masked[index]
                  if character == "/":
                      raise ContractViolation(
                          "final Share authority must not contain code slash tokens inside its lexical function body"
                      )
                  if character == "{":
                      depth += 1
                  elif character == "}":
                      depth -= 1
                      if depth < 0:
                          raise ContractViolation("unbalanced final Share function braces")
                      if depth == 0:
                          end = index + 1
                          break

              if end is None:
                  raise ContractViolation("unterminated final Share function body")

              if directive.search(masked, start, end):
                  raise ContractViolation(
                      "final Share authority function must not contain Swift conditional compilation"
                  )

              function_code = masked[start:end]
              if function_code.count(retained_anchor) != 1:
                  raise ContractViolation(
                      "expected exactly one retained final Share retry branch"
                  )
              return start, end

          source = Path(
              "NembraApp/Features/Research/ES80CaptureShellView.swift"
          ).read_text()

          try:
              start, end = validate_source(source)
          except ContractViolation as error:
              raise SystemExit(str(error)) from error

          closing_brace = source.rfind("\n    }", start, end)
          if closing_brace < 0:
              raise SystemExit(
                  "could not locate final Share closing brace for lexical-boundary self-test"
              )

          # Literal text, including fake member boundaries, slashes, directives, and braces, must
          # remain inert when it is genuinely inside an ordinary multiline string.
          harmless_multiline_literal = (
              source[:closing_brace]
              + '\n        let literalProbe = """\n'
              + "    private func restartExperiment()\n"
              + "    #if NEVER_ENABLED_IN_RELEASE\n"
              + "    /\\}/\n"
              + '        """\n'
              + "        _ = literalProbe\n"
              + source[closing_brace:]
          )
          try:
              validate_source(harmless_multiline_literal)
          except ContractViolation as error:
              raise SystemExit(
                  "checker self-test rejected inert ordinary multiline string contents"
              ) from error

          # Swift permits an escaped triple quote inside an ordinary multiline string. The old
          # masker exited early at the trailing quote sequence; all content here must stay inert.
          escaped_triple_quote_literal = (
              source[:closing_brace]
              + '\n        let escapedQuoteProbe = """\n'
              + "alpha\n"
              + '\\\"""\n'
              + "    private func restartExperiment()\n"
              + "    /\\}/\n"
              + "omega\n"
              + '        """\n'
              + "        _ = escapedQuoteProbe\n"
              + source[closing_brace:]
          )
          try:
              validate_source(escaped_triple_quote_literal)
          except ContractViolation as error:
              raise SystemExit(
                  "checker self-test rejected an escaped triple quote inside multiline string"
              ) from error

          # Extended/raw multiline strings close only on triple quote plus the matching hash count;
          # bare triple quotes, slashes, directives, and fake members remain literal content.
          harmless_raw_literal = (
              source[:closing_brace]
              + '\n        let rawProbe = #"""\n'
              + "alpha\n"
              + '"""\n'
              + "    private func restartExperiment()\n"
              + "    #if NEVER_ENABLED_IN_RELEASE\n"
              + "    #/\\}/#\n"
              + "omega\n"
              + '        """#\n'
              + "        _ = rawProbe\n"
              + source[closing_brace:]
          )
          try:
              validate_source(harmless_raw_literal)
          except ContractViolation as error:
              raise SystemExit(
                  "checker self-test rejected inert extended/raw multiline string contents"
              ) from error

          # String interpolation is executable Swift, not literal text. A slash/regex payload in an
          # ordinary interpolation must therefore be visible to the authority checker and rejected.
          interpolation_regex_bypass = (
              source[:closing_brace]
              + '\n        let interpolationProbe = "value: \\('
              + "{ let hidden = /\\}/; return hidden }()"
              + ')"\n'
              + "        _ = interpolationProbe\n"
              + source[closing_brace:]
          )
          try:
              validate_source(interpolation_regex_bypass)
          except ContractViolation:
              pass
          else:
              raise SystemExit(
                  "checker self-test accepted executable regex code inside string interpolation"
              )

          # Raw strings interpolate only with the matching hash count. The code inside \#(...) is
          # executable and must not be hidden with the surrounding literal text.
          raw_interpolation_regex_bypass = (
              source[:closing_brace]
              + '\n        let rawInterpolationProbe = #"value: \\#('
              + "{ let hidden = #/\\}/#; return hidden }()"
              + ')"#\n'
              + "        _ = rawInterpolationProbe\n"
              + source[closing_brace:]
          )
          try:
              validate_source(raw_interpolation_regex_bypass)
          except ContractViolation:
              pass
          else:
              raise SystemExit(
                  "checker self-test accepted executable regex code inside raw string interpolation"
              )

          # Conditional compilation inside interpolation is executable authority as well.
          interpolation_conditional_bypass = (
              source[:closing_brace]
              + '\n        let conditionalProbe = "value: \\('
              + "{\n#if NEVER_ENABLED_IN_RELEASE\nreturn 1\n#else\nreturn 2\n#endif\n}()"
              + ')"\n'
              + "        _ = conditionalProbe\n"
              + source[closing_brace:]
          )
          try:
              validate_source(interpolation_conditional_bypass)
          except ContractViolation:
              pass
          else:
              raise SystemExit(
                  "checker self-test accepted conditional compilation inside string interpolation"
              )

          nested_comment_literal = (
              source[:closing_brace]
              + "\n        /* outer { / #if\n"
              + "        /* nested private func restartExperiment() */\n"
              + "        } / #endif */\n"
              + source[closing_brace:]
          )
          try:
              validate_source(nested_comment_literal)
          except ContractViolation as error:
              raise SystemExit(
                  "checker self-test rejected inert nested-comment contents"
              ) from error

          print("final Share Swift lexical authority source contract: PASS")
          PY
