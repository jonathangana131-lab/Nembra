name: Capture Final Share Lexical Boundary Authority QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - NembraApp/Features/Research/ES80CaptureShellView.swift
      - .github/workflows/capture-final-share-conditional-authority.yml
      - .github/workflows/capture-final-share-regex-lexical-authority.yml
      - .github/workflows/capture-final-share-lexical-boundary-authority.yml

permissions:
  contents: read

jobs:
  exact-head-lexical-boundary-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          printf 'Expected exact PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Reject Swift lexical boundary spoofing around final Share authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          class ContractViolation(Exception):
              pass

          signature = "private func prepareFinalShareForAnalysisAndSharing()"
          retained_anchor = "if finalShareData != nil,"

          def mask_range(masked: list[str], start: int, end: int) -> None:
              for index in range(start, end):
                  if masked[index] != "\n":
                      masked[index] = " "

          def string_opener(text: str, index: int):
              cursor = index
              while cursor < len(text) and text[cursor] == "#":
                  cursor += 1
              hashes = cursor - index
              if text.startswith('"""', cursor):
                  return hashes, True, cursor + 3
              if cursor < len(text) and text[cursor] == '"':
                  return hashes, False, cursor + 1
              return None

          def mask_comments_and_strings(text: str) -> str:
              """Preserve offsets/newlines while hiding Swift comments and all string delimiters."""
              masked = list(text)
              index = 0
              state = "code"
              block_depth = 0
              string_hashes = 0
              string_multiline = False

              while index < len(text):
                  if state == "code":
                      if text.startswith("//", index):
                          mask_range(masked, index, index + 2)
                          index += 2
                          state = "line-comment"
                          continue
                      if text.startswith("/*", index):
                          mask_range(masked, index, index + 2)
                          index += 2
                          state = "block-comment"
                          block_depth = 1
                          continue

                      opener = string_opener(text, index)
                      if opener is not None:
                          string_hashes, string_multiline, end = opener
                          mask_range(masked, index, end)
                          index = end
                          state = "string"
                          continue

                      index += 1
                      continue

                  if state == "line-comment":
                      if text[index] == "\n":
                          state = "code"
                      else:
                          masked[index] = " "
                      index += 1
                      continue

                  if state == "block-comment":
                      if text.startswith("/*", index):
                          mask_range(masked, index, index + 2)
                          block_depth += 1
                          index += 2
                          continue
                      if text.startswith("*/", index):
                          mask_range(masked, index, index + 2)
                          block_depth -= 1
                          index += 2
                          if block_depth == 0:
                              state = "code"
                          continue
                      if text[index] != "\n":
                          masked[index] = " "
                      index += 1
                      continue

                  if state == "string":
                      quote = '"""' if string_multiline else '"'
                      closing = quote + ("#" * string_hashes)
                      if text.startswith(closing, index):
                          mask_range(masked, index, index + len(closing))
                          index += len(closing)
                          state = "code"
                          continue

                      # Ordinary Swift strings allow escaped quotes, including \""" inside a
                      # multiline string. Extended/raw strings close only on the quote delimiter
                      # followed by the exact opening hash count, so bare quotes remain content.
                      if string_hashes == 0 and text[index] == "\\" and index + 1 < len(text):
                          mask_range(masked, index, index + 2)
                          index += 2
                          continue

                      if text[index] != "\n":
                          masked[index] = " "
                      index += 1
                      continue

              if state != "code":
                  raise ContractViolation("unterminated Swift lexical state: " + state)
              return "".join(masked)

          def validate_source(source: str) -> tuple[int, int]:
              masked = mask_comments_and_strings(source)
              starts = [match.start() for match in re.finditer(re.escape(signature), masked)]
              if len(starts) != 1:
                  raise ContractViolation(
                      "expected exactly one lexical final Share authority declaration"
                  )

              start = starts[0]
              opening = masked.find("{", start + len(signature))
              if opening < 0:
                  raise ContractViolation("missing final Share function body")

              # The authority function deliberately contains no code slash tokens. Reject a slash
              # before brace accounting can be confused by a Swift regex body containing braces.
              depth = 0
              end = None
              for index in range(opening, len(masked)):
                  character = masked[index]
                  if character == "/":
                      raise ContractViolation(
                          "final Share authority must not contain code slash tokens inside its lexical function body"
                      )
                  if character == "{":
                      depth += 1
                  elif character == "}":
                      depth -= 1
                      if depth < 0:
                          raise ContractViolation("unbalanced final Share function braces")
                      if depth == 0:
                          end = index + 1
                          break

              if end is None:
                  raise ContractViolation("unterminated final Share function body")

              function_source = source[start:end]
              if retained_anchor not in function_source:
                  raise ContractViolation("missing retained final Share retry branch")
              return start, end

          source = Path(
              "NembraApp/Features/Research/ES80CaptureShellView.swift"
          ).read_text()

          try:
              start, end = validate_source(source)
          except ContractViolation as error:
              raise SystemExit(str(error)) from error

          closing_brace = source.rfind("\n    }", start, end)
          if closing_brace < 0:
              raise SystemExit(
                  "could not locate final Share closing brace for lexical-boundary self-test"
              )

          harmless_fake_boundary = (
              source[:closing_brace]
              + '\n        let lexicalBoundaryDocumentation = """\n'
              + "    private func restartExperiment()\n"
              + '        """\n'
              + "        _ = lexicalBoundaryDocumentation\n"
              + source[closing_brace:]
          )
          try:
              validate_source(harmless_fake_boundary)
          except ContractViolation as error:
              raise SystemExit(
                  "checker self-test rejected a fake boundary confined to an ordinary multiline string"
              ) from error

          # Swift permits an escaped triple quote inside an ordinary multiline string. The prior
          # masker incorrectly treated the trailing triple quote as a terminator, exposing a fake
          # restartExperiment member boundary and allowing later authority code to evade scanning.
          escaped_triple_quote_bypass = (
              source[:closing_brace]
              + '\n        let lexicalEscapedQuoteDocumentation = """\n'
              + "alpha\n"
              + '\\\"""\n'
              + "    private func restartExperiment()\n"
              + "omega\n"
              + '        """\n'
              + "        _ = lexicalEscapedQuoteDocumentation\n"
              + "        let lexicalBareBraceProbe = /\\}/\n"
              + "        _ = lexicalBareBraceProbe\n"
              + source[closing_brace:]
          )
          try:
              validate_source(escaped_triple_quote_bypass)
          except ContractViolation:
              pass
          else:
              raise SystemExit(
                  "checker self-test accepted an escaped-triple-quote lexical boundary bypass"
              )

          # Extended/raw multiline strings close only on triple quote + the matching hash count.
          # Bare triple quotes are legal content. The prior masker stopped at those bare quotes,
          # exposing the fake boundary below and truncating inspection before the regex payload.
          raw_string_boundary_bypass = (
              source[:closing_brace]
              + '\n        let lexicalRawDocumentation = #"""\n'
              + "alpha\n"
              + '"""\n'
              + "    private func restartExperiment()\n"
              + "omega\n"
              + '        """#\n'
              + "        _ = lexicalRawDocumentation\n"
              + "        let lexicalExtendedBraceProbe = #/\\}/#\n"
              + "        _ = lexicalExtendedBraceProbe\n"
              + source[closing_brace:]
          )
          try:
              validate_source(raw_string_boundary_bypass)
          except ContractViolation:
              pass
          else:
              raise SystemExit(
                  "checker self-test accepted a raw-string lexical boundary bypass"
              )

          comment_boundary_bypass = (
              source[:closing_brace]
              + "\n        /* outer\n"
              + "        /* nested */\n"
              + "    private func restartExperiment()\n"
              + "        */\n"
              + "        let lexicalCommentBraceProbe = /\\}/\n"
              + "        _ = lexicalCommentBraceProbe\n"
              + source[closing_brace:]
          )
          try:
              validate_source(comment_boundary_bypass)
          except ContractViolation:
              pass
          else:
              raise SystemExit(
                  "checker self-test accepted a nested-comment lexical boundary bypass"
              )

          print("final Share Swift lexical boundary authority source contract: PASS")
          PY
