name: TMP Export Corrected Field Provenance Sol

on:
  push:
    branches:
      - recovery/v14-field-compiler-window-2907-sol-20260811
    paths:
      - .github/workflows/tmp-export-corrected-field-provenance-sol.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind exact exporter checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Generate corrected canonical Field workflow
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/capture-field-build-provenance.yml').read_text(encoding='utf-8')

          trigger_anchor = '      - scripts/ci/tests/test_capture_field_accepted_source_path_contract.py\n'
          vnode_trigger = '      - scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n'
          if vnode_trigger not in source:
              if source.count(trigger_anchor) != 1:
                  raise SystemExit('Field vnode trigger anchor drifted')
              source = source.replace(trigger_anchor, trigger_anchor + vnode_trigger, 1)

          step_anchor = '      - name: Verify source contract\n'
          vnode_step = '''      - name: Validate compiler-window vnode attribute custody\n        shell: bash\n        run: |\n          set -euo pipefail\n          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n\n'''
          if vnode_step not in source:
              if source.count(step_anchor) != 1:
                  raise SystemExit('Field vnode step anchor drifted')
              source = source.replace(step_anchor, vnode_step + step_anchor, 1)

          old_runner = '''          grep -Fq 'NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE' "$installer"\n          grep -Fq '/usr/bin/python3 -I -B - "$PRIVATE_DEVICE_RUNNER"' "$installer"\n          grep -Fq 'read_private_identifier' "$installer"\n'''
          new_runner = '''          grep -Fq 'NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE' "$installer"\n          grep -Fq 'run_authority_git show "$SOURCE_SHA:scripts/ci/es80_signed_field_artifact_private_runner.py"' "$installer"\n          grep -Fq '/usr/bin/env -i' "$installer"\n          grep -Fq '/usr/bin/python3 -I -B -c' "$installer"\n          grep -Fq 'read_private_identifier' "$installer"\n          if grep -Fq '"$PRIVATE_DEVICE_RUNNER" "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE"' "$installer"; then\n            echo 'ERROR: private intended-device reader must execute from accepted Git bytes, not a mutable worktree pathname.' >&2\n            exit 1\n          fi\n'''
          if source.count(old_runner) != 1:
              raise SystemExit('stale Field private-runner contract drifted')
          source = source.replace(old_runner, new_runner, 1)

          old_build = '''          build_line="$(grep -nF -- '-- xcodebuild \\' "$installer" | sed -n '1s/:.*//p')"\n'''
          new_build = '''          build_line="$(grep -nF -- '-- /usr/bin/xcodebuild \\' "$installer" | sed -n '1s/:.*//p')"\n'''
          if source.count(old_build) != 1:
              raise SystemExit('stale Field xcodebuild source contract drifted')
          source = source.replace(old_build, new_build, 1)

          guard_anchor = '''          guard_line="$(grep -nF 'run_accepted_source_python "$TUYA_BUILD_WINDOW_GUARD_RELATIVE" \\' "$installer" | sed -n '1s/:.*//p')"\n'''
          tracked_checks = '''          grep -Fq -- '--accepted-source-root "$ROOT"' "$installer"\n          grep -Fq -- '--accepted-source-sha "$SOURCE_SHA"' "$installer"\n'''
          if tracked_checks not in source:
              if source.count(guard_anchor) != 1:
                  raise SystemExit('Field guarded-build source-contract anchor drifted')
              source = source.replace(guard_anchor, guard_anchor + tracked_checks, 1)

          forbidden = (
              '''grep -Fq '/usr/bin/python3 -I -B - "$PRIVATE_DEVICE_RUNNER"' "$installer"''',
              '''build_line="$(grep -nF -- '-- xcodebuild \\' "$installer"''',
          )
          for item in forbidden:
              if item in source:
                  raise SystemExit('retired Field source contract survived correction')
          required = (
              'test_capture_cocoapods_vnode_attribute_custody.py',
              'run_authority_git show "$SOURCE_SHA:scripts/ci/es80_signed_field_artifact_private_runner.py"',
              '--accepted-source-root "$ROOT"',
              '--accepted-source-sha "$SOURCE_SHA"',
              '-- /usr/bin/xcodebuild \\',
          )
          for item in required:
              if item not in source:
                  raise SystemExit(f'missing corrected Field contract: {item}')

          Path('/tmp/capture-field-build-provenance.yml').write_text(source, encoding='utf-8')
          PY
      - name: Retain corrected workflow
        uses: actions/upload-artifact@v6
        with:
          name: corrected-field-provenance-${{ github.sha }}
          path: /tmp/capture-field-build-provenance.yml
          retention-days: 2
          if-no-files-found: error
