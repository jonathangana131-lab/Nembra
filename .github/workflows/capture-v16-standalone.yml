name: Capture V16 Standalone Exact-Head

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'NembraCapture.xcodeproj/**'
      - 'NembraCapture-Info.plist'
      - 'NembraCapture.entitlements'
      - 'NembraCaptureUITests/**'
      - 'NembraApp/App/NembraCapture*.swift'
      - 'NembraApp/Features/Research/**'
      - 'NembraApp/Resources/Localizable.strings'
      - 'Packages/NembraBluetoothCapture/**'
      - 'Packages/NembraCore/**'
      - '.github/workflows/capture-app-authorization-close-one-shot.yml'
      - '.github/workflows/capture-app-authorization-race-safe-go.yml'
      - '.github/workflows/capture-v16-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v16-standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Test package and build standalone Capture
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      SOURCE_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
      MATERIALIZER_WORKFLOW: .github/workflows/capture-app-authorization-race-safe-go.yml

    steps:
      - name: Checkout immutable PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout dispatched ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify immutable PR head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          printf 'Expected exact head: %s\nActual checkout: %s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          test -f "$APP_SOURCE"
          test -f "$SOURCE_WORKFLOW"
          test -f "$MATERIALIZER_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Record toolchain
        run: |
          set -euo pipefail
          artifacts="${RUNNER_TEMP}/NembraCaptureSyntheticUIArtifacts"
          mkdir -p "$artifacts"
          xcodebuild -version | tee "$artifacts/xcode-version.txt"
          swift --version | tee "$artifacts/swift-version.txt"
          grep -Eq '^Xcode 27([.]|$)' "$artifacts/xcode-version.txt"
          git rev-parse --verify HEAD^{commit} > "$artifacts/exact-head-sha.txt"

      - name: Validate standalone project inputs
        run: |
          set -euo pipefail
          plutil -lint NembraCapture.xcodeproj/project.pbxproj
          plutil -lint NembraCapture-Info.plist
          plutil -lint NembraCapture.entitlements
          test -f 'NembraCapture.xcodeproj/xcshareddata/xcschemes/Nembra Capture.xcscheme'
          xcodebuild -list -project NembraCapture.xcodeproj

      - name: Compile Capture package against current Core
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift build

      - name: Materialize canonical lifecycle candidate in exact-head workspace
        shell: python
        run: |
          import os
          from pathlib import Path
          import textwrap

          workflow = Path(os.environ["MATERIALIZER_WORKFLOW"]).read_text(encoding="utf-8")
          marker = "      - name: Materialize canonical lifecycle transform\n"
          section = workflow.index(marker)
          run_marker = "        run: |\n"
          start = workflow.index(run_marker, section) + len(run_marker)
          end = workflow.index("\n      - name:", start)
          program = textwrap.dedent(workflow[start:end])
          required = [
              "SOURCE_WORKFLOW",
              "admitOFF1Start",
              "admitAuthenticationStart",
              "admitOfficialConnectionStart",
              "admitObservationStart",
              "freezeAcceptedArtifactForAuthorizationSeal",
              "sealAfterAcceptedArtifactFreeze",
              "app.write_text(source, encoding=\"utf-8\")",
          ]
          for token in required:
              if token not in program:
                  raise SystemExit(f"race-safe materializer missing required token: {token}")
          namespace = {
              "__name__": "__main__",
              "__file__": "<capture-v16-exact-head-materializer>",
          }
          exec(compile(program, namespace["__file__"], "exec", dont_inherit=True), namespace)

      - name: Verify materialized candidate remains software-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0

      - name: Run standalone-scope Capture truth tests
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --filter CoreBluetoothCaptureMappingTests
          swift test --filter TuyaAuthenticatedReadOnlyPreflightTests
          swift test --filter TuyaAuthenticatedReadOnlySessionLedgerTests
          swift test --filter TuyaAuthenticatedReadOnlyHorizonTests
          swift test --filter TuyaAuthenticatedTerminalHorizonTests
          swift test --filter TuyaDeviceSharingAuthenticationAuthorityTests
          swift test --filter TuyaIncompleteObservationSemanticTerminalTests
          swift test --filter TuyaApplicationObservationPhaseAdmissionSourceTests
          swift test --filter TuyaAcceptedApplicationEvidenceSealSourceTests
          swift test --filter TuyaSmartLifeApplicationSourceAttributionSourceTests
          swift test --filter TuyaAppIncompleteHorizonTerminalSourceTests
          swift test --filter TuyaApplicationTimeoutPresentationRaceSourceTests
          swift test --filter TuyaAuthenticatedReadOnlyCommandFenceSourceTests
          swift test --filter CaptureFirstFoldCopySourceTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests
          swift test --filter ThisDeviceAuthorizationConsumptionStoreTests
          swift test --filter AuthenticatedStationaryCaptureCapabilityGateTests
          swift test --filter AuthenticatedStationaryCaptureInstallManifestTests
          swift test --filter AuthenticatedStationaryCaptureAppAuthorizerTests
          swift test --filter AuthenticatedStationaryCaptureAppAuthorizerPreSigningTests
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter AuthenticatedStationaryCaptureAuthorizationInboxTests
          swift test --filter AuthenticatedStationaryCaptureSignerRendezvousDocumentTests
          swift test --filter AuthenticatedStationaryCaptureSignerRendezvousOutboxTests
          swift test --filter AuthenticatedStationaryCaptureAuthoritySurfaceSourceTests
          swift test --filter TuyaAuthenticatedFieldCapabilityAppWiringSourceTests
          swift test --filter TuyaFieldInstallerRetainedIPAAdmissionSourceTests

      - name: Validate one-time field handoff without private inputs
        run: |
          set -euo pipefail
          bash -n Scripts/provision_capture_tuya_identity.sh
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -m py_compile \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/es80_signed_field_artifact_private_runner.py \
            scripts/ci/es80_retained_install_manifest.py \
            scripts/ci/tests/test_es80_retained_install_manifest.py \
            scripts/ci/tests/test_es80_retained_install_installer_chronology.py
          /usr/bin/python3 -I scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          /usr/bin/python3 -I scripts/ci/es80_retained_install_manifest.py --self-test
          /usr/bin/python3 -I scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          /usr/bin/python3 -I scripts/ci/tests/test_es80_retained_install_manifest.py
          /usr/bin/python3 -I scripts/ci/tests/test_es80_retained_install_installer_chronology.py
          test ! -e LocalSecrets
          test ! -e Pods
          test ! -e NembraCapture.xcworkspace
          printf '%s\n' 'Validated public handoff code only; CI did not provision secrets, build a private workspace, install an app, or authorize a physical run.'

      - name: Build standalone Capture for Simulator
        run: |
          set -euo pipefail
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          rm -rf "${RUNNER_TEMP}/NembraCaptureV16DerivedData"
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NembraCaptureV16DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify standalone app product
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/NembraCaptureV16DerivedData/Build/Products/Debug-iphonesimulator/Nembra Capture.app"
          plist="$app/Info.plist"
          test -d "$app"
          test -f "$plist"

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          test "$bundle_id" = 'com.jonathangana131.nembra.capturelearn'

          for key in \
            NembraCaptureBuildIdentifier \
            NembraCaptureSourceCommitSHA \
            NembraCaptureTuyaDependencyLockSHA256 \
            NembraCaptureProcedureIdentifier
          do
            value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || true)"
            if [[ -n "$value" ]]; then
              printf 'Public/unprovisioned standalone build carried forbidden field authority %s=%q\n' "$key" "$value" >&2
              exit 1
            fi
          done

          printf 'Verified software-only standalone product: %s; no field-authority provenance is populated.\n' "$bundle_id"

      - name: Create exact iPhone 12 / iOS 27 UI-test simulator
        id: capture_ui_simulator
        run: |
          set -euo pipefail
          artifacts="${RUNNER_TEMP}/NembraCaptureSyntheticUIArtifacts"
          mkdir -p "$artifacts/logs"

          xcrun simctl list runtimes -j > "$artifacts/simulator-runtimes.json"
          xcrun simctl list devicetypes -j > "$artifacts/simulator-device-types.json"

          runtime_id="$(/usr/bin/python3 - "$artifacts/simulator-runtimes.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              runtimes = json.load(handle).get("runtimes", [])

          candidates = [
              runtime
              for runtime in runtimes
              if runtime.get("isAvailable")
              and str(runtime.get("version", "")).split(".", 1)[0] == "27"
              and str(runtime.get("identifier", "")).startswith(
                  "com.apple.CoreSimulator.SimRuntime.iOS-27"
              )
          ]
          if not candidates:
              raise SystemExit("No available iOS 27 Simulator runtime was found")

          def version(runtime):
              return tuple(int(part) for part in str(runtime["version"]).split("."))

          print(max(candidates, key=version)["identifier"])
          PY
          )"

          device_type="$(/usr/bin/python3 - "$artifacts/simulator-device-types.json" <<'PY'
          import json
          import sys

          expected = "com.apple.CoreSimulator.SimDeviceType.iPhone-12"
          with open(sys.argv[1], encoding="utf-8") as handle:
              device_types = json.load(handle).get("devicetypes", [])
          if not any(item.get("identifier") == expected for item in device_types):
              raise SystemExit(f"Required Simulator device type is unavailable: {expected}")
          print(expected)
          PY
          )"

          simulator_name="Nembra Capture Synthetic UI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          udid="$(xcrun simctl create "$simulator_name" "$device_type" "$runtime_id")"
          {
            printf 'udid=%s\n' "$udid"
            printf 'runtime_id=%s\n' "$runtime_id"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'exact_head=%s\n' "$(git rev-parse --verify HEAD^{commit})"
            printf 'runtime=%s\n' "$runtime_id"
            printf 'device_type=%s\n' "$device_type"
            printf 'simulator_udid=%s\n' "$udid"
          } > "$artifacts/simulator-selection.txt"

          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices -j > "$artifacts/simulator-devices-after-boot.json"

      - name: Run public and synthetic Capture UI tests
        env:
          SIMULATOR_UDID: ${{ steps.capture_ui_simulator.outputs.udid }}
        run: |
          set -euo pipefail
          artifacts="${RUNNER_TEMP}/NembraCaptureSyntheticUIArtifacts"
          derived_data="${RUNNER_TEMP}/NembraCaptureV16UITestDerivedData"
          RESULT_BUNDLE="${RUNNER_TEMP}/NembraCaptureSyntheticUITests.xcresult"
          attachments="$artifacts/screenshots"
          mkdir -p "$artifacts/logs" "$attachments"
          rm -rf "$derived_data" "$RESULT_BUNDLE"

          set +e
          set -o pipefail
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$derived_data" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:'Nembra Capture UI Tests' \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            NEMBRA_CAPTURE_BUILD_IDENTIFIER= \
            NEMBRA_CAPTURE_BUILD_COMMIT_SHA= \
            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256= \
            NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER= \
            ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee "$artifacts/logs/xcodebuild-ui-tests.log"
          test_status=${PIPESTATUS[0]}
          set -e

          if [[ -d "$RESULT_BUNDLE" ]]; then
            if xcrun xcresulttool export attachments \
              --path "$RESULT_BUNDLE" \
              --output-path "$attachments" \
              > "$artifacts/logs/xcresult-attachments.log" 2>&1; then
              find "$attachments" -maxdepth 2 -type f -print | sort \
                > "$artifacts/screenshot-attachments.txt"
            else
              {
                printf '%s\n' 'Attachment export failed; the complete xcresult remains preserved.'
                xcrun xcresulttool help export attachments || true
              } >> "$artifacts/logs/xcresult-attachments.log" 2>&1
            fi
          fi

          exit "$test_status"

      - name: Upload synthetic Capture UI-test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nembra-capture-synthetic-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/NembraCaptureSyntheticUITests.xcresult
            ${{ runner.temp }}/NembraCaptureSyntheticUIArtifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Delete disposable Capture UI-test simulator
        if: always() && steps.capture_ui_simulator.outputs.udid != ''
        env:
          SIMULATOR_UDID: ${{ steps.capture_ui_simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID" || true
