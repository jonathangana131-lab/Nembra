name: chat-m6v2q fix fresh reopen test header

on:
  push:
    branches:
      - parallel/es80-terminal-fresh-reopen/chat-m6v2q-4
    paths:
      - .github/workflows/chat-m6v2q-fix-fresh-reopen-test-header.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: parallel/es80-terminal-fresh-reopen/chat-m6v2q-4
      - name: Remove invalid leading byte and self-delete workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateFreshReopenTests.swift')
          s = p.read_text()
          if not s.startswith('\\\nimport Testing\n'):
              raise SystemExit('unexpected test header; refusing broad rewrite')
          p.write_text(s[2:])
          PY
          git config user.name 'nembra-chat-m6v2q'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateFreshReopenTests.swift
          git rm .github/workflows/chat-m6v2q-fix-fresh-reopen-test-header.yml
          git commit -m 'Fix fresh-reopen test source header'
          git push origin HEAD:parallel/es80-terminal-fresh-reopen/chat-m6v2q-4
