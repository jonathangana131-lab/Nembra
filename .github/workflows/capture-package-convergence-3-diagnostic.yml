name: Capture Package Convergence 3 Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  package-differential:
    name: package-differential
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - name: Run full Capture package and verify 51 to 35 convergence
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee "$RUNNER_TEMP/capture-package-convergence-3.log"
          status=${PIPESTATUS[0]}
          set -e

          test "$status" -ne 0
          grep -E 'Test run with [0-9]+ tests in [0-9]+ suites failed .* with 35 issues\.' "$RUNNER_TEMP/capture-package-convergence-3.log"

          for file in \
            ES80CaptureLockedSurfaceVisualAcceptanceTests.swift \
            TuyaProcessLifetimeBLEOwnershipFenceSourceTests.swift \
            TuyaCrossControllerBLEOwnershipLeaseSourceTests.swift \
            ES80CaptureFieldRuntimeRendezvousTests.swift \
            TuyaAuthenticatedReadOnlySessionLedgerTests.swift \
            TuyaTransportSuccessAuthoritySourceTests.swift
          do
            if grep -F "$file" "$RUNNER_TEMP/capture-package-convergence-3.log" | grep -F 'Issue recorded' >/dev/null; then
              echo "Target file still reports an issue: $file" >&2
              exit 1
            fi
          done

          grep -E 'Test run with [0-9]+ tests in [0-9]+ suites' "$RUNNER_TEMP/capture-package-convergence-3.log" | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact package log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-package-convergence-3-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/capture-package-convergence-3.log
          retention-days: 7
          if-no-files-found: error

      - name: Preserve global package failure truth
        run: |
          echo '35 unrelated package issues remain; differential acceptance is not package green.' >&2
          exit 1
