name: Materialize Capture Foreground Integrity 4b41

on:
  push:
    branches:
      - repair/v14-capture-foreground-integrity-4b41-sol

permissions:
  contents: write

concurrency:
  group: capture-foreground-integrity-4b41-sol
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-foreground-integrity-4b41-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact product and staged scope
        shell: bash
        run: |
          set -euo pipefail
          base='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base:$app")" = "$(git rev-parse HEAD:$app)"
          mapfile -t changed < <(git diff --name-only "$base"...HEAD | sort)
          mapfile -t wanted < <(printf '%s\n' '.github/workflows/materialize-capture-foreground-integrity-4b41-sol.yml' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' 'scripts/ci/materialize_capture_foreground_integrity_4b41.py' | sort)
          test "${#changed[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do test "${changed[$i]}" = "${wanted[$i]}"; done

      - name: Materialize and parse foreground repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_foreground_integrity_4b41.py
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          git diff --check

      - name: Publish clean two-path successor
        shell: bash
        run: |
          set -euo pipefail
          base='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          rm -f .github/workflows/materialize-capture-foreground-integrity-4b41-sol.yml
          rm -f scripts/ci/materialize_capture_foreground_integrity_4b41.py
          git add -A
          git diff --cached --check
          mapfile -t effective < <(git diff --name-only "$base" | sort)
          mapfile -t wanted < <(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' | sort)
          test "${#effective[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do test "${effective[$i]}" = "${wanted[$i]}"; done
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git commit -m 'fix(capture): fail closed on Secure Link foreground loss'
          git push origin HEAD:repair/v14-capture-foreground-integrity-4b41-sol
