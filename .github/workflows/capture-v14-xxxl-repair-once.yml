name: Capture V14 Accessibility XXXL recovery repair

on:
  push:
    branches:
      - nembra/capture-v14-xxxl-repair-recovery-20260809-go
    paths:
      - .github/workflows/capture-v14-xxxl-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Recompose locked Capture surface for Accessibility XXXL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("NembraApp/App/NembraApp.swift")
          source = path.read_text(encoding="utf-8")
          marker = "@MainActor\nprivate struct ES80ExperimentOneFieldNoGoView: View {"
          marker_count = source.count(marker)
          if marker_count != 1:
              raise SystemExit(f"Refusing ambiguous locked-surface scope: expected 1 marker, found {marker_count}")

          prefix, scope = source.split(marker, 1)
          scope = marker + scope

          literal_replacements = [
              (
                  "spacing: verticalSizeClass == .compact ? 10 : (isAccessibilityLayout ? 8 : 28)",
                  "spacing: verticalSizeClass == .compact ? 10 : (isAccessibilityLayout ? 6 : 28)",
                  1,
              ),
              (
                  "spacing: verticalSizeClass == .compact ? 6 : (isAccessibilityLayout ? 4 : 14)",
                  "spacing: verticalSizeClass == .compact ? 6 : (isAccessibilityLayout ? 2 : 14)",
                  1,
              ),
              (
                  "isAccessibilityLayout || verticalSizeClass == .compact ? .title2 : .largeTitle,",
                  "isAccessibilityLayout ? .headline : (verticalSizeClass == .compact ? .title2 : .largeTitle),",
                  1,
              ),
              (
                  ".padding(verticalSizeClass == .compact ? 12 : (isAccessibilityLayout ? 10 : 18))",
                  ".padding(verticalSizeClass == .compact ? 12 : (isAccessibilityLayout ? 8 : 18))",
                  2,
              ),
              (
                  ".padding(.top, verticalSizeClass == .compact ? 8 : (isAccessibilityLayout ? 8 : 18))",
                  ".padding(.top, verticalSizeClass == .compact ? 8 : (isAccessibilityLayout ? 4 : 18))",
                  1,
              ),
          ]

          for old, new, expected_count in literal_replacements:
              actual_count = scope.count(old)
              if actual_count != expected_count:
                  raise SystemExit(
                      f"Refusing ambiguous locked-surface repair for {old!r}: expected {expected_count}, found {actual_count}"
                  )
              scope = scope.replace(old, new)

          def regex_replace_once(pattern, replacement, label):
              global scope
              updated, count = re.subn(pattern, replacement, scope)
              if count != 1:
                  raise SystemExit(
                      f"Refusing ambiguous locked-surface repair for {label}: expected 1, found {count}"
                  )
              scope = updated

          regex_replace_once(
              r'Text\("Final exact-build checks are still in progress\."\)\n(?P<i>[ \t]+)\.font\(\.caption\.weight\(\.semibold\)\)',
              lambda match: 'Text("Final checks in progress.")\n' + match.group('i') + '.font(.caption2.weight(.semibold))',
              "Accessibility status copy/font",
          )
          regex_replace_once(
              r'Text\(isAccessibilityLayout \? "PHYSICAL CAPTURE · NO-GO" : "Not ready for scooter capture yet"\)\n(?P<i>[ \t]+)\.font\(\.headline\)',
              lambda match: 'Text(isAccessibilityLayout ? "PHYSICAL CAPTURE · NO-GO" : "Not ready for scooter capture yet")\n' + match.group('i') + '.font(isAccessibilityLayout ? .subheadline.weight(.semibold) : .headline)',
              "physical lock title font",
          )
          regex_replace_once(
              r'Text\("Engineering details"\)\n(?P<i>[ \t]+)\.font\(\.subheadline\.weight\(\.semibold\)\)',
              lambda match: 'Text("Engineering details")\n' + match.group('i') + '.font(isAccessibilityLayout ? .footnote.weight(.semibold) : .subheadline.weight(.semibold))',
              "engineering details font",
          )

          path.write_text(prefix + scope, encoding="utf-8")
          PY

          git diff --check
          git diff -- NembraApp/App/NembraApp.swift

      - name: Commit product repair and remove recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-v14-closure-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/capture-v14-xxxl-repair-once.yml
          git add NembraApp/App/NembraApp.swift
          git diff --cached --check
          git commit -m "fix(capture): fit locked state at Accessibility XXXL"
          git push origin HEAD:"$GITHUB_REF_NAME"
