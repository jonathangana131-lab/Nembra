name: TEMP V14 Clean 2849 Field Invocation (Sol)

on:
  push:
    branches:
      - repair/v14-capture-field-invocation-cleanup-2849-sol
    paths:
      - .github/workflows/tmp-v14-clean-2849-field-invocation-sol.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize and prove runner repair
        shell: bash
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_SHA"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/capture-field-build-provenance.yml')
          text = path.read_text(encoding='utf-8')
          old = '/usr/bin/python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract'
          new = '/usr/bin/python3 scripts/ci/tests/test_capture_field_accepted_source_path_contract.py'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale module invocation, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile scripts/ci/tests/test_capture_field_accepted_source_path_contract.py
          python3 scripts/ci/tests/test_capture_field_accepted_source_path_contract.py
          git diff --check
          grep -Fq '/usr/bin/python3 scripts/ci/tests/test_capture_field_accepted_source_path_contract.py' .github/workflows/capture-field-build-provenance.yml
          if grep -Fq '/usr/bin/python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract' .github/workflows/capture-field-build-provenance.yml; then
            echo 'ERROR: stale package-module invocation remains.' >&2
            exit 1
          fi

      - name: Publish clean child head and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-v14-clean-2849-field-invocation-sol.yml
          git add .github/workflows/capture-field-build-provenance.yml
          git commit -m 'Capture: run field path contract directly on Mac runner'
          git push origin HEAD:repair/v14-capture-field-invocation-cleanup-2849-sol
