name: Capture Final GO Packed Tree Authority Red Team

on:
  pull_request:
    paths:
      - 'scripts/ci/es80_authenticated_stationary_private_review_final_go.py'
      - 'scripts/ci/tests/test_es80_final_go_packed_tree_authority_red_team.py'
      - '.github/workflows/capture-final-go-packed-tree-authority-red-team.yml'

permissions:
  contents: read

jobs:
  packed-tree-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact product head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Replay Final-GO packed-tree authority attack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_private_review_final_go.py
          python3 -m py_compile scripts/ci/tests/test_es80_final_go_packed_tree_authority_red_team.py
          python3 scripts/ci/tests/test_es80_final_go_packed_tree_authority_red_team.py
          git diff --check
