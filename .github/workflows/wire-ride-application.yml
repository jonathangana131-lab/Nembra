name: Wire ride application sources

on:
  push:
    branches:
      - feature/ride-application

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ride-application
          fetch-depth: 0

      - name: Wire ride application sources
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('Nembra.xcodeproj/project.pbxproj')
          text = path.read_text()

          build_entries = [
              '\t\tA00000000000000000000035 /* RideStore.swift in Sources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000035 /* RideStore.swift */; };',
              '\t\tA00000000000000000000036 /* RideHistoryPersistence.swift in Sources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000036 /* RideHistoryPersistence.swift */; };',
              '\t\tA00000000000000000000037 /* RideApplicationRuntime.swift in Sources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000037 /* RideApplicationRuntime.swift */; };',
          ]
          file_entries = [
              '\t\tB00000000000000000000035 /* RideStore.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RideStore.swift; sourceTree = "<group>"; };',
              '\t\tB00000000000000000000036 /* RideHistoryPersistence.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; name = RideHistoryPersistence.swift; path = Packages/NembraCore/Sources/NembraCore/RideHistoryPersistence.swift; sourceTree = SOURCE_ROOT; };',
              '\t\tB00000000000000000000037 /* RideApplicationRuntime.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; name = RideApplicationRuntime.swift; path = Packages/NembraCore/Sources/NembraCore/RideApplicationRuntime.swift; sourceTree = SOURCE_ROOT; };',
          ]

          if 'A00000000000000000000035 /* RideStore.swift in Sources */' not in text:
              marker = '/* End PBXBuildFile section */'
              text = text.replace(marker, '\n'.join(build_entries) + '\n' + marker, 1)
          if 'B00000000000000000000035 /* RideStore.swift */' not in text:
              marker = '/* End PBXFileReference section */'
              text = text.replace(marker, '\n'.join(file_entries) + '\n' + marker, 1)

          def inject_into_group(source, group_id, entries):
              pattern = rf'(\t\t{re.escape(group_id)}[^=]*= \{{.*?children = \()(.*?)(\);.*?\n\t\t\}};)'
              match = re.search(pattern, source, flags=re.S)
              if not match:
                  raise SystemExit(f'PBX group not found: {group_id}')
              children = match.group(2)
              additions = ''.join(f'\n\t\t\t\t{entry},' for entry in entries if entry not in children)
              if not additions:
                  return source
              replacement = match.group(1) + children.rstrip() + additions + '\n\t\t\t' + match.group(3)
              return source[:match.start()] + replacement + source[match.end():]

          text = inject_into_group(
              text,
              '100000000000000000000003 /* App */',
              ['B00000000000000000000035 /* RideStore.swift */']
          )
          text = inject_into_group(
              text,
              '100000000000000000000006 /* Core */',
              [
                  'B00000000000000000000036 /* RideHistoryPersistence.swift */',
                  'B00000000000000000000037 /* RideApplicationRuntime.swift */',
              ]
          )

          source_phase = re.search(
              r'(\t\t300000000000000000000001 = \{.*?files = \()(.*?)(\);.*?\n\t\t\};)',
              text,
              flags=re.S,
          )
          if not source_phase:
              raise SystemExit('App sources build phase not found')
          files = source_phase.group(2)
          source_entries = [
              'A00000000000000000000035',
              'A00000000000000000000036',
              'A00000000000000000000037',
          ]
          additions = ''.join(f' {entry},' for entry in source_entries if entry not in files)
          if additions:
              replacement = source_phase.group(1) + files.rstrip() + additions + source_phase.group(3)
              text = text[:source_phase.start()] + replacement + text[source_phase.end():]

          required = [
              'A00000000000000000000035 /* RideStore.swift in Sources */',
              'A00000000000000000000036 /* RideHistoryPersistence.swift in Sources */',
              'A00000000000000000000037 /* RideApplicationRuntime.swift in Sources */',
              'B00000000000000000000035 /* RideStore.swift */',
              'B00000000000000000000036 /* RideHistoryPersistence.swift */',
              'B00000000000000000000037 /* RideApplicationRuntime.swift */',
          ]
          if not all(marker in text for marker in required):
              raise SystemExit('Ride application Xcode wiring incomplete')

          path.write_text(text)
          PY

          scripts/validate_pbxproj_references.py

      - name: Commit wiring and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wire-ride-application.yml
          git add Nembra.xcodeproj/project.pbxproj
          git commit -m 'build: wire ride application sources into Xcode project'
          git push origin HEAD:feature/ride-application
