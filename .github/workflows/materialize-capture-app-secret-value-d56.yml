name: Materialize Capture private secret-value custody

on:
  push:
    branches:
      - sol/v14-capture-app-secret-value-d56

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Verify exact product ancestry and bounded construction scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d56a30c699fbdecec6130537d3f3f4f4232f5c47 HEAD
          test "$(git diff --name-only d56a30c699fbdecec6130537d3f3f4f4232f5c47..HEAD | sort)" = "$(printf '%s\n' \
            '.github/workflows/materialize-capture-app-secret-value-d56.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift' \
            'tools/materialize_capture_app_secret_value_d56.py' | sort)"

      - name: Apply exact private secret-value custody repair
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_capture_app_secret_value_d56.py

      - name: Validate source contract; defer Apple package execution
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift
          python - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          a = source.index('@MainActor\nprivate final class SmartLifeDriver')
          b = source.index('#endif\n\nprivate enum AppleAccountAuthorizationError', a)
          driver = source[a:b]
          callback_a = driver.index('func device(_ device: ThingSmartDevice?, dpsUpdate')
          callback_b = driver.index('private static let secretKeyFragments', callback_a)
          callback = driver[callback_a:callback_b]
          required = [
              'NembraTuyaPrivateIdentity.appKey',
              'NembraTuyaPrivateIdentity.appSecret',
              'private static var exactSecretValues: [String]',
              'private static func redactExactSecretValues(in value: String) -> String',
              'replacingOccurrences(of: secret, with: "<redacted>", options: [.literal])',
              'private static func redactedApplicationDescription(_ object: Any) -> String',
              'Self.redactedApplicationDescription(value)',
          ]
          missing = [x for x in required if x not in driver]
          if missing:
              raise SystemExit(f'missing private secret-value custody anchors: {missing}')
          if 'String(describing: Self.redactApplicationSecrets(value))' in callback:
              raise SystemExit('unsafe direct application value projection survived')
          if '#if canImport(NembraTuyaPrivateConfig)' not in driver or 'return []' not in driver:
              raise SystemExit('private exact-secret source is not private-build bound')
          for fragment in ['localkey','sessionkey','appkey','appsecret','password','accounttoken','accesstoken','refreshtoken','authkey','seckey']:
              if f'"{fragment}"' not in driver:
                  raise SystemExit(f'credential-shaped key classifier regressed: {fragment}')
          test_source = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift').read_text()
          for item in ['Self.redactedApplicationDescription(value)', 'exactSecretValues', 'NembraTuyaPrivateIdentity.appSecret']:
              if item not in test_source:
                  raise SystemExit(f'focused source regression lost: {item}')
          PY
          test "$(git diff --name-only)" = "NembraApp/App/NembraCaptureEntrypoint.swift"
          git diff --check

      - name: Publish clean repair and retire construction helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-app-secret-value-d56.yml
          rm tools/materialize_capture_app_secret_value_d56.py
          git config user.name "nembra-sol-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            '.github/workflows/materialize-capture-app-secret-value-d56.yml' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'tools/materialize_capture_app_secret_value_d56.py' | sort)"
          git commit -m "fix(capture): scrub exact private app secrets from events"
          git push origin HEAD:sol/v14-capture-app-secret-value-d56
