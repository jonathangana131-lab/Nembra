name: Capture Native ACL Seeded Baseline Equivalence Red Team

on:
  push:
    branches:
      - validation/v17-capture-native-acl-seeded-baseline-equivalence-red-team-gpt56sol-20260817
    paths:
      - scripts/ci/tests/test_capture_native_acl_seeded_baseline_equivalence_red_team.py
      - .github/workflows/capture-native-acl-seeded-baseline-equivalence-red-team.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  exploit-positive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact attacked production head and validation-only scope
        shell: bash
        env:
          ATTACKED: 8456750395c0a5cb1472834300785a5d52c1cae4
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "validation/v17-capture-native-acl-seeded-baseline-equivalence-red-team-gpt56sol-20260817"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ATTACKED" HEAD
          changed="$(git diff --name-only "$ATTACKED"..HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-native-acl-seeded-baseline-equivalence-red-team.yml \
            scripts/ci/tests/test_capture_native_acl_seeded_baseline_equivalence_red_team.py | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse "$ATTACKED:scripts/ci/capture_selected_xcode_build_orchestrator.py")" = \
               "$(git rev-parse HEAD:scripts/ci/capture_selected_xcode_build_orchestrator.py)"
          git diff --check "$ATTACKED"..HEAD

      - name: Reproduce missing seeded baseline semantic equivalence
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/tests/test_capture_native_acl_seeded_baseline_equivalence_red_team.py
          python3 scripts/ci/tests/test_capture_native_acl_seeded_baseline_equivalence_red_team.py

      - name: Truth boundary
        run: |
          echo 'NEMBRA_NATIVE_ACL_SEEDED_BASELINE_RED_TEAM exploitPositive=true productionBytesChanged=false physicalAuthorityCreated=false'
          echo 'SUCCESS means production still lacks pre-grant fd/path ACL semantic equivalence; it is not product acceptance.'

      - name: Publish exact validation marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment 3572 --repo "$GITHUB_REPOSITORY" --body "V17 exact validation result: \`Capture Native ACL Seeded Baseline Equivalence Red Team\` run \`$GITHUB_RUN_ID\` is terminal SUCCESS on exact head \`$GITHUB_SHA\`. The validation-only scope is unchanged from attacked #3553@\`8456750395c0a5cb1472834300785a5d52c1cae4\`; production orchestrator bytes are identical to that attacked head. SUCCESS is exploit-positive: current strict native admission accepts an opaque descriptor rollback baseline without native semantic equality to the canonical-path pre-grant ACL. This creates no product, signing/install, BLE/Tuya, telemetry, command, or physical authority. Physical remains NO-GO."
