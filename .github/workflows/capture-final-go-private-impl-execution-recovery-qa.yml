name: Capture Final GO Private Impl Execution Recovery QA

on:
  push:
    branches:
      - validation/v14-final-go-private-impl-execution-recovery/gpt56-go
  pull_request:
    paths:
      - scripts/ci/_es80_today_final_go_foundation_impl.py
      - scripts/ci/tests/test_es80_today_final_go_private_impl_execution_disabled.py
      - .github/workflows/capture-final-go-private-impl-execution-recovery-qa.yml

permissions:
  contents: read

jobs:
  private-impl:
    name: Reject executable private Final GO implementation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile private-implementation regression
        run: python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_private_impl_execution_disabled.py
      - name: Require private implementation to fail closed
        run: python3 scripts/ci/tests/test_es80_today_final_go_private_impl_execution_disabled.py -v
