name: Materialize Capture Apple App ID Prefix Custody

on:
  push:
    branches:
      - fix/v14-capture-apple-app-prefix-custody-1b12-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-apple-app-prefix-custody-1b12-sol
          fetch-depth: 0

      - name: Verify exact construction base
        shell: bash
        run: |
          set -euo pipefail
          BASE=1b12dc56ec20a7dad30760b57a81106644ffc263
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = ".github/workflows/materialize-capture-apple-app-prefix-custody.yml"

      - name: Apply corrected Apple application identity custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          installer_path = Path("scripts/field/install_one_time_capture.command")
          source = installer_path.read_text(encoding="utf-8")

          replacements = [
              (
                  'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"\n',
                  ''
              ),
              (
                  '[[ "$BUILT_APPLICATION_IDENTIFIER" == "$EXPECTED_APPLICATION_IDENTIFIER" ]] || \\\n    die "Final signed Capture app application-identifier does not match the selected team and Capture bundle identifier. Discard this candidate."',
                  '[[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]] || die "Final signed Capture app application-identifier does not end in the exact Capture bundle identifier. Discard this candidate."'
              ),
              (
                  '    sys.stdout.write(application + "\\t" + entitlement_team)',
                  '    sys.stdout.write(application + "\\t" + entitlement_team + "\\t" + team_identifiers[0])'
              ),
              (
                  '[[ "$PROFILE_SIGNING_IDENTITY" == *$\'\\t\'* ]] || \\\n    die "Embedded provisioning profile is missing required Sign in with Apple or exact application/team identity custody. Discard this candidate."\nPROFILE_APPLICATION_IDENTIFIER="${PROFILE_SIGNING_IDENTITY%%$\'\\t\'*}"\nPROFILE_TEAM_IDENTIFIER="${PROFILE_SIGNING_IDENTITY#*$\'\\t\'}"\n[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$EXPECTED_APPLICATION_IDENTIFIER" ]] || \\\n    die "Embedded provisioning profile application identifier does not match the selected team and Capture bundle identifier. Discard this candidate."\n[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\\n    die "Embedded provisioning profile team identity does not match the selected Apple Development team. Discard this candidate."\nsay "Final signed app and embedded provisioning profile authorize Sign in with Apple for the exact selected App ID and team"\nunset SIGNED_ENTITLEMENTS_OUTPUT BUILT_SIGNING_IDENTITY BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER PROFILE_PLIST_XML PROFILE_SIGNING_IDENTITY PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER BUILT_PROFILE',
                  '[[ "$PROFILE_SIGNING_IDENTITY" == *$\'\\t\'*$\'\\t\'* ]] || die "Embedded provisioning profile is missing required Sign in with Apple or exact application/team identity custody. Discard this candidate."\nIFS=$\'\\t\' read -r PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER <<< "$PROFILE_SIGNING_IDENTITY"\n[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]] || die "Embedded provisioning profile application identifier does not exactly match the final signed Capture app. Discard this candidate."\n[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || die "Embedded provisioning profile team identity does not match the selected Apple Development team. Discard this candidate."\n[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || die "Embedded provisioning profile root TeamIdentifier does not match the selected Apple Development team. Discard this candidate."\nsay "Final signed app and embedded provisioning profile authorize Sign in with Apple for one exact App ID and the selected team"\nunset SIGNED_ENTITLEMENTS_OUTPUT BUILT_SIGNING_IDENTITY BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER PROFILE_PLIST_XML PROFILE_SIGNING_IDENTITY PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER BUILT_PROFILE'
              ),
          ]

          for index, (old, new) in enumerate(replacements, start=1):
              actual = source.count(old)
              if actual != 1:
                  raise SystemExit(f"replacement anchor {index}: expected 1 exact match, found {actual}")
              source = source.replace(old, new, 1)
          installer_path.write_text(source, encoding="utf-8")

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift")
          if not test_path.exists():
              raise SystemExit("expected merged signed Apple identity regression subject is missing")
          test_path.write_text(dedent(r'''\
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya signed Apple application identity custody source contract")
          struct TuyaSignedAppleAppIdentityCustodySourceTests {
              @Test("field installer proves the exact signed App ID and team before installation")
              func exactSignedApplicationIdentityIsProvenBeforeInstall() throws {
                  let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")

                  let required = [
                      "BUILT_APPLICATION_IDENTIFIER",
                      "BUILT_TEAM_IDENTIFIER",
                      "PROFILE_APPLICATION_IDENTIFIER",
                      "PROFILE_TEAM_IDENTIFIER",
                      "PROFILE_ROOT_TEAM_IDENTIFIER",
                      "application-identifier",
                      "com.apple.developer.team-identifier",
                      "TeamIdentifier",
                      "[[ \"$BUILT_APPLICATION_IDENTIFIER\" == *\".$BUNDLE_ID\" ]]",
                      "[[ \"$PROFILE_APPLICATION_IDENTIFIER\" == \"$BUILT_APPLICATION_IDENTIFIER\" ]]",
                      "[[ \"$BUILT_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]",
                      "[[ \"$PROFILE_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]",
                      "[[ \"$PROFILE_ROOT_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]"
                  ]
                  for needle in required {
                      #expect(installer.contains(needle), "missing signed Apple application-identity custody contract: \(needle)")
                  }

                  let installMarker = try #require(installer.range(of: "say \"Installing SDK-integrated Capture on the intended iPhone\""))
                  for check in [
                      "[[ \"$BUILT_APPLICATION_IDENTIFIER\" == *\".$BUNDLE_ID\" ]]",
                      "[[ \"$PROFILE_APPLICATION_IDENTIFIER\" == \"$BUILT_APPLICATION_IDENTIFIER\" ]]",
                      "[[ \"$BUILT_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]",
                      "[[ \"$PROFILE_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]",
                      "[[ \"$PROFILE_ROOT_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]"
                  ] {
                      let range = try #require(installer.range(of: check))
                      #expect(range.lowerBound < installMarker.lowerBound, "signed Apple identity must be proven before installation: \(check)")
                  }

                  #expect(!installer.contains("EXPECTED_APPLICATION_IDENTIFIER=\"${TEAM_ID}.${BUNDLE_ID}\""))
              }

              @Test("identity proof remains signing custody only")
              func identityProofCannotMintScooterAuthority() throws {
                  let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")
                  let start = try #require(installer.range(of: "BUILT_APPLICATION_IDENTIFIER"))
                  let end = try #require(installer.range(of: "say \"Installing SDK-integrated Capture on the intended iPhone\"", range: start.upperBound..<installer.endIndex))
                  let custody = installer[start.lowerBound..<end.lowerBound]

                  for forbidden in [
                      "connectBLE",
                      "publishDps",
                      "writeValue",
                      "scanForPeripherals",
                      "NEMBRA_SIMULATION_"
                  ] {
                      #expect(!custody.contains(forbidden), "signed Apple identity custody must not introduce BLE/protocol/physical authority: \(forbidden)")
                  }
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }
          }
          '''), encoding="utf-8")

          repaired = installer_path.read_text(encoding="utf-8")
          required = [
              '[[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]]',
              '[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]]',
              '[[ "$BUILT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              'sys.stdout.write(application + "\\t" + entitlement_team + "\\t" + team_identifiers[0])',
          ]
          for needle in required:
              if needle not in repaired:
                  raise SystemExit(f"corrected Apple identity custody invariant missing: {needle}")
          for needle in [
              'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"',
              '[[ "$BUILT_APPLICATION_IDENTIFIER" == "$EXPECTED_APPLICATION_IDENTIFIER" ]]',
              '[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$EXPECTED_APPLICATION_IDENTIFIER" ]]',
          ]:
              if needle in repaired:
                  raise SystemExit(f"invalid Team-ID/App-ID-prefix assumption survived: {needle}")
          print("corrected Apple App ID prefix custody materialization: PASS")
          PY

      - name: Validate corrected two-path repair
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift' \
            'scripts/field/install_one_time_capture.command' | sort)"
          ! grep -F 'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"' scripts/field/install_one_time_capture.command
          grep -F '[[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]]' scripts/field/install_one_time_capture.command
          grep -F '[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]]' scripts/field/install_one_time_capture.command
          grep -F '[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]' scripts/field/install_one_time_capture.command

      - name: Publish clean repair branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-capture-apple-app-prefix-custody.yml
          git add scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Correct Apple App ID prefix custody"
          git push origin HEAD:fix/v14-capture-apple-app-prefix-custody-1b12-sol
