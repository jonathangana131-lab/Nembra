name: V14 Capture Quiescent Acceptance Cut One Shot

on:
  push:
    branches:
      - adversarial/v14-capture-sealed-application-export-prefix-gpt56sol

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: adversarial/v14-capture-sealed-application-export-prefix-gpt56sol
          fetch-depth: 0

      - name: Close the application-evidence cut before the sealing await
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = app.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact anchor, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              '    private var driver: OfficialTuyaDriver?\n    private var events: [Event] = []\n    private var sealedAcceptedEventPrefix: [Event]?\n    private var watchdog: Task<Void, Never>?\n',
              '    private var driver: OfficialTuyaDriver?\n    private var events: [Event] = []\n    private var applicationUpdateAdmissionsInFlight = 0\n    private var acceptanceCutIsClosed = false\n    private var sealedAcceptedEventPrefix: [Event]?\n    private var watchdog: Task<Void, Never>?\n',
              'acceptance-cut state',
          )

          replace_once(
              '''        guard phase == .observing else {\n            log("application_update_outside_observation_ignored", [\n                "generation": String(token.diagnosticGeneration),\n                "phase": phase.rawValue\n            ])\n            return\n        }\n        guard sdkAccountLoggedIn,\n''',
              '''        guard phase == .observing else {\n            log("application_update_outside_observation_ignored", [\n                "generation": String(token.diagnosticGeneration),\n                "phase": phase.rawValue\n            ])\n            return\n        }\n        guard !acceptanceCutIsClosed else {\n            log("application_update_after_acceptance_cut_ignored", [\n                "generation": String(token.diagnosticGeneration)\n            ])\n            return\n        }\n        guard sdkAccountLoggedIn,\n''',
              'post-cut admission guard',
          )

          replace_once(
              '''        guard driver.isLocallyConnected(uuid: tuyaUUID) else {\n            await recordObservedTransportLoss(token: token)\n            return\n        }\n\n        do {\n            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)\n''',
              '''        guard driver.isLocallyConnected(uuid: tuyaUUID) else {\n            await recordObservedTransportLoss(token: token)\n            return\n        }\n\n        applicationUpdateAdmissionsInFlight += 1\n        defer { applicationUpdateAdmissionsInFlight -= 1 }\n\n        do {\n            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)\n''',
              'in-flight application admission custody',
          )

          replace_once(
              '''                    guard self.accountIdentityLeaseIsAuthorized else {\n                        await self.invalidateSourceAuthority(\n                            token: token,\n                            message: "Tuya account/device source authority changed before canonical acceptance could be sealed.",\n                            kind: "sdk_source_authority_rejected_at_seal"\n                        )\n                        return\n                    }\n                    do {\n                        try await sessionLedger.sealAcceptedObservation(for: token)\n                        self.sealedAcceptedEventPrefix = self.events\n''',
              '''                    guard self.accountIdentityLeaseIsAuthorized else {\n                        await self.invalidateSourceAuthority(\n                            token: token,\n                            message: "Tuya account/device source authority changed before canonical acceptance could be sealed.",\n                            kind: "sdk_source_authority_rejected_at_seal"\n                        )\n                        return\n                    }\n                    guard self.applicationUpdateAdmissionsInFlight == 0 else {\n                        break\n                    }\n                    self.acceptanceCutIsClosed = true\n                    let acceptedEventPrefixAtCut = self.events\n                    do {\n                        try await sessionLedger.sealAcceptedObservation(for: token)\n                        self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut\n''',
              'quiescent pre-await acceptance cut',
          )

          replace_once(
              '    private func resetDiscoverySessionOnly() {\n        sealedAcceptedEventPrefix = nil\n',
              '    private func resetDiscoverySessionOnly() {\n        acceptanceCutIsClosed = false\n        sealedAcceptedEventPrefix = nil\n',
              'fresh-life cut reset',
          )

          app.write_text(source)

          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift')
          test.write_text(r'''import Foundation
import Testing
@testable import NembraBluetoothCapture

@Suite("Capture accepted application evidence export seal")
struct TuyaAcceptedApplicationEvidenceSealSourceTests {
    @Test("acceptance closes application admission and freezes a quiescent event prefix before the package sealing await")
    func acceptanceSealFreezesQuiescentExportPrefixBeforeAwait() throws {
        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
        let watchdog = try section(
            in: app,
            from: "private func startWatchdog",
            to: "private func recordObservedTransportLoss"
        )
        let body = String(watchdog)

        guard let noInflight = body.range(of: "guard self.applicationUpdateAdmissionsInFlight == 0"),
              let closeCut = body.range(of: "self.acceptanceCutIsClosed = true", range: noInflight.upperBound..<body.endIndex),
              let frozenPrefix = body.range(of: "let acceptedEventPrefixAtCut = self.events", range: closeCut.upperBound..<body.endIndex),
              let packageSeal = body.range(of: "try await sessionLedger.sealAcceptedObservation(for: token)", range: frozenPrefix.upperBound..<body.endIndex),
              let publishPrefix = body.range(of: "self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut", range: packageSeal.upperBound..<body.endIndex) else {
            Issue.record("Canonical acceptance must close admission, freeze the quiescent app prefix before the sealing await, then publish that exact prefix after package seal succeeds.")
            throw SourceContractError.sectionMissing
        }

        #expect(noInflight.lowerBound < closeCut.lowerBound)
        #expect(closeCut.lowerBound < frozenPrefix.lowerBound)
        #expect(frozenPrefix.lowerBound < packageSeal.lowerBound)
        #expect(packageSeal.lowerBound < publishPrefix.lowerBound)
        #expect(!body.contains("self.sealedAcceptedEventPrefix = self.events"))
    }

    @Test("application callbacks cannot cross the acceptance cut and in-flight admissions remain owned until their async ledger work finishes")
    func applicationAdmissionIsQuiescedBeforeSeal() throws {
        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
        let receive = try section(
            in: app,
            from: "private func receivedApplicationUpdate",
            to: "private func startWatchdog"
        )
        let body = String(receive)

        guard let cutGuard = body.range(of: "guard !acceptanceCutIsClosed"),
              let increment = body.range(of: "applicationUpdateAdmissionsInFlight += 1", range: cutGuard.upperBound..<body.endIndex),
              let decrement = body.range(of: "defer { applicationUpdateAdmissionsInFlight -= 1 }", range: increment.upperBound..<body.endIndex),
              let mutation = body.range(of: "try await sessionLedger.recordApplicationUpdate", range: decrement.upperBound..<body.endIndex) else {
            Issue.record("Application evidence admission must be cut-gated and tracked across its async package mutation.")
            throw SourceContractError.sectionMissing
        }

        #expect(cutGuard.lowerBound < increment.lowerBound)
        #expect(increment.lowerBound < decrement.lowerBound)
        #expect(decrement.lowerBound < mutation.lowerBound)
        #expect(body.contains("application_update_after_acceptance_cut_ignored"))
    }

    @Test("accepted export fails closed onto the frozen prefix instead of the mutable live event log")
    func acceptedExportUsesFrozenEventPrefix() throws {
        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")

        #expect(app.contains("private var sealedAcceptedEventPrefix: [Event]?"))
        #expect(app.contains("private var applicationUpdateAdmissionsInFlight = 0"))
        #expect(app.contains("private var acceptanceCutIsClosed = false"))

        let export = try section(
            in: app,
            from: "func prepareExport()",
            to: "private func resetDiscoverySessionOnly"
        )
        let body = String(export)

        #expect(body.contains("if phase == .accepted"))
        #expect(body.contains("guard let acceptedEventPrefix = self.sealedAcceptedEventPrefix"))
        #expect(body.contains("sealedAcceptedEventPrefix = acceptedEventPrefix"))
        #expect(body.contains("events: sealedAcceptedEventPrefix"))
        #expect(!body.contains("events: events\n"))
    }

    @Test("starting a fresh correlation life reopens admission and clears the prior accepted export prefix")
    func freshCorrelationClearsPriorAcceptedPrefix() throws {
        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
        let reset = try section(
            in: app,
            from: "private func resetDiscoverySessionOnly()",
            to: "private func failLocally"
        )

        #expect(reset.contains("acceptanceCutIsClosed = false"))
        #expect(reset.contains("sealedAcceptedEventPrefix = nil"))
    }

    private func section(in source: String, from start: String, to end: String) throws -> Substring {
        guard let startRange = source.range(of: start),
              let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
            Issue.record("Expected source section missing: \(start) ... \(end)")
            throw SourceContractError.sectionMissing
        }
        return source[startRange.lowerBound..<endRange.lowerBound]
    }

    private func readRepositoryFile(_ relativePath: String) throws -> String {
        let repositoryRoot = URL(fileURLWithPath: #filePath)
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
        return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
    }

    private enum SourceContractError: Error {
        case sectionMissing
    }
}
''')
          PY

      - name: Validate patch shape
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          required = [
              'applicationUpdateAdmissionsInFlight += 1',
              'defer { applicationUpdateAdmissionsInFlight -= 1 }',
              'guard self.applicationUpdateAdmissionsInFlight == 0',
              'self.acceptanceCutIsClosed = true',
              'let acceptedEventPrefixAtCut = self.events',
              'self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut',
              'acceptanceCutIsClosed = false',
          ]
          missing = [item for item in required if item not in app]
          if missing:
              raise SystemExit(f'missing acceptance-cut anchors: {missing}')
          if 'self.sealedAcceptedEventPrefix = self.events' in app:
              raise SystemExit('post-await live-log snapshot still present')
          PY
          git diff --check

      - name: Retire one-shot workflow and commit durable repair
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-quiescent-acceptance-cut-one-shot.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift .github/workflows/v14-capture-quiescent-acceptance-cut-one-shot.yml
          git commit -m 'fix(capture): seal a quiescent application evidence cut'
          git push origin HEAD:adversarial/v14-capture-sealed-application-export-prefix-gpt56sol
