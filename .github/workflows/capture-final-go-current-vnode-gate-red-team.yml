name: Capture Final GO Current Vnode Gate Red Team

on:
  pull_request:
    paths:
      - 'scripts/ci/es80_authenticated_stationary_private_review_final_go.py'
      - 'scripts/ci/tests/test_es80_authenticated_stationary_final_go_current_vnode_gate.py'
      - '.github/workflows/capture-final-go-current-vnode-gate-red-team.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-vnode-gate-contract:
    name: Require current vnode Final-GO authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind QA to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile Final-GO vnode contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go_current_vnode_gate.py

      - name: Require selected current vnode gate
        run: python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_current_vnode_gate.py

      - name: Check diff hygiene
        run: git diff --check HEAD^ HEAD
