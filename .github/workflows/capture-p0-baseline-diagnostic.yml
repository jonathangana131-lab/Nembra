name: Capture P0 Baseline Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/capture-p0-baseline-diagnostic.yml'

permissions:
  contents: read

jobs:
  baseline:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Run Capture package baseline
        id: package
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/capture-baseline-swift-test.log"
          set +e
          (cd Packages/NembraBluetoothCapture && swift test) 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          /usr/bin/python3 -I - "$log" <<'PY'
          import re, sys
          from collections import Counter
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          failures = Counter()
          for line in lines:
              match = re.search(r'recorded an issue at ([^:]+):', line)
              if match:
                  failures[match.group(1)] += 1
          print('Capture baseline failing source-contract files:')
          for name, count in failures.most_common():
              print(f'{count:3} {name}')
          for line in lines[-80:]:
              if 'Test run with ' in line or 'Some test targets reported failures' in line:
                  print(line)
          PY
      - name: Upload baseline log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capture-dfd3-baseline-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/capture-baseline-swift-test.log
          retention-days: 7
          if-no-files-found: error
      - name: Preserve baseline failure truth
        env:
          PACKAGE_STATUS: ${{ steps.package.outputs.status }}
        run: test "$PACKAGE_STATUS" = 0
