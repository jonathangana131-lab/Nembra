name: TEMP Capture TODAY acceptance-contract applicator

on:
  push:
    branches:
      - fix/es80-today-observation-authority-source-contract-gpt56-go

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact stale-contract replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_test = Path('NembraAppTests/NembraAppTests.swift')
          source = app_test.read_text()
          old = '''        XCTAssertTrue(shell.contains("ES80CaptureRefreshPolicy.statusPollInterval"))
                  XCTAssertTrue(shell.contains("observation timer"))
                  XCTAssertTrue(shell.contains("seconds of display guidance remaining"))
                  XCTAssertTrue(shell.contains("The package producer, not this timer"))
                  XCTAssertTrue(shell.contains("Unavailable; waiting for accepted Horizon authority"))
          '''
          new = '''        XCTAssertTrue(shell.contains("ES80CaptureRefreshPolicy.statusPollInterval"))
                  XCTAssertTrue(
                      shell.contains("let canFinalize = presentationCanFinalizeObservationHorizon(status: status)"),
                      "Package-owned Horizon authority, not display timer state, must gate sealing."
                  )
                  XCTAssertTrue(shell.contains("seconds of display guidance remaining"))
                  XCTAssertTrue(shell.contains("The displayed timer is guidance only."))
                  XCTAssertTrue(shell.contains("disabled: !canFinalize"))
                  XCTAssertTrue(shell.contains("Available only after Nembra verifies the required observation time."))
          '''
          if source.count(old) != 1:
              raise SystemExit(f'NembraAppTests stale block count = {source.count(old)}, expected 1')
          app_test.write_text(source.replace(old, new))

          ui_test = Path('NembraUITests/ES80ResearchCaptureUITests.swift')
          source = ui_test.read_text()
          old = '''        XCTAssertTrue(
                      source.contains("if let data = finalShareData"),
                      "A temporary Share-file retry must reuse retained verified bytes rather than mint a new evidence artifact."
                  )
          '''
          new = '''        XCTAssertTrue(
                      source.contains("guard let data = finalShareData"),
                      "The Share transfer must remain bound to the retained verified bytes rather than reopening a mutable pathname."
                  )
                  XCTAssertTrue(
                      source.contains("if finalShareData != nil"),
                      "Retrying Share must reuse already-verified retained bytes rather than minting new evidence."
                  )
          '''
          if source.count(old) != 1:
              raise SystemExit(f'ES80ResearchCaptureUITests stale Share block count = {source.count(old)}, expected 1')
          ui_test.write_text(source.replace(old, new))
          PY

          git diff --check
          git rm .github/workflows/temp-es80-today-contract-applicator-gpt56.yml
          git add NembraAppTests/NembraAppTests.swift NembraUITests/ES80ResearchCaptureUITests.swift
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(capture): bind acceptance to current authority semantics'
          git push origin HEAD:fix/es80-today-observation-authority-source-contract-gpt56-go
