name: Temporary Final GO Device Digest Handoff Review

on:
  push:
    branches:
      - review/v14-final-go-device-digest-handoff-sol

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch and test digest handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jonathangana131-lab/Nembra"
          test "$GITHUB_REF_NAME" = "review/v14-final-go-device-digest-handoff-sol"
          python3 - <<'PY'
          from pathlib import Path

          go_path = Path('scripts/ci/es80_authenticated_stationary_final_go.py')
          go = go_path.read_text()
          old = '''def installer_environment(device:Path)->dict[str,str]:
              account=pwd.getpwuid(os.getuid()); device_path=canonical_private_path(device,"private intended-device identifier")
              return {"PATH":TRUSTED_INSTALLER_PATH,"HOME":account.pw_dir,"USER":account.pw_name,"LOGNAME":account.pw_name,"LANG":"en_US.UTF-8","LC_ALL":"en_US.UTF-8","BASH_ENV":"/dev/null","ENV":"/dev/null","NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE":str(device_path)}
          '''.replace('              ', '')
          new = '''def installer_environment(device:Path)->dict[str,str]:
              account=pwd.getpwuid(os.getuid()); device_path=canonical_private_path(device,"private intended-device identifier")
              intended_device_digest=device_hash(device_path)
              return {"PATH":TRUSTED_INSTALLER_PATH,"HOME":account.pw_dir,"USER":account.pw_name,"LOGNAME":account.pw_name,"LANG":"en_US.UTF-8","LC_ALL":"en_US.UTF-8","BASH_ENV":"/dev/null","ENV":"/dev/null","NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE":str(device_path),"NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256":intended_device_digest}
          '''.replace('              ', '')
          if old in go:
              go_path.write_text(go.replace(old, new, 1))
          elif '"NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256":intended_device_digest' not in go:
              raise SystemExit('Final GO installer_environment anchor drifted')

          test_path = Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py')
          test = test_path.read_text()
          old_assert = '            self.assertEqual(env["NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE"], str(device))\n'
          new_assert = old_assert + '            self.assertEqual(env["NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256"], GO.device_hash(device))\n'
          if 'self.assertEqual(env["NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256"], GO.device_hash(device))' not in test:
              if old_assert not in test:
                  raise SystemExit('installer environment test anchor drifted')
              test_path.write_text(test.replace(old_assert, new_assert, 1))
          PY

          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          grep -Fq '"NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256":intended_device_digest' scripts/ci/es80_authenticated_stationary_final_go.py
          git diff --check

      - name: Publish product-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-review'
          git config user.email 'nembra-v14-review@users.noreply.github.com'
          git add scripts/ci/es80_authenticated_stationary_final_go.py \
                  scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          if git diff --cached --quiet; then
            echo 'digest handoff already materialized'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix(capture): pass Final GO intended-device digest to installer'
          git push origin "HEAD:$GITHUB_REF_NAME"
