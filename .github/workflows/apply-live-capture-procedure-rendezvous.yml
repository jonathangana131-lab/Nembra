name: Converge Capture procedure rendezvous

on:
  push:
    branches: [integration/v14-capture-final-stationary-convergence-sol]

permissions:
  contents: write

concurrency:
  group: capture-procedure-rendezvous
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-final-stationary-convergence-sol
          fetch-depth: 0
      - name: Apply on latest flagship and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nembra-go-bot
          git config user.email nembra-go-bot@users.noreply.github.com
          git fetch origin integration/v14-capture-final-stationary-convergence-sol
          git reset --hard origin/integration/v14-capture-final-stationary-convergence-sol
          python3 - <<'PY'
          from pathlib import Path
          P="ES80-AUTHENTICATED-STATIONARY-v1"
          def once(path, old, new):
              p=Path(path); s=p.read_text()
              if new in s: return
              if s.count(old)!=1: raise SystemExit(f"{path}: anchor count {s.count(old)} for {old!r}")
              p.write_text(s.replace(old,new,1))

          once("NembraApp/App/NembraCaptureBuildIdentity.swift",
               '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n',
               '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n    static let fieldProcedureIdentifier = "'+P+'"\n')
          once("NembraApp/App/NembraCaptureEntrypoint.swift",
               '        let tuyaDependencyLockSHA256: String\n        let tuyaDeviceID: String\n',
               '        let tuyaDependencyLockSHA256: String\n        let procedureIdentifier: String\n        let tuyaDeviceID: String\n')
          once("NembraApp/App/NembraCaptureEntrypoint.swift",
               '    var fieldBuildSourceCommitSHA: String { buildIdentity.sourceCommitSHA }\n    var sdkAccountLoggedIn: Bool',
               '    var fieldBuildSourceCommitSHA: String { buildIdentity.sourceCommitSHA }\n    var fieldProcedureIdentifier: String { NembraCaptureBuildIdentity.fieldProcedureIdentifier }\n    var sdkAccountLoggedIn: Bool')
          once("NembraApp/App/NembraCaptureEntrypoint.swift",
               '            LabeledContent("Source commit", value: test.fieldBuildSourceCommitSHA)\n            LabeledContent("Private SDK config"',
               '            LabeledContent("Source commit", value: test.fieldBuildSourceCommitSHA)\n            LabeledContent("Procedure", value: test.fieldProcedureIdentifier)\n            LabeledContent("Private SDK config"')
          once("NembraApp/App/NembraCaptureEntrypoint.swift",
               '            schemaVersion: 9,\n            purpose: "Sanitized Tuya authenticated read-only stationary preflight",',
               '            schemaVersion: 10,\n            purpose: "Sanitized Tuya authenticated read-only stationary preflight",')
          once("NembraApp/App/NembraCaptureEntrypoint.swift",
               '            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n            tuyaDeviceID: deviceID,',
               '            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n            procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier,\n            tuyaDeviceID: deviceID,')

          runbook=Path("docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md"); s=runbook.read_text(); marker=f"PROCEDURE_ID: `{P}`"
          if marker not in s:
              title="# Nembra Capture P0 — secure-link gate\n"
              if s.count(title)!=1: raise SystemExit("runbook title anchor changed")
              runbook.write_text(s.replace(title,title+"\n"+marker+"\n",1))

          installer=Path("scripts/field/install_one_time_capture.command"); s=installer.read_text()
          if f'PROCEDURE_ID="{P}"' not in s:
              anchor='BUNDLE_ID="com.jonathangana131.nembra.capturelearn"\n'
              if s.count(anchor)!=1: raise SystemExit("installer bundle anchor changed")
              s=s.replace(anchor,anchor+f'PROCEDURE_ID="{P}"\n',1)
          line='    "Field procedure: $PROCEDURE_ID. The same identifier is compiled into the immutable accepted export." \\\n'
          if line not in s:
              anchor='    "The exact built device app was read back before installation and matched the requested source SHA, field-build identifier, and standalone bundle identifier." \\\n'
              if s.count(anchor)!=1: raise SystemExit("installer launch anchor changed")
              s=s.replace(anchor,anchor+line,1)
          installer.write_text(s)

          test=Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift")
          test.write_text(f'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture field procedure rendezvous")
          struct TuyaFieldProcedureRendezvousSourceTests {{
              private static let procedure = "{P}"

              @Test("compiled UI, immutable export, runbook, and installer share one exact procedure")
              func oneProcedureAcrossFieldAuthoritySurfaces() throws {{
                  let identity = try read("NembraApp/App/NembraCaptureBuildIdentity.swift")
                  let app = try read("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let runbook = try read("docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md")
                  let installer = try read("scripts/field/install_one_time_capture.command")
                  #expect(identity.contains("static let fieldProcedureIdentifier = \\\"\\(Self.procedure)\\\""))
                  #expect(app.contains("let procedureIdentifier: String"))
                  #expect(app.contains("procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier"))
                  #expect(app.contains("LabeledContent(\\\"Procedure\\\", value: test.fieldProcedureIdentifier)"))
                  #expect(runbook.contains("PROCEDURE_ID: `\\(Self.procedure)`"))
                  #expect(installer.contains("PROCEDURE_ID=\\\"\\(Self.procedure)\\\""))
                  #expect(installer.contains("Field procedure: $PROCEDURE_ID"))
              }}

              @Test("procedure-bearing accepted export advances beyond dependency-lock schema")
              func exportSchemaAdvances() throws {{
                  let app = try read("NembraApp/App/NembraCaptureEntrypoint.swift")
                  #expect(app.contains("schemaVersion: 10"))
                  #expect(!app.contains("schemaVersion: 9"))
              }}

              private func read(_ path: String) throws -> String {{
                  let root=URL(fileURLWithPath:#filePath).deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent()
                  return try String(contentsOf:root.appendingPathComponent(path),encoding:.utf8)
              }}
          }}
          ''')

          wf=Path(".github/workflows/capture-field-build-provenance.yml"); s=wf.read_text()
          if "TuyaFieldProcedureRendezvousSourceTests.swift" not in s:
              anchor="      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldInstallerIntendedDeviceAuthoritySourceTests.swift\n"
              if anchor not in s: raise SystemExit("provenance path anchor changed")
              s=s.replace(anchor,anchor+"      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift\n",1)
          checks=f'''          grep -Fq 'static let fieldProcedureIdentifier = "{P}"' "$identity"
          grep -Fq 'PROCEDURE_ID="{P}"' "$installer"
          '''
          if f'static let fieldProcedureIdentifier = "{P}"' not in s:
              anchor='          grep -Fq \'static let sourceCommitSHAInfoKey = "NembraCaptureSourceCommitSHA"\' "$identity"\n'
              if anchor not in s: raise SystemExit("provenance identity anchor changed")
              s=s.replace(anchor,anchor+checks,1)
          wf.write_text(s)

          for p in ["NembraApp/App/NembraCaptureBuildIdentity.swift","NembraApp/App/NembraCaptureEntrypoint.swift","docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md","scripts/field/install_one_time_capture.command","Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift"]:
              if P not in Path(p).read_text(): raise SystemExit(f"missing rendezvous in {p}")
          PY
          rm .github/workflows/apply-live-capture-procedure-rendezvous.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): bind exact stationary procedure identity'
          git push origin HEAD:integration/v14-capture-final-stationary-convergence-sol
