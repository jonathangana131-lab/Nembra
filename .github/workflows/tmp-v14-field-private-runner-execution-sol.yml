name: TMP V14 Field Private Runner Execution Sol

on:
  push:
    branches:
      - repair/v14-field-private-runner-execution-sol-20260811
    paths:
      - scripts/ci/tmp_materialize_field_private_runner_execution_sol.py
      - .github/workflows/tmp-v14-field-private-runner-execution-sol.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind exact construction head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize and validate accepted-runner custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tmp_materialize_field_private_runner_execution_sol.py
