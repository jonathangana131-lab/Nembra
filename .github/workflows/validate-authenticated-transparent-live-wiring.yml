name: Validate authenticated transparent live wiring

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
    paths:
      - 'Packages/NembraBluetoothCapture/**'
      - 'Packages/NembraCore/**'
      - 'Nembra/**'
      - 'NembraApp/**'
      - 'NembraCapture/**'
      - 'NembraCaptureTests/**'
      - 'NembraAppTests/**'
      - 'Nembra.xcodeproj/**'
      - '.github/workflows/validate-authenticated-transparent-live-wiring.yml'
  pull_request:
    paths:
      - 'Packages/NembraBluetoothCapture/**'
      - 'Packages/NembraCore/**'
      - 'Nembra/**'
      - 'NembraApp/**'
      - 'NembraCapture/**'
      - 'NembraCaptureTests/**'
      - 'NembraAppTests/**'
      - 'Nembra.xcodeproj/**'
      - '.github/workflows/validate-authenticated-transparent-live-wiring.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-transparent-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-wiring:
    name: Package tests + physical iOS compile
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Resolve immutable source head
        id: source
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test -n "$PR_HEAD_SHA"
            printf 'sha=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout immutable exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout and trusted toolchain
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          printf 'Expected exact head: %s\nActual checkout: %s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          xcodebuild -version
          swift --version
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py

      - name: Run Bluetooth capture package tests
        id: package_tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          swift test --package-path Packages/NembraBluetoothCapture 2>&1 | tee "${RUNNER_TEMP}/nembra-bluetooth-capture-tests.log"
          rc=${PIPESTATUS[0]}
          if [[ "$rc" -eq 0 ]]; then
            printf 'result=success\n' >> "$GITHUB_OUTPUT"
          else
            printf 'result=failure\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'exit_code=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compile authenticated live wiring for physical iOS
        id: physical_ios_compile
        shell: bash
        run: |
          set +e
          set -o pipefail
          derived="${RUNNER_TEMP}/NembraAuthenticatedTransparentLive"
          rm -rf "$derived"
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "${RUNNER_TEMP}/nembra-authenticated-transparent-live-build.log"
          rc=${PIPESTATUS[0]}
          if [[ "$rc" -eq 0 ]]; then
            printf 'result=success\n' >> "$GITHUB_OUTPUT"
          else
            printf 'result=failure\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'exit_code=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record semantics-free validation boundary
        if: always()
        shell: bash
        env:
          PACKAGE_TEST_RESULT: ${{ steps.package_tests.outputs.result }}
          PACKAGE_TEST_EXIT_CODE: ${{ steps.package_tests.outputs.exit_code }}
          PHYSICAL_IOS_COMPILE_RESULT: ${{ steps.physical_ios_compile.outputs.result }}
          PHYSICAL_IOS_COMPILE_EXIT_CODE: ${{ steps.physical_ios_compile.outputs.exit_code }}
          VALIDATED_HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          derived="${RUNNER_TEMP}/NembraAuthenticatedTransparentLive"
          app_bundle="$(find "$derived/Build/Products" -maxdepth 3 -type d -name '*.app' -print -quit 2>/dev/null || true)"
          app_bundle_present=false
          if [[ -n "$app_bundle" && -f "$app_bundle/Info.plist" ]]; then
            app_bundle_present=true
          fi

          line="AUTHENTICATED_TRANSPARENT_LIVE_VALIDATION head=${VALIDATED_HEAD_SHA} packageTests=${PACKAGE_TEST_RESULT:-not-run} packageExit=${PACKAGE_TEST_EXIT_CODE:-unknown} physicalIOSCompile=${PHYSICAL_IOS_COMPILE_RESULT:-not-run} physicalIOSExit=${PHYSICAL_IOS_COMPILE_EXIT_CODE:-unknown} appBundlePresent=${app_bundle_present} physicalHardwareEvidence=false dpSemanticsAssigned=false scooterWritesAuthorized=false resetOrUnbindAuthorized=false"
          printf '%s\n' "$line"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY" || true
          fi

          if [[ "$app_bundle_present" != "true" && "${PHYSICAL_IOS_COMPILE_RESULT:-}" == "success" ]]; then
            printf '%s\n' 'Warning: xcodebuild succeeded but no .app bundle was found under the configured DerivedData products directory. Compile result remains authoritative; physicalHardwareEvidence remains false.' >&2
          fi
          exit 0

      - name: Enforce engineering validation gate
        if: always()
        shell: bash
        env:
          PACKAGE_TEST_RESULT: ${{ steps.package_tests.outputs.result }}
          PHYSICAL_IOS_COMPILE_RESULT: ${{ steps.physical_ios_compile.outputs.result }}
        run: |
          set -euo pipefail
          printf 'Engineering gate: packageTests=%s physicalIOSCompile=%s\n' "${PACKAGE_TEST_RESULT:-not-run}" "${PHYSICAL_IOS_COMPILE_RESULT:-not-run}"
          test "${PACKAGE_TEST_RESULT:-}" = "success"
          test "${PHYSICAL_IOS_COMPILE_RESULT:-}" = "success"
