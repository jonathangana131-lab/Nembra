name: Validate authenticated transparent live wiring

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
    paths:
      - 'Packages/NembraBluetoothCapture/**'
      - 'Nembra/**'
      - 'NembraCapture/**'
      - 'NembraCaptureTests/**'
      - '.github/workflows/validate-authenticated-transparent-live-wiring.yml'
  pull_request:
    paths:
      - 'Packages/NembraBluetoothCapture/**'
      - 'Nembra/**'
      - 'NembraCapture/**'
      - 'NembraCaptureTests/**'
      - '.github/workflows/validate-authenticated-transparent-live-wiring.yml'

permissions:
  contents: read

jobs:
  package-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bluetooth capture package tests
        run: swift test --package-path Packages/NembraBluetoothCapture
