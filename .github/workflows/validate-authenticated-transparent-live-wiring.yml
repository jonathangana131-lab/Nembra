name: Validate authenticated transparent live wiring

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
    paths:
      - 'Packages/NembraBluetoothCapture/**'
      - 'Packages/NembraCore/**'
      - 'Nembra/**'
      - 'NembraApp/**'
      - 'NembraCapture/**'
      - 'NembraCaptureTests/**'
      - 'NembraAppTests/**'
      - 'Nembra.xcodeproj/**'
      - '.github/workflows/validate-authenticated-transparent-live-wiring.yml'
  pull_request:
    paths:
      - 'Packages/NembraBluetoothCapture/**'
      - 'Packages/NembraCore/**'
      - 'Nembra/**'
      - 'NembraApp/**'
      - 'NembraCapture/**'
      - 'NembraCaptureTests/**'
      - 'NembraAppTests/**'
      - 'Nembra.xcodeproj/**'
      - '.github/workflows/validate-authenticated-transparent-live-wiring.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-transparent-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-wiring:
    name: Package tests + physical iOS compile
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Resolve immutable source head
        id: source
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test -n "$PR_HEAD_SHA"
            printf 'sha=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout immutable exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout and trusted toolchain
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          printf 'Expected exact head: %s\nActual checkout: %s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          xcodebuild -version
          swift --version
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py

      - name: Run Bluetooth capture package tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          swift test --package-path Packages/NembraBluetoothCapture 2>&1 | tee "${RUNNER_TEMP}/nembra-bluetooth-capture-tests.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "${RUNNER_TEMP}/nembra-package-tests.exit"
          exit 0

      - name: Compile authenticated live wiring for physical iOS
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          derived="${RUNNER_TEMP}/NembraAuthenticatedTransparentLive"
          rm -rf "$derived"
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "${RUNNER_TEMP}/nembra-authenticated-transparent-live-build.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "${RUNNER_TEMP}/nembra-physical-ios-compile.exit"
          exit 0

      - name: Record semantics-free validation boundary
        if: always()
        shell: bash
        env:
          VALIDATED_HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          package_rc="$(cat "${RUNNER_TEMP}/nembra-package-tests.exit" 2>/dev/null || printf 'missing')"
          compile_rc="$(cat "${RUNNER_TEMP}/nembra-physical-ios-compile.exit" 2>/dev/null || printf 'missing')"
          package_result=failure
          compile_result=failure
          [[ "$package_rc" == "0" ]] && package_result=success
          [[ "$compile_rc" == "0" ]] && compile_result=success

          derived="${RUNNER_TEMP}/NembraAuthenticatedTransparentLive"
          app_bundle="$(find "$derived/Build/Products" -maxdepth 3 -type d -name '*.app' -print -quit 2>/dev/null || true)"
          app_bundle_present=false
          if [[ -n "$app_bundle" && -f "$app_bundle/Info.plist" ]]; then
            app_bundle_present=true
          fi

          line="AUTHENTICATED_TRANSPARENT_LIVE_VALIDATION head=${VALIDATED_HEAD_SHA} packageTests=${package_result} packageExit=${package_rc} physicalIOSCompile=${compile_result} physicalIOSExit=${compile_rc} appBundlePresent=${app_bundle_present} physicalHardwareEvidence=false dpSemanticsAssigned=false scooterWritesAuthorized=false resetOrUnbindAuthorized=false"
          printf '%s\n' "$line"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0

      - name: Enforce engineering validation gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          package_rc="$(cat "${RUNNER_TEMP}/nembra-package-tests.exit" 2>/dev/null || printf 'missing')"
          compile_rc="$(cat "${RUNNER_TEMP}/nembra-physical-ios-compile.exit" 2>/dev/null || printf 'missing')"
          printf 'Engineering gate: packageExit=%s physicalIOSExit=%s\n' "$package_rc" "$compile_rc"
          test "$package_rc" = "0"
          test "$compile_rc" = "0"
