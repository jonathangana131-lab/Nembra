name: Capture Private Identity Publication Name Binding Red Team

on:
  push:
    branches:
      - adversarial/v14-private-identity-publication-name-race-sol-20260811
  pull_request:
    paths:
      - Scripts/provision_capture_tuya_identity_writer.py
      - scripts/ci/tests/test_capture_private_identity_publication_name_binding_races.py
      - .github/workflows/capture-private-identity-publication-name-binding-redteam.yml

permissions:
  contents: read

jobs:
  source-name-race:
    name: Source name swap after sealed check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind to exact checked-out head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile red team
        run: python3 -m py_compile scripts/ci/tests/test_capture_private_identity_publication_name_binding_races.py
      - name: Reject post-check source-name substitution
        run: >-
          python3 -m unittest -v
          scripts.ci.tests.test_capture_private_identity_publication_name_binding_races.PrivateIdentityPublicationNameBindingRaceTests.test_source_name_swap_after_sealed_check_cannot_leave_attacker_destination

  destination-name-race:
    name: Destination name swap after verified open
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind to exact checked-out head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile red team
        run: python3 -m py_compile scripts/ci/tests/test_capture_private_identity_publication_name_binding_races.py
      - name: Reject post-open destination-name substitution
        run: >-
          python3 -m unittest -v
          scripts.ci.tests.test_capture_private_identity_publication_name_binding_races.PrivateIdentityPublicationNameBindingRaceTests.test_destination_name_swap_after_verified_open_cannot_return_success
