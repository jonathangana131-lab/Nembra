name: Materialize Capture Strong Exit Retirement bcea

on:
  push:
    branches:
      - sol/v14-capture-strong-exit-retirement-bcea-20260810

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-strong-exit-retirement-bcea-20260810
          fetch-depth: 0

      - name: Apply bounded strong-retirement lifetime fix
        shell: bash
        run: |
          set -euo pipefail
          parent='bcea598c9a520064e1c4de9b47dcd0143685b3a1'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --quiet "$parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          app=Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s=app.read_text()
          old="            Task { @MainActor [weak self] in\n                guard let self else { return }\n                await self.invalidateInternalLifecycle(\n"
          new="            Task { @MainActor [self] in\n                await self.invalidateInternalLifecycle(\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one weak active-generation exit retirement, found {s.count(old)}')
          app.write_text(s.replace(old,new,1))

          test=Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift')
          t=test.read_text()
          anchor='        #expect(cleanup.contains("invalidateInternalLifecycle("))\n'
          addition='        #expect(cleanup.contains("Task { @MainActor [self] in"))\n        #expect(!cleanup.contains("Task { @MainActor [weak self] in"))\n'
          if t.count(anchor) != 1:
              raise SystemExit('active-generation exit assertion anchor changed')
          test.write_text(t.replace(anchor,anchor+addition,1))
          PY

      - name: Verify exact cleanup contract
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          a=s.index('func abandonCorrelationForViewExit()')
          b=s.index('var privateConfig: Bool',a)
          c=s[a:b]
          assert 'acceptsViewScopedMembershipRequests = false' in c
          assert 'officialConnectionRequestID = UUID()' in c
          assert 'Task { @MainActor [self] in' in c
          assert 'Task { @MainActor [weak self] in' not in c
          assert 'await self.invalidateInternalLifecycle(' in c
          assert 'disconnectBLE' not in c
          t=Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift').read_text()
          assert '#expect(cleanup.contains("Task { @MainActor [self] in"))' in t
          assert '#expect(!cleanup.contains("Task { @MainActor [weak self] in"))' in t
          PY
          git diff --check

      - name: Publish clean two-path current-product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-strong-exit-retirement-bcea.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): retain controller through exit retirement'
          git push origin HEAD:sol/v14-capture-strong-exit-retirement-bcea-20260810
