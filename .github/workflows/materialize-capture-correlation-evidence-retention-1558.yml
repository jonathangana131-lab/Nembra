name: Materialize Capture Correlation Evidence Retention 1558

on:
  push:
    branches:
      - fix/v14-capture-correlation-evidence-retention-1558-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-correlation-evidence-retention-1558-sol
          fetch-depth: 0

      - name: Guard exact lineage and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          base='1558e1bf38c2aad809887a77a3bc4cabe1704e39'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"...HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/scripts/materialize_capture_correlation_evidence_retention_1558.py' \
            '.github/workflows/materialize-capture-correlation-evidence-retention-1558.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureAuthorityLossCorrelationEvidenceRetentionSourceTests.swift' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Apply and verify retention repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize_capture_correlation_evidence_retention_1558.py apply
          python3 .github/scripts/materialize_capture_correlation_evidence_retention_1558.py verify
          python3 -m py_compile .github/scripts/materialize_capture_correlation_evidence_retention_1558.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureAuthorityLossCorrelationEvidenceRetentionSourceTests.swift
          git diff --check

      - name: Publish clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-correlation-evidence-retention-1558.yml
          rm .github/scripts/materialize_capture_correlation_evidence_retention_1558.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): preserve sealed correlation evidence on authority loss'
          git push origin HEAD:fix/v14-capture-correlation-evidence-retention-1558-sol
