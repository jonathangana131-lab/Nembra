name: Capture Field Verified Git Payload

on:
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_field_verified_git_payload.py
      - .github/workflows/capture-field-verified-git-payload.yml

permissions:
  contents: read

jobs:
  verified-git-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact product head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Reject aliased Git execution payloads
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_verified_git_payload.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_verified_git_payload.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          git diff --check
