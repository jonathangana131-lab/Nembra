name: Capture UI integration audit patch

on:
  push:
    branches:
      - capture/ui-integration-audit-gpt56

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'GO capture UI integration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/ui-integration-audit-gpt56
          fetch-depth: 0

      - name: Fast-forward exact audit branch
        run: |
          set -euo pipefail
          git fetch origin capture/ui-integration-audit-gpt56
          git merge --ff-only origin/capture/ui-integration-audit-gpt56

      - name: Materialize package and app integration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ledger_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift')
          ledger = ledger_path.read_text()

          reason_anchor = '    private static let internalLifecycleFailureReason =\n        "Session authority was retired after an internal lifecycle or chronology failure."\n'
          reason_addition = '    private static let incompleteObservationHorizonFailurePrefix =\n        "Authenticated observation reached the bounded incomplete-evidence horizon: "\n'
          if ledger.count(reason_anchor) != 1:
              raise SystemExit('fail closed: ledger reason anchor changed')
          ledger = ledger.replace(reason_anchor, reason_anchor + reason_addition, 1)

          horizon_old = '\n'.join([
              '        guard TuyaAuthenticatedReadOnlyPreflight.verdict(for: makeSnapshot()) != .readyForStationaryMapping else {',
              '            return',
              '        }',
              '        throw MutationError.incompleteObservationHorizonReached',
          ]) + '\n'
          horizon_new = '\n'.join([
              '        let verdict = TuyaAuthenticatedReadOnlyPreflight.verdict(for: makeSnapshot())',
              '        guard verdict != .readyForStationaryMapping else {',
              '            return',
              '        }',
              '        let blocker: String',
              '        switch verdict {',
              '        case .readyForStationaryMapping:',
              '            return',
              '        case let .blocked(reason):',
              '            blocker = reason',
              '        }',
              '        authenticationState = .failed(reason: Self.incompleteObservationHorizonFailurePrefix + blocker)',
              '        currentToken = nil',
              '        throw MutationError.incompleteObservationHorizonReached',
          ]) + '\n'
          if ledger.count(horizon_old) != 1:
              raise SystemExit('fail closed: ledger horizon anchor changed')
          ledger = ledger.replace(horizon_old, horizon_new, 1)

          doc_old = '    /// deadline is evaluated against the already-accepted prefix before the receipt can advance\n    /// chronology; the exact token stays current on throw so the app\'s existing fail-closed\n    /// lifecycle terminal can retire it without inventing a BLE disconnect or a second clock sample.\n'
          doc_new = '    /// deadline is evaluated against the already-accepted prefix before the receipt can advance\n    /// chronology. An incomplete generation is terminally retired by the package at that boundary;\n    /// the triggering receipt is not promoted into accepted chronology and no BLE disconnect is claimed.\n'
          if ledger.count(doc_old) != 1:
              raise SystemExit('fail closed: ledger documentation anchor changed')
          ledger_path.write_text(ledger.replace(doc_old, doc_new, 1))

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text()

          def scoped_replace(source, section_start, section_end, old, new, label):
              start = source.find(section_start)
              end = source.find(section_end, start + len(section_start))
              if start < 0 or end < 0:
                  raise SystemExit(f'fail closed: {label} section missing')
              section = source[start:end]
              if section.count(old) != 1:
                  raise SystemExit(f'fail closed: {label} anchor count={section.count(old)}')
              section = section.replace(old, new, 1)
              return source[:start] + section + source[end:]

          callback_old = '        } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {\n            log("stale_application_update_ignored", ["generation": String(token.diagnosticGeneration)])\n'
          callback_new = '\n'.join([
              '        } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached {',
              '            await mirrorAlreadyTerminalIncompleteObservationHorizon(',
              '                token: token,',
              '                message: "Authenticated observation reached the bounded incomplete-evidence horizon before canonical readiness. The accepted prefix was frozen without promoting this late application callback and no Bluetooth disconnect is claimed.",',
              '                kind: "application_authenticated_incomplete_readiness_horizon_reached"',
              '            )',
              '        } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {',
              '            log("stale_application_update_ignored", ["generation": String(token.diagnosticGeneration)])',
          ]) + '\n'
          app = scoped_replace(app, '    private func receivedApplicationUpdate(', '    private func redactedApplicationEventDetails(', callback_old, callback_new, 'application callback')

          watchdog_old = '                } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {\n                    self.log("stale_watchdog_generation_retired", ["generation": String(token.diagnosticGeneration)])\n'
          watchdog_new = '\n'.join([
              '                } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached {',
              '                    await self.mirrorAlreadyTerminalIncompleteObservationHorizon(',
              '                        token: token,',
              '                        message: "Authenticated observation reached the bounded incomplete-evidence horizon before canonical readiness. The accepted prefix was frozen without another liveness sample and no Bluetooth disconnect is claimed.",',
              '                        kind: "session_authenticated_incomplete_readiness_horizon_reached"',
              '                    )',
              '                    return',
              '                } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {',
              '                    self.log("stale_watchdog_generation_retired", ["generation": String(token.diagnosticGeneration)])',
          ]) + '\n'
          app = scoped_replace(app, '    private func startWatchdog(token:', '    private func recordObservedTransportLoss(', watchdog_old, watchdog_new, 'watchdog')

          helper_anchor = '    private func invalidateObservationContinuity(\n'
          helper = '\n'.join([
              '    /// Mirrors the package-owned incomplete-observation terminal. The throwing ledger mutation',
              '    /// already froze the accepted prefix and retired callback authority, so this helper must not',
              '    /// sample another clock, claim transport loss, or invoke a second ledger terminal.',
              '    private func mirrorAlreadyTerminalIncompleteObservationHorizon(',
              '        token: TuyaReadOnlyConnectionToken,',
              '        message: String,',
              '        kind: String',
              '    ) async {',
              '        guard currentConnectionToken == token else { return }',
              '        watchdog?.cancel()',
              '        watchdog = nil',
              '        currentConnectionToken = nil',
              '        localBLESettlementToken = nil',
              '        sdkLocalBLEOnline = false',
              '        driver = nil',
              '        await refreshLedgerSnapshot()',
              '        phase = .failed',
              '        self.message = message',
              '        log(kind, ["generation": String(token.diagnosticGeneration)])',
              '    }',
              '',
          ]) + '\n'
          if app.count(helper_anchor) != 1:
              raise SystemExit('fail closed: helper anchor changed')
          app = app.replace(helper_anchor, helper + helper_anchor, 1)

          timeout_start = '                if self.applicationUpdateAdmissionsInFlight == 0,\n                   (self.canonicalObservedAgeSeconds ?? 0) > 60,\n                   self.applicationUpdateCount == 0 {\n'
          start = app.find(timeout_start)
          sleep_anchor = '                try? await Task.sleep(for: .seconds(1))\n'
          end = app.find(sleep_anchor, start + 1) if start >= 0 else -1
          if start < 0 or end < 0:
              raise SystemExit('fail closed: duplicate app deadline block changed')
          app = app[:start] + app[end:]
          app_path.write_text(app)

          Path('.github/workflows/capture-app-horizon-patch-go.yml').unlink(missing_ok=True)
          Path('.github/workflows/capture-ui-integration-audit-patch.yml').unlink(missing_ok=True)
          Path('.github/capture-ui-integration-audit-trigger').unlink(missing_ok=True)
          PY

          git diff --check
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift .github/workflows/capture-app-horizon-patch-go.yml

      - name: Commit exact product delta
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          test ! -e .github/workflows/capture-ui-integration-audit-patch.yml
          test ! -e .github/capture-ui-integration-audit-trigger
          git diff --cached --name-only
          git commit -m 'Capture: preserve incomplete-horizon truth in app'
          git push origin HEAD:capture/ui-integration-audit-gpt56
