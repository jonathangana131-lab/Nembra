name: Capture Root AX Precision Finish

on:
  push:
    branches:
      - recovery/v14-capture-root-truth-visual-convergence-sol2
    paths:
      - '.github/workflows/capture-root-ax-precision-finish.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact convergence parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3c1d4394b7b443936240131e6d0d91ca01e49383 HEAD
          unexpected="$(git diff --name-only 3c1d4394b7b443936240131e6d0d91ca01e49383 HEAD | grep -Ev '^(\.github/scripts/capture_root_ax_precision_finish\.py|\.github/workflows/capture-root-ax-precision-finish\.yml)$' || true)"
          test -z "$unexpected"

      - name: Materialize product change
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/capture_root_ax_precision_finish.py
          git diff --check
          grep -Fq 'Text(fieldBuildIsAuthoritative ? "Build provenance ready" : "Physical capture locked")' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'NavigationLink(fieldBuildIsAuthoritative ? "Continue to preflight" : "View locked preflight")' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq '.accessibilityIdentifier("nembra.capture.root.account-link-action")' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq '.accessibilityAddTraits(.isHeader)' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Commit product-only result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/capture_root_ax_precision_finish.py
          git rm .github/workflows/capture-root-ax-precision-finish.yml
          git diff --check
          git config user.name 'Nembra Capture Closure'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m 'ui(capture): tighten AX first fold without weakening truth'
          git push origin HEAD:recovery/v14-capture-root-truth-visual-convergence-sol2
