name: Capture authorization materialization recovery

on:
  push:
    branches:
      - recovery/v14-capture-auth-materialize-sol-20260821
    paths:
      - .github/workflows/capture-auth-materialize-recovery-sol.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: xcode-27
    timeout-minutes: 40
    concurrency:
      group: capture-auth-materialize-recovery-sol
      cancel-in-progress: false
    env:
      TARGET_BRANCH: recovery/v14-capture-auth-materialize-sol-20260821
      CARRIER_PARENT: 9aeba91c4bec69a1b05f7f6f57ef075ee1c21c6e
      EXPECTED_SOURCE_BLOB: 627c17949d15aaf26ca28c12abb9bb684ab0e731
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      REVIEWED_MATERIALIZER: .github/workflows/capture-app-authorization-close-one-shot.yml
      RECOVERY_WORKFLOW: .github/workflows/capture-auth-materialize-recovery-sol.yml
    steps:
      - name: Checkout exact recovery trigger
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind recovery to exact carrier and sole source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test -f "$REVIEWED_MATERIALIZER"
          test -f "$RECOVERY_WORKFLOW"
          test "$(git diff --name-only HEAD^ HEAD)" = "$RECOVERY_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute reviewed carrier lifecycle transform
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/capture-app-authorization-close-one-shot.yml").read_text(encoding="utf-8")
          section = workflow.index("      - name: Materialize field authorization into real SecureLink lifecycle")
          run_marker = "        run: |\n"
          start = workflow.index(run_marker, section) + len(run_marker)
          end = workflow.index("\n      - name: Enforce truth-preserving source shape", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, "capture-app-authorization-reviewed-materializer", "exec"), {"__name__": "__main__"})

      - name: Enforce fail-closed lifecycle source shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'import NembraCaptureAppAuthorization' "$APP_SOURCE"
          grep -Fq 'private let fieldAuthorization = NembraCaptureFieldAuthorizationController()' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'publishDps(' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'writeValue(' "$APP_SOURCE")" = 0
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py

      - name: Run focused authorization truth contracts
        shell: bash
        run: |
          set -euo pipefail
          cd Packages/NembraBluetoothCapture
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NembraCaptureAuthRecoverySol" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish tested app-source-only recovery successor
        shell: bash
        run: |
          set -euo pipefail
          rm "$RECOVERY_WORKFLOW"
          git add -- "$APP_SOURCE" "$RECOVERY_WORKFLOW"
          git diff --cached --check
          actual="$(git diff --cached --name-status | LC_ALL=C sort)"
          expected="$(printf 'D\t%s\nM\t%s\n' "$RECOVERY_WORKFLOW" "$APP_SOURCE" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(capture): materialize one-time field authorization lifecycle'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CAPTURE_AUTH_RECOVERY materialized=%s parent=%s physicalAuthorityCreated=false\n' "$(git rev-parse HEAD)" "$CARRIER_PARENT"
