name: TEMP Capture Private Review R4 Parent Custody Materializer

on:
  push:
    branches:
      - recovery/v14-private-review-r4-current-r3-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: recovery/v14-private-review-r4-current-r3-sol-20260811
          fetch-depth: 0

      - name: Materialize accepted-parent execution custody
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tmp_materialize_private_review_r4_parent_custody.py

      - name: Compile R4 and custody regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py

      - name: Prove generated-parent execution custody
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tests/test_es80_private_review_parent_module_execution_custody.py

      - name: Preserve R4 private-review carriage contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py

      - name: Publish non-workflow product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/ci/tmp_materialize_private_review_r4_parent_custody.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tmp_materialize_private_review_r4_parent_custody.py
          git diff --cached --check
          git commit -m 'Capture: pin R4 generated-parent execution to accepted Git bytes'
          git push origin HEAD:recovery/v14-private-review-r4-current-r3-sol-20260811
