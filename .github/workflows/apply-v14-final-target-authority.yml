name: Apply V14 final Capture target authority

on:
  push:
    branches: [integration/v14-capture-final-target-authority-sol]
    paths:
      - '.github/workflows/apply-v14-final-target-authority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact lifecycle-spine inputs
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "1f675fb77e0c41748f18c82280690db6a8d880d8"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldGoPrerequisiteSourceTests.swift)" = "bb6e9f418876ed2524091690b0433928294ac5f2"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldFinalAuthoritySourceTests.swift)" = "446fd0423b73f99e94c695701eba5e52bdbbdc5a"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaTransportSuccessAuthoritySourceTests.swift)" = "b0683c4942b8201dfd0ae2a857f1a1e2fe4b9d35"
          python3 -m py_compile .ci-patches/apply-v14-final-target-authority.py

      - name: Apply deterministic composition
        run: |
          set -euo pipefail
          python3 .ci-patches/apply-v14-final-target-authority.py
          git diff --check
          ! grep -Fq 'var likely: Bool { knownID }' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'accepted-prior-physical-corebluetooth-uuid' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'func confirmCorrelatedTarget()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'targetCorrelation: CorrelationExport?' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'markChronologyIntegrityInvalidated(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'localBLESettlementToken' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Commit composed product and retire helper
        run: |
          set -euo pipefail
          rm .ci-patches/apply-v14-final-target-authority.py
          rm .github/workflows/apply-v14-final-target-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): compose fresh target onto lifecycle-safe spine"
          git push origin HEAD:integration/v14-capture-final-target-authority-sol
