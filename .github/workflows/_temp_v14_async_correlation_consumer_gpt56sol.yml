name: Temporary V14 async-correlation consumer repair

on:
  push:
    branches:
      - repair/v14-capture-async-correlation-consumer-gpt56sol

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v6
        with:
          ref: repair/v14-capture-async-correlation-consumer-gpt56sol

      - name: Apply current-head fail-closed lifecycle consumer
        run: python3 scripts/_temp_apply_v14_async_correlation_consumer_gpt56sol.py

      - name: Verify current source contract tokens
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'func consumeCorrelationAsyncInvalidation()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -F '.onChange(of: test.correlationProgress?.isSeriesInvalidated)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -F 'target_correlation_async_invalidated' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -F 'Restart from OFF1' NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationAsyncInvalidationPresentationSourceTests.swift
          git diff --check

      - name: Remove temporary patch transport and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_temp_v14_async_correlation_consumer_gpt56sol.yml
          git rm scripts/_temp_apply_v14_async_correlation_consumer_gpt56sol.py
          git config user.name 'nembra-v14-gpt56sol'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(capture): consume asynchronous correlation invalidation'
          git push origin HEAD:repair/v14-capture-async-correlation-consumer-gpt56sol
