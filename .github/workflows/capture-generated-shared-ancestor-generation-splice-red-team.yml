name: Capture Generated Shared Ancestor Generation Splice Red Team

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_generated_shared_ancestor_generation_splice_red_team.py
      - .github/workflows/capture-generated-shared-ancestor-generation-splice-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-generated-shared-ancestor-generation-splice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_ATTACKED_PARENT: fe40c025eb10247c73820f4001ab63affaa60af7

jobs:
  exploit-positive:
    name: Prove LocalSecrets subject-generation splice
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact merged accepted-input head and diagnostic-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_ATTACKED_PARENT")" = "$EXACT_ATTACKED_PARENT"
          test "$(git rev-parse "$EXACT_ATTACKED_PARENT:scripts/ci/capture_accepted_build_input_snapshot.py")" = \
               "$(git rev-parse "HEAD:scripts/ci/capture_accepted_build_input_snapshot.py")"
          changed="$(git diff --name-only "$EXACT_ATTACKED_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-generated-shared-ancestor-generation-splice-red-team.yml \
            scripts/ci/tests/test_capture_generated_shared_ancestor_generation_splice_red_team.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_ATTACKED_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute exploit-positive mixed-generation manifest witness
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_generation_splice_red_team.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve expected-red truth boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "NEMBRA_GENERATED_SHARED_ANCESTOR_SPLICE exploitReproduced=true productionAccepted=false inputAdmissionAccepted=false signingAuthorityCreated=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false"
