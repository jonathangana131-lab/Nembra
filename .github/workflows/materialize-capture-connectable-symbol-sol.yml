name: Materialize Capture connectable symbol repair

on:
  push:
    branches:
      - recovery/v14-capture-current-head-contract-sol-2

permissions:
  contents: write

jobs:
  patch:
    name: Repair CoreBluetooth connectable key and compile
    if: github.actor != 'github-actions[bot]'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: recovery/v14-capture-current-head-contract-sol-2
          fetch-depth: 0

      - name: Prove exact accepted recovery parent and workflow-only staging
        shell: bash
        run: |
          set -euo pipefail
          expected='f0fb83da5f57f9e92d29cf6ab444dc856e74c3a4'
          test "$(git merge-base HEAD "$expected")" = "$expected"
          test "$(git diff --name-only "$expected" HEAD)" = '.github/workflows/materialize-capture-connectable-symbol-sol.yml'

      - name: Apply exact CoreBluetooth symbol correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/Features/Research/ES80CaptureShellView.swift')
          text = path.read_text()
          old = 'CBAdvertisementDataIsConnectableKey'
          new = 'CBAdvertisementDataIsConnectable'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly two stale connectable symbols, found {count}')
          path.write_text(text.replace(old, new))
          PY
          grep -Fq 'advertisementData[CBAdvertisementDataIsConnectable] as? NSNumber' NembraApp/Features/Research/ES80CaptureShellView.swift
          test "$(grep -c 'CBAdvertisementDataIsConnectable]' NembraApp/Features/Research/ES80CaptureShellView.swift)" = '2'
          ! grep -Fq 'CBAdvertisementDataIsConnectableKey' NembraApp/Features/Research/ES80CaptureShellView.swift
          git diff --check
          test "$(git diff --name-only)" = 'NembraApp/Features/Research/ES80CaptureShellView.swift'

      - name: Compile stamped standalone Simulator app
        shell: bash
        run: |
          set -euo pipefail
          dependency_sha='abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
          procedure='ES80-AUTHENTICATED-STATIONARY-v1'
          source_sha='f0fb83da5f57f9e92d29cf6ab444dc856e74c3a4'
          label="capture-v14-${source_sha:0:12}"
          rm -rf /tmp/NembraCaptureConnectableDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureConnectableDerived \
            CODE_SIGNING_ALLOWED=NO \
            NEMBRA_CAPTURE_BUILD_IDENTIFIER="$label" \
            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$source_sha" \
            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="$dependency_sha" \
            INFOPLIST_KEY_NembraCaptureProcedureIdentifier="$procedure" \
            build

      - name: Commit compile repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-worker'
          git config user.email 'nembra-go-worker@users.noreply.github.com'
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git commit -m 'fix(capture): use CoreBluetooth connectable advertisement key'
          git push origin HEAD:recovery/v14-capture-current-head-contract-sol-2
