name: Materialize Capture Export Secret Promise 665

on:
  push:
    branches:
      - sol/v14-capture-export-secret-promise-4b41

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current product
        shell: bash
        run: |
          set -euo pipefail
          parent=66576b4eb449bbf158f431f546b34353fabab773
          product=product/v14-capture-guided-truth-current-sol
          git fetch origin "$product"
          current_product=$(git rev-parse "origin/$product")
          test "$current_product" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Apply export-promise classifier repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text(encoding="utf-8")
          old = "    private static let secretKeyFragments = [\n        \"localkey\",\n        \"accesstoken\",\n        \"refreshtoken\",\n        \"sessionkey\",\n        \"authkey\",\n        \"seckey\",\n    ]\n"
          new = "    private static let secretKeyFragments = [\n        \"localkey\",\n        \"sessionkey\",\n        \"appkey\",\n        \"appsecret\",\n        \"password\",\n        \"accounttoken\",\n        \"accesstoken\",\n        \"refreshtoken\",\n        \"authkey\",\n        \"seckey\",\n    ]\n"
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          for fragment in ("localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey"):
              assert f'"{fragment}"' in source
          assert 'String(describing: Self.redactApplicationSecrets(value))' in source
          assert 'onApplicationUpdate?(sanitized)' in source
          PY
          git diff --check

      - name: Recheck live product and publish clean repair
        shell: bash
        run: |
          set -euo pipefail
          parent=66576b4eb449bbf158f431f546b34353fabab773
          product=product/v14-capture-guided-truth-current-sol
          workflow=.github/workflows/materialize-capture-export-secret-promise-665-sol.yml
          testfile=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift
          app=NembraApp/App/NembraCaptureEntrypoint.swift

          git fetch origin "$product"
          current_product=$(git rev-parse "origin/$product")
          test "$current_product" = "$parent"

          rm "$workflow"
          git add "$app" "$testfile"
          git add -u "$workflow"
          git diff --cached --check
          git -c user.name=nembra-sol -c user.email=nembra-sol@users.noreply.github.com commit -m "fix(capture): align application redaction with export promise"

          changed=$(git diff --name-only "$parent" HEAD | sort)
          expected=$(printf '%s\n%s\n' "$app" "$testfile" | sort)
          test "$changed" = "$expected"
          git diff --check "$parent" HEAD
          git push origin HEAD:sol/v14-capture-export-secret-promise-4b41
