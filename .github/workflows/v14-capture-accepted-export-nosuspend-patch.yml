name: V14 Capture Accepted Export No-Suspend Patch

on:
  push:
    branches:
      - integration/v14-capture-accepted-export-artifact-sol

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-accepted-export-artifact-sol
          fetch-depth: 0

      - name: Tighten accepted artifact freeze ordering
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          old_lines = [
              "                        try await sessionLedger.sealAcceptedObservation(for: token)",
              "                        let acceptedEventPrefix = self.events",
              "                        self.sealedAcceptedEventPrefix = acceptedEventPrefix",
              "                        self.currentConnectionToken = nil",
              "                        await self.refreshLedgerSnapshot()",
              "                        self.sealedAcceptedExport = self.makeExport(",
              "                            exportedAt: Date(),",
              "                            phase: .accepted,",
              "                            events: acceptedEventPrefix",
              "                        )",
              "                        self.exportData = nil",
              "                        self.phase = .accepted",
              "                        self.message = \"Secure scooter link established. Canonical readiness was sealed before UI acceptance; delayed callbacks cannot mutate the accepted prefix.\"",
              "                        self.log(\"acceptance_sealed\", [",
              "                            \"generation\": String(token.diagnosticGeneration),",
              "                            \"applicationUpdates\": String(self.applicationUpdateCount),",
              "                            \"buildIdentifier\": self.buildIdentity.buildIdentifier,",
              "                            \"sourceCommitSHA\": self.buildIdentity.sourceCommitSHA",
              "                        ])",
          ]
          new_lines = [
              "                        try await sessionLedger.sealAcceptedObservation(for: token)",
              "                        guard self.buildIdentity.isAuthoritativeFieldBuild,",
              "                              self.accountIdentityLeaseIsAuthorized else {",
              "                            self.currentConnectionToken = nil",
              "                            self.localBLESettlementToken = nil",
              "                            self.sdkLocalBLEOnline = false",
              "                            self.driver = nil",
              "                            self.phase = .failed",
              "                            self.message = \"Source authority changed while canonical acceptance was sealing. Restart from OFF1; the sealed package chronology is diagnostic only.\"",
              "                            self.log(\"source_authority_changed_during_acceptance_seal\", [",
              "                                \"generation\": String(token.diagnosticGeneration)",
              "                            ])",
              "                            return",
              "                        }",
              "                        let acceptedEventPrefix = self.events",
              "                        self.sealedAcceptedEventPrefix = acceptedEventPrefix",
              "                        self.currentConnectionToken = nil",
              "                        self.sealedAcceptedExport = self.makeExport(",
              "                            exportedAt: Date(),",
              "                            phase: .accepted,",
              "                            events: acceptedEventPrefix",
              "                        )",
              "                        self.exportData = nil",
              "                        self.phase = .accepted",
              "                        self.message = \"Secure scooter link established. Canonical readiness and the complete accepted artifact were frozen before UI acceptance; delayed callbacks cannot mutate accepted evidence.\"",
              "                        self.log(\"acceptance_sealed\", [",
              "                            \"generation\": String(token.diagnosticGeneration),",
              "                            \"applicationUpdates\": String(self.applicationUpdateCount),",
              "                            \"buildIdentifier\": self.buildIdentity.buildIdentifier,",
              "                            \"sourceCommitSHA\": self.buildIdentity.sourceCommitSHA",
              "                        ])",
              "                        await self.refreshLedgerSnapshot()",
          ]
          old = "\n".join(old_lines) + "\n"
          new = "\n".join(new_lines) + "\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"guard failed: expected exact accepted sequence once, found {count}")
          path.write_text(text.replace(old, new, 1))

      - name: Validate no-suspend authority boundary
        shell: python
        run: |
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          marker = "try await sessionLedger.sealAcceptedObservation(for: token)"
          start = source.index(marker)
          freeze = source.index("self.sealedAcceptedExport = self.makeExport(", start)
          between = source[start + len(marker):freeze]
          if "await " in between:
              raise SystemExit("accepted artifact still has a suspension between package seal and full envelope freeze")
          required = [
              "guard self.buildIdentity.isAuthoritativeFieldBuild,",
              "self.accountIdentityLeaseIsAuthorized",
              "source_authority_changed_during_acceptance_seal",
              "self.sealedAcceptedEventPrefix = acceptedEventPrefix",
              "self.sealedAcceptedExport = self.makeExport(",
              "phase: .accepted",
              "events: acceptedEventPrefix",
          ]
          window = source[start:freeze + 500]
          missing = [item for item in required if item not in window]
          if missing:
              raise SystemExit(f"missing no-suspend accepted artifact contract: {missing}")

      - name: Commit production delta
        run: |
          git diff --check
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m "fix(capture): freeze accepted artifact before suspension"
          git push origin HEAD:integration/v14-capture-accepted-export-artifact-sol
