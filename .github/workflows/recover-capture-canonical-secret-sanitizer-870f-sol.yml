name: Recover Capture canonical secret sanitizer 870f

on:
  push:
    branches:
      - repair/v14-capture-canonical-secret-sanitizer-870f-sol

permissions:
  contents: write

jobs:
  canonicalize-secret-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Bind exact product and intended pre-product scope
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81
          WORKFLOW=.github/workflows/recover-capture-canonical-secret-sanitizer-870f-sol.yml
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift
          TEST1=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift
          TEST2=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift
          git merge-base --is-ancestor "$PRODUCT" HEAD
          actual="$(git diff --name-only "$PRODUCT" HEAD | sort)"
          expected="$(printf '%s\n%s\n%s\n%s\n' "$SOURCE" "$TEST1" "$TEST2" "$WORKFLOW" | sort)"
          test "$actual" = "$expected"

      - name: Replace current inline equivalent with shared package primitive
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          start_marker = "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {\n"
          end_marker = "}\n#endif\n\nprivate enum AppleAccountAuthorizationError"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          current = source[start:end]
          for required in ("sessionkey", "appkey", "appsecret", "password", "accounttoken"):
              if f'"{required}"' not in current:
                  raise SystemExit(f"current product no longer contains already-accepted inline classifier fragment: {required}")
          replacement = (
              "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {\n"
              "        guard let dps, !dps.isEmpty else { return }\n"
              "        let sanitized = TuyaApplicationUpdateSecretSanitizer.sanitize(dps)\n"
              "        onApplicationUpdate?(sanitized)\n"
              "    }\n"
          )
          source = source[:start] + replacement + source[end:]
          path.write_text(source)

          driver_start = source.index("@MainActor\nprivate final class SmartLifeDriver")
          driver_end = source.index("#endif\n\nprivate enum AppleAccountAuthorizationError", driver_start)
          driver = source[driver_start:driver_end]
          if "TuyaApplicationUpdateSecretSanitizer.sanitize(dps)" not in driver or "onApplicationUpdate?(sanitized)" not in driver:
              raise SystemExit("canonical sanitizer is not the application admission path")
          for stale in ("private static let secretKeyFragments", "private static func redactApplicationSecrets", "String(describing: Self.redactApplicationSecrets(value))"):
              if stale in driver:
                  raise SystemExit(f"duplicated inline classifier remains: {stale}")
          PY
          git diff --check

      - name: Prove behavior and source contract
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift
          TEST1=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift
          TEST2=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift
          swiftc -parse "$SOURCE" "$TEST1" "$TEST2"
          cat > /tmp/SecretCustodyHarness.swift <<'SWIFT'
          import Foundation
          @main enum Harness {
              static func main() {
                  let pairs = [
                      "local_key":"LOCAL", "session-key":"SESSION", "appKey":"APPKEY",
                      "app.secret":"APPSECRET", "password":"PASSWORD", "account_token":"ACCOUNT",
                      "access-token":"ACCESS", "refresh.token":"REFRESH", "authKey":"AUTH", "sec_key":"SEC"
                  ]
                  var input: [AnyHashable: Any] = ["speed": 17]
                  for (key, value) in pairs { input[key] = value }
                  input["payload"] = ["session_key":"NESTED_SESSION", "items":[["appSecret":"NESTED_APPSECRET"], ["plain":"keep"]]] as [String: Any]
                  let output = TuyaApplicationUpdateSecretSanitizer.sanitize(input)
                  for key in pairs.keys { precondition(output[key] == "<redacted>") }
                  let nested = output["payload"] ?? ""
                  precondition(!nested.contains("NESTED_SESSION")); precondition(!nested.contains("NESTED_APPSECRET"))
                  precondition(nested.contains("<redacted>")); precondition(nested.contains("keep")); precondition(output["speed"] == "17")
              }
          }
          SWIFT
          swiftc -warnings-as-errors "$SOURCE" /tmp/SecretCustodyHarness.swift -o /tmp/secret-custody-harness
          /tmp/secret-custody-harness
          python3 <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          sanitizer = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift").read_text()
          for fragment in ("localkey","sessionkey","appkey","appsecret","password","accounttoken","accesstoken","refreshtoken","authkey","seckey"):
              if f'"{fragment}"' not in sanitizer: raise SystemExit(f"missing credential class: {fragment}")
          if "secretsRedacted: true" not in app: raise SystemExit("accepted export secret claim disappeared")
          if "No account UID, AppKey/AppSecret, password, account token, local_key, session key" not in app: raise SystemExit("operator secret promise changed")
          if "let sanitized = TuyaApplicationUpdateSecretSanitizer.sanitize(dps)" not in app: raise SystemExit("app not using canonical sanitizer")
          PY
          git diff --check

      - name: Commit exact four-path cleanup and self-remove runner
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81
          WORKFLOW=.github/workflows/recover-capture-canonical-secret-sanitizer-870f-sol.yml
          APP=NembraApp/App/NembraCaptureEntrypoint.swift
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift
          TEST1=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift
          TEST2=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift
          rm "$WORKFLOW"
          git diff --check
          actual="$(git diff --name-only "$PRODUCT" | sort)"
          expected="$(printf '%s\n%s\n%s\n%s\n' "$APP" "$SOURCE" "$TEST1" "$TEST2" | sort)"
          test "$actual" = "$expected"
          git add "$APP" "$WORKFLOW"
          git config user.name "nembra-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "refactor(capture): centralize application secret custody"
          git push origin "HEAD:${GITHUB_REF_NAME}"
