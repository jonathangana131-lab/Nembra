name: Materialize Private Review Helper Execution

on:
  push:
    branches:
      - repair/v14-private-review-hmac-helper-execution-sol
    paths:
      - scripts/ci/_materialize_private_review_helper_execution.py
      - .github/workflows/_materialize-private-review-helper-execution.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-review-hmac-helper-execution-sol
      - name: Apply production and gate patches
        run: |
          set -euo pipefail
          python3 scripts/ci/_materialize_private_review_helper_execution.py
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          python3 -m py_compile \
            Scripts/capture_tuya_private_input_build_guard.py \
            scripts/ci/tests/test_capture_private_review_commitment.py \
            scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py \
            scripts/ci/tests/test_capture_private_review_helper_execution_custody.py
      - name: Remove temporary materializer
        run: |
          rm scripts/ci/_materialize_private_review_helper_execution.py
          rm .github/workflows/_materialize-private-review-helper-execution.yml
      - name: Commit accepted verifier execution repair
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-materializer'
          git config user.email 'nembra-go-materializer@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): pin private-review verifier execution bytes'
          git push origin HEAD:repair/v14-private-review-hmac-helper-execution-sol
