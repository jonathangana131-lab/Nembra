name: Capture Live Main Core Evidence Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/capture-live-main-core-evidence-diagnostic.yml'
      - 'Packages/NembraCore/Sources/NembraCore/PassiveBluetoothCapture.swift'
      - 'Packages/NembraCore/Sources/NembraCore/PassiveBluetoothObservationWindowDurationAssessment.swift'
      - 'Packages/NembraCore/Tests/NembraCoreTests/PassiveBluetoothCaptureTests.swift'
      - 'Packages/NembraCore/Tests/NembraCoreTests/PassiveBluetoothCaptureObservationBoundaryTests.swift'
      - 'Packages/NembraCore/Tests/NembraCoreTests/PassiveBluetoothObservationWindowDurationAssessmentTests.swift'

permissions:
  contents: read

jobs:
  core-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact clean head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
      - name: Run exact live-main NembraCore
        run: cd Packages/NembraCore && swift test
