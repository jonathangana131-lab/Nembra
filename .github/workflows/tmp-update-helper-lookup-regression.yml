name: Temporary Update Helper Lookup Regression

on:
  push:
    branches:
      - repair/v14-capture-signed-app-helper-execution-sol

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-signed-app-helper-execution-sol
          fetch-depth: 0
      - name: Patch canonical replacement-blind regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_update_helper_lookup_regression.py
          python3 -m py_compile scripts/ci/tests/test_capture_signed_app_install_custody.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check
      - name: Commit regression and remove temporary materializers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-update-helper-lookup-regression.yml
          rm -f scripts/ci/tmp_update_helper_lookup_regression.py
          git config user.name 'nembra-capture-bot'
          git config user.email 'nembra-capture-bot@users.noreply.github.com'
          git add scripts/ci/tests/test_capture_signed_app_install_custody.py .github/workflows/tmp-update-helper-lookup-regression.yml scripts/ci/tmp_update_helper_lookup_regression.py
          git diff --cached --check
          git commit -m 'test(capture): require replacement-blind helper authority'
          git push origin HEAD:repair/v14-capture-signed-app-helper-execution-sol
