name: Capture terminal reconcile current exact child

on:
  push:
    branches:
      - integration/es80-v14-terminal-reconcile-current/gpt56-thinking
    paths:
      - .github/workflows/capture-terminal-reconcile-current.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-terminal-reconcile-current/gpt56-thinking
          fetch-depth: 2
      - name: Reconcile reviewed terminal delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eca255c986bf93a885ffa9495ba619c27ce6b440"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-terminal-reconcile-current.yml"

          base=50732571e01929ef22c79bd7f99178cf4f78a6bf
          source=28c9dde0398d14f353415b860d806215d597792b
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          gate=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          run=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift
          controller_test=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerTerminalFreshSessionConsumerTests.swift
          gate_test=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothTerminalRealRecorderReopenTests.swift

          git fetch --no-tags origin "$base" "$source"
          git diff --binary "$base" "$source" -- "$controller" > /tmp/controller.patch
          git diff --binary "$base" "$source" -- "$gate" > /tmp/gate.patch
          test -s /tmp/controller.patch
          test -s /tmp/gate.patch
          git apply --3way --index /tmp/controller.patch
          git apply --3way --index /tmp/gate.patch
          git show "$source:$controller_test" > "$controller_test"
          git show "$source:$gate_test" > "$gate_test"
          git add "$controller_test" "$gate_test"
          rm .github/workflows/capture-terminal-reconcile-current.yml
          git add -u .github/workflows/capture-terminal-reconcile-current.yml

          git diff --cached --check
          grep -q 'reopenAfterTerminalFreshTargetSession' "$gate"
          grep -q 'PassiveCoreBluetoothTerminalFreshTargetSession.create' "$controller"
          grep -q 'pendingTerminalQueueResolution' "$controller"
          grep -q 'completeTerminalFreshTargetSessionIfReady' "$controller"
          test "$(grep -c 'func connectUsingExperimentOneAdmission(' "$controller")" = "1"
          test "$(grep -c 'admission.consume()' "$controller")" = "1"
          grep -q 'receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds' "$controller"
          grep -q 'issuedAtUptimeNanoseconds' "$run"
          test "$(grep -c 'try? self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit' "$controller" || true)" = "0"
          test "$(grep -c 'try? observationBoundaryQueueGate.abortRecordedHorizonBeforeGateCommit' "$controller" || true)" = "0"
          test ! -e .github/workflows/capture-terminal-reconcile-current.yml

          git config user.name nembra-chatgpt56-thinking
          git config user.email actions@users.noreply.github.com
          git commit -m 'feat: reconcile terminal fresh-session recovery on current Capture head'
          git push origin HEAD:integration/es80-v14-terminal-reconcile-current/gpt56-thinking
