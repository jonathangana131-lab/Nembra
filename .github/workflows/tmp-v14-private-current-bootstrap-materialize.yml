name: Temporary V14 Private Current Bootstrap Materializer

on:
  push:
    branches:
      - integration/v14-private-current-convergence-gpt56-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/v14-private-current-convergence-gpt56-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Bind current private convergence subject
        shell: bash
        env:
          CURRENT_PARENT: 2fe097af9c625ea0abbdb89372f95c8b8acc78fb
          START_HEAD: 65ad7c6e6ce950ba87ad78b1306fde03a4018ad2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$START_HEAD" || {
            changed="$(git diff --name-only "$START_HEAD"...HEAD | LC_ALL=C sort)"
            test "$changed" = ".github/workflows/tmp-v14-private-current-bootstrap-materialize.yml"
          }
          git merge-base --is-ancestor "$CURRENT_PARENT" HEAD
          test "$(git hash-object Scripts/bootstrap_capture_tuya_sdk.sh)" = "f1a66b2c77f01c575b059bba9da9e44384356e30"
          test ! -e .github/workflows/tmp-v14-bootstrap-resolution-adapter.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize the previously tested bootstrap interface bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin repair/v14-private-bootstrap-explicit-root-gpt56-20260811
          git show d409cd9b760895088e9deddece981bb04a3e3fa3:Scripts/bootstrap_capture_tuya_sdk.sh > Scripts/bootstrap_capture_tuya_sdk.sh
          test "$(git hash-object Scripts/bootstrap_capture_tuya_sdk.sh)" = "0ccae3a1195d66c368ba622076644067f56d533e"
          /bin/bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_bootstrap_verified_stdin_root.py
          git diff --check

      - name: Self-delete and publish
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-v14-private-current-bootstrap-materialize.yml
          changed="$(git diff HEAD --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-v14-private-current-bootstrap-materialize.yml' \
            'Scripts/bootstrap_capture_tuya_sdk.sh' | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git config user.name "nembra-v14-materializer"
          git config user.email "nembra-v14-materializer@users.noreply.github.com"
          git add Scripts/bootstrap_capture_tuya_sdk.sh
          git commit -m "fix(capture): compose explicit bootstrap root on current private head"
          git push origin HEAD:integration/v14-private-current-convergence-gpt56-20260811
