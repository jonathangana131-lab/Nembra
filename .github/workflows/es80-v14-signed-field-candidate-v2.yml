name: ES80 V14 Signed Field Candidate V2 QA

on:
  push:
    branches:
      - 'qa/es80-v14-signed-field-candidate-v2/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate shell and Python syntax
        run: |
          bash -n scripts/field/xcode27_signed_capture_candidate.sh
          python3 -m py_compile \
            scripts/field/verify_signed_capture_candidate.py \
            scripts/field/tests/test_verify_signed_capture_candidate.py

      - name: Run adversarial portable verifier tests
        run: python3 -m unittest -v scripts/field/tests/test_verify_signed_capture_candidate.py

      - name: Prove non-macOS producer execution fails closed
        run: |
          set +e
          output="$(bash scripts/field/xcode27_signed_capture_candidate.sh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -Fq 'requires macOS with Xcode 27' <<<"$output"

      - name: Pin producer truth and privacy guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('scripts/field/xcode27_signed_capture_candidate.sh').read_text(encoding='utf-8')
          required = [
              'git status --porcelain=v1 --untracked-files=all',
              "-destination 'generic/platform=iOS'",
              'CODE_SIGN_STYLE=Automatic',
              'codesign --verify --deep --strict',
              'NembraCaptureExternalBuildRecord.json',
              '"schemaVersion": 3',
              '"evidenceClass": "signed-field-candidate-not-field-authorization"',
              'ditto -x -k "$SIGNED_APP_ARCHIVE"',
              'device_install_result=success',
              'THIS IS NOT PHYSICAL FIELD AUTHORIZATION.',
          ]
          missing = [needle for needle in required if needle not in script]
          if missing:
              raise SystemExit(f'Missing required signed-field truth guards: {missing}')

          forbidden = [
              'CODE_SIGNING_ALLOWED=NO',
              'device_install_id=',
              'logs/devicectl-install.log',
              'fieldAuthorized',
              'physicalGO',
          ]
          present = [needle for needle in forbidden if needle in script]
          if present:
              raise SystemExit(f'Forbidden signed-field candidate surface found: {present}')
          PY
