name: ES80 typestated boundary transaction composition exact-product QA

on:
  push:
    branches:
      - cell/es80-boundary-transaction-composition/ci/chat-k4v7p-2

permissions:
  contents: read

jobs:
  boundary-transaction-composition-qa:
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Checkout validation mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify exact product parent and workflow-only delta
        env:
          EXPECTED_PRODUCT_SHA: 75016335c6e07763b25a63477ad34ba43ceb21c4
          EXPECTED_WORKFLOW_PATH: .github/workflows/qa-es80-boundary-transaction-composition-chat-k4v7p-2.yml
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          printf 'Expected product parent: %s\nActual product parent:   %s\n' "$EXPECTED_PRODUCT_SHA" "$actual_parent"
          test "$actual_parent" = "$EXPECTED_PRODUCT_SHA"

          changed="$(git diff --name-only HEAD^ HEAD)"
          printf 'Validation-only delta:\n%s\n' "$changed"
          test "$changed" = "$EXPECTED_WORKFLOW_PATH"

      - name: Report Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Reject application characteristic writes
        run: |
          set -euo pipefail
          if grep -R --include='*.swift' -nE '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Application characteristic-value write path detected in NembraBluetoothCapture Sources.' >&2
            exit 1
          fi
          echo 'No application .writeValue(...) call found in NembraBluetoothCapture Sources.'

      - name: Verify canonical sealed typestate shape
        run: |
          set -euo pipefail
          source='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift'
          grep -Fq 'private let decision: PassiveCoreBluetoothObservationBoundaryDecision' "$source"
          grep -Fq 'private let transaction: PassiveCoreBluetoothObservationBoundaryQueueGate.Transaction' "$source"
          grep -Fq 'private let authorityFence: PassiveCoreBluetoothArtifactAuthorityFence' "$source"
          grep -Fq 'struct RecordedBoundary: Equatable, Sendable' "$source"
          grep -Fq 'struct CommittedBoundary: Equatable, Sendable' "$source"
          grep -Fq 'async throws -> RecordedBoundary' "$source"
          grep -Fq 'throws -> CommittedBoundary' "$source"
          if grep -R --include='*.swift' -n 'PassiveCoreBluetoothArtifactAuthorityMutationFence' Packages/NembraBluetoothCapture; then
            echo 'Duplicate authority-fence type leaked into canonical composition.' >&2
            exit 1
          fi

      - name: Run NembraCore tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors

      - name: Run full capture package tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Build capture package for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
