name: Temporary ES80 descriptor stability hardening

on:
  push:
    branches:
      - fix/es80-v14-producer-descriptor-stability/gpt56-go

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-v14-producer-descriptor-stability/gpt56-go
          fetch-depth: 0

      - name: Harden exact-tool descriptor verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/xcode27_signed_field_candidate.sh")
          source = path.read_text(encoding="utf-8")

          old_sizes = '''PRIVATE_RUNNER_BLOB_SHA="$(git rev-parse "$SOURCE_SHA:$PRIVATE_RUNNER_RELATIVE_PATH")"
          INSPECTOR_BLOB_SHA="$(git rev-parse "$SOURCE_SHA:$INSPECTOR_RELATIVE_PATH")"
          if [[ "$(git hash-object "$PRIVATE_RUNNER_SNAPSHOT")" != "$PRIVATE_RUNNER_BLOB_SHA" \\
             || "$(git hash-object "$INSPECTOR_SNAPSHOT")" != "$INSPECTOR_BLOB_SHA" ]]
          '''.replace("          ", "")
          new_sizes = '''PRIVATE_RUNNER_BLOB_SHA="$(git rev-parse "$SOURCE_SHA:$PRIVATE_RUNNER_RELATIVE_PATH")"
          INSPECTOR_BLOB_SHA="$(git rev-parse "$SOURCE_SHA:$INSPECTOR_RELATIVE_PATH")"
          PRIVATE_RUNNER_BLOB_BYTES="$(git -C "$ROOT" cat-file -s "$PRIVATE_RUNNER_BLOB_SHA")"
          INSPECTOR_BLOB_BYTES="$(git -C "$ROOT" cat-file -s "$INSPECTOR_BLOB_SHA")"
          if [[ ! "$PRIVATE_RUNNER_BLOB_BYTES" =~ ^[1-9][0-9]*$ \\
             || ! "$INSPECTOR_BLOB_BYTES" =~ ^[1-9][0-9]*$ ]]
          then
            echo "Accepted signed-field tool Git objects do not have valid positive byte sizes." >&2
            exit 14
          fi
          if [[ "$(git hash-object "$PRIVATE_RUNNER_SNAPSHOT")" != "$PRIVATE_RUNNER_BLOB_SHA" \\
             || "$(git hash-object "$INSPECTOR_SNAPSHOT")" != "$INSPECTOR_BLOB_SHA" ]]
          '''.replace("          ", "")
          if source.count(old_sizes) != 1:
              raise SystemExit("accepted blob-size insertion boundary changed")
          source = source.replace(old_sizes, new_sizes, 1)

          start_marker = '''verify_open_git_blob_descriptor() {
          '''.replace("          ", "")
          end_marker = '''rm -f "$PRIVATE_RUNNER_SNAPSHOT" "$INSPECTOR_SNAPSHOT"
          '''.replace("          ", "")
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          old_block = source[start:end]
          new_block = '''verify_open_git_blob_descriptor() {
            local descriptor_path="$1"
            local descriptor_number="$2"
            local expected_blob_sha="$3"
            local expected_blob_bytes="$4"
            if ! "$PYTHON3" -I - "$descriptor_number" "$expected_blob_sha" "$expected_blob_bytes" <<'PYVERIFY'
          import hashlib
          import os
          import stat
          import sys

          fd = int(sys.argv[1])
          expected = sys.argv[2]
          expected_size = int(sys.argv[3])
          if expected_size < 1:
              raise SystemExit("accepted Git object size must be positive")
          if len(expected) == 40:
              digest = hashlib.sha1()
          elif len(expected) == 64:
              digest = hashlib.sha256()
          else:
              raise SystemExit("unsupported Git object ID width")

          def stable_identity(metadata):
              return (
                  metadata.st_dev,
                  metadata.st_ino,
                  metadata.st_mode,
                  metadata.st_uid,
                  metadata.st_gid,
                  metadata.st_size,
                  metadata.st_mtime_ns,
                  metadata.st_ctime_ns,
              )

          metadata = os.fstat(fd)
          if not stat.S_ISREG(metadata.st_mode):
              raise SystemExit("opened tool descriptor is not a regular file")
          if metadata.st_size != expected_size:
              raise SystemExit("opened tool descriptor size does not match accepted Git blob")

          before = os.lseek(fd, 0, os.SEEK_CUR)
          if before != 0:
              raise SystemExit("tool descriptor was not positioned at byte zero")

          header = b"blob " + str(expected_size).encode("ascii") + b"\\0"
          digest.update(header)
          offset = 0
          while offset < expected_size:
              chunk = os.pread(fd, min(1024 * 1024, expected_size - offset), offset)
              if not chunk:
                  raise SystemExit("opened tool descriptor ended before accepted Git blob size")
              digest.update(chunk)
              offset += len(chunk)
          if os.pread(fd, 1, expected_size):
              raise SystemExit("opened tool descriptor exceeds accepted Git blob size")

          final_metadata = os.fstat(fd)
          if stable_identity(final_metadata) != stable_identity(metadata):
              raise SystemExit("descriptor subject changed during verification")
          if digest.hexdigest() != expected:
              raise SystemExit("opened tool descriptor does not match accepted Git blob")
          if os.lseek(fd, 0, os.SEEK_CUR) != before:
              raise SystemExit("tool descriptor verification changed execution offset")
          PYVERIFY
            then
              echo "Opened signed-field tool failed exact Git-object custody: $descriptor_path" >&2
              return 1
            fi
          }
          verify_open_git_blob_descriptor "/dev/fd/7" 7 "$PRIVATE_RUNNER_BLOB_SHA" "$PRIVATE_RUNNER_BLOB_BYTES"
          verify_open_git_blob_descriptor "/dev/fd/8" 8 "$INSPECTOR_BLOB_SHA" "$INSPECTOR_BLOB_BYTES"
          verify_open_git_blob_descriptor "/dev/fd/9" 9 "$PRIVATE_RUNNER_BLOB_SHA" "$PRIVATE_RUNNER_BLOB_BYTES"
          '''.replace("          ", "")
          if "chunks = []" not in old_block or 'b"".join(chunks)' not in old_block:
              raise SystemExit("incumbent unbounded descriptor verifier shape changed")
          source = source[:start] + new_block + source[end:]
          path.write_text(source, encoding="utf-8")
          PY

      - name: Bash syntax
        run: bash -n scripts/ci/xcode27_signed_field_candidate.sh

      - name: Descriptor custody contract
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_descriptor_subject_custody_source.py

      - name: Python custody contract
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_python_custody_source.py

      - name: Producer source contract
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py

      - name: Intended-device source contract
        run: python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device_source.py

      - name: Diff hygiene
        run: git diff --check

      - name: Commit hardening and self-delete transformer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_es80_descriptor_stability.yml
          git add scripts/ci/xcode27_signed_field_candidate.sh scripts/ci/tests/test_xcode27_signed_field_candidate_descriptor_subject_custody_source.py
          git diff --cached --check
          git commit -m "Capture provenance: bound and stabilize tool descriptors"
          git push origin HEAD:fix/es80-v14-producer-descriptor-stability/gpt56-go
