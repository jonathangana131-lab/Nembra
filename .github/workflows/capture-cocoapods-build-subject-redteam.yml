name: Capture CocoaPods Build Subject Authority
# Temporary synchronize marker; reverted immediately so the final PR diff remains test-only.

on:
  pull_request:
    paths:
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - Scripts/capture_cocoapods_generated_build_subject.py
      - Scripts/capture_tuya_private_input_build_guard.py
      - scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
      - scripts/ci/tests/test_capture_cocoapods_generated_symlink_authority.py
      - scripts/ci/tests/test_capture_cocoapods_coherent_generation.py
      - scripts/ci/tests/test_capture_private_input_ancestor_retarget.py
      - .github/workflows/capture-cocoapods-build-subject-redteam.yml
  push:
    branches:
      - repair/v14-capture-cocoapods-generated-subject-sol-20260810
      - repair/v14-capture-2709-coherent-generation-sol
      - repair/v14-capture-2709-private-ancestry-convergence-sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-build-subject:
    name: Require exact generated CocoaPods build authority
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind authority test to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile generated-subject authority tooling
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_cocoapods_generated_build_subject.py
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_generated_symlink_authority.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_coherent_generation.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_input_ancestor_retarget.py
          /bin/bash -n Scripts/bootstrap_capture_tuya_sdk.sh

      - name: Require lock-preserving generated substitutions to fail closed
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py

      - name: Require generated symlinks to stay inside accepted authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_generated_symlink_authority.py

      - name: Require one coherent lock plus Pods plus workspace generation
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_coherent_generation.py

      - name: Require private build-input ancestry to remain pinned
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_private_input_ancestor_retarget.py
