name: Capture CocoaPods Build Subject Red Team

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
      - .github/workflows/capture-cocoapods-build-subject-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-build-subject:
    name: Reproduce generated CocoaPods authority gap
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind diagnostic to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile adversarial diagnostic
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py

      - name: Require generated build subject to fail closed
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
