name: Materialize Capture visual e7af sol

on:
  push:
    branches:
      - validation/v14-capture-guided-visual-e7af-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/v14-capture-guided-visual-e7af-sol
          fetch-depth: 0
      - name: Guard clean exact product ancestry
        shell: bash
        run: |
          set -euo pipefail
          product='e7af19bf1d9b21c2b184c2a8c403d0d86dbc06c7'
          helper='.github/workflows/materialize-capture-visual-e7af-sol.yml'
          git merge-base --is-ancestor "$product" HEAD
          test "$(git diff --name-only "$product" HEAD)" = "$helper"
      - name: Fetch exact reviewed visual donor
        shell: bash
        run: |
          set -euo pipefail
          donor='0bb3bd20404c60ef941f96187a201bfc64a2bdd1'
          git fetch origin 'refs/heads/qa/v14-capture-standalone-visual-current-sol:refs/remotes/origin/qa/v14-capture-standalone-visual-current-sol'
          test "$(git rev-parse refs/remotes/origin/qa/v14-capture-standalone-visual-current-sol)" = "$donor"
      - name: Import three QA paths and harden regression
        shell: bash
        run: |
          set -euo pipefail
          donor='0bb3bd20404c60ef941f96187a201bfc64a2bdd1'
          git checkout "$donor" -- \
            .github/workflows/capture-standalone-visual-evidence.yml \
            scripts/ci/capture_standalone_visual_evidence.sh \
            scripts/ci/tests/test_capture_standalone_visual_evidence.py
          cat > scripts/ci/tests/test_capture_standalone_visual_evidence.py <<'PY'
          from pathlib import Path
          import re

          root = Path(__file__).resolve().parents[3]
          script = (root / "scripts/ci/capture_standalone_visual_evidence.sh").read_text(encoding="utf-8")

          required = [
              'EXPECTED_BUNDLE_ID="com.jonathangana131.nembra.capturelearn"',
              'EXPECTED_PROCEDURE_IDENTIFIER="ES80-AUTHENTICATED-STATIONARY-v1"',
              'IDENTITY_SOURCE="NembraApp/App/NembraCaptureBuildIdentity.swift"',
              'fieldProcedureIdentifier',
              '$EXPECTED_PROCEDURE_IDENTIFIER',
              'startswith("com.apple.CoreSimulator.SimRuntime.iOS-27")',
              'if x.get("name") == "iPhone 12"',
              'EXPECTED_DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-12"',
              'no newer-device fallback may satisfy the V14 baseline',
              'Public standalone visual evidence must not carry Tuya dependency authority',
              'EXPECTED_BUILD_IDENTIFIER="capture-v14-${SOURCE_SHA:0:12}"',
              'CHECKOUT_SHA="$(git rev-parse HEAD',
              'Standalone visual evidence app was not stamped from the exact checked-out source',
              'SIMCTL_CHILD_*|NEMBRA_SIMULATION_*)',
              'done < <(compgen -v)',
              'xcrun simctl ui "$UDID" appearance dark',
              'xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large',
              'standalone-unprovisioned-dark-iphone12.png',
              'standalone-unprovisioned-dark-iphone12-ax5.png',
              '"tuyaDependencyProvenanceClass": "deliberately-absent-public-ci"',
              '"expectedFieldBuildAuthority": False',
              '"baselineDevice": "iPhone 12"',
              '"baselineOS": "iOS 27"',
              '"procedureSourceRendezvousVerified": True',
              '"syntheticAuthorityEnvironmentRejected": True',
              '"visualAcceptanceRequiresHumanReview": True',
              '"physicalAuthorityCreated": False',
              '"protocolAuthorityCreated": False',
              '"state": "unprovisioned-dark-standard"',
              '"state": "unprovisioned-dark-accessibility-xxxl"',
          ]
          for needle in required:
              if needle not in script:
                  raise SystemExit(f"missing standalone visual-evidence contract: {needle}")

          for forbidden_fallback in ('"iPhone 17"', '"iPhone 17 Pro"', '"iPhone 16"', '"iPhone 16 Plus"'):
              if forbidden_fallback in script:
                  raise SystemExit(f"newer-device fallback cannot satisfy the iPhone 12 visual baseline: {forbidden_fallback}")

          if re.search(r"dependency_sha=['\"][0-9a-f]{64}['\"]", script):
              raise SystemExit("public visual harness must not synthesize a shape-valid Tuya dependency fingerprint")

          active = [line.strip() for line in script.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          for line in active:
              if re.match(r"^(SIMCTL_CHILD_|NEMBRA_SIMULATION_)[A-Za-z0-9_]*=", line):
                  raise SystemExit(f"standalone visual evidence must not assign synthetic app authority: {line}")

          launches = [line for line in active if "xcrun simctl launch" in line]
          if len(launches) != 1:
              raise SystemExit(f"expected exactly one real standalone launch, found {len(launches)}")
          if "--args" in launches[0] or "SIMCTL_CHILD_" in launches[0] or "NEMBRA_SIMULATION_" in launches[0]:
              raise SystemExit("standalone launch must not inject synthetic authority or launch fixtures")

          screenshots = [line for line in active if 'xcrun simctl io "$UDID" screenshot' in line]
          if len(screenshots) != 2:
              raise SystemExit(f"expected exact standard + Accessibility XXXL screenshots, found {len(screenshots)}")

          for forbidden in ("connectBLE", "writeValue", "publishDps", "publishDpsWithSuccess", "local_key"):
              if re.search(rf"\b{re.escape(forbidden)}\b", "\n".join(active)):
                  raise SystemExit(f"visual-evidence harness must not contain scooter/protocol action: {forbidden}")

          print("capture standalone visual evidence source contract: PASS")
          PY
          changed="$(git diff --name-only --cached; git diff --name-only)"
          test "$(printf '%s\n' "$changed" | sort -u | wc -l | tr -d ' ')" = 3
      - name: Validate harness source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py
          git diff --check
      - name: Publish clean donor bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git add .github/workflows/capture-standalone-visual-evidence.yml scripts/ci/capture_standalone_visual_evidence.sh scripts/ci/tests/test_capture_standalone_visual_evidence.py
          git commit -m 'test(capture): reanchor exact iPhone 12 visual evidence'
          git push origin HEAD:validation/v14-capture-guided-visual-e7af-sol
