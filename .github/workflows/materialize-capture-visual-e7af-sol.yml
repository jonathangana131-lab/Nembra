name: Materialize Capture visual e7af sol

on:
  push:
    branches:
      - validation/v14-capture-guided-visual-e7af-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/v14-capture-guided-visual-e7af-sol
          fetch-depth: 0
      - name: Guard clean exact product ancestry
        shell: bash
        run: |
          set -euo pipefail
          product='e7af19bf1d9b21c2b184c2a8c403d0d86dbc06c7'
          helper='.github/workflows/materialize-capture-visual-e7af-sol.yml'
          git merge-base --is-ancestor "$product" HEAD
          test "$(git diff --name-only "$product" HEAD)" = "$helper"
      - name: Fetch exact reviewed visual donor
        shell: bash
        run: |
          set -euo pipefail
          donor='0bb3bd20404c60ef941f96187a201bfc64a2bdd1'
          git fetch origin 'refs/heads/qa/v14-capture-standalone-visual-current-sol:refs/remotes/origin/qa/v14-capture-standalone-visual-current-sol'
          test "$(git rev-parse refs/remotes/origin/qa/v14-capture-standalone-visual-current-sol)" = "$donor"
          git cat-file -e "$donor^{commit}"
      - name: Import exactly three QA paths
        shell: bash
        run: |
          set -euo pipefail
          donor='0bb3bd20404c60ef941f96187a201bfc64a2bdd1'
          git checkout "$donor" -- \
            .github/workflows/capture-standalone-visual-evidence.yml \
            scripts/ci/capture_standalone_visual_evidence.sh \
            scripts/ci/tests/test_capture_standalone_visual_evidence.py
          changed="$(git diff --name-only --cached)"
          test "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')" = 3
      - name: Validate harness shell syntax
        shell: bash
        run: bash -n scripts/ci/capture_standalone_visual_evidence.sh
      - name: Validate harness source contract
        shell: bash
        run: |
          set +e
          output="$(python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message="$(printf '%s\n' "$output" | tail -n 1)"
            echo "::error title=visual-donor-source-contract::$message"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate imported diff hygiene
        shell: bash
        run: git diff --check
      - name: Publish clean donor bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git commit -m 'test(capture): reanchor exact iPhone 12 visual evidence'
          git push origin HEAD:validation/v14-capture-guided-visual-e7af-sol
