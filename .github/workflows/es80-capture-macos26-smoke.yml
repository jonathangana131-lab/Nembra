name: ES80 Capture macOS 26 Smoke

on:
  push:
    branches:
      - 'cell/es80-passive-capture/smoke/**'

permissions:
  contents: read

jobs:
  package:
    name: Compile passive capture package
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected=$GITHUB_SHA"
          echo "actual=$actual_sha"
          test "$actual_sha" = "$GITHUB_SHA"

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Guard passive adapter against application writes
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 capture adapter must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

      - name: Test NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture

      - name: Build for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
