name: Materialize Capture application secret-value custody

on:
  push:
    branches:
      - repair/v14-capture-application-secret-value-custody-d56-sol
    paths:
      - .github/workflows/materialize-capture-application-secret-value-custody-d56.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: true

      - name: Verify exact product parent
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='d56a30c699fbdecec6130537d3f3f4f4232f5c47'
          expected_source_blob='10f97e50cad17ce772668977d7e11fd4f819fdc5'
          workflow='.github/workflows/materialize-capture-application-secret-value-custody-d56.yml'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git rev-parse 'HEAD:NembraApp/App/NembraCaptureEntrypoint.swift')" = "$expected_source_blob"
          test "$(git diff --name-only "$expected_parent"..HEAD)" = "$workflow"

      - name: Bind compiled private identity to application event sanitizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          driver_start = source.index('@MainActor\nprivate final class SmartLifeDriver')
          driver_end = source.index('#endif\n\nprivate enum AppleAccountAuthorizationError', driver_start)
          driver = source[driver_start:driver_end]

          callback_start = driver.index('    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {')
          sanitizer_start = driver.index('    private static let secretKeyFragments', callback_start)
          sanitizer_end = driver.rindex('\n}', sanitizer_start)

          callback_and_sanitizer = '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
        guard let dps, !dps.isEmpty else { return }
        let exactSecretValues = Self.exactSecretValues
        var sanitized: [String: String] = [:]
        for (key, value) in dps {
            let rawKey = String(describing: key)
            let keyString = Self.redactKnownSecretValues(in: rawKey, exactSecretValues: exactSecretValues)
            let normalizedKey = rawKey.lowercased().filter { $0.isLetter || $0.isNumber }
            let safeValue: String
            if Self.secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {
                safeValue = "<redacted>"
            } else {
                safeValue = Self.sanitizedApplicationDescription(value, exactSecretValues: exactSecretValues)
            }

            var uniqueKey = keyString
            var collisionSuffix = 2
            while sanitized[uniqueKey] != nil {
                uniqueKey = "\\(keyString)#\\(collisionSuffix)"
                collisionSuffix += 1
            }
            sanitized[uniqueKey] = safeValue
        }
        onApplicationUpdate?(sanitized)
    }

    private static let secretKeyFragments = [
        "localkey",
        "sessionkey",
        "appkey",
        "appsecret",
        "password",
        "accounttoken",
        "accesstoken",
        "refreshtoken",
        "authkey",
        "seckey",
    ]

    private static var exactSecretValues: [String] {
#if canImport(NembraTuyaPrivateConfig)
        [NembraTuyaPrivateIdentity.appKey, NembraTuyaPrivateIdentity.appSecret]
            .map { $0.trimmingCharacters(in: .whitespacesAndNewlines) }
            .filter { !$0.isEmpty }
#else
        []
#endif
    }

    private static func sanitizedApplicationDescription(
        _ object: Any,
        exactSecretValues: [String]
    ) -> String {
        let redactedObject = redactApplicationSecrets(object, exactSecretValues: exactSecretValues)
        return redactKnownSecretValues(
            in: String(describing: redactedObject),
            exactSecretValues: exactSecretValues
        )
    }

    private static func redactApplicationSecrets(
        _ object: Any,
        exactSecretValues: [String]
    ) -> Any {
        if let dictionary = object as? [AnyHashable: Any] {
            var sanitized: [String: Any] = [:]
            for (key, value) in dictionary {
                let rawKey = String(describing: key)
                let keyString = redactKnownSecretValues(in: rawKey, exactSecretValues: exactSecretValues)
                let normalizedKey = rawKey.lowercased().filter { $0.isLetter || $0.isNumber }
                let safeValue: Any
                if secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {
                    safeValue = "<redacted>"
                } else {
                    safeValue = redactApplicationSecrets(value, exactSecretValues: exactSecretValues)
                }

                var uniqueKey = keyString
                var collisionSuffix = 2
                while sanitized[uniqueKey] != nil {
                    uniqueKey = "\\(keyString)#\\(collisionSuffix)"
                    collisionSuffix += 1
                }
                sanitized[uniqueKey] = safeValue
            }
            return sanitized
        }
        if let array = object as? [Any] {
            return array.map { redactApplicationSecrets($0, exactSecretValues: exactSecretValues) }
        }
        if let string = object as? String {
            return redactKnownSecretValues(in: string, exactSecretValues: exactSecretValues)
        }

        let description = String(describing: object)
        let redactedDescription = redactKnownSecretValues(
            in: description,
            exactSecretValues: exactSecretValues
        )
        return redactedDescription == description ? object : redactedDescription
    }

    private static func redactKnownSecretValues(
        in text: String,
        exactSecretValues: [String]
    ) -> String {
        exactSecretValues.reduce(text) { partial, secret in
            partial.replacingOccurrences(
                of: secret,
                with: "<redacted>",
                options: [.literal]
            )
        }
    }
'''

          driver = driver[:callback_start] + callback_and_sanitizer + driver[sanitizer_end:]
          source = source[:driver_start] + driver + source[driver_end:]
          path.write_text(source, encoding='utf-8')
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application secret-value export custody")
          struct TuyaApplicationSecretValueCustodySourceTests {
              @Test("private AppKey/AppSecret values cannot survive under innocuous SDK keys")
              func privateApplicationIdentityIsValueBoundBeforeEventCustody() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))
                  let callback = String(try section(
                      in: driver,
                      from: "func device(_ device: ThingSmartDevice?, dpsUpdate",
                      to: "private static let secretKeyFragments"
                  ))
                  let sanitizer = String(try section(
                      in: driver,
                      from: "private static let secretKeyFragments",
                      to: "}\n#endif"
                  ))

                  #expect(driver.contains("NembraTuyaPrivateIdentity.appKey"))
                  #expect(driver.contains("NembraTuyaPrivateIdentity.appSecret"))
                  #expect(sanitizer.contains("replacingOccurrences"))
                  #expect(
                      sanitizer.contains("exactSecretValues")
                          || sanitizer.contains("knownSecretValues")
                          || sanitizer.contains("secretValues")
                  )
                  #expect(!callback.contains("String(describing: Self.redactApplicationSecrets(value))"))
              }

              @Test("credential-shaped keys remain redacted in addition to exact-value custody")
              func keyBasedRedactionIsPreserved() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))

                  for fragment in [
                      "localkey", "sessionkey", "appkey", "appsecret", "password",
                      "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey",
                  ] {
                      #expect(driver.contains("\"\\(fragment)\""))
                  }
                  #expect(driver.contains("secretKeyFragments.contains"))
              }

              @Test("exact secret replacement happens before application update custody")
              func exactSecretReplacementPrecedesCallback() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))
                  #expect(driver.contains("sanitizedApplicationDescription(value, exactSecretValues: exactSecretValues)"))
                  #expect(driver.contains("redactKnownSecretValues(in: rawKey, exactSecretValues: exactSecretValues)"))
                  #expect(driver.contains("onApplicationUpdate?(sanitized)"))
                  #expect(driver.contains("while sanitized[uniqueKey] != nil"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \\(start) ... \\(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent().deletingLastPathComponent()
                      .deletingLastPathComponent().deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          SWIFT

      - name: Validate focused truth contract
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaApplicationSecretValueCustodySourceTests
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          start = s.index('@MainActor\nprivate final class SmartLifeDriver')
          end = s.index('#endif\n\nprivate enum AppleAccountAuthorizationError', start)
          d = s[start:end]
          assert 'NembraTuyaPrivateIdentity.appKey' in d
          assert 'NembraTuyaPrivateIdentity.appSecret' in d
          assert 'private static var exactSecretValues: [String]' in d
          assert 'sanitizedApplicationDescription(value, exactSecretValues: exactSecretValues)' in d
          assert 'String(describing: Self.redactApplicationSecrets(value))' not in d
          assert 'replacingOccurrences(' in d
          assert 'onApplicationUpdate?(sanitized)' in d
          for forbidden in ('queryDps', 'publishDps', 'writeValue', 'writeWithoutResponse'):
              assert forbidden not in d
          print('Capture private application secret-value custody: PASS')
          PY

      - name: Collapse to clean successor
        shell: bash
        run: |
          set -euo pipefail
          parent='d56a30c699fbdecec6130537d3f3f4f4232f5c47'
          workflow='.github/workflows/materialize-capture-application-secret-value-custody-d56.yml'
          rm "$workflow"
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift \
            "$workflow"
          git diff --cached --check
          git commit -m 'fix(capture): bind private secrets before event custody'
          mapfile -t changed < <(git diff --name-only "$parent"..HEAD | sort)
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift'
          git push origin HEAD:repair/v14-capture-application-secret-value-custody-d56-sol
