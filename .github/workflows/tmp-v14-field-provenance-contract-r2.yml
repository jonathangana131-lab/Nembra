name: TMP V14 Field Provenance Contract R2

on:
  push:
    branches:
      - integration/v14-field-authority-convergence-r2-sol-20260811
    paths:
      - .github/workflows/tmp-v14-field-provenance-contract-r2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-field-authority-convergence-r2-sol-20260811
          fetch-depth: 0
      - name: Bind exact construction head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Advance only stale Field source-contract assertions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/capture-field-build-provenance.yml')
          source = path.read_text(encoding='utf-8')
          old_runner = "          grep -Fq 'run_authority_git show \"$SOURCE_SHA:scripts/ci/es80_signed_field_artifact_private_runner.py\"' \"$installer\"\n"
          new_runner = "          grep -Fq 'read_verified_accepted_git_blob \"$PRIVATE_DEVICE_RUNNER_RELATIVE\" |' \"$installer\"\n          if grep -Fq 'run_authority_git show \"$SOURCE_SHA:scripts/ci/es80_signed_field_artifact_private_runner.py\"' \"$installer\"; then\n            echo 'ERROR: private intended-device runner must cross the verified accepted-Git payload boundary before Python execution.' >&2\n            exit 1\n          fi\n"
          old_build = "          build_line=\"$(grep -nF -- '-- /usr/bin/xcodebuild \\\\' \"$installer\" | sed -n '1s/:.*//p')\"\n"
          new_build = "          build_line=\"$(grep -nF -- '-- \"$SELECTED_XCODEBUILD\" \\\\' \"$installer\" | sed -n '1s/:.*//p')\"\n"
          if source.count(old_runner) != 1:
              raise SystemExit(f'private-runner stale seam count={source.count(old_runner)}')
          if source.count(old_build) != 1:
              raise SystemExit(f'build stale seam count={source.count(old_build)}')
          source = source.replace(old_runner, new_runner, 1).replace(old_build, new_build, 1)
          path.write_text(source, encoding='utf-8')
          PY
          grep -Fq 'read_verified_accepted_git_blob "$PRIVATE_DEVICE_RUNNER_RELATIVE" |' .github/workflows/capture-field-build-provenance.yml
          grep -Fq 'build_line="$(grep -nF -- '\''-- "$SELECTED_XCODEBUILD" \'\''' .github/workflows/capture-field-build-provenance.yml
          git diff --check
      - name: Publish source-contract migration
        shell: bash
        env:
          BRANCH: integration/v14-field-authority-convergence-r2-sol-20260811
        run: |
          set -euo pipefail
          git add .github/workflows/capture-field-build-provenance.yml
          git diff --cached --check
          git config user.name "Nembra V14 Swarm"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci(capture): align Field provenance with converged authority"
          git push origin "HEAD:$BRANCH"
