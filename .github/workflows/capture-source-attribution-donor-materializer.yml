name: Capture source-attribution donor materializer

on:
  push:
    branches:
      - capture/application-delivery-cutoff-repair-sol-20260814

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/application-delivery-cutoff-repair-sol-20260814
          fetch-depth: 2
          persist-credentials: true
      - name: Materialize exact-device source fence into donor
        env:
          EXPECTED_PARENT: 673de443bcfab800fffb23e2e4f348a4e31bc045
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -f scripts/ci/materialize_capture_source_attribution_donor.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/materialize_capture_source_attribution_donor.py')
          text = path.read_text()
          needle = 'def replace_once(path: str, old: str, new: str) -> None:\n    p = Path(path)\n'
          replacement = 'def replace_once(path: str, old: str, new: str) -> None:\n    old = old.replace("\\\\n", "\\n")\n    new = new.replace("\\\\n", "\\n")\n    p = Path(path)\n'
          if text.count(needle) != 1:
              raise SystemExit('replace_once helper drifted')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          python3 scripts/ci/materialize_capture_source_attribution_donor.py
          test ! -e scripts/ci/materialize_capture_source_attribution_donor.py
          test ! -e .github/workflows/capture-source-attribution-donor-materializer.yml
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Capture V16.1: bind SmartLife DPS to exact selected device'
          git push origin HEAD:capture/application-delivery-cutoff-repair-sol-20260814
