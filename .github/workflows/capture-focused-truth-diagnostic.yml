    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: TuyaAlreadyTerminalObservationContinuitySourceTests
        working-directory: Packages/NembraBluetoothCapture
        run: swift test --filter TuyaAlreadyTerminalObservationContinuitySourceTests

  sharing-authority:
    if: github.event.head_commit.message == 'Diagnose Capture focused truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: TuyaDeviceSharingAuthenticationAuthorityTests
        working-directory: Packages/NembraBluetoothCapture
        run: swift test --filter TuyaDeviceSharingAuthenticationAuthorityTests
