name: Capture focused truth diagnostic

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: read

jobs:
  ledger:
    if: github.event.head_commit.message == 'Diagnose Capture focused truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: TuyaAuthenticatedReadOnlySessionLedgerTests
        working-directory: Packages/NembraBluetoothCapture
        run: swift test --filter TuyaAuthenticatedReadOnlySessionLedgerTests

  terminal-horizon:
    if: github.event.head_commit.message == 'Diagnose Capture focused truth'
    runs-on: ubuntu-latest
    steps:
