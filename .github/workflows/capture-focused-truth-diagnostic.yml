name: Capture focused truth diagnostic

on:
  push:
    branches:
      - capture/diag-test-compiler-gpt56

permissions:
  contents: read

jobs:
  expose-test-target-failure:
    if: github.event.head_commit.message == 'Diagnose Capture test-target compiler failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run one focused truth filter and surface compiler diagnostics
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set +e
          swift test --filter TuyaAuthenticatedReadOnlySessionLedgerTests > /tmp/capture-test.log 2>&1
          status=$?
          cat /tmp/capture-test.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/capture-test.log').read_text(errors='replace').splitlines()
          diagnostics = [line.strip() for line in lines if 'error:' in line.lower() or 'fatal error:' in line.lower()]
          if not diagnostics:
              diagnostics = [line.strip() for line in lines[-30:] if line.strip()]
          for line in diagnostics[:20]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Capture Swift test failure::{escaped}')
          PY
          fi
          exit "$status"
