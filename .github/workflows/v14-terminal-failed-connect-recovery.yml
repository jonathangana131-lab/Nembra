name: V14 terminal failed-connect recovery

on:
  push:
    branches:
      - integration/es80-v14-terminal-failed-connect-recovery/gpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact controller repair
        run: |
          set -euo pipefail
          python3 scripts/ci/v14_terminal_failed_connect_recovery_patch.py
          git diff --check
          grep -q 'didFailToConnect peripheral: CBPeripheral' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -q 'completeTerminalFreshTargetSessionIfReady()' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
      - name: Commit product and self-delete staging files
        run: |
          set -euo pipefail
          rm .github/workflows/v14-terminal-failed-connect-recovery.yml
          rm scripts/ci/v14_terminal_failed_connect_recovery_patch.py
          git add -A
          git diff --cached --check
          git config user.name nembra-v14-gpt56
          git config user.email actions@users.noreply.github.com
          git commit -m 'Capture: complete fresh recovery after failed connect callback'
          git push origin HEAD:integration/es80-v14-terminal-failed-connect-recovery/gpt56-go
