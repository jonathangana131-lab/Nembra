name: TEMP Apply ES80 shell compile fix

on:
  push:
    branches:
      - fix/es80-today-simulator-preflight-snapshot-0519-gpt56

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/es80-today-simulator-preflight-snapshot-0519-gpt56
          fetch-depth: 0

      - name: Apply guarded source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/temp_es80_shell_compile_repair.py
          git diff --check
          test -n "$(git diff -- NembraApp/Features/Research/ES80CaptureShellView.swift)"

      - name: Commit source repair and remove temporary applicators
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/temp_es80_shell_compile_repair.py
          rm .github/workflows/zz-temp-apply-es80-shell-compile-fix.yml
          git config user.name nembra-v14-capture-compile
          git config user.email nembra-v14-capture-compile@users.noreply.github.com
          git add NembraApp/Features/Research/ES80CaptureShellView.swift scripts/ci/temp_es80_shell_compile_repair.py .github/workflows/zz-temp-apply-es80-shell-compile-fix.yml
          git commit -m "fix(capture): keep Simulator conditionals compile-safe"
          git push origin HEAD:fix/es80-today-simulator-preflight-snapshot-0519-gpt56
