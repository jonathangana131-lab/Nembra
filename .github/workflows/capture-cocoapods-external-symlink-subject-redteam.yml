name: Capture CocoaPods External Symlink Subject Red Team

on:
  pull_request:
    paths:
      - Scripts/capture_cocoapods_build_subject.py
      - scripts/ci/tests/test_capture_cocoapods_build_subject_external_symlink.py
      - .github/workflows/capture-cocoapods-external-symlink-subject-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-symlink-subject:
    name: Require followed generated symlink bytes to be bound
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind diagnostic to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile diagnostic and helper
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_cocoapods_build_subject.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_build_subject_external_symlink.py

      - name: Require external symlink target custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_build_subject_external_symlink.py
