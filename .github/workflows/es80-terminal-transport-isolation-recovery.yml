name: ES80 terminal transport isolation recovery

on:
  push:
    branches:
      - parallel/recover-es80-terminal-transport-isolation/chat-gpt56
    paths:
      - .github/workflows/es80-terminal-transport-isolation-recovery.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - parallel/es80-live-boundary-controller/chat-k4m7v
    paths:
      - .github/workflows/es80-terminal-transport-isolation-recovery.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: parallel/recover-es80-terminal-transport-isolation/chat-gpt56
          fetch-depth: 0

      - name: Patch terminal transport isolation and import diagnostic regression
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          source = path.read_text()

          def insert_after(section_start: str, anchor: str, insertion: str, label: str) -> None:
              global source
              section_index = source.find(section_start)
              if section_index < 0:
                  raise SystemExit(f"{label}: section start missing")
              anchor_index = source.find(anchor, section_index)
              if anchor_index < 0:
                  raise SystemExit(f"{label}: anchor missing")
              next_section = source.find("\n    public func ", section_index + len(section_start))
              if next_section >= 0 and anchor_index >= next_section:
                  raise SystemExit(f"{label}: anchor escaped target section")
              insertion_index = anchor_index + len(anchor)
              if insertion.strip() in source[section_index:insertion_index + len(insertion) + 256]:
                  raise SystemExit(f"{label}: insertion already present")
              source = source[:insertion_index] + insertion + source[insertion_index:]

          insert_after(
              "    private func handleDisconnect(\n",
              "        guard disposition != .ignored else { return }\n\n",
              "        // Once Horizon is terminal, transport teardown may release CoreBluetooth\n"
              "        // state but must not revoke or mutate the already-finalized artifact authority.\n"
              "        if observationBoundaryQueueGate.isTerminal {\n"
              "            if targetState.selectedTargetIdentifier == identifier {\n"
              "                selectedTargetCancellationPending = false\n"
              "            }\n"
              "            if case .active = disposition {\n"
              "                clearActiveConnectionState(for: identifier)\n"
              "            }\n"
              "            return\n"
              "        }\n\n",
              "disconnect",
          )

          insert_after(
              "    public func centralManagerDidUpdateState(_ central: CBCentralManager) {\n",
              "        bluetoothState = central.state\n\n",
              "        // A terminal Horizon freezes capture authority. Central-state callbacks may\n"
              "        // still clean up transport state, but they cannot create a new evidence epoch\n"
              "        // or invalidate the sealed artifact.\n"
              "        if observationBoundaryQueueGate.isTerminal {\n"
              "            hasObservedInitialCentralState = true\n"
              "            guard central.state != .poweredOn else { return }\n\n"
              "            scanRequested = false\n"
              "            if central.isScanning {\n"
              "                central.stopScan()\n"
              "            }\n"
              "            if activePeripheral != nil {\n"
              "                activePeripheral?.delegate = nil\n"
              "                activePeripheral = nil\n"
              "                connectionTimeoutTask?.cancel()\n"
              "                connectionTimeoutTask = nil\n"
              "                connectionPhase = .idle\n"
              "                clearAcquisitionObjects()\n"
              "            }\n"
              "            selectedTargetCancellationPending = false\n"
              "            targetState.resetForCentralInvalidation()\n"
              "            clearCandidateCatalog()\n"
              "            return\n"
              "        }\n\n",
              "central-state",
          )

          insert_after(
              "    public func peripheral(_ peripheral: CBPeripheral, didModifyServices invalidatedServices: [CBService]) {\n",
              "        guard targetState.acceptsActiveCallback(from: peripheral.identifier) else { return }\n\n",
              "        // Service invalidation after terminal Horizon is outside the accepted\n"
              "        // observation interval. Do not advance artifact authority or restart a\n"
              "        // finite acquisition inside the sealed recorder lifecycle.\n"
              "        guard !observationBoundaryQueueGate.isTerminal else { return }\n\n",
              "service-invalidation",
          )

          path.write_text(source)
          PY

          test_path="Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerTerminalTransportIsolationTests.swift"
          git fetch --no-tags origin parallel/es80-terminal-transport-isolation-qa/chat-m6q8v
          git show "FETCH_HEAD:${test_path}" > "${test_path}"

          python3 <<'PY'
          from pathlib import Path
          source = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift").read_text()

          def section(start, end):
              a = source.index(start)
              b = source.index(end, a)
              return source[a:b]

          service = section(
              "    public func peripheral(_ peripheral: CBPeripheral, didModifyServices invalidatedServices: [CBService]) {",
              "\n    }\n}",
          )
          assert service.index("observationBoundaryQueueGate.isTerminal") < service.index("advanceArtifactAuthority()")
          assert service.index("observationBoundaryQueueGate.isTerminal") < service.index("beginDiscovery(on: peripheral)")

          disconnect = section(
              "    private func handleDisconnect(",
              "}\n\nextension ForegroundCoreBluetoothCaptureController: @preconcurrency CBCentralManagerDelegate",
          )
          assert disconnect.index("observationBoundaryQueueGate.isTerminal") < disconnect.index("advanceArtifactAuthority()")

          central = section(
              "    public func centralManagerDidUpdateState(_ central: CBCentralManager) {",
              "    public func centralManager(\n        _ central: CBCentralManager,\n        didDiscover peripheral: CBPeripheral,",
          )
          assert central.index("observationBoundaryQueueGate.isTerminal") < central.index("advanceArtifactAuthority()")

          enqueue = section(
              "    private func enqueue(\n        _ event: PassiveBluetoothCaptureEvent,\n        receivedAtUptimeNanoseconds:",
              "    private func enqueueInterruption(",
          )
          assert enqueue.index("guard !observationBoundaryQueueGate.isTerminal else { return }") < enqueue.index("lastEnqueuedEventSequence += 1")
          PY

          git diff --check

      - name: Commit durable recovery checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-chat-gpt56"
          git config user.email "nembra-chat-gpt56@users.noreply.github.com"
          rm .github/workflows/es80-terminal-transport-isolation-recovery.yml
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerTerminalTransportIsolationTests.swift \
                  .github/workflows/es80-terminal-transport-isolation-recovery.yml
          git diff --cached --check
          git commit -m "fix: isolate terminal capture from transport callbacks"
          git push origin HEAD:parallel/recover-es80-terminal-transport-isolation/chat-gpt56
