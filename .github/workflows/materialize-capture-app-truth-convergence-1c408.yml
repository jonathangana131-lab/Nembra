name: Materialize Capture App Truth Convergence 1c408

on:
  push:
    branches:
      - recovery/v14-capture-app-truth-convergence-1c408-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-app-truth-convergence-1c408-sol
          fetch-depth: 0

      - name: Tighten ambiguous construction guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/materialize_capture_app_truth_convergence_1c408.py')
          source = path.read_text()
          old = '''    count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source match, found {count}")
              return source.replace(old, new, 1)
          '''
          new = '''    count = source.count(old)
              if label == "view-exit membership-status revocation":
                  if count < 1:
                      raise SystemExit(f"{label}: expected at least one source match, found {count}")
                  return source.replace(old, new, 1)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source match, found {count}")
              return source.replace(old, new, 1)
          '''
          if source.count(old) != 1:
              raise SystemExit('replace_once helper shape drifted')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Materialize reviewed current app truth repair
        run: python3 scripts/ci/materialize_capture_app_truth_convergence_1c408.py

      - name: Verify clean product shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/ci/materialize_capture_app_truth_convergence_1c408.py
          test ! -e .github/workflows/materialize-capture-app-truth-convergence-1c408.yml
          grep -Fq 'guard phase != .accepted else { return }' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'phase == .correlated || phase == .selected' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'applicationUpdateForEventCustody(update)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq '<redacted-account-uid>' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq ') { _, trusted in trusted })' NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureAppTruthConvergenceSourceTests.swift

      - name: Commit clean current-head product donor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Capture: converge foreground and event custody truth'
          git push origin HEAD:recovery/v14-capture-app-truth-convergence-1c408-sol
