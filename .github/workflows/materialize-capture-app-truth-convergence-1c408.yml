name: Materialize Capture App Truth Convergence 1c408

on:
  push:
    branches:
      - sol/v14-capture-app-truth-convergence-1c408

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current-product ancestry and helper-only scope
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          git merge-base --is-ancestor "$parent" HEAD
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/scripts/materialize-capture-app-truth-convergence.py'
          test "${changed[1]}" = '.github/workflows/materialize-capture-app-truth-convergence-1c408.yml'
          for path in \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift; do
            test ! -e "$path"
          done
          grep -Fq ') { current, _ in current })' NembraApp/App/NembraCaptureEntrypoint.swift
          test "$(grep -o '"sessionkey"' NembraApp/App/NembraCaptureEntrypoint.swift | wc -l | tr -d ' ')" -ge 2

      - name: Import exact adversarial contracts
        shell: bash
        run: |
          set -euo pipefail
          import_test() {
            branch="$1"
            expected="$2"
            path="$3"
            git fetch --no-tags origin "$branch"
            test "$(git rev-parse FETCH_HEAD)" = "$expected"
            git show "FETCH_HEAD:$path" > "$path"
          }
          import_test agent/v14-capture-membership-status-revocation-red-4b41 8e004bdc39357c832c11d98d5013d2097937967f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          import_test agent/v14-capture-application-event-metadata-precedence-red a8eb9b93eea7e5de1a9c80468cadf378989b5edd Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          import_test agent/v14-capture-account-uid-export-red-870f-sol 8010d108a043fbe2ff03fa3bb0d1518aa7047c08 Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift

      - name: Apply current-product truth repair
        shell: bash
        run: |
          set -uo pipefail
          output="$(mktemp)"
          set +e
          python3 .github/scripts/materialize-capture-app-truth-convergence.py >"$output" 2>&1
          status=$?
          set -e
          cat "$output"
          if [[ "$status" != 0 ]]; then
            while IFS= read -r line; do
              safe="${line//'%'/'%25'}"
              safe="${safe//$'\r'/'%0D'}"
              safe="${safe//$'\n'/'%0A'}"
              echo "::error title=Capture app truth materializer::$safe"
            done < "$output"
            exit "$status"
          fi
          git diff --check

      - name: Validate Swift source syntax
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          for path in \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift; do
            swiftc -parse "$path"
          done

      - name: Collapse helpers and publish clean donor
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          rm .github/workflows/materialize-capture-app-truth-convergence-1c408.yml
          rm .github/scripts/materialize-capture-app-truth-convergence.py
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          git add -u .github/workflows/materialize-capture-app-truth-convergence-1c408.yml .github/scripts/materialize-capture-app-truth-convergence.py
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): converge app truth custody blockers'
          mapfile -t effective < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${effective[@]}"
          test "${#effective[@]}" = 4
          test "${effective[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${effective[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift'
          test "${effective[2]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift'
          test "${effective[3]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:sol/v14-capture-app-truth-convergence-1c408
