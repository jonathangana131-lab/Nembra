name: Materialize Capture Event Admission Atomicity BA3

on:
  push:
    branches:
      - fix/v14-capture-event-admission-atomicity-ba3-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-event-admission-atomicity-ba3-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ba3a1eeae36caca6dd84beaabd0f15f4f0b57925"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-capture-event-admission-atomicity-ba3-sol.yml"

      - name: Materialize lifecycle and custody hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def lines(*items: str) -> str:
              return "\n".join(items)

          def replace_in_section(text: str, start: str, end: str, old: str, new: str, label: str) -> str:
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{label}: start marker missing')
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f'{label}: end marker missing')
              section = text[a:b]
              count = section.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one section anchor, found {count}')
              return text[:a] + section.replace(old, new, 1) + text[b:]

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          # Leaving Secure Link after the final correlation window currently misses the live
          # scanner/lease branch. Explicitly retire already-correlated/selected target authority.
          view_anchor = '        guard processCorrelationLease != nil || correlationSession != nil else { return }'
          view_repair = lines(
              '        if phase == .correlated || phase == .selected {',
              '            // Final-window sealing can retire the scanner before this view exits. Do not',
              '            // let already-earned target authority cross a Secure Link view lifetime.',
              '            resetDiscoverySessionOnly()',
              '            phase = .failed',
              '            message = "Capture left Secure Link after Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; the prior target cannot cross a view lifetime."',
              '            log("target_correlation_abandoned_on_view_exit")',
              '            return',
              '        }',
              '',
              view_anchor
          )
          source = replace_in_section(
              source,
              '    func abandonCorrelationForViewExit() {',
              '    func appDidLoseForeground() {',
              view_anchor,
              view_repair,
              'view-exit correlated target retirement'
          )

          receiver_start = '    private func receivedApplicationUpdate('
          receiver_end = '    private func startWatchdog('

          guard_old = lines(
              '        guard sdkAccountLoggedIn,',
              '              sdkDeviceMembershipVerified,',
              '              accountIdentityLeaseIsAuthorized,',
              '              let driver else {'
          )
          guard_new = lines(
              '        guard sdkAccountLoggedIn,',
              '              sdkDeviceMembershipVerified,',
              '              accountIdentityLeaseIsAuthorized,',
              '              let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),',
              '              !verifiedAccountUID.isEmpty,',
              '              let driver else {'
          )
          source = replace_in_section(
              source,
              receiver_start,
              receiver_end,
              guard_old,
              guard_new,
              'capture immutable verified account UID at event admission'
          )

          # Redact before the first actor suspension. The helper must never reread mutable account
          # identity after the admission guard has been earned.
          pre_admission_anchor = lines(
              '        applicationUpdateAdmissionsInFlight += 1',
              '        defer { applicationUpdateAdmissionsInFlight -= 1 }',
              '',
              '        do {',
              '            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)',
              '            await refreshLedgerSnapshot()',
              '            var eventDetails = redactedApplicationEventDetails(update)',
              '            eventDetails["generation"] = String(token.diagnosticGeneration)'
          )
          pre_admission_repair = lines(
              '        let eventDetailsWithoutProvenance = redactedApplicationEventDetails(',
              '            update,',
              '            verifiedAccountUID: verifiedAccountUID',
              '        )',
              '',
              '        applicationUpdateAdmissionsInFlight += 1',
              '        defer { applicationUpdateAdmissionsInFlight -= 1 }',
              '',
              '        do {',
              '            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)',
              '            await refreshLedgerSnapshot()',
              '            var eventDetails = eventDetailsWithoutProvenance',
              '            eventDetails["generation"] = String(token.diagnosticGeneration)'
          )
          source = replace_in_section(
              source,
              receiver_start,
              receiver_end,
              pre_admission_anchor,
              pre_admission_repair,
              'pre-suspension account UID redaction'
          )

          helper_old = lines(
              '    private func redactedApplicationEventDetails(_ update: [String: String]) -> [String: String] {',
              '        guard let accountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),',
              '              !accountUID.isEmpty else {',
              '            return update',
              '        }',
              '',
              '        var redacted: [String: String] = [:]',
              '        redacted.reserveCapacity(update.count)',
              '        for (key, value) in update {',
              '            let redactedKey = key.replacingOccurrences(',
              '                of: accountUID,',
              '                with: "<redacted-account-uid>",',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '            redacted[redactedKey] = value.replacingOccurrences(',
              '                of: accountUID,',
              '                with: "<redacted-account-uid>",',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '        }',
              '        return redacted',
              '    }'
          )
          helper_new = lines(
              '    private func redactedApplicationEventDetails(',
              '        _ update: [String: String],',
              '        verifiedAccountUID: String',
              '    ) -> [String: String] {',
              '        var redacted: [String: String] = [:]',
              '        redacted.reserveCapacity(update.count)',
              '        for (key, value) in update {',
              '            let redactedKey = key.replacingOccurrences(',
              '                of: verifiedAccountUID,',
              '                with: "<redacted-account-uid>",',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '            let redactedValue = value.replacingOccurrences(',
              '                of: verifiedAccountUID,',
              '                with: "<redacted-account-uid>",',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '',
              '            // Redacting an identity-bearing key must not silently erase a second',
              '            // application field that maps to the same safe key.',
              '            var uniqueKey = redactedKey',
              '            var collisionSuffix = 2',
              '            while redacted[uniqueKey] != nil {',
              '                uniqueKey = "\\(redactedKey)#\\(collisionSuffix)"',
              '                collisionSuffix += 1',
              '            }',
              '            redacted[uniqueKey] = redactedValue',
              '        }',
              '        return redacted',
              '    }'
          )
          source = replace_in_section(
              source,
              receiver_start,
              receiver_end,
              helper_old,
              helper_new,
              'immutable UID helper and collision-preserving redaction'
          )
          path.write_text(source, encoding='utf-8')

          # Strengthen the current UID custody source contract around the actual race boundary.
          uid_test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift')
          uid_test = uid_test_path.read_text(encoding='utf-8')
          old_test_body = '''        #expect(receiver.contains("redactedApplicationEventDetails(update)"))
              #expect(receiver.contains("membershipAccountUID?.trimmingCharacters"))
              #expect(receiver.contains("let redactedKey = key.replacingOccurrences("))
              #expect(receiver.contains("value.replacingOccurrences("))
              #expect(receiver.contains("<redacted-account-uid>"))
              #expect(receiver.contains("options: [.caseInsensitive, .literal]"))
              #expect(!receiver.contains("log(\\\"tuya_application_update\\\", update"))
          '''
          new_test_body = '''        #expect(receiver.contains("let verifiedAccountUID = membershipAccountUID?.trimmingCharacters"))
              #expect(receiver.contains("redactedApplicationEventDetails("))
              #expect(receiver.contains("verifiedAccountUID: verifiedAccountUID"))
              #expect(receiver.contains("let redactedKey = key.replacingOccurrences("))
              #expect(receiver.contains("let redactedValue = value.replacingOccurrences("))
              #expect(receiver.contains("<redacted-account-uid>"))
              #expect(receiver.contains("options: [.caseInsensitive, .literal]"))
              #expect(receiver.contains("while redacted[uniqueKey] != nil"))
              #expect(receiver.contains("collisionSuffix"))
              #expect(!receiver.contains("guard let accountUID = membershipAccountUID"))
              #expect(!receiver.contains("return update"))
              #expect(!receiver.contains("log(\\\"tuya_application_update\\\", update"))

              let capturedUID = try #require(receiver.range(of: "let verifiedAccountUID = membershipAccountUID?.trimmingCharacters"))
              let preRedaction = try #require(receiver.range(of: "let eventDetailsWithoutProvenance = redactedApplicationEventDetails("))
              let firstLedgerAwait = try #require(receiver.range(of: "try await sessionLedger.recordApplicationUpdate"))
              #expect(capturedUID.lowerBound < preRedaction.lowerBound)
              #expect(preRedaction.lowerBound < firstLedgerAwait.lowerBound)
          '''
          if uid_test.count(old_test_body) != 1:
              raise SystemExit('UID source-test strengthening anchor missing')
          uid_test_path.write_text(uid_test.replace(old_test_body, new_test_body, 1), encoding='utf-8')

          target_test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift')
          target_test = target_test_path.read_text(encoding='utf-8')
          insert_anchor = '    @Test("foreground reactivation cannot reopen membership after official driver handoff")\n'
          inserted_test = '''    @Test("view exit cannot retain an already-correlated or selected target")
              func viewExitCannotCarryTargetAcrossLifetime() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = String(try section(
                      in: source,
                      from: "private final class SecureLinkController",
                      to: "@MainActor\\nprivate protocol OfficialTuyaDriver"
                  ))
                  let cleanup = String(try section(
                      in: controller,
                      from: "func abandonCorrelationForViewExit()",
                      to: "func appDidLoseForeground()"
                  ))

                  #expect(cleanup.contains("phase == .correlated || phase == .selected"))
                  #expect(cleanup.contains("resetDiscoverySessionOnly()"))
                  #expect(cleanup.contains("target_correlation_abandoned_on_view_exit"))
              }

          '''
          if target_test.count(insert_anchor) != 1:
              raise SystemExit('view-exit regression insertion anchor missing')
          target_test_path.write_text(target_test.replace(insert_anchor, inserted_test + insert_anchor, 1), encoding='utf-8')
          PY

      - name: Verify exact source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = source.index('    private func receivedApplicationUpdate(')
          end = source.index('    private func startWatchdog(', start)
          receiver = source[start:end]
          required = [
              'let verifiedAccountUID = membershipAccountUID?.trimmingCharacters',
              'let eventDetailsWithoutProvenance = redactedApplicationEventDetails(',
              'verifiedAccountUID: verifiedAccountUID',
              'while redacted[uniqueKey] != nil',
              'collisionSuffix',
              'eventDetails["generation"] = String(token.diagnosticGeneration)',
          ]
          for token in required:
              if token not in receiver:
                  raise SystemExit(f'missing event-admission atomicity contract: {token}')
          if receiver.index('let eventDetailsWithoutProvenance = redactedApplicationEventDetails(') > receiver.index('try await sessionLedger.recordApplicationUpdate'):
              raise SystemExit('account UID redaction still occurs after actor suspension')
          if 'guard let accountUID = membershipAccountUID' in receiver or 'return update' in receiver:
              raise SystemExit('redaction helper can still reread mutable UID or fail open')

          view_start = source.index('    func abandonCorrelationForViewExit() {')
          view_end = source.index('    func appDidLoseForeground() {', view_start)
          view = source[view_start:view_end]
          for token in ['phase == .correlated || phase == .selected', 'resetDiscoverySessionOnly()', 'target_correlation_abandoned_on_view_exit']:
              if token not in view:
                  raise SystemExit(f'missing view-exit target retirement contract: {token}')
          print('Capture event-admission atomicity + view-exit authority: PASS')
          PY
          git diff --check
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift

      - name: Collapse helper into product donor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-event-admission-atomicity-ba3-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift \
            .github/workflows/materialize-capture-event-admission-atomicity-ba3-sol.yml
          git diff --cached --check
          git commit -m 'fix(capture): freeze account identity at event admission'
          git push origin HEAD:fix/v14-capture-event-admission-atomicity-ba3-sol
