name: Capture Final GO Current Main Worktree Materializer

on:
  push:
    branches:
      - repair/v14-final-go-current-main-worktree-custody-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact parent and materializer-only input
        shell: bash
        run: |
          set -euo pipefail
          parent=5a83d238e071bdeeb3188dc55425ffc220609cbe
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          test "$(git diff --name-only "$parent" HEAD)" = '.github/workflows/capture-final-go-current-main-worktree-materializer.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git cat-file -e 36feddadc1b5bcfb28274b2e7e5f1d3d341e3335^{commit}

      - name: Recover only the validated unique custody deltas
        shell: bash
        run: |
          set -euo pipefail
          git show 36feddadc1b5bcfb28274b2e7e5f1d3d341e3335:scripts/ci/es80_authenticated_stationary_final_go.py > /tmp/hardened_issuer.py
          git show 36feddadc1b5bcfb28274b2e7e5f1d3d341e3335:scripts/ci/tests/test_es80_authenticated_stationary_final_go.py > /tmp/hardened_tests.py
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          issuer_path = Path('scripts/ci/es80_authenticated_stationary_final_go.py')
          current = issuer_path.read_text()
          hardened = Path('/tmp/hardened_issuer.py').read_text()

          # Port exact-current-main admission as one reviewed function, leaving the newer
          # control-plane, path, signed-artifact and environment custody code untouched.
          c0 = current.index('def public(')
          c1 = current.index('\ndef control_plane(', c0)
          h0 = hardened.index('def public(')
          h1 = hardened.index('\ndef control_plane(', h0)
          current = current[:c0] + hardened[h0:h1] + current[c1:]

          # Port only the hidden-index/worktree-byte candidate custody block. Stop before
          # device_hash so the newer component-wise private-device no-symlink contract survives.
          c0 = current.index('def candidate(')
          c1 = current.index('\ndef device_hash(', c0)
          h0 = hardened.index('def _tracked_worktree_bytes(')
          h1 = hardened.index('\ndef device_hash(', h0)
          current = current[:c0] + hardened[h0:h1] + current[c1:]

          old = '    stable_pr=("number","headSHA","headBranch","base","state","merged","draft")\n'
          new = '    stable_pr=("number","headSHA","headBranch","base","mainSHA","state","merged","draft")\n'
          if current.count(old) != 1:
              raise SystemExit('stable PR anchor drift')
          current = current.replace(old, new, 1)
          issuer_path.write_text(current)

          test_path = Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go.py')
          tests = test_path.read_text()
          hardened_tests = Path('/tmp/hardened_tests.py').read_text()

          # The hardened fixture knows how to answer exact-main and compare API calls.
          c0 = tests.index(' def get(self,p):')
          c1 = tests.index(' def control(', c0)
          h0 = hardened_tests.index(' def get(self,p):')
          h1 = hardened_tests.index(' def control(', h0)
          tests = tests[:c0] + hardened_tests[h0:h1] + tests[c1:]

          # Port the three focused adversarial cases: current-main ancestry, post-install main
          # drift, and hidden assume-unchanged/skip-worktree byte replacement.
          h0 = hardened_tests.index(' def test_current_main_is_bound_and_must_be_candidate_ancestor')
          h1 = hardened_tests.index(' def test_installer_ignores_inherited_bash_startup_environment', h0)
          addition = hardened_tests[h0:h1]
          marker = ' def test_post_install_revalidation_rejects_pr_artifact_review_or_device_drift(self):\n'
          if tests.count(marker) != 1:
              raise SystemExit('test insertion anchor drift')
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Validate composed authority repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/es80_authenticated_stationary_signed_artifact.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          grep -Fq 'mainSHA' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'candidate authority path has non-default Git index flags' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'candidate worktree bytes differ from accepted Git blob' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'canonical_private_path(device,"private intended-device identifier")' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'env=installer_environment(device)' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq '["/bin/bash","--noprofile","--norc","-p"' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'stable_pr=("number","headSHA","headBranch","base","mainSHA","state","merged","draft")' scripts/ci/es80_authenticated_stationary_final_go.py
          git diff --check

      - name: Publish clean two-file repair
        shell: bash
        run: |
          set -euo pipefail
          parent=5a83d238e071bdeeb3188dc55425ffc220609cbe
          git rm .github/workflows/capture-final-go-current-main-worktree-materializer.yml
          git add scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          expected="$({ printf '%s\n' 'scripts/ci/es80_authenticated_stationary_final_go.py' 'scripts/ci/tests/test_es80_authenticated_stationary_final_go.py'; } | sort)"
          actual="$(git diff --cached --name-only "$parent" | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name 'jonathangana131-lab'
          git config user.email 'jonathangana131@gmail.com'
          git commit -m 'fix(capture): bind Final GO to current main and exact worktree bytes'
          git push origin HEAD:repair/v14-final-go-current-main-worktree-custody-sol
