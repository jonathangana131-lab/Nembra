name: Capture Private Read Lease Handoff Materialize Once

on:
  push:
    branches:
      - repair/v17-capture-read-lease-post-validation-symlink-gpt56
    paths:
      - .github/workflows/capture-private-read-lease-handoff-materialize-once.yml

permissions:
  contents: write
  actions: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-read-lease-post-validation-symlink-gpt56
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact authoring checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9ec3785561c625bb092b061545f54f75b6f7cc43"
          test "$(git diff --name-only HEAD^...HEAD)" = ".github/workflows/capture-private-read-lease-handoff-materialize-once.yml"

      - name: Materialize product repair and final gate
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path

          helper = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          source = helper.read_text(encoding="utf-8")
          old = '''                diagnostic = _open_pinned_path(
                    path, is_directory, accepted_signature
                )
                os.close(diagnostic)
        except Exception as error:
          '''
          new = '''                diagnostic = _open_pinned_path(
                    path, is_directory, accepted_signature
                )
                os.close(diagnostic)

            # A held directory descriptor does not freeze mutable symlink entries.
            # Reclassify every admitted directory subject after all ACLs materialize,
            # immediately before authority is handed to the exec-bound build guard.
            # The guard's initial generation snapshot and vnode monitoring then cover
            # the subsequent compiler window.
            opened_by_path = {
                Path(record["path"]): record for record in self._opened
            }
            for subject in self._subjects:
                subject_record = opened_by_path.get(subject)
                if subject_record is None:
                    raise SelectedXcodeBuildOrchestratorError(
                        "accepted private read-lease subject has no held descriptor"
                    )
                if not bool(subject_record["is_directory"]):
                    continue
                _validate_subject_symlinks_from_descriptor(
                    subject,
                    int(subject_record["descriptor"]),
                )
        except Exception as error:
          '''
          if source.count(old) != 1:
              raise SystemExit("production insertion seam did not match exactly once")
          helper.write_text(source.replace(old, new), encoding="utf-8")

          final_gate = r'''name: Capture Private Read Lease Component Walk

on:
  pull_request:
    paths:
      - scripts/ci/capture_selected_xcode_build_orchestrator.py
      - scripts/ci/tests/test_capture_private_read_lease_component_walk.py
      - scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget.py
      - .github/workflows/capture-private-read-lease-component-walk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-private-read-lease-component-walk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 578b389e7974ff8814020d773ee0115531b654be
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  component-walk:
    name: Prove no-follow component-anchored lease admission
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Anchor Darwin fixtures under a real no-symlink temp root
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import os
          from pathlib import Path
          import stat

          root = Path('/private/tmp')
          metadata = root.lstat()
          if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
              raise SystemExit('/private/tmp is not one real directory')
          if root.resolve(strict=True) != root:
              raise SystemExit('/private/tmp does not resolve to itself')
          if not os.access(root, os.W_OK | os.X_OK):
              raise SystemExit('/private/tmp is not writable/searchable by the runner')
          PY
          echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"

      - name: Bind exact serial hardening delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-component-walk.yml \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile component-walk sources without artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              "scripts/ci/capture_selected_xcode_build_orchestrator.py",
              "scripts/ci/tests/test_capture_private_read_lease_component_walk.py",
              "scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget.py",
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          PY

      - name: Prove component-walk and handoff behavior
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget.py

      - name: Preserve selected-Xcode composition regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py

      - name: Preserve rollback regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py

      - name: Preserve host-ancestry regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py

      - name: Preserve clean exact head
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve truth boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "NEMBRA_COMPONENT_WALK_BOUNDARY productionLeaseChanged=true deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false"
'''
          Path(".github/workflows/capture-private-read-lease-component-walk.yml").write_text(
              final_gate,
              encoding="utf-8",
          )
          PY

          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              "scripts/ci/capture_selected_xcode_build_orchestrator.py",
              "scripts/ci/tests/test_capture_private_read_lease_component_walk.py",
              "scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget.py",
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          PY
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/capture-private-read-lease-component-walk.yml scripts/ci/capture_selected_xcode_build_orchestrator.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish clean product checkpoint and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/capture-private-read-lease-component-walk.yml scripts/ci/capture_selected_xcode_build_orchestrator.py
          git commit -m 'fix(capture): revalidate symlinks at lease handoff'
          git rm .github/workflows/capture-private-read-lease-handoff-materialize-once.yml
          git commit -m 'ci(capture): remove handoff materializer'
          git push origin HEAD:repair/v17-capture-read-lease-post-validation-symlink-gpt56

      - name: Dispatch final exact-head acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run capture-private-read-lease-component-walk.yml \
            --ref repair/v17-capture-read-lease-post-validation-symlink-gpt56

      - name: Preserve truth boundary
        shell: bash
        run: |
          echo 'NEMBRA_HANDOFF_MATERIALIZER physicalAuthorityCreated=false deviceTouched=false bluetoothTouched=false commandAuthorityCreated=false'
