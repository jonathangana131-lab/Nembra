name: Materialize Capture Truth Convergence 8069

on:
  push:
    branches:
      - sol/v14-capture-truth-convergence-8069

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          BASE=8069c0ffec496cacbe263016d8a7f4ca15ddc64e
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t paths < <(git diff --name-only "$BASE"...HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = ".github/workflows/materialize-capture-truth-convergence-8069.yml"

      - name: Apply current secret and accepted-event truth repairs
        shell: bash
        run: |
          set -euo pipefail
          cat > Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaExactSecretValueRedactor.swift <<'SWIFT'
          import Foundation

          /// Redacts one already-authorized exact secret from application evidence without treating
          /// generic key names (for example `uid`) as secrets. Redaction-created key collisions are
          /// retained under deterministic non-authoritative suffixes instead of silently dropping
          /// one of the original opaque fields.
          public enum TuyaExactSecretValueRedactor: Sendable {
              public static func redact(
                  fields: [String: String],
                  exactSecret: String,
                  marker: String
              ) -> [String: String] {
                  guard !exactSecret.isEmpty else { return fields }
                  var output: [String: String] = [:]
                  for originalKey in fields.keys.sorted() {
                      guard let originalValue = fields[originalKey] else { continue }
                      let redactedKey = originalKey.replacingOccurrences(of: exactSecret, with: marker)
                      let redactedValue = originalValue.replacingOccurrences(of: exactSecret, with: marker)
                      var admittedKey = redactedKey
                      var collisionIndex = 1
                      while output[admittedKey] != nil {
                          admittedKey = "\(redactedKey)#redacted-collision-\(collisionIndex)"
                          collisionIndex += 1
                      }
                      output[admittedKey] = redactedValue
                  }
                  return output
              }
          }
          SWIFT

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExactSecretValueRedactorTests.swift <<'SWIFT'
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya exact secret value redactor")
          struct TuyaExactSecretValueRedactorTests {
              private let secret = "account-UID-123"
              private let marker = "<redacted-account-uid>"

              @Test("exact account UID is scrubbed from values while generic uid key survives")
              func valueRedactionPreservesGenericUIDKey() {
                  let result = TuyaExactSecretValueRedactor.redact(
                      fields: ["uid": "device-uid-456", "owner": "prefix-account-UID-123-suffix"],
                      exactSecret: secret,
                      marker: marker
                  )
                  #expect(result["uid"] == "device-uid-456")
                  #expect(result["owner"] == "prefix-<redacted-account-uid>-suffix")
                  #expect(!result.keys.joined().contains(secret))
                  #expect(!result.values.joined().contains(secret))
              }

              @Test("malformed account-UID-bearing keys are scrubbed")
              func keyRedaction() {
                  let result = TuyaExactSecretValueRedactor.redact(
                      fields: ["device-account-UID-123-owner": "safe"],
                      exactSecret: secret,
                      marker: marker
                  )
                  #expect(result["device-<redacted-account-uid>-owner"] == "safe")
                  #expect(!result.keys.joined().contains(secret))
              }

              @Test("redaction-created key collisions preserve both evidence fields deterministically")
              func collisionPreservation() {
                  let result = TuyaExactSecretValueRedactor.redact(
                      fields: [
                          "owner-account-UID-123": "secret account-UID-123",
                          "owner-<redacted-account-uid>": "already marker text",
                      ],
                      exactSecret: secret,
                      marker: marker
                  )
                  #expect(result.count == 2)
                  #expect(Set(result.values) == Set(["secret <redacted-account-uid>", "already marker text"]))
                  #expect(result.keys.allSatisfy { !$0.contains(secret) })
                  #expect(result.values.allSatisfy { !$0.contains(secret) })
                  #expect(result.keys.contains("owner-<redacted-account-uid>"))
                  #expect(result.keys.contains("owner-<redacted-account-uid>#redacted-collision-1"))
              }

              @Test("empty exact secret is a no-op rather than matching every string boundary")
              func emptySecretNoOp() {
                  let fields = ["uid": "device-uid", "value": "ordinary"]
                  #expect(TuyaExactSecretValueRedactor.redact(fields: fields, exactSecret: "", marker: marker) == fields)
              }
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          app = app_path.read_text()

          duplicate = '''    private static let secretKeyFragments = [
                  "localkey",
                  "sessionkey",
                  "appkey",
                  "appsecret",
                  "password",
                  "accounttoken",
                  "accesstoken",
                  "refreshtoken",
                  "sessionkey",
                  "authkey",
                  "seckey",
              ]'''
          canonical = '''    private static let secretKeyFragments = [
                  "localkey",
                  "sessionkey",
                  "appkey",
                  "appsecret",
                  "password",
                  "accounttoken",
                  "accesstoken",
                  "refreshtoken",
                  "authkey",
                  "seckey",
              ]'''
          if app.count(duplicate) != 1:
              raise SystemExit(f"expected one duplicated SmartLife secret classifier, found {app.count(duplicate)}")
          app = app.replace(duplicate, canonical, 1)

          start = app.index("    private func receivedApplicationUpdate(")
          end = app.index("    private func startWatchdog", start)
          receiver = app[start:end]
          authority = "              accountIdentityLeaseIsAuthorized,\n              let driver else {"
          authority_with_uid = "              accountIdentityLeaseIsAuthorized,\n              let verifiedAccountUID = currentAccountUID,\n              !verifiedAccountUID.isEmpty,\n              membershipAccountUID == verifiedAccountUID,\n              let driver else {"
          if receiver.count(authority) != 1:
              raise SystemExit(f"expected one application authority seam, found {receiver.count(authority)}")
          receiver = receiver.replace(authority, authority_with_uid, 1)

          raw_log = '            log("tuya_application_update", update.merging(['
          if receiver.count(raw_log) != 1:
              raise SystemExit(f"expected one raw application-event custody seam, found {receiver.count(raw_log)}")
          redacted_log = '''            guard sdkAccountLoggedIn,
                  sdkDeviceMembershipVerified,
                  accountIdentityLeaseIsAuthorized,
                  currentAccountUID == verifiedAccountUID,
                  membershipAccountUID == verifiedAccountUID else {
              await invalidateSourceAuthority(
                  token: token,
                  message: "SDK account identity changed while application evidence was entering event custody.",
                  kind: "sdk_account_identity_changed_before_application_event_custody"
              )
              return
          }
              let accountUIDRedactedUpdate = TuyaExactSecretValueRedactor.redact(
                  fields: update,
                  exactSecret: verifiedAccountUID,
                  marker: "<redacted-account-uid>"
              )
              log("tuya_application_update", accountUIDRedactedUpdate.merging(['''
          receiver = receiver.replace(raw_log, redacted_log, 1)
          untrusted_precedence = ']) { current, _ in current })'
          if receiver.count(untrusted_precedence) != 1:
              raise SystemExit(f"expected one untrusted generation collision seam, found {receiver.count(untrusted_precedence)}")
          receiver = receiver.replace(untrusted_precedence, ']) { _, trusted in trusted })', 1)
          app_path.write_text(app[:start] + receiver + app[end:])

          bridge_path = Path("NembraApp/Features/Research/TuyaAccountBridge.swift")
          bridge = bridge_path.read_text()
          old_bridge = '            let secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "sessionkey", "seckey", "authkey"]'
          new_bridge = '            let secretKeyFragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "seckey", "authkey"]'
          if bridge.count(old_bridge) != 1:
              raise SystemExit(f"expected one current TuyaAccountBridge secret classifier, found {bridge.count(old_bridge)}")
          bridge_path.write_text(bridge.replace(old_bridge, new_bridge, 1))
          PY

          TESTROOT=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests
          cat > "$TESTROOT/TuyaApplicationEventMetadataPrecedenceSourceTests.swift" <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application event metadata precedence")
          struct TuyaApplicationEventMetadataPrecedenceSourceTests {
              @Test("SDK application keys cannot overwrite Nembra generation provenance")
              func trustedGenerationWinsReservedKeyCollision() throws {
                  let source = try entrypointSource()
                  let receiver = String(try section(in: source, from: "private func receivedApplicationUpdate(", to: "private func startWatchdog"))
                  #expect(receiver.contains("log(\"tuya_application_update\""))
                  #expect(receiver.contains("\"generation\": String(token.diagnosticGeneration)"))
                  #expect(!receiver.contains(") { current, _ in current })"))
                  #expect(receiver.contains(") { _, trusted in trusted })"))
              }
              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start), let b = source.range(of: end, range: a.upperBound..<source.endIndex) else { throw ContractError.missing }
                  return source[a.lowerBound..<b.lowerBound]
              }
              private func entrypointSource() throws -> String {
                  var root = URL(fileURLWithPath: #filePath); for _ in 0..<5 { root.deleteLastPathComponent() }
                  return try String(contentsOf: root.appendingPathComponent("NembraApp/App/NembraCaptureEntrypoint.swift"), encoding: .utf8)
              }
              private enum ContractError: Error { case missing }
          }
          SWIFT

          cat > "$TESTROOT/TuyaExportSecretClassifierConvergenceSourceTests.swift" <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture export secret classifier convergence")
          struct TuyaExportSecretClassifierConvergenceSourceTests {
              private let fragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey"]
              @Test("application and metadata classifiers cover one coherent export-secret set")
              func classifiersStayConverged() throws {
                  let app = try read("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(in: app, from: "private static let secretKeyFragments = [", to: "private static func redactApplicationSecrets(_ object: Any) -> Any"))
                  let bridge = try read("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let redactor = String(try section(in: bridge, from: "private static func redactSecrets(_ object: Any) -> Any", to: "private static func remoteMessage(_ object: [String: Any]) -> String"))
                  for fragment in fragments {
                      #expect(driver.components(separatedBy: "\"\(fragment)\"").count - 1 == 1)
                      #expect(redactor.components(separatedBy: "\"\(fragment)\"").count - 1 == 1)
                  }
              }
              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start), let b = source.range(of: end, range: a.upperBound..<source.endIndex) else { throw ContractError.missing }
                  return source[a.lowerBound..<b.lowerBound]
              }
              private func read(_ relative: String) throws -> String {
                  var root = URL(fileURLWithPath: #filePath); for _ in 0..<5 { root.deleteLastPathComponent() }
                  return try String(contentsOf: root.appendingPathComponent(relative), encoding: .utf8)
              }
              private enum ContractError: Error { case missing }
          }
          SWIFT

          cat > "$TESTROOT/TuyaApplicationAccountUIDExportCustodySourceTests.swift" <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application account-UID export custody")
          struct TuyaApplicationAccountUIDExportCustodySourceTests {
              @Test("accepted application evidence is same-account rechecked and UID-redacted before event custody")
              func applicationEvidenceCannotExportVerifiedAccountUID() throws {
                  let source = try entrypointSource()
                  let receiver = String(try section(in: source, from: "private func receivedApplicationUpdate(", to: "private func startWatchdog"))
                  #expect(source.contains("No account UID"))
                  #expect(receiver.contains("let verifiedAccountUID = currentAccountUID"))
                  #expect(receiver.components(separatedBy: "membershipAccountUID == verifiedAccountUID").count - 1 >= 2)
                  #expect(receiver.contains("currentAccountUID == verifiedAccountUID"))
                  #expect(receiver.contains("sdk_account_identity_changed_before_application_event_custody"))
                  #expect(receiver.contains("TuyaExactSecretValueRedactor.redact"))
                  #expect(receiver.contains("marker: \"<redacted-account-uid>\""))
                  #expect(!receiver.contains("log(\"tuya_application_update\", update.merging(["))
                  #expect(receiver.contains("accountUIDRedactedUpdate.merging(["))
              }
              @Test("generic uid key is not blanket-classified as a credential")
              func genericUIDKeyRemainsOpaqueEvidence() throws {
                  let source = try entrypointSource()
                  let driver = String(try section(in: source, from: "@MainActor\nprivate final class SmartLifeDriver", to: "#endif\n\nprivate enum AppleAccountAuthorizationError"))
                  #expect(!driver.contains("\"uid\","))
                  #expect(!driver.contains("\"uid\"\n"))
              }
              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start), let b = source.range(of: end, range: a.upperBound..<source.endIndex) else { throw ContractError.missing }
                  return source[a.lowerBound..<b.lowerBound]
              }
              private func entrypointSource() throws -> String {
                  var root = URL(fileURLWithPath: #filePath); for _ in 0..<5 { root.deleteLastPathComponent() }
                  return try String(contentsOf: root.appendingPathComponent("NembraApp/App/NembraCaptureEntrypoint.swift"), encoding: .utf8)
              }
              private enum ContractError: Error { case missing }
          }
          SWIFT

      - name: Run focused package and source contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter 'TuyaExactSecretValueRedactorTests|TuyaApplicationAccountUIDExportCustodySourceTests|TuyaApplicationEventMetadataPrecedenceSourceTests|TuyaExportSecretClassifierConvergenceSourceTests'
          python3 - <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          receiver = app.split("private func receivedApplicationUpdate(", 1)[1].split("private func startWatchdog", 1)[0]
          assert receiver.count('membershipAccountUID == verifiedAccountUID') >= 2
          assert 'currentAccountUID == verifiedAccountUID' in receiver
          assert 'TuyaExactSecretValueRedactor.redact' in receiver
          assert 'marker: "<redacted-account-uid>"' in receiver
          assert 'log("tuya_application_update", update.merging([' not in receiver
          assert 'accountUIDRedactedUpdate.merging([' in receiver
          assert ']) { _, trusted in trusted })' in receiver
          assert ']) { current, _ in current })' not in receiver
          driver = app.split("private static let secretKeyFragments = [", 1)[1].split("private static func redactApplicationSecrets(_ object: Any) -> Any", 1)[0]
          bridge = Path("NembraApp/Features/Research/TuyaAccountBridge.swift").read_text().split("private static func redactSecrets(_ object: Any) -> Any", 1)[1].split("private static func remoteMessage(_ object: [String: Any]) -> String", 1)[0]
          fragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey"]
          for fragment in fragments:
              assert driver.count(f'"{fragment}"') == 1
              assert bridge.count(f'"{fragment}"') == 1
          PY
          git diff --check

      - name: Publish clean exact-current donor
        shell: bash
        run: |
          set -euo pipefail
          BASE=8069c0ffec496cacbe263016d8a7f4ca15ddc64e
          WORKFLOW=.github/workflows/materialize-capture-truth-convergence-8069.yml
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaExactSecretValueRedactor.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExactSecretValueRedactorTests.swift
          T1=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          T2=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExportSecretClassifierConvergenceSourceTests.swift
          T3=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=("$WORKFLOW" "NembraApp/App/NembraCaptureEntrypoint.swift" "NembraApp/Features/Research/TuyaAccountBridge.swift" "$SOURCE" "$TEST" "$T1" "$T2" "$T3")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${staged[*]}" = "${expected_sorted[*]}"
          git commit -m "fix(capture): converge accepted-event secret custody"
          mapfile -t effective < <(git diff --name-only "$BASE"...HEAD | sort)
          expected_effective=("NembraApp/App/NembraCaptureEntrypoint.swift" "NembraApp/Features/Research/TuyaAccountBridge.swift" "$SOURCE" "$TEST" "$T1" "$T2" "$T3")
          mapfile -t expected_effective_sorted < <(printf '%s\n' "${expected_effective[@]}" | sort)
          test "${effective[*]}" = "${expected_effective_sorted[*]}"
          git diff --check "$BASE"...HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
