name: V14 Capture Correlation Progress Format Sync

on:
  push:
    branches:
      - fix/v14-capture-correlation-progress-current-r2-sol

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-correlation-progress-current-r2-sol
          fetch-depth: 0

      - name: Guard and normalize indentation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2935c20035e595dbbf692a05c1b0c60f81cac572"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()
          old = "    private var correlationDisplayedWindowOrdinal: Int {\n    test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)\n}\n"
          new = "    private var correlationDisplayedWindowOrdinal: Int {\n        test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)\n    }\n"
          if text.count(old) != 1:
              raise SystemExit(f"format guard failed: found {text.count(old)} matches")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -Fq '        test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Commit clean formatting
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-correlation-progress-format-sync.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(capture): normalize correlation progress helper"
          git push origin HEAD:fix/v14-capture-correlation-progress-current-r2-sol
