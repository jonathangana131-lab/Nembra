name: Temporary V14 Capture Private Device Runner Execution Repair

on:
  push:
    branches:
      - repair/v14-capture-private-device-runner-execution-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-private-device-runner-execution-sol
          fetch-depth: 0

      - name: Patch exact runner execution boundary and validate
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B scripts/ci/tmp_materialize_private_device_runner_execution.py
          rm .github/workflows/tmp-v14-capture-private-device-runner-execution.yml scripts/ci/tmp_materialize_private_device_runner_execution.py
          bash -n scripts/field/install_one_time_capture.command
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-pycache" /usr/bin/python3 -m py_compile \
            scripts/ci/tests/test_capture_private_device_runner_execution_subject.py \
            scripts/ci/tests/test_capture_signed_app_install_custody.py \
            scripts/ci/capture_signed_app_install_custody.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_device_runner_execution_subject.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_custody.py
          git diff --check

      - name: Commit clean production repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-capture-bot'
          git config user.email 'nembra-capture-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): pin private-device runner execution bytes'
          git push origin HEAD:repair/v14-capture-private-device-runner-execution-sol
