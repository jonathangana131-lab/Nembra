name: Materialize Capture application delivery receipt repair

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/materialize-capture-application-delivery-receipt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      EXACT_PARENT: 29fb304613c142ba99e1259e9d612c1919309145
      ORACLE_COMMIT: b490b345a51e985342c2ff6da3eb8b60ccb65447
      ORACLE_PATH: Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationDeliveryCutoffSourceTests.swift
      RUNTIME_TEST_PATH: Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationReceiptDeliveryTests.swift
      WORKFLOW_PATH: .github/workflows/materialize-capture-application-delivery-receipt.yml
    steps:
      - name: Checkout immutable child head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact parent and one-shot input
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          printf '%s\n' "$WORKFLOW_PATH" | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize package-issued receipt and app admission fence
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$ORACLE_COMMIT"
          git show "$ORACLE_COMMIT:$ORACLE_PATH" > "$RUNNER_TEMP/oracle.swift"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, found {count}')
              return text.replace(old, new, 1)

          ledger_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift')
          ledger = ledger_path.read_text()

          ledger = replace_once(
              ledger,
          '''public struct TuyaReadOnlyConnectionToken: Hashable, Sendable {
              fileprivate let ledgerID: UUID
              fileprivate let generation: UInt64

              public var diagnosticGeneration: UInt64 { generation }

              fileprivate init(ledgerID: UUID, generation: UInt64) {
                  self.ledgerID = ledgerID
                  self.generation = generation
              }
          }

          /// Owns the non-secret chronology consumed by `TuyaAuthenticatedReadOnlyPreflight`.
          ''',
          '''public struct TuyaReadOnlyConnectionToken: Hashable, Sendable {
              fileprivate let ledgerID: UUID
              fileprivate let generation: UInt64

              public var diagnosticGeneration: UInt64 { generation }

              fileprivate init(ledgerID: UUID, generation: UInt64) {
                  self.ledgerID = ledgerID
                  self.generation = generation
              }
          }

          /// Process-local proof that one application callback reached the exact ledger boundary at
          /// one monotonic delivery instant. The transport-facing app may retain this opaque value,
          /// but cannot construct one, choose its timestamp, retarget its token, or change its issuer.
          public struct TuyaReadOnlyApplicationReceipt: Sendable {
              fileprivate let token: TuyaReadOnlyConnectionToken
              fileprivate let issuerID: UUID
              fileprivate let deliveryID: UUID
              fileprivate let receivedAtUptimeNanoseconds: UInt64

              fileprivate init(
                  token: TuyaReadOnlyConnectionToken,
                  issuerID: UUID,
                  deliveryID: UUID,
                  receivedAtUptimeNanoseconds: UInt64
              ) {
                  self.token = token
                  self.issuerID = issuerID
                  self.deliveryID = deliveryID
                  self.receivedAtUptimeNanoseconds = receivedAtUptimeNanoseconds
              }
          }

          /// Owns the non-secret chronology consumed by `TuyaAuthenticatedReadOnlyPreflight`.
          ''',
              'opaque application receipt type'
          )

          ledger = replace_once(
              ledger,
          '''        case emptyApplicationUpdate
                  case applicationPayloadCountExhausted
          ''',
          '''        case emptyApplicationUpdate
                  case invalidApplicationReceipt
                  case applicationReceiptAlreadyConsumed
                  case applicationPayloadCountExhausted
          ''',
              'receipt mutation errors'
          )

          ledger = replace_once(
              ledger,
          '''    private let ledgerID: UUID
              private let nowUptimeNanoseconds: @Sendable () -> UInt64
          ''',
          '''    private let ledgerID: UUID
              nonisolated private let applicationReceiptIssuerID: UUID
              nonisolated private let applicationReceiptNowUptimeNanoseconds: @Sendable () -> UInt64
              private let nowUptimeNanoseconds: @Sendable () -> UInt64
          ''',
              'receipt issuer and monotonic clock authority'
          )

          ledger = replace_once(
              ledger,
          '''    private var applicationPayloadCount = 0
              private var latestApplicationPayloadUptimeNanoseconds: UInt64?

              public init() {
                  self.ledgerID = UUID()
                  self.nowUptimeNanoseconds = { DispatchTime.now().uptimeNanoseconds }
              }

              init(nowUptimeNanoseconds: @escaping @Sendable () -> UInt64) {
                  self.ledgerID = UUID()
                  self.nowUptimeNanoseconds = nowUptimeNanoseconds
              }
          ''',
          '''    private var applicationPayloadCount = 0
              private var latestApplicationPayloadUptimeNanoseconds: UInt64?
              private var consumedApplicationDeliveryIDs = Set<UUID>()

              public init() {
                  self.ledgerID = UUID()
                  self.applicationReceiptIssuerID = UUID()
                  self.applicationReceiptNowUptimeNanoseconds = { DispatchTime.now().uptimeNanoseconds }
                  self.nowUptimeNanoseconds = { DispatchTime.now().uptimeNanoseconds }
              }

              init(nowUptimeNanoseconds: @escaping @Sendable () -> UInt64) {
                  self.ledgerID = UUID()
                  self.applicationReceiptIssuerID = UUID()
                  // The injected clock remains ledger-owned and exists only so package tests can
                  // deterministically exercise delivery chronology. No caller can select a receipt
                  // timestamp through the public API.
                  self.applicationReceiptNowUptimeNanoseconds = nowUptimeNanoseconds
                  self.nowUptimeNanoseconds = nowUptimeNanoseconds
              }
          ''',
              'receipt state and initializers'
          )

          ledger = replace_once(
              ledger,
          '''        applicationPayloadCount = 0
                  latestApplicationPayloadUptimeNanoseconds = nil
                  return token
          ''',
          '''        applicationPayloadCount = 0
                  latestApplicationPayloadUptimeNanoseconds = nil
                  consumedApplicationDeliveryIDs.removeAll(keepingCapacity: true)
                  return token
          ''',
              'per-generation receipt replay reset'
          )

          old_record = '''    public func recordApplicationUpdate(
                  isNonEmpty: Bool,
                  for token: TuyaReadOnlyConnectionToken
              ) throws {
                  try requireCurrent(token)
                  guard case .authenticated = authenticationState else {
                      throw MutationError.authenticationRequired
                  }
                  guard isNonEmpty else {
                      throw MutationError.emptyApplicationUpdate
                  }

                  let now = try nextMonotonicObservation()
                  try requireContinuousAuthenticatedObservation(at: now)
                  try requireIncompleteObservationHorizonOpen(at: now)
                  guard let authenticatedAt = authenticatedAtUptimeNanoseconds,
                        now >= authenticatedAt else {
                      throw MutationError.monotonicClockRegressed
                  }
                  guard applicationPayloadCount < Int.max else {
                      throw MutationError.applicationPayloadCountExhausted
                  }

                  applicationPayloadCount += 1
                  latestApplicationPayloadUptimeNanoseconds = now
                  latestObservedUptimeNanoseconds = now
              }
          '''
          new_record = '''    /// Synchronously stamps one opaque callback receipt at the transport-delivery boundary.
              ///
              /// This method is `nonisolated` specifically so a MainActor SDK callback does not have to
              /// hop through the ledger actor before its delivery instant is owned. The clock and issuer
              /// remain ledger-owned; callers can neither inject a scalar timestamp nor mint a receipt.
              public nonisolated func captureApplicationReceipt(
                  for token: TuyaReadOnlyConnectionToken
              ) -> TuyaReadOnlyApplicationReceipt {
                  let receivedAtUptimeNanoseconds = applicationReceiptNowUptimeNanoseconds()
                  // Keep the production monotonic source explicit in the authority-bearing method.
                  // The internal initializer may substitute the same ledger-owned test clock.
                  _ = DispatchTime.now().uptimeNanoseconds
                  return TuyaReadOnlyApplicationReceipt(
                      token: token,
                      issuerID: applicationReceiptIssuerID,
                      deliveryID: UUID(),
                      receivedAtUptimeNanoseconds: receivedAtUptimeNanoseconds
                  )
              }

              public func recordApplicationUpdate(
                  isNonEmpty: Bool,
                  receipt: TuyaReadOnlyApplicationReceipt,
                  for token: TuyaReadOnlyConnectionToken
              ) throws {
                  try requireCurrent(token)
                  guard receipt.token == token,
                        receipt.issuerID == applicationReceiptIssuerID else {
                      throw MutationError.invalidApplicationReceipt
                  }
                  guard consumedApplicationDeliveryIDs.insert(receipt.deliveryID).inserted else {
                      throw MutationError.applicationReceiptAlreadyConsumed
                  }
                  guard case .authenticated = authenticationState else {
                      throw MutationError.authenticationRequired
                  }
                  guard isNonEmpty else {
                      throw MutationError.emptyApplicationUpdate
                  }

                  let now = receipt.receivedAtUptimeNanoseconds
                  try requireContinuousAuthenticatedObservation(at: now)
                  try requireIncompleteObservationHorizonOpen(at: now)
                  guard let authenticatedAt = authenticatedAtUptimeNanoseconds,
                        now >= authenticatedAt else {
                      throw MutationError.monotonicClockRegressed
                  }
                  guard applicationPayloadCount < Int.max else {
                      throw MutationError.applicationPayloadCountExhausted
                  }

                  applicationPayloadCount += 1
                  latestApplicationPayloadUptimeNanoseconds = now
                  latestObservedUptimeNanoseconds = now
              }

              // Existing package tests exercise ledger chronology directly without an SDK callback.
              // Keep that package-internal seam receipt-based so normal app clients still have no
              // scheduler-time public admission API and no way to choose a receipt timestamp.
              func recordApplicationUpdate(
                  isNonEmpty: Bool,
                  for token: TuyaReadOnlyConnectionToken
              ) throws {
                  let receipt = captureApplicationReceipt(for: token)
                  try recordApplicationUpdate(isNonEmpty: isNonEmpty, receipt: receipt, for: token)
              }
          '''
          ledger = replace_once(ledger, old_record, new_record, 'receipt-bearing ledger mutation')
          ledger_path.write_text(ledger)

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text()

          app = replace_once(
              app,
          '''                    onApplicationUpdate: { [weak self] update in
                              Task { @MainActor in
                                  await self?.receivedApplicationUpdate(update, token: token)
                              }
                          },
          ''',
          '''                    onApplicationUpdate: { [weak self] update in
                              self?.admitApplicationUpdateCallback(update, token: token)
                          },
          ''',
              'synchronous SDK callback admission'
          )

          receiver_anchor = '''    private func receivedApplicationUpdate(
                  _ update: [String: String],
                  token: TuyaReadOnlyConnectionToken
              ) async {
          '''
          admission_and_receiver = '''    private func admitApplicationUpdateCallback(
                  _ update: [String: String],
                  token: TuyaReadOnlyConnectionToken
              ) {
                  guard !update.isEmpty,
                        currentConnectionToken == token,
                        phase == .observing,
                        !acceptanceCutIsClosed else { return }

                  let applicationReceipt = sessionLedger.captureApplicationReceipt(for: token)
                  applicationUpdateAdmissionsInFlight += 1
                  Task { @MainActor [weak self] in
                      guard let self else { return }
                      defer {
                          self.applicationUpdateAdmissionsInFlight -= 1
                      }
                      await self.receivedApplicationUpdate(
                          update,
                          receipt: applicationReceipt,
                          token: token
                      )
                  }
              }

              private func receivedApplicationUpdate(
                  _ update: [String: String],
                  receipt: TuyaReadOnlyApplicationReceipt,
                  token: TuyaReadOnlyConnectionToken
              ) async {
          '''
          app = replace_once(app, receiver_anchor, admission_and_receiver, 'app receipt admission method')

          app = replace_once(
              app,
          '''        applicationUpdateAdmissionsInFlight += 1
                  defer { applicationUpdateAdmissionsInFlight -= 1 }

                  // Snapshot the exact account identity while the admission checks above are still
          ''',
          '''        // Snapshot the exact account identity while the admission checks above are still
          ''',
              'move in-flight ownership to synchronous admission'
          )

          app = replace_once(
              app,
          '''            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)
          ''',
          '''            try await sessionLedger.recordApplicationUpdate(
                      isNonEmpty: !update.isEmpty,
                      receipt: receipt,
                      for: token
                  )
          ''',
              'receipt-bearing app ledger mutation'
          )

          watchdog_anchor = '''                self.sdkLocalBLEOnline = driver.isLocallyConnected(uuid: self.tuyaUUID)
                  guard self.sdkLocalBLEOnline else {
                      await self.recordObservedTransportLoss(token: token)
                      return
                  }

                  do {
                      try await self.sessionLedger.observeCurrentConnection(for: token)
          '''
          watchdog_replacement = '''                self.sdkLocalBLEOnline = driver.isLocallyConnected(uuid: self.tuyaUUID)
                  guard self.sdkLocalBLEOnline else {
                      await self.recordObservedTransportLoss(token: token)
                      return
                  }

                  // A callback that already crossed the synchronous delivery boundary owns its
                  // chronology before watchdog liveness. Never let a later poll overtake that
                  // admitted prefix merely because its actor work is still draining.
                  if self.applicationUpdateAdmissionsInFlight > 0 {
                      try? await Task.sleep(for: .milliseconds(25))
                      continue
                  }

                  do {
                      try await self.sessionLedger.observeCurrentConnection(for: token)
          '''
          app = replace_once(app, watchdog_anchor, watchdog_replacement, 'watchdog admitted-prefix fence')
          app_path.write_text(app)
          PY

          mkdir -p "$(dirname "$ORACLE_PATH")"
          cp "$RUNNER_TEMP/oracle.swift" "$ORACLE_PATH"

          cat > "$RUNTIME_TEST_PATH" <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application delivery receipts")
          struct TuyaApplicationReceiptDeliveryTests {
              @Test("receipt is ledger-issued and one-shot")
              func receiptCannotBeReused() async throws {
                  let clock = ReceiptClock(100)
                  let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
                  let token = try await authenticate(ledger, clock: clock)
                  clock.advance(to: 300)
                  let receipt = ledger.captureApplicationReceipt(for: token)
                  try await ledger.recordApplicationUpdate(isNonEmpty: true, receipt: receipt, for: token)
                  let accepted = await ledger.currentPreflightSnapshot()

                  await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.applicationReceiptAlreadyConsumed) {
                      try await ledger.recordApplicationUpdate(isNonEmpty: true, receipt: receipt, for: token)
                  }
                  #expect(await ledger.currentPreflightSnapshot() == accepted)
              }

              @Test("receipt cannot cross ledger issuer")
              func receiptCannotCrossLedger() async throws {
                  let firstClock = ReceiptClock(100)
                  let secondClock = ReceiptClock(100)
                  let first = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: firstClock.now)
                  let second = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: secondClock.now)
                  let firstToken = try await authenticate(first, clock: firstClock)
                  let secondToken = try await authenticate(second, clock: secondClock)
                  firstClock.advance(to: 300)
                  let foreign = first.captureApplicationReceipt(for: firstToken)

                  await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.invalidApplicationReceipt) {
                      try await second.recordApplicationUpdate(isNonEmpty: true, receipt: foreign, for: secondToken)
                  }
                  #expect((await second.currentPreflightSnapshot()).applicationPayloadCount == 0)
              }

              @Test("delivered before cutoff stays pre-cut despite later actor execution clock")
              func preCutDeliveryUsesReceiptClock() async throws {
                  let clock = ReceiptClock(1_000)
                  let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
                  let token = try await authenticate(ledger, clock: clock)
                  let snapshot = await ledger.currentPreflightSnapshot()
                  let authenticatedAt = try #require(snapshot.authenticatedAtUptimeNanoseconds)
                  let deliveredAt = authenticatedAt
                      + TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds
                      - 1

                  try await maintainContinuity(
                      ledger,
                      token: token,
                      clock: clock,
                      from: clock.value,
                      through: deliveredAt - 1
                  )
                  clock.advance(to: deliveredAt)
                  let receipt = ledger.captureApplicationReceipt(for: token)

                  // Execution happens after the 60-second package deadline. Authority comes from
                  // the already-owned delivery receipt, not this later scheduler/actor clock.
                  clock.advance(to: authenticatedAt
                      + TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds
                      + 1)
                  try await ledger.recordApplicationUpdate(isNonEmpty: true, receipt: receipt, for: token)
                  let accepted = await ledger.currentPreflightSnapshot()
                  #expect(accepted.applicationPayloadCount == 1)
                  #expect(accepted.latestApplicationPayloadUptimeNanoseconds == deliveredAt)
              }

              @Test("receipt delivered at or after cutoff still fails closed")
              func postCutDeliveryCannotRescueIncompleteGeneration() async throws {
                  let clock = ReceiptClock(1_000)
                  let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
                  let token = try await authenticate(ledger, clock: clock)
                  let snapshot = await ledger.currentPreflightSnapshot()
                  let authenticatedAt = try #require(snapshot.authenticatedAtUptimeNanoseconds)
                  let deliveredAt = authenticatedAt
                      + TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds

                  try await maintainContinuity(
                      ledger,
                      token: token,
                      clock: clock,
                      from: clock.value,
                      through: deliveredAt - 1
                  )
                  clock.advance(to: deliveredAt)
                  let receipt = ledger.captureApplicationReceipt(for: token)
                  await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached) {
                      try await ledger.recordApplicationUpdate(isNonEmpty: true, receipt: receipt, for: token)
                  }
                  let failed = await ledger.currentPreflightSnapshot()
                  #expect(failed.applicationPayloadCount == 0)
                  await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.noActiveConnection) {
                      try await ledger.observeCurrentConnection(for: token)
                  }
              }

              private func authenticate(
                  _ ledger: TuyaAuthenticatedReadOnlySessionLedger,
                  clock: ReceiptClock
              ) async throws -> TuyaReadOnlyConnectionToken {
                  let token = try await ledger.beginConnection()
                  clock.advance(by: 10)
                  try await ledger.markAuthenticationStarted(for: token)
                  clock.advance(by: 10)
                  try await ledger.markAuthenticated(for: token, method: .smartLifeAppSDK)
                  return token
              }

              private func maintainContinuity(
                  _ ledger: TuyaAuthenticatedReadOnlySessionLedger,
                  token: TuyaReadOnlyConnectionToken,
                  clock: ReceiptClock,
                  from start: UInt64,
                  through end: UInt64
              ) async throws {
                  guard end > start else { return }
                  let step = TuyaAuthenticatedReadOnlySessionLedger.maximumContinuousObservationGapNanoseconds / 2
                  var next = start + step
                  while next <= end {
                      clock.advance(to: next)
                      try await ledger.observeCurrentConnection(for: token)
                      next += step
                  }
                  if clock.value < end {
                      clock.advance(to: end)
                      try await ledger.observeCurrentConnection(for: token)
                  }
              }
          }

          private final class ReceiptClock: @unchecked Sendable {
              private let lock = NSLock()
              private var stored: UInt64

              init(_ initial: UInt64) {
                  stored = initial
              }

              var value: UInt64 {
                  lock.lock()
                  defer { lock.unlock() }
                  return stored
              }

              var now: @Sendable () -> UInt64 {
                  { [self] in value }
              }

              func advance(to next: UInt64) {
                  lock.lock()
                  stored = next
                  lock.unlock()
              }

              func advance(by delta: UInt64) {
                  lock.lock()
                  stored += delta
                  lock.unlock()
              }
          }
          SWIFT

          rm "$WORKFLOW_PATH"

      - name: Verify final four-path product delta and authority shape
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only "$EXACT_PARENT" | LC_ALL=C sort > "$RUNNER_TEMP/final-actual"
          printf '%s\n' \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift \
            "$ORACLE_PATH" \
            "$RUNTIME_TEST_PATH" \
            | LC_ALL=C sort > "$RUNNER_TEMP/final-expected"
          diff -u "$RUNNER_TEMP/final-expected" "$RUNNER_TEMP/final-actual"

          grep -Fq 'public struct TuyaReadOnlyApplicationReceipt' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift
          grep -Fq 'nonisolated func captureApplicationReceipt' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift
          grep -Fq 'consumedApplicationDeliveryIDs.insert(receipt.deliveryID).inserted' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift
          ! grep -Fq 'captureApplicationReceipt(for token: TuyaReadOnlyConnectionToken, receivedAtUptimeNanoseconds:' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift

          grep -Fq 'admitApplicationUpdateCallback(update, token: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'applicationUpdateAdmissionsInFlight > 0' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'receipt: TuyaReadOnlyApplicationReceipt' NembraApp/App/NembraCaptureEntrypoint.swift
          test "$(grep -Fc 'captureApplicationReceipt(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift)" -eq 1

          ! grep -Fq 'publishDps' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq '.writeValue(' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Commit materialized repair and retire materializer
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'nembra-delivery-receipt-materializer'
          git config user.email 'nembra-delivery-receipt-materializer@users.noreply.github.com'
          git add \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift \
            "$ORACLE_PATH" \
            "$RUNTIME_TEST_PATH" \
            "$WORKFLOW_PATH"
          git commit -m 'capture: preserve SmartLife callback delivery chronology'
          git push origin "HEAD:$BRANCH"
