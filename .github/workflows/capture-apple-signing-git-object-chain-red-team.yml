name: Capture Apple Signing Git Object Chain Red Team

on:
  push:
    branches:
      - redteam/v14-apple-signing-git-object-chain-sol-20260812-go
    paths:
      - scripts/ci/tests/test_capture_apple_signing_git_object_chain_red_team.py
      - .github/workflows/capture-apple-signing-git-object-chain-red-team.yml
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_apple_signing_git_object_chain_red_team.py
      - .github/workflows/capture-apple-signing-git-object-chain-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-apple-signing-git-object-chain-red-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exploit-positive:
    name: Prove movable Git trust anchor (exploit-positive)
    runs-on: macos-15
    timeout-minutes: 5
    env:
      EXACT_PARENT: d8e91daca1f9baaf11273def197bf2a48573cf82
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/nembra-apple-signing-git-red-pycache
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation-only delta
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          printf '%s\n' \
            .github/workflows/capture-apple-signing-git-object-chain-red-team.yml \
            scripts/ci/tests/test_capture_apple_signing_git_object_chain_red_team.py \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exploit witness and parse attacked transport
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_apple_signing_git_object_chain_red_team.py
          /bin/bash -n scripts/field/run_apple_signing_context_preflight.command
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Reproduce corrupt accepted-commit alias against current transport contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -m unittest -v \
            scripts.ci.tests.test_capture_apple_signing_git_object_chain_red_team
          printf '%s\n' 'EXPLOIT_POSITIVE: caller-owned Git object graph can retarget root-materialized Apple-signing helpers while accepted HEAD name, clean status, and wrapper blob checks remain satisfied.'
          printf '%s\n' 'CLASSIFICATION: VALIDATION RED / private field preflight is blocked until helper identities are rooted in independently verified accepted commit/tree bytes.'
          printf '%s\n' 'PHYSICAL_AUTHORITY_CREATED=false'

      - name: Enforce validation-only truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e LocalSecrets
          test -z "$(git diff --name-only "$EXACT_PARENT"...HEAD | grep -Ev '^(\.github/workflows/capture-apple-signing-git-object-chain-red-team\.yml|scripts/ci/tests/test_capture_apple_signing_git_object_chain_red_team\.py)$' || true)"
          ! grep -Eq '(^|[[:space:]])xcodebuild([[:space:]]|$)' scripts/ci/tests/test_capture_apple_signing_git_object_chain_red_team.py
          ! grep -Eq 'devicectl|CoreBluetooth|bootstrap_capture_tuya_sdk|LocalSecrets' scripts/ci/tests/test_capture_apple_signing_git_object_chain_red_team.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
