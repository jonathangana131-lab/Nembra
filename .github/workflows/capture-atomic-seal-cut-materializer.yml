name: Capture atomic seal-cut materializer

on:
  push:
    branches:
      - repair/v161-capture-callback-authority-convergence-sol-20260814

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v161-capture-callback-authority-convergence-sol-20260814
          fetch-depth: 2
          persist-credentials: true
      - name: Atomically close receipt authority before seal-time sampling
        env:
          EXPECTED_PARENT: c6a5d829c69b347118fffe71ede72713a6ab0828
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -f scripts/ci/materialize_capture_atomic_seal_cut.py
          python3 scripts/ci/materialize_capture_atomic_seal_cut.py
          test ! -e scripts/ci/materialize_capture_atomic_seal_cut.py
          test ! -e .github/workflows/capture-atomic-seal-cut-materializer.yml
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Capture V16.1: atomically cut receipt authority before acceptance seal'
          git push origin HEAD:repair/v161-capture-callback-authority-convergence-sol-20260814
