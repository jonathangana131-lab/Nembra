# V17 product repair materializer for #3557's null-errno ACL baseline finding.
name: Capture native ACL null-errno production one-shot

on:
  push:
    branches:
      - repair/v17-capture-native-acl-null-errno-failclosed-gpt56sol-go
    paths:
      - .github/workflows/capture-native-acl-null-errno-production-one-shot.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact repair branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "repair/v17-capture-native-acl-null-errno-failclosed-gpt56sol-go"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Fail closed on unclassified native ACL acquisition
        shell: python
        run: |
          from pathlib import Path

          orchestrator = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          text = orchestrator.read_text()
          old = '''    baseline_errno = ctypes.get_errno()
    if baseline_errno not in (0, errno.ENOENT):
        raise SelectedXcodeBuildOrchestratorError(
            "could not capture descriptor-pinned private read-lease ACL baseline"
            f": errno {baseline_errno}"
        )
    ctypes.set_errno(0)
    empty = library.acl_init(0)
'''
          new = '''    baseline_errno = ctypes.get_errno()
    # Only the Darwin ENOENT result has been physically classified as an absent
    # extended ACL. A null return with errno 0 is not evidence of absence and
    # must never be promoted into an authoritative empty rollback baseline.
    if baseline_errno != errno.ENOENT:
        raise SelectedXcodeBuildOrchestratorError(
            "could not classify descriptor-pinned private read-lease ACL baseline"
            f": errno {baseline_errno}"
        )
    ctypes.set_errno(0)
    empty = library.acl_init(0)
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one native baseline classification anchor, found {text.count(old)}")
          orchestrator.write_text(text.replace(old, new, 1))

          test_path = Path("scripts/ci/tests/test_capture_private_read_lease_rollback.py")
          test_text = test_path.read_text()
          anchor = '''    def test_native_strict_revoke_restores_held_object_after_path_replacement(self) -> None:
'''
          addition = '''    def test_native_null_acl_without_enoent_fails_closed_before_empty_baseline(self) -> None:
        helper = load()
        library = mock.Mock()
        library.acl_get_fd.return_value = None
        library.acl_init.return_value = 0xC0FFEE
        library.acl_free.return_value = 0

        with (
            mock.patch.object(helper, "_darwin_acl_library", return_value=library),
            self.assertRaisesRegex(
                helper.SelectedXcodeBuildOrchestratorError,
                "could not classify descriptor-pinned private read-lease ACL baseline: errno 0",
            ),
        ):
            helper._capture_fd_acl_baseline(73)

        library.acl_get_fd.assert_called_once_with(73)
        library.acl_init.assert_not_called()
        library.acl_free.assert_not_called()

    def test_native_enoent_acl_acquisition_mints_empty_baseline(self) -> None:
        helper = load()
        library = mock.Mock()

        def absent_acl(descriptor: int):
            self.assertEqual(descriptor, 74)
            helper.ctypes.set_errno(helper.errno.ENOENT)
            return None

        library.acl_get_fd.side_effect = absent_acl
        library.acl_init.return_value = 0xC0FFEE
        library.acl_free.return_value = 0

        with mock.patch.object(helper, "_darwin_acl_library", return_value=library):
            baseline = helper._capture_fd_acl_baseline(74)

        self.assertEqual(baseline, 0xC0FFEE)
        library.acl_get_fd.assert_called_once_with(74)
        library.acl_init.assert_called_once_with(0)
        library.acl_free.assert_not_called()

'''
          if test_text.count(anchor) != 1:
              raise SystemExit(f"expected one native rollback test anchor, found {test_text.count(anchor)}")
          if "test_native_null_acl_without_enoent_fails_closed_before_empty_baseline" in test_text:
              raise SystemExit("null-errno production regression already present")
          test_path.write_text(test_text.replace(anchor, addition + anchor, 1))

      - name: Run permanent regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py
          python3 scripts/ci/tests/test_capture_private_read_lease_rollback.py

      - name: Enforce exact product delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py | sort)"
          test "$changed" = "$expected"
          ! grep -nE 'publishDps\(|writeValue\(|removeDevice|factoryReset' scripts/ci/capture_selected_xcode_build_orchestrator.py

      - name: Publish repair and retire one-shot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/capture-native-acl-null-errno-production-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py \
                  scripts/ci/tests/test_capture_private_read_lease_rollback.py \
                  .github/workflows/capture-native-acl-null-errno-production-one-shot.yml
          git diff --cached --check
          git commit -m "Capture: fail closed on null native ACL baseline"
          git push origin HEAD:repair/v17-capture-native-acl-null-errno-failclosed-gpt56sol-go
