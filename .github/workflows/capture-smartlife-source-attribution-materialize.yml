name: Capture SmartLife Source Attribution Materializer

on:
  push:
    branches:
      - capture/current-main-smartlife-source-attribution-gpt56sol-20260824
    paths:
      - .github/workflows/capture-smartlife-source-attribution-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: capture/current-main-smartlife-source-attribution-gpt56sol-20260824
          fetch-depth: 0

      - name: Bind exact parent and patch current-main runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'e8bdebe99ddfd8022b8e47265623df88e0853a04'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = path.read_text()

          def replace_once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:90]!r}')
              s = s.replace(old, new, 1)

          replace_once(
          '''        onApplicationUpdate: @escaping ([String: String]) -> Void,\n        success: @escaping () -> Void,''',
          '''        onApplicationUpdate: @escaping @MainActor ([String: String]) -> Void,\n        sourceAuthorityFailure: @escaping @MainActor () -> Void,\n        success: @escaping () -> Void,''')

          replace_once(
          '''                    onApplicationUpdate: { [weak self] update in\n                        Task { @MainActor in\n                            await self?.receivedApplicationUpdate(update, token: token)\n                        }\n                    },\n                    success: { [weak self] in''',
          '''                    onApplicationUpdate: { [weak self] update in\n                        Task { @MainActor in\n                            await self?.receivedApplicationUpdate(update, token: token)\n                        }\n                    },\n                    sourceAuthorityFailure: { [weak self] in\n                        guard let self,\n                              self.currentConnectionToken == token else { return }\n\n                        // SmartLifeDriver has already latched application forwarding closed.\n                        // Close acceptance synchronously before package retirement is scheduled so\n                        // a ready watchdog continuation cannot promote a mismatched callback.\n                        self.acceptanceCutIsClosed = true\n                        self.watchdog?.cancel()\n                        self.watchdog = nil\n                        self.phase = .failed\n                        self.message = "SmartLife application callback source no longer matched the selected scooter. The exact session is being retired; relaunch Capture before another attempt."\n\n                        Task { @MainActor [weak self] in\n                            await self?.invalidateSourceAuthority(\n                                token: token,\n                                message: "SmartLife application callback source no longer matched the selected scooter. The generation was retired without admitting that payload or claiming Bluetooth disconnected.",\n                                kind: "sdk_application_callback_source_mismatch"\n                            )\n                        }\n                    },\n                    success: { [weak self] in''')

          replace_once(
          '''private final class SmartLifeDriver: NSObject, OfficialTuyaDriver, ThingSmartDeviceDelegate {\n    private var device: ThingSmartDevice?\n    private var onApplicationUpdate: (([String: String]) -> Void)?''',
          '''private final class SmartLifeDriver: NSObject, OfficialTuyaDriver, ThingSmartDeviceDelegate {\n    private var device: ThingSmartDevice?\n    private var expectedDeviceID: String?\n    private var onApplicationUpdate: (@MainActor ([String: String]) -> Void)?\n    private var onSourceAuthorityFailure: (@MainActor () -> Void)?''')

          replace_once(
          '''        onApplicationUpdate: @escaping ([String: String]) -> Void,\n        success: @escaping () -> Void,\n        failure: @escaping () -> Void\n    ) {\n        guard OfficialTuyaFactory.bootstrap() else {\n            failure()\n            return\n        }\n        self.onApplicationUpdate = onApplicationUpdate''',
          '''        onApplicationUpdate: @escaping @MainActor ([String: String]) -> Void,\n        sourceAuthorityFailure: @escaping @MainActor () -> Void,\n        success: @escaping () -> Void,\n        failure: @escaping () -> Void\n    ) {\n        guard OfficialTuyaFactory.bootstrap() else {\n            failure()\n            return\n        }\n        expectedDeviceID = deviceID\n        self.onApplicationUpdate = onApplicationUpdate\n        onSourceAuthorityFailure = sourceAuthorityFailure''')

          replace_once(
          '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {\n        guard let dps, !dps.isEmpty else { return }''',
          '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {\n        guard let callbackDeviceID = device?.deviceModel.devId,\n              callbackDeviceID == expectedDeviceID else {\n            // Latch application forwarding closed at the SDK delegate boundary before notifying\n            // the controller. A later callback cannot slip into evidence while retirement awaits.\n            onApplicationUpdate = nil\n            onSourceAuthorityFailure?()\n            onSourceAuthorityFailure = nil\n            expectedDeviceID = nil\n            return\n        }\n        guard let dps, !dps.isEmpty else { return }''')

          path.write_text(s)
          PY

      - name: Add permanent source-attribution regression
        shell: bash
        run: |
          set -euo pipefail
          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSmartLifeApplicationSourceAttributionSourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("SmartLife application source attribution")
          struct TuyaSmartLifeApplicationSourceAttributionSourceTests {
              @Test("application evidence is bound to the exact selected device")
              func applicationEvidenceRequiresExactSelectedDeviceSource() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")

                  let protocolBody = String(try section(
                      in: source,
                      from: "private protocol OfficialTuyaDriver: AnyObject",
                      to: "private enum OfficialTuyaFactory"
                  ))
                  let connectCall = String(try section(
                      in: source,
                      from: "newDriver.connect(",
                      to: "            } catch {"
                  ))
                  let driverBody = String(try section(
                      in: source,
                      from: "private final class SmartLifeDriver: NSObject, OfficialTuyaDriver, ThingSmartDeviceDelegate",
                      to: "#endif"
                  ))
                  let callback = String(try section(
                      in: driverBody,
                      from: "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?)",
                      to: "    // Assign collision suffixes"
                  ))

                  #expect(protocolBody.contains("sourceAuthorityFailure: @escaping @MainActor () -> Void"))
                  #expect(connectCall.contains("sourceAuthorityFailure:"))
                  #expect(connectCall.contains("acceptanceCutIsClosed = true"))
                  #expect(connectCall.contains("watchdog?.cancel()"))
                  #expect(connectCall.contains("phase = .failed"))
                  #expect(connectCall.contains("invalidateSourceAuthority("))

                  #expect(driverBody.contains("private var expectedDeviceID: String?"))
                  #expect(driverBody.contains("private var onSourceAuthorityFailure: (@MainActor () -> Void)?"))
                  #expect(driverBody.contains("expectedDeviceID = deviceID"))
                  #expect(driverBody.contains("onSourceAuthorityFailure = sourceAuthorityFailure"))

                  let sourceGuard = try requiredRange(
                      "guard let callbackDeviceID = device?.deviceModel.devId",
                      in: callback
                  )
                  let identityFence = try requiredRange("callbackDeviceID == expectedDeviceID", in: callback)
                  let payloadGuard = try requiredRange("guard let dps, !dps.isEmpty else { return }", in: callback)
                  let forward = try requiredRange("onApplicationUpdate?(sanitized)", in: callback)

                  #expect(sourceGuard.lowerBound < identityFence.lowerBound)
                  #expect(identityFence.lowerBound < payloadGuard.lowerBound)
                  #expect(payloadGuard.lowerBound < forward.lowerBound)

                  let failureFence = String(callback[..<payloadGuard.lowerBound])
                  #expect(failureFence.contains("onApplicationUpdate = nil"))
                  #expect(failureFence.contains("onSourceAuthorityFailure?()"))
                  #expect(!callback.contains("publishDps"))
                  #expect(!callback.contains("writeValue"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw ContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func requiredRange(_ needle: String, in source: String) throws -> Range<String.Index> {
                  guard let range = source.range(of: needle) else {
                      Issue.record("Expected source contract missing: \(needle)")
                      throw ContractError.requiredContractMissing
                  }
                  return range
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum ContractError: Error {
                  case sectionMissing
                  case requiredContractMissing
              }
          }
          SWIFT

      - name: Focused package acceptance
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaSmartLifeApplicationSourceAttributionSourceTests
          ! grep -F 'publishDps' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -F 'writeValue(' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Publish clean product successor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/capture-smartlife-source-attribution-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSmartLifeApplicationSourceAttributionSourceTests.swift \
            .github/workflows/capture-smartlife-source-attribution-materialize.yml
          test "$(git diff --cached --name-only | LC_ALL=C sort | tr '\n' ' ')" = "NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSmartLifeApplicationSourceAttributionSourceTests.swift "
          git diff --cached --check
          git config user.name 'nembra-capture-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Capture: bind SmartLife callbacks to selected scooter'
          git push origin HEAD:capture/current-main-smartlife-source-attribution-gpt56sol-20260824
