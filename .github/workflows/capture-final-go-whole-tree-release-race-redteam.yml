name: Capture Final GO Whole Tree Release Race Red Team

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_es80_final_go_whole_tree_release_race_red_team.py
      - .github/workflows/capture-final-go-whole-tree-release-race-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-race:
    name: Release race (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact red-team child to whole-tree successor
        shell: bash
        env:
          PARENT: 9f1c04f5c0dedc046085d3aa1eac04c4dfec7fff
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "${PARENT}^{commit}"
          changed_paths="$(git diff --name-only "$PARENT"...HEAD | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/capture-final-go-whole-tree-release-race-redteam.yml' \
            'scripts/ci/tests/test_es80_final_go_whole_tree_release_race_red_team.py')"
          if [[ "$changed_paths" != "$expected_paths" ]]; then
            printf 'Release-race red team must remain exactly two-path. Changed:\n' >&2
            printf '%s\n' "$changed_paths" | sed 's/^/  /' >&2
            exit 20
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile release-race witness
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile \
            scripts/ci/tests/test_es80_final_go_whole_tree_release_race_red_team.py

      - name: Reproduce watcher teardown authority escape
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 \
            scripts/ci/tests/test_es80_final_go_whole_tree_release_race_red_team.py

      - name: Preserve expected-red interpretation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'Attacked production successor: 9f1c04f5c0dedc046085d3aa1eac04c4dfec7fff\n'
          printf 'This workflow is exploit-positive: SUCCESS means the attacked Final-GO successor is RED at watcher release.\n'
          printf 'A repair must keep mutation evidence authoritative through the instant custody is relinquished; do not weaken this witness.\n'
          printf 'No credentials, Xcode device operation, Bluetooth/Tuya action, install, launch, or physical experiment occurs.\n'
