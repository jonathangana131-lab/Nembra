name: V14 Capture XXXL Repair Self-Apply

on:
  push:
    branches:
      - repair/v14-capture-xxxl-viewport/gpt56-go

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch contains only temporary helpers over exact flagship head
        run: |
          set -euo pipefail
          base=019fa4b2d1446d91871b0736a543c12138a6a346
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/v14-capture-xxxl-repair-selfapply.yml' 'scripts/ci/v14_capture_xxxl_repair_selfapply.py' | sort)"
          test "$actual" = "$expected"

      - name: Apply presentation-only repair
        run: |
          set -euo pipefail
          python3 scripts/ci/v14_capture_xxxl_repair_selfapply.py
          git diff --check
          git diff -- NembraApp/Features/Research/ES80CaptureShellView.swift NembraApp/App/NembraApp.swift

      - name: Verify Accessibility XXXL gates are untouched
        run: |
          set -euo pipefail
          git diff --quiet 019fa4b2d1446d91871b0736a543c12138a6a346 -- NembraUITests/ES80ResearchCaptureUITests.swift
          grep -q 'UICTContentSizeCategoryAccessibilityXXXL' NembraUITests/ES80ResearchCaptureUITests.swift
          test "$(git diff --name-only 019fa4b2d1446d91871b0736a543c12138a6a346 -- NembraApp Packages NembraUITests | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraApp.swift' 'NembraApp/Features/Research/ES80CaptureShellView.swift' | sort)"

      - name: Remove temporary helpers and publish repaired head
        run: |
          set -euo pipefail
          git rm .github/workflows/v14-capture-xxxl-repair-selfapply.yml scripts/ci/v14_capture_xxxl_repair_selfapply.py
          git config user.name 'nembra-v14-closure'
          git config user.email 'nembra-v14-closure@users.noreply.github.com'
          git add NembraApp/App/NembraApp.swift NembraApp/Features/Research/ES80CaptureShellView.swift
          git diff --cached --check
          git commit -m '[Capture V14] Recompose Accessibility XXXL viewport'
          git push origin HEAD:repair/v14-capture-xxxl-viewport/gpt56-go
