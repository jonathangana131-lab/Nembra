name: Capture Explicit Correlation Confirmation Patch

on:
  push:
    branches:
      - integration/v14-capture-live-final-composed-sol
    paths:
      - .github/workflows/capture-explicit-correlation-confirmation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-live-final-composed-sol
          fetch-depth: 0

      - name: Apply and self-retire patch helper
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_explicit_confirmation_patch.py
          rm Scripts/apply_capture_explicit_confirmation_patch.py
          rm .github/workflows/capture-explicit-correlation-confirmation-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): require explicit correlated-target confirmation"
          git push origin HEAD:integration/v14-capture-live-final-composed-sol
