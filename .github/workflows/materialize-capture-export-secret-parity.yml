name: Materialize Capture Export Secret Parity

on:
  push:
    branches:
      - sol/v14-capture-export-secret-parity-66576-20260810

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-export-secret-parity-66576-20260810
          fetch-depth: 0

      - name: Guard exact current product parent
        run: |
          set -euo pipefail
          parent='66576b4eb449bbf158f431f546b34353fabab773'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --quiet "$parent" HEAD -- NembraApp/Features/Research/TuyaAccountBridge.swift
          git diff --quiet "$parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          git diff --quiet "$parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift

      - name: Apply promise-aligned classifier repair
        run: python3 scripts/ci/materialize_capture_export_secret_parity.py apply

      - name: Verify promise-aligned classifier repair
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_export_secret_parity.py verify
          python3 -m py_compile scripts/ci/materialize_capture_export_secret_parity.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse NembraApp/Features/Research/TuyaAccountBridge.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift
          git diff --check

      - name: Publish clean four-path product checkpoint
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-export-secret-parity.yml
          rm scripts/ci/materialize_capture_export_secret_parity.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): align secret classifiers with export promise'
          git push origin HEAD:sol/v14-capture-export-secret-parity-66576-20260810
