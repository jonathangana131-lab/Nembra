name: Agent bind field authorization to signed IPA

on:
  push:
    branches:
      - feature/es80-v14-field-authorization-bind-signed-ipa/gpt56-thinking-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/es80-v14-field-authorization-bind-signed-ipa/gpt56-thinking-go
          fetch-depth: 0

      - name: Validate transformer
        run: python3 -m py_compile .github/scripts/agent_bind_field_authorization_to_signed_ipa.py

      - name: Apply exact authorization transformation
        shell: bash
        run: |
          if ! output="$(python3 .github/scripts/agent_bind_field_authorization_to_signed_ipa.py 2>&1)"; then
            echo "::error title=Authorization patch anchor failure::$output"
            exit 1
          fi

      - name: Verify schema-v2 authority contract
        shell: bash
        run: |
          src=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothCaptureFieldAuthorization.swift
          tests=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothCaptureFieldAuthorizationTests.swift
          grep -F 'public static let envelopeSchemaVersion = 2' "$src"
          grep -F 'let signedFieldArtifactEvidenceBase64: String' "$src"
          grep -F 'let signedFieldArtifactEvidenceSHA256: String' "$src"
          grep -F 'PassiveBluetoothCaptureSignedFieldArtifactEvidenceJSON' "$src"
          grep -F 'signedFieldArtifactEvidenceBindingMismatch' "$src"
          grep -F 'signedGoCannotBeReboundToDifferentSignedIPAEvidenceBytes' "$tests"
          grep -F 'signedFieldEvidenceMustMatchAcceptedExternalAndRunningBuild' "$tests"
          grep -F '"schemaVersion": 2' "$tests"
          ! grep -F 'public static let envelopeSchemaVersion = 1' "$src"
          git diff --check
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -frontend -parse "$src"
            swiftc -frontend -parse "$tests"
          fi

      - name: Commit product delta and remove patch machinery
        shell: bash
        run: |
          rm .github/workflows/agent-bind-field-authorization-to-signed-ipa.yml
          rm .github/scripts/agent_bind_field_authorization_to_signed_ipa.py
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothCaptureFieldAuthorization.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothCaptureFieldAuthorizationTests.swift \
                  .github/workflows/agent-bind-field-authorization-to-signed-ipa.yml \
                  .github/scripts/agent_bind_field_authorization_to_signed_ipa.py
          git commit -m 'harden(capture): bind field GO to signed IPA evidence'
          git push origin HEAD:feature/es80-v14-field-authorization-bind-signed-ipa/gpt56-thinking-go
