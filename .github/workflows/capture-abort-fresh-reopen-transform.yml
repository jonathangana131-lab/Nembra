name: Capture abort fresh reopen transform

on:
  push:
    branches:
      - feature/capture-abort-fresh-reopen-v14-current

permissions:
  contents: write

env:
  METHOD_B64: 

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/capture-abort-fresh-reopen-v14-current
      - name: Apply guarded abort reopen patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2a36b6e35d55a9ad8d1d2cb001cea5ecf3a1a8f2"
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift")
          text = path.read_text()
          old = "        case freshRecorderIdentityMismatch\n        case terminalResolvedFrontierNotApplied(expected: UInt64, actual: UInt64)\n"
          new = "        case freshRecorderIdentityMismatch\n        case abortResolutionReceiptMismatch\n        case abortResolvedFrontierNotApplied(expected: UInt64, actual: UInt64)\n        case abortQueueChangedAfterResolution(expected: UInt64, actual: UInt64)\n        case terminalResolvedFrontierNotApplied(expected: UInt64, actual: UInt64)\n"
          if text.count(old) != 1:
              raise SystemExit("abort error insertion guard failed")
          text = text.replace(old, new, 1)

          marker = "    /// Reopens a successful terminal Horizon only after the controller has\n"
          if text.count(marker) != 1:
              raise SystemExit("abort reopen insertion guard failed")
          method = base64.b64decode(os.environ["METHOD_B64"]).decode()
          path.write_text(text.replace(marker, method + marker, 1))
          PY
          git diff --check
          grep -F 'reopenAfterAbortedFreshTargetSession' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          rm .github/workflows/capture-abort-fresh-reopen-transform.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[Capture abort v14] Reopen only from exact fresh recorder authority'
          git push origin HEAD:feature/capture-abort-fresh-reopen-v14-current
