name: Materialize current Capture Seal VoiceOver repair

on:
  push:
    branches:
      - fix/v14-capture-seal-step-voiceover-a5cb

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current regression parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c9da0f3e17976f1423e592d2cdf5725e29729394"
          test "$(git merge-base a5cb12ed97241ba274d23f311d67cf84623ceb29 HEAD)" = "a5cb12ed97241ba274d23f311d67cf84623ceb29"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-capture-seal-step-voiceover-a5cb.yml"

      - name: Align accepted visual and VoiceOver stage truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          old = '.accessibilityLabel("Step \\(index + 1), \\(label)\\(index == currentStageIndex ? \", current\" : index < currentStageIndex ? \", complete\" : \", upcoming\")")'
          new = '.accessibilityLabel("Step \\(index + 1), \\(label)\\(test.phase == .accepted || index < currentStageIndex ? \", complete\" : index == currentStageIndex ? \", current\" : \", upcoming\")")'
          if source.count(old) != 1:
              raise SystemExit(f"expected one stage accessibility label, found {source.count(old)}")
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Validate exact source contract
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureAcceptedStageRailAccessibilitySourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = source.index("private var stageRail: some View")
          end = source.index("private var primarySurface: some View", start)
          stage = source[start:end]
          line = next(x for x in stage.splitlines() if '.accessibilityLabel("Step' in x)
          assert "test.phase == .accepted" in line
          assert '", complete"' in line and '", current"' in line and '", upcoming"' in line
          # Preserve the exact-current accepted-event admission race closure while changing UI semantics only.
          assert "applicationUpdateAdmissionsInFlight" in source
          assert "acceptanceCutIsClosed" in source
          PY
          git diff --check

      - name: Publish clean effective checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-seal-step-voiceover-a5cb.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/materialize-capture-seal-step-voiceover-a5cb.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): align accepted Seal VoiceOver semantics'
          git push origin HEAD:fix/v14-capture-seal-step-voiceover-a5cb
