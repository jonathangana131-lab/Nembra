name: TEMP Capture Root AX Label Materialize

on:
  push:
    branches:
      - repair/v14-capture-root-two-file-closure-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-root-two-file-closure-sol-20260811
          fetch-depth: 1

      - name: Write compact AX labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = app.read_text(encoding="utf-8")
          text = text.replace(
              'isAccessibilityLayout ? "Physical lock" : "Physical capture locked"',
              'isAccessibilityLayout ? "Capture locked" : "Physical capture locked"'
          )
          text = text.replace(
              'Label("Engineering details", systemImage: "wrench.and.screwdriver")',
              'Label(isAccessibilityLayout ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")'
          )
          text = text.replace(
              'Label(isAccessibilityLayout ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")\n                .font(.subheadline.weight(.semibold))',
              'Label(isAccessibilityLayout ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")\n                .font(.subheadline.weight(.semibold))\n                .accessibilityLabel("Engineering details")'
          )
          app.write_text(text, encoding="utf-8")

          for raw in (
              "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureRootLargeTypeHierarchySourceTests.swift",
              "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureP0RootVisualAcceptanceTests.swift",
              "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift",
          ):
              path = Path(raw)
              source = path.read_text(encoding="utf-8")
              path.write_text(source.replace("Physical lock", "Capture locked"), encoding="utf-8")
          PY
          git diff --check

      - name: Commit product bytes and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-capture-root-ax-label-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureRootLargeTypeHierarchySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureP0RootVisualAcceptanceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          git diff --cached --check
          git config user.name "nembra-capture-bot"
          git config user.email "capture@nembra.invalid"
          git commit -m "Capture: polish AX action-first labels"
          git push origin HEAD:repair/v14-capture-root-two-file-closure-sol-20260811
