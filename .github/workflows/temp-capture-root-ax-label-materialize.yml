name: TEMP Capture Root AX Label Materialize

on:
  push:
    branches:
      - repair/v14-capture-root-two-file-closure-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-root-two-file-closure-sol-20260811
          fetch-depth: 1

      - name: Make AX labels unambiguous and compact
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("NembraApp/App/NembraCaptureEntrypoint.swift"),
              Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureRootLargeTypeHierarchySourceTests.swift"),
              Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureP0RootVisualAcceptanceTests.swift"),
              Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift"),
          ]
          total = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count("Physical lock")
              if count < 1:
                  raise SystemExit(f"{path}: Physical lock marker missing")
              total += count
              path.write_text(text.replace("Physical lock", "Capture locked"), encoding="utf-8")
          if total < 4:
              raise SystemExit(f"expected at least four Physical lock markers across app/contracts, found {total}")

          app = paths[0]
          text = app.read_text(encoding="utf-8")
          old = '''            Label("Engineering details", systemImage: "wrench.and.screwdriver")
                .font(.subheadline.weight(.semibold))'''
          new = '''            Label(isAccessibilityLayout ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")
                .font(.subheadline.weight(.semibold))
                .accessibilityLabel("Engineering details")'''
          if text.count(old) != 1:
              raise SystemExit("engineering disclosure label marker missing or ambiguous")
          app.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Commit exact AX repair and retire materializer
        run: |
          git rm .github/workflows/temp-capture-root-ax-label-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureRootLargeTypeHierarchySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureP0RootVisualAcceptanceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          git diff --cached --check
          git config user.name "nembra-capture-bot"
          git config user.email "capture@nembra.invalid"
          git commit -m "Capture: polish AX action-first labels"
          git push origin HEAD:repair/v14-capture-root-two-file-closure-sol-20260811
