name: Materialize current Capture visual evidence gate

on:
  push:
    branches:
      - validation/v14-capture-guided-visual-exact-head-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import reviewed exact-head standalone visual harness
        shell: bash
        run: |
          set -euo pipefail
          donor='3f1333c291b3266dc55d4e5ebd7fc864eb271b4e'
          git fetch origin agent/v14-capture-standalone-visual-exact-head
          test "$(git rev-parse FETCH_HEAD)" = "$donor"
          git checkout "$donor" -- \
            .github/workflows/capture-field-build-provenance.yml \
            scripts/ci/capture_standalone_visual_evidence.sh \
            scripts/ci/tests/test_capture_standalone_visual_evidence.py
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          python3 -m py_compile scripts/ci/tests/test_capture_standalone_visual_evidence.py
          python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py
      - name: Publish validation-only child
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-v14-capture-guided-visual.yml
          git diff --check
          git add -A
          git diff --cached --quiet && { echo 'No visual evidence delta'; exit 1; }
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(capture): capture exact guided standalone visuals'
          git push origin HEAD:validation/v14-capture-guided-visual-exact-head-sol
