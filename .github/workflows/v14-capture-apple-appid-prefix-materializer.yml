name: V14 Capture Apple App ID Prefix Materializer

on:
  push:
    branches:
      - agent/v14-capture-apple-appid-prefix-fix-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply exact-parent repair and validate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT="1b12dc56ec20a7dad30760b57a81106644ffc263"
          CURRENT_PARENT="$(git rev-parse HEAD^)"
          if [[ "$CURRENT_PARENT" != "$EXPECTED_PARENT" ]]; then
            echo "Materializer already consumed or branch moved; no-op."
            exit 0
          fi

          mapfile -t CUT_FILES < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          [[ "${#CUT_FILES[@]}" -eq 1 ]] || { printf 'unexpected cut files: %s\n' "${CUT_FILES[*]}"; exit 2; }
          [[ "${CUT_FILES[0]}" == ".github/workflows/v14-capture-apple-appid-prefix-materializer.yml" ]] || exit 2

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/field/install_one_time_capture.command")
          text = path.read_text()

          replacements = [
              (
                  'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"\n',
                  '',
              ),
              (
                  '[[ "$BUILT_APPLICATION_IDENTIFIER" == "$EXPECTED_APPLICATION_IDENTIFIER" ]] || \\\n    die "Final signed Capture app application-identifier does not match the selected team and Capture bundle identifier. Discard this candidate."',
                  '[[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]] || \\\n    die "Final signed Capture app application-identifier does not end in the exact Capture bundle identifier. Discard this candidate."\nBUILT_APP_ID_PREFIX="${BUILT_APPLICATION_IDENTIFIER%.$BUNDLE_ID}"\n[[ -n "$BUILT_APP_ID_PREFIX" && "$BUILT_APP_ID_PREFIX" != "*" && "$BUILT_APP_ID_PREFIX" != "$BUILT_APPLICATION_IDENTIFIER" ]] || \\\n    die "Final signed Capture app application-identifier has no acceptable concrete App ID prefix. Discard this candidate."',
              ),
              (
                  '    sys.stdout.write(application + "\\t" + entitlement_team)\n',
                  '    sys.stdout.write(application + "\\t" + entitlement_team + "\\t" + team_identifiers[0])\n',
              ),
              (
                  '[[ "$PROFILE_SIGNING_IDENTITY" == *$\'\\t\'* ]] || \\\n    die "Embedded provisioning profile is missing required Sign in with Apple or exact application/team identity custody. Discard this candidate."\nPROFILE_APPLICATION_IDENTIFIER="${PROFILE_SIGNING_IDENTITY%%$\'\\t\'*}"\nPROFILE_TEAM_IDENTIFIER="${PROFILE_SIGNING_IDENTITY#*$\'\\t\'}"\n[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$EXPECTED_APPLICATION_IDENTIFIER" ]] || \\\n    die "Embedded provisioning profile application identifier does not match the selected team and Capture bundle identifier. Discard this candidate."\n[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\\n    die "Embedded provisioning profile team identity does not match the selected Apple Development team. Discard this candidate."',
                  '[[ "$PROFILE_SIGNING_IDENTITY" == *$\'\\t\'*$\'\\t\'* ]] || \\\n    die "Embedded provisioning profile is missing required Sign in with Apple or exact application/team identity custody. Discard this candidate."\nPROFILE_APPLICATION_IDENTIFIER="${PROFILE_SIGNING_IDENTITY%%$\'\\t\'*}"\nPROFILE_IDENTITY_REMAINDER="${PROFILE_SIGNING_IDENTITY#*$\'\\t\'}"\nPROFILE_TEAM_IDENTIFIER="${PROFILE_IDENTITY_REMAINDER%%$\'\\t\'*}"\nPROFILE_ROOT_TEAM_IDENTIFIER="${PROFILE_IDENTITY_REMAINDER#*$\'\\t\'}"\n[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]] || \\\n    die "Embedded provisioning profile application identifier does not exactly match the final signed Capture app. Discard this candidate."\n[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\\n    die "Embedded provisioning profile team identity does not match the selected Apple Development team. Discard this candidate."\n[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\\n    die "Embedded provisioning profile root TeamIdentifier does not match the selected Apple Development team. Discard this candidate."',
              ),
              (
                  'unset SIGNED_ENTITLEMENTS_OUTPUT BUILT_SIGNING_IDENTITY BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER PROFILE_PLIST_XML PROFILE_SIGNING_IDENTITY PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER BUILT_PROFILE',
                  'unset SIGNED_ENTITLEMENTS_OUTPUT BUILT_SIGNING_IDENTITY BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER BUILT_APP_ID_PREFIX PROFILE_PLIST_XML PROFILE_SIGNING_IDENTITY PROFILE_APPLICATION_IDENTIFIER PROFILE_IDENTITY_REMAINDER PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER BUILT_PROFILE',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one installer anchor, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya signed Apple application identity custody source contract")
          struct TuyaSignedAppleAppIdentityCustodySourceTests {
              @Test("field installer proves the exact signed App ID and team before installation")
              func exactSignedApplicationIdentityIsProvenBeforeInstall() throws {
                  let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")

                  let required = [
                      "BUILT_APPLICATION_IDENTIFIER",
                      "BUILT_TEAM_IDENTIFIER",
                      "PROFILE_APPLICATION_IDENTIFIER",
                      "PROFILE_TEAM_IDENTIFIER",
                      "PROFILE_ROOT_TEAM_IDENTIFIER",
                      "application-identifier",
                      "com.apple.developer.team-identifier",
                      "TeamIdentifier",
                      "[[ \"$BUILT_APPLICATION_IDENTIFIER\" == *\".$BUNDLE_ID\" ]]",
                      "[[ \"$PROFILE_APPLICATION_IDENTIFIER\" == \"$BUILT_APPLICATION_IDENTIFIER\" ]]",
                      "[[ \"$BUILT_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]",
                      "[[ \"$PROFILE_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]",
                      "[[ \"$PROFILE_ROOT_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]"
                  ]
                  for needle in required {
                      #expect(installer.contains(needle), "missing signed Apple application-identity custody contract: \(needle)")
                  }

                  let installMarker = try #require(installer.range(of: "say \"Installing SDK-integrated Capture on the intended iPhone\""))
                  for check in [
                      "[[ \"$BUILT_APPLICATION_IDENTIFIER\" == *\".$BUNDLE_ID\" ]]",
                      "[[ \"$PROFILE_APPLICATION_IDENTIFIER\" == \"$BUILT_APPLICATION_IDENTIFIER\" ]]",
                      "[[ \"$BUILT_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]",
                      "[[ \"$PROFILE_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]",
                      "[[ \"$PROFILE_ROOT_TEAM_IDENTIFIER\" == \"$TEAM_ID\" ]]"
                  ] {
                      let range = try #require(installer.range(of: check))
                      #expect(range.lowerBound < installMarker.lowerBound, "signed Apple identity must be proven before installation: \(check)")
                  }

                  // Deliberately do not require the App ID prefix to equal TEAM_ID. Apple
                  // supports legacy/unique App ID prefixes; exact app/profile agreement and
                  // the separate team-identifier checks are the authority rendezvous.
                  #expect(!installer.contains("EXPECTED_APPLICATION_IDENTIFIER=\"${TEAM_ID}.${BUNDLE_ID}\""))
              }

              @Test("identity proof remains signing custody only")
              func identityProofCannotMintScooterAuthority() throws {
                  let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")
                  let start = try #require(installer.range(of: "BUILT_APPLICATION_IDENTIFIER"))
                  let end = try #require(installer.range(of: "say \"Installing SDK-integrated Capture on the intended iPhone\"", range: start.upperBound..<installer.endIndex))
                  let custody = installer[start.lowerBound..<end.lowerBound]

                  for forbidden in [
                      "connectBLE",
                      "publishDps",
                      "writeValue",
                      "scanForPeripherals",
                      "NEMBRA_SIMULATION_"
                  ] {
                      #expect(!custody.contains(forbidden), "signed Apple identity custody must not introduce BLE/protocol/physical authority: \(forbidden)")
                  }
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }
          }
          SWIFT

          bash -n scripts/field/install_one_time_capture.command
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          installer = Path("scripts/field/install_one_time_capture.command").read_text()
          required = [
              '[[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]]',
              '[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]]',
              '[[ "$BUILT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
          ]
          assert all(x in installer for x in required)
          assert 'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"' not in installer
          forbidden = ["connectBLE", "publishDps", "writeValue", "scanForPeripherals", "NEMBRA_SIMULATION_"]
          start = installer.index("BUILT_APPLICATION_IDENTIFIER")
          end = installer.index('say "Installing SDK-integrated Capture on the intended iPhone"', start)
          custody = installer[start:end]
          assert not any(x in custody for x in forbidden)
          PY

          git config user.name "Nembra V14 Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift
          git commit -m "fix(capture): preserve Apple App ID prefix custody"
          git push origin HEAD:agent/v14-capture-apple-appid-prefix-fix-sol
