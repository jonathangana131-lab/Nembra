name: Materialize Capture correlation progress truth r2

on:
  push:
    branches:
      - product/v14-capture-guided-progress-truth-r2-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current product ancestry
        shell: bash
        run: |
          set -euo pipefail
          base='5e96004ec565a5a19df8312f64985862a0443cdc'
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/materialize-v14-capture-correlation-progress-truth-r2.yml'

      - name: Apply reviewed chronology presentation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          old = 'Text("\\(min(test.correlationCompletedWindowCount + 1, 4))/4")'
          new = 'Text("\\(correlationDisplayedWindowOrdinal)/4")'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one stale visible ordinal, found {source.count(old)}')
          source = source.replace(old, new, 1)
          anchor = '    private var hero: some View {\n'
          helper = '    private var correlationDisplayedWindowOrdinal: Int {\n        test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)\n    }\n\n'
          if helper in source:
              raise SystemExit('correlation ordinal helper already present')
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one SecureLink hero anchor, found {source.count(anchor)}')
          path.write_text(source.replace(anchor, helper + anchor, 1), encoding='utf-8')
          PY

          regression='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift'
          test ! -e "$regression"
          git show '6508c5d8e2902589164d6cef34b30c5326c86599:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift' > "$regression"

          grep -Fq 'private var correlationDisplayedWindowOrdinal: Int {' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Text("\(correlationDisplayedWindowOrdinal)/4")' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'Text("\(min(test.correlationCompletedWindowCount + 1, 4))/4")' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'completed OFF1 ON1 OFF2 ON2 correlation presents four of four' "$regression"
          git diff --check

      - name: Publish clean product successor
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/materialize-v14-capture-correlation-progress-truth-r2.yml'
          rm "$workflow"
          git add -A
          expected="$(printf '%s\n' "$workflow" 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift' | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): keep correlated progress at four of four'
          git push origin HEAD:product/v14-capture-guided-progress-truth-r2-sol
