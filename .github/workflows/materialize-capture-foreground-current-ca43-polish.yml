name: Materialize Capture Foreground CA43 Polish

on:
  push:
    branches:
      - sol/v14-capture-foreground-current-ca43-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-foreground-current-ca43-sol
          fetch-depth: 0
      - name: Guard materialized foreground parent
        shell: bash
        run: |
          set -euo pipefail
          materialized='44446b6d42be285403a69db4f61260bf749db5de'
          product='ca43d7943027f04a1dfe4ab5f777c24a167ea96b'
          git merge-base --is-ancestor "$materialized" HEAD
          git diff --quiet "$materialized" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          git merge-base --is-ancestor "$product" HEAD
      - name: Apply startup and status polish
        run: python3 scripts/ci/materialize_capture_foreground_current_ca43_polish.py apply
      - name: Verify polished source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_foreground_current_ca43_polish.py verify
          python3 -m py_compile scripts/ci/materialize_capture_foreground_current_ca43_polish.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          git diff --check
      - name: Publish clean two-path result
        shell: bash
        run: |
          set -euo pipefail
          product='ca43d7943027f04a1dfe4ab5f777c24a167ea96b'
          rm .github/workflows/materialize-capture-foreground-current-ca43-polish.yml
          rm scripts/ci/materialize_capture_foreground_current_ca43_polish.py
          git add -A
          changed="$(git diff --name-only "$product" | sort)"
          expected="$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): harden foreground startup authority'
          git push origin HEAD:sol/v14-capture-foreground-current-ca43-sol
