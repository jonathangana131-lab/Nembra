name: Capture Experiment One strict post-admission ordering hardening

on:
  push:
    branches:
      - feature/capture-exp1-post-admission-rediscovery-v14

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/capture-exp1-post-admission-rediscovery-v14
          fetch-depth: 0
      - name: Make equality fail closed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          controller_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift')
          controller = controller_path.read_text()
          old = 'latestAdvertisement.receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds'
          new = 'latestAdvertisement.receivedAtUptimeNanoseconds > payload.issuedAtUptimeNanoseconds'
          assert controller.count(old) == 1
          controller_path.write_text(controller.replace(old, new, 1))

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift')
          tests = test_path.read_text()
          assert tests.count('receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds') == 1
          tests = tests.replace('receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds', 'receivedAtUptimeNanoseconds > payload.issuedAtUptimeNanoseconds', 1)
          tests = tests.replace('controller requires rediscovery after admission before installing its recorder', 'controller requires strictly post-admission rediscovery before installing its recorder', 1)
          test_path.write_text(tests)
          PY
          git diff --check
          rm .github/workflows/capture-exp1-strict-post-admission-order-v14.yml
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "nembra-go-worker"
          git config user.email "nembra-go-worker@users.noreply.github.com"
          git add -A
          git commit -m "[Capture Experiment One] Fail closed on equal handoff clock"
          git push origin HEAD:feature/capture-exp1-post-admission-rediscovery-v14
