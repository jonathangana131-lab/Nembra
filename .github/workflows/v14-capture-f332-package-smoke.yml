name: V14 Capture f332 Package Smoke

on:
  push:
    branches:
      - validation/v14-capture-f332-package-sol

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify source-equivalent flagship mirror
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin f33286e976eee89bbb92501eaad69ed493a328aa
          changed="$(git diff --name-only f33286e976eee89bbb92501eaad69ed493a328aa HEAD)"
          printf 'Changed versus f332 flagship:\n%s\n' "$changed"
          test "$changed" = ".github/workflows/v14-capture-f332-package-smoke.yml"
      - name: Full Capture package
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          swift test --package-path Packages/NembraBluetoothCapture
