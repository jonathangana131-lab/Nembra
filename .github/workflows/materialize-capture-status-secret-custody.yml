name: Materialize Capture Status Secret Custody

on:
  push:
    branches:
      - fix/v14-capture-status-secret-custody-e8-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-status-secret-custody-e8-sol
          fetch-depth: 0

      - name: Verify exact construction parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e8acd80c6f220529a98a4a4829514829c3321daa"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-capture-status-secret-custody.yml"

      - name: Apply fail-closed status custody repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bridge_path = Path("NembraApp/Features/Research/TuyaAccountBridge.swift")
          source = bridge_path.read_text(encoding="utf-8")

          old_export = '            "status": selectedDeviceStatus ?? [:],'
          new_export = '            "status": Self.redactSecrets(selectedDeviceStatus ?? [:]),'
          old_admission = '        selectedDeviceStatus = statusMap'
          new_admission = '        selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]'

          if source.count(old_export) != 1:
              raise SystemExit(f"expected exactly one raw status export path, found {source.count(old_export)}")
          if source.count(old_admission) != 1:
              raise SystemExit(f"expected exactly one raw status admission path, found {source.count(old_admission)}")
          if new_export in source or new_admission in source:
              raise SystemExit("repair appears partially pre-applied; refuse ambiguous materialization")

          source = source.replace(old_export, new_export, 1)
          source = source.replace(old_admission, new_admission, 1)
          bridge_path.write_text(source, encoding="utf-8")

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift")
          if test_path.exists():
              raise SystemExit("status secret custody regression already exists on construction parent")
          test_path.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya metadata status secret redaction source contract")
          struct TuyaMetadataStatusSecretRedactionSourceTests {
              @Test("raw status entries are redacted before retained UI state")
              func statusAdmissionCannotBypassRecursiveSecretRedaction() throws {
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let load = try section(
                      in: bridge,
                      from: "private func loadSelectedDeviceDetails",
                      to: "private func signedGET"
                  )
                  let body = String(load)

                  #expect(body.contains("selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]"))
                  #expect(!body.contains("selectedDeviceStatus = statusMap"))
              }

              @Test("export re-applies redaction to retained status as defense in depth")
              func exportCannotTrustRetainedStatusMapWithoutRedaction() throws {
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let export = try section(
                      in: bridge,
                      from: "func prepareRedactedExport()",
                      to: "func resetLink()"
                  )
                  let body = String(export)

                  #expect(body.contains("\"status\": Self.redactSecrets(selectedDeviceStatus ?? [:])"))
                  #expect(!body.contains("\"status\": selectedDeviceStatus ?? [:]"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          '''.replace("          ", ""), encoding="utf-8")

          repaired = bridge_path.read_text(encoding="utf-8")
          required = [
              new_admission,
              new_export,
              "guard devices.contains(where: { $0.id == device.id }) else",
              "deviceLoadTask?.cancel()",
          ]
          for needle in required:
              if needle not in repaired:
                  raise SystemExit(f"required current-product custody invariant missing after materialization: {needle}")
          for forbidden in (old_admission, old_export):
              if forbidden in repaired:
                  raise SystemExit(f"raw status custody path survived materialization: {forbidden}")
          print("status metadata secret custody materialization: PASS")
          PY

      - name: Verify effective delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            'NembraApp/Features/Research/TuyaAccountBridge.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift' | sort)"
          grep -F '"status": Self.redactSecrets(selectedDeviceStatus ?? [:]),' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -F 'selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -F 'guard devices.contains(where: { $0.id == device.id }) else' NembraApp/Features/Research/TuyaAccountBridge.swift

      - name: Publish clean repair branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-capture-status-secret-custody.yml
          git add NembraApp/Features/Research/TuyaAccountBridge.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fence Tuya status metadata secret custody"
          git push origin HEAD:fix/v14-capture-status-secret-custody-e8-sol
