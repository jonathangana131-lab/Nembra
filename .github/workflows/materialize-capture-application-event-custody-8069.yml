name: Materialize Capture application event custody

on:
  push:
    branches:
      - sol/v14-capture-application-event-custody-8069

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Verify exact product ancestry and bounded pre-materialization scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8069c0ffec496cacbe263016d8a7f4ca15ddc64e HEAD
          mapfile -t paths < <(git diff --name-only 8069c0ffec496cacbe263016d8a7f4ca15ddc64e..HEAD | sort)
          printf '%s\n' "${paths[@]}"
          test "$(printf '%s\n' "${paths[@]}")" = "$(printf '%s\n' \
            '.github/workflows/materialize-capture-application-event-custody-8069.yml' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationEventCustody.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyTests.swift' | sort)"

      - name: Bind current app admission to verified identity custody
        shell: python
        run: |
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()

          old_guard = "\n".join([
              "        guard sdkAccountLoggedIn,",
              "              sdkDeviceMembershipVerified,",
              "              accountIdentityLeaseIsAuthorized,",
              "              let driver else {",
          ])
          new_guard = "\n".join([
              "        guard sdkAccountLoggedIn,",
              "              sdkDeviceMembershipVerified,",
              "              accountIdentityLeaseIsAuthorized,",
              "              let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),",
              "              !verifiedAccountUID.isEmpty,",
              "              let driver else {",
          ])
          if source.count(old_guard) != 1:
              raise SystemExit(f'expected exactly one application admission authority guard, found {source.count(old_guard)}')
          source = source.replace(old_guard, new_guard)

          old_online = "\n".join([
              "        guard driver.isLocallyConnected(uuid: tuyaUUID) else {",
              "            await recordObservedTransportLoss(token: token)",
              "            return",
              "        }",
              "",
              "        applicationUpdateAdmissionsInFlight += 1",
          ])
          new_online = "\n".join([
              "        guard driver.isLocallyConnected(uuid: tuyaUUID) else {",
              "            await recordObservedTransportLoss(token: token)",
              "            return",
              "        }",
              "        guard let eventDetails = TuyaApplicationEventCustody.admittedDetails(",
              "            applicationUpdate: update,",
              "            verifiedAccountUID: verifiedAccountUID,",
              "            connectionGeneration: String(token.diagnosticGeneration)",
              "        ) else {",
              "            await invalidateSourceAuthority(",
              "                token: token,",
              "                message: \"Verified account identity custody was unavailable before application evidence could enter the accepted event log.\",",
              "                kind: \"application_event_custody_authority_unavailable\"",
              "            )",
              "            return",
              "        }",
              "",
              "        applicationUpdateAdmissionsInFlight += 1",
          ])
          if source.count(old_online) != 1:
              raise SystemExit(f'expected exactly one application online/admission boundary, found {source.count(old_online)}')
          source = source.replace(old_online, new_online)

          old_log = "\n".join([
              "            log(\"tuya_application_update\", update.merging([",
              "                \"generation\": String(token.diagnosticGeneration)",
              "            ]) { current, _ in current })",
          ])
          new_log = "            log(\"tuya_application_update\", eventDetails)"
          if source.count(old_log) != 1:
              raise SystemExit(f'expected exactly one untrusted generation merge, found {source.count(old_log)}')
          source = source.replace(old_log, new_log)

          duplicated = "\n".join([
              '        "accesstoken",',
              '        "refreshtoken",',
              '        "sessionkey",',
              '        "authkey",',
          ])
          deduplicated = "\n".join([
              '        "accesstoken",',
              '        "refreshtoken",',
              '        "authkey",',
          ])
          if source.count(duplicated) != 1:
              raise SystemExit(f'expected one duplicate sessionkey classifier slot, found {source.count(duplicated)}')
          source = source.replace(duplicated, deduplicated)

          path.write_text(source)

      - name: Validate package primitive app consumption and scope
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationEventCustody.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyTests.swift
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          python - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          start = source.index('private func receivedApplicationUpdate(')
          end = source.index('private func startWatchdog', start)
          admission = source[start:end]
          required = [
              'let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines)',
              'TuyaApplicationEventCustody.admittedDetails(',
              'verifiedAccountUID: verifiedAccountUID',
              'connectionGeneration: String(token.diagnosticGeneration)',
              'log("tuya_application_update", eventDetails)',
              'application_event_custody_authority_unavailable',
          ]
          missing = [item for item in required if item not in admission]
          if missing:
              raise SystemExit(f'missing current app custody anchors: {missing}')
          if 'update.merging([' in admission or '{ current, _ in current }' in admission:
              raise SystemExit('untrusted-first application event merge survived')
          driver_start = source.index('@MainActor\nprivate final class SmartLifeDriver')
          driver_end = source.index('#endif\n\nprivate enum AppleAccountAuthorizationError', driver_start)
          driver = source[driver_start:driver_end]
          if driver.count('"sessionkey",') != 1:
              raise SystemExit(f'sessionkey classifier count is {driver.count(chr(34)+"sessionkey,"+chr(34))}, expected 1')
          if '"uid",' in driver:
              raise SystemExit('generic uid must not become a blanket credential-key classifier')
          PY
          test "$(git diff --name-only | sort)" = "NembraApp/App/NembraCaptureEntrypoint.swift"
          git diff --check

      - name: Publish clean app composition and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-application-event-custody-8069.yml
          git config user.name "nembra-sol-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): bind application events to trusted custody"
          git push origin HEAD:sol/v14-capture-application-event-custody-8069
