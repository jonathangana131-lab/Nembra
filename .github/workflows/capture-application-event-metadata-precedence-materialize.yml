name: Capture application-event metadata precedence materializer

on:
  push:
    branches:
      - repair/v14-capture-application-event-metadata-precedence-870f-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current-product lineage and pre-mutation scope
        shell: bash
        run: |
          set -euo pipefail
          base=870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base"...HEAD | sort)
          expected=(
            ".github/workflows/capture-application-event-metadata-precedence-materialize.yml"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"
          git diff --quiet "$base"...HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Materialize trusted reserved-metadata precedence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()
          start = text.index("    private func receivedApplicationUpdate(")
          end = text.index("    private func startWatchdog", start)
          receiver = text[start:end]

          old = ") { current, _ in current })"
          new = ") { _, trusted in trusted })"
          if receiver.count(old) != 1:
              raise SystemExit(f"expected exactly one untrusted-precedence merge in receiver, found {receiver.count(old)}")
          receiver = receiver.replace(old, new, 1)
          text = text[:start] + receiver + text[end:]
          path.write_text(text)
          PY

      - name: Verify event provenance and no authority expansion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = source.index("    private func receivedApplicationUpdate(")
          end = source.index("    private func startWatchdog", start)
          receiver = source[start:end]

          required = [
              'log("tuya_application_update"',
              '"generation": String(token.diagnosticGeneration)',
              ') { _, trusted in trusted })',
              'try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)',
              'guard currentConnectionToken == token',
              'guard phase == .observing',
              'guard !acceptanceCutIsClosed',
          ]
          missing = [item for item in required if item not in receiver]
          if missing:
              raise SystemExit(f"application-event provenance contract missing: {missing}")
          if ") { current, _ in current })" in receiver:
              raise SystemExit("SDK application evidence can still win reserved metadata collisions")

          forbidden = ["queryDps", "publishDps", "publishDpsWithSuccess", "writeValue"]
          leaked = [item for item in forbidden if item in receiver]
          if leaked:
              raise SystemExit(f"provenance repair introduced forbidden protocol/control surface: {leaked}")

          # Existing secret-redaction custody must still protect the application payload
          # before it reaches this event boundary.
          driver_start = source.index("@MainActor\nprivate final class SmartLifeDriver")
          driver_end = source.index("#endif\n\nprivate enum AppleAccountAuthorizationError", driver_start)
          driver = source[driver_start:driver_end]
          for item in [
              "secretKeyFragments",
              "redactApplicationSecrets",
              "onApplicationUpdate?(sanitized)",
          ]:
              if item not in driver:
                  raise SystemExit(f"application secret custody regressed: {item}")
          PY
          git diff --check
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          fi

      - name: Retire one-shot materializer and checkpoint clean product repair
        shell: bash
        run: |
          set -euo pipefail
          base=870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81
          rm .github/workflows/capture-application-event-metadata-precedence-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            .github/workflows/capture-application-event-metadata-precedence-materialize.yml
          mapfile -t effective < <(git diff --cached --name-only "$base" | sort)
          expected=(
            "NembraApp/App/NembraCaptureEntrypoint.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${effective[*]}" = "${expected_sorted[*]}"
          git config user.name "nembra-v14-materializer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): protect application event provenance"
          git push origin HEAD:repair/v14-capture-application-event-metadata-precedence-870f-sol
