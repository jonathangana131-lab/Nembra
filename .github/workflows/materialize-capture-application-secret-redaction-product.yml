name: Materialize Capture application secret redaction product

on:
  push:
    branches:
      - fix/v14-capture-application-secret-redaction-product-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product ancestry and lane paths
        shell: bash
        run: |
          set -euo pipefail
          expected=bcea598c9a520064e1c4de9b47dcd0143685b3a1
          test "$(git merge-base "$expected" HEAD)" = "$expected"
          unexpected="$(git diff --name-only "$expected"...HEAD | grep -Ev '^(Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift|\.github/workflows/materialize-capture-application-secret-redaction-product.yml)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changed paths:"; echo "$unexpected"; exit 1; }

      - name: Materialize fail-closed authenticated application redaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          start_marker = "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {"
          callback_marker = "        onApplicationUpdate?(sanitized)"
          if source.count(start_marker) != 1:
              raise SystemExit(f"Expected exactly one SmartLifeDriver dpsUpdate start; found {source.count(start_marker)}")
          start = source.index(start_marker)
          callback = source.index(callback_marker, start)
          end = source.index("\n    }", callback) + len("\n    }")
          new = "\n".join([
              "    private static let secretKeyFragments = [",
              "        \"localkey\",",
              "        \"accesstoken\",",
              "        \"refreshtoken\",",
              "        \"authkey\",",
              "        \"seckey\"",
              "    ]",
              "",
              "    private static func isCredentialShapedKey(_ key: String) -> Bool {",
              "        let normalized = key.lowercased().filter { $0.isLetter || $0.isNumber }",
              "        return secretKeyFragments.contains { normalized.contains($0) }",
              "    }",
              "",
              "    private static func redactApplicationSecrets(_ object: Any) -> Any {",
              "        if let dictionary = object as? [AnyHashable: Any] {",
              "            var redacted: [AnyHashable: Any] = [:]",
              "            for (key, value) in dictionary {",
              "                let keyString = String(describing: key)",
              "                redacted[key] = isCredentialShapedKey(keyString)",
              "                    ? \"<redacted>\"",
              "                    : redactApplicationSecrets(value)",
              "            }",
              "            return redacted",
              "        }",
              "        if let array = object as? [Any] {",
              "            return array.map(redactApplicationSecrets)",
              "        }",
              "        return object",
              "    }",
              "",
              "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {",
              "        guard let dps, !dps.isEmpty else { return }",
              "        var sanitized: [String: String] = [:]",
              "        for (key, value) in dps {",
              "            let keyString = String(describing: key)",
              "            if Self.isCredentialShapedKey(keyString) {",
              "                sanitized[keyString] = \"<redacted>\"",
              "            } else {",
              "                sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))",
              "            }",
              "        }",
              "        onApplicationUpdate?(sanitized)",
              "    }",
          ])
          path.write_text(source[:start] + new + source[end:])
          PY

      - name: Run focused redaction contract
        shell: bash
        run: swift test --package-path Packages/NembraBluetoothCapture --filter TuyaApplicationUpdateSecretRedactionSourceTests

      - name: Commit product repair and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-application-secret-redaction-product.yml
          git config user.name "nembra-sol-worker"
          git config user.email "nembra-sol-worker@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift .github/workflows/materialize-capture-application-secret-redaction-product.yml
          git diff --cached --check
          git commit -m "fix(capture): redact authenticated application secrets"
          git push origin HEAD:fix/v14-capture-application-secret-redaction-product-sol
