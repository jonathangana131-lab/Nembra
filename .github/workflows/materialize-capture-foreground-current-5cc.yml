name: Materialize Current Capture Foreground Integrity 5cc

on:
  push:
    branches: [agent/capture-foreground-current-5cc]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-foreground-current-5cc
          fetch-depth: 0
      - name: Reanchor reviewed foreground repair exactly
        shell: bash
        run: |
          set -euo pipefail
          parent='5cc35df3a5bd2b550b5bc89b43f4dd72b2e0ca32'
          reviewed='2a4efe496beae7697be4dcccde5fac0b5da6e755'
          test "$(git rev-parse HEAD^)" = "$parent"
          test "$(git diff --name-only "$parent"...HEAD)" = '.github/workflows/materialize-capture-foreground-current-5cc.yml'

          # Product movement since reviewed parent 3f269... is package-only; the app blob is identical.
          test "$(git rev-parse "$parent":NembraApp/App/NembraCaptureEntrypoint.swift)" = "$(git rev-parse 3f26906d68c6d886fa5c19a3349f7c538e5392a6:NembraApp/App/NembraCaptureEntrypoint.swift)"
          git checkout "$reviewed" -- \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift

          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          a=s.index('func appDidLoseForeground()'); b=s.index('var privateConfig: Bool',a); fg=s[a:b]
          required=[
            'guard !foregroundIntegrityLossHandled else { return }',
            'acceptsViewScopedMembershipRequests = false',
            'sdkDeviceMembershipVerified = false',
            'membershipAccountUID = nil',
            'membershipDeviceID = nil',
            'membershipRequestID = UUID()',
            'officialConnectionRequestID = UUID()',
            'abandonPackageCorrelation()',
            'invalidateObservationContinuity(',
            'invalidateInternalLifecycle(',
            'Task { @MainActor [self] in',
          ]
          for q in required:
              if q not in fg: raise SystemExit('missing foreground invariant: '+q)
          if not (fg.index('acceptsViewScopedMembershipRequests = false') < fg.index('sdkDeviceMembershipVerified = false') < fg.index('membershipRequestID = UUID()') < fg.index('officialConnectionRequestID = UUID()') < fg.index('if processCorrelationLease')):
              raise SystemExit('foreground authority revocation ordering failed')
          for q in ['releasePackageCorrelationLease()','recordObservedTransportLoss','endConnection','disconnectBLE']:
              if q in fg: raise SystemExit('foreground loss manufactured transport semantic: '+q)
          exit=s[s.index('func abandonCorrelationForViewExit()'):s.index('func appDidLoseForeground()')]
          if 'foregroundIntegrityLossHandled = true' not in exit: raise SystemExit('view exit does not suppress scene double-terminal')
          if 'Task { @MainActor [self] in' not in exit: raise SystemExit('strong view-exit terminal lifetime regressed')
          for q in ['@Environment(\\.scenePhase) private var scenePhase','if scenePhase == .active','.onChange(of: scenePhase)','if newPhase == .active']:
              if q not in s: raise SystemExit('missing scene boundary: '+q)
          print('exact-current foreground source contract: PASS')
          PY

          git diff --check
          rm .github/workflows/materialize-capture-foreground-current-5cc.yml
          git config user.name nembra-v14-bot
          git config user.email nembra-v14-bot@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift .github/workflows/materialize-capture-foreground-current-5cc.yml
          git diff --cached --check
          git commit -m 'fix(capture): bind evidence authority to foreground'
          git push origin HEAD:agent/capture-foreground-current-5cc
