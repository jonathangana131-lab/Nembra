name: Capture truth custody materializer

on:
  push:
    branches:
      - agent/v14-capture-truth-custody-convergence-sol
    paths:
      - .github/workflows/capture-truth-custody-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-truth-custody-convergence-sol
          fetch-depth: 0

      - name: Bind expected parent lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1c40853f6991b4d09206df1d25ecff021458b7eb HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply converged Capture truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          def section_bounds(text: str, start: str, end: str):
              a = text.index(start)
              b = text.index(end, a)
              return a, b

          def insert_after_once_in_section(text: str, start: str, end: str, needle: str, insertion: str) -> str:
              a, b = section_bounds(text, start, end)
              section = text[a:b]
              if section.count(needle) != 1:
                  raise RuntimeError(f"{start.strip()}: expected exactly one {needle.strip()!r}, found {section.count(needle)}")
              section = section.replace(needle, needle + insertion, 1)
              return text[:a] + section + text[b:]

          source = insert_after_once_in_section(
              source,
              "    func abandonCorrelationForViewExit() {",
              "    func appDidLoseForeground() {",
              "        sdkDeviceMembershipVerified = false\n",
              "        membershipStatus = \"Secure Link changed. Exact scooter membership must be verified again for this view before Bluetooth discovery.\"\n",
          )
          source = insert_after_once_in_section(
              source,
              "    func appDidLoseForeground() {",
              "    var privateConfig: Bool",
              "        sdkDeviceMembershipVerified = false\n",
              "        membershipStatus = \"Capture left the foreground. Exact scooter membership must be verified again before a new authenticated attempt.\"\n",
          )

          receiver_marker = "    private func receivedApplicationUpdate(\n"
          if source.count(receiver_marker) != 1:
              raise RuntimeError("receivedApplicationUpdate marker changed")
          helper = '''    private func preparedApplicationEventDetails(
              _ update: [String: String],
              verifiedAccountUID: String
          ) -> [String: String] {
              let accountUID = verifiedAccountUID.trimmingCharacters(in: .whitespacesAndNewlines)
              guard !accountUID.isEmpty else { return [:] }

              let redactionMarker = "<redacted-account-uid>"
              var details: [String: String] = [:]
              for key in update.keys.sorted() {
                  guard let value = update[key] else { continue }
                  let redactedKey = key.replacingOccurrences(
                      of: accountUID,
                      with: redactionMarker,
                      options: [.caseInsensitive, .literal]
                  )
                  let redactedValue = value.replacingOccurrences(
                      of: accountUID,
                      with: redactionMarker,
                      options: [.caseInsensitive, .literal]
                  )
                  let baseKey = redactedKey == "generation" ? "application.generation" : redactedKey
                  var uniqueKey = baseKey
                  var collisionIndex = 2
                  while details[uniqueKey] != nil {
                      uniqueKey = "\\(baseKey)#\\(collisionIndex)"
                      collisionIndex += 1
                  }
                  details[uniqueKey] = redactedValue
              }
              return details
          }

          '''
          source = source.replace(receiver_marker, helper + receiver_marker, 1)

          receiver_start, receiver_end = section_bounds(
              source,
              "    private func receivedApplicationUpdate(",
              "    private func startWatchdog",
          )
          receiver = source[receiver_start:receiver_end]

          admissions = "        applicationUpdateAdmissionsInFlight += 1\n"
          if receiver.count(admissions) != 1:
              raise RuntimeError("application admission counter shape changed")
          uid_guard = '''        guard let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),
                !verifiedAccountUID.isEmpty else {
              await invalidateSourceAuthority(
                  token: token,
                  message: "The verified Tuya account UID lease became unavailable before application evidence custody.",
                  kind: "sdk_account_uid_lease_missing_during_observation"
              )
              return
          }

          '''
          receiver = receiver.replace(admissions, uid_guard + admissions, 1)

          refresh = "            await refreshLedgerSnapshot()\n"
          if receiver.count(refresh) != 1:
              raise RuntimeError(f"expected one receiver ledger refresh, found {receiver.count(refresh)}")
          custody = '''            guard sdkAccountLoggedIn,
                    sdkDeviceMembershipVerified,
                    accountIdentityLeaseIsAuthorized,
                    membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines) == verifiedAccountUID else {
                  await invalidateSourceAuthority(
                      token: token,
                      message: "SDK account/device source authority changed before application evidence could enter immutable event custody.",
                      kind: "sdk_source_authority_changed_before_application_event_custody"
                  )
                  return
              }
              let eventDetails = preparedApplicationEventDetails(
                  update,
                  verifiedAccountUID: verifiedAccountUID
              )
          '''
          receiver = receiver.replace(refresh, refresh + custody, 1)

          old_log = '''            log("tuya_application_update", update.merging([
                  "generation": String(token.diagnosticGeneration)
              ]) { current, _ in current })'''
          new_log = '''            log("tuya_application_update", eventDetails.merging([
                  "generation": String(token.diagnosticGeneration)
              ]) { _, trusted in trusted })'''
          if receiver.count(old_log) != 1:
              raise RuntimeError(f"application event merge shape changed; matches={receiver.count(old_log)}")
          receiver = receiver.replace(old_log, new_log, 1)
          source = source[:receiver_start] + receiver + source[receiver_end:]

          trailing_duplicate = '        "refreshtoken",\n        "sessionkey",\n        "authkey",\n'
          if source.count(trailing_duplicate) != 1:
              raise RuntimeError("expected duplicate sessionkey classifier immediately after refreshtoken")
          source = source.replace(
              trailing_duplicate,
              '        "refreshtoken",\n        "authkey",\n',
              1,
          )

          path.write_text(source)
          PY

      - name: Verify converged source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()

          view = s[s.index("    func abandonCorrelationForViewExit() {"):s.index("    func appDidLoseForeground() {")]
          assert view.index("sdkDeviceMembershipVerified = false") < view.index("membershipStatus =") < view.index("membershipRequestID = UUID()")
          assert "membership verified and leased" not in view.lower()

          foreground = s[s.index("    func appDidLoseForeground() {"):s.index("    var privateConfig: Bool")]
          assert foreground.index("sdkDeviceMembershipVerified = false") < foreground.index("membershipStatus =") < foreground.index("membershipRequestID = UUID()")
          assert "verified again" in foreground.lower()

          receiver = s[s.index("    private func receivedApplicationUpdate("):s.index("    private func startWatchdog")]
          assert '<redacted-account-uid>' in s
          assert 'log("tuya_application_update", update.merging([' not in receiver
          assert ') { current, _ in current })' not in receiver
          assert ') { _, trusted in trusted })' in receiver
          assert 'verifiedAccountUID: verifiedAccountUID' in receiver
          assert 'sdk_source_authority_changed_before_application_event_custody' in receiver
          assert '"application.generation"' in s
          assert s.count('        "sessionkey",') == 1
          PY
          git diff --check

      - name: Commit product repair and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-truth-custody-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/capture-truth-custody-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): converge truth custody blockers"
          git push origin HEAD:agent/v14-capture-truth-custody-convergence-sol
