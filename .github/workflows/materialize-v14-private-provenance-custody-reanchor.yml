name: Materialize V14 Private Provenance Custody Reanchor

on:
  push:
    branches:
      - sol/v14-capture-private-provenance-custody-58f

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "58fbbc6221fc3fc3fac3854e028c5fc471e98d90"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-v14-private-provenance-custody-reanchor.yml"

      - name: Apply reviewed two-file donor delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 38c69bcf6660f42468c954a9196f35d3bdff2680 fffd6b3ab753d0502ddfa39ad4925eaa2461aef8
          git diff --binary 38c69bcf6660f42468c954a9196f35d3bdff2680..fffd6b3ab753d0502ddfa39ad4925eaa2461aef8 -- \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_provenance.py | git apply --index

          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' 'Scripts/capture_tuya_private_input_provenance.py' 'scripts/ci/tests/test_capture_tuya_private_input_provenance.py' | sort)"
          test "$(git hash-object Scripts/capture_tuya_private_input_provenance.py)" = "$(git rev-parse fffd6b3ab753d0502ddfa39ad4925eaa2461aef8:Scripts/capture_tuya_private_input_provenance.py)"
          test "$(git hash-object scripts/ci/tests/test_capture_tuya_private_input_provenance.py)" = "$(git rev-parse fffd6b3ab753d0502ddfa39ad4925eaa2461aef8:scripts/ci/tests/test_capture_tuya_private_input_provenance.py)"

      - name: Commit clean exact-product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-v14-private-provenance-custody-reanchor.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(capture): bind private provenance to stable custody"
          git push origin HEAD:sol/v14-capture-private-provenance-custody-58f
