name: TEMP V14 Field Direct Test Copy (Sol)

on:
  push:
    branches:
      - repair/v14-capture-field-direct-test-current-2849-sol
    paths:
      - .github/workflows/tmp-v14-field-direct-test-copy-sol.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-field-direct-test-current-2849-sol
          fetch-depth: 0
      - name: Build validated replacement blob copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/capture-field-build-provenance.yml')
          text = source.read_text(encoding='utf-8')
          old = '          /usr/bin/python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract'
          new = '          /usr/bin/python3 scripts/ci/tests/test_capture_field_accepted_source_path_contract.py'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale module invocation; found {text.count(old)}')
          text = text.replace(old, new, 1)
          if old in text or text.count(new) != 1:
              raise SystemExit('direct-file invocation replacement did not converge exactly once')
          out = Path('.nembra-tmp-field-provenance-fixed.yml')
          out.write_text(text, encoding='utf-8')
          PY
          grep -Fxq '          /usr/bin/python3 scripts/ci/tests/test_capture_field_accepted_source_path_contract.py' .nembra-tmp-field-provenance-fixed.yml
          if grep -Fq '/usr/bin/python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract' .nembra-tmp-field-provenance-fixed.yml; then
            echo 'stale module invocation remains' >&2
            exit 1
          fi
          git diff --no-index --check .github/workflows/capture-field-build-provenance.yml .nembra-tmp-field-provenance-fixed.yml || test "$?" = 1
      - name: Publish non-workflow replacement blob copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .nembra-tmp-field-provenance-fixed.yml
          git diff --cached --check
          test "$(git diff --cached --name-only)" = '.nembra-tmp-field-provenance-fixed.yml'
          git commit -m 'Capture: stage fixed Field provenance workflow blob'
          git push origin HEAD:repair/v14-capture-field-direct-test-current-2849-sol