name: Materialize Capture Official-Auth View-Exit Retirement

on:
  push:
    branches: [agent/capture-view-exit-official-auth-retirement]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-view-exit-official-auth-retirement
          fetch-depth: 0
      - name: Apply exact-head hidden-auth retirement
        shell: bash
        run: |
          set -euo pipefail
          parent='a267d0b6d16c1fee881dd23bc2ca5abc15baf9fe'
          test "$(git rev-parse HEAD^)" = "$parent"
          python3 - <<'PY'
          from pathlib import Path

          p=Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s=p.read_text()

          anchor='''#endif\n    private var membershipRequestID = UUID()\n\n    init(device: TuyaAccountBridge.LinkedDevice) {\n'''
          repl='''#endif\n    private var membershipRequestID = UUID()\n    private var officialConnectionRequestID = UUID()\n\n    init(device: TuyaAccountBridge.LinkedDevice) {\n'''
          if s.count(anchor)!=1: raise SystemExit('request-id property anchor drifted')
          s=s.replace(anchor,repl,1)

          old='''    func abandonCorrelationForViewExit() {\n        // Revoke an in-flight membership request before checking scanner ownership. A late\n        // authorized callback must never begin OFF1 after Secure Link has left the screen.\n        membershipRequestID = UUID()\n        membershipBusy = false\n#if canImport(ThingSmartHomeKit)\n        membershipProbe = nil\n#endif\n\n        guard processCorrelationLease != nil || correlationSession != nil else { return }\n        // Existing helper stops package transport before releasing this controller's lease.\n        abandonPackageCorrelation()\n        phase = .failed\n        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."\n        log("target_correlation_abandoned_on_view_exit")\n    }\n'''
          new='''    func abandonCorrelationForViewExit() {\n        // Revoke every pre-radio asynchronous grant before inspecting current transport state.\n        // Late membership or ledger-generation work must not start OFF1/authentication off-screen.\n        membershipRequestID = UUID()\n        membershipBusy = false\n#if canImport(ThingSmartHomeKit)\n        membershipProbe = nil\n#endif\n        officialConnectionRequestID = UUID()\n        watchdog?.cancel()\n        watchdog = nil\n\n        if let token = currentConnectionToken {\n            phase = .failed\n            message = "Authenticated observation stopped because Capture left Secure Link. Relaunch before another authenticated attempt; no BLE disconnect is claimed."\n            log("authenticated_session_abandoned_on_view_exit", ["generation": String(token.diagnosticGeneration)])\n            Task { @MainActor [weak self] in\n                guard let self else { return }\n                await self.invalidateInternalLifecycle(\n                    token: token,\n                    message: "Authenticated observation stopped because Capture left Secure Link. Relaunch before another authenticated attempt; no BLE disconnect is claimed.",\n                    kind: "authenticated_session_abandoned_on_view_exit"\n                )\n            }\n            return\n        }\n\n        if phase == .authenticating {\n            // Driver handoff happened, but no package generation exists yet. The request-id fence\n            // below forces the pending ledger task to retire its generation before SDK connect.\n            localBLESettlementToken = nil\n            sdkLocalBLEOnline = false\n            driver = nil\n            phase = .failed\n            message = "Authentication start stopped because Capture left Secure Link. Relaunch before another authenticated attempt; no BLE disconnect is claimed."\n            log("authentication_start_abandoned_on_view_exit")\n            return\n        }\n\n        guard processCorrelationLease != nil || correlationSession != nil else { return }\n        // Existing helper stops package transport before releasing this controller's lease.\n        abandonPackageCorrelation()\n        phase = .failed\n        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."\n        log("target_correlation_abandoned_on_view_exit")\n    }\n'''
          if s.count(old)!=1: raise SystemExit('current view-exit cleanup anchor drifted')
          s=s.replace(old,new,1)

          anchor='''        guard let newDriver = OfficialTuyaFactory.make() else {\n            failLocally("Official Tuya provider is unavailable.", "sdk_provider_unavailable")\n            return\n        }\n\n        driver = newDriver\n'''
          repl='''        guard let newDriver = OfficialTuyaFactory.make() else {\n            failLocally("Official Tuya provider is unavailable.", "sdk_provider_unavailable")\n            return\n        }\n\n        let connectionRequestID = UUID()\n        officialConnectionRequestID = connectionRequestID\n        driver = newDriver\n'''
          if s.count(anchor)!=1: raise SystemExit('official connection request anchor drifted')
          s=s.replace(anchor,repl,1)

          anchor='''                // Own the package generation before any later mutation can fail. Otherwise an\n                // auth-start clock regression could strand callback authority in the ledger.\n                self.currentConnectionToken = token\n                do {\n'''
          repl='''                // Own the package generation before any later mutation can fail. Otherwise an\n                // auth-start clock regression could strand callback authority in the ledger.\n                self.currentConnectionToken = token\n                guard self.officialConnectionRequestID == connectionRequestID,\n                      self.phase == .authenticating else {\n                    await self.invalidateInternalLifecycle(\n                        token: token,\n                        message: "Authentication generation was retired because Secure Link left before SDK connection could start. No BLE disconnect is claimed.",\n                        kind: "authentication_generation_abandoned_before_sdk_connect"\n                    )\n                    return\n                }\n                do {\n'''
          if s.count(anchor)!=1: raise SystemExit('post-beginConnection fence anchor drifted')
          s=s.replace(anchor,repl,1)

          anchor='''                await self.refreshLedgerSnapshot()\n                self.log("official_connect_requested", [\n'''
          repl='''                await self.refreshLedgerSnapshot()\n                guard self.officialConnectionRequestID == connectionRequestID,\n                      self.currentConnectionToken == token,\n                      self.phase == .authenticating else {\n                    await self.invalidateInternalLifecycle(\n                        token: token,\n                        message: "Authentication generation was retired because Secure Link left before SDK connection could start. No BLE disconnect is claimed.",\n                        kind: "authentication_generation_abandoned_before_sdk_connect"\n                    )\n                    return\n                }\n                self.log("official_connect_requested", [\n'''
          if s.count(anchor)!=1: raise SystemExit('pre-SDK-connect fence anchor drifted')
          s=s.replace(anchor,repl,1)
          p.write_text(s)

          tp=Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift')
          t=tp.read_text()
          marker='''    @Test("cleanup reuses transport-first package abandonment path")\n'''
          addition='''    @Test("view exit revokes pending official authentication and terminally retires active generation")\n    func viewExitRevokesOfficialAuthenticationAuthority() throws {\n        let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")\n        let controller = String(try section(\n            in: source,\n            from: "private final class SecureLinkController",\n            to: "@MainActor\\nprivate protocol OfficialTuyaDriver"\n        ))\n        let cleanup = String(try section(\n            in: controller,\n            from: "func abandonCorrelationForViewExit()",\n            to: "var privateConfig: Bool"\n        ))\n        #expect(controller.contains("private var officialConnectionRequestID = UUID()"))\n        #expect(cleanup.contains("officialConnectionRequestID = UUID()"))\n        #expect(cleanup.contains("watchdog?.cancel()"))\n        #expect(cleanup.contains("if let token = currentConnectionToken"))\n        #expect(cleanup.contains("invalidateInternalLifecycle("))\n        #expect(cleanup.contains("if phase == .authenticating"))\n        #expect(cleanup.contains("authentication_start_abandoned_on_view_exit"))\n        #expect(!cleanup.contains("disconnectBLE"))\n\n        let begin = String(try section(\n            in: controller,\n            from: "private func beginOfficialConnection(candidate: Candidate)",\n            to: "private func authenticated(token: TuyaReadOnlyConnectionToken)"\n        ))\n        #expect(begin.contains("let connectionRequestID = UUID()"))\n        #expect(begin.contains("officialConnectionRequestID = connectionRequestID"))\n        #expect(begin.components(separatedBy: "self.officialConnectionRequestID == connectionRequestID").count - 1 == 2)\n        let finalFence = try requiredLine(containing: "self.currentConnectionToken == token", in: begin)\n        let sdkConnect = try requiredLine(containing: "newDriver.connect(", in: begin)\n        #expect(finalFence < sdkConnect)\n    }\n\n'''
          if t.count(marker)!=1: raise SystemExit('test insertion anchor drifted')
          tp.write_text(t.replace(marker,addition+marker,1))
          PY

          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          a=s.index('func abandonCorrelationForViewExit()'); b=s.index('var privateConfig: Bool',a); cleanup=s[a:b]
          assert cleanup.index('officialConnectionRequestID = UUID()') < cleanup.index('if let token = currentConnectionToken')
          assert 'invalidateInternalLifecycle(' in cleanup
          assert 'disconnectBLE' not in cleanup
          begin=s[s.index('private func beginOfficialConnection(candidate: Candidate)'):s.index('private func authenticated(token:', s.index('private func beginOfficialConnection(candidate: Candidate)'))]
          assert begin.count('self.officialConnectionRequestID == connectionRequestID')==2
          assert begin.rindex('self.currentConnectionToken == token') < begin.index('newDriver.connect(')
          for forbidden in ('publishDps','writeValue','disconnectBLE'):
              assert forbidden not in begin
          print('official-auth view-exit retirement: PASS')
          PY

          git diff --check
          rm .github/workflows/materialize-capture-view-exit-official-auth-retirement.yml
          git config user.name nembra-v14-bot
          git config user.email nembra-v14-bot@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift .github/workflows/materialize-capture-view-exit-official-auth-retirement.yml
          git diff --cached --check
          git commit -m 'fix(capture): retire official auth on Secure Link exit'
          git push origin HEAD:agent/capture-view-exit-official-auth-retirement
