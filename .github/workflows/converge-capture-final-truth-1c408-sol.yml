name: Converge Capture final truth on 1c408

on:
  push:
    branches:
      - repair/v14-capture-application-event-custody-6b77-sol
    paths:
      - .github/workflows/converge-capture-final-truth-1c408-sol.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-application-event-custody-6b77-sol
          fetch-depth: 0

      - name: Merge exact current product into convergence branch
        shell: bash
        run: |
          set -euo pipefail
          product='product/v14-capture-guided-truth-current-sol'
          expected='1c40853f6991b4d09206df1d25ecff021458b7eb'
          git fetch origin "$product"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git config user.name "nembra-v14-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit "$expected"

      - name: Close foreground target and membership-status residuals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text(encoding="utf-8")

          view_start = text.index("    func abandonCorrelationForViewExit()")
          foreground_start = text.index("    func appDidLoseForeground()", view_start)
          view = text[view_start:foreground_start]
          view_anchor = (
              "        sdkDeviceMembershipVerified = false\n"
              "        membershipAccountUID = nil\n"
              "        membershipDeviceID = nil\n"
              "        membershipRequestID = UUID()\n"
          )
          view_replacement = (
              "        sdkDeviceMembershipVerified = false\n"
              "        membershipAccountUID = nil\n"
              "        membershipDeviceID = nil\n"
              "        membershipStatus = \"Scooter membership must be verified again for this Secure Link view.\"\n"
              "        membershipRequestID = UUID()\n"
          )
          if view.count(view_anchor) != 1:
              raise SystemExit("view-exit membership reset anchor changed")
          view = view.replace(view_anchor, view_replacement, 1)
          text = text[:view_start] + view + text[foreground_start:]

          foreground_start = text.index("    func appDidLoseForeground()")
          foreground_end = text.index("    var privateConfig: Bool", foreground_start)
          foreground = text[foreground_start:foreground_end]
          foreground_anchor = (
              "        sdkDeviceMembershipVerified = false\n"
              "        membershipAccountUID = nil\n"
              "        membershipDeviceID = nil\n"
              "        membershipRequestID = UUID()\n"
          )
          foreground_replacement = (
              "        sdkDeviceMembershipVerified = false\n"
              "        membershipAccountUID = nil\n"
              "        membershipDeviceID = nil\n"
              "        membershipStatus = \"Scooter membership must be verified again for this Secure Link view.\"\n"
              "        membershipRequestID = UUID()\n"
          )
          if foreground.count(foreground_anchor) != 1:
              raise SystemExit("foreground membership reset anchor changed")
          foreground = foreground.replace(foreground_anchor, foreground_replacement, 1)

          authority_anchor = (
              "        officialConnectionRequestID = UUID()\n"
              "        watchdog?.cancel()\n"
          )
          authority_replacement = (
              "        officialConnectionRequestID = UUID()\n"
              "        let foregroundTargetAuthorityWasLive = phase == .correlated || phase == .selected\n"
              "        if phase != .accepted {\n"
              "            targetCorrelationOperatorConfirmed = false\n"
              "            pendingCorrelatedTargetID = nil\n"
              "            selectedID = nil\n"
              "        }\n"
              "        watchdog?.cancel()\n"
          )
          if foreground.count(authority_anchor) != 1:
              raise SystemExit("foreground target-authority anchor changed")
          foreground = foreground.replace(authority_anchor, authority_replacement, 1)

          no_token_anchor = (
              "        guard let token = currentConnectionToken else {\n"
              "            if phase == .authenticating {\n"
          )
          no_token_replacement = (
              "        guard let token = currentConnectionToken else {\n"
              "            if foregroundTargetAuthorityWasLive {\n"
              "                phase = .failed\n"
              "                message = \"Capture left the foreground after Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; prior correlated target authority was revoked.\"\n"
              "                log(\"foreground_integrity_lost_after_target_correlation\")\n"
              "                return\n"
              "            }\n"
              "            if phase == .authenticating {\n"
          )
          if foreground.count(no_token_anchor) != 1:
              raise SystemExit("foreground no-token authority anchor changed")
          foreground = foreground.replace(no_token_anchor, no_token_replacement, 1)
          path.write_text(text[:foreground_start] + foreground + text[foreground_end:], encoding="utf-8")
          PY

      - name: Strengthen current lifecycle regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          foreground_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift")
          text = foreground_path.read_text(encoding="utf-8")
          old = '''        let membershipRevoke = try requiredOffset(
              containing: "membershipRequestID = UUID()",
              in: cleanup
          )
'''
          new = '''        let statusReset = try requiredOffset(
              containing: "membershipStatus = \"Scooter membership must be verified again for this Secure Link view.\"",
              in: cleanup
          )
          let membershipRevoke = try requiredOffset(
              containing: "membershipRequestID = UUID()",
              in: cleanup
          )
'''
          if text.count(old) != 1:
              raise SystemExit("foreground test membership anchor changed")
          text = text.replace(old, new, 1)
          old_order = '''        #expect(closeAdmission < clearVerified)
          #expect(clearVerified < membershipRevoke)
'''
          new_order = '''        #expect(closeAdmission < clearVerified)
          #expect(clearVerified < statusReset)
          #expect(statusReset < membershipRevoke)
'''
          if text.count(old_order) != 1:
              raise SystemExit("foreground test order anchor changed")
          text = text.replace(old_order, new_order, 1)
          marker = '''        #expect(cleanup.contains("foregroundIntegrityLossHandled = true"))
'''
          additions = marker + '''        #expect(cleanup.contains("let foregroundTargetAuthorityWasLive = phase == .correlated || phase == .selected"))
          #expect(cleanup.contains("targetCorrelationOperatorConfirmed = false"))
          #expect(cleanup.contains("pendingCorrelatedTargetID = nil"))
          #expect(cleanup.contains("selectedID = nil"))
          #expect(cleanup.contains("foreground_integrity_lost_after_target_correlation"))
          #expect(!cleanup.contains("membership verified and leased"))
'''
          if text.count(marker) != 1:
              raise SystemExit("foreground test target anchor changed")
          foreground_path.write_text(text.replace(marker, additions, 1), encoding="utf-8")

          nav_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift")
          nav = nav_path.read_text(encoding="utf-8")
          old_end = '''            from: "func abandonCorrelationForViewExit()",
              to: "var privateConfig: Bool"
'''
          new_end = '''            from: "func abandonCorrelationForViewExit()",
              to: "func appDidLoseForeground()"
'''
          if nav.count(old_end) < 2:
              raise SystemExit("navigation test cleanup boundaries changed")
          nav = nav.replace(old_end, new_end)
          revoke_marker = '''        let revoke = try requiredOffset(containing: "membershipRequestID = UUID()", in: cleanup)
'''
          revoke_replacement = '''        let clearVerified = try requiredOffset(containing: "sdkDeviceMembershipVerified = false", in: cleanup)
          let statusReset = try requiredOffset(containing: "membershipStatus = \"Scooter membership must be verified again for this Secure Link view.\"", in: cleanup)
          let revoke = try requiredOffset(containing: "membershipRequestID = UUID()", in: cleanup)
'''
          if nav.count(revoke_marker) != 1:
              raise SystemExit("navigation test revoke anchor changed")
          nav = nav.replace(revoke_marker, revoke_replacement, 1)
          order_marker = '''        #expect(revoke < noActiveCorrelationReturn)
'''
          order_replacement = '''        #expect(clearVerified < statusReset)
          #expect(statusReset < revoke)
          #expect(revoke < noActiveCorrelationReturn)
'''
          if nav.count(order_marker) != 1:
              raise SystemExit("navigation test order anchor changed")
          nav_path.write_text(nav.replace(order_marker, order_replacement, 1), encoding="utf-8")
          PY

      - name: Verify complete truth convergence
        shell: bash
        run: |
          set -euo pipefail
          product='1c40853f6991b4d09206df1d25ecff021458b7eb'
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")

          receiver = s[s.index("private func receivedApplicationUpdate("):s.index("private func startWatchdog")]
          assert receiver.index("let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines)") < receiver.index("try await sessionLedger.recordApplicationUpdate")
          assert receiver.count("of: verifiedAccountUID") == 2
          assert receiver.count('with: "<redacted-account-uid>"') == 2
          assert receiver.index('eventDetails["generation"] = String(token.diagnosticGeneration)') < receiver.index('log("tuya_application_update", eventDetails)')
          assert 'update.merging([' not in receiver

          view = s[s.index("func abandonCorrelationForViewExit()"):s.index("func appDidLoseForeground()")]
          assert view.index("sdkDeviceMembershipVerified = false") < view.index("membershipStatus = \"Scooter membership must be verified again for this Secure Link view.\"") < view.index("membershipRequestID = UUID()")

          fg = s[s.index("func appDidLoseForeground()"):s.index("var privateConfig: Bool")]
          assert fg.index("sdkDeviceMembershipVerified = false") < fg.index("membershipStatus = \"Scooter membership must be verified again for this Secure Link view.\"") < fg.index("membershipRequestID = UUID()")
          for required in (
              "let foregroundTargetAuthorityWasLive = phase == .correlated || phase == .selected",
              "targetCorrelationOperatorConfirmed = false",
              "pendingCorrelatedTargetID = nil",
              "selectedID = nil",
              "foreground_integrity_lost_after_target_correlation",
              "Task { @MainActor [self] in",
              "abandonPackageCorrelation()",
          ):
              assert required in fg
          assert "if phase != .accepted" in fg
          for forbidden in ("disconnectBLE", "publishDps", "queryDps", "writeValue", "recordObservedTransportLoss", "endConnection("):
              assert forbidden not in fg
          PY
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventAuthorityCustodySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          git diff --check "$product"...HEAD

      - name: Commit clean convergence and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/converge-capture-final-truth-1c408-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventAuthorityCustodySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          git commit -m "fix(capture): converge foreground and event authority custody"
          git push origin HEAD:repair/v14-capture-application-event-custody-6b77-sol
