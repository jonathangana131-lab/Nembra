name: Capture R3 Committed Parent Execution Red Team

on:
  push:
    branches:
      - adversarial/v14-r3-committed-parent-execution-sol-20260811
    paths:
      - scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/tests/test_es80_generated_subject_committed_parent_execution_custody.py
      - .github/workflows/capture-r3-committed-parent-execution-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  committed-parent-execution-custody:
    name: Reject child-committed inherited parent execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind diagnostic to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exact production loader and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_generated_subject_committed_parent_execution_custody.py

      - name: Require exact parent authority before module execution
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_generated_subject_committed_parent_execution_custody.py
