name: Materialize Capture authority contract sol 4b

on:
  push:
    branches: [recovery/v14-capture-authority-contract-sol-4]

permissions:
  contents: write

jobs:
  patch:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: recovery/v14-capture-authority-contract-sol-4
          fetch-depth: 0
      - name: Prove exact product base
        shell: bash
        run: |
          set -euo pipefail
          base='8c2e4baefb36d304662e84c9dcf78ef04e48437e'
          test "$(git merge-base HEAD "$base")" = "$base"
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/materialize-capture-authority-contract-sol-4.yml' '.github/workflows/materialize-capture-authority-contract-sol-4b.yml' | sort)"
          test "$actual" = "$expected"
      - name: Apply bounded source repair
        shell: bash
        env:
          PHYSICAL_TEST_B64: 
          CAPTURE_PLIST_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          entry=Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s=entry.read_text()
          reps=[
            ('            membershipDeviceID: membershipDeviceID\n','            membershipDeviceID: membershipDeviceID ?? ""\n','membership boundary'),
            ('        guard currentConnectionToken == nil,\n              OfficialTuyaFactory.packageCorrelationMayStart else { return }\n','        guard currentConnectionToken == nil else { return }\n        guard OfficialTuyaFactory.packageCorrelationMayStart else { return }\n','foreground guard'),
            ('        guard !packageCorrelationRetiredForProcess,\n              activePackageCorrelationOwner == nil,\n              bootstrap(),\n              accountLoggedIn,\n              currentAccountUID != nil else { return nil }\n','        guard !packageCorrelationRetiredForProcess else { return nil }\n        guard activePackageCorrelationOwner == nil,\n              bootstrap(),\n              accountLoggedIn,\n              currentAccountUID != nil else { return nil }\n','factory guard'),
            ('                sanitized[custodyKey] = Self.redactedApplicationDescription(value)\n','                sanitized[custodyKey] = Self.redactKnownSecretValues(\n                    in: String(describing: Self.redactApplicationSecrets(value))\n                )\n','secret projection')]
          for old,new,label in reps:
              if s.count(old)!=1: raise SystemExit(f'{label}: expected one anchor, got {s.count(old)}')
              s=s.replace(old,new,1)
          helper='    private static func redactedApplicationDescription(_ object: Any) -> String {\n        redactKnownSecretValues(in: String(describing: redactApplicationSecrets(object)))\n    }\n\n'
          if s.count(helper)!=1: raise SystemExit('redaction helper anchor changed')
          s=s.replace(helper,'',1)
          old='''                    // Both ledger actor hops above can interleave foreground/view/account retirement.\n                    // Never repaint an already-retired generation as authenticated observation.\n                    guard currentConnectionToken == token else {\n                        log("stale_auth_promotion_resume_ignored", [\n                            "generation": String(token.diagnosticGeneration)\n                        ])\n                        return\n                    }\n                    guard phase == .authenticating else {\n                        log("auth_promotion_resume_phase_changed_ignored", [\n                            "generation": String(token.diagnosticGeneration)\n                        ])\n                        return\n                    }\n                    guard sdkAccountLoggedIn,\n                          sdkDeviceMembershipVerified,\n                          accountIdentityLeaseIsAuthorized else {\n                        await invalidateSourceAuthority(\n                            token: token,\n                            message: "Tuya account/device source authority changed while authentication promotion was suspended.",\n                            kind: "sdk_source_authority_lost_during_auth_promotion"\n                        )\n                        return\n                    }\n\n                    guard let promotionDriver = self.driver else {\n                        await invalidateSourceAuthority(\n                            token: token,\n                            message: "Official Tuya driver authority disappeared while authentication promotion was suspended.",\n                            kind: "sdk_driver_authority_lost_during_auth_promotion"\n                        )\n                        return\n                    }\n                    let promotionLocalBLEOnline = promotionDriver.isLocallyConnected(uuid: tuyaUUID)\n                    sdkLocalBLEOnline = promotionLocalBLEOnline\n                    guard promotionLocalBLEOnline else {\n                        await recordObservedTransportLoss(token: token)\n                        return\n                    }\n\n'''
          new='''                    // Ledger actor hops can interleave view/account retirement. Re-check non-ledger authority\n                    // through one dedicated post-promotion fence before publishing observation.\n                    guard await authenticationPromotionSourceAuthorityIsCurrent(token: token) else { return }\n\n'''
          if s.count(old)!=1: raise SystemExit('auth promotion fence anchor changed')
          s=s.replace(old,new,1)
          if s.count('                        kind: "session_auth_promotion_rejected"\n')!=1: raise SystemExit('auth rejection kind anchor changed')
          s=s.replace('                        kind: "session_auth_promotion_rejected"\n','                        kind: "session_auth_callback_rejected"\n',1)
          anchor='    private func authenticated(token: TuyaReadOnlyConnectionToken) async {\n'
          if s.count(anchor)!=1: raise SystemExit('authenticated insertion anchor changed')
          h='''    private func authenticationPromotionSourceAuthorityIsCurrent(\n        token: TuyaReadOnlyConnectionToken\n    ) async -> Bool {\n        guard currentConnectionToken == token else {\n            log("stale_auth_promotion_resume_ignored", ["generation": String(token.diagnosticGeneration)])\n            return false\n        }\n        guard phase == .authenticating else {\n            log("auth_promotion_resume_phase_changed_ignored", ["generation": String(token.diagnosticGeneration)])\n            return false\n        }\n        guard sdkAccountLoggedIn, sdkDeviceMembershipVerified, accountIdentityLeaseIsAuthorized else {\n            await invalidateSourceAuthority(token: token, message: "Tuya account/device source authority changed while authentication promotion was suspended.", kind: "sdk_source_authority_lost_during_auth_promotion")\n            return false\n        }\n        guard let promotionDriver = driver else {\n            await invalidateSourceAuthority(token: token, message: "Official Tuya driver authority disappeared while authentication promotion was suspended.", kind: "sdk_driver_authority_lost_during_auth_promotion")\n            return false\n        }\n        let online = promotionDriver.isLocallyConnected(uuid: tuyaUUID)\n        sdkLocalBLEOnline = online\n        guard online else { await recordObservedTransportLoss(token: token); return false }\n        return true\n    }\n\n'''
          s=s.replace(anchor,h+anchor,1)
          entry.write_text(s)
          t=Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateFieldInputProvenanceSourceTests.swift')
          p=t.read_text(); oldm='verify_private_tuya_inputs\\n\\nsay \\"Building SDK-integrated Capture'; newm='verify_private_tuya_inputs\\n\\nsay \\"Building SDK-integrated Nembra Capture'
          if p.count(oldm)!=1: raise SystemExit(f'installer source-test marker expected once, got {p.count(oldm)}')
          t.write_text(p.replace(oldm,newm,1))
          Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80PhysicalNoGoConsistencyTests.swift').write_bytes(base64.b64decode(os.environ['PHYSICAL_TEST_B64']))
          project=Path('NembraCapture.xcodeproj/project.pbxproj'); q=project.read_text(); oldg='\t\t\t\tGENERATE_INFOPLIST_FILE = YES;\n'; newg='\t\t\t\tGENERATE_INFOPLIST_FILE = NO;\n\t\t\t\tINFOPLIST_FILE = NembraCapture-Info.plist;\n'
          if q.count(oldg)!=2: raise SystemExit(f'plist project anchors expected twice, got {q.count(oldg)}')
          project.write_text(q.replace(oldg,newg))
          plist=Path('NembraCapture-Info.plist')
          if plist.exists(): raise SystemExit('explicit Capture plist already exists')
          plist.write_bytes(base64.b64decode(os.environ['CAPTURE_PLIST_B64']))
          PY
          plutil -lint NembraCapture-Info.plist
          git diff --check
      - name: Validate Capture package
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/capture-package-sol4b.log"
          set +e
          swift test --package-path Packages/NembraBluetoothCapture >"$log" 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            python3 - "$log" "$status" <<'PY'
          import pathlib,re,sys
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines(); status=int(sys.argv[2])
          pats=[r'\berror:',r'Expectation failed',r'Issue recorded',r'^✘ ',r'^Test Case .* failed',r'^Test Suite .* failed']
          chunks=[]
          for i,line in enumerate(lines):
              if any(re.search(p,line) for p in pats): chunks.append(' | '.join(x.strip() for x in lines[max(0,i-2):min(len(lines),i+4)] if x.strip()))
          chunks.append('TERMINAL: '+' | '.join(x.strip() for x in lines[-100:] if x.strip()))
          seen=set()
          for c in chunks:
              if not c or c in seen: continue
              seen.add(c); safe=c.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print(f'::error title=Capture package sol4b::{safe[:5000]}')
              if len(seen)>=25: break
          raise SystemExit(status)
          PY
          fi
      - name: Build stamped standalone Simulator app
        shell: bash
        run: |
          set -euo pipefail
          sha='8c2e4baefb36d304662e84c9dcf78ef04e48437e'; dependency_sha='abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'; procedure='ES80-AUTHENTICATED-STATIONARY-v1'; label="capture-v14-${sha:0:12}"
          rm -rf /tmp/NembraCaptureSol4bDerived
          xcodebuild -project NembraCapture.xcodeproj -scheme 'Nembra Capture' -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/NembraCaptureSol4bDerived CODE_SIGNING_ALLOWED=NO NEMBRA_CAPTURE_BUILD_IDENTIFIER="$label" NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$sha" NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="$dependency_sha" INFOPLIST_KEY_NembraCaptureProcedureIdentifier="$procedure" build
          plist='/tmp/NembraCaptureSol4bDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app/Info.plist'
          test "$(plutil -extract NembraCaptureBuildIdentifier raw -o - "$plist")" = "$label"
          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$sha"
          test "$(plutil -extract NembraCaptureTuyaDependencyLockSHA256 raw -o - "$plist")" = "$dependency_sha"
          test "$(plutil -extract NembraCaptureProcedureIdentifier raw -o - "$plist")" = "$procedure"
      - name: Publish proven product bytes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-authority-contract-sol-4.yml .github/workflows/materialize-capture-authority-contract-sol-4b.yml
          git config user.name 'nembra-go-worker'; git config user.email 'nembra-go-worker@users.noreply.github.com'
          git add -A; git diff --cached --check; git commit -m 'fix(capture): realign current authority contracts'; git push origin HEAD:recovery/v14-capture-authority-contract-sol-4
