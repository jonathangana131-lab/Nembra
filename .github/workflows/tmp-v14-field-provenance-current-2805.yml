name: TEMP Capture Current Field Provenance Contract Repair

on:
  push:
    branches:
      - repair/v14-field-provenance-current-2805-sol-20260811

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-field-provenance-current-2805-sol-20260811
          fetch-depth: 0
      - name: Bind exact repair input
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Align canonical Field Provenance with accepted helper custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/capture-field-build-provenance.yml')
          text = workflow.read_text()

          path_anchor = '      - scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py\n'
          path_line = '      - scripts/ci/tests/test_capture_field_accepted_source_path_contract.py\n'
          if path_line not in text:
              if text.count(path_anchor) != 1:
                  raise SystemExit(f'workflow path anchor changed: {text.count(path_anchor)} matches')
              text = text.replace(path_anchor, path_anchor + path_line, 1)

          validation_anchor = '          bash -n scripts/field/install_one_time_capture.command\n'
          validation = (
              '          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_accepted_source_path_contract.py\n'
              '          /usr/bin/python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract\n'
          )
          if validation not in text:
              if text.count(validation_anchor) != 1:
                  raise SystemExit(f'installer validation anchor changed: {text.count(validation_anchor)} matches')
              text = text.replace(validation_anchor, validation_anchor + validation, 1)

          stale = '          grep -Fq \'"$PROVENANCE_HELPER" snapshot\' "$bootstrap"\n'
          accepted = (
              '          grep -Fq \'run_accepted_python_helper() {\' "$bootstrap"\n'
              '          grep -Fq \'NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256\' "$bootstrap"\n'
              '          grep -Fq \'PROVENANCE_HELPER_SHA256="$(shasum -a 256 "$PROVENANCE_HELPER"\' "$bootstrap"\n'
              '          grep -Fq \'run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" snapshot \\\' "$bootstrap"\n'
              '          grep -Fq \'PROVENANCE_HELPER_SHA256="$ACCEPTED_PROVENANCE_HELPER_SHA256"\' "$bootstrap"\n'
              '          grep -Fq \'run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" verify \\\' "$bootstrap"\n'
          )
          if stale in text:
              if text.count(stale) != 1:
                  raise SystemExit(f'stale direct-helper assertion is not unique: {text.count(stale)} matches')
              text = text.replace(stale, accepted, 1)
          elif accepted not in text:
              raise SystemExit('neither stale nor accepted provenance-helper contract found')

          guard_anchor = '          guard_line="$(grep -nF \'run_accepted_source_python "$TUYA_BUILD_WINDOW_GUARD_RELATIVE" \\\' "$installer" | sed -n \'1s/:.*//p\')"\n'
          guard_negative = (
              '          if grep -Fq \'/usr/bin/python3 -I "$TUYA_BUILD_WINDOW_GUARD"\' "$installer"; then\n'
              "            echo 'ERROR: build-window guard must execute from the exact accepted Git source subject, not a mutable worktree pathname.' >&2\n"
              '            exit 1\n'
              '          fi\n'
          )
          if guard_negative not in text:
              if text.count(guard_anchor) != 1:
                  raise SystemExit(f'accepted guard ordering anchor changed: {text.count(guard_anchor)} matches')
              text = text.replace(guard_anchor, guard_anchor + guard_negative, 1)

          workflow.write_text(text)
          PY
      - name: Validate portable authority contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          python3 -m py_compile scripts/ci/tests/test_capture_field_accepted_source_path_contract.py
          python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/capture-field-build-provenance.yml').read_text()
          bootstrap = Path('Scripts/bootstrap_capture_tuya_sdk.sh').read_text()
          assert 'scripts/ci/tests/test_capture_field_accepted_source_path_contract.py' in workflow
          assert '"$PROVENANCE_HELPER" snapshot' not in workflow
          assert 'run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" snapshot \\' in workflow
          assert 'run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" verify \\' in workflow
          assert 'run_accepted_source_python "$TUYA_BUILD_WINDOW_GUARD_RELATIVE" \\' in workflow
          assert '/usr/bin/python3 -I "$TUYA_BUILD_WINDOW_GUARD"' not in Path('scripts/field/install_one_time_capture.command').read_text()
          assert 'run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" snapshot \\' in bootstrap
          assert 'run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" verify \\' in bootstrap
          PY
          git diff --check
      - name: Expose clean exact-parent QA candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-v14-field-provenance-current-2805.yml
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'ERROR: no Field Provenance QA delta to publish' >&2; exit 1; }
          git commit -m 'Capture: align current Field Provenance with accepted source custody'
          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          echo "::notice title=Current Field Provenance clean candidate::$candidate tree=$tree"
          git push origin HEAD:repair/v14-field-provenance-current-2805-sol-20260811
