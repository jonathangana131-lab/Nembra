name: Capture Final GO Retirement Dispatch Custody

on:
  push:
    branches:
      - repair/v14-final-go-retirement-dispatch-current-sol-20260811
    paths:
      - scripts/ci/es80_authenticated_stationary_private_review_final_go.py
      - scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py
      - scripts/ci/tests/test_es80_final_go_retirement_dispatch_custody.py
      - scripts/ci/tests/test_es80_final_go_sealed_candidate_handoff.py
      - .github/workflows/capture-final-go-continuous-tracked-tree-custody.yml
      - .github/workflows/capture-final-go-retirement-dispatch-custody.yml
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_private_review_final_go.py
      - scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py
      - scripts/ci/tests/test_es80_final_go_retirement_dispatch_custody.py
      - scripts/ci/tests/test_es80_final_go_sealed_candidate_handoff.py
      - .github/workflows/capture-final-go-continuous-tracked-tree-custody.yml
      - .github/workflows/capture-final-go-retirement-dispatch-custody.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  retirement-dispatch:
    name: Keep candidate Git retired through nested teardown
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXACT_PARENT: 899e5dc5cc5e71617bfe4151cdb1da20c576fbc2
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/nembra-finalgo-retirement-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact current Final-GO parent and six-path repair
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          git diff --name-only "$EXACT_PARENT" HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          printf '%s\n' \
            .github/workflows/capture-final-go-continuous-tracked-tree-custody.yml \
            .github/workflows/capture-final-go-retirement-dispatch-custody.yml \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py \
            scripts/ci/tests/test_es80_final_go_retirement_dispatch_custody.py \
            scripts/ci/tests/test_es80_final_go_sealed_candidate_handoff.py \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile production repair and permanent acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py \
            scripts/ci/tests/test_es80_final_go_retirement_dispatch_custody.py \
            scripts/ci/tests/test_es80_final_go_sealed_candidate_handoff.py \
            scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py

      - name: Preserve continuous tracked-tree custody
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py

      - name: Reject inherited Git restore after sealed retirement
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_final_go_retirement_dispatch_custody.py

      - name: Preserve existing sealed candidate handoff contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_final_go_sealed_candidate_handoff.py

      - name: Preserve current committed-parent execution custody
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXACT_PARENT" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
