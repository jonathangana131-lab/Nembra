name: Capture Private Read Lease Post-Validation Symlink Retarget Red Team

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget_red_team.py
      - .github/workflows/capture-private-read-lease-post-validation-symlink-retarget-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-private-read-lease-post-validation-symlink-retarget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 574b1121be93e967ab6bc6cea3d9e1e078e3efa4
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  exploit-positive:
    name: Expose post-validation symlink retarget (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact repaired product and validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-post-validation-symlink-retarget-red-team.yml \
            scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget_red_team.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exploit oracle without bytecode artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          path=Path('scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget_red_team.py')
          compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
          PY

      - name: Require exploit-positive post-validation retarget
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget_red_team.py

      - name: Preserve validation-only head and truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'NEMBRA_POST_VALIDATION_SYMLINK_RETARGET exploitPositive=true productionBytesChanged=false aclAuthorityMocked=true deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false'
