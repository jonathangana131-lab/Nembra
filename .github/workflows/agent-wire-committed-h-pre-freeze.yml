name: agent wire committed h pre freeze
on:
  push:
    branches: ['integration/es80-v14-controller-duration-gated/gpt56']
    paths: ['.github/workflows/agent-wire-committed-h-pre-freeze.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-controller-duration-gated/gpt56
          fetch-depth: 0
      - name: Apply committed-H pre-freeze recovery
        shell: bash
        run: |
          python3 .nembra/agent-wire-committed-h-pre-freeze.py
          git rm .github/workflows/agent-wire-committed-h-pre-freeze.yml
          git rm .nembra/agent-wire-committed-h-pre-freeze.py
          git config user.name 'nembra-gpt56'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          git commit -m 'fix: quarantine committed Horizon before failed artifact freeze'
          git push origin HEAD:integration/es80-v14-controller-duration-gated/gpt56
