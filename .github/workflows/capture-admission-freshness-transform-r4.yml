name: Capture admission freshness transform r4
on:
  push:
    branches: [agent/capture-admission-issuance-clock-v14-r2]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/capture-admission-issuance-clock-v14-r2
      - name: Transform exact current-head product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c1cad49b938a845ee5804a4ca3faa30bc0087742"
          python3 - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              n = text.count(old)
              print(label, "matches", n)
              if n < 1:
                  raise SystemExit(label + " missing")
              return text.replace(old, new, 1)

          prod = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift")
          p = prod.read_text()
          p = must_replace(p, "import Foundation\n", "import Dispatch\nimport Foundation\n", "producer import")
          p = must_replace(p, "        let admissionIdentity: UUID\n        let powerCycleEvidence:", "        let admissionIdentity: UUID\n        let issuedAtUptimeNanoseconds: UInt64\n        let powerCycleEvidence:", "payload field")
          p = must_replace(p, "            admissionIdentity: UUID,\n            powerCycleEvidence:", "            admissionIdentity: UUID,\n            issuedAtUptimeNanoseconds: UInt64,\n            powerCycleEvidence:", "payload init")
          p = must_replace(p, "            self.admissionIdentity = admissionIdentity\n            self.powerCycleEvidence", "            self.admissionIdentity = admissionIdentity\n            self.issuedAtUptimeNanoseconds = issuedAtUptimeNanoseconds\n            self.powerCycleEvidence", "payload assignment")
          marker = "    fileprivate init(\n        powerCycleEvidence: PassiveBluetoothExperimentOnePowerCycleEvidence,\n        peripheralIdentifier: UUID,\n        recorder: PassiveCoreBluetoothCaptureRecorder\n    ) {\n        payload = Payload(\n            admissionIdentity: UUID(),\n"
          replacement = "    fileprivate init(\n        issuedAtUptimeNanoseconds: UInt64,\n        powerCycleEvidence: PassiveBluetoothExperimentOnePowerCycleEvidence,\n        peripheralIdentifier: UUID,\n        recorder: PassiveCoreBluetoothCaptureRecorder\n    ) {\n        payload = Payload(\n            admissionIdentity: UUID(),\n            issuedAtUptimeNanoseconds: issuedAtUptimeNanoseconds,\n"
          p = must_replace(p, marker, replacement, "admission initializer")
          marker = "        let recorder = try beginCaptureRecorder(startedAt: startedAt)\n        return PassiveBluetoothExperimentOneCaptureAdmission(\n            powerCycleEvidence: evidence,\n"
          replacement = "        let recorder = try beginCaptureRecorder(startedAt: startedAt)\n        let issuedAtUptimeNanoseconds = DispatchTime.now().uptimeNanoseconds\n        return PassiveBluetoothExperimentOneCaptureAdmission(\n            issuedAtUptimeNanoseconds: issuedAtUptimeNanoseconds,\n            powerCycleEvidence: evidence,\n"
          p = must_replace(p, marker, replacement, "producer issuance")
          prod.write_text(p)

          ctrl = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          c = ctrl.read_text()
          c = must_replace(c, "        case experimentOneVehicleContextMismatch\n        case targetNotSelected\n", "        case experimentOneVehicleContextMismatch\n        case experimentOneRediscoveryRequired(UUID)\n        case targetNotSelected\n", "controller error")
          start = c.index("    func connectUsingExperimentOneAdmission(")
          end = c.index("    public func cancelActiveConnection()", start)
          before, body, after = c[:start], c[start:end], c[end:]
          body = must_replace(body, "        let latestAdvertisement = latestAdvertisementByIdentifier[payload.peripheralIdentifier]\n", "        guard let latestAdvertisement = latestAdvertisementByIdentifier[payload.peripheralIdentifier],\n              latestAdvertisement.receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds else {\n            throw ControllerError.experimentOneRediscoveryRequired(payload.peripheralIdentifier)\n        }\n", "consumer freshness")
          body = must_replace(body, "        if let latestAdvertisement {\n            enqueue(\n                .advertisement(latestAdvertisement.observation),\n                receivedAtUptimeNanoseconds: latestAdvertisement.receivedAtUptimeNanoseconds,\n                receivedAtDate: latestAdvertisement.receivedAtDate\n            )\n        }\n", "        enqueue(\n            .advertisement(latestAdvertisement.observation),\n            receivedAtUptimeNanoseconds: latestAdvertisement.receivedAtUptimeNanoseconds,\n            receivedAtDate: latestAdvertisement.receivedAtDate\n        )\n", "consumer enqueue")
          ctrl.write_text(before + body + after)

          test = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift")
          if test.exists():
              raise SystemExit("product test path already exists")
          test.write_text('''import Foundation\nimport Testing\n@testable import NembraBluetoothCapture\n\n/// Product provenance contract for the Experiment One handoff.\n/// Software monotonic ordering only; no BLE/RF emission time or physical ES80 claim.\nstruct ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests {\n    private static func source(named filename: String) throws -> String {\n        let testFile = URL(fileURLWithPath: #filePath)\n        let packageRoot = testFile.deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent()\n        return try String(contentsOf: packageRoot.appendingPathComponent("Sources").appendingPathComponent("NembraBluetoothCapture").appendingPathComponent(filename), encoding: .utf8)\n    }\n\n    @Test("sealed admission carries producer-issued monotonic handoff chronology")\n    func chronology() throws {\n        let run = try Self.source(named: "PassiveBluetoothExperimentOneRun.swift")\n        let controller = try Self.source(named: "ForegroundCoreBluetoothCaptureController.swift")\n        #expect(run.contains("let issuedAtUptimeNanoseconds: UInt64"))\n        #expect(run.contains("DispatchTime.now().uptimeNanoseconds"))\n        let start = try #require(controller.range(of: "func connectUsingExperimentOneAdmission("))\n        let end = try #require(controller.range(of: "public func cancelActiveConnection()", range: start.upperBound..<controller.endIndex))\n        let body = controller[start.lowerBound..<end.lowerBound]\n        let freshness = try #require(body.range(of: "receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds"))\n        let select = try #require(body.range(of: "targetState.selectTarget(payload.peripheralIdentifier)"))\n        let install = try #require(body.range(of: "recorder = payload.recorder"))\n        #expect(freshness.lowerBound < select.lowerBound)\n        #expect(freshness.lowerBound < install.lowerBound)\n    }\n}\n''')
          PY
          git diff --check
          grep -F 'receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          rm .github/workflows/capture-admission-freshness-transform-r4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[Capture Experiment One v14] Require post-admission rediscovery'
          git push origin HEAD:agent/capture-admission-issuance-clock-v14-r2
