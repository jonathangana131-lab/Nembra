name: Capture TODAY Trusted Crosscheck Execution QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_trusted_crosscheck_execution.py
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/es80_today_final_go_foundation.py
      - scripts/ci/tests/test_es80_today_trusted_crosscheck_execution.py
      - scripts/ci/tests/test_es80_today_final_go_hardened.py
      - .github/workflows/capture-today-trusted-crosscheck-execution-qa.yml

permissions:
  contents: read

jobs:
  trusted-crosscheck:
    name: Re-execute pinned Final GO crosscheck authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nembra-capture-today-trusted-crosscheck-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true

    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile trusted crosscheck composition
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_trusted_crosscheck_execution.py
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_trusted_crosscheck_execution.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_hardened.py

      - name: Adversarially prove pinned producer execution custody
        run: python3 scripts/ci/tests/test_es80_today_trusted_crosscheck_execution.py -v

      - name: Prove hardened composer consumes private fresh crosscheck authority
        run: python3 scripts/ci/tests/test_es80_today_final_go_hardened.py -v

      - name: Keep crosscheck commit and blob pins coherent with foundation
        run: |
          set -euo pipefail
          commit='d827a296048386bda62024ea3278775d5344c47c'
          blob='c3b2b620280484c05316fc5c2fa2ca451f1fdc83'
          grep -Fq "PINNED_CROSSCHECK_COMMIT = \"$commit\"" scripts/ci/es80_today_final_go_foundation.py
          grep -Fq "PINNED_CROSSCHECK_BLOB = \"$blob\"" scripts/ci/es80_today_final_go_foundation.py
          grep -Fq "PINNED_CROSSCHECK_COMMIT = \"$commit\"" scripts/ci/es80_today_trusted_crosscheck_execution.py
          grep -Fq "PINNED_CROSSCHECK_BLOB = \"$blob\"" scripts/ci/es80_today_trusted_crosscheck_execution.py
          grep -Fq 'CROSSCHECK_PATH = "scripts/ci/es80_today_independent_candidate_crosscheck.py"' scripts/ci/es80_today_trusted_crosscheck_execution.py
          grep -Fq 'trusted_crosscheck.execute_trusted_crosscheck' scripts/ci/es80_today_final_go_hardened.py
