name: Capture Private-Key Path Custody Exact-Head

on:
  pull_request:
    paths:
      - 'scripts/ci/es80_field_authorization_envelope.py'
      - 'scripts/ci/tests/test_es80_field_authorization_private_key_path_custody.py'
      - 'scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py'
      - '.github/workflows/capture-private-key-path-custody.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  private-key-path-custody:
    name: Reject private-key symlink ancestry on exact head
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout immutable pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_head="$(/usr/bin/git rev-parse --verify HEAD^{commit})"
          printf 'Expected exact head: %s\nActual checkout: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          /usr/bin/git diff --check "$EXPECTED_HEAD_SHA^" "$EXPECTED_HEAD_SHA"

      - name: Validate signer and executable custody regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_field_authorization_envelope.py
          python3 -m py_compile scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py
          python3 -m py_compile scripts/ci/tests/test_es80_field_authorization_private_key_path_custody.py
          python3 scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py
          python3 scripts/ci/tests/test_es80_field_authorization_private_key_path_custody.py
          python3 scripts/ci/es80_field_authorization_envelope.py --self-test

      - name: Reject pull-request head movement
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            })
            const pr = response.data
            if (pr.state !== 'open') {
              core.setFailed('Pull request closed during private-key path custody validation.')
            }
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Pull request source repository changed during validation.')
            }
            if (pr.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              core.setFailed('Pull request head moved; this run is stale and non-evidence.')
            }
