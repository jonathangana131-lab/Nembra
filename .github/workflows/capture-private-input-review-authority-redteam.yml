name: Capture Private Input Review Authority Red Team

on:
  pull_request:
    paths:
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - Scripts/capture_tuya_private_input_provenance.py
      - scripts/ci/tests/test_capture_private_input_review_authority.py
      - .github/workflows/capture-private-input-review-authority-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-review-authority:
    name: Require reviewed private generation before field admission
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind diagnostic to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          python3 -m py_compile \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_private_input_review_authority.py

      - name: Require stable substituted private generation to fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_private_input_review_authority.py
