name: Capture Private Read Lease Component Walk Failure Isolation

on:
  pull_request:
    paths:
      - .github/workflows/capture-private-read-lease-component-walk-failure-isolation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-private-read-lease-component-walk-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 474507966619ce39288b20de29066711088cd986
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  isolate:
    name: Isolate held-descriptor behavior (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact product and one-file diagnostic delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = ".github/workflows/capture-private-read-lease-component-walk-failure-isolation.yml"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove Python openat no-follow primitives exist
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import os
          assert os.open in os.supports_dir_fd, "os.open lacks dir_fd/openat support"
          assert getattr(os, "O_NOFOLLOW", 0) != 0, "O_NOFOLLOW unavailable"
          assert getattr(os, "O_DIRECTORY", 0) != 0, "O_DIRECTORY unavailable"
          print("NEMBRA_OPENAT_CAPABILITY dirFd=true noFollow=true directory=true")
          PY

      - name: Control real directory and file open
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            CapturePrivateReadLeaseComponentWalkTests.test_real_directory_and_regular_file_still_open

      - name: Intermediate symlink swap rejection
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            CapturePrivateReadLeaseComponentWalkTests.test_intermediate_symlink_swap_is_rejected_after_plan

      - name: Real directory replacement rejection
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            CapturePrivateReadLeaseComponentWalkTests.test_real_directory_replacement_is_rejected_against_planned_identity

      - name: Mixed-generation descriptor-plan rejection
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            CapturePrivateReadLeaseComponentWalkTests.test_descriptor_plan_rejects_mixed_generation_descendant

      - name: Mixed-generation grant rejects before ACL mutation
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            CapturePrivateReadLeaseComponentWalkTests.test_actual_grant_rejects_mixed_generation_before_acl_mutation

      - name: Held descriptor prevents inode reuse after admission
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            CapturePrivateReadLeaseComponentWalkTests.test_held_descriptor_prevents_inode_reuse_after_admission

      - name: Source contract still consumes held descriptors
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            CapturePrivateReadLeaseComponentWalkTests.test_source_production_grant_consumes_held_descriptor_plan

      - name: Preserve diagnostic-only truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'NEMBRA_COMPONENT_WALK_ISOLATION productBytesChanged=false signingAuthorityCreated=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false'

  darwin-control:
    name: Darwin open control — ${{ matrix.case }}
    runs-on: macos-15
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        case: [root-open, component-walk, descriptor-path-signature, production-directory, production-file]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact one-file diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          test "$(git diff --name-only "$EXACT_PARENT"...HEAD)" = ".github/workflows/capture-private-read-lease-component-walk-failure-isolation.yml"

      - name: Exercise exact Darwin open boundary
        shell: bash
        env:
          NEMBRA_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import stat
          import tempfile

          helper_path = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          spec = importlib.util.spec_from_file_location("nembra_darwin_open_control", helper_path)
          if spec is None or spec.loader is None:
              raise RuntimeError("could not load selected-Xcode orchestrator")
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)

          case = os.environ["NEMBRA_CASE"]
          nofollow = getattr(os, "O_NOFOLLOW", 0)
          odirectory = getattr(os, "O_DIRECTORY", 0)
          cloexec = getattr(os, "O_CLOEXEC", 0)

          if case == "root-open":
              descriptor = os.open(os.sep, os.O_RDONLY | cloexec | odirectory)
              try:
                  assert stat.S_ISDIR(os.fstat(descriptor).st_mode)
              finally:
                  os.close(descriptor)
              raise SystemExit(0)

          with tempfile.TemporaryDirectory(prefix="nembra-darwin-open-control-") as raw:
              root = Path(raw)
              directory = root / "a/b/c"
              directory.mkdir(parents=True)
              file = directory / "private.fixture"
              file.write_bytes(b"fixture\n")

              if case in ("component-walk", "descriptor-path-signature"):
                  path = directory
                  current = os.open(os.sep, os.O_RDONLY | cloexec | odirectory)
                  try:
                      for component in path.parts[1:]:
                          next_descriptor = os.open(
                              component,
                              os.O_RDONLY | cloexec | nofollow | odirectory,
                              dir_fd=current,
                          )
                          os.close(current)
                          current = next_descriptor
                      if case == "descriptor-path-signature":
                          assert helper._descriptor_signature(current) == helper._path_signature(path)
                  finally:
                      os.close(current)
                  raise SystemExit(0)

              if case == "production-directory":
                  descriptor = helper._open_pinned_path(directory, True)
              elif case == "production-file":
                  descriptor = helper._open_pinned_path(file, False)
              else:
                  raise AssertionError(f"unknown diagnostic case: {case}")
              os.close(descriptor)
          PY

      - name: Preserve diagnostic-only truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "NEMBRA_DARWIN_OPEN_CONTROL case=${{ matrix.case }} productBytesChanged=false physicalAuthorityCreated=false"
