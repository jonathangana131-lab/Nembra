name: Materialize Capture Application Event Custody

on:
  push:
    branches: [fix/v14-capture-application-event-custody-sol]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-application-event-custody-sol
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact product source
        run: |
          set -euo pipefail
          parent=6b778f2104af34dbe5b80da31ddb3ca422f9667c
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Materialize and validate event custody
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_application_event_custody.py
          python3 -m py_compile scripts/ci/materialize_capture_application_event_custody.py
          git diff --check
      - name: Publish clean three-path repair
        run: |
          set -euo pipefail
          parent=6b778f2104af34dbe5b80da31ddb3ca422f9667c
          rm .github/workflows/materialize-capture-application-event-custody.yml
          rm scripts/ci/materialize_capture_application_event_custody.py
          git add -A
          git diff --cached --check
          git config user.name nembra-sol
          git config user.email nembra-sol@users.noreply.github.com
          git commit -m 'fix(capture): protect application event custody'
          test "$(git diff --name-only "$parent" HEAD | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' | sort)"
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-application-event-custody-sol
