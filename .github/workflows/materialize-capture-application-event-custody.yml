name: Materialize Capture Application Event Custody

on:
  push:
    branches:
      - sol/v14-capture-application-event-custody-870f20-20260810

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-application-event-custody-870f20-20260810
          fetch-depth: 0
      - name: Guard exact product parent
        run: |
          set -euo pipefail
          parent='870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
      - name: Apply application-event custody repair
        run: python3 scripts/ci/materialize_capture_application_event_custody.py apply
      - name: Verify application-event custody repair
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_application_event_custody.py verify
          python3 -m py_compile scripts/ci/materialize_capture_application_event_custody.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git diff --check
      - name: Publish clean three-path checkpoint
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-application-event-custody.yml
          rm scripts/ci/materialize_capture_application_event_custody.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): protect accepted application event custody'
          git push origin HEAD:sol/v14-capture-application-event-custody-870f20-20260810
