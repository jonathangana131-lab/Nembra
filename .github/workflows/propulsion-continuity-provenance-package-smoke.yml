name: Propulsion Continuity Provenance Package Smoke

on:
  push:
    branches:
      - qa/propulsion-continuity-provenance/chat-j8r5v-8a9604b

permissions:
  contents: read

jobs:
  nembra-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify immutable product parent and workflow-only delta
        shell: bash
        run: |
          set -euo pipefail
          product_sha="8a9604b246e961bd367978d3e7ac83fa52e72a88"
          test "$(git rev-parse HEAD^)" = "$product_sha"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/propulsion-continuity-provenance-package-smoke.yml"

      - name: Run full NembraCore suite with Swift 6.2 warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/Packages/NembraCore \
            swift:6.2 \
            bash -lc 'swift --version && swift test -Xswiftc -warnings-as-errors'
