name: Materialize Capture Secret Classifier Convergence 870F

on:
  push:
    branches:
      - sol/v14-capture-export-secret-promise-870f

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          BASE=870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t paths < <(git diff --name-only "$BASE"...HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = ".github/workflows/materialize-capture-secret-classifier-convergence-870f.yml"

      - name: Converge current app-owned secret classifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = app.read_text()
          old = '''    private static let secretKeyFragments = [
                  "localkey",
                  "sessionkey",
                  "appkey",
                  "appsecret",
                  "password",
                  "accounttoken",
                  "accesstoken",
                  "refreshtoken",
                  "sessionkey",
                  "authkey",
                  "seckey",
              ]'''
          new = '''    private static let secretKeyFragments = [
                  "localkey",
                  "sessionkey",
                  "appkey",
                  "appsecret",
                  "password",
                  "accounttoken",
                  "accesstoken",
                  "refreshtoken",
                  "authkey",
                  "seckey",
              ]'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one duplicated current SmartLife classifier, found {text.count(old)}")
          app.write_text(text.replace(old, new, 1))

          bridge = Path("NembraApp/Features/Research/TuyaAccountBridge.swift")
          bridge_text = bridge.read_text()
          old_bridge = '            let secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "sessionkey", "seckey", "authkey"]'
          new_bridge = '            let secretKeyFragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "seckey", "authkey"]'
          if bridge_text.count(old_bridge) != 1:
              raise SystemExit(f"expected one current TuyaAccountBridge classifier, found {bridge_text.count(old_bridge)}")
          bridge.write_text(bridge_text.replace(old_bridge, new_bridge, 1))

          test = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExportSecretClassifierConvergenceSourceTests.swift")
          test.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture export secret classifier convergence")
          struct TuyaExportSecretClassifierConvergenceSourceTests {
              private let promisedSecretFragments = [
                  "localkey",
                  "sessionkey",
                  "appkey",
                  "appsecret",
                  "password",
                  "accounttoken",
                  "accesstoken",
                  "refreshtoken",
                  "authkey",
                  "seckey",
              ]

              @Test("application and metadata classifiers cover one coherent export-secret set")
              func classifiersStayConverged() throws {
                  let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driverList = String(try section(
                      in: app,
                      from: "private static let secretKeyFragments = [",
                      to: "private static func redactApplicationSecrets(_ object: Any) -> Any"
                  ))
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let bridgeRedactor = String(try section(
                      in: bridge,
                      from: "private static func redactSecrets(_ object: Any) -> Any",
                      to: "private static func remoteMessage(_ object: [String: Any]) -> String"
                  ))

                  for fragment in promisedSecretFragments {
                      #expect(driverList.components(separatedBy: "\"\(fragment)\"").count - 1 == 1)
                      #expect(bridgeRedactor.components(separatedBy: "\"\(fragment)\"").count - 1 == 1)
                  }
                  #expect(bridgeRedactor.contains("key.lowercased().filter"))
                  #expect(bridgeRedactor.contains("redactSecrets(value)"))
                  #expect(bridgeRedactor.contains("array.map(redactSecrets)"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          ''')
          PY

      - name: Verify convergence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          bridge = Path("NembraApp/Features/Research/TuyaAccountBridge.swift").read_text()
          fragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey"]
          driver_list = app.split("private static let secretKeyFragments = [", 1)[1].split("private static func redactApplicationSecrets(_ object: Any) -> Any", 1)[0]
          redactor = bridge.split("private static func redactSecrets(_ object: Any) -> Any", 1)[1].split("private static func remoteMessage(_ object: [String: Any]) -> String", 1)[0]
          for fragment in fragments:
              assert driver_list.count(f'"{fragment}"') == 1, (fragment, "driver")
              assert redactor.count(f'"{fragment}"') == 1, (fragment, "bridge")
          assert 'key.lowercased().filter' in redactor
          assert 'redactSecrets(value)' in redactor
          assert 'array.map(redactSecrets)' in redactor
          PY
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExportSecretClassifierConvergenceSourceTests.swift
          git diff --check

      - name: Publish clean current-product donor
        shell: bash
        run: |
          set -euo pipefail
          BASE=870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81
          WORKFLOW=.github/workflows/materialize-capture-secret-classifier-convergence-870f.yml
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExportSecretClassifierConvergenceSourceTests.swift
          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            ".github/workflows/materialize-capture-secret-classifier-convergence-870f.yml"
            "NembraApp/App/NembraCaptureEntrypoint.swift"
            "NembraApp/Features/Research/TuyaAccountBridge.swift"
            "$TEST"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${staged[*]}" = "${expected_sorted[*]}"
          git commit -m "fix(capture): converge export secret classifiers"
          mapfile -t effective < <(git diff --name-only "$BASE"...HEAD | sort)
          expected_effective=(
            "NembraApp/App/NembraCaptureEntrypoint.swift"
            "NembraApp/Features/Research/TuyaAccountBridge.swift"
            "$TEST"
          )
          mapfile -t expected_effective_sorted < <(printf '%s\n' "${expected_effective[@]}" | sort)
          test "${effective[*]}" = "${expected_effective_sorted[*]}"
          git diff --check "$BASE"...HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
