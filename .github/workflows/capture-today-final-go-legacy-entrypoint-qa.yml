name: Capture TODAY Legacy Final GO Entrypoint QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_final_go_record.py
      - scripts/ci/es80_today_final_go_foundation.py
      - scripts/ci/_es80_today_final_go_foundation_impl.py
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_final_go_record.py
      - scripts/ci/tests/test_es80_today_final_go_foundation.py
      - scripts/ci/tests/test_es80_today_final_go_legacy_entrypoint.py
      - scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py
      - scripts/ci/tests/test_es80_today_final_go_public_import_disabled.py
      - .github/workflows/capture-today-final-go-legacy-entrypoint-qa.yml

permissions:
  contents: read

jobs:
  legacy-entrypoint:
    name: Reject legacy executable/imported Final GO authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile compatibility paths, private foundation, and regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_final_go_record.py
          python3 -m py_compile scripts/ci/es80_today_final_go_foundation.py
          python3 -m py_compile scripts/ci/_es80_today_final_go_foundation_impl.py
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_record.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_foundation.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_legacy_entrypoint.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_public_import_disabled.py
      - name: Preserve complete private foundation adversarial coverage
        run: python3 scripts/ci/tests/test_es80_today_final_go_foundation.py
      - name: Reject direct legacy Final GO execution
        run: python3 scripts/ci/tests/test_es80_today_final_go_legacy_entrypoint.py -v
      - name: Reject direct public Final GO execution surfaces
        run: python3 scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py -v
      - name: Reject imported public Final GO builder authority
        run: python3 scripts/ci/tests/test_es80_today_final_go_public_import_disabled.py -v
      - name: Require hardened executable handoff
        run: |
          set -euo pipefail
          grep -Fq 'legacy foundation entrypoint is non-authorizing' scripts/ci/es80_today_final_go_record.py
          grep -Fq 'Final GO foundation is non-authorizing for direct execution or imported record construction' scripts/ci/es80_today_final_go_foundation.py
          grep -Fq '_es80_today_final_go_foundation_impl.py' scripts/ci/es80_today_final_go_hardened.py
          grep -Fq 'es80_today_final_go_hardened.py' scripts/ci/es80_today_final_go_record.py
