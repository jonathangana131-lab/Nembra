name: chat-k4m7v reconcile parent ee483

on:
  push:
    branches:
      - 'parallel/es80-preh-observation-abort/chat-k4m7v'
    paths:
      - '.github/workflows/chat-k4m7v-reconcile-parent-ee483.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-preh-observation-abort/chat-k4m7v
          fetch-depth: 0
      - name: Merge exact parent and retain stronger child regression
        shell: bash
        env:
          EXPECTED_PARENT_SHA: ee483d2e5a5a241d35bece3698815fa0ca2318cd
        run: |
          set -euo pipefail
          git config user.name 'nembra-chat-k4m7v'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin parallel/es80-boundary-transaction-decision/chat-k4v7p
          actual_parent="$(git rev-parse FETCH_HEAD)"
          printf 'Expected parent: %s\nFetched parent:  %s\n' "$EXPECTED_PARENT_SHA" "$actual_parent"
          test "$actual_parent" = "$EXPECTED_PARENT_SHA"

          set +e
          git merge --no-commit --no-ff "$actual_parent"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            expected='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryTransactionDecisionTests.swift'
            printf 'Conflicted paths:\n%s\n' "$conflicted"
            test "$conflicted" = "$expected"
            # Parent's one-line regression establishes that stale rejection leaves
            # .drainingReady unresolved. The child version preserves that premise
            # and extends it through producer-issued rejection proof -> quarantine.
            git checkout --ours -- "$expected"
            git add "$expected"
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'chore: reconcile latest boundary transaction parent'

          git rm .github/workflows/chat-k4m7v-reconcile-parent-ee483.yml
          git commit -m 'chore: remove parent reconciliation workflow'
          git push origin HEAD:parallel/es80-preh-observation-abort/chat-k4m7v
