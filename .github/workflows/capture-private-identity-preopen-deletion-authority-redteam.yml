name: Capture Private Identity Preopen Deletion Authority Red Team

on:
  pull_request:
    paths:
      - Scripts/provision_capture_tuya_identity_writer.py
      - scripts/ci/tests/test_capture_private_identity_preopen_deletion_authority.py
      - .github/workflows/capture-private-identity-preopen-deletion-authority-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preopen-deletion-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact diagnostic checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Exercise pre-open rejection deletion authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_preopen_deletion_authority.py
          set +e
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_preopen_deletion_authority.py 2>&1 | tee /tmp/preopen-deletion-authority.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -Fq "rejection deleted a same-UID attacker replacement using newly observed final-inode authority" /tmp/preopen-deletion-authority.log; then
            echo "::error file=Scripts/provision_capture_tuya_identity_writer.py,title=Expected-red pre-open deletion authority demonstrated::#2899 rejection deleted the substituted same-UID canonical credential file using metadata learned from that attacker replacement."
          fi
          test "$status" -eq 0
          git diff --check
