name: V14 Capture Visual Reanchor Materializer

on:
  push:
    branches:
      - agent/v14-capture-visual-reanchor-194197-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reanchor reviewed visual harness
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT="194197ed62ccd4f7880e314ff70e5e0229cddc30"
          DONOR="98da97af363ba0fae1ef8f158e27b26159ca31c4"
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]] || { echo "materializer already consumed or branch moved; no-op"; exit 0; }
          mapfile -t CUT_FILES < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          [[ "${#CUT_FILES[@]}" -eq 1 && "${CUT_FILES[0]}" == ".github/workflows/v14-capture-visual-reanchor-materializer.yml" ]] || exit 2

          for path in \
            .github/workflows/capture-standalone-visual-evidence.yml \
            scripts/ci/capture_standalone_visual_evidence.sh \
            scripts/ci/tests/test_capture_standalone_visual_evidence.py
          do
            mkdir -p "$(dirname "$path")"
            git show "$DONOR:$path" > "$path"
          done

          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          /usr/bin/python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py
          git diff --check
          grep -Fq "iPhone 12" scripts/ci/capture_standalone_visual_evidence.sh
          grep -Fq "iOS 27" scripts/ci/capture_standalone_visual_evidence.sh
          grep -Fq "visualAcceptanceRequiresHumanReview" scripts/ci/capture_standalone_visual_evidence.sh

          git config user.name "Nembra V14 Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/capture-standalone-visual-evidence.yml scripts/ci/capture_standalone_visual_evidence.sh scripts/ci/tests/test_capture_standalone_visual_evidence.py
          git commit -m "test(capture): reanchor exact iPhone 12 visual evidence"
          git push origin HEAD:agent/v14-capture-visual-reanchor-194197-sol
