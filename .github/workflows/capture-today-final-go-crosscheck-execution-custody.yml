name: Capture TODAY Final GO Crosscheck Execution Custody

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - scripts/ci/es80_today_final_go_foundation.py
      - scripts/ci/tests/test_es80_today_final_go_foundation.py
      - scripts/ci/tests/test_es80_today_final_go_crosscheck_execution_custody.py
      - .github/workflows/capture-today-final-go-crosscheck-execution-custody.yml

permissions:
  contents: read

jobs:
  crosscheck-execution-custody:
    name: Require pinned independent crosscheck execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile crosscheck authority surface
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_final_go_foundation.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_foundation.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_crosscheck_execution_custody.py
      - name: Preserve historical Final GO adversarial suite
        run: python3 scripts/ci/tests/test_es80_today_final_go_foundation.py
      - name: Require pinned crosscheck producer execution
        run: python3 scripts/ci/tests/test_es80_today_final_go_crosscheck_execution_custody.py -v
      - name: Pin crosscheck execution authority source shape
        run: |
          set -euo pipefail
          grep -Fq 'PINNED_CROSSCHECK_COMMIT = "d827a296048386bda62024ea3278775d5344c47c"' scripts/ci/es80_today_final_go_foundation.py
          grep -Fq 'PINNED_CROSSCHECK_BLOB = "c3b2b620280484c05316fc5c2fa2ca451f1fdc83"' scripts/ci/es80_today_final_go_foundation.py
          grep -Fq '"cat-file", "blob", object_id' scripts/ci/es80_today_final_go_foundation.py
          grep -Fq 'producerExecutionAuthority' scripts/ci/es80_today_final_go_foundation.py
          grep -Fq 'independent retained-candidate receipt was not reproduced by the pinned crosscheck producer' scripts/ci/es80_today_final_go_foundation.py
          grep -Fq 'exact canonical pinned-producer output' scripts/ci/es80_today_final_go_foundation.py
