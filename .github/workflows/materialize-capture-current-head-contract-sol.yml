name: Materialize Capture current-head contract repair

on:
  push:
    branches:
      - recovery/v14-capture-current-head-contract-sol

permissions:
  contents: write

jobs:
  patch:
    name: Apply installer rendezvous repair
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-current-head-contract-sol
          fetch-depth: 0

      - name: Prove recovery lineage remains workflow-only
        shell: bash
        run: |
          set -euo pipefail
          expected='417dca6b0bc5cd6e7134768acbf5d46935070d22'
          test "$(git merge-base HEAD "$expected")" = "$expected"
          test "$(git diff --name-only "$expected" HEAD)" = '.github/workflows/materialize-capture-current-head-contract-sol.yml'

      - name: Apply installer procedure rendezvous
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          installer = Path('scripts/field/install_one_time_capture.command')
          text = installer.read_text()
          needle = 'PROCEDURE_ID="ES80-AUTHENTICATED-STATIONARY-v1"\nBUILD_LABEL="capture-v14-${SOURCE_SHA:0:12}"\n'
          replacement = needle + 'say "Field procedure: $PROCEDURE_ID"\n'
          if text.count(needle) != 1:
              raise SystemExit('installer procedure/build-label rendezvous changed; refusing broad edit')
          if 'say "Field procedure: $PROCEDURE_ID"' in text:
              raise SystemExit('installer already surfaces canonical procedure; refusing duplicate edit')
          installer.write_text(text.replace(needle, replacement, 1))
          PY
          bash -n scripts/field/install_one_time_capture.command
          grep -Fq 'say "Field procedure: $PROCEDURE_ID"' scripts/field/install_one_time_capture.command
          git diff --check
          test "$(git diff --name-only)" = 'scripts/field/install_one_time_capture.command'

      - name: Commit installer repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-worker'
          git config user.email 'nembra-go-worker@users.noreply.github.com'
          git add scripts/field/install_one_time_capture.command
          git commit -m 'Capture: surface exact field procedure'
          git push origin HEAD:recovery/v14-capture-current-head-contract-sol
