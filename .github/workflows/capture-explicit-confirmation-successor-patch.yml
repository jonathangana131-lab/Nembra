name: Capture Explicit Confirmation Successor Patch

on:
  push:
    branches:
      - integration/v14-capture-final-explicit-confirmation-sol
    paths:
      - .github/workflows/capture-explicit-confirmation-successor-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-final-explicit-confirmation-sol
          fetch-depth: 0
      - name: Apply production repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_explicit_confirmation_patch.py
          rm Scripts/apply_capture_explicit_confirmation_patch.py
          rm .github/workflows/capture-explicit-confirmation-successor-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): require explicit target confirmation on final spine"
          git push origin HEAD:integration/v14-capture-final-explicit-confirmation-sol
