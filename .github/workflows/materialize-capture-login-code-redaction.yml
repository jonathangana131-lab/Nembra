name: Materialize Capture login code redaction

on:
  push:
    branches:
      - fix/v14-capture-login-code-redaction-3f269-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product ancestry and owned paths
        shell: bash
        run: |
          set -euo pipefail
          expected=3f26906d68c6d886fa5c19a3349f7c538e5392a6
          test "$(git merge-base "$expected" HEAD)" = "$expected"
          unexpected="$(git diff --name-only "$expected"...HEAD | grep -Ev '^(Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift|\.github/workflows/materialize-capture-login-code-redaction.yml)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changed paths:"; echo "$unexpected"; exit 1; }

      - name: Fence exact account-authorizer source section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = s.index("@MainActor\nprivate final class OfficialTuyaAccountAuthorizer")
          end = s.index("@MainActor\nprivate struct SecureLinkView: View", start)
          a = s[start:end]
          assert a.count("self?.finishLoginFailure(error, submittedIdentity: identity)") == 2
          assert a.count("    private func finishLoginFailure(") == 1
          assert a.count("    private static func redactedError(") == 1
          PY

      - name: Forward snapshotted verification code on both login failures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          s = p.read_text()
          old = "self?.finishLoginFailure(error, submittedIdentity: identity)"
          new = "self?.finishLoginFailure(error, submittedIdentity: identity, submittedVerificationCode: code)"
          assert s.count(old) == 2
          p.write_text(s.replace(old, new))
          PY

      - name: Carry the verification-code snapshot through login failure finalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          s = p.read_text()
          start = s.index("    private func finishLoginFailure(")
          end = s.index("    private func finishAppleLoginFailure", start)
          replacement = (
              "    private func finishLoginFailure(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String) {\n"
              "        busy = false\n"
              "        verificationCode = \"\"\n"
              "        loggedIn = OfficialTuyaFactory.accountLoggedIn\n"
              "        status = \"Tuya SDK login failed: \\(Self.redactedError(error, submittedIdentity: submittedIdentity, submittedVerificationCode: submittedVerificationCode))\"\n"
              "    }\n\n"
          )
          p.write_text(s[:start] + replacement + s[end:])
          PY

      - name: Redact account identity and verification code independently
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          s = p.read_text()
          class_start = s.index("@MainActor\nprivate final class OfficialTuyaAccountAuthorizer")
          class_end = s.index("@MainActor\nprivate struct SecureLinkView: View", class_start)
          a = s[class_start:class_end]
          scrub_start = a.index("    private static func redactedError(")
          class_close = a.rfind("\n}\n")
          assert class_close > scrub_start
          replacement = (
              "    private static func redactedError(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String) -> String {\n"
              "        var redacted = error?.localizedDescription ?? \"unknown error\"\n"
              "        let identity = submittedIdentity.trimmingCharacters(in: .whitespacesAndNewlines)\n"
              "        if !identity.isEmpty {\n"
              "            redacted = redacted.replacingOccurrences(\n"
              "                of: identity,\n"
              "                with: \"<redacted-account>\",\n"
              "                options: [.caseInsensitive, .literal]\n"
              "            )\n"
              "        }\n"
              "        let verificationCode = submittedVerificationCode.trimmingCharacters(in: .whitespacesAndNewlines)\n"
              "        if !verificationCode.isEmpty {\n"
              "            redacted = redacted.replacingOccurrences(\n"
              "                of: verificationCode,\n"
              "                with: \"<redacted-verification-code>\",\n"
              "                options: [.caseInsensitive, .literal]\n"
              "            )\n"
              "        }\n"
              "        return redacted\n"
              "    }\n\n"
              "    private static func redactedError(_ error: Error?, submittedIdentity: String) -> String {\n"
              "        redactedError(error, submittedIdentity: submittedIdentity, submittedVerificationCode: \"\")\n"
              "    }"
          )
          a = a[:scrub_start] + replacement + a[class_close:]
          p.write_text(s[:class_start] + a + s[class_end:])
          PY

      - name: Verify strengthened credential-custody source contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = source.index("@MainActor\nprivate final class OfficialTuyaAccountAuthorizer")
          end = source.index("@MainActor\nprivate struct SecureLinkView: View", start)
          a = source[start:end]
          forwarded = "finishLoginFailure(error, submittedIdentity: identity, submittedVerificationCode: code)"
          assert a.count(forwarded) == 2
          assert "private func finishLoginFailure(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String)" in a
          assert "Self.redactedError(error, submittedIdentity: submittedIdentity, submittedVerificationCode: submittedVerificationCode)" in a
          assert "private static func redactedError(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String) -> String" in a
          assert "let verificationCode = submittedVerificationCode.trimmingCharacters(in: .whitespacesAndNewlines)" in a
          assert "of: verificationCode" in a
          assert 'with: "<redacted-verification-code>"' in a
          assert "of: identity" in a
          assert 'with: "<redacted-account>"' in a
          failure = a[a.index("private func finishLoginFailure("):a.index("private func finishAppleLoginFailure")]
          assert 'verificationCode = ""' in failure
          assert "submittedVerificationCode" in failure
          PY
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift
          git diff --check

      - name: Commit product repair and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-login-code-redaction.yml
          git config user.name "nembra-sol-worker"
          git config user.email "nembra-sol-worker@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift .github/workflows/materialize-capture-login-code-redaction.yml
          git diff --cached --check
          git commit -m "fix(capture): redact Tuya login verification codes"
          git push origin HEAD:fix/v14-capture-login-code-redaction-3f269-sol
