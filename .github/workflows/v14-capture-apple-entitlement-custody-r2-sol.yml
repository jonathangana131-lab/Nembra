name: V14 Capture Apple Entitlement Custody R2 Sol

on:
  push:
    branches:
      - truth/v14-capture-apple-entitlement-custody-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: truth/v14-capture-apple-entitlement-custody-sol
          fetch-depth: 0
      - name: Guard previous clean subject
        run: git merge-base --is-ancestor ddc18cae8eef872b0cdabf418292204d640281cc HEAD
      - name: Harden Apple verifier process custody
        run: python3 scripts/ci/materialize_capture_apple_entitlement_custody_r2.py
      - name: Verify source contracts
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          python3 scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          git diff --check
      - name: Commit clean hardened successor
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-apple-entitlement-custody-r2-sol.yml
          rm scripts/ci/materialize_capture_apple_entitlement_custody_r2.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): harden Apple entitlement verifier custody"
          git push origin HEAD:truth/v14-capture-apple-entitlement-custody-sol
