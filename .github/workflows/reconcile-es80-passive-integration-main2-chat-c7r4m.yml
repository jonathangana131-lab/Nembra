name: Reconcile ES80 passive integration with current main 2

on:
  push:
    branches:
      - parallel/recover-es80-passive-integration/chat-c7r4m

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact accepted passive product
        uses: actions/checkout@v6
        with:
          fetch-depth: 12

      - name: Verify immutable pre-reconcile product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=4b3c4c17ab6e8fec5162f00720f710281b1070bf
          WORKFLOW=.github/workflows/reconcile-es80-passive-integration-main2-chat-c7r4m.yml
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git diff --name-only "$PRODUCT" HEAD)" = "$WORKFLOW"

      - name: Merge exact current main and preserve its new presentation slice
        shell: bash
        run: |
          set -euo pipefail
          MAIN=92e752e69ff6def4e2f4b3a92c173fc89a122a42
          WORKFLOW=.github/workflows/reconcile-es80-passive-integration-main2-chat-c7r4m.yml
          PRESENTATION=Packages/NembraCore/Sources/NembraCore/RideAverageSpeedStatisticsPresentation.swift
          PRESENTATION_TEST=Packages/NembraCore/Tests/NembraCoreTests/RideAverageSpeedStatisticsPresentationTests.swift

          git fetch --no-tags origin "$MAIN"
          git config user.name "nembra-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-commit --no-ff "$MAIN"
          git rm "$WORKFLOW"

          # The new main-only #382 product must survive byte-for-byte.
          test "$(git hash-object "$PRESENTATION")" = "$(git rev-parse "$MAIN:$PRESENTATION")"
          test "$(git hash-object "$PRESENTATION_TEST")" = "$(git rev-parse "$MAIN:$PRESENTATION_TEST")"

          git diff --check "$MAIN"
          test "$(git diff --name-only "$MAIN" | wc -l | tr -d ' ')" = 45
          test -z "$(git diff --name-only "$MAIN" -- .github/workflows NembraApp NembraAppTests NembraUITests)"
          test "$(git diff --numstat "$MAIN" -- Packages/NembraCore/Package.swift)" = $'4\t0\tPackages/NembraCore/Package.swift'

          while IFS=$'\t' read -r status path rest; do
            case "$path" in
              Packages/NembraBluetoothCapture/*)
                test "$status" = A
                ;;
              Packages/NembraCore/Package.swift)
                test "$status" = M
                ;;
              Packages/NembraCore/Sources/NembraCore/PassiveBluetoothCapture.swift|\
              Packages/NembraCore/Tests/NembraCoreTests/PassiveBluetoothCaptureTests.swift|\
              docs/ES80_COREBLUETOOTH_CAPTURE_ADAPTER.md|\
              docs/ES80_PHYSICAL_CAPTURE_RUNBOOK.md|\
              docs/ES80_PROTOCOL_CAPTURE.md)
                test "$status" = A
                ;;
              *)
                echo "Unexpected reconciled passive path: $status $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-status "$MAIN")

          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 integration must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

          git commit -m "[recover es80 passive integration] Reconcile ride presentation main"
          git push origin "HEAD:${GITHUB_REF_NAME}"
