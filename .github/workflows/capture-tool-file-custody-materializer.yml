name: Capture Tool File Custody Materializer

on:
  push:
    branches:
      - repair/v14-field-tool-file-custody-sol-go-20260811
    paths:
      - .github/workflows/capture-tool-file-custody-materializer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind construction seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "80c28d0dbb5bf66aa3bbfed7cf780c7a4b216482"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-tool-file-custody-materializer.yml"

      - name: Materialize production repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          installer = Path("scripts/field/install_one_time_capture.command")
          source = installer.read_text(encoding="utf-8")

          old_helper = '''current = Path(path.anchor)
          for component in path.parts[1:]:
              current = current / component
              try:
                  metadata = os.lstat(current)
              except OSError as error:
                  raise SystemExit("selected Xcode custody ancestry is unavailable") from error
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                  raise SystemExit("selected Xcode custody requires real directory ancestry")
              if metadata.st_uid != 0 or metadata.st_mode & 0o022:
                  raise SystemExit("selected Xcode custody requires root-owned non-group/world-writable ancestry")
          if kind != "directory" or not path.is_dir():
              raise SystemExit("selected Xcode custody expected one directory")
          '''
          new_helper = '''if kind not in {"directory", "file"}:
              raise SystemExit("selected Xcode custody expected a directory or regular file")
          current = Path(path.anchor)
          components = path.parts[1:]
          for index, component in enumerate(components):
              current = current / component
              try:
                  metadata = os.lstat(current)
              except OSError as error:
                  raise SystemExit("selected Xcode custody ancestry is unavailable") from error
              is_leaf_file = kind == "file" and index == len(components) - 1
              if is_leaf_file:
                  if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                      raise SystemExit("selected Xcode custody requires one real regular-file executable subject")
                  if metadata.st_uid != 0 or metadata.st_mode & 0o022:
                      raise SystemExit("selected Xcode custody requires a root-owned non-group/world-writable executable file")
              else:
                  if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                      raise SystemExit("selected Xcode custody requires real directory ancestry")
                  if metadata.st_uid != 0 or metadata.st_mode & 0o022:
                      raise SystemExit("selected Xcode custody requires root-owned non-group/world-writable ancestry")
          if kind == "directory" and not path.is_dir():
              raise SystemExit("selected Xcode custody expected one directory")
          if kind == "file" and not path.is_file():
              raise SystemExit("selected Xcode custody expected one regular file")
          '''
          if source.count(old_helper) != 1:
              raise SystemExit("selected-Xcode custody helper seed drifted")
          source = source.replace(old_helper, new_helper, 1)

          old_selection = '''validate_root_custodied_path "$(dirname "$SELECTED_XCODEBUILD")" directory || die "Selected xcodebuild parent escaped trusted root custody."
          [[ -f "$SELECTED_XCODEBUILD" && -x "$SELECTED_XCODEBUILD" && ! -L "$SELECTED_XCODEBUILD" ]] || die "Selected xcodebuild is not one real executable under the admitted Xcode tree."
          say "Selected Xcode 27 developer tree admitted under root custody"
          '''
          new_selection = '''validate_root_custodied_path "$(dirname "$SELECTED_XCODEBUILD")" directory || die "Selected xcodebuild parent escaped trusted root custody."
          validate_root_custodied_path "$SELECTED_XCODEBUILD" file || die "Selected xcodebuild executable is not under exact root/nonwritable file custody."
          [[ -x "$SELECTED_XCODEBUILD" ]] || die "Selected xcodebuild is not executable."
          SELECTED_XCTRACE="$(DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun --find xctrace)"
          readonly SELECTED_XCTRACE
          [[ "$SELECTED_XCTRACE" == "$SELECTED_DEVELOPER_DIR"/* ]] || die "Selected xctrace escaped the admitted Xcode developer tree."
          validate_root_custodied_path "$SELECTED_XCTRACE" file || die "Selected xctrace executable is not under exact root/nonwritable file custody."
          [[ -x "$SELECTED_XCTRACE" ]] || die "Selected xctrace is not executable."
          SELECTED_DEVICECTL="$(DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun --find devicectl)"
          readonly SELECTED_DEVICECTL
          [[ "$SELECTED_DEVICECTL" == "$SELECTED_DEVELOPER_DIR"/* ]] || die "Selected devicectl escaped the admitted Xcode developer tree."
          validate_root_custodied_path "$SELECTED_DEVICECTL" file || die "Selected devicectl executable is not under exact root/nonwritable file custody."
          [[ -x "$SELECTED_DEVICECTL" ]] || die "Selected devicectl is not executable."
          say "Selected Xcode 27 developer tree and exact physical tool executables admitted under root custody"
          '''
          if source.count(old_selection) != 1:
              raise SystemExit("selected-Xcode tool selection seed drifted")
          source = source.replace(old_selection, new_selection, 1)

          duplicate_devicectl = 'DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun devicectl'
          source = source.replace(duplicate_devicectl, 'DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" "$SELECTED_DEVICECTL"')
          source = source.replace('DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun devicectl', 'DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" "$SELECTED_DEVICECTL"')
          source = source.replace('DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun xctrace', 'DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" "$SELECTED_XCTRACE"')
          if '/usr/bin/xcrun devicectl' in source or '/usr/bin/xcrun xctrace' in source:
              raise SystemExit("physical tool execution still re-resolves through xcrun")
          if '"$SELECTED_XCTRACE" list devices' not in source:
              raise SystemExit("exact xctrace subject is not consumed")
          if '"$SELECTED_DEVICECTL" list devices' not in source:
              raise SystemExit("exact devicectl subject is not consumed")
          installer.write_text(source, encoding="utf-8")

          workflow = Path(".github/workflows/capture-field-selected-xcode-custody.yml")
          text = workflow.read_text(encoding="utf-8")
          path_marker = '      - scripts/ci/tests/test_capture_field_selected_xcode_custody.py\n'
          if text.count(path_marker) != 1:
              raise SystemExit("selected-Xcode workflow path seed drifted")
          text = text.replace(path_marker, path_marker + '      - scripts/ci/tests/test_capture_field_selected_xcode_tool_file_custody.py\n', 1)
          compile_marker = '            scripts/ci/tests/test_capture_field_selected_xcode_custody.py \\\n'
          if text.count(compile_marker) != 1:
              raise SystemExit("selected-Xcode workflow compile seed drifted")
          text = text.replace(compile_marker, compile_marker + '            scripts/ci/tests/test_capture_field_selected_xcode_tool_file_custody.py \\\n', 1)
          run_marker = '          /usr/bin/python3 scripts/ci/tests/test_capture_field_selected_xcode_custody.py\n'
          if text.count(run_marker) != 1:
              raise SystemExit("selected-Xcode workflow run seed drifted")
          text = text.replace(run_marker, run_marker + '          /usr/bin/python3 scripts/ci/tests/test_capture_field_selected_xcode_tool_file_custody.py\n', 1)
          workflow.write_text(text, encoding="utf-8")

          Path(".github/workflows/capture-tool-file-custody-materializer.yml").unlink()
          PY

      - name: Focused authority validation
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile \
            scripts/ci/tests/test_capture_field_selected_xcode_custody.py \
            scripts/ci/tests/test_capture_field_selected_xcode_tool_file_custody.py \
            scripts/ci/tests/test_capture_field_xcrun_environment_authority.py \
            scripts/ci/tests/test_capture_field_xcode_environment_authority.py \
            scripts/ci/tests/test_capture_field_developer_dir_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_selected_xcode_custody.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_selected_xcode_tool_file_custody.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_xcrun_environment_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_xcode_environment_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_developer_dir_authority.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Publish clean durable repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-capture-bot"
          git config user.email "nembra-capture-bot@users.noreply.github.com"
          git add -A
          git commit -m "Capture P0: custody exact selected Xcode tool files"
          git push origin HEAD:repair/v14-field-tool-file-custody-sol-go-20260811
