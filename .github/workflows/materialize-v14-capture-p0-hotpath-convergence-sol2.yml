name: Materialize V14 Capture P0 Hotpath Convergence Sol2

on:
  push:
    branches:
      - integration/v14-capture-p0-hotpath-convergence-sol2

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-p0-hotpath-convergence-sol2
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact flagship parent and untouched hot path
        shell: bash
        run: |
          set -euo pipefail
          parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          entry='NembraApp/App/NembraCaptureEntrypoint.swift'
          expected_blob='49527449240a20aef3de76276085371fbbccae10'
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-parse "$parent:$entry")" = "$expected_blob"
          git diff --quiet "$parent" HEAD -- "$entry"
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = '.github/workflows/materialize-v14-capture-p0-hotpath-convergence-sol2.yml'

      - name: Recover reviewed regression contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests
          git fetch origin fad2d84671326b5b925c7feecde5c4181e8efcd9 a7ae9bf21c2cbfb4602556c678dc52cce6cd9aea 478522e148faa83961742d84dd5ed0e4c5f628b2 9888832c0e9a6989114f1b5e2156119c0b65d38d
          git show fad2d84671326b5b925c7feecde5c4181e8efcd9:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift
          git show a7ae9bf21c2cbfb4602556c678dc52cce6cd9aea:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          git show 478522e148faa83961742d84dd5ed0e4c5f628b2:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift
          git show 9888832c0e9a6989114f1b5e2156119c0b65d38d:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift

      - name: Compose lifecycle, recovery, and secret-custody repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              source = source.replace(old, new, 1)

          # #2377: a closed Secure Link view cannot mint fresh membership authority.
          replace_once(
              '    private var membershipRequestID = UUID()\n    private var officialConnectionRequestID = UUID()\n',
              '    private var membershipRequestID = UUID()\n    private var acceptsViewScopedMembershipRequests = false\n    private var officialConnectionRequestID = UUID()\n',
              'membership admission storage',
          )
          replace_once(
              '    deinit { watchdog?.cancel() }\n\n    func abandonCorrelationForViewExit() {\n',
              '    deinit { watchdog?.cancel() }\n\n    func activateMembershipRequestsForView() {\n        acceptsViewScopedMembershipRequests = true\n    }\n\n    func abandonCorrelationForViewExit() {\n',
              'membership activation method',
          )
          replace_once(
              '    func abandonCorrelationForViewExit() {\n        // Revoke every pre-radio asynchronous grant before inspecting current transport state.\n        // Late membership or ledger-generation work must not start OFF1/authentication off-screen.\n        membershipRequestID = UUID()\n',
              '    func abandonCorrelationForViewExit() {\n        // Close screen-lifetime admission before revoking every already-issued grant.\n        // Later SwiftUI/account callbacks cannot mint replacement membership authority off-screen.\n        acceptsViewScopedMembershipRequests = false\n        membershipRequestID = UUID()\n',
              'view-exit admission closure',
          )
          replace_once(
              '    func verifySDKMembership(completion: ((Bool) -> Void)? = nil) {\n        membershipAccountUID = nil\n',
              '    func verifySDKMembership(completion: ((Bool) -> Void)? = nil) {\n        guard acceptsViewScopedMembershipRequests else {\n            completion?(false)\n            return\n        }\n        membershipAccountUID = nil\n',
              'membership verification admission guard',
          )
          replace_once(
              '        .task {\n            sdkAccount.bootstrap()\n',
              '        .task {\n            test.activateMembershipRequestsForView()\n            sdkAccount.bootstrap()\n',
              'view appearance admission open',
          )

          # #2375: foreground integrity is an authority boundary, not a timer hint.
          marker = '    var privateConfig: Bool { OfficialTuyaFactory.configured }\n'
          if source.count(marker) != 1:
              raise SystemExit('foreground controller insertion marker mismatch')
          foreground_method = '''    func appDidLoseForeground() {
        // Capture evidence is foreground-only. Close view-scoped admission and revoke pending grants first.
        acceptsViewScopedMembershipRequests = false
        membershipRequestID = UUID()
        membershipBusy = false
#if canImport(ThingSmartHomeKit)
        membershipProbe = nil
#endif
        officialConnectionRequestID = UUID()
        watchdog?.cancel()
        watchdog = nil

        if processCorrelationLease != nil || correlationSession != nil {
            abandonPackageCorrelation()
            phase = .failed
            message = "Capture left the foreground during Bluetooth target correlation. Restart from OFF1; interrupted windows are never reusable evidence."
            log("foreground_integrity_lost_during_target_correlation")
            return
        }

        guard let token = currentConnectionToken else {
            if phase == .authenticating {
                localBLESettlementToken = nil
                sdkLocalBLEOnline = false
                driver = nil
                phase = .failed
                message = "Capture left the foreground during authentication. Relaunch before another authenticated attempt; no BLE disconnect is claimed."
                log("foreground_integrity_lost_before_observation")
            }
            return
        }

        let wasObserving = phase == .observing
        phase = .failed
        message = wasObserving
            ? "Capture left the foreground during authenticated observation. Restart from OFF1; background time is not accepted evidence and no BLE disconnect is claimed."
            : "Capture left the foreground before authenticated observation. Relaunch before another authenticated attempt; no BLE disconnect is claimed."
        log(
            wasObserving ? "foreground_integrity_lost_during_observation" : "foreground_integrity_lost_before_observation",
            ["generation": String(token.diagnosticGeneration)]
        )

        Task { @MainActor [weak self] in
            guard let self, self.currentConnectionToken == token else { return }
            if wasObserving {
                await self.invalidateObservationContinuity(
                    token: token,
                    message: "App foreground integrity was lost during authenticated observation. Restart from OFF1; background time is not accepted evidence and no BLE disconnect is claimed.",
                    kind: "foreground_integrity_lost_during_observation"
                )
            } else {
                await self.invalidateInternalLifecycle(
                    token: token,
                    message: "App foreground integrity was lost before authenticated observation. Relaunch before another authenticated attempt; no BLE disconnect is claimed.",
                    kind: "foreground_integrity_lost_before_observation"
                )
            }
        }
    }

'''
          source = source.replace(marker, foreground_method + marker, 1)
          replace_once(
              '    @Environment(\\.dynamicTypeSize) private var dynamicTypeSize\n',
              '    @Environment(\\.dynamicTypeSize) private var dynamicTypeSize\n    @Environment(\\.scenePhase) private var scenePhase\n',
              'scenePhase environment',
          )
          replace_once(
              '        .onDisappear {\n            test.abandonCorrelationForViewExit()\n        }\n\n',
              '        .onDisappear {\n            test.abandonCorrelationForViewExit()\n        }\n        .onChange(of: scenePhase) { _, newPhase in\n            if newPhase != .active {\n                test.appDidLoseForeground()\n            }\n        }\n\n',
              'scenePhase lifecycle observer',
          )

          # #2376: redact credential-shaped values recursively before controller/event custody.
          old_dps = '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
        guard let dps, !dps.isEmpty else { return }
        var sanitized: [String: String] = [:]
        for (key, value) in dps {
            sanitized[String(describing: key)] = String(describing: value)
        }
        onApplicationUpdate?(sanitized)
    }
'''
          new_dps = '''    private static let secretKeyFragments = [
        "localkey", "accesstoken", "refreshtoken", "authkey", "seckey"
    ]

    private static func redactApplicationSecrets(_ object: Any) -> Any {
        if let dictionary = object as? [AnyHashable: Any] {
            var redacted: [AnyHashable: Any] = [:]
            for (key, value) in dictionary {
                let normalized = String(describing: key).lowercased().filter { $0.isLetter || $0.isNumber }
                if secretKeyFragments.contains(where: normalized.contains) {
                    redacted[key] = "<redacted>"
                } else {
                    redacted[key] = redactApplicationSecrets(value)
                }
            }
            return redacted
        }
        if let array = object as? [Any] {
            return array.map(redactApplicationSecrets)
        }
        return object
    }

    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
        guard let dps, !dps.isEmpty else { return }
        var sanitized: [String: String] = [:]
        for (key, value) in dps {
            let keyString = String(describing: key)
            let normalized = keyString.lowercased().filter { $0.isLetter || $0.isNumber }
            if Self.secretKeyFragments.contains(where: normalized.contains) {
                sanitized[keyString] = "<redacted>"
            } else {
                sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))
            }
        }
        onApplicationUpdate?(sanitized)
    }
'''
          replace_once(old_dps, new_dps, 'application update redaction')

          # #2378: current procedure is stationary-only and post-handoff retry requires relaunch.
          replace_once(
              'Authenticated session produced no application update before the observation deadline. Export diagnostics; do not repeat the ride capture.',
              'Authenticated session produced no application update before the observation deadline. Export diagnostics; relaunch Capture before any new stationary read-only attempt.',
              'application timeout recovery copy',
          )
          replace_once(
              "Tuya's current local-BLE session ended before acceptance. Export diagnostics; do not repeat the outdoor ride capture.",
              "Tuya's current local-BLE session ended before acceptance. Export diagnostics; relaunch Capture before any new stationary read-only attempt.",
              'local BLE loss recovery copy',
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify composed hot-path invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = p.read_text(encoding='utf-8')
          controller = s[s.index('private final class SecureLinkController'):s.index('@MainActor\nprivate protocol OfficialTuyaDriver')]
          driver = s[s.index('@MainActor\nprivate final class SmartLifeDriver'):s.index('#endif\n\nprivate enum AppleAccountAuthorizationError')]

          assert 'acceptsViewScopedMembershipRequests = false' in controller
          assert 'guard acceptsViewScopedMembershipRequests else' in controller
          assert 'func activateMembershipRequestsForView()' in controller
          assert 'func appDidLoseForeground()' in controller
          foreground = controller[controller.index('func appDidLoseForeground()'):controller.index('var privateConfig: Bool')]
          assert foreground.index('acceptsViewScopedMembershipRequests = false') < foreground.index('membershipRequestID = UUID()')
          assert foreground.index('officialConnectionRequestID = UUID()') < foreground.index('if processCorrelationLease')
          assert 'abandonPackageCorrelation()' in foreground
          assert 'invalidateObservationContinuity(' in foreground
          assert 'invalidateInternalLifecycle(' in foreground
          for forbidden in ('releasePackageCorrelationLease()', 'recordObservedTransportLoss', 'endConnection', 'disconnectBLE', 'publishDps', 'queryDps', 'writeValue'):
              assert forbidden not in foreground, forbidden

          assert '@Environment(\\.scenePhase) private var scenePhase' in s
          assert '.onChange(of: scenePhase)' in s
          assert 'test.appDidLoseForeground()' in s

          for fragment in ('localkey', 'accesstoken', 'refreshtoken', 'authkey', 'seckey'):
              assert fragment in driver
          assert 'private static func redactApplicationSecrets(_ object: Any) -> Any' in driver
          assert 'array.map(redactApplicationSecrets)' in driver
          assert 'String(describing: Self.redactApplicationSecrets(value))' in driver
          assert 'sanitized[keyString] = "<redacted>"' in driver
          assert 'onApplicationUpdate?(sanitized)' in driver

          recovery = 'Export diagnostics; relaunch Capture before any new stationary read-only attempt.'
          assert controller.count(recovery) == 2
          assert 'ride capture' not in controller
          assert 'outdoor ride' not in controller

          # Keep the physical/command boundary closed.
          for forbidden in ('publishDps', 'queryDps', 'writeValue'):
              assert forbidden not in driver, forbidden
          print('V14 Capture P0 hot-path convergence source invariants: PASS')
          PY
          git diff --check
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          fi

      - name: Collapse helper into clean product convergence
        shell: bash
        run: |
          set -euo pipefail
          parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          git config user.name 'nembra-sol-integration-closer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-v14-capture-p0-hotpath-convergence-sol2.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          git diff --cached --check
          git commit -m 'fix(capture): converge final secure-link hot-path truth'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          test "${#changed[@]}" = 5
          printf '%s\n' "${changed[@]}"
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift'
          test "${changed[2]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift'
          test "${changed[3]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift'
          test "${changed[4]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:integration/v14-capture-p0-hotpath-convergence-sol2
