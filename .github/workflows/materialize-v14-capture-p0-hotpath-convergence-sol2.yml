name: Materialize Capture P0 Hotpath Convergence

on:
  push:
    branches:
      - integration/v14-capture-p0-hotpath-convergence-sol2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-p0-hotpath-convergence-sol2
          fetch-depth: 0
          persist-credentials: true
      - name: Build clean exact-parent convergence
        run: python3 scripts/ci/materialize_v14_capture_p0_hotpath_convergence_sol2.py
