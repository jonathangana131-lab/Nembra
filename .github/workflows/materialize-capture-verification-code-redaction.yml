name: Materialize Capture Verification Code Redaction

on:
  push:
    branches: [fix/v14-capture-verification-code-redaction-sol]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-verification-code-redaction-sol
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact product source
        run: |
          set -euo pipefail
          parent=52333deb09ea9a5964250097f83884d285f25d78
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Materialize and validate custody repair
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_verification_code_redaction.py
          python3 -m py_compile scripts/ci/materialize_capture_verification_code_redaction.py
          git diff --check
      - name: Publish clean repair
        run: |
          set -euo pipefail
          parent=52333deb09ea9a5964250097f83884d285f25d78
          rm .github/workflows/materialize-capture-verification-code-redaction.yml
          rm scripts/ci/materialize_capture_verification_code_redaction.py
          git add -A
          git diff --cached --check
          git config user.name nembra-sol
          git config user.email nembra-sol@users.noreply.github.com
          git commit -m 'fix(capture): redact Tuya verification codes from errors'
          test "$(git diff --name-only "$parent" HEAD | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift' | sort)"
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-verification-code-redaction-sol
