name: Materialize Install Helper Execution Custody

on:
  push:
    branches:
      - scratch/v14-install-helper-exec-materializer-gpt56-sol
    paths:
      - .github/workflows/materialize-install-helper-exec-custody.yml
      - scripts/ci/materialize_install_helper_exec_custody.py
      - scripts/ci/fix_install_helper_exec_materializer_quote.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/v14-install-helper-exec-materializer-gpt56-sol
          fetch-depth: 0

      - name: Preserve transform then move to product branch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ci/materialize_install_helper_exec_custody.py /tmp/materialize_install_helper_exec_custody.py
          cp scripts/ci/fix_install_helper_exec_materializer_quote.py /tmp/fix_install_helper_exec_materializer_quote.py
          /usr/bin/python3 /tmp/fix_install_helper_exec_materializer_quote.py /tmp/materialize_install_helper_exec_custody.py
          git fetch origin repair/v14-capture-signed-app-install-custody-gpt56-sol
          git checkout -B repair/v14-capture-signed-app-install-custody-gpt56-sol origin/repair/v14-capture-signed-app-install-custody-gpt56-sol
          /usr/bin/python3 /tmp/materialize_install_helper_exec_custody.py

      - name: Check materialized diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          git diff --name-only --exit-code -- scripts/ci/capture_signed_app_install_custody.py

      - name: Run source-contract regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_install_custody.py

      - name: Check installer shell syntax
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -n scripts/field/install_one_time_capture.command

      - name: Reject generated bytecode residue
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"

      - name: Publish hardening and remove scratch branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nembra Capture Sol"
          git config user.email "nembra-capture-sol@users.noreply.github.com"
          git add scripts/field/install_one_time_capture.command scripts/ci/tests/test_capture_signed_app_install_custody.py
          git diff --cached --check
          git commit -m "fix(capture): protect custody helper execution subject"
          git push origin HEAD:repair/v14-capture-signed-app-install-custody-gpt56-sol
          git push origin --delete scratch/v14-install-helper-exec-materializer-gpt56-sol || true
