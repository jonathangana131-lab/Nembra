name: Capture Final GO Main Ancestry Recovery Materializer

on:
  push:
    branches:
      - repair/v14-final-go-main-ancestry-recovery-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact current control-plane parent
        shell: bash
        run: |
          set -euo pipefail
          parent=4ed846079bbb3b56f1b4e7f71bc53aa4f47707a5
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          test "$(git diff --name-only "$parent" HEAD)" = '.github/workflows/capture-final-go-main-ancestry-recovery-materializer.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git cat-file -e 36feddadc1b5bcfb28274b2e7e5f1d3d341e3335^{commit}

      - name: Recover validated exact-main slices only
        shell: bash
        run: |
          set -euo pipefail
          git show 36feddadc1b5bcfb28274b2e7e5f1d3d341e3335:scripts/ci/es80_authenticated_stationary_final_go.py > /tmp/hardened_issuer.py
          git show 36feddadc1b5bcfb28274b2e7e5f1d3d341e3335:scripts/ci/tests/test_es80_authenticated_stationary_final_go.py > /tmp/hardened_tests.py
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          issuer=Path('scripts/ci/es80_authenticated_stationary_final_go.py')
          s=issuer.read_text(); h=Path('/tmp/hardened_issuer.py').read_text()

          # Exact software-main admission was already validated in #2659. Replace only public().
          c0=s.index('def public('); c1=s.index('\ndef control_plane(',c0)
          h0=h.index('def public('); h1=h.index('\ndef control_plane(',h0)
          s=s[:c0]+h[h0:h1]+s[c1:]

          # Apply the same current-main ancestry rule to the control-plane subject itself.
          guard='    if canon(head.get("sha"),"GO control-plane PR head")!=source or head.get("repo",{}).get("full_name")!=REPO or base.get("ref")!="main" or not ((state=="open" and draft is False) or (state=="closed" and merged)): raise GoError("GO control-plane PR is not exact/promotable")\n'
          insert=(
              '    _,main=get("/branches/main"); main_sha=canon(main.get("commit",{}).get("sha"),"current main")\n'
              '    _,comparison=get(f"/compare/{main_sha}...{source}"); merge_base=comparison.get("merge_base_commit",{})\n'
              '    if comparison.get("status") not in {"ahead","identical"} or canon(merge_base.get("sha"),"GO control-plane main merge base")!=main_sha: raise GoError("GO control plane does not contain the exact current main authority")\n'
          )
          if s.count(guard)!=1: raise SystemExit('control-plane guard drift')
          s=s.replace(guard,guard+insert,1)
          ret='    return {"authority":"nembra-authenticated-stationary-go-control-plane-v1","sourceCommitSHA":source,"prNumber":pr,"headBranch":branch,"state":state,"merged":merged,"draft":draft,"workflowRunID":run_id,"workflowName":AUTH_WORKFLOW_NAME,"workflowPath":AUTH_WORKFLOW_PATH,"gitBlobs":blobs}\n'
          ret2='    return {"authority":"nembra-authenticated-stationary-go-control-plane-v1","sourceCommitSHA":source,"prNumber":pr,"headBranch":branch,"mainSHA":main_sha,"state":state,"merged":merged,"draft":draft,"workflowRunID":run_id,"workflowName":AUTH_WORKFLOW_NAME,"workflowPath":AUTH_WORKFLOW_PATH,"gitBlobs":blobs}\n'
          if s.count(ret)!=1: raise SystemExit('control-plane return drift')
          s=s.replace(ret,ret2,1)
          stable='    stable_pr=("number","headSHA","headBranch","base","state","merged","draft")\n'
          if s.count(stable)!=1: raise SystemExit('stable PR drift')
          s=s.replace(stable,'    stable_pr=("number","headSHA","headBranch","base","mainSHA","state","merged","draft")\n',1)
          issuer.write_text(s)

          tests=Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go.py')
          t=tests.read_text(); ht=Path('/tmp/hardened_tests.py').read_text()
          c0=t.index(' def get(self,p):'); c1=t.index(' def control(',c0)
          h0=ht.index(' def get(self,p):'); h1=ht.index(' def control(',h0)
          t=t[:c0]+ht[h0:h1]+t[c1:]

          # Reuse the validated software-main + post-install-main drift tests, but not the
          # older candidate-worktree test because #2668 already owns that implementation.
          h0=ht.index(' def test_current_main_is_bound_and_must_be_candidate_ancestor')
          h1=ht.index(' def test_candidate_rejects_hidden_index_flags_and_worktree_byte_drift',h0)
          addition=ht[h0:h1]
          marker=' def test_post_install_revalidation_rejects_pr_artifact_review_or_device_drift(self):\n'
          if t.count(marker)!=1: raise SystemExit('test insertion drift')
          t=t.replace(marker,addition+marker,1)
          tests.write_text(t)
          PY

      - name: Validate full current authority stack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/es80_authenticated_stationary_signed_artifact.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          grep -Fq 'mainSHA' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'GO control plane does not contain the exact current main authority' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'candidate authority path has suppressed index worktree tracking' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'hash-object","--no-filters"' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'canonical_private_path(device,"private intended-device identifier")' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'env=installer_environment(device)' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'stable_pr=("number","headSHA","headBranch","base","mainSHA","state","merged","draft")' scripts/ci/es80_authenticated_stationary_final_go.py
          git diff --check

      - name: Publish clean exact-main recovery
        shell: bash
        run: |
          set -euo pipefail
          parent=4ed846079bbb3b56f1b4e7f71bc53aa4f47707a5
          git rm .github/workflows/capture-final-go-main-ancestry-recovery-materializer.yml
          git add scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          expected="$({ printf '%s\n' 'scripts/ci/es80_authenticated_stationary_final_go.py' 'scripts/ci/tests/test_es80_authenticated_stationary_final_go.py'; } | sort)"
          actual="$(git diff --cached --name-only "$parent" | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name 'jonathangana131-lab'
          git config user.email 'jonathangana131@gmail.com'
          git commit -m 'fix(capture): bind Final GO subjects to exact current main'
          git push origin HEAD:repair/v14-final-go-main-ancestry-recovery-sol
