name: V14 Capture Account UID Reentrancy Materializer
on:
  push:
    branches: [repair/v14-capture-account-uid-reentrancy-ba3a-sol]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: repair/v14-capture-account-uid-reentrancy-ba3a-sol
      - name: Assert exact parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/v14-capture-account-uid-reentrancy-materializer.yml'
      - name: Repair immutable UID custody snapshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s=p.read_text()
          guard_old='''        guard sdkAccountLoggedIn,
              sdkDeviceMembershipVerified,
              accountIdentityLeaseIsAuthorized,
              let driver else {
          '''
          guard_new='''        guard sdkAccountLoggedIn,
              sdkDeviceMembershipVerified,
              accountIdentityLeaseIsAuthorized,
              let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),
              !verifiedAccountUID.isEmpty,
              let driver else {
          '''
          if s.count(guard_old) != 1: raise SystemExit(f'guard seam drifted: {s.count(guard_old)}')
          s=s.replace(guard_old,guard_new,1)
          call_old='var eventDetails = redactedApplicationEventDetails(update)'
          call_new='var eventDetails = redactedApplicationEventDetails(update, verifiedAccountUID: verifiedAccountUID)'
          if s.count(call_old) != 1: raise SystemExit(f'custody call drifted: {s.count(call_old)}')
          s=s.replace(call_old,call_new,1)

          start=s.index('    private func redactedApplicationEventDetails(')
          end=s.index('    private func startWatchdog', start)
          helper=s[start:end]
          old_prefix='''    private func redactedApplicationEventDetails(_ update: [String: String]) -> [String: String] {
        guard let accountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),
              !accountUID.isEmpty else {
            return update
        }

          '''
          new_prefix='''    private func redactedApplicationEventDetails(
        _ update: [String: String],
        verifiedAccountUID: String
    ) -> [String: String] {
          '''
          if helper.count(old_prefix) != 1: raise SystemExit('helper authority prefix drifted')
          helper=helper.replace(old_prefix,new_prefix,1)
          if helper.count('of: accountUID,') != 2: raise SystemExit(f'expected two UID replacements, found {helper.count("of: accountUID,")}')
          helper=helper.replace('of: accountUID,','of: verifiedAccountUID,')
          assignment='''            redacted[redactedKey] = value.replacingOccurrences(
                of: verifiedAccountUID,
                with: "<redacted-account-uid>",
                options: [.caseInsensitive, .literal]
            )
          '''
          collision_safe='''            let redactedValue = value.replacingOccurrences(
                of: verifiedAccountUID,
                with: "<redacted-account-uid>",
                options: [.caseInsensitive, .literal]
            )
            var uniqueKey = redactedKey
            var collisionSuffix = 2
            while redacted[uniqueKey] != nil {
                uniqueKey = "\(redactedKey)#\(collisionSuffix)"
                collisionSuffix += 1
            }
            redacted[uniqueKey] = redactedValue
          '''
          if helper.count(assignment) != 1: raise SystemExit('redacted-key assignment seam drifted')
          helper=helper.replace(assignment,collision_safe,1)
          s=s[:start]+helper+s[end:]
          p.write_text(s)
          PY
      - name: Strengthen source contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift')
          s=p.read_text()
          old='''        #expect(receiver.contains("redactedApplicationEventDetails(update)"))
        #expect(receiver.contains("membershipAccountUID?.trimmingCharacters"))
        #expect(receiver.contains("let redactedKey = key.replacingOccurrences("))
        #expect(receiver.contains("value.replacingOccurrences("))
        #expect(receiver.contains("<redacted-account-uid>"))
        #expect(receiver.contains("options: [.caseInsensitive, .literal]"))
        #expect(!receiver.contains("log(\\"tuya_application_update\\", update"))
          '''
          new='''        #expect(receiver.contains("let verifiedAccountUID = membershipAccountUID?.trimmingCharacters"))
        #expect(receiver.contains("redactedApplicationEventDetails(update, verifiedAccountUID: verifiedAccountUID)"))
        #expect(receiver.contains("verifiedAccountUID: String"))
        #expect(receiver.contains("let redactedKey = key.replacingOccurrences("))
        #expect(receiver.contains("let redactedValue = value.replacingOccurrences("))
        #expect(receiver.contains("while redacted[uniqueKey] != nil"))
        #expect(receiver.contains("<redacted-account-uid>"))
        #expect(receiver.contains("options: [.caseInsensitive, .literal]"))
        #expect(!receiver.contains("log(\\"tuya_application_update\\", update"))

        let uidSnapshot = try #require(receiver.range(of: "let verifiedAccountUID = membershipAccountUID?.trimmingCharacters"))
        let firstSuspension = try #require(receiver.range(of: "await "))
        #expect(uidSnapshot.lowerBound < firstSuspension.lowerBound)

        let helper = String(try section(in: receiver, from: "private func redactedApplicationEventDetails(", to: "private func startWatchdog"))
        #expect(!helper.contains("membershipAccountUID"))
        #expect(!helper.contains("return update"))
          '''
          if s.count(old) != 1: raise SystemExit('existing UID test assertion seam drifted')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Prove exact source contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          receiver=s.split('    private func receivedApplicationUpdate(',1)[1].split('    private func startWatchdog',1)[0]
          assert receiver.index('let verifiedAccountUID = membershipAccountUID?.trimmingCharacters') < receiver.index('await ')
          assert 'redactedApplicationEventDetails(update, verifiedAccountUID: verifiedAccountUID)' in receiver
          helper=receiver.split('    private func redactedApplicationEventDetails(',1)[1]
          assert 'membershipAccountUID' not in helper
          assert 'return update' not in helper
          assert 'verifiedAccountUID: String' in helper
          assert helper.count('of: verifiedAccountUID,') == 2
          assert 'while redacted[uniqueKey] != nil' in helper
          assert 'redacted[uniqueKey] = redactedValue' in helper
          PY
          T=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          git add NembraApp/App/NembraCaptureEntrypoint.swift "$T"
          git diff --cached --check
          mapfile -t paths < <(git diff --cached --name-only HEAD)
          test "${#paths[@]}" = 2
          test -z "$(git status --short | grep '^??' || true)"
      - name: Commit durable checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-capture-account-uid-reentrancy-materializer.yml
          git commit -m 'fix(capture): snapshot UID custody across suspension'
          git push origin HEAD:repair/v14-capture-account-uid-reentrancy-ba3a-sol
