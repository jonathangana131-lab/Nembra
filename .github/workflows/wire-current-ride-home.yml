name: Add current ride Home surface

on:
  push:
    branches:
      - feature/ride-application

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ride-application
          fetch-depth: 0

      - name: Patch and validate Home
        run: |
          python3 scripts/patch_home_current_ride.py
          git diff --check

      - name: Commit Home surface and remove one-shot patchers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wire-current-ride-home.yml scripts/patch_home_current_ride.py
          git add NembraApp/Features/Home/HomeView.swift
          git commit -m 'feat: surface confirmed automatic ride state on Home'
          git push origin HEAD:feature/ride-application
