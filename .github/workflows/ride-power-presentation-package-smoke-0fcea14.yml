name: Ride Power Presentation Package Smoke 0fcea14

on:
  push:
    branches:
      - qa/ride-power-presentation-package-smoke/chat-h4n7q-0fcea14

permissions:
  contents: read

jobs:
  nembra-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify immutable product parent and workflow-only delta
        shell: bash
        run: |
          set -euo pipefail
          product_sha="0fcea14d1706665eb01484a9e7850488bed26679"
          test "$(git rev-parse HEAD^)" = "$product_sha"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/ride-power-presentation-package-smoke-0fcea14.yml"

      - name: Run full NembraCore suite with Swift 6.2 warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/Packages/NembraCore \
            swift:6.2 \
            bash -lc 'swift --version && swift test -Xswiftc -warnings-as-errors'
