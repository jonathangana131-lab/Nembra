name: Harden Capture Application Secret Redaction Ordering

on:
  push:
    branches:
      - sol/v14-capture-application-secret-value-custody-d56a

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact semantic checkpoint
        shell: bash
        run: |
          set -euo pipefail
          semantic='69a361c22d9a39f8671d7a4a5b6d2797232e16a4'
          test "$(git rev-parse HEAD^)" = "$semantic"
          mapfile -t helper < <(git diff --name-only "$semantic"...HEAD | sort)
          test "${#helper[@]}" = 1
          test "${helper[0]}" = '.github/workflows/harden-capture-application-secret-ordering.yml'
          grep -Fq 'private static var exactSecretValues: [String]' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq '$0.count > $1.count' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Enforce deterministic longest-first exact-secret redaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          start = source.index('    private static var exactSecretValues: [String] {')
          end = source.index('    private static func redactingExactApplicationSecrets', start)
          block = source[start:end]
          old = '        ].filter { !$0.isEmpty }\n#else'
          new = '''        ].filter { !$0.isEmpty }
            .sorted {
                if $0.count != $1.count { return $0.count > $1.count }
                return $0 < $1
            }
#else'''
          if block.count(old) != 1:
              raise SystemExit('exactSecretValues filter seam did not match exactly once')
          block = block.replace(old, new, 1)
          source = source[:start] + block + source[end:]
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Validate overlap-secret custody contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = source.index('    private static var exactSecretValues: [String] {')
          end = source.index('    private static func redactApplicationSecrets', start)
          sanitizer = source[start:end]
          assert '.filter { !$0.isEmpty }' in sanitizer
          assert '.sorted {' in sanitizer
          assert '$0.count > $1.count' in sanitizer
          assert 'return $0 < $1' in sanitizer
          assert 'options: [.literal]' in sanitizer

          # Adversarial overlap probe for the pinned longest-first algorithm:
          # a shorter AppKey that prefixes AppSecret must not expose the suffix.
          secrets = ['abc', 'abcdef']
          ordered = sorted((s for s in secrets if s), key=lambda s: (-len(s), s))
          rendered = 'opaque=abcdef;key=abc'
          for secret in ordered:
              rendered = rendered.replace(secret, '<redacted>')
          assert 'abc' not in rendered and 'def' not in rendered, rendered
          print('longest-first overlap-secret probe: PASS')
          PY
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift

      - name: Collapse helper and preserve two-path semantic scope
        shell: bash
        run: |
          set -euo pipefail
          base='d56a30c699fbdecec6130537d3f3f4f4232f5c47'
          rm .github/workflows/harden-capture-application-secret-ordering.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git add -u .github/workflows/harden-capture-application-secret-ordering.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' \
            commit -m 'fix(capture): redact longer private app secret first'
          mapfile -t effective < <(git diff --name-only "$base"...HEAD | sort)
          printf '%s\n' "${effective[@]}"
          test "${#effective[@]}" = 2
          test "${effective[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${effective[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift'
          git diff --check "$base" HEAD
          git push origin HEAD:sol/v14-capture-application-secret-value-custody-d56a
