name: Harden V14 final Capture terminal retirement

on:
  push:
    branches: [integration/v14-capture-final-target-authority-sol]
    paths:
      - '.github/workflows/harden-v14-final-clock-retirement.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact composed inputs
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "eee40f7e3b73c42f1e72ee029cd8dee6d5fd3caa"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFreshTargetAndAcquisitionTerminalSourceTests.swift)" = "28b7ea3ebb10df35c62af37ecc91a025813c894c"
          python3 -m py_compile .ci-patches/harden-v14-final-clock-retirement.py

      - name: Harden all terminal retirement paths
        run: |
          set -euo pipefail
          python3 .ci-patches/harden-v14-final-clock-retirement.py
          git diff --check
          grep -Fq 'session_auth_start_chronology_rejected' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'application_update_clock_regressed' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'accepted_prefix_seal_clock_regressed' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'application_timeout_clock_regressed' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'test.fieldBuildIdentifier' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Commit hardening and retire helper
        run: |
          set -euo pipefail
          rm .ci-patches/harden-v14-final-clock-retirement.py
          rm .github/workflows/harden-v14-final-clock-retirement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): retire authority on clock-terminal failures"
          git push origin HEAD:integration/v14-capture-final-target-authority-sol
