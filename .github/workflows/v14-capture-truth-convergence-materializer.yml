name: V14 Capture Truth Convergence Materializer

on:
  push:
    branches:
      - agent/v14-capture-truth-convergence-1c408-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close foreground, membership copy, and event provenance gaps
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT="1c40853f6991b4d09206df1d25ecff021458b7eb"
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]] || { echo "branch moved before materialization"; exit 2; }
          mapfile -t CUT_FILES < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          [[ "${#CUT_FILES[@]}" -eq 1 && "${CUT_FILES[0]}" == ".github/workflows/v14-capture-truth-convergence-materializer.yml" ]] || exit 2

          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          # Foreground accepted artifact exemption.
          old = "    func appDidLoseForeground() {\n        guard !foregroundIntegrityLossHandled else { return }\n"
          new = "    func appDidLoseForeground() {\n        // A sealed accepted artifact is immutable and remains shareable across scene changes.\n        guard phase != .accepted else { return }\n        guard !foregroundIntegrityLossHandled else { return }\n"
          if text.count(old) != 1:
              raise SystemExit(f"foreground guard anchor drifted: {text.count(old)}")
          text = text.replace(old, new, 1)

          # A correlated/selected target has current-attempt authority even after scanner lease release.
          old = "        guard let token = currentConnectionToken else {\n            if phase == .authenticating {\n"
          new = "        guard let token = currentConnectionToken else {\n            if phase == .correlated || phase == .selected {\n                resetDiscoverySessionOnly()\n                phase = .failed\n                message = \"Capture left the foreground after target correlation. Re-verify this scooter and restart from OFF1; prior target authority is not reused across the interruption.\"\n                log(\"foreground_integrity_lost_after_target_correlation\")\n                return\n            }\n\n            if phase == .authenticating {\n"
          if text.count(old) != 1:
              raise SystemExit(f"correlated foreground anchor drifted: {text.count(old)}")
          text = text.replace(old, new, 1)

          # Clear stale operator copy synchronously with view-lifetime membership proof.
          start = text.index("    func abandonCorrelationForViewExit()")
          end = text.index("    func appDidLoseForeground()", start)
          cleanup = text[start:end]
          old = "        membershipDeviceID = nil\n        membershipRequestID = UUID()\n"
          new = "        membershipDeviceID = nil\n        membershipStatus = \"Scooter membership must be verified again for this Secure Link view.\"\n        membershipRequestID = UUID()\n"
          if cleanup.count(old) != 1:
              raise SystemExit(f"view membership status anchor drifted: {cleanup.count(old)}")
          cleanup = cleanup.replace(old, new, 1)
          text = text[:start] + cleanup + text[end:]

          # Foreground loss also clears the same user-facing proof copy.
          start = text.index("    func appDidLoseForeground()")
          end = text.index("    var privateConfig: Bool", start)
          foreground = text[start:end]
          if foreground.count(old) != 1:
              raise SystemExit(f"foreground membership status anchor drifted: {foreground.count(old)}")
          foreground = foreground.replace(old, new, 1)
          text = text[:start] + foreground + text[end:]

          # Reserved Nembra metadata wins collisions with untrusted SDK application fields.
          old = "]) { current, _ in current })\n"
          new = "]) { _, trusted in trusted })\n"
          if text.count(old) != 1:
              raise SystemExit(f"generation precedence anchor drifted: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git show ec55d27270d80bdfa556eff3b598880dd8f5c231:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          git show 8e004bdc39357c832c11d98d5013d2097937967f:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          git show a8eb9b93eea7e5de1a9c80468cadf378989b5edd:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift

          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          fg_start = source.index("func appDidLoseForeground()")
          fg_end = source.index("var privateConfig: Bool", fg_start)
          fg = source[fg_start:fg_end]
          for token in ["guard phase != .accepted else { return }", "guard !foregroundIntegrityLossHandled else { return }", "phase == .correlated || phase == .selected", "resetDiscoverySessionOnly()", "foreground_integrity_lost_after_target_correlation", "Task { @MainActor [self] in"]:
              assert token in fg, token
          exit_start = source.index("func abandonCorrelationForViewExit()")
          exit_end = source.index("func appDidLoseForeground()", exit_start)
          exit_block = source[exit_start:exit_end]
          assert exit_block.index("sdkDeviceMembershipVerified = false") < exit_block.index("membershipStatus = \"Scooter membership must be verified again for this Secure Link view.\"") < exit_block.index("membershipRequestID = UUID()")
          assert ']) { _, trusted in trusted })' in source
          assert ']) { current, _ in current })' not in source
          PY

          git config user.name "Nembra V14 Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git commit -m "fix(capture): converge foreground and event truth"
          git push origin HEAD:agent/v14-capture-truth-convergence-1c408-sol
