name: QA Capture cross-controller BLE 30600e

on:
  push:
    branches:
      - qa/v14-capture-cross-controller-ble-1c2825-gpt56sol

permissions:
  contents: read

concurrency:
  group: qa-capture-cross-controller-ble-current
  cancel-in-progress: true

jobs:
  xcode27:
    name: Xcode 27 exact product SHA validation
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout exact composed product repair SHA
        uses: actions/checkout@v4
        with:
          ref: 30600e0d320989d77553b943ab8a6f41606756d5
          fetch-depth: 0

      - name: Prove exact checkout and one-commit two-file delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '30600e0d320989d77553b943ab8a6f41606756d5'
          test "$(git rev-parse HEAD^)" = '2bb37639656fb114c5767f6311586042b9ee4ef2'
          git diff --check HEAD^...HEAD
          changed="$(git diff --name-only HEAD^...HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = $'NembraApp/App/NembraCaptureEntrypoint.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipSourceTests.swift'

      - name: Show Xcode
        run: xcodebuild -version

      - name: Run focused Apple source regression
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaCrossControllerBLEOwnershipSourceTests

      - name: Build standalone Capture Simulator
        run: |
          set -o pipefail
          rm -rf /tmp/NembraCrossControllerSimulatorDerived
          xcodebuild -project NembraCapture.xcodeproj -scheme 'Nembra Capture' -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/NembraCrossControllerSimulatorDerived CODE_SIGNING_ALLOWED=NO build | tee /tmp/nembra-cross-controller-simulator-build.log

      - name: Verify standalone Simulator product exists
        run: test -d '/tmp/NembraCrossControllerSimulatorDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app'

      - name: Build standalone Capture iPhone unsigned
        run: |
          set -o pipefail
          rm -rf /tmp/NembraCrossControllerDeviceDerived
          xcodebuild -project NembraCapture.xcodeproj -scheme 'Nembra Capture' -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath /tmp/NembraCrossControllerDeviceDerived CODE_SIGNING_ALLOWED=NO build | tee /tmp/nembra-cross-controller-device-build.log

      - name: Verify standalone iPhone product exists
        run: test -d '/tmp/NembraCrossControllerDeviceDerived/Build/Products/Debug-iphoneos/Nembra Capture.app'

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-cross-controller-ble-30600e-build-logs
          path: |
            /tmp/nembra-cross-controller-simulator-build.log
            /tmp/nembra-cross-controller-device-build.log
          if-no-files-found: ignore
