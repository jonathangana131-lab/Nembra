name: Materialize Capture View Exit Membership Race

on:
  push:
    branches:
      - fix/v14-capture-view-exit-membership-race-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-view-exit-membership-race-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact parent and untouched product source
        shell: bash
        run: |
          set -euo pipefail
          parent='0693b471ed9ebc7756a78f1b9ed54fdf4d7f604c'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t unexpected < <(git diff --name-only "$parent"...HEAD | grep -Ev '^(.github/workflows/materialize-capture-view-exit-membership-race-sol.yml|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift)$' || true)
          test "${#unexpected[@]}" = 0

      - name: Apply deterministic hidden-start retirement repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          start_token = '    func abandonCorrelationForViewExit() {'
          end_token = '\n\n    var privateConfig: Bool'
          if source.count(start_token) != 1:
              raise SystemExit(f'expected one cleanup function, found {source.count(start_token)}')
          start = source.index(start_token)
          end = source.index(end_token, start)
          new = '''    func abandonCorrelationForViewExit() {
        // Secure Link can disappear while current-account membership enumeration is still
        // in flight, before OFF1 owns a scanner/lease. Revoke that callback authority first
        // so a late successful membership result cannot start hidden package correlation.
        membershipRequestID = UUID()
        membershipBusy = false
#if canImport(ThingSmartHomeKit)
        membershipProbe = nil
#endif

        guard processCorrelationLease != nil || correlationSession != nil else { return }
        // Preserve the accepted radio ordering: explicit package transport retirement first,
        // then owner-token lease release inside abandonPackageCorrelation().
        abandonPackageCorrelation()
        phase = .failed
        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."
        log("target_correlation_abandoned_on_view_exit")
    }'''
          source = source[:start] + new + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify strengthened lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('func abandonCorrelationForViewExit()')
          end = s.index('var privateConfig: Bool', start)
          cleanup = s[start:end]
          required = (
              'membershipRequestID = UUID()',
              'membershipBusy = false',
              'membershipProbe = nil',
              'guard processCorrelationLease != nil || correlationSession != nil else { return }',
              'abandonPackageCorrelation()',
              'target_correlation_abandoned_on_view_exit',
          )
          for needle in required:
              assert needle in cleanup, needle
          assert cleanup.index('membershipRequestID = UUID()') < cleanup.index('guard processCorrelationLease')
          assert cleanup.index('membershipProbe = nil') < cleanup.index('guard processCorrelationLease')
          assert 'releasePackageCorrelationLease()' not in cleanup
          for forbidden in ('connectBLE(', 'publishDps', 'writeValue', 'disconnect'):
              assert forbidden not in cleanup, forbidden
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift').read_text(encoding='utf-8')
          for needle in ('membershipRequestID = UUID()', 'membershipBusy = false', 'membershipProbe = nil', 'abandonPackageCorrelation()'):
              assert needle in test, needle
          print('view-exit membership/scan retirement source contract: PASS')
          PY
          git diff --check

      - name: Collapse helper into clean current-product repair
        shell: bash
        run: |
          set -euo pipefail
          parent='0693b471ed9ebc7756a78f1b9ed54fdf4d7f604c'
          rm .github/workflows/materialize-capture-view-exit-membership-race-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          git add -u .github/workflows/materialize-capture-view-exit-membership-race-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): cancel hidden correlation start on view exit'
          test "$(git diff --name-only "$parent" HEAD | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift' | sort)"
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-view-exit-membership-race-sol
