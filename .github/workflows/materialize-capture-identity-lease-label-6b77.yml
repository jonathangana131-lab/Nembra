name: Materialize Capture Identity Lease Label 6b77

on:
  push:
    branches:
      - fix/v14-capture-identity-lease-label-6b77-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair exact current call-site and prove source contract
        shell: bash
        run: |
          set -euo pipefail
          expected_base='6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          workflow='.github/workflows/materialize-capture-identity-lease-label-6b77.yml'
          git merge-base --is-ancestor "$expected_base" HEAD
          test "$(git diff --name-only "$expected_base"...HEAD)" = "$workflow"

          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          gate_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaSDKAccountIdentityLeaseGate.swift')
          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAccountIdentityLeaseAppSourceIntegrationTests.swift')

          app = app_path.read_text(encoding='utf-8')
          gate = gate_path.read_text(encoding='utf-8')
          old = '            sdkIsLoggedIn: sdkAccountLoggedIn,'
          new = '            isLoggedIn: sdkAccountLoggedIn,'
          if app.count(old) != 1:
              raise SystemExit(f'expected exactly one stale identity-lease label, found {app.count(old)}')
          if 'public init(\n            isLoggedIn: Bool,' not in gate:
              raise SystemExit('package identity-lease public initializer contract changed')
          app = app.replace(old, new, 1)
          app_path.write_text(app, encoding='utf-8')

          test_path.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya account identity lease app-source integration")
          struct TuyaAccountIdentityLeaseAppSourceIntegrationTests {
              @Test("Secure Link calls the package identity-lease snapshot with the exact public initializer label")
              func appCallSiteMatchesIdentityLeaseSnapshotInitializer() throws {
                  let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let gate = try readRepositoryFile("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaSDKAccountIdentityLeaseGate.swift")
                  let snapshot = String(try section(
                      in: app,
                      from: "private var accountIdentityLeaseSnapshot: TuyaSDKAccountIdentityLeaseGate.Snapshot",
                      to: "var accountIdentityLeaseIsAuthorized: Bool"
                  ))

                  #expect(gate.contains("public init(\n            isLoggedIn: Bool,"))
                  #expect(snapshot.contains("isLoggedIn: sdkAccountLoggedIn"))
                  #expect(!snapshot.contains("sdkIsLoggedIn:"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          '''.replace('          ', ''), encoding='utf-8')

          repaired = app_path.read_text(encoding='utf-8')
          regression = test_path.read_text(encoding='utf-8')
          if repaired.count(new) != 1 or old in repaired:
              raise SystemExit('app call-site repair did not converge exactly once')
          for needle in (
              'isLoggedIn: sdkAccountLoggedIn',
              '!snapshot.contains("sdkIsLoggedIn:")',
              'public init(\\n            isLoggedIn: Bool,'
          ):
              if needle not in regression:
                  raise SystemExit(f'missing source-regression contract: {needle}')
          PY

          git diff --check
          rm "$workflow"
          git diff --check
          test "$(git diff --name-only "$expected_base")" = $'NembraApp/App/NembraCaptureEntrypoint.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAccountIdentityLeaseAppSourceIntegrationTests.swift'

      - name: Commit clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAccountIdentityLeaseAppSourceIntegrationTests.swift \
            .github/workflows/materialize-capture-identity-lease-label-6b77.yml
          git commit -m '[Capture P0] Match identity-lease snapshot initializer label'
          git push origin HEAD:fix/v14-capture-identity-lease-label-6b77-sol
