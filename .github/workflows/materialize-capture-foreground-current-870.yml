name: Materialize Exact-Current Capture Foreground Integrity

on:
  push:
    branches: [agent/capture-foreground-current-870]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-foreground-current-870
          fetch-depth: 0
      - name: Apply foreground evidence authority repair
        shell: bash
        run: |
          set -euo pipefail
          parent='870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81'
          test "$(git rev-parse HEAD^)" = "$parent"
          test "$(git diff --name-only "$parent"...HEAD)" = '.github/workflows/materialize-capture-foreground-current-870.yml'

          python3 - <<'PY'
          from pathlib import Path
          p=Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s=p.read_text(encoding='utf-8')
          if 'func appDidLoseForeground()' in s or '@Environment(\\.scenePhase)' in s:
              raise SystemExit('foreground authority already exists; refresh live product')

          def one(old,new,label):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'{label} anchor count={s.count(old)}')
              s=s.replace(old,new,1)

          one(
              '    private var acceptsViewScopedMembershipRequests = false\n    private var officialConnectionRequestID = UUID()\n',
              '    private var acceptsViewScopedMembershipRequests = false\n    private var officialConnectionRequestID = UUID()\n    private var foregroundIntegrityLossHandled = false\n',
              'foreground state property'
          )

          one(
              '''    func activateMembershipRequestsForView() {\n        acceptsViewScopedMembershipRequests = true\n    }\n''',
              '''    func activateMembershipRequestsForView() {\n        foregroundIntegrityLossHandled = false\n        acceptsViewScopedMembershipRequests = true\n    }\n''',
              'view activation'
          )

          one(
              '''        acceptsViewScopedMembershipRequests = false\n        sdkDeviceMembershipVerified = false\n''',
              '''        foregroundIntegrityLossHandled = true\n        acceptsViewScopedMembershipRequests = false\n        sdkDeviceMembershipVerified = false\n''',
              'view exit idempotence'
          )

          marker='    var privateConfig: Bool { OfficialTuyaFactory.configured }\n'
          if s.count(marker)!=1:
              raise SystemExit('foreground method insertion anchor drifted')
          method='''    func appDidLoseForeground() {\n        // Capture evidence is foreground-only. SwiftUI may emit inactive then background for one\n        // transition, so the first loss owns the single terminal verdict for this active epoch.\n        guard !foregroundIntegrityLossHandled else { return }\n        foregroundIntegrityLossHandled = true\n\n        // Revoke both fresh-probe admission and the membership proof already earned by this view\n        // before inspecting package scanner, official-auth, or authenticated-session state.\n        acceptsViewScopedMembershipRequests = false\n        sdkDeviceMembershipVerified = false\n        membershipAccountUID = nil\n        membershipDeviceID = nil\n        membershipStatus = "Capture left the foreground. Exact scooter membership must be verified again after returning active."\n        membershipRequestID = UUID()\n        membershipBusy = false\n#if canImport(ThingSmartHomeKit)\n        membershipProbe = nil\n#endif\n        officialConnectionRequestID = UUID()\n        watchdog?.cancel()\n        watchdog = nil\n\n        if processCorrelationLease != nil || correlationSession != nil {\n            // Existing ordered helper stops package scanning before owner-token lease release.\n            abandonPackageCorrelation()\n            phase = .failed\n            message = "Capture left the foreground during Bluetooth target correlation. Restart from OFF1; interrupted windows are never reusable evidence."\n            log("foreground_integrity_lost_during_target_correlation")\n            return\n        }\n\n        guard let token = currentConnectionToken else {\n            if phase == .authenticating {\n                // Driver handoff without a package generation is only app-local authority. Rotating\n                // the request ID forces pending ledger work to retire before any SDK connect.\n                localBLESettlementToken = nil\n                sdkLocalBLEOnline = false\n                driver = nil\n                phase = .failed\n                message = "Capture left the foreground during authentication. Relaunch before another authenticated attempt; no BLE disconnect is claimed."\n                log("foreground_integrity_lost_before_observation")\n            }\n            return\n        }\n\n        let wasObserving = phase == .observing\n        phase = .failed\n        message = wasObserving\n            ? "Capture left the foreground during authenticated observation. Restart from OFF1; background time is not accepted evidence and no BLE disconnect is claimed."\n            : "Capture left the foreground before authenticated observation. Relaunch before another authenticated attempt; no BLE disconnect is claimed."\n        log(\n            wasObserving ? "foreground_integrity_lost_during_observation" : "foreground_integrity_lost_before_observation",\n            ["generation": String(token.diagnosticGeneration)]\n        )\n\n        // Preserve the strong finite terminal lifetime used by view-exit retirement. Scene loss\n        // followed by navigation cannot destroy the StateObject before package authority is sealed.\n        Task { @MainActor [self] in\n            guard self.currentConnectionToken == token else { return }\n            if wasObserving {\n                await self.invalidateObservationContinuity(\n                    token: token,\n                    message: "App foreground integrity was lost during authenticated observation. Restart from OFF1; background time is not accepted evidence and no BLE disconnect is claimed.",\n                    kind: "foreground_integrity_lost_during_observation"\n                )\n            } else {\n                await self.invalidateInternalLifecycle(\n                    token: token,\n                    message: "App foreground integrity was lost before authenticated observation. Relaunch before another authenticated attempt; no BLE disconnect is claimed.",\n                    kind: "foreground_integrity_lost_before_observation"\n                )\n            }\n        }\n    }\n\n'''
          s=s.replace(marker,method+marker,1)

          one(
              '    @Environment(\\.dynamicTypeSize) private var dynamicTypeSize\n',
              '    @Environment(\\.dynamicTypeSize) private var dynamicTypeSize\n    @Environment(\\.scenePhase) private var scenePhase\n',
              'scenePhase environment'
          )

          one(
              '''        .task {\n            test.activateMembershipRequestsForView()\n            sdkAccount.bootstrap()\n            if sdkAccount.loggedIn { test.verifySDKMembership() }\n            while !Task.isCancelled {\n                test.consumeCorrelationAsyncInvalidation()\n                try? await Task.sleep(nanoseconds: 250_000_000)\n            }\n        }\n''',
              '''        .task {\n            test.activateMembershipRequestsForView()\n            if scenePhase == .active {\n                sdkAccount.bootstrap()\n                if sdkAccount.loggedIn { test.verifySDKMembership() }\n            } else {\n                test.appDidLoseForeground()\n            }\n            while !Task.isCancelled {\n                test.consumeCorrelationAsyncInvalidation()\n                try? await Task.sleep(nanoseconds: 250_000_000)\n            }\n        }\n''',
              'initial task foreground gate'
          )

          one(
              '''        .onDisappear {\n            test.abandonCorrelationForViewExit()\n        }\n        .onChange(of: sdkAccount.loggedIn) { _, loggedIn in\n''',
              '''        .onDisappear {\n            test.abandonCorrelationForViewExit()\n        }\n        .onChange(of: scenePhase) { _, newPhase in\n            if newPhase == .active {\n                // Reopen membership admission and re-earn current membership only. Correlation,\n                // authentication, and capture stages never auto-restart on foreground return.\n                test.activateMembershipRequestsForView()\n                if sdkAccount.loggedIn { test.verifySDKMembership() }\n            } else {\n                test.appDidLoseForeground()\n            }\n        }\n        .onChange(of: sdkAccount.loggedIn) { _, loggedIn in\n''',
              'scene lifecycle hook'
          )
          p.write_text(s,encoding='utf-8')
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture foreground integrity source contract")
          struct TuyaCaptureForegroundIntegritySourceTests {
              @Test("scene loss is idempotent and revokes membership authority before transport")
              func sceneLossClosesAuthorityFirst() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = String(try section(in: source, from: "private final class SecureLinkController", to: "@MainActor\nprivate protocol OfficialTuyaDriver"))
                  let cleanup = String(try section(in: controller, from: "func appDidLoseForeground()", to: "var privateConfig: Bool"))
                  #expect(controller.contains("private var foregroundIntegrityLossHandled = false"))
                  #expect(cleanup.contains("guard !foregroundIntegrityLossHandled else { return }"))
                  let close = try offset("acceptsViewScopedMembershipRequests = false", cleanup)
                  let clearVerified = try offset("sdkDeviceMembershipVerified = false", cleanup)
                  let request = try offset("membershipRequestID = UUID()", cleanup)
                  let official = try offset("officialConnectionRequestID = UUID()", cleanup)
                  let transport = try offset("if processCorrelationLease != nil || correlationSession != nil", cleanup)
                  #expect(close < clearVerified)
                  #expect(clearVerified < request)
                  #expect(request < official)
                  #expect(official < transport)
                  #expect(cleanup.contains("membershipAccountUID = nil"))
                  #expect(cleanup.contains("membershipDeviceID = nil"))
                  #expect(cleanup.contains("watchdog?.cancel()"))
              }

              @Test("foreground loss distinguishes observation continuity from internal lifecycle")
              func usesTruthSpecificTerminal() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = String(try section(in: source, from: "private final class SecureLinkController", to: "@MainActor\nprivate protocol OfficialTuyaDriver"))
                  let cleanup = String(try section(in: controller, from: "func appDidLoseForeground()", to: "var privateConfig: Bool"))
                  #expect(cleanup.contains("abandonPackageCorrelation()"))
                  #expect(cleanup.contains("let wasObserving = phase == .observing"))
                  #expect(cleanup.contains("invalidateObservationContinuity("))
                  #expect(cleanup.contains("invalidateInternalLifecycle("))
                  #expect(cleanup.contains("Task { @MainActor [self] in"))
                  for forbidden in ["releasePackageCorrelationLease()", "recordObservedTransportLoss", "endConnection", "disconnectBLE"] {
                      #expect(!cleanup.contains(forbidden))
                  }
              }

              @Test("current scene gates bootstrap and active return never auto-restarts capture")
              func viewOwnsSceneBoundary() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let view = String(try section(in: source, from: "private struct SecureLinkView: View", to: "private var hero: some View"))
                  #expect(view.contains("@Environment(\\.scenePhase) private var scenePhase"))
                  let task = String(try section(in: view, from: ".task {", to: ".onDisappear {"))
                  #expect(try offset("test.activateMembershipRequestsForView()", task) < offset("if scenePhase == .active", task))
                  #expect(try offset("if scenePhase == .active", task) < offset("sdkAccount.bootstrap()", task))
                  #expect(task.contains("test.appDidLoseForeground()"))
                  let scene = String(try section(in: view, from: ".onChange(of: scenePhase)", to: ".onChange(of: sdkAccount.loggedIn)"))
                  #expect(scene.contains("if newPhase == .active"))
                  #expect(scene.contains("test.activateMembershipRequestsForView()"))
                  #expect(scene.contains("test.verifySDKMembership()"))
                  #expect(scene.contains("test.appDidLoseForeground()"))
                  #expect(!scene.contains("startBaseline"))
                  #expect(!scene.contains("beginOfficialConnection"))
              }

              @Test("view exit suppresses a later scene double-terminal and keeps strong cleanup lifetime")
              func viewExitAndSceneLossDoNotDoubleTerminal() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = String(try section(in: source, from: "private final class SecureLinkController", to: "@MainActor\nprivate protocol OfficialTuyaDriver"))
                  let exit = String(try section(in: controller, from: "func abandonCorrelationForViewExit()", to: "func appDidLoseForeground()"))
                  #expect(exit.contains("foregroundIntegrityLossHandled = true"))
                  #expect(exit.contains("sdkDeviceMembershipVerified = false"))
                  #expect(exit.contains("Task { @MainActor [self] in"))
              }

              private func offset(_ token: String, _ source: String) throws -> String.Index {
                  guard let range = source.range(of: token) else { Issue.record("Missing source token: \(token)"); throw SourceError.missing }
                  return range.lowerBound
              }
              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start), let b = source.range(of: end, range: a.upperBound..<source.endIndex) else { Issue.record("Missing source section: \(start) ... \(end)"); throw SourceError.missing }
                  return source[a.lowerBound..<b.lowerBound]
              }
              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let root = URL(fileURLWithPath: #filePath).deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent()
                  return try String(contentsOf: root.appendingPathComponent(relativePath), encoding: .utf8)
              }
              private enum SourceError: Error { case missing }
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          fg=s[s.index('func appDidLoseForeground()'):s.index('var privateConfig: Bool',s.index('func appDidLoseForeground()'))]
          required=['guard !foregroundIntegrityLossHandled else { return }','acceptsViewScopedMembershipRequests = false','sdkDeviceMembershipVerified = false','membershipAccountUID = nil','membershipDeviceID = nil','membershipRequestID = UUID()','officialConnectionRequestID = UUID()','abandonPackageCorrelation()','invalidateObservationContinuity(','invalidateInternalLifecycle(','Task { @MainActor [self] in']
          for q in required:
              if q not in fg: raise SystemExit('missing invariant: '+q)
          if not (fg.index('acceptsViewScopedMembershipRequests = false') < fg.index('sdkDeviceMembershipVerified = false') < fg.index('membershipRequestID = UUID()') < fg.index('officialConnectionRequestID = UUID()') < fg.index('if processCorrelationLease')):
              raise SystemExit('authority revocation ordering failed')
          for q in ['releasePackageCorrelationLease()','recordObservedTransportLoss','endConnection','disconnectBLE']:
              if q in fg: raise SystemExit('manufactured transport semantic: '+q)
          exit=s[s.index('func abandonCorrelationForViewExit()'):s.index('func appDidLoseForeground()')]
          if 'foregroundIntegrityLossHandled = true' not in exit or 'Task { @MainActor [self] in' not in exit:
              raise SystemExit('view-exit lifecycle invariant regressed')
          for q in ['@Environment(\\.scenePhase) private var scenePhase','.onChange(of: scenePhase)','if scenePhase == .active','if newPhase == .active']:
              if q not in s: raise SystemExit('scene boundary missing: '+q)
          # Preserve newer credential and application-secret repairs from the exact parent.
          for q in ['submittedVerificationCode: String','<redacted-verification-code>','sessionkey']:
              if q not in s: raise SystemExit('newer parent truth regressed: '+q)
          print('exact-current foreground materialization contract: PASS')
          PY

          git diff --check
          rm .github/workflows/materialize-capture-foreground-current-870.yml
          git config user.name nembra-v14-bot
          git config user.email nembra-v14-bot@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift .github/workflows/materialize-capture-foreground-current-870.yml
          git diff --cached --check
          git commit -m 'fix(capture): bind evidence authority to foreground'
          git push origin HEAD:agent/capture-foreground-current-870
