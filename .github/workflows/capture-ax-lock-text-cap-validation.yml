name: Capture AX Lock Text Cap Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'NembraApp/App/NembraCaptureEntrypoint.swift'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureRootAccessibilityLockTextCapSourceTests.swift'
      - '.github/workflows/capture-ax-lock-text-cap-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Prove lock-banner text keeps AX hierarchy
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout dispatched ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6

      - name: Verify immutable PR head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Execute focused source regression
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --filter CaptureRootAccessibilityLockTextCapSourceTests

      - name: Preserve physical truth boundary
        run: |
          printf '%s\n' 'Validation only. No Bluetooth, Tuya, telemetry, install, command, or physical authority is created.'
