          if source.count(old) != 1:
              raise SystemExit('grant plan-consumption seam drifted')
          source = source.replace(old, new)
          helper.write_text(source, encoding='utf-8')

          test = Path('scripts/ci/tests/test_capture_private_read_lease_component_walk.py')
          tests = test.read_text(encoding='utf-8')
          seam = '    def test_source_uses_dirfd_component_walk_before_path_diagnostic(self) -> None:\n'
          if tests.count(seam) != 1:
              raise SystemExit('component test insertion seam drifted')
          insertion = '''    def test_real_directory_replacement_is_rejected_against_planned_identity(self) -> None:
        helper = load()
        with tempfile.TemporaryDirectory(prefix="nembra-component-real-swap-") as raw:
            outer = Path(raw)
            repo = outer / "repo"
            legitimate = repo / "LocalSecrets/TuyaSDK/Build"
            legitimate.mkdir(parents=True)
            planned = helper._lease_paths((legitimate,), repo, include_signatures=True)
            expected = next(
                signature
                for path, _host_only, signature in planned
                if path == legitimate
            )

            sdk = repo / "LocalSecrets/TuyaSDK"
            original = repo / "LocalSecrets/TuyaSDK.original"
            sdk.rename(original)
            replacement = repo / "LocalSecrets/TuyaSDK/Build"
            replacement.mkdir(parents=True)
            self.assertFalse(sdk.is_symlink())
            self.assertFalse(replacement.is_symlink())
            self.assertNotEqual(expected, helper._path_signature(replacement))

            with self.assertRaises(helper.SelectedXcodeBuildOrchestratorError):
                helper._open_pinned_path(legitimate, True, expected)

'''
          tests = tests.replace(seam, insertion + seam)
          old = '        self.assertIn("O_NOFOLLOW", source)\n'
          new = old + '        self.assertIn("expected_signature", source)\n'
          if tests.count(old) != 1:
              raise SystemExit('component source assertion seam drifted')
          tests = tests.replace(old, new)
          test.write_text(tests, encoding='utf-8')
          PY

          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          for raw in (
              'scripts/ci/capture_selected_xcode_build_orchestrator.py',
              'scripts/ci/tests/test_capture_private_read_lease_component_walk.py',
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
          PY
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^ M scripts/ci/capture_selected_xcode_build_orchestrator.py$' | grep -v '^ M scripts/ci/tests/test_capture_private_read_lease_component_walk.py$' | grep -v '^?? .github/workflows/capture-read-lease-plan-identity-materialize-v2.yml$' || true)"

      - name: Publish and self-delete
        shell: bash
        run: |
          set -euo pipefail
          SELF=.github/workflows/capture-read-lease-plan-identity-materialize-v2.yml
          git rm "$SELF"
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git diff --cached --check
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git commit -m 'capture: bind lease admission to planned object identity'
          test "$(git diff --name-only 578b389e7974ff8814020d773ee0115531b654be...HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/workflows/capture-private-read-lease-component-walk.yml scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_private_read_lease_component_walk.py | LC_ALL=C sort)"
          git push origin HEAD:hardening/v17-capture-read-lease-component-walk-sol-20260814
