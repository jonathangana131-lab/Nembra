          if source.count(old) != 1:
              raise SystemExit('opener signature seam drifted')
          source = source.replace(old, new)

          old = '''        # Full-path lookup below is diagnostic only after anchored selection.
        if _descriptor_signature(descriptor) != _path_signature(path):
