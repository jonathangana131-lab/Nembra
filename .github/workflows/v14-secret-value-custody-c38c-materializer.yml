name: V14 Capture Secret Value Custody C38C

on:
  push:
    branches:
      - repair/v14-capture-secret-value-custody-c38c-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: repair/v14-capture-secret-value-custody-c38c-sol
      - name: Materialize and validate exact-current repair
        shell: bash
        run: |
          set -euo pipefail
          PARENT='c38cb8f4c66ec1e1e8f6cdbe7fb77955daf18b5e'
          APP='NembraApp/App/NembraCaptureEntrypoint.swift'
          TEST='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift'
          test "$(git rev-parse HEAD~2)" = "$PARENT"
          python3 tools/v14_secret_value_custody_materialize.py
          git fetch --no-tags origin refs/pull/2439/head:refs/remotes/origin/red-2439
          git show "origin/red-2439:$TEST" > "$TEST"
          swiftc -parse "$APP"
          swiftc -parse "$TEST"
          git add "$APP" "$TEST"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '2'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$APP"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-secret-value-custody-c38c-materializer.yml tools/v14_secret_value_custody_materialize.py
          git commit -m 'fix(capture): bind private secret values to event custody'
          git push origin HEAD:repair/v14-capture-secret-value-custody-c38c-sol
