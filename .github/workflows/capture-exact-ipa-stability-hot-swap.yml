name: Capture exact IPA stability hot-swap

on:
  push:
    branches:
      - fix/es80-v14-signed-ipa-snapshot-stability/gpt56-thinking-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-v14-signed-ipa-snapshot-stability/gpt56-thinking-go
          fetch-depth: 0

      - name: Compose post-inspection exact-subject stability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          path = Path("scripts/ci/es80_signed_field_artifact_evidence.py")
          text = path.read_text(encoding="utf-8")
          if "def verify_exact_ipa_subject_unchanged(" in text:
              raise SystemExit("exact IPA post-inspection stability is already present")
          if "destination.chmod(0o400)" not in text:
              raise SystemExit("expected read-only private exact IPA snapshot contract")
          anchor = "    finally:\n        os.close(descriptor)\n\ndef canonical_sha40(value: str) -> str:\n"
          if text.count(anchor) != 1:
              raise SystemExit("unexpected snapshot->canonical anchor")
          helper = (
              "    finally:\n"
              "        os.close(descriptor)\n\n\n"
              "def verify_exact_ipa_subject_unchanged(\n"
              "    ipa_path: Path,\n"
              "    *,\n"
              "    expected_identity: tuple[int, int, int, int, int, int],\n"
              "    expected_sha256: str,\n"
              ") -> None:\n"
              "    try:\n"
              "        current_stat = ipa_path.lstat()\n"
              "        current_sha256 = sha256_file(ipa_path)\n"
              "    except OSError as exc:\n"
              "        raise EvidenceError(\"exact IPA inspection subject became unreadable during inspection\") from exc\n"
              "    if (\n"
              "        _stable_file_identity(current_stat) != expected_identity\n"
              "        or current_sha256 != expected_sha256\n"
              "    ):\n"
              "        raise EvidenceError(\n"
              "            \"exact IPA inspection subject changed during signing/provisioning inspection\"\n"
              "        )\n\n\n"
              "def canonical_sha40(value: str) -> str:\n"
          )
          text = text.replace(anchor, helper, 1)
          old_start = (
              "    source_sha = canonical_sha40(expected_source_sha)\n"
              "    if not ipa_path.is_file():\n"
              "        raise EvidenceError(f\"IPA does not exist as a file: {ipa_path}\")\n\n"
              "    ipa_sha = sha256_file(ipa_path)\n"
              "    ipa_size = ipa_path.stat().st_size\n"
          )
          new_start = (
              "    source_sha = canonical_sha40(expected_source_sha)\n"
              "    try:\n"
              "        ipa_stat_before = ipa_path.lstat()\n"
              "    except OSError as exc:\n"
              "        raise EvidenceError(f\"IPA does not exist as a file: {ipa_path}\") from exc\n"
              "    if not stat.S_ISREG(ipa_stat_before.st_mode):\n"
              "        raise EvidenceError(\"exact IPA inspection subject must remain one regular file\")\n"
              "    ipa_identity_before = _stable_file_identity(ipa_stat_before)\n\n"
              "    ipa_sha = sha256_file(ipa_path)\n"
              "    ipa_size = ipa_stat_before.st_size\n"
          )
          if text.count(old_start) != 1:
              raise SystemExit("unexpected snapshotted IPA inspection preamble")
          text = text.replace(old_start, new_start, 1)
          measurement = (
              "        if not SHA256_RE.fullmatch(executable_sha) or not SHA256_RE.fullmatch(info_plist_sha):\n"
              "            raise EvidenceError(\"could not derive canonical executable/Info.plist SHA-256\")\n\n"
              "    external_record = {\n"
          )
          recheck = (
              "        if not SHA256_RE.fullmatch(executable_sha) or not SHA256_RE.fullmatch(info_plist_sha):\n"
              "            raise EvidenceError(\"could not derive canonical executable/Info.plist SHA-256\")\n\n"
              "    verify_exact_ipa_subject_unchanged(\n"
              "        ipa_path,\n"
              "        expected_identity=ipa_identity_before,\n"
              "        expected_sha256=ipa_sha,\n"
              "    )\n\n"
              "    external_record = {\n"
          )
          if text.count(measurement) != 1:
              raise SystemExit("unexpected signing/provisioning measurement boundary")
          text = text.replace(measurement, recheck, 1)
          self_anchor = (
              "    assert valid_build_identifier(\"Capture Build V14-aaaaaaaaaaaa\")\n"
              "    assert not valid_build_identifier(\" Capture Build V14-aaaaaaaaaaaa\")\n"
              "    assert not valid_build_identifier(\"Capture\\nBuild\")\n"
          )
          regression = self_anchor + (
              "\n    with tempfile.TemporaryDirectory(prefix=\"nembra-field-subject-stability-self-test-\") as temporary:\n"
              "        subject = Path(temporary) / \"subject.ipa\"\n"
              "        original_bytes = b\"exact subject bytes\"\n"
              "        subject.write_bytes(original_bytes)\n"
              "        subject.chmod(0o400)\n"
              "        subject_identity = _stable_file_identity(subject.lstat())\n"
              "        subject_sha = sha256_file(subject)\n"
              "        subject.chmod(0o600)\n"
              "        subject.write_bytes(b\"mutated subject bytes\")\n"
              "        subject.write_bytes(original_bytes)\n"
              "        subject.chmod(0o400)\n"
              "        try:\n"
              "            verify_exact_ipa_subject_unchanged(\n"
              "                subject,\n"
              "                expected_identity=subject_identity,\n"
              "                expected_sha256=subject_sha,\n"
              "            )\n"
              "        except EvidenceError as error:\n"
              "            assert \"changed during signing/provisioning inspection\" in str(error)\n"
              "        else:\n"
              "            raise AssertionError(\"mutate-and-restore exact IPA snapshot escaped stability detection\")\n"
          )
          if text.count(self_anchor) != 1:
              raise SystemExit("unexpected inspector self-test anchor")
          text = text.replace(self_anchor, regression, 1)
          path.write_text(text, encoding="utf-8")
          subprocess.run([sys.executable, "-m", "py_compile", str(path)], check=True)
          subprocess.run([sys.executable, str(path), "--self-test"], check=True)
          subprocess.run([sys.executable, "scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py"], check=True)
          PY
          test "$(stat -c '%a' scripts/ci/es80_signed_field_artifact_evidence.py)" = "755"
          git diff --check

      - name: Commit hot-swap and remove transformer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-exact-ipa-stability-hot-swap.yml
          git config user.name "nembra-v14-transform"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/es80_signed_field_artifact_evidence.py .github/workflows/capture-exact-ipa-stability-hot-swap.yml
          git diff --cached --check
          git commit -m "[Capture provenance v14] Re-prove exact IPA after inspection"
          git push origin HEAD:fix/es80-v14-signed-ipa-snapshot-stability/gpt56-thinking-go
