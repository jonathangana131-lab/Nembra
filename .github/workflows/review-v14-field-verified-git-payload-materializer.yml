name: REVIEW V14 Field Verified Git Payload Materializer

on:
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tmp_materialize_field_verified_git_payload.py
      - scripts/ci/tests/test_capture_field_git_packed_blob_execution_red_team.py
      - scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py
      - scripts/ci/tests/test_capture_field_accepted_source_path_contract.py
      - .github/workflows/review-v14-field-verified-git-payload-materializer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-materialization-with-root-depth-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact review head and parent construction blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git hash-object scripts/field/install_one_time_capture.command)" = "87430680649f9eb3160f30162f2c78f75809af68"
          test "$(git hash-object scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py)" = "514dc57300f6f6987248a09e20f307a18fa43b76"

      - name: Require exact materializer construction defects
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('scripts/ci/tmp_materialize_field_verified_git_payload.py').read_text()
          w=Path('.github/workflows/tmp-v14-field-verified-git-payload-materialize.yml').read_text()
          assert m.count('Path(__file__).resolve().parents[3]') == 1
          assert 'EXPECTED_INSTALLER_BLOB = "87430680649f9eb3160f30162f2c78f75809af68"' in m
          assert 'EXPECTED_TEST_BLOB = "514dc57300f6f6987248a09e20f307a18fa43b76"' in m
          assert '840bc068551f060a1d74578247b79b4ce9add029' in w
          assert 'a6a03b3b9a5bde131e90c0386f7e6524ec8abd8a' in w
          PY

      - name: Execute materializer with root-depth correction only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/ci/tmp_materialize_field_verified_git_payload.py').resolve()
          source=path.read_text(encoding='utf-8')
          old='Path(__file__).resolve().parents[3]'
          new='Path(__file__).resolve().parents[2]'
          assert source.count(old) == 1
          corrected=source.replace(old,new,1)
          exec(compile(corrected, str(path), 'exec'), {'__file__': str(path), '__name__': '__main__'})
          PY

      - name: Parse materialized installer
        shell: bash
        run: bash -n scripts/field/install_one_time_capture.command

      - name: Replay packed-blob execution red team
        shell: bash
        run: python3 scripts/ci/tests/test_capture_field_git_packed_blob_execution_red_team.py

      - name: Replay field Git authority contract
        shell: bash
        run: python3 scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py

      - name: Replay accepted-source path contract
        shell: bash
        run: python3 scripts/ci/tests/test_capture_field_accepted_source_path_contract.py

      - name: Diff hygiene
        shell: bash
        run: git diff --check

      - name: Require production delta and untouched construction helpers
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- scripts/ci/tmp_materialize_field_verified_git_payload.py
          git diff --quiet -- .github/workflows/tmp-v14-field-verified-git-payload-materialize.yml
          test -n "$(git diff -- scripts/field/install_one_time_capture.command)"
          test -n "$(git diff -- scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py)"
