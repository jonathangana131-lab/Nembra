name: V14 Capture explicit target confirmation patch
on:
  push:
    branches: [repair/v14-capture-explicit-target-confirmation-sol]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-explicit-target-confirmation-sol
          fetch-depth: 0
      - name: Apply deterministic repair
        run: python3 scripts/ci/v14_capture_explicit_confirmation_patch.py
      - name: Run focused regression
        run: swift test --package-path Packages/NembraBluetoothCapture --filter TuyaExplicitCorrelatedTargetConfirmationSourceTests
      - name: Commit durable repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture: require explicit target confirmation"
          git push origin HEAD:repair/v14-capture-explicit-target-confirmation-sol
