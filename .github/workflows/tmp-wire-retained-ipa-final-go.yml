name: Temporary retained IPA Final-GO wiring

on:
  push:
    branches:
      - control/v14-auth-stationary-final-go-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Harden retained app semantics and wire production issuer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '00748783af6d85cb01f1d6da7b9bbab033d38cb0'
          python3 - <<'PY'
          from pathlib import Path

          m=Path('scripts/ci/es80_authenticated_stationary_signed_artifact.py');s=m.read_text()
          seam='''def _profile(\n    app: Path,\n'''
          ent='''def _signed_entitlements(\n    app: Path,\n    runner: Callable[[list[str]], subprocess.CompletedProcess[bytes]] = _run,\n) -> dict[str, Any]:\n    payload = runner(["/usr/bin/codesign", "-d", "--entitlements", ":-", "--xml", str(app)])\n    raw = payload.stdout + b"\\n" + payload.stderr\n    start = raw.find(b"<?xml")\n    end = raw.rfind(b"</plist>")\n    if start < 0 or end < start:\n        raise SignedArtifactError("signed Capture entitlements are not a plist")\n    try:\n        value = plistlib.loads(raw[start : end + len(b"</plist>")])\n    except Exception as error:\n        raise SignedArtifactError("signed Capture entitlements are invalid") from error\n    if not isinstance(value, dict):\n        raise SignedArtifactError("signed Capture entitlements are not a dictionary")\n    return value\n\n\n'''+seam
          if s.count(seam)!=1: raise SystemExit('profile seam changed')
          s=s.replace(seam,ent,1)
          old='''    team, identifier = _codesign_identity(app, runner)\n    profile, profile_sha = _profile(app, intended_device, runner)\n    team_ids = profile.get("TeamIdentifier")\n    entitlements = profile.get("Entitlements")\n'''
          new='''    team, identifier = _codesign_identity(app, runner)\n    signed_entitlements = _signed_entitlements(app, runner)\n    if signed_entitlements.get("com.apple.developer.applesignin") != ["Default"] or signed_entitlements.get("application-identifier") != f"{team}.{BUNDLE}" or signed_entitlements.get("com.apple.developer.team-identifier") != team:\n        raise SignedArtifactError("effective signed Capture entitlements do not match current application authority")\n    profile, profile_sha = _profile(app, intended_device, runner)\n    team_ids = profile.get("TeamIdentifier")\n    entitlements = profile.get("Entitlements")\n'''
          if s.count(old)!=1: raise SystemExit('app evidence seam changed')
          s=s.replace(old,new,1)
          anchor='''def _read_intended_device(path: Path, repository_root: Path) -> str:\n'''
          reinspect='''def reinspect_retained(\n    ipa: Path,\n    candidate_repo: Path,\n    source: str,\n    device_file: Path,\n    install: dict[str, Any],\n    *,\n    runner: Callable[[list[str]], subprocess.CompletedProcess[bytes]] = _run,\n) -> dict[str, Any]:\n    repository = candidate_repo.expanduser().resolve(strict=True)\n    intended_device = _read_intended_device(device_file, repository)\n    dependency_sha = _sha_file(repository / "Podfile.lock")\n    if install.get("sourceCommitSHA") != source or install.get("bundleIdentifier") != BUNDLE:\n        raise SignedArtifactError("private installer subject does not match retained artifact subject")\n    ipa = ipa.expanduser().resolve(strict=True)\n    if ipa.name != IPA_NAME or stat.S_IMODE(ipa.stat().st_mode) != 0o600 or ipa.stat().st_nlink != 1:\n        raise SignedArtifactError("retained IPA custody is invalid")\n    with tempfile.TemporaryDirectory(prefix="nembra-auth-stationary-reinspect-") as temporary:\n        app = _extract_safe(ipa, Path(temporary))\n        evidence = _app_evidence(app, source=source, dependency_sha=dependency_sha, intended_device=intended_device, runner=runner)\n    return {\n        "authority":"nembra-authenticated-stationary-retained-signed-artifact-v1",\n        "sourceCommitSHA":source,\n        "buildIdentifier":f"capture-v14-{source[:12]}",\n        "bundleIdentifier":BUNDLE,\n        "procedureIdentifier":PROC,\n        "tuyaDependencyLockSHA256":dependency_sha,\n        "retainedIPASHA256":_sha_file(ipa),\n        "retainedAppTreeSHA256":evidence["treeSHA256"],\n        "embeddedProvisioningProfileSHA256":evidence["embeddedProvisioningProfileSHA256"],\n        "signingTeamIdentifier":evidence["signingTeamIdentifier"],\n        "applicationIdentifier":evidence["applicationIdentifier"],\n        "codesignVerified":True,\n        "intendedDeviceIncluded":True,\n        "physicalAuthorityCreated":False,\n    }\n\n\n'''+anchor
          if s.count(anchor)!=1: raise SystemExit('device seam changed')
          m.write_text(s.replace(anchor,reinspect,1))

          t=Path('scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py');q=t.read_text()
          seam='''        if command[:4] == ["/usr/bin/security", "cms", "-D", "-i"]:\n'''
          signed_ent='''        if command[:3] == ["/usr/bin/codesign", "-d", "--entitlements"]:\n            return subprocess.CompletedProcess(command, 0, plistlib.dumps(self.profile_payload["Entitlements"]), b"")\n'''+seam
          if q.count(seam)!=1: raise SystemExit('runner seam changed')
          q=q.replace(seam,signed_ent,1)
          anchor='''    def test_profile_wrong_team_application_or_missing_device_is_rejected(self) -> None:\n'''
          test='''    def test_effective_signed_entitlements_are_independently_required(self) -> None:\n        def missing_apple(command: list[str]) -> subprocess.CompletedProcess[bytes]:\n            if command[:3] == ["/usr/bin/codesign", "-d", "--entitlements"]:\n                entitlements = dict(self.profile_payload["Entitlements"]); entitlements.pop("com.apple.developer.applesignin", None)\n                return subprocess.CompletedProcess(command, 0, plistlib.dumps(entitlements), b"")\n            return self.runner(command)\n        with self.assertRaises(signed.SignedArtifactError):\n            signed._app_evidence(self.app, source=SOURCE, dependency_sha=self.dependency, intended_device=DEVICE, runner=missing_apple)\n\n'''+anchor
          if q.count(anchor)!=1: raise SystemExit('signed entitlement test seam changed')
          q=q.replace(anchor,test,1)
          anchor='''    def test_output_is_no_replace_and_canonical_filename_only(self) -> None:\n'''
          test='''    def test_published_ipa_can_be_independently_reinspected(self) -> None:\n        output=self.root / signed.IPA_NAME\n        with mock.patch.dict(os.environ,{"TMPDIR":str(self.root / "tmp")},clear=False):\n            first=signed.retain_and_reinspect(self.repo,SOURCE,self.device,self.install_subject(),output,runner=self.runner)\n        second=signed.reinspect_retained(output,self.repo,SOURCE,self.device,self.install_subject(),runner=self.runner)\n        self.assertEqual(first,second)\n\n'''+anchor
          if q.count(anchor)!=1: raise SystemExit('reinspection test seam changed')
          t.write_text(q.replace(anchor,test,1))

          i=Path('scripts/ci/es80_authenticated_stationary_final_go.py');r=i.read_text()
          old='''def retained_signed_artifact_unimplemented(repo:Path,source:str,device:Path,install:dict[str,Any])->dict[str,Any]:\n    raise GoError("retained signed IPA production + independent reinspection is not implemented; physical GO remains disabled")\n\ndef build(*,authority_repo:Path,authority_pr:int,authority_run:int,candidate_repo:Path,source:str,pr:int,runs:dict[str,int],artifact_id:int,review_id:int,archive:Path,device_file:Path,get=api,control_authority=control_plane,run_installer=installer,inspect_signed_artifact=retained_signed_artifact_unimplemented,now=None):\n'''
          new='''def retained_signed_artifact(repo:Path,source:str,device:Path,install:dict[str,Any],output:Path)->dict[str,Any]:\n    module_path=Path(__file__).with_name("es80_authenticated_stationary_signed_artifact.py")\n    spec=importlib.util.spec_from_file_location("nembra_authenticated_signed_artifact",module_path)\n    if not spec or not spec.loader: raise GoError("retained signed-artifact module unavailable")\n    module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)\n    try: return module.retain_and_reinspect(repo,source,device,install,output)\n    except Exception as error: raise GoError(f"retained signed-artifact production failed: {error}") from error\n\ndef retained_signed_artifact_reinspect(repo:Path,source:str,device:Path,install:dict[str,Any],output:Path)->dict[str,Any]:\n    module_path=Path(__file__).with_name("es80_authenticated_stationary_signed_artifact.py")\n    spec=importlib.util.spec_from_file_location("nembra_authenticated_signed_artifact",module_path)\n    if not spec or not spec.loader: raise GoError("retained signed-artifact module unavailable")\n    module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)\n    try: return module.reinspect_retained(output,repo,source,device,install)\n    except Exception as error: raise GoError(f"retained signed-artifact reinspection failed: {error}") from error\n\ndef build(*,authority_repo:Path,authority_pr:int,authority_run:int,candidate_repo:Path,source:str,pr:int,runs:dict[str,int],artifact_id:int,review_id:int,archive:Path,device_file:Path,retained_ipa:Path,get=api,control_authority=control_plane,run_installer=installer,inspect_signed_artifact=retained_signed_artifact,reinspect_signed_artifact=retained_signed_artifact_reinspect,now=None):\n'''
          if r.count(old)!=1: raise SystemExit('issuer retained seam changed')
          r=r.replace(old,new,1)
          old='''    signed=inspect_signed_artifact(candidate_repo,source,device_file,got)\n'''
          new='''    signed=inspect_signed_artifact(candidate_repo,source,device_file,got,retained_ipa)\n'''
          if r.count(old)!=1: raise SystemExit('issuer signed call changed')
          r=r.replace(old,new,1)
          old='''    post_ps,post_ws=public(source,pr,runs,get); post_vs=visual(source,runs[VISUAL],artifact_id,archive,get); post_rv=review(pr,review_id,source,post_vs,get); post_cs=candidate(candidate_repo,source); post_dh=device_hash(device_file)\n'''
          new='''    post_ps,post_ws=public(source,pr,runs,get); post_vs=visual(source,runs[VISUAL],artifact_id,archive,get); post_rv=review(pr,review_id,source,post_vs,get); post_cs=candidate(candidate_repo,source); post_dh=device_hash(device_file); post_signed=reinspect_signed_artifact(candidate_repo,source,device_file,got,retained_ipa)\n'''
          if r.count(old)!=1: raise SystemExit('issuer post seam changed')
          r=r.replace(old,new,1)
          old='''    if any(post_ps[k]!=ps[k] for k in stable_pr) or post_ws!=ws or post_vs!=vs or post_rv!=rv or post_cs!=cs or post_dh!=dh:\n'''
          new='''    if any(post_ps[k]!=ps[k] for k in stable_pr) or post_ws!=ws or post_vs!=vs or post_rv!=rv or post_cs!=cs or post_dh!=dh or post_signed!=signed:\n'''
          if r.count(old)!=1: raise SystemExit('issuer drift seam changed')
          r=r.replace(old,new,1)
          old='''p.add_argument("--intended-device-udid-file",type=Path,required=True); p.add_argument("--output",type=Path,required=True);'''
          new='''p.add_argument("--intended-device-udid-file",type=Path,required=True); p.add_argument("--retained-field-ipa",type=Path,required=True); p.add_argument("--output",type=Path,required=True);'''
          if r.count(old)!=1: raise SystemExit('issuer CLI seam changed')
          r=r.replace(old,new,1)
          old='''archive=a.visual_artifact_archive,device_file=a.intended_device_udid_file)'''
          new='''archive=a.visual_artifact_archive,device_file=a.intended_device_udid_file,retained_ipa=a.retained_field_ipa)'''
          if r.count(old)!=1: raise SystemExit('issuer CLI call seam changed')
          i.write_text(r.replace(old,new,1))

          gt=Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go.py');g=gt.read_text()
          g=g.replace('def signed(self,repo,s,dev,install):return {','def signed(self,repo,s,dev,install,output):return {')
          build_old='''device_file=self.dev,get=self.get,control_authority=self.control,run_installer=self.inst,inspect_signed_artifact=self.signed);'''
          build_new='''device_file=self.dev,retained_ipa=self.r/'retained.ipa',get=self.get,control_authority=self.control,run_installer=self.inst,inspect_signed_artifact=self.signed,reinspect_signed_artifact=self.signed);'''
          if g.count(build_old)!=1: raise SystemExit('GO test build seam changed')
          g=g.replace(build_old,build_new,1)
          old='''device_file=self.f.dev,get=self.f.get,control_authority=self.f.control,run_installer=self.f.inst)'''
          new='''device_file=self.f.dev,retained_ipa=self.f.r/'retained.ipa',get=self.f.get,control_authority=self.f.control,run_installer=self.f.inst)'''
          if g.count(old)!=1: raise SystemExit('GO default test seam changed')
          g=g.replace(old,new,1)
          g=g.replace('def bad(r,s,d,i):x=self.f.signed(r,s,d,i);','def bad(r,s,d,i,o):x=self.f.signed(r,s,d,i,o);')
          gt.write_text(g)
          PY
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/es80_authenticated_stationary_signed_artifact.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          git diff --check
      - name: Commit wiring and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-wire-retained-ipa-final-go.yml
          git add scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/es80_authenticated_stationary_signed_artifact.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          git diff --cached --check
          git commit -m 'feat(capture): wire retained signed IPA into Final GO'
          git push origin HEAD:control/v14-auth-stationary-final-go-sol
