name: Capture Final GO Whole Tree Mutation Custody

on:
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_private_review_final_go.py
      - scripts/ci/tests/test_es80_final_go_whole_tree_mutation_custody.py
      - scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py
      - .github/workflows/capture-final-go-whole-tree-mutation-custody.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  whole-tree-mutation-custody:
    name: Whole-tree custody (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact head and production parent
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCTION_PARENT: 471cc025b332f4df8b43a98d709710aeb4e0698f
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$PRODUCTION_PARENT" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check "$PRODUCTION_PARENT"...HEAD
          git diff --name-only "$PRODUCTION_PARENT"...HEAD | LC_ALL=C sort > /tmp/actual-paths
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/capture-final-go-whole-tree-mutation-custody.yml
          scripts/ci/es80_authenticated_stationary_private_review_final_go.py
          scripts/ci/tests/test_es80_final_go_whole_tree_mutation_custody.py
          scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py
          EOF
          LC_ALL=C sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Compile exact successor and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_final_go_whole_tree_mutation_custody.py \
            scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py \
            scripts/ci/tests/test_es80_final_go_git_object_chain_custody.py

      - name: Reject post-admission and mutate-restore tracked-tree races
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_final_go_whole_tree_mutation_custody.py

      - name: Preserve exact predecessor execution custody
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py

      - name: Preserve verified Git commit and tree object chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_final_go_git_object_chain_custody.py
