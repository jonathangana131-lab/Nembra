name: V14 reanchor recoverable admission

on:
  push:
    branches:
      - feature/es80-v14-recoverable-admission-current-4636/gpt56-thinking

permissions:
  contents: write

jobs:
  reanchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reanchor validated product blobs
        run: |
          set -euo pipefail
          git checkout a0f3b1391d8ac6a0c49ee81e434640193dc40b15 -- \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneRecoverableRediscoveryTests.swift
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          c = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift').read_text()
          a = c.index('func connectUsingExperimentOneAdmission(')
          b = c.index('public func cancelActiveConnection()', a)
          m = c[a:b]
          assert 'let preview = admission.preview' in m
          assert m.index('peripheralByIdentifier[') < m.index('admission.consume()')
          assert m.index('latestDiscoveryByIdentifier[') < m.index('admission.consume()')
          assert m.index('targetState.validateCanBeginAttempt(') < m.index('admission.consume()')
          assert m.index('latestAdvertisementByIdentifier[') < m.index('admission.consume()')
          assert m.index('receivedAtUptimeNanoseconds >=') < m.index('admission.consume()')
          assert m.index('admission.consume()') < m.index('recorder = payload.recorder')
          assert m.count('admission.consume()') == 1
          r = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift').read_text()
          assert 'struct Preview: Equatable, Sendable' in r
          assert 'var preview: Preview' in r
          # Current flagship additions must survive because they are path-disjoint.
          assert Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCoordinator.swift').exists()
          PY
      - name: Publish clean product checkpoint
        run: |
          set -euo pipefail
          rm .github/workflows/v14-reanchor-recoverable-admission.yml
          git add -A
          git diff --cached --check
          git config user.name nembra-v14-gpt56
          git config user.email actions@users.noreply.github.com
          git commit -m "Capture: reanchor recoverable admission on current flagship"
          git push origin HEAD:feature/es80-v14-recoverable-admission-current-4636/gpt56-thinking
