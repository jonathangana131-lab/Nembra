name: Capture 2094 Package Diagnostic

on:
  push:
    branches:
      - diagnostic/capture-2094-package-failure-sol

permissions:
  contents: read

jobs:
  capture-package:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6

      - name: Reproduce Capture package failure with durable annotation
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee "$RUNNER_TEMP/capture-package.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/capture-package.log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          tail = text[-6000:]
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Capture package swift test failure::{escaped}")
          PY
            exit "$status"
          fi
