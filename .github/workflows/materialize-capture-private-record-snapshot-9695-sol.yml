name: Materialize Capture Private Record Snapshot 9695

on:
  push:
    branches:
      - "fix/v14-capture-private-record-snapshot-9695-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Verify exact product parent
        shell: bash
        run: |
          set -euo pipefail
          product="9695af19c21c93b3eb4bc867613a6df0c9a3b3d4"
          test "$(git rev-parse HEAD^)" = "$product"

      - name: Materialize whole-record generation fence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Scripts/capture_tuya_private_input_provenance.py")
          source = path.read_text(encoding="utf-8")
          marker = "\ndef build_record(\n"
          if source.count(marker) != 1:
              raise SystemExit(f"build_record marker count={source.count(marker)}")

          helper = '''
          def _regular_file_generation_identity(path: Path) -> tuple[int, ...]:
              try:
                  metadata = path.lstat()
              except OSError as error:
                  raise ProvenanceError(
                      f"required private build input is unavailable: {path.name}"
                  ) from error
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                  raise ProvenanceError(
                      f"required private build input is not a regular file: {path.name}"
                  )
              return _stat_identity(metadata)


          def _tree_generation_snapshot(root: Path) -> tuple[tuple[object, ...], ...]:
              try:
                  root_metadata = root.lstat()
              except OSError as error:
                  raise ProvenanceError(
                      f"required private build directory is unavailable: {root.name}"
                  ) from error
              if stat.S_ISLNK(root_metadata.st_mode) or not stat.S_ISDIR(root_metadata.st_mode):
                  raise ProvenanceError(
                      f"required private build directory is not a real directory: {root.name}"
                  )

              root_resolved = root.resolve(strict=True)
              states: list[tuple[str, str, tuple[int, ...], str]] = [
                  ("D", ".", _stat_identity(root_metadata), "")
              ]
              observed_states: list[tuple[Path, tuple[int, ...], str]] = [
                  (root, _stat_identity(root_metadata), "D")
              ]
              observed_members: dict[Path, tuple[str, ...]] = {}

              for current_text, directory_names, file_names in os.walk(
                  root,
                  topdown=True,
                  followlinks=False,
              ):
                  current = Path(current_text)
                  observed_members[current] = tuple(
                      sorted((*directory_names, *file_names), key=os.fsencode)
                  )
                  kept_directories: list[str] = []

                  for name in sorted(directory_names, key=os.fsencode):
                      candidate = current / name
                      relative = candidate.relative_to(root).as_posix()
                      metadata = candidate.lstat()
                      identity = _stat_identity(metadata)
                      if stat.S_ISLNK(metadata.st_mode):
                          target = _assert_internal_symlink(candidate, root_resolved)
                          observed_states.append((candidate, identity, "L"))
                          states.append(("L", relative, identity, target))
                      elif stat.S_ISDIR(metadata.st_mode):
                          observed_states.append((candidate, identity, "D"))
                          states.append(("D", relative, identity, ""))
                          kept_directories.append(name)
                      else:
                          raise ProvenanceError(
                              "private build tree contains an unsupported directory entry"
                          )
                  directory_names[:] = kept_directories

                  for name in sorted(file_names, key=os.fsencode):
                      candidate = current / name
                      relative = candidate.relative_to(root).as_posix()
                      metadata = candidate.lstat()
                      identity = _stat_identity(metadata)
                      if stat.S_ISLNK(metadata.st_mode):
                          target = _assert_internal_symlink(candidate, root_resolved)
                          observed_states.append((candidate, identity, "L"))
                          states.append(("L", relative, identity, target))
                      elif stat.S_ISREG(metadata.st_mode):
                          observed_states.append((candidate, identity, "F"))
                          states.append(("F", relative, identity, ""))
                      else:
                          raise ProvenanceError(
                              "private build tree contains an unsupported file entry"
                          )

              for candidate, identity, kind in observed_states:
                  _assert_unchanged_tree_entry(candidate, identity, kind)
              for directory, members in observed_members.items():
                  if _directory_member_names(directory) != members:
                      raise ProvenanceError(
                          "private build tree changed while its record generation was snapshotted"
                      )
              return tuple(sorted(states, key=lambda item: os.fsencode(str(item[1]))))


          def _private_input_record_generation_snapshot(
              *,
              lockfile: Path,
              security_podspec: Path,
              security_build: Path,
              identity_podspec: Path,
              identity_sources: Path,
          ) -> tuple[object, ...]:
              return (
                  ("podfile_lock", _regular_file_generation_identity(lockfile)),
                  ("security_podspec", _regular_file_generation_identity(security_podspec)),
                  ("security_build", _tree_generation_snapshot(security_build)),
                  ("identity_podspec", _regular_file_generation_identity(identity_podspec)),
                  ("identity_sources", _tree_generation_snapshot(identity_sources)),
              )

          '''
          source = source.replace(marker, helper + marker, 1)

          start = source.index("def build_record(\n")
          end = source.index("\ndef _record_text", start)
          old = source[start:end]
          new = '''def build_record(
              *,
              lockfile: Path,
              security_podspec: Path,
              security_build: Path,
              identity_podspec: Path,
              identity_sources: Path,
          ) -> dict[str, str]:
              generation_snapshot = _private_input_record_generation_snapshot(
                  lockfile=lockfile,
                  security_podspec=security_podspec,
                  security_build=security_build,
                  identity_podspec=identity_podspec,
                  identity_sources=identity_sources,
              )
              record = {
                  "schema": SCHEMA,
                  "podfile_lock_sha256": _read_stable_regular_file_sha256(lockfile)[1],
                  "thing_smart_home_kit": THING_SMART_HOME_KIT_VERSION,
                  "thing_smart_business_extension_kit": THING_SMART_BUSINESS_EXTENSION_KIT_VERSION,
                  "thing_smart_cryption_podspec_sha256": _file_fingerprint(security_podspec),
                  "thing_smart_cryption_build_tree_sha256": _tree_fingerprint(security_build),
                  "private_identity_podspec_sha256": _file_fingerprint(identity_podspec),
                  "private_identity_sources_tree_sha256": _tree_fingerprint(identity_sources),
              }
              if _private_input_record_generation_snapshot(
                  lockfile=lockfile,
                  security_podspec=security_podspec,
                  security_build=security_build,
                  identity_podspec=identity_podspec,
                  identity_sources=identity_sources,
              ) != generation_snapshot:
                  raise ProvenanceError(
                      "private build inputs changed while the provenance record was constructed"
                  )
              return record
          '''
          if "    return {" not in old:
              raise SystemExit("expected old direct-return build_record shape")
          source = source[:start] + new + source[end:]
          path.write_text(source, encoding="utf-8")
          PY

          red="8d47bcdfc92b0681388bacc155d64b01d01f7d24"
          git fetch --no-tags --depth=1 origin "$red"
          red_test="scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py"
          test ! -e "$red_test"
          git show "$red:$red_test" > "$red_test"

          cat > scripts/ci/tests/test_capture_tuya_private_input_record_tree_generation.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import importlib.util
          import tempfile
          import unittest
          from pathlib import Path
          from unittest import mock

          ROOT = Path(__file__).resolve().parents[3]
          HELPER = ROOT / "Scripts" / "capture_tuya_private_input_provenance.py"
          SPEC = importlib.util.spec_from_file_location("capture_tuya_private_input_provenance", HELPER)
          if SPEC is None or SPEC.loader is None:
              raise RuntimeError("could not load provenance helper")
          provenance = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(provenance)

          class TreeGenerationFenceTests(unittest.TestCase):
              def test_earlier_tree_child_mutate_restore_is_rejected(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      security = root / "security"
                      identity = root / "identity"
                      security.mkdir(); identity.mkdir()
                      security_child = security / "blob.bin"
                      security_child.write_bytes(b"AAAA")
                      identity_child = identity / "identity.swift"
                      identity_child.write_text("identity", encoding="utf-8")
                      lockfile = root / "Podfile.lock"; lockfile.write_text("lock", encoding="utf-8")
                      security_podspec = root / "security.podspec"; security_podspec.write_text("s", encoding="utf-8")
                      identity_podspec = root / "identity.podspec"; identity_podspec.write_text("i", encoding="utf-8")
                      original = provenance._tree_fingerprint
                      mutated = False

                      def wrapped(path: Path) -> str:
                          nonlocal mutated
                          result = original(path)
                          if path == identity and not mutated:
                              security_child.write_bytes(b"BBBB")
                              security_child.write_bytes(b"AAAA")
                              mutated = True
                          return result

                      with mock.patch.object(provenance, "_tree_fingerprint", side_effect=wrapped):
                          with self.assertRaises(provenance.ProvenanceError):
                              provenance.build_record(
                                  lockfile=lockfile,
                                  security_podspec=security_podspec,
                                  security_build=security,
                                  identity_podspec=identity_podspec,
                                  identity_sources=identity,
                              )
                      self.assertTrue(mutated)

          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Validate record-level chronology
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_tree_generation.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path("Scripts/capture_tuya_private_input_provenance.py").read_text(encoding="utf-8")
          start = s.index("def build_record(")
          end = s.index("\ndef _record_text", start)
          build = s[start:end]
          required = [
              "generation_snapshot = _private_input_record_generation_snapshot(",
              "record = {",
              ") != generation_snapshot:",
              "private build inputs changed while the provenance record was constructed",
              "return record",
          ]
          missing = [token for token in required if token not in build]
          if missing:
              raise SystemExit(f"missing whole-record snapshot invariants: {missing}")
          if "    return {" in build:
              raise SystemExit("build_record still directly promotes sequential component fingerprints")
          if "def _tree_generation_snapshot(" not in s:
              raise SystemExit("tree generation witness missing")
          print("whole-record private provenance chronology: PASS")
          PY
          git diff --check

      - name: Commit durable path-disjoint repair
        shell: bash
        run: |
          set -euo pipefail
          product="9695af19c21c93b3eb4bc867613a6df0c9a3b3d4"
          rm .github/workflows/materialize-capture-private-record-snapshot-9695-sol.yml
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$product" | sort)
          expected=(
            "Scripts/capture_tuya_private_input_provenance.py"
            "scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py"
            "scripts/ci/tests/test_capture_tuya_private_input_record_tree_generation.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}" || { printf 'Unexpected effective paths:\n' >&2; printf '  %s\n' "${changed[@]}" >&2; exit 1; }
          git config user.name "Nembra V14 Sol"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): fence private provenance record generation"
          git push origin HEAD:fix/v14-capture-private-record-snapshot-9695-sol
