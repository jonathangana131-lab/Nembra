name: Capture retry-safe coordinator current 629

on:
  push:
    branches:
      - integration/es80-v14-retry-safe-coordinator-current-629/gpt56

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: integration/es80-v14-retry-safe-coordinator-current-629/gpt56

      - name: Verify exact reviewed inputs
        shell: bash
        run: |
          set -euo pipefail
          root=Packages/NembraBluetoothCapture
          test "$(git hash-object "$root/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift")" = "5ca1fa178bd9a6c0ac49f6036a2b884cdc400d57"
          test "$(git hash-object "$root/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")" = "a112a57f66a192d4ef56e7b887a28ee4b88ac6d9"
          test "$(git hash-object "$root/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCoordinator.swift")" = "517ec4ed89aefc22abf06199308c4564f2622525"
          test "$(git hash-object "$root/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneRecoverableRediscoveryTests.swift")" = "f7bab4faa448d0f7c24a4b570ea691bbcead0346"
          test "$(git hash-object "$root/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneCoordinatorContractTests.swift")" = "7e15cb2e948fef57f0b7e20489bc653aef365809"
          python3 -m py_compile scripts/ci/capture_retry_safe_coordinator_patch.py

      - name: Apply strict recoverability convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/capture_retry_safe_coordinator_patch.py
          git diff --check
          run=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          coordinator=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCoordinator.swift
          grep -q 'struct StagingPreview: Equatable, Sendable' "$run"
          grep -q 'fileprivate init(payload: Payload)' "$run"
          ! grep -A12 'struct StagingPreview: Equatable, Sendable' "$run" | grep -q 'powerCycleEvidence'
          grep -q 'admission.previewForControllerStaging()' "$controller"
          grep -q 'receivedAtUptimeNanoseconds > preview.issuedAtUptimeNanoseconds' "$controller"
          ! grep -q 'receivedAtUptimeNanoseconds >= preview.issuedAtUptimeNanoseconds' "$controller"
          grep -q 'if (try? admission.previewForControllerStaging()) == nil' "$coordinator"
          ! grep -A30 'public func connectPreparedCapture' "$coordinator" | grep -q 'defer {'

      - name: Commit clean product tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-retry-safe-coordinator-current-629.yml
          rm scripts/ci/capture_retry_safe_coordinator_patch.py
          rm -rf scripts/ci/__pycache__
          git config user.name "nembra-v14-swarm"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): retain sealed admission across recoverable staging"
          git push origin HEAD:integration/es80-v14-retry-safe-coordinator-current-629/gpt56
