name: Capture Root AX First Fold Materializer

on:
  push:
    branches:
      - agent/v14-capture-root-truth-visual-convergence-sol
    paths:
      - '.github/workflows/capture-root-ax-first-fold-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify unchanged product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "b81fbf5fd9e257393bde921f3a9f811377230020"
          git merge-base --is-ancestor 9df1def03af40f1e452acb3f6d2aa5d52dac5681 HEAD
          unexpected="$(git diff --name-only 9df1def03af40f1e452acb3f6d2aa5d52dac5681 HEAD | grep -Ev '^(\.github/workflows/capture-root-ax-first-fold-materialize\.yml|\.github/scripts/capture_root_ax_first_fold_materialize\.py)$' || true)"
          test -z "$unexpected"

      - name: Materialize Accessibility first fold
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/capture_root_ax_first_fold_materialize.py
          git diff --check
          grep -Fq 'Text(fieldBuildIsAuthoritative ? "Field build ready" : "Physical capture locked")' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'This public build can prepare account metadata, but it cannot scan, connect, or collect physical scooter evidence.' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Account setup only in this public build.' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Create approval QR' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Commit product-only result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/capture-root-ax-first-fold-materialize.yml
          git rm .github/scripts/capture_root_ax_first_fold_materialize.py
          git diff --check
          git config user.name 'Nembra Capture Closure'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m 'ui(capture): expose AX metadata action in first fold'
          git push origin HEAD:agent/v14-capture-root-truth-visual-convergence-sol
