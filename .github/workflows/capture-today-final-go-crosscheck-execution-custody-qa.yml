name: Capture TODAY Final GO Crosscheck Execution Custody QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_crosscheck_receipt_custody.py
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_crosscheck_receipt_custody.py
      - scripts/ci/tests/test_es80_today_final_go_hardened.py
      - .github/workflows/capture-today-final-go-crosscheck-execution-custody-qa.yml

permissions:
  contents: read

jobs:
  crosscheck-execution-custody:
    name: Bind crosscheck receipt to fresh pinned verifier execution
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile custody implementation and composition tests
        run: |
          python3 -m py_compile scripts/ci/es80_today_crosscheck_receipt_custody.py scripts/ci/tests/test_es80_today_crosscheck_receipt_custody.py
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py scripts/ci/tests/test_es80_today_final_go_hardened.py

      - name: Verify fresh pinned crosscheck execution custody
        run: python3 scripts/ci/tests/test_es80_today_crosscheck_receipt_custody.py -v

      - name: Preserve hardened Final GO composition
        run: python3 scripts/ci/tests/test_es80_today_final_go_hardened.py -v

      - name: Pin canonical hardening contract
        run: |
          set -euo pipefail
          grep -Fq '"es80_today_crosscheck_receipt_custody.py"' scripts/ci/es80_today_final_go_hardened.py
          grep -Fq 'verify_crosscheck_receipt_custody(' scripts/ci/es80_today_final_go_hardened.py
          grep -Fq 'fresh-pinned-tool-exact-stdout-v1' scripts/ci/es80_today_crosscheck_receipt_custody.py
          grep -Fq '"cat-file", "blob", expected_tool_blob' scripts/ci/es80_today_crosscheck_receipt_custody.py
          grep -Fq 'supplied == fresh_stdout' scripts/ci/es80_today_crosscheck_receipt_custody.py

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
