name: Capture app truth repair on Xcode

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'GO apply canonical Capture app truth repairs on xcode'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/current-main-tuya-readonly-convergence-gpt56
          fetch-depth: 0

      - name: Compose reviewed canonical app truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/capture-app-truth-repair-r2.yml').read_text()
          compose = source.index('      - name: Compose canonical Capture app truth\n')
          truth = source.index('      - name: Run focused truth contracts\n', compose)
          chunk = source[compose:truth]
          marker = '        run: |\n'
          body = chunk.split(marker, 1)[1]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip() == '':
                  lines.append('')
              else:
                  raise SystemExit(f'unexpected compose indentation: {line!r}')
          Path('/tmp/nembra-compose-r2.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/nembra-compose-r2.sh

      - name: Run focused truth contracts on Apple toolchain
        shell: bash
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --filter TuyaAuthenticatedReadOnlySessionLedgerTests
          swift test --filter TuyaAuthenticatedTerminalHorizonTests
          swift test --filter TuyaAuthenticatedReadOnlyHorizonTests
          swift test --filter TuyaAuthenticatedReadOnlyHorizonTestsAppIntegration
          swift test --filter TuyaAppIncompleteHorizonTerminalSourceTests
          swift test --filter TuyaAlreadyTerminalObservationContinuitySourceTests
          swift test --filter TuyaDeviceSharingAuthenticationAuthorityTests

      - name: Publish coherent canonical repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/capture-app-truth-repair-xcode-go.yml
          rm -f .github/workflows/capture-r2-suite-diagnostic.yml
          rm -f .github/workflows/capture-r2-compiler-diagnostic.yml
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Capture V16.1: compose app truth on Apple toolchain'
          git push origin HEAD:capture/current-main-tuya-readonly-convergence-gpt56
