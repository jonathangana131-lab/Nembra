name: Capture Dedicated UID Principal Retirement

on:
  push:
    branches:
      - validation/v14-dedicated-uid-principal-retirement-sol-20260812
    paths:
      - .github/workflows/capture-signed-origin-dedicated-uid-principal-retirement.yml
      - scripts/ci/tests/test_capture_signed_app_dedicated_uid_principal_retirement.py
  pull_request:
    paths:
      - .github/workflows/capture-signed-origin-dedicated-uid-principal-retirement.yml
      - scripts/ci/tests/test_capture_signed_app_dedicated_uid_principal_retirement.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-dedicated-uid-principal-retirement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-principal-retirement:
    name: Prove fresh build principal retirement
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact validation scope
        shell: bash
        env:
          EXACT_PARENT: 0962d459d065518e627de46178771053dbce62fc
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          actual_paths="$RUNNER_TEMP/nembra-principal-retirement-actual.txt"
          expected_paths="$RUNNER_TEMP/nembra-principal-retirement-expected.txt"
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$actual_paths"
          cat > "$expected_paths" <<'EOF'
          .github/workflows/capture-signed-origin-dedicated-uid-principal-retirement.yml
          scripts/ci/tests/test_capture_signed_app_dedicated_uid_principal_retirement.py
          EOF
          LC_ALL=C sort -o "$expected_paths" "$expected_paths"
          diff -u "$expected_paths" "$actual_paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile and source-audit retirement witness
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-principal-retirement-pycache"
          probe='scripts/ci/tests/test_capture_signed_app_dedicated_uid_principal_retirement.py'
          /usr/bin/python3 -m py_compile "$probe"
          grep -Fq 'livePrincipalRejectedBeforeCleanup' "$probe"
          grep -Fq 'partialGroupSurvivalRejected' "$probe"
          grep -Fq 'userDeleteReturnCode' "$probe"
          grep -Fq 'groupDeleteReturnCode' "$probe"
          grep -Fq 'liveUIDProcesses' "$probe"
          grep -Fq 'pwd.getpwnam' "$probe"
          grep -Fq 'grp.getgrnam' "$probe"
          grep -Fq 'pwd.getpwuid' "$probe"
          grep -Fq 'grp.getgrgid' "$probe"
          grep -Fq 'principalRetirementAccepted' "$probe"
          grep -Fq 'productionBytesChanged' "$probe"
          grep -Fq 'physicalAuthorityCreated' "$probe"
          if grep -Fq 'xcodebuild' "$probe" || grep -Fq 'devicectl' "$probe" || grep -Fq 'CoreBluetooth' "$probe"; then
            printf 'Principal-retirement validation must not exercise product/device authority.\n' >&2
            exit 21
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run real macOS principal-retirement witness
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/nembra-dedicated-uid-principal-retirement.log"
          set +e
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_dedicated_uid_principal_retirement.py 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'probe_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Seal retained classification
        if: always()
        shell: bash
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.probe_status }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/nembra-dedicated-uid-principal-retirement.log"
          out="$RUNNER_TEMP/nembra-dedicated-uid-principal-retirement.json"
          /usr/bin/python3 - "$log" "$out" "${PROBE_STATUS:-missing}" "$EXACT_HEAD" <<'PY'
          import hashlib, json, pathlib, sys
          log = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          status = sys.argv[3]
          head = sys.argv[4].lower()
          text = log.read_text(encoding="utf-8", errors="replace") if log.exists() else ""
          payload = {
              "schemaVersion": 1,
              "exactValidationHead": head,
              "exactProductionParent": "0962d459d065518e627de46178771053dbce62fc",
              "probeStatus": status,
              "successEvidence": [line for line in text.splitlines() if line.startswith("NEMBRA_DEDICATED_UID_PRINCIPAL_RETIREMENT_JSON=")],
              "redEvidence": [line for line in text.splitlines() if line.startswith("NEMBRA_DEDICATED_UID_PRINCIPAL_RETIREMENT_ERROR=")],
              "probeLogSHA256": hashlib.sha256(text.encode("utf-8")).hexdigest(),
              "productionBytesChanged": False,
              "productionAcceptanceClaimed": False,
              "physicalAuthorityCreated": False,
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Retain exact retirement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-dedicated-uid-principal-retirement-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nembra-dedicated-uid-principal-retirement.log
            ${{ runner.temp }}/nembra-dedicated-uid-principal-retirement.json
          if-no-files-found: error
          retention-days: 7

      - name: Require fail-closed principal retirement
        shell: bash
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.probe_status }}
        run: |
          set -euo pipefail
          test "${PROBE_STATUS:-missing}" = 0
          log="$RUNNER_TEMP/nembra-dedicated-uid-principal-retirement.log"
          grep -q '^NEMBRA_DEDICATED_UID_PRINCIPAL_RETIREMENT_JSON=' "$log"
          grep -q '"livePrincipalRejectedBeforeCleanup": true' "$log"
          grep -q '"partialGroupSurvivalRejected": true' "$log"
          grep -q '"principalRetirementAccepted": true' "$log"
          grep -q '"productionBytesChanged": false' "$log"
          grep -q '"productionAcceptanceClaimed": false' "$log"
          grep -q '"physicalAuthorityCreated": false' "$log"

      - name: Diff hygiene
        if: always()
        shell: bash
        env:
          EXACT_PARENT: 0962d459d065518e627de46178771053dbce62fc
        run: |
          set -euo pipefail
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
