name: Materialize Capture Event Privacy Closure

on:
  push:
    branches:
      - sol/v14-capture-event-privacy-closure-8069-20260810

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-event-privacy-closure-8069-20260810
          fetch-depth: 0
      - name: Guard exact product parent and owned paths
        shell: bash
        run: |
          set -euo pipefail
          parent='8069c0ffec496cacbe263016d8a7f4ca15ddc64e'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --quiet "$parent" HEAD -- NembraApp/Features/Research/TuyaAccountBridge.swift
          git diff --quiet "$parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
      - name: Apply event privacy closure
        run: python3 scripts/ci/materialize_capture_event_privacy_closure.py apply
      - name: Verify event privacy closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_event_privacy_closure.py verify
          python3 -m py_compile scripts/ci/materialize_capture_event_privacy_closure.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse NembraApp/Features/Research/TuyaAccountBridge.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git diff --check
      - name: Publish clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-event-privacy-closure.yml
          rm scripts/ci/materialize_capture_event_privacy_closure.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): close accepted event privacy custody'
          git push origin HEAD:sol/v14-capture-event-privacy-closure-8069-20260810
