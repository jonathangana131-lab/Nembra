name: Capture Private Input Review Witness

on:
  pull_request:
    paths:
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - Scripts/capture_tuya_private_input_provenance.py
      - Scripts/capture_cocoapods_generated_build_subject.py
      - scripts/ci/tests/test_capture_private_input_review_witness.py
      - .github/workflows/capture-private-input-review-witness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-review-witness:
    name: Require review-only private witness authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind gate to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile and syntax-check authority paths
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          /usr/bin/python3 -m py_compile Scripts/capture_cocoapods_generated_build_subject.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_input_review_witness.py
      - name: Require reviewed private witness before CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_private_input_review_witness.py
