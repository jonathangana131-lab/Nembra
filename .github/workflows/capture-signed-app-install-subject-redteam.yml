name: Capture Signed App Install Subject Red Team

on:
  push:
    branches:
      - adversarial/v14-capture-signed-app-install-boundary-sol
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_signed_app_install_subject.py
      - .github/workflows/capture-signed-app-install-subject-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-app-install-subject:
    name: Require exact verified app at devicectl boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind diagnostic to exact checked-out source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'Exact diagnostic source: %s\n' "$actual"

      - name: Compile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_signed_app_install_subject.py

      - name: Require exact verified app at install side effect
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_subject.py
