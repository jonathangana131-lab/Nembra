# GO recovery trigger: re-run the reviewed compare-and-swap lifecycle materializer.
name: Capture carrier authority materialize once

on:
  push:
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - .github/workflows/capture-carrier-authority-materialize-once.yml

permissions:
  contents: write

concurrency:
  group: capture-carrier-authority-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      TARGET_BRANCH: product/capture-1-0-main-20260818
      AUTHORING_WORKFLOW: .github/workflows/capture-carrier-authority-materialize-once.yml
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      EXPECTED_SOURCE_BLOB: 627c17949d15aaf26ca28c12abb9bb684ab0e731
    steps:
      - name: Checkout carrier with write credentials
        uses: actions/checkout@v6
        with:
          ref: product/capture-1-0-main-20260818
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare deterministic authority transform
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/materialize_capture_authority.py" <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              '''            if phase == .failed {\n                operatorSafetyAttemptID = nil\n                operatorSafetyAttemptStartedAtUptimeNanoseconds = nil\n            }\n''',
              '''            if phase == .failed {\n                fieldAuthorization.revoke()\n                operatorSafetyAttemptID = nil\n                operatorSafetyAttemptStartedAtUptimeNanoseconds = nil\n            }\n''',
              "failed-phase revocation",
          )
          replace_once(
              '''    private let buildIdentity = NembraCaptureBuildIdentity.current\n    private var byID: [UUID: Candidate] = [:]\n''',
              '''    private let buildIdentity = NembraCaptureBuildIdentity.current\n    private let fieldAuthorization = NembraCaptureFieldAuthorizationController()\n    private var byID: [UUID: Candidate] = [:]\n''',
              "authorization controller ownership",
          )
          replace_once(
              '''    func abandonCorrelationForViewExit() {\n        // Close the screen-lifetime admission boundary before revoking every already-issued grant.\n''',
              '''    func abandonCorrelationForViewExit() {\n        fieldAuthorization.revoke()\n        // Close the screen-lifetime admission boundary before revoking every already-issued grant.\n''',
              "view-exit revocation",
          )
          replace_once(
              '''    func appDidLoseForeground() {\n        // A sealed accepted artifact is immutable and already closed to new evidence. Backgrounding\n        // after acceptance must not downgrade or rebuild that frozen result.\n        guard phase != .accepted else { return }\n        guard !foregroundIntegrityLossHandled else { return }\n''',
              '''    func appDidLoseForeground() {\n        // A sealed accepted artifact is immutable and already closed to new evidence. Backgrounding\n        // after acceptance must not downgrade or rebuild that frozen result.\n        guard phase != .accepted else { return }\n        fieldAuthorization.revoke()\n        guard !foregroundIntegrityLossHandled else { return }\n''',
              "foreground revocation",
          )
          replace_once(
              '''    func invalidateSDKMembership() {\n        let token = currentConnectionToken\n''',
              '''    func invalidateSDKMembership() {\n        fieldAuthorization.revoke()\n        let token = currentConnectionToken\n''',
              "membership revocation",
          )
          replace_once(
              '''            guard authorized,\n                  self.sdkAccountLoggedIn,\n                  leaseVerdict == .authorized else {\n                self.failLocally("Exact scooter membership could not be proven for this same current SDK account. Bluetooth correlation remains disabled.", "sdk_device_membership_required_before_scan")\n                return\n            }\n            self.beginCorrelationSeries()\n''',
              '''            guard authorized,\n                  self.sdkAccountLoggedIn,\n                  leaseVerdict == .authorized else {\n                self.failLocally("Exact scooter membership could not be proven for this same current SDK account. Bluetooth correlation remains disabled.", "sdk_device_membership_required_before_scan")\n                return\n            }\n            do {\n                try self.fieldAuthorization.admitOFF1Start()\n            } catch {\n                self.failLocally(\n                    "The independently verified one-attempt authorization did not admit OFF1: \\(error.localizedDescription)",\n                    "field_authorization_rejected_off1"\n                )\n                return\n            }\n            self.beginCorrelationSeries()\n''',
              "OFF1 admission",
          )
          replace_once(
              '''            guard stillAuthorized,\n                  self.phase == .selected,\n                  self.targetCorrelationOperatorConfirmed,\n                  self.sdkAccountLoggedIn,\n                  self.accountIdentityLeaseIsAuthorized,\n                  self.selectedID == candidate.id else {\n                self.failLocally("Exact confirmed scooter/account authority could not be re-verified immediately before BLE authentication.", "sdk_device_membership_recheck_failed")\n                return\n            }\n            self.beginOfficialConnection(candidate: candidate)\n''',
              '''            guard stillAuthorized,\n                  self.phase == .selected,\n                  self.targetCorrelationOperatorConfirmed,\n                  self.sdkAccountLoggedIn,\n                  self.accountIdentityLeaseIsAuthorized,\n                  self.selectedID == candidate.id else {\n                self.failLocally("Exact confirmed scooter/account authority could not be re-verified immediately before BLE authentication.", "sdk_device_membership_recheck_failed")\n                return\n            }\n            do {\n                try self.fieldAuthorization.admitAuthenticationStart()\n            } catch {\n                self.failLocally(\n                    "The independently verified one-attempt authorization did not admit authentication: \\(error.localizedDescription)",\n                    "field_authorization_rejected_authentication"\n                )\n                return\n            }\n            self.beginOfficialConnection(candidate: candidate)\n''',
              "authentication admission",
          )
          replace_once(
              '''        guard targetCorrelationOperatorConfirmed,\n              selectedID == candidate.id,\n              candidate.likely,\n              buildIdentity.isAuthoritativeFieldBuild,\n              sdkDeviceMembershipVerified,\n              sdkAccountLoggedIn,\n              accountIdentityLeaseIsAuthorized else {\n            failLocally("Confirmed build or Tuya account/device authority changed before connection start.", "sdk_authority_changed")\n            return\n        }\n        guard let newDriver = OfficialTuyaFactory.make() else {\n''',
              '''        guard targetCorrelationOperatorConfirmed,\n              selectedID == candidate.id,\n              candidate.likely,\n              buildIdentity.isAuthoritativeFieldBuild,\n              sdkDeviceMembershipVerified,\n              sdkAccountLoggedIn,\n              accountIdentityLeaseIsAuthorized else {\n            failLocally("Confirmed build or Tuya account/device authority changed before connection start.", "sdk_authority_changed")\n            return\n        }\n        do {\n            try fieldAuthorization.admitOfficialConnectionStart()\n        } catch {\n            failLocally(\n                "The independently verified one-attempt authorization did not admit official Tuya connection: \\(error.localizedDescription)",\n                "field_authorization_rejected_official_connection"\n            )\n            return\n        }\n        guard let newDriver = OfficialTuyaFactory.make() else {\n''',
              "official connection admission",
          )
          replace_once(
              '''                    guard promotionLocalBLEOnline else {\n                        await recordObservedTransportLoss(token: token)\n                        return\n                    }\n\n                    phase = .observing\n''',
              '''                    guard promotionLocalBLEOnline else {\n                        await recordObservedTransportLoss(token: token)\n                        return\n                    }\n                    do {\n                        try self.fieldAuthorization.admitObservationStart()\n                    } catch {\n                        await self.invalidateInternalLifecycle(\n                            token: token,\n                            message: "The independently verified one-attempt authorization did not admit observation: \\(error.localizedDescription)",\n                            kind: "field_authorization_rejected_observation"\n                        )\n                        return\n                    }\n\n                    phase = .observing\n''',
              "observation admission",
          )
          replace_once(
              '''                        guard self.operatorSafetyAttestationIsCurrent else {\n                            self.currentConnectionToken = nil\n                            self.localBLESettlementToken = nil\n                            self.sdkLocalBLEOnline = false\n                            self.driver = nil\n                            self.phase = .failed\n                            self.message = "The current-attempt stationary safety declaration was no longer valid when acceptance sealed. Relaunch Capture before a new attempt; the package chronology remains diagnostic only."\n                            self.log("operator_stationary_safety_attestation_lost_before_acceptance", [\n                                "generation": String(token.diagnosticGeneration)\n                            ])\n                            return\n                        }\n                        self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut\n''',
              '''                        guard self.operatorSafetyAttestationIsCurrent else {\n                            self.currentConnectionToken = nil\n                            self.localBLESettlementToken = nil\n                            self.sdkLocalBLEOnline = false\n                            self.driver = nil\n                            self.phase = .failed\n                            self.message = "The current-attempt stationary safety declaration was no longer valid when acceptance sealed. Relaunch Capture before a new attempt; the package chronology remains diagnostic only."\n                            self.log("operator_stationary_safety_attestation_lost_before_acceptance", [\n                                "generation": String(token.diagnosticGeneration)\n                            ])\n                            return\n                        }\n                        do {\n                            try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()\n                        } catch {\n                            self.currentConnectionToken = nil\n                            self.localBLESettlementToken = nil\n                            self.sdkLocalBLEOnline = false\n                            self.driver = nil\n                            self.phase = .failed\n                            self.message = "The one-attempt authorization could not seal after package acceptance: \\(error.localizedDescription). Relaunch Capture before another attempt."\n                            self.log("field_authorization_rejected_acceptance_seal", [\n                                "generation": String(token.diagnosticGeneration)\n                            ])\n                            return\n                        }\n                        self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut\n''',
              "authorization seal",
          )

          path.write_text(source, encoding="utf-8")
          PY

      - name: Materialize against latest carrier with compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            echo "materialization attempt $attempt"
            git fetch origin "$TARGET_BRANCH"
            base="$(git rev-parse FETCH_HEAD)"
            git checkout -B capture-authority-materialize "$base"

            test -e "$AUTHORING_WORKFLOW"
            actual_blob="$(git rev-parse HEAD:"$APP_SOURCE")"
            if [[ "$actual_blob" != "$EXPECTED_SOURCE_BLOB" ]]; then
              echo "Source blob changed from reviewed subject; refusing stale transform." >&2
              exit 1
            fi

            python "${RUNNER_TEMP}/materialize_capture_authority.py"
            git diff --check
            grep -Fq 'private let fieldAuthorization = NembraCaptureFieldAuthorizationController()' "$APP_SOURCE"
            grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
            grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
            grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
            grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
            grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
            test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0

            (
              cd Packages/NembraBluetoothCapture
              swift test --filter AuthenticatedStationaryCaptureAppSessionTests
              swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
              swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter
            )

            rm "$AUTHORING_WORKFLOW"
            git add -- "$APP_SOURCE" "$AUTHORING_WORKFLOW"
            staged="$(git diff --cached --name-only | sort)"
            expected="$(printf '%s\n%s\n' "$APP_SOURCE" "$AUTHORING_WORKFLOW" | sort)"
            test "$staged" = "$expected"
            git commit -m 'feat(capture): gate SecureLink lifecycle through app session'
            materialized="$(git rev-parse HEAD)"

            git fetch origin "$TARGET_BRANCH"
            if [[ "$(git rev-parse FETCH_HEAD)" == "$base" ]]; then
              git push origin HEAD:"$TARGET_BRANCH"
              printf 'CAPTURE_CARRIER_AUTHORITY_MATERIALIZED=%s base=%s physicalAuthorityCreated=false\n' "$materialized" "$base"
              exit 0
            fi

            echo "Carrier advanced after tests; retrying from latest exact head."
          done

          echo "Carrier did not stabilize within bounded retries; no overwrite performed." >&2
          exit 1
