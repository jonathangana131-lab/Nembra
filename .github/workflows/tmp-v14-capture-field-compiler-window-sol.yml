name: TEMP V14 Capture Field Compiler Window Sol

on:
  push:
    branches:
      - repair/v14-capture-field-compiler-window-sol-20260811
    paths:
      - .github/workflows/tmp-v14-capture-field-compiler-window-sol.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind repair ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2d2b1197eab18570195532a1d401756d5c9582d2 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile materializer
        shell: bash
        run: /usr/bin/python3 -m py_compile scripts/ci/tmp_materialize_field_compiler_window_sol.py
      - name: Apply materializer
        shell: bash
        run: /usr/bin/python3 scripts/ci/tmp_materialize_field_compiler_window_sol.py
      - name: Verify temporary cleanup
        shell: bash
        run: |
          test ! -e .github/workflows/tmp-v14-capture-field-compiler-window-sol.yml
          test ! -e scripts/ci/tmp_materialize_field_compiler_window_sol.py
      - name: Verify installer shell syntax
        shell: bash
        run: bash -n scripts/field/install_one_time_capture.command
      - name: Verify guard Python syntax
        shell: bash
        run: /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
      - name: Run field Git-authority regression
        shell: bash
        run: /usr/bin/python3 scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py
      - name: Run provenance package regression
        shell: bash
        run: /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
      - name: Verify diff hygiene
        shell: bash
        run: |
          rm -rf scripts/ci/__pycache__ scripts/ci/tests/__pycache__ Scripts/__pycache__
          git diff --check
      - name: Publish permanent result
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/tmp-v14-capture-field-compiler-window-sol.yml
          test ! -e scripts/ci/tmp_materialize_field_compiler_window_sol.py
          git config user.name "Nembra V14 Sol"
          git config user.email "nembra-v14-sol@users.noreply.github.com"
          git commit -m "Capture: bind tracked source through compiler window"
          git push origin HEAD:repair/v14-capture-field-compiler-window-sol-20260811
