name: TEMP V14 Capture Field Compiler Window Sol

on:
  push:
    branches:
      - repair/v14-capture-field-compiler-window-sol-20260811
    paths:
      - .github/workflows/tmp-v14-capture-field-compiler-window-sol.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind repair ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2d2b1197eab18570195532a1d401756d5c9582d2 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Keep temporary workflow outside materialized commit
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/tmp_materialize_field_compiler_window_sol.py')
          text = path.read_text(encoding='utf-8')
          marker = 'workflow_path.unlink()\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected workflow cleanup marker count')
          path.write_text(text.replace(marker, '', 1), encoding='utf-8')
          PY
      - name: Compile materializer
        shell: bash
        run: /usr/bin/python3 -m py_compile scripts/ci/tmp_materialize_field_compiler_window_sol.py
      - name: Apply materializer
        shell: bash
        run: /usr/bin/python3 scripts/ci/tmp_materialize_field_compiler_window_sol.py
      - name: Verify temporary script cleanup
        shell: bash
        run: |
          test -e .github/workflows/tmp-v14-capture-field-compiler-window-sol.yml
          test ! -e scripts/ci/tmp_materialize_field_compiler_window_sol.py
      - name: Verify installer shell syntax
        shell: bash
        run: bash -n scripts/field/install_one_time_capture.command
      - name: Verify guard Python syntax
        shell: bash
        run: /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
      - name: Run field Git-authority regression
        shell: bash
        run: /usr/bin/python3 scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py
      - name: Run provenance package regression
        shell: bash
        run: /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
      - name: Normalize generated whitespace
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          for raw in (
              'Scripts/capture_tuya_private_input_build_guard.py',
              'scripts/field/install_one_time_capture.command',
              'scripts/ci/tests/test_capture_tuya_private_input_provenance.py',
              '.github/workflows/capture-field-build-provenance.yml',
          ):
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              path.write_text('\n'.join(line.rstrip() for line in text.splitlines()) + '\n', encoding='utf-8')
          PY
      - name: Verify diff hygiene
        shell: bash
        run: |
          rm -rf scripts/ci/__pycache__ scripts/ci/tests/__pycache__ Scripts/__pycache__
          git diff --check
      - name: Create validated remote Git commit object
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = os.environ['EXPECTED_PARENT']
          observed = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if observed != parent:
              raise SystemExit('checkout moved before Git-object publication')
          base_tree = subprocess.check_output(['git', 'rev-parse', f'{parent}^{{tree}}'], text=True).strip()

          def api(path: str, payload: dict) -> dict:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}{path}',
                  data=json.dumps(payload).encode('utf-8'),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          changed = (
              'Scripts/capture_tuya_private_input_build_guard.py',
              'scripts/field/install_one_time_capture.command',
              'scripts/ci/tests/test_capture_tuya_private_input_provenance.py',
              '.github/workflows/capture-field-build-provenance.yml',
          )
          entries = []
          for raw in changed:
              path = Path(raw)
              mode = subprocess.check_output(['git', 'ls-tree', parent, '--', raw], text=True).split(None, 1)[0]
              payload = base64.b64encode(path.read_bytes()).decode('ascii')
              blob = api('/git/blobs', {'content': payload, 'encoding': 'base64'})
              entries.append({'path': raw, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          entries.append({
              'path': 'scripts/ci/tmp_materialize_field_compiler_window_sol.py',
              'mode': '100644',
              'type': 'blob',
              'sha': None,
          })
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = api('/git/commits', {
              'message': 'Capture: bind tracked source through compiler window',
              'tree': tree['sha'],
              'parents': [parent],
          })
          sha = commit['sha']
          print(f'::notice title=Materialized Capture commit::{sha}')
          PY
