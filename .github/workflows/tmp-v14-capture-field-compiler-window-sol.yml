name: TEMP V14 Capture Field Compiler Window Sol

on:
  push:
    branches:
      - repair/v14-capture-field-compiler-window-sol-20260811
    paths:
      - .github/workflows/tmp-v14-capture-field-compiler-window-sol.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind repair ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2d2b1197eab18570195532a1d401756d5c9582d2 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Keep temporary workflow outside materialized bytes
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/tmp_materialize_field_compiler_window_sol.py')
          text = path.read_text(encoding='utf-8')
          marker = 'workflow_path.unlink()\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected workflow cleanup marker count')
          path.write_text(text.replace(marker, '', 1), encoding='utf-8')
          PY
      - name: Materialize validated authority repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tmp_materialize_field_compiler_window_sol.py
          /usr/bin/python3 scripts/ci/tmp_materialize_field_compiler_window_sol.py
          test -e .github/workflows/tmp-v14-capture-field-compiler-window-sol.yml
          test ! -e scripts/ci/tmp_materialize_field_compiler_window_sol.py
          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          rm -rf scripts/ci/__pycache__ scripts/ci/tests/__pycache__ Scripts/__pycache__
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          for raw in (
              'Scripts/capture_tuya_private_input_build_guard.py',
              'scripts/field/install_one_time_capture.command',
              'scripts/ci/tests/test_capture_tuya_private_input_provenance.py',
              '.github/workflows/capture-field-build-provenance.yml',
          ):
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              path.write_text('\n'.join(line.rstrip() for line in text.splitlines()) + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Assemble exact validated output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf materialized-output
          mkdir -p materialized-output/Scripts materialized-output/scripts/field materialized-output/scripts/ci/tests materialized-output/.github/workflows
          cp Scripts/capture_tuya_private_input_build_guard.py materialized-output/Scripts/
          cp scripts/field/install_one_time_capture.command materialized-output/scripts/field/
          cp scripts/ci/tests/test_capture_tuya_private_input_provenance.py materialized-output/scripts/ci/tests/
          cp .github/workflows/capture-field-build-provenance.yml materialized-output/.github/workflows/
          (cd materialized-output && sha256sum Scripts/capture_tuya_private_input_build_guard.py scripts/field/install_one_time_capture.command scripts/ci/tests/test_capture_tuya_private_input_provenance.py .github/workflows/capture-field-build-provenance.yml > SHA256SUMS)
      - name: Upload exact validated output
        uses: actions/upload-artifact@v4
        with:
          name: capture-field-compiler-window-${{ github.sha }}
          path: materialized-output
          if-no-files-found: error
          retention-days: 1
