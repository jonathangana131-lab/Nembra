name: Validate Capture Legacy Research Executable Retirement

on:
  push:
    branches:
      - sol/v14-capture-retire-legacy-research-executables-6b778

permissions:
  contents: write

jobs:
  focused:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact semantic checkpoint
        shell: bash
        run: |
          set -euo pipefail
          semantic='c156bbadad5da2797d44497bf4726de95dd0f6ec'
          base='6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          git merge-base --is-ancestor "$semantic" HEAD
          python3 - <<'PY'
          import subprocess
          def paths(base, head):
              out = subprocess.check_output(['git', 'diff', '--name-only', f'{base}...{head}'], text=True)
              return sorted(p for p in out.splitlines() if p)
          semantic = 'c156bbadad5da2797d44497bf4726de95dd0f6ec'
          base = '6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          helper = paths(semantic, 'HEAD')
          assert helper == ['.github/workflows/validate-capture-legacy-research-executable-retirement.yml'], helper
          effective = paths(base, semantic)
          expected = [
              'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayExecutableAuthorityRetirementSourceTests.swift',
              'scripts/ci/xcode27_signed_field_candidate.sh',
              'scripts/ci/xcode27_today_research_field_candidate.sh',
          ]
          assert effective == expected, effective
          print('exact semantic checkpoint: PASS')
          PY

      - name: Run focused package regression with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/NembraBluetoothCapture \
            --filter TuyaLegacyTodayExecutableAuthorityRetirementSourceTests \
            -Xswiftc -warnings-as-errors

      - name: Re-run executable fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          set +e
          wrapper_output="$(bash -p scripts/ci/xcode27_today_research_field_candidate.sh 2>&1)"
          wrapper_status=$?
          producer_output="$(bash -p scripts/ci/xcode27_signed_field_candidate.sh --nembra-today-research-build 2>&1)"
          producer_status=$?
          set -e
          test "$wrapper_status" = 64
          test "$producer_status" = 64
          grep -Fq 'SUPERSEDED:' <<< "$wrapper_output"
          grep -Fq 'ES80-AUTHENTICATED-STATIONARY-v1' <<< "$wrapper_output"
          grep -Fq 'SUPERSEDED: --nembra-today-research-build' <<< "$producer_output"
          git diff --check '6b778f2104af34dbe5b80da31ddb3ca422f9667c' HEAD

      - name: Remove validation helper from branch
        shell: bash
        run: |
          set -euo pipefail
          base='6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          rm .github/workflows/validate-capture-legacy-research-executable-retirement.yml
          git add -u .github/workflows/validate-capture-legacy-research-executable-retirement.yml
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'chore(capture): collapse focused retirement validator'
          python3 - <<'PY'
          import subprocess
          base = '6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          out = subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True)
          effective = sorted(p for p in out.splitlines() if p)
          expected = [
              'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayExecutableAuthorityRetirementSourceTests.swift',
              'scripts/ci/xcode27_signed_field_candidate.sh',
              'scripts/ci/xcode27_today_research_field_candidate.sh',
          ]
          assert effective == expected, effective
          print('clean effective scope: PASS')
          PY
          git push origin HEAD:sol/v14-capture-retire-legacy-research-executables-6b778
