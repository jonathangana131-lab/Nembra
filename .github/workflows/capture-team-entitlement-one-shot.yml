name: Capture profile TeamIdentifier one-shot

on:
  push:
    branches:
      - capture-v14-require-profile-team-id/gpt56-thinking-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture-v14-require-profile-team-id/gpt56-thinking-go
          fetch-depth: 0

      - name: Require exact provisioning entitlement TeamIdentifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          path = Path("scripts/ci/es80_signed_field_artifact_evidence.py")
          text = path.read_text(encoding="utf-8")

          old = '    if entitlement_team is not None and entitlement_team != team_identifier:\n'
          new = '    if entitlement_team != team_identifier:\n'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one optional provisioning entitlement TeamIdentifier guard")
          text = text.replace(old, new, 1)

          marker = "    bad_profiles = (\n"
          if text.count(marker) != 1:
              raise SystemExit("expected exactly one bad_profiles self-test marker")
          regression = '''    missing_entitlement_team_profile = {
              **valid_profile,
              "Entitlements": {
                  key: value
                  for key, value in valid_profile["Entitlements"].items()
                  if key != "com.apple.developer.team-identifier"
              },
          }
          '''
          text = text.replace(marker, regression + marker, 1)

          tuple_entry = '        {**valid_profile, "DeveloperCertificates": [b"different-certificate"]},\n'
          if text.count(tuple_entry) != 1:
              raise SystemExit("expected exactly one DeveloperCertificates bad-profile regression")
          text = text.replace(
              tuple_entry,
              tuple_entry + "        missing_entitlement_team_profile,\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          subprocess.run([sys.executable, "-m", "py_compile", str(path)], check=True)
          subprocess.run([sys.executable, str(path), "--self-test"], check=True)
          PY
          git diff --check

      - name: Commit fail-closed repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-team-entitlement-one-shot.yml
          git config user.name "nembra-v14-transform"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/es80_signed_field_artifact_evidence.py .github/workflows/capture-team-entitlement-one-shot.yml
          git diff --cached --check
          git commit -m "[Capture truth v14] Require provisioning entitlement TeamIdentifier"
          git push origin HEAD:capture-v14-require-profile-team-id/gpt56-thinking-go
