name: Materialize Capture Premium Root

on:
  push:
    branches:
      - product/v14-capture-premium-root-bf44-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: product/v14-capture-premium-root-bf44-sol

      - name: Materialize reviewed root repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci/materialize_capture_premium_root.py
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift

      - name: Publish clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ci/materialize_capture_premium_root.py .github/workflows/v14-materialize-capture-premium-root.yml
          git config user.name "nembra-v14-bot"
          git config user.email "nembra-v14-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(capture): make standalone root a guided preflight"
          git push origin HEAD:product/v14-capture-premium-root-bf44-sol
