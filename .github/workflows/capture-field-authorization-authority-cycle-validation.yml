name: Capture field authorization authority-cycle validation

on:
  push:
    branches:
      - capture/field-authorization-authority-cycle-gpt56sol-20260820
    paths:
      - .github/workflows/capture-field-authorization-authority-cycle-validation.yml
      - scripts/ci/materialize_es80_field_authorization_authority_cycle_fix.py
      - scripts/ci/tests/test_es80_field_authorization_authority_cycle.py

permissions:
  contents: write

concurrency:
  group: capture-field-authorization-authority-cycle-validation
  cancel-in-progress: false

jobs:
  materialize-test-publish:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TARGET_BRANCH: capture/field-authorization-authority-cycle-gpt56sol-20260820
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      SOURCE_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
    steps:
      - name: Checkout exact authority-cycle candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$SOURCE_WORKFLOW"
          test -f scripts/ci/materialize_es80_field_authorization_authority_cycle_fix.py
          test -f scripts/ci/tests/test_es80_field_authorization_authority_cycle.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' "$(git rev-parse HEAD:"$APP_SOURCE")" > "$RUNNER_TEMP/original-app-blob"

      - name: Materialize canonical one-time authorization lifecycle
        shell: python
        run: |
          from pathlib import Path
          import os
          import textwrap

          workflow = Path(os.environ["SOURCE_WORKFLOW"]).read_text(encoding="utf-8")
          marker = "      - name: Materialize field authorization into real SecureLink lifecycle\n"
          section = workflow.index(marker)
          run_marker = "        run: |\n"
          start = workflow.index(run_marker, section) + len(run_marker)
          end = workflow.index("\n      - name:", start)
          program = textwrap.dedent(workflow[start:end])
          exec(compile(program, "<canonical-capture-app-authorization-materializer>", "exec"), {"__name__": "__main__"})

      - name: Remove legacy hard-false authority cycle
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/materialize_es80_field_authorization_authority_cycle_fix.py
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = "$APP_SOURCE"
          ! grep -Fq 'buildIdentity.isAuthoritativeFieldBuild' "$APP_SOURCE"
          ! grep -Fq 'fieldBuildIsAuthoritative' "$APP_SOURCE"
          grep -Fq 'buildIdentity.hasCompleteFieldBuildMetadata' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.advanceInboxHandoffIfAvailable()' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"

      - name: Run authority-cycle and lifecycle source contracts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_field_authorization_authority_cycle.py
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py

      - name: Run focused package authorization contracts
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NembraCaptureAuthorityCycle" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish only the exact tested app-source candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse FETCH_HEAD)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD:"$APP_SOURCE")" = "$(cat "$RUNNER_TEMP/original-app-blob")"
          git add -- "$APP_SOURCE"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(capture): make verified session the field authority'
          materialized="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$remote_head" origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CAPTURE_AUTHORITY_CYCLE_CLOSED materialized=%s trigger=%s physicalAuthorityCreated=false\n' "$materialized" "$GITHUB_SHA"
