name: TEMP Capture Tuya Postterminal Manual Fence
on:
  push:
    branches: [repair/v14-capture-tuya-terminal-approval-fence-sol]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'jonathangana131-lab/Nembra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-capture-tuya-terminal-approval-fence-sol
          fetch-depth: 2
      - name: Verify and materialize
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c0156d5d6262696abf4e5bf5732c7161c1fdfc37"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tmp-capture-tuya-postterminal-manual-fence.yml"
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('NembraApp/Features/Research/TuyaAccountBridge.swift')
          text = bridge.read_text()
          old = "func checkApprovalNow() {\n        guard let token = qrToken, let boundUserCode = approvalUserCode else {"
          new = "func checkApprovalNow() {\n        guard phase == .waitingForApproval else { return }\n        guard let token = qrToken, let boundUserCode = approvalUserCode else {"
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          start = text.index('    private func pollApprovalOnce(userCode: String, token: String, generation: UInt64) async {')
          end = text.index('    private func scheduleDeviceLoad(generation: UInt64) {', start)
          poll = text[start:end]
          assert poll.count('guard generation == operationGeneration,') == 1
          poll = poll.replace('guard generation == operationGeneration,', 'guard phase == .waitingForApproval,\n              generation == operationGeneration,', 1)
          resume = 'guard !Task.isCancelled,\n                  generation == operationGeneration,'
          assert poll.count(resume) == 3, poll.count(resume)
          poll = poll.replace(resume, 'guard !Task.isCancelled,\n                  phase == .waitingForApproval,\n                  generation == operationGeneration,')
          bridge.write_text(text[:start] + poll + text[end:])

          entry = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          ui = entry.read_text()
          button = 'Button("I approved it · check now") { tuya.checkApprovalNow() }'
          assert ui.count(button) == 1
          idx = ui.index(button); line = ui.rfind('\n', 0, idx) + 1; indent = ui[line:idx]
          old_block = button + '\n' + indent + '    .buttonStyle(.bordered)\n' + indent + '    .controlSize(.large)\n' + indent + '    .frame(maxWidth: isAccessibilityLayout ? .infinity : nil, alignment: .leading)'
          new_block = 'if tuya.phase == .waitingForApproval {\n' + indent + '    ' + button + '\n' + indent + '        .buttonStyle(.bordered)\n' + indent + '        .controlSize(.large)\n' + indent + '        .frame(maxWidth: isAccessibilityLayout ? .infinity : nil, alignment: .leading)\n' + indent + '}'
          assert ui.count(old_block) == 1
          entry.write_text(ui.replace(old_block, new_block, 1))

          test = Path('scripts/ci/tests/test_tuya_account_transport_source.py')
          src = test.read_text()
          root = 'SOURCE = (ROOT / "NembraApp/Features/Research/TuyaAccountBridge.swift").read_text(encoding="utf-8")\n'
          assert src.count(root) == 1
          src = src.replace(root, root + 'ENTRYPOINT = (ROOT / "NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")\n', 1)
          marker = '\nif __name__ == "__main__":\n'
          addition = '''
              def test_failed_approval_token_cannot_be_manually_repolled(self):
                  check = SOURCE[SOURCE.index('    func checkApprovalNow() {'):SOURCE.index('    func refreshDevices() {')]
                  self.assertIn('guard phase == .waitingForApproval else { return }', check)
                  poll_start = SOURCE.index('    private func pollApprovalOnce(userCode: String, token: String, generation: UInt64) async {')
                  poll_end = SOURCE.index('    private func scheduleDeviceLoad(generation: UInt64) {', poll_start)
                  self.assertEqual(SOURCE[poll_start:poll_end].count('phase == .waitingForApproval,'), 4)
                  qr_start = ENTRYPOINT.index('                if let data = tuya.qrPNGData,')
                  qr_end = ENTRYPOINT.index('                if tuya.phase == .failed {', qr_start)
                  self.assertIn('if tuya.phase == .waitingForApproval {', ENTRYPOINT[qr_start:qr_end])
          '''
          assert src.count(marker) == 1
          test.write_text(src.replace(marker, addition + marker, 1))
          PY
          python3 scripts/ci/tests/test_tuya_account_transport_source.py
      - name: Commit clean product delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-capture-tuya-postterminal-manual-fence.yml
          git config user.name jonathangana131-lab
          git config user.email jonathangana131@gmail.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift NembraApp/Features/Research/TuyaAccountBridge.swift scripts/ci/tests/test_tuya_account_transport_source.py .github/workflows/tmp-capture-tuya-postterminal-manual-fence.yml
          git commit -m 'fix(capture): reject post-terminal Tuya approval polling'
          git push origin HEAD:repair/v14-capture-tuya-terminal-approval-fence-sol
