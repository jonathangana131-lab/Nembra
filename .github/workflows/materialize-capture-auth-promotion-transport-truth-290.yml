name: Materialize Capture Auth Promotion Transport Truth 290

on:
  push:
    branches:
      - fix/v14-capture-auth-promotion-transport-truth-290-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-auth-promotion-transport-truth-290-sol
          fetch-depth: 0

      - name: Guard exact product parent and scaffold scope
        shell: bash
        run: |
          set -euo pipefail
          base='29000f240d1b5710bbe116de94a22c030d10da8e'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"...HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/materialize-capture-auth-promotion-transport-truth-290.yml
          scripts/ci/materialize_capture_auth_promotion_transport_truth_290.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --quiet "$base" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationPromotionTransportTruthSourceTests.swift

      - name: Apply current-driver local-BLE promotion fence
        run: python3 scripts/ci/materialize_capture_auth_promotion_transport_truth_290.py apply

      - name: Validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_auth_promotion_transport_truth_290.py verify
          python3 -m py_compile scripts/ci/materialize_capture_auth_promotion_transport_truth_290.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationPromotionTransportTruthSourceTests.swift
          git diff --check

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          base='29000f240d1b5710bbe116de94a22c030d10da8e'
          rm .github/workflows/materialize-capture-auth-promotion-transport-truth-290.yml
          rm scripts/ci/materialize_capture_auth_promotion_transport_truth_290.py
          git add -A
          git diff --cached --check "$base"
          git diff --cached --name-only "$base" | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          NembraApp/App/NembraCaptureEntrypoint.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationPromotionTransportTruthSourceTests.swift
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): recheck transport before auth promotion'
          git diff --check "$base" HEAD
          git push origin HEAD:fix/v14-capture-auth-promotion-transport-truth-290-sol
