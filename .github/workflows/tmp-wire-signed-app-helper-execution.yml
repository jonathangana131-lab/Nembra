name: Temporary Wire Signed App Helper Execution

on:
  push:
    branches:
      - repair/v14-capture-signed-app-helper-execution-sol

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-signed-app-helper-execution-sol
          fetch-depth: 0

      - name: Bind accepted helper bytes to protected execution subject
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_wire_signed_app_helper_execution.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Commit production wiring and delete temporary materializers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-wire-signed-app-helper-execution.yml
          rm -f scripts/ci/tmp_wire_signed_app_helper_execution.py
          git config user.name 'nembra-capture-bot'
          git config user.email 'nembra-capture-bot@users.noreply.github.com'
          git add scripts/field/install_one_time_capture.command .github/workflows/tmp-wire-signed-app-helper-execution.yml scripts/ci/tmp_wire_signed_app_helper_execution.py
          git diff --cached --check
          git commit -m 'fix(capture): seal signed-app custody helper execution'
          git push origin HEAD:repair/v14-capture-signed-app-helper-execution-sol
