name: Converge Capture canonical head onto current main

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: write

jobs:
  converge:
    if: github.event.head_commit.message == 'GO converge Capture canonical head onto current main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Merge exact current main and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch='capture/current-main-tuya-readonly-convergence-gpt56'
          expected_main='de37ee4769022d32765bf63340f8420ee7c0e04b'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$branch" main
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$expected_main"
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git merge --no-edit "$expected_main"
          git rm .github/workflows/capture-main-converge-once.yml
          git commit -m 'Capture V16.1: retire main convergence runner'
          git diff --check HEAD~1 HEAD
          test "$(git merge-base --is-ancestor "$expected_main" HEAD; echo $?)" = '0'
          git fetch origin "$branch" main
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$expected_main"
          git push origin HEAD:"$branch"
