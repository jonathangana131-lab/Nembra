name: V14 Capture Post-Path Descriptor FA29

on:
  push:
    branches:
      - fix/v14-private-provenance-post-path-fa29-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v14-private-provenance-post-path-fa29-sol
      - name: Assert exact ancestry and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='fa29a7135101897018723c40e6e2853388b09327'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/v14-post-path-descriptor-fa29.yml
          tools/v14_post_path_descriptor_fa29_materialize.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Materialize repair
        run: python3 tools/v14_post_path_descriptor_fa29_materialize.py
      - name: Parse and run focused plus provenance suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py scripts/ci/tests/test_capture_tuya_private_input_post_path_descriptor_custody.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_post_path_descriptor_custody.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_tree_cross_authority.py
      - name: Prove exact effective scope
        shell: bash
        run: |
          set -euo pipefail
          HELPER='Scripts/capture_tuya_private_input_provenance.py'
          TEST='scripts/ci/tests/test_capture_tuya_private_input_post_path_descriptor_custody.py'
          git add "$HELPER" "$TEST"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '2'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$HELPER"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST"
      - name: Commit durable repair and retire setup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-post-path-descriptor-fa29.yml tools/v14_post_path_descriptor_fa29_materialize.py
          git commit -m 'fix(capture): close post-path descriptor mutation window'
          git push origin HEAD:fix/v14-private-provenance-post-path-fa29-sol
