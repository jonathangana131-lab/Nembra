name: Agent ES80 resolve abort recovery final-share cleanup

on:
  push:
    branches:
      - integration/es80-v14-abort-recovery-finalshare-cleanup/chatgpt56

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-abort-recovery-finalshare-cleanup/chatgpt56
          fetch-depth: 0
      - name: Fetch reviewed strict-abort convergence source
        shell: bash
        run: git fetch origin integration/es80-v14-abort-recovery-share-resolved/chatgpt56
      - name: Transplant strict rediscovery and abort product paths
        shell: bash
        run: |
          git checkout 737f3b4932728e63f7e16cb3d249fee9803bfedb -- \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneRecoverableRediscoveryTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneCoordinatorStrictRediscoveryCompatibilityTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerAbortFreshSessionConsumerContractTests.swift
      - name: Preserve cleanup coordinator and adapt strict retryability seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCoordinator.swift')
          text = path.read_text()
          text = text.replace(
              'while producer `stagingPreview()` proves this exact admission is still unconsumed.',
              'while producer `previewForControllerStaging()` proves this exact admission is still unconsumed.'
          )
          pattern = re.compile(
              r'^(?P<i>\s*)if \(try\? admission\.stagingPreview\(\)\) == nil \{\n'
              r'(?P=i)    pendingCaptureAdmission = nil\n'
              r'(?P=i)    preparedCorrelatedTargetIdentifier = nil\n'
              r'(?P=i)\}',
              re.MULTILINE,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected one old staging probe, found {len(matches)}')
          indent = matches[0].group('i')
          replacement = (
              f'{indent}// The narrowed producer staging preview remains readable only before\n'
              f'{indent}// irreversible one-shot consumption. Preserve the same completed\n'
              f'{indent}// OFF/ON evidence life only while that exact authority still exists.\n'
              f'{indent}do {{\n'
              f'{indent}    _ = try admission.previewForControllerStaging()\n'
              f'{indent}}} catch PassiveBluetoothExperimentOneCaptureAdmission.ConsumptionError.alreadyConsumed {{\n'
              f'{indent}    pendingCaptureAdmission = nil\n'
              f'{indent}    preparedCorrelatedTargetIdentifier = nil\n'
              f'{indent}}} catch {{\n'
              f'{indent}    // Unknown/future staging-state failures are not proven retryable.\n'
              f'{indent}    pendingCaptureAdmission = nil\n'
              f'{indent}    preparedCorrelatedTargetIdentifier = nil\n'
              f'{indent}}}'
          )
          path.write_text(pattern.sub(replacement, text, count=1))
          PY
      - name: Verify higher-rung composition
        shell: bash
        run: |
          set -euo pipefail
          coordinator=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCoordinator.swift
          run=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -F 'public enum FinalizationCleanupStatus' "$coordinator"
          grep -F 'finalizationCleanupStatusStorage = .complete' "$coordinator"
          grep -F 'finalizationCleanupStatusStorage = .failed' "$coordinator"
          ! grep -F 'try? controller.teardownActiveConnectionAfterFinalization()' "$coordinator"
          grep -F 'PassiveBluetoothExperimentOneFieldExecutionGate.permitsPhysicalProcedure' "$coordinator"
          grep -F 'admission.previewForControllerStaging()' "$coordinator"
          ! grep -F 'admission.stagingPreview()' "$coordinator"
          ! grep -F 'admission.isConsumed' "$coordinator"
          grep -F 'func previewForControllerStaging() throws -> StagingPreview' "$run"
          ! grep -F 'var isConsumed: Bool' "$run"
          grep -F 'reopenAfterAbortedFreshTargetSession(' "$controller"
          grep -F 'PassiveCoreBluetoothAbortedQueueResolution.resolve(' "$controller"
          grep -F 'lastResolvedEventSequence = resolution.resolvedThroughQueueSequence' "$controller"
          grep -F 'scheduleAbortedFreshTargetSessionRecoveryIfNeeded()' "$controller"
          test -f Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneFinalShareIntegrity.swift
          git diff --check
      - name: Remove temporary workflow and checkpoint higher-rung product tree
        shell: bash
        run: |
          rm .github/workflows/agent-es80-resolve-abort-finalshare-cleanup.yml
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCoordinator.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneRecoverableRediscoveryTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneCoordinatorStrictRediscoveryCompatibilityTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerAbortFreshSessionConsumerContractTests.swift \
            .github/workflows/agent-es80-resolve-abort-finalshare-cleanup.yml
          git commit -m 'feat(capture): converge abort recovery with final-share cleanup spine'
          git push origin HEAD:integration/es80-v14-abort-recovery-finalshare-cleanup/chatgpt56