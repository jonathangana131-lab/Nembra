name: Materialize Capture Accessibility XXXL 518 Recovery

on:
  push:
    branches:
      - recovery/v14-capture-ax-518-sol2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-ax-518-sol2
          fetch-depth: 0

      - name: Guard exact product ancestry and recovery scope
        shell: bash
        run: |
          set -euo pipefail
          base='518fe048b11a1e666e04976a7f7bd4fcb1a4af69'
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base:NembraApp/App/NembraCaptureEntrypoint.swift")" = "$(git rev-parse HEAD:NembraApp/App/NembraCaptureEntrypoint.swift)"
          unexpected="$(git diff --name-only "$base"...HEAD | grep -Ev '^(.github/workflows/materialize-v14-capture-ax-518-recovery.yml|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureAccessibilityXXXLCurrentProductSourceTests.swift)$' || true)"
          test -z "$unexpected"

      - name: Apply current-product Accessibility reflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          old_header = '''                HStack(alignment: .firstTextBaseline) {\n                    VStack(alignment: .leading, spacing: 4) {\n                        Text("FIND SCOOTER")\n                            .font(.caption2.bold())\n                            .tracking(1.2)\n                            .foregroundStyle(.cyan)\n                        Text(test.phase == .correlated ? "Scooter signal found" : test.correlationWindowLabel)\n                            .font(.title2.bold())\n                    }\n                    Spacer()\n                    Text("\\(correlationDisplayedWindowOrdinal)/4")\n                        .font(.title3.monospacedDigit().bold())\n                        .foregroundStyle(.secondary)\n                }\n'''
          new_header = '''                if dynamicTypeSize.isAccessibilitySize {\n                    VStack(alignment: .leading, spacing: 8) {\n                        VStack(alignment: .leading, spacing: 4) {\n                            Text("FIND SCOOTER")\n                                .font(.caption2.bold())\n                                .tracking(1.2)\n                                .foregroundStyle(.cyan)\n                            Text(test.phase == .correlated ? "Scooter signal found" : test.correlationWindowLabel)\n                                .font(.title2.bold())\n                                .fixedSize(horizontal: false, vertical: true)\n                        }\n                        Text("\\(correlationDisplayedWindowOrdinal)/4")\n                            .font(.title3.monospacedDigit().bold())\n                            .foregroundStyle(.secondary)\n                            .accessibilityLabel("Correlation progress")\n                            .accessibilityValue("\\(correlationDisplayedWindowOrdinal) of 4 windows")\n                    }\n                } else {\n                    HStack(alignment: .firstTextBaseline) {\n                        VStack(alignment: .leading, spacing: 4) {\n                            Text("FIND SCOOTER")\n                                .font(.caption2.bold())\n                                .tracking(1.2)\n                                .foregroundStyle(.cyan)\n                            Text(test.phase == .correlated ? "Scooter signal found" : test.correlationWindowLabel)\n                                .font(.title2.bold())\n                        }\n                        Spacer()\n                        Text("\\(correlationDisplayedWindowOrdinal)/4")\n                            .font(.title3.monospacedDigit().bold())\n                            .foregroundStyle(.secondary)\n                            .accessibilityLabel("Correlation progress")\n                            .accessibilityValue("\\(correlationDisplayedWindowOrdinal) of 4 windows")\n                    }\n                }\n'''
          if source.count(old_header) != 1:
              raise SystemExit(f'current correlation header anchor changed: {source.count(old_header)} matches')
          source = source.replace(old_header, new_header, 1)

          old_observation = '''                    VStack(alignment: .leading, spacing: 8) {\n                        HStack {\n                            Text("Read-only observation")\n                                .font(.subheadline.weight(.semibold))\n                            Spacer()\n                            Text("\\(Int(min(age, 45))) / 45 s")\n                                .font(.subheadline.monospacedDigit().bold())\n                        }\n                        ProgressView(value: min(age / 45, 1))\n                        requirementRow("Secure local link", ready: test.sdkLocalBLEOnline)\n                        requirementRow("Scooter data received", ready: test.applicationUpdateCount > 0)\n                    }\n'''
          new_observation = '''                    VStack(alignment: .leading, spacing: 8) {\n                        if dynamicTypeSize.isAccessibilitySize {\n                            VStack(alignment: .leading, spacing: 4) {\n                                Text("Read-only observation")\n                                    .font(.subheadline.weight(.semibold))\n                                Text("\\(Int(min(age, 45))) / 45 s")\n                                    .font(.subheadline.monospacedDigit().bold())\n                            }\n                        } else {\n                            HStack {\n                                Text("Read-only observation")\n                                    .font(.subheadline.weight(.semibold))\n                                Spacer()\n                                Text("\\(Int(min(age, 45))) / 45 s")\n                                    .font(.subheadline.monospacedDigit().bold())\n                            }\n                        }\n                        ProgressView(value: min(age / 45, 1))\n                            .accessibilityLabel("Read-only observation progress")\n                            .accessibilityValue("\\(Int(min(age, 45))) of 45 seconds")\n                        requirementRow("Secure local link", ready: test.sdkLocalBLEOnline)\n                        requirementRow("Scooter data received", ready: test.applicationUpdateCount > 0)\n                    }\n'''
          if source.count(old_observation) != 1:
              raise SystemExit(f'current observation block anchor changed: {source.count(old_observation)} matches')
          source = source.replace(old_observation, new_observation, 1)
          path.write_text(source, encoding='utf-8')
          PY

          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          testfile='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureAccessibilityXXXLCurrentProductSourceTests.swift'
          grep -Fq '.accessibilityLabel("Correlation progress")' "$app"
          grep -Fq '.accessibilityValue("\(correlationDisplayedWindowOrdinal) of 4 windows")' "$app"
          grep -Fq '.accessibilityLabel("Read-only observation progress")' "$app"
          grep -Fq '.accessibilityValue("\(Int(min(age, 45))) of 45 seconds")' "$app"
          grep -Fq 'private var processCorrelationLease: UUID?' "$app"
          grep -Fq 'OfficialTuyaFactory.acquirePackageCorrelationLease()' "$app"
          grep -Fq 'OfficialTuyaFactory.releasePackageCorrelationLease(processCorrelationLease)' "$app"
          grep -Fq 'if test.canRestartFromFreshOFF1 {' "$app"
          grep -Fq '.disabled(!authorityReady || test.membershipBusy)' "$app"
          grep -Fq 'Relaunch Capture before another attempt' "$app"
          grep -Fq 'extraInfo["snsNickname"] = appleNickname' "$app"
          swiftc -frontend -parse "$app"
          swiftc -frontend -parse "$testfile"
          git diff --check

      - name: Publish clean current-product AX successor
        shell: bash
        run: |
          set -euo pipefail
          base='518fe048b11a1e666e04976a7f7bd4fcb1a4af69'
          workflow='.github/workflows/materialize-v14-capture-ax-518-recovery.yml'
          rm -f "$workflow"
          git add -A
          git diff --cached --check
          mapfile -t effective < <(git diff --name-only "$base" | sort)
          mapfile -t wanted < <(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureAccessibilityXXXLCurrentProductSourceTests.swift' | sort)
          test "${#effective[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do test "${effective[$i]}" = "${wanted[$i]}"; done
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git commit -m 'fix(capture): reflow current guided progress at Accessibility sizes'
          git push origin HEAD:recovery/v14-capture-ax-518-sol2
