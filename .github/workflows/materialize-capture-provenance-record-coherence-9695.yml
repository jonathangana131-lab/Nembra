name: Materialize Capture provenance record coherence

on:
  push:
    branches:
      - fix/v14-capture-provenance-record-coherence-9695

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard repair ancestry and scaffold scope
        shell: bash
        run: |
          set -euo pipefail
          base='9695af19c21c93b3eb4bc867613a6df0c9a3b3d4'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/materialize-capture-provenance-record-coherence-9695.yml' \
            'scripts/ci/materialize_capture_provenance_record_coherence.py' \
            'scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Materialize whole-record generation fence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_provenance_record_coherence.py

      - name: Validate provenance behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          git diff --check

      - name: Publish clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-provenance-record-coherence-9695.yml
          rm scripts/ci/materialize_capture_provenance_record_coherence.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): fence whole private-input provenance record'
          git push origin HEAD:fix/v14-capture-provenance-record-coherence-9695
