name: Materialize Capture Login Custody

on:
  push:
    branches:
      - sol/v14-capture-login-secret-custody-bcea
    paths:
      - .github/workflows/capture-login-custody-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-login-secret-custody-bcea
          fetch-depth: 0

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          parent='bcea598c9a520064e1c4de9b47dcd0143685b3a1'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-login-custody-materialize.yml' 'scripts/ci/materialize_capture_login_secret_custody.py' | sort)"
          test "$actual" = "$expected"

      - name: Apply focused redaction hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ci/materialize_capture_login_secret_custody.py')
          s = p.read_text()
          start = s.index('        let redactor = String(try section(')
          end = s.index('\n\n        #expect(redactor.contains', start)
          s = s[:start] + '        let redactor = authorizer' + s[end:]
          p.write_text(s)
          PY
          python3 scripts/ci/materialize_capture_login_secret_custody.py apply
          python3 scripts/ci/materialize_capture_login_secret_custody.py verify

      - name: Validate focused scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/materialize_capture_login_secret_custody.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLoginSecretCustodySourceTests.swift
          git diff --check
          parent='bcea598c9a520064e1c4de9b47dcd0143685b3a1'
          test_path='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLoginSecretCustodySourceTests.swift'
          git add -N "$test_path"
          changed="$(git diff --name-only "$parent" | grep -v -E '^(\.github/workflows/capture-login-custody-materialize.yml|scripts/ci/materialize_capture_login_secret_custody.py)$' | sort)"
          expected="$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' "$test_path" | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$parent" -- scripts/field/install_one_time_capture.command
          git diff --quiet "$parent" -- NembraApp/Features/Research/TuyaAccountBridge.swift

      - name: Publish clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-login-custody-materialize.yml
          rm scripts/ci/materialize_capture_login_secret_custody.py
          rm -rf scripts/ci/__pycache__
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): harden Tuya login error redaction"
          git push origin HEAD:sol/v14-capture-login-secret-custody-bcea
