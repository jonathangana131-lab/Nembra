name: Capture authority direct materialize once

on:
  push:
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - .github/workflows/capture-authority-v3-direct-materialize-once.yml

permissions:
  contents: write

concurrency:
  group: capture-authority-direct-materialize-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      TARGET_BRANCH: product/capture-1-0-main-20260818
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      AUTHORING_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
      SELF_WORKFLOW: .github/workflows/capture-authority-v3-direct-materialize-once.yml
      EXPECTED_SOURCE_BLOB: 627c17949d15aaf26ca28c12abb9bb684ab0e731
    steps:
      - name: Checkout immutable trigger
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind immutable source and reviewed authoring transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test -f "$AUTHORING_WORKFLOW"
          test -f "$SELF_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize reviewed end-to-end app authorization transform
        shell: python
        run: |
          from pathlib import Path

          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          authoring = Path(".github/workflows/capture-app-authorization-close-one-shot.yml").read_text(encoding="utf-8")
          start = "      - name: Materialize field authorization into real SecureLink lifecycle\n        shell: python\n        run: |\n"
          end = "\n      - name: Enforce truth-preserving source shape\n"
          if authoring.count(start) != 1 or authoring.count(end) != 1:
              raise SystemExit("reviewed app-authorization transform markers changed; refusing")
          body = authoring.split(start, 1)[1].split(end, 1)[0]
          lines = body.splitlines()
          if any(line and not line.startswith("          ") for line in lines):
              raise SystemExit("unexpected app-authorization transform indentation; refusing")
          script = "\n".join(line[10:] if line else "" for line in lines) + "\n"
          exec(compile(script, "capture-app-authorization-close-one-shot", "exec"), {"__name__": "__main__"})

      - name: Enforce truth-preserving source shape
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 | awk '{print $2}' | sort)"
          test "$changed" = "$APP_SOURCE"
          git diff --check
          grep -Fq 'advanceFieldAuthorizationHandoffIfAvailable()' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage != .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          grep -Fq 'requirementRow("One-time field authorization", ready: test.fieldAuthorizationReady)' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'AuthenticatedStationaryCaptureAttemptCapability' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'AuthenticatedStationaryCaptureCapabilityGate' "$APP_SOURCE")" = 0
          cp "$APP_SOURCE" "${RUNNER_TEMP}/NembraCaptureEntrypoint.patched.swift"

      - name: Run focused authorization and immutable-artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py
          cd Packages/NembraBluetoothCapture
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NembraCaptureAuthorityDirect" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish tested source over non-overlapping carrier churn
        shell: bash
        run: |
          set -euo pipefail
          patched="${RUNNER_TEMP}/NembraCaptureEntrypoint.patched.swift"
          test -s "$patched"

          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse FETCH_HEAD)"
          remote_source_blob="$(git rev-parse FETCH_HEAD:"$APP_SOURCE")"
          test "$remote_source_blob" = "$EXPECTED_SOURCE_BLOB"

          git reset --hard FETCH_HEAD
          cp "$patched" "$APP_SOURCE"
          rm -f "$AUTHORING_WORKFLOW" "$SELF_WORKFLOW"
          git add -- "$APP_SOURCE" "$AUTHORING_WORKFLOW" "$SELF_WORKFLOW"
          git diff --cached --check

          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged" | grep -Fxq "$APP_SOURCE"
          while IFS= read -r path; do
            case "$path" in
              "$APP_SOURCE"|"$AUTHORING_WORKFLOW"|"$SELF_WORKFLOW") ;;
              *) printf 'unexpected staged path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done <<< "$staged"

          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test "$(git hash-object "$APP_SOURCE")" != "$EXPECTED_SOURCE_BLOB"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(capture): wire one-time field authorization into SecureLink'
          materialized="$(git rev-parse HEAD)"

          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$remote_head"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$remote_head" origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CAPTURE_APP_AUTHORIZATION materialized=%s absorbed=%s trigger=%s physicalAuthorityCreated=false\n' "$materialized" "$remote_head" "${{ github.sha }}"
