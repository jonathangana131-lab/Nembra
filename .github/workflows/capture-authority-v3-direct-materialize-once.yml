name: Capture authority v3 direct materialize once

on:
  push:
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - .github/workflows/capture-authority-v3-direct-materialize-once.yml

permissions:
  contents: write

concurrency:
  group: capture-authority-v3-direct-materialize-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      TARGET_BRANCH: product/capture-1-0-main-20260818
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      REVIEWED_AUTHORING_WORKFLOW: .github/workflows/capture-carrier-authority-v2-materialize-once.yml
      SELF_WORKFLOW: .github/workflows/capture-authority-v3-direct-materialize-once.yml
      EXPECTED_PARENT: a3ecb0edfb0c97ced237a580c3bd2151594f77a3
      EXPECTED_SOURCE_BLOB: 627c17949d15aaf26ca28c12abb9bb684ab0e731
      EXPECTED_AUTHORING_BLOB: 59d38ec605728302604ed2b3321b6bd4558dbdda
    steps:
      - name: Checkout immutable trigger
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact reviewed carrier subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          read -r head parent extra <<<"$(git rev-list --parents -n 1 HEAD)"
          test "$parent" = "$EXPECTED_PARENT"
          test -z "${extra:-}"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse HEAD:"$REVIEWED_AUTHORING_WORKFLOW")" = "$EXPECTED_AUTHORING_BLOB"
          test -e "$SELF_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize reviewed V2 transform plus V3 fail-closed corrections
        shell: python
        run: |
          from pathlib import Path

          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          authoring = Path(".github/workflows/capture-carrier-authority-v2-materialize-once.yml").read_text(encoding="utf-8")
          start = '          cat > "${RUNNER_TEMP}/materialize_capture_authority_v2.py" <<\'PY\'\n'
          end = '          PY\n\n      - name: Materialize against latest reviewed carrier source\n'
          if authoring.count(start) != 1 or authoring.count(end) != 1:
              raise SystemExit("reviewed V2 transform markers changed; refusing")
          body = authoring.split(start, 1)[1].split(end, 1)[0]
          lines = body.splitlines()
          if any(line and not line.startswith("          ") for line in lines):
              raise SystemExit("unexpected V2 transform indentation; refusing")
          script = "\n".join(line[10:] if line else "" for line in lines) + "\n"
          exec(compile(script, "capture-authority-v2", "exec"), {"__name__": "__main__"})

          source = app.read_text(encoding="utf-8")

          old_failed = '''            if phase == .failed {\n                fieldAuthorization.revoke()\n                operatorSafetyAttemptID = nil\n'''
          new_failed = '''            if phase == .failed {\n                if fieldAuthorization.stage != .armed {\n                    fieldAuthorization.revoke()\n                }\n                operatorSafetyAttemptID = nil\n'''
          if source.count(old_failed) != 1:
              raise SystemExit(f"armed-preservation anchor count was {source.count(old_failed)}; refusing")
          source = source.replace(old_failed, new_failed, 1)

          old_authorization_seal = '''                            try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()\n\n                            self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut\n'''
          new_authorization_seal = '''                            do {\n                                try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()\n                            } catch {\n                                self.currentConnectionToken = nil\n                                self.localBLESettlementToken = nil\n                                self.sdkLocalBLEOnline = false\n                                self.driver = nil\n                                self.fieldAuthorization.revoke()\n                                self.failLocally(\n                                    "Accepted observation was frozen, but its one-attempt field authorization could not be sealed: \\(error.localizedDescription). Relaunch Capture before another attempt.",\n                                    "field_authorization_exact_artifact_seal_failed"\n                                )\n                                return\n                            }\n\n                            self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut\n'''
          if source.count(old_authorization_seal) != 1:
              raise SystemExit(f"authorization-seal anchor count was {source.count(old_authorization_seal)}; refusing")
          source = source.replace(old_authorization_seal, new_authorization_seal, 1)

          old_seal_failure = '''                            self.currentConnectionToken = nil\n                            self.localBLESettlementToken = nil\n                            self.sdkLocalBLEOnline = false\n                            self.driver = nil\n                            self.fieldAuthorization.revoke()\n                            self.phase = .failed\n                            self.message = "Accepted observation could not freeze and seal one exact authorized artifact: \\(error.localizedDescription). Relaunch Capture before another attempt."\n                            self.log("field_authorization_exact_artifact_seal_failed", [\n                                "generation": String(token.diagnosticGeneration)\n                            ])\n                            return\n'''
          new_seal_failure = '''                            self.currentConnectionToken = nil\n                            self.localBLESettlementToken = nil\n                            self.sdkLocalBLEOnline = false\n                            self.driver = nil\n                            self.fieldAuthorization.revoke()\n                            self.failLocally(\n                                "Accepted observation could not freeze and seal one exact authorized artifact: \\(error.localizedDescription). Relaunch Capture before another attempt.",\n                                "field_authorization_exact_artifact_seal_failed"\n                            )\n                            return\n'''
          if source.count(old_seal_failure) != 1:
              raise SystemExit(f"seal-failure lifecycle anchor count was {source.count(old_seal_failure)}; refusing")
          source = source.replace(old_seal_failure, new_seal_failure, 1)

          app.write_text(source, encoding="utf-8")

      - name: Verify source shape and fail-closed authority ordering
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain=v1 | awk '{print $2}')" = "$APP_SOURCE"
          git diff --check
          grep -Fq 'advanceInboxHandoffIfAvailable()' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage != .armed' "$APP_SOURCE"
          grep -Fq 'admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'AuthenticatedStationaryCaptureAttemptCapability' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'AuthenticatedStationaryCaptureCapabilityGate' "$APP_SOURCE")" = 0

      - name: Run focused authorization contracts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py
          cd Packages/NembraBluetoothCapture
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NembraCaptureAuthorityV3Direct" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish exact tested production source and retire materializers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          rm "$REVIEWED_AUTHORING_WORKFLOW" "$SELF_WORKFLOW"
          git add -- "$APP_SOURCE" "$REVIEWED_AUTHORING_WORKFLOW" "$SELF_WORKFLOW"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n%s\n' "$APP_SOURCE" "$REVIEWED_AUTHORING_WORKFLOW" "$SELF_WORKFLOW" | sort)"
          test "$staged" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(capture): wire authorized SecureLink lifecycle v3 directly'
          materialized="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'CAPTURE_AUTHORITY_V3_DIRECT_MATERIALIZED=%s trigger=%s physicalAuthorityCreated=false\n' "$materialized" "${{ github.sha }}"
