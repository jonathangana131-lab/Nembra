name: Capture Generated Private Selector FD Recovery Once

on:
  push:
    branches:
      - repair/v17-capture-generated-private-selector-fd-custody-sol-20260814
    paths:
      - .github/workflows/capture-generated-private-selector-fd-recovery-once.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require authoring-only ancestry
        shell: bash
        run: |
          set -euo pipefail
          parent=ff169cf7400d67d421a451d6d0d1d860353bf9e0
          test "$(git merge-base HEAD "$parent")" = "$parent"
          actual="$(git diff --name-only "$parent"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-generated-private-selector-fd-materialize-once.yml' \
            '.github/workflows/capture-generated-private-selector-fd-recovery-once.yml' | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Replay materializer and migrate stronger fail-closed oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import textwrap

          author = Path('.github/workflows/capture-generated-private-selector-fd-materialize-once.yml')
          lines = author.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 -B - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          program = textwrap.dedent('\n'.join(lines[start:end]))
          exec(compile(program, str(author), 'exec'), {})

          tests = Path('scripts/ci/tests/test_capture_accepted_build_input_snapshot.py')
          text = tests.read_text(encoding='utf-8')
          old = '''            accepted = snapshot.generated_manifest_sha256(root, source_sha)\n            destination = Path(raw) / "stage"\n            with self.assertRaises(snapshot.AcceptedBuildInputSnapshotError):\n                snapshot.stage_accepted_build_inputs(root, source_sha, destination, accepted)\n            self.assertFalse(destination.exists())\n\n\nif __name__ == "__main__":\n'''
          new = '''            with self.assertRaises(snapshot.AcceptedBuildInputSnapshotError):\n                snapshot.generated_manifest_sha256(root, source_sha)\n            destination = Path(raw) / "stage"\n            self.assertFalse(destination.exists())\n\n\nif __name__ == "__main__":\n'''
          if text.count(old) != 1:
              raise SystemExit('expected one tracked-ancestor staging oracle at file tail')
          tests.write_text(text.replace(old, new), encoding='utf-8')
          PY

          if ! python3 -B scripts/ci/tests/test_capture_accepted_build_input_snapshot.py > /tmp/snapshot-tests.log 2>&1; then
            detail="$(tail -c 3000 /tmp/snapshot-tests.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Accepted build-input snapshot suite::${detail}"
            exit 1
          fi
          git diff --check

      - name: Publish only permanent repair
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/capture-generated-private-selector-fd-materialize-once.yml \
            .github/workflows/capture-generated-private-selector-fd-recovery-once.yml
          actual="$(git diff --name-only ff169cf7400d67d421a451d6d0d1d860353bf9e0...HEAD; git diff --name-only | cat)"
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          git config user.name "nembra-capture-materializer"
          git config user.email "capture-materializer@users.noreply.github.com"
          git add -A
          staged="$(git diff --cached --name-only ff169cf7400d67d421a451d6d0d1d860353bf9e0 | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            'scripts/ci/capture_accepted_build_input_snapshot.py' \
            'scripts/ci/tests/test_capture_accepted_build_input_snapshot.py' | LC_ALL=C sort)"
          test "$staged" = "$expected"
          git commit -m "Harden generated private selector descriptor custody"
          git push origin HEAD:repair/v17-capture-generated-private-selector-fd-custody-sol-20260814
