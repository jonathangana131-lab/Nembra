name: Capture AX fast materializer

on:
  push:
    branches:
      - 'repair/v14-capture-root-two-file-closure-sol-20260811'
    paths:
      - '.github/workflows/temp-capture-root-ax-fast-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch Capture AX source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = p.read_text(encoding='utf-8')

          marker = 'private struct SecureLinkView: View'
          split = s.find(marker)
          if split < 0:
              raise SystemExit('SecureLinkView marker missing')
          prefix, secure = s[:split], s[split:]
          old = 'Label(isAccessibilityLayout ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")'
          new = 'Label(dynamicTypeSize.isAccessibilitySize ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")'
          if secure.count(old) != 1:
              raise SystemExit(f'unexpected SecureLinkView disclosure source shape: {secure.count(old)} matches')
          secure = secure.replace(old, new, 1)
          s = prefix + secure

          old = '''                    VStack(alignment: .leading, spacing: 7) {
                        if !isAccessibilityLayout {
                            Text("Tuya Smart user code")
                                .font(.subheadline.weight(.semibold))
                        }
                        TextField(isAccessibilityLayout ? "Tuya user code" : "Paste user code", text: $tuya.userCode)'''
          new = '''                    VStack(alignment: .leading, spacing: 7) {
                        Text(isAccessibilityLayout ? "Tuya user code" : "Tuya Smart user code")
                            .font(.subheadline.weight(.semibold))
                            .dynamicTypeSize(...DynamicTypeSize.accessibility1)
                            .accessibilityHidden(true)
                        TextField(isAccessibilityLayout ? "Tuya user code" : "Paste user code", text: $tuya.userCode)'''
          if s.count(old) != 1:
              raise SystemExit(f'unexpected Tuya user-code field source shape: {s.count(old)} matches')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'Text(isAccessibilityLayout ? "Tuya user code" : "Tuya Smart user code")' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Label(dynamicTypeSize.isAccessibilitySize ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Publish clean product head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-capture-root-ax-fast-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --cached --check
          git config user.name 'nembra-capture-bot'
          git config user.email 'capture@nembra.invalid'
          git commit -m 'Capture: close AX compile and persistent field label'
          git push origin HEAD:repair/v14-capture-root-two-file-closure-sol-20260811
