name: Temporary Capture AX fast materializer

on:
  push:
    branches:
      - repair/v14-capture-root-two-file-closure-sol-20260811
    paths:
      - .github/workflows/temp-capture-root-ax-fast-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Materialize scoped AX repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(
              app,
              'Label(isAccessibilityLayout ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")',
              'Label(dynamicTypeSize.isAccessibilitySize ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")',
              'secure-link disclosure scope',
          )
          app = replace_once(
              app,
              '''                    VStack(alignment: .leading, spacing: 7) {
                        if !isAccessibilityLayout {
                            Text("Tuya Smart user code")
                                .font(.subheadline.weight(.semibold))
                        }
                        TextField(isAccessibilityLayout ? "Tuya user code" : "Paste user code", text: $tuya.userCode)''',
              '''                    VStack(alignment: .leading, spacing: 7) {
                        Text(isAccessibilityLayout ? "Tuya user code" : "Tuya Smart user code")
                            .font(.subheadline.weight(.semibold))
                            .dynamicTypeSize(...DynamicTypeSize.accessibility1)
                            .accessibilityHidden(true)
                        TextField(isAccessibilityLayout ? "Tuya user code" : "Paste user code", text: $tuya.userCode)''',
              'persistent Tuya user-code label',
          )
          app_path.write_text(app, encoding='utf-8')

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(
              test,
              '''        #expect(root.contains("TextField(isAccessibilityLayout ? \\\"Tuya user code\\\" : \\\"Paste user code\\\""))
        #expect(root.contains("Label(isAccessibilityLayout ? \\\"Create QR\\\" : \\\"Create approval QR\\\""))''',
              '''        #expect(root.contains("Text(isAccessibilityLayout ? \\\"Tuya user code\\\" : \\\"Tuya Smart user code\\\")"))
        #expect(root.contains(".accessibilityHidden(true)"))
        #expect(root.contains("TextField(isAccessibilityLayout ? \\\"Tuya user code\\\" : \\\"Paste user code\\\""))
        #expect(root.contains("Label(isAccessibilityLayout ? \\\"Create QR\\\" : \\\"Create approval QR\\\""))''',
              'root persistent-field contract',
          )
          test = replace_once(
              test,
              '''        #expect(secureLink.contains(".font(dynamicTypeSize.isAccessibilitySize ? .title2.bold() : .system(.largeTitle, design: .rounded, weight: .bold))"))
        #expect(secureLink.contains(".accessibilityElement(children: .combine)\\n        .accessibilityAddTraits(.isHeader)"))''',
              '''        #expect(secureLink.contains(".font(dynamicTypeSize.isAccessibilitySize ? .title2.bold() : .system(.largeTitle, design: .rounded, weight: .bold))"))
        #expect(secureLink.contains("Label(dynamicTypeSize.isAccessibilitySize ? \\\"Details\\\" : \\\"Engineering details\\\", systemImage: \\\"wrench.and.screwdriver\\\")"))
        #expect(secureLink.contains(".accessibilityElement(children: .combine)\\n        .accessibilityAddTraits(.isHeader)"))''',
              'secure-link disclosure regression contract',
          )
          test_path.write_text(test, encoding='utf-8')
          PY

          git diff --check
          grep -Fq 'Text(isAccessibilityLayout ? "Tuya user code" : "Tuya Smart user code")' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Label(dynamicTypeSize.isAccessibilitySize ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'Label(isAccessibilityLayout ? "Details" : "Engineering details", systemImage: "wrench.and.screwdriver")' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Publish clean product head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-capture-root-ax-fast-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/temp-capture-root-ax-fast-materialize.yml NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift "
          git config user.name 'nembra-capture-bot'
          git config user.email 'capture@nembra.invalid'
          git commit -m 'Capture: close AX compile and persistent field label'
          git push origin HEAD:repair/v14-capture-root-two-file-closure-sol-20260811
