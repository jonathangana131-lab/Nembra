name: Apply V14 Capture product recovery readiness

on:
  push:
    branches:
      - fix/v14-capture-product-recovery-readiness-sol

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-product-recovery-readiness-sol
          fetch-depth: 0

      - name: Apply product truth repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          test "$(git rev-parse HEAD^)" = "d5915a97c1359846b103f08602db78eac815a47f"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              source = source.replace(old, new, 1)

          progress_anchor = "    var correlationCompletedWindowCount: Int { correlationProgress?.completedWindowCount ?? 0 }\n"
          progress_replacement = progress_anchor + "\n" + "\n".join([
              "    var failedAttemptCanRestartFromOFF1: Bool {",
              "        phase == .failed && currentConnectionToken == nil",
              "    }",
              "",
              "    var acceptedArtifactCanPrepareExport: Bool {",
              "        phase == .accepted && sealedAcceptedExport != nil",
              "    }",
          ]) + "\n"
          replace_once(progress_anchor, progress_replacement, "controller product recovery capabilities")

          old_failure = "\n".join([
              "                Text(\"Nothing was promoted after the blocker. Fix the condition above, then restart from a fresh OFF1 attempt.\")",
              "                    .font(.footnote)",
              "                    .foregroundStyle(.secondary)",
              "                Button {",
              "                    test.startBaseline()",
              "                } label: {",
              "                    Label(\"Restart from scooter OFF\", systemImage: \"arrow.counterclockwise\")",
              "                        .frame(maxWidth: .infinity)",
              "                }",
              "                .buttonStyle(.borderedProminent)",
              "                .controlSize(.large)",
              "                .disabled(!authorityReady || test.membershipBusy)",
          ])
          new_failure = "\n".join([
              "                if test.failedAttemptCanRestartFromOFF1 {",
              "                    Text(\"Nothing was promoted after the blocker. Fix the condition above, then restart from a fresh OFF1 attempt.\")",
              "                        .font(.footnote)",
              "                        .foregroundStyle(.secondary)",
              "                    Button {",
              "                        test.startBaseline()",
              "                    } label: {",
              "                        Label(\"Restart from scooter OFF\", systemImage: \"arrow.counterclockwise\")",
              "                            .frame(maxWidth: .infinity)",
              "                    }",
              "                    .buttonStyle(.borderedProminent)",
              "                    .controlSize(.large)",
              "                    .disabled(!authorityReady || test.membershipBusy)",
              "                } else {",
              "                    Label(\"Relaunch Capture\", systemImage: \"arrow.clockwise.circle\")",
              "                        .font(.headline)",
              "                        .foregroundStyle(.orange)",
              "                    Text(\"The package-owned session generation was not proven retired. Close and relaunch Capture before another attempt; do not begin a new OFF1 series in this process.\")",
              "                        .font(.footnote)",
              "                        .foregroundStyle(.secondary)",
              "                }",
          ])
          replace_once(old_failure, new_failure, "failure recovery surface")

          completion_start = source.index("    private var completionPanel: some View {\n")
          completion_end = source.index("    private var sdkAuthorizationPanel: some View {\n", completion_start)
          completion = "\n".join([
              "    private var completionPanel: some View {",
              "        panel {",
              "            VStack(alignment: .leading, spacing: 18) {",
              "                if let data = test.exportData {",
              "                    HStack(alignment: .top, spacing: 14) {",
              "                        Image(systemName: \"checkmark.seal.fill\")",
              "                            .font(.system(size: 38, weight: .semibold))",
              "                            .foregroundStyle(.green)",
              "                            .accessibilityHidden(true)",
              "                        VStack(alignment: .leading, spacing: 3) {",
              "                            Text(\"CAPTURE COMPLETE\")",
              "                                .font(.caption2.bold())",
              "                                .tracking(1.3)",
              "                                .foregroundStyle(.green)",
              "                            Text(\"Ready for analysis\")",
              "                                .font(.title.bold())",
              "                        }",
              "                    }",
              "",
              "                    Text(\"The accepted artifact is sealed and its share bytes are ready. Later callbacks, account changes, or diagnostics cannot rewrite what this capture proved.\")",
              "                        .foregroundStyle(.secondary)",
              "",
              "                    ShareLink(item: SecureTransfer(data: data, name: test.exportName), preview: SharePreview(test.exportName)) {",
              "                        Label(\"Share Capture\", systemImage: \"square.and.arrow.up\")",
              "                            .frame(maxWidth: .infinity)",
              "                    }",
              "                    .buttonStyle(.borderedProminent)",
              "                    .controlSize(.large)",
              "                    .accessibilityHint(\"Shares the immutable accepted Capture artifact for analysis.\")",
              "                } else {",
              "                    HStack(alignment: .top, spacing: 14) {",
              "                        Image(systemName: \"seal.fill\")",
              "                            .font(.system(size: 38, weight: .semibold))",
              "                            .foregroundStyle(.cyan)",
              "                            .accessibilityHidden(true)",
              "                        VStack(alignment: .leading, spacing: 3) {",
              "                            Text(\"CAPTURE SEALED\")",
              "                                .font(.caption2.bold())",
              "                                .tracking(1.3)",
              "                                .foregroundStyle(.cyan)",
              "                            Text(\"Share artifact not ready\")",
              "                                .font(.title.bold())",
              "                        }",
              "                    }",
              "",
              "                    Text(\"The accepted evidence is already frozen. Share preparation cannot change those accepted bytes or mint new physical evidence.\")",
              "                        .foregroundStyle(.secondary)",
              "                    Text(test.message)",
              "                        .font(.footnote)",
              "                        .foregroundStyle(.secondary)",
              "                        .fixedSize(horizontal: false, vertical: true)",
              "",
              "                    if test.acceptedArtifactCanPrepareExport {",
              "                        Button {",
              "                            test.prepareExport()",
              "                        } label: {",
              "                            Label(\"Retry sealed export\", systemImage: \"arrow.clockwise\")",
              "                                .frame(maxWidth: .infinity)",
              "                        }",
              "                        .buttonStyle(.borderedProminent)",
              "                        .controlSize(.large)",
              "                        .accessibilityHint(\"Retries encoding the already-frozen accepted artifact without collecting or rebuilding evidence.\")",
              "                    } else {",
              "                        Text(\"The frozen accepted envelope is unavailable. Follow the blocker above; do not reconstruct accepted evidence from mutable state.\")",
              "                            .font(.footnote.weight(.semibold))",
              "                            .foregroundStyle(.orange)",
              "                    }",
              "                }",
              "",
              "                Button(showEngineeringDetails ? \"Hide details\" : \"View details\") {",
              "                    showEngineeringDetails.toggle()",
              "                }",
              "                .buttonStyle(.bordered)",
              "                .controlSize(.large)",
              "            }",
              "        }",
              "        .accessibilityElement(children: .contain)",
              "    }",
              "",
          ])
          source = source[:completion_start] + completion + source[completion_end:]

          replace_once(
              "        case .accepted: return \"Capture complete\"\n",
              "        case .accepted: return test.exportData == nil ? \"Capture sealed\" : \"Capture complete\"\n",
              "accepted hero title",
          )
          replace_once(
              "        case .accepted:\n            return \"Your read-only evidence is sealed and ready to share for analysis.\"\n        case .failed:\n            return \"No evidence was promoted past the blocker. Fix the condition and restart from scooter OFF.\"\n",
              "        case .accepted:\n            return test.exportData == nil\n                ? \"Accepted evidence is sealed; the share artifact is not ready yet.\"\n                : \"The sealed share artifact is ready for analysis.\"\n        case .failed:\n            return test.failedAttemptCanRestartFromOFF1\n                ? \"No evidence was promoted past the blocker. Fix the condition and restart from scooter OFF.\"\n                : \"This attempt cannot safely restart in-process. Relaunch Capture before another attempt.\"\n",
              "accepted and failed hero subtitles",
          )

          if ".task { test.prepareExport() }" in source[source.index("    private var completionPanel: some View {"):source.index("    private var sdkAuthorizationPanel: some View {")]:
              raise SystemExit("completion panel still contains automatic retry task")
          if "var failedAttemptCanRestartFromOFF1: Bool" not in source:
              raise SystemExit("restart capability missing")
          if "if let data = test.exportData" not in completion or completion.index("Ready for analysis") < completion.index("if let data = test.exportData"):
              raise SystemExit("analysis-ready copy is not share-artifact gated")

          path.write_text(source)
          PY

          rm .github/workflows/apply-v14-capture-product-recovery-readiness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): gate recovery and analysis readiness'
          git push origin HEAD:fix/v14-capture-product-recovery-readiness-sol
