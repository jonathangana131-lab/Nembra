name: V14 Capture Root Preflight Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/v14-capture-root-preflight-bootstrap.yml'
      - 'scripts/ci/v14_apply_capture_root_preflight_patch.py'

permissions:
  contents: write

jobs:
  apply-root-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply scoped Capture root repair
        run: python3 scripts/ci/v14_apply_capture_root_preflight_patch.py
      - name: Commit product-only result
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): expose field lock and recompose accessibility root'
          git push origin "HEAD:${HEAD_REF}"
