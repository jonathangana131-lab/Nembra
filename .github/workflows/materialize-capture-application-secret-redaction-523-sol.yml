name: Materialize Capture application secret redaction 523

on:
  push:
    branches:
      - recovery/v14-capture-application-secret-redaction-523-sol

permissions:
  contents: write

concurrency:
  group: capture-application-secret-redaction-523-sol
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-application-secret-redaction-523-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact current product and bounded construction scope
        shell: bash
        run: |
          set -euo pipefail
          parent='52333deb09ea9a5964250097f83884d285f25d78'
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-parse "$parent:NembraApp/App/NembraCaptureEntrypoint.swift")" = "$(git rev-parse HEAD:NembraApp/App/NembraCaptureEntrypoint.swift)"
          unexpected="$(git diff --name-only "$parent"...HEAD | grep -Ev '^(.github/workflows/materialize-capture-application-secret-redaction-523-sol.yml|scripts/ci/materialize_capture_application_secret_redaction_recovery.py|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift)$' || true)"
          test -z "$unexpected"

      - name: Materialize earliest app-owned secret custody boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_application_secret_redaction_recovery.py apply
          python3 scripts/ci/materialize_capture_application_secret_redaction_recovery.py verify
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          # Preserve newer lifecycle truth while changing only SmartLifeDriver's application-event projection.
          required = (
              'private var acceptsViewScopedMembershipRequests = false',
              'func activateMembershipRequestsForView()',
              'Task { @MainActor [self] in',
              'guard !packageCorrelationRetiredForProcess,',
              'test.activateMembershipRequestsForView()',
          )
          for needle in required:
              if needle not in source:
                  raise SystemExit('newer lifecycle truth regressed: ' + needle)
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift').read_text(encoding='utf-8')
          for needle in ('redactApplicationSecrets', 'String(describing: Self.redactApplicationSecrets(value))', 'secretsRedacted: true'):
              if needle not in test:
                  raise SystemExit('secret custody regression incomplete: ' + needle)
          print('application secret custody recovery contract: PASS')
          PY
          git diff --check

      - name: Publish clean two-path donor and retire construction tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          git commit -m "fix(capture): redact authenticated application secrets"
          git rm scripts/ci/materialize_capture_application_secret_redaction_recovery.py .github/workflows/materialize-capture-application-secret-redaction-523-sol.yml
          git commit -m "chore(capture): retire application-secret recovery tooling"
          git push origin HEAD:recovery/v14-capture-application-secret-redaction-523-sol
