name: Materialize Capture mid-series Tuya ownership repair

on:
  push:
    branches:
      - repair/v14-capture-midseries-tuya-ownership-current-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-midseries-tuya-ownership-current-sol
          fetch-depth: 0

      - name: Verify exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eee5a96fae1d30796ba5707f0a7f30f4f4d62530"

      - name: Apply read-only mid-series ownership fences
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          old = '''    func consumeCorrelationAsyncInvalidation() {
              guard (phase == .baseline || phase == .scanning),
                    correlationProgress?.isSeriesInvalidated == true else { return }
              correlationSession = nil
              failLocally(
                  "Bluetooth correlation ended before this window could be sealed because package-owned scanner/Bluetooth authority became unavailable. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series.",
                  "target_correlation_async_invalidated"
              )
          }
          '''
          new = '''    func consumeCorrelationAsyncInvalidation() {
              guard phase == .baseline || phase == .scanning else { return }
              if OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID) {
                  correlationSession?.abandonCurrentWindow()
                  correlationSession = nil
                  failLocally(
                      "Tuya regained local-BLE ownership while package correlation was active. This correlation window is invalid; power the scooter OFF, let Tuya local BLE clear, and restart from OFF1.",
                      "sdk_local_ble_reacquired_during_target_correlation"
                  )
                  return
              }
              guard correlationProgress?.isSeriesInvalidated == true else { return }
              correlationSession = nil
              failLocally(
                  "Bluetooth correlation ended before this window could be sealed because package-owned scanner/Bluetooth authority became unavailable. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series.",
                  "target_correlation_async_invalidated"
              )
          }
          '''
          if source.count(old) != 1:
              raise SystemExit("async ownership seam no longer matches exact product parent")
          source = source.replace(old, new)

          old = '''        guard let session = correlationSession,
                    let progress = session.progress else {
              failLocally("Fresh Bluetooth correlation authority is unavailable. Restart from OFF1.", "target_correlation_authority_unavailable")
              return
          }
          '''
          new = '''        guard !OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID) else {
              correlationSession?.abandonCurrentWindow()
              correlationSession = nil
              failLocally(
                  "Tuya local-BLE ownership is active before this correlation window. The package scanner will not start; power the scooter OFF, let Tuya local BLE clear, and restart from OFF1.",
                  "sdk_local_ble_ownership_blocks_correlation_window"
              )
              return
          }
          guard let session = correlationSession,
                    let progress = session.progress else {
              failLocally("Fresh Bluetooth correlation authority is unavailable. Restart from OFF1.", "target_correlation_authority_unavailable")
              return
          }
          '''
          if source.count(old) != 1:
              raise SystemExit("window-start ownership seam no longer matches exact product parent")
          source = source.replace(old, new)

          old = '''        let sealedLabel = correlationWindowLabel
          do {
              let final = try session.finishCurrentWindow()
          '''
          new = '''        guard !OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID) else {
              session.abandonCurrentWindow()
              correlationSession = nil
              failLocally(
                  "Tuya local-BLE ownership appeared before this correlation window could be sealed. The window is invalid; power the scooter OFF, let Tuya local BLE clear, and restart from OFF1.",
                  "sdk_local_ble_ownership_invalidates_correlation_window"
              )
              return
          }

          let sealedLabel = correlationWindowLabel
          do {
              let final = try session.finishCurrentWindow()
          '''
          if source.count(old) != 1:
              raise SystemExit("window-seal ownership seam no longer matches exact product parent")
          source = source.replace(old, new)

          old = '''        .task {
              sdkAccount.bootstrap()
              if sdkAccount.loggedIn { test.verifySDKMembership() }
          }
          .onChange(of: sdkAccount.loggedIn) { _, loggedIn in
          '''
          new = '''        .task {
              sdkAccount.bootstrap()
              if sdkAccount.loggedIn { test.verifySDKMembership() }
              while !Task.isCancelled {
                  test.consumeCorrelationAsyncInvalidation()
                  try? await Task.sleep(nanoseconds: 250_000_000)
              }
          }
          .onChange(of: sdkAccount.loggedIn) { _, loggedIn in
          '''
          if source.count(old) != 1:
              raise SystemExit("view polling seam no longer matches exact product parent")
          source = source.replace(old, new)

          path.write_text(source)
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMidSeriesBLEOwnershipSourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture mid-series Tuya BLE ownership fence")
          struct TuyaMidSeriesBLEOwnershipSourceTests {
              @Test("every active correlation window fails closed if Tuya reacquires local BLE")
              func correlationCannotCoexistWithTuyaLocalBLE() throws {
                  let source = try read("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let asyncGuard = try section(in: source, from: "func consumeCorrelationAsyncInvalidation()", to: "var correlationWindowLabel")
                  let start = try section(in: source, from: "private func startCurrentCorrelationWindow()", to: "func finishCorrelationWindow()")
                  let finish = try section(in: source, from: "func finishCorrelationWindow()", to: "private func finishCorrelationSeries")
                  let view = try section(in: source, from: "private struct SecureLinkView: View", to: "private var hero: some View")

                  #expect(asyncGuard.contains("OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)"))
                  #expect(asyncGuard.contains("correlationSession?.abandonCurrentWindow()"))
                  #expect(asyncGuard.contains("sdk_local_ble_reacquired_during_target_correlation"))

                  #expect(start.contains("OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)"))
                  #expect(start.contains("sdk_local_ble_ownership_blocks_correlation_window"))
                  #expect(start.range(of: "OfficialTuyaFactory.isLocallyConnected")!.lowerBound < start.range(of: "session.startCurrentWindow()")!.lowerBound)

                  #expect(finish.contains("OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)"))
                  #expect(finish.contains("sdk_local_ble_ownership_invalidates_correlation_window"))
                  #expect(finish.range(of: "OfficialTuyaFactory.isLocallyConnected")!.lowerBound < finish.range(of: "session.finishCurrentWindow()")!.lowerBound)

                  #expect(view.contains("while !Task.isCancelled"))
                  #expect(view.contains("test.consumeCorrelationAsyncInvalidation()"))
                  #expect(view.contains("Task.sleep(nanoseconds: 250_000_000)"))
              }

              @Test("ownership fence remains observation-only")
              func ownershipFenceDoesNotMutateTuyaTransport() throws {
                  let source = try read("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = try section(in: source, from: "private final class SecureLinkController", to: "private protocol OfficialTuyaDriver")
                  #expect(!controller.contains("disconnectBLE"))
                  #expect(!controller.contains("publishDps("))
                  #expect(!controller.contains("queryDps("))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func read(_ relativePath: String) throws -> String {
                  let root = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: root.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          SWIFT

      - name: Validate bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          required = [
              "sdk_local_ble_reacquired_during_target_correlation",
              "sdk_local_ble_ownership_blocks_correlation_window",
              "sdk_local_ble_ownership_invalidates_correlation_window",
              "while !Task.isCancelled",
              "Task.sleep(nanoseconds: 250_000_000)",
          ]
          for needle in required:
              assert needle in s, needle
          controller = s[s.index("private final class SecureLinkController"):s.index("private protocol OfficialTuyaDriver")]
          for forbidden in ("disconnectBLE", "publishDps(", "queryDps("):
              assert forbidden not in controller, forbidden
          PY
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMidSeriesBLEOwnershipSourceTests.swift
          fi

      - name: Publish clean two-path product commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-midseries-tuya-ownership.yml
          git add -A
          git diff --cached --check
          git config user.name "Nembra V14 materializer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): fence Tuya BLE ownership through correlation"
          git push origin HEAD:repair/v14-capture-midseries-tuya-ownership-current-sol
