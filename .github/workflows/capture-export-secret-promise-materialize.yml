name: Capture Export Secret Promise Materializer

on:
  push:
    branches:
      - repair/v14-capture-export-secret-promise-4b41-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/v14-capture-export-secret-promise-4b41-sol

      - name: Verify exact product ancestry and untouched source
        run: |
          set -euo pipefail
          product=4b41c9ad783f568d0d353acc9f7016a9bd0b64c2
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --exit-code "$product" -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Materialize product repair
        run: python3 scripts/materialize_capture_export_secret_promise.py

      - name: Validate source mutation
        run: |
          set -euo pipefail
          git diff --check
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          driver = source[source.index('private final class SmartLifeDriver'):source.index('private enum AppleAccountAuthorizationError')]
          for fragment in ('localkey','sessionkey','appkey','appsecret','password','accounttoken','accesstoken','refreshtoken','authkey','seckey'):
              assert f'"{fragment}"' in driver, fragment
          assert 'String(describing: Self.redactApplicationSecrets(value))' in driver
          assert 'onApplicationUpdate?(sanitized)' in driver
          PY

      - name: Publish clean two-path repair
        run: |
          set -euo pipefail
          product=4b41c9ad783f568d0d353acc9f7016a9bd0b64c2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git rm scripts/materialize_capture_export_secret_promise.py .github/workflows/capture-export-secret-promise-materialize.yml
          git commit -m 'Capture: match application redaction to export secret promise'
          expected=$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift' | sort)
          actual=$(git diff --name-only "$product" HEAD | sort)
          test "$actual" = "$expected"
          git diff --check "$product" HEAD
          git push origin HEAD:repair/v14-capture-export-secret-promise-4b41-sol
