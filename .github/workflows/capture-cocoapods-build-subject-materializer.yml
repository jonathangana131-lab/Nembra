name: Capture CocoaPods Build Subject Materializer

on:
  push:
    branches:
      - repair/v14-capture-cocoapods-build-subject-authority-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind lineage
        run: git merge-base --is-ancestor 8292b51e5df90744950e7f0d4a04684523520563 HEAD
      - name: Materialize and test product repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/_materialize_cocoapods_build_subject.py
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          python3 -m py_compile Scripts/capture_cocoapods_build_subject.py scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          python3 -I Scripts/capture_cocoapods_build_subject.py --self-test
          python3 scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          git diff --check
      - name: Commit product patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Scripts/bootstrap_capture_tuya_sdk.sh .github/workflows/capture-field-build-provenance.yml; then
            echo 'Product patch already materialized; no commit needed.'
            exit 0
          fi
          git config user.name 'nembra-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add Scripts/bootstrap_capture_tuya_sdk.sh .github/workflows/capture-field-build-provenance.yml
          git commit -m 'fix(capture): bind generated CocoaPods build subject'
          git push origin HEAD:repair/v14-capture-cocoapods-build-subject-authority-sol
