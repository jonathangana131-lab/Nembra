name: Capture signed Apple identity materializer

on:
  push:
    branches:
      - agent/v14-capture-signed-apple-id-custody-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-signed-apple-id-custody-sol
          fetch-depth: 0

      - name: Apply exact signed-identity custody repair
        shell: bash
        env:
          NEEDLE1_B64: 
          REPLACEMENT1_B64: 
          NEEDLE2_B64: 
          REPLACEMENT2_B64: 
          TEST_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          installer_path = Path('scripts/field/install_one_time_capture.command')
          installer = installer_path.read_text()
          pairs = [
              ('NEEDLE1_B64', 'REPLACEMENT1_B64'),
              ('NEEDLE2_B64', 'REPLACEMENT2_B64'),
          ]
          for needle_name, replacement_name in pairs:
              needle = base64.b64decode(os.environ[needle_name]).decode()
              replacement = base64.b64decode(os.environ[replacement_name]).decode()
              count = installer.count(needle)
              if count != 1:
                  raise SystemExit(f'{needle_name}: expected one exact insertion subject, found {count}')
              installer = installer.replace(needle, replacement, 1)
          installer_path.write_text(installer)
          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift')
          if test_path.exists():
              raise SystemExit('expected-red signed identity regression already exists on product base')
          test_path.write_bytes(base64.b64decode(os.environ['TEST_B64']))
          PY

      - name: Validate fail-closed ordering and shell syntax
        shell: bash
        run: |
          bash -n scripts/field/install_one_time_capture.command
          python3 - <<'PY'
          from pathlib import Path
          installer = Path('scripts/field/install_one_time_capture.command').read_text()
          install = installer.index('say "Installing SDK-integrated Capture on the intended iPhone"')
          checks = [
              '[[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]]',
              '[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]]',
              '[[ "$BUILT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
          ]
          for check in checks:
              assert installer.index(check) < install, check
          assert 'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"' not in installer
          start = installer.index('BUILT_APPLICATION_IDENTIFIER')
          custody = installer[start:install]
          for forbidden in ('connectBLE', 'publishDps', 'writeValue', 'scanForPeripherals', 'NEMBRA_SIMULATION_'):
              assert forbidden not in custody, forbidden
          print('signed Apple app/profile/team custody shape: PASS')
          PY
          git diff --check

      - name: Commit durable repair
        shell: bash
        run: |
          git config user.name 'nembra-capture-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/_capture_signed_apple_identity_materialize.yml
          git add scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(capture): bind signed Apple app identity'
          git push origin HEAD:agent/v14-capture-signed-apple-id-custody-sol
