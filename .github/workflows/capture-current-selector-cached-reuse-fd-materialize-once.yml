name: Capture Current Selector Cached Reuse FD Materialize Once

on:
  push:
    branches:
      - repair/v17-capture-current-selector-cached-reuse-fd-gpt56
    paths:
      - .github/workflows/capture-current-selector-cached-reuse-fd-materialize-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXACT_PARENT: 2c59ae0a9001987a57c3b5819f546a52d9264db0
      PYTHONDONTWRITEBYTECODE: 1
      OLD_B64: ICAgICAgICAgICAgICAgIHNlbGVjdGlvbl9hbmNlc3RvcnMuYXBwZW5kKChjYWNoZWRfZGVzY3JpcHRvciwgYWRtaXR0ZWQsIHJlbGF0aXZlKSkKICAgICAgICAgICAgICAgIG9zLmNsb3NlKGN1cnJlbnQpCiAgICAgICAgICAgICAgICBjdXJyZW50ID0gb3MuZHVwKGNhY2hlZF9kZXNjcmlwdG9yKQogICAgICAgICAgICAgICAgY29udGludWUK
      NEW_B64: 
      MARKER_B64: ICAgIGRlZiB0ZXN0X2NhY2hlX2R1cF9mYWlsdXJlX2Nsb3Nlc19uZXdseV9vcGVuZWRfY2hpbGRfZGVzY3JpcHRvcihzZWxmKSAtPiBOb25lOgo=
      REGRESSION_B64: 
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-current-selector-cached-reuse-fd-gpt56
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact authoring child
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = ".github/workflows/capture-current-selector-cached-reuse-fd-materialize-once.yml"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize ownership transfer repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          import base64
          import os
          from pathlib import Path
          helper = Path("scripts/ci/capture_accepted_build_input_snapshot.py")
          source = helper.read_text(encoding="utf-8")
          old = base64.b64decode(os.environ["OLD_B64"]).decode("utf-8")
          new = base64.b64decode(os.environ["NEW_B64"]).decode("utf-8")
          if source.count(old) != 1:
              raise SystemExit("cached-reuse ownership seam did not match exactly once")
          helper.write_text(source.replace(old, new), encoding="utf-8")
          test = Path("scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py")
          source = test.read_text(encoding="utf-8")
          marker = base64.b64decode(os.environ["MARKER_B64"]).decode("utf-8")
          regression = base64.b64decode(os.environ["REGRESSION_B64"]).decode("utf-8")
          if source.count(marker) != 1:
              raise SystemExit("cached-reuse regression insertion seam did not match exactly once")
          test.write_text(source.replace(marker, regression + marker), encoding="utf-8")
          PY

      - name: Prove focused and inherited selector suites
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              "scripts/ci/capture_accepted_build_input_snapshot.py",
              "scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py",
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          PY
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish clean current-carrier repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git commit -m 'fix(capture): preserve cached reuse fd ownership'
          git rm .github/workflows/capture-current-selector-cached-reuse-fd-materialize-once.yml
          git commit -m 'ci(capture): remove cached-reuse materializer'
          git push origin HEAD:repair/v17-capture-current-selector-cached-reuse-fd-gpt56

      - name: Preserve truth boundary
        shell: bash
        run: |
          echo 'NEMBRA_CURRENT_SELECTOR_FD_REPAIR physicalAuthorityCreated=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false'
