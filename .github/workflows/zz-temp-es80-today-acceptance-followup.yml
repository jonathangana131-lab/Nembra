name: TEMP ES80 TODAY acceptance follow-up

on:
  push:
    branches:
      - fix/es80-today-xcode-acceptance-followup-gpt56

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-today-xcode-acceptance-followup-gpt56
          fetch-depth: 0

      - name: Apply guarded acceptance repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/zz_temp_es80_today_acceptance_followup.py
          git diff --check
          git diff -- NembraApp/App/NembraApp.swift NembraApp/Features/Research/ES80CaptureShellView.swift NembraAppTests/NembraAppTests.swift NembraUITests/ES80ResearchCaptureUITests.swift

      - name: Commit product and acceptance changes only
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/zz_temp_es80_today_acceptance_followup.py
          rm .github/workflows/zz-temp-es80-today-acceptance-followup.yml
          git config user.name nembra-v14-go-worker
          git config user.email nembra-v14-go-worker@users.noreply.github.com
          git add -A
          git commit -m "fix(capture): close exact-head Simulator acceptance gaps"
          git push origin HEAD:fix/es80-today-xcode-acceptance-followup-gpt56
