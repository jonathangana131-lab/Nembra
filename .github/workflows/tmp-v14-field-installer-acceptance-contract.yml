name: V14 Field acceptance contract materializer

"on":
  push:
    branches:
      - repair/v14-field-installer-acceptance-contract-sol-20260811

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch and validate stale Field acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/capture-field-build-provenance.yml')
          source = path.read_text(encoding='utf-8')

          stale_sha = '''          grep -Fq 'SOURCE_SHA="$(git rev-parse HEAD | tr ' "$installer"'''
          replacement_sha = '''          grep -Fq 'AUTHORITY_GIT_DIR="$ROOT/.git"' "$installer"
          grep -Fq 'SOURCE_SHA="$(run_authority_git rev-parse --verify' "$installer"'''
          if source.count(stale_sha) != 1:
              raise SystemExit('stale raw SOURCE_SHA contract not found exactly once')
          source = source.replace(stale_sha, replacement_sha, 1)

          stale_message = '''          grep -Fq 'Exact requested Capture source matched: $SOURCE_SHA' "$installer"'''
          replacement_message = '''          grep -Fq 'verify_accepted_checkout_source "Current checkout is not the exact accepted Capture source."' "$installer"
          grep -Fq 'run_accepted_source_bash "Scripts/bootstrap_capture_tuya_sdk.sh"' "$installer"
          if grep -Fq '"$ROOT/Scripts/bootstrap_capture_tuya_sdk.sh"' "$installer"; then
            echo 'ERROR: field bootstrap must execute from exact accepted Git bytes, not a mutable checkout pathname.' >&2
            exit 1
          fi
          grep -Fq 'Exact requested Capture source matched under isolated Git + raw-byte authority: $SOURCE_SHA' "$installer"'''
          if source.count(stale_message) != 1:
              raise SystemExit('stale source-match message contract not found exactly once')
          source = source.replace(stale_message, replacement_message, 1)
          path.write_text(source, encoding='utf-8')
          PY

          /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py
          bash -n scripts/field/install_one_time_capture.command
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          git diff --check

      - name: Export validated canonical workflow
        uses: actions/upload-artifact@v4
        with:
          name: validated-field-acceptance-contract
          path: .github/workflows/capture-field-build-provenance.yml
          if-no-files-found: error
          retention-days: 1
