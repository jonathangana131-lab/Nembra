                    await self.mirrorAlreadyTerminalObservationContinuity(
                        token: token,
                        message: "Authenticated-session liveness crossed the package-owned continuous-observation horizon. The package already retired this generation; no disconnect is claimed.",
                        kind: "session_liveness_continuity_invalidated"
                    )
                    return
                } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached {
                    await self.mirrorAlreadyTerminalIncompleteObservationHorizon(
                        token: token,
                        message: "Scooter application evidence did not become sufficient within 60 seconds. Relaunch Capture and start again from scooter OFF. No BLE disconnect is claimed.",
                        kind: "session_authenticated_incomplete_readiness_horizon_reached"
                    )
                    return
                } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {
'''
          assert s.count(watch_catch) == 1
          s = s.replace(watch_catch, watch_new, 1)

          start = '''                if self.applicationUpdateAdmissionsInFlight == 0,
                   (self.canonicalObservedAgeSeconds ?? 0) > 60,
                   self.applicationUpdateCount == 0 {
'''
          sleep = '                try? await Task.sleep(for: .seconds(1))\n'
          assert s.count(start) == 1
          a = s.index(start); b = s.index(sleep, a)
          removed = s[a:b]
          for needle in ('markApplicationObservationTimedOut(for: token)', 'authenticated_application_timeout', 'sdkLocalBLEOnline = false'):
              assert needle in removed
          s = s[:a] + s[b:]

          anchor = '''    private func recordObservedTransportLoss(token: TuyaReadOnlyConnectionToken) async {
'''
          mirror = '''    /// Mirrors the package-owned incomplete-evidence terminal. The package has already retired
    /// this exact generation, so presentation performs no second ledger mutation and does not
    /// manufacture transport loss. Preserve the last witnessed SDK-local BLE state as diagnostics.
    private func mirrorAlreadyTerminalIncompleteObservationHorizon(
        token: TuyaReadOnlyConnectionToken,
        message: String,
        kind: String
    ) async {
        guard currentConnectionToken == token else { return }
        watchdog?.cancel()
        watchdog = nil
        currentConnectionToken = nil
        localBLESettlementToken = nil
        driver = nil
        await refreshLedgerSnapshot()
        phase = .failed
        self.message = message
        log(kind, [
            "generation": String(token.diagnosticGeneration),
            "applicationUpdates": String(applicationUpdateCount)
        ])
    }

'''
          assert s.count(anchor) == 1
          assert 'private func mirrorAlreadyTerminalIncompleteObservationHorizon(' not in s
          s = s.replace(anchor, mirror + anchor, 1)
          app.write_text(s)

          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaIncompleteObservationSemanticTerminalTests.swift')
          test.write_text('''import Foundation
import Testing
@testable import NembraBluetoothCapture

@Suite("Tuya incomplete observation semantic terminal")
struct TuyaIncompleteObservationSemanticTerminalTests {
    private static let reason = "Authenticated session ended because required repeated application evidence did not become sufficient before the observation deadline."

    @Test("deadline liveness preserves accepted prefix and atomically retires generation")
    func livenessDeadlinePreservesPrefix() async throws {
        let clock = SemanticClock(1_000)
        let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
        let token = try await authenticated(clock, ledger)
        clock.advance(to: 3_000)
        try await ledger.recordApplicationUpdate(isNonEmpty: true, for: token)
        let horizon = 2_000 + TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds
        try await advance(clock, ledger, token, from: 3_000, untilBefore: horizon)
        let prefix = await ledger.currentPreflightSnapshot()
        clock.advance(to: horizon)
        await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached) {
            try await ledger.observeCurrentConnection(for: token)
        }
        let terminal = await ledger.currentPreflightSnapshot()
        #expect(terminal.authenticationState == .failed(reason: Self.reason))
        #expect(terminal.latestObservedUptimeNanoseconds == prefix.latestObservedUptimeNanoseconds)
        #expect(terminal.applicationPayloadCount == prefix.applicationPayloadCount)
        #expect(terminal.latestApplicationPayloadUptimeNanoseconds == prefix.latestApplicationPayloadUptimeNanoseconds)
        await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.noActiveConnection) {
            try await ledger.observeCurrentConnection(for: token)
        }
    }

    @Test("deadline application callback cannot rescue or mutate one-payload prefix")
    func applicationDeadlinePreservesPrefix() async throws {
        let clock = SemanticClock(1_000)
        let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
        let token = try await authenticated(clock, ledger)
        clock.advance(to: 3_000)
        try await ledger.recordApplicationUpdate(isNonEmpty: true, for: token)
        let horizon = 2_000 + TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds
        try await advance(clock, ledger, token, from: 3_000, untilBefore: horizon)
        let prefix = await ledger.currentPreflightSnapshot()
        clock.advance(to: horizon)
        await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached) {
            try await ledger.recordApplicationUpdate(isNonEmpty: true, for: token)
        }
        let terminal = await ledger.currentPreflightSnapshot()
        #expect(terminal.authenticationState == .failed(reason: Self.reason))
        #expect(terminal.latestObservedUptimeNanoseconds == prefix.latestObservedUptimeNanoseconds)
        #expect(terminal.applicationPayloadCount == 1)
        #expect(terminal.latestApplicationPayloadUptimeNanoseconds == 3_000)
    }

    private func authenticated(_ clock: SemanticClock, _ ledger: TuyaAuthenticatedReadOnlySessionLedger) async throws -> TuyaReadOnlyConnectionToken {
        let token = try await ledger.beginConnection()
        clock.advance(to: 1_500); try await ledger.markAuthenticationStarted(for: token)
        clock.advance(to: 2_000); try await ledger.markAuthenticated(for: token, method: .smartLifeAppSDK)
        return token
    }

    private func advance(_ clock: SemanticClock, _ ledger: TuyaAuthenticatedReadOnlySessionLedger, _ token: TuyaReadOnlyConnectionToken, from start: UInt64, untilBefore target: UInt64) async throws {
        var cursor = start
        let gap = TuyaAuthenticatedReadOnlySessionLedger.maximumContinuousObservationGapNanoseconds
        while cursor + gap < target {
            cursor += gap
            clock.advance(to: cursor)
            try await ledger.observeCurrentConnection(for: token)
        }
    }
}

private final class SemanticClock: @unchecked Sendable {
    private let lock = NSLock(); private var value: UInt64
    init(_ value: UInt64) { self.value = value }
    var now: @Sendable () -> UInt64 { { [self] in lock.lock(); defer { lock.unlock() }; return value } }
    func advance(to newValue: UInt64) { lock.lock(); value = newValue; lock.unlock() }
}
''')

          source_test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationTimeoutPresentationRaceSourceTests.swift')
