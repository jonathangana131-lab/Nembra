import Testing
@testable import NembraBluetoothCapture

@Suite("Tuya package-owned incomplete horizon app contract")
struct TuyaApplicationTimeoutPresentationRaceSourceTests {
    @Test("both app admission paths mirror one package terminal without fake BLE loss")
    func appMirrorsPackageTerminal() throws {
        let source = try read("NembraApp/App/NembraCaptureEntrypoint.swift")
        #expect(source.components(separatedBy: "MutationError.incompleteObservationHorizonReached").count - 1 == 2)
        #expect(source.components(separatedBy: "mirrorAlreadyTerminalIncompleteObservationHorizon(").count - 1 == 3)
        #expect(!source.contains("authenticated_application_timeout"))
        #expect(!source.contains("(self.canonicalObservedAgeSeconds ?? 0) > 60"))
        let helper = try section(source, "private func mirrorAlreadyTerminalIncompleteObservationHorizon(", "private func recordObservedTransportLoss(")
        #expect(!helper.contains("sdkLocalBLEOnline = false"))
        #expect(!helper.contains("markApplicationObservationTimedOut"))
        #expect(!helper.contains("invalidateInternalLifecycle"))
        #expect(helper.contains("driver = nil"))
    }

    @Test("ledger checks package horizon before accepted chronology mutation")
    func ledgerPreservesPrefixByConstruction() throws {
        let source = try read("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift")
        #expect(source.contains("try requireIncompleteObservationHorizonOpen(at: now)\n        latestObservedUptimeNanoseconds = now"))
        #expect(source.contains("try requireIncompleteObservationHorizonOpen(at: now)\n        guard let authenticatedAt"))
        let helper = try section(source, "private func requireIncompleteObservationHorizonOpen(at now: UInt64)", "private func requireContinuousAuthenticatedObservation(at now: UInt64)")
        #expect(helper.contains("currentToken = nil"))
        #expect(helper.contains("throw MutationError.incompleteObservationHorizonReached"))
    }

    private func section(_ source: String, _ start: String, _ end: String) throws -> String {
        guard let a = source.range(of: start), let b = source.range(of: end, range: a.upperBound..<source.endIndex) else { throw ContractError.missing }
        return String(source[a.lowerBound..<b.lowerBound])
    }
    private func read(_ relativePath: String) throws -> String {
        let root = URL(fileURLWithPath: #filePath).deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent()
        return try String(contentsOf: root.appendingPathComponent(relativePath), encoding: .utf8)
    }
    private enum ContractError: Error { case missing }
}
''')
