    /// monotonic observation time. A deadline-crossing callback cannot become evidence for itself.
    /// If readiness was already earned, the generation remains valid; otherwise retire atomically
    /// without moving accepted liveness/payload timestamps.
    private func requireIncompleteObservationHorizonOpen(at now: UInt64) throws {
        guard let authenticatedAt = authenticatedAtUptimeNanoseconds else { return }
        guard now >= authenticatedAt else { throw MutationError.monotonicClockRegressed }
        guard now - authenticatedAt >= TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds else { return }
        guard TuyaAuthenticatedReadOnlyPreflight.verdict(for: makeSnapshot()) != .readyForStationaryMapping else { return }
        authenticationState = .failed(reason: Self.incompleteObservationFailureReason)
        currentToken = nil
        throw MutationError.incompleteObservationHorizonReached
    }

'''
          assert s.count(continuity) == 1
          s = s.replace(continuity, helper + continuity, 1)
