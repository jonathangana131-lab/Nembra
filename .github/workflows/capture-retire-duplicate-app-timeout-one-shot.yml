          anchor = '''    private static let observationContinuityFailureReason =
        "Authenticated observation continuity was invalidated by a long observation gap."
'''
          replacement = anchor + '''    private static let incompleteObservationFailureReason =
        "Authenticated session ended because required repeated application evidence did not become sufficient before the observation deadline."
'''
          assert s.count(anchor) == 1
          s = s.replace(anchor, replacement, 1)

          old = '''        let now = try nextMonotonicObservation()
        try requireContinuousAuthenticatedObservation(at: now)
        guard let authenticatedAt = authenticatedAtUptimeNanoseconds,
              now >= authenticatedAt else {
            throw MutationError.monotonicClockRegressed
        }

        // A callback arriving at or beyond the package-owned incomplete-session horizon cannot
        // bootstrap itself into acceptance. Evaluate retirement using the current evidence with
        // `now` only as the candidate liveness receipt, before mutating payload count/timestamps.
        // Canonically ready generations remain allowed to receive later read-only updates.
        let preMutationHorizonSnapshot = TuyaAuthenticatedReadOnlyPreflightSnapshot(
            authenticationState: authenticationState,
            authenticationMethod: authenticationMethod,
            connectionStartedAtUptimeNanoseconds: connectionStartedAtUptimeNanoseconds,
            authenticatedAtUptimeNanoseconds: authenticatedAtUptimeNanoseconds,
            latestObservedUptimeNanoseconds: now,
            applicationPayloadCount: applicationPayloadCount,
            latestApplicationPayloadUptimeNanoseconds: latestApplicationPayloadUptimeNanoseconds,
            connectionGeneration: currentToken?.generation ?? generation
        )
        if TuyaAuthenticatedReadOnlyPreflight.shouldRetireIncompleteObservation(preMutationHorizonSnapshot) {
            throw MutationError.incompleteObservationHorizonReached
        }

'''
          new = '''        let now = try nextMonotonicObservation()
        try requireContinuousAuthenticatedObservation(at: now)
        try requireIncompleteObservationHorizonOpen(at: now)
        guard let authenticatedAt = authenticatedAtUptimeNanoseconds,
              now >= authenticatedAt else {
            throw MutationError.monotonicClockRegressed
        }

'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''    /// Once a real current liveness receipt reaches the package-owned 60-second incomplete-session
    /// horizon, the same canonical preflight decides whether this generation must terminate. The
    /// ledger leaves the exact token current when throwing so the app's existing fail-closed
    /// lifecycle terminal can retire it without inventing a BLE disconnect or a second clock sample.
'''
          new = '''    /// Once a real current liveness receipt reaches the package-owned 60-second incomplete-session
    /// horizon, the same canonical preflight decides whether this generation must terminate. The
    /// package preserves the accepted prefix and atomically retires that exact generation before
    /// throwing; app presentation only mirrors the already-terminal semantic result.
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''        let now = try nextMonotonicObservation()
        try requireContinuousAuthenticatedObservation(at: now)
        latestObservedUptimeNanoseconds = now

        if TuyaAuthenticatedReadOnlyPreflight.shouldRetireIncompleteObservation(makeSnapshot()) {
            throw MutationError.incompleteObservationHorizonReached
        }
'''
          new = '''        let now = try nextMonotonicObservation()
        try requireContinuousAuthenticatedObservation(at: now)
        try requireIncompleteObservationHorizonOpen(at: now)
        latestObservedUptimeNanoseconds = now
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old_reason = '        authenticationState = .failed(reason: "Authenticated session produced no application update before the observation deadline.")\n'
          assert s.count(old_reason) == 1
          s = s.replace(old_reason, '        authenticationState = .failed(reason: Self.incompleteObservationFailureReason)\n', 1)

          continuity = '''    /// Must run before any authenticated mutation can move the accepted observation horizon.
'''
