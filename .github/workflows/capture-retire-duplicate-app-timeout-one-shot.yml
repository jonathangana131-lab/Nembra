name: Capture retire duplicate app-timeout one-shot

on:
  push:
    branches: [capture/one-time-ble-dump-gpt56]
    paths: [.github/workflows/capture-retire-duplicate-app-timeout-one-shot.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Bind exact reviewed parent
        env:
          EXPECTED_PARENT_SHA: 0f8d2c612d6471c6d3ea8ce60eac95beb421ecb4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT_SHA" HEAD)" = ".github/workflows/capture-retire-duplicate-app-timeout-one-shot.yml"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Restore package-owned semantic horizon and app mirror
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ledger = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift')
