name: Capture Signed App Install Custody Materializer

on:
  push:
    branches:
      - repair/v14-capture-signed-app-install-custody-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose installer and canonical field gate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4e659c2ecc24e2422648169bbd56d7af2383a2ce HEAD
          python3 - <<'PY'
          from pathlib import Path

          installer_path = Path('scripts/field/install_one_time_capture.command')
          installer = installer_path.read_text()
          if 'SIGNED_APP_INSTALL_GUARD="$ROOT/scripts/ci/es80_signed_app_install_guard.py"' not in installer:
              verify_anchor = '''# Entitlement/profile readback proves identity values, but it does not prove the app bundle's
          # recursive signature/seal is valid. Fail closed on the exact signed bytes before those values
          # are allowed to participate in field authority or before any device installation is attempted.
          '''
              verify_prefix = '''# Xcode may need to finish device preparation, but that UI side effect must happen
          # before the signed app earns install authority. No external app-opening side effect is
          # permitted after the exact signed install subject is frozen.
          /usr/bin/open -a Xcode "$ROOT/NembraCapture.xcworkspace" >/dev/null 2>&1 || true

          '''
              if installer.count(verify_anchor) != 1:
                  raise SystemExit('installer signed-verification anchor missing')
              installer = installer.replace(verify_anchor, verify_prefix + verify_anchor, 1)

              profile_anchor = '''say "Final signed app and embedded provisioning profile authorize Sign in with Apple for one exact App ID and the selected team"
          unset SIGNED_ENTITLEMENTS_OUTPUT BUILT_SIGNING_IDENTITY BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER BUILT_APP_ID_PREFIX PROFILE_PLIST_XML PROFILE_SIGNING_IDENTITY PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_FIELDS PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER BUILT_PROFILE APP_ID_SUFFIX
          '''
              profile_replacement = '''say "Final signed app and embedded provisioning profile authorize Sign in with Apple for one exact App ID and the selected team"

          SIGNED_APP_INSTALL_GUARD="$ROOT/scripts/ci/es80_signed_app_install_guard.py"
          [[ -f "$SIGNED_APP_INSTALL_GUARD" ]] || die "Signed app install custody helper is missing from the accepted source. Discard this candidate."
          SIGNED_APP_SUBJECT_SHA256="$(/usr/bin/python3 -I "$SIGNED_APP_INSTALL_GUARD" digest --app "$APP")" || \\
              die "Final signed Capture app could not be admitted as one descriptor-bound install subject. Discard this candidate."
          [[ "$SIGNED_APP_SUBJECT_SHA256" =~ ^[0-9a-f]{64}$ ]] || \\
              die "Final signed Capture app install-subject fingerprint is malformed. Discard this candidate."
          say "Final signed Capture app install subject frozen for devicectl custody"

          unset SIGNED_ENTITLEMENTS_OUTPUT BUILT_SIGNING_IDENTITY BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER BUILT_APP_ID_PREFIX PROFILE_PLIST_XML PROFILE_SIGNING_IDENTITY PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_FIELDS PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER BUILT_PROFILE APP_ID_SUFFIX
          '''
              if installer.count(profile_anchor) != 1:
                  raise SystemExit('installer profile-acceptance anchor missing')
              installer = installer.replace(profile_anchor, profile_replacement, 1)

              install_anchor = '''say "Installing SDK-integrated Capture on the intended iPhone"
          open -a Xcode "$ROOT/NembraCapture.xcworkspace" >/dev/null 2>&1 || true
          INSTALL_LOG="$(mktemp "${TMPDIR:-/tmp}/nembra-authenticated-capture-install.XXXXXX")"
          '''
              install_replacement = '''say "Installing SDK-integrated Capture on the intended iPhone"
          INSTALL_LOG="$(mktemp "${TMPDIR:-/tmp}/nembra-authenticated-capture-install.XXXXXX")"
          '''
              if installer.count(install_anchor) != 1:
                  raise SystemExit('installer install-start anchor missing')
              installer = installer.replace(install_anchor, install_replacement, 1)

              loop_anchor = '''INSTALLED=0
          for ATTEMPT in $(seq 1 60); do
              if xcrun devicectl device install app --device "$COREDEVICE_ID" "$APP" >"$INSTALL_LOG" 2>&1; then
                  INSTALLED=1
                  break
              fi
              if [[ "$ATTEMPT" == "1" ]]; then
          '''
              loop_replacement = '''INSTALLED=0
          for ATTEMPT in $(seq 1 60); do
              INSTALL_RESULT=0
              if /usr/bin/python3 -I "$SIGNED_APP_INSTALL_GUARD" guard \\
                  --app "$APP" \\
                  --expected "$SIGNED_APP_SUBJECT_SHA256" \\
                  -- /usr/bin/xcrun devicectl device install app --device "$COREDEVICE_ID" "$APP" >"$INSTALL_LOG" 2>&1
              then
                  INSTALLED=1
                  break
              else
                  INSTALL_RESULT=$?
              fi
              if [[ "$INSTALL_RESULT" == "74" || "$INSTALL_RESULT" == "75" ]]; then
                  die "Signed Capture app install custody failed before or during devicectl consumption. Discard this candidate and rebuild from accepted source."
              fi
              if [[ "$ATTEMPT" == "1" ]]; then
          '''
              if installer.count(loop_anchor) != 1:
                  raise SystemExit('installer devicectl loop anchor missing')
              installer = installer.replace(loop_anchor, loop_replacement, 1)
              installer_path.write_text(installer)

          source_test_path = Path('scripts/ci/tests/test_capture_signed_app_install_custody_source.py')
          source_test = source_test_path.read_text()
          source_test = source_test.replace(
              'xcode_open = \'open -a Xcode "$ROOT/NembraCapture.xcworkspace" >/dev/null 2>&1 || true\'',
              'xcode_open = \'/usr/bin/open -a Xcode "$ROOT/NembraCapture.xcworkspace" >/dev/null 2>&1 || true\'',
          )
          source_test_path.write_text(source_test)

          field_path = Path('.github/workflows/capture-field-build-provenance.yml')
          field = field_path.read_text()
          if 'scripts/ci/es80_signed_app_install_guard.py' not in field:
              path_anchor = '''      - scripts/ci/es80_signed_field_artifact_evidence.py
                - NembraApp/App/NembraCaptureEntrypoint.swift
          '''
              path_replacement = '''      - scripts/ci/es80_signed_field_artifact_evidence.py
                - scripts/ci/es80_signed_app_install_guard.py
                - scripts/ci/tests/test_es80_signed_app_install_guard.py
                - scripts/ci/tests/test_capture_signed_app_install_custody_source.py
                - NembraApp/App/NembraCaptureEntrypoint.swift
          '''
              if field.count(path_anchor) != 1:
                  raise SystemExit('field gate path anchor missing')
              field = field.replace(path_anchor, path_replacement, 1)

              compile_anchor = '''          /usr/bin/python3 -m py_compile scripts/ci/es80_signed_field_artifact_evidence.py
                    /usr/bin/python3 -I scripts/ci/es80_signed_field_artifact_evidence.py --self-test
                    bash -n scripts/field/install_one_time_capture.command
          '''
              compile_replacement = '''          /usr/bin/python3 -m py_compile scripts/ci/es80_signed_field_artifact_evidence.py
                    /usr/bin/python3 -I scripts/ci/es80_signed_field_artifact_evidence.py --self-test
                    /usr/bin/python3 -m py_compile scripts/ci/es80_signed_app_install_guard.py scripts/ci/tests/test_es80_signed_app_install_guard.py scripts/ci/tests/test_capture_signed_app_install_custody_source.py
                    /usr/bin/python3 -I scripts/ci/tests/test_es80_signed_app_install_guard.py
                    /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_custody_source.py
                    bash -n scripts/field/install_one_time_capture.command
          '''
              if field.count(compile_anchor) != 1:
                  raise SystemExit('field gate signed-artifact compile anchor missing')
              field = field.replace(compile_anchor, compile_replacement, 1)
              field_path.write_text(field)

          focused_path = Path('.github/workflows/capture-signed-app-install-custody.yml')
          focused = focused_path.read_text()
          if 'test_capture_signed_app_install_custody_source.py' not in focused:
              focused = focused.replace(
                  '      - scripts/ci/tests/test_es80_signed_app_install_guard.py\n',
                  '      - scripts/ci/tests/test_es80_signed_app_install_guard.py\n      - scripts/ci/tests/test_capture_signed_app_install_custody_source.py\n',
                  1,
              )
              focused = focused.replace(
                  '/usr/bin/python3 -m py_compile scripts/ci/es80_signed_app_install_guard.py scripts/ci/tests/test_es80_signed_app_install_guard.py\n',
                  '/usr/bin/python3 -m py_compile scripts/ci/es80_signed_app_install_guard.py scripts/ci/tests/test_es80_signed_app_install_guard.py scripts/ci/tests/test_capture_signed_app_install_custody_source.py\n',
                  1,
              )
              focused = focused.replace(
                  '/usr/bin/python3 -I scripts/ci/tests/test_es80_signed_app_install_guard.py\n',
                  '/usr/bin/python3 -I scripts/ci/tests/test_es80_signed_app_install_guard.py\n          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_custody_source.py\n',
                  1,
              )
              focused_path.write_text(focused)
          PY

          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -m py_compile scripts/ci/es80_signed_app_install_guard.py scripts/ci/tests/test_es80_signed_app_install_guard.py scripts/ci/tests/test_capture_signed_app_install_custody_source.py
          /usr/bin/python3 -I scripts/ci/tests/test_es80_signed_app_install_guard.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_custody_source.py
          git diff --check

      - name: Publish composed repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Repair already materialized; nothing to publish.'
            exit 0
          fi
          git config user.name 'nembra-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/field/install_one_time_capture.command scripts/ci/tests/test_capture_signed_app_install_custody_source.py .github/workflows/capture-field-build-provenance.yml .github/workflows/capture-signed-app-install-custody.yml
          git commit -m 'fix(capture): bind signed app through install window'
          git push origin HEAD:repair/v14-capture-signed-app-install-custody-sol
