name: Temporary Final-GO self-authority binder

on:
  push:
    branches:
      - control/v14-auth-stationary-final-go-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind GO issuer to its own accepted GitHub subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '556572553ca1a85d7e21754a2ff17016cbfeae7a'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/ci/es80_authenticated_stationary_final_go.py');s=p.read_text()
          seam='VISUAL=WORKFLOWS[-1]; MANIFEST="NembraCaptureStandaloneVisualEvidence.json"\n'
          repl=seam+'AUTH_WORKFLOW_NAME="Capture Authenticated Stationary Final GO"\nAUTH_WORKFLOW_PATH=".github/workflows/capture-authenticated-stationary-final-go.yml"\n'
          if s.count(seam)!=1:raise SystemExit('constant seam changed')
          s=s.replace(seam,repl,1)
          seam='def visual(source:str,run:int,aid:int,archive:Path,get=api):\n'
          control='''def control_plane(authority_repo:Path,pr:int,run_id:int,get=api):\n    root=authority_repo.expanduser().resolve(strict=True); source=canon(git(root,"rev-parse","HEAD"),"GO control-plane HEAD")\n    if git(root,"status","--porcelain=v1","--untracked-files=all"): raise GoError("GO control-plane checkout is not clean")\n    _,p=get(f"/pulls/{pos(pr,'GO control-plane PR')}"); head=p.get("head",{}); base=p.get("base",{}); state=p.get("state"); merged=bool(p.get("merged_at")); draft=p.get("draft")\n    if canon(head.get("sha"),"GO control-plane PR head")!=source or head.get("repo",{}).get("full_name")!=REPO or base.get("ref")!="main" or not ((state=="open" and draft is False) or (state=="closed" and merged)): raise GoError("GO control-plane PR is not exact/promotable")\n    _,run=get(f"/actions/runs/{pos(run_id,'GO control-plane workflow run')}")\n    if run.get("name")!=AUTH_WORKFLOW_NAME or run.get("path")!=AUTH_WORKFLOW_PATH or canon(run.get("head_sha"),"GO control-plane workflow head")!=source or run.get("status")!="completed" or run.get("conclusion")!="success" or run.get("event") not in {"push","pull_request"}: raise GoError("GO control-plane exact authority workflow is not terminal SUCCESS")\n    branch=head.get("ref"); pulls=run.get("pull_requests",[])\n    if run.get("event")=="pull_request":\n        bound=(isinstance(pulls,list) and any(isinstance(x,dict) and x.get("number")==pr for x in pulls)) or (pulls==[] and run.get("head_branch")==branch)\n        if not bound: raise GoError("GO control-plane workflow is not bound to canonical PR")\n    elif run.get("head_branch")!=branch: raise GoError("GO control-plane push workflow is not bound to canonical PR branch")\n    paths=("scripts/ci/es80_authenticated_stationary_final_go.py","scripts/ci/es80_authenticated_stationary_signed_artifact.py","scripts/ci/es80_today_final_go_publication.py",AUTH_WORKFLOW_PATH,"scripts/ci/tests/test_es80_authenticated_stationary_final_go.py")\n    blobs={path:git(root,"rev-parse",f"HEAD:{path}").lower() for path in paths}\n    if any(not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}",value) for value in blobs.values()): raise GoError("GO control-plane Git blob identity invalid")\n    return {"authority":"nembra-authenticated-stationary-go-control-plane-v1","sourceCommitSHA":source,"prNumber":pr,"workflowRunID":run_id,"workflowName":AUTH_WORKFLOW_NAME,"workflowPath":AUTH_WORKFLOW_PATH,"gitBlobs":blobs}\n\n'''+seam
          if s.count(seam)!=1:raise SystemExit('visual seam changed')
          s=s.replace(seam,control,1)
          old='def build(*,candidate_repo:Path,source:str,pr:int,runs:dict[str,int],artifact_id:int,review_id:int,archive:Path,device_file:Path,get=api,run_installer=installer,inspect_signed_artifact=retained_signed_artifact_unimplemented,now=None):\n    source=canon(source,"source"); pr=pos(pr,"PR")\n    ps,ws=public(source,pr,runs,get);'
          new='def build(*,authority_repo:Path,authority_pr:int,authority_run:int,candidate_repo:Path,source:str,pr:int,runs:dict[str,int],artifact_id:int,review_id:int,archive:Path,device_file:Path,get=api,control_authority=control_plane,run_installer=installer,inspect_signed_artifact=retained_signed_artifact_unimplemented,now=None):\n    control=control_authority(authority_repo,authority_pr,authority_run,get)\n    source=canon(source,"source"); pr=pos(pr,"PR")\n    ps,ws=public(source,pr,runs,get);'
          if s.count(old)!=1:raise SystemExit('build seam changed')
          s=s.replace(old,new,1)
          old='return {"schemaVersion":1,"authority":"nembra-authenticated-stationary-final-go-v1","status":"GO","createdAtUTC":stamp,"acceptedSourceCommitSHA":source,'
          new='return {"schemaVersion":1,"authority":"nembra-authenticated-stationary-final-go-v1","status":"GO","createdAtUTC":stamp,"finalGOControlPlane":control,"acceptedSourceCommitSHA":source,'
          if s.count(old)!=1:raise SystemExit('record seam changed')
          s=s.replace(old,new,1)
          old='p=argparse.ArgumentParser(); p.add_argument("--candidate-repo",type=Path,required=True);'
          new='p=argparse.ArgumentParser(); p.add_argument("--authority-repo",type=Path,required=True); p.add_argument("--authority-pr-number",type=int,required=True); p.add_argument("--authority-workflow-run",type=int,required=True); p.add_argument("--candidate-repo",type=Path,required=True);'
          if s.count(old)!=1:raise SystemExit('CLI seam changed')
          s=s.replace(old,new,1)
          old='r=build(candidate_repo=a.candidate_repo,source=a.source_sha,pr=a.pr_number,runs=runs,artifact_id=a.visual_artifact_id,review_id=a.visual_review_id,archive=a.visual_artifact_archive,device_file=a.intended_device_udid_file)'
          new='r=build(authority_repo=a.authority_repo,authority_pr=a.authority_pr_number,authority_run=a.authority_workflow_run,candidate_repo=a.candidate_repo,source=a.source_sha,pr=a.pr_number,runs=runs,artifact_id=a.visual_artifact_id,review_id=a.visual_review_id,archive=a.visual_artifact_archive,device_file=a.intended_device_udid_file)'
          if s.count(old)!=1:raise SystemExit('CLI build seam changed')
          p.write_text(s.replace(old,new,1))

          t=Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go.py');q=t.read_text()
          seam=" def inst(self,repo,s,dev):return {'authority':'accepted-candidate-private-installer-execution-v1'"
          control=" def control(self,repo,pr,run,get):return {'authority':'nembra-authenticated-stationary-go-control-plane-v1','sourceCommitSHA':'e'*40,'prNumber':2638,'workflowRunID':900,'workflowName':go.AUTH_WORKFLOW_NAME,'workflowPath':go.AUTH_WORKFLOW_PATH,'gitBlobs':{}}\n"+seam
          if q.count(seam)!=1:raise SystemExit('test control seam changed')
          q=q.replace(seam,control,1)
          old='a=dict(candidate_repo=self.repo,source=self.s,pr=self.pr,runs=self.ids,artifact_id=self.aid,review_id=self.rid,archive=self.arc,device_file=self.dev,get=self.get,run_installer=self.inst,inspect_signed_artifact=self.signed);'
          new='a=dict(authority_repo=self.repo,authority_pr=2638,authority_run=900,candidate_repo=self.repo,source=self.s,pr=self.pr,runs=self.ids,artifact_id=self.aid,review_id=self.rid,archive=self.arc,device_file=self.dev,get=self.get,control_authority=self.control,run_installer=self.inst,inspect_signed_artifact=self.signed);'
          if q.count(old)!=1:raise SystemExit('test build seam changed')
          q=q.replace(old,new,1)
          old='a=dict(candidate_repo=self.f.repo,source=self.f.s,pr=self.f.pr,runs=self.f.ids,artifact_id=self.f.aid,review_id=self.f.rid,archive=self.f.arc,device_file=self.f.dev,get=self.f.get,run_installer=self.f.inst)'
          new='a=dict(authority_repo=self.f.repo,authority_pr=2638,authority_run=900,candidate_repo=self.f.repo,source=self.f.s,pr=self.f.pr,runs=self.f.ids,artifact_id=self.f.aid,review_id=self.f.rid,archive=self.f.arc,device_file=self.f.dev,get=self.f.get,control_authority=self.f.control,run_installer=self.f.inst)'
          if q.count(old)!=1:raise SystemExit('production interlock test seam changed')
          q=q.replace(old,new,1)
          anchor=' def test_production_default_refuses_go_without_retained_signed_artifact_authority(self):\n'
          addition=' def test_go_control_plane_authority_is_required(self):\n  def bad(repo,pr,run,get):raise go.GoError("unaccepted GO control plane")\n  self.no(lambda:self.f.build(control_authority=bad))\n'+anchor
          if q.count(anchor)!=1:raise SystemExit('test insertion seam changed')
          t.write_text(q.replace(anchor,addition,1))
          PY
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/es80_authenticated_stationary_signed_artifact.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          git diff --check
      - name: Commit binding and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-bind-final-go-control-plane.yml
          git add scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          git diff --cached --check
          git commit -m 'fix(capture): bind Final-GO issuer to accepted control plane'
          git push origin HEAD:control/v14-auth-stationary-final-go-sol
