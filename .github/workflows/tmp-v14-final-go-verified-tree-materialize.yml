name: TMP V14 Final GO Verified Tree

on:
  push:
    branches:
      - repair/v14-final-go-verified-tree-sol-20260811
    paths:
      - scripts/ci/tmp_materialize_final_go_verified_tree.py
      - .github/workflows/tmp-v14-final-go-verified-tree-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-final-go-verified-tree-sol-20260811
          fetch-depth: 0

      - name: Bind exact construction head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize production repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_materialize_final_go_verified_tree.py
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_private_review_final_go.py
          python3 -m py_compile scripts/ci/tests/test_es80_final_go_packed_tree_authority_red_team.py
          git diff --check

      - name: Replay packed-tree attack
        shell: bash
        run: python3 scripts/ci/tests/test_es80_final_go_packed_tree_authority_red_team.py

      - name: Preserve descriptor read custody
        shell: bash
        run: python3 scripts/ci/tests/test_es80_final_go_descriptor_read_custody.py

      - name: Preserve current vnode contract
        shell: bash
        run: python3 scripts/ci/tests/test_es80_final_go_current_vnode_contract.py

      - name: Preserve committed parent execution custody
        shell: bash
        run: python3 scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py

      - name: Preserve complete current Final-GO suite
        shell: bash
        run: python3 scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py

      - name: Publish tested production bytes
        shell: bash
        env:
          BRANCH: repair/v14-final-go-verified-tree-sol-20260811
        run: |
          set -euo pipefail
          git add scripts/ci/es80_authenticated_stationary_private_review_final_go.py
          git diff --cached --check
          git config user.name "Nembra V14 Swarm"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): verify Final-GO accepted tree objects"
          git push origin "HEAD:$BRANCH"
