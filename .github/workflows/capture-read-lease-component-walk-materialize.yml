name: Capture Read Lease Component Walk Materializer

on:
  pull_request:
    paths:
      - .github/workflows/capture-read-lease-component-walk-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-read-lease-component-walk-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 578b389e7974ff8814020d773ee0115531b654be
  MATERIALIZER: .github/workflows/capture-read-lease-component-walk-materialize.yml

jobs:
  materialize:
    name: Materialize anchored component walk
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind one-shot authoring input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = "$MATERIALIZER"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize component-anchored lease and permanent regression
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path

          helper = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py')
          source = helper.read_text(encoding='utf-8')
          old = '''def _open_pinned_path(path: Path, is_directory: bool) -> int:
              flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
              if is_directory:
                  flags |= getattr(os, "O_DIRECTORY", 0)
              try:
                  descriptor = os.open(path, flags)
              except OSError as error:
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease path could not be descriptor-pinned: {path}"
                  ) from error
              try:
                  if _descriptor_signature(descriptor) != _path_signature(path):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease path changed identity while opening: {path}"
                      )
                  mode = os.fstat(descriptor).st_mode
                  if is_directory != stat.S_ISDIR(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease descriptor type disagrees with plan: {path}"
                      )
                  if not is_directory and not stat.S_ISREG(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease file descriptor is not regular: {path}"
                      )
                  return descriptor
              except Exception:
                  os.close(descriptor)
                  raise
          '''.replace('          ', '')
          new = '''def _open_pinned_path(path: Path, is_directory: bool) -> int:
              """Open an absolute lease subject without following any path component.

              O_NOFOLLOW on a full pathname protects only the leaf. Lease authority
              instead starts from one opened filesystem-root directory and advances one
              component at a time with dir_fd/openat semantics. Every intermediate
              component is therefore required to be a real directory at the instant it
              is crossed; later renames cannot redirect an already-open parent FD.
              """
              path = _absolute_lexical(path)
              parts = path.parts
              if len(parts) < 2 or parts[0] != os.sep:
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease path has no admissible absolute component walk: {path}"
                  )
              if os.open not in os.supports_dir_fd:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease component walk requires openat/dir_fd support"
                  )
              nofollow = getattr(os, "O_NOFOLLOW", 0)
              odirectory = getattr(os, "O_DIRECTORY", 0)
              if nofollow == 0 or odirectory == 0:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease component walk requires O_NOFOLLOW and O_DIRECTORY"
                  )

              common = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | nofollow
              current = -1
              try:
                  current = os.open(os.sep, os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | odirectory)
                  for index, component in enumerate(parts[1:]):
                      if component in ("", ".", "..") or os.sep in component:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease path contains an unsafe component: {path}"
                          )
                      final = index == len(parts) - 2
                      flags = common
                      if not final or is_directory:
                          flags |= odirectory
                      try:
                          next_descriptor = os.open(component, flags, dir_fd=current)
                      except OSError as error:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease component could not be pinned without following links: {path}"
                          ) from error
                      os.close(current)
                      current = next_descriptor

                  descriptor = current
                  current = -1
                  mode = os.fstat(descriptor).st_mode
                  if is_directory != stat.S_ISDIR(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease descriptor type disagrees with plan: {path}"
                      )
                  if not is_directory and not stat.S_ISREG(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease file descriptor is not regular: {path}"
                      )
                  # This full-path lookup is only a fail-closed diagnostic after the
                  # anchored descriptor exists. It is never used to choose the object.
                  if _descriptor_signature(descriptor) != _path_signature(path):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease pathname changed during anchored component walk: {path}"
                      )
                  return descriptor
              except Exception:
                  if current >= 0:
                      os.close(current)
                  if 'descriptor' in locals():
                      try:
                          os.close(descriptor)
                      except OSError:
                          pass
                  raise
          '''.replace('          ', '')
          if source.count(old) != 1:
              raise SystemExit(f'expected one exact vulnerable open helper, found {source.count(old)}')
          helper.write_text(source.replace(old, new), encoding='utf-8')

          test = Path('scripts/ci/tests/test_capture_private_read_lease_component_walk.py')
          test.write_text(r'''#!/usr/bin/env python3
          """Portable regression for component-anchored private read-lease admission."""
          from __future__ import annotations

          import importlib.util
          import inspect
          import os
          from pathlib import Path
          import tempfile
          import unittest

          REPO = Path(__file__).resolve().parents[3]
          HELPER = REPO / "scripts/ci/capture_selected_xcode_build_orchestrator.py"

          def load():
              spec = importlib.util.spec_from_file_location("nembra_component_walk", HELPER)
              if spec is None or spec.loader is None:
                  raise RuntimeError("could not load selected-Xcode orchestrator")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          class CapturePrivateReadLeaseComponentWalkTests(unittest.TestCase):
              def test_intermediate_symlink_swap_is_rejected_after_plan(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-walk-") as raw:
                      outer = Path(raw)
                      repo = outer / "repo"
                      legitimate = repo / "LocalSecrets/TuyaSDK/Build"
                      legitimate.mkdir(parents=True)
                      planned = helper._lease_paths((legitimate,), repo)
                      self.assertIn((legitimate, False), planned)

                      sdk = repo / "LocalSecrets/TuyaSDK"
                      original = repo / "LocalSecrets/TuyaSDK.original"
                      sdk.rename(original)
                      attacker = outer / "attacker/TuyaSDK"
                      attacker_build = attacker / "Build"
                      attacker_build.mkdir(parents=True)
                      sdk.symlink_to(attacker, target_is_directory=True)

                      # A normal full-path open follows the raced intermediate link,
                      # demonstrating that the exploit precondition remains real.
                      plain = os.open(legitimate, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
                      try:
                          self.assertEqual(os.fstat(plain).st_ino, attacker_build.stat().st_ino)
                      finally:
                          os.close(plain)

                      with self.assertRaises(helper.SelectedXcodeBuildOrchestratorError):
                          helper._open_pinned_path(legitimate, True)

              def test_real_directory_and_regular_file_still_open(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-walk-control-") as raw:
                      root = Path(raw)
                      directory = root / "a/b/c"
                      directory.mkdir(parents=True)
                      file = directory / "private.fixture"
                      file.write_bytes(b"fixture\n")
                      for path, is_directory in ((directory, True), (file, False)):
                          descriptor = helper._open_pinned_path(path, is_directory)
                          try:
                              self.assertEqual(helper._descriptor_signature(descriptor), helper._path_signature(path))
                          finally:
                              os.close(descriptor)

              def test_source_uses_component_dirfd_walk_not_full_path_open(self) -> None:
                  helper = load()
                  source = inspect.getsource(helper._open_pinned_path)
                  self.assertIn("dir_fd=current", source)
                  self.assertIn("os.supports_dir_fd", source)
                  self.assertIn("O_NOFOLLOW", source)
                  self.assertNotIn("os.open(path,", source)
                  self.assertLess(source.index("dir_fd=current"), source.index("_path_signature(path)"))

          if __name__ == "__main__":
              unittest.main(verbosity=2)
          '''.replace('          ', ''), encoding='utf-8')

          workflow = Path('.github/workflows/capture-private-read-lease-component-walk.yml')
          workflow.write_text(r'''name: Capture Private Read Lease Component Walk

          on:
            pull_request:
              paths:
                - scripts/ci/capture_selected_xcode_build_orchestrator.py
                - scripts/ci/tests/test_capture_private_read_lease_component_walk.py
                - .github/workflows/capture-private-read-lease-component-walk.yml
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: capture-private-read-lease-component-walk-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          env:
            EXACT_PARENT: 578b389e7974ff8814020d773ee0115531b654be

          jobs:
            component-walk:
              name: Prove no-follow component-anchored lease admission
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, macos-15]
              runs-on: ${{ matrix.os }}
              timeout-minutes: 6
              steps:
                - uses: actions/checkout@v6
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0
                    persist-credentials: false

                - name: Bind exact serial hardening delta
                  shell: bash
                  run: |
                    set -euo pipefail
                    expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "$expected_head"
                    test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
                    changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
                    expected="$(printf '%s\n' \
                      .github/workflows/capture-private-read-lease-component-walk.yml \
                      scripts/ci/capture_selected_xcode_build_orchestrator.py \
                      scripts/ci/tests/test_capture_private_read_lease_component_walk.py | LC_ALL=C sort)"
                    test "$changed" = "$expected"
                    git diff --check "$EXACT_PARENT"...HEAD
                    test -z "$(git status --porcelain=v1 --untracked-files=all)"

                - name: Execute component-walk regression
                  shell: bash
                  run: |
                    set -euo pipefail
                    export PYTHONDONTWRITEBYTECODE=1
                    /usr/bin/python3 -B -m py_compile \
                      scripts/ci/capture_selected_xcode_build_orchestrator.py \
                      scripts/ci/tests/test_capture_private_read_lease_component_walk.py
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
                    test -z "$(git status --porcelain=v1 --untracked-files=all)"

                - name: Preserve truth boundary
                  shell: bash
                  run: |
                    set -euo pipefail
                    echo "NEMBRA_COMPONENT_WALK_BOUNDARY productionLeaseChanged=true deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false"
          '''.replace('          ', ''), encoding='utf-8')
          PY

          git diff --check
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py

      - name: Publish clean serial hardening head
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$HEAD_REF"
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            .github/workflows/capture-private-read-lease-component-walk.yml
          git commit -m 'capture: anchor private lease component traversal'
          git rm "$MATERIALIZER"
          git commit -m 'capture: remove component-walk materializer'
          test "$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)" = "$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-component-walk.yml \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py | LC_ALL=C sort)"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$HEAD_REF"
