name: Capture Read Lease Component Walk Materializer

on:
  pull_request:
    paths:
      - .github/workflows/capture-read-lease-component-walk-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-read-lease-component-walk-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 578b389e7974ff8814020d773ee0115531b654be
  ORIGIN_HEAD: 20af8e5ce8bb5234f9395245d1591bdccc646cd2
  MATERIALIZER: .github/workflows/capture-read-lease-component-walk-materialize.yml

jobs:
  materialize:
    name: Materialize anchored component walk
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind clean authoring input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          git merge-base --is-ancestor "$ORIGIN_HEAD" HEAD
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = "$MATERIALIZER"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Recover and execute corrected materialization program
        shell: bash
        run: |
          set -euo pipefail
          git show "$ORIGIN_HEAD:$MATERIALIZER" > "$RUNNER_TEMP/original-materializer.yml"
          ORIGINAL="$RUNNER_TEMP/original-materializer.yml" SCRIPT="$RUNNER_TEMP/materialize.py" /usr/bin/python3 -B -I - <<'PY'
          import os
          from pathlib import Path
          import textwrap

          source = Path(os.environ["ORIGINAL"]).read_text(encoding="utf-8")
          start_marker = "/usr/bin/python3 -B -I - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit("original materializer Python start marker missing")
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit("original materializer Python end marker missing")
          program = textwrap.dedent(source[start:end])
          bug = ".replace('          ', '')"
          count = program.count(bug)
          if count != 4:
              raise SystemExit(f"expected four whitespace-stripping bugs, found {count}")
          program = program.replace(bug, "")
          Path(os.environ["SCRIPT"]).write_text(program, encoding="utf-8")
          PY
          /usr/bin/python3 -B -I "$RUNNER_TEMP/materialize.py"

          git diff --check
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py

      - name: Publish clean serial hardening head
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$HEAD_REF"
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            .github/workflows/capture-private-read-lease-component-walk.yml
          git diff --cached --check
          git commit -m 'capture: anchor private lease component traversal'
          git rm "$MATERIALIZER"
          git commit -m 'capture: remove component-walk materializer'
          actual="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-component-walk.yml \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$HEAD_REF"
