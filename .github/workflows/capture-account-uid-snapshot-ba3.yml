name: Capture Account UID Snapshot BA3
on:
  push:
    branches: [sol/v14-capture-account-uid-snapshot-ba3-sol]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.actor != 'github-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-account-uid-snapshot-ba3-sol
          fetch-depth: 0
      - name: Guard exact product parent
        run: |
          set -euo pipefail
          parent='ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
      - name: Apply and verify admitted UID custody
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_account_uid_snapshot_ba3.py apply
          python3 scripts/ci/materialize_capture_account_uid_snapshot_ba3.py verify
          python3 -m py_compile scripts/ci/materialize_capture_account_uid_snapshot_ba3.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          git diff --check
      - name: Commit clean two-path result
        run: |
          set -euo pipefail
          parent='ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          rm .github/workflows/capture-account-uid-snapshot-ba3.yml
          rm scripts/ci/materialize_capture_account_uid_snapshot_ba3.py
          git add -A
          changed="$(git diff --name-only "$parent" | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m 'fix(capture): bind UID scrub to admitted account lease'
          git push origin HEAD:sol/v14-capture-account-uid-snapshot-ba3-sol
