name: Capture Final Share Regex Lexical Authority QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - NembraApp/Features/Research/ES80CaptureShellView.swift
      - .github/workflows/capture-final-share-conditional-authority.yml
      - .github/workflows/capture-final-share-regex-lexical-authority.yml

permissions:
  contents: read

jobs:
  exact-head-regex-lexical-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          printf 'Expected exact PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Reject regex-literal and boundary ambiguity in final Share authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          class ContractViolation(Exception):
              pass

          signature = "\n    private func prepareFinalShareForAnalysisAndSharing() {"
          next_member = "\n    private func restartExperiment() {"
          retained_anchor = "if finalShareData != nil,"

          def unique_offset(source: str, needle: str, label: str) -> int:
              matches = [match.start() for match in re.finditer(re.escape(needle), source)]
              if len(matches) != 1:
                  raise ContractViolation(
                      f"expected exactly one raw {label} boundary; found {len(matches)}"
                  )
              return matches[0]

          def mask_comments_and_strings(text: str) -> str:
              """Preserve offsets/newlines while hiding Swift comments and string literals."""
              chars = list(text)
              masked = list(text)
              i = 0
              state = "code"
              block_depth = 0
              while i < len(chars):
                  if state == "code":
                      if text.startswith("//", i):
                          masked[i] = masked[i + 1] = " "
                          i += 2
                          state = "line-comment"
                          continue
                      if text.startswith("/*", i):
                          masked[i] = masked[i + 1] = " "
                          i += 2
                          state = "block-comment"
                          block_depth = 1
                          continue
                      if text.startswith('"""', i):
                          masked[i:i + 3] = "   "
                          i += 3
                          state = "multiline-string"
                          continue
                      if chars[i] == '"':
                          masked[i] = " "
                          i += 1
                          state = "string"
                          continue
                      i += 1
                      continue

                  if state == "line-comment":
                      if chars[i] == "\n":
                          state = "code"
                      else:
                          masked[i] = " "
                      i += 1
                      continue

                  if state == "block-comment":
                      if text.startswith("/*", i):
                          masked[i] = masked[i + 1] = " "
                          block_depth += 1
                          i += 2
                          continue
                      if text.startswith("*/", i):
                          masked[i] = masked[i + 1] = " "
                          block_depth -= 1
                          i += 2
                          if block_depth == 0:
                              state = "code"
                          continue
                      if chars[i] != "\n":
                          masked[i] = " "
                      i += 1
                      continue

                  if state == "string":
                      if chars[i] == "\\" and i + 1 < len(chars):
                          masked[i] = masked[i + 1] = " "
                          i += 2
                          continue
                      if chars[i] == '"':
                          masked[i] = " "
                          state = "code"
                      elif chars[i] != "\n":
                          masked[i] = " "
                      i += 1
                      continue

                  if state == "multiline-string":
                      if text.startswith('"""', i):
                          masked[i:i + 3] = "   "
                          i += 3
                          state = "code"
                          continue
                      if chars[i] != "\n":
                          masked[i] = " "
                      i += 1
                      continue

              if state in {"block-comment", "string", "multiline-string"}:
                  raise ContractViolation("unterminated Swift lexical state: " + state)
              return "".join(masked)

          def authority_source(source: str) -> tuple[int, int, str]:
              # Both declaration anchors are deliberately raw-unique. A comment/string/regex that
              # tries to spoof either boundary therefore creates a second occurrence and fails closed
              # before it can truncate the authority region inspected below.
              start = unique_offset(source, signature, "final Share function")
              end = unique_offset(source, next_member, "restartExperiment function")
              if end <= start:
                  raise ContractViolation("restartExperiment must follow final Share authority")
              return start, end, source[start:end]

          def validate_source(source: str) -> tuple[int, int]:
              start, end, function_source = authority_source(source)

              # The companion conditional-authority checker brace-matches this Swift function.
              # Swift regex literals may use either /.../ or extended #/.../# delimiters, and regex
              # payload braces are not structural Swift braces. Until that checker has a complete
              # Swift lexer, keep this small authority-critical function free of code slash tokens.
              # Comments and strings are masked first so documentation/URLs remain harmless. This
              # intentionally also forbids division here; a future legitimate slash-token need must
              # upgrade the checker before broadening this security-sensitive source region.
              function_code = mask_comments_and_strings(function_source)
              if "/" in function_code:
                  raise ContractViolation(
                      "final Share authority must not contain code slash tokens while regex literals can confuse brace matching"
                  )
              if retained_anchor not in function_source:
                  raise ContractViolation("missing retained final Share retry branch")
              return start, end

          source = Path(
              "NembraApp/Features/Research/ES80CaptureShellView.swift"
          ).read_text()

          try:
              start, end = validate_source(source)
          except ContractViolation as error:
              raise SystemExit(str(error)) from error

          closing_brace = source.rfind("\n    }", start, end)
          if closing_brace < 0:
              raise SystemExit("could not locate final Share function closing brace for checker self-test")

          # Strings/comments containing slash bytes are not regex syntax and must remain legal.
          harmless_slashes = (
              source[:closing_brace]
              + "\n        let lexicalSlashDocumentation = \"https://example.invalid/a/b\"\n"
              + "        _ = lexicalSlashDocumentation // / is documentation here\n"
              + source[closing_brace:]
          )
          try:
              validate_source(harmless_slashes)
          except ContractViolation as error:
              raise SystemExit(
                  "checker self-test rejected slash bytes confined to strings/comments"
              ) from error

          for label, literal in (
              ("extended", "#/\\}/#"),
              ("bare", "/\\}/"),
          ):
              regex_only = (
                  source[:closing_brace]
                  + f"\n        let lexicalBraceProbe = {literal}\n"
                  + "        _ = lexicalBraceProbe\n"
                  + source[closing_brace:]
              )
              try:
                  validate_source(regex_only)
              except ContractViolation:
                  pass
              else:
                  raise SystemExit(
                      f"checker self-test accepted a Swift {label} regex literal in final Share authority"
                  )

              regex_bypass = (
                  source[:closing_brace]
                  + f"\n        let lexicalBraceProbe = {literal}\n"
                  + "        _ = lexicalBraceProbe\n"
                  + "#if NEVER_ENABLED_IN_RELEASE\n"
                  + "        let hiddenConditionalProbe = true\n"
                  + "        _ = hiddenConditionalProbe\n"
                  + "#endif\n"
                  + source[closing_brace:]
              )
              try:
                  validate_source(regex_bypass)
              except ContractViolation:
                  pass
              else:
                  raise SystemExit(
                      f"checker self-test accepted a conditional branch hidden after a {label} regex-literal brace"
                  )

          # Red-team the boundary that the previous guard trusted as raw first-match text. A fake
          # restartExperiment declaration line inside a block comment must not truncate inspection
          # before a later bare-regex brace and conditional branch.
          boundary_spoof = (
              source[:closing_brace]
              + "\n        /*\n"
              + "    private func restartExperiment() {\n"
              + "        */\n"
              + "        let lexicalBoundaryProbe = /\\}/\n"
              + "        _ = lexicalBoundaryProbe\n"
              + "#if NEVER_ENABLED_IN_RELEASE\n"
              + "        let hiddenBoundaryConditionalProbe = true\n"
              + "        _ = hiddenBoundaryConditionalProbe\n"
              + "#endif\n"
              + source[closing_brace:]
          )
          try:
              validate_source(boundary_spoof)
          except ContractViolation:
              pass
          else:
              raise SystemExit(
                  "checker self-test accepted a spoofed restartExperiment boundary before a bare-regex conditional bypass"
              )

          print("final Share regex lexical/boundary authority source contract: PASS")
          PY
