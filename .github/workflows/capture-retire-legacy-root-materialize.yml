name: Materialize Capture Legacy Root Retirement

on:
  push:
    branches:
      - sol/v14-capture-retire-legacy-root-20260810

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-retire-legacy-root-20260810
          fetch-depth: 0

      - name: Guard exact product parent
        run: |
          set -euo pipefail
          product_parent='a480923c9263389923e334fdca0c8df59ad1b822'
          git merge-base --is-ancestor "$product_parent" HEAD
          git diff --quiet "$product_parent" HEAD -- NembraApp/Features/Research/TuyaAccountBridge.swift
          git diff --quiet "$product_parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift

      - name: Apply retirement
        run: python3 scripts/ci/materialize_capture_legacy_root_retirement.py apply

      - name: Verify retirement
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_legacy_root_retirement.py verify
          python3 -m py_compile scripts/ci/materialize_capture_legacy_root_retirement.py
          git diff --check

      - name: Publish clean product bytes
        run: |
          set -euo pipefail
          rm .github/workflows/capture-retire-legacy-root-materialize.yml
          rm scripts/ci/materialize_capture_legacy_root_retirement.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(capture): retire legacy card root"
          git push origin HEAD:sol/v14-capture-retire-legacy-root-20260810
