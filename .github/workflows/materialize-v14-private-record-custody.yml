name: Materialize V14 Private Provenance Record Custody

on:
  push:
    branches:
      - sol/v14-capture-private-record-custody-805c

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact provenance donor parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "805cbd56e7cd26e229bfafef071de0b431b37f88"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-v14-private-record-custody.yml"

      - name: Bind record IO to admitted parent and stable inode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          helper = Path('Scripts/capture_tuya_private_input_provenance.py')
          source = helper.read_text(encoding='utf-8')
          if source.count('import tempfile\n') != 1:
              raise SystemExit('tempfile import anchor missing')
          source = source.replace('import tempfile\n', 'import secrets\n', 1)
          start = source.index('def write_record(')
          end = source.index('\ndef verify_record(', start)
          replacement = base64.b64decode('').decode('utf-8')
          source = source[:start] + replacement + source[end + 1:]
          helper.write_text(source, encoding='utf-8')

          tests = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py')
          test_source = tests.read_text(encoding='utf-8')
          new_tests = base64.b64decode('').decode('utf-8')
          anchor = '    def test_record_symlink_is_rejected(self) -> None:\n'
          if test_source.count(anchor) != 1:
              raise SystemExit('record test insertion anchor missing')
          test_source = test_source.replace(anchor, new_tests + anchor, 1)
          tests.write_text(test_source, encoding='utf-8')
          PY

      - name: Validate focused record custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          s = Path('Scripts/capture_tuya_private_input_provenance.py').read_text(encoding='utf-8')
          assert 'def _open_bound_directory' in s
          assert 'src_dir_fd=parent_descriptor' in s
          assert 'dst_dir_fd=parent_descriptor' in s
          assert 'os.fsync(parent_descriptor)' in s
          assert 'private provenance record changed while it was read' in s
          assert 'tempfile.NamedTemporaryFile' not in s
          t = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py').read_text(encoding='utf-8')
          assert 'test_record_read_rejects_same_size_mutation_during_read' in t
          assert 'test_record_write_rejects_parent_path_replacement_during_admission' in t
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'Scripts/capture_tuya_private_input_provenance.py' 'scripts/ci/tests/test_capture_tuya_private_input_provenance.py' | sort)"

      - name: Commit clean provenance checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-v14-private-record-custody.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(capture): bind private provenance record IO"
          git push origin HEAD:sol/v14-capture-private-record-custody-805c
