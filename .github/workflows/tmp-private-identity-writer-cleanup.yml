name: Temporary Private Identity Writer Cleanup

on:
  push:
    branches:
      - repair/v14-private-identity-publication-custody-sol
    paths:
      - .github/workflows/tmp-private-identity-writer-cleanup.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-identity-publication-custody-sol
          fetch-depth: 0
      - name: Bind trigger and patch writer
        shell: bash
        run: |
          set -euo pipefail
          trigger="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Scripts/provision_capture_tuya_identity_writer.py')
          text = path.read_text()
          marker = '\ndef _validate_existing_output(parent_fd: int, name: str) -> None:\n'
          helper = '''
          def _remove_final_if_same_inode_beneath(
              checkout_fd: int,
              relative_path: str,
              expected_dev: int,
              expected_ino: int,
          ) -> None:
              components = _relative_components(relative_path)
              parent_fd = os.dup(checkout_fd)
              try:
                  for component in components[:-1]:
                      next_fd = os.open(component, _directory_flags(), dir_fd=parent_fd)
                      os.close(parent_fd)
                      parent_fd = next_fd
                  try:
                      named = os.stat(components[-1], dir_fd=parent_fd, follow_symlinks=False)
                  except FileNotFoundError:
                      return
                  if (
                      stat.S_ISREG(named.st_mode)
                      and named.st_uid == os.geteuid()
                      and named.st_nlink == 1
                      and named.st_dev == expected_dev
                      and named.st_ino == expected_ino
                  ):
                      os.unlink(components[-1], dir_fd=parent_fd)
                      os.fsync(parent_fd)
              except OSError:
                  return
              finally:
                  os.close(parent_fd)
          '''.replace('\n          ', '\n')
          if 'def _remove_final_if_same_inode_beneath(' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('cleanup helper insertion point is not unique')
              text = text.replace(marker, '\n' + helper + marker, 1)
          old = '''        if (
                      not stat.S_ISREG(final.st_mode)
                      or final.st_uid != os.geteuid()
                      or final.st_nlink != 1
                      or final.st_size != len(payload)
                      or final.st_dev != sealed.st_dev
                      or final.st_ino != sealed.st_ino
                  ):
                      raise ProvisionError("published private identity output is not the sealed staging inode")
          '''.replace('\n          ', '\n')
          new = '''        if (
                      not stat.S_ISREG(final.st_mode)
                      or final.st_uid != os.geteuid()
                      or final.st_nlink != 1
                      or final.st_size != len(payload)
                      or final.st_dev != sealed.st_dev
                      or final.st_ino != sealed.st_ino
                  ):
                      _remove_final_if_same_inode_beneath(
                          checkout_fd,
                          destination_relative,
                          final.st_dev,
                          final.st_ino,
                      )
                      raise ProvisionError("published private identity output is not the sealed staging inode")
          '''.replace('\n          ', '\n')
          if '_remove_final_if_same_inode_beneath(\n                checkout_fd,' not in text:
              if text.count(old) != 1:
                  raise SystemExit('final inode mismatch block is not the expected shape')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          python3 -I Scripts/provision_capture_tuya_identity_writer.py --self-test
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_publication_races.py
          python3 -I scripts/ci/tests/test_capture_private_identity_publication_races.py
          git diff --check
          rm .github/workflows/tmp-private-identity-writer-cleanup.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): clean rejected private identity publication'
          git fetch origin repair/v14-private-identity-publication-custody-sol
          test "$(git rev-parse FETCH_HEAD)" = "$trigger"
          git push origin HEAD:repair/v14-private-identity-publication-custody-sol