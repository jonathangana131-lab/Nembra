name: Capture Final GO manifest lock-race repair

on:
  push:
    branches:
      - repair/v17-capture-final-go-manifest-lock-race-gpt56sol-20260818
    paths:
      - .github/workflows/capture-final-go-manifest-lock-race-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bind exact reviewed parent
        shell: bash
        run: |
          set -euo pipefail
          parent='cf97695d322b7b02eadb853e8da2888eff9776ea'
          test "$(git merge-base HEAD "$parent")" = "$parent"
          test "$(git diff --name-only "$parent"...HEAD)" = '.github/workflows/capture-final-go-manifest-lock-race-repair.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize stale-authority lock repair
        shell: python
        run: |
          from pathlib import Path

          script_path = Path('scripts/ci/es80_authenticated_stationary_private_review_final_go.py')
          script = script_path.read_text(encoding='utf-8')
          old = (
              "    pre_review = generated_manifest_review(\n"
              "        pr, generated_manifest_review_id, source, get, base=base\n"
              "    )\n"
              "    token = _ACTIVE_MANIFEST_REVIEW.set(pre_review)\n"
              "\n"
              "    with _MANIFEST_EXTENSION_LOCK:\n"
              "        original_environment_adapter = _SEMANTIC_MODULE._private_environment_adapter\n"
          )
          new = (
              "    with _MANIFEST_EXTENSION_LOCK:\n"
              "        pre_review = generated_manifest_review(\n"
              "            pr, generated_manifest_review_id, source, get, base=base\n"
              "        )\n"
              "        token = _ACTIVE_MANIFEST_REVIEW.set(pre_review)\n"
              "        original_environment_adapter = _SEMANTIC_MODULE._private_environment_adapter\n"
          )
          if script.count(old) != 1:
              raise SystemExit('Final-GO lock/review seam drifted')
          script = script.replace(old, new, 1)
          script_path.write_text(script, encoding='utf-8')

          test_path = Path('scripts/ci/tests/test_es80_final_go_generated_manifest_review.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = "    def test_semantic_failure_restores_adapter_context_and_candidate_dispatch(self):\n"
          lines = [
              "    def test_review_drift_while_waiting_for_manifest_lock_fails_before_semantic_side_effect(self):",
              "        state = {\"lock_acquired\": False}",
              "        semantic_calls = []",
              "        accepted = review_response()",
              "        dismissed = review_response(state=\"DISMISSED\")",
              "",
              "        class DriftOnAcquire:",
              "            def __enter__(self):",
              "                state[\"lock_acquired\"] = True",
              "                return self",
              "",
              "            def __exit__(self, _exc_type, _exc, _tb):",
              "                return False",
              "",
              "        def get(path):",
              "            self.assertEqual(path, f\"/pulls/{PR}/reviews/{REVIEW_ID}\")",
              "            response = dismissed if state[\"lock_acquired\"] else accepted",
              "            return b\"{}\", copy.deepcopy(response)",
              "",
              "        def semantic_build(**_kwargs):",
              "            semantic_calls.append(\"called\")",
              "            return self.sealed_record()",
              "",
              "        original_lock = module._MANIFEST_EXTENSION_LOCK",
              "        module._MANIFEST_EXTENSION_LOCK = DriftOnAcquire()",
              "        try:",
              "            with self.assertRaises(module.PrivateReviewGoError):",
              "                self.run_build(get, semantic_build)",
              "        finally:",
              "            module._MANIFEST_EXTENSION_LOCK = original_lock",
              "",
              "        self.assertTrue(state[\"lock_acquired\"])",
              "        self.assertEqual(semantic_calls, [])",
              "",
              "",
          ]
          regression = "\n".join(lines)
          if test.count(anchor) != 1:
              raise SystemExit('manifest-review regression insertion seam drifted')
          test = test.replace(anchor, regression + anchor, 1)
          test_path.write_text(test, encoding='utf-8')

      - name: Run exact focused and inherited authority regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_final_go_generated_manifest_review.py
          python3 scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py
          python3 scripts/ci/tests/test_es80_final_go_git_object_chain_custody.py
          python3 scripts/ci/tests/test_es80_final_go_retirement_dispatch_custody.py
          python3 scripts/ci/tests/test_es80_final_go_sealed_candidate_handoff.py
          python3 scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py
          python3 scripts/ci/tests/test_es80_final_go_generated_manifest_review.py
          python3 scripts/ci/tests/test_es80_final_go_manifest_retirement_migration.py
          git diff --check
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_final_go_generated_manifest_review.py | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          branch='repair/v17-capture-final-go-manifest-lock-race-gpt56sol-20260818'
          expected_head="${{ github.sha }}"
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$expected_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_final_go_generated_manifest_review.py
          git rm .github/workflows/capture-final-go-manifest-lock-race-repair.yml
          git diff --cached --check
          git commit -m 'Capture: fence manifest review after composition lock'
          git push origin HEAD:"$branch"
