name: Capture live-account authority self-patch

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
    paths:
      - .github/workflows/capture-live-account-authority-selfpatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture/one-time-ble-dump-gpt56
          fetch-depth: 0
      - name: Apply fail-closed live-account guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          needle = '''                guard let self,
                      self.currentConnectionToken == token,
                      self.secureSessionEstablished,
                      let driver = self.driver else { return }

                let beforeObservation = await self.sessionLedger.currentPreflightSnapshot()
'''
          replacement = '''                guard let self,
                      self.currentConnectionToken == token,
                      self.secureSessionEstablished,
                      let driver = self.driver else { return }

                guard OfficialTuyaFactory.accountLoggedIn else {
                    self.sdkDeviceMembershipVerified = false
                    self.membershipStatus = "Official Tuya SDK account authority disappeared during authenticated observation. Sign back in before retrying."
                    self.sdkLocalBLEOnline = false
                    try? await self.sessionLedger.endConnection(for: token)
                    await self.refreshLedgerSnapshot()
                    self.currentConnectionToken = nil
                    self.fail("Official Tuya account authority disappeared during authenticated observation. The session was retired without issuing disconnect, reset, unbind, DP, or raw GATT commands.", "sdk_account_authority_lost")
                    return
                }

                let beforeObservation = await self.sessionLedger.currentPreflightSnapshot()
'''
          count = source.count(needle)
          if count != 1:
              raise SystemExit(f"Expected exactly one watchdog insertion point; found {count}")
          path.write_text(source.replace(needle, replacement, 1))
          PY
      - name: Remove one-shot helper
        run: rm .github/workflows/capture-live-account-authority-selfpatch.yml
      - name: Commit runtime repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/capture-live-account-authority-selfpatch.yml
          git diff --cached --check
          git commit -m "fix(capture): revoke observation when Tuya account authority disappears"
          git push origin HEAD:capture/one-time-ble-dump-gpt56
