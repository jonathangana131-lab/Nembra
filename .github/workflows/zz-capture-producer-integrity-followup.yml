name: Capture producer integrity follow-up

on:
  push:
    branches:
      - agent/capture-exact-inspection-code-subject-v14

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact branch parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "42ee309cd46d8d1e439764c3cc5a166eaba5932b"

      - name: Harden staging ownership and descriptor execution coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement site, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          producer = Path("scripts/ci/xcode27_signed_field_candidate.sh")
          source_test = Path("scripts/ci/tests/test_xcode27_signed_field_candidate_source.py")

          replace_once(
              producer,
              'FINAL_STAGING_DIR="$ARTIFACTS_PARENT/.nembra-field-candidate-$BUILD_INSTANCE_ID.staging"\n',
              'FINAL_STAGING_DIR="$ARTIFACTS_PARENT/.nembra-field-candidate-$BUILD_INSTANCE_ID.staging"\nFINAL_STAGING_DIR_OWNED=0\n',
          )
          replace_once(
              producer,
              '''  if [[ -n "${FINAL_STAGING_DIR:-}" && -e "$FINAL_STAGING_DIR" ]]; then\n    rm -rf "$FINAL_STAGING_DIR"\n  fi\n''',
              '''  if [[ "${FINAL_STAGING_DIR_OWNED:-0}" == "1" && -n "${FINAL_STAGING_DIR:-}" ]]; then\n    rm -rf -- "$FINAL_STAGING_DIR"\n  fi\n''',
          )
          replace_once(
              producer,
              '''mkdir "$FINAL_STAGING_DIR"\ncp -p "$EXPORT_OPTIONS_SNAPSHOT" "$FINAL_STAGING_DIR/ExportOptions.plist"\n''',
              '''mkdir "$FINAL_STAGING_DIR"\n# Only a successful non-recursive claim transfers cleanup ownership to this producer. If mkdir\n# fails because another process claimed the path, the EXIT trap must leave that foreign tree alone.\nFINAL_STAGING_DIR_OWNED=1\ncp -p "$EXPORT_OPTIONS_SNAPSHOT" "$FINAL_STAGING_DIR/ExportOptions.plist"\n''',
          )
          replace_once(
              producer,
              '''# Ownership moved atomically to ARTIFACTS_DIR; cleanup must never target the published candidate.\nFINAL_STAGING_DIR=""\n''',
              '''# Ownership moved atomically to ARTIFACTS_DIR; cleanup must never target the published candidate.\nFINAL_STAGING_DIR_OWNED=0\nFINAL_STAGING_DIR=""\n''',
          )

          replace_once(
              source_test,
              '''from pathlib import Path\nimport subprocess\nimport sys\nimport unittest\n''',
              '''from pathlib import Path\nimport os\nimport subprocess\nimport sys\nimport tempfile\nimport unittest\n''',
          )
          replace_once(
              source_test,
              '''    def test_reuses_live_canonical_signed_field_evidence_contract(self):\n''',
              '''    def test_bound_descriptor_execution_path_is_real_not_source_only(self):\n        intended = "00008101-001234567890001E"\n        with tempfile.TemporaryDirectory(prefix="nembra-bound-runner-test-") as temporary:\n            root = Path(temporary)\n            private_file = root / "device-id"\n            private_file.write_text(intended, encoding="utf-8")\n            private_file.chmod(0o600)\n\n            runner_fd = os.open(PRIVATE_RUNNER, os.O_RDONLY)\n            try:\n                preflight = subprocess.run(\n                    [\n                        sys.executable,\n                        f"/dev/fd/{runner_fd}",\n                        "--validate-intended-device-udid-file",\n                        str(private_file),\n                    ],\n                    pass_fds=(runner_fd,),\n                    check=False,\n                    capture_output=True,\n                    text=True,\n                )\n            finally:\n                os.close(runner_fd)\n            self.assertEqual(preflight.returncode, 0, preflight.stderr)\n            self.assertIn("private intended-device verification input: PASS", preflight.stdout)\n            self.assertNotIn(intended, preflight.stdout + preflight.stderr)\n\n            fake_inspector = root / "exact-inspector.py"\n            fake_inspector.write_text(\n                "class EvidenceError(RuntimeError):\\n    pass\\n\\ndef main(argv):\\n"\n                f"    assert {intended!r} in argv\\n    return 0\\n",\n                encoding="utf-8",\n            )\n            fake_inspector.chmod(0o400)\n            runner_fd = os.open(PRIVATE_RUNNER, os.O_RDONLY)\n            inspector_fd = os.open(fake_inspector, os.O_RDONLY)\n            try:\n                inspection = subprocess.run(\n                    [\n                        sys.executable,\n                        f"/dev/fd/{runner_fd}",\n                        "--ipa",\n                        str(root / "candidate.ipa"),\n                        "--output-dir",\n                        str(root / "inspection"),\n                        "--expected-source-sha",\n                        "a" * 40,\n                        "--intended-device-udid-file",\n                        str(private_file),\n                        "--canonical-inspector-fd",\n                        str(inspector_fd),\n                    ],\n                    pass_fds=(runner_fd, inspector_fd),\n                    check=False,\n                    capture_output=True,\n                    text=True,\n                )\n            finally:\n                os.close(inspector_fd)\n                os.close(runner_fd)\n            self.assertEqual(inspection.returncode, 0, inspection.stderr)\n            self.assertNotIn(intended, inspection.stdout + inspection.stderr)\n\n    def test_reuses_live_canonical_signed_field_evidence_contract(self):\n''',
          )
          replace_once(
              source_test,
              '''    def test_retains_exact_external_export_policy_and_refuses_output_reuse(self):\n''',
              '''    def test_cleanup_removes_only_a_staging_directory_this_run_claimed(self):\n        self.assertIn('FINAL_STAGING_DIR_OWNED=0', self.source)\n        self.assertIn('"${FINAL_STAGING_DIR_OWNED:-0}" == "1"', self.source)\n        self.assertIn('FINAL_STAGING_DIR_OWNED=1', self.source)\n        self.assertGreater(\n            self.source.index('FINAL_STAGING_DIR_OWNED=1'),\n            self.source.index('mkdir "$FINAL_STAGING_DIR"'),\n        )\n        publication = self.source.index('rename_exclusive(source, destination')\n        release = self.source.rindex('FINAL_STAGING_DIR_OWNED=0')\n        self.assertGreater(release, publication)\n        self.assertIn('rm -rf -- "$FINAL_STAGING_DIR"', self.source)\n\n    def test_retains_exact_external_export_policy_and_refuses_output_reuse(self):\n''',
          )
          PY

      - name: Validate focused producer contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_private_runner.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          git diff --check

      - name: Commit hardening and remove transformer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-capture-producer-integrity-followup.yml
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/xcode27_signed_field_candidate.sh \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_source.py \
                  .github/workflows/zz-capture-producer-integrity-followup.yml
          git diff --cached --check
          git commit -m "fix(capture): own staging cleanup and exercise bound tools"
          git push origin HEAD:agent/capture-exact-inspection-code-subject-v14
