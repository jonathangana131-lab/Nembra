name: Materialize Capture observation-phase callback admission

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/materialize-capture-observation-phase-admission.yml'
      - 'scripts/ci/materialize_capture_observation_phase_admission.py'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationObservationPhaseAdmissionSourceTests.swift'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-capture-observation-phase-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXACT_PARENT: 2635febea2182d7d364a6efebd917ef3972f6d29
      WORKFLOW_PATH: .github/workflows/materialize-capture-observation-phase-admission.yml
      SCRIPT_PATH: scripts/ci/materialize_capture_observation_phase_admission.py
      TEST_PATH: Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationObservationPhaseAdmissionSourceTests.swift
    steps:
      - name: Checkout immutable construction head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact parent and constructor scope
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          printf '%s\n' "$WORKFLOW_PATH" "$SCRIPT_PATH" "$TEST_PATH" | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize observation-phase fence
        run: |
          set -euo pipefail
          python3 -B "$SCRIPT_PATH"
          rm "$WORKFLOW_PATH" "$SCRIPT_PATH"

      - name: Verify final two-path correction
        run: |
          set -euo pipefail
          git diff --check "$EXACT_PARENT"
          git diff --name-only "$EXACT_PARENT" | LC_ALL=C sort > "$RUNNER_TEMP/final-actual"
          printf '%s\n' NembraApp/App/NembraCaptureEntrypoint.swift "$TEST_PATH" | LC_ALL=C sort > "$RUNNER_TEMP/final-expected"
          diff -u "$RUNNER_TEMP/final-expected" "$RUNNER_TEMP/final-actual"
          grep -Fq 'self.phase == .observing,' NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e "$WORKFLOW_PATH"
          test ! -e "$SCRIPT_PATH"

      - name: Commit correction and retire constructor
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'nembra-observation-admission-materializer'
          git config user.email 'nembra-observation-admission-materializer@users.noreply.github.com'
          git add -A
          git commit -m 'capture: admit application delivery only while observing'
          git push origin "HEAD:$BRANCH"
