name: Materialize Capture Membership Correlation Revocation 38c6

on:
  push:
    branches:
      - fix/v14-capture-membership-correlation-revocation-38c6-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-membership-correlation-revocation-38c6-sol
          fetch-depth: 0

      - name: Guard exact lineage and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          base='38c69bcf6660f42468c954a9196f35d3bdff2680'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"...HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/scripts/materialize_capture_membership_correlation_revocation_38c6.py' \
            '.github/workflows/materialize-capture-membership-correlation-revocation-38c6.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureMembershipCorrelationAuthorityRevocationSourceTests.swift' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Apply and verify membership authority repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize_capture_membership_correlation_revocation_38c6.py apply
          python3 .github/scripts/materialize_capture_membership_correlation_revocation_38c6.py verify
          python3 -m py_compile .github/scripts/materialize_capture_membership_correlation_revocation_38c6.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureMembershipCorrelationAuthorityRevocationSourceTests.swift
          git diff --check

      - name: Publish clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-membership-correlation-revocation-38c6.yml
          rm .github/scripts/materialize_capture_membership_correlation_revocation_38c6.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): revoke correlated target on membership loss'
          git push origin HEAD:fix/v14-capture-membership-correlation-revocation-38c6-sol
