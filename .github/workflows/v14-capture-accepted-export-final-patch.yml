name: V14 Capture Accepted Export Final Patch

on:
  push:
    branches:
      - integration/v14-capture-accepted-export-artifact-final-sol

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-accepted-export-artifact-final-sol
          fetch-depth: 0

      - name: Apply guarded current-attempt artifact repair
        shell: python
        run: |
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guard failed: expected one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "    private var sealedAcceptedEventPrefix: [Event]?\n    private var watchdog: Task<Void, Never>?",
              "    private var sealedAcceptedEventPrefix: [Event]?\n    private var sealedAcceptedExport: Export?\n    private var watchdog: Task<Void, Never>?"
          )

          old_accept = "\n".join([
              "                        try await sessionLedger.sealAcceptedObservation(for: token)",
              "                        self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut",
              "                        self.currentConnectionToken = nil",
              "                        await self.refreshLedgerSnapshot()",
              "                        self.phase = .accepted",
              "                        self.message = \"Secure scooter link established. Canonical readiness was sealed before UI acceptance; delayed callbacks cannot mutate the accepted prefix.\"",
              "                        self.log(\"acceptance_sealed\", [",
              "                            \"generation\": String(token.diagnosticGeneration),",
              "                            \"applicationUpdates\": String(self.applicationUpdateCount),",
              "                            \"buildIdentifier\": self.buildIdentity.buildIdentifier,",
              "                            \"sourceCommitSHA\": self.buildIdentity.sourceCommitSHA",
              "                        ])",
          ]) + "\n"
          new_accept = "\n".join([
              "                        try await sessionLedger.sealAcceptedObservation(for: token)",
              "                        guard self.buildIdentity.isAuthoritativeFieldBuild,",
              "                              self.accountIdentityLeaseIsAuthorized else {",
              "                            self.currentConnectionToken = nil",
              "                            self.localBLESettlementToken = nil",
              "                            self.sdkLocalBLEOnline = false",
              "                            self.driver = nil",
              "                            self.phase = .failed",
              "                            self.message = \"Source authority changed while canonical acceptance was sealing. Restart from OFF1; the sealed package chronology is diagnostic only.\"",
              "                            self.log(\"source_authority_changed_during_acceptance_seal\", [",
              "                                \"generation\": String(token.diagnosticGeneration)",
              "                            ])",
              "                            return",
              "                        }",
              "                        self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut",
              "                        self.currentConnectionToken = nil",
              "                        self.sealedAcceptedExport = self.makeExport(",
              "                            exportedAt: Date(),",
              "                            phase: .accepted,",
              "                            events: acceptedEventPrefixAtCut",
              "                        )",
              "                        self.exportData = nil",
              "                        self.phase = .accepted",
              "                        self.message = \"Secure scooter link established. Canonical readiness and the complete accepted artifact were frozen before UI acceptance; delayed callbacks cannot mutate accepted evidence.\"",
              "                        self.log(\"acceptance_sealed\", [",
              "                            \"generation\": String(token.diagnosticGeneration),",
              "                            \"applicationUpdates\": String(self.applicationUpdateCount),",
              "                            \"buildIdentifier\": self.buildIdentity.buildIdentifier,",
              "                            \"sourceCommitSHA\": self.buildIdentity.sourceCommitSHA",
              "                        ])",
              "                        await self.refreshLedgerSnapshot()",
          ]) + "\n"
          replace_once(old_accept, new_accept)

          replace_once(
              "    private func refreshLedgerSnapshot() async {\n        ledgerSnapshot = await sessionLedger.currentPreflightSnapshot()\n    }",
              "    private func invalidatePreparedMutableExport() {\n        guard phase != .accepted else { return }\n        exportData = nil\n    }\n\n    private func refreshLedgerSnapshot() async {\n        ledgerSnapshot = await sessionLedger.currentPreflightSnapshot()\n        invalidatePreparedMutableExport()\n    }"
          )

          start_marker = "    func prepareExport() {\n"
          end_marker = "    private func resetDiscoverySessionOnly() {\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("guard failed: prepare/reset section not found")
          replacement = "\n".join([
              "    private func makeExport(exportedAt: Date, phase: Phase, events: [Event]) -> Export {",
              "        Export(",
              "            schemaVersion: 8,",
              "            purpose: \"Sanitized Tuya authenticated read-only stationary preflight\",",
              "            exportedAt: exportedAt,",
              "            buildIdentifier: buildIdentity.buildIdentifier,",
              "            sourceCommitSHA: buildIdentity.sourceCommitSHA,",
              "            tuyaDeviceID: deviceID,",
              "            tuyaUUID: tuyaUUID,",
              "            productID: productID,",
              "            selectedPeripheralID: selectedID?.uuidString,",
              "            targetCorrelationMethod: targetCorrelationMethod,",
              "            targetCorrelationWindowCount: targetCorrelationWindowCount,",
              "            targetCorrelationOperatorConfirmed: targetCorrelationOperatorConfirmed,",
              "            targetCorrelationProvenance: correlationProvenance,",
              "            phase: phase,",
              "            privateConfigPresent: privateConfig,",
              "            sdkAccountLoggedIn: sdkAccountLoggedIn,",
              "            sdkDeviceMembershipVerified: sdkDeviceMembershipVerified,",
              "            secureSessionEstablished: secureSessionEstablished,",
              "            canonicalObservedAgeSeconds: canonicalObservedAgeSeconds,",
              "            sdkLocalBLEOnline: sdkLocalBLEOnline,",
              "            applicationUpdateCount: applicationUpdateCount,",
              "            connectionGeneration: ledgerSnapshot.connectionGeneration,",
              "            authenticationMethod: ledgerSnapshot.authenticationMethod?.rawValue,",
              "            preflightVerdict: preflightVerdictText,",
              "            applicationValueRepresentation: \"ThingSmartDeviceDelegate dpsUpdate values projected with String(describing:); application-level SDK data, not byte-exact or raw FD50 transport\",",
              "            rawFD50BytesCaptured: false,",
              "            secretsRedacted: true,",
              "            dpQueriesSent: false,",
              "            dpCommandsSent: false,",
              "            candidates: candidates,",
              "            events: events",
              "        )",
              "    }",
              "",
              "    func prepareExport() {",
              "        let envelope: Export",
              "        if phase == .accepted {",
              "            guard let sealedAcceptedExport else {",
              "                exportData = nil",
              "                message = \"Accepted diagnostics cannot be exported because the immutable accepted artifact is unavailable. Restart from OFF1 rather than rebuilding accepted evidence from mutable post-seal state.\"",
              "                return",
              "            }",
              "            envelope = sealedAcceptedExport",
              "        } else {",
              "            envelope = makeExport(",
              "                exportedAt: Date(),",
              "                phase: phase,",
              "                events: events",
              "            )",
              "        }",
              "",
              "        do {",
              "            let encoder = JSONEncoder()",
              "            encoder.outputFormatting = [.prettyPrinted, .sortedKeys, .withoutEscapingSlashes]",
              "            encoder.dateEncodingStrategy = .iso8601",
              "            exportData = try encoder.encode(envelope)",
              "            exportName = \"Nembra-Secure-Link-\\(deviceID.prefix(8))-Diagnostics.json\"",
              "            message = \"Sanitized diagnostics ready with exact compiled build provenance. No account UID, AppKey/AppSecret, password, account token, local_key, session key, raw FD50 claim, DP query, or DP command is exported.\"",
              "        } catch {",
              "            exportData = nil",
              "            message = \"Diagnostic export failed: \\(error.localizedDescription)\"",
              "        }",
              "    }",
              "",
          ]) + "\n"
          text = text[:start] + replacement + text[end:]

          replace_once(
              "    private func resetDiscoverySessionOnly() {\n        acceptanceCutIsClosed = false\n        sealedAcceptedEventPrefix = nil",
              "    private func resetDiscoverySessionOnly() {\n        acceptanceCutIsClosed = false\n        sealedAcceptedEventPrefix = nil\n        sealedAcceptedExport = nil"
          )
          replace_once(
              "    private func log(_ kind: String, _ details: [String: String] = [:]) {\n        events.append(Event(at: Date(), kind: kind, details: details))\n    }",
              "    private func log(_ kind: String, _ details: [String: String] = [:]) {\n        invalidatePreparedMutableExport()\n        events.append(Event(at: Date(), kind: kind, details: details))\n    }"
          )
          path.write_text(text)

      - name: Validate current-attempt artifact authority
        shell: python
        run: |
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          marker = "try await sessionLedger.sealAcceptedObservation(for: token)"
          start = source.index(marker)
          freeze = source.index("self.sealedAcceptedExport = self.makeExport(", start)
          between = source[start + len(marker):freeze]
          if "await " in between:
              raise SystemExit("suspension remains between package seal and full accepted export freeze")
          required = [
              "private var captureAttemptEventStartIndex = 0",
              "Array(self.events.dropFirst(self.captureAttemptEventStartIndex))",
              "private var sealedAcceptedExport: Export?",
              "guard self.buildIdentity.isAuthoritativeFieldBuild,",
              "self.accountIdentityLeaseIsAuthorized",
              "source_authority_changed_during_acceptance_seal",
              "self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut",
              "events: acceptedEventPrefixAtCut",
              "guard let sealedAcceptedExport else",
              "envelope = sealedAcceptedExport",
              "private func invalidatePreparedMutableExport()",
              "sealedAcceptedExport = nil",
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"missing accepted export authority contract: {missing}")

      - name: Commit exact production delta
        run: |
          git diff --check
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m "fix(capture): freeze complete current-attempt export artifact"
          git push origin HEAD:integration/v14-capture-accepted-export-artifact-final-sol
