name: Capture Source Contract Oracle Repair

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Capture: install source-contract oracle repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture/one-time-ble-dump-gpt56
          fetch-depth: 1

      - name: Repair only stale Xcode build-setting source assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/capture-field-build-provenance.yml')
          text = path.read_text()
          replacements = {
              "grep -Fq 'NEMBRA_CAPTURE_BUILD_IDENTIFIER=\"$BUILD_LABEL\"' \"$installer\"":
                  "grep -Fq '\"NEMBRA_CAPTURE_BUILD_IDENTIFIER=$BUILD_LABEL\"' \"$installer\"",
              "grep -Fq 'NEMBRA_CAPTURE_BUILD_COMMIT_SHA=\"$SOURCE_SHA\"' \"$installer\"":
                  "grep -Fq '\"NEMBRA_CAPTURE_BUILD_COMMIT_SHA=$SOURCE_SHA\"' \"$installer\"",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one stale source-contract assertion, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- .github/workflows/capture-field-build-provenance.yml

      - name: Publish exact oracle-only repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = ".github/workflows/capture-field-build-provenance.yml"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/capture-field-build-provenance.yml
          git commit -m 'Capture: align provenance oracle with guarded Xcode argv'
          git push origin HEAD:capture/one-time-ble-dump-gpt56
