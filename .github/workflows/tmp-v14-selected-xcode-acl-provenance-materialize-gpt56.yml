name: TEMP Materialize selected-Xcode ACL + provenance repair

on:
  push:
    branches:
      - repair/v14-selected-xcode-acl-provenance-convergence-sol-gpt56-20260811
    paths:
      - .github/workflows/tmp-v14-selected-xcode-acl-provenance-materialize-gpt56.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-selected-xcode-acl-provenance-convergence-sol-gpt56-20260811
          fetch-depth: 0

      - name: Bind construction input
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize ACL authority and permanent provenance contracts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import re

          installer_path = Path('scripts/field/install_one_time_capture.command')
          installer = installer_path.read_text(encoding='utf-8')
          match = re.search(
              r"validate_root_custodied_path\(\)\s*\{.*?<<'PY_CUSTODY'\n(?P<body>.*?)\nPY_CUSTODY\n\}",
              installer,
              re.DOTALL,
          )
          if match is None:
              raise SystemExit('could not recover production selected-Xcode custody body')
          body = match.group('body')

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor cardinality changed: {count}')
              return source.replace(old, new, 1)

          body = replace_once(
              body,
              "import os\nfrom pathlib import Path\nimport stat\n",
              "import os\nfrom pathlib import Path\nimport re\nimport stat\nimport subprocess\n",
              'custody imports',
          )

          kind = 'if kind not in {"directory", "file"}:\n    raise SystemExit("selected Xcode custody kind is unsupported")\n'
          helper = '''if kind not in {"directory", "file"}:
              raise SystemExit("selected Xcode custody kind is unsupported")

          def require_no_extended_acl(subject: Path) -> None:
              try:
                  probe = subprocess.run(
                      ["/bin/ls", "-lde", os.fspath(subject)],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      env={"PATH": "/usr/bin:/bin", "HOME": "/tmp", "LANG": "C", "LC_ALL": "C"},
                      check=False,
                  )
              except OSError as error:
                  raise SystemExit("selected Xcode custody could not inspect extended ACL authority") from error
              if probe.returncode != 0:
                  raise SystemExit("selected Xcode custody could not inspect extended ACL authority")
              lines = probe.stdout.splitlines()
              if not lines:
                  raise SystemExit("selected Xcode custody could not inspect extended ACL authority")
              mode_field = lines[0].split(maxsplit=1)[0]
              numbered_acl_entry = any(re.match(r"^\s*\d+:", line) for line in lines[1:])
              if mode_field.endswith("+") or numbered_acl_entry:
                  raise SystemExit("selected Xcode custody requires no extended ACL authority")
          '''
          body = replace_once(body, kind, helper, 'custody kind/helper')

          body = replace_once(
              body,
              'if resolved != path:\n    raise SystemExit("selected Xcode custody refuses symlink/alias resolution")\ncurrent = Path(path.anchor)\n',
              'if resolved != path:\n    raise SystemExit("selected Xcode custody refuses symlink/alias resolution")\nrequire_no_extended_acl(Path(path.anchor))\ncurrent = Path(path.anchor)\n',
              'custody root ACL',
          )
          body = replace_once(
              body,
              '    if stat.S_ISLNK(metadata.st_mode):\n        raise SystemExit("selected Xcode custody refuses symlink ancestry or subjects")\n    if leaf and kind == "file":\n',
              '    if stat.S_ISLNK(metadata.st_mode):\n        raise SystemExit("selected Xcode custody refuses symlink ancestry or subjects")\n    require_no_extended_acl(current)\n    if leaf and kind == "file":\n',
              'custody component ACL',
          )
          compile(body, '<selected-xcode-custody>', 'exec')
          installer = installer[:match.start('body')] + body + installer[match.end('body'):]
          installer_path.write_text(installer, encoding='utf-8')

          workflow_path = Path('.github/workflows/capture-field-build-provenance.yml')
          workflow_lines = workflow_path.read_text(encoding='utf-8').splitlines(keepends=True)
          counts = {'discovery': 0, 'install': 0, 'build': 0}
          out = []
          for line in workflow_lines:
              if "grep -Fq 'devicectl list devices --hide-headers'" in line:
                  line = line.replace(
                      "grep -Fq 'devicectl list devices --hide-headers'",
                      "grep -Fq '\"$SELECTED_DEVICECTL\" list devices --hide-headers'",
                      1,
                  )
                  counts['discovery'] += 1
              if "grep -Fq 'devicectl device install app --device \"$COREDEVICE_ID\"'" in line:
                  line = line.replace(
                      "grep -Fq 'devicectl device install app --device \"$COREDEVICE_ID\"'",
                      "grep -Fq '\"$SELECTED_DEVICECTL\" device install app --device \"$COREDEVICE_ID\"'",
                      1,
                  )
                  counts['install'] += 1
              if 'build_line=' in line and '/usr/bin/xcodebuild' in line:
                  line = line.replace('/usr/bin/xcodebuild', '"$SELECTED_XCODEBUILD"', 1)
                  counts['build'] += 1
              out.append(line)
          if counts != {'discovery': 1, 'install': 1, 'build': 1}:
              raise SystemExit(f'stale provenance assertion cardinality changed: {counts}')
          workflow = ''.join(out)
          workflow_path.write_text(workflow, encoding='utf-8')

          installer_now = installer_path.read_text(encoding='utf-8')
          workflow_now = workflow_path.read_text(encoding='utf-8')
          required_installer = (
              'requires no extended ACL authority',
              '"$SELECTED_DEVICECTL" list devices --hide-headers',
              '"$SELECTED_DEVICECTL" device install app --device "$COREDEVICE_ID"',
              '-- "$SELECTED_XCODEBUILD" \\',
          )
          required_workflow = (
              'read_verified_accepted_git_blob "$PRIVATE_DEVICE_RUNNER_RELATIVE" |',
              '"$SELECTED_DEVICECTL" list devices --hide-headers',
              '"$SELECTED_DEVICECTL" device install app --device "$COREDEVICE_ID"',
              '-- "$SELECTED_XCODEBUILD" \\',
          )
          for marker in required_installer:
              if marker not in installer_now:
                  raise SystemExit(f'production installer marker missing: {marker}')
          for marker in required_workflow:
              if marker not in workflow_now:
                  raise SystemExit(f'permanent provenance marker missing: {marker}')
          if "grep -Fq 'devicectl list devices --hide-headers'" in workflow_now:
              raise SystemExit('stale raw devicectl discovery assertion remains')
          if "grep -Fq 'devicectl device install app --device \"$COREDEVICE_ID\"'" in workflow_now:
              raise SystemExit('stale raw devicectl install assertion remains')
          if any('build_line=' in line and '/usr/bin/xcodebuild' in line for line in workflow_now.splitlines()):
              raise SystemExit('stale raw xcodebuild guarded-build assertion remains')
          PY

          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_selected_xcode_tool_acl_custody.py
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' '.github/workflows/capture-field-build-provenance.yml' 'scripts/field/install_one_time_capture.command')"
          git diff --check

      - name: Publish permanent repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-v14-selected-xcode-acl-provenance-materialize-gpt56.yml
          git add .github/workflows/capture-field-build-provenance.yml scripts/field/install_one_time_capture.command
          git diff --cached --check
          git config user.name "nembra-swarm-materializer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Capture: reject selected-Xcode ACL authority"
          git push origin HEAD:repair/v14-selected-xcode-acl-provenance-convergence-sol-gpt56-20260811
