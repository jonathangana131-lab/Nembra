name: ES80 Key Aware Entitlement Transform

on:
  push:
    branches:
      - agent/es80-key-aware-provisioning-entitlements

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/es80-key-aware-provisioning-entitlements
          fetch-depth: 0

      - name: Transform and validate
        shell: bash
        run: |
          python3 scripts/ci/es80_key_aware_entitlement_transform.py
          python3 scripts/ci/es80_signed_field_artifact_evidence.py --self-test
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_evidence.py

      - name: Publish product delta
        shell: bash
        run: |
          rm .github/workflows/es80-key-aware-entitlement-transform.yml
          rm scripts/ci/es80_key_aware_entitlement_transform.py
          git config user.name "nembra-v14-transform"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/es80_signed_field_artifact_evidence.py .github/workflows/es80-key-aware-entitlement-transform.yml scripts/ci/es80_key_aware_entitlement_transform.py
          git commit -m "[Capture truth v14] Make provisioning wildcards entitlement-specific"
          git push origin HEAD:agent/es80-key-aware-provisioning-entitlements
