name: ES80 Preflight Handoff Runtime QA

on:
  push:
    branches:
      - validation/es80-preflight-handoff-aae86-gpt56

permissions:
  contents: read

jobs:
  runtime-proof:
    name: Prove stationary preflight preserves synthetic OFF1 fixture
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate focused handoff
        run: bash scripts/ci/qa_es80_preflight_handoff_validation.sh

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es80-preflight-handoff-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/ES80PreflightHandoff
          if-no-files-found: warn
          retention-days: 30
