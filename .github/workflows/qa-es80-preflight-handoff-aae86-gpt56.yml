name: ES80 Preflight Handoff Runtime QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight-handoff:
    name: Prove stationary preflight preserves synthetic OFF1 fixture
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Prove exact product parent and workflow-only committed delta
        env:
          EXPECTED_PRODUCT_PARENT: aae86cc243a48dd0993db4ca9c00f0a4284bee85
          EXPECTED_WORKFLOW: .github/workflows/qa-es80-preflight-handoff-aae86-gpt56.yml
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          event_head="${{ github.event.pull_request.head.sha }}"
          parent="$(git rev-parse HEAD^)"
          printf 'Validation head: %s\nEvent head: %s\nProduct parent: %s\n' "$actual_head" "$event_head" "$parent"
          test "$actual_head" = "$event_head"
          test "$parent" = "$EXPECTED_PRODUCT_PARENT"
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf 'Committed validation delta:\n%s\n' "$changed"
          test "$changed" = "$EXPECTED_WORKFLOW"

      - name: Inject validation-only UI traversal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraUITests/ES80ResearchCaptureUITests.swift")
          source = path.read_text(encoding="utf-8")
          old = '''        XCTAssertTrue(app.buttons["Charger Disconnected"].waitForExistence(timeout: 3))
        XCTAssertFalse(app.descendants(matching: .any)["es80.capture.field-no-go"].exists)
        XCTAssertFalse(app.buttons["Vehicle controls"].exists)

        let attachment = XCTAttachment(screenshot: app.screenshot())
        attachment.name = "Nembra Capture V14 — SIMULATOR QA — Stationary Preflight"
'''
          new = '''        let disconnected = app.buttons["es80.capture.preflight.charger-disconnected"]
        XCTAssertTrue(disconnected.waitForExistence(timeout: 3))
        disconnected.tap()

        let continueButton = app.buttons["es80.capture.preflight.continue"]
        XCTAssertTrue(continueButton.waitForExistence(timeout: 3))
        XCTAssertTrue(continueButton.isEnabled)
        continueButton.tap()

        XCTAssertTrue(
            app.descendants(matching: .any)["es80.capture-shell"].waitForExistence(timeout: 5),
            "Accepted stationary preflight must enter the real Capture shell."
        )
        XCTAssertTrue(
            app.descendants(matching: .any)["es80.capture.simulator-qa"].waitForExistence(timeout: 3),
            "The exact package-owned synthetic authority must survive the preflight handoff."
        )
        XCTAssertTrue(
            app.staticTexts["OFF 1 / READY"].waitForExistence(timeout: 3),
            "The stationaryPreflight fixture must retain its intended first-powered-off phase after handoff."
        )
        XCTAssertTrue(app.staticTexts["Scooter OFF"].waitForExistence(timeout: 3))
        XCTAssertFalse(app.descendants(matching: .any)["es80.capture.field-no-go"].exists)
        XCTAssertFalse(app.buttons["Vehicle controls"].exists)

        let attachment = XCTAttachment(screenshot: app.screenshot())
        attachment.name = "Nembra Capture V14 — SIMULATOR QA — Preflight Handoff OFF1"
'''
          if source.count(old) != 1:
              raise SystemExit("expected exact stationary-preflight test block once")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Validate project and toolchain
        run: |
          set -euo pipefail
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py
          xcodebuild -version

      - name: Run focused iOS 27 Simulator handoff proof
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/Artifacts/ES80PreflightHandoff
          DERIVED_DATA: ${{ runner.temp }}/NembraES80PreflightHandoffDerivedData
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS_DIR/logs" "$ARTIFACTS_DIR/test-attachments"

          runtime_id="$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          runtimes=json.load(sys.stdin)["runtimes"]
          candidates=[r for r in runtimes if r.get("isAvailable", True) and str(r.get("identifier", "")).startswith("com.apple.CoreSimulator.SimRuntime.iOS-27")]
          if not candidates: raise SystemExit(1)
          candidates.sort(key=lambda r: tuple(int(p) for p in str(r.get("version", "0")).split(".") if p.isdigit()), reverse=True)
          print(candidates[0]["identifier"])
          ')"

          device_type="$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys
          items=json.load(sys.stdin)["devicetypes"]
          preferred=["iPhone 12", "iPhone 17", "iPhone 17 Pro", "iPhone 16"]
          for name in preferred:
              for item in items:
                  if item.get("name") == name:
                      print(item["identifier"]); raise SystemExit(0)
          raise SystemExit(1)
          ')"

          udid="$(xcrun simctl create "Nembra ES80 Handoff $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$device_type" "$runtime_id")"
          cleanup() {
            xcrun simctl spawn "$udid" log show --last 10m --style compact --predicate 'process == "Nembra"' > "$ARTIFACTS_DIR/logs/nembra-system.log" 2>&1 || true
            xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
            xcrun simctl delete "$udid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

          result_bundle="$ARTIFACTS_DIR/PreflightHandoff.xcresult"
          set +e
          set -o pipefail
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$result_bundle" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            -collect-test-diagnostics never \
            -only-testing:NembraUITests/ES80ResearchCaptureUITests/testV14SimulatorQARendersStationaryPreflightWithoutPromotingFieldGo \
            CODE_SIGNING_ALLOWED=NO \
            test | tee "$ARTIFACTS_DIR/logs/xcodebuild-focused-handoff.log"
          status=${PIPESTATUS[0]}
          set -e

          if [[ -d "$result_bundle" ]]; then
            xcrun xcresulttool export attachments \
              --path "$result_bundle" \
              --output-path "$ARTIFACTS_DIR/test-attachments" \
              > "$ARTIFACTS_DIR/logs/xcresult-attachments.log" 2>&1 || true
            find "$ARTIFACTS_DIR/test-attachments" -type f -print | sort > "$ARTIFACTS_DIR/test-attachments.txt" || true
          fi

          exit "$status"

      - name: Upload focused runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es80-preflight-handoff-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/ES80PreflightHandoff
          if-no-files-found: error
          retention-days: 30
