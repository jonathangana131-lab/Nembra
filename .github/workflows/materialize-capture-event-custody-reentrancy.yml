name: Materialize Capture Event Custody Reentry Closure

on:
  push:
    branches:
      - sol/v14-capture-event-custody-reentrancy-ba3a-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-event-custody-reentrancy-ba3a-sol
          fetch-depth: 0

      - name: Guard exact flagship source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "d3075d4fe7bc96ff11079d9f54982ca4c8d90746"

      - name: Apply reentrant event-custody closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          receiver_start = source.index("    private func receivedApplicationUpdate(")
          watchdog_start = source.index("    private func startWatchdog", receiver_start)
          receiver = source[receiver_start:watchdog_start]

          guard_old = (
              "              accountIdentityLeaseIsAuthorized,\n"
              "              let driver else {"
          )
          guard_new = (
              "              accountIdentityLeaseIsAuthorized,\n"
              "              let admittedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),\n"
              "              !admittedAccountUID.isEmpty,\n"
              "              let driver else {"
          )
          if receiver.count(guard_old) != 1:
              raise SystemExit(f"expected one pre-hop account authority guard, found {receiver.count(guard_old)}")
          receiver = receiver.replace(guard_old, guard_new, 1)

          event_old = (
              "            var eventDetails = redactedApplicationEventDetails(update)\n"
              "            eventDetails[\"generation\"] = String(token.diagnosticGeneration)\n"
              "            log(\"tuya_application_update\", eventDetails)"
          )
          event_new = (
              "            guard currentConnectionToken == token,\n"
              "                  phase == .observing,\n"
              "                  sdkAccountLoggedIn,\n"
              "                  sdkDeviceMembershipVerified,\n"
              "                  accountIdentityLeaseIsAuthorized,\n"
              "                  membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines) == admittedAccountUID else {\n"
              "                log(\"application_update_source_authority_changed_before_event_custody\", [\n"
              "                    \"generation\": String(token.diagnosticGeneration)\n"
              "                ])\n"
              "                return\n"
              "            }\n"
              "            guard driver.isLocallyConnected(uuid: tuyaUUID) else {\n"
              "                log(\"application_update_transport_not_current_before_event_custody\", [\n"
              "                    \"generation\": String(token.diagnosticGeneration)\n"
              "                ])\n"
              "                return\n"
              "            }\n"
              "            var eventDetails = redactedApplicationEventDetails(\n"
              "                update,\n"
              "                accountUID: admittedAccountUID\n"
              "            )\n"
              "            eventDetails[\"generation\"] = String(token.diagnosticGeneration)\n"
              "            log(\"tuya_application_update\", eventDetails)"
          )
          if receiver.count(event_old) != 1:
              raise SystemExit(f"expected one current event custody block, found {receiver.count(event_old)}")
          receiver = receiver.replace(event_old, event_new, 1)

          helper_start = receiver.index("    private func redactedApplicationEventDetails(")
          helper = "\n".join([
              "    private func redactedApplicationEventDetails(",
              "        _ update: [String: String],",
              "        accountUID: String",
              "    ) -> [String: String] {",
              "        let exactAccountUID = accountUID.trimmingCharacters(in: .whitespacesAndNewlines)",
              "        guard !exactAccountUID.isEmpty else { return [:] }",
              "",
              "        func redactedText(_ text: String) -> String {",
              "            text.replacingOccurrences(",
              "                of: exactAccountUID,",
              "                with: \"<redacted-account-uid>\",",
              "                options: [.caseInsensitive, .literal]",
              "            )",
              "        }",
              "",
              "        var redacted: [String: String] = [:]",
              "        redacted.reserveCapacity(update.count)",
              "        for key in update.keys.sorted() {",
              "            guard let value = update[key] else { continue }",
              "            let baseKey = redactedText(key)",
              "            var admittedKey = baseKey",
              "            var collisionOrdinal = 2",
              "            while redacted[admittedKey] != nil {",
              "                admittedKey = \"\\(baseKey)#\\(collisionOrdinal)\"",
              "                collisionOrdinal += 1",
              "            }",
              "            redacted[admittedKey] = redactedText(value)",
              "        }",
              "        return redacted",
              "    }",
              "",
              "",
          ])
          receiver = receiver[:helper_start] + helper
          source = source[:receiver_start] + receiver + source[watchdog_start:]
          path.write_text(source)
          PY

      - name: Verify source and regression contracts parse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          receiver = s[s.index("    private func receivedApplicationUpdate("):s.index("    private func startWatchdog")]
          assert receiver.index("let admittedAccountUID = membershipAccountUID?.trimmingCharacters") < receiver.index("try await sessionLedger.recordApplicationUpdate")
          refresh = receiver.index("await refreshLedgerSnapshot()")
          assert receiver.index("guard currentConnectionToken == token", refresh) > refresh
          assert "membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines) == admittedAccountUID" in receiver[refresh:]
          assert "application_update_source_authority_changed_before_event_custody" in receiver[refresh:]
          assert "accountUID: admittedAccountUID" in receiver[refresh:]
          assert "return update" not in receiver
          assert "while redacted[admittedKey] != nil" in receiver
          PY
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyReentrancySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git diff --check

      - name: Publish clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-event-custody-reentrancy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): seal event custody across actor reentry"
          git push origin HEAD:sol/v14-capture-event-custody-reentrancy-ba3a-sol
