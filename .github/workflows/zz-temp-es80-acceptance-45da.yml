name: TEMP ES80 acceptance 45da builder

on:
  push:
    branches:
      - builder/es80-today-acceptance-45da-gpt56

permissions:
  contents: write

jobs:
  build-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: builder/es80-today-acceptance-45da-gpt56
          fetch-depth: 0
      - name: Apply guarded convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/zz_temp_es80_acceptance_45da.py
          git diff --check
          git diff -- NembraApp/App/NembraApp.swift NembraApp/Features/Research/ES80CaptureShellView.swift NembraAppTests/NembraAppTests.swift NembraUITests/ES80ResearchCaptureUITests.swift
      - name: Commit intended tree and retire builder files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/zz_temp_es80_acceptance_45da.py
          rm .github/workflows/zz-temp-es80-acceptance-45da.yml
          git config user.name nembra-v14-go-worker
          git config user.email nembra-v14-go-worker@users.noreply.github.com
          git add -A
          git commit -m "fix(capture): close remaining exact-head acceptance gaps"
          git push origin HEAD:builder/es80-today-acceptance-45da-gpt56
