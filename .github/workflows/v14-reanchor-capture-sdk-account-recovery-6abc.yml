name: Reanchor Capture SDK Account Recovery 6abc

on:
  push:
    branches:
      - fix/v14-capture-sdk-account-recovery-39b-sol

permissions:
  contents: write

jobs:
  reanchor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v14-capture-sdk-account-recovery-39b-sol

      - name: Merge exact current product ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected_product='6abc08900b7257eebc5111a6272a4c4748b06a4c'
          workflow='.github/workflows/v14-reanchor-capture-sdk-account-recovery-6abc.yml'
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git fetch origin 'refs/heads/product/v14-capture-guided-truth-current-sol:refs/remotes/origin/product/v14-capture-guided-truth-current-sol'
          test "$(git rev-parse refs/remotes/origin/product/v14-capture-guided-truth-current-sol)" = "$expected_product"
          git merge --no-edit "$expected_product"
          test -z "$(git diff --name-only --diff-filter=U)"

          grep -Fq 'One guided setup establishes the account and bound-device context Nembra will use before passive target correlation begins.' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'func signOut()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Use a different Tuya account' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'test.membershipStatus' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'private var correlationDisplayedWindowOrdinal: Int' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'failureRecoveryContextPanel' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'func retry()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'static let fieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"' NembraApp/App/NembraCaptureBuildIdentity.swift
          grep -Fq 'logout state change revokes membership and any current attempt authority' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkAccountRecoverySourceTests.swift

          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkAccountRecoverySourceTests.swift
          git diff --check

          git rm "$workflow"
          git commit -m 'chore(capture): remove one-shot account recovery reanchor'
          git push origin HEAD:fix/v14-capture-sdk-account-recovery-39b-sol
