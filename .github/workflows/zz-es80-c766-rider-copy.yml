name: Temporary ES80 c766 rider-copy closure

on:
  push:
    branches:
      - fix/es80-v14-rider-voiceover-current-c766/gpt56-thinking-go

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close remaining primary and VoiceOver jargon
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          source = path.read_text()
          replacements = {
              'eyebrow: "FIELD AUTHORITY",': 'eyebrow: "CAPTURE LOCKED",',
              'eyebrow: "PREFLIGHT / DECLARATION",': 'eyebrow: "PREFLIGHT / SETUP",',
              'message: "Before OFF 1, unplug the scooter charger, keep Nembra foregrounded with the screen unlocked, and keep the stock scooter app closed. Confirm only when those are your declared setup conditions for this Experiment One run.",': 'message: "Before OFF 1, unplug the scooter charger, keep Nembra foregrounded with the screen unlocked, and keep the stock scooter app closed. Confirm only when this is how the scooter and phone are set up for this capture.",',
              'guidanceFootnote("This records your operator declaration; it is not independent proof that the condition held continuously.")': 'guidanceFootnote("Nembra records your confirmation for this run; it cannot independently prove that the charger and stock-app conditions stayed unchanged.")',
              '.accessibilityHint("Nembra is recording this bounded Bluetooth observation window.")': '.accessibilityHint("Nembra is recording this Bluetooth observation window.")',
              '? "Display guidance complete; ready to request window completion"': '? "Display guidance complete; Nembra can now check this window"',
              '.accessibilityHint("The capture system, not this display timer, decides whether the window has enough evidence.")': '.accessibilityHint("Nembra accepts this window only after the required observation time has been recorded.")',
              'eyebrow: "CORRELATION STOPPED",': 'eyebrow: "MATCHING STOPPED",',
              'message: "No Bluetooth signal was absent in both OFF windows and repeated in both ON windows. Nembra will not guess from name, signal strength, service hints, or short IDs.",': 'message: "No Bluetooth signal stayed absent in both OFF windows and returned in both ON windows. Nembra will not guess from a name, signal strength, or service hints.",',
              'message: "More than one Bluetooth signal repeated the OFF / ON pattern. Nembra refuses to break the tie with display name, signal strength, services, or a short identifier.",': 'message: "More than one Bluetooth signal followed the same OFF / ON pattern. Nembra will not guess which one is the scooter from a name, signal strength, or service hints.",',
              'title: "One target repeated twice",': 'title: "One signal matched the pattern",',
              '"Confirm correlated target",': '"Confirm scooter signal",',
              'title: "Reacquiring the exact signal",': 'title: "Checking the same signal again",',
              'eyebrow: "CORRELATED TARGET",': 'eyebrow: "SIGNAL CONFIRMED",',
              'title: "Exact signal reacquired",': 'title: "Same signal found again",',
              'message: "The same Bluetooth signal reappeared in the fresh scan after target confirmation. This remains local correlation evidence, not permanent hardware authentication.",': 'message: "The same Bluetooth signal reappeared after confirmation. This match applies only to this capture and is not permanent scooter identity.",',
              'eyebrow: "PASSIVE CONNECTION",': 'eyebrow: "READ-ONLY CONNECTION",',
              'title: "Opening the correlated target",': 'title: "Opening the confirmed signal",',
              'eyebrow: "PASSIVE DISCOVERY",': 'eyebrow: "READ-ONLY SETUP",',
              'title: "Learning the readable surface",': 'title: "Checking available Bluetooth data",',
              'message: "Nembra is passively discovering what this target exposes. Observation starts only after that discovery is complete.",': 'message: "Nembra is checking the Bluetooth data available from the confirmed signal. Observation starts only after this read-only setup is complete.",',
              '.accessibilityHint("Available only after Nembra accepts the required observation duration.")': '.accessibilityHint("Available only after Nembra records the full required observation time.")',
              'title: "Freezing final evidence",': 'title: "Sealing Capture",',
              'message: "Nembra is sealing the final evidence cutoff, checking capture integrity, and preparing the final capture artifact. Do not leave the app while this finishes.",': 'message: "Nembra is finishing the accepted read-only observations, checking the final Capture, and preparing it for sharing. Keep Nembra open until sealing finishes.",',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match for {old!r}; got {count}")
              source = source.replace(old, new, 1)
          path.write_text(source)

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift")
          test = test_path.read_text()
          marker = '            "healthItem(\\"HORIZON\\""\n'
          addition = '''            "healthItem(\\"HORIZON\\"",
              "FIELD AUTHORITY",
              "PREFLIGHT / DECLARATION",
              "operator declaration",
              "bounded Bluetooth observation window",
              "ready to request window completion",
              "capture system, not this display timer",
              "CORRELATION STOPPED",
              "short IDs",
              "short identifier",
              "Confirm correlated target",
              "local correlation evidence",
              "hardware authentication",
              "PASSIVE CONNECTION",
              "PASSIVE DISCOVERY",
              "Learning the readable surface",
              "final evidence cutoff",
              "final capture artifact"
          '''
          if test.count(marker) != 1:
              raise SystemExit("rider-language insertion marker missing or ambiguous")
          test_path.write_text(test.replace(marker, addition, 1))
          PY
      - name: Validate focused rider contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/Features/Research/ES80CaptureShellView.swift").read_text()
          start = source.index("private var passiveSafetyPanel")
          end = source.index("private var captureDetailsSheet", start)
          rider = source[start:end]
          forbidden = ["FIELD AUTHORITY", "PREFLIGHT / DECLARATION", "operator declaration", "bounded Bluetooth observation window", "ready to request window completion", "capture system, not this display timer", "CORRELATION STOPPED", "short IDs", "short identifier", "Confirm correlated target", "local correlation evidence", "hardware authentication", "PASSIVE CONNECTION", "PASSIVE DISCOVERY", "Learning the readable surface", "final evidence cutoff", "final capture artifact"]
          leaked = [x for x in forbidden if x in rider]
          if leaked:
              raise SystemExit(f"primary/VoiceOver jargon remains: {leaked}")
          required = ["PASSIVE / READ ONLY", "Scooter OFF", "Scooter ON", "Share Capture", "View Details", "guard status.physicalProcedurePermitted else", "PassiveBluetoothExperimentOneFinalShareIntegrity.inspect(artifact.json)", "Truth boundary", "CoreBluetooth"]
          missing = [x for x in required if x not in source]
          if missing:
              raise SystemExit(f"truth/action contract missing: {missing}")
          PY
          git diff --check
      - name: Publish clean checkpoint
        run: |
          rm .github/workflows/zz-es80-c766-rider-copy.yml
          git config user.name "Nembra V14 rider-copy closure"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Capture: finish rider-first primary and VoiceOver language"
          git push origin "HEAD:${GITHUB_REF_NAME}"
