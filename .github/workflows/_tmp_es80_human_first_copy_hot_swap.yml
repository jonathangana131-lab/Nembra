name: Temporary ES80 human-first copy hot-swap

on:
  push:
    branches:
      - product/es80-v14-human-first-capture-current/gpt56-go

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/es80-v14-human-first-capture-current/gpt56-go
          fetch-depth: 0

      - name: Apply exact rider-copy transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          source = path.read_text(encoding="utf-8")
          marker = "    private var captureDetailsSheet: some View {"
          if source.count(marker) != 1:
              raise SystemExit("Capture Details boundary is not unique")
          primary, details = source.split(marker, 1)

          replacements = [
              (
                  "One sealed evidence life",
                  "Passive capture, one continuous run",
              ),
              (
                  "Nembra carries the same package-owned Experiment One authority from repeated Bluetooth correlation into passive capture and immutable Horizon sealing. It performs no application characteristic-value writes and never turns a display name, RSSI, or service hint into target authority.",
                  "Nembra follows one repeated scooter signal through the four OFF / ON checks and into passive capture. It does not send scooter commands, and it will not choose a target from its name, signal strength, or service hints.",
              ),
              (
                  "The package-owned physical execution gate is closed. No OFF / ON window, connection, capture, or seal action can advance through this coordinator.",
                  "This field build is locked. OFF / ON checks, connection, capture, and sealing stay unavailable until the final release is approved.",
              ),
              (
                  "Nembra is waiting for this exact window to report Bluetooth powered-on and active scanning. The producer's evidence clock has not started yet.",
                  "Nembra is opening a fresh Bluetooth scan for this step. Timing begins only after the scan is actually active.",
              ),
              (
                  "The package producer, not this timer, decides whether the window has enough evidence.",
                  "The timer is guidance only; Nembra decides when this step has enough recorded time.",
              ),
              (
                  "This countdown is display guidance only. The package producer accepts the window only from its own monotonic receipt boundary; tapping early cannot create evidence.",
                  "This countdown is guidance only. Nembra accepts the step only after enough recorded time; tapping early cannot create a valid window.",
              ),
              (
                  "No selectable full Bluetooth identifier was absent in both OFF windows and repeated in both ON windows. Nembra will not guess from name, signal strength, service hints, or short IDs.",
                  "No single Bluetooth signal disappeared in both OFF steps and returned in both ON steps. Nembra will not guess from a name, signal strength, service hints, or a short ID.",
              ),
              (
                  "More than one selectable full Bluetooth identifier repeated the OFF / ON pattern. Nembra refuses to break the tie with display name, RSSI, services, or a short identifier.",
                  "More than one Bluetooth signal followed the same OFF / ON pattern. Nembra will not guess between them from a name, signal strength, services, or a short ID.",
              ),
              (
                  "One full CoreBluetooth identifier was selectable in both ON windows and absent from both OFF catalogs under this exact package-owned observation series. Treat it only as a correlated Bluetooth target.",
                  "One Bluetooth signal followed both OFF / ON cycles. Confirm it to continue. This is a repeated-signal match for this run, not proof of the scooter's permanent identity.",
              ),
              (
                  "A fresh post-admission scan is looking for the exact full identifier that passed both OFF / ON cycles. Keep the scooter in the ON state from the final window.",
                  "Nembra is looking again for the exact Bluetooth signal that passed both OFF / ON cycles. Keep the scooter ON from the final step.",
              ),
              (
                  "The same full CoreBluetooth identifier reappeared in the fresh scan epoch created after the sealed admission. This remains local correlation evidence, not permanent hardware authentication.",
                  "The same Bluetooth signal returned in the fresh scan. This confirms the repeatable match for this run; it is not permanent hardware authentication.",
              ),
              (
                  "Nembra is connecting only to the package-owned correlated target. No application characteristic-value writes are permitted by this workflow.",
                  "Nembra is opening a read-only connection to the matched signal. This Capture workflow does not send scooter commands.",
              ),
              (
                  "Nembra is passively discovering services, characteristics, descriptors, reads, and notifications for the exact run-owned target session. Ready is not shown until finite acquisition is mechanically complete.",
                  "Nembra is passively checking the readable Bluetooth data available in this run. Capture continues only after this setup finishes cleanly.",
              ),
              (
                  "Waiting for accepted Horizon authority",
                  "Checking capture readiness",
              ),
              (
                  "Finite acquisition is Ready. Keep Nembra foregrounded and the scooter stationary while the accepted monotonic observation interval matures. The displayed timer is guidance only.",
                  "Keep Nembra foregrounded and the scooter stationary while the required observation time completes. The on-screen timer is guidance only; Seal Capture unlocks only when the recorded run is eligible.",
              ),
              (
                  "Display guidance complete; waiting for accepted Horizon authority",
                  "Display guidance complete; checking capture readiness",
              ),
              (
                  "Unavailable; waiting for accepted Horizon authority",
                  "Unavailable; capture readiness checks are still in progress",
              ),
              (
                  "Available only after the package accepts the required monotonic observation duration.",
                  "Available only after Nembra accepts the required recorded observation time.",
              ),
              (
                  "The package-owned Ready epoch and required monotonic observation duration are both accepted. Finishing now requests one immutable Horizon from this same authority life.",
                  "The required observation is complete and this run is ready to close. Sealing freezes the accepted capture so it can be verified and shared.",
              ),
              (
                  "Nembra is draining the accepted cutoff, committing Horizon, checking final authority, and materializing the immutable JSON artifact. Do not leave the app while this finishes.",
                  "Nembra is closing the accepted recording boundary, verifying the run, and freezing the capture. Keep the app open until this finishes.",
              ),
              (
                  "Evidence failed closed",
                  "Capture stopped safely",
              ),
              (
                  "Nembra is recording the bounded CoreBluetooth advertisement catalog for this exact window. Keep the phone nearby and the app foregrounded; do not open the stock scooter app during this series.",
                  "Nembra is recording the Bluetooth signals visible during this step. Keep the phone nearby and Nembra foregrounded; do not open the stock scooter app during the four-step sequence.",
              ),
              (
                  "The exact \\(report.finalShareByteCount.formatted())-byte final Share artifact passed the package-owned outer, SoftwareExport, and immutable Capture integrity checks. No protocol field meaning is claimed yet.",
                  "The exact \\(report.finalShareByteCount.formatted())-byte Share file passed Nembra's final integrity checks. It is ready for analysis; no Bluetooth protocol field meaning has been claimed yet.",
              ),
              (
                  "\\(artifact.captureJSON.count.formatted()) immutable capture bytes are sealed from this Experiment One authority. Analysis readiness is not earned until the package verifies the exact final Share bytes and their nested evidence.",
                  "\\(artifact.captureJSON.count.formatted()) capture bytes are sealed. Nembra still needs to verify the exact Share file before this run is marked ready for analysis.",
              ),
          ]

          for old, new in replacements:
              count = primary.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one rider-copy source string, found {count}: {old}")
              primary = primary.replace(old, new, 1)

          banned = [
              "One sealed evidence life",
              "package-owned Experiment One authority",
              "package-owned physical execution gate",
              "producer's evidence clock",
              "producer accepts the window only from its own monotonic receipt boundary",
              "full CoreBluetooth identifier",
              "post-admission scan",
              "fresh scan epoch created after the sealed admission",
              "package-owned correlated target",
              "finite acquisition",
              "accepted Horizon authority",
              "accepted monotonic observation interval",
              "package-owned Ready epoch",
              "committing Horizon",
              "immutable JSON artifact",
              "Evidence failed closed",
              "bounded CoreBluetooth advertisement catalog",
              "package-owned outer, SoftwareExport, and immutable Capture integrity checks",
          ]
          leftovers = [phrase for phrase in banned if phrase in primary]
          if leftovers:
              raise SystemExit(f"engineering phrases remain on rider surface: {leftovers}")

          for required in ("PASSIVE / READ ONLY", "Scooter OFF", "Scooter ON", "Share Capture", "View Details"):
              if required not in primary:
                  raise SystemExit(f"required rider-facing contract disappeared: {required}")

          path.write_text(primary + marker + details, encoding="utf-8")
          PY

      - name: Verify truth and Details boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/Features/Research/ES80CaptureShellView.swift").read_text(encoding="utf-8")
          required = [
              "guard status.physicalProcedurePermitted else",
              "declaredStationarySetup = nil",
              "PassiveBluetoothExperimentOneFinalShareIntegrity.inspect(artifact.json)",
              "finalShareIntegrityReport != nil",
              "Truth boundary",
              "CoreBluetooth",
              "Software Export SHA-256",
              "Runtime executable SHA-256",
              "does not authenticate the physical ES80",
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"truth boundary changed unexpectedly: {missing}")
          PY

      - name: Commit product change and self-delete transformer
        shell: bash
        run: |
          rm -f .github/workflows/_tmp_es80_human_first_copy_hot_swap.yml
          git config user.name "nembra-hot-swap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/Features/Research/ES80CaptureShellView.swift .github/workflows/_tmp_es80_human_first_copy_hot_swap.yml
          git diff --cached --check
          git commit -m "Capture UX: make primary field flow human-first"
          git push origin HEAD:product/es80-v14-human-first-capture-current/gpt56-go
