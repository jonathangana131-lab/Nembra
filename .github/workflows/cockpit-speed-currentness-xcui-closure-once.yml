name: Cockpit speed currentness XCUI closure one-shot

on:
  push:
    branches:
      - product/cockpit-energy-rail-mainline-20260820
    paths:
      - .github/workflows/cockpit-speed-currentness-xcui-closure-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: product/cockpit-energy-rail-mainline-20260820
      EXPECTED_PARENT: 97e69447a44aaee4c9b4355aac8afd46e40ea803
      UI_TEST_SOURCE: NembraUITests/NembraUITests.swift
      SELF_WORKFLOW: .github/workflows/cockpit-speed-currentness-xcui-closure-once.yml
    steps:
      - name: Checkout exact bounded authoring head
        uses: actions/checkout@v6
        with:
          ref: product/cockpit-energy-rail-mainline-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Bind one-shot authoring lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          changed="$(git diff --name-only "$EXPECTED_PARENT"...HEAD)"
          test "$changed" = "$SELF_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Align XCUI with unified speed semantics
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraUITests/NembraUITests.swift")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              '''        XCTAssertTrue(\n            app.staticTexts["LAST KNOWN"].waitForExistence(timeout: 2),\n            "Retained speed evidence must carry an explicit last-known visual qualifier."\n        )\n''',
              '''        // The visible currentness row is intentionally accessibility-hidden so VoiceOver\n        // receives one coherent Speed element rather than duplicate unit/currentness chatter.\n        // XCUI therefore consumes `dashboard.speed`; retained screenshots remain the visual proof\n        // that LAST KNOWN is actually drawn.\n''',
              "retained currentness selector",
          )

          replace_once(
              '''        XCTAssertTrue(\n            app.staticTexts["UNAVAILABLE"].waitForExistence(timeout: 2),\n            "Disconnected transport must fail the field-specific speed projection closed."\n        )\n''',
              '''        // `dashboard.speed` above is the accessibility/XCUI authority. The visible\n        // UNAVAILABLE qualifier remains intentionally hidden from accessibility to avoid duplicate\n        // announcements and is accepted from the retained screenshot artifact.\n''',
              "disconnected currentness selector",
          )

          replace_once(
              '''        XCTAssertTrue(\n            app.staticTexts["UNAVAILABLE"].waitForExistence(timeout: 2),\n            "The Cockpit must not manufacture a numeric speed before any accepted source evidence exists."\n        )\n''',
              '''        // Keep the automation on the unified semantic Speed element rather than querying\n        // the intentionally accessibility-hidden UNAVAILABLE visual row. Screenshot review remains\n        // responsible for the visible qualifier while the semantic value proves no numeric speed.\n''',
              "never-observed currentness selector",
          )

          path.write_text(source, encoding="utf-8")

      - name: Enforce bounded accessibility contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "$UI_TEST_SOURCE"
          test "$(grep -Fc 'app.staticTexts["LAST KNOWN"].waitForExistence' "$UI_TEST_SOURCE" || true)" = 0
          test "$(grep -Fc 'app.staticTexts["UNAVAILABLE"].waitForExistence' "$UI_TEST_SOURCE" || true)" = 0
          grep -Fq 'dashboard.speed' "$UI_TEST_SOURCE"
          grep -Fq 'localizedCaseInsensitiveContains("last known")' "$UI_TEST_SOURCE"
          grep -Fq 'localizedCaseInsensitiveContains("unavailable")' "$UI_TEST_SOURCE"

      - name: Publish only if the branch is still this exact head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm -- "$SELF_WORKFLOW"
          git add -- "$UI_TEST_SOURCE"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(cockpit): query unified speed semantics in XCUI'
          final_head="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_COCKPIT_SPEED_XCUI_CLOSURE final=%s trigger=%s physicalTelemetryAuthorityCreated=false\n' "$final_head" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
