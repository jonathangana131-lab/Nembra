name: Materialize Capture Application Secret Value Custody 58fb Sol

on:
  push:
    branches:
      - repair/v14-capture-application-secret-value-custody-58fb-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind repair to exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='58fbbc6221fc3fc3fac3854e028c5fc471e98d90'
          test "$(git merge-base HEAD "$parent")" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-application-secret-value-custody-58fb-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift'

      - name: Materialize value-bound private application secret custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          old_callback = "                sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))\n"
          new_callback = (
              "                let keySanitizedValue = Self.redactApplicationSecrets(value)\n"
              "                sanitized[keyString] = Self.redactExactApplicationSecretValues(\n"
              "                    in: String(describing: keySanitizedValue)\n"
              "                )\n"
          )
          if source.count(old_callback) != 1:
              raise SystemExit(f'expected one unsafe callback rendering shape, found {source.count(old_callback)}')
          source = source.replace(old_callback, new_callback, 1)
          marker = "    private static func redactApplicationSecrets(_ object: Any) -> Any {\n"
          helper = (
              "    private static var exactSecretValues: [String] {\n"
              "#if canImport(NembraTuyaPrivateConfig)\n"
              "        [NembraTuyaPrivateIdentity.appKey, NembraTuyaPrivateIdentity.appSecret]\n"
              "            .map { $0.trimmingCharacters(in: .whitespacesAndNewlines) }\n"
              "            .filter { !$0.isEmpty }\n"
              "#else\n"
              "        []\n"
              "#endif\n"
              "    }\n\n"
              "    private static func redactExactApplicationSecretValues(in rendered: String) -> String {\n"
              "        exactSecretValues.reduce(rendered) { sanitized, secret in\n"
              "            sanitized.replacingOccurrences(of: secret, with: \"<redacted>\")\n"
              "        }\n"
              "    }\n\n"
          )
          if source.count(marker) != 1:
              raise SystemExit(f'expected one recursive sanitizer marker, found {source.count(marker)}')
          if 'redactExactApplicationSecretValues(in rendered:' in source:
              raise SystemExit('exact-value helper already exists; refresh against current product')
          source = source.replace(marker, helper + marker, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          assert 'NembraTuyaPrivateIdentity.appKey' in s
          assert 'NembraTuyaPrivateIdentity.appSecret' in s
          assert 'private static var exactSecretValues: [String]' in s
          assert 'redactExactApplicationSecretValues' in s
          assert 'replacingOccurrences(of: secret, with: "<redacted>")' in s
          assert 'sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))' not in s
          print('Exact private application secret-value custody invariants: PASS')
          PY
          git diff --check
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Run focused and full portable acceptance
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaApplicationSecretValueCustodySourceTests
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Collapse helper to clean product repair
        shell: bash
        run: |
          set -euo pipefail
          parent='58fbbc6221fc3fc3fac3854e028c5fc471e98d90'
          workflow='.github/workflows/materialize-capture-application-secret-value-custody-58fb-sol.yml'
          rm "$workflow"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift
          git add -u "$workflow"
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): bind application secret values before custody'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:repair/v14-capture-application-secret-value-custody-58fb-sol
