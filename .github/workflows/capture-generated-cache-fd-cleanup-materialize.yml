name: Capture Generated Cache FD Cleanup Materializer

on:
  push:
    branches:
      - repair/v17-capture-generated-cache-fd-cleanup-gpt56

permissions:
  contents: write

concurrency:
  group: capture-generated-cache-fd-cleanup-materialize
  cancel-in-progress: false

env:
  EXACT_PARENT: a183b50e14391b1b562966d4a56e558229d3a9a9

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-generated-cache-fd-cleanup-gpt56
          fetch-depth: 0

      - name: Bind exact authoring parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = '.github/workflows/capture-generated-cache-fd-cleanup-materialize.yml'

      - name: Apply fail-path custody repair and permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('scripts/ci/capture_accepted_build_input_snapshot.py')
          text = helper.read_text()
          old = '''            child = _open_directory_at(current, component, relative)\n            if not is_last and directory_cache is not None:\n                held = os.dup(child)\n                directory_cache[relative] = (held, os.fstat(held))\n            os.close(current)\n            current = child\n'''
          new = '''            child = _open_directory_at(current, component, relative)\n            held: int | None = None\n            try:\n                if not is_last and directory_cache is not None:\n                    held = os.dup(child)\n                    admitted = os.fstat(held)\n                    directory_cache[relative] = (held, admitted)\n                    held = None\n            except Exception:\n                if held is not None:\n                    try:\n                        os.close(held)\n                    except OSError:\n                        pass\n                try:\n                    os.close(child)\n                except OSError:\n                    pass\n                raise\n            os.close(current)\n            current = child\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exact current cache-admission seam once')
          helper.write_text(text.replace(old, new, 1))

          test = Path('scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py')
          text = test.read_text()
          if 'import errno\n' not in text:
              text = text.replace('import hashlib\n', 'import errno\nimport hashlib\n', 1)
          if 'import os\n' not in text:
              text = text.replace('import json\n', 'import json\nimport os\n', 1)

          marker = '\n\nif __name__ == "__main__":\n    unittest.main(verbosity=2)\n'
          if text.count(marker) != 1:
              raise SystemExit('expected exact unittest main marker once')
          methods = r'''

    def test_cache_dup_failure_closes_newly_opened_child_descriptor(self) -> None:
        helper = load()
        with tempfile.TemporaryDirectory(prefix="nembra-cache-dup-cleanup-") as raw:
            root = Path(raw)
            (root / "LocalSecrets/TuyaSDK").mkdir(parents=True)
            root_fd = helper._open_repository_root(root)
            real_dup = os.dup
            real_open_directory = helper._open_directory_at
            opened_children: list[int] = []
            dup_calls = 0

            def capture_open(parent_fd: int, name: str, relative: Path) -> int:
                descriptor = real_open_directory(parent_fd, name, relative)
                opened_children.append(descriptor)
                return descriptor

            def fail_cache_dup(descriptor: int) -> int:
                nonlocal dup_calls
                dup_calls += 1
                if dup_calls == 2:
                    raise OSError(errno.EMFILE, "synthetic cache-dup exhaustion")
                return real_dup(descriptor)

            cache: dict[Path, tuple[int, os.stat_result]] = {}
            try:
                with (
                    mock.patch.object(helper, "_open_directory_at", side_effect=capture_open),
                    mock.patch.object(helper.os, "dup", side_effect=fail_cache_dup),
                ):
                    with self.assertRaisesRegex(OSError, "synthetic cache-dup exhaustion"):
                        helper._open_subject(root_fd, Path("LocalSecrets/TuyaSDK"), cache)

                self.assertEqual(dup_calls, 2)
                self.assertEqual(cache, {})
                self.assertEqual(len(opened_children), 1)
                with self.assertRaises(OSError):
                    os.fstat(opened_children[0])
            finally:
                for descriptor in opened_children:
                    try:
                        os.close(descriptor)
                    except OSError:
                        pass
                os.close(root_fd)

    def test_cache_generation_fstat_failure_closes_child_and_duplicate(self) -> None:
        helper = load()
        with tempfile.TemporaryDirectory(prefix="nembra-cache-fstat-cleanup-") as raw:
            root = Path(raw)
            (root / "LocalSecrets/TuyaSDK").mkdir(parents=True)
            root_fd = helper._open_repository_root(root)
            real_dup = os.dup
            real_fstat = os.fstat
            real_open_directory = helper._open_directory_at
            opened_children: list[int] = []
            held_descriptors: list[int] = []
            dup_calls = 0

            def capture_open(parent_fd: int, name: str, relative: Path) -> int:
                descriptor = real_open_directory(parent_fd, name, relative)
                opened_children.append(descriptor)
                return descriptor

            def capture_cache_dup(descriptor: int) -> int:
                nonlocal dup_calls
                dup_calls += 1
                duplicated = real_dup(descriptor)
                if dup_calls == 2:
                    held_descriptors.append(duplicated)
                return duplicated

            def fail_held_fstat(descriptor: int):
                if held_descriptors and descriptor == held_descriptors[0]:
                    raise OSError(errno.EIO, "synthetic cache-generation fstat failure")
                return real_fstat(descriptor)

            cache: dict[Path, tuple[int, os.stat_result]] = {}
            try:
                with (
                    mock.patch.object(helper, "_open_directory_at", side_effect=capture_open),
                    mock.patch.object(helper.os, "dup", side_effect=capture_cache_dup),
                    mock.patch.object(helper.os, "fstat", side_effect=fail_held_fstat),
                ):
                    with self.assertRaisesRegex(OSError, "synthetic cache-generation fstat failure"):
                        helper._open_subject(root_fd, Path("LocalSecrets/TuyaSDK"), cache)

                self.assertEqual(dup_calls, 2)
                self.assertEqual(cache, {})
                self.assertEqual(len(opened_children), 1)
                self.assertEqual(len(held_descriptors), 1)
                with self.assertRaises(OSError):
                    real_fstat(opened_children[0])
                with self.assertRaises(OSError):
                    real_fstat(held_descriptors[0])
            finally:
                for descriptor in (*opened_children, *held_descriptors):
                    try:
                        os.close(descriptor)
                    except OSError:
                        pass
                os.close(root_fd)
'''
          if 'test_cache_dup_failure_closes_newly_opened_child_descriptor' in text:
              raise SystemExit('cleanup regression already present')
          test.write_text(text.replace(marker, methods + marker, 1))
          PY

      - name: Run focused accepted-input regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m py_compile scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check

      - name: Publish two-file product repair
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git commit -m 'fix(capture): close generated-cache FD failure paths'
          git push origin HEAD:repair/v17-capture-generated-cache-fd-cleanup-gpt56
