name: Capture Generated Cache FD Cleanup Materializer

on:
  push:
    branches:
      - repair/v17-capture-generated-cache-fd-cleanup-gpt56

permissions:
  contents: write

env:
  EXACT_PARENT: a183b50e14391b1b562966d4a56e558229d3a9a9
  OLD_B64: 
  NEW_B64: 
  METHODS_B64: 

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-generated-cache-fd-cleanup-gpt56
          fetch-depth: 0

      - name: Bind exact authoring parent
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          test "$(git diff --name-only "$EXACT_PARENT"...HEAD)" = '.github/workflows/capture-generated-cache-fd-cleanup-materialize.yml'

      - name: Apply repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          decode = lambda name: base64.b64decode(os.environ[name]).decode()
          helper = Path('scripts/ci/capture_accepted_build_input_snapshot.py')
          text = helper.read_text()
          old, new = decode('OLD_B64'), decode('NEW_B64')
          if text.count(old) != 1:
              raise SystemExit('exact helper seam mismatch')
          helper.write_text(text.replace(old, new, 1))
          test = Path('scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py')
          text = test.read_text()
          if 'import errno\n' not in text:
              text = text.replace('import hashlib\n', 'import errno\nimport hashlib\n', 1)
          if 'import os\n' not in text:
              text = text.replace('import json\n', 'import json\nimport os\n', 1)
          marker = '\n\nif __name__ == "__main__":\n    unittest.main(verbosity=2)\n'
          if text.count(marker) != 1 or 'test_cache_dup_failure_closes_newly_opened_child_descriptor' in text:
              raise SystemExit('test insertion seam mismatch')
          test.write_text(text.replace(marker, decode('METHODS_B64') + marker, 1))
          PY

      - name: Verify
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m py_compile scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish two-file repair
        run: |
          set -euo pipefail
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git commit -m 'fix(capture): close generated-cache FD failure paths'
          git push origin HEAD:repair/v17-capture-generated-cache-fd-cleanup-gpt56
