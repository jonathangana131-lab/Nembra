name: Agent ES80 abort recovery atomic publish

on:
  push:
    branches:
      - review/es80-v14-abort-recovery-atomic-publish/chatgpt56-thinking-go

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/es80-v14-abort-recovery-atomic-publish/chatgpt56-thinking-go
          fetch-depth: 0
      - name: Apply reviewed failure-atomic repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patches/apply_abort_recovery_atomic.py
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -F 'var reopenedGate = observationBoundaryQueueGate' "$controller"
          grep -F 'try reopenedGate.reopenAfterAbortedFreshTargetSession(' "$controller"
          grep -F 'observationBoundaryQueueGate = reopenedGate' "$controller"
          ! grep -F 'try observationBoundaryQueueGate.reopenAfterAbortedFreshTargetSession(' "$controller"
          git diff --check
      - name: Remove temporary machinery and checkpoint product repair
        shell: bash
        run: |
          rm .github/workflows/tmp-abort-recovery-atomic-publish.yml
          rm .github/patches/apply_abort_recovery_atomic.py
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerAbortRecoveryAtomicityTests.swift \
            .github/workflows/tmp-abort-recovery-atomic-publish.yml \
            .github/patches/apply_abort_recovery_atomic.py
          git commit -m 'fix(capture): publish abort recovery failure-atomically'
          git push origin HEAD:review/es80-v14-abort-recovery-atomic-publish/chatgpt56-thinking-go
