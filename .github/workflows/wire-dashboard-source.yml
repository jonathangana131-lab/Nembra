name: Wire Dashboard Source

on:
  push:
    branches:
      - feature/landscape-dashboard
    paths:
      - .github/workflows/wire-dashboard-source.yml

permissions:
  contents: write

jobs:
  wire-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/landscape-dashboard
          fetch-depth: 0

      - name: Apply validated project wiring
        run: |
          git apply --check scripts/ci/dashboard-project.patch
          git apply scripts/ci/dashboard-project.patch
          rm scripts/ci/dashboard-project.patch
          rm .github/workflows/wire-dashboard-source.yml
          git diff --check

      - name: Commit Dashboard project wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: wire DashboardView into Xcode project"
          git push origin HEAD:feature/landscape-dashboard
