name: Agent ES80 final-share analysis UI patch

on:
  push:
    branches:
      - capture-v14-analysis-ready-integrity-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture-v14-analysis-ready-integrity-ui
          fetch-depth: 0

      - name: Apply exact source transformation
        run: python3 .github/scripts/agent_es80_analysis_ready_patch.py

      - name: Verify focused transformation
        shell: bash
        run: |
          grep -F 'finalizedShareArtifactForCurrentApplication(setup: setup)' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'PassiveBluetoothExperimentOneFinalShareArtifactIntegrity.inspect(data)' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'finalShareIntegrityReport == nil ? "Capture sealed" : "Ready for analysis"' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'capture sealed; analysis readiness not established' NembraApp/Features/Research/ES80CaptureShellView.swift
          ! grep -F 'encodedFinalizedSoftwareExportForCurrentApplication' NembraApp/Features/Research/ES80CaptureShellView.swift
          ! grep -F 'softwareExportData' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'finalShareIntegrityReportsExactOuterAndNestedCaptureFacts' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneFinalShareArtifactTests.swift
          grep -F 'testCaptureShellContinuesSameAuthorityThroughSealAndFinalShareIntegrity' NembraAppTests/NembraAppTests.swift
          git diff --check

      - name: Remove temporary transformation machinery and checkpoint product change
        shell: bash
        run: |
          rm .github/workflows/agent-es80-analysis-ready-ui-patch.yml
          rm .github/scripts/agent_es80_analysis_ready_patch.py
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/Features/Research/ES80CaptureShellView.swift NembraAppTests/NembraAppTests.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneFinalShareArtifactTests.swift .github/workflows/agent-es80-analysis-ready-ui-patch.yml .github/scripts/agent_es80_analysis_ready_patch.py
          git commit -m 'feat(capture): gate analysis-ready on exact final-share integrity'
          git push origin HEAD:capture-v14-analysis-ready-integrity-ui
