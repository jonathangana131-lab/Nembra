name: Temporary ES80 rider terminology polish

on:
  push:
    branches:
      - product/es80-v14-rider-terminology-polish/gpt56-go

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/es80-v14-rider-terminology-polish/gpt56-go
          fetch-depth: 0

      - name: Remove remaining engineering vocabulary from primary Capture states
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          source = path.read_text(encoding="utf-8")
          start_marker = "    private var passiveSafetyPanel"
          details_marker = "    private var captureDetailsSheet"
          start = source.index(start_marker)
          end = source.index(details_marker, start)
          prefix, rider, details = source[:start], source[start:end], source[end:]

          replacements = [
              (
                  "It never sends application characteristic-value writes, and names, signal strength, or service hints never decide which signal belongs to this run.",
                  "It never sends scooter commands, and names, signal strength, or service hints never decide which signal belongs to this run.",
              ),
              ('eyebrow: "FIELD AUTHORITY"', 'eyebrow: "CAPTURE LOCK"'),
              (
                  '.accessibilityHint("The package producer, not this timer, decides whether the window has enough evidence.")',
                  '.accessibilityHint("The timer is guidance only; Nembra records this step only after enough evidence has been collected.")',
              ),
              (
                  'message: "No selectable full Bluetooth identifier was absent in both OFF windows and repeated in both ON windows. Nembra will not guess from name, signal strength, service hints, or short IDs."',
                  'message: "No single Bluetooth signal disappeared in both OFF steps and returned in both ON steps. Nembra will not guess from a name, signal strength, service hints, or a short ID."',
              ),
              (
                  'message: "More than one selectable full Bluetooth identifier repeated the OFF / ON pattern. Nembra refuses to break the tie with display name, RSSI, services, or a short identifier."',
                  'message: "More than one Bluetooth signal followed the same OFF / ON pattern. Nembra will not guess between them from a name, signal strength, services, or a short ID."',
              ),
              ('eyebrow: "CORRELATED TARGET"', 'eyebrow: "SIGNAL MATCHED"'),
              ('title: "Exact signal reacquired"', 'title: "Same signal found again"'),
              ('eyebrow: "PASSIVE CONNECTION"', 'eyebrow: "READ-ONLY CONNECTION"'),
              ('title: "Opening the correlated target"', 'title: "Opening the matched signal"'),
              (
                  'message: "Nembra is connecting only to the signal confirmed by the OFF / ON sequence. This workflow remains read only and does not send application characteristic-value writes."',
                  'message: "Nembra is connecting only to the signal confirmed by the OFF / ON sequence. This Capture stays read only and does not send scooter commands."',
              ),
              ('eyebrow: "PASSIVE ACQUISITION"', 'eyebrow: "READ-ONLY SETUP"'),
              (
                  'message: "Nembra is reading the available Bluetooth surface without sending control writes. Ready appears only after this read-only setup is complete."',
                  'message: "Nembra is checking the readable Bluetooth data available in this run without sending scooter commands. Ready appears only after this setup finishes cleanly."',
              ),
              (
                  '.accessibilityHint("Available only after the package accepts the required monotonic observation duration.")',
                  '.accessibilityHint("Available only after Nembra has recorded the required observation time.")',
              ),
              ('eyebrow: "HORIZON READY"', 'eyebrow: "READY TO SEAL"'),
              ('healthItem("TARGET", value: connection == .connected ? "BOUND" : "WAIT")', 'healthItem("SIGNAL", value: connection == .connected ? "MATCHED" : "WAIT")'),
              ('healthItem("FINITE", value: observationReady ? "READY" : "WAIT")', 'healthItem("SETUP", value: observationReady ? "READY" : "WAIT")'),
              ('healthItem("HORIZON", value: horizonReady ? "READY" : "HOLD")', 'healthItem("OBSERVE", value: horizonReady ? "READY" : "HOLD")'),
          ]

          for old, new in replacements:
              count = rider.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source occurrence, found {count}: {old}")
              rider = rider.replace(old, new, 1)

          combined = prefix + rider + details
          forbidden = [
              "The package producer, not this timer",
              "package accepts the required monotonic observation duration",
              "selectable full Bluetooth identifier",
              "application characteristic-value writes",
              "FIELD AUTHORITY",
              "PASSIVE ACQUISITION",
              "HORIZON READY",
              'healthItem("FINITE"',
              'healthItem("HORIZON"',
          ]
          leftovers = [phrase for phrase in forbidden if phrase in rider]
          if leftovers:
              raise SystemExit(f"engineering phrases remain in primary Capture surface: {leftovers}")

          for required in [
              "PASSIVE / READ ONLY",
              "Scooter OFF",
              "Scooter ON",
              "CAPTURE LOCK",
              "SIGNAL MATCHED",
              "READ-ONLY CONNECTION",
              "READ-ONLY SETUP",
              "READY TO SEAL",
              'healthItem("SIGNAL"',
              'healthItem("SETUP"',
              'healthItem("OBSERVE"',
              "Share Capture",
              "View Details",
              "guard status.physicalProcedurePermitted else",
              "declaredStationarySetup = nil",
              "PassiveBluetoothExperimentOneFinalShareIntegrity.inspect(artifact.json)",
              "finalShareIntegrityReport != nil",
          ]:
              if required not in combined:
                  raise SystemExit(f"required truth/product contract disappeared: {required}")

          for required in [
              "Truth boundary",
              "CoreBluetooth",
              "Software Export SHA-256",
              "Runtime executable SHA-256",
              "does not authenticate the physical ES80",
          ]:
              if required not in details:
                  raise SystemExit(f"engineering Details truth disappeared: {required}")

          path.write_text(combined, encoding="utf-8")
          PY

      - name: Verify effective source shape
        shell: bash
        run: |
          git diff --check
          git diff -- NembraApp/Features/Research/ES80CaptureShellView.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift

      - name: Commit product polish and self-delete transformer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_es80_rider_terminology_polish.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift
          git diff --cached --check
          git commit -m "Capture UX: remove remaining primary engineering jargon"
          git push origin HEAD:product/es80-v14-rider-terminology-polish/gpt56-go
