name: "Temporary ES80 progress helper type correction"

on:
  push:
    branches:
      - "product/es80-v14-progress-review-hot-swap/gpt56-thinking-go"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply guarded type correction
        shell: bash
        env:
          EXPECTED_PARENT: "d1946c7a6558a2bc6186da214029fd48af56ad95"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 scripts/ci/tmp_es80_v14_progress_helper_type_fix_gpt56.py
          git diff --check
          git config user.name "gpt56-thinking-go"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-v14-progress-helper-type-fix-gpt56.yml
          git rm scripts/ci/tmp_es80_v14_progress_helper_type_fix_gpt56.py
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git commit -m "fix(capture): align progress helper window type"
          git push origin HEAD:"${GITHUB_REF_NAME}"
