name: Recover Capture trusted event generation 1c40
on:
  push:
    branches: [repair/v14-capture-trusted-event-generation-1c40-sol]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8
      - name: Bind exact parent and repair
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=1c40853f6991b4d09206df1d25ecff021458b7eb
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          WORKFLOW=.github/workflows/recover-capture-trusted-event-generation-1c40-sol.yml
          actual="$(git diff --name-only "$PRODUCT" HEAD | sort)"
          expected="$(printf '%s\n%s\n' "$TEST" "$WORKFLOW" | sort)"
          test "$actual" = "$expected"
          python3 <<'PY'
          from pathlib import Path
          p=Path('NembraApp/App/NembraCaptureEntrypoint.swift'); s=p.read_text()
          a=s.index('    private func receivedApplicationUpdate('); b=s.index('    private func startWatchdog',a)
          r=s[a:b]; old=') { current, _ in current })'; new=') { _, trusted in trusted })'
          if r.count(old)!=1: raise SystemExit(f'expected one collision seam, found {r.count(old)}')
          r=r.replace(old,new,1); p.write_text(s[:a]+r+s[b:])
          if old in r or new not in r or '"generation": String(token.diagnosticGeneration)' not in r: raise SystemExit('trusted metadata precedence not established')
          for x in ('publishDps','queryDps','writeValue','disconnectBLE'):
              if x in r: raise SystemExit(f'forbidden authority: {x}')
          PY
          swiftc -parse "$TEST"
          git diff --check
      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=1c40853f6991b4d09206df1d25ecff021458b7eb
          APP=NembraApp/App/NembraCaptureEntrypoint.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          WORKFLOW=.github/workflows/recover-capture-trusted-event-generation-1c40-sol.yml
          rm "$WORKFLOW"
          actual="$(git diff --name-only "$PRODUCT" | sort)"
          expected="$(printf '%s\n%s\n' "$APP" "$TEST" | sort)"
          test "$actual" = "$expected"
          git diff --check
          git add "$APP" "$WORKFLOW"
          git config user.name nembra-recovery-bot
          git config user.email actions@users.noreply.github.com
          git commit -m 'fix(capture): protect trusted event generation provenance'
          git push origin "HEAD:${GITHUB_REF_NAME}"
