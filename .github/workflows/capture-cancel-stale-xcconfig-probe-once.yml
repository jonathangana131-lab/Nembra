name: Capture Cancel Exact Stale Xcode Run Once

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/capture-cancel-stale-xcconfig-probe-once.yml

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  cancel-exact-stale-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_API: https://api.github.com
      REPOSITORY: jonathangana131-lab/Nembra
      STALE_PR: "198"
      STALE_RUN: "31164679035"
      STALE_SHA: 3bf0e6c647a8424412181dc1cde95be3aeac42e3
      STALE_BRANCH: parallel/ride-bound-peak-speed/chat-t6v9m
      STALE_WORKFLOW: Xcode 27 PR Exact-Head QA
      STALE_WORKFLOW_PATH: .github/workflows/xcode27-pr-command.yml
    steps:
      - name: Cancel only the exact closed or merged stale run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          run_json="$(curl --fail-with-body --silent --show-error --location "${auth[@]}" "$GH_API/repos/$REPOSITORY/actions/runs/$STALE_RUN")"
          pr_json="$(curl --fail-with-body --silent --show-error --location "${auth[@]}" "$GH_API/repos/$REPOSITORY/pulls/$STALE_PR")"

          python3 - "$run_json" "$pr_json" <<'PY'
          import json, sys
          run = json.loads(sys.argv[1])
          pr = json.loads(sys.argv[2])
          expected = {
              "id": 31164679035,
              "name": "Xcode 27 PR Exact-Head QA",
              "path": ".github/workflows/xcode27-pr-command.yml",
              "event": "pull_request",
              "head_branch": "parallel/ride-bound-peak-speed/chat-t6v9m",
              "head_sha": "3bf0e6c647a8424412181dc1cde95be3aeac42e3",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"refusing cancellation: run {key} mismatch {run.get(key)!r} != {value!r}")
          if pr.get("number") != 198 or pr.get("state") != "closed" or not pr.get("merged"):
              raise SystemExit("refusing cancellation: PR #198 is not closed and merged")
          if (pr.get("head") or {}).get("sha") != expected["head_sha"]:
              raise SystemExit("refusing cancellation: merged PR head does not bind stale run SHA")
          if (pr.get("head") or {}).get("ref") != expected["head_branch"]:
              raise SystemExit("refusing cancellation: merged PR branch does not bind stale run branch")
          status = run.get("status")
          if status == "completed":
              print(f"stale run is already terminal: conclusion={run.get('conclusion')}")
              raise SystemExit(0)
          if status not in {"queued", "in_progress"}:
              raise SystemExit(f"refusing cancellation: unexpected run status {status!r}")
          print(f"authorized exact stale cancellation: run={run['id']} status={status} sha={run['head_sha']}")
          PY

          status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$run_json")"
          if [[ "$status" == "completed" ]]; then
            exit 0
          fi

          code="$(curl --silent --show-error --output /tmp/cancel-body --write-out '%{http_code}' --location --request POST "${auth[@]}" "$GH_API/repos/$REPOSITORY/actions/runs/$STALE_RUN/cancel")"
          if [[ "$code" == "202" ]]; then
            echo "Cancellation accepted for exact stale run $STALE_RUN."
            exit 0
          fi
          cat /tmp/cancel-body >&2 || true
          if [[ "$code" == "500" ]]; then
            force_code="$(curl --silent --show-error --output /tmp/force-body --write-out '%{http_code}' --location --request POST "${auth[@]}" "$GH_API/repos/$REPOSITORY/actions/runs/$STALE_RUN/force-cancel")"
            if [[ "$force_code" == "202" ]]; then
              echo "Force-cancellation accepted after ordinary HTTP 500 for exact stale run $STALE_RUN."
              exit 0
            fi
            cat /tmp/force-body >&2 || true
            echo "force-cancel failed with HTTP $force_code" >&2
            exit 1
          fi
          echo "cancel failed with HTTP $code" >&2
          exit 1
