name: Capture Current Accepted Root Compiler Composition

on:
  pull_request:
    paths:
      - scripts/ci/capture_selected_xcode_build_orchestrator.py
      - scripts/ci/tests/test_capture_accepted_root_build_composition.py
      - scripts/ci/tests/test_capture_accepted_root_whole_read_lease.py
      - scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py
      - scripts/ci/tests/test_capture_private_read_lease_component_walk.py
      - scripts/ci/tests/test_capture_private_read_lease_rollback.py
      - scripts/ci/tests/test_capture_private_read_lease_symlink_authority_transition.py
      - scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
      - .github/workflows/capture-current-accepted-root-acl-transport-probe.yml
      - .github/workflows/capture-current-accepted-root-real-lease-classifier.yml
      - .github/workflows/capture-current-accepted-root-compiler-composition.yml
      - .github/workflows/capture-field-build-provenance.yml
      - .github/workflows/capture-private-build-uid-read-lease-current.yml
  workflow_dispatch:

# Temporary write permission is used only by the exact-head V17 materialization job below.
# That job rewrites this workflow back to contents:read before publishing product bytes.
permissions:
  contents: write

concurrency:
  group: capture-current-accepted-root-compiler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 121abefc62d2663fe7eb248ec9595d882fa9d900
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  portable:
    name: Accepted-root compiler authority (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact current-parent convergence scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          actual="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-current-accepted-root-acl-transport-probe.yml \
            .github/workflows/capture-current-accepted-root-compiler-composition.yml \
            .github/workflows/capture-current-accepted-root-real-lease-classifier.yml \
            .github/workflows/capture-field-build-provenance.yml \
            .github/workflows/capture-private-build-uid-read-lease-current.yml \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_accepted_root_build_composition.py \
            scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py \
            scripts/ci/tests/test_capture_accepted_root_whole_read_lease.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py \
            scripts/ci/tests/test_capture_private_read_lease_symlink_authority_transition.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Compile authority product and witnesses
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              "scripts/ci/capture_selected_xcode_build_orchestrator.py",
              "scripts/ci/tests/test_capture_accepted_root_build_composition.py",
              "scripts/ci/tests/test_capture_accepted_root_whole_read_lease.py",
              "scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py",
              "scripts/ci/tests/test_capture_private_read_lease_component_walk.py",
              "scripts/ci/tests/test_capture_private_read_lease_rollback.py",
              "scripts/ci/tests/test_capture_private_read_lease_symlink_authority_transition.py",
              "scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py",
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          PY

      - name: Prove sealed-root compiler composition
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_root_build_composition.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_root_whole_read_lease.py

      - name: Preserve strongest private-lease adversaries
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_symlink_authority_transition.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py

      - name: Preserve accepted-input/root source regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve truth boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "NEMBRA_CURRENT_ACCEPTED_ROOT_COMPILER sealedRoot=true canonicalWorkspace=true wholeRootReadLease=true rollbackRequired=true signingAuthority=false installAuthority=false deviceTouched=false bluetoothTouched=false physicalAuthorityCreated=false"

  real-macos-authority:
    name: Real whole-root compiler read lease
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact head and root capability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          /usr/bin/sudo -n /usr/bin/true

      - name: Prove ephemeral complete-root read/search then exact revoke
        shell: bash
        run: |
          set -euo pipefail
          field_user="$(/usr/bin/id -un)"
          /usr/bin/sudo -n env \
            NEMBRA_TEST_FIELD_USER="$field_user" \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -B -I \
            scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py \
            --field-user "$field_user"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve physical boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "NEMBRA_REAL_WHOLE_ROOT_LEASE compilerReadWindow=true exactRevoke=true xcodeBuildExecuted=false signingAuthority=false installAuthority=false deviceTouched=false bluetoothTouched=false physicalAuthorityCreated=false"

  # BEGIN V17 FIELD STRICT-ROOT MATERIALIZER — self-removed before product publication.
  materialize-field-strict-root:
    if: github.event_name == 'pull_request' && github.head_ref == 'repair/v17-capture-darwin-native-acl-production-gpt56sol-20260817'
    name: Materialize field strict accepted root
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact authoring head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base HEAD 9df4ed9fb87b6ea9c81f41ead9a35be860bcedda)" = 9df4ed9fb87b6ea9c81f41ead9a35be860bcedda
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize reviewed field wiring with canonical Final-GO key
        shell: python
        run: |
          from pathlib import Path

          FINAL_GO_KEY = "NEMBRA_CAPTURE_ACCEPTED_GENERATED_BUILD_INPUT_MANIFEST_SHA256"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          bootstrap_path = Path("Scripts/bootstrap_capture_tuya_sdk.sh")
          bootstrap = bootstrap_path.read_text()
          anchor = 'PROVENANCE_HELPER="$SCRIPT_DIR/capture_tuya_private_input_provenance.py"\n'
          bootstrap = replace_once(
              bootstrap,
              anchor,
              anchor + 'ACCEPTED_BUILD_INPUT_HELPER="$REPO_ROOT/scripts/ci/capture_accepted_build_input_snapshot.py"\n',
              "bootstrap provenance-helper anchor",
          )

          old = '''  ACCEPTED_LOCK_SHA256="$(printf '%s' "$NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256" | tr '[:upper:]' '[:lower:]')"
else
  unset NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 || true
  ACCEPTED_LOCK_SHA256=""
fi
'''
          new = f'''  ACCEPTED_LOCK_SHA256="$(printf '%s' "$NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256" | tr '[:upper:]' '[:lower:]')"
  : "${{{FINAL_GO_KEY}:?Set {FINAL_GO_KEY} to the Final-GO-preaccepted generated/private compiler-input manifest SHA-256 before field bootstrap.}}"
  [[ "${FINAL_GO_KEY}" =~ ^[0-9A-Fa-f]{{64}}$ ]] || {{
    echo "ERROR: {FINAL_GO_KEY} must be exactly 64 hex characters." >&2
    exit 1
  }}
  ACCEPTED_GENERATED_MANIFEST_SHA256="$(printf '%s' "${FINAL_GO_KEY}" | tr '[:upper:]' '[:lower:]')"
else
  unset NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 {FINAL_GO_KEY} || true
  ACCEPTED_LOCK_SHA256=""
  ACCEPTED_GENERATED_MANIFEST_SHA256=""
fi
'''
          bootstrap = replace_once(bootstrap, old, new, "bootstrap accepted-lock authority anchor")

          old = '''if [[ ! -f "$PROVENANCE_HELPER" ]]; then
  echo "ERROR: private Tuya input provenance helper is missing from the accepted source." >&2
  exit 6
fi
'''
          bootstrap = replace_once(
              bootstrap,
              old,
              old + '''if [[ ! -f "$ACCEPTED_BUILD_INPUT_HELPER" ]]; then
  echo "ERROR: accepted generated-input manifest helper is missing from the accepted source." >&2
  exit 6
fi
''',
              "bootstrap helper-presence anchor",
          )

          anchor = '''[[ -f "$DEPENDENCY_PROVENANCE" ]] || {
  echo "ERROR: private Tuya dependency provenance record was not created." >&2
  exit 14
}
'''
          insertion = anchor + '''SOURCE_SHA="$(GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
  echo "ERROR: accepted source SHA is unavailable while generating the compiler-input manifest." >&2
  exit 14
}
GENERATED_MANIFEST_SHA256="$(
  /usr/bin/python3 -I "$ACCEPTED_BUILD_INPUT_HELPER" manifest \
    --root "$REPO_ROOT" \
    --source-sha "$SOURCE_SHA" | \
    /usr/bin/shasum -a 256 | /usr/bin/awk '{print $1}' | /usr/bin/tr '[:upper:]' '[:lower:]'
)" || {
  echo "ERROR: accepted generated/private compiler-input manifest could not be fingerprinted." >&2
  exit 14
}
[[ "$GENERATED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
  echo "ERROR: generated/private compiler-input manifest SHA-256 is malformed." >&2
  exit 14
}
'''
          bootstrap = replace_once(bootstrap, anchor, insertion, "bootstrap manifest-generation anchor")

          old = '''  Podfile.lock SHA-256: $LOCK_SHA256
  Local private-input fingerprint record: $DEPENDENCY_PROVENANCE

Review and bind this exact dependency-lock digest to the exact accepted Capture
source through the current Final-GO control plane before any field build/install.
Then rerun the normal bootstrap/installer with that accepted digest supplied as
NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256. This review-only mode never invokes
xcodebuild, installs Nembra, scans Bluetooth, or authorizes a physical attempt.
'''
          new = f'''  Podfile.lock SHA-256: $LOCK_SHA256
  Generated/private compiler-input manifest SHA-256: $GENERATED_MANIFEST_SHA256
  Local private-input fingerprint record: $DEPENDENCY_PROVENANCE

Review and bind both exact digests to the exact accepted Capture source through
the current Final-GO control plane before any field build/install. Then rerun
the normal bootstrap/installer with the accepted digests supplied as
NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 and
{FINAL_GO_KEY}. This review-only mode never invokes xcodebuild, installs Nembra,
scans Bluetooth, or authorizes a physical attempt.
'''
          bootstrap = replace_once(bootstrap, old, new, "bootstrap review-output anchor")

          old = '''printf 'Preaccepted Tuya dependency lock matched: %s\\n' "$LOCK_SHA256"
unset ACCEPTED_LOCK_SHA256 NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 || true
'''
          new = f'''printf 'Preaccepted Tuya dependency lock matched: %s\\n' "$LOCK_SHA256"
[[ "$GENERATED_MANIFEST_SHA256" == "$ACCEPTED_GENERATED_MANIFEST_SHA256" ]] || {{
  echo "ERROR: generated/private compiler inputs do not match the Final-GO-preaccepted manifest SHA-256. Stop before xcodebuild/install and review the new generated-input subject." >&2
  exit 17
}}
printf 'Preaccepted generated/private compiler-input manifest matched: %s\\n' "$GENERATED_MANIFEST_SHA256"
unset ACCEPTED_LOCK_SHA256 ACCEPTED_GENERATED_MANIFEST_SHA256 NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 {FINAL_GO_KEY} || true
'''
          bootstrap_path.write_text(replace_once(bootstrap, old, new, "bootstrap normal-authority anchor"))

          installer_path = Path("scripts/field/install_one_time_capture.command")
          installer = installer_path.read_text()
          anchor = '''say "Exact requested Capture source matched: $SOURCE_SHA"
'''
          insertion = anchor + f'''
: "${{{FINAL_GO_KEY}:?Final GO must provide {FINAL_GO_KEY} as the accepted generated/private compiler-input manifest SHA-256.}}"
[[ "${FINAL_GO_KEY}" =~ ^[0-9A-Fa-f]{{64}}$ ]] || die "{FINAL_GO_KEY} must be exactly 64 hex characters."
{FINAL_GO_KEY}="$(printf '%s' "${FINAL_GO_KEY}" | tr '[:upper:]' '[:lower:]')"
export {FINAL_GO_KEY}
'''
          installer = replace_once(installer, anchor, insertion, "installer source-authority anchor")

          old = '''        --install-custody-base64 "$SIGNED_APP_CUSTODY_HELPER_BASE64" \\
        --install-custody-blob "$SIGNED_APP_CUSTODY_HELPER_BLOB" \\
        -- \\
'''
          new = f'''        --install-custody-base64 "$SIGNED_APP_CUSTODY_HELPER_BASE64" \\
        --install-custody-blob "$SIGNED_APP_CUSTODY_HELPER_BLOB" \\
        --accepted-generated-manifest-sha256 "${FINAL_GO_KEY}" \\
        -- \\
'''
          installer = replace_once(installer, old, new, "installer orchestrator-call anchor")

          old = ''')"; then
    die "The signed build could not bind frozen selected-Xcode execution to isolated compiler output and protected install custody. No field artifact was admitted."
fi

[[ "$BUILD_ORIGIN_CUSTODY_RESULT" == *$'\\t'* ]] || die "Build-origin custody returned no canonical stage/fingerprint record."
'''
          new = f''')"; then
    die "The signed build could not bind frozen selected-Xcode execution to isolated compiler output and protected install custody. No field artifact was admitted."
fi
unset {FINAL_GO_KEY} || true

[[ "$BUILD_ORIGIN_CUSTODY_RESULT" == *$'\\t'* ]] || die "Build-origin custody returned no canonical stage/fingerprint record."
'''
          installer_path.write_text(replace_once(installer, old, new, "installer post-orchestrator anchor"))

          test_path = Path("scripts/ci/tests/test_capture_field_strict_accepted_root_wiring.py")
          test_path.write_text(f'''#!/usr/bin/env python3
from pathlib import Path
import unittest

ROOT = Path(__file__).resolve().parents[3]
FINAL_GO_KEY = "{FINAL_GO_KEY}"

class CaptureFieldStrictAcceptedRootWiringTests(unittest.TestCase):
    def test_review_only_bootstrap_emits_both_preacceptance_subjects(self):
        source = (ROOT / "Scripts/bootstrap_capture_tuya_sdk.sh").read_text()
        self.assertIn("Generated/private compiler-input manifest SHA-256: $GENERATED_MANIFEST_SHA256", source)
        self.assertIn(FINAL_GO_KEY, source)
        self.assertIn('[[ "$GENERATED_MANIFEST_SHA256" == "$ACCEPTED_GENERATED_MANIFEST_SHA256" ]]', source)
        self.assertIn('"$ACCEPTED_BUILD_INPUT_HELPER" manifest', source)
        self.assertIn("This review-only mode never", source)
        self.assertIn(f"unset ACCEPTED_LOCK_SHA256 ACCEPTED_GENERATED_MANIFEST_SHA256 NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 {{FINAL_GO_KEY}}", source)

    def test_field_installer_requires_transports_and_clears_preaccepted_manifest(self):
        source = (ROOT / "scripts/field/install_one_time_capture.command").read_text()
        self.assertIn(f"Final GO must provide {{FINAL_GO_KEY}}", source)
        self.assertIn(f'--accepted-generated-manifest-sha256 "${{FINAL_GO_KEY}}"', source)
        self.assertIn(f"unset {{FINAL_GO_KEY}} || true", source)
        self.assertNotIn("capture_accepted_build_input_snapshot.py manifest", source)

    def test_orchestrator_uses_digest_to_make_strict_root_and_native_lease(self):
        source = (ROOT / "scripts/ci/capture_selected_xcode_build_orchestrator.py").read_text()
        self.assertIn("if accepted_generated_manifest_sha256 is not None:", source)
        self.assertIn("private_subjects = (accepted_root,)", source)
        self.assertIn("use_native_darwin_acl=(accepted_root is not None)", source)

if __name__ == "__main__":
    unittest.main(verbosity=2)
''')

          # Convert this same workflow into the permanent exact-head acceptance scope.
          workflow_path = Path(".github/workflows/capture-current-accepted-root-compiler-composition.yml")
          workflow = workflow_path.read_text()
          workflow = replace_once(
              workflow,
              "# Temporary write permission is used only by the exact-head V17 materialization job below.\n# That job rewrites this workflow back to contents:read before publishing product bytes.\npermissions:\n  contents: write\n",
              "permissions:\n  contents: read\n",
              "workflow permission restoration",
          )
          marker = "\n  # BEGIN V17 FIELD STRICT-ROOT MATERIALIZER — self-removed before product publication.\n"
          index = workflow.find(marker)
          if index < 0:
              raise SystemExit("workflow materializer marker is unavailable")
          workflow = workflow[:index] + "\n"

          anchor = '''      - scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
      - .github/workflows/capture-current-accepted-root-acl-transport-probe.yml
'''
          replacement = '''      - scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_field_strict_accepted_root_wiring.py
      - .github/workflows/capture-current-accepted-root-acl-transport-probe.yml
'''
          workflow = replace_once(workflow, anchor, replacement, "workflow trigger scope")

          anchor = '''            scripts/ci/tests/test_capture_private_read_lease_symlink_authority_transition.py \\
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py | LC_ALL=C sort)"
'''
          replacement = '''            scripts/ci/tests/test_capture_private_read_lease_symlink_authority_transition.py \\
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py \\
            Scripts/bootstrap_capture_tuya_sdk.sh \\
            scripts/field/install_one_time_capture.command \\
            scripts/ci/tests/test_capture_field_strict_accepted_root_wiring.py | LC_ALL=C sort)"
'''
          workflow = replace_once(workflow, anchor, replacement, "workflow convergence scope")

          anchor = '''              "scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py",
          ):
'''
          replacement = '''              "scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py",
              "scripts/ci/tests/test_capture_field_strict_accepted_root_wiring.py",
          ):
'''
          workflow = replace_once(workflow, anchor, replacement, "workflow compile scope")

          anchor = '''          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
'''
          replacement = '''          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_field_strict_accepted_root_wiring.py
          /bin/bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          /bin/bash -n scripts/field/install_one_time_capture.command
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
'''
          workflow_path.write_text(replace_once(workflow, anchor, replacement, "workflow field wiring regression"))

      - name: Run focused field admission regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_field_strict_accepted_root_wiring.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /bin/bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          /bin/bash -n scripts/field/install_one_time_capture.command
          git diff --check
          ! grep -nE 'publishDps\(|writeValue\(|removeDevice|factoryReset' scripts/field/install_one_time_capture.command

      - name: Publish clean exact-head repair
        shell: bash
        env:
          BRANCH: repair/v17-capture-darwin-native-acl-production-gpt56sol-20260817
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-current-accepted-root-compiler-composition.yml \
            Scripts/bootstrap_capture_tuya_sdk.sh \
            scripts/ci/tests/test_capture_field_strict_accepted_root_wiring.py \
            scripts/field/install_one_time_capture.command | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/capture-current-accepted-root-compiler-composition.yml \
                  Scripts/bootstrap_capture_tuya_sdk.sh \
                  scripts/field/install_one_time_capture.command \
                  scripts/ci/tests/test_capture_field_strict_accepted_root_wiring.py
          git diff --cached --check
          git commit -m 'Capture: require accepted root for field build'
          final="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:"$BRANCH"
          echo "NEMBRA_FIELD_STRICT_ROOT exactHead=$final preacceptedGeneratedInputs=true strictAcceptedRoot=true physicalAuthorityCreated=false"
  # END V17 FIELD STRICT-ROOT MATERIALIZER
