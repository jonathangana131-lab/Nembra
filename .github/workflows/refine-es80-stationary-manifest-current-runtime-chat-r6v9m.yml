name: Refine ES80 stationary manifest recovery

on:
  push:
    branches:
      - parallel/recover-es80-stationary-manifest-current-runtime/chat-r6v9m

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 16
      - name: Apply continuity authority refinement
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=d9dc4cff1dd165a6cea4625171f0e99615b4952b
          WORKFLOW=.github/workflows/refine-es80-stationary-manifest-current-runtime-chat-r6v9m.yml
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothStationaryCaptureManifest.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothStationaryCaptureManifestTests.swift
          DOC=docs/ES80_STATIONARY_CAPTURE_MANIFEST.md
          test "$(git merge-base "$PRODUCT" HEAD)" = "$PRODUCT"
          test "$(git diff --name-only "$PRODUCT" HEAD)" = "$WORKFLOW"
          printf '%s' '' | base64 --decode | python3
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' "$SOURCE"; then
            exit 1
          fi
          git config user.name nembra-integration-bot
          git config user.email actions@users.noreply.github.com
          git rm "$WORKFLOW"
          git add "$SOURCE" "$TEST" "$DOC"
          test "$(git diff --cached --name-only "$PRODUCT" | wc -l | tr -d ' ')" = 3
          test -z "$(git diff --cached --name-only "$PRODUCT" | grep -v -E '^(Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothStationaryCaptureManifest.swift|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothStationaryCaptureManifestTests.swift|docs/ES80_STATIONARY_CAPTURE_MANIFEST.md)$')"
          git diff --cached --check
          git commit -m "[es80 stationary manifest] Reuse core continuity truth"
          git push origin "HEAD:${GITHUB_REF_NAME}"
