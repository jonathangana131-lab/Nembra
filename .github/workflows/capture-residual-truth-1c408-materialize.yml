name: Materialize Capture Residual Truth 1c408
on:
  push:
    branches: [fix/v14-capture-residual-truth-1c408-sol]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-residual-truth-1c408-sol
          fetch-depth: 0
      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          p='1c40853f6991b4d09206df1d25ecff021458b7eb'
          git merge-base --is-ancestor "$p" HEAD
          git diff --quiet "$p" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaResidualForegroundTruthSourceTests.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
      - name: Apply
        run: python3 scripts/ci/materialize_capture_residual_truth_1c408.py apply
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_residual_truth_1c408.py verify
          python3 -m py_compile scripts/ci/materialize_capture_residual_truth_1c408.py
          git diff --check
      - name: Publish clean residual closure
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-residual-truth-1c408-materialize.yml
          rm scripts/ci/materialize_capture_residual_truth_1c408.py
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-residual-truth-1c408-materialize.yml' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaResidualForegroundTruthSourceTests.swift' \
            'scripts/ci/materialize_capture_residual_truth_1c408.py' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): close residual truth blockers'
          git push origin HEAD:fix/v14-capture-residual-truth-1c408-sol
