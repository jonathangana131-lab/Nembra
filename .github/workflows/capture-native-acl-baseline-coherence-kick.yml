name: Capture native ACL baseline coherence kick

on:
  pull_request:
    paths:
      - .github/workflows/capture-native-acl-baseline-coherence-kick.yml

permissions:
  contents: write

jobs:
  kick-target:
    if: >-
      github.head_ref == 'repair/v17-capture-native-acl-baseline-coherence-kick-sol-20260817' &&
      github.base_ref == 'repair/v17-capture-native-acl-baseline-coherence-sol-20260817'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Re-arm target one-shot without importing kick workflow
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          target='repair/v17-capture-native-acl-baseline-coherence-sol-20260817'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin "$target"
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/capture-native-acl-baseline-coherence-one-shot.yml')
          text = p.read_text()
          marker = '# V17 exact-head rearm after red-team confirmation.\n'
          if text.startswith(marker):
              raise SystemExit('target one-shot already rearmed')
          p.write_text(marker + text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/capture-native-acl-baseline-coherence-one-shot.yml
          git diff --cached --check
          git commit -m 'Capture: rearm native ACL baseline coherence materializer'
          git push origin HEAD:"$target"
