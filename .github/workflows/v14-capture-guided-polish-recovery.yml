name: V14 Capture Guided Polish Recovery

on:
  push:
    branches:
      - repair/v14-capture-guided-correlation-recovery-sol

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard construction ancestry
        shell: bash
        run: |
          set -euo pipefail
          base='f0bdb63d716368c341b903cfd741c51924042c75'
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v14-capture-guided-polish-recovery.yml' \
            'scripts/ci/materialize_v14_capture_guided_polish.py' | sort)"
          test "$actual" = "$expected"

      - name: Materialize guided truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/materialize_v14_capture_guided_polish.py
          python3 scripts/ci/materialize_v14_capture_guided_polish.py
          git diff --check

      - name: Commit product-only result
        shell: bash
        run: |
          set -euo pipefail
          branch='repair/v14-capture-guided-correlation-recovery-sol'
          event_sha="$GITHUB_SHA"
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$event_sha"
          rm .github/workflows/v14-capture-guided-polish-recovery.yml
          rm scripts/ci/materialize_v14_capture_guided_polish.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): close guided correlation and recovery truth'
          git push origin "HEAD:$branch"
