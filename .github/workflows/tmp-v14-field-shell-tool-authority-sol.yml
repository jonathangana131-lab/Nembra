name: TEMP V14 Field Shell Tool Authority Sol

on:
  push:
    branches:
      - repair/v14-capture-field-installer-git-authority-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-field-installer-git-authority-sol-20260811
          fetch-depth: 0
      - name: Bind exact repair ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c83f047f9812a5c2f3c01f304b4ce9eb9793dacc HEAD
          test "$(git rev-parse HEAD:scripts/field/install_one_time_capture.command)" = fa68975764d4e95e153264c603a9d72cbd8990f9
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize process-entry and tool authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tmp_materialize_field_shell_tool_authority_sol.py
      - name: Verify permanent result
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/ci/tmp_materialize_field_shell_tool_authority_sol.py
          test ! -e .github/workflows/tmp-v14-field-shell-tool-authority-sol.yml
          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py
          git diff --check
          /bin/rm -rf -- scripts/ci/tests/__pycache__
      - name: Verify exact publish path set
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          /usr/bin/python3 - <<'PY'
          import subprocess
          expected = {
              "scripts/field/install_one_time_capture.command",
              "scripts/ci/tmp_materialize_field_shell_tool_authority_sol.py",
              ".github/workflows/tmp-v14-field-shell-tool-authority-sol.yml",
          }
          actual = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected materialized path set: {sorted(actual)}")
          PY
      - name: Publish permanent result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nembra V14 Sol"
          git config user.email "nembra-v14-sol@users.noreply.github.com"
          git commit -m "Capture: bind field shell and tool execution authority"
          git push origin HEAD:repair/v14-capture-field-installer-git-authority-sol-20260811
