name: Capture TODAY Signed Candidate Reinspection QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_trusted_signed_candidate_reinspection.py
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_trusted_signed_candidate_reinspection.py
      - scripts/ci/tests/test_es80_today_final_go_hardened.py
      - .github/workflows/capture-today-signed-candidate-reinspection-qa.yml

permissions:
  contents: read

jobs:
  signed-reinspection:
    name: Reject caller-forged signed-field inspection authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nembra-capture-today-signed-reinspection-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true

    steps:
      - name: Checkout immutable PR head with reviewed tool objects
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile signed reinspection authority
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_trusted_signed_candidate_reinspection.py
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_trusted_signed_candidate_reinspection.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_hardened.py

      - name: Adversarially prove tool and descriptor custody
        run: python3 scripts/ci/tests/test_es80_today_trusted_signed_candidate_reinspection.py -v

      - name: Prove canonical Final GO consumes fresh candidate equality
        run: python3 scripts/ci/tests/test_es80_today_final_go_hardened.py -v

      - name: Pin reviewed field-inspection subjects and private input contract
        run: |
          set -euo pipefail
          grep -Fq 'PRIVATE_RUNNER_PATH = "scripts/ci/es80_signed_field_artifact_private_runner.py"' scripts/ci/es80_today_trusted_signed_candidate_reinspection.py
          grep -Fq 'PRIVATE_RUNNER_BLOB = "f648b3080313f65da1e358ef3beb8c23d05966e6"' scripts/ci/es80_today_trusted_signed_candidate_reinspection.py
          grep -Fq 'INSPECTOR_PATH = "scripts/ci/es80_signed_field_artifact_evidence.py"' scripts/ci/es80_today_trusted_signed_candidate_reinspection.py
          grep -Fq 'INSPECTOR_BLOB = "57ec5f42b23ade83f1367fa86fe8f60f2144f241"' scripts/ci/es80_today_trusted_signed_candidate_reinspection.py
          grep -Fq '"/usr/bin/git"' scripts/ci/es80_today_trusted_signed_candidate_reinspection.py
          grep -Fq 'GIT_NO_REPLACE_OBJECTS' scripts/ci/es80_today_trusted_signed_candidate_reinspection.py
          grep -Fq '"-I"' scripts/ci/es80_today_trusted_signed_candidate_reinspection.py
          grep -Fq 'pass_fds=(runner_fd, inspector_fd)' scripts/ci/es80_today_trusted_signed_candidate_reinspection.py
          grep -Fq '"--intended-device-udid-file"' scripts/ci/es80_today_final_go_hardened.py
          grep -Fq 'accepted_candidate != fresh_candidate' scripts/ci/es80_today_final_go_hardened.py

      - name: Keep raw device identity out of Final GO command contract
        run: |
          set -euo pipefail
          help="$(python3 scripts/ci/es80_today_final_go_hardened.py --help)"
          grep -Fq -- '--intended-device-udid-file' <<<"$help"
          ! grep -Eq -- '--intended-device-udid([ =]|$)' <<<"$help"
