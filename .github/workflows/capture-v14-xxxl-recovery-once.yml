name: Capture V14 Accessibility XXXL recovery once

on:
  push:
    branches:
      - agent/capture-xxxl-recovery
    paths:
      - .github/workflows/capture-v14-xxxl-recovery-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v5
        with:
          ref: agent/capture-xxxl-recovery
          fetch-depth: 0

      - name: Apply context-aware Accessibility XXXL repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("NembraApp/App/NembraApp.swift")
          source = path.read_text(encoding="utf-8")

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global source
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f"Refusing repair for {old!r}: expected {expected}, found {count}")
              source = source.replace(old, new)

          def replace_regex(pattern: str, replacement: str, expected: int = 1) -> None:
              global source
              source, count = re.subn(pattern, replacement, source, flags=re.MULTILINE)
              if count != expected:
                  raise SystemExit(f"Refusing regex repair for {pattern!r}: expected {expected}, found {count}")

          replace_exact(
              "spacing: verticalSizeClass == .compact ? 10 : (isAccessibilityLayout ? 8 : 28)",
              "spacing: verticalSizeClass == .compact ? 10 : (isAccessibilityLayout ? 6 : 28)",
          )
          replace_exact(
              "spacing: verticalSizeClass == .compact ? 6 : (isAccessibilityLayout ? 4 : 14)",
              "spacing: verticalSizeClass == .compact ? 6 : (isAccessibilityLayout ? 2 : 14)",
          )
          replace_exact(
              "isAccessibilityLayout || verticalSizeClass == .compact ? .title2 : .largeTitle,",
              "isAccessibilityLayout ? .headline : (verticalSizeClass == .compact ? .title2 : .largeTitle),",
          )
          replace_regex(
              r'Text\("Final exact-build checks are still in progress\."\)\n(?P<i>\s*)\.font\(\.caption\.weight\(\.semibold\)\)',
              'Text("Final checks in progress.")\n\\g<i>.font(.caption2.weight(.semibold))',
          )
          replace_regex(
              r'Text\(isAccessibilityLayout \? "PHYSICAL CAPTURE · NO-GO" : "Not ready for scooter capture yet"\)\n(?P<i>\s*)\.font\(\.headline\)',
              'Text(isAccessibilityLayout ? "PHYSICAL CAPTURE · NO-GO" : "Not ready for scooter capture yet")\n\\g<i>.font(isAccessibilityLayout ? .subheadline.weight(.semibold) : .headline)',
          )
          replace_regex(
              r'Text\("Engineering details"\)\n(?P<i>\s*)\.font\(\.subheadline\.weight\(\.semibold\)\)',
              'Text("Engineering details")\n\\g<i>.font(isAccessibilityLayout ? .footnote.weight(.semibold) : .subheadline.weight(.semibold))',
          )
          replace_exact(
              ".padding(verticalSizeClass == .compact ? 12 : (isAccessibilityLayout ? 10 : 18))",
              ".padding(verticalSizeClass == .compact ? 12 : (isAccessibilityLayout ? 8 : 18))",
              expected=2,
          )
          replace_exact(
              ".padding(.top, verticalSizeClass == .compact ? 8 : (isAccessibilityLayout ? 8 : 18))",
              ".padding(.top, verticalSizeClass == .compact ? 8 : (isAccessibilityLayout ? 4 : 18))",
          )

          path.write_text(source, encoding="utf-8")
          PY

          git diff --check
          git diff -- NembraApp/App/NembraApp.swift

      - name: Commit source repair and remove recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-v14-closure-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/capture-v14-xxxl-recovery-once.yml
          git add NembraApp/App/NembraApp.swift
          git diff --cached --check
          git commit -m "fix(capture): fit locked state at Accessibility XXXL"
          git push origin HEAD:"$GITHUB_REF_NAME"
