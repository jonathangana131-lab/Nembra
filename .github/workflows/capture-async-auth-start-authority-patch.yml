name: Capture Async Authentication Authority Patch

on:
  push:
    branches:
      - agent/v14-capture-async-auth-start-authority-sol
    paths:
      - .github/workflows/capture-async-auth-start-authority-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-async-auth-start-authority-sol
          fetch-depth: 0
      - name: Apply production repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_async_auth_start_authority_patch.py
          rm Scripts/apply_capture_async_auth_start_authority_patch.py
          rm .github/workflows/capture-async-auth-start-authority-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'self.phase == .selected'
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'self.targetCorrelationOperatorConfirmed'
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'guard phase == .selected'
          git commit -m "fix(capture): revalidate async authentication authority"
          git push origin HEAD:agent/v14-capture-async-auth-start-authority-sol
