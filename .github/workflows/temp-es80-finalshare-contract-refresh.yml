name: Temp ES80 Final Share Contract Refresh

on:
  push:
    branches:
      - temp/es80-finalshare-contract-refresh-302-gpt56

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/es80-finalshare-contract-refresh-302-gpt56
          fetch-depth: 0
      - name: Patch contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraUITests/ES80ResearchCaptureUITests.swift')
          s = p.read_text()
          old = '            source.contains("if let data = finalShareData"),\n            "A temporary Share-file retry must reuse retained verified bytes rather than mint a new evidence artifact."'
          new = '''            source.contains("if finalShareData != nil,"),
            "A temporary Share-file retry must require retained verified final Share bytes."
        )
        XCTAssertTrue(
            source.contains("finalShareIntegrityReport != nil,"),
            "A temporary Share-file retry must retain the exact integrity report rather than mint new evidence."
        )
        XCTAssertTrue(
            source.contains("finalShareFilename != nil {"),
            "A temporary Share-file retry must retain the verified filename alongside the verified bytes."'''
          if old not in s:
              print('already patched or expected source contract not found')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraUITests/ES80ResearchCaptureUITests.swift
          git commit -m 'temp: materialize final-share contract fix'
          git push origin HEAD:temp/es80-finalshare-contract-refresh-302-gpt56
