name: TEMP ES80 candidate catalog hot-path repair

on:
  push:
    branches:
      - fix/es80-v14-candidate-catalog-hot-path/gpt56-thinking-go

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Apply and validate source architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_es80_candidate_catalog_hot_path_repair.py
          grep -q 'callbackPathStaysConstantTimeForCandidatePresentationBookkeeping' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CandidateCatalogPerformanceAcceptanceTests.swift
          grep -q 'exactTargetRediscoveryUsesDictionaryLookup' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CandidateCatalogPerformanceAcceptanceTests.swift
          grep -q 'presentationSortContractRemainsDeterministic' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CandidateCatalogPerformanceAcceptanceTests.swift
          git diff --check
          rm scripts/ci/tmp_es80_candidate_catalog_hot_path_repair.py
          rm .github/workflows/tmp-es80-candidate-catalog-hot-path.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[Capture perf v14] Move candidate sorting off BLE callback path"
          git push origin HEAD:${{ github.ref_name }}
