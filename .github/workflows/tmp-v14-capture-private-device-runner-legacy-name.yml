name: Temporary V14 Capture Private Device Runner Byte Name

on:
  push:
    branches:
      - repair/v14-capture-private-device-runner-execution-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-private-device-runner-execution-sol
          fetch-depth: 0

      - name: Materialize provenance-compatible accepted-runner transport
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '/usr/bin/python3 -I -B - "$PRIVATE_DEVICE_RUNNER" "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" "$ROOT"' scripts/field/install_one_time_capture.command \
             && ! grep -Fq 'PRIVATE_DEVICE_RUNNER="$ROOT/scripts/ci/es80_signed_field_artifact_private_runner.py"' scripts/field/install_one_time_capture.command; then
            echo 'Accepted-runner transport already uses the provenance-compatible safe variable.'
            exit 0
          fi
          /usr/bin/python3 -B scripts/ci/tmp_materialize_private_device_runner_legacy_name.py
          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_device_runner_execution_subject.py
          grep -Fq '/usr/bin/python3 -I -B - "$PRIVATE_DEVICE_RUNNER"' scripts/field/install_one_time_capture.command
          ! grep -Fq 'PRIVATE_DEVICE_RUNNER="$ROOT/scripts/ci/es80_signed_field_artifact_private_runner.py"' scripts/field/install_one_time_capture.command
          git diff --check

      - name: Commit installer product repair only
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/field/install_one_time_capture.command
          if git diff --cached --quiet; then
            echo 'No installer product change to publish.'
            exit 0
          fi
          git config user.name 'nembra-capture-bot'
          git config user.email 'nembra-capture-bot@users.noreply.github.com'
          git commit -m 'fix(capture): keep field provenance bound to accepted runner bytes'
          git push origin HEAD:repair/v14-capture-private-device-runner-execution-sol
