name: Temp ES80 offline report recovery

on:
  push:
    branches:
      - recover/es80-v14-offline-report-current

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover accepted report and bounded-ingress files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=f22f88e4f6072d5bbfeb20069e592fea79d971c3
          paths=(
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothCaptureArtifactInputPolicy.swift
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothCaptureArtifactOutputPolicy.swift
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothTuyaCaptureArtifactReport.swift
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothTuyaCaptureOutcomeSummary.swift
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothTuyaCaptureReport.swift
            Packages/NembraBluetoothCapture/Sources/NembraES80CaptureReport/main.swift
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothCaptureArtifactInputPolicyTests.swift
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothCaptureArtifactOutputPolicyTests.swift
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothTuyaCaptureArtifactReportTests.swift
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothTuyaCaptureOutcomeSummaryTests.swift
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothTuyaCaptureReportTests.swift
            docs/ES80_OFFLINE_CAPTURE_REPORT.md
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE:$path" > "$path"
          done

      - name: Reconcile report with current Capture schema and provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          package = Path('Packages/NembraBluetoothCapture/Package.swift')
          text = package.read_text()
          old = '''        .library(\n            name: "NembraBluetoothCapture",\n            targets: ["NembraBluetoothCapture"]\n        )\n    ],'''
          new = '''        .library(\n            name: "NembraBluetoothCapture",\n            targets: ["NembraBluetoothCapture"]\n        ),\n        .executable(\n            name: "nembra-es80-capture-report",\n            targets: ["NembraES80CaptureReport"]\n        )\n    ],'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        .testTarget(\n            name: "NembraBluetoothCaptureTests",'''
          new = '''        .executableTarget(\n            name: "NembraES80CaptureReport",\n            dependencies: [\n                "NembraBluetoothCapture",\n                .product(name: "NembraCore", package: "NembraCore")\n            ]\n        ),\n        .testTarget(\n            name: "NembraBluetoothCaptureTests",'''
          assert text.count(old) == 1
          package.write_text(text.replace(old, new, 1))

          report = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothTuyaCaptureReport.swift')
          text = report.read_text()
          text = text.replace('public static let currentSchemaVersion = 1', 'public static let currentSchemaVersion = 2', 1)
          old = '''        public let peripheralIdentifier: String\n        public let totalCaptureRecordCount: Int\n    }'''
          new = '''        public let peripheralIdentifier: String\n        public let totalCaptureRecordCount: Int\n        /// Exact schema-v3 Nembra lifecycle boundaries from the source artifact.\n        /// These are descriptive software-observation evidence only, never BLE packets\n        /// or Experiment One authority.\n        public let observationBoundaries: [PassiveBluetoothObservationBoundary]\n    }'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        public let receivedAtDate: Date\n        public let continuityGeneration: UInt64\n        public let payloadByteCount: Int\n    }'''
          new = '''        public let receivedAtDate: Date\n        public let continuityGeneration: UInt64\n        public let receiptSequenceScope: String?\n        public let receiptSequenceNumber: UInt64?\n        public let payloadByteCount: Int\n\n        public init(\n            analysisObservationIndex: Int,\n            captureRecordIndex: Int,\n            captureSequenceNumber: UInt64,\n            receivedAtUptimeNanoseconds: UInt64,\n            receivedAtDate: Date,\n            continuityGeneration: UInt64,\n            receiptSequenceScope: String? = nil,\n            receiptSequenceNumber: UInt64? = nil,\n            payloadByteCount: Int\n        ) {\n            self.analysisObservationIndex = analysisObservationIndex\n            self.captureRecordIndex = captureRecordIndex\n            self.captureSequenceNumber = captureSequenceNumber\n            self.receivedAtUptimeNanoseconds = receivedAtUptimeNanoseconds\n            self.receivedAtDate = receivedAtDate\n            self.continuityGeneration = continuityGeneration\n            self.receiptSequenceScope = receiptSequenceScope\n            self.receiptSequenceNumber = receiptSequenceNumber\n            self.payloadByteCount = payloadByteCount\n        }\n    }'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        public let fragmentCount: Int\n        public let firstReceiptUptimeNanoseconds: UInt64\n        public let lastReceiptUptimeNanoseconds: UInt64\n    }'''
          new = '''        public let fragmentCount: Int\n        public let receiptSequenceScope: String?\n        public let firstReceiptSequenceNumber: UInt64?\n        public let lastReceiptSequenceNumber: UInt64?\n        public let firstReceiptUptimeNanoseconds: UInt64\n        public let lastReceiptUptimeNanoseconds: UInt64\n\n        public init(\n            continuityGeneration: UInt64,\n            protocolVersionByte: UInt8,\n            protocolVersionHighNibble: UInt8,\n            encryptedByteCount: Int,\n            fragmentCount: Int,\n            receiptSequenceScope: String? = nil,\n            firstReceiptSequenceNumber: UInt64? = nil,\n            lastReceiptSequenceNumber: UInt64? = nil,\n            firstReceiptUptimeNanoseconds: UInt64,\n            lastReceiptUptimeNanoseconds: UInt64\n        ) {\n            self.continuityGeneration = continuityGeneration\n            self.protocolVersionByte = protocolVersionByte\n            self.protocolVersionHighNibble = protocolVersionHighNibble\n            self.encryptedByteCount = encryptedByteCount\n            self.fragmentCount = fragmentCount\n            self.receiptSequenceScope = receiptSequenceScope\n            self.firstReceiptSequenceNumber = firstReceiptSequenceNumber\n            self.lastReceiptSequenceNumber = lastReceiptSequenceNumber\n            self.firstReceiptUptimeNanoseconds = firstReceiptUptimeNanoseconds\n            self.lastReceiptUptimeNanoseconds = lastReceiptUptimeNanoseconds\n        }\n    }'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''                peripheralIdentifier: peripheralIdentifier,\n                totalCaptureRecordCount: session.records.count\n            ),'''
          new = '''                peripheralIdentifier: peripheralIdentifier,\n                totalCaptureRecordCount: session.records.count,\n                observationBoundaries: session.observationBoundaries\n            ),'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''                    encryptedByteCount: message.encryptedBytes.count,\n                    fragmentCount: message.fragmentCount,\n                    firstReceiptUptimeNanoseconds: message.firstReceiptUptimeNanoseconds,'''
          new = '''                    encryptedByteCount: message.encryptedBytes.count,\n                    fragmentCount: message.fragmentCount,\n                    receiptSequenceScope: message.receiptSequenceScope,\n                    firstReceiptSequenceNumber: message.firstReceiptSequenceNumber,\n                    lastReceiptSequenceNumber: message.lastReceiptSequenceNumber,\n                    firstReceiptUptimeNanoseconds: message.firstReceiptUptimeNanoseconds,'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            receivedAtDate: fragment.receivedAtDate,\n            continuityGeneration: fragment.observation.continuityGeneration,\n            payloadByteCount: fragment.observation.bytes.count'''
          new = '''            receivedAtDate: fragment.receivedAtDate,\n            continuityGeneration: fragment.observation.continuityGeneration,\n            receiptSequenceScope: fragment.observation.receiptSequenceScope,\n            receiptSequenceNumber: fragment.observation.receiptSequenceNumber,\n            payloadByteCount: fragment.observation.bytes.count'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        case .streamIdentityAndContinuityGenerationChanged:\n            "streamIdentityAndContinuityGenerationChanged"\n        }'''
          new = '''        case .streamIdentityAndContinuityGenerationChanged:\n            "streamIdentityAndContinuityGenerationChanged"\n        case .candidatePacketZeroRestart:\n            "candidatePacketZeroRestart"\n        }'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '''        case .emptyFragment:\n            "emptyFragment"\n        case .malformedVarint:'''
          replacement = '''        case .emptyFragment:\n            "emptyFragment"\n        case .emptyReceiptSequenceScope:\n            "emptyReceiptSequenceScope"\n        case .receiptSequenceScopeRequiresSequence:\n            "receiptSequenceScopeRequiresSequence"\n        case .receiptSequenceRequiresScope:\n            "receiptSequenceRequiresScope"\n        case .malformedVarint:'''
          assert text.count(marker) == 1
          text = text.replace(marker, replacement, 1)
          marker = '''        case .continuityGenerationChanged:\n            "continuityGenerationChanged"\n        case .nonMonotonicReceiptUptime:'''
          replacement = '''        case .continuityGenerationChanged:\n            "continuityGenerationChanged"\n        case .receiptOrderingAuthorityChanged:\n            "receiptOrderingAuthorityChanged"\n        case let .receiptSequenceScopeChanged(expected, actual):\n            "receiptSequenceScopeChanged(expected:\\(expected),actual:\\(actual))"\n        case let .nonMonotonicReceiptSequence(previous, actual):\n            "nonMonotonicReceiptSequence(previous:\\(previous),actual:\\(actual))"\n        case .nonMonotonicReceiptUptime:'''
          assert text.count(marker) == 1
          text = text.replace(marker, replacement, 1)
          report.write_text(text)

          artifact = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothTuyaCaptureArtifactReport.swift')
          text = artifact.read_text()
          text = text.replace('public static let currentSchemaVersion = 1', 'public static let currentSchemaVersion = 2', 1)
          marker = '''public enum PassiveBluetoothTuyaCaptureArtifactReportBuilder {'''
          verification_error = '''public enum PassiveBluetoothTuyaCaptureArtifactReportVerificationError: Error, Equatable, Sendable {\n    case unsupportedArtifactSchemaVersion(Int)\n    case unsupportedAnalysisSchemaVersion(Int)\n    case sourceByteCountMismatch(expected: Int, actual: Int)\n    case sourceSHA256Mismatch(expected: String, actual: String)\n    case rederivedAnalysisMismatch\n}\n\npublic enum PassiveBluetoothTuyaCaptureArtifactReportBuilder {'''
          assert text.count(marker) == 1
          text = text.replace(marker, verification_error, 1)
          marker = '''    public static func sha256Hex(of data: Data) -> String {'''
          verifier = '''    /// Re-derives a stored report from the exact source bytes under the report's\n    /// declared bounded analyzer policy. This establishes deterministic internal\n    /// consistency only; it is not a signature, scooter authentication, or physical proof.\n    public static func verify(\n        _ report: PassiveBluetoothTuyaCaptureArtifactReport,\n        against captureJSON: Data,\n        maximumArtifactBytes: Int = PassiveBluetoothCaptureArtifactInputPolicy.defaultMaximumArtifactBytes\n    ) throws {\n        try PassiveBluetoothCaptureArtifactInputPolicy.validateByteCount(\n            captureJSON.count,\n            maximumBytes: maximumArtifactBytes\n        )\n        guard report.schemaVersion == PassiveBluetoothTuyaCaptureArtifactReport.currentSchemaVersion else {\n            throw PassiveBluetoothTuyaCaptureArtifactReportVerificationError\n                .unsupportedArtifactSchemaVersion(report.schemaVersion)\n        }\n        guard report.analysis.schemaVersion == PassiveBluetoothTuyaCaptureReport.currentSchemaVersion else {\n            throw PassiveBluetoothTuyaCaptureArtifactReportVerificationError\n                .unsupportedAnalysisSchemaVersion(report.analysis.schemaVersion)\n        }\n        guard report.sourceArtifact.byteCount == captureJSON.count else {\n            throw PassiveBluetoothTuyaCaptureArtifactReportVerificationError\n                .sourceByteCountMismatch(expected: report.sourceArtifact.byteCount, actual: captureJSON.count)\n        }\n        let actualSHA256 = sha256Hex(of: captureJSON)\n        guard report.sourceArtifact.sha256 == actualSHA256 else {\n            throw PassiveBluetoothTuyaCaptureArtifactReportVerificationError\n                .sourceSHA256Mismatch(expected: report.sourceArtifact.sha256, actual: actualSHA256)\n        }\n        let policy = try TuyaCandidateFragmentReassemblyPolicy(\n            maximumEncryptedMessageBytes: report.analysis.analysisPolicy.maximumEncryptedMessageBytes,\n            maximumFragmentCount: report.analysis.analysisPolicy.maximumFragmentCount\n        )\n        let rederived = try make(\n            captureJSON: captureJSON,\n            peripheralIdentifier: report.analysis.capture.peripheralIdentifier,\n            policy: policy,\n            maximumArtifactBytes: maximumArtifactBytes\n        )\n        guard rederived == report else {\n            throw PassiveBluetoothTuyaCaptureArtifactReportVerificationError.rederivedAnalysisMismatch\n        }\n    }\n\n    public static func sha256Hex(of data: Data) -> String {'''
          assert text.count(marker) == 1
          artifact.write_text(text.replace(marker, verifier, 1))

          report_tests = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothTuyaCaptureReportTests.swift')
          text = report_tests.read_text().replace('#expect(report.schemaVersion == 1)', '#expect(report.schemaVersion == 2)', 1)
          marker = '''        #expect(report.capture.totalCaptureRecordCount == 1)\n'''
          replacement = marker + '''        #expect(report.capture.observationBoundaries.isEmpty)\n'''
          assert text.count(marker) == 1
          report_tests.write_text(text.replace(marker, replacement, 1))

          artifact_tests = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothTuyaCaptureArtifactReportTests.swift')
          text = artifact_tests.read_text().replace('#expect(report.schemaVersion == 1)', '#expect(report.schemaVersion == 2)', 1)
          marker = '''        #expect(report.analysis.streams.count == 1)\n\n        let encoded = try report.jsonData(prettyPrinted: false)'''
          replacement = '''        #expect(report.analysis.streams.count == 1)\n        #expect(report.analysis.schemaVersion == 2)\n        try PassiveBluetoothTuyaCaptureArtifactReportBuilder.verify(\n            report,\n            against: compactArtifact\n        )\n\n        let encoded = try report.jsonData(prettyPrinted: false)'''
          assert text.count(marker) == 1
          text = text.replace(marker, replacement, 1)
          insertion_anchor = '''    @Test("advertisement-only artifacts never become target evidence")\n'''
          new_test = '''    @Test("verification rejects a report derived from different exact source bytes")\n    func verificationRejectsDifferentSourceBytes() throws {\n        let session = try makeSession()\n        let compactArtifact = try PassiveBluetoothCaptureJSON.encode(session, prettyPrinted: false)\n        let prettyArtifact = try PassiveBluetoothCaptureJSON.encode(session, prettyPrinted: true)\n        let report = try PassiveBluetoothTuyaCaptureArtifactReportBuilder.make(\n            captureJSON: compactArtifact,\n            policy: policy()\n        )\n\n        #expect(throws: PassiveBluetoothTuyaCaptureArtifactReportVerificationError.self) {\n            try PassiveBluetoothTuyaCaptureArtifactReportBuilder.verify(\n                report,\n                against: prettyArtifact\n            )\n        }\n    }\n\n    @Test("advertisement-only artifacts never become target evidence")\n'''
          assert text.count(insertion_anchor) == 1
          artifact_tests.write_text(text.replace(insertion_anchor, new_test, 1))

          doc = Path('docs/ES80_OFFLINE_CAPTURE_REPORT.md')
          text = doc.read_text()
          text += '''\n\n## V14 schema-v2 recovery\n\nThe current report schema preserves the exact schema-v3 Nembra Ready/Horizon observation boundaries and scoped receipt-sequence provenance used by the current analyzer. These are descriptive software-observation facts only; they are not BLE packets or Experiment One authority.\n\nDerived reports can be mechanically re-verified against the exact capture bytes under the report's declared bounded analysis policy. Re-verification checks the source byte count/SHA-256 and deterministically rebuilds the analysis. This is internal provenance consistency, not a signature, scooter authentication, or physical ES80 proof.\n'''
          doc.write_text(text)
          PY

      - name: Structural validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          report = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothTuyaCaptureReport.swift').read_text()
          artifact = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothTuyaCaptureArtifactReport.swift').read_text()
          package = Path('Packages/NembraBluetoothCapture/Package.swift').read_text()
          required = [
              'currentSchemaVersion = 2',
              'candidatePacketZeroRestart',
              'emptyReceiptSequenceScope',
              'receiptSequenceScopeRequiresSequence',
              'receiptSequenceRequiresScope',
              'receiptOrderingAuthorityChanged',
              'receiptSequenceScopeChanged',
              'nonMonotonicReceiptSequence',
              'receiptSequenceScope: fragment.observation.receiptSequenceScope',
              'receiptSequenceNumber: fragment.observation.receiptSequenceNumber',
              'observationBoundaries: session.observationBoundaries',
          ]
          for token in required:
              assert token in report, token
          assert 'public static func verify(' in artifact
          assert 'rederived == report' in artifact
          assert 'nembra-es80-capture-report' in package
          assert '.executableTarget(' in package
          PY
          git diff --check

      - name: Commit product-only recovery
        run: |
          set -euo pipefail
          git config user.name "nembra-v14-recovery"
          git config user.email "nembra-v14-recovery@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-offline-report-recovery.yml
          git add Packages/NembraBluetoothCapture docs/ES80_OFFLINE_CAPTURE_REPORT.md
          git commit -m "[Capture analyze v14] Recover current-schema offline report"
          git push origin HEAD:${GITHUB_REF_NAME}
