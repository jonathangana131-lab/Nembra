name: TEMP V14 Capture Range Trap Sol

on:
  push:
    branches:
      - diagnostic/v14-capture-range-trap-sol-20260811

permissions:
  contents: read

jobs:
  isolate-macos:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: e406df43e8c01be3ab4bf2f2f0069faff406ccf2
      - name: Bind exact failing product head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e406df43e8c01be3ab4bf2f2f0069faff406ccf2
      - name: Run Capture authority package serially
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p diagnostics
          SWIFT_BACKTRACE=enable=yes swift test \
            --package-path Packages/NembraBluetoothCapture \
            --no-parallel -v 2>&1 | tee diagnostics/swift-test-serial-macos.log
      - name: Upload deterministic crash log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-range-serial-macos-${{ github.sha }}
          path: diagnostics/swift-test-serial-macos.log
          if-no-files-found: error
