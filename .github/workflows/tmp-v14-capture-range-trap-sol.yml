name: TEMP V14 Capture Range Trap Sol

on:
  push:
    branches:
      - diagnostic/v14-capture-range-trap-sol-20260811

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/v14-capture-range-trap-sol-20260811
          fetch-depth: 4
      - name: Bind exact diagnostic product ancestor
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e e406df43e8c01be3ab4bf2f2f0069faff406ccf2^{commit}
          git merge-base --is-ancestor e406df43e8c01be3ab4bf2f2f0069faff406ccf2 HEAD
      - name: Inventory potentially unsafe source slicing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          /usr/bin/python3 - <<'PY' > diagnostics/range-candidates.txt
          from pathlib import Path
          root = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests')
          patterns = ('range(of:', 'Range(', '..<', 'source[', 'section(in:', 'sourceSection', 'slice')
          for path in sorted(root.glob('*.swift')):
              lines = path.read_text(encoding='utf-8').splitlines()
              hits = [i for i,l in enumerate(lines) if any(p in l for p in patterns)]
              if not hits:
                  continue
              print(f'===== {path} =====')
              emitted = set()
              for i in hits:
                  for j in range(max(0, i-4), min(len(lines), i+6)):
                      if j in emitted:
                          continue
                      emitted.add(j)
                      print(f'{j+1:5d}: {lines[j]}')
              print()
          PY
          cat diagnostics/range-candidates.txt
      - name: List package tests
        shell: bash
        run: |
          set -euo pipefail
          cd Packages/NembraBluetoothCapture
          swift test list > ../../diagnostics/test-list.txt 2>&1 || swift test --list-tests > ../../diagnostics/test-list.txt 2>&1
          cat ../../diagnostics/test-list.txt
      - name: Run package serially with verbose test output
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cd Packages/NembraBluetoothCapture
          SWIFT_BACKTRACE=enable=yes swift test --no-parallel -v 2>&1 | tee ../../diagnostics/swift-test-serial.log
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-range-trap-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
