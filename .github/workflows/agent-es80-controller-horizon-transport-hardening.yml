name: agent es80 controller horizon transport hardening
on:
  push:
    branches: ['agent/es80-controller-canonical-boundary-v14']
    paths: ['.github/workflows/agent-es80-controller-horizon-transport-hardening.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/es80-controller-canonical-boundary-v14
          fetch-depth: 0
      - name: Apply Horizon transport hardening
        shell: bash
        run: |
          python3 .nembra/agent-es80-controller-horizon-transport-hardening.py
          git rm .github/workflows/agent-es80-controller-horizon-transport-hardening.yml
          git rm .nembra/agent-es80-controller-horizon-transport-hardening.py
          git config user.name 'nembra-gpt56'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerTerminalTransportIsolationTests.swift
          git commit -m 'fix: isolate closing Horizon from late transport'
          git push origin HEAD:agent/es80-controller-canonical-boundary-v14
