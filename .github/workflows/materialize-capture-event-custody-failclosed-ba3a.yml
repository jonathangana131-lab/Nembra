name: Materialize exact-current Capture event custody hardening

on:
  push:
    branches:
      - review/v14-capture-event-custody-failclosed-ba3a-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'

      - name: Apply fail-closed event custody hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text()

          replacements = [
              (
                  'private func redactedApplicationEventDetails(_ update: [String: String]) -> [String: String] {',
                  'private func redactedApplicationEventDetails(_ update: [String: String]) -> [String: String]? {'
              ),
              ('            return update\n', '            return nil\n'),
          ]
          for old, new in replacements:
              count = app.count(old)
              if count != 1:
                  raise SystemExit(f'expected exact token once: {old!r}; observed {count}')
              app = app.replace(old, new, 1)

          old_assignment = '\n'.join([
              '            redacted[redactedKey] = value.replacingOccurrences(',
              '                of: accountUID,',
              '                with: "<redacted-account-uid>",',
              '                options: [.caseInsensitive, .literal]',
              '            )',
          ])
          new_assignment = '\n'.join([
              '            let redactedValue = value.replacingOccurrences(',
              '                of: accountUID,',
              '                with: "<redacted-account-uid>",',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '',
              '            // Two malformed source keys may collapse after account-UID redaction.',
              '            // Preserve both pieces of application evidence instead of silently overwriting one.',
              '            var uniqueKey = redactedKey',
              '            var collisionSuffix = 2',
              '            while redacted[uniqueKey] != nil {',
              '                uniqueKey = "\\(redactedKey)#\\(collisionSuffix)"',
              '                collisionSuffix += 1',
              '            }',
              '            redacted[uniqueKey] = redactedValue',
          ])
          if app.count(old_assignment) != 1:
              raise SystemExit(f'expected exact redacted assignment once; observed {app.count(old_assignment)}')
          app = app.replace(old_assignment, new_assignment, 1)

          admission_anchor = '        applicationUpdateAdmissionsInFlight += 1\n'
          custody_guard = '\n'.join([
              '        guard var eventDetails = redactedApplicationEventDetails(update) else {',
              '            await invalidateSourceAuthority(',
              '                token: token,',
              '                message: "Verified account UID custody became unavailable before application evidence admission.",',
              '                kind: "application_account_uid_custody_unavailable"',
              '            )',
              '            return',
              '        }',
              '',
          ]) + '\n'
          if app.count(admission_anchor) != 1:
              raise SystemExit(f'expected exact application admission anchor once; observed {app.count(admission_anchor)}')
          app = app.replace(admission_anchor, custody_guard + admission_anchor, 1)

          stale_projection = '            var eventDetails = redactedApplicationEventDetails(update)\n'
          if app.count(stale_projection) != 1:
              raise SystemExit(f'expected stale post-ledger projection once; observed {app.count(stale_projection)}')
          app = app.replace(stale_projection, '', 1)
          app_path.write_text(app)

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift')
          test = test_path.read_text()
          anchor = '        #expect(!receiver.contains("log(\\"tuya_application_update\\", update"))\n'
          addition = '\n'.join([
              '        #expect(!receiver.contains("return update"))',
              '        #expect(receiver.contains("return nil"))',
              '        #expect(receiver.contains("guard var eventDetails = redactedApplicationEventDetails(update) else"))',
              '        #expect(receiver.contains("application_account_uid_custody_unavailable"))',
              '        #expect(receiver.contains("while redacted[uniqueKey] != nil"))',
              '        #expect(receiver.contains("collisionSuffix"))',
              '        let custody = try #require(receiver.range(of: "guard var eventDetails = redactedApplicationEventDetails(update) else"))',
              '        let ledger = try #require(receiver.range(of: "sessionLedger.recordApplicationUpdate"))',
              '        #expect(custody.lowerBound < ledger.lowerBound)',
          ]) + '\n'
          if test.count(anchor) != 1:
              raise SystemExit(f'expected UID source-test anchor once; observed {test.count(anchor)}')
          test = test.replace(anchor, anchor + addition, 1)
          test_path.write_text(test)
          PY

      - name: Verify exact narrow scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          receiver = s[s.index('private func receivedApplicationUpdate('):s.index('private func startWatchdog')]
          assert 'guard var eventDetails = redactedApplicationEventDetails(update) else {' in receiver
          assert receiver.index('guard var eventDetails = redactedApplicationEventDetails(update)') < receiver.index('sessionLedger.recordApplicationUpdate')
          assert 'application_account_uid_custody_unavailable' in receiver
          assert 'return update' not in receiver
          assert 'return nil' in receiver
          assert 'while redacted[uniqueKey] != nil {' in receiver
          assert 'eventDetails["generation"] = String(token.diagnosticGeneration)' in receiver
          assert 'log("tuya_application_update", eventDetails)' in receiver
          PY

      - name: Publish clean hardening checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-event-custody-failclosed-ba3a.yml
          git config user.name 'nembra-sol'
          git config user.email 'nembra-sol@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
                  .github/workflows/materialize-capture-event-custody-failclosed-ba3a.yml
          git diff --cached --check
          git commit -m 'fix(capture): fail closed accepted event UID custody'
          git push origin HEAD:review/v14-capture-event-custody-failclosed-ba3a-sol
