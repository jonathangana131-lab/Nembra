name: Capture Field Installer Info Exclude 2876 Validation

on:
  push:
    branches:
      - validation/v14-field-installer-info-exclude-2876-r2-sol-20260811
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_field_installer_info_exclude_2876.py
      - .github/workflows/capture-field-installer-info-exclude-2876-validation.yml

permissions:
  contents: read

jobs:
  info-exclude-closure:
    name: Replay info-exclude injection against current #2876
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile validation
        run: python3 -m py_compile scripts/ci/tests/test_capture_field_installer_info_exclude_2876.py
      - name: Replay info-exclude attack and require closure
        run: python3 -I scripts/ci/tests/test_capture_field_installer_info_exclude_2876.py
      - name: Validate installer syntax
        run: bash -n scripts/field/install_one_time_capture.command
