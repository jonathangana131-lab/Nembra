name: Capture authority V4 recovery materializer

on:
  push:
    branches:
      - recovery/capture-authority-v4-source-contract-gpt56sol-20260820
    paths:
      - .github/workflows/capture-authority-v4-recovery.yml

permissions:
  contents: write

concurrency:
  group: capture-authority-v4-recovery
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      TARGET_BRANCH: recovery/capture-authority-v4-source-contract-gpt56sol-20260820
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      AUTHORING_WORKFLOW: .github/workflows/capture-carrier-authority-v2-materialize-once.yml
      MATERIALIZER: scripts/ci/materialize_capture_authority_v4_recovery.py
      SELF_WORKFLOW: .github/workflows/capture-authority-v4-recovery.yml
      DIAGNOSTIC: .github/capture-authority-v4-diagnostic.txt
      EXPECTED_SOURCE_BLOB: 627c17949d15aaf26ca28c12abb9bb684ab0e731
      EXPECTED_AUTHORING_BLOB: 59d38ec605728302604ed2b3321b6bd4558dbdda
    steps:
      - name: Checkout immutable V4 seed
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact reviewed carrier subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse HEAD:"$AUTHORING_WORKFLOW")" = "$EXPECTED_AUTHORING_BLOB"
          test -f "$MATERIALIZER"
          test -f 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFieldAuthorizationAppWiringSourceTests.swift'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize reviewed lifecycle into real app source
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I "$MATERIALIZER"
          changed="$(git status --porcelain=v1 | awk '{print $2}' | sort)"
          test "$changed" = "$APP_SOURCE"
          git diff --check

      - name: Run fail-closed lifecycle and app-source contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$DIAGNOSTIC"
          tmp="${RUNNER_TEMP}/capture-authority-v4"
          mkdir -p "$tmp"

          set +e
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py >"$tmp/lifecycle.log" 2>&1
          lifecycle=$?
          (cd Packages/NembraBluetoothCapture && swift test --filter AuthenticatedStationaryCaptureAppSessionTests) >"$tmp/session.log" 2>&1
          session=$?
          (cd Packages/NembraBluetoothCapture && swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring) >"$tmp/app-wiring.log" 2>&1
          app_wiring=$?
          (cd Packages/NembraBluetoothCapture && swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter) >"$tmp/inbox.log" 2>&1
          inbox=$?
          (cd Packages/NembraBluetoothCapture && swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests) >"$tmp/artifact-freeze.log" 2>&1
          artifact_freeze=$?
          set -e

          for log in lifecycle session app-wiring inbox artifact-freeze; do
            printf '\n===== %s =====\n' "$log"
            cat "$tmp/$log.log"
          done

          if (( lifecycle != 0 || session != 0 || app_wiring != 0 || inbox != 0 || artifact_freeze != 0 )); then
            {
              printf 'CAPTURE_AUTHORITY_V4_DIAGNOSTIC\n'
              printf 'seed=%s\n' '${{ github.sha }}'
              printf 'physicalAuthorityCreated=false\n'
              printf 'lifecycle=%d session=%d app_wiring=%d inbox=%d artifact_freeze=%d\n' "$lifecycle" "$session" "$app_wiring" "$inbox" "$artifact_freeze"
              for log in lifecycle session app-wiring inbox artifact-freeze; do
                printf '\n===== %s =====\n' "$log"
                cat "$tmp/$log.log"
              done
            } > "$DIAGNOSTIC"
            git fetch origin "$TARGET_BRANCH"
            test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
            git add -- "$DIAGNOSTIC"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test(capture): record V4 contract failure [skip ci]'
            git push origin HEAD:"$TARGET_BRANCH"
            exit 1
          fi

      - name: Verify no authority bypasses
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'advanceInboxHandoffIfAvailable()' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage != .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'AuthenticatedStationaryCaptureAttemptCapability' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'AuthenticatedStationaryCaptureCapabilityGate' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'publishDps' "$APP_SOURCE")" = 0

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NembraCaptureAuthorityV4" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish only the exact tested V4 descendant
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          rm "$SELF_WORKFLOW" "$MATERIALIZER"
          git add -- "$APP_SOURCE" "$SELF_WORKFLOW" "$MATERIALIZER"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n%s\n' "$APP_SOURCE" "$MATERIALIZER" "$SELF_WORKFLOW" | sort)"
          test "$staged" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(capture): materialize authorized lifecycle V4 [skip ci]'
          materialized="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'CAPTURE_AUTHORITY_V4_MATERIALIZED=%s seed=%s physicalAuthorityCreated=false\n' "$materialized" "${{ github.sha }}"
