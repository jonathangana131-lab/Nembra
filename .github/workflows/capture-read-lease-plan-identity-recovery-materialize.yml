name: Capture Read Lease Planned Identity Recovery Materializer

on:
  push:
    branches:
      - hardening/v17-capture-read-lease-plan-identity-recovery-sol-20260814
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-read-lease-plan-identity-recovery-materialize-${{ github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 64d3433e2ae5a507ec685e6703996bb8e7aec868
  MATERIALIZER: .github/workflows/capture-read-lease-plan-identity-recovery-materialize.yml
  PERMANENT_WORKFLOW: .github/workflows/capture-private-read-lease-planned-identity.yml
  TEST_PATH: scripts/ci/tests/test_capture_private_read_lease_planned_identity.py
  HELPER_PATH: scripts/ci/capture_selected_xcode_build_orchestrator.py
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  materialize:
    name: Materialize frozen plan-to-open object identity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact authoring state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = "$MATERIALIZER"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize planned-identity repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          source = helper.read_text(encoding="utf-8")

          # Keep the accepted path-enumeration contract intact. Add one explicit
          # authority snapshot that freezes type/device/inode before any ACL open.
          plan_anchor = "\ndef _acl_text(principal: str, is_directory: bool, host_only: bool) -> str:\n"
          if source.count(plan_anchor) != 1 or "def _lease_plan(" in source:
              raise SystemExit("planned-identity recovery could not bind the planning seam")
          plan_function = textwrap.dedent('''\

          def _lease_plan(
              subjects: Sequence[Path], repo: Path
          ) -> tuple[tuple[Path, bool, bool, tuple[int, int, int]], ...]:
              """Freeze every selected lease object's identity before grant opens any subject."""
              planned: list[tuple[Path, bool, bool, tuple[int, int, int]]] = []
              for path, host_only in _lease_paths(subjects, repo):
                  signature = _path_signature(path)
                  is_directory = signature[2] == stat.S_IFDIR
                  if not is_directory and signature[2] != stat.S_IFREG:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease plan targeted unsupported type: {path}"
                      )
                  planned.append((path, host_only, is_directory, signature))
              return tuple(planned)
          ''')
          source = source.replace(plan_anchor, plan_function + plan_anchor, 1)

          open_start = "def _open_pinned_path(path: Path, is_directory: bool) -> int:\n"
          open_end = "\ndef _descriptor_path(descriptor: int) -> str:\n"
          if source.count(open_start) != 1 or source.count(open_end) != 1:
              raise SystemExit("planned-identity recovery could not bind the opener seam")
          start = source.index(open_start)
          end = source.index(open_end, start)
          old_open = source[start:end]
          if "dir_fd=current" not in old_open or "expected_signature" in old_open:
              raise SystemExit("planned-identity recovery found an unexpected component-walk opener")
          new_open = textwrap.dedent('''\
          def _open_pinned_path(
              path: Path,
              is_directory: bool,
              expected_signature: tuple[int, int, int] | None = None,
          ) -> int:
              """Open an absolute lease subject without following components or changing planned identity."""
              path = _absolute_lexical(path)
              parts = path.parts
              if len(parts) < 2 or parts[0] != os.sep:
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease path has no admissible absolute component walk: {path}"
                  )
              if os.open not in os.supports_dir_fd:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease component walk requires openat/dir_fd support"
                  )
              nofollow = getattr(os, "O_NOFOLLOW", 0)
              odirectory = getattr(os, "O_DIRECTORY", 0)
              if nofollow == 0 or odirectory == 0:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease component walk requires O_NOFOLLOW and O_DIRECTORY"
                  )

              common = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | nofollow
              current = -1
              descriptor = -1
              try:
                  current = os.open(
                      os.sep,
                      os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | odirectory,
                  )
                  for index, component in enumerate(parts[1:]):
                      if component in ("", ".", "..") or os.sep in component:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease path contains an unsafe component: {path}"
                          )
                      final = index == len(parts) - 2
                      flags = common
                      if not final or is_directory:
                          flags |= odirectory
                      try:
                          next_descriptor = os.open(component, flags, dir_fd=current)
                      except OSError as error:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease component could not be pinned without following links: {path}"
                          ) from error
                      os.close(current)
                      current = next_descriptor

                  descriptor = current
                  current = -1
                  mode = os.fstat(descriptor).st_mode
                  if is_directory != stat.S_ISDIR(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease descriptor type disagrees with plan: {path}"
                      )
                  if not is_directory and not stat.S_ISREG(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease file descriptor is not regular: {path}"
                      )
                  opened_signature = _descriptor_signature(descriptor)
                  if expected_signature is not None and opened_signature != expected_signature:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease object identity changed after planning: {path}"
                      )
                  # Full-path lookup remains diagnostic after descriptor/object selection.
                  if opened_signature != _path_signature(path):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease pathname changed during anchored component walk: {path}"
                      )
                  result = descriptor
                  descriptor = -1
                  return result
              except Exception:
                  if current >= 0:
                      os.close(current)
                  if descriptor >= 0:
                      os.close(descriptor)
                  raise
          ''')
          source = source[:start] + new_open + source[end:]

          grant_start = "            for path, host_only in _lease_paths(self._subjects, self._repository):\n"
          grant_last = "                descriptor = _open_pinned_path(path, is_directory)\n"
          if source.count(grant_start) != 1 or source.count(grant_last) != 1:
              raise SystemExit("planned-identity recovery could not bind the grant admission seam")
          start = source.index(grant_start)
          end = source.index(grant_last, start) + len(grant_last)
          replacement = (
              "            for path, host_only, is_directory, expected_signature in _lease_plan(\n"
              "                self._subjects, self._repository\n"
              "            ):\n"
              "                descriptor = _open_pinned_path(\n"
              "                    path, is_directory, expected_signature\n"
              "                )\n"
          )
          source = source[:start] + replacement + source[end:]

          after_start = "                if _descriptor_signature(descriptor) != _path_signature(path):\n"
          after_end = "                        f\"private read-lease pathname changed after grant: {path}\"\n                    )\n"
          if source.count(after_start) != 1 or source.count(after_end) != 1:
              raise SystemExit("planned-identity recovery could not bind the post-grant seam")
          start = source.index(after_start)
          end = source.index(after_end, start) + len(after_end)
          replacement = (
              "                if _descriptor_signature(descriptor) != expected_signature:\n"
              "                    raise SelectedXcodeBuildOrchestratorError(\n"
              "                        f\"private read-lease opened object changed after grant: {path}\"\n"
              "                    )\n"
              "                if _descriptor_signature(descriptor) != _path_signature(path):\n"
              "                    raise SelectedXcodeBuildOrchestratorError(\n"
              "                        f\"private read-lease pathname changed after grant: {path}\"\n"
              "                    )\n"
          )
          source = source[:start] + replacement + source[end:]

          helper.write_text(source, encoding="utf-8")
          PY

          cat > "$TEST_PATH" <<'PY'
          #!/usr/bin/env python3
          """Regression for private read-lease plan-to-open object identity continuity."""
          from __future__ import annotations

          import importlib.util
          import inspect
          import os
          from pathlib import Path
          import stat
          import tempfile
          import unittest

          REPO = Path(__file__).resolve().parents[3]
          HELPER = REPO / "scripts/ci/capture_selected_xcode_build_orchestrator.py"


          def load():
              spec = importlib.util.spec_from_file_location("nembra_planned_identity", HELPER)
              if spec is None or spec.loader is None:
                  raise RuntimeError("could not load selected-Xcode orchestrator")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          class CapturePrivateReadLeasePlannedIdentityTests(unittest.TestCase):
              def test_exact_planned_identity_still_opens(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-planned-identity-control-") as raw:
                      path = Path(raw) / "a/b"
                      path.mkdir(parents=True)
                      expected = helper._path_signature(path)
                      descriptor = helper._open_pinned_path(path, True, expected)
                      try:
                          self.assertEqual(helper._descriptor_signature(descriptor), expected)
                      finally:
                          os.close(descriptor)

              def test_real_directory_replacement_is_rejected_against_frozen_identity(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-planned-identity-swap-") as raw:
                      repo = Path(raw) / "repo"
                      subject = repo / "LocalSecrets/TuyaSDK/Build"
                      subject.mkdir(parents=True)
                      plan = helper._lease_plan((subject,), repo)
                      planned = {path: signature for path, _host, _directory, signature in plan}
                      self.assertIn(subject, planned)

                      sdk = repo / "LocalSecrets/TuyaSDK"
                      sdk.rename(repo / "LocalSecrets/TuyaSDK.accepted")
                      replacement = repo / "LocalSecrets/TuyaSDK/Build"
                      replacement.mkdir(parents=True)
                      for path in (replacement.parent, replacement):
                          metadata = path.lstat()
                          self.assertTrue(stat.S_ISDIR(metadata.st_mode))
                          self.assertFalse(stat.S_ISLNK(metadata.st_mode))
                      self.assertNotEqual(planned[subject], helper._path_signature(replacement))

                      with self.assertRaisesRegex(
                          helper.SelectedXcodeBuildOrchestratorError,
                          "object identity changed after planning",
                      ):
                          helper._open_pinned_path(subject, True, planned[subject])

              def test_grant_rejects_replacement_before_acl_mutation(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-planned-identity-grant-") as raw:
                      repo = Path(raw) / "repo"
                      subject = repo / "LocalSecrets/TuyaSDK/Build"
                      subject.mkdir(parents=True)
                      original_plan = helper._lease_plan

                      def raced_plan(subjects, repository):
                          plan = original_plan(subjects, repository)
                          sdk = repo / "LocalSecrets/TuyaSDK"
                          sdk.rename(repo / "LocalSecrets/TuyaSDK.accepted")
                          replacement = repo / "LocalSecrets/TuyaSDK/Build"
                          replacement.mkdir(parents=True)
                          return plan

                      helper._lease_plan = raced_plan
                      helper._chmod_acl = lambda *_args, **_kwargs: self.fail("ACL mutation must not occur")
                      lease = helper._PrivateReadLease((subject,), repo)
                      with self.assertRaisesRegex(
                          helper.SelectedXcodeBuildOrchestratorError,
                          "object identity changed after planning",
                      ):
                          lease.grant("nembra_plan_identity")
                      self.assertEqual(lease._opened, [])
                      self.assertEqual(lease._principal, "")

              def test_plan_freezes_supported_type_and_signature(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-planned-identity-shape-") as raw:
                      repo = Path(raw) / "repo"
                      subject = repo / "LocalSecrets/TuyaSDK/Build"
                      subject.mkdir(parents=True)
                      plan = helper._lease_plan((subject,), repo)
                      self.assertTrue(plan)
                      for path, _host, is_directory, signature in plan:
                          self.assertEqual(signature, helper._path_signature(path))
                          self.assertEqual(is_directory, signature[2] == stat.S_IFDIR)

              def test_legacy_path_projection_and_new_opener_contract_are_explicit(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-planned-identity-projection-") as raw:
                      repo = Path(raw) / "repo"
                      subject = repo / "LocalSecrets/TuyaSDK/Build"
                      subject.mkdir(parents=True)
                      legacy = helper._lease_paths((subject,), repo)
                      plan = helper._lease_plan((subject,), repo)
                      self.assertEqual(
                          legacy,
                          tuple((path, host_only) for path, host_only, _is_directory, _signature in plan),
                      )
                  self.assertEqual(
                      tuple(inspect.signature(helper._open_pinned_path).parameters),
                      ("path", "is_directory", "expected_signature"),
                  )


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          PY

          cat > "$PERMANENT_WORKFLOW" <<'YML'
          name: Capture Private Read Lease Planned Identity

          on:
            pull_request:
              paths:
                - scripts/ci/capture_selected_xcode_build_orchestrator.py
                - scripts/ci/tests/test_capture_private_read_lease_planned_identity.py
                - .github/workflows/capture-private-read-lease-planned-identity.yml
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: capture-private-read-lease-planned-identity-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          env:
            EXACT_PARENT: 64d3433e2ae5a507ec685e6703996bb8e7aec868
            PYTHONDONTWRITEBYTECODE: 1

          jobs:
            planned-identity:
              name: Reject plan-to-open object replacement (${{ matrix.os }})
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, macos-15]
              runs-on: ${{ matrix.os }}
              timeout-minutes: 7
              steps:
                - uses: actions/checkout@v6
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0
                    persist-credentials: false

                - name: Bind exact serial child delta
                  shell: bash
                  run: |
                    set -euo pipefail
                    expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "$expected_head"
                    test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
                    changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
                    expected="$(printf '%s\n' \
                      .github/workflows/capture-private-read-lease-planned-identity.yml \
                      scripts/ci/capture_selected_xcode_build_orchestrator.py \
                      scripts/ci/tests/test_capture_private_read_lease_planned_identity.py | LC_ALL=C sort)"
                    test "$changed" = "$expected"
                    git diff --check "$EXACT_PARENT"...HEAD
                    test -z "$(git status --porcelain=v1 --untracked-files=all)"

                - name: Compile exact sources without bytecode artifacts
                  shell: bash
                  run: |
                    set -euo pipefail
                    /usr/bin/python3 -B -I - <<'PY'
                    from pathlib import Path
                    for raw in (
                        "scripts/ci/capture_selected_xcode_build_orchestrator.py",
                        "scripts/ci/tests/test_capture_private_read_lease_planned_identity.py",
                    ):
                        path = Path(raw)
                        compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
                    PY

                - name: Prove planned object identity continuity
                  run: /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_planned_identity.py

                - name: Preserve component-walk and lease regressions
                  shell: bash
                  run: |
                    set -euo pipefail
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
                    test -z "$(git status --porcelain=v1 --untracked-files=all)"

                - name: Preserve truth boundary
                  run: echo "NEMBRA_PLANNED_IDENTITY_BOUNDARY productionLeaseChanged=true signingAuthorityCreated=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false"
          YML

          git diff --check
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              "scripts/ci/capture_selected_xcode_build_orchestrator.py",
              "scripts/ci/tests/test_capture_private_read_lease_planned_identity.py",
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          PY
          /usr/bin/python3 -B -I "$TEST_PATH"
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          test -z "$(find scripts/ci -name '__pycache__' -o -name '*.pyc' -print -quit)"

      - name: Publish permanent exact child
        shell: bash
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$HEAD_REF"
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git rm "$MATERIALIZER"
          git add "$HELPER_PATH" "$TEST_PATH" "$PERMANENT_WORKFLOW"
          git diff --cached --check
          staged="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected_staged="$(printf '%s\n' \
            "$MATERIALIZER" \
            "$PERMANENT_WORKFLOW" \
            "$HELPER_PATH" \
            "$TEST_PATH" | LC_ALL=C sort)"
          test "$staged" = "$expected_staged"
          git commit -m 'capture: bind private lease to planned object identity'
          permanent="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected_permanent="$(printf '%s\n' \
            "$PERMANENT_WORKFLOW" \
            "$HELPER_PATH" \
            "$TEST_PATH" | LC_ALL=C sort)"
          test "$permanent" = "$expected_permanent"
          git push origin "HEAD:$HEAD_REF"
