name: Capture Fold Postcheck Parent Revalidation Once

on:
  push:
    branches:
      - repair/v17-capture-postcheck-parent-revalidation-682e-sol-20260815
    paths:
      - .github/workflows/capture-fold-postcheck-parent-revalidation-once.yml

permissions:
  contents: write

env:
  EXACT_PARENT: 682e0370394b7e38c1d969c361f3e7de94afc891

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-postcheck-parent-revalidation-682e-sol-20260815
          fetch-depth: 0

      - name: Bind exact authoring delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-fold-postcheck-parent-revalidation-once.yml \
            scripts/ci/fold_postcheck_parent_revalidation_once.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Apply exact postcheck repair transform
        run: python3 scripts/ci/fold_postcheck_parent_revalidation_once.py

      - name: Verify permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish permanent two-path repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git rm \
            scripts/ci/fold_postcheck_parent_revalidation_once.py \
            .github/workflows/capture-fold-postcheck-parent-revalidation-once.yml
          staged="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-fold-postcheck-parent-revalidation-once.yml \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/fold_postcheck_parent_revalidation_once.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$staged" = "$expected"
          git diff --cached --check
          git commit -m "fix(capture): revalidate cached parents after child admission"
          git push origin HEAD:repair/v17-capture-postcheck-parent-revalidation-682e-sol-20260815
