name: ES80 Power-Cycle Current Runtime QA

on:
  push:
    branches:
      - 'cell/es80-power-cycle-current-runtime/ci/**'

permissions:
  contents: read

concurrency:
  group: nembra-es80-power-cycle-current-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test current-runtime power-cycle composition
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify immutable checkout and exact product parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "598712defcd633ae43b6de0dc6d4f328bc1e2f8f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/es80-power-cycle-current-runtime-qa.yml"

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Guard passive package against application writes
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 research package must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

      - name: Test NembraBluetoothCapture with warnings as errors
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Build NembraBluetoothCapture for iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
