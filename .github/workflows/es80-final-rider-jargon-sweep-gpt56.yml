name: ES80 final rider jargon sweep

on:
  push:
    branches:
      - product/es80-v14-final-rider-jargon-sweep-gpt56
    paths:
      - .github/workflows/es80-final-rider-jargon-sweep-gpt56.yml

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/es80-v14-final-rider-jargon-sweep-gpt56
          fetch-depth: 0
      - name: Apply reviewed rider-copy sweep
        run: python3 scripts/ci/es80_final_rider_jargon_sweep_gpt56.py
      - name: Validate product diff
        run: |
          git diff --check
          grep -F 'OFF / ON checks, connection, capture, and sealing' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'then begin this Bluetooth check.' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'signal matching and read-only capture' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'Begin read-only observation' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'Verify Capture file' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'return "Capture locked"' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'These OFF / ON checks were interrupted. Start a fresh capture.' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'remaining field, ready, completion, and error copy avoids research jargon' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CapturePrimaryProgressRiderLanguageAcceptanceTests.swift
      - name: Commit clean product checkpoint
        env:
          TARGET_BRANCH: product/es80-v14-final-rider-jargon-sweep-gpt56
        run: |
          rm .github/workflows/es80-final-rider-jargon-sweep-gpt56.yml
          rm scripts/ci/es80_final_rider_jargon_sweep_gpt56.py
          git config user.name "nembra-gpt56-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/Features/Research/ES80CaptureShellView.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CapturePrimaryProgressRiderLanguageAcceptanceTests.swift \
                  .github/workflows/es80-final-rider-jargon-sweep-gpt56.yml \
                  scripts/ci/es80_final_rider_jargon_sweep_gpt56.py
          git commit -m "[Capture product v14] Remove final rider-facing research jargon"
          git push origin "HEAD:${TARGET_BRANCH}"
