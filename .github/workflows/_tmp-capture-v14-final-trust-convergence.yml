name: Temporary Capture V14 Final Trust Convergence

on:
  push:
    branches:
      - staging/v14-capture-final-trust-convergence/gpt56-go

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Generate, test, and publish exact convergence blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip -d > /tmp/final_trust_gen.py
          python3 /tmp/final_trust_gen.py
