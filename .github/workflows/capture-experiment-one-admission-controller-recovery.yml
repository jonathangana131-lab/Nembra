name: Capture Experiment One admission controller recovery

on:
  push:
    branches:
      - integration/es80-v14-admission-controller-recovery/chatgpt56-go
    paths:
      - .github/workflows/capture-experiment-one-admission-controller-recovery.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: integration/es80-v14-admission-controller-recovery/chatgpt56-go

      - name: Assert exact recovery staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a7bec258ce9b76eecba9a3203eea190d9ea37193"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-experiment-one-admission-controller-recovery.yml"
          test -f scripts/ci/apply_es80_experiment_one_admission_controller_recovery.py
          test -f .github/workflows/capture-experiment-one-admission-controller-integration.yml

      - name: Apply reviewed controller transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/apply_es80_experiment_one_admission_controller_recovery.py
          git diff --check

          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          test "$(grep -c 'using admission: PassiveBluetoothExperimentOneCaptureAdmission' "$controller")" = "1"
          test "$(grep -c 'let payload = try admission.consume()' "$controller")" = "1"
          test "$(grep -c 'private var experimentOneCaptureAuthority' "$controller")" = "1"
          test "$(grep -c 'recorder: payload.recorder' "$controller")" = "1"
          test "$(grep -c 'experimentOneAuthority: nil' "$controller")" = "1"
          test "$(grep -c 'latestDiscoveryByIdentifier\[peripheralIdentifier\] != nil' "$controller")" = "1"
          test "$(grep -c 'PassiveCoreBluetoothCaptureRecorder(' "$controller")" = "1"
          test "$(grep -c 'private func publishTargetSession' "$controller")" = "1"
          test "$(grep -c 'artifactAuthorityFence.transition(' "$controller")" -ge "2"
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneAdmissionTests.swift

      - name: Remove staging machinery and commit product result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-experiment-one-admission-controller-integration.yml
          rm .github/workflows/capture-experiment-one-admission-controller-recovery.yml
          rm scripts/ci/apply_es80_experiment_one_admission_controller_recovery.py

          git diff --check
          git config user.name "nembra-v14-swarm"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(capture): recover sealed Experiment One admission consumer"
          git push origin HEAD:integration/es80-v14-admission-controller-recovery/chatgpt56-go
