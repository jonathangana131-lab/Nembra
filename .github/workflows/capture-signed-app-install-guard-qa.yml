name: Capture Signed App Install Guard QA

on:
  push:
    branches:
      - repair/v14-capture-signed-app-install-window-sol
  pull_request:
    paths:
      - scripts/ci/capture_signed_app_install_guard.py
      - scripts/ci/tests/test_capture_signed_app_install_guard.py
      - scripts/ci/tests/test_capture_signed_app_install_subject.py
      - scripts/field/install_one_time_capture.command
      - scripts/field/verify_install_capture_app.command
      - .github/workflows/capture-signed-app-install-guard-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-guard:
    name: Reject signed app install-window substitution
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile and syntax-check custody implementation
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/capture_signed_app_install_guard.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_signed_app_install_guard.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_signed_app_install_subject.py
          bash -n scripts/field/install_one_time_capture.command
          bash -n scripts/field/verify_install_capture_app.command
          git diff --check

      - name: Exercise install-window custody adversarially
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_guard.py

      - name: Require exact-source guarded installer wiring
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_subject.py
