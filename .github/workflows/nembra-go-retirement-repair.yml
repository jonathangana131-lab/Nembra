name: Nembra GO Retirement Repair

on:
  push:
    branches:
      - repair/v14-signed-origin-dedicated-uid-apfs-sol-20260812
    paths:
      - .github/workflows/nembra-go-retirement-repair.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: repair/v14-signed-origin-dedicated-uid-apfs-sol-20260812

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind repair input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "e72099137463d93bda486e987a6ea8726c540140"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply exact fail-closed repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          production = Path("scripts/ci/capture_signed_app_build_origin_custody.py")
          source = production.read_text(encoding="utf-8")

          old_pkill = '["/usr/bin/pkill", "-9", "-u", str(uid)]'
          new_pkill = '["/usr/bin/pkill", "-9", "-u", str(uid), ".*"]'
          if source.count(old_pkill) != 1:
              raise SystemExit(f"expected exactly one ambiguous pkill call, found {source.count(old_pkill)}")
          source = source.replace(old_pkill, new_pkill)

          old_partial_cleanup = "except Exception:\n        _remove_local_build_identity(name, uid)\n        raise"
          new_partial_cleanup = "except Exception:\n        _remove_local_build_identity(name, uid, require_absent=True)\n        raise"
          if source.count(old_partial_cleanup) != 1:
              raise SystemExit("partial identity-creation cleanup shape moved")
          source = source.replace(old_partial_cleanup, new_partial_cleanup)
          production.write_text(source, encoding="utf-8")

          tests = Path("scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py")
          test_source = tests.read_text(encoding="utf-8")

          old_credential_assert = '        self.assertIn("**_structured_credentials(build_uid, build_gid, ())", source)\n'
          new_credential_assert = '        self.assertIn("**_structured_credentials(uid, gid, ())", source)\n'
          if test_source.count(old_credential_assert) != 1:
              raise SystemExit("stale credential source assertion shape moved")
          test_source = test_source.replace(old_credential_assert, new_credential_assert)

          old_environment_assert = "        self.assertTrue(set(poison).isdisjoint(environment))\n"
          new_environment_assert = (
              '        rejected_selector_keys = set(poison) - {"LANG", "LC_ALL"}\n'
              '        self.assertTrue(rejected_selector_keys.isdisjoint(environment))\n'
              '        self.assertNotEqual(environment["LANG"], poison["LANG"])\n'
              '        self.assertNotEqual(environment["LC_ALL"], poison["LC_ALL"])\n'
          )
          if test_source.count(old_environment_assert) != 1:
              raise SystemExit("stale build-environment source assertion shape moved")
          test_source = test_source.replace(old_environment_assert, new_environment_assert)

          retirement_anchor = '        self.assertIn("_wait_for_no_live_uid(uid)", source)\n'
          retirement_regressions = (
              retirement_anchor
              + '        self.assertIn(\'["/usr/bin/pkill", "-9", "-u", str(uid), ".*"]\', source)\n'
              + '        self.assertIn("_remove_local_build_identity(name, uid, require_absent=True)", source)\n'
          )
          if test_source.count(retirement_anchor) != 1:
              raise SystemExit("retirement regression anchor moved")
          test_source = test_source.replace(retirement_anchor, retirement_regressions)
          tests.write_text(test_source, encoding="utf-8")
          PY

      - name: Run focused source acceptance
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-go-pycache"
          python3 -m py_compile \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          python3 -m unittest scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          git diff --check

      - name: Commit repaired carrier and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/nembra-go-retirement-repair.yml
          git diff --check
          git status --short
          git config user.name "nembra-go-worker"
          git config user.email "nembra-go-worker@users.noreply.github.com"
          git add \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py \
            .github/workflows/nembra-go-retirement-repair.yml
          git diff --cached --check
          git commit -m "Capture: harden dedicated build principal retirement"
          git push origin "HEAD:${TARGET_BRANCH}"
