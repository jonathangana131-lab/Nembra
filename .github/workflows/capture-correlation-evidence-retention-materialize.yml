name: Capture correlation evidence retention materializer

on:
  push:
    branches:
      - agent/v14-capture-correlation-evidence-retention-sol
    paths:
      - .github/workflows/capture-correlation-evidence-retention-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v14-capture-correlation-evidence-retention-sol
          fetch-depth: 0

      - name: Bind exact parent lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1558e1bf38c2aad809887a77a3bc4cabe1704e39 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply completed-correlation authority repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          s = path.read_text()

          def bounds(text, start, end):
              a = text.find(start)
              if a < 0: raise SystemExit(f"missing section start: {start}")
              b = text.find(end, a + len(start))
              if b < 0: raise SystemExit(f"missing section end: {end}")
              return a, b

          # View-exit completed state: there is no live package lease after final-window sealing,
          # so this branch must precede the in-progress transport guard.
          ea, eb = bounds(s, "    func abandonCorrelationForViewExit() {", "    func appDidLoseForeground() {")
          exit_block = s[ea:eb]
          if "        if phase == .correlated || phase == .selected {" in exit_block:
              raise SystemExit("completed view-exit branch already exists; refusing ambiguous patch")
          guard_token = "        guard processCorrelationLease != nil || correlationSession != nil else { return }"
          gi = exit_block.find(guard_token)
          if gi < 0: raise SystemExit("view-exit in-progress guard changed")
          completed_view = (
              "        if phase == .correlated || phase == .selected {\n"
              "            // The four-window result is already sealed and package transport is retired. Revoke\n"
              "            // only reusable target authority; keep completed receipts for failed diagnostics.\n"
              "            pendingCorrelatedTargetID = nil\n"
              "            selectedID = nil\n"
              "            targetCorrelationOperatorConfirmed = false\n"
              "            phase = .failed\n"
              "            message = \"Capture left Secure Link after Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; the completed correlation remains diagnostic evidence only and cannot be reused as target authority.\"\n"
              "            log(\"target_correlation_abandoned_on_view_exit\")\n"
              "            return\n"
              "        }\n\n"
          )
          exit_block = exit_block[:gi] + completed_view + exit_block[gi:]
          s = s[:ea] + exit_block + s[eb:]

          # Foreground completed state: replace only this branch. The preceding live scanner branch
          # deliberately keeps resetDiscoverySessionOnly() for scanner-first retirement.
          fa, fb = bounds(s, "    func appDidLoseForeground() {", "    var privateConfig: Bool")
          foreground = s[fa:fb]
          ca = foreground.find("        if phase == .correlated || phase == .selected {")
          if ca < 0: raise SystemExit("foreground completed-correlation branch missing")
          cb = foreground.find("        guard let token = currentConnectionToken else {", ca)
          if cb < 0: raise SystemExit("foreground post-correlation guard missing")
          old_completed = foreground[ca:cb]
          if "resetDiscoverySessionOnly()" not in old_completed:
              raise SystemExit("foreground completed branch no longer matches expected red state")
          new_completed = (
              "        if phase == .correlated || phase == .selected {\n"
              "            // Final-window sealing already retires the package scanner/lease. Revoke reusable\n"
              "            // target authority without deleting the legitimate completed four-window evidence.\n"
              "            pendingCorrelatedTargetID = nil\n"
              "            selectedID = nil\n"
              "            targetCorrelationOperatorConfirmed = false\n"
              "            phase = .failed\n"
              "            message = \"Capture left the foreground after Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; the completed correlation remains diagnostic evidence only and cannot cross a foreground-integrity break as target authority.\"\n"
              "            log(\"foreground_integrity_lost_after_target_correlation\")\n"
              "            return\n"
              "        }\n\n"
          )
          foreground = foreground[:ca] + new_completed + foreground[cb:]
          s = s[:fa] + foreground + s[fb:]
          path.write_text(s)
          PY
          git diff --check

      - name: Verify exact evidence-retention contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          def section(text, start, end):
              a=text.index(start); b=text.index(end, a+len(start)); return text[a:b]
          exit_block=section(s,"    func abandonCorrelationForViewExit() {","    func appDidLoseForeground() {")
          exit_completed=section(exit_block,"        if phase == .correlated || phase == .selected {","        guard processCorrelationLease != nil || correlationSession != nil else { return }")
          foreground=section(s,"    func appDidLoseForeground() {","    var privateConfig: Bool")
          foreground_completed=section(foreground,"        if phase == .correlated || phase == .selected {","        guard let token = currentConnectionToken else {")
          for label,block in (("view",exit_completed),("foreground",foreground_completed)):
              for token in ("pendingCorrelatedTargetID = nil","selectedID = nil","targetCorrelationOperatorConfirmed = false","phase = .failed","Restart from OFF1"):
                  assert token in block, (label,token)
              for token in ("resetDiscoverySessionOnly()","correlationProvenance = nil","targetCorrelationMethod = nil","targetCorrelationWindowCount = nil","candidates.removeAll()"):
                  assert token not in block, (label,token)
          assert "target_correlation_abandoned_on_view_exit" in exit_completed
          assert "foreground_integrity_lost_after_target_correlation" in foreground_completed
          in_progress=section(foreground,"        if processCorrelationLease != nil || correlationSession != nil {","        if phase == .correlated || phase == .selected {")
          assert "resetDiscoverySessionOnly()" in in_progress
          begin=section(s,"    private func beginCorrelationSeries() {","    func startNextCorrelationWindow() {")
          assert "resetDiscoverySessionOnly()" in begin and "OfficialTuyaFactory.packageCorrelationMayStart" in begin
          export=section(s,"    private func makeExport(exportedAt:","    func prepareExport()")
          for token in ("targetCorrelationMethod: targetCorrelationMethod","targetCorrelationWindowCount: targetCorrelationWindowCount","targetCorrelationOperatorConfirmed: targetCorrelationOperatorConfirmed","targetCorrelationProvenance: correlationProvenance","candidates: candidates"):
              assert token in export, token
          PY

      - name: Commit repair and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-correlation-evidence-retention-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/capture-correlation-evidence-retention-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): preserve sealed correlation evidence on authority loss"
          git push origin HEAD:agent/v14-capture-correlation-evidence-retention-sol
