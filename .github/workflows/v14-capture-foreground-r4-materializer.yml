name: V14 Capture Foreground R4 Materializer

on:
  push:
    branches:
      - agent/v14-capture-foreground-r4-integration-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close accepted and correlated foreground gaps
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT="682c19fb4b5b5d94a2fb7c9321fffabb9df5afb8"
          RED_HEAD="ec55d27270d80bdfa556eff3b598880dd8f5c231"
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]] || { echo "branch moved before materialization"; exit 2; }
          mapfile -t CUT_FILES < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          [[ "${#CUT_FILES[@]}" -eq 1 && "${CUT_FILES[0]}" == ".github/workflows/v14-capture-foreground-r4-materializer.yml" ]] || exit 2

          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          old = "    func appDidLoseForeground() {\n        guard !foregroundIntegrityLossHandled else { return }\n"
          new = "    func appDidLoseForeground() {\n        // A sealed accepted artifact is immutable and remains shareable across scene changes.\n        guard phase != .accepted else { return }\n        guard !foregroundIntegrityLossHandled else { return }\n"
          if text.count(old) != 1:
              raise SystemExit(f"accepted guard anchor drifted: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = "        guard let token = currentConnectionToken else {\n            if phase == .authenticating {\n"
          correlated = "        guard let token = currentConnectionToken else {\n            if phase == .correlated || phase == .selected {\n                // Correlation is current-attempt authority only. A foreground boundary ends that\n                // attempt even after package scanning has already released its process lease.\n                resetDiscoverySessionOnly()\n                phase = .failed\n                message = \"Capture left the foreground after target correlation. Re-verify this scooter and restart from OFF1; prior target authority is not reused across the interruption.\"\n                log(\"foreground_integrity_lost_after_target_correlation\")\n                return\n            }\n\n            if phase == .authenticating {\n"
          if text.count(old) != 1:
              raise SystemExit(f"no-token foreground anchor drifted: {text.count(old)}")
          path.write_text(text.replace(old, correlated, 1))
          PY

          git show "$RED_HEAD:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift" > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = source.index("func appDidLoseForeground()")
          end = source.index("var privateConfig: Bool", start)
          cleanup = source[start:end]
          for token in [
              "guard phase != .accepted else { return }",
              "guard !foregroundIntegrityLossHandled else { return }",
              "phase == .correlated || phase == .selected",
              "resetDiscoverySessionOnly()",
              "foreground_integrity_lost_after_target_correlation",
              "Task { @MainActor [self] in",
              "invalidateObservationContinuity(",
              "invalidateInternalLifecycle(",
          ]:
              assert token in cleanup, token
          assert cleanup.index("guard phase != .accepted else { return }") < cleanup.index("foregroundIntegrityLossHandled = true")
          for forbidden in ["recordObservedTransportLoss", "endConnection(", "disconnectBLE", "releasePackageCorrelationLease("]:
              assert forbidden not in cleanup, forbidden
          PY

          git config user.name "Nembra V14 Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          git commit -m "fix(capture): close foreground target-authority gap"
          git push origin HEAD:agent/v14-capture-foreground-r4-integration-sol
