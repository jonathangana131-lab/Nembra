name: Capture Signed App Verification Seal Red Team

on:
  push:
    branches:
      - adversarial/v14-capture-signed-app-verification-seal-window-sol
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_signed_app_verification_seal_window.py
      - .github/workflows/capture-signed-app-verification-seal-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification-seal-custody:
    name: Require continuous verification-to-seal custody
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind to exact diagnostic source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Require continuous verification-to-seal custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_signed_app_verification_seal_window.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_verification_seal_window.py
