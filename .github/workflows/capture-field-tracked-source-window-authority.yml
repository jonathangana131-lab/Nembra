name: Capture Field Tracked Source Window Authority

on:
  pull_request:
    paths:
      - Scripts/capture_tuya_private_input_build_guard.py
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py
      - scripts/ci/tests/test_capture_field_tracked_source_window_authority.py
      - .github/workflows/capture-field-tracked-source-window-authority.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-source-window-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact regression checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Prove tracked source custody contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_tracked_source_window_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_window_authority.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          git diff --check

  real-macos-tracked-source-vnode:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact macOS evidence checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Exercise real kqueue mutate-restore delivery
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_window_authority.py
