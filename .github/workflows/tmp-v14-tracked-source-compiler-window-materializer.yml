name: tmp V14 tracked source compiler-window materializer

"on":
  push:
    branches:
      - repair/v14-field-compiler-window-source-custody-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch and validate tracked-source custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tmp_materialize_tracked_source_compiler_window.py
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_tracked_source_compiler_window_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_compiler_window_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_private_runner_execution_authority_red_team.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Publish non-workflow implementation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add Scripts/capture_tuya_private_input_build_guard.py \
                  scripts/field/install_one_time_capture.command \
                  scripts/ci/tests/test_capture_field_tracked_source_compiler_window_authority.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Bind tracked source through Capture compiler window'
          git push origin "HEAD:${GITHUB_REF_NAME}"
