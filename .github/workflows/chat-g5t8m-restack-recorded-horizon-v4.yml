    branches: ['parallel/es80-recorded-horizon-recovery-v4/chat-g5t8m']
    paths: ['.github/workflows/chat-g5t8m-restack-recorded-horizon-v4.yml']
permissions:
  contents: write
jobs:
  restack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-recorded-horizon-recovery-v4/chat-g5t8m
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git fetch origin parallel/es80-recorded-horizon-recovery-v3/chat-g5t8m
          git diff 7aab62ce29870e1979178c9bc3a6b34950817b31 3945cbfe59a7bf5fb133cfccda4874f3193054be -- Packages/NembraBluetoothCapture/Sources | git apply --index
          git show 3945cbfe59a7bf5fb133cfccda4874f3193054be:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothRecordedHorizonRecoveryTests.swift > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothRecordedHorizonRecoveryTests.swift
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothRecordedHorizonRecoveryTests.swift
          git rm .github/workflows/chat-g5t8m-restack-recorded-horizon-v4.yml
          git config user.name 'nembra-chat-g5t8m'
          git config user.email 'nembra-chat-g5t8m@users.noreply.github.com'
          git commit -m 'fix: quarantine recorded Horizon commit failures'
          git push origin HEAD:parallel/es80-recorded-horizon-recovery-v4/chat-g5t8m
