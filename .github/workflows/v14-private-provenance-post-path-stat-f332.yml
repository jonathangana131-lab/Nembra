name: V14 Capture Post-Path Provenance F332

on:
  push:
    branches:
      - fix/v14-private-provenance-post-path-stat-f332-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: fix/v14-private-provenance-post-path-stat-f332-sol
      - name: Materialize and validate exact-current provenance repair
        shell: bash
        run: |
          set -euo pipefail
          PARENT='f332b37671417038e1a210476bc9129e62c9bcc7'
          HELPER='Scripts/capture_tuya_private_input_provenance.py'
          TEST='scripts/ci/tests/test_capture_tuya_private_input_provenance.py'
          test "$(git rev-parse HEAD~2)" = "$PARENT"
          python3 tools/v14_private_provenance_post_path_stat_materialize.py
          python3 -m py_compile "$HELPER" "$TEST"
          python3 "$TEST" CaptureTuyaPrivateInputProvenanceTests.test_file_fingerprint_rejects_same_inode_mutation_after_pathname_sample
          python3 "$TEST"
          git add "$HELPER" "$TEST"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '2'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$HELPER"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-private-provenance-post-path-stat-f332.yml tools/v14_private_provenance_post_path_stat_materialize.py
          git commit -m 'fix(capture): close post-path provenance mutation window'
          git push origin HEAD:fix/v14-private-provenance-post-path-stat-f332-sol
