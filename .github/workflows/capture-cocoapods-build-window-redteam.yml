name: Capture CocoaPods Build Window Red Team

on:
  push:
    branches:
      - adversarial/v14-capture-cocoapods-build-window-sol
  pull_request:
    paths:
      - Scripts/capture_cocoapods_build_subject.py
      - Scripts/capture_tuya_private_input_build_guard.py
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_cocoapods_build_window_custody.py
      - .github/workflows/capture-cocoapods-build-window-redteam.yml

permissions:
  contents: read

jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require coherent generated subject and compiler-window custody
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Scripts/capture_cocoapods_build_subject.py \
            scripts/ci/tests/test_capture_cocoapods_build_window_custody.py
          python3 scripts/ci/tests/test_capture_cocoapods_build_window_custody.py
