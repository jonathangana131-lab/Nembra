name: Materialize Capture View Exit Membership Race B59

on:
  push:
    branches:
      - fix/v14-capture-view-exit-membership-race-b59-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-view-exit-membership-race-b59-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact product ancestry and untouched app source
        shell: bash
        run: |
          set -euo pipefail
          parent='b59cd71272b465bcad70fcc3425382bb29541b2e'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-view-exit-membership-race-b59-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift'

      - name: Apply hidden-start authority retirement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          start_token = '    func abandonCorrelationForViewExit() {'
          end_token = '\n\n    var privateConfig: Bool'
          if source.count(start_token) != 1:
              raise SystemExit('expected exactly one view-exit cleanup')
          start = source.index(start_token)
          end = source.index(end_token, start)
          replacement = '''    func abandonCorrelationForViewExit() {
        // Revoke pending membership-result starts before any scanner/lease early return.
        membershipRequestID = UUID()
        membershipBusy = false
        #if canImport(ThingSmartHomeKit)
        membershipProbe = nil
        #endif

        guard processCorrelationLease != nil || correlationSession != nil else { return }
        abandonPackageCorrelation()
        phase = .failed
        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."
        log("target_correlation_abandoned_on_view_exit")
    }'''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY

      - name: Validate lifecycle authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift').read_text(encoding='utf-8')
          start = app.index('func abandonCorrelationForViewExit()')
          end = app.index('var privateConfig: Bool', start)
          cleanup = app[start:end]
          request = cleanup.index('membershipRequestID = UUID()')
          busy = cleanup.index('membershipBusy = false')
          probe = cleanup.index('membershipProbe = nil')
          guard = cleanup.index('guard processCorrelationLease != nil || correlationSession != nil else { return }')
          abandon = cleanup.index('abandonPackageCorrelation()')
          assert request < guard and busy < guard and probe < guard < abandon
          assert 'releasePackageCorrelationLease()' not in cleanup
          for forbidden in ('connectBLE(', 'publishDps', 'queryDps', 'writeValue', 'disconnectBLE'):
              assert forbidden not in cleanup, forbidden
          assert 'guard let self, self.membershipRequestID == requestID else { return }' in app
          assert 'self.beginCorrelationSeries()' in app
          assert 'self.beginOfficialConnection(candidate: candidate)' in app
          for needle in ('membershipRequestID = UUID()', 'membershipBusy = false', 'membershipProbe = nil', 'beginCorrelationSeries()', 'beginOfficialConnection()'):
              assert needle in test, needle
          print('hidden membership start authority retirement: PASS')
          PY
          git diff --check

      - name: Publish clean two-path repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          parent='b59cd71272b465bcad70fcc3425382bb29541b2e'
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-view-exit-membership-race-b59-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          git diff --cached --check
          git commit -m 'fix(capture): revoke hidden membership starts on exit'
          mapfile -t final_changed < <(git diff --name-only "$parent" HEAD | sort)
          test "${#final_changed[@]}" = 2
          test "${final_changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${final_changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-view-exit-membership-race-b59-sol
