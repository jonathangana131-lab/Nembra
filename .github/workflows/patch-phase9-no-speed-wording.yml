name: Patch Phase 9 no-speed wording

on:
  push:
    branches:
      - feature/landscape-dashboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/landscape-dashboard
          fetch-depth: 0

      - name: Fit the disabled Lock subtitle
        run: |
          python3 <<'PY'
          from pathlib import Path
          edits = [
              ('NembraApp/Features/Home/HomeView.swift',
               'guard let speed = confirmedVehicleSpeedKilometersPerHour else { return "Speed unknown" }',
               'guard let speed = confirmedVehicleSpeedKilometersPerHour else { return "No speed" }'),
              ('NembraUITests/NembraUITests.swift',
               'XCTAssertTrue(lock.label.contains("Speed unknown"))',
               'XCTAssertTrue(lock.label.contains("No speed"))'),
          ]
          for path, old, new in edits:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'anchor missing or ambiguous: {path}')
              p.write_text(text.replace(old, new, 1))
          PY
          grep -q 'return "No speed"' NembraApp/Features/Home/HomeView.swift
          grep -q 'contains("No speed")' NembraUITests/NembraUITests.swift

      - name: Commit wording and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-phase9-no-speed-wording.yml
          git add NembraApp/Features/Home/HomeView.swift NembraUITests/NembraUITests.swift
          git commit -m 'polish: use compact no-speed safety label'
          git push origin HEAD:feature/landscape-dashboard
