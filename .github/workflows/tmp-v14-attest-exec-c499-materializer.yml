name: Temporary V14 attest-exec c499 materializer

on:
  push:
    branches:
      - repair/v14-signed-origin-attest-exec-c499-sol-20260812-go2

permissions:
  contents: write

concurrency:
  group: tmp-v14-attest-exec-c499-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact moved parent
        shell: bash
        env:
          EXACT_PARENT: c4996ea91cc3482ca8a8d661fd1436a2eee745df
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          test "$(git diff --name-only "$EXACT_PARENT"...HEAD)" = ".github/workflows/tmp-v14-attest-exec-c499-materializer.yml"

      - name: Materialize same-process authority boundary
        shell: bash
        env:
          PROVEN_IMPL: bace66cbce401568ef97e2898eba1e894c28df60
        run: |
          set -euo pipefail
          # The production helper at c499 is byte-identical to the 920598 parent
          # from which PROVEN_IMPL was validated, so consume that exact helper
          # implementation rather than re-synthesizing security-critical code.
          git show "$PROVEN_IMPL:scripts/ci/capture_signed_app_build_origin_custody.py" \
            > scripts/ci/capture_signed_app_build_origin_custody.py

          python3 - <<'PY'
          from pathlib import Path

          pre = Path("scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py")
          source = pre.read_text(encoding="utf-8")

          old_marker = '            "group_attestation": "_attest_build_identity_groups(\\n            build_name,",\n'
          new_marker = '            "group_attestation": "attested_command = _credential_attesting_exec_command(\\n            guarded_command,",\n'
          if source.count(old_marker) != 1:
              raise SystemExit("expected one moved-head group-attestation marker")
          source = source.replace(old_marker, new_marker, 1)

          old_assertions = '''        self.assertIn("if effective != expected:", source)
                  self.assertIn("if effective.intersection(field_only):", source)
          '''
          new_assertions = '''        self.assertIn("attested_command = _credential_attesting_exec_command(", source)
                  self.assertIn("build = subprocess.run(\\n            attested_command,", source)
                  self.assertIn("raw_groups=sorted(set(os.getgroups()))", source)
                  self.assertIn("if not identity_exact or not groups_exact or field_only_leak:", source)
                  self.assertIn("os.execve(command[0], command, os.environ)", source)
                  self.assertIn("effectiveZeroSupplementaryGroupsClaim':False", source)
                  self.assertNotIn("def _attest_build_identity_groups(", source)
          '''
          if source.count(old_assertions) != 1:
              raise SystemExit("expected moved-head effective-group source assertions")
          source = source.replace(old_assertions, new_assertions, 1)

          test_start = source.index("    def test_effective_build_groups_must_match_fresh_directory_service_baseline")
          test_end = source.index("    def test_verified_identity_retirement_requires_name_and_numeric_absence", test_start)
          replacement_test = r'''    def test_credential_attesting_exec_binds_fresh_ds_baseline_to_same_compiler_process(self) -> None:
                  helper = load(ORIGIN_HELPER, "capture_signed_app_build_origin_custody_attest_exec")
                  with mock.patch.object(helper.os, "getgrouplist", return_value=[12, 61, 100, 701, 55001]):
                      wrapped = helper._credential_attesting_exec_command(
                          ["/usr/bin/true", "accepted-compiler-argument"],
                          name="nembrabuildtest",
                          uid=55001,
                          gid=55001,
                          field_groups=(20, 33, 61, 80, 701),
                      )
                  self.assertEqual(wrapped[:4], ["/usr/bin/python3", "-B", "-I", "-c"])
                  child_source = wrapped[4]
                  contract = helper.json.loads(wrapped[5])
                  self.assertEqual(contract["effectiveGroups"], [12, 61, 100, 701])
                  self.assertEqual(contract["fieldOnlyGroups"], [20, 33, 80])
                  self.assertEqual(wrapped[6:], ["/usr/bin/true", "accepted-compiler-argument"])
                  self.assertIn("os.getgroups()", child_source)
                  self.assertIn("raise SystemExit(126)", child_source)
                  self.assertIn("os.execve(command[0], command, os.environ)", child_source)
                  self.assertIn("effectiveZeroSupplementaryGroupsClaim", child_source)

                  with self.assertRaises(helper.BuildOriginCustodyError):
                      helper._credential_attesting_exec_command(
                          ["xcodebuild"],
                          name="nembrabuildtest",
                          uid=55001,
                          gid=55001,
                          field_groups=(),
                      )

          '''
          source = source[:test_start] + replacement_test + source[test_end:]
          pre.write_text(source, encoding="utf-8")

          witness_path = Path("scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py")
          witness = witness_path.read_text(encoding="utf-8")

          preflight_start = witness.index("        try:\n            build_directory_groups = helper._attest_build_identity_groups(")
          preflight_end = witness.index("\n\n        helper._create_apfs_image(image)", preflight_start)
          witness = witness[:preflight_start] + witness[preflight_end + 2:]

          old_launch = '''        build = subprocess.run(
                      command,
                      cwd=source_root,
          '''
          new_launch = '''        attested_command = helper._credential_attesting_exec_command(
                      command,
                      name=build_name,
                      uid=build_uid,
                      gid=build_gid,
                      field_groups=field_groups,
                  )
                  build = subprocess.run(
                      attested_command,
                      cwd=source_root,
          '''
          if witness.count(old_launch) != 1:
              raise SystemExit("expected one moved-head real-Xcode launch")
          witness = witness.replace(old_launch, new_launch, 1)

          status_gate = '''        if build.returncode != 0:
                      emit_error(
          '''
          attestation_gate = '''        credential_records = [
                      line[len(helper.GROUP_ATTESTOR_MARKER):]
                      for line in (build.stdout or "").splitlines()
                      if line.startswith(helper.GROUP_ATTESTOR_MARKER)
                  ]
                  if len(credential_records) != 1:
                      emit_error("effective-credentials", "missing or ambiguous same-process build credential attestation", build_output=build.stdout)
                      return 72
                  try:
                      credential_attestation = json.loads(credential_records[0])
                  except json.JSONDecodeError:
                      emit_error("effective-credentials", "same-process build credential attestation is malformed", build_output=build.stdout)
                      return 72
                  if not (
                      credential_attestation.get("identityExact") is True
                      and credential_attestation.get("groupsExact") is True
                      and credential_attestation.get("fieldOnlyLeak") == []
                      and credential_attestation.get("effectiveZeroSupplementaryGroupsClaim") is False
                  ):
                      emit_error("effective-credentials", "same-process compiler credential authority rejected", build_output=build.stdout)
                      return 72
                  expected_effective_groups = credential_attestation.get("expectedEffectiveGroups")
                  if not isinstance(expected_effective_groups, list) or any(
                      not isinstance(group, int) for group in expected_effective_groups
                  ):
                      emit_error("effective-credentials", "same-process credential baseline is malformed", build_output=build.stdout)
                      return 72
                  build_directory_groups = sorted(set([build_gid, *expected_effective_groups]))

          '''
          if witness.count(status_gate) != 1:
              raise SystemExit("expected one moved-head Xcode status gate")
          witness = witness.replace(status_gate, attestation_gate + status_gate, 1)

          evidence_marker = '            "buildEffectiveGroupAuthorityAttested": True,\n'
          evidence_add = '''            "buildEffectiveGroupAuthorityAttested": True,
                      "buildCredentialAttestation": credential_attestation,
                      "buildCredentialAttestationSameExecTransition": True,
                      "effectiveZeroSupplementaryGroupsClaim": False,
          '''
          if witness.count(evidence_marker) != 1:
              raise SystemExit("expected one moved-head effective-group evidence marker")
          witness = witness.replace(evidence_marker, evidence_add, 1)

          required_marker = '            and evidence.get("buildEffectiveGroupAuthorityAttested") is True\n'
          required_add = '''            and evidence.get("buildEffectiveGroupAuthorityAttested") is True
                      and evidence.get("buildCredentialAttestationSameExecTransition") is True
                      and evidence.get("effectiveZeroSupplementaryGroupsClaim") is False
                      and evidence.get("buildCredentialAttestation", {}).get("identityExact") is True
                      and evidence.get("buildCredentialAttestation", {}).get("groupsExact") is True
                      and evidence.get("buildCredentialAttestation", {}).get("fieldOnlyLeak") == []
          '''
          if witness.count(required_marker) != 1:
              raise SystemExit("expected one moved-head parent evidence marker")
          witness = witness.replace(required_marker, required_add, 1)
          witness_path.write_text(witness, encoding="utf-8")
          PY

          rm .github/workflows/tmp-v14-attest-exec-c499-materializer.yml

      - name: Validate focused moved-head contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py \
            scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          python3 scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py -v
          grep -Fq 'def _credential_attesting_exec_command(' scripts/ci/capture_signed_app_build_origin_custody.py
          grep -Fq 'os.execve(command[0], command, os.environ)' scripts/ci/capture_signed_app_build_origin_custody.py
          ! grep -Fq 'def _attest_build_identity_groups(' scripts/ci/capture_signed_app_build_origin_custody.py
          grep -Fq 'buildCredentialAttestationSameExecTransition' scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          grep -Fq '_remove_local_build_identity(build_name, build_uid, require_absent=True)' scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          grep -Fq '"-owners",' scripts/ci/capture_signed_app_build_origin_custody.py
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/tmp-v14-attest-exec-c499-materializer.yml \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py \
            scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish clean stacked delta
        shell: bash
        env:
          BRANCH: repair/v14-signed-origin-attest-exec-c499-sol-20260812-go2
        run: |
          set -euo pipefail
          git config user.name "nembra-swarm"
          git config user.email "nembra-swarm@users.noreply.github.com"
          git add -A -- \
            .github/workflows/tmp-v14-attest-exec-c499-materializer.yml \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py \
            scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          git commit -m "Capture P0: bind moved-head credential attestation to compiler exec"
          git push origin "HEAD:$BRANCH"
