name: TEMP V14 terminal applied-frontier patch

on:
  push:
    branches:
      - integration/es80-v14-terminal-controller-resolution/chatgpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: integration/es80-v14-terminal-controller-resolution/chatgpt56-go
          fetch-depth: 0

      - name: Apply fail-closed terminal resolved-frontier authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gate_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift')
          gate = gate_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          gate = replace_once(
              gate,
              '        case freshTargetSessionRequired\n        case terminalQueueChangedAfterResolution(expected: UInt64, actual: UInt64)\n',
              '        case freshTargetSessionRequired\n        case resolvedFrontierDoesNotMatchResolution(expected: UInt64, actual: UInt64)\n        case terminalQueueChangedAfterResolution(expected: UInt64, actual: UInt64)\n',
              'state error insertion',
          )
          gate = replace_once(
              gate,
              '        _ resolution: PassiveCoreBluetoothTerminalQueueResolution.Receipt,\n        currentLastEnqueuedEventSequence: UInt64,\n        freshTargetSessionGeneration: UInt64\n',
              '        _ resolution: PassiveCoreBluetoothTerminalQueueResolution.Receipt,\n        currentResolvedThroughQueueSequence: UInt64,\n        currentLastEnqueuedEventSequence: UInt64,\n        freshTargetSessionGeneration: UInt64\n',
              'terminal reopen signature',
          )
          gate = replace_once(
              gate,
              '        guard resolution.terminalAuthority == transaction.authority else {\n            throw StateError.authorityChanged\n        }\n        guard resolution.resolvedThroughQueueSequence == currentLastEnqueuedEventSequence else {\n',
              '        guard resolution.terminalAuthority == transaction.authority else {\n            throw StateError.authorityChanged\n        }\n        guard currentResolvedThroughQueueSequence == resolution.resolvedThroughQueueSequence else {\n            throw StateError.resolvedFrontierDoesNotMatchResolution(\n                expected: resolution.resolvedThroughQueueSequence,\n                actual: currentResolvedThroughQueueSequence\n            )\n        }\n        guard resolution.resolvedThroughQueueSequence == currentLastEnqueuedEventSequence else {\n',
              'applied frontier guard',
          )
          gate = replace_once(
              gate,
              '    /// transaction, including its process-local UUID, and the controller has already\n    /// created one strictly newer durable target session. The exact fresh generation\n',
              '    /// transaction, including its process-local UUID. The controller must also have\n    /// applied the receipt\'s resolved-through frontier before admission can reopen, and\n    /// must already have created one strictly newer durable target session. The exact fresh generation\n',
              'terminal reopen documentation',
          )
          gate_path.write_text(gate)

          tests_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothTerminalQueueResolutionReopenV14Tests.swift')
          tests = tests_path.read_text()
          pattern = re.compile(r'(?P<indent>^[ \t]*)(?P<var>resolution(?:A)?),\n(?P=indent)currentLastEnqueuedEventSequence:', re.MULTILINE)

          def add_applied(match: re.Match[str]) -> str:
              indent = match.group('indent')
              var = match.group('var')
              return (
                  f'{indent}{var},\n'
                  f'{indent}currentResolvedThroughQueueSequence: {var}.resolvedThroughQueueSequence,\n'
                  f'{indent}currentLastEnqueuedEventSequence:'
              )

          tests, count = pattern.subn(add_applied, tests)
          if count != 4:
              raise SystemExit(f'existing reopen calls: expected 4 matches, found {count}')
          tests_path.write_text(tests)
          PY

          git diff --check
          grep -q 'currentResolvedThroughQueueSequence: UInt64' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          grep -q 'resolvedFrontierDoesNotMatchResolution' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          test "$(grep -c 'currentResolvedThroughQueueSequence: .*resolvedThroughQueueSequence' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothTerminalQueueResolutionReopenV14Tests.swift)" -eq 4

      - name: Commit product patch and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-v14-terminal-applied-frontier-patch.yml
          git config user.name 'nembra-v14-patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m '[Capture truth] require applied resolved frontier before terminal reopen'
          git push origin HEAD:integration/es80-v14-terminal-controller-resolution/chatgpt56-go
