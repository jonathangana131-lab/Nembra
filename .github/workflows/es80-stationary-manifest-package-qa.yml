name: ES80 Stationary Manifest Package QA

on:
  push:
    branches:
      - 'cell/es80-stationary-manifest-package-qa/**'

permissions:
  contents: read

concurrency:
  group: nembra-es80-stationary-manifest-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test stationary capture manifest package
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify immutable checkout and exact product parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "3b23d4d2ca83f27c56ed97d32ca67407d04d6bbb"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/es80-stationary-manifest-package-qa.yml"

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Guard passive package against application writes
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 research package must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

      - name: Test NembraBluetoothCapture on Apple toolchain
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture

      - name: Build NembraBluetoothCapture for iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
