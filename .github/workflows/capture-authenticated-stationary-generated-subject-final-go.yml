name: Capture Authenticated Stationary Generated Subject Final GO

on:
  push:
    paths:
      - scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/es80_authenticated_stationary_signed_artifact.py
      - scripts/ci/es80_today_final_go_publication.py
      - scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py
      - scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py
      - scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
      - scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py
      - .github/workflows/capture-authenticated-stationary-generated-subject-final-go.yml
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/es80_authenticated_stationary_signed_artifact.py
      - scripts/ci/es80_today_final_go_publication.py
      - scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py
      - scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py
      - scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
      - scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py
      - .github/workflows/capture-authenticated-stationary-generated-subject-final-go.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-tests:
    # This gate is release authority for replacement-blind execution of the pinned R3 parent module.
    name: Generated subject Final-GO R3 authority tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind QA to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile generated-subject R3 control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py \
            scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py \
            scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py

      - name: Red-team exact parent, review, build, and publication custody
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py

      - name: Prove generated custody workflows are mandatory release authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py

      - name: Prove generated helper executes from accepted Git bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py

      - name: Prove authenticated-stationary parent executes from accepted Git bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py
