name: Capture Generated Subject Helper Execution Red Team

on:
  push:
    branches:
      - adversarial/v14-final-go-generated-helper-execution-sol
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py
      - scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
      - .github/workflows/capture-generated-subject-helper-execution-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expected-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Bind diagnostic to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Require accepted helper bytes at execution boundary
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
          python3 scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
