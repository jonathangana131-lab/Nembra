name: Capture Generated Subject Control Custody Red Team

on:
  push:
    branches:
      - adversarial/v14-final-go-generated-helper-execution-r2-sol
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py
      - scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
      - scripts/ci/tests/test_es80_generated_subject_control_worktree_custody.py
      - .github/workflows/capture-generated-subject-helper-execution-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expected-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind diagnostic to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile both custody diagnostics
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py \
            scripts/ci/tests/test_es80_generated_subject_control_worktree_custody.py
      - name: Require accepted helper bytes at execution boundary
        id: helper_execution
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
      - name: Require current child control bytes to match accepted Git blobs
        id: control_worktree
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tests/test_es80_generated_subject_control_worktree_custody.py
      - name: Require both control custody boundaries closed
        if: always()
        shell: bash
        env:
          HELPER_EXECUTION_OUTCOME: ${{ steps.helper_execution.outcome }}
          CONTROL_WORKTREE_OUTCOME: ${{ steps.control_worktree.outcome }}
        run: |
          set -euo pipefail
          printf 'helper_execution=%s\ncontrol_worktree=%s\n' "$HELPER_EXECUTION_OUTCOME" "$CONTROL_WORKTREE_OUTCOME"
          test "$HELPER_EXECUTION_OUTCOME" = success
          test "$CONTROL_WORKTREE_OUTCOME" = success
