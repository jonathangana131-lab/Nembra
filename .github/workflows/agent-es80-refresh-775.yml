name: Agent ES80 refresh 775 spine

on:
  push:
    branches:
      - capture-v14-analysis-ready-integrity-ui

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture-v14-analysis-ready-integrity-ui
          fetch-depth: 0

      - name: Merge latest Capture truth spine
        shell: bash
        run: |
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin integration/es80-v14-share-duration-integrity/chatgpt56-go
          git merge --no-ff origin/integration/es80-v14-share-duration-integrity/chatgpt56-go -m 'merge(capture): refresh live #775 truth spine'
          rm .github/workflows/agent-es80-refresh-775.yml
          git add .github/workflows/agent-es80-refresh-775.yml
          git commit -m 'chore(capture): remove temporary 775 refresh workflow'
          git push origin HEAD:capture-v14-analysis-ready-integrity-ui
