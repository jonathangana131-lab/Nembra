name: TEMP Capture Tuya Approval Fail-Closed Materializer

on:
  push:
    branches:
      - agent/v14-capture-tuya-approval-failclosed-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'jonathangana131-lab/Nembra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-tuya-approval-failclosed-sol
          fetch-depth: 2
      - name: Verify exact parent and materializer-only trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1239eaf402da8a99f2d894956d00a9815ca4a8a1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tmp-capture-tuya-approval-failclosed-materialize.yml"
      - name: Apply fail-closed approved-session UX repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path("NembraApp/Features/Research/TuyaAccountBridge.swift")
          text = bridge.read_text(encoding="utf-8")

          old_start = '''    private func pollApprovalOnce(userCode: String, token: String, generation: UInt64) async {
                  guard generation == operationGeneration,
                        qrToken == token,
                        session == nil else { return }
                  do {
          '''
          new_start = '''    private func pollApprovalOnce(userCode: String, token: String, generation: UInt64) async {
                  guard generation == operationGeneration,
                        qrToken == token,
                        session == nil else { return }
                  var approvalSucceeded = false
                  do {
          '''
          if text.count(old_start) != 1:
              raise SystemExit("pollApprovalOnce start drifted")
          text = text.replace(old_start, new_start, 1)

          old_guard = '''            guard Self.bool(object["success"]), let result = object["result"] as? [String: Any] else {
                          if phase == .waitingForApproval {
                              statusMessage = "Waiting for approval in Tuya Smart…"
                          }
                          return
                      }

                      let issued = Self.int64(object["t"]) ?? Int64(Date().timeIntervalSince1970 * 1000)
          '''
          new_guard = '''            guard Self.bool(object["success"]) else {
                          if phase == .waitingForApproval {
                              statusMessage = "Waiting for approval in Tuya Smart…"
                          }
                          return
                      }
                      approvalSucceeded = true
                      guard let result = object["result"] as? [String: Any] else {
                          throw BridgeError.malformed("Tuya approval succeeded but account-session data was missing.")
                      }

                      let issued = Self.int64(object["t"]) ?? Int64(Date().timeIntervalSince1970 * 1000)
          '''
          if text.count(old_guard) != 1:
              raise SystemExit("approval success guard drifted")
          text = text.replace(old_guard, new_guard, 1)

          old_catch = '''        } catch {
                      guard !Task.isCancelled,
                            generation == operationGeneration,
                            qrToken == token,
                            session == nil else { return }
                      if phase == .waitingForApproval {
                          statusMessage = "Still waiting for Tuya approval…"
                      }
                  }
          '''
          new_catch = '''        } catch {
                      guard !Task.isCancelled,
                            generation == operationGeneration,
                            qrToken == token,
                            session == nil else { return }
                      if approvalSucceeded {
                          phase = .failed
                          statusMessage = "Tuya approved, but the account session was rejected: \\(Self.readable(error)) Tap Try again to make a fresh QR."
                          pollTask?.cancel()
                          pollTask = nil
                      } else if phase == .waitingForApproval {
                          statusMessage = "Still waiting for Tuya approval…"
                      }
                  }
          '''
          if text.count(old_catch) != 1:
              raise SystemExit("approval catch drifted")
          text = text.replace(old_catch, new_catch, 1)
          bridge.write_text(text, encoding="utf-8")

          test = Path("scripts/ci/tests/test_tuya_account_transport_source.py")
          source = test.read_text(encoding="utf-8")
          anchor = '''    def test_every_json_request_fails_closed_before_non_https_transport(self):
                  self.assertIn('requestURL.scheme?.lowercased() == "https"', SOURCE)
                  self.assertIn('throw BridgeError.invalidURL', SOURCE)
          '''
          addition = '''    def test_every_json_request_fails_closed_before_non_https_transport(self):
                  self.assertIn('requestURL.scheme?.lowercased() == "https"', SOURCE)
                  self.assertIn('throw BridgeError.invalidURL', SOURCE)

              def test_successful_approval_with_rejected_session_fails_instead_of_polling(self):
                  self.assertNotIn('guard Self.bool(object["success"]), let result = object["result"]', SOURCE)
                  self.assertIn('var approvalSucceeded = false', SOURCE)
                  self.assertIn('approvalSucceeded = true', SOURCE)
                  self.assertIn('if approvalSucceeded {', SOURCE)
                  self.assertIn('phase = .failed', SOURCE)
                  self.assertIn('account session was rejected:', SOURCE)
                  self.assertIn('pollTask?.cancel()', SOURCE)
          '''
          if source.count(anchor) != 1:
              raise SystemExit("transport source test anchor drifted")
          test.write_text(source.replace(anchor, addition, 1), encoding="utf-8")
          PY
          python3 scripts/ci/tests/test_tuya_account_transport_source.py
      - name: Commit product repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-capture-tuya-approval-failclosed-materialize.yml
          git config user.name "jonathangana131-lab"
          git config user.email "jonathangana131@gmail.com"
          git add NembraApp/Features/Research/TuyaAccountBridge.swift scripts/ci/tests/test_tuya_account_transport_source.py .github/workflows/tmp-capture-tuya-approval-failclosed-materialize.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/tmp-capture-tuya-approval-failclosed-materialize.yml' 'NembraApp/Features/Research/TuyaAccountBridge.swift' 'scripts/ci/tests/test_tuya_account_transport_source.py' | sort)"
          git commit -m "fix(capture): fail closed after rejected Tuya approval"
          git push origin HEAD:agent/v14-capture-tuya-approval-failclosed-sol
