name: Capture Field Provenance Launcher Oracle Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/capture-field-provenance-launcher-ast-materialize-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  EXACT_PARENT: 9b68439c1ef19e0e445f488be46b0c3e6ef61936
  TARGET: .github/workflows/capture-field-build-provenance.yml
  SELF: .github/workflows/capture-field-provenance-launcher-ast-materialize-once.yml
  SNAPSHOT: scripts/ci/capture_field_build_provenance_generated.yml

jobs:
  materialize:
    name: Replace stale formatting grep with semantic AST contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact authoring input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = "$SELF"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize semantic source contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          needle = "grep -Fq 'launcher_run(field_pid, source_sha, freeze_helper_base64, freeze_helper_blob)' \"$selected_xcode_orchestrator\""
          source_lines = source.splitlines(keepends=True)
          matching_indexes = [
              index
              for index, line in enumerate(source_lines)
              if line.strip() == needle
          ]
          if len(matching_indexes) != 1:
              raise SystemExit(
                  f"stale launcher source grep seam count is {len(matching_indexes)}, expected exactly 1"
              )

          index = matching_indexes[0]
          stale_line = source_lines[index]
          indent = stale_line[: len(stale_line) - len(stale_line.lstrip())]
          ast_lines = [
              '/usr/bin/python3 -B -I - "$selected_xcode_orchestrator" <<\'PYAST\'',
              'import ast',
              'from pathlib import Path',
              'import sys',
              '',
              'tree = ast.parse(Path(sys.argv[1]).read_text(encoding="utf-8"))',
              'expected_args = [',
              '    "field_pid",',
              '    "source_sha",',
              '    "freeze_helper_base64",',
              '    "freeze_helper_blob",',
              ']',
              'matches = []',
              'for node in ast.walk(tree):',
              '    if not isinstance(node, ast.Assign) or len(node.targets) != 1:',
              '        continue',
              '    target = node.targets[0]',
              '    call = node.value',
              '    if not (isinstance(target, ast.Name) and target.id == "freeze_result"):',
              '        continue',
              '    if not (',
              '        isinstance(call, ast.Call)',
              '        and isinstance(call.func, ast.Name)',
              '        and call.func.id == "launcher_run"',
              '        and not call.keywords',
              '    ):',
              '        continue',
              '    names = [arg.id if isinstance(arg, ast.Name) else None for arg in call.args]',
              '    if names == expected_args:',
              '        matches.append(node)',
              'if len(matches) != 1:',
              '    raise SystemExit(',
              '        "selected-Xcode orchestrator must assign freeze_result from exactly one "',
              '        "launcher_run(field_pid, source_sha, freeze_helper_base64, freeze_helper_blob) call"',
              '    )',
              'PYAST',
          ]
          replacement = "".join(
              f"{indent}{line}\n" if line else "\n"
              for line in ast_lines
          )
          source_lines[index] = replacement
          path.write_text("".join(source_lines), encoding="utf-8")
          PY

      - name: Prove permanent bytes before publication
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          stale = "grep -Fq 'launcher_run(field_pid, source_sha, freeze_helper_base64, freeze_helper_blob)'"
          if stale in source:
              raise SystemExit("stale formatting-only launcher grep survived materialization")
          required = (
              "import ast",
              'tree = ast.parse(Path(sys.argv[1]).read_text(encoding="utf-8"))',
              'target.id == "freeze_result"',
              'call.func.id == "launcher_run"',
              "names == expected_args",
              "PYAST",
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"semantic launcher AST contract missing: {missing}")
          PY
          git diff --check

      - name: Publish exact generated bytes as non-workflow snapshot
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_HEAD_REF:-}"
          cp "$TARGET" "$SNAPSHOT"
          git checkout "$EXACT_PARENT" -- "$TARGET"
          git rm "$SELF"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SNAPSHOT"
          changed="$(git diff --cached --name-only "$EXACT_PARENT")"
          test "$changed" = "$SNAPSHOT"
          git diff --cached --check
          git commit -m 'test(ci): retain generated field provenance oracle bytes'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Preserve truth boundary
        shell: bash
        run: |
          echo 'NEMBRA_FIELD_PROVENANCE_ORACLE_SNAPSHOT physicalAuthorityCreated=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false'
