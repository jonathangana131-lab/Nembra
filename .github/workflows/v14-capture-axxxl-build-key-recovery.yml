name: V14 Capture AXXXL Build Key Recovery

on:
  push:
    branches:
      - repair/v14-capture-axxxl-build-key-512-gpt56-thinking

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_PARENT: 512271ec4cfdb5dd0431bb342224164d009d4d39
      WORKFLOW_PATH: .github/workflows/v14-capture-axxxl-build-key-recovery.yml
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prove bootstrap ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT"..HEAD)" = "$WORKFLOW_PATH"
          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD

      - name: Apply only the current-tree BUILD key repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraApp.swift")
          source = path.read_text()
          required = [
              'Text("Final checks in progress.")',
              'private var physicalLockAccessibilityLabel: String',
              'Final exact-build checks are still in progress. No scooter action is needed yet.',
              '.accessibilityIdentifier("es80.capture.build-identity")',
              '.accessibilityIdentifier("es80.capture.physical-run-locked")',
              '.accessibilityIdentifier("es80.capture.engineering-details")',
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f"refusing stale/unknown source: {missing}")

          old = '''                        Text("BUILD")
                            .font(.caption2.monospaced().weight(.bold))
                            .foregroundStyle(.secondary)
'''
          new = old + '                            .fixedSize(horizontal: true, vertical: false)\n'
          if source.count(old) != 1:
              raise SystemExit(f"expected one current BUILD key block, found {source.count(old)}")
          if '.fixedSize(horizontal: true, vertical: false)' in source[source.index('Text("BUILD")'):source.index('Text("BUILD")') + 300]:
              raise SystemExit("BUILD key repair already present; refusing duplicate")
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git diff -- NembraApp/App/NembraApp.swift

      - name: Remove bootstrap workflow and commit clean descendant
        shell: bash
        run: |
          set -euo pipefail
          git rm "$WORKFLOW_PATH"
          git config user.name "Nembra V14 Closure Bot"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraApp.swift
          git commit -m "fix(capture): keep AXXXL build key horizontal on current head"

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          changed="$(git diff --name-only "$EXPECTED_PARENT"..HEAD)"
          printf 'Net files vs exact flagship parent:\n%s\n' "$changed"
          test "$changed" = "NembraApp/App/NembraApp.swift"
          test "$(git diff --numstat "$EXPECTED_PARENT"..HEAD)" = $'1\t0\tNembraApp/App/NembraApp.swift'
          grep -F 'Text("Final checks in progress.")' NembraApp/App/NembraApp.swift
          grep -F '.fixedSize(horizontal: true, vertical: false)' NembraApp/App/NembraApp.swift

      - name: Push verified recovery descendant
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/repair/v14-capture-axxxl-build-key-512-gpt56-thinking
