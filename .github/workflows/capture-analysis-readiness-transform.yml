name: Capture analysis readiness transform

on:
  push:
    branches:
      - agent/capture-analysis-readiness-ui-v14

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-analysis-readiness-ui-v14
          fetch-depth: 0
      - name: Apply exact analysis-readiness source transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def decoded(value):
              return base64.b64decode(value).decode()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          app_path = Path('NembraApp/Features/Research/ES80CaptureShellView.swift')
          app = app_path.read_text()
          app = replace_once(app, '    @State private var softwareExportData: Data?\n    @State private var sharePreparationWarning: String?\n', '    @State private var softwareExportData: Data?\n    @State private var softwareExportIntegrityReport: PassiveBluetoothExperimentOneSoftwareExportIntegrityReport?\n    @State private var analysisReadinessWarning: String?\n    @State private var sharePreparationWarning: String?\n', 'integrity state')
          app = replace_once(app, decoded(''), decoded(''), 'completion readiness')
          app = replace_once(app, decoded(''), decoded(''), 'completion description')
          app = replace_once(app, decoded(''), decoded(''), 'details integrity')
          app = replace_once(app, decoded(''), decoded(''), 'share preparation')
          app = replace_once(app, '        softwareExportData = nil\n        sharePreparationWarning = nil\n', '        softwareExportData = nil\n        softwareExportIntegrityReport = nil\n        analysisReadinessWarning = nil\n        sharePreparationWarning = nil\n', 'reset integrity')
          app = replace_once(app, decoded(''), decoded(''), 'detail block')
          app = replace_once(app, '        if status.artifactFinalized {\n            return "Experiment One progress, capture sealed and ready for analysis"\n        }\n', '        if status.artifactFinalized {\n            return softwareExportIntegrityReport == nil\n                ? "Experiment One progress, capture sealed; local integrity check required"\n                : "Experiment One progress, capture complete and ready for analysis"\n        }\n', 'accessibility readiness')
          app = replace_once(app, '        case .complete: return "Evidence, sealed."\n', '        case .complete: return softwareExportIntegrityReport == nil ? "Evidence, sealed." : "Evidence, verified."\n', 'hero readiness')
          app = replace_once(app, '        case .complete: return "Capture complete"\n', '        case .complete: return softwareExportIntegrityReport == nil ? "Capture sealed" : "Capture complete"\n', 'status readiness')
          app_path.write_text(app)

          tests_path = Path('NembraAppTests/NembraAppTests.swift')
          tests = tests_path.read_text()
          tests = replace_once(tests, decoded(''), decoded(''), 'wired app regression')
          tests_path.write_text(tests)
          PY
      - name: Verify focused transformation
        shell: bash
        run: |
          grep -F 'PassiveBluetoothExperimentOneSoftwareExportIntegrity.inspect(data)' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'CAPTURE SEALED' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'Envelope SHA-256' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'testCaptureShellContinuesSameAuthorityThroughSealAndVerifiedAnalysisShare' NembraAppTests/NembraAppTests.swift
          git diff --check
      - name: Remove temporary workflow and checkpoint product change
        shell: bash
        run: |
          rm .github/workflows/capture-analysis-readiness-transform.yml
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/Features/Research/ES80CaptureShellView.swift NembraAppTests/NembraAppTests.swift .github/workflows/capture-analysis-readiness-transform.yml
          git commit -m 'fix(capture): gate analysis readiness on exact envelope integrity'
          git push origin HEAD:agent/capture-analysis-readiness-ui-v14
