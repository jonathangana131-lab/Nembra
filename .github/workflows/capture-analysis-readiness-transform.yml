name: Capture analysis readiness transform

on:
  push:
    branches:
      - agent/capture-analysis-readiness-ui-v14

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-analysis-readiness-ui-v14
          fetch-depth: 0
      - name: Gate analysis-ready UI on exact envelope integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/Features/Research/ES80CaptureShellView.swift')
          app = app_path.read_text()

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          app = replace_once(
              app,
              '    @State private var softwareExportData: Data?\n    @State private var sharePreparationWarning: String?\n',
              '    @State private var softwareExportData: Data?\n    @State private var softwareExportIntegrityReport: PassiveBluetoothExperimentOneSoftwareExportIntegrityReport?\n    @State private var analysisReadinessWarning: String?\n    @State private var sharePreparationWarning: String?\n',
              'integrity state',
          )

          app = replace_once(
              app,
              '''                VStack(alignment: .leading, spacing: 4) {
                    Text("CAPTURE COMPLETE")
                        .font(.caption.monospaced().weight(.bold))
                        .foregroundStyle(.secondary)
                    Text("Ready for analysis")
                        .font(.title2.weight(.semibold))
                        .foregroundStyle(.white)
                }
''',
              '''                VStack(alignment: .leading, spacing: 4) {
                    Text(softwareExportIntegrityReport == nil ? "CAPTURE SEALED" : "CAPTURE COMPLETE")
                        .font(.caption.monospaced().weight(.bold))
                        .foregroundStyle(.secondary)
                    Text(softwareExportIntegrityReport == nil ? "Integrity check required" : "Ready for analysis")
                        .font(.title2.weight(.semibold))
                        .foregroundStyle(.white)
                }
''',
              'completion readiness title',
          )

          app = replace_once(
              app,
              '''            if let artifact = coordinator.finalizedArtifact {
                let exportDescription = softwareExportData.map { " Package-owned Share envelope: \\($0.count.formatted()) bytes." } ?? ""
                Text("\\(artifact.captureJSON.count.formatted()) immutable capture bytes are sealed from this Experiment One authority. Correlation evidence remains bound to the same run.\\(exportDescription) No protocol field meaning is claimed yet.")
                    .font(.subheadline)
                    .foregroundStyle(.secondary)
                    .fixedSize(horizontal: false, vertical: true)
            }
''',
              '''            if let artifact = coordinator.finalizedArtifact {
                let exportDescription = softwareExportData.map { " Package-owned Share envelope: \\($0.count.formatted()) bytes." } ?? ""
                let readinessDescription = softwareExportIntegrityReport == nil
                    ? " Local analysis readiness has not been earned yet."
                    : " Exact envelope and nested Capture bytes passed the package-owned readability/integrity inspection."
                Text("\\(artifact.captureJSON.count.formatted()) immutable capture bytes are sealed from this Experiment One authority. Correlation evidence remains bound to the same run.\\(exportDescription)\\(readinessDescription) No protocol field meaning is claimed yet.")
                    .font(.subheadline)
                    .foregroundStyle(.secondary)
                    .fixedSize(horizontal: false, vertical: true)
            }

            if let analysisReadinessWarning {
                Text(analysisReadinessWarning)
                    .font(.footnote)
                    .foregroundStyle(.orange)
                    .fixedSize(horizontal: false, vertical: true)
            }
''',
              'completion integrity description',
          )

          app = replace_once(
              app,
              '''                    if let artifact = coordinator.finalizedArtifact {
                        detailRow("Capture bytes", value: artifact.captureJSON.count.formatted())
                        detailRow("Observation windows", value: artifact.powerCycleResult.windows.count.formatted())
                    }

                    Divider()

                    Text("Truth boundary")
                        .font(.headline)
                    Text("This artifact is passive software evidence. Repeated full-UUID correlation does not authenticate the physical ES80, and this screen does not assign GATT, Tuya/DP, battery, current, power, speed, regen, or command semantics.")
''',
              '''                    if let artifact = coordinator.finalizedArtifact {
                        detailRow("Capture bytes", value: artifact.captureJSON.count.formatted())
                        detailRow("Observation windows", value: artifact.powerCycleResult.windows.count.formatted())
                    }

                    if let integrity = softwareExportIntegrityReport {
                        Divider()

                        Text("Exact software integrity")
                            .font(.headline)
                        detailRow("Envelope bytes", value: integrity.envelopeByteCount.formatted())
                        detailBlock("Envelope SHA-256", value: integrity.envelopeSHA256)
                        detailRow("Capture bytes", value: integrity.capture.byteCount.formatted())
                        detailBlock("Capture SHA-256", value: integrity.capture.sha256)
                        detailBlock("Capture session", value: integrity.capture.captureSessionID.uuidString)
                        detailRow("Recorded events", value: integrity.capture.recordCount.formatted())
                        detailRow("Raw value records", value: integrity.capture.rawValueRecordCount.formatted())
                        detailRow("Build", value: integrity.buildIdentifier)
                        detailBlock("Build instance", value: integrity.buildInstanceID)
                        detailBlock("Source commit", value: integrity.sourceCommitSHA)
                        detailBlock("Executable SHA-256", value: integrity.executableSHA256)
                    } else if coordinator.finalizedArtifact != nil {
                        Divider()

                        Text("Analysis readiness")
                            .font(.headline)
                        Text("Capture is sealed, but the exact package-owned Share envelope has not passed local readability/integrity inspection. Nembra will not promote this state to Ready for analysis.")
                            .font(.body)
                            .foregroundStyle(.secondary)
                            .fixedSize(horizontal: false, vertical: true)
                    }

                    Divider()

                    Text("Truth boundary")
                        .font(.headline)
                    Text("This artifact is passive software evidence. Exact SHA-256 and readability facts are software integrity, not independent build attestation or field authorization. Repeated full-UUID correlation does not authenticate the physical ES80, and this screen does not assign GATT, Tuya/DP, battery, current, power, speed, regen, or command semantics.")
''',
              'details integrity section',
          )

          old_prepare = '''    private func prepareSoftwareExportForShare() {
        guard coordinator.finalizedArtifact != nil else { return }
        guard let setup = declaredStationarySetup else {
            sharePreparationWarning = "Capture is sealed, but this run has no retained operator setup declaration. Start a fresh Experiment One rather than inventing setup provenance at export time."
            return
        }
        do {
            let data = try coordinator.encodedFinalizedSoftwareExportForCurrentApplication(
                setup: setup,
                prettyPrinted: true
            )
            softwareExportData = data
            shareURL = try persistShareArtifact(data)
            sharePreparationWarning = nil
        } catch {
            sharePreparationWarning = "Capture remains sealed, but the package-owned software Share envelope could not be prepared: \\(experimentErrorMessage(error))"
        }
    }
'''
          new_prepare = '''    private func prepareSoftwareExportForShare() {
        guard coordinator.finalizedArtifact != nil else { return }
        guard let setup = declaredStationarySetup else {
            sharePreparationWarning = "Capture is sealed, but this run has no retained operator setup declaration. Start a fresh Experiment One rather than inventing setup provenance at export time."
            return
        }

        let data: Data
        if let retainedSoftwareExport = softwareExportData {
            data = retainedSoftwareExport
        } else {
            do {
                data = try coordinator.encodedFinalizedSoftwareExportForCurrentApplication(
                    setup: setup,
                    prettyPrinted: true
                )
                softwareExportData = data
            } catch {
                softwareExportIntegrityReport = nil
                analysisReadinessWarning = "Capture remains sealed, but Nembra could not create the package-owned Share envelope required for local analysis readiness."
                sharePreparationWarning = "Capture remains sealed, but the package-owned software Share envelope could not be prepared: \\(experimentErrorMessage(error))"
                return
            }
        }

        do {
            softwareExportIntegrityReport = try PassiveBluetoothExperimentOneSoftwareExportIntegrity.inspect(data)
            analysisReadinessWarning = nil
        } catch {
            softwareExportIntegrityReport = nil
            analysisReadinessWarning = "Capture remains sealed and the exact Share envelope is retained, but local readability/integrity inspection failed. Nembra will not call this artifact Ready for analysis: \\(experimentErrorMessage(error))"
        }

        do {
            shareURL = try persistShareArtifact(data)
            sharePreparationWarning = nil
        } catch {
            shareURL = nil
            sharePreparationWarning = "Capture remains sealed and its exact Share envelope is retained, but temporary Share-file staging failed. Retry reuses the same envelope bytes: \\(experimentErrorMessage(error))"
        }
    }
'''
          app = replace_once(app, old_prepare, new_prepare, 'share preparation')

          app = replace_once(
              app,
              '        softwareExportData = nil\n        sharePreparationWarning = nil\n',
              '        softwareExportData = nil\n        softwareExportIntegrityReport = nil\n        analysisReadinessWarning = nil\n        sharePreparationWarning = nil\n',
              'restart integrity reset',
          )

          app = replace_once(
              app,
              '''    private func detailRow(_ title: String, value: String) -> some View {
        HStack(alignment: .firstTextBaseline, spacing: 14) {
            Text(title)
                .foregroundStyle(.secondary)
            Spacer(minLength: 12)
            Text(value)
                .font(.body.monospacedDigit().weight(.medium))
                .multilineTextAlignment(.trailing)
        }
    }
''',
              '''    private func detailRow(_ title: String, value: String) -> some View {
        HStack(alignment: .firstTextBaseline, spacing: 14) {
            Text(title)
                .foregroundStyle(.secondary)
            Spacer(minLength: 12)
            Text(value)
                .font(.body.monospacedDigit().weight(.medium))
                .multilineTextAlignment(.trailing)
        }
    }

    private func detailBlock(_ title: String, value: String) -> some View {
        VStack(alignment: .leading, spacing: 6) {
            Text(title)
                .font(.caption.weight(.semibold))
                .foregroundStyle(.secondary)
            Text(value)
                .font(.footnote.monospaced())
                .foregroundStyle(.primary)
                .textSelection(.enabled)
                .fixedSize(horizontal: false, vertical: true)
        }
        .frame(maxWidth: .infinity, alignment: .leading)
    }
''',
              'long integrity detail block',
          )

          app = replace_once(
              app,
              '''        if status.artifactFinalized {
            return "Experiment One progress, capture sealed and ready for analysis"
        }
''',
              '''        if status.artifactFinalized {
            return softwareExportIntegrityReport == nil
                ? "Experiment One progress, capture sealed; local integrity check required"
                : "Experiment One progress, capture complete and ready for analysis"
        }
''',
              'progress accessibility truth',
          )

          app = replace_once(
              app,
              '        case .complete: return "Evidence, sealed."\n',
              '        case .complete: return softwareExportIntegrityReport == nil ? "Evidence, sealed." : "Evidence, verified."\n',
              'hero completion truth',
          )
          app = replace_once(
              app,
              '        case .complete: return "Capture complete"\n',
              '        case .complete: return softwareExportIntegrityReport == nil ? "Capture sealed" : "Capture complete"\n',
              'status completion truth',
          )

          app_path.write_text(app)

          tests_path = Path('NembraAppTests/NembraAppTests.swift')
          tests = tests_path.read_text()
          old_test = '''    func testCaptureShellContinuesSameAuthorityThroughSealAndShare() throws {
        let testFile = URL(fileURLWithPath: #filePath)
        let root = testFile.deletingLastPathComponent().deletingLastPathComponent()
        let shell = try String(
            contentsOf: root.appendingPathComponent("NembraApp/Features/Research/ES80CaptureShellView.swift"),
            encoding: .utf8
        )
        XCTAssertFalse(shell.contains("PassiveBluetoothPowerCycleObservationSession("))
        XCTAssertFalse(shell.contains("Passive capture binding not available in this build"))
        XCTAssertTrue(shell.contains("coordinator.prepareCaptureRediscovery()"))
        XCTAssertTrue(shell.contains("coordinator.connectPreparedCapture()"))
        XCTAssertTrue(shell.contains("encodedFinalizedObservationHorizonJSON"))
        XCTAssertTrue(shell.contains("ShareLink(item: finalizedCaptureURL)"))
    }
'''
          new_test = '''    func testCaptureShellContinuesSameAuthorityThroughSealAndVerifiedAnalysisShare() throws {
        let testFile = URL(fileURLWithPath: #filePath)
        let root = testFile.deletingLastPathComponent().deletingLastPathComponent()
        let shell = try String(
            contentsOf: root.appendingPathComponent("NembraApp/Features/Research/ES80CaptureShellView.swift"),
            encoding: .utf8
        )
        XCTAssertFalse(shell.contains("PassiveBluetoothPowerCycleObservationSession("))
        XCTAssertFalse(shell.contains("Passive capture binding not available in this build"))
        XCTAssertTrue(shell.contains("coordinator.confirmCorrelatedTargetAndBeginRediscovery()"))
        XCTAssertTrue(shell.contains("coordinator.connectPreparedCapture()"))
        XCTAssertTrue(shell.contains("coordinator.finalizeObservationHorizon()"))
        XCTAssertTrue(shell.contains("encodedFinalizedSoftwareExportForCurrentApplication"))
        XCTAssertTrue(shell.contains("PassiveBluetoothExperimentOneSoftwareExportIntegrity.inspect(data)"))
        XCTAssertTrue(shell.contains("softwareExportIntegrityReport == nil ? \\"CAPTURE SEALED\\" : \\"CAPTURE COMPLETE\\""))
        XCTAssertTrue(shell.contains("softwareExportIntegrityReport == nil ? \\"Integrity check required\\" : \\"Ready for analysis\\""))
        XCTAssertTrue(shell.contains("Envelope SHA-256"))
        XCTAssertTrue(shell.contains("Capture SHA-256"))
        XCTAssertTrue(shell.contains("Capture session"))
        XCTAssertTrue(shell.contains("Raw value records"))
        XCTAssertTrue(shell.contains("if let retainedSoftwareExport = softwareExportData"))
        XCTAssertTrue(shell.contains("shareURL = try persistShareArtifact(data)"))
        XCTAssertFalse(shell.contains("persistShareArtifact(artifact.captureJSON)"))
    }
'''
          tests = replace_once(tests, old_test, new_test, 'wired app regression')
          tests_path.write_text(tests)
          PY
      - name: Verify focused transformation
        shell: bash
        run: |
          grep -F 'PassiveBluetoothExperimentOneSoftwareExportIntegrity.inspect(data)' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'CAPTURE SEALED' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'Envelope SHA-256' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'testCaptureShellContinuesSameAuthorityThroughSealAndVerifiedAnalysisShare' NembraAppTests/NembraAppTests.swift
          git diff --check
      - name: Remove temporary workflow and checkpoint product change
        shell: bash
        run: |
          rm .github/workflows/capture-analysis-readiness-transform.yml
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/Features/Research/ES80CaptureShellView.swift NembraAppTests/NembraAppTests.swift .github/workflows/capture-analysis-readiness-transform.yml
          git commit -m 'fix(capture): gate analysis readiness on exact envelope integrity'
          git push origin HEAD:agent/capture-analysis-readiness-ui-v14
