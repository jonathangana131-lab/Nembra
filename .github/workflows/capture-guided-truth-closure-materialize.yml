name: Capture Guided Truth Closure Materializer

on:
  push:
    branches:
      - product/v14-capture-guided-truth-closure-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact current product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "c58be3f6bc0cf33a9f6d0d950b7d011ff8aa1d25"

      - name: Compose current Capture truth repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          revoke_old = '''        sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipRequestID = UUID()
          '''
          revoke_new = '''        sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipStatus = "Exact scooter membership must be verified again for this Secure Link view."
                  membershipRequestID = UUID()
          '''
          if source.count(revoke_old) != 2:
              raise SystemExit(f"expected 2 membership-revocation blocks, found {source.count(revoke_old)}")
          source = source.replace(revoke_old, revoke_new)

          authority_guard_old = '''        guard sdkAccountLoggedIn,
                  sdkDeviceMembershipVerified,
                  accountIdentityLeaseIsAuthorized,
                  let driver else {
          '''
          authority_guard_new = '''        guard sdkAccountLoggedIn,
                  sdkDeviceMembershipVerified,
                  accountIdentityLeaseIsAuthorized,
                  let admittedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),
                  !admittedAccountUID.isEmpty,
                  let driver else {
          '''
          if source.count(authority_guard_old) != 1:
              raise SystemExit(f"expected 1 application authority guard, found {source.count(authority_guard_old)}")
          source = source.replace(authority_guard_old, authority_guard_new)

          event_old = '''            log("tuya_application_update", update.merging([
                          "generation": String(token.diagnosticGeneration)
                      ]) { current, _ in current })
          '''
          event_new = '''            guard currentConnectionToken == token,
                        phase == .observing,
                        sdkAccountLoggedIn,
                        sdkDeviceMembershipVerified,
                        accountIdentityLeaseIsAuthorized,
                        membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines) == admittedAccountUID else {
                      await invalidateSourceAuthority(
                          token: token,
                          message: "SDK account/device source authority changed before application evidence could enter immutable event custody.",
                          kind: "sdk_source_authority_changed_before_application_event_custody"
                      )
                      return
                  }
                  guard driver.isLocallyConnected(uuid: tuyaUUID) else {
                      await recordObservedTransportLoss(token: token)
                      return
                  }
                  let applicationDetails = redactAccountUIDFromApplicationDetails(
                      update,
                      accountUID: admittedAccountUID
                  )
                  log("tuya_application_update", applicationDetails.merging([
                      "generation": String(token.diagnosticGeneration)
                  ]) { _, trusted in trusted })
          '''
          if source.count(event_old) != 1:
              raise SystemExit(f"expected 1 application-event custody block, found {source.count(event_old)}")
          source = source.replace(event_old, event_new)

          watchdog_marker = '''    private func startWatchdog(token: TuyaReadOnlyConnectionToken) {
          '''
          helper = '''    private func redactAccountUIDFromApplicationDetails(
                  _ details: [String: String],
                  accountUID: String
              ) -> [String: String] {
                  let exactAccountUID = accountUID.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !exactAccountUID.isEmpty else { return details }

                  func redacted(_ text: String) -> String {
                      text.replacingOccurrences(
                          of: exactAccountUID,
                          with: "<redacted-account-uid>",
                          options: [.caseInsensitive, .literal]
                      )
                  }

                  var sanitized: [String: String] = [:]
                  for key in details.keys.sorted() {
                      guard let value = details[key] else { continue }
                      let baseKey = redacted(key)
                      var admittedKey = baseKey
                      var collisionOrdinal = 2
                      while sanitized[admittedKey] != nil {
                          admittedKey = "\\(baseKey)#\\(collisionOrdinal)"
                          collisionOrdinal += 1
                      }
                      sanitized[admittedKey] = redacted(value)
                  }
                  return sanitized
              }

          '''
          if source.count(watchdog_marker) != 1:
              raise SystemExit("expected one startWatchdog insertion point")
          source = source.replace(watchdog_marker, helper + watchdog_marker)

          duplicate = '''        "refreshtoken",
                  "sessionkey",
                  "authkey",
          '''
          simplified = '''        "refreshtoken",
                  "authkey",
          '''
          if source.count(duplicate) != 1:
              raise SystemExit("expected one duplicate sessionkey classifier entry")
          source = source.replace(duplicate, simplified)

          path.write_text(source)
          PY

      - name: Assert closure contracts in materialized source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          assert s.count('membershipStatus = "Exact scooter membership must be verified again for this Secure Link view."') == 2
          assert 'log("tuya_application_update", update.merging([' not in s
          assert 'log("tuya_application_update", applicationDetails.merging([' in s
          assert ']) { _, trusted in trusted })' in s
          assert '<redacted-account-uid>' in s
          assert s.count('        "sessionkey",') == 1
          assert '"uid",' not in s[s.index('@MainActor\nprivate final class SmartLifeDriver'):s.index('#endif\n\nprivate enum AppleAccountAuthorizationError')]
          PY
          git diff --check

      - name: Remove one-shot materializer and publish product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-guided-truth-closure-materialize.yml
          git config user.name "nembra-capture-closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): converge current truth-custody blockers"
          git push origin HEAD:product/v14-capture-guided-truth-closure-sol
