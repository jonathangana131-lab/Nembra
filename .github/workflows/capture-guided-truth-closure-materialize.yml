name: Capture Guided Truth Closure Materializer

on:
  push:
    branches:
      - product/v14-capture-guided-truth-closure-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact current product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "c58be3f6bc0cf33a9f6d0d950b7d011ff8aa1d25"

      - name: Compose current Capture truth repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          def splice(start_token: str, end_token: str, transform):
              global source
              start = source.index(start_token)
              end = source.index(end_token, start)
              before = source[:start]
              section = source[start:end]
              after = source[end:]
              changed = transform(section)
              if changed == section:
                  raise SystemExit(f"no change made in section {start_token}")
              source = before + changed + after

          def reset_membership_status(section: str) -> str:
              old = "        membershipDeviceID = nil\n        membershipRequestID = UUID()"
              new = (
                  "        membershipDeviceID = nil\n"
                  "        membershipStatus = \"Exact scooter membership must be verified again for this Secure Link view.\"\n"
                  "        membershipRequestID = UUID()"
              )
              if section.count(old) != 1:
                  raise SystemExit(f"expected one membership status insertion point, found {section.count(old)}")
              return section.replace(old, new, 1)

          splice(
              "    func abandonCorrelationForViewExit() {",
              "    func appDidLoseForeground() {",
              reset_membership_status,
          )
          splice(
              "    func appDidLoseForeground() {",
              "    var privateConfig: Bool",
              reset_membership_status,
          )

          def close_application_custody(section: str) -> str:
              guard_old = (
                  "              accountIdentityLeaseIsAuthorized,\n"
                  "              let driver else {"
              )
              guard_new = (
                  "              accountIdentityLeaseIsAuthorized,\n"
                  "              let admittedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),\n"
                  "              !admittedAccountUID.isEmpty,\n"
                  "              let driver else {"
              )
              if section.count(guard_old) != 1:
                  raise SystemExit(f"expected one application authority guard, found {section.count(guard_old)}")
              section = section.replace(guard_old, guard_new, 1)

              event_old = (
                  '            log("tuya_application_update", update.merging([\n'
                  '                "generation": String(token.diagnosticGeneration)\n'
                  '            ]) { current, _ in current })'
              )
              event_new = (
                  "            guard currentConnectionToken == token,\n"
                  "                  phase == .observing,\n"
                  "                  sdkAccountLoggedIn,\n"
                  "                  sdkDeviceMembershipVerified,\n"
                  "                  accountIdentityLeaseIsAuthorized,\n"
                  "                  membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines) == admittedAccountUID else {\n"
                  "                await invalidateSourceAuthority(\n"
                  "                    token: token,\n"
                  "                    message: \"SDK account/device source authority changed before application evidence could enter immutable event custody.\",\n"
                  "                    kind: \"sdk_source_authority_changed_before_application_event_custody\"\n"
                  "                )\n"
                  "                return\n"
                  "            }\n"
                  "            guard driver.isLocallyConnected(uuid: tuyaUUID) else {\n"
                  "                await recordObservedTransportLoss(token: token)\n"
                  "                return\n"
                  "            }\n"
                  "            let applicationDetails = redactAccountUIDFromApplicationDetails(\n"
                  "                update,\n"
                  "                accountUID: admittedAccountUID\n"
                  "            )\n"
                  '            log("tuya_application_update", applicationDetails.merging([\n'
                  '                "generation": String(token.diagnosticGeneration)\n'
                  '            ]) { _, trusted in trusted })'
              )
              if section.count(event_old) != 1:
                  raise SystemExit(f"expected one application event custody block, found {section.count(event_old)}")
              return section.replace(event_old, event_new, 1)

          splice(
              "    private func receivedApplicationUpdate(",
              "    private func startWatchdog",
              close_application_custody,
          )

          watchdog_marker = "    private func startWatchdog(token: TuyaReadOnlyConnectionToken) {\n"
          helper = '''    private func redactAccountUIDFromApplicationDetails(
              _ details: [String: String],
              accountUID: String
          ) -> [String: String] {
              let exactAccountUID = accountUID.trimmingCharacters(in: .whitespacesAndNewlines)
              guard !exactAccountUID.isEmpty else { return details }

              func redacted(_ text: String) -> String {
                  text.replacingOccurrences(
                      of: exactAccountUID,
                      with: "<redacted-account-uid>",
                      options: [.caseInsensitive, .literal]
                  )
              }

              var sanitized: [String: String] = [:]
              for key in details.keys.sorted() {
                  guard let value = details[key] else { continue }
                  let baseKey = redacted(key)
                  var admittedKey = baseKey
                  var collisionOrdinal = 2
                  while sanitized[admittedKey] != nil {
                      admittedKey = "\(baseKey)#\(collisionOrdinal)"
                      collisionOrdinal += 1
                  }
                  sanitized[admittedKey] = redacted(value)
              }
              return sanitized
          }

          '''
          if source.count(watchdog_marker) != 1:
              raise SystemExit(f"expected one watchdog insertion point, found {source.count(watchdog_marker)}")
          source = source.replace(watchdog_marker, helper + watchdog_marker, 1)

          duplicate = '        "refreshtoken",\n        "sessionkey",\n        "authkey",'
          if source.count(duplicate) != 1:
              raise SystemExit(f"expected one duplicate sessionkey adjacency, found {source.count(duplicate)}")
          source = source.replace(duplicate, '        "refreshtoken",\n        "authkey",', 1)

          path.write_text(source)
          PY

      - name: Assert closure contracts in materialized source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          assert s.count('membershipStatus = "Exact scooter membership must be verified again for this Secure Link view."') == 2
          assert 'log("tuya_application_update", update.merging([' not in s
          assert 'log("tuya_application_update", applicationDetails.merging([' in s
          assert ']) { _, trusted in trusted })' in s
          assert '<redacted-account-uid>' in s
          assert s.count('        "sessionkey",') == 1
          driver = s[s.index('@MainActor\nprivate final class SmartLifeDriver'):s.index('#endif\n\nprivate enum AppleAccountAuthorizationError')]
          assert '"uid",' not in driver
          PY
          git diff --check

      - name: Remove one-shot materializer and publish product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-guided-truth-closure-materialize.yml
          git config user.name "nembra-capture-closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): converge current truth-custody blockers"
          git push origin HEAD:product/v14-capture-guided-truth-closure-sol
