name: Capture Private Provenance Transform Diagnostic

on:
  push:
    branches:
      - repair/v17-capture-frozen-device-tools-sol-20260814
    paths:
      - .github/workflows/capture-private-provenance-transform-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Diagnose exact transform anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/capture-private-provenance-product-materialize-v3.yml').read_text(encoding='utf-8')
          start = source.index('      - name: Materialize compiled private provenance authority\n        shell: bash\n        run: |\n')
          start = source.index('\n', start + len('      - name: Materialize compiled private provenance authority\n        shell: bash\n        run: |')) + 1
          end = source.index('\n      - name: Verify portable truth contracts\n', start)
          lines = source[start:end].splitlines()
          Path('/tmp/transform.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n', encoding='utf-8')
          PY
          if bash /tmp/transform.sh >"$RUNNER_TEMP/transform.log" 2>&1; then
            echo "transform completed"
          else
            msg="$(tail -c 7000 "$RUNNER_TEMP/transform.log" | tr '\n' ' ' | sed 's/%/%25/g;s/\r/%0D/g;s/::/%3A%3A/g')"
            echo "::error title=Private provenance transform diagnostic::$msg"
            exit 1
          fi
