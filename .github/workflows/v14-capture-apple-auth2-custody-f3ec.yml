name: V14 Capture Apple Auth2 Custody F3EC
on:
  push:
    branches:
      - fix/v14-capture-apple-auth2-custody-f3ec-sol
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-apple-auth2-custody-f3ec-sol
          fetch-depth: 0
      - name: Guard exact product ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f3ec20300d613caa0a559541a91d6754aa02ee23 HEAD
          grep -Fq 'redactedAppleOAuthError' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'submittedIdentityToken:' NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Apply product repair
        run: python3 .github/scripts/v14_capture_apple_auth2_custody.py
      - name: Verify structural contracts
        run: |
          set -euo pipefail
          app=NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'let appleNickname = credential.fullName?.nickname' "$app"
          grep -Fq 'extraInfo["nickname"] = appleNickname' "$app"
          grep -Fq 'extraInfo["snsNickname"] = appleNickname' "$app"
          grep -Fq 'finishAppleLoginFailure(error)' "$app"
          grep -Fq 'let code = (error as NSError?)?.code ?? -1' "$app"
          ! grep -Fq 'submittedIdentityToken:' "$app"
          ! grep -Fq 'redactedAppleOAuthError' "$app"
          grep -Fq 'func signOut()' "$app"
          grep -Fq 'OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)' "$app"
          grep -Fq 'failureRecoveryContextPanel' "$app"
          grep -Fq 'SignInWithAppleButton(.signIn)' "$app"
          grep -Fq 'Apple OAuth failure presentation never consumes credential-shaped values or raw SDK error text' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppleOAuthCredentialCustodySourceTests.swift
          grep -Fq 'Apple Auth2 forwards documented optional nickname fields without weakening membership authority' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppleOAuthDocumentedExtraInfoSourceTests.swift
          git diff --check
      - name: Commit clean three-path repair
        run: |
          set -euo pipefail
          rm .github/scripts/v14_capture_apple_auth2_custody.py
          rm .github/workflows/v14-capture-apple-auth2-custody-f3ec.yml
          git add -A
          git diff --cached --check
          git config user.name nembra-v14-bot
          git config user.email nembra-v14-bot@users.noreply.github.com
          git commit -m 'harden(capture): close Apple Auth2 metadata and error custody'
          git push origin HEAD:fix/v14-capture-apple-auth2-custody-f3ec-sol
