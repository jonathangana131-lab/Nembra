name: Capture Fresh Restart Preflight Transform

on:
  push:
    branches:
      - fix/es80-v14-fresh-restart-charger-preflight/gpt56-go

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-v14-fresh-restart-charger-preflight/gpt56-go
          fetch-depth: 0

      - name: Require a new charger declaration before a fresh coordinator can advance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/Features/Research/ES80CaptureShellView.swift')
          source = path.read_text()

          state_anchor = '    @State private var declaredStationarySetup: PassiveBluetoothStationaryCaptureSetup?\n'
          state_addition = '''    @State private var declaredStationarySetup: PassiveBluetoothStationaryCaptureSetup?\n    @State private var freshRestartRequiresChargerRedeclaration = false\n    @State private var freshRestartChargerState: PassiveBluetoothStationaryCaptureChargerState?\n'''
          if source.count(state_anchor) != 1:
              raise SystemExit('declaredStationarySetup state anchor changed')
          source = source.replace(state_anchor, state_addition, 1)

          old_preflight = '''            if window == .firstPoweredOff, declaredStationarySetup == nil {
                statePanel(
                    eyebrow: "PREFLIGHT / DECLARATION",
                    title: "Confirm stationary setup",
                    message: "Before OFF 1, unplug the scooter charger, keep Nembra foregrounded with the screen unlocked, and keep the stock scooter app closed. Confirm only when those are your declared setup conditions for this Experiment One run.",
                    symbol: "checkmark.shield"
                )
                primaryButton(
                    "Confirm setup",
                    systemImage: "checkmark.circle.fill",
                    identifier: "es80.capture.confirm-setup"
                ) {
                    declaredStationarySetup = PassiveBluetoothStationaryCaptureSetup(
                        chargerState: .disconnected,
                        executionContext: .foregroundUnlockedScreenOn,
                        stockAppReferenceSetup: .none
                    )
                }
                guidanceFootnote("This records your operator declaration; it is not independent proof that the condition held continuously.")
            } else {'''

          new_preflight = '''            if window == .firstPoweredOff, declaredStationarySetup == nil {
                statePanel(
                    eyebrow: "PREFLIGHT / DECLARATION",
                    title: freshRestartRequiresChargerRedeclaration
                        ? "Declare charger state again"
                        : "Confirm stationary setup",
                    message: freshRestartRequiresChargerRedeclaration
                        ? "This is a fresh Experiment One. Re-check the scooter now: choose its current charger state before Nembra can accept a new disconnected setup declaration."
                        : "Before OFF 1, unplug the scooter charger, keep Nembra foregrounded with the screen unlocked, and keep the stock scooter app closed. Confirm only when those are your declared setup conditions for this Experiment One run.",
                    symbol: "checkmark.shield"
                )

                if freshRestartRequiresChargerRedeclaration {
                    secondaryButton(
                        freshRestartChargerState?.rawValue == PassiveBluetoothStationaryCaptureChargerState.disconnected.rawValue
                            ? "Charger disconnected — selected"
                            : "Charger disconnected",
                        systemImage: "bolt.slash.fill",
                        identifier: "es80.capture.restart-charger-disconnected"
                    ) {
                        freshRestartChargerState = .disconnected
                    }
                    secondaryButton(
                        freshRestartChargerState?.rawValue == PassiveBluetoothStationaryCaptureChargerState.connected.rawValue
                            ? "Charger connected — blocked"
                            : "Charger connected",
                        systemImage: "bolt.fill",
                        identifier: "es80.capture.restart-charger-connected"
                    ) {
                        freshRestartChargerState = .connected
                    }
                    if freshRestartChargerState?.rawValue == PassiveBluetoothStationaryCaptureChargerState.connected.rawValue {
                        diagnosticBanner("Disconnect the charger, then select Charger disconnected. A fresh experiment cannot inherit the previous run's charger declaration.")
                    }
                }

                let freshRestartCanConfirm = !freshRestartRequiresChargerRedeclaration
                    || freshRestartChargerState?.rawValue == PassiveBluetoothStationaryCaptureChargerState.disconnected.rawValue
                primaryButton(
                    freshRestartRequiresChargerRedeclaration ? "Confirm fresh setup" : "Confirm setup",
                    systemImage: "checkmark.circle.fill",
                    disabled: !freshRestartCanConfirm,
                    identifier: "es80.capture.confirm-setup"
                ) {
                    guard freshRestartCanConfirm else { return }
                    declaredStationarySetup = PassiveBluetoothStationaryCaptureSetup(
                        chargerState: .disconnected,
                        executionContext: .foregroundUnlockedScreenOn,
                        stockAppReferenceSetup: .none
                    )
                    freshRestartRequiresChargerRedeclaration = false
                    freshRestartChargerState = nil
                }
                guidanceFootnote("This records your operator declaration; it is not independent proof that the condition held continuously.")
            } else {'''

          if source.count(old_preflight) != 1:
              raise SystemExit('stationary preflight block changed')
          source = source.replace(old_preflight, new_preflight, 1)

          restart_anchor = '''        sharePreparationWarning = nil
        declaredStationarySetup = nil
        showingDetails = false
'''
          restart_replacement = '''        sharePreparationWarning = nil
        declaredStationarySetup = nil
        freshRestartRequiresChargerRedeclaration = true
        freshRestartChargerState = nil
        showingDetails = false
'''
          if source.count(restart_anchor) != 1:
              raise SystemExit('restart setup reset anchor changed')
          source = source.replace(restart_anchor, restart_replacement, 1)

          path.write_text(source)
          PY

      - name: Assert fail-closed restart shape
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/Features/Research/ES80CaptureShellView.swift').read_text()
          assert 'freshRestartRequiresChargerRedeclaration = true' in s
          assert 'es80.capture.restart-charger-disconnected' in s
          assert 'es80.capture.restart-charger-connected' in s
          assert 'guard freshRestartCanConfirm else { return }' in s
          assert 'A fresh experiment cannot inherit the previous run' in s
          restart = s[s.index('private func restartExperiment()'):s.index('private func handleScenePhaseChange', s.index('private func restartExperiment()'))]
          assert restart.index('freshRestartRequiresChargerRedeclaration = true') < restart.index('PassiveBluetoothExperimentOneCoordinator()')
          PY

      - name: Commit product repair and remove transform
        shell: bash
        run: |
          git config user.name 'nembra-capture-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/capture-fresh-restart-preflight-transform.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git diff --cached --check
          git commit -m '[Capture preflight v14] Require charger redeclaration on fresh restart'
          git push origin HEAD:fix/es80-v14-fresh-restart-charger-preflight/gpt56-go
