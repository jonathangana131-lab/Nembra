name: Capture exact inspection live reconciliation

on:
  push:
    branches:
      - integration/es80-v14-exact-inspection-compose-go

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact composed lineage
        shell: bash
        run: |
          set -euo pipefail
          COMPOSED_PARENT="8d74803ff08f8aec4584621d152468b9ce0e3346"
          test "$(git rev-parse HEAD^)" = "$COMPOSED_PARENT"
          test "$(git diff --name-only "$COMPOSED_PARENT"..HEAD)" = ".github/workflows/zz-capture-exact-inspection-live-reconcile.yml"

      - name: Merge exact live flagship head
        shell: bash
        run: |
          set -euo pipefail
          LIVE_FLAGSHIP="9b6ff02b50a22358e7366800a8cec78747841fe7"
          git fetch --no-tags origin "$LIVE_FLAGSHIP"
          test "$(git cat-file -t "$LIVE_FLAGSHIP")" = commit
          git merge-base --is-ancestor 0a8f6b765b007b35a3f3018966c9cc2214543886 "$LIVE_FLAGSHIP"
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff --no-edit "$LIVE_FLAGSHIP"

      - name: Validate live composition
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_private_runner.py
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_evidence.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          python3 scripts/ci/es80_signed_field_artifact_evidence.py --self-test
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
          git diff --check HEAD^
          test "$(git diff --name-only 9b6ff02b50a22358e7366800a8cec78747841fe7...HEAD | sort)" = "$(printf '%s\n' \
            .github/workflows/zz-capture-exact-inspection-live-reconcile.yml \
            scripts/ci/es80_signed_field_artifact_private_runner.py \
            scripts/ci/tests/test_xcode27_signed_field_candidate_source.py \
            scripts/ci/xcode27_signed_field_candidate.sh | sort)"

      - name: Remove temporary workflow and publish reconciled checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-capture-exact-inspection-live-reconcile.yml
          git add .github/workflows/zz-capture-exact-inspection-live-reconcile.yml
          git diff --cached --check
          git commit -m "chore(capture): retire live provenance reconciler"
          git push origin HEAD:integration/es80-v14-exact-inspection-compose-go
