name: TMP V14 Private Identity Final Name Binding Sol

on:
  push:
    branches:
      - repair/v14-private-identity-final-name-binding-sol-20260811
    paths:
      - scripts/ci/tmp_materialize_private_identity_final_name_binding_sol.py
      - .github/workflows/tmp-v14-private-identity-final-name-binding-sol.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind exact construction head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize, validate, clean construction files, and publish
        id: materialize
        shell: bash
        run: |
          set +e
          /usr/bin/python3 -I scripts/ci/tmp_materialize_private_identity_final_name_binding_sol.py >"$RUNNER_TEMP/materializer.log" 2>&1
          status="$?"
          cat "$RUNNER_TEMP/materializer.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Retain construction diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: private-identity-final-name-materializer-${{ github.sha }}
          path: ${{ runner.temp }}/materializer.log
          retention-days: 2
          if-no-files-found: error
      - name: Enforce materializer result
        env:
          STATUS: ${{ steps.materialize.outputs.status }}
        run: |
          test "$STATUS" = "0"
