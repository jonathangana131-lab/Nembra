name: Capture Private Input Review Authority Closure

on:
  push:
    paths:
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - Scripts/capture_tuya_private_input_provenance.py
      - Scripts/capture_tuya_private_input_review.py
      - Scripts/capture_tuya_private_input_build_guard.py
      - Scripts/capture_cocoapods_generated_build_subject.py
      - scripts/ci/tests/test_capture_private_input_review_authority_closure.py
      - scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
      - .github/workflows/capture-private-input-review-authority-closure.yml
  pull_request:
    paths:
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - Scripts/capture_tuya_private_input_provenance.py
      - Scripts/capture_tuya_private_input_review.py
      - Scripts/capture_tuya_private_input_build_guard.py
      - Scripts/capture_cocoapods_generated_build_subject.py
      - scripts/ci/tests/test_capture_private_input_review_authority_closure.py
      - scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
      - .github/workflows/capture-private-input-review-authority-closure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-review-authority:
    name: Bind reviewed private generation before field build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind closure to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile accepted authority surface
        shell: bash
        run: |
          set -euo pipefail
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          python3 -m py_compile \
            Scripts/capture_tuya_private_input_provenance.py \
            Scripts/capture_tuya_private_input_review.py \
            Scripts/capture_tuya_private_input_build_guard.py \
            Scripts/capture_cocoapods_generated_build_subject.py \
            scripts/ci/tests/test_capture_private_input_review_authority_closure.py \
            scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py

      - name: Prove private review cannot self-authorize replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_private_input_review_authority_closure.py

      - name: Prove generated-build and ancestry authority still compose
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          python3 scripts/ci/tests/test_capture_private_input_ancestor_retarget.py
