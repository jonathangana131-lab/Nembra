name: Temp Simulator Directory Stability

on:
  push:
    branches:
      - integration/es80-v14-simulator-directory-stability-gpt56-go
    paths:
      - .github/workflows/_temp_simulator_directory_stability.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore retained directory and root stability re-proof
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/xcode27_simulator_capture.sh")
          text = path.read_text(encoding="utf-8")

          identity = '''        info.st_gid,\n        info.st_size,\n'''
          identity_replacement = '''        info.st_gid,\n        info.st_nlink,\n        info.st_size,\n'''
          if text.count(identity) != 1:
              raise SystemExit("could not uniquely add link-count identity")
          text = text.replace(identity, identity_replacement)

          collect_start = '''def collect_directory(\n    directory_fd: int,\n    relative_parts: tuple[str, ...],\n    artifact_kind: str,\n    entries: list[dict[str, object]],\n) -> None:\n    for name in sorted(os.listdir(directory_fd)):\n'''
          collect_start_replacement = '''def collect_directory(\n    directory_fd: int,\n    relative_parts: tuple[str, ...],\n    artifact_kind: str,\n    entries: list[dict[str, object]],\n) -> None:\n    directory_before = os.fstat(directory_fd)\n    if not stat.S_ISDIR(directory_before.st_mode):\n        raise SystemExit(f"visual-evidence ancestry is not a directory: {'/'.join(relative_parts)}")\n\n    for name in sorted(os.listdir(directory_fd)):\n'''
          if text.count(collect_start) != 1:
              raise SystemExit("could not uniquely locate collect_directory body")
          text = text.replace(collect_start, collect_start_replacement)

          collect_end = '''        entries.append({\n            "artifactKind": artifact_kind,\n            "relativePath": "/".join((*relative_parts, name)),\n            "byteCount": byte_count,\n            "sha256": digest,\n        })\n\n\ntry:\n    artifacts_fd = os.open(artifacts_root, DIRECTORY_FLAGS)\n'''
          collect_end_replacement = '''        entries.append({\n            "artifactKind": artifact_kind,\n            "relativePath": "/".join((*relative_parts, name)),\n            "byteCount": byte_count,\n            "sha256": digest,\n        })\n\n    directory_after = os.fstat(directory_fd)\n    if stable_identity(directory_before) != stable_identity(directory_after):\n        raise SystemExit(f"visual-evidence directory changed during enumeration: {'/'.join(relative_parts)}")\n\n\ntry:\n    artifacts_fd = os.open(artifacts_root, DIRECTORY_FLAGS)\n'''
          if text.count(collect_end) != 1:
              raise SystemExit("could not uniquely locate collect_directory end")
          text = text.replace(collect_end, collect_end_replacement)

          root_start = '''try:\n    entries: list[dict[str, object]] = []\n    for artifact_kind, relative_root in (\n'''
          root_start_replacement = '''try:\n    root_before = os.fstat(artifacts_fd)\n    if not stat.S_ISDIR(root_before.st_mode):\n        raise SystemExit("Simulator artifact root is not one directory")\n\n    entries: list[dict[str, object]] = []\n    for artifact_kind, relative_root in (\n'''
          if text.count(root_start) != 1:
              raise SystemExit("could not uniquely locate artifact-root enumeration start")
          text = text.replace(root_start, root_start_replacement)

          root_end = '''        finally:\n            os.close(root_fd)\n\n    entries.sort(key=lambda entry: (str(entry["artifactKind"]), str(entry["relativePath"])))\n'''
          root_end_replacement = '''        finally:\n            os.close(root_fd)\n\n    root_after = os.fstat(artifacts_fd)\n    if stable_identity(root_before) != stable_identity(root_after):\n        raise SystemExit("Simulator artifact root changed during visual-evidence enumeration")\n\n    entries.sort(key=lambda entry: (str(entry["artifactKind"]), str(entry["relativePath"])))\n'''
          if text.count(root_end) != 1:
              raise SystemExit("could not uniquely locate artifact-root enumeration end")
          text = text.replace(root_end, root_end_replacement)

          manifest_check = '''        if not stat.S_ISREG(manifest_after.st_mode) or manifest_after.st_size != len(manifest_bytes):\n            raise SystemExit("published Simulator visual evidence manifest identity is invalid")\n'''
          manifest_check_replacement = '''        if (\n            not stat.S_ISREG(manifest_after.st_mode)\n            or manifest_after.st_size != len(manifest_bytes)\n            or manifest_after.st_nlink != 1\n        ):\n            raise SystemExit("published Simulator visual evidence manifest identity is invalid")\n'''
          if text.count(manifest_check) != 1:
              raise SystemExit("could not uniquely strengthen manifest descriptor identity")
          text = text.replace(manifest_check, manifest_check_replacement)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate merged custody model
        run: |
          bash -n scripts/ci/xcode27_simulator_capture.sh
          python3 -m py_compile scripts/ci/tests/test_xcode27_simulator_visual_evidence_descriptor_custody_source.py
          python3 scripts/ci/tests/test_xcode27_simulator_visual_evidence_descriptor_custody_source.py
          git diff --check

      - name: Commit repair and self-delete
        run: |
          rm .github/workflows/_temp_simulator_directory_stability.yml
          git config user.name "nembra-v14-bot"
          git config user.email "nembra-v14-bot@users.noreply.github.com"
          git add scripts/ci/xcode27_simulator_capture.sh \
                  scripts/ci/tests/test_xcode27_simulator_visual_evidence_descriptor_custody_source.py \
                  .github/workflows/_temp_simulator_directory_stability.yml
          git commit -m "[Capture visual QA v14] Re-prove retained directory stability"
          git push origin HEAD:integration/es80-v14-simulator-directory-stability-gpt56-go
