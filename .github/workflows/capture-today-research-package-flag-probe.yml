name: Capture TODAY Research Package Flag Probe

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/capture-today-research-package-flag-probe.yml

permissions:
  contents: read

jobs:
  physical-ios-package-flag-probe:
    name: Prove TODAY flag reaches NembraBluetoothCapture
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 20
    concurrency:
      group: nembra-capture-today-package-flag-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      EXPECTED_PRODUCT_SHA: 06b759a5823a4deb343b48f3228ea9f86be7b514
      WORKFLOW_PATH: .github/workflows/capture-today-research-package-flag-probe.yml

    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Verify validation branch is one workflow commit above exact product
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          actual_parent="$(git rev-parse HEAD^)"
          printf 'Validation head: %s\nExpected product parent: %s\nActual product parent: %s\n' \
            "$actual_head" "$EXPECTED_PRODUCT_SHA" "$actual_parent"
          test "$actual_parent" = "$EXPECTED_PRODUCT_SHA"
          changed="$(git diff --name-only "$EXPECTED_PRODUCT_SHA" HEAD)"
          test "$changed" = "$WORKFLOW_PATH"

      - name: Verify TODAY wrapper custody before probing
        run: |
          set -euo pipefail
          wrapper='scripts/ci/xcode27_today_research_field_candidate.sh'
          test -x "$wrapper"
          git ls-files -s "$wrapper" | grep -Eq '^100755 '
          grep -Fq "export OTHER_SWIFT_FLAGS='\$(inherited) -DNEMBRA_ES80_TODAY_RESEARCH'" "$wrapper"
          grep -Fq 'exec "$CANONICAL_PRODUCER" "$@"' "$wrapper"

      - name: Probe exact wrapper flag through app build into local Swift package
        run: |
          set -euo pipefail
          probe='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/_ResearchFlagPropagationProbe.swift'
          logs="$RUNNER_TEMP/nembra-research-flag-probe"
          negative_derived="$RUNNER_TEMP/nembra-research-flag-negative-derived"
          positive_derived="$RUNNER_TEMP/nembra-research-flag-positive-derived"
          mkdir -p "$logs"

          cleanup() {
            rm -f "$probe"
          }
          trap cleanup EXIT

          cat > "$probe" <<'SWIFT'
          #if !NEMBRA_ES80_TODAY_RESEARCH
          #error("NEMBRA_RESEARCH_FLAG_PROBE_MISSING")
          #endif

          enum NembraTODAYResearchFlagPropagationProbe {
              static let reachedBluetoothCapturePackage = true
          }
          SWIFT

          common=(
            -project Nembra.xcodeproj
            -scheme Nembra
            -configuration Release
            -destination 'generic/platform=iOS'
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
          )

          # Negative control: an ordinary Release build must compile this package source and fail
          # because the dedicated TODAY capability is intentionally absent.
          set +e
          xcodebuild "${common[@]}" -derivedDataPath "$negative_derived" clean build \
            >"$logs/negative-control.log" 2>&1
          negative_status=$?
          set -e
          if [[ "$negative_status" -eq 0 ]]; then
            echo 'Ordinary Release unexpectedly compiled the research-only package probe.' >&2
            exit 1
          fi
          if ! grep -Fq 'NEMBRA_RESEARCH_FLAG_PROBE_MISSING' "$logs/negative-control.log"; then
            echo 'Negative control failed for a reason other than the package research flag probe.' >&2
            tail -n 160 "$logs/negative-control.log" >&2 || true
            exit 1
          fi

          # Positive control: reproduce the TODAY wrapper mechanism exactly. Success proves the
          # environment build setting reaches NembraBluetoothCapture while building the real app
          # dependency graph for a physical iOS Release target.
          export OTHER_SWIFT_FLAGS='$(inherited) -DNEMBRA_ES80_TODAY_RESEARCH'
          xcodebuild "${common[@]}" -derivedDataPath "$positive_derived" clean build \
            2>&1 | tee "$logs/positive-control.log"

          grep -Fq '_ResearchFlagPropagationProbe.swift' "$logs/positive-control.log"
          cleanup
          trap - EXIT
          test ! -e "$probe"
          test -z "$(git status --porcelain --untracked-files=no)"

          printf 'TODAY research compile capability reached NembraBluetoothCapture on exact product parent %s.\n' \
            "$EXPECTED_PRODUCT_SHA"

      - name: Upload propagation probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-today-package-flag-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nembra-research-flag-probe
          if-no-files-found: warn
          retention-days: 30
