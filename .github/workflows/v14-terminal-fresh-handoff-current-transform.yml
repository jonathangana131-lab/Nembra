name: V14 terminal fresh handoff current transform
on:
  push:
    branches: [feature/capture-terminal-fresh-handoff-v14-current]
permissions:
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/capture-terminal-fresh-handoff-v14-current
      - name: Compose reviewed terminal delta only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "32fc01055f79cbc40395459600754539e201425c"
          git fetch origin integration/es80-v14-terminal-controller-fresh-handoff/gpt56-go
          terminal_head="$(git rev-parse origin/integration/es80-v14-terminal-controller-fresh-handoff/gpt56-go)"
          test "$terminal_head" = "ee875d3207f456658b9967b89f80e1f7a65b4353"
          merge_base="$(git merge-base 32fc01055f79cbc40395459600754539e201425c "$terminal_head")"
          echo "terminal merge-base: $merge_base"
          git diff --binary "$merge_base".."$terminal_head" -- \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerTerminalFreshSessionConsumerTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothTerminalRealRecorderReopenTests.swift \
            > /tmp/terminal.patch
          test -s /tmp/terminal.patch
          git apply --3way /tmp/terminal.patch
          git diff --check
          grep -F 'pendingTerminalQueueResolution' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -F 'reopenAfterTerminalFreshTargetSession' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerTerminalFreshSessionConsumerTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothTerminalRealRecorderReopenTests.swift
          rm .github/workflows/v14-terminal-fresh-handoff-current-transform.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[Capture terminal v14] Compose terminal resolution into exact fresh recorder'
          git push origin HEAD:feature/capture-terminal-fresh-handoff-v14-current
