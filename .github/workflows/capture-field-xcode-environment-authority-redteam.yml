name: Capture Field Xcode Environment Authority Red Team

on:
  pull_request:
    paths:
      - Scripts/capture_tuya_private_input_build_guard.py
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_field_xcode_environment_authority.py
      - .github/workflows/capture-field-xcode-environment-authority-redteam.yml

permissions:
  contents: read

jobs:
  xcode-environment-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Bind exact product checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Require closed residual Xcode build environment
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_xcode_environment_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_xcode_environment_authority.py
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          git diff --check
