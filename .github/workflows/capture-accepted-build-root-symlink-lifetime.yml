name: Capture Accepted Build Root Symlink Lifetime

on:
  pull_request:
    paths:
      - scripts/ci/capture_accepted_build_root_custody.py
      - scripts/ci/tests/test_capture_accepted_build_root_symlink_lifetime.py
      - .github/workflows/capture-accepted-build-root-symlink-lifetime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-accepted-root-symlink-lifetime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_ACCEPTED_INPUT_PARENT: 807f1097332435d36e8c859444b63e415b846404
  ACCEPTED_ROOT_CUSTODY_BLOB: 2eb437eaf2e5d46f784c05ea666ebeb92ba9175c
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  lifetime:
    name: Prove sealed accepted root blocks field symlink retarget
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind current accepted-input parent and exact validation delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_ACCEPTED_INPUT_PARENT")" = "$EXACT_ACCEPTED_INPUT_PARENT"
          actual="$(git diff --name-only "$EXACT_ACCEPTED_INPUT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-accepted-build-root-symlink-lifetime.yml \
            scripts/ci/capture_accepted_build_root_custody.py \
            scripts/ci/tests/test_capture_accepted_build_root_symlink_lifetime.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$EXACT_ACCEPTED_INPUT_PARENT"...HEAD
          test "$(git hash-object scripts/ci/capture_accepted_build_root_custody.py)" = "$ACCEPTED_ROOT_CUSTODY_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exact helper and lifetime witness without artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              "scripts/ci/capture_accepted_build_input_snapshot.py",
              "scripts/ci/capture_accepted_build_root_custody.py",
              "scripts/ci/tests/test_capture_accepted_build_root_symlink_lifetime.py",
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Require noninteractive root authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true

      - name: Reproduce live retarget and prove sealed-root denial
        shell: bash
        run: |
          set -euo pipefail
          field_user="$(/usr/bin/id -un)"
          /usr/bin/sudo -n env \
            NEMBRA_TEST_FIELD_USER="$field_user" \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -B -I \
            scripts/ci/tests/test_capture_accepted_build_root_symlink_lifetime.py \
            --field-user "$field_user"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve validation boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'os.lchown(path, 0, 0)' scripts/ci/capture_accepted_build_root_custody.py
          grep -Fq 'os.chmod(root, 0o700)' scripts/ci/capture_accepted_build_root_custody.py
          grep -Fq 'live_attack' scripts/ci/tests/test_capture_accepted_build_root_symlink_lifetime.py
          grep -Fq 'sealed_attack' scripts/ci/tests/test_capture_accepted_build_root_symlink_lifetime.py
          echo "NEMBRA_ACCEPTED_ROOT_SYMLINK_LIFETIME validationOnly=true liveRetargetWitnessed=true sealedRetargetDenied=true xcodeBuildWired=false signingAuthority=false installAuthority=false deviceTouched=false bluetoothTouched=false physicalAuthorityCreated=false"
