name: Materialize Capture Application Event Metadata Precedence

on:
  push:
    branches:
      - "repair/v14-capture-application-event-metadata-precedence-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current-product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-application-event-metadata-precedence-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift'

      - name: Make Nembra event provenance win reserved-key collisions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          start = source.index('private func receivedApplicationUpdate(')
          end = source.index('private func startWatchdog', start)
          receiver = source[start:end]

          old = ''']) { current, _ in current })'''
          new = ''']) { _, trusted in trusted })'''
          if receiver.count(old) != 1:
              raise SystemExit(f'expected exactly one untrusted-precedence collision closure, found {receiver.count(old)}')
          if new in receiver:
              raise SystemExit('trusted-precedence repair already present before materialization')

          receiver = receiver.replace(old, new, 1)
          source = source[:start] + receiver + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify provenance boundary and narrow scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('private func receivedApplicationUpdate(')
          end = s.index('private func startWatchdog', start)
          receiver = s[start:end]

          assert 'log("tuya_application_update"' in receiver
          assert '"generation": String(token.diagnosticGeneration)' in receiver
          assert ']) { _, trusted in trusted })' in receiver
          assert ']) { current, _ in current })' not in receiver
          assert 'recordApplicationUpdate' in receiver
          assert 'currentConnectionToken == token' in receiver

          for forbidden in (
              'queryDps', 'publishDps', 'writeValue', 'writeWithoutResponse',
              'endConnection', 'disconnectBLE'
          ):
              assert forbidden not in receiver, forbidden

          print('Capture application event metadata precedence contract: PASS')
          PY
          git diff --check

      - name: Collapse helper into clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          parent='870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81'
          rm .github/workflows/materialize-capture-application-event-metadata-precedence-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git add -u .github/workflows/materialize-capture-application-event-metadata-precedence-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' \
            commit -m 'fix(capture): protect application event provenance metadata'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:repair/v14-capture-application-event-metadata-precedence-sol
