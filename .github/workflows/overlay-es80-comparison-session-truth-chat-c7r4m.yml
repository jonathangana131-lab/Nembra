name: Overlay accepted ES80 comparison session truth

on:
  push:
    branches:
      - parallel/recover-es80-passive-integration/chat-c7r4m

permissions:
  contents: write

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact blocked integration product
        uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Verify immutable product parent
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=61f03d3e67d732e229b85ca2b53258ee689464d3
          WORKFLOW=.github/workflows/overlay-es80-comparison-session-truth-chat-c7r4m.yml
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git diff --name-only "$PRODUCT" HEAD)" = "$WORKFLOW"

      - name: Overlay exact accepted #380 comparison provenance
        shell: bash
        run: |
          set -euo pipefail
          COMPARISON=8944861b4b5361fcd6c20da2cee9e8db581dda7e
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothCaptureComparison.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothCaptureComparisonSessionIdentityTests.swift

          git fetch --no-tags origin "$COMPARISON"
          git checkout "$COMPARISON" -- "$SOURCE" "$TEST"

          test "$(git hash-object "$SOURCE")" = "$(git rev-parse "$COMPARISON:$SOURCE")"
          test "$(git hash-object "$TEST")" = "$(git rev-parse "$COMPARISON:$TEST")"

          grep -Fq 'case sameCaptureSession' "$SOURCE"
          grep -Fq 'if baseline.id == comparison.id' "$SOURCE"
          grep -Fq 'selfComparisonFailsClosed' "$TEST"
          grep -Fq 'sameSessionIDDifferentContentsFailClosed' "$TEST"

      - name: Prove bounded effective integration delta and commit
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=61f03d3e67d732e229b85ca2b53258ee689464d3
          MAIN=e07d6c72e4117370c76f084f446bdf55ee515a1d
          WORKFLOW=.github/workflows/overlay-es80-comparison-session-truth-chat-c7r4m.yml
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothCaptureComparison.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothCaptureComparisonSessionIdentityTests.swift

          git rm "$WORKFLOW"
          git diff --check "$PRODUCT"

          mapfile -t PRODUCT_DELTA < <(git diff --name-only "$PRODUCT" | sort)
          mapfile -t EXPECTED < <(printf '%s\n' "$SOURCE" "$TEST" | sort)
          test "${#PRODUCT_DELTA[@]}" -eq 2
          test "${PRODUCT_DELTA[0]}" = "${EXPECTED[0]}"
          test "${PRODUCT_DELTA[1]}" = "${EXPECTED[1]}"

          # Current-main integration remains bounded: one additional package test path,
          # no app/workflow/UI changes, and no characteristic-value write path.
          test "$(git diff --name-only "$MAIN" | wc -l | tr -d ' ')" = 45
          test -z "$(git diff --name-only "$MAIN" -- .github/workflows NembraApp NembraAppTests NembraUITests)"
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 integration must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

          git add "$SOURCE" "$TEST"
          git config user.name "nembra-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "[recover es80 passive integration] Reject same-session comparison metrics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
