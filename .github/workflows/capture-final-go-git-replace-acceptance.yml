name: Capture Final GO Git Replace Custody Acceptance

on:
  push:
    branches:
      - repair/v14-final-go-replace-object-custody-sol
    paths:
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/tests/test_es80_final_go_git_replace_custody.py
      - .github/workflows/capture-final-go-git-replace-acceptance.yml
  pull_request:
    branches:
      - control/v14-auth-stationary-final-go-sol
    paths:
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/tests/test_es80_final_go_git_replace_custody.py
      - .github/workflows/capture-final-go-git-replace-acceptance.yml

permissions:
  contents: read

jobs:
  replacement-object-custody:
    name: Reject Git replacement-object authority substitution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind acceptance to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate Final-GO replacement-blind Git custody
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_final_go_git_replace_custody.py
          python3 scripts/ci/tests/test_es80_final_go_git_replace_custody.py
