name: TEMP V14 Pin Final GO installer subject current

on:
  push:
    branches:
      - repair/v14-final-go-pinned-installer-subject-current-sol

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pinned installer-subject repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/temp_v14_pin_final_go_installer_subject.py

      - name: Validate complete current Final-GO authority suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/es80_authenticated_stationary_signed_artifact.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py \
            scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          python3 - <<'PY'
          from pathlib import Path
          source=Path('scripts/ci/es80_authenticated_stationary_final_go.py').read_text()
          tests=Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py').read_text()
          for needle in (
              'def canonical_private_path(',
              'def installer_environment(',
              '"BASH_ENV":"/dev/null"',
              'git(root,"ls-files","-v","--",relative)',
              'git(root,"hash-object","--no-filters","--",relative)',
              'candidate authority worktree bytes differ from accepted Git blob',
              'mainSHA',
              'candidate does not contain the exact current main authority',
              'def accepted_installer_blob(',
              '"cat-file","blob"',
              'source /dev/fd/',
              'stdin=subprocess.DEVNULL',
              'pass_fds=(read_fd,)',
              'threading.Thread',
          ):
              if needle not in source: raise SystemExit(f'missing composed authority invariant: {needle}')
          if 'test_verified_installer_cannot_be_replaced_only_for_execution' not in tests:
              raise SystemExit('missing installer execution-subject regression')
          PY
          git diff --check

      - name: Publish clean two-file net repair
        shell: bash
        run: |
          set -euo pipefail
          base='bccdab041235982ee95a9a4bd366d7b1ec50ccda'
          rm -f scripts/ci/temp_v14_pin_final_go_installer_subject.py
          rm -f .github/workflows/temp-v14-pin-final-go-installer-subject-current.yml
          git add -A
          git diff --cached --check
          expected=$'.github/workflows/temp-v14-pin-final-go-installer-subject-current.yml\nscripts/ci/es80_authenticated_stationary_final_go.py\nscripts/ci/temp_v14_pin_final_go_installer_subject.py\nscripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git config user.name 'nembra-v14-sol'
          git config user.email 'nembra-v14-sol@users.noreply.github.com'
          git commit -m 'fix(capture): pin Final-GO installer execution bytes'
          net=$'scripts/ci/es80_authenticated_stationary_final_go.py\nscripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py'
          test "$(git diff --name-only "$base"..HEAD | sort)" = "$net"
          git diff --check "$base"..HEAD
          git push origin HEAD:repair/v14-final-go-pinned-installer-subject-current-sol

# Registered in the previous commit; this push triggers the current-head runner.
