name: Capture authenticated-update secret redaction materializer

on:
  push:
    branches:
      - fix/v14-capture-application-secret-redaction-r2-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact recovery lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "402cc372c14734a0caa71a19453400cfd7cce6e6"
          git merge-base --is-ancestor fad2d84671326b5b925c7feecde5c4181e8efcd9 HEAD
          mapfile -t changed < <(git diff --name-only fad2d84671326b5b925c7feecde5c4181e8efcd9...HEAD | sort)
          expected=(
            ".github/workflows/capture-application-secret-redaction-materialize.yml"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"

      - name: Materialize fail-closed recursive redaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()
          old = '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              guard let dps, !dps.isEmpty else { return }
              var sanitized: [String: String] = [:]
              for (key, value) in dps {
                  sanitized[String(describing: key)] = String(describing: value)
              }
              onApplicationUpdate?(sanitized)
          }
          '''
          new = '''    private static let secretKeyFragments = [
              "localkey",
              "accesstoken",
              "refreshtoken",
              "authkey",
              "seckey"
          ]

          private static func isSecretKey(_ key: String) -> Bool {
              let normalizedKey = key.lowercased().filter { $0.isLetter || $0.isNumber }
              return secretKeyFragments.contains { normalizedKey.contains($0) }
          }

          private static func redactApplicationSecrets(_ object: Any) -> Any {
              if let dictionary = object as? [AnyHashable: Any] {
                  var sanitized: [AnyHashable: Any] = [:]
                  sanitized.reserveCapacity(dictionary.count)
                  for (key, value) in dictionary {
                      let keyString = String(describing: key)
                      sanitized[key] = isSecretKey(keyString)
                          ? "<redacted>"
                          : redactApplicationSecrets(value)
                  }
                  return sanitized
              }
              if let array = object as? [Any] {
                  return array.map(redactApplicationSecrets)
              }
              return object
          }

          func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              guard let dps, !dps.isEmpty else { return }
              var sanitized: [String: String] = [:]
              sanitized.reserveCapacity(dps.count)
              for (key, value) in dps {
                  let keyString = String(describing: key)
                  if Self.isSecretKey(keyString) {
                      sanitized[keyString] = "<redacted>"
                  } else {
                      sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))
                  }
              }
              onApplicationUpdate?(sanitized)
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one SmartLifeDriver dpsUpdate block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify redaction contract and scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          required = [
              "private static func redactApplicationSecrets(_ object: Any) -> Any",
              "secretKeyFragments",
              '"localkey"',
              '"accesstoken"',
              '"refreshtoken"',
              '"authkey"',
              '"seckey"',
              "key.lowercased().filter { $0.isLetter || $0.isNumber }",
              "array.map(redactApplicationSecrets)",
              "String(describing: Self.redactApplicationSecrets(value))",
              'sanitized[keyString] = "<redacted>"',
              "onApplicationUpdate?(sanitized)"
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"redaction contract missing: {missing}")
          forbidden = [
              "queryDps",
              "publishDps",
              "publishDpsWithSuccess",
              "writeValue"
          ]
          driver = source.split("@MainActor\nprivate final class SmartLifeDriver", 1)[1].split("#endif\n\nprivate enum AppleAccountAuthorizationError", 1)[0]
          leaked = [item for item in forbidden if item in driver]
          if leaked:
              raise SystemExit(f"redaction repair introduced forbidden protocol/control surface: {leaked}")
          PY
          git diff --check

      - name: Retire one-shot materializer and checkpoint product repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-application-secret-redaction-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift \
            .github/workflows/capture-application-secret-redaction-materialize.yml
          git config user.name "nembra-v14-materializer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): redact authenticated application secrets"
          git push origin HEAD:fix/v14-capture-application-secret-redaction-r2-sol
