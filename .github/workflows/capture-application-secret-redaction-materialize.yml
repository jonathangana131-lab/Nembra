name: Materialize Capture Application Secret Redaction

on:
  push:
    branches:
      - sol/v14-capture-application-secret-redaction-current-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-application-secret-redaction-current-sol
          fetch-depth: 0

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          product_parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          git merge-base --is-ancestor "$product_parent" HEAD
          git diff --quiet "$product_parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift

      - name: Apply application secret-custody repair
        run: python3 scripts/ci/materialize_capture_application_secret_redaction.py apply

      - name: Verify bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_application_secret_redaction.py verify
          python3 -m py_compile scripts/ci/materialize_capture_application_secret_redaction.py
          git diff --check

      - name: Publish clean product bytes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-application-secret-redaction-materialize.yml
          rm scripts/ci/materialize_capture_application_secret_redaction.py
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): redact authenticated application secrets'
          git push origin HEAD:sol/v14-capture-application-secret-redaction-current-sol
