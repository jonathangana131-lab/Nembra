name: Generate Nembra App Icon

on:
  push:
    branches:
      - parallel/production-app-icon/chat-q7m4
    paths:
      - .github/workflows/generate-nembra-app-icon.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/production-app-icon/chat-q7m4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate and validate icon assets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json

          OUT = Path("NembraApp/Resources/Assets.xcassets/AppIcon.appiconset")
          OUT.mkdir(parents=True, exist_ok=True)
          SCALE = 4
          SIZE = 1024

          def S(value):
              return int(round(value * SCALE))

          def render(filename, background, disc, mark, node, *, transparent=False):
              mode = "RGBA" if transparent else "RGB"
              base = (0, 0, 0, 0) if transparent else background
              image = Image.new(mode, (SIZE * SCALE, SIZE * SCALE), base)
              draw = ImageDraw.Draw(image)

              if disc is not None:
                  draw.ellipse((S(190), S(190), S(834), S(834)), fill=disc)

              points = [(S(324), S(700)), (S(324), S(324)), (S(700), S(700)), (S(700), S(324))]
              draw.line(points, fill=mark, width=S(82), joint="curve")
              radius = S(30)
              cx, cy = S(724), S(282)
              draw.ellipse((cx-radius, cy-radius, cx+radius, cy+radius), fill=node)

              image = image.resize((SIZE, SIZE), Image.Resampling.LANCZOS)
              image.save(OUT / filename, optimize=True, compress_level=9)

          render(
              "NembraAppIcon.png",
              (9, 13, 15),
              (23, 29, 31),
              (247, 248, 244),
              (168, 215, 178),
          )
          render(
              "NembraAppIcon-Dark.png",
              None,
              (14, 18, 20, 224),
              (250, 250, 247, 255),
              (177, 223, 188, 255),
              transparent=True,
          )
          render(
              "NembraAppIcon-Tinted.png",
              None,
              (34, 34, 34, 190),
              (238, 238, 238, 255),
              (150, 150, 150, 255),
              transparent=True,
          )

          manifest = {
              "images": [
                  {
                      "filename": "NembraAppIcon.png",
                      "idiom": "universal",
                      "platform": "ios",
                      "size": "1024x1024",
                  },
                  {
                      "appearances": [{"appearance": "luminosity", "value": "dark"}],
                      "filename": "NembraAppIcon-Dark.png",
                      "idiom": "universal",
                      "platform": "ios",
                      "size": "1024x1024",
                  },
                  {
                      "appearances": [{"appearance": "luminosity", "value": "tinted"}],
                      "filename": "NembraAppIcon-Tinted.png",
                      "idiom": "universal",
                      "platform": "ios",
                      "size": "1024x1024",
                  },
              ],
              "info": {"author": "xcode", "version": 1},
          }
          (OUT / "Contents.json").write_text(json.dumps(manifest, indent=2) + "\n")

          default = Image.open(OUT / "NembraAppIcon.png").convert("RGBA")
          dark = Image.open(OUT / "NembraAppIcon-Dark.png").convert("RGBA")
          tinted = Image.open(OUT / "NembraAppIcon-Tinted.png").convert("RGBA")
          for name, image in [("default", default), ("dark", dark), ("tinted", tinted)]:
              assert image.size == (1024, 1024), (name, image.size)

          assert default.getchannel("A").getextrema() == (255, 255)
          dark_alpha = dark.getchannel("A").getextrema()
          tinted_alpha = tinted.getchannel("A").getextrema()
          assert dark_alpha[0] == 0 and dark_alpha[1] == 255, dark_alpha
          assert tinted_alpha[0] == 0 and tinted_alpha[1] == 255, tinted_alpha

          for r, g, b, a in tinted.getdata():
              if a:
                  assert r == g == b, (r, g, b, a)

          preview_sizes = [180, 120, 60, 40]
          gap = 28
          label_space = 0
          row_height = 180
          canvas_w = 3 * 180 + 4 * gap
          canvas_h = len(preview_sizes) * row_height + 2 * gap
          preview = Image.new("RGB", (canvas_w, canvas_h), (226, 229, 231))
          variants = [default, dark, tinted]
          for row, size in enumerate(preview_sizes):
              y = gap + row * row_height + (180 - size) // 2
              for col, image in enumerate(variants):
                  icon = image.resize((size, size), Image.Resampling.LANCZOS)
                  x = gap + col * (180 + gap) + (180 - size) // 2
                  checker = Image.new("RGBA", (size, size), (24, 28, 31, 255))
                  checker.alpha_composite(icon)
                  preview.paste(checker.convert("RGB"), (x, y))
          preview.save("nembra-app-icon-preview.png", optimize=True)

          print("validated:")
          for path in sorted(OUT.iterdir()):
              print(path.name, path.stat().st_size)
          PY

      - name: Upload visual QA preview
        uses: actions/upload-artifact@v4
        with:
          name: nembra-app-icon-preview
          path: nembra-app-icon-preview.png
          if-no-files-found: error

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/Resources/Assets.xcassets/AppIcon.appiconset
          git diff --cached --exit-code && { echo "No asset changes generated"; exit 1; } || true
          git commit -m "Add production Nembra app icon variants"
          git push origin HEAD:parallel/production-app-icon/chat-q7m4
