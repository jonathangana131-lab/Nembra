# V17 child recovery: materialize fail-closed repair plus legacy lease-construction compatibility.
name: Capture native ACL exact-guard recovery one-shot

on:
  push:
    branches:
      - repair/v17-capture-native-acl-exact-guard-recovery-gpt56sol-go
    paths:
      - .github/workflows/capture-native-acl-failclosed-one-shot.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact recovery branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "repair/v17-capture-native-acl-exact-guard-recovery-gpt56sol-go"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Materialize fail-closed repair and legacy construction compatibility
        shell: python
        run: |
          from pathlib import Path

          orchestrator = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          text = orchestrator.read_text()
          old = '''                        # Path replacement is not a rollback failure: descriptor custody
                        # intentionally restores the original vnode. Verify path text only
                        # when the canonical name still identifies that exact object.
                        if path_matches:
                            restored = _path_acl_listing(
                                path, descriptor, accepted_signature, is_directory
                            )
                            if restored != str(record["before"]):
                                failures.append(
                                    f"private read-lease did not restore exact ACL listing: {path}"
                                )
'''
          new = '''                        # Descriptor custody restores the original vnode even if the
                        # canonical name was replaced, but namespace identity loss during an
                        # authority-bearing lease is still terminal. Never mutate the replacement.
                        if not path_matches:
                            failures.append(
                                f"private read-lease pathname no longer identifies opened object: {path}"
                            )
                        else:
                            restored = _path_acl_listing(
                                path, descriptor, accepted_signature, is_directory
                            )
                            if restored != str(record["before"]):
                                failures.append(
                                    f"private read-lease did not restore exact ACL listing: {path}"
                                )
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one native revoke anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old_ctor = '''        lease = _PrivateReadLease(
            private_subjects,
            lease_repo,
            use_native_darwin_acl=(accepted_root is not None),
        )
'''
          new_ctor = '''        if accepted_root is None:
            lease = _PrivateReadLease(private_subjects, lease_repo)
        else:
            lease = _PrivateReadLease(
                private_subjects,
                lease_repo,
                use_native_darwin_acl=True,
            )
'''
          if text.count(old_ctor) != 1:
              raise SystemExit(f"expected one private lease construction anchor, found {text.count(old_ctor)}")
          orchestrator.write_text(text.replace(old_ctor, new_ctor, 1))

          test_path = Path("scripts/ci/tests/test_capture_private_read_lease_rollback.py")
          test_text = test_path.read_text()
          old_test = '''                subject.rename(moved)
                subject.write_bytes(b"attacker replacement\\n")
                lease.revoke()

            capture.assert_called_once_with(descriptor)
'''
          new_test = '''                subject.rename(moved)
                subject.write_bytes(b"attacker replacement\\n")
                with self.assertRaisesRegex(
                    helper.SelectedXcodeBuildOrchestratorError,
                    "pathname no longer identifies opened object",
                ):
                    lease.revoke()
                self.assertEqual(subject.read_bytes(), b"attacker replacement\\n")
                self.assertEqual(moved.read_bytes(), b"fixture\\n")

            capture.assert_called_once_with(descriptor)
'''
          if test_text.count(old_test) != 1:
              raise SystemExit(f"expected one rollback test anchor, found {test_text.count(old_test)}")
          test_path.write_text(test_text.replace(old_test, new_test, 1))

      - name: Run focused regressions
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_private_read_lease_rollback.py
          python3 scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py

      - name: Enforce exact product delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py | sort)"
          test "$changed" = "$expected"
          ! grep -nE 'publishDps\(|writeValue\(|removeDevice|factoryReset' scripts/ci/capture_selected_xcode_build_orchestrator.py

      - name: Publish coherent recovery and retire one-shot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/capture-native-acl-failclosed-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py \
                  scripts/ci/tests/test_capture_private_read_lease_rollback.py \
                  .github/workflows/capture-native-acl-failclosed-one-shot.yml
          git diff --cached --check
          git commit -m "Capture: close native ACL exact-guard recovery"
          git push origin HEAD:repair/v17-capture-native-acl-exact-guard-recovery-gpt56sol-go
