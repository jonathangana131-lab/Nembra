name: Capture software export Share migration

on:
  push:
    branches:
      - integration/es80-v14-software-export-share/gpt56

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-software-export-share/gpt56
      - name: Verify and migrate exact app shell
        shell: bash
        run: |
          set -euo pipefail
          shell=NembraApp/Features/Research/ES80CaptureShellView.swift
          test "$(git hash-object "$shell")" = "9957a8d93c715de83835752cdf1a1390b1da55d7"
          python3 -m py_compile scripts/ci/capture_software_export_share_patch.py
          python3 scripts/ci/capture_software_export_share_patch.py
          git diff --check
          grep -q 'es80.capture.confirm-setup' "$shell"
          grep -q 'encodedFinalizedSoftwareExportForCurrentApplication' "$shell"
          grep -q 'setup: setup' "$shell"
          grep -q 'prepareSoftwareExportForShare()' "$shell"
          grep -q 'Capture remains sealed' "$shell"
          ! grep -q 'persistShareArtifact(artifact.captureJSON)' "$shell"
      - name: Commit clean product tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-software-export-share.yml
          rm scripts/ci/capture_software_export_share_patch.py
          rm -rf scripts/ci/__pycache__
          git config user.name "nembra-v14-swarm"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(capture): share package-owned software evidence envelope"
          git push origin HEAD:integration/es80-v14-software-export-share/gpt56
