name: Materialize Capture correlation progress truth

on:
  push:
    branches:
      - product/v14-capture-guided-progress-truth-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '829e19fa7abb0d61ac1f6fbea441ed40b2c6bcbe'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/materialize-v14-capture-correlation-progress-truth.yml'

      - name: Apply reviewed chronology presentation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text(encoding='utf-8')

          old_visible = 'Text("\\(min(test.correlationCompletedWindowCount + 1, 4))/4")'
          new_visible = 'Text("\\(correlationDisplayedWindowOrdinal)/4")'
          if app.count(old_visible) != 1:
              raise SystemExit(f'expected exactly one stale visible ordinal, found {app.count(old_visible)}')
          app = app.replace(old_visible, new_visible, 1)

          anchor = '''    private var hero: some View {\n'''
          helper = '''    private var correlationDisplayedWindowOrdinal: Int {\n        test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)\n    }\n\n'''
          if helper in app:
              raise SystemExit('correlation ordinal helper already present')
          if app.count(anchor) != 1:
              raise SystemExit(f'expected one SecureLink hero anchor, found {app.count(anchor)}')
          app = app.replace(anchor, helper + anchor, 1)
          app_path.write_text(app, encoding='utf-8')

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift')
          if test_path.exists():
              raise SystemExit('correlation progress regression already exists')
          test_path.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture correlation progress presentation truth")
          struct TuyaCorrelationProgressPresentationTruthSourceTests {
              @Test("completed OFF1 ON1 OFF2 ON2 correlation presents four of four")
              func completedCorrelationDoesNotFallBackToOneOfFour() throws {
                  let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let surface = try section(
                      in: app,
                      from: "private struct SecureLinkView: View",
                      to: "private struct SecureTransfer: Transferable"
                  )
                  let body = String(surface)

                  // The controller intentionally retires correlationSession before publishing `.correlated`.
                  // Presentation therefore cannot derive the completed state from the now-nil live session.
                  #expect(!body.contains("Text(\"\\(min(test.correlationCompletedWindowCount + 1, 4))/4\")"))
                  #expect(body.contains("correlationDisplayedWindowOrdinal"))
                  #expect(body.contains("test.phase == .correlated ? 4"))
                  #expect(body.contains("Text(\"\\(correlationDisplayedWindowOrdinal)/4\")"))
              }

              @Test("in-progress correlation still derives its ordinal from package-owned completed windows")
              func activeCorrelationProgressRemainsEvidenceBacked() throws {
                  let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let surface = try section(
                      in: app,
                      from: "private struct SecureLinkView: View",
                      to: "private struct SecureTransfer: Transferable"
                  )
                  let body = String(surface)

                  #expect(body.contains("min(test.correlationCompletedWindowCount + 1, 4)"))
                  #expect(!body.localizedCaseInsensitiveContains("rssi progress"))
                  #expect(!body.localizedCaseInsensitiveContains("name progress"))
                  #expect(!body.localizedCaseInsensitiveContains("tuya hint progress"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          '''.replace('          ', ''), encoding='utf-8')
          PY

          grep -Fq 'private var correlationDisplayedWindowOrdinal: Int {' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Text("\(correlationDisplayedWindowOrdinal)/4")' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'Text("\(min(test.correlationCompletedWindowCount + 1, 4))/4")' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'completed OFF1 ON1 OFF2 ON2 correlation presents four of four' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift
          git diff --check

      - name: Publish clean product successor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-v14-capture-correlation-progress-truth.yml
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift' | sort)"
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): keep correlated progress at four of four'
          git push origin HEAD:product/v14-capture-guided-progress-truth-sol
