name: Capture Accepted Build Root Custody

on:
  pull_request:
    paths:
      - scripts/ci/capture_accepted_build_root_custody.py
      - scripts/ci/tests/test_capture_accepted_build_root_custody.py
      - .github/workflows/capture-accepted-build-root-custody.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-accepted-build-root-custody-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_ACCEPTED_INPUT_PARENT: fe40c025eb10247c73820f4001ab63affaa60af7
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  custody:
    name: Prove root-custodied accepted compiler-input root
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact additive custody child
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_ACCEPTED_INPUT_PARENT")" = "$EXACT_ACCEPTED_INPUT_PARENT"
          actual="$(git diff --name-only "$EXACT_ACCEPTED_INPUT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-accepted-build-root-custody.yml \
            scripts/ci/capture_accepted_build_root_custody.py \
            scripts/ci/tests/test_capture_accepted_build_root_custody.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$EXACT_ACCEPTED_INPUT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile custody helper and witness without artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              "scripts/ci/capture_accepted_build_input_snapshot.py",
              "scripts/ci/capture_accepted_build_root_custody.py",
              "scripts/ci/tests/test_capture_accepted_build_root_custody.py",
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Require noninteractive root authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true

      - name: Prove sealed root rejects real field identity
        shell: bash
        run: |
          set -uo pipefail
          field_user="$(/usr/bin/id -un)"
          log="$RUNNER_TEMP/capture-root-custody-macos.log"
          set +e
          /usr/bin/sudo -n env \
            NEMBRA_TEST_FIELD_USER="$field_user" \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -B -I \
            scripts/ci/tests/test_capture_accepted_build_root_custody.py \
            --field-user "$field_user" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          exit "$status"

      - name: Upload exact macOS custody diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capture-root-custody-macos-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/capture-root-custody-macos.log
          retention-days: 7
          if-no-files-found: warn

      - name: Preserve production-boundary truth
        shell: bash
        run: |
          set -euo pipefail
          helper=scripts/ci/capture_accepted_build_root_custody.py
          grep -Fq 'snapshot.stage_accepted_build_inputs(' "$helper"
          grep -Fq 'os.chmod(root, 0o700)' "$helper"
          grep -Fq 'accepted_build_root_fingerprint' "$helper"
          grep -Fq 'def create_accepted_build_root(' "$helper"
          echo "NEMBRA_ACCEPTED_BUILD_ROOT_BOUNDARY rootCustodyProved=true xcodeBuildWired=false signingAuthority=false installAuthority=false deviceTouched=false bluetoothTouched=false physicalAuthorityCreated=false"
