name: Materialize Capture Foreground Integrity 870

on:
  push:
    branches:
      - recovery/v14-capture-foreground-integrity-870-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-foreground-integrity-870-sol
          fetch-depth: 0

      - name: Materialize reviewed foreground-integrity repair
        run: python3 scripts/ci/materialize_capture_foreground_integrity_870.py

      - name: Verify effective source shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/ci/materialize_capture_foreground_integrity_870.py
          test ! -e .github/workflows/materialize-capture-foreground-integrity-870.yml
          grep -Fq 'func appDidLoseForeground()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'guard !foregroundIntegrityLost else { return }' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Task { @MainActor [self] in' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq '@Environment(\.scenePhase) private var scenePhase' NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift

      - name: Commit clean product donor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Capture: fail closed on foreground loss'
          git push origin HEAD:recovery/v14-capture-foreground-integrity-870-sol
