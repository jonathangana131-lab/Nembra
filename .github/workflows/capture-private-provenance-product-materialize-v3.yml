name: Capture Private Provenance Product Materializer V3

on:
  push:
    branches:
      - repair/v17-capture-frozen-device-tools-sol-20260814
    paths:
      - .github/workflows/capture-private-provenance-product-materialize-v3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind clean construction surface
        shell: bash
        run: |
          set -euo pipefail
          base=7f0528a9320d93c154b0ffcf8b2d928143eb7092
          git merge-base --is-ancestor "$base" HEAD
          expected="$RUNNER_TEMP/expected-scaffold"
          actual="$RUNNER_TEMP/actual-scaffold"
          cat > "$expected" <<'EOF'
          .github/workflows/capture-private-provenance-product-materialize-v2.yml
          .github/workflows/capture-private-provenance-product-materialize-v3.yml
          .github/workflows/capture-private-provenance-product-materialize.yml
          EOF
          git diff --name-only "$base" HEAD | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize compiled private provenance authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} copies of anchor, found {actual}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          def insert_after_unique_line(path: str, needle: str, new_line: str) -> None:
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
              matches = [i for i, line in enumerate(lines) if needle in line]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one line containing {needle!r}, found {len(matches)}")
              lines.insert(matches[0] + 1, new_line)
              p.write_text("".join(lines), encoding="utf-8")

          identity = "NembraApp/App/NembraCaptureBuildIdentity.swift"
          replace_exact(identity,
              '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n    static let procedureIdentifierInfoKey',
              '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n    static let tuyaPrivateInputProvenanceSHA256InfoKey = "NembraCaptureTuyaPrivateInputProvenanceSHA256"\n    static let procedureIdentifierInfoKey')
          replace_exact(identity,
              '    let tuyaDependencyLockSHA256: String\n    let procedureIdentifier: String',
              '    let tuyaDependencyLockSHA256: String\n    let tuyaPrivateInputProvenanceSHA256: String\n    let procedureIdentifier: String')
          replace_exact(identity,
              '            tuyaDependencyLockSHA256: ((infoDictionary[tuyaDependencyLockSHA256InfoKey] as? String) ?? "").lowercased(),\n            procedureIdentifier:',
              '            tuyaDependencyLockSHA256: ((infoDictionary[tuyaDependencyLockSHA256InfoKey] as? String) ?? "").lowercased(),\n            tuyaPrivateInputProvenanceSHA256: ((infoDictionary[tuyaPrivateInputProvenanceSHA256InfoKey] as? String) ?? "").lowercased(),\n            procedureIdentifier:')
          replace_exact(identity,
              '''              tuyaDependencyLockSHA256.utf8.allSatisfy({ byte in
                  (byte >= 48 && byte <= 57) || (byte >= 97 && byte <= 102)
              }),
              procedureIdentifier == Self.requiredFieldProcedureIdentifier else { return false }''',
              '''              tuyaDependencyLockSHA256.utf8.allSatisfy({ byte in
                  (byte >= 48 && byte <= 57) || (byte >= 97 && byte <= 102)
              }),
              tuyaPrivateInputProvenanceSHA256.count == 64,
              tuyaPrivateInputProvenanceSHA256.allSatisfy({ character in
                  let scalars = character.unicodeScalars
                  guard scalars.count == 1, let scalar = scalars.first else { return false }
                  return (scalar.value >= 48 && scalar.value <= 57) || (scalar.value >= 97 && scalar.value <= 102)
              }),
              procedureIdentifier == Self.requiredFieldProcedureIdentifier else { return false }''')
          replace_exact(identity,
              'This build has no valid exact Git + reviewed Tuya dependency + canonical stationary procedure provenance.',
              'This build has no valid exact Git + reviewed Tuya dependency + reviewed private-input provenance + canonical stationary procedure provenance.')

          entrypoint = "NembraApp/App/NembraCaptureEntrypoint.swift"
          replace_exact(entrypoint,
              '        let tuyaDependencyLockSHA256: String\n        let procedureIdentifier: String',
              '        let tuyaDependencyLockSHA256: String\n        let tuyaPrivateInputProvenanceSHA256: String\n        let procedureIdentifier: String')
          replace_exact(entrypoint, '            schemaVersion: 10,', '            schemaVersion: 11,')
          replace_exact(entrypoint,
              '            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n            procedureIdentifier:',
              '            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n            tuyaPrivateInputProvenanceSHA256: buildIdentity.tuyaPrivateInputProvenanceSHA256,\n            procedureIdentifier:')
          replace_exact(entrypoint,
              'Exact source, reviewed Tuya dependency, and stationary-procedure provenance are present.',
              'Exact source, reviewed Tuya dependency, reviewed private-input provenance, and stationary-procedure provenance are present.')

          project = "NembraCapture.xcodeproj/project.pbxproj"
          replace_exact(project,
              '\t\t\t\tINFOPLIST_KEY_NembraCaptureTuyaDependencyLockSHA256 = "$(NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256)";',
              '\t\t\t\tINFOPLIST_KEY_NembraCaptureTuyaDependencyLockSHA256 = "$(NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256)";\n\t\t\t\tINFOPLIST_KEY_NembraCaptureTuyaPrivateInputProvenanceSHA256 = "$(NEMBRA_CAPTURE_TUYA_PRIVATE_PROVENANCE_SHA256)";',
              count=2)

          plist = "NembraCapture-Info.plist"
          replace_exact(plist,
              '\t<key>NembraCaptureTuyaDependencyLockSHA256</key>\n\t<string>$(NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256)</string>\n\t<key>NembraCaptureProcedureIdentifier</key>',
              '\t<key>NembraCaptureTuyaDependencyLockSHA256</key>\n\t<string>$(NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256)</string>\n\t<key>NembraCaptureTuyaPrivateInputProvenanceSHA256</key>\n\t<string>$(NEMBRA_CAPTURE_TUYA_PRIVATE_PROVENANCE_SHA256)</string>\n\t<key>NembraCaptureProcedureIdentifier</key>')

          installer = "scripts/field/install_one_time_capture.command"
          insert_after_unique_line(installer,
              '"NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256=$TUYA_DEPENDENCY_LOCK_SHA256"',
              '        "NEMBRA_CAPTURE_TUYA_PRIVATE_PROVENANCE_SHA256=$ACCEPTED_TUYA_PROVENANCE_SHA256" ' + chr(92) + '\n')
          insert_after_unique_line(installer,
              'BUILT_TUYA_DEPENDENCY_LOCK_SHA256="$(/usr/bin/plutil -extract',
              'BUILT_TUYA_PRIVATE_PROVENANCE_SHA256="$(/usr/bin/plutil -extract NembraCaptureTuyaPrivateInputProvenanceSHA256 raw -o - "$APP_INFO_PLIST" 2>/dev/null || true)"\n')
          insert_after_unique_line(installer,
              '[[ "$BUILT_TUYA_DEPENDENCY_LOCK_SHA256" == "$TUYA_DEPENDENCY_LOCK_SHA256" ]]',
              '[[ "$BUILT_TUYA_PRIVATE_PROVENANCE_SHA256" == "$ACCEPTED_TUYA_PROVENANCE_SHA256" ]] || die "Built Capture app private-input provenance fingerprint does not match the independently accepted private-input candidate. Discard this candidate."\n')
          replace_exact(installer,
              'unset BUILT_BUILD_IDENTIFIER BUILT_SOURCE_SHA BUILT_TUYA_DEPENDENCY_LOCK_SHA256 BUILT_PROCEDURE_IDENTIFIER BUILT_BUNDLE_ID APP_INFO_PLIST',
              'unset BUILT_BUILD_IDENTIFIER BUILT_SOURCE_SHA BUILT_TUYA_DEPENDENCY_LOCK_SHA256 BUILT_TUYA_PRIVATE_PROVENANCE_SHA256 BUILT_PROCEDURE_IDENTIFIER BUILT_BUNDLE_ID APP_INFO_PLIST')
          replace_exact(installer,
              'Built app provenance matched exact requested source, reviewed Tuya dependency lock, canonical stationary procedure, and field product',
              'Built app provenance matched exact requested source, reviewed Tuya dependency lock, independently accepted private-input provenance, canonical stationary procedure, and field product')

          test1 = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldDependencyProvenanceSourceTests.swift"
          replace_exact(test1, '#expect(app.contains("schemaVersion: 10"))', '#expect(app.contains("schemaVersion: 11"))')
          replace_exact(test1, '#expect(!app.contains("schemaVersion: 9"))', '#expect(!app.contains("schemaVersion: 10"))')
          test2 = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift"
          replace_exact(test2, '#expect(app.contains("schemaVersion: 10"))', '#expect(app.contains("schemaVersion: 11"))')
          replace_exact(test2, '#expect(!app.contains("schemaVersion: 9"))', '#expect(!app.contains("schemaVersion: 10"))')
          test3 = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProvenanceExportSourceTests.swift"
          replace_exact(test3, 'enters schema v10 export', 'enters schema v11 export')
          replace_exact(test3, '#expect(source.contains("schemaVersion: 10"))', '#expect(source.contains("schemaVersion: 11"))')
          PY

      - name: Verify portable truth contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-private-provenance-product-pycache"
          python3 -m py_compile scripts/ci/tests/test_capture_private_provenance_export_custody.py
          python3 -B -I scripts/ci/tests/test_capture_private_provenance_export_custody.py
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          with Path('NembraCapture-Info.plist').open('rb') as fh:
              root = plistlib.load(fh)
          assert root['NembraCaptureTuyaPrivateInputProvenanceSHA256'] == '$(NEMBRA_CAPTURE_TUYA_PRIVATE_PROVENANCE_SHA256)'
          PY
          bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Commit clean product delta
        shell: bash
        env:
          BRANCH: repair/v17-capture-frozen-device-tools-sol-20260814
        run: |
          set -euo pipefail
          base=7f0528a9320d93c154b0ffcf8b2d928143eb7092
          rm .github/workflows/capture-private-provenance-product-materialize.yml
          rm .github/workflows/capture-private-provenance-product-materialize-v2.yml
          rm .github/workflows/capture-private-provenance-product-materialize-v3.yml
          expected="$RUNNER_TEMP/expected-paths"
          actual="$RUNNER_TEMP/actual-paths"
          cat > "$expected" <<'EOF'
          NembraApp/App/NembraCaptureBuildIdentity.swift
          NembraApp/App/NembraCaptureEntrypoint.swift
          NembraCapture-Info.plist
          NembraCapture.xcodeproj/project.pbxproj
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProvenanceExportSourceTests.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldDependencyProvenanceSourceTests.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift
          scripts/field/install_one_time_capture.command
          EOF
          git diff --name-only "$base" | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --check
          git config user.name jonathangana131-lab
          git config user.email jonathangana131@gmail.com
          git add -A
          git commit -m "Promote accepted private provenance into Capture artifact"
          git push origin "HEAD:$BRANCH"
