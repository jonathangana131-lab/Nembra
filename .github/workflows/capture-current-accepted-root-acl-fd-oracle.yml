name: Capture Current Accepted Root Native FD ACL Oracle

on:
  push:
    branches:
      - diagnostic/v17-capture-darwin-native-acl-fd-oracle-sol
    paths:
      - .github/workflows/capture-current-accepted-root-acl-fd-oracle.yml
  pull_request:
    paths:
      - .github/workflows/capture-current-accepted-root-acl-fd-oracle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-fd-oracle:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove direct acl_t snapshot and exact held-fd rollback
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          field_user="$(/usr/bin/id -un)"
          work="$(mktemp -d "$RUNNER_TEMP/nembra-native-fd-oracle.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          cat > "$work/native_fd_oracle.c" <<'C'
          #include <sys/types.h>
          #include <sys/acl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static void fail_errno(const char *label) {
              fprintf(stderr, "%s: %s\n", label, strerror(errno));
              exit(2);
          }

          static void fail_text(const char *label) {
              fprintf(stderr, "%s\n", label);
              exit(3);
          }

          static char *acl_text(acl_t acl) {
              ssize_t length = 0;
              char *text = acl_to_text(acl, &length);
              if (!text) fail_errno("acl_to_text");
              char *copy = malloc((size_t)length + 1);
              if (!copy) fail_errno("malloc");
              memcpy(copy, text, (size_t)length);
              copy[length] = '\0';
              if (acl_free(text) != 0) fail_errno("acl_free text");
              return copy;
          }

          static int acl_entry_count(acl_t acl) {
              acl_entry_t entry = NULL;
              int count = 0;
              int result = acl_get_entry(acl, ACL_FIRST_ENTRY, &entry);
              while (result == 1) {
                  ++count;
                  result = acl_get_entry(acl, ACL_NEXT_ENTRY, &entry);
              }
              if (result < 0) fail_errno("acl_get_entry");
              return count;
          }

          static void require_identity(int fd, const char *path, const char *label) {
              struct stat fd_stat;
              struct stat path_stat;
              if (fstat(fd, &fd_stat) != 0) fail_errno("fstat");
              if (lstat(path, &path_stat) != 0) fail_errno("lstat");
              if (fd_stat.st_dev != path_stat.st_dev ||
                  fd_stat.st_ino != path_stat.st_ino ||
                  (fd_stat.st_mode & S_IFMT) != (path_stat.st_mode & S_IFMT)) {
                  fprintf(stderr,
                          "%s: fd=(%llu,%llu,%o) path=(%llu,%llu,%o)\n",
                          label,
                          (unsigned long long)fd_stat.st_dev,
                          (unsigned long long)fd_stat.st_ino,
                          fd_stat.st_mode & S_IFMT,
                          (unsigned long long)path_stat.st_dev,
                          (unsigned long long)path_stat.st_ino,
                          path_stat.st_mode & S_IFMT);
                  exit(4);
              }
          }

          static void run_chmod_add(const char *path, const char *ace) {
              pid_t child = fork();
              if (child < 0) fail_errno("fork");
              if (child == 0) {
                  execl("/bin/chmod", "/bin/chmod", "+a", ace, path, (char *)NULL);
                  _exit(127);
              }
              int status = 0;
              if (waitpid(child, &status, 0) < 0) fail_errno("waitpid");
              if (!WIFEXITED(status) || WEXITSTATUS(status) != 0) {
                  fprintf(stderr, "chmod +a failed for %s status=%d\n", path, status);
                  exit(5);
              }
          }

          static acl_t get_fd_acl(int fd) {
              acl_t acl = acl_get_fd_np(fd, ACL_TYPE_EXTENDED);
              if (!acl) fail_errno("acl_get_fd_np");
              return acl;
          }

          static acl_t get_path_acl(const char *path) {
              acl_t acl = acl_get_file(path, ACL_TYPE_EXTENDED);
              if (!acl) fail_errno("acl_get_file");
              return acl;
          }

          static void require_text_equal(const char *label, acl_t actual, const char *expected) {
              char *actual_text = acl_text(actual);
              if (strcmp(actual_text, expected) != 0) {
                  fprintf(stderr, "%s: expected=%s actual=%s\n", label, expected, actual_text);
                  free(actual_text);
                  acl_free(actual);
                  exit(6);
              }
              free(actual_text);
              if (acl_free(actual) != 0) fail_errno("acl_free actual");
          }

          static void run_case(const char *root, const char *case_name, const char *principal, int seed_baseline) {
              char subject[1024];
              char moved[1024];
              if (snprintf(subject, sizeof(subject), "%s/%s.accepted", root, case_name) >= (int)sizeof(subject) ||
                  snprintf(moved, sizeof(moved), "%s/%s.moved", root, case_name) >= (int)sizeof(moved)) {
                  fail_text("path buffer exhausted");
              }

              if (mkdir(subject, 0700) != 0) fail_errno("mkdir subject");
              if (seed_baseline) {
                  run_chmod_add(subject, "user:root allow readattr");
              }

              int fd = open(subject, O_RDONLY | O_DIRECTORY);
              if (fd < 0) fail_errno("open subject");
              require_identity(fd, subject, "pre-grant identity mismatch");

              acl_t baseline = get_fd_acl(fd);
              int baseline_entries = acl_entry_count(baseline);
              if ((!seed_baseline && baseline_entries != 0) || (seed_baseline && baseline_entries == 0)) {
                  fprintf(stderr, "%s: unexpected baseline entry count=%d\n", case_name, baseline_entries);
                  exit(7);
              }
              acl_t baseline_restore = acl_dup(baseline);
              if (!baseline_restore) fail_errno("acl_dup baseline");
              char *baseline_text = acl_text(baseline);
              if (acl_free(baseline) != 0) fail_errno("acl_free baseline");

              char grant[1024];
              if (snprintf(grant, sizeof(grant),
                           "user:%s allow list,search,readattr,readextattr,readsecurity",
                           principal) >= (int)sizeof(grant)) {
                  fail_text("grant buffer exhausted");
              }
              run_chmod_add(subject, grant);
              require_identity(fd, subject, "post-grant identity mismatch");

              acl_t granted = get_fd_acl(fd);
              char *granted_text = acl_text(granted);
              if (acl_free(granted) != 0) fail_errno("acl_free granted");
              if (strcmp(granted_text, baseline_text) == 0) {
                  fail_text("held fd did not observe pathname grant");
              }
              free(granted_text);

              if (rename(subject, moved) != 0) fail_errno("rename accepted root");
              if (mkdir(subject, 0700) != 0) fail_errno("mkdir attacker replacement");
              require_identity(fd, moved, "moved accepted-root identity mismatch");

              acl_t replacement_before_acl = get_path_acl(subject);
              char *replacement_before = acl_text(replacement_before_acl);
              if (acl_free(replacement_before_acl) != 0) fail_errno("acl_free replacement before");

              if (baseline_entries == 0) {
                  if (acl_delete_fd_np(fd, ACL_TYPE_EXTENDED) != 0) fail_errno("acl_delete_fd_np restore absent baseline");
              } else {
                  if (acl_valid_fd_np(fd, ACL_TYPE_EXTENDED, baseline_restore) != 0) fail_errno("acl_valid_fd_np baseline");
                  if (acl_set_fd_np(fd, baseline_restore, ACL_TYPE_EXTENDED) != 0) fail_errno("acl_set_fd_np restore baseline");
              }
              if (acl_free(baseline_restore) != 0) fail_errno("acl_free baseline restore");
              require_identity(fd, moved, "post-restore moved identity mismatch");

              require_text_equal("moved accepted-root ACL was not exactly restored", get_path_acl(moved), baseline_text);
              require_text_equal("attacker replacement ACL changed", get_path_acl(subject), replacement_before);

              acl_t fd_after = get_fd_acl(fd);
              char *fd_after_text = acl_text(fd_after);
              if (acl_free(fd_after) != 0) fail_errno("acl_free fd after");
              if (strcmp(fd_after_text, baseline_text) != 0) {
                  fprintf(stderr, "%s: held-fd post-restore ACL differs from baseline\n", case_name);
                  exit(8);
              }

              printf("NEMBRA_NATIVE_FD_ORACLE case=%s baselineEntries=%d grantObserved=true originalIdentityRetained=true exactRollback=true replacementUntouched=true\n",
                     case_name, baseline_entries);

              free(fd_after_text);
              free(replacement_before);
              free(baseline_text);
              if (close(fd) != 0) fail_errno("close subject fd");
              if (rmdir(subject) != 0) fail_errno("rmdir replacement");
              if (rmdir(moved) != 0) fail_errno("rmdir moved");
          }

          int main(int argc, char **argv) {
              if (argc != 3) {
                  fprintf(stderr, "usage: %s ROOT FIELD_USER\n", argv[0]);
                  return 64;
              }
              run_case(argv[1], "absent-baseline", argv[2], 0);
              run_case(argv[1], "seeded-baseline", argv[2], 1);
              puts("NEMBRA_NATIVE_FD_ORACLE overall=true textTransportUsedForRestore=false physicalAuthorityCreated=false");
              return 0;
          }
          C

          /usr/bin/clang -Wall -Wextra -Werror "$work/native_fd_oracle.c" -o "$work/native_fd_oracle"
          root="$(mktemp -d /private/tmp/nembra-native-fd-oracle.XXXXXX)"
          trap 'rm -rf "$work" "$root"' EXIT
          /usr/bin/sudo -n "$work/native_fd_oracle" "$root" "$field_user"

      - name: Preserve diagnostic-only boundary
        if: always()
        shell: bash
        run: echo 'NEMBRA_NATIVE_FD_ACL_ORACLE validationOnly=true productionLeaseChanged=false physicalAuthorityCreated=false'
