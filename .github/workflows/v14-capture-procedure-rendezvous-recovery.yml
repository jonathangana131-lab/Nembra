name: V14 Capture Procedure Rendezvous Recovery

on:
  push:
    branches:
      - integration/v14-capture-procedure-rendezvous-recovery-sol

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-procedure-rendezvous-recovery-sol
          fetch-depth: 0

      - name: Apply exact procedure rendezvous
        run: python3 Scripts/apply_capture_procedure_rendezvous.py

      - name: Validate shell and final source shape
        run: |
          bash -n scripts/field/install_one_time_capture.command
          git diff --check
          grep -Fq 'static let fieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"' NembraApp/App/NembraCaptureBuildIdentity.swift
          grep -Fq 'schemaVersion: 10' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'PROCEDURE_ID: `ES80-AUTHENTICATED-STATIONARY-v1`' docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md

      - name: Commit only durable product contract
        run: |
          rm Scripts/apply_capture_procedure_rendezvous.py
          rm .github/workflows/v14-capture-procedure-rendezvous-recovery.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): bind exact stationary procedure identity"
          git push origin HEAD:integration/v14-capture-procedure-rendezvous-recovery-sol
