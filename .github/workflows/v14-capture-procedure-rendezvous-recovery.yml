name: V14 Capture Procedure Rendezvous Recovery

on:
  push:
    branches:
      - integration/v14-capture-procedure-rendezvous-recovery-sol

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-procedure-rendezvous-recovery-sol
          fetch-depth: 0

      - name: Apply exact procedure rendezvous
        run: |
          set +e
          python3 Scripts/apply_capture_procedure_rendezvous.py > /tmp/rendezvous.out 2>&1
          rc=$?
          set -e
          cat /tmp/rendezvous.out
          if [[ "$rc" != "0" ]]; then
            cp /tmp/rendezvous.out rendezvous_failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rendezvous_failure.txt
            git commit -m "diag(capture): persist rendezvous transform failure"
            git push origin HEAD:integration/v14-capture-procedure-rendezvous-recovery-sol
            exit "$rc"
          fi

      - name: Validate shell and final source shape
        run: |
          bash -n scripts/field/install_one_time_capture.command
          git diff --check
          grep -Fq 'static let fieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"' NembraApp/App/NembraCaptureBuildIdentity.swift
          grep -Fq 'schemaVersion: 10' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'PROCEDURE_ID: `ES80-AUTHENTICATED-STATIONARY-v1`' docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md

      - name: Commit durable product contract
        run: |
          # Keep recovery tooling on this branch. Also revert the transform's
          # CI-workflow hardening before the bot commit: GITHUB_TOKEN may push
          # ordinary product/source files here, but workflow-file mutation is
          # separately restricted. The current-spine connector commit will
          # harden that CI workflow after product blobs are transplanted.
          git checkout -- .github/workflows/capture-field-build-provenance.yml
          rm -f rendezvous_failure.txt
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): bind exact stationary procedure identity"
          git push origin HEAD:integration/v14-capture-procedure-rendezvous-recovery-sol
