name: Capture Final Premium Root Materializer

on:
  push:
    branches:
      - recovery/v14-capture-final-premium-root-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recovery/v14-capture-final-premium-root-sol
      - name: Materialize exact product convergence
        run: python3 scripts/ci/materialize_capture_final_premium_root.py
