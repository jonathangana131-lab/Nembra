name: V14 Capture Foreground Integrity 870f Materializer

on:
  push:
    branches:
      - agent/v14-capture-foreground-integrity-870f-fix-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact-parent foreground integrity repair
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT="870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81"
          RED_HEAD="ec55d27270d80bdfa556eff3b598880dd8f5c231"
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]] || { echo "branch moved before materialization"; exit 2; }
          mapfile -t CUT_FILES < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          [[ "${#CUT_FILES[@]}" -eq 1 && "${CUT_FILES[0]}" == ".github/workflows/v14-capture-foreground-integrity-870f-materializer.yml" ]] || exit 2

          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          marker = "    var privateConfig: Bool { OfficialTuyaFactory.configured }\n"
          if text.count(marker) != 1:
              raise SystemExit("privateConfig insertion marker drifted")

          foreground = '''    func appDidLoseForeground() {
              // Accepted evidence is already sealed and immutable; backgrounding after completion
              // cannot rewrite or demote that artifact.
              guard phase != .accepted else { return }

              // Foreground loss closes this view lifetime before any transport inspection. Pending
              // membership and official-auth completions are generation-fenced by these rotations.
              acceptsViewScopedMembershipRequests = false
              sdkDeviceMembershipVerified = false
              membershipAccountUID = nil
              membershipDeviceID = nil
              membershipRequestID = UUID()
              membershipBusy = false
              officialConnectionRequestID = UUID()
              watchdog?.cancel()
              watchdog = nil

              if processCorrelationLease != nil || correlationSession != nil {
                  abandonPackageCorrelation()
                  phase = .failed
                  message = "Capture left the foreground during Bluetooth target correlation. Re-verify this scooter, then restart from OFF1; interrupted windows are never reusable evidence."
                  log("foreground_integrity_lost_during_target_correlation")
                  return
              }

              if let token = currentConnectionToken {
                  let wasObserving = phase == .observing
                  phase = .failed
                  message = wasObserving
                      ? "Capture left the foreground during authenticated observation. Relaunch before another authenticated attempt; background time is not accepted evidence and no BLE disconnect is claimed."
                      : "Capture left the foreground before authenticated observation. Relaunch before another authenticated attempt; no BLE disconnect is claimed."
                  log(
                      wasObserving ? "foreground_integrity_lost_during_observation" : "foreground_integrity_lost_before_observation",
                      ["generation": String(token.diagnosticGeneration)]
                  )
                  Task { @MainActor [self] in
                      if wasObserving {
                          await self.invalidateObservationContinuity(
                              token: token,
                              message: "App foreground integrity was lost during authenticated observation. Relaunch before another authenticated attempt; background time is not accepted evidence and no BLE disconnect is claimed.",
                              kind: "foreground_integrity_lost_during_observation"
                          )
                      } else {
                          await self.invalidateInternalLifecycle(
                              token: token,
                              message: "App foreground integrity was lost before authenticated observation. Relaunch before another authenticated attempt; no BLE disconnect is claimed.",
                              kind: "foreground_integrity_lost_before_observation"
                          )
                      }
                  }
                  return
              }

              if phase == .authenticating {
                  // Official driver handoff can precede package token creation. The rotated request
                  // id above forces that pending ledger task to retire before any SDK connect call.
                  localBLESettlementToken = nil
                  sdkLocalBLEOnline = false
                  driver = nil
                  phase = .failed
                  message = "Capture left the foreground during authentication. Relaunch before another authenticated attempt; no BLE disconnect is claimed."
                  log("foreground_integrity_lost_before_observation")
                  return
              }

              if phase == .correlated || phase == .selected {
                  resetDiscoverySessionOnly()
                  phase = .failed
                  message = "Capture left the foreground after target correlation. Re-verify this scooter and restart from OFF1; prior target authority is not reused across the interruption."
                  log("foreground_integrity_lost_after_target_correlation")
              }
          }

'''
          text = text.replace(marker, foreground + marker, 1)

          env = "    @Environment(\\.dynamicTypeSize) private var dynamicTypeSize\n"
          if text.count(env) != 1:
              raise SystemExit("Dynamic Type environment marker drifted")
          text = text.replace(env, env + "    @Environment(\\.scenePhase) private var scenePhase\n", 1)

          old = '''        .onDisappear {
              test.abandonCorrelationForViewExit()
          }
          .onChange(of: sdkAccount.loggedIn) { _, loggedIn in
          '''
          new = '''        .onDisappear {
              test.abandonCorrelationForViewExit()
          }
          .onChange(of: scenePhase) { oldPhase, newPhase in
              if oldPhase == .active && newPhase != .active {
                  test.appDidLoseForeground()
              } else if oldPhase != .active && newPhase == .active && test.phase != .accepted {
                  test.activateMembershipRequestsForView()
                  if sdkAccount.loggedIn { test.verifySDKMembership() }
              }
          }
          .onChange(of: sdkAccount.loggedIn) { _, loggedIn in
          '''
          if text.count(old) != 1:
              raise SystemExit(f"scene hook anchor drifted: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git show "$RED_HEAD:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift" > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift

          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          controller_start = source.index("private final class SecureLinkController")
          controller_end = source.index("@MainActor\nprivate protocol OfficialTuyaDriver", controller_start)
          controller = source[controller_start:controller_end]
          cleanup_start = controller.index("func appDidLoseForeground()")
          cleanup_end = controller.index("var privateConfig: Bool", cleanup_start)
          cleanup = controller[cleanup_start:cleanup_end]
          required = [
              "guard phase != .accepted else { return }",
              "sdkDeviceMembershipVerified = false",
              "membershipAccountUID = nil",
              "membershipDeviceID = nil",
              "membershipRequestID = UUID()",
              "officialConnectionRequestID = UUID()",
              "watchdog?.cancel()",
              "abandonPackageCorrelation()",
              "invalidateObservationContinuity(",
              "invalidateInternalLifecycle(",
              "Task { @MainActor [self] in",
              "phase == .correlated || phase == .selected",
              "resetDiscoverySessionOnly()",
              "foreground_integrity_lost_after_target_correlation",
          ]
          for token in required:
              assert token in cleanup, token
          for forbidden in ["recordObservedTransportLoss", "endConnection", "disconnectBLE", "releasePackageCorrelationLease()"]:
              assert forbidden not in cleanup, forbidden
          view_start = source.index("private struct SecureLinkView: View")
          hero = source.index("private var hero: some View", view_start)
          view = source[view_start:hero]
          assert "@Environment(\\.scenePhase) private var scenePhase" in view
          assert ".onChange(of: scenePhase)" in view
          assert "oldPhase == .active && newPhase != .active" in view
          assert "test.appDidLoseForeground()" in view
          assert "test.activateMembershipRequestsForView()" in view
          assert "if sdkAccount.loggedIn { test.verifySDKMembership() }" in view
          PY

          git config user.name "Nembra V14 Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          git commit -m "fix(capture): fail closed on foreground loss"
          git push origin HEAD:agent/v14-capture-foreground-integrity-870f-fix-sol
