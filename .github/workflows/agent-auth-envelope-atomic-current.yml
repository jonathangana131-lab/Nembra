name: Agent auth envelope atomic current

on:
  push:
    branches:
      - fix/es80-v14-auth-envelope-atomic-current-gpt56

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-v14-auth-envelope-atomic-current-gpt56
          fetch-depth: 0

      - name: Apply and validate failure-atomic publication
        shell: bash
        run: |
          python3 -m py_compile .github/scripts/agent_auth_envelope_atomic_current.py
          python3 .github/scripts/agent_auth_envelope_atomic_current.py
          python3 -m py_compile scripts/ci/es80_field_authorization_envelope.py
          python3 scripts/ci/es80_field_authorization_envelope.py --self-test
          python3 -m py_compile scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py
          python3 scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py
          python3 -m py_compile scripts/ci/tests/test_es80_field_authorization_atomic_publication.py
          python3 scripts/ci/tests/test_es80_field_authorization_atomic_publication.py
          git diff --check

      - name: Self-delete helper and checkpoint repair
        shell: bash
        run: |
          rm .github/workflows/agent-auth-envelope-atomic-current.yml
          rm .github/scripts/agent_auth_envelope_atomic_current.py
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/xcode27-pr-command.yml \
                  scripts/ci/es80_field_authorization_envelope.py \
                  scripts/ci/tests/test_es80_field_authorization_atomic_publication.py \
                  .github/workflows/agent-auth-envelope-atomic-current.yml \
                  .github/scripts/agent_auth_envelope_atomic_current.py
          git diff --cached --check
          git commit -m 'fix(capture): publish authorization envelope atomically'
          git push origin HEAD:fix/es80-v14-auth-envelope-atomic-current-gpt56
