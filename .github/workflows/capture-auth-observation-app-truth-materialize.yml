name: Capture observation app-truth materializer

on:
  push:
    branches:
      - capture/v14-auth-observation-app-truth-fix-sol
    paths:
      - .github/workflows/capture-auth-observation-app-truth-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture/v14-auth-observation-app-truth-fix-sol
          fetch-depth: 0

      - name: Apply exact app-truth repair
        run: python3 scripts/ci/materialize_capture_observation_app_truth.py

      - name: Verify bounded source mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          required = [
              "applicationUpdateCount >= TuyaAuthenticatedReadOnlyPreflight.minimumAuthenticatedApplicationPayloadCount",
              "applicationEvidenceSurvivedHistoricalWindow",
              "TuyaAuthenticatedReadOnlyPreflight.minimumPostAuthenticationPayloadSurvivalNanoseconds",
              "repeated same-generation scooter data",
              "startup rejection window",
              "45-second stability horizon",
          ]
          for text in required:
              if text not in source:
                  raise SystemExit(f"missing app-truth repair anchor: {text}")
          if 'requirementRow("Scooter data received", ready: test.applicationUpdateCount > 0)' in source:
              raise SystemExit("stale one-callback readiness remains")
          PY

      - name: Publish immutable repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-auth-observation-app-truth-materialize.yml
          rm scripts/ci/materialize_capture_observation_app_truth.py
          rm -f CAPTURE_APP_TRUTH_TEST_FAILURE.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A NembraApp/App/NembraCaptureEntrypoint.swift \
                    Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonAppIntegrationTests.swift \
                    .github/workflows/capture-auth-observation-app-truth-materialize.yml \
                    scripts/ci/materialize_capture_observation_app_truth.py
          git diff --cached --check
          git commit -m "Capture: make observation UI match canonical gate"
          git push origin HEAD:capture/v14-auth-observation-app-truth-fix-sol
