name: Capture observation app-truth materializer

on:
  push:
    branches:
      - capture/v14-auth-observation-app-truth-fix-sol
    paths:
      - .github/workflows/capture-auth-observation-app-truth-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture/v14-auth-observation-app-truth-fix-sol
          fetch-depth: 0

      - name: Apply exact app-truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          replacements = [
              (
                  '''    var canonicalObservedAgeSeconds: Double? {
                      guard let start = ledgerSnapshot.authenticatedAtUptimeNanoseconds,
                            let latest = ledgerSnapshot.latestObservedUptimeNanoseconds,
                            latest >= start else { return nil }
                      return Double(latest - start) / 1_000_000_000
                  }

                  var preflightVerdict: TuyaAuthenticatedReadOnlyPreflight.Verdict {''',
                  '''    var canonicalObservedAgeSeconds: Double? {
                      guard let start = ledgerSnapshot.authenticatedAtUptimeNanoseconds,
                            let latest = ledgerSnapshot.latestObservedUptimeNanoseconds,
                            latest >= start else { return nil }
                      return Double(latest - start) / 1_000_000_000
                  }

                  var applicationEvidenceSurvivedHistoricalWindow: Bool {
                      guard let authenticatedAt = ledgerSnapshot.authenticatedAtUptimeNanoseconds,
                            let latestPayload = ledgerSnapshot.latestApplicationPayloadUptimeNanoseconds,
                            latestPayload >= authenticatedAt else { return false }
                      return latestPayload - authenticatedAt >= TuyaAuthenticatedReadOnlyPreflight.minimumPostAuthenticationPayloadSurvivalNanoseconds
                  }

                  var preflightVerdict: TuyaAuthenticatedReadOnlyPreflight.Verdict {'''
              ),
              (
                  '''                    message = "Authenticated generation \\(token.diagnosticGeneration) is live. Waiting for a genuine application update and the canonical 45-second horizon…"''',
                  '''                    message = "Authenticated generation \\(token.diagnosticGeneration) is live. Waiting for repeated same-generation scooter data to survive the startup rejection window and the canonical 45-second stability horizon…"'''
              ),
              (
                  '''                        requirementRow("Secure local link", ready: test.sdkLocalBLEOnline)
                          requirementRow("Scooter data received", ready: test.applicationUpdateCount > 0)''',
                  '''                        requirementRow("Secure local link", ready: test.sdkLocalBLEOnline)
                          requirementRow("Repeated scooter data", ready: test.applicationUpdateCount >= TuyaAuthenticatedReadOnlyPreflight.minimumAuthenticatedApplicationPayloadCount)
                          requirementRow("Startup window survived", ready: test.applicationEvidenceSurvivedHistoricalWindow)'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"exact repair anchor count was {count}, expected 1:\n{old[:160]}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Execute focused app-truth oracle
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaAuthenticatedReadOnlyHorizonAppIntegrationTests

      - name: Publish immutable repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-auth-observation-app-truth-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonAppIntegrationTests.swift \
                  .github/workflows/capture-auth-observation-app-truth-materialize.yml
          git diff --cached --check
          git commit -m "Capture: make observation UI match canonical gate"
          git push origin HEAD:capture/v14-auth-observation-app-truth-fix-sol
