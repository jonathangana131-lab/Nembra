name: Capture Authenticated Stationary Private Review Final GO

on:
  push:
    branches:
      - recovery/v14-auth-stationary-private-review-r4-current-sol-20260811
    paths:
      - scripts/ci/es80_authenticated_stationary_private_review_final_go.py
      - scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/es80_authenticated_stationary_signed_artifact.py
      - scripts/ci/es80_today_final_go_publication.py
      - scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py
      - scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py
      - scripts/ci/tests/test_es80_final_go_current_vnode_contract.py
      - .github/workflows/capture-authenticated-stationary-private-review-final-go.yml
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_private_review_final_go.py
      - scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/es80_authenticated_stationary_signed_artifact.py
      - scripts/ci/es80_today_final_go_publication.py
      - scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py
      - scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py
      - scripts/ci/tests/test_es80_final_go_current_vnode_contract.py
      - .github/workflows/capture-authenticated-stationary-private-review-final-go.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  private-review-final-go:
    name: Bind current private review authority to sealed Final GO
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind control tests to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile current control recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py \
            scripts/ci/tests/test_es80_final_go_current_vnode_contract.py

      - name: Preserve inherited private-review contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \
            ParentPrivateReviewContractTests

      - name: Prove raw candidate baseline and core.worktree isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \
            CandidateRawFilesystemAuthorityTests.test_child_executes_exact_2873_parent_blob \
            CandidateRawFilesystemAuthorityTests.test_inherited_parent_candidate_runs_through_raw_authority \
            CandidateRawFilesystemAuthorityTests.test_core_worktree_decoy_cannot_redirect_physical_candidate

      - name: Reject repository-local fsmonitor execution
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \
            CandidateRawFilesystemAuthorityTests.test_local_fsmonitor_executes_under_ambient_status_but_never_under_candidate_custody

      - name: Reject info attributes and clean filters
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \
            CandidateRawFilesystemAuthorityTests.test_info_attributes_clean_filter_executes_ambiently_but_raw_audit_rejects_without_execution

      - name: Reject info exclude hidden physical input
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \
            CandidateRawFilesystemAuthorityTests.test_info_exclude_cannot_hide_untracked_physical_input

      - name: Require selected current vnode gate and reject retired convergence alias
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_final_go_current_vnode_contract.py

      - name: Red-team committed parent execution custody
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py
