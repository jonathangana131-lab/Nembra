name: Temporary ES80 signed-field process custody repair

on:
  push:
    branches:
      - fix/es80-v14-signed-field-process-custody-gpt56-go

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply current-spine custody transform
        run: python3 scripts/ci/zz_temp_es80_signed_field_process_custody_transform.py

      - name: Validate focused process custody
        run: |
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_python_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_python_custody_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_process_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_process_custody_source.py
          grep -F -- '--repository-root "$ROOT"' scripts/ci/xcode27_signed_field_candidate.sh
          git diff --check

      - name: Publish clean product checkpoint
        run: |
          rm .github/workflows/zz-es80-signed-field-process-custody-transform.yml
          rm scripts/ci/zz_temp_es80_signed_field_process_custody_transform.py
          git config user.name "Nembra V14 process-custody recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): close signed-field process custody"
          git push origin "HEAD:${GITHUB_REF_NAME}"
