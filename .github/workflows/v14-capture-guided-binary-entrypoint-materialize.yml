name: V14 Capture Guided Binary Procedure Entrypoint Materialize

on:
  push:
    branches:
      - integration/v14-capture-guided-binary-account-current-gpt56sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-guided-binary-account-current-gpt56sol
          fetch-depth: 0

      - name: Bind guided product to compiled procedure identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          text = p.read_text()
          replacements = [
              (
                  'var fieldProcedureIdentifier: String { NembraCaptureBuildIdentity.fieldProcedureIdentifier }',
                  'var fieldProcedureIdentifier: String { buildIdentity.procedureIdentifier }',
              ),
              (
                  'procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier,',
                  'procedureIdentifier: buildIdentity.procedureIdentifier,',
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one anchor: {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

          git diff --check
          test "$(git status --porcelain | awk '{print $2}')" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          grep -Fq 'Text("NEMBRA CAPTURE")' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'private var correlationDisplayedWindowOrdinal: Int' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'var failedAttemptCanRestartFromOFF1: Bool' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'var fieldProcedureIdentifier: String { buildIdentity.procedureIdentifier }' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'procedureIdentifier: buildIdentity.procedureIdentifier,' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier,' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Publish only the validated Entrypoint blob
        shell: bash
        run: |
          set -euo pipefail
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): bind guided export to compiled procedure identity'
          git push origin HEAD:integration/v14-capture-guided-binary-account-current-gpt56sol
