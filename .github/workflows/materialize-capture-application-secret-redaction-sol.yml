name: Materialize Capture Application Secret Redaction

on:
  push:
    branches:
      - converge/v14-capture-membership-secret-redaction-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/v14-capture-membership-secret-redaction-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify lineage and materialize repair
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fad2d84671326b5b925c7feecde5c4181e8efcd9 HEAD
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          membership_anchors = [
              'private var acceptsViewScopedMembershipRequests = false',
              'func activateMembershipRequestsForView()',
              'acceptsViewScopedMembershipRequests = false',
          ]
          for anchor in membership_anchors:
              if anchor not in source:
                  raise SystemExit(f'missing #2377 membership-lifetime anchor: {anchor}')

          old = '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              guard let dps, !dps.isEmpty else { return }
              var sanitized: [String: String] = [:]
              for (key, value) in dps {
                  sanitized[String(describing: key)] = String(describing: value)
              }
              onApplicationUpdate?(sanitized)
          }
          '''

          new = '''    private static let secretKeyFragments = [
              "localkey",
              "accesstoken",
              "refreshtoken",
              "authkey",
              "seckey",
          ]

          private static func redactApplicationSecrets(_ object: Any) -> Any {
              if let dictionary = object as? [AnyHashable: Any] {
                  var sanitized: [String: Any] = [:]
                  for (rawKey, value) in dictionary {
                      let key = String(describing: rawKey)
                      let normalizedKey = key.lowercased().filter { $0.isLetter || $0.isNumber }
                      if secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {
                          sanitized[key] = "<redacted>"
                      } else {
                          sanitized[key] = redactApplicationSecrets(value)
                      }
                  }
                  return sanitized
              }

              if let array = object as? [Any] {
                  return array.map(redactApplicationSecrets)
              }

              return object
          }

          func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              guard let dps, !dps.isEmpty else { return }
              var sanitized: [String: String] = [:]
              for (key, value) in dps {
                  let keyString = String(describing: key)
                  let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }
                  if Self.secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {
                      sanitized[keyString] = "<redacted>"
                  } else {
                      sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))
                  }
              }
              onApplicationUpdate?(sanitized)
          }
          '''

          if 'private static func redactApplicationSecrets(_ object: Any) -> Any' in source:
              raise SystemExit('repair already materialized unexpectedly')
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one vulnerable dpsUpdate block, found {source.count(old)}')

          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          required = [
              'private static func redactApplicationSecrets(_ object: Any) -> Any',
              'secretKeyFragments',
              '"localkey"',
              '"accesstoken"',
              '"refreshtoken"',
              '"authkey"',
              '"seckey"',
              'key.lowercased().filter',
              '$0.isLetter || $0.isNumber',
              'array.map(redactApplicationSecrets)',
              'String(describing: Self.redactApplicationSecrets(value))',
              'sanitized[keyString] = "<redacted>"',
              'onApplicationUpdate?(sanitized)',
              'private var acceptsViewScopedMembershipRequests = false',
          ]
          for item in required:
              if item not in source:
                  raise SystemExit(f'missing required source contract: {item}')
          if 'sanitized[String(describing: key)] = String(describing: value)' in source:
              raise SystemExit('vulnerable direct String(describing:) projection remains')
          print('Capture application secret-redaction source contract: PASS')
          PY
          git diff --check

      - name: Collapse helper into product commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-application-secret-redaction-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          git diff --cached --check
          git commit -m 'fix(capture): redact credential-shaped application updates'
          git diff --check fad2d84671326b5b925c7feecde5c4181e8efcd9 HEAD
          git push origin HEAD:converge/v14-capture-membership-secret-redaction-sol
