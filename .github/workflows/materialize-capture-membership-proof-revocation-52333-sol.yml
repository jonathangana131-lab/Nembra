name: Materialize Capture Membership Proof Revocation 52333 Sol

on:
  push:
    branches:
      - fix/v14-capture-membership-proof-revocation-52333-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact product ancestry and helper scope
        shell: bash
        run: |
          set -euo pipefail
          parent='52333deb09ea9a5964250097f83884d285f25d78'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-membership-proof-revocation-52333-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipProofRevocationSourceTests.swift'

      - name: Revoke view-lifetime membership proof synchronously
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          old = '''        acceptsViewScopedMembershipRequests = false
        membershipRequestID = UUID()
'''
          new = '''        acceptsViewScopedMembershipRequests = false
        sdkDeviceMembershipVerified = false
        membershipAccountUID = nil
        membershipDeviceID = nil
        membershipStatus = "Exact scooter membership must be reverified for this Secure Link view."
        membershipRequestID = UUID()
'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one view-exit insertion point, found {source.count(old)}')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify current-head authority ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('func abandonCorrelationForViewExit()')
          end = s.index('var privateConfig: Bool', start)
          cleanup = s[start:end]
          ordered = [
              'acceptsViewScopedMembershipRequests = false',
              'sdkDeviceMembershipVerified = false',
              'membershipAccountUID = nil',
              'membershipDeviceID = nil',
              'membershipRequestID = UUID()',
              'officialConnectionRequestID = UUID()',
              'if let token = currentConnectionToken',
          ]
          offsets = [cleanup.index(token) for token in ordered]
          assert offsets == sorted(offsets), offsets
          assert 'membershipStatus = "Exact scooter membership must be reverified for this Secure Link view."' in cleanup
          assert 'Task { @MainActor [self] in' in cleanup
          assert 'invalidateInternalLifecycle(' in cleanup
          for forbidden in ('disconnectBLE', 'endConnection', 'publishDps', 'publishDpsWithSuccess'):
              assert forbidden not in cleanup, forbidden
          print('Capture view-exit membership-proof revocation contract: PASS')
          PY
          git diff --check

      - name: Collapse helper to two-path product repair
        shell: bash
        run: |
          set -euo pipefail
          parent='52333deb09ea9a5964250097f83884d285f25d78'
          rm .github/workflows/materialize-capture-membership-proof-revocation-52333-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipProofRevocationSourceTests.swift
          git add -u .github/workflows/materialize-capture-membership-proof-revocation-52333-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' \
            commit -m 'fix(capture): revoke membership proof on Secure Link exit'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipProofRevocationSourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-membership-proof-revocation-52333-sol
