name: TEMP Capture R3 Parent Module Execution Materializer

on:
  push:
    branches:
      - repair/v14-r3-parent-module-execution-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-r3-parent-module-execution-sol
          fetch-depth: 0
      - name: Materialize and validate repair
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tmp_materialize_r3_parent_execution.py
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py
          python3 scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py
          python3 scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
          git diff --check
          test ! -e .github/workflows/tmp-v14-r3-parent-module-execution-materialize.yml
          test ! -e scripts/ci/tmp_materialize_r3_parent_execution.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Capture: pin R3 parent execution to accepted Git bytes'
          git push origin HEAD:repair/v14-r3-parent-module-execution-sol
