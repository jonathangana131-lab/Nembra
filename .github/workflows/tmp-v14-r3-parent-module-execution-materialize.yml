name: TEMP Capture R3 Parent Module Execution Materializer

on:
  push:
    branches:
      - repair/v14-r3-parent-module-execution-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-r3-parent-module-execution-sol
          fetch-depth: 0

      - name: Repair one-shot materializer workflow insertion
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/tmp_materialize_r3_parent_execution.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('run_tail = textwrap.dedent(')
          end = source.index('workflow_path.write_text(workflow, encoding="utf-8")', start)
          replacement = '''run_tail = (
              "      - name: Prove generated helper executes from accepted Git bytes\\n"
              "        shell: bash\\n"
              "        run: |\\n"
              "          set -euo pipefail\\n"
              "          python3 scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py\\n"
          )
          if workflow.count(run_tail) != 1:
              raise SystemExit("canonical workflow run seam drifted")
          parent_run = (
              "\\n      - name: Prove authenticated-stationary parent executes from accepted Git bytes\\n"
              "        shell: bash\\n"
              "        run: |\\n"
              "          set -euo pipefail\\n"
              "          python3 scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py\\n"
          )
          workflow = workflow.replace(run_tail, run_tail + parent_run, 1)
          '''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
          python3 -m py_compile scripts/ci/tmp_materialize_r3_parent_execution.py

      - name: Materialize production repair
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tmp_materialize_r3_parent_execution.py

      - name: Compile production repair
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py

      - name: Prove parent execution custody
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py

      - name: Preserve helper execution custody
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py

      - name: Validate and publish repair checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/tmp-v14-r3-parent-module-execution-materialize.yml
          test ! -e scripts/ci/tmp_materialize_r3_parent_execution.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Capture: pin R3 parent execution to accepted Git bytes'
          git push origin HEAD:repair/v14-r3-parent-module-execution-sol
