name: Temporary ES80 rider terminology polish round 2

on:
  push:
    branches:
      - product/es80-v14-rider-terminology-polish/gpt56-go

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/es80-v14-rider-terminology-polish/gpt56-go
          fetch-depth: 0

      - name: Simplify setup, failure, and Share language
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          source = path.read_text(encoding="utf-8")
          start_marker = "    private var passiveSafetyPanel"
          details_marker = "    private var captureDetailsSheet"
          start = source.index(start_marker)
          end = source.index(details_marker, start)
          prefix, rider, details = source[:start], source[start:end], source[end:]

          replacements = [
              ('Text("EXPERIMENT ONE")', 'Text("ES80 CAPTURE")'),
              ('eyebrow: "PREFLIGHT / DECLARATION"', 'eyebrow: "PREFLIGHT / SETUP"'),
              (
                  'message: "Before OFF 1, unplug the scooter charger, keep Nembra foregrounded with the screen unlocked, and keep the stock scooter app closed. Confirm only when those are your declared setup conditions for this Experiment One run."',
                  'message: "Before OFF 1, unplug the scooter charger, keep Nembra foregrounded with the screen unlocked, and keep the stock scooter app closed. Confirm only when this setup is true for the current Capture."',
              ),
              (
                  'guidanceFootnote("This records your operator declaration; it is not independent proof that the condition held continuously.")',
                  'guidanceFootnote("Nembra records the setup you confirm here; it cannot prove the condition stayed unchanged.")',
              ),
              (
                  '.accessibilityHint("The timer is guidance only; Nembra records this step only after enough evidence has been collected.")',
                  '.accessibilityHint("The timer is guidance only; Nembra records this step only after enough time and signal data have been collected.")',
              ),
              (
                  'guidanceFootnote("This countdown is guidance only. Nembra records the window only after the required observation is accepted; tapping early cannot shorten it.")',
                  'guidanceFootnote("This countdown is guidance only. Nembra records the window only after the required observation is complete; tapping early cannot shorten it.")',
              ),
              ('eyebrow: "CORRELATION STOPPED"', 'eyebrow: "MATCHING STOPPED"'),
              ('"Restart Experiment One"', '"Restart Capture"'),
              ('eyebrow: "NO UNIQUE TARGET"', 'eyebrow: "NO UNIQUE SIGNAL"'),
              ('eyebrow: "AMBIGUOUS TARGET"', 'eyebrow: "MULTIPLE SIGNALS MATCHED"'),
              ('eyebrow: "TARGET CONFIRMED"', 'eyebrow: "SIGNAL CONFIRMED"'),
              (
                  'message: "The same Bluetooth signal has reappeared after confirmation. It is ready for read-only observation, but it is still correlated signal evidence—not permanent hardware identity."',
                  'message: "The same Bluetooth signal has reappeared after confirmation. It is ready for read-only observation, but it is only a match for this run—not permanent proof of scooter identity."',
              ),
              ('"Begin passive observation"', '"Begin read-only observation"'),
              ('title: "Learning the readable surface"', 'title: "Checking read-only data"'),
              (
                  'message: "The read-only setup and required observation time are complete. Sealing now freezes this run into one final Capture artifact."',
                  'message: "The read-only setup and required observation time are complete. Sealing now freezes this run into one final Capture record."',
              ),
              ('finalShareIntegrityReport == nil ? "Verify final artifact" : "Retry Share file"', 'finalShareIntegrityReport == nil ? "Prepare Share file" : "Retry Share file"'),
              (
                  'Text("\\(artifact.captureJSON.count.formatted()) capture bytes are sealed. Nembra still needs to finish the Share integrity check before this run is ready for analysis.")',
                  'Text("Capture is sealed. Nembra still needs to check the Share file before this run is ready for analysis.")',
              ),
              (
                  'Text("The artifact remains sealed, but post-seal Bluetooth cleanup did not complete. Preserve this capture and restart Nembra before another Experiment One run.")',
                  'Text("The Capture remains safely sealed, but Bluetooth cleanup did not finish. Preserve this Capture and restart Nembra before starting another run.")',
              ),
          ]

          for old, new in replacements:
              count = rider.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source occurrence, found {count}: {old}")
              rider = rider.replace(old, new, 1)

          forbidden = [
              "PREFLIGHT / DECLARATION",
              "operator declaration",
              "CORRELATION STOPPED",
              "NO UNIQUE TARGET",
              "AMBIGUOUS TARGET",
              "TARGET CONFIRMED",
              "correlated signal evidence",
              "Begin passive observation",
              "final Capture artifact",
              "Verify final artifact",
              "The artifact remains sealed",
          ]
          leftovers = [phrase for phrase in forbidden if phrase in rider]
          if leftovers:
              raise SystemExit(f"remaining rider jargon after round 2: {leftovers}")

          required = [
              "ES80 CAPTURE",
              "PREFLIGHT / SETUP",
              "MATCHING STOPPED",
              "NO UNIQUE SIGNAL",
              "MULTIPLE SIGNALS MATCHED",
              "SIGNAL CONFIRMED",
              "SIGNAL MATCHED",
              "Begin read-only observation",
              "Checking read-only data",
              "Capture record",
              "Prepare Share file",
              "Capture remains safely sealed",
              "guard status.physicalProcedurePermitted else",
              "declaredStationarySetup = nil",
              "PassiveBluetoothExperimentOneFinalShareIntegrity.inspect(artifact.json)",
              "finalShareIntegrityReport != nil",
          ]
          combined = prefix + rider + details
          for phrase in required:
              if phrase not in combined:
                  raise SystemExit(f"required product/truth contract missing: {phrase}")

          for phrase in [
              "Truth boundary",
              "CoreBluetooth",
              "Software Export SHA-256",
              "Runtime executable SHA-256",
              "does not authenticate the physical ES80",
          ]:
              if phrase not in details:
                  raise SystemExit(f"technical Details truth missing: {phrase}")

          path.write_text(combined, encoding="utf-8")
          PY

      - name: Verify source shape
        shell: bash
        run: |
          git diff --check

      - name: Commit round-two polish and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_es80_rider_terminology_polish_round2.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift
          git diff --cached --check
          git commit -m "Capture UX: simplify setup and Share language"
          git push origin HEAD:product/es80-v14-rider-terminology-polish/gpt56-go
