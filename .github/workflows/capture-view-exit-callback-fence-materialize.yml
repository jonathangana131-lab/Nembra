name: Materialize Capture View Exit Callback Fence

on:
  push:
    branches:
      - recovery/v14-capture-view-exit-callback-fence-0693-sol
    paths:
      - .github/workflows/capture-view-exit-callback-fence-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-view-exit-callback-fence-0693-sol
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='0693b471ed9ebc7756a78f1b9ed54fdf4d7f604c'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --quiet "$parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-view-exit-callback-fence-materialize.yml' 'scripts/ci/materialize_capture_view_exit_callback_fence.py' | sort)"
          test "$actual" = "$expected"

      - name: Apply exact callback-generation fence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_view_exit_callback_fence.py apply
          python3 scripts/ci/materialize_capture_view_exit_callback_fence.py verify

      - name: Validate presentation and truth preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/materialize_capture_view_exit_callback_fence.py
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          fi
          git diff --check
          parent='0693b471ed9ebc7756a78f1b9ed54fdf4d7f604c'
          changed="$(git diff --name-only "$parent" HEAD | grep -v -E '^(\.github/workflows/capture-view-exit-callback-fence-materialize.yml|scripts/ci/materialize_capture_view_exit_callback_fence.py)$' | sort)"
          expected="$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$parent" HEAD -- scripts/field/install_one_time_capture.command
          git diff --quiet "$parent" HEAD -- NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'private static var activePackageCorrelationOwner: UUID?' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'guard activePackageCorrelationOwner == nil,' NembraApp/App/NembraCaptureEntrypoint.swift
          test "$(grep -Fc 'if dynamicTypeSize.isAccessibilitySize' NembraApp/App/NembraCaptureEntrypoint.swift)" -ge 3

      - name: Publish clean two-path checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-view-exit-callback-fence-materialize.yml
          rm scripts/ci/materialize_capture_view_exit_callback_fence.py
          rm -rf scripts/ci/__pycache__
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): revoke hidden starts on Secure Link exit"
          git push origin HEAD:recovery/v14-capture-view-exit-callback-fence-0693-sol
