name: Agent ES80 fresh-session atomicity repair

on:
  push:
    branches:
      - capture-v14-recovery-failure-atomicity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture-v14-recovery-failure-atomicity
          fetch-depth: 0

      - name: Apply exact controller repair
        run: python3 .github/scripts/agent_es80_recovery_atomicity_patch.py

      - name: Verify failure-atomic source shape
        shell: bash
        run: |
          grep -F 'var reopenedGate = observationBoundaryQueueGate' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -F 'try reopenedGate.reopenAfterTerminalFreshTargetSession(' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -F 'try reopenedGate.reopenAfterAbortedFreshTargetSession(' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          ! grep -F 'try observationBoundaryQueueGate.reopenAfterTerminalFreshTargetSession(' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          ! grep -F 'try observationBoundaryQueueGate.reopenAfterAbortedFreshTargetSession(' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          git diff --check

      - name: Remove temporary patch machinery and checkpoint product repair
        shell: bash
        run: |
          rm .github/workflows/agent-es80-recovery-atomicity-patch.yml
          rm .github/scripts/agent_es80_recovery_atomicity_patch.py
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerFreshSessionPublicationAtomicityTests.swift .github/workflows/agent-es80-recovery-atomicity-patch.yml .github/scripts/agent_es80_recovery_atomicity_patch.py
          git commit -m 'fix(capture): make fresh-session publication failure-atomic'
          git push origin HEAD:capture-v14-recovery-failure-atomicity
