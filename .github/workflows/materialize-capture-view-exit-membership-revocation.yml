name: Materialize Capture View-Exit Membership Revocation

on:
  push:
    branches:
      - agent/capture-view-exit-membership-revocation

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/capture-view-exit-membership-revocation

      - name: Apply hidden-start authority repair
        shell: bash
        run: |
          set -euo pipefail
          parent='0693b471ed9ebc7756a78f1b9ed54fdf4d7f604c'
          test "$(git rev-parse HEAD^)" = "$parent"
          test "$(git merge-base HEAD "$parent")" = "$parent"

          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text(encoding='utf-8')
          old = '''    func abandonCorrelationForViewExit() {\n        guard processCorrelationLease != nil || correlationSession != nil else { return }\n        abandonPackageCorrelation()\n        phase = .failed\n        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."\n        log("target_correlation_abandoned_on_view_exit")\n    }\n'''
          new = '''    func abandonCorrelationForViewExit() {\n        // Secure Link may disappear while current-account membership enumeration is still in\n        // flight, before OFF1 owns a package scanner/lease. Revoke that exact request first so a\n        // late success cannot start hidden correlation after the screen has gone away.\n        membershipRequestID = UUID()\n        membershipBusy = false\n#if canImport(ThingSmartHomeKit)\n        membershipProbe = nil\n#endif\n\n        guard processCorrelationLease != nil || correlationSession != nil else { return }\n        // Preserve transport-first retirement: abandonPackageCorrelation() stops the package\n        // scanner before its owner-token-bound process lease is released.\n        abandonPackageCorrelation()\n        phase = .failed\n        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."\n        log("target_correlation_abandoned_on_view_exit")\n    }\n'''
          if app.count(old) != 1:
              raise SystemExit(f'expected exact current view-exit cleanup once, found {app.count(old)}')
          app = app.replace(old, new, 1)
          app_path.write_text(app, encoding='utf-8')

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift')
          test = test_path.read_text(encoding='utf-8')
          old_title = '    @Test("leaving Secure Link deterministically retires package correlation before controller loss")\n'
          new_title = '    @Test("leaving Secure Link revokes pending start authority and retires active package correlation")\n'
          if test.count(old_title) != 1:
              raise SystemExit('navigation retirement test title anchor drifted')
          test = test.replace(old_title, new_title, 1)

          anchor = '''        let view = String(try section(\n            in: source,\n            from: "private struct SecureLinkView: View",\n            to: "private extension SecureLinkView"\n        ))\n\n        #expect(controller.contains("func abandonCorrelationForViewExit()"))\n        #expect(controller.contains("guard processCorrelationLease != nil || correlationSession != nil else { return }"))\n        #expect(controller.contains("abandonPackageCorrelation()"))\n        #expect(controller.contains("target_correlation_abandoned_on_view_exit"))\n'''
          replacement = '''        let view = String(try section(\n            in: source,\n            from: "private struct SecureLinkView: View",\n            to: "private extension SecureLinkView"\n        ))\n        let cleanup = String(try section(\n            in: controller,\n            from: "func abandonCorrelationForViewExit()",\n            to: "var privateConfig: Bool"\n        ))\n\n        #expect(cleanup.contains("membershipRequestID = UUID()"))\n        #expect(cleanup.contains("membershipBusy = false"))\n        #expect(cleanup.contains("membershipProbe = nil"))\n        #expect(cleanup.contains("guard processCorrelationLease != nil || correlationSession != nil else { return }"))\n        #expect(cleanup.contains("abandonPackageCorrelation()"))\n        #expect(cleanup.contains("target_correlation_abandoned_on_view_exit"))\n        #expect(!cleanup.contains("releasePackageCorrelationLease()"))\n'''
          if test.count(anchor) != 1:
              raise SystemExit('navigation retirement assertion anchor drifted')
          test = test.replace(anchor, replacement, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('    func abandonCorrelationForViewExit()')
          end = s.index('    var privateConfig: Bool', start)
          cleanup = s[start:end]
          required = (
              'membershipRequestID = UUID()',
              'membershipBusy = false',
              'membershipProbe = nil',
              'guard processCorrelationLease != nil || correlationSession != nil else { return }',
              'abandonPackageCorrelation()',
          )
          for token in required:
              if token not in cleanup:
                  raise SystemExit(f'missing view-exit invariant: {token}')
          if cleanup.index('membershipRequestID = UUID()') > cleanup.index('guard processCorrelationLease'):
              raise SystemExit('pending membership authority must be revoked before active-correlation guard')
          if 'releasePackageCorrelationLease()' in cleanup:
              raise SystemExit('view exit must reuse token-bound package abandonment, not release lease directly')
          for forbidden in ('connectBLE(', 'publishDps', 'writeValue', 'disconnectBLE'):
              if forbidden in cleanup:
                  raise SystemExit(f'forbidden authority expansion in cleanup: {forbidden}')
          print('Capture view-exit hidden-start authority contract: PASS')
          PY

          git diff --check
          rm .github/workflows/materialize-capture-view-exit-membership-revocation.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift \
                  .github/workflows/materialize-capture-view-exit-membership-revocation.yml
          git diff --cached --check
          git commit -m 'fix(capture): revoke hidden correlation start on exit'
          git push origin HEAD:agent/capture-view-exit-membership-revocation
