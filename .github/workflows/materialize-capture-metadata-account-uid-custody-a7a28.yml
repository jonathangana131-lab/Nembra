name: Materialize Capture Metadata Account UID Custody a7a28

on:
  push:
    branches:
      - sol/v14-capture-metadata-account-uid-custody-a7a28
    paths:
      - .nembra/materialize-capture-metadata-account-uid-custody-a7a28.trigger

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-metadata-account-uid-custody-a7a28
          fetch-depth: 0

      - name: Guard exact product ancestry and metadata source blob
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a7a28ca6e744d4bad8be08fd3553a2af8c609b15 HEAD
          test "$(git hash-object NembraApp/Features/Research/TuyaAccountBridge.swift)" = "f9aea64e472ef0e75b4998edfeb564668d0254cf"

      - name: Materialize account-identity custody closure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_capture_metadata_account_uid_custody_a7a28.py
          swiftc -parse NembraApp/Features/Research/TuyaAccountBridge.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataAccountUIDCustodySourceTests.swift
          git diff --check

      - name: Remove scaffolding and verify exact effective scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/materialize_capture_metadata_account_uid_custody_a7a28.py
          rm -f .github/workflows/materialize-capture-metadata-account-uid-custody-a7a28.yml
          rm -f .nembra/materialize-capture-metadata-account-uid-custody-a7a28.trigger
          git diff --check
          mapfile -t paths < <(git diff --name-only a7a28ca6e744d4bad8be08fd3553a2af8c609b15 -- | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = "NembraApp/Features/Research/TuyaAccountBridge.swift"
          test "${paths[1]}" = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataAccountUIDCustodySourceTests.swift"

      - name: Publish clean current-product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): scrub metadata account identity from custody"
          git push origin HEAD:sol/v14-capture-metadata-account-uid-custody-a7a28
