name: Capture Private Read Lease Real Directory Swap Oracle

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_private_read_lease_real_directory_swap.py
      - .github/workflows/capture-private-read-lease-real-directory-swap-oracle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-private-read-lease-real-directory-swap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 9abc3f664b902469b98c0de3d99cc8f3583b85a5

jobs:
  exploit-positive:
    name: Reproduce plan-to-open real-directory replacement (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-real-directory-swap-oracle.yml \
            scripts/ci/tests/test_capture_private_read_lease_real_directory_swap.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute exploit-positive oracle
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -m py_compile \
            scripts/ci/tests/test_capture_private_read_lease_real_directory_swap.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_real_directory_swap.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve validation boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "NEMBRA_REAL_DIRECTORY_SWAP_ORACLE exploitPositive=true productionChanged=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false"
