name: Temporary Capture Cancel Stale Trusted Runs

on:
  push:
    branches:
      - ops/capture-cancel-stale-trusted-runs/gpt56-go

permissions:
  contents: read
  actions: write

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel explicitly superseded Capture runs only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          canonical_run='31312433441'
          stale_runs=(31311961120 31311521593)
          for run_id in "${stale_runs[@]}"; do
            test "$run_id" != "$canonical_run"
            status="$(curl --silent --show-error --location \
              --output /tmp/cancel-response.json \
              --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$run_id/cancel")"
            printf 'Cancel stale run %s -> HTTP %s\n' "$run_id" "$status"
            if [[ "$status" != '202' && "$status" != '409' ]]; then
              cat /tmp/cancel-response.json >&2 || true
              exit 1
            fi
          done
