name: Capture OFF1 Restart Generation Custody Patch

on:
  push:
    branches:
      - agent/v14-capture-off1-restart-generation-custody-sol
    paths:
      - .github/workflows/capture-off1-restart-generation-custody-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-off1-restart-generation-custody-sol
          fetch-depth: 0
      - name: Apply production repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_off1_restart_generation_custody_patch.py
          rm Scripts/apply_capture_off1_restart_generation_custody_patch.py
          rm .github/workflows/capture-off1-restart-generation-custody-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'invalidateInternalLifecycle'
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'active_generation_blocks_discovery_reset'
          git commit -m "fix(capture): retire prior generation before OFF1 restart"
          git push origin HEAD:agent/v14-capture-off1-restart-generation-custody-sol
