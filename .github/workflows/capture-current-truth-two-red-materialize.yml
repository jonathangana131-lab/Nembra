name: Materialize Capture Current Event and Membership Truth

on:
  push:
    branches:
      - fix/v14-capture-current-truth-two-red-870-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-current-truth-two-red-870-sol
          fetch-depth: 0

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift

      - name: Apply two current truth repairs
        run: python3 scripts/ci/materialize_capture_current_truth_two_red.py apply

      - name: Verify bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_current_truth_two_red.py verify
          python3 -m py_compile scripts/ci/materialize_capture_current_truth_two_red.py
          git diff --check

      - name: Publish clean three-path closure
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-current-truth-two-red-materialize.yml
          rm scripts/ci/materialize_capture_current_truth_two_red.py
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-current-truth-two-red-materialize.yml' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift' \
            'scripts/ci/materialize_capture_current_truth_two_red.py' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): close event and membership truth gaps'
          git push origin HEAD:fix/v14-capture-current-truth-two-red-870-sol
