name: Materialize Capture Mid-Series BLE Ownership eee5

on:
  push:
    branches:
      - fix/v14-capture-midseries-ble-ownership-eee5-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v14-capture-midseries-ble-ownership-eee5-sol
      - name: Guard and materialize current product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eee5a96fae1d30796ba5707f0a7f30f4f4d62530"
          python3 scripts/ci/materialize_capture_midseries_ble_ownership_eee5.py
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMidSeriesBLEOwnershipSourceTests.swift
      - name: Verify current + new truth
        shell: bash
        run: |
          set -euo pipefail
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          grep -Fq 'OfficialTuyaFactory.packageCorrelationMayStart' "$app"
          grep -Fq 'process_tuya_ble_ownership_blocks_scan' "$app"
          grep -Fq 'sdk_local_ble_reacquired_during_target_correlation' "$app"
          grep -Fq 'sdk_local_ble_ownership_blocks_correlation_window' "$app"
          grep -Fq 'sdk_local_ble_ownership_invalidates_correlation_window' "$app"
          grep -Fq 'Task.sleep(nanoseconds: 250_000_000)' "$app"
          grep -Fq 'let appleNickname = credential.fullName?.nickname' "$app"
          test -f scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
      - name: Publish clean reanchored child
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ci/materialize_capture_midseries_ble_ownership_eee5.py .github/workflows/v14-materialize-capture-midseries-ble-ownership-eee5.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): fence Tuya BLE across correlation windows on current product'
          git push origin HEAD:fix/v14-capture-midseries-ble-ownership-eee5-sol
