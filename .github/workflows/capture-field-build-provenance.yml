name: Capture Final App Authority Convergence

on:
  push:
    branches:
      - integration/v14-capture-lifecycle-compose-sol
    paths:
      - .github/workflows/capture-field-build-provenance.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-lifecycle-compose-sol
          fetch-depth: 0

      - name: Apply deterministic app authority repair
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_final_authority_patch.py

      - name: Prove known source authority contracts
        shell: bash
        run: |
          set -euo pipefail
          APP=NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'PassiveBluetoothPowerCycleObservationSession' "$APP"
          grep -Fq 'var correlationProgress: PassiveBluetoothPowerCycleObservationProgress? { correlationSession?.progress }' "$APP"
          grep -Fq 'var fieldBuildIsAuthoritative: Bool { buildIdentity.isAuthoritativeFieldBuild }' "$APP"
          grep -Fq 'await self.invalidateInternalLifecycle(' "$APP"
          grep -Fq 'self.phase == .selected' "$APP"
          grep -Fq 'self.targetCorrelationOperatorConfirmed' "$APP"
          grep -Fq 'guard phase == .selected else { return }' "$APP"
          ! grep -Fq 'private var central: CBCentralManager' "$APP"
          ! grep -Fq 'CBCentralManagerDelegate' "$APP"
          ! grep -Fq 'central.stopScan' "$APP"
          ! grep -Fq 'private func updateCandidate' "$APP"
          ! grep -Fq 'correlationProgressTask' "$APP"
          ! grep -Fq 'phase == .selected || phase == .failed' "$APP"

      - name: Run focused package/source contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaPackageOwnedCorrelationSingleScannerSourceTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaFieldBuildPresentationAuthoritySourceTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaCorrelatedTargetConfirmationLifecycleSourceTests

      - name: Commit repair and self-retire helper
        shell: bash
        run: |
          set -euo pipefail
          rm Scripts/apply_capture_final_authority_patch.py
          git show HEAD~2:.github/workflows/capture-field-build-provenance.yml > .github/workflows/capture-field-build-provenance.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): close app authority convergence blockers'
          git push origin HEAD:integration/v14-capture-lifecycle-compose-sol
