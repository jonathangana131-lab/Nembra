name: Capture Final App Closure Patch

on:
  push:
    branches:
      - repair/v14-capture-progress-scanner-build-sol
    paths:
      - .github/workflows/capture-field-build-provenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-progress-scanner-build-sol
          fetch-depth: 0
      - name: Apply reviewed final-app closure transform
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_progress_scanner_build_patch.py
          rm Scripts/apply_capture_progress_scanner_build_patch.py
          git show HEAD~2:.github/workflows/capture-field-build-provenance.yml > .github/workflows/capture-field-build-provenance.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): publish correlation readiness and retire legacy scanner"
          git push origin HEAD:repair/v14-capture-progress-scanner-build-sol
