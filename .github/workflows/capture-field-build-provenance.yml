name: Capture Progress Scanner Build Focused QA

on:
  push:
    branches:
      - repair/v14-capture-progress-scanner-build-sol
    paths:
      - .github/workflows/capture-field-build-provenance.yml

permissions:
  contents: read

jobs:
  focused-source-contracts:
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-progress-scanner-build-sol
      - name: Validate focused Capture contracts
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter TuyaCorrelationProgressPresentationSourceTests
          swift test --filter TuyaPackageOwnedCorrelationSingleScannerSourceTests
          swift test --filter TuyaFieldBuildPresentationAuthoritySourceTests
