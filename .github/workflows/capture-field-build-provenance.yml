name: Capture Sealed Application Prefix Patch

on:
  push:
    branches:
      - repair/v14-capture-sealed-application-prefix-sol
    paths:
      - Scripts/apply_capture_sealed_application_prefix_patch.py
      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift
      - .github/workflows/capture-field-build-provenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-sealed-application-prefix-sol
          fetch-depth: 0

      - name: Verify exact flagship parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0b3ab8c58ebfb1332cbb46d9f1f145fdfca8b17f HEAD
          test -f Scripts/apply_capture_sealed_application_prefix_patch.py
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift

      - name: Apply immutable accepted-prefix repair
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_sealed_application_prefix_patch.py
          file=NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'private var sealedAcceptedEventPrefix: [Event]?' "$file"
          grep -Fq 'self.sealedAcceptedEventPrefix = self.events' "$file"
          grep -Fq 'events: sealedAcceptedEventPrefix ?? events' "$file"
          grep -Fq 'sealedAcceptedEventPrefix = nil' "$file"

      - name: Run focused accepted-prefix regression
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaAcceptedApplicationEvidenceSealSourceTests

      - name: Self-retire staging and publish product commit
        shell: bash
        run: |
          set -euo pipefail
          rm Scripts/apply_capture_sealed_application_prefix_patch.py
          git checkout 0b3ab8c58ebfb1332cbb46d9f1f145fdfca8b17f -- .github/workflows/capture-field-build-provenance.yml

          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check

          effective="$(git diff --name-only 0b3ab8c58ebfb1332cbb46d9f1f145fdfca8b17f --)"
          expected="$(printf '%s\n%s' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift')"
          test "$effective" = "$expected" || {
            printf 'unexpected final state relative to exact flagship parent:\n%s\n' "$effective" >&2
            exit 1
          }

          git commit -m 'fix(capture): freeze accepted application export prefix' \
            -m 'Snapshot the app-exportable event prefix synchronously after the package acceptance seal and before any later suspension, clear stale pre-seal export bytes, use the frozen prefix for accepted exports, and clear it on a genuinely fresh correlation life. Delayed callbacks remain diagnostics only and cannot mutate accepted artifact evidence. Physical status remains NO-GO.'
          git push origin HEAD:repair/v14-capture-sealed-application-prefix-sol
