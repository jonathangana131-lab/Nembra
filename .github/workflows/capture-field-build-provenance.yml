name: Capture Async Correlation Invalidation Patch

on:
  push:
    branches:
      - repair/v14-capture-correlation-async-invalidation-sol
    paths:
      - Scripts/apply_capture_correlation_async_invalidation_patch.py
      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationAsyncInvalidationPresentationSourceTests.swift
      - .github/workflows/capture-field-build-provenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-correlation-async-invalidation-sol
          fetch-depth: 0

      - name: Verify exact flagship parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 915d9c6aed8e78ab3a84e92338a38dcf8f483060 HEAD
          test -f Scripts/apply_capture_correlation_async_invalidation_patch.py
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationAsyncInvalidationPresentationSourceTests.swift

      - name: Apply bounded lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_correlation_async_invalidation_patch.py

      - name: Verify source contracts without a second polling clock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          required = [
              'var correlationSeriesIsInvalidated: Bool { correlationProgress?.isSeriesInvalidated == true }',
              'func consumeCorrelationAsyncInvalidationIfNeeded()',
              'target_correlation_async_invalidated',
              '.onChange(of: test.correlationSeriesIsInvalidated, initial: true)',
              'test.consumeCorrelationAsyncInvalidationIfNeeded()',
              'TimelineView(.periodic(from: .now, by: 0.5))',
          ]
          for needle in required:
              assert needle in app, needle
          view = app[app.index('private struct SecureLinkView'):app.index('#Preview')]
          assert 'correlationProgressTask' not in view
          assert 'Task.sleep(for: .milliseconds(100))' not in view
          consumer = app[app.index('func consumeCorrelationAsyncInvalidationIfNeeded()'):app.index('private var accountIdentityLeaseSnapshot')]
          for forbidden in ['markAuthenticated(for:', 'recordApplicationUpdate', 'endConnection(for:', 'scanForPeripherals', 'connect(', 'Task.sleep']:
              assert forbidden not in consumer, forbidden
          PY

      - name: Self-retire staging and publish product commit
        shell: bash
        run: |
          set -euo pipefail
          rm Scripts/apply_capture_correlation_async_invalidation_patch.py
          git checkout 915d9c6aed8e78ab3a84e92338a38dcf8f483060 -- .github/workflows/capture-field-build-provenance.yml

          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check

          effective="$(git diff --name-only 915d9c6aed8e78ab3a84e92338a38dcf8f483060 --)"
          expected="$(printf '%s\n%s' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationAsyncInvalidationPresentationSourceTests.swift')"
          test "$effective" = "$expected" || {
            printf 'unexpected final state relative to exact flagship parent:\n%s\n' "$effective" >&2
            exit 1
          }

          git commit -m 'fix(capture): consume asynchronous correlation invalidation' \
            -m 'Use the existing 0.5-second TimelineView presentation clock to consume package-owned correlation terminal invalidation into an explicit fail-closed restart state. Do not add a second polling task or manufacture Bluetooth, authentication, telemetry, or target evidence. Physical status remains NO-GO.'
          git push origin HEAD:repair/v14-capture-correlation-async-invalidation-sol
