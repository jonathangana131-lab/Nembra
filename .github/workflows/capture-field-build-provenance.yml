name: Capture Field Build Provenance

on:
  push:
    branches:
      - capture/field-build-provenance-gpt56
      - capture/one-time-ble-dump-gpt56
  pull_request:
    paths:
      - NembraApp/App/NembraCaptureBuildIdentity.swift
      - NembraCapture.xcodeproj/project.pbxproj
      - scripts/field/install_one_time_capture.command
      - .github/workflows/capture-field-build-provenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: Stamp and verify Capture provenance
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          identity='NembraApp/App/NembraCaptureBuildIdentity.swift'
          project='NembraCapture.xcodeproj/project.pbxproj'
          installer='scripts/field/install_one_time_capture.command'

          bash -n "$installer"
          grep -Fq 'EXPECTED_SOURCE_SHA="${1:-${NEMBRA_CAPTURE_EXPECTED_SOURCE_SHA:-}}"' "$installer"
          grep -Fq 'SOURCE_SHA="$(git rev-parse HEAD | tr ' "$installer"
          grep -Fq '[[ "$SOURCE_SHA" == "$EXPECTED_SOURCE_SHA" ]]' "$installer"
          grep -Fq 'Current checkout $SOURCE_SHA does not match accepted Capture source $EXPECTED_SOURCE_SHA' "$installer"
          grep -Fq 'BUILD_LABEL="capture-v14-${SOURCE_SHA:0:12}"' "$installer"
          grep -Fq 'NEMBRA_CAPTURE_BUILD_IDENTIFIER="$BUILD_LABEL"' "$installer"
          grep -Fq 'NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$SOURCE_SHA"' "$installer"
          if grep -Fq 'Switch to capture/one-time-ble-dump-gpt56 first' "$installer"; then
            echo 'ERROR: field-build authority must bind the accepted source SHA, not a branch name.' >&2
            exit 1
          fi

          /usr/bin/python3 - "$installer" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          required = [
              '[[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9A-Fa-f]{40}$ ]]',
              'EXPECTED_SOURCE_SHA="$(printf \'%s\' "$EXPECTED_SOURCE_SHA" | tr \'[:upper:]\' \'[:lower:]\')"',
              'SOURCE_SHA="$(git rev-parse HEAD | tr \'[:upper:]\' \'[:lower:]\')"',
              '[[ "$SOURCE_SHA" == "$EXPECTED_SOURCE_SHA" ]]',
          ]
          missing = [anchor for anchor in required if anchor not in source]
          if missing:
              raise SystemExit(f"Capture exact-source contract is incomplete: {missing}")

          source_match = required[-1]
          bootstrap = '"$ROOT/Scripts/bootstrap_capture_tuya_sdk.sh"'
          build_stage = 'say "Building SDK-integrated Nembra Capture for iPhone"'
          if bootstrap not in source or build_stage not in source:
              raise SystemExit("Capture field installer source-order anchors are missing")
          if not source.index(source_match) < source.index(bootstrap) < source.index(build_stage):
              raise SystemExit("Exact accepted source SHA must be proven before workspace bootstrap/build")
          PY

          grep -Fq 'NembraCaptureBuildIdentity.swift in Sources' "$project"
          grep -Fq 'INFOPLIST_KEY_NembraCaptureBuildIdentifier = "$(NEMBRA_CAPTURE_BUILD_IDENTIFIER)";' "$project"
          grep -Fq 'INFOPLIST_KEY_NembraCaptureSourceCommitSHA = "$(NEMBRA_CAPTURE_BUILD_COMMIT_SHA)";' "$project"

          grep -Fq 'static let buildIdentifierInfoKey = "NembraCaptureBuildIdentifier"' "$identity"
          grep -Fq 'static let sourceCommitSHAInfoKey = "NembraCaptureSourceCommitSHA"' "$identity"
          grep -Fq 'sourceCommitSHA.count == 40' "$identity"
          grep -Fq 'let expectedIdentifier = "capture-v14-\(sourceCommitSHA.prefix(12))"' "$identity"

      - name: Build stamped standalone Simulator app
        shell: bash
        run: |
          set -euo pipefail
          sha='0123456789abcdef0123456789abcdef01234567'
          label='capture-v14-0123456789ab'
          rm -rf /tmp/NembraCaptureProvenanceDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureProvenanceDerived \
            CODE_SIGNING_ALLOWED=NO \
            NEMBRA_CAPTURE_BUILD_IDENTIFIER="$label" \
            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$sha" \
            build

          plist='/tmp/NembraCaptureProvenanceDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app/Info.plist'
          test -f "$plist"
          test "$(plutil -extract NembraCaptureBuildIdentifier raw -o - "$plist")" = "$label"
          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$sha"
