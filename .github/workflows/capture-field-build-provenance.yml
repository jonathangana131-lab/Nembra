name: Capture App Lifecycle Patch

on:
  push:
    branches:
      - recovery/v14-capture-app-lifecycle-consumption-sol
    paths:
      - Scripts/apply_capture_app_lifecycle_patch.py
      - .github/workflows/capture-field-build-provenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-app-lifecycle-consumption-sol
          fetch-depth: 0

      - name: Verify exact convergence ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c093d9fca66d14980f4c05057dd560409fb529de HEAD
          test -f Scripts/apply_capture_app_lifecycle_patch.py
          test -f .github/workflows/capture-app-lifecycle-patch-gpt56.yml

      - name: Apply bounded lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_app_lifecycle_patch.py

          file=NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'var fieldBuildIsAuthoritative: Bool { buildIdentity.isAuthoritativeFieldBuild }' "$file"
          grep -Fq 'private func invalidateInternalLifecycle' "$file"
          grep -Fq 'sessionLedger.markInternalLifecycleFailure(for: token)' "$file"
          grep -Fq 'sdk_source_authority_lost_before_failure_callback' "$file"
          grep -Fq 'targetCorrelationOperatorConfirmed = true' "$file"
          grep -Fq '.disabled(!test.fieldBuildIsAuthoritative || !test.privateConfig' "$file"

      - name: Self-retire staging files and restore canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          rm Scripts/apply_capture_app_lifecycle_patch.py
          rm .github/workflows/capture-app-lifecycle-patch-gpt56.yml
          git checkout c093d9fca66d14980f4c05057dd560409fb529de -- .github/workflows/capture-field-build-provenance.yml

          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check

          effective="$(git diff --name-only c093d9fca66d14980f4c05057dd560409fb529de --)"
          test "$effective" = "NembraApp/App/NembraCaptureEntrypoint.swift" || {
            printf 'unexpected final state relative to convergence base:\n%s\n' "$effective" >&2
            exit 1
          }

          git commit -m 'fix(capture): retire app lifecycle authority fail-closed' \
            -m 'Consume the package no-clock internal-lifecycle terminal across authentication, observation and sampled terminal cleanup; preserve source-drift truth against late SDK failure; retire impossible active generations without hiding package ownership; and make compiled field-build provenance app-visible before OFF1. No DP query/command or telemetry semantics are added. Physical status remains NO-GO.'
          git push origin HEAD:recovery/v14-capture-app-lifecycle-consumption-sol
