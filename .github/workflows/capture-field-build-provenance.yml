name: Capture OFF1 Restart Custody Patch

on:
  push:
    branches:
      - repair/v14-capture-off1-restart-generation-custody-r2-sol
    paths:
      - Scripts/apply_capture_off1_restart_custody_patch.py
      - .github/workflows/capture-field-build-provenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-off1-restart-generation-custody-r2-sol
          fetch-depth: 0

      - name: Verify exact live parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 675326ad788235a3035156750e95387645087cda HEAD
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationRestartLifecycleSourceTests.swift
          test -f Scripts/apply_capture_off1_restart_custody_patch.py

      - name: Apply one-function custody repair
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_off1_restart_custody_patch.py
          file=NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'private func beginCorrelationSeries()' "$file"
          grep -Fq 'active_generation_blocks_discovery_reset' "$file"
          grep -Fq 'await self?.invalidateInternalLifecycle(' "$file"

      - name: Self-retire staging and publish product commit
        shell: bash
        run: |
          set -euo pipefail
          rm Scripts/apply_capture_off1_restart_custody_patch.py
          git checkout 675326ad788235a3035156750e95387645087cda -- .github/workflows/capture-field-build-provenance.yml

          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check

          effective="$(git diff --name-only 675326ad788235a3035156750e95387645087cda --)"
          test "$effective" = "NembraApp/App/NembraCaptureEntrypoint.swift" || {
            printf 'unexpected final state relative to live parent:\n%s\n' "$effective" >&2
            exit 1
          }

          git commit -m 'fix(capture): retire active generation before OFF1 restart' \
            -m 'When an impossible package-owned session generation still exists at a new OFF1 correlation request, retire that exact generation through the canonical internal-lifecycle terminal instead of hiding it behind local presentation failure. Ordinary package-owned correlation remains evidence-neutral. Physical status remains NO-GO.'
          git push origin HEAD:repair/v14-capture-off1-restart-generation-custody-r2-sol
