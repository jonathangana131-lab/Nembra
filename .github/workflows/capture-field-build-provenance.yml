name: Capture Already-Terminal Continuity Patch

on:
  push:
    branches:
      - repair/v14-capture-already-terminal-continuity-r4-sol
    paths:
      - Scripts/apply_capture_already_terminal_continuity_patch.py
      - .github/workflows/capture-field-build-provenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-already-terminal-continuity-r4-sol
          fetch-depth: 0

      - name: Verify exact live parent and regression
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 75e39f708f58734dd32bd61471bd13dada9d8546 HEAD
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift
          test -f Scripts/apply_capture_already_terminal_continuity_patch.py

      - name: Apply bounded continuity mirror repair
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_already_terminal_continuity_patch.py
          file=NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'private func mirrorAlreadyTerminalObservationContinuity' "$file"
          grep -Fq 'accepted_prefix_seal_continuity_invalidated' "$file"
          grep -Fq 'accepted_prefix_seal_lifecycle_rejected' "$file"

      - name: Run focused source regression
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaAlreadyTerminalObservationContinuitySourceTests

      - name: Self-retire staging and publish product commit
        shell: bash
        run: |
          set -euo pipefail
          rm Scripts/apply_capture_already_terminal_continuity_patch.py
          git checkout 75e39f708f58734dd32bd61471bd13dada9d8546 -- .github/workflows/capture-field-build-provenance.yml

          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check

          effective="$(git diff --name-only 75e39f708f58734dd32bd61471bd13dada9d8546 --)"
          expected="$(printf '%s\n%s' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift')"
          test "$effective" = "$expected" || {
            printf 'unexpected final state relative to live parent:\n%s\n' "$effective" >&2
            exit 1
          }

          git commit -m 'fix(capture): mirror package-terminal continuity once' \
            -m 'When the package continuous-observation guard has already failed and retired its token before throwing, mirror that exact terminal into app-local ownership/presentation instead of issuing a second ledger terminal. Handle application receipt, watchdog liveness and acceptance seal explicitly; classify unrelated seal failures as internal lifecycle. Physical status remains NO-GO.'
          git push origin HEAD:repair/v14-capture-already-terminal-continuity-r4-sol
