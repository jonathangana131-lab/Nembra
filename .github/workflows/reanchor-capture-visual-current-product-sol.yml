name: Reanchor Capture visual current product sol

on:
  push:
    branches:
      - validation/v14-capture-guided-visual-e7af-sol

permissions:
  contents: write

jobs:
  reanchor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/v14-capture-guided-visual-e7af-sol
          fetch-depth: 0
      - name: Merge exact current guided product
        shell: bash
        run: |
          set -euo pipefail
          product='502cfc43d8943bacb446f287b58d46463df3a7ca'
          product_ref='refs/remotes/origin/product/v14-capture-guided-truth-current-sol'
          git fetch origin 'refs/heads/product/v14-capture-guided-truth-current-sol:refs/remotes/origin/product/v14-capture-guided-truth-current-sol'
          test "$(git rev-parse "$product_ref")" = "$product"
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git merge --no-commit --no-ff "$product"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git add -A
          git commit -m 'merge(capture): reanchor visual gate on current product'
          git push origin HEAD:validation/v14-capture-guided-visual-e7af-sol
