name: Capture Final GO 3042 Release Gap Current Red Team

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_es80_final_go_continuous_release_gap_red_team.py
      - .github/workflows/capture-final-go-3042-release-gap-current-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gap:
    name: Reject mutation after final watcher drain (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact red-team child to current #3042
        shell: bash
        env:
          ATTACKED_PARENT: e68207678cdc0ae535371836ad222d93329e2078
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "${ATTACKED_PARENT}^{commit}"
          changed_paths="$(git diff --name-only "$ATTACKED_PARENT"...HEAD | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/capture-final-go-3042-release-gap-current-redteam.yml' \
            'scripts/ci/tests/test_es80_final_go_continuous_release_gap_red_team.py')"
          test "$changed_paths" = "$expected_paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile without cache artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          for relative in (
              'scripts/ci/es80_authenticated_stationary_private_review_final_go.py',
              'scripts/ci/tests/test_es80_final_go_continuous_release_gap_red_team.py',
          ):
              path = Path(relative)
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

      - name: Reproduce final-drain release gap
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          /usr/bin/python3 -B scripts/ci/tests/test_es80_final_go_continuous_release_gap_red_team.py

      - name: Preserve exact validation hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve validation truth boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'Attacked current production parent: e68207678cdc0ae535371836ad222d93329e2078\n'
          printf 'SUCCESS is exploit-positive evidence that watcher observation is not an atomic custody release.\n'
          printf 'No credentials, Xcode device action, Bluetooth/Tuya traffic, install, launch, or physical experiment occurs.\n'
