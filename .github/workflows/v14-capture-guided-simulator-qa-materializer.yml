              func liveSideEffectsAreFenced() throws {
                  let source = try entrypointSource()
                  let view = try section(
                      in: source,
                      from: "private struct SecureLinkView: View",
                      to: "private var hero: some View"
                  )
                  #expect(view.contains("private let simulatorQASnapshot"))
                  #expect(view.contains("guard simulatorQASnapshot == nil else { return }"))
                  #expect(view.contains("sdkAccount.bootstrap()"))
                  #expect(view.contains("test.abandonCorrelationForViewExit()"))
                  #expect(view.contains("test.consumeCorrelationAsyncInvalidation()"))
              }

              private func entrypointSource() throws -> String {
                  let testFile = URL(fileURLWithPath: #filePath)
                  let repositoryRoot = testFile
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(
                      contentsOf: repositoryRoot.appendingPathComponent("NembraApp/App/NembraCaptureEntrypoint.swift"),
                      encoding: .utf8
                  )
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
