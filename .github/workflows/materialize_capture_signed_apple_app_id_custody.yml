name: Materialize Capture Signed Apple App ID Custody

on:
  push:
    branches:
      - fix/v14-capture-signed-apple-app-id-custody-sol
    paths:
      - .github/workflows/materialize_capture_signed_apple_app_id_custody.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-signed-apple-app-id-custody-sol
          fetch-depth: 0

      - name: Guard exact product ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a87b4f05023627e9f9f43a96c77077c837b1322a HEAD
          test "$(git rev-parse a87b4f05023627e9f9f43a96c77077c837b1322a:scripts/field/install_one_time_capture.command)" = "$(git rev-parse HEAD:scripts/field/install_one_time_capture.command)"
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift

      - name: Materialize exact signed App ID and team rendezvous
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/field/install_one_time_capture.command")
          text = path.read_text(encoding="utf-8")

          built_start = text.index('BUILT_APPLE_SIGNIN_ENTITLEMENT="$(printf')
          built_end = text.index('\n\nBUILT_PROFILE=', built_start)
          built = r'''BUILT_APPLE_IDENTITY="$(printf '%s' "$SIGNED_ENTITLEMENTS_OUTPUT" | /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -c '
          import plistlib, sys
          payload = sys.stdin.buffer.read()
          start = payload.find(b"<?xml")
          end = payload.rfind(b"</plist>")
          if start < 0 or end < start:
              raise SystemExit(2)
          try:
              root = plistlib.loads(payload[start:end + len(b"</plist>")])
              signin = root.get("com.apple.developer.applesignin")
              application_identifier = root.get("application-identifier")
              team_identifier = root.get("com.apple.developer.team-identifier")
          except Exception:
              raise SystemExit(2)
          if signin != ["Default"] or not isinstance(application_identifier, str) or not isinstance(team_identifier, str):
              raise SystemExit(2)
          if any((not value) or "\t" in value or "\n" in value for value in (application_identifier, team_identifier)):
              raise SystemExit(2)
          sys.stdout.write("Default\t" + application_identifier + "\t" + team_identifier)
          ' || true)"
          IFS=$'\t' read -r BUILT_APPLE_SIGNIN_ENTITLEMENT BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER <<< "$BUILT_APPLE_IDENTITY"
          unset BUILT_APPLE_IDENTITY
          [[ "$BUILT_APPLE_SIGNIN_ENTITLEMENT" == "Default" ]] || \
              die "Final signed Capture app does not carry the required Sign in with Apple entitlement. Enable the capability for this App ID/team and rebuild; do not install this candidate."'''
          text = text[:built_start] + built + text[built_end:]

          profile_start = text.index('PROFILE_APPLE_SIGNIN_ENTITLEMENT="$(printf')
          profile_end = text.index('\nsay "Final signed app and embedded provisioning profile both authorize Sign in with Apple"', profile_start)
          profile = r'''PROFILE_APPLE_IDENTITY="$(printf '%s' "$PROFILE_PLIST_XML" | /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -c '
          import plistlib, sys
          try:
              root = plistlib.loads(sys.stdin.buffer.read())
              entitlements = root.get("Entitlements", {})
              signin = entitlements.get("com.apple.developer.applesignin")
              application_identifier = entitlements.get("application-identifier")
              team_identifier = entitlements.get("com.apple.developer.team-identifier")
              root_team_identifiers = root.get("TeamIdentifier")
          except Exception:
              raise SystemExit(2)
          if signin != ["Default"] or not isinstance(application_identifier, str) or not isinstance(team_identifier, str):
              raise SystemExit(2)
          if not isinstance(root_team_identifiers, list) or len(root_team_identifiers) != 1 or not isinstance(root_team_identifiers[0], str):
              raise SystemExit(2)
          root_team_identifier = root_team_identifiers[0]
          if any((not value) or "\t" in value or "\n" in value for value in (application_identifier, team_identifier, root_team_identifier)):
              raise SystemExit(2)
          sys.stdout.write("Default\t" + application_identifier + "\t" + team_identifier + "\t" + root_team_identifier)
          ' || true)"
          IFS=$'\t' read -r PROFILE_APPLE_SIGNIN_ENTITLEMENT PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER <<< "$PROFILE_APPLE_IDENTITY"
          unset PROFILE_APPLE_IDENTITY
          [[ "$PROFILE_APPLE_SIGNIN_ENTITLEMENT" == "Default" ]] || \
              die "Embedded provisioning profile does not authorize Sign in with Apple for the final Capture app. Enable the capability for this App ID/team and rebuild; do not install this candidate."

          [[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]] || \
              die "Final signed Capture app application identifier does not end in the exact standalone Capture bundle identifier. Discard this candidate."
          [[ "$BUILT_APPLICATION_IDENTIFIER" != *"*"* ]] || \
              die "Final signed Capture app application identifier is wildcard-shaped. Discard this candidate."
          [[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]] || \
              die "Embedded provisioning profile application identifier does not exactly match the final signed Capture app. Discard this candidate."
          [[ "$BUILT_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \
              die "Final signed Capture app team identifier does not match the selected Apple Development team. Discard this candidate."
          [[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \
              die "Embedded provisioning profile team entitlement does not match the selected Apple Development team. Discard this candidate."
          [[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \
              die "Embedded provisioning profile root TeamIdentifier does not match the selected Apple Development team. Discard this candidate."'''
          text = text[:profile_start] + profile + text[profile_end:]

          old_unset = 'unset SIGNED_ENTITLEMENTS_OUTPUT BUILT_APPLE_SIGNIN_ENTITLEMENT PROFILE_PLIST_XML PROFILE_APPLE_SIGNIN_ENTITLEMENT BUILT_PROFILE'
          new_unset = 'unset SIGNED_ENTITLEMENTS_OUTPUT BUILT_APPLE_SIGNIN_ENTITLEMENT BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER PROFILE_PLIST_XML PROFILE_APPLE_SIGNIN_ENTITLEMENT PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER BUILT_PROFILE'
          if text.count(old_unset) != 1:
              raise SystemExit("expected exactly one Apple custody unset anchor")
          text = text.replace(old_unset, new_unset, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate portable custody contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          python3 scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          python3 - <<'PY'
          from pathlib import Path
          installer = Path("scripts/field/install_one_time_capture.command").read_text(encoding="utf-8")
          required = [
              'BUILT_APPLICATION_IDENTIFIER',
              'BUILT_TEAM_IDENTIFIER',
              'PROFILE_APPLICATION_IDENTIFIER',
              'PROFILE_TEAM_IDENTIFIER',
              'PROFILE_ROOT_TEAM_IDENTIFIER',
              'application-identifier',
              'com.apple.developer.team-identifier',
              'TeamIdentifier',
              '[[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]]',
              '[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]]',
              '[[ "$BUILT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
          ]
          install = installer.index('say "Installing SDK-integrated Capture on the intended iPhone"')
          for needle in required:
              if needle not in installer:
                  raise SystemExit(f"missing Apple App ID custody needle: {needle}")
          for check in required[-5:]:
              if installer.index(check) >= install:
                  raise SystemExit(f"Apple App ID custody check is after installation: {check}")
          if 'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"' in installer:
              raise SystemExit("must not assume App ID prefix equals Team ID")
          custody = installer[installer.index("SIGNED_ENTITLEMENTS_OUTPUT="):install]
          if custody.count("/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -c '") != 2:
              raise SystemExit("Apple custody must preserve exactly two closed-environment plist parsers")
          for forbidden in ("connectBLE", "publishDps", "writeValue", "scanForPeripherals", "NEMBRA_SIMULATION_"):
              if forbidden in custody:
                  raise SystemExit(f"Apple signing custody introduced forbidden authority: {forbidden}")
          print("signed Apple App ID custody portable contract: PASS")
          PY
          git diff --check

      - name: Publish clean repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-sol-materializer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/materialize_capture_signed_apple_app_id_custody.yml
          git add scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift
          git diff --cached --check
          git commit -m "fix(capture): bind signed Apple App ID identity"
          git push origin HEAD:fix/v14-capture-signed-apple-app-id-custody-sol
