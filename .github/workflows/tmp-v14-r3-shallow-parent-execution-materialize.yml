name: TEMP Capture R3 Shallow Parent Execution Materializer

on:
  push:
    branches:
      - repair/v14-r3-parent-git-execution-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-r3-parent-git-execution-sol
          fetch-depth: 0

      - name: Materialize shallow-safe accepted parent execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py")
          source = source_path.read_text(encoding="utf-8")

          old = (
              '        source_blob = subprocess.run(\n'
              '            ["/usr/bin/git", "-C", str(root), "rev-parse", f"{PARENT_SOURCE_SHA}:{PARENT_MODULE_PATH}"],\n'
              '            check=True,\n'
              '            text=True,\n'
              '            stdout=subprocess.PIPE,\n'
              '            stderr=subprocess.PIPE,\n'
              '            env=environment,\n'
              '        ).stdout.strip().lower()\n'
          )
          new = (
              '        checked_out_blob = subprocess.run(\n'
              '            ["/usr/bin/git", "-C", str(root), "rev-parse", f"HEAD:{PARENT_MODULE_PATH}"],\n'
              '            check=True,\n'
              '            text=True,\n'
              '            stdout=subprocess.PIPE,\n'
              '            stderr=subprocess.PIPE,\n'
              '            env=environment,\n'
              '        ).stdout.strip().lower()\n'
          )
          if source.count(old) != 1:
              raise SystemExit("R3 parent source lookup: expected one exact match")
          source = source.replace(old, new, 1)

          old = (
              '    if source_blob != PARENT_MODULE_BLOB:\n'
              '        raise GeneratedSubjectGoError("pinned authenticated-stationary parent source does not own the accepted module blob")\n'
          )
          new = (
              '    if checked_out_blob != PARENT_MODULE_BLOB:\n'
              '        raise GeneratedSubjectGoError("exact checked-out R3 source does not own the pinned authenticated-stationary parent module blob")\n'
          )
          if source.count(old) != 1:
              raise SystemExit("R3 parent blob ownership check: expected one exact match")
          source = source.replace(old, new, 1)

          marker = '    "scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py",\n)\nPARENT_PINNED_PATHS = (\n'
          replacement = (
              '    "scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py",\n'
              '    "scripts/ci/tests/test_es80_generated_subject_parent_git_execution_custody.py",\n'
              ')\nPARENT_PINNED_PATHS = (\n'
          )
          if source.count(marker) != 1:
              raise SystemExit("R3 child authority regression path: expected one exact match")
          source = source.replace(marker, replacement, 1)
          source_path.write_text(source, encoding="utf-8")

          workflow_path = Path(".github/workflows/capture-authenticated-stationary-generated-subject-final-go.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          path_line = '      - scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py\n'
          if workflow.count(path_line) != 2:
              raise SystemExit("canonical workflow path triggers: expected two helper-regression lines")
          workflow = workflow.replace(
              path_line,
              path_line + '      - scripts/ci/tests/test_es80_generated_subject_parent_git_execution_custody.py\n',
          )
          compile_line = '            scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py\n'
          if workflow.count(compile_line) != 1:
              raise SystemExit("canonical workflow compile list: expected one helper-regression line")
          workflow = workflow.replace(
              compile_line,
              compile_line.rstrip("\n") + ' \\\n            scripts/ci/tests/test_es80_generated_subject_parent_git_execution_custody.py\n',
              1,
          )
          tail = (
              '      - name: Prove generated helper executes from accepted Git bytes\n'
              '        shell: bash\n'
              '        run: |\n'
              '          set -euo pipefail\n'
              '          python3 scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py\n'
          )
          extra = tail + (
              '\n      - name: Prove authenticated parent executes from accepted Git bytes\n'
              '        shell: bash\n'
              '        run: |\n'
              '          set -euo pipefail\n'
              '          python3 scripts/ci/tests/test_es80_generated_subject_parent_git_execution_custody.py\n'
          )
          if workflow.count(tail) != 1:
              raise SystemExit("canonical workflow execution tail: expected one exact match")
          workflow = workflow.replace(tail, extra, 1)
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            .github/workflows/capture-authenticated-stationary-generated-subject-final-go.yml
          git commit -m "Capture: make R3 parent Git execution shallow-safe"

      - name: Compile converged authority surface
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py \
            scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py \
            scripts/ci/tests/test_es80_generated_subject_parent_git_execution_custody.py

      - name: Reject hidden mutable parent execution
        run: python3 scripts/ci/tests/test_es80_generated_subject_parent_git_execution_custody.py

      - name: Preserve R3 authority suites
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py
          python3 scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py

      - name: Require clean validation worktree
        run: |
          set -euo pipefail
          find scripts/ci -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Remove temporary materializer and publish clean convergence
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-v14-r3-shallow-parent-execution-materialize.yml
          git commit -m "Capture: remove shallow parent materializer"
          git push origin HEAD:repair/v14-r3-parent-git-execution-sol
