name: Capture entrypoint authorization legacy-gate fix once

on:
  push:
    branches:
      - recovery/capture-entrypoint-auth-current-gpt56sol-20260820
    paths:
      - .github/workflows/capture-entrypoint-auth-legacy-gate-fix-once.yml

permissions:
  contents: write

jobs:
  fix-and-prove-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: recovery/capture-entrypoint-auth-current-gpt56sol-20260820
      SELF: .github/workflows/capture-entrypoint-auth-legacy-gate-fix-once.yml
      APP: NembraApp/App/NembraCaptureEntrypoint.swift
      EXPECTED_PARENT: 2cfed74461f2583f3ed3669b4aec9f4f4e526ed6
      EXPECTED_APP_BLOB: 9107ea5ef2bc023cd3b8c2e15a46297e733ba838
    steps:
      - uses: actions/checkout@v6
        with:
          ref: recovery/capture-entrypoint-auth-current-gpt56sol-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact rejected subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git rev-parse HEAD:"$APP")" = "$EXPECTED_APP_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Remove stale legacy authority rechecks
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              "        guard phase == .idle, buildIdentity.isAuthoritativeFieldBuild else { return }\n",
              "        guard phase == .idle else { return }\n",
              "non-authorizing handoff must not depend on legacy build authority",
          )

          legacy_guard = '''        guard buildIdentity.isAuthoritativeFieldBuild else {\n            failLocally(buildIdentity.blocker ?? "Exact field-build provenance is unavailable.", "field_build_identity_unavailable")\n            return\n        }\n'''
          if source.count(legacy_guard) != 2:
              raise SystemExit(f"OFF1/auth legacy guards: expected two anchors, found {source.count(legacy_guard)}")
          source = source.replace(legacy_guard, "", 2)

          replace_once(
              '''              candidate.likely,\n              buildIdentity.isAuthoritativeFieldBuild,\n              sdkDeviceMembershipVerified,\n''',
              '''              candidate.likely,\n              sdkDeviceMembershipVerified,\n''',
              "official connection legacy build recheck",
          )

          replace_once(
              '''    private var authorityReady: Bool {\n        test.fieldBuildIsAuthoritative\n            && test.fieldAuthorizationReady\n            && test.privateConfig\n''',
              '''    private var authorityReady: Bool {\n        test.fieldAuthorizationReady\n            && test.privateConfig\n''',
              "preflight signed armed authority",
          )

          selected_button = '''                    .buttonStyle(.borderedProminent)\n                    .controlSize(.large)\n                    .disabled(!authorityReady || test.membershipBusy)\n                } else if test.phase == .authenticating {\n'''
          selected_button_fixed = '''                    .buttonStyle(.borderedProminent)\n                    .controlSize(.large)\n                    .disabled(test.membershipBusy)\n                } else if test.phase == .authenticating {\n'''
          replace_once(
              selected_button,
              selected_button_fixed,
              "selected authentication action lifecycle gating",
          )

          path.write_text(source, encoding="utf-8")

      - name: Prove exact source lifecycle oracle
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP" || true)" = 0

      - name: Publish only proven app source
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "$SELF"
          git add -- "$APP"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): let signed authorization own lifecycle admission'
          fixed="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CAPTURE_ENTRYPOINT_AUTH_LEGACY_GATE_FIX fixed=%s rejectedParent=%s sourceOracle=green exactHeadAcceptance=false physicalAuthorityCreated=false\n' "$fixed" "$EXPECTED_PARENT"
