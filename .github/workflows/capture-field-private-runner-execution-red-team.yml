name: Capture Field Private Runner Execution Red Team

on:
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/es80_signed_field_artifact_private_runner.py
      - scripts/ci/tests/test_capture_field_private_runner_execution_authority_red_team.py
      - .github/workflows/capture-field-private-runner-execution-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-runner-execution-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact diagnostic checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Prove private runner execution authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_private_runner_execution_authority_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_private_runner_execution_authority_red_team.py
          git diff --check
