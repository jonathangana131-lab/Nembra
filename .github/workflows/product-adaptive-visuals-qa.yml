name: Product Adaptive Visuals QA

on:
  push:
    branches:
      - product/adaptive-visuals
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-adaptive-visuals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-qa:
    name: Build, launch, screenshot, and truth-check Nembra
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Product truth guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "product/adaptive-visuals"
          test ! -e NembraApp/Features/Research/ES80CaptureShellView.swift || true
          grep -q 'WAITING FOR DATA' NembraApp/Features/Dashboard/DashboardView.swift
          grep -q 'LAST KNOWN' NembraApp/Features/Dashboard/DashboardView.swift
          grep -q 'DashboardView()' NembraApp/App/AppRootView.swift
          if grep -En 'speedKilometersPerHour[[:space:]]*\?\?[[:space:]]*[1-9]|batteryPercent[[:space:]]*\?\?[[:space:]]*[1-9]' NembraApp/Features/Dashboard/DashboardView.swift; then
            echo 'ERROR: Dashboard must not substitute invented non-zero telemetry.'
            exit 1
          fi

      - name: Build simulator product
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/NembraProductDerived
          START=$(python3 - <<'PY'
          import time
          print(time.time())
          PY
          )
          set -o pipefail
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraProductDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-product-build.log
          END=$(python3 - <<'PY'
          import time
          print(time.time())
          PY
          )
          python3 - "$START" "$END" <<'PY' > /tmp/build-timing.txt
          import sys
          print(f"build_seconds={float(sys.argv[2]) - float(sys.argv[1]):.3f}")
          PY

      - name: Verify app product
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find /tmp/NembraProductDerived/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test -n "$BUNDLE_ID"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Boot iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; xs=[x for arr in d.values() for x in arr if "iPhone" in x.get("name","") and x.get("isAvailable",False)]; print(xs[-1]["udid"] if xs else "")')
          test -n "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"

      - name: Launch and capture portrait Home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nembra-screenshots
          START=$(python3 - <<'PY'
          import time
          print(time.time())
          PY
          )
          xcrun simctl launch --terminate-running-process "$SIM_UDID" "$BUNDLE_ID"
          END=$(python3 - <<'PY'
          import time
          print(time.time())
          PY
          )
          python3 - "$START" "$END" <<'PY' > /tmp/launch-timing.txt
          import sys
          print(f"simctl_launch_seconds={float(sys.argv[2]) - float(sys.argv[1]):.3f}")
          PY
          sleep 3
          xcrun simctl io "$SIM_UDID" orientation portrait || true
          sleep 1
          xcrun simctl io "$SIM_UDID" screenshot /tmp/nembra-screenshots/home-portrait.png

      - name: Capture landscape Dashboard Cockpit
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl io "$SIM_UDID" orientation landscapeLeft || xcrun simctl io "$SIM_UDID" orientation landscape || true
          sleep 2
          xcrun simctl io "$SIM_UDID" screenshot /tmp/nembra-screenshots/dashboard-cockpit-landscape.png
          test -s /tmp/nembra-screenshots/dashboard-cockpit-landscape.png
          test -s /tmp/nembra-screenshots/home-portrait.png

      - name: Record product QA summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "head_sha=$(git rev-parse HEAD)"
            cat /tmp/build-timing.txt
            cat /tmp/launch-timing.txt
            echo "dashboard_truth=unknown telemetry remains unknown; retained telemetry is labeled"
            echo "screenshots=home portrait + dashboard landscape"
          } | tee /tmp/product-qa-summary.txt

      - name: Upload screenshots and timings
        uses: actions/upload-artifact@v4
        with:
          name: nembra-product-adaptive-visuals-${{ github.sha }}
          path: |
            /tmp/nembra-screenshots/*.png
            /tmp/product-qa-summary.txt
            /tmp/build-timing.txt
            /tmp/launch-timing.txt
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-product-build-log-${{ github.sha }}
          path: /tmp/nembra-product-build.log
          if-no-files-found: ignore
