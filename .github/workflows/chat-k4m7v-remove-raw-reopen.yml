name: chat-k4m7v remove raw pre-H reopen
on:
  push:
    branches: ['parallel/recover-es80-preh-observation-abort/chat-k4m7v']
    paths: ['.github/workflows/chat-k4m7v-remove-raw-reopen.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/recover-es80-preh-observation-abort/chat-k4m7v
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift')
          s=p.read_text()
          def one(old,new):
              global s
              if s.count(old)!=1: raise SystemExit(f'expected 1 match, got {s.count(old)}: {old[:80]}')
              s=s.replace(old,new,1)
          one('''        case freshTargetSessionRequired\n        case abortQueueRetirementRequired\n        case abortRetirementReceiptMismatch\n        case abortQueueTailChanged\n''','')
          one('''    private var committedReadyTransaction: Transaction?\n    private var requiredReadyTargetSessionGeneration: UInt64?\n''','''    private var committedReadyTransaction: Transaction?\n''')
          one('''        if let requiredReadyTargetSessionGeneration {\n            guard authority.targetSessionGeneration == requiredReadyTargetSessionGeneration else {\n                throw StateError.freshTargetSessionRequired\n            }\n        }\n''','')
          one('''        requiredReadyTargetSessionGeneration = nil\n        phase = .drainingReady(transaction)\n''','''        phase = .drainingReady(transaction)\n''')
          start=s.index('''    /// Reopens boundary admission only after old-session FIFO retirement is proven,''')
          end=s.index('''    @discardableResult\n    mutating func resetForNewCaptureSession()''', start)
          replacement='''    /// Abort quarantine is intentionally irreversible in this slice. Raw FIFO\n    /// retirement alone cannot reopen lifecycle admission because retired positions\n    /// still need a separate globally-resolved frontier update. #450 owns that\n    /// producer and its successor integration must make fresh-session reopen consume\n    /// the producer-issued resolution receipt. Until then reset and Ready both fail.\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
          git rm .github/workflows/chat-k4m7v-remove-raw-reopen.yml
          git config user.name 'nembra-chat-k4m7v'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          git commit -m 'fix: keep pre-H abort quarantined through raw retirement'
          git push origin HEAD:parallel/recover-es80-preh-observation-abort/chat-k4m7v
