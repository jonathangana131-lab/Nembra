name: Capture delivery-cutoff repair materializer

on:
  push:
    branches:
      - capture/application-delivery-cutoff-repair-sol-20260814

permissions:
  contents: write

concurrency:
  group: capture-delivery-cutoff-repair-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/application-delivery-cutoff-repair-sol-20260814
          fetch-depth: 2
          persist-credentials: true

      - name: Materialize exact production repair
        env:
          EXPECTED_PARENT: 54c939a447ac657f51861dc6c760ab5e210ac0d7
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -f scripts/ci/materialize_capture_delivery_cutoff_repair.py
          python3 scripts/ci/materialize_capture_delivery_cutoff_repair.py
          test ! -e scripts/ci/materialize_capture_delivery_cutoff_repair.py
          test ! -e .github/workflows/capture-delivery-cutoff-repair-materializer.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-delivery-cutoff-repair-materializer.yml \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift \
            scripts/ci/materialize_capture_delivery_cutoff_repair.py | sort)"
          test "$changed" = "$expected"

          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Capture V16.1: preserve SmartLife application delivery cutoff'
          git push origin HEAD:capture/application-delivery-cutoff-repair-sol-20260814
