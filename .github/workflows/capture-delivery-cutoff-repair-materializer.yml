name: Capture delivery-cutoff repair materializer

on:
  push:
    branches:
      - capture/application-delivery-cutoff-repair-sol-20260814

permissions:
  contents: write

concurrency:
  group: capture-delivery-cutoff-repair-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/application-delivery-cutoff-repair-sol-20260814
          fetch-depth: 2
          persist-credentials: true

      - name: Bind exact claimed parent and materialize narrow repair
        shell: bash
        env:
          EXPECTED_PARENT: 29fb304613c142ba99e1259e9d612c1919309145
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/capture-delivery-cutoff-repair-materializer.yml'

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          ledger_path = 'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift'
          replace_once(
              ledger_path,
              '''}\n\n/// Owns the non-secret chronology consumed by `TuyaAuthenticatedReadOnlyPreflight`.''',
              '''}\n\n/// Opaque monotonic receipt minted at the exact synchronous application-callback delivery edge.\n/// The caller can ask the package to capture "now" for an existing connection token, but cannot\n/// choose the scalar timestamp carried by a production receipt. This lets later actor admission\n/// preserve delivery chronology without turning a caller-selected number into evidence.\npublic struct TuyaReadOnlyApplicationReceipt: Sendable {\n    fileprivate let token: TuyaReadOnlyConnectionToken\n    fileprivate let receivedAtUptimeNanoseconds: UInt64\n\n    public static func capture(for token: TuyaReadOnlyConnectionToken) -> Self {\n        Self(\n            token: token,\n            receivedAtUptimeNanoseconds: DispatchTime.now().uptimeNanoseconds\n        )\n    }\n\n    fileprivate init(\n        token: TuyaReadOnlyConnectionToken,\n        receivedAtUptimeNanoseconds: UInt64\n    ) {\n        self.token = token\n        self.receivedAtUptimeNanoseconds = receivedAtUptimeNanoseconds\n    }\n\n    /// Test-only/package-internal clock injection. This is deliberately not public API.\n    static func testingCapture(\n        for token: TuyaReadOnlyConnectionToken,\n        receivedAtUptimeNanoseconds: UInt64\n    ) -> Self {\n        Self(token: token, receivedAtUptimeNanoseconds: receivedAtUptimeNanoseconds)\n    }\n}\n\n/// Owns the non-secret chronology consumed by `TuyaAuthenticatedReadOnlyPreflight`.'''
          )

          replace_once(
              ledger_path,
              '''    public func recordApplicationUpdate(\n        isNonEmpty: Bool,\n        for token: TuyaReadOnlyConnectionToken\n    ) throws {\n        try requireCurrent(token)\n        guard case .authenticated = authenticationState else {\n            throw MutationError.authenticationRequired\n        }\n        guard isNonEmpty else {\n            throw MutationError.emptyApplicationUpdate\n        }\n\n        let now = try nextMonotonicObservation()\n        try requireContinuousAuthenticatedObservation(at: now)\n        try requireIncompleteObservationHorizonOpen(at: now)''',
              '''    public func recordApplicationUpdate(\n        isNonEmpty: Bool,\n        receipt: TuyaReadOnlyApplicationReceipt,\n        for token: TuyaReadOnlyConnectionToken\n    ) throws {\n        try requireCurrent(token)\n        guard receipt.token == token else {\n            throw MutationError.staleConnection\n        }\n        guard case .authenticated = authenticationState else {\n            throw MutationError.authenticationRequired\n        }\n        guard isNonEmpty else {\n            throw MutationError.emptyApplicationUpdate\n        }\n\n        let now = receipt.receivedAtUptimeNanoseconds\n        try requireContinuousAuthenticatedObservation(at: now)\n        try requireIncompleteObservationHorizonOpen(at: now)'''
          )

          observe_end = '''        try requireIncompleteObservationHorizonOpen(at: now)\n        latestObservedUptimeNanoseconds = now\n    }\n\n    /// Seals a failed observation horizon while authenticated transport may still exist.'''
          observe_replacement = '''        try requireIncompleteObservationHorizonOpen(at: now)\n        latestObservedUptimeNanoseconds = now\n    }\n\n    /// Package-internal compatibility path used by the existing deterministic fake-clock tests.\n    /// Shipping app code cannot call this overload; production application evidence must carry an\n    /// opaque synchronous `TuyaReadOnlyApplicationReceipt`.\n    func recordApplicationUpdate(\n        isNonEmpty: Bool,\n        for token: TuyaReadOnlyConnectionToken\n    ) throws {\n        try requireCurrent(token)\n        guard case .authenticated = authenticationState else {\n            throw MutationError.authenticationRequired\n        }\n        guard isNonEmpty else {\n            throw MutationError.emptyApplicationUpdate\n        }\n\n        let now = try nextMonotonicObservation()\n        try requireContinuousAuthenticatedObservation(at: now)\n        try requireIncompleteObservationHorizonOpen(at: now)\n        guard let authenticatedAt = authenticatedAtUptimeNanoseconds,\n              now >= authenticatedAt else {\n            throw MutationError.monotonicClockRegressed\n        }\n        guard applicationPayloadCount < Int.max else {\n            throw MutationError.applicationPayloadCountExhausted\n        }\n\n        applicationPayloadCount += 1\n        latestApplicationPayloadUptimeNanoseconds = now\n        latestObservedUptimeNanoseconds = now\n    }\n\n    /// Seals a failed observation horizon while authenticated transport may still exist.'''
          replace_once(ledger_path, observe_end, observe_replacement)

          app_path = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          replace_once(
              app_path,
              '''    private var applicationUpdateAdmissionsInFlight = 0\n    private var acceptanceCutIsClosed = false''',
              '''    private var applicationUpdateAdmissionsInFlight = 0\n    private var applicationUpdateAdmissionTail: Task<Void, Never>?\n    private var acceptanceCutIsClosed = false'''
          )

          replace_once(
              app_path,
              '''                    onApplicationUpdate: { [weak self] update in\n                        Task { @MainActor in\n                            await self?.receivedApplicationUpdate(update, token: token)\n                        }\n                    },''',
              '''                    onApplicationUpdate: { [weak self] update in\n                        guard let self, !update.isEmpty else { return }\n                        let applicationReceipt = TuyaReadOnlyApplicationReceipt.capture(for: token)\n                        self.applicationUpdateAdmissionsInFlight += 1\n                        let predecessor = self.applicationUpdateAdmissionTail\n                        let admissionTask = Task { @MainActor [weak self] in\n                            _ = await predecessor?.value\n                            guard let self else { return }\n                            defer { self.applicationUpdateAdmissionsInFlight -= 1 }\n                            await self.receivedApplicationUpdate(\n                                update,\n                                receipt: applicationReceipt,\n                                token: token\n                            )\n                        }\n                        self.applicationUpdateAdmissionTail = admissionTask\n                    },'''
          )

          replace_once(
              app_path,
              '''    private func receivedApplicationUpdate(\n        _ update: [String: String],\n        token: TuyaReadOnlyConnectionToken\n    ) async {''',
              '''    private func receivedApplicationUpdate(\n        _ update: [String: String],\n        receipt: TuyaReadOnlyApplicationReceipt,\n        token: TuyaReadOnlyConnectionToken\n    ) async {'''
          )

          replace_once(
              app_path,
              '''\n        applicationUpdateAdmissionsInFlight += 1\n        defer { applicationUpdateAdmissionsInFlight -= 1 }\n\n        // Snapshot the exact account identity''',
              '''\n        // The synchronous SDK callback already owns the controller-lifetime admission drain.\n        // Snapshot the exact account identity'''
          )

          replace_once(
              app_path,
              '''            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)''',
              '''            try await sessionLedger.recordApplicationUpdate(\n                isNonEmpty: !update.isEmpty,\n                receipt: receipt,\n                for: token\n            )'''
          )

          replace_once(
              app_path,
              '''                guard let self,\n                      self.currentConnectionToken == token,\n                      self.secureSessionEstablished,\n                      let driver = self.driver else { return }\n\n                let now = DispatchTime.now().uptimeNanoseconds''',
              '''                guard let self,\n                      self.currentConnectionToken == token,\n                      self.secureSessionEstablished,\n                      let driver = self.driver else { return }\n\n                // A callback already delivered by SmartLife owns an opaque package receipt and\n                // must enter the ledger before the watchdog is allowed to cross the 60 s cutoff.\n                // Do not reset `previousPollUptime`: if draining stalls beyond the accepted\n                // continuity gap, the next real watchdog observation still fails closed.\n                guard self.applicationUpdateAdmissionsInFlight == 0 else {\n                    try? await Task.sleep(for: .milliseconds(10))\n                    continue\n                }\n\n                let now = DispatchTime.now().uptimeNanoseconds'''
          )

          # The callback is invoked only by the @MainActor SmartLife driver delegate. Encode that\n          # isolation in the closure type so synchronous controller admission is compiler-checked.\n          p = Path(app_path)
          text = p.read_text()
          old_callback_type = 'onApplicationUpdate: @escaping ([String: String]) -> Void,'
          if text.count(old_callback_type) != 2:
              raise SystemExit(f"expected two OfficialTuyaDriver callback type declarations, found {text.count(old_callback_type)}")
          text = text.replace(old_callback_type, 'onApplicationUpdate: @escaping @MainActor ([String: String]) -> Void,')
          old_storage = 'private var onApplicationUpdate: (([String: String]) -> Void)?'
          if text.count(old_storage) != 1:
              raise SystemExit(f"expected one SmartLife callback storage declaration, found {text.count(old_storage)}")
          text = text.replace(old_storage, 'private var onApplicationUpdate: (@MainActor ([String: String]) -> Void)?', 1)
          p.write_text(text)

          # Replace the three chronology-focused tests added on the canonical carrier with the\n          # stronger opaque-receipt/FIFO contract while preserving the rest of the seal suite.\n          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift')
          test_text = test_path.read_text()
          start = test_text.index('    @Test("SDK application callback enters admission synchronously')
          end = test_text.index('    @Test("accepted export consumes the frozen whole envelope', start)
          stronger = r'''    @Test("SDK application callback receipts and owns admission before the first async hop")
    func sdkCallbackAdmissionPrecedesAsyncScheduling() throws {
        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
        guard let connect = app.range(of: "newDriver.connect("),
              let callback = app.range(of: "onApplicationUpdate:", range: connect.lowerBound..<app.endIndex),
              let success = app.range(of: "success:", range: callback.upperBound..<app.endIndex) else {
            Issue.record("Could not isolate the official Tuya application callback closure.")
            throw SourceContractError.sectionMissing
        }
        let body = String(app[callback.lowerBound..<success.lowerBound])

        let receipt = try #require(body.range(of: "let applicationReceipt = TuyaReadOnlyApplicationReceipt.capture(for: token)"))
        let increment = try #require(body.range(of: "applicationUpdateAdmissionsInFlight += 1", range: receipt.upperBound..<body.endIndex))
        let task = try #require(body.range(of: "Task { @MainActor", range: increment.upperBound..<body.endIndex))
        let release = try #require(body.range(of: "defer { self.applicationUpdateAdmissionsInFlight -= 1 }", range: task.upperBound..<body.endIndex))
        let receiver = try #require(body.range(of: "receivedApplicationUpdate(", range: release.upperBound..<body.endIndex))
        #expect(receipt.lowerBound < increment.lowerBound)
        #expect(increment.lowerBound < task.lowerBound)
        #expect(task.lowerBound < release.lowerBound)
        #expect(release.lowerBound < receiver.lowerBound)
    }

    @Test("receiver consumes the opaque receipt without reminting application chronology")
    func receiverUsesPackageOwnedReceipt() throws {
        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
        let receiver = String(try section(in: app, from: "private func receivedApplicationUpdate(", to: "private func redactedApplicationEventDetails("))

        #expect(receiver.contains("receipt: TuyaReadOnlyApplicationReceipt"))
        #expect(receiver.contains("receipt: receipt"))
        #expect(!receiver.contains("applicationUpdateAdmissionsInFlight += 1"))
        #expect(!receiver.contains("applicationUpdateAdmissionsInFlight -= 1"))
        #expect(!receiver.contains("TuyaReadOnlyApplicationReceipt.capture"))
    }

    @Test("package-owned horizon poll cannot overtake an already-receipted application callback")
    func packageHorizonWaitsForApplicationAdmissionDrain() throws {
        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
        let watchdog = try section(in: app, from: "private func startWatchdog", to: "private func recordObservedTransportLoss")
        let body = String(watchdog)

        guard let drainGate = body.range(of: "guard self.applicationUpdateAdmissionsInFlight == 0 else {"),
              let packagePoll = body.range(of: "try await self.sessionLedger.observeCurrentConnection(for: token)") else {
            Issue.record("The package-owned horizon poll must defer while a synchronously receipted SDK application callback is still draining.")
            throw SourceContractError.sectionMissing
        }

        #expect(drainGate.lowerBound < packagePoll.lowerBound)
        #expect(body.contains("catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached"))
        #expect(body.contains("mirrorAlreadyTerminalIncompleteObservationHorizon"))
        #expect(!body.contains("markApplicationObservationTimedOut"))
    }

'''
          test_path.write_text(test_text[:start] + stronger + test_text[end:])

          receipt_tests = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationReceiptChronologyTests.swift')
          if receipt_tests.exists():
              raise SystemExit(f"unexpected existing path: {receipt_tests}")
          receipt_tests.write_text(r'''import Foundation
import Testing
@testable import NembraBluetoothCapture

@Suite("Tuya application delivery receipts")
struct TuyaApplicationReceiptChronologyTests {
    @Test("pre-cut delivery remains pre-cut when actor admission happens after the deadline")
    func delayedAdmissionUsesOpaqueDeliveryTime() async throws {
        let clock = ReceiptTestUptimeClock(1_000)
        let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
        let token = try await ledger.beginConnection()
        clock.advance(to: 1_500)
        try await ledger.markAuthenticationStarted(for: token)
        clock.advance(to: 2_000)
        try await ledger.markAuthenticated(for: token, method: .smartLifeAppSDK)

        let deliveredAt: UInt64 = 3_000
        let receipt = TuyaReadOnlyApplicationReceipt.testingCapture(
            for: token,
            receivedAtUptimeNanoseconds: deliveredAt
        )
        clock.advance(to: 2_000 + TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds + 10_000)

        try await ledger.recordApplicationUpdate(isNonEmpty: true, receipt: receipt, for: token)
        let snapshot = await ledger.currentPreflightSnapshot()
        #expect(snapshot.applicationPayloadCount == 1)
        #expect(snapshot.latestApplicationPayloadUptimeNanoseconds == deliveredAt)
        #expect(snapshot.latestObservedUptimeNanoseconds == deliveredAt)
    }

    @Test("receipt is bound to the exact connection token")
    func receiptCannotCrossConnectionGeneration() async throws {
        let clock = ReceiptTestUptimeClock(10)
        let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
        let first = try await ledger.beginConnection()
        let staleReceipt = TuyaReadOnlyApplicationReceipt.testingCapture(
            for: first,
            receivedAtUptimeNanoseconds: 11
        )

        clock.advance(to: 20)
        let second = try await ledger.beginConnection()
        clock.advance(to: 25)
        try await ledger.markAuthenticationStarted(for: second)
        clock.advance(to: 30)
        try await ledger.markAuthenticated(for: second, method: .smartLifeAppSDK)

        await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection) {
            try await ledger.recordApplicationUpdate(
                isNonEmpty: true,
                receipt: staleReceipt,
                for: second
            )
        }
        #expect((await ledger.currentPreflightSnapshot()).applicationPayloadCount == 0)
    }
}

private final class ReceiptTestUptimeClock: @unchecked Sendable {
    private let lock = NSLock()
    private var value: UInt64

    init(_ value: UInt64) { self.value = value }

    func now() -> UInt64 {
        lock.lock()
        defer { lock.unlock() }
        return value
    }

    func advance(to newValue: UInt64) {
        lock.lock()
        value = newValue
        lock.unlock()
    }
}
''')

          workflow_path = '.github/workflows/capture-v16-standalone.yml'
          replace_once(
              workflow_path,
              '          swift test --filter TuyaAcceptedApplicationEvidenceSealSourceTests\n',
              '          swift test --filter TuyaAcceptedApplicationEvidenceSealSourceTests\n          swift test --filter TuyaApplicationReceiptChronologyTests\n'
          )

          # The materializer is a one-shot transport for a narrow patch because the connected\n          # GitHub contents API cannot apply hunks to the 4k-line app file. It must not survive\n          # in the effective repair diff.
          Path('.github/workflows/capture-delivery-cutoff-repair-materializer.yml').unlink()
          PY

          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          ledger = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift').read_text()
          assert 'let applicationReceipt = TuyaReadOnlyApplicationReceipt.capture(for: token)' in app
          assert 'applicationUpdateAdmissionTail' in app
          assert 'guard self.applicationUpdateAdmissionsInFlight == 0 else {' in app
          assert 'receipt: TuyaReadOnlyApplicationReceipt' in app
          assert 'public struct TuyaReadOnlyApplicationReceipt: Sendable' in ledger
          assert 'receivedAtUptimeNanoseconds: DispatchTime.now().uptimeNanoseconds' in ledger
          assert 'receipt.token == token' in ledger
          assert 'let now = receipt.receivedAtUptimeNanoseconds' in ledger
          assert not Path('.github/workflows/capture-delivery-cutoff-repair-materializer.yml').exists()
          PY

          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Capture V16.1: preserve SmartLife application delivery cutoff'
          git push origin HEAD:capture/application-delivery-cutoff-repair-sol-20260814
