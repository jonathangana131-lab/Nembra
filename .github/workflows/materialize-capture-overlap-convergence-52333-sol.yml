name: Materialize Capture Overlap Convergence 52333

on:
  push:
    branches:
      - sol/v14-capture-overlap-convergence-52333-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-overlap-convergence-52333-sol
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          product_parent='52333deb09ea9a5964250097f83884d285f25d78'
          git merge-base --is-ancestor "$product_parent" HEAD
          git diff --quiet "$product_parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift

      - name: Apply current Capture convergence
        run: python3 scripts/ci/materialize_capture_overlap_convergence_52333.py apply

      - name: Verify bounded truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_overlap_convergence_52333.py verify
          python3 -m py_compile scripts/ci/materialize_capture_overlap_convergence_52333.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift
          git diff --check

      - name: Publish clean four-path convergence
        shell: bash
        run: |
          set -euo pipefail
          product_parent='52333deb09ea9a5964250097f83884d285f25d78'
          rm .github/workflows/materialize-capture-overlap-convergence-52333-sol.yml
          rm scripts/ci/materialize_capture_overlap_convergence_52333.py
          git add -A
          changed="$(git diff --name-only "$product_parent" | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaStationaryFailureCopySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): converge foreground custody and stationary recovery'
          git push origin HEAD:sol/v14-capture-overlap-convergence-52333-sol
