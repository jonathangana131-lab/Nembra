name: Materialize Capture Account UID Await Race BA3 Sol

on:
  push:
    branches:
      - fix/v14-capture-account-uid-await-race-ba3-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact product parent and red-only helper scope
        shell: bash
        run: |
          set -euo pipefail
          parent='ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          test "$(git merge-base HEAD "$parent")" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-account-uid-await-race-ba3-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift'

      - name: Snapshot and scrub verified account UID before first await
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          old_guard = '              accountIdentityLeaseIsAuthorized,\n              let driver else {'
          new_guard = '              accountIdentityLeaseIsAuthorized,\n              let membershipAccountUID,\n              !membershipAccountUID.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty,\n              let driver else {'
          if source.count(old_guard) != 1:
              raise SystemExit(f'expected one account identity admission guard, found {source.count(old_guard)}')
          source = source.replace(old_guard, new_guard, 1)

          admission = '        applicationUpdateAdmissionsInFlight += 1\n'
          scrub = '        let exportSafeUpdate = Self.redactedApplicationEventDetails(update, accountUID: membershipAccountUID)\n\n'
          if source.count(admission) != 1:
              raise SystemExit(f'expected one application admission counter seam, found {source.count(admission)}')
          source = source.replace(admission, scrub + admission, 1)

          old_post_await = '            var eventDetails = redactedApplicationEventDetails(update)\n'
          new_post_await = '            var eventDetails = exportSafeUpdate\n'
          if source.count(old_post_await) != 1:
              raise SystemExit(f'expected one post-await mutable UID reread, found {source.count(old_post_await)}')
          source = source.replace(old_post_await, new_post_await, 1)

          helper_start = source.index('    private func redactedApplicationEventDetails(_ update: [String: String]) -> [String: String] {')
          helper_end = source.index('    private func startWatchdog', helper_start)
          helper = source[helper_start:helper_end]
          new_helper = '\n'.join([
              '    private static func redactedApplicationEventDetails(',
              '        _ update: [String: String],',
              '        accountUID: String',
              '    ) -> [String: String] {',
              '        let uid = accountUID.trimmingCharacters(in: .whitespacesAndNewlines)',
              '        guard !uid.isEmpty else { return [:] }',
              '',
              '        let marker = "<redacted-account-uid>"',
              '        var redacted: [String: String] = [:]',
              '        redacted.reserveCapacity(update.count)',
              '        for key in update.keys.sorted() {',
              '            guard let value = update[key] else { continue }',
              '            let redactedKey = key.replacingOccurrences(',
              '                of: uid,',
              '                with: marker,',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '            let safeValue = value.replacingOccurrences(',
              '                of: uid,',
              '                with: marker,',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '            var safeKey = redactedKey',
              '            var collisionIndex = 2',
              '            while redacted[safeKey] != nil {',
              '                safeKey = "\\(redactedKey)#\\(collisionIndex)"',
              '                collisionIndex += 1',
              '            }',
              '            redacted[safeKey] = safeValue',
              '        }',
              '        return redacted',
              '    }',
              '',
              '',
          ])
          source = source[:helper_start] + new_helper + source[helper_end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify pre-await custody and parse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('    private func receivedApplicationUpdate(')
          end = s.index('    private func startWatchdog', start)
          receiver = s[start:end]
          snapshot = receiver.index('let membershipAccountUID,')
          scrub = receiver.index('let exportSafeUpdate = Self.redactedApplicationEventDetails(update, accountUID: membershipAccountUID)')
          first_await = receiver.index('try await sessionLedger.recordApplicationUpdate')
          log = receiver.index('log("tuya_application_update", eventDetails)')
          assert snapshot < scrub < first_await < log
          assert 'var eventDetails = exportSafeUpdate' in receiver
          assert 'redactedApplicationEventDetails(update)' not in receiver
          helper_start = receiver.index('private static func redactedApplicationEventDetails(')
          helper = receiver[helper_start:]
          assert 'accountUID: String' in helper
          assert 'membershipAccountUID' not in helper
          assert 'return update' not in helper
          assert 'guard !uid.isEmpty else { return [:] }' in helper
          assert 'while redacted[safeKey] != nil' in helper
          print('Capture account UID pre-await custody: PASS')
          PY
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          git diff --check

      - name: Collapse helper to two product paths
        shell: bash
        run: |
          set -euo pipefail
          parent='ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          rm .github/workflows/materialize-capture-account-uid-await-race-ba3-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          git add -u .github/workflows/materialize-capture-account-uid-await-race-ba3-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): bind account UID scrub before async admission'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-account-uid-await-race-ba3-sol
