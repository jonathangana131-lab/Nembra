name: Capture Package Green Wave Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/capture-package-green-wave-diagnostic.yml'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/**'

permissions:
  contents: read

jobs:
  package-differential:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Bind diagnostic to exact head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run complete Capture package
        id: package
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/capture-package-green-wave.log"
          set +e
          (cd Packages/NembraBluetoothCapture && swift test) 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Require exact 51 to 8 differential
        shell: bash
        run: |
          /usr/bin/python3 -I - "$RUNNER_TEMP/capture-package-green-wave.log" <<'PY'
          import re
          import sys
          from collections import Counter
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          files = Counter()
          for line in lines:
              match = re.search(r'at ([A-Za-z0-9_]+\.swift):\d+:\d+:', line)
              if match and ("recorded an issue" in line or "Caught error" in line):
                  files[match.group(1)] += 1

          targets = [
              "ES80CaptureLockedSurfaceVisualAcceptanceTests.swift",
              "TuyaProcessLifetimeBLEOwnershipFenceSourceTests.swift",
              "TuyaCrossControllerBLEOwnershipLeaseSourceTests.swift",
              "ES80CaptureFieldRuntimeRendezvousTests.swift",
              "TuyaCorrelatedTargetExportProvenanceSourceTests.swift",
              "ES80CaptureSimulatorPreflightSnapshotHandoffTests.swift",
              "TuyaTransportSuccessAuthoritySourceTests.swift",
              "TuyaExplicitCorrelatedTargetConfirmationSourceTests.swift",
              "ES80CaptureRiderLanguageAcceptanceTests.swift",
              "TuyaSingleOfficialDriverHandoffSourceTests.swift",
              "TuyaCaptureForegroundIntegritySourceTests.swift",
              "TuyaCorrelationAsyncInvalidationPresentationSourceTests.swift",
              "TuyaSessionTerminalRetirementSourceTests.swift",
              "CaptureStageRailAcceptedAccessibilitySourceTests.swift",
              "TuyaFieldInstallerIntendedDeviceAuthoritySourceTests.swift",
              "TuyaSecureLinkViewMembershipAdmissionSourceTests.swift",
              "TuyaPrivateFieldInputProvenanceSourceTests.swift",
              "PassiveBluetoothExperimentOneVerifiedAdmissionTests.swift",
              "TuyaAuthenticatedReadOnlySessionLedgerTests.swift",
              "TuyaStationaryRunbookCurrentAuthoritySourceTests.swift",
              "TuyaCorrelationProvenanceExportSourceTests.swift",
              "TuyaAuthenticatedTerminalHorizonTests.swift",
          ]
          expected_residual = {
              "TuyaFailedPrerequisiteRecoverySourceTests.swift": 2,
              "TuyaSecureLinkProductSurfaceSourceTests.swift": 2,
              "TuyaSecureLinkAccountRecoverySourceTests.swift": 1,
              "TuyaAuthenticationPromotionReentrancySourceTests.swift": 1,
              "TuyaSecureLinkProductRecoveryTruthSourceTests.swift": 1,
              "TuyaCaptureForegroundTargetRevocationSourceTests.swift": 1,
          }

          total = sum(files.values())
          print(f"TOTAL_PACKAGE_ISSUES {total}")
          for name, count in files.most_common():
              print(f"PACKAGE_ISSUES {count:3d} {name}")
          for name in targets:
              print(f"TARGET_ISSUES {files[name]:3d} {name}")

          dirty_targets = [name for name in targets if files[name] != 0]
          if dirty_targets:
              raise SystemExit("composed targets still report issues: " + ", ".join(dirty_targets))
          if total != 8:
              raise SystemExit(f"expected exact 51 -> 8 differential, observed {total} issues")
          actual_residual = {name: count for name, count in files.items() if count}
          if actual_residual != expected_residual:
              raise SystemExit(f"unexpected residual matrix: {actual_residual}")
          PY

      - name: Confirm package is still explicitly red
        env:
          PACKAGE_STATUS: ${{ steps.package.outputs.status }}
        run: test "$PACKAGE_STATUS" -ne 0

      - name: Upload exact package log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capture-package-green-wave-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/capture-package-green-wave.log
          retention-days: 7
          if-no-files-found: error
