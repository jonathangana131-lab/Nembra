name: One-shot Capture timeout repair

on:
  push:
    branches:
      - fix/capture-xcode-ui-multilaunch-timeout-139dca-gpt56

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capture-xcode-ui-multilaunch-timeout-139dca-gpt56
          fetch-depth: 3

      - name: Apply exact demonstrated timeout repair and erase helper
        env:
          EXPECTED_BASE: 139dcab17ad08f5152d35dfb0f6a0f265aab4e23
          HELPER_PATH: .github/workflows/_capture_timeout_patch_139dca.yml
        run: |
          set -euo pipefail
          actual_base="$(git rev-parse HEAD^^)"
          printf 'Expected frozen base: %s\nActual frozen base:   %s\n' "$EXPECTED_BASE" "$actual_base"
          test "$actual_base" = "$EXPECTED_BASE"
          test "$(git diff --name-only "$EXPECTED_BASE" HEAD | sort)" = "$HELPER_PATH"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/xcode27_simulator_capture.sh")
          source = path.read_text(encoding="utf-8")
          replacements = {
              "  -default-test-execution-time-allowance 120 \\\n": "  -default-test-execution-time-allowance 180 \\\n",
              "  -maximum-test-execution-time-allowance 120 \\\n": "  -maximum-test-execution-time-allowance 180 \\\n",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one timeout argument: {old.strip()!r}")
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY

          rm "$HELPER_PATH"
          bash -n scripts/ci/xcode27_simulator_capture.sh
          git diff --check
          test "$(git diff --name-only "$EXPECTED_BASE" | sort)" = "scripts/ci/xcode27_simulator_capture.sh"
          grep -F -- '-default-test-execution-time-allowance 180' scripts/ci/xcode27_simulator_capture.sh
          grep -F -- '-maximum-test-execution-time-allowance 180' scripts/ci/xcode27_simulator_capture.sh
          test "$(grep -cF -- '-default-test-execution-time-allowance 120' scripts/ci/xcode27_simulator_capture.sh)" -eq 0
          test "$(grep -cF -- '-maximum-test-execution-time-allowance 120' scripts/ci/xcode27_simulator_capture.sh)" -eq 0

          git config user.name "nembra-capture-ci"
          git config user.email "nembra-capture-ci@users.noreply.github.com"
          git add scripts/ci/xcode27_simulator_capture.sh "$HELPER_PATH"
          git commit -m "Raise Capture UI test allowance after reproduced timeout"
          git push origin HEAD:fix/capture-xcode-ui-multilaunch-timeout-139dca-gpt56
