name: Materialize Capture Private Record Coherence 3a905

on:
  push:
    branches:
      - sol/v14-capture-private-record-coherence-3a905

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact product ancestry and helper-only scope
        shell: bash
        run: |
          set -euo pipefail
          parent='3a90503b9f668c1bc696fa32ee8937e646dff12d'
          git merge-base --is-ancestor "$parent" HEAD
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/scripts/materialize-capture-private-record-coherence.py'
          test "${changed[1]}" = '.github/workflows/materialize-capture-private-record-coherence-3a905.yml'
          test "$(git rev-parse "$parent:Scripts/capture_tuya_private_input_provenance.py")" = '81f4f102f7424e9dadd32a921dbe107b8ad7397e'
          test ! -e scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py

      - name: Import exact RED contract
        shell: bash
        run: |
          set -euo pipefail
          red='8d47bcdfc92b0681388bacc155d64b01d01f7d24'
          path='scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py'
          git fetch --no-tags origin red/v14-capture-provenance-record-coherence-8f18
          test "$(git rev-parse FETCH_HEAD)" = "$red"
          git show "$red:$path" > "$path"

      - name: Apply whole-record generation fence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize-capture-private-record-coherence.py
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          git diff --check

      - name: Run focused provenance regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py

      - name: Collapse helpers and publish clean repair
        shell: bash
        run: |
          set -euo pipefail
          parent='3a90503b9f668c1bc696fa32ee8937e646dff12d'
          rm .github/workflows/materialize-capture-private-record-coherence-3a905.yml
          rm .github/scripts/materialize-capture-private-record-coherence.py
          git add Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          git add -u .github/workflows/materialize-capture-private-record-coherence-3a905.yml \
            .github/scripts/materialize-capture-private-record-coherence.py
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' \
            commit -m 'fix(capture): fence private provenance record generation'
          mapfile -t effective < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${effective[@]}"
          test "${#effective[@]}" = 2
          test "${effective[0]}" = 'Scripts/capture_tuya_private_input_provenance.py'
          test "${effective[1]}" = 'scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py'
          git diff --check "$parent" HEAD
          git push origin HEAD:sol/v14-capture-private-record-coherence-3a905
