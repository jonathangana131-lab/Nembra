name: Compose V14 final Capture field security

on:
  push:
    branches: [integration/v14-capture-final-field-security-sol]
    paths:
      - '.github/workflows/compose-v14-final-field-security.yml'

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact final convergence input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ff153e5a68f05955e13f326f6476813ce636ea4b" || true
          test ! -e Scripts/validate_capture_tuya_field_prereqs.sh
          test ! -e Scripts/test_capture_tuya_credential_minimization.sh

      - name: Transplant field-only security net diff
        run: |
          set -euo pipefail
          git fetch origin capture/one-time-ble-dump-gpt56
          git diff 59d20d21d1f9ef9c216ff4ffc0158931b0f0b117..1f0e266d33b634b9fe27cf3ae2a9a0e0a4420733 -- \
            .github/workflows/capture-tuya-field-prereqs.yml \
            NembraApp/Features/Research/TuyaAccountBridge.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlyPreflight.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyPreflightTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlySessionLedgerTests.swift \
            Scripts/bootstrap_capture_tuya_sdk.sh \
            Scripts/test_capture_tuya_credential_minimization.sh \
            Scripts/test_capture_tuya_field_prereqs.sh \
            Scripts/validate_capture_tuya_field_prereqs.sh \
            > /tmp/field-security.patch
          git apply --3way /tmp/field-security.patch
          git diff --check

      - name: Assert field-build security invariants
        run: |
          set -euo pipefail
          grep -Fq 'case smartLifeAppSDK = "tuya-smartlife-sdk"' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlyPreflight.swift
          ! grep -Fq 'case documentedDeviceSharing' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlyPreflight.swift
          grep -Fq 'authenticationMethod == .smartLifeAppSDK' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlyPreflight.swift
          ! grep -Eq 'let[[:space:]]+localKey[[:space:]]*:' NembraApp/Features/Research/TuyaAccountBridge.swift
          ! grep -Fq 'localKey: string(raw["local_key"])' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq '"localKeyRetained": false' NembraApp/Features/Research/TuyaAccountBridge.swift
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          bash -n Scripts/validate_capture_tuya_field_prereqs.sh
          bash -n Scripts/test_capture_tuya_field_prereqs.sh
          bash -n Scripts/test_capture_tuya_credential_minimization.sh
          bash Scripts/test_capture_tuya_field_prereqs.sh
          bash Scripts/test_capture_tuya_credential_minimization.sh

      - name: Commit composed field security and retire workflow
        run: |
          set -euo pipefail
          rm .github/workflows/compose-v14-final-field-security.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "harden(capture): converge field credentials and SDK provenance"
          git push origin HEAD:integration/v14-capture-final-field-security-sol
