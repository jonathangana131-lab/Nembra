name: Materialize Capture Field Python Isolation

on:
  push:
    branches:
      - sol/v14-capture-field-python-isolation-a7a-r1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          expected='a7a28ca6e744d4bad8be08fd3553a2af8c609b15'
          test "$(git rev-parse HEAD^)" = "$expected"
          test "$(git diff --name-only "$expected"..HEAD)" = '.github/workflows/materialize-capture-field-python-isolation.yml'

      - name: Isolate authority-bearing Python interpreters
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('Scripts/bootstrap_capture_tuya_sdk.sh'),
              Path('scripts/field/install_one_time_capture.command'),
          ]
          changed = {}
          for path in targets:
              source = path.read_text()
              updated = re.sub(r'/usr/bin/python3 (?!-I\b)', '/usr/bin/python3 -I ', source)
              if updated == source:
                  raise SystemExit(f'expected at least one non-isolated system-Python call in {path}')
              changed[str(path)] = source.count('/usr/bin/python3 ') - source.count('/usr/bin/python3 -I ')
              path.write_text(updated)

          bootstrap = Path('Scripts/bootstrap_capture_tuya_sdk.sh').read_text()
          installer = Path('scripts/field/install_one_time_capture.command').read_text()
          if '/usr/bin/python3 -I "$PROVENANCE_HELPER" snapshot' not in bootstrap:
              raise SystemExit('bootstrap private-input snapshot is not isolated')
          if '/usr/bin/python3 -I "$TUYA_PROVENANCE_HELPER" verify' not in installer:
              raise SystemExit('installer private-input verification is not isolated')
          for script_name, source in [('bootstrap', bootstrap), ('installer', installer)]:
              for line_number, line in enumerate(source.splitlines(), 1):
                  stripped = line.strip()
                  if '/usr/bin/python3' not in stripped:
                      continue
                  if stripped.startswith('[[ -x /usr/bin/python3 ]]'):
                      continue
                  if '/usr/bin/python3 -I' not in stripped:
                      raise SystemExit(f'{script_name}:{line_number}: non-isolated system Python authority: {stripped}')

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldPythonIsolationSourceTests.swift')
          if test_path.exists():
              raise SystemExit('field Python isolation regression path unexpectedly exists')
          test_path.write_text(r'''import Foundation
import Testing
@testable import NembraBluetoothCapture

@Suite("Capture field Python interpreter isolation")
struct TuyaFieldPythonIsolationSourceTests {
    @Test("private Tuya input snapshot and verification ignore caller Python environment")
    func privateInputProvenanceUsesIsolatedSystemPython() throws {
        let bootstrap = try readRepositoryFile("Scripts/bootstrap_capture_tuya_sdk.sh")
        let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")

        #expect(bootstrap.contains("/usr/bin/python3 -I \"$PROVENANCE_HELPER\" snapshot"))
        #expect(installer.contains("/usr/bin/python3 -I \"$TUYA_PROVENANCE_HELPER\" verify"))
        #expect(!bootstrap.contains("/usr/bin/python3 \"$PROVENANCE_HELPER\" snapshot"))
        #expect(!installer.contains("/usr/bin/python3 \"$TUYA_PROVENANCE_HELPER\" verify"))
    }

    @Test("every installer system-Python execution is isolated")
    func intendedDeviceAndDiagnosticParsersCannotImportFromCallerPythonPath() throws {
        let installer = try readRepositoryFile("scripts/field/install_one_time_capture.command")
        let executablePythonLines = installer.split(separator: "\n").filter { rawLine in
            let line = rawLine.trimmingCharacters(in: .whitespaces)
            return line.contains("/usr/bin/python3") && !line.hasPrefix("[[ -x /usr/bin/python3 ]]")
        }

        #expect(!executablePythonLines.isEmpty)
        for line in executablePythonLines {
            #expect(line.contains("/usr/bin/python3 -I"))
        }
        #expect(!installer.contains("/usr/bin/python3 -c"))
        #expect(installer.contains("DEVICE_ROWS=\"$(xcrun xctrace list devices 2>/dev/null | /usr/bin/python3 -I -c"))
        #expect(installer.contains("COREDEVICE_MATCH=\"$(printf '%s\\0%s' \"$DEVICE_UDID\" \"$COREDEVICE_ROWS\" | /usr/bin/python3 -I -c"))
    }

    private func readRepositoryFile(_ relativePath: String) throws -> String {
        let repositoryRoot = URL(fileURLWithPath: #filePath)
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
        return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
    }
}
''')
          PY

      - name: Source-contract smoke checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          bash -n scripts/field/install_one_time_capture.command
          python3 - <<'PY'
          from pathlib import Path
          for path in [Path('Scripts/bootstrap_capture_tuya_sdk.sh'), Path('scripts/field/install_one_time_capture.command')]:
              for n, line in enumerate(path.read_text().splitlines(), 1):
                  stripped=line.strip()
                  if '/usr/bin/python3' in stripped and not stripped.startswith('[[ -x /usr/bin/python3 ]]'):
                      assert '/usr/bin/python3 -I' in stripped, (path, n, stripped)
          PY
          git diff --check
          git status --short

      - name: Commit durable product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-field-python-isolation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/bootstrap_capture_tuya_sdk.sh \
            scripts/field/install_one_time_capture.command \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldPythonIsolationSourceTests.swift \
            .github/workflows/materialize-capture-field-python-isolation.yml
          git commit -m 'fix(capture): isolate field Python authority'
          git push origin HEAD:sol/v14-capture-field-python-isolation-a7a-r1
