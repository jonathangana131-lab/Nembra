name: TEMP Capture Private Identity Payload Publication Repair

on:
  push:
    branches:
      - repair/v14-private-identity-payload-publication-sol-20260811

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-private-identity-payload-publication-sol-20260811
          fetch-depth: 0
      - name: Bind exact repair input
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize payload and publication authority repair
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/nembra_identity_patch.py
          python3 /tmp/nembra_identity_patch.py
      - name: Validate payload and publication closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          python3 Scripts/provision_capture_tuya_identity_writer.py --self-test
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_publication_races.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py
          python3 -I scripts/ci/tests/test_capture_private_identity_publication_races.py
          python3 -I scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py
          bash -n Scripts/provision_capture_tuya_identity.sh
          git diff --check
      - name: Expose clean repair candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-v14-private-identity-payload-publication.yml
          rm -f /tmp/nembra_identity_patch.py
          find Scripts scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'ERROR: no publication repair delta' >&2; exit 1; }
          git commit -m 'Capture: bind private identity payload across publication'
          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          echo "::notice title=Private identity publication candidate::$candidate tree=$tree"
          git push origin HEAD:repair/v14-private-identity-payload-publication-sol-20260811
