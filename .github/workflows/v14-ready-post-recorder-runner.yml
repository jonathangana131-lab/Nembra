name: V14 Ready post recorder runner

on:
  push:
    branches:
      - integration/es80-v14-terminal-controller-fresh-handoff/gpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply product patch
        run: |
          set -euo pipefail
          python3 scripts/ci/v14_ready_post_recorder_foreground_patch.py
          git diff --check
      - name: Commit product and remove staging files
        run: |
          set -euo pipefail
          rm .github/workflows/v14-ready-post-recorder-foreground-integrity.yml
          rm .github/workflows/v14-ready-post-recorder-runner.yml
          rm scripts/ci/v14_ready_post_recorder_foreground_patch.py
          git add -A
          git diff --cached --check
          git config user.name nembra-v14-gpt56
          git config user.email actions@users.noreply.github.com
          git commit -m 'Capture: recheck foreground after Ready recorder return'
          git push origin HEAD:integration/es80-v14-terminal-controller-fresh-handoff/gpt56-go
