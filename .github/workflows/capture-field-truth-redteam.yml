name: Capture Field Truth Red Team

on:
  push:
    branches:
      - capture/v14-field-truth-redteam-gpt56sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-redteam:
    name: Field truth red team
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run field truth source acceptance
        run: |
          swift test \
            --package-path Packages/NembraBluetoothCapture \
            --filter TuyaFieldAppTruthRedTeamSourceTests
