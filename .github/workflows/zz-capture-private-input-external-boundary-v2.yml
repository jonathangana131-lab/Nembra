name: Capture private input external boundary v2

on:
  push:
    branches:
      - agent/capture-private-input-external-boundary-v14

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard failed transformer checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cf54390d3c24218d104d964f25fe346e8953dff9"

      - name: Reuse reviewed transform with exact duplicate-site repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/zz-capture-private-input-external-boundary.yml")
          text = workflow.read_text(encoding="utf-8")
          opener = "          python3 - <<'PY'\n"
          start = text.index(opener) + len(opener)
          end = text.index("\n          PY", start)
          transform = textwrap.dedent(text[start:end])

          old_guard = '''    if count != 1:\n        raise SystemExit(f"{path}: expected one replacement site, found {count}")\n    path.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          new_guard = '''    if count != 1:\n        intentional_duplicate = (\n            path.name == "test_xcode27_signed_field_candidate_intended_device.py"\n            and old == "                    runner.read_private_identifier(private_file)\\n"\n            and count == 2\n        )\n        if not intentional_duplicate:\n            raise SystemExit(f"{path}: expected one replacement site, found {count}")\n    path.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          if transform.count(old_guard) != 1:
              raise SystemExit("could not patch the failed exact-replacement harness")
          transform = transform.replace(old_guard, new_guard, 1)
          exec(compile(transform, "<external-private-input-transform-v2>", "exec"), {})

          # Match the established offline-signer boundary: reject the requested final symlink, resolve
          # one external canonical path, verify it is outside the repository, then open that resolved
          # subject rather than reopening the caller spelling after the privacy check.
          runner = Path("scripts/ci/es80_signed_field_artifact_private_runner.py")
          source = runner.read_text(encoding="utf-8")
          old_helper = '''def require_external_private_input(path: Path, repository_root: Path) -> None:\n    """Reject private verification material whose resolved path lives inside the repository."""\n    if not path.is_absolute():\n        raise PrivateInputError("intended-device verification file path must be absolute")\n    try:\n        resolved_path = path.resolve(strict=True)\n        resolved_repository = repository_root.resolve(strict=True)\n    except OSError as exc:\n        raise PrivateInputError("could not resolve intended-device verification privacy boundary") from exc\n    try:\n        resolved_path.relative_to(resolved_repository)\n    except ValueError:\n        return\n    raise PrivateInputError("intended-device verification file must live outside the Nembra repository")\n\n\ndef read_private_identifier(path: Path, repository_root: Path) -> str:\n    """Read one external opaque identifier through one no-follow descriptor without repairing bytes."""\n    require_external_private_input(path, repository_root)\n'''
          new_helper = '''def require_external_private_input(path: Path, repository_root: Path) -> Path:\n    """Return one resolved private-input path only when it remains outside the repository."""\n    if not path.is_absolute():\n        raise PrivateInputError("intended-device verification file path must be absolute")\n    if path.is_symlink():\n        raise PrivateInputError("intended-device verification file must be a non-symlink path")\n    try:\n        resolved_path = path.resolve(strict=True)\n        resolved_repository = repository_root.resolve(strict=True)\n    except OSError as exc:\n        raise PrivateInputError("could not resolve intended-device verification privacy boundary") from exc\n    path_text = os.path.normcase(str(resolved_path))\n    repository_text = os.path.normcase(str(resolved_repository))\n    try:\n        inside_repository = os.path.commonpath([path_text, repository_text]) == repository_text\n    except ValueError:\n        inside_repository = False\n    if inside_repository:\n        raise PrivateInputError("intended-device verification file must live outside the Nembra repository")\n    return resolved_path\n\n\ndef read_private_identifier(path: Path, repository_root: Path) -> str:\n    """Read one external opaque identifier through one no-follow descriptor without repairing bytes."""\n    path = require_external_private_input(path, repository_root)\n'''
          if source.count(old_helper) != 1:
              raise SystemExit("generated private-input helper did not match reviewed transform output")
          runner.write_text(source.replace(old_helper, new_helper, 1), encoding="utf-8")
          PY

      - name: Validate privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_private_runner.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
          git diff --check

      - name: Commit product hardening and remove both transformer files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-capture-private-input-external-boundary.yml
          rm .github/workflows/zz-capture-private-input-external-boundary-v2.yml
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/es80_signed_field_artifact_private_runner.py \
                  scripts/ci/xcode27_signed_field_candidate.sh \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_source.py \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py \
                  .github/workflows/zz-capture-private-input-external-boundary.yml \
                  .github/workflows/zz-capture-private-input-external-boundary-v2.yml
          git diff --cached --check
          git commit -m "fix(capture): require external private device input"
          git push origin HEAD:agent/capture-private-input-external-boundary-v14
