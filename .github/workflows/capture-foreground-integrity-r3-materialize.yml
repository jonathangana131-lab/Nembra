name: Capture Foreground Integrity R3 Materializer

on:
  push:
    branches:
      - repair/v14-capture-foreground-integrity-r3-6b77-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/v14-capture-foreground-integrity-r3-6b77-sol

      - name: Verify exact product ancestry and untouched app source
        run: |
          set -euo pipefail
          product=6b778f2104af34dbe5b80da31ddb3ca422f9667c
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --exit-code "$product" -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Materialize foreground-integrity repair
        run: python3 scripts/materialize_capture_foreground_integrity_r3.py

      - name: Validate truth and lifecycle invariants
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          c = s[s.index('private final class SecureLinkController'):s.index('@MainActor\nprivate protocol OfficialTuyaDriver')]
          v = s[s.index('private struct SecureLinkView: View'):s.index('private var hero: some View')]
          loss = c[c.index('func appDidLoseForeground()'):c.index('func appDidRegainForeground()')]
          regain = c[c.index('func appDidRegainForeground()'):c.index('var privateConfig: Bool')]
          exit_ = c[c.index('func abandonCorrelationForViewExit()'):c.index('func appDidLoseForeground()')]
          assert '@Environment(\\.scenePhase) private var scenePhase' in v
          assert 'test.appDidLoseForeground()' in v and 'test.appDidRegainForeground()' in v
          for token in ('acceptsViewScopedMembershipRequests = false','sdkDeviceMembershipVerified = false','membershipAccountUID = nil','membershipDeviceID = nil','membershipRequestID = UUID()','officialConnectionRequestID = UUID()'):
              assert token in loss, token
          assert 'private var lifecycleRetirementToken: TuyaReadOnlyConnectionToken?' in c
          assert 'lifecycleRetirementToken == token' in loss and 'lifecycleRetirementToken == token' in exit_
          assert 'Task { @MainActor [self] in' in loss and '[weak self]' not in loss
          token_section = loss[loss.index('guard let token = currentConnectionToken'):]
          assert 'Restart from OFF1' not in token_section
          assert 'Relaunch before another authenticated stationary read-only attempt' in token_section
          assert 'recordObservedTransportLoss' not in loss and 'endConnection' not in loss
          assert 'OfficialTuyaFactory.packageCorrelationMayStart' in regain
          PY

      - name: Publish clean two-path repair
        run: |
          set -euo pipefail
          product=6b778f2104af34dbe5b80da31ddb3ca422f9667c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git rm scripts/materialize_capture_foreground_integrity_r3.py .github/workflows/capture-foreground-integrity-r3-materialize.yml
          git commit -m 'Capture: fail closed on foreground integrity loss'
          expected=$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' | sort)
          actual=$(git diff --name-only "$product" HEAD | sort)
          test "$actual" = "$expected"
          git diff --check "$product" HEAD
          git push origin HEAD:repair/v14-capture-foreground-integrity-r3-6b77-sol
