name: Capture Held Symlink Policy Publish V3

on:
  push:
    branches:
      - repair/v17-capture-held-symlink-policy-sol-20260815
    paths:
      - .github/workflows/capture-held-symlink-policy-publish-v3.yml

permissions:
  contents: write

env:
  EXACT_PARENT: 474507966619ce39288b20de29066711088cd986

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind authoring lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          for path in \
            .github/workflows/capture-held-symlink-policy-materialize-once.yml \
            .github/workflows/capture-held-symlink-policy-publish-once.yml \
            .github/workflows/capture-held-symlink-policy-publish-v3.yml; do
            test -f "$path"
          done
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize known repair transform
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/capture-held-symlink-policy-materialize-once.yml').read_text(encoding='utf-8')
          step = source.index("      - name: Materialize descriptor-bound symlink policy\n")
          anchor = "          /usr/bin/python3 -B - <<'PY'\n"
          start = source.index(anchor, step) + len(anchor)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end]) + "\n"
          compile(script, '<held-symlink-materializer>', 'exec', dont_inherit=True)
          Path('/tmp/held-symlink-materializer.py').write_text(script, encoding='utf-8')
          PY
          /usr/bin/python3 -B /tmp/held-symlink-materializer.py
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              'scripts/ci/capture_selected_xcode_build_orchestrator.py',
              'scripts/ci/tests/test_capture_private_read_lease_held_symlink_policy.py',
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
          PY

      - name: Commit product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/capture-held-symlink-policy-materialize-once.yml \
            .github/workflows/capture-held-symlink-policy-publish-once.yml \
            .github/workflows/capture-held-symlink-policy-publish-v3.yml
          test -f scripts/ci/tests/test_capture_private_read_lease_held_symlink_policy.py
          git diff --check "$EXACT_PARENT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind private symlink policy to held descriptor generation"
          git push origin HEAD:repair/v17-capture-held-symlink-policy-sol-20260815
