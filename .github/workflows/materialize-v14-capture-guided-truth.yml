name: Materialize Capture guided truth repair

on:
  push:
    branches:
      - product/v14-capture-guided-truth-current-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed guided product and truth repairs
        run: python3 scripts/ci/apply_v14_capture_guided_truth_repair.py
      - name: Verify product-only result and publish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm scripts/ci/apply_v14_capture_guided_truth_repair.py
          rm .github/workflows/materialize-v14-capture-guided-truth.yml
          git add -A
          git diff --cached --quiet && { echo 'No product delta'; exit 1; }
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): close guided recovery truth and root UX'
          git push origin HEAD:product/v14-capture-guided-truth-current-sol
