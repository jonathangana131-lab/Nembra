name: V14 Capture Apple Entitlement Parser Env EEE
on:
  push:
    branches:
      - fix/v14-capture-apple-entitlement-parser-env-eee-sol
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-apple-entitlement-parser-env-eee-sol
          fetch-depth: 0
      - name: Guard exact product ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor eee5a96fae1d30796ba5707f0a7f30f4f4d62530 HEAD
          grep -Fq "| /usr/bin/python3 -I -c '" scripts/field/install_one_time_capture.command
          grep -Fq 'both Apple plist parsers' .github/scripts/v14_capture_apple_entitlement_parser_env.py
      - name: Apply repair
        run: python3 .github/scripts/v14_capture_apple_entitlement_parser_env.py
      - name: Verify source custody
        run: |
          set -euo pipefail
          installer=scripts/field/install_one_time_capture.command
          test=scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          custody="$(sed -n '/SIGNED_ENTITLEMENTS_OUTPUT=/,/Installing SDK-integrated Capture on the intended iPhone/p' "$installer")"
          [[ "$(printf '%s' "$custody" | grep -Fc "/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -c '")" == 2 ]]
          [[ "$(printf '%s' "$custody" | grep -Fc '/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/codesign')" == 1 ]]
          [[ "$(printf '%s' "$custody" | grep -Fc '/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/security')" == 1 ]]
          bash -n "$installer"
          python3 "$test"
          git diff --check
      - name: Commit clean two-path repair
        run: |
          set -euo pipefail
          rm .github/scripts/v14_capture_apple_entitlement_parser_env.py
          rm .github/workflows/v14-capture-apple-entitlement-parser-env-eee.yml
          git add -A
          git diff --cached --check
          git config user.name nembra-v14-bot
          git config user.email nembra-v14-bot@users.noreply.github.com
          git commit -m 'harden(capture): close Apple entitlement parser startup custody'
          git push origin HEAD:fix/v14-capture-apple-entitlement-parser-env-eee-sol
