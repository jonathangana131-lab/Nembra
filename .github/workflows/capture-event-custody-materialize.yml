name: Materialize Capture Event Custody

on:
  push:
    branches:
      - agent/capture-event-custody-8069

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-event-custody-8069
          fetch-depth: 0
      - name: Guard temporary-only branch scope
        run: |
          set -euo pipefail
          base=8069c0ffec496cacbe263016d8a7f4ca15ddc64e
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base" HEAD | sort)" = "$(printf '%s\n' '.github/workflows/capture-event-custody-materialize.yml' 'scripts/ci/materialize_capture_event_custody.py' | sort)"
      - name: Materialize event custody
        run: python3 scripts/ci/materialize_capture_event_custody.py
      - name: Verify clean product scope
        run: |
          set -euo pipefail
          base=8069c0ffec496cacbe263016d8a7f4ca15ddc64e
          git diff --check
          test "$(git diff --name-only "$base" | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' | sort)"
          grep -Fq 'let acceptedAccountUID = membershipAccountUID?.trimmingCharacters' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'let eventUpdate = Self.redactingAccountUID(in: update, accountUID: acceptedAccountUID)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq ']) { _, trusted in trusted })' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq '<redacted-account-uid>' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'log("tuya_application_update", update.merging([' NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Commit clean product delta
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): seal application event custody'
          git push origin HEAD:agent/capture-event-custody-8069
