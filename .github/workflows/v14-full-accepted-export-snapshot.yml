name: V14 full accepted export snapshot repair

on:
  push:
    branches:
      - repair/v14-capture-full-accepted-export-snapshot-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - name: Verify exact flagship parent
        run: test "$(git rev-parse HEAD^^)" = "d3473997a4b56b1339efeeb03250a15d1ee75a13"
      - name: Patch and validate full-envelope custody contract
        run: |
          python3 scripts/ci/v14_full_accepted_export_snapshot_patch.py
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift
      - name: Commit clean product delta and retire materializer
        env:
          BRANCH: repair/v14-capture-full-accepted-export-snapshot-sol
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')" = "$EVENT_SHA"
          rm scripts/ci/v14_full_accepted_export_snapshot_patch.py
          rm .github/workflows/v14-full-accepted-export-snapshot.yml
          git config user.name "nembra-v14-integration"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift scripts/ci/v14_full_accepted_export_snapshot_patch.py .github/workflows/v14-full-accepted-export-snapshot.yml
          git commit -m "fix(capture): freeze complete accepted export provenance"
          git push origin "HEAD:$BRANCH"
