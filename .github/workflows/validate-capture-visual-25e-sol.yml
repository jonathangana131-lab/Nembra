name: Validate Capture Visual Prep 25E

on:
  push:
    branches:
      - qa/v14-capture-visual-25e-sol

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/v14-capture-visual-25e-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact visual prep contract
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 25e789ea04c523b6d7e2507013b6c415006642d4 HEAD
          expected="$(printf '%s\n' \
            '.github/workflows/capture-standalone-visual-evidence.yml' \
            '.github/workflows/validate-capture-visual-25e-sol.yml' \
            'scripts/ci/capture_standalone_visual_evidence.sh' \
            'scripts/ci/tests/test_capture_standalone_visual_evidence.py' | sort)"
          test "$(git diff --name-only 25e789ea04c523b6d7e2507013b6c415006642d4 HEAD | sort)" = "$expected"
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py
          grep -Fq 'static let requiredFieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"' NembraApp/App/NembraCaptureBuildIdentity.swift
          grep -Fq 'procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'runs-on: xcode-27' .github/workflows/capture-standalone-visual-evidence.yml
          grep -Fq 'baselineDevice' scripts/ci/capture_standalone_visual_evidence.sh
          git diff --check 25e789ea04c523b6d7e2507013b6c415006642d4 HEAD

      - name: Remove validation helper after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-visual-prep'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/validate-capture-visual-25e-sol.yml
          git commit -m 'qa(capture): finalize exact-current visual evidence prep'
          git push origin HEAD:qa/v14-capture-visual-25e-sol
