name: TEMP V14 Private Identity Byte Custody 2858 (Sol)

on:
  push:
    branches:
      - repair/v14-private-identity-publication-byte-custody-2858-sol
    paths:
      - .github/workflows/tmp-v14-private-identity-byte-custody-2858-sol.yml
      - scripts/ci/tmp_v14_private_identity_byte_custody_materializer.py

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-private-identity-publication-byte-custody-2858-sol
          fetch-depth: 0

      - name: Apply guarded production repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_v14_private_identity_byte_custody_materializer.py
          python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py scripts/ci/tests/test_capture_private_identity_publication_races.py
          python3 Scripts/provision_capture_tuya_identity_writer.py --self-test
          python3 -I scripts/ci/tests/test_capture_private_identity_publication_races.py
          bash -n Scripts/provision_capture_tuya_identity.sh
          git diff --check
          digest="$(sha256sum Scripts/provision_capture_tuya_identity_writer.py | awk '{print $1}')"
          grep -Fq "WRITER_SHA256=\"$digest\"" Scripts/provision_capture_tuya_identity.sh
          grep -Fq "$digest" Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift

      - name: Focused package custody acceptance
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaPrivateIdentityProvisionerCustodyTests

      - name: Publish clean successor and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/tmp-v14-private-identity-byte-custody-2858-sol.yml \
            scripts/ci/tmp_v14_private_identity_byte_custody_materializer.py
          git add \
            Scripts/provision_capture_tuya_identity_writer.py \
            Scripts/provision_capture_tuya_identity.sh \
            scripts/ci/tests/test_capture_private_identity_publication_races.py \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift
          git commit -m 'Capture: bind private identity publication payload bytes'
          for attempt in 1 2 3 4; do
            git pull --rebase origin repair/v14-private-identity-publication-byte-custody-2858-sol
            if git push origin HEAD:repair/v14-private-identity-publication-byte-custody-2858-sol; then
              exit 0
            fi
            sleep 1
          done
          exit 1
