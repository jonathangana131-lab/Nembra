name: Diagnose Capture Authority Materializer (Sol)

on:
  push:
    branches:
      - diag/v14-authority-materializer-c596-sol

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/v14-authority-materializer-c596-sol
          fetch-depth: 0
      - name: Execute exact reviewed materializer with duplicate-only compatibility
        shell: bash
        run: |
          set -euo pipefail
          if python3 - <<'PY'
          from pathlib import Path
          import traceback

          workflow = Path('.github/workflows/capture-authority-chain-materialize.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          try:
              if workflow.count(start) != 1:
                  raise RuntimeError(f'materializer payload start count={workflow.count(start)}')
              payload = workflow.split(start, 1)[1].split(end, 1)[0]
              prefix = '          '
              normalized = '\n'.join(
                  line[len(prefix):] if line.startswith(prefix) else line
                  for line in payload.splitlines()
              )
              strict = '    if count != 1:\n        raise SystemExit(f"{label}: expected one match, found {count}")\n    return text.replace(old, new, 1)'
              compatible = '    if label == "bootstrap review helper output" and count == 2:\n        return text.replace(old, new, 1)\n    if count != 1:\n        raise SystemExit(f"{label}: expected one match, found {count}")\n    return text.replace(old, new, 1)'
              if normalized.count(strict) != 1:
                  raise RuntimeError(f'replace_once definition count={normalized.count(strict)}')
              normalized = normalized.replace(strict, compatible, 1)
              exec(compile(normalized, '<capture-authority-materializer>', 'exec'), {})
          except BaseException:
              Path('/tmp/diag-authority-materializer-error.txt').write_text(traceback.format_exc(), encoding='utf-8')
              raise
          PY
          then
            bash -n Scripts/bootstrap_capture_tuya_sdk.sh
            python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
            git diff --check
            echo '::notice title=Capture authority materializer::MATERIALIZER_OK'
          else
            python3 - <<'PY'
          from pathlib import Path
          message = Path('/tmp/diag-authority-materializer-error.txt').read_text(encoding='utf-8')
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Capture authority materializer::{message}')
          PY
            exit 1
          fi
