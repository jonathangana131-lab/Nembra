name: Reanchor Capture failed recovery current sol

on:
  push:
    branches:
      - repair/v14-capture-failed-prerequisite-recovery-sol

permissions:
  contents: write

jobs:
  reanchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-failed-prerequisite-recovery-sol
          fetch-depth: 0
      - name: Merge exact current product ancestry
        shell: bash
        run: |
          set -euo pipefail
          product='522716b8112fda6456beba24a62a6a563e66629a'
          workflow='.github/workflows/reanchor-capture-failed-recovery-current-sol.yml'
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git fetch origin 'refs/heads/product/v14-capture-guided-truth-current-sol:refs/remotes/origin/product/v14-capture-guided-truth-current-sol'
          test "$(git rev-parse refs/remotes/origin/product/v14-capture-guided-truth-current-sol)" = "$product"
          set +e
          git merge --no-commit --no-ff "$product"
          status=$?
          set -e
          test "$status" -eq 0
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm "$workflow"
          git diff --check
          git commit -m 'merge(capture): reanchor failed recovery on current product'
          git push origin HEAD:repair/v14-capture-failed-prerequisite-recovery-sol
