name: Materialize Capture Truth Convergence 1C408

on:
  push:
    branches:
      - sol/v14-capture-truth-convergence-1c408

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          BASE=1c40853f6991b4d09206df1d25ecff021458b7eb
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t paths < <(git diff --name-only "$BASE"...HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = ".github/workflows/materialize-capture-truth-convergence-1c408.yml"

      - name: Apply current truth repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          app = app_path.read_text()

          # 1) Keep one canonical export-secret classifier entry per promised class.
          duplicated = '''    private static let secretKeyFragments = [
                  "localkey",
                  "sessionkey",
                  "appkey",
                  "appsecret",
                  "password",
                  "accounttoken",
                  "accesstoken",
                  "refreshtoken",
                  "sessionkey",
                  "authkey",
                  "seckey",
              ]'''
          canonical = '''    private static let secretKeyFragments = [
                  "localkey",
                  "sessionkey",
                  "appkey",
                  "appsecret",
                  "password",
                  "accounttoken",
                  "accesstoken",
                  "refreshtoken",
                  "authkey",
                  "seckey",
              ]'''
          if app.count(duplicated) != 1:
              raise SystemExit(f"expected one duplicated SmartLife classifier, found {app.count(duplicated)}")
          app = app.replace(duplicated, canonical, 1)

          def replace_in_section(text: str, start: str, end: str, old: str, new: str) -> str:
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"missing section start: {start}")
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f"missing section end: {end}")
              section = text[a:b]
              if section.count(old) != 1:
                  raise SystemExit(f"expected one target in {start}, found {section.count(old)}")
              return text[:a] + section.replace(old, new, 1) + text[b:]

          authority_clear = '''        sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipRequestID = UUID()'''
          app = replace_in_section(
              app,
              "    func abandonCorrelationForViewExit() {",
              "    func appDidLoseForeground() {",
              authority_clear,
              '''        sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipStatus = "Secure Link view authority ended. Exact scooter membership must be verified again for the next active Secure Link lifetime."
                  membershipRequestID = UUID()'''
          )
          app = replace_in_section(
              app,
              "    func appDidLoseForeground() {",
              "    var privateConfig: Bool",
              authority_clear,
              '''        sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipStatus = "Capture left the foreground. Exact scooter membership must be verified again after Secure Link becomes active."
                  membershipRequestID = UUID()'''
          )

          app = replace_in_section(
              app,
              "    private func receivedApplicationUpdate(",
              "    private func startWatchdog",
              ''']) { current, _ in current })''',
              ''']) { _, trusted in trusted })'''
          )
          app_path.write_text(app)

          bridge_path = Path("NembraApp/Features/Research/TuyaAccountBridge.swift")
          bridge = bridge_path.read_text()
          old_bridge = '            let secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "sessionkey", "seckey", "authkey"]'
          new_bridge = '            let secretKeyFragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "seckey", "authkey"]'
          if bridge.count(old_bridge) != 1:
              raise SystemExit(f"expected one TuyaAccountBridge classifier, found {bridge.count(old_bridge)}")
          bridge_path.write_text(bridge.replace(old_bridge, new_bridge, 1))

          tests = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests")

          (tests / "TuyaExportSecretClassifierConvergenceSourceTests.swift").write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture export secret classifier convergence")
          struct TuyaExportSecretClassifierConvergenceSourceTests {
              private let promisedSecretFragments = [
                  "localkey", "sessionkey", "appkey", "appsecret", "password",
                  "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey",
              ]

              @Test("application and metadata classifiers cover one coherent export-secret set")
              func classifiersStayConverged() throws {
                  let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driverList = String(try section(in: app, from: "private static let secretKeyFragments = [", to: "private static func redactApplicationSecrets(_ object: Any) -> Any"))
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let bridgeRedactor = String(try section(in: bridge, from: "private static func redactSecrets(_ object: Any) -> Any", to: "private static func remoteMessage(_ object: [String: Any]) -> String"))
                  for fragment in promisedSecretFragments {
                      #expect(driverList.components(separatedBy: "\"\(fragment)\"").count - 1 == 1)
                      #expect(bridgeRedactor.components(separatedBy: "\"\(fragment)\"").count - 1 == 1)
                  }
                  #expect(bridgeRedactor.contains("key.lowercased().filter"))
                  #expect(bridgeRedactor.contains("redactSecrets(value)"))
                  #expect(bridgeRedactor.contains("array.map(redactSecrets)"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start), let b = source.range(of: end, range: a.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.missing
                  }
                  return source[a.lowerBound..<b.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let root = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent()
                      .deletingLastPathComponent().deletingLastPathComponent()
                  return try String(contentsOf: root.appendingPathComponent(relativePath), encoding: .utf8)
              }
              private enum SourceContractError: Error { case missing }
          }
          ''')

          (tests / "TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift").write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Secure Link view membership-status revocation")
          struct TuyaSecureLinkViewMembershipStatusRevocationSourceTests {
              @Test("revoked membership proof cannot retain verified-and-leased copy")
              func viewExitResetsMembershipStatusBeforeRequestRotation() throws {
                  let source = try entrypointSource()
                  let cleanup = String(try section(in: source, from: "func abandonCorrelationForViewExit()", to: "func appDidLoseForeground()"))
                  let clear = try offset("sdkDeviceMembershipVerified = false", in: cleanup)
                  let status = try offset("membershipStatus =", in: cleanup)
                  let rotate = try offset("membershipRequestID = UUID()", in: cleanup)
                  #expect(clear < status)
                  #expect(status < rotate)
                  #expect(cleanup.lowercased().contains("verif"))
                  #expect(!cleanup.contains("membershipStatus = \"Exact scooter membership verified and leased to this current SDK account.\""))
              }

              @Test("foreground loss revokes the same operator-facing membership claim")
              func foregroundLossResetsMembershipStatusBeforeRequestRotation() throws {
                  let source = try entrypointSource()
                  let cleanup = String(try section(in: source, from: "func appDidLoseForeground()", to: "var privateConfig: Bool"))
                  let clear = try offset("sdkDeviceMembershipVerified = false", in: cleanup)
                  let status = try offset("membershipStatus =", in: cleanup)
                  let rotate = try offset("membershipRequestID = UUID()", in: cleanup)
                  #expect(clear < status)
                  #expect(status < rotate)
                  #expect(cleanup.lowercased().contains("verif"))
              }

              private func offset(_ token: String, in source: String) throws -> String.Index {
                  guard let range = source.range(of: token) else { Issue.record("Missing token: \(token)"); throw ContractError.missing }
                  return range.lowerBound
              }
              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start), let b = source.range(of: end, range: a.upperBound..<source.endIndex) else { Issue.record("Missing section"); throw ContractError.missing }
                  return source[a.lowerBound..<b.lowerBound]
              }
              private func entrypointSource() throws -> String {
                  var root = URL(fileURLWithPath: #filePath); for _ in 0..<5 { root.deleteLastPathComponent() }
                  return try String(contentsOf: root.appendingPathComponent("NembraApp/App/NembraCaptureEntrypoint.swift"), encoding: .utf8)
              }
              private enum ContractError: Error { case missing }
          }
          ''')

          (tests / "TuyaApplicationEventMetadataPrecedenceSourceTests.swift").write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application event metadata precedence")
          struct TuyaApplicationEventMetadataPrecedenceSourceTests {
              @Test("SDK application keys cannot overwrite Nembra generation provenance")
              func trustedGenerationWinsReservedKeyCollision() throws {
                  let source = try entrypointSource()
                  let receiver = String(try section(in: source, from: "private func receivedApplicationUpdate(", to: "private func startWatchdog"))
                  #expect(receiver.contains("log(\"tuya_application_update\""))
                  #expect(receiver.contains("\"generation\": String(token.diagnosticGeneration)"))
                  #expect(!receiver.contains(") { current, _ in current })"))
                  #expect(receiver.contains(") { _, trusted in trusted })"))
              }
              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start), let b = source.range(of: end, range: a.upperBound..<source.endIndex) else { Issue.record("Missing section"); throw ContractError.missing }
                  return source[a.lowerBound..<b.lowerBound]
              }
              private func entrypointSource() throws -> String {
                  var root = URL(fileURLWithPath: #filePath); for _ in 0..<5 { root.deleteLastPathComponent() }
                  return try String(contentsOf: root.appendingPathComponent("NembraApp/App/NembraCaptureEntrypoint.swift"), encoding: .utf8)
              }
              private enum ContractError: Error { case missing }
          }
          ''')
          PY

      - name: Verify bounded current truth contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          bridge = Path("NembraApp/Features/Research/TuyaAccountBridge.swift").read_text()
          fragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey"]
          driver = app.split("private static let secretKeyFragments = [", 1)[1].split("private static func redactApplicationSecrets(_ object: Any) -> Any", 1)[0]
          redactor = bridge.split("private static func redactSecrets(_ object: Any) -> Any", 1)[1].split("private static func remoteMessage(_ object: [String: Any]) -> String", 1)[0]
          for fragment in fragments:
              assert driver.count(f'"{fragment}"') == 1, (fragment, "SmartLife")
              assert redactor.count(f'"{fragment}"') == 1, (fragment, "bridge")
          exit_cleanup = app.split("func abandonCorrelationForViewExit()", 1)[1].split("func appDidLoseForeground()", 1)[0]
          foreground_cleanup = app.split("func appDidLoseForeground()", 1)[1].split("var privateConfig: Bool", 1)[0]
          for cleanup in (exit_cleanup, foreground_cleanup):
              assert cleanup.index("sdkDeviceMembershipVerified = false") < cleanup.index("membershipStatus =") < cleanup.index("membershipRequestID = UUID()")
          receiver = app.split("private func receivedApplicationUpdate(", 1)[1].split("private func startWatchdog", 1)[0]
          assert ']) { _, trusted in trusted })' in receiver
          assert ']) { current, _ in current })' not in receiver
          assert 'recordObservedTransportLoss' not in foreground_cleanup
          assert 'endConnection' not in foreground_cleanup
          assert 'disconnectBLE' not in foreground_cleanup
          assert 'Task { @MainActor [self] in' in foreground_cleanup
          PY
          for f in \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExportSecretClassifierConvergenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift; do
            swiftc -parse "$f"
          done
          git diff --check

      - name: Publish clean current-product donor
        shell: bash
        run: |
          set -euo pipefail
          BASE=1c40853f6991b4d09206df1d25ecff021458b7eb
          WORKFLOW=.github/workflows/materialize-capture-truth-convergence-1c408.yml
          T1=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExportSecretClassifierConvergenceSourceTests.swift
          T2=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          T3=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=("$WORKFLOW" "NembraApp/App/NembraCaptureEntrypoint.swift" "NembraApp/Features/Research/TuyaAccountBridge.swift" "$T1" "$T2" "$T3")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${staged[*]}" = "${expected_sorted[*]}"
          git commit -m "fix(capture): converge current truth boundaries"
          mapfile -t effective < <(git diff --name-only "$BASE"...HEAD | sort)
          expected_effective=("NembraApp/App/NembraCaptureEntrypoint.swift" "NembraApp/Features/Research/TuyaAccountBridge.swift" "$T1" "$T2" "$T3")
          mapfile -t expected_effective_sorted < <(printf '%s\n' "${expected_effective[@]}" | sort)
          test "${effective[*]}" = "${expected_effective_sorted[*]}"
          git diff --check "$BASE"...HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
