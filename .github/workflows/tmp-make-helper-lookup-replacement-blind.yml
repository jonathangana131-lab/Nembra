name: Temporary Make Helper Lookup Replacement Blind

on:
  push:
    branches:
      - repair/v14-capture-signed-app-helper-execution-sol

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-signed-app-helper-execution-sol
          fetch-depth: 0
      - name: Patch replacement-blind helper lookup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_make_helper_lookup_replacement_blind.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check
      - name: Commit production change and remove temporary materializers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-make-helper-lookup-replacement-blind.yml
          rm -f scripts/ci/tmp_make_helper_lookup_replacement_blind.py
          git config user.name 'nembra-capture-bot'
          git config user.email 'nembra-capture-bot@users.noreply.github.com'
          git add scripts/field/install_one_time_capture.command .github/workflows/tmp-make-helper-lookup-replacement-blind.yml scripts/ci/tmp_make_helper_lookup_replacement_blind.py
          git diff --cached --check
          git commit -m 'fix(capture): make helper Git authority replacement-blind'
          git push origin HEAD:repair/v14-capture-signed-app-helper-execution-sol
