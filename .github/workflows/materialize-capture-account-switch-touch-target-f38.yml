name: Materialize Capture Account Switch Touch Target F38

on:
  push:
    branches:
      - fix/v14-capture-account-switch-touch-target-f38-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact parent and staged scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='f38a4b808c5956b4de5fcdf58d18113e9d5ca23b'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          mapfile -t paths < <(git diff --name-only "$BASE"...HEAD)
          test "${#paths[@]}" -eq 2
          printf '%s\n' "${paths[@]}" | grep -Fxq '.github/workflows/materialize-capture-account-switch-touch-target-f38.yml'
          printf '%s\n' "${paths[@]}" | grep -Fxq 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureAccountSwitchTouchTargetSourceTests.swift'

      - name: Apply exact UI repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          button = source.find('Button("Use a different Tuya account")')
          if button < 0:
              raise SystemExit('account-switch button not found')
          style = source.find('.buttonStyle(.plain)', button)
          font = source.find('.font(.subheadline.weight(.semibold))', style)
          if style < 0 or font < 0 or font - button > 600:
              raise SystemExit('account-switch modifier seam not found')
          seam = source[style:font]
          if '.frame(minHeight: 44' in seam or '.contentShape(Rectangle())' in seam:
              raise SystemExit('account-switch touch target already repaired')
          line_end = source.find('\n', style)
          if line_end < 0 or line_end > font:
              raise SystemExit('button style line boundary not found')
          insertion = '\n                        .frame(minHeight: 44, alignment: .leading)\n                        .contentShape(Rectangle())'
          path.write_text(source[:line_end] + insertion + source[line_end:], encoding='utf-8')
          PY

      - name: Verify source shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = source.index('Button("Use a different Tuya account")')
          end = source.index('.accessibilityHint("Signs out of the official Tuya SDK account', start)
          button = source[start:end]
          assert '.buttonStyle(.plain)' in button
          assert '.frame(minHeight: 44, alignment: .leading)' in button
          assert '.contentShape(Rectangle())' in button
          assert '.disabled(test.membershipBusy || sdkAccount.busy)' in button
          PY
          git diff --check

      - name: Parse changed Swift
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureAccountSwitchTouchTargetSourceTests.swift

      - name: Publish two-path donor
        shell: bash
        run: |
          set -euo pipefail
          BASE='f38a4b808c5956b4de5fcdf58d18113e9d5ca23b'
          rm .github/workflows/materialize-capture-account-switch-touch-target-f38.yml
          git add -A
          git diff --cached --check
          mapfile -t paths < <(git diff --cached --name-only "$BASE")
          test "${#paths[@]}" -eq 2
          printf '%s\n' "${paths[@]}" | grep -Fxq 'NembraApp/App/NembraCaptureEntrypoint.swift'
          printf '%s\n' "${paths[@]}" | grep -Fxq 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureAccountSwitchTouchTargetSourceTests.swift'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): restore account-switch touch target'
          git push origin HEAD:fix/v14-capture-account-switch-touch-target-f38-sol
