name: tmp V14 Signed Origin Mac GID Custody Witness 1312n8

on:
  push:
    branches:
      - research/v14-signed-origin-gid-witness-1312n8
    paths:
      - .github/workflows/tmp-v14-signed-origin-mac-gid-signing-prereq-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact accepted ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f76e6ae54b4304df5b02db4f46a72f67daa276e2 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove transient-GID compiler-output custody prerequisite
        shell: bash
        run: |
          set -euo pipefail
          python3_bin="$(command -v python3)"
          xcodebuild_bin="$(command -v xcodebuild)"
          codesign_bin="$(command -v codesign)"
          test -x "$python3_bin"
          test -x "$xcodebuild_bin"
          test -x "$codesign_bin"

          uid="$(id -u)"
          normal_gid="$(id -g)"
          user="$(id -un)"
          home="$HOME"
          tmp="${TMPDIR:-/tmp}"
          repo="$GITHUB_WORKSPACE"
          root="/private/tmp/nembra-v14-origin-gid-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          build_log="$RUNNER_TEMP/nembra-v14-origin-gid-xcodebuild.log"
          report="$RUNNER_TEMP/nembra-v14-origin-gid-report.json"
          ephemeral_gid=61000
          while id -G | tr ' ' '\n' | grep -Fxq "$ephemeral_gid"; do ephemeral_gid=$((ephemeral_gid + 1)); done

          sudo -n rm -rf -- "$root"
          rm -f -- "$build_log" "$report"

          set +e
          sudo -n "$python3_bin" - \
            "$repo" "$root" "$uid" "$normal_gid" "$ephemeral_gid" "$user" "$home" "$tmp" \
            "$python3_bin" "$xcodebuild_bin" "$codesign_bin" "$build_log" "$report" "$GITHUB_SHA" <<'PY'
          import json
          import os
          from pathlib import Path
          import signal
          import stat
          import subprocess
          import sys

          repo = Path(sys.argv[1]).resolve()
          root = Path(sys.argv[2])
          uid = int(sys.argv[3])
          normal_gid = int(sys.argv[4])
          ephemeral_gid = int(sys.argv[5])
          user = sys.argv[6]
          home = sys.argv[7]
          tmpdir = sys.argv[8]
          python3_bin = sys.argv[9]
          xcodebuild_bin = sys.argv[10]
          codesign_bin = sys.argv[11]
          build_log = Path(sys.argv[12])
          report = Path(sys.argv[13])
          probe_head = sys.argv[14]

          if os.geteuid() != 0:
              raise SystemExit('custody supervisor must execute as root')

          protected = root / 'protected-derived'
          root.mkdir(mode=0o711)
          os.chown(root, 0, 0)
          os.chmod(root, 0o711)
          protected.mkdir(mode=0o770)
          os.chown(protected, 0, ephemeral_gid)
          os.chmod(protected, 0o770)

          env = dict(os.environ)
          env.update({'HOME': home, 'USER': user, 'LOGNAME': user, 'TMPDIR': tmpdir})

          def run_as(gid: int, argv: list[str]) -> dict:
              read_fd, write_fd = os.pipe()
              pid = os.fork()
              if pid == 0:
                  try:
                      os.close(read_fd)
                      os.setgroups([])
                      os.setgid(gid)
                      os.setuid(uid)
                      completed = subprocess.run(
                          argv,
                          env=env,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          check=False,
                      )
                      payload = {
                          'status': completed.returncode,
                          'stdout': completed.stdout.decode('utf-8', 'replace')[:4096],
                      }
                      os.write(write_fd, json.dumps(payload).encode('utf-8'))
                  except BaseException as exc:
                      os.write(write_fd, json.dumps({'error': type(exc).__name__ + ':' + str(exc)}).encode('utf-8', 'replace'))
                  finally:
                      os._exit(0)
              os.close(write_fd)
              chunks = []
              while True:
                  chunk = os.read(read_fd, 65536)
                  if not chunk:
                      break
                  chunks.append(chunk)
              os.close(read_fd)
              os.waitpid(pid, 0)
              return json.loads(b''.join(chunks).decode('utf-8'))

          # Negative witness: same UID with the operator's normal primary GID cannot
          # traverse the root-owned compiler-output parent.
          denied = run_as(normal_gid, [
              python3_bin, '-I', '-c',
              'import os,sys; os.listdir(sys.argv[1])', str(protected),
          ])
          if denied.get('status') == 0:
              raise SystemExit('same-UID normal-GID actor traversed protected DerivedData')

          # Positive control: the same UID with only the transient writer GID can use it.
          allowed = run_as(ephemeral_gid, [
              python3_bin, '-I', '-c',
              'from pathlib import Path; import sys; p=Path(sys.argv[1])/"writer-control"; p.write_text("ok"); p.unlink()',
              str(protected),
          ])
          if allowed.get('status') != 0:
              raise SystemExit(f'transient-GID positive control failed: {allowed!r}')

          log_fd = os.open(build_log, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          os.fchown(log_fd, uid, normal_gid)
          build_pid = os.fork()
          if build_pid == 0:
              try:
                  os.setsid()
                  os.chdir(repo)
                  os.setgroups([])
                  os.setgid(ephemeral_gid)
                  os.setuid(uid)
                  os.dup2(log_fd, 1)
                  os.dup2(log_fd, 2)
                  if log_fd not in (1, 2):
                      os.close(log_fd)
                  argv = [
                      xcodebuild_bin,
                      '-project', 'NembraCapture.xcodeproj',
                      '-scheme', 'Nembra Capture',
                      '-configuration', 'Debug',
                      '-sdk', 'iphonesimulator',
                      '-destination', 'generic/platform=iOS Simulator',
                      '-derivedDataPath', str(protected),
                      'CODE_SIGNING_ALLOWED=YES',
                      'build',
                  ]
                  os.execve(xcodebuild_bin, argv, env)
              except BaseException as exc:
                  os.write(2, ('xcodebuild setup failed: ' + type(exc).__name__ + ':' + str(exc) + '\n').encode('utf-8', 'replace'))
                  os._exit(127)
          os.close(log_fd)
          _, wait_status = os.waitpid(build_pid, 0)
          build_status = os.WEXITSTATUS(wait_status) if os.WIFEXITED(wait_status) else 128 + os.WTERMSIG(wait_status)

          # This is a prerequisite witness, not the final production process-family
          # proof. Fail rather than snapshot if the build process group is still live.
          process_group_drained = False
          try:
              os.killpg(build_pid, 0)
          except ProcessLookupError:
              process_group_drained = True
          if not process_group_drained:
              try:
                  os.killpg(build_pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              raise SystemExit('xcodebuild returned while its trusted process group remained live')

          # Revoke the transient writer capability before deriving any subject value.
          os.chown(protected, 0, 0)
          os.chmod(protected, 0o700)

          app = protected / 'Build' / 'Products' / 'Debug-iphonesimulator' / 'Nembra Capture.app'
          if build_status != 0 or not app.is_dir():
              raise SystemExit(f'xcodebuild failed under transient GID: exit={build_status} app={app.is_dir()}')

          # The original #2955 attacker shape must now fail at the pathname boundary.
          rename_probe = run_as(normal_gid, [
              python3_bin, '-I', '-c',
              'from pathlib import Path; import os,sys; p=Path(sys.argv[1]); os.rename(p, p.with_name(p.name+".swapped"))',
              str(app),
          ])
          if rename_probe.get('status') == 0:
              raise SystemExit('same-UID normal-GID actor renamed compiler output after root lock')

          verify = subprocess.run(
              [codesign_bin, '--verify', '--deep', '--strict', str(app)],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              check=False,
          )
          if verify.returncode != 0:
              raise SystemExit('codesign verification failed after root lock: ' + verify.stdout.decode('utf-8', 'replace')[:2000])

          result = {
              'probe_head': probe_head,
              'same_uid_normal_gid_prebuild_access': 'denied',
              'same_uid_transient_gid_positive_control': 'success',
              'xcodebuild_simulator_exit': build_status,
              'xcodebuild_process_group_drained': True,
              'protected_parent_mode_at_first_subject_use': oct(stat.S_IMODE(protected.stat().st_mode)),
              'same_uid_normal_gid_postbuild_rename': 'denied',
              'codesign_verify_after_root_lock': 'success',
              'scope': 'compiler-output custody prerequisite only; full descendant-family drain, physical provisioning, production #2955 replay, and final physical authority remain open',
          }
          report.write_text(json.dumps(result, sort_keys=True) + '\n', encoding='utf-8')
          os.chown(report, uid, normal_gid)
          os.chmod(report, 0o600)
          PY
          status="$?"
          set -e

          if [[ -f "$report" ]]; then cat "$report"; fi
          if [[ "$status" != 0 ]]; then
            echo "::error title=Transient-GID custody witness failed::root supervisor exited $status"
            if [[ -f "$build_log" ]]; then
              grep -iE 'error:|permission denied|operation not permitted|codesign|failed' "$build_log" | tail -n 80 || true
            fi
            sudo -n rm -rf -- "$root"
            exit "$status"
          fi
          sudo -n rm -rf -- "$root"

      - name: Preserve authority boundary
        shell: bash
        run: |
          echo 'Research prerequisite only. Full descendant-family drain and production #2955 replay remain required.'
          echo 'PHYSICAL NO-GO.'
