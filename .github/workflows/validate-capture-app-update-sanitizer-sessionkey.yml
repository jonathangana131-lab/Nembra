name: Validate Capture App Update Sanitizer Session Key

on:
  push:
    branches:
      - agent/v14-capture-app-update-secret-sanitizer-sol

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-app-update-secret-sanitizer-sol
          fetch-depth: 0

      - name: Validate sanitizer behavior and scope
        shell: bash
        run: |
          set -euo pipefail
          source_file='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift'
          test_file='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift'
          swiftc -parse "$source_file"
          swiftc -parse "$test_file"
          grep -Fq '"sessionkey"' "$source_file"
          grep -Fq '"session_key": "session-secret"' "$test_file"
          grep -Fq '!payload.contains("session-secret")' "$test_file"
          cat > /tmp/SanitizerHarness.swift <<'SWIFT'
          import Foundation

          @main
          struct Harness {
              static func main() {
                  let update: [AnyHashable: Any] = [
                      "session_key": "top-secret",
                      "payload": [
                          "battery": 73,
                          "nested": [["local_key": "nested-secret"], ["session-key": "nested-session"]]
                      ] as [String: Any]
                  ]
                  let sanitized = TuyaApplicationUpdateSecretSanitizer.sanitize(update)
                  precondition(sanitized["session_key"] == "<redacted>")
                  let payload = sanitized["payload"] ?? ""
                  precondition(payload.contains("73"))
                  precondition(payload.contains("<redacted>"))
                  precondition(!payload.contains("nested-secret"))
                  precondition(!payload.contains("nested-session"))
              }
          }
          SWIFT
          swiftc -warnings-as-errors "$source_file" /tmp/SanitizerHarness.swift -o /tmp/sanitizer-harness
          /tmp/sanitizer-harness
          git diff --check

      - name: Publish clean package checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-capture-app-update-sanitizer-sessionkey.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci(capture): publish session-key sanitizer checkpoint'
          git push origin HEAD:agent/v14-capture-app-update-secret-sanitizer-sol
