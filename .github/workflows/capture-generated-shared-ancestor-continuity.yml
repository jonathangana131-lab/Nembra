name: Capture Fold Generated Root Continuity Once

on:
  push:
    branches:
      - repair/v17-capture-generated-root-generation-continuity-sol-20260815
    paths:
      - .github/workflows/capture-generated-shared-ancestor-continuity.yml

permissions:
  contents: write

env:
  EXACT_PARENT: f1be1b584e8b568fb8c3998adad3ee0b29004fdc
  TARGET_BRANCH: repair/v17-capture-generated-root-generation-continuity-sol-20260815

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-generated-root-generation-continuity-sol-20260815
          fetch-depth: 0

      - name: Bind authoring lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = ".github/workflows/capture-generated-shared-ancestor-continuity.yml"

      - name: Fold root-generation repair and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          helper = Path("scripts/ci/capture_accepted_build_input_snapshot.py")
          text = helper.read_text(encoding="utf-8")
          canonical_anchor = (
              "    root_fd = _open_repository_root(root)\n"
              "    directory_cache: dict[Path, tuple[int, os.stat_result]] = {}\n"
              "    try:\n"
              "        for subject in GENERATED_SUBJECTS:\n"
          )
          canonical_replacement = (
              "    root_fd = _open_repository_root(root)\n"
              "    root_generation = os.fstat(root_fd)\n"
              "    directory_cache: dict[Path, tuple[int, os.stat_result]] = {}\n"
              "    try:\n"
              "        for subject in GENERATED_SUBJECTS:\n"
              "            _assert_directory_generation(root_fd, root_generation, Path(\"<repository-root>\"))\n"
          )
          if text.count(canonical_anchor) != 1:
              raise SystemExit("canonical root-generation anchor did not match exactly once")
          text = text.replace(canonical_anchor, canonical_replacement)

          copy_anchor = (
              "    root_fd = _open_repository_root(source_root)\n"
              "    directory_cache: dict[Path, tuple[int, os.stat_result]] = {}\n"
              "    try:\n"
              "        for subject in GENERATED_SUBJECTS:\n"
          )
          copy_replacement = (
              "    root_fd = _open_repository_root(source_root)\n"
              "    root_generation = os.fstat(root_fd)\n"
              "    directory_cache: dict[Path, tuple[int, os.stat_result]] = {}\n"
              "    try:\n"
              "        for subject in GENERATED_SUBJECTS:\n"
              "            _assert_directory_generation(root_fd, root_generation, Path(\"<repository-root>\"))\n"
          )
          if text.count(copy_anchor) != 1:
              raise SystemExit("copy root-generation anchor did not match exactly once")
          text = text.replace(copy_anchor, copy_replacement)

          post_subject = (
              "            finally:\n"
              "                os.close(descriptor)\n"
              "    finally:\n"
              "        _close_directory_cache(directory_cache)\n"
              "        os.close(root_fd)\n"
          )
          post_subject_replacement = (
              "            finally:\n"
              "                os.close(descriptor)\n"
              "            _assert_directory_generation(root_fd, root_generation, Path(\"<repository-root>\"))\n"
              "    finally:\n"
              "        _close_directory_cache(directory_cache)\n"
              "        os.close(root_fd)\n"
          )
          if text.count(post_subject) != 2:
              raise SystemExit("post-subject root-generation anchor did not match exactly twice")
          helper.write_text(text.replace(post_subject, post_subject_replacement), encoding="utf-8")

          regression_b64 = ""
          regression = base64.b64decode(regression_b64).decode("utf-8")
          test = Path("scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py")
          test_text = test.read_text(encoding="utf-8")
          marker = "\n\nif __name__ == \"__main__\":\n    unittest.main(verbosity=2)\n"
          if test_text.count(marker) != 1:
              raise SystemExit("continuity regression insertion marker did not match exactly once")
          test.write_text(test_text.replace(marker, regression + marker), encoding="utf-8")
          PY

          git checkout "$EXACT_PARENT" -- .github/workflows/capture-generated-shared-ancestor-continuity.yml
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 -B scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 -B scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check
          changed="$(git diff --name-only "$EXACT_PARENT" | LC_ALL=C sort)"
          expected="$(printf '%s\n' scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/capture-generated-shared-ancestor-continuity.yml scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git commit -m "fix(capture): hold generated repository-root generation"
          git push origin HEAD:"$TARGET_BRANCH"
