name: Capture Generated FD Transfer Convergence Author

on:
  push:
    branches:
      - repair/v17-capture-generated-fd-transfer-convergence-gpt56
  workflow_dispatch:

permissions:
  contents: write

env:
  EXACT_PARENT: 88515c72fb5ec87934747dc2bf68251251be51fa
  MATERIALIZER: scripts/ci/materialize_capture_generated_fd_transfer_convergence.py
  BRANCH: repair/v17-capture-generated-fd-transfer-convergence-gpt56

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact authoring delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-generated-shared-ancestor-continuity.yml \
            scripts/ci/materialize_capture_generated_fd_transfer_convergence.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize permanent repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I "$MATERIALIZER"

      - name: Validate full accepted-input chronology
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py

      - name: Publish three-path convergence
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$MATERIALIZER"
          git diff --check "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-generated-shared-ancestor-continuity.yml \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): preserve cached-parent fd ownership'
          git push origin "HEAD:$BRANCH"
