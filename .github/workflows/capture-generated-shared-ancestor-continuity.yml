name: Capture Generated Shared Ancestor Continuity

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_generated_shared_ancestor_cache_dup_fd_leak_current.py
      - .github/workflows/capture-generated-shared-ancestor-continuity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-generated-shared-ancestor-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: a183b50e14391b1b562966d4a56e558229d3a9a9

jobs:
  exploit-positive:
    name: Current cache-dup FD leak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-generated-shared-ancestor-continuity.yml \
            scripts/ci/tests/test_capture_generated_shared_ancestor_cache_dup_fd_leak_current.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test "$(git hash-object scripts/ci/capture_accepted_build_input_snapshot.py)" = \
            "$(git rev-parse "$EXACT_PARENT:scripts/ci/capture_accepted_build_input_snapshot.py")"

      - name: Run exploit-positive cache-dup FD leak oracle
        id: oracle
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_cache_dup_fd_leak_current.py \
            2>&1 | tee "$RUNNER_TEMP/current-cache-dup-fd-leak-${{ matrix.os }}.log"

      - name: Capture checkout cleanliness diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/checkout-status-${{ matrix.os }}.log"
          git diff --no-ext-diff -- > "$RUNNER_TEMP/checkout-unstaged-diff-${{ matrix.os }}.log"
          git diff --cached --no-ext-diff -- > "$RUNNER_TEMP/checkout-staged-diff-${{ matrix.os }}.log"

      - name: Retain validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-cache-dup-fd-leak-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/current-cache-dup-fd-leak-${{ matrix.os }}.log
            ${{ runner.temp }}/checkout-status-${{ matrix.os }}.log
            ${{ runner.temp }}/checkout-unstaged-diff-${{ matrix.os }}.log
            ${{ runner.temp }}/checkout-staged-diff-${{ matrix.os }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exploit-positive verdict and clean checkout
        if: always()
        shell: bash
        env:
          ORACLE_OUTCOME: ${{ steps.oracle.outcome }}
        run: |
          set -euo pipefail
          test "$ORACLE_OUTCOME" = success
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "EXPLOIT_POSITIVE=true"
          echo "PRODUCT_ACCEPTANCE=false"
          echo "PHYSICAL_AUTHORITY=false"
