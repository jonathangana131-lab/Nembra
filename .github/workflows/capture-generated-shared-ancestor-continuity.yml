name: Capture Generated Shared Ancestor Continuity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/ci/capture_accepted_build_input_snapshot.py
      - scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
      - .github/workflows/capture-generated-shared-ancestor-continuity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-generated-shared-ancestor-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: fe40c025eb10247c73820f4001ab63affaa60af7
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  continuity:
    name: One generated/private ancestor generation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact serial parent and permanent three-path delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-generated-shared-ancestor-continuity.yml \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exact helper and regressions without bytecode artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              'scripts/ci/capture_accepted_build_input_snapshot.py',
              'scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py',
              'scripts/ci/tests/test_capture_accepted_build_input_snapshot.py',
          ):
              path=Path(raw)
              compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
          PY

      - name: Require shared LocalSecrets generation continuity
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py

      - name: Preserve inherited accepted build-input snapshot contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py

      - name: Preserve exact clean head and truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'NEMBRA_GENERATED_SHARED_ANCESTOR_CONTINUITY exactParent=true operationWideDescriptorGraph=true localSecretsGenerationSpliceRejected=true trackedNamespaceCoherencePreserved=true ownerOnlyStagingPreserved=true symlinkConfinementPreserved=true productionXcodeWired=false signingAuthorityCreated=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false'
