name: Capture Generated Shared Ancestor Continuity

on:
  pull_request:
    paths:
      - scripts/ci/capture_accepted_build_input_snapshot.py
      - scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
      - scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
      - .github/workflows/capture-generated-shared-ancestor-continuity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-generated-shared-ancestor-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-portable:
    name: Exact generated-input continuity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind immutable current carrier
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          # Under the current AGENTS.md direct-to-main model, bind this security
          # regression to the real immutable PR base instead of a historical
          # serial-repair parent/delta. A workflow_dispatch without PR context
          # intentionally fails closed rather than inventing authority.
          test -n "$PR_BASE_SHA"
          git cat-file -e "$PR_BASE_SHA^{commit}"
          test "$(git merge-base HEAD "$PR_BASE_SHA")" = "$PR_BASE_SHA"
          git diff --check "$PR_BASE_SHA"...HEAD

          # The carrier may legitimately compose many current-main paths, but
          # the authority helper and both regressions must be present as tracked
          # bytes on the exact head being evaluated.
          git ls-files --error-unmatch \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py \
            scripts/ci/tests/test_capture_accepted_build_input_snapshot.py \
            .github/workflows/capture-generated-shared-ancestor-continuity.yml >/dev/null

      - name: Run generated shared-ancestor continuity regression
        id: continuity
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py \
            2>&1 | tee "$RUNNER_TEMP/generated-shared-ancestor-continuity-${{ matrix.os }}.log"

      - name: Run inherited accepted-input regression
        id: inherited
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py \
            2>&1 | tee "$RUNNER_TEMP/accepted-build-input-snapshot-${{ matrix.os }}.log"

      - name: Capture checkout cleanliness diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/checkout-status-${{ matrix.os }}.log"
          git diff --no-ext-diff -- > "$RUNNER_TEMP/checkout-unstaged-diff-${{ matrix.os }}.log"
          git diff --cached --no-ext-diff -- > "$RUNNER_TEMP/checkout-staged-diff-${{ matrix.os }}.log"

      - name: Retain platform diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-shared-ancestor-continuity-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/generated-shared-ancestor-continuity-${{ matrix.os }}.log
            ${{ runner.temp }}/accepted-build-input-snapshot-${{ matrix.os }}.log
            ${{ runner.temp }}/checkout-status-${{ matrix.os }}.log
            ${{ runner.temp }}/checkout-unstaged-diff-${{ matrix.os }}.log
            ${{ runner.temp }}/checkout-staged-diff-${{ matrix.os }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce regression verdict and clean checkout
        if: always()
        shell: bash
        env:
          CONTINUITY_OUTCOME: ${{ steps.continuity.outcome }}
          INHERITED_OUTCOME: ${{ steps.inherited.outcome }}
        run: |
          set -euo pipefail
          test "$CONTINUITY_OUTCOME" = success
          test "$INHERITED_OUTCOME" = success
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
