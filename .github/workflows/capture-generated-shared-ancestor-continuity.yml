name: Capture Generated Shared Ancestor Continuity Failure Isolation

on:
  pull_request:
    branches:
      - repair/v17-capture-generated-shared-ancestor-cache-sol-20260814
    paths:
      - .github/workflows/capture-generated-shared-ancestor-continuity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-generated-continuity-macos-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PRODUCT: 807f1097332435d36e8c859444b63e415b846404

jobs:
  isolate-macos:
    name: Isolate generated continuity failure (macos-15)
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact product and validation-only workflow delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PRODUCT")" = "$EXACT_PRODUCT"
          changed="$(git diff --name-only "$EXACT_PRODUCT"...HEAD)"
          test "$changed" = ".github/workflows/capture-generated-shared-ancestor-continuity.yml"
          test "$(git rev-parse "$EXACT_PRODUCT:scripts/ci/capture_accepted_build_input_snapshot.py")" = "$(git rev-parse "HEAD:scripts/ci/capture_accepted_build_input_snapshot.py")"
          test "$(git rev-parse "$EXACT_PRODUCT:scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py")" = "$(git rev-parse "HEAD:scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py")"
          git diff --check "$EXACT_PRODUCT"...HEAD

      - name: Compile exact product regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -m py_compile scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          find scripts/ci -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Whole-parent manifest replacement
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py CaptureGeneratedSharedAncestorContinuityTests.test_manifest_holds_or_rejects_whole_localsecrets_generation_replacement

      - name: Whole-parent copy replacement
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py CaptureGeneratedSharedAncestorContinuityTests.test_copy_holds_or_rejects_whole_localsecrets_generation_replacement

      - name: Held-parent runtime sibling manifest replacement
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py CaptureGeneratedSharedAncestorContinuityTests.test_manifest_rejects_or_holds_runtime_sibling_replacement_inside_held_parent

      - name: Held-parent runtime sibling copy replacement
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py CaptureGeneratedSharedAncestorContinuityTests.test_copy_rejects_or_holds_runtime_sibling_replacement_inside_held_parent

      - name: Inherited accepted-input regression suite
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py

      - name: Preserve exact product and clean validation head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$EXACT_PRODUCT:scripts/ci/capture_accepted_build_input_snapshot.py")" = "$(git rev-parse "HEAD:scripts/ci/capture_accepted_build_input_snapshot.py")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'Diagnostic only: no signing/install/device/Bluetooth/Tuya/telemetry/command/physical authority.'
