name: Reconcile Capture accepted-event repair with flagship

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'adversarial/v14-capture-sealed-application-export-prefix-gpt56sol'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Merge exact live flagship and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git fetch origin integration/v14-capture-final-stationary-convergence-sol
          live_flagship="$(git rev-parse FETCH_HEAD)"
          printf 'Reconciling live flagship: %s\n' "$live_flagship"
          git merge --no-edit "$live_flagship"
          rm -- .github/workflows/reconcile-capture-seal-base.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(capture): remove reconciliation bootstrap" \
            -m "Reconciled against live flagship $live_flagship before removing the one-shot helper."
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
