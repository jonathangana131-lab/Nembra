name: Xcode 27 Queue Janitor

on:
  push:
    branches:
      - main
      - ci/xcode27-queue-janitor-v14-gpt56-go
      - ci/xcode27-stale-active-janitor-v14-gpt56-go
      - ci/xcode27-janitor-five-minute-v14-gpt56-go
      - ci/capture-trusted-run-queue-identity/gpt56-go
    paths:
      - scripts/ci/xcode27_queue_janitor.py
      - scripts/ci/capture_trusted_queue_janitor.py
      - .github/workflows/xcode27-queue-janitor.yml
  pull_request_target:
    types:
      - closed
      - synchronize
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  # Keep mutating global sweeps alive across PR-head churn and non-main audit runs.
  # Audit-only runs may supersede one another, but neither class may cancel global cleanup.
  group: nembra-xcode27-queue-janitor-${{ github.event_name == 'pull_request_target' && 'pr-head' || github.ref != 'refs/heads/main' && 'audit' || 'global' }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch after PR-head movement
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main

      - name: Checkout event revision
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Self-test fail-closed PR classifier
        run: python3 scripts/ci/xcode27_queue_janitor.py --self-test

      - name: Self-test fail-closed trusted Capture classifier
        run: python3 scripts/ci/capture_trusted_queue_janitor.py --self-test

      - name: Audit branch candidate without mutation
        if: github.event_name != 'pull_request_target' && github.ref != 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/xcode27_queue_janitor.py \
            --minimum-age-seconds 120 \
            --max-cancellations 200
          python3 scripts/ci/capture_trusted_queue_janitor.py \
            --minimum-age-seconds 120 \
            --max-cancellations 200

      - name: Cancel proven-stale Xcode runs after same-repo PR head movement
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/xcode27_queue_janitor.py \
            --apply \
            --minimum-age-seconds 0 \
            --max-cancellations 200
          python3 scripts/ci/capture_trusted_queue_janitor.py \
            --apply \
            --minimum-age-seconds 0 \
            --max-cancellations 200

      - name: Cancel only proven-stale queued or in-progress Xcode runs
        if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/xcode27_queue_janitor.py \
            --apply \
            --minimum-age-seconds 120 \
            --max-cancellations 200
          python3 scripts/ci/capture_trusted_queue_janitor.py \
            --apply \
            --minimum-age-seconds 120 \
            --max-cancellations 200
