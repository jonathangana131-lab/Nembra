name: V14 Capture Quiescent Live One Shot

on:
  push:
    branches:
      - integration/v14-capture-application-evidence-quiescence-current-sol

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/v14-capture-application-evidence-quiescence-current-sol
          fetch-depth: 0

      - name: Apply quiescent application-evidence cut
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact anchor, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              '    private var driver: OfficialTuyaDriver?\n    private var events: [Event] = []\n    private var sealedAcceptedEventPrefix: [Event]?\n    private var watchdog: Task<Void, Never>?\n',
              '    private var driver: OfficialTuyaDriver?\n    private var events: [Event] = []\n    private var applicationUpdateAdmissionsInFlight = 0\n    private var acceptanceCutIsClosed = false\n    private var sealedAcceptedEventPrefix: [Event]?\n    private var watchdog: Task<Void, Never>?\n',
              'acceptance-cut state'
          )

          receive_start = source.index('    private func receivedApplicationUpdate')
          receive_end = source.index('    private func startWatchdog', receive_start)
          receive = source[receive_start:receive_end]
          old = '        guard sdkAccountLoggedIn,\n'
          new = '        guard !acceptanceCutIsClosed else {\n            log("application_update_after_acceptance_cut_ignored", [\n                "generation": String(token.diagnosticGeneration)\n            ])\n            return\n        }\n        guard sdkAccountLoggedIn,\n'
          count = receive.count(old)
          if count != 1:
              raise SystemExit(f'post-cut admission guard: expected one scoped anchor, found {count}')
          receive = receive.replace(old, new, 1)
          source = source[:receive_start] + receive + source[receive_end:]

          replace_once(
              '        do {\n            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)\n',
              '        applicationUpdateAdmissionsInFlight += 1\n        defer { applicationUpdateAdmissionsInFlight -= 1 }\n\n        do {\n            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)\n',
              'in-flight application admission custody'
          )

          replace_once(
              '                    do {\n                        try await sessionLedger.sealAcceptedObservation(for: token)\n                        self.sealedAcceptedEventPrefix = self.events\n',
              '                    guard self.applicationUpdateAdmissionsInFlight == 0 else {\n                        break\n                    }\n                    self.acceptanceCutIsClosed = true\n                    let acceptedEventPrefixAtCut = self.events\n                    do {\n                        try await sessionLedger.sealAcceptedObservation(for: token)\n                        self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut\n',
              'quiescent pre-await acceptance cut'
          )

          replace_once(
              '                if (self.canonicalObservedAgeSeconds ?? 0) > 60,\n                   self.applicationUpdateCount == 0 {\n',
              '                if self.applicationUpdateAdmissionsInFlight == 0,\n                   (self.canonicalObservedAgeSeconds ?? 0) > 60,\n                   self.applicationUpdateCount == 0 {\n',
              'timeout quiescence gate'
          )

          replace_once(
              '    private func resetDiscoverySessionOnly() {\n        sealedAcceptedEventPrefix = nil\n',
              '    private func resetDiscoverySessionOnly() {\n        acceptanceCutIsClosed = false\n        sealedAcceptedEventPrefix = nil\n',
              'fresh-life cut reset'
          )

          path.write_text(source)
          PY

          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          required = [
              'private var applicationUpdateAdmissionsInFlight = 0',
              'private var acceptanceCutIsClosed = false',
              'guard !acceptanceCutIsClosed else',
              'application_update_after_acceptance_cut_ignored',
              'applicationUpdateAdmissionsInFlight += 1',
              'defer { applicationUpdateAdmissionsInFlight -= 1 }',
              'guard self.applicationUpdateAdmissionsInFlight == 0',
              'self.acceptanceCutIsClosed = true',
              'let acceptedEventPrefixAtCut = self.events',
              'self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut',
              'if self.applicationUpdateAdmissionsInFlight == 0,',
              'acceptanceCutIsClosed = false',
          ]
          missing = [item for item in required if item not in app]
          if missing:
              raise SystemExit(f'missing quiescent-cut anchors: {missing}')
          if 'self.sealedAcceptedEventPrefix = self.events' in app:
              raise SystemExit('post-await mutable event snapshot survived')
          if 'consumeCorrelationAsyncInvalidation()' not in app or 'target_correlation_async_invalidated' not in app:
              raise SystemExit('live async-correlation recovery was lost')
          PY
          git diff --check

      - name: Retire helper and checkpoint product repair
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-quiescent-live-one-shot.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/v14-capture-quiescent-live-one-shot.yml
          git commit -m 'fix(capture): seal a quiescent application evidence cut'
          git push origin HEAD:integration/v14-capture-application-evidence-quiescence-current-sol
