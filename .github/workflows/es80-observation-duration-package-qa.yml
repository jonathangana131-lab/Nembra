name: ES80 Observation Duration Package QA

on:
  push:
    branches:
      - 'cell/es80-observation-duration-package-qa/**'

permissions:
  contents: read

concurrency:
  group: nembra-es80-observation-duration-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test observation duration provenance packages
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify immutable checkout and exact product parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "7d89f25747f1094f43a6b4c1a7191aeae9ff204c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/es80-observation-duration-package-qa.yml"

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Guard passive package against application writes
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 research package must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

      - name: Test NembraCore on Apple toolchain
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraCore

      - name: Test NembraBluetoothCapture against exact NembraCore
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture

      - name: Build NembraCore for iOS Simulator
        working-directory: Packages/NembraCore
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraCore -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Build NembraBluetoothCapture for iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
