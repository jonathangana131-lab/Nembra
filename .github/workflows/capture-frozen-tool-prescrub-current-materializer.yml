name: Capture Frozen Tool Pre-Scrub Current Materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/capture-frozen-tool-prescrub-current-materializer.yml'

permissions:
  contents: write

concurrency:
  group: capture-frozen-tool-prescrub-current-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  EXACT_PARENT: 595611addc1d3e648a77c0d4eaae9dc83b34593e
  SELF: .github/workflows/capture-frozen-tool-prescrub-current-materializer.yml
  INSTALLER: scripts/field/install_one_time_capture.command
  HANDOFF_TEST: scripts/ci/tests/test_capture_frozen_device_tool_handoff.py

jobs:
  materialize:
    name: Scrub hostile DYLD before first external image
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact current carrier parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_PARENT"
          test "$(git diff --name-only "$EXACT_PARENT"...HEAD)" = "$SELF"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize clean-exec repair and permanent regression
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - "$INSTALLER" "$HANDOFF_TEST" <<'PY'
          from pathlib import Path
          import sys

          installer_path = Path(sys.argv[1])
          test_path = Path(sys.argv[2])

          installer = installer_path.read_text(encoding='utf-8')
          old = '''    /usr/bin/env -i \\
              PATH=/usr/bin:/bin:/usr/sbin:/sbin \\
              HOME=/tmp \\
              TMPDIR=/tmp \\
              LANG=C \\
              LC_ALL=C \\
              DEVELOPER_DIR="$SELECTED_XCODE_DEVELOPER_DIR" \\
              "$tool" "$@"
          '''
          new = '''    (
              # Bash builtin `exec -c` clears the inherited environment before the
              # first dynamically linked external image is loaded. This prevents
              # hostile DYLD_* selectors from affecting /usr/bin/env itself.
              exec -c /usr/bin/env -i \\
                  PATH=/usr/bin:/bin:/usr/sbin:/sbin \\
                  HOME=/tmp \\
                  TMPDIR=/tmp \\
                  LANG=C \\
                  LC_ALL=C \\
                  DEVELOPER_DIR="$SELECTED_XCODE_DEVELOPER_DIR" \\
                  "$tool" "$@"
              )
          '''
          if installer.count(old) != 1:
              raise SystemExit(f'installer trampoline seam count changed: {installer.count(old)}')
          installer = installer.replace(old, new)
          installer_path.write_text(installer, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          old_test = '            "/usr/bin/env -i",\n'
          new_test = '            "exec -c /usr/bin/env -i",\n'
          if test.count(old_test) != 1:
              raise SystemExit(f'frozen-tool source regression seam count changed: {test.count(old_test)}')
          test = test.replace(old_test, new_test)
          test_path.write_text(test, encoding='utf-8')
          PY

          /bin/bash -n "$INSTALLER"
          /bin/bash -c 'help exec' | grep -Fq -- '-c'
          test "$(grep -Fc 'exec -c /usr/bin/env -i' "$INSTALLER")" = 1
          grep -Fq 'export DYLD_INSERT_LIBRARIES=/tmp/attacker.dylib' "$HANDOFF_TEST"
          /usr/bin/python3 -B -m py_compile "$HANDOFF_TEST" scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I "$HANDOFF_TEST"
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          git diff --check -- "$INSTALLER" "$HANDOFF_TEST"
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$HANDOFF_TEST" "$INSTALLER" | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Commit exact two-path repair and remove authoring workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$INSTALLER" "$HANDOFF_TEST"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$HANDOFF_TEST" "$INSTALLER" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Capture security: scrub frozen tool environment before exec'
          git rm -- "$SELF"
          git commit -m 'Capture security: remove one-shot pre-scrub materializer'
          actual="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$HEAD_BRANCH"
