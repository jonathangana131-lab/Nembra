name: Capture Held Descriptor Reviewed Materializer

on:
  push:
    branches:
      - hardening/v17-capture-read-lease-held-descriptor-custody-sol-20260814
    paths:
      - .github/workflows/capture-read-lease-held-descriptor-review-materialize.yml

permissions:
  contents: write

concurrency:
  group: capture-read-lease-held-descriptor-reviewed-materialize
  cancel-in-progress: false

env:
  EXACT_PARENT: aa610e1000e58ba5e43e35a75ee8f22486aea5ec

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact two-workflow authoring surface
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected"
          actual="$RUNNER_TEMP/actual"
          cat > "$expected" <<'EOF'
          .github/workflows/capture-read-lease-held-descriptor-materialize.yml
          .github/workflows/capture-read-lease-held-descriptor-review-materialize.yml
          EOF
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply owned transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/capture-read-lease-held-descriptor-materialize.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Materialize descriptor-custodied planning and grant\n        shell: bash\n        run: |\n'
          end_marker = '\n      - name: Run focused portable authority regressions\n'
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('owned materializer transform markers are not unique')
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('owned materializer indentation changed')
          Path('/tmp/nembra-held-descriptor-owned-transform.sh').write_text(
              '\n'.join(line[10:] if line else '' for line in lines) + '\n',
              encoding='utf-8',
          )
          PY
          bash /tmp/nembra-held-descriptor-owned-transform.sh

      - name: Bind internal symlinks to held descriptor generation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py')
          source = helper.read_text(encoding='utf-8')

          old_state = '''    held: dict[Path, int] = {}
              selected: set[Path] = set()
              plan: list[dict[str, object]] = []
'''
          new_state = '''    held: dict[Path, int] = {}
              selected: set[Path] = set()
              symlink_targets: dict[Path, str] = {}
              plan: list[dict[str, object]] = []
'''
          if source.count(old_state) != 1:
              raise SystemExit(f'held-plan state anchor count is {source.count(old_state)}, expected 1')
          source = source.replace(old_state, new_state, 1)

          old_link = '''                if stat.S_ISLNK(metadata.st_mode):
                              # Symlinks receive no ACL authority themselves.  Preserve the
                              # existing internal-only policy; every real target that needs
                              # lease authority is independently descriptor-opened in this tree.
                              _validate_internal_symlink(candidate, subject)
                              continue
'''
          new_link = '''                if stat.S_ISLNK(metadata.st_mode):
                              # Read the exact link observed through the held directory generation.
                              # Path.resolve() would re-resolve mutable ancestry and could validate
                              # a different link generation than the one this plan actually saw.
                              try:
                                  target = os.readlink(name, dir_fd=directory_descriptor)
                              except OSError as error:
                                  raise SelectedXcodeBuildOrchestratorError(
                                      f"private read-lease symlink could not be read from held ancestry: {candidate}"
                                  ) from error
                              if not target or os.path.isabs(target):
                                  raise SelectedXcodeBuildOrchestratorError(
                                      f"private read-lease symlink escaped its admitted subject: {candidate}"
                                  )
                              symlink_targets[candidate] = target
                              continue
'''
          if source.count(old_link) != 1:
              raise SystemExit(f'legacy pathname symlink anchor count is {source.count(old_link)}, expected 1')
          source = source.replace(old_link, new_link, 1)

          subject_marker = '''        for raw_subject in subjects:
'''
          validator = '''        def validate_held_symlinks(subject: Path) -> None:
              """Resolve the finite symlink graph inside the exact held subject generation."""
              relevant = {
                  path: target
                  for path, target in symlink_targets.items()
                  if path == subject or subject in path.parents
              }
              for origin in relevant:
                  try:
                      pending = list(origin.parent.relative_to(subject).parts)
                  except ValueError as error:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease symlink escaped its admitted subject: {origin}"
                      ) from error
                  pending.extend(Path(relevant[origin]).parts)
                  resolved_parts: list[str] = []
                  visited: set[Path] = set()
                  while pending:
                      component = pending.pop(0)
                      if component in ("", "."):
                          continue
                      if component == "..":
                          if not resolved_parts:
                              raise SelectedXcodeBuildOrchestratorError(
                                  f"private read-lease symlink escaped its admitted subject: {origin}"
                              )
                          resolved_parts.pop()
                          continue
                      candidate = subject.joinpath(*resolved_parts, component)
                      target = relevant.get(candidate)
                      if target is None:
                          resolved_parts.append(component)
                          continue
                      if candidate in visited:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease symlink cycle is not admissible: {origin}"
                          )
                      visited.add(candidate)
                      if not target or os.path.isabs(target):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease symlink escaped its admitted subject: {origin}"
                          )
                      pending = list(Path(target).parts) + pending
                  terminal = subject.joinpath(*resolved_parts)
                  descriptor = held.get(terminal)
                  if descriptor is None:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease symlink is broken or leaves the held subject: {origin}"
                      )
                  mode = os.fstat(descriptor).st_mode
                  if not (stat.S_ISDIR(mode) or stat.S_ISREG(mode)):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease symlink target has unsupported type: {origin}"
                      )

'''
          if source.count(subject_marker) != 1:
              raise SystemExit(f'subject-loop anchor count is {source.count(subject_marker)}, expected 1')
          source = source.replace(subject_marker, validator + subject_marker, 1)

          old_walk = '''            if stat.S_ISDIR(mode):
                          walk_directory(subject, cursor_descriptor, subject)
                      elif not stat.S_ISREG(mode):
'''
          new_walk = '''            if stat.S_ISDIR(mode):
                          walk_directory(subject, cursor_descriptor, subject)
                          validate_held_symlinks(subject)
                      elif not stat.S_ISREG(mode):
'''
          if source.count(old_walk) != 1:
              raise SystemExit(f'symlink-validation call anchor count is {source.count(old_walk)}, expected 1')
          source = source.replace(old_walk, new_walk, 1)
          helper.write_text(source, encoding='utf-8')

          test = Path('scripts/ci/tests/test_capture_private_read_lease_component_walk.py')
          tests = test.read_text(encoding='utf-8')
          import_anchor = 'import unittest\n'
          if tests.count(import_anchor) != 1:
              raise SystemExit('test import anchor changed')
          tests = tests.replace(import_anchor, 'import unittest\nfrom unittest import mock\n', 1)
          method_anchor = '    def test_real_directory_and_regular_file_path_opener_still_work(self) -> None:\n'
          regression = '''    def test_symlink_validation_cannot_switch_to_a_different_path_generation(self) -> None:
              helper = load()
              with tempfile.TemporaryDirectory(prefix="nembra-held-symlink-generation-") as raw:
                  outer = Path(raw)
                  repo = outer / "repo"
                  subject = repo / "LocalSecrets/TuyaSDK/Build"
                  subject.mkdir(parents=True)
                  outside = repo / "LocalSecrets/outside.bin"
                  outside.write_bytes(b"outside")
                  (subject / "escape").symlink_to("../../outside.bin")
                  original_stat = helper.os.stat
                  swapped = False

                  def stat_then_swap(path, *args, **kwargs):
                      nonlocal swapped
                      metadata = original_stat(path, *args, **kwargs)
                      if path == "escape" and kwargs.get("dir_fd") is not None and not swapped:
                          swapped = True
                          detached = subject.with_name("Build.held")
                          subject.rename(detached)
                          subject.mkdir()
                          (subject / "inside.bin").write_bytes(b"inside")
                          (subject / "escape").symlink_to("inside.bin")
                      return metadata

                  with mock.patch.object(helper.os, "stat", side_effect=stat_then_swap):
                      with self.assertRaises(helper.SelectedXcodeBuildOrchestratorError):
                          helper._lease_descriptor_plan((subject,), repo)
                  self.assertTrue(swapped)

              source = inspect.getsource(helper._lease_descriptor_plan)
              self.assertIn("os.readlink(name, dir_fd=directory_descriptor)", source)
              self.assertNotIn("_validate_internal_symlink(candidate, subject)", source)

'''
          if tests.count(method_anchor) != 1:
              raise SystemExit('test method insertion anchor changed')
          tests = tests.replace(method_anchor, regression + method_anchor, 1)
          test.write_text(tests, encoding='utf-8')
          PY
          git diff --check

      - name: Run focused portable authority regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          git diff --check

      - name: Publish clean permanent repair
        shell: bash
        env:
          BRANCH: hardening/v17-capture-read-lease-held-descriptor-custody-sol-20260814
        run: |
          set -euo pipefail
          rm .github/workflows/capture-read-lease-held-descriptor-materialize.yml
          rm .github/workflows/capture-read-lease-held-descriptor-review-materialize.yml
          expected="$RUNNER_TEMP/expected-product"
          actual="$RUNNER_TEMP/actual-product"
          cat > "$expected" <<'EOF'
          scripts/ci/capture_selected_xcode_build_orchestrator.py
          scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          EOF
          git diff --name-only "$EXACT_PARENT" | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --check
          git config user.name nembra-capture-authority-bot
          git config user.email nembra-capture-authority-bot@users.noreply.github.com
          git add -A
          git commit -m "fix(capture): hold private lease descriptors through grant"
          git push origin "HEAD:$BRANCH"
          echo "NEMBRA_HELD_DESCRIPTOR_LEASE_MATERIALIZED productionChanged=true validationOnly=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false"
