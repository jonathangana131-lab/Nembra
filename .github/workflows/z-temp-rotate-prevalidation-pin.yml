name: Temporary rotate trusted prevalidation pin

on:
  push:
    branches:
      - repair/v14-capture-prevalidation-custody-main-recovery/gpt56-go

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v6

      - name: Rotate exact trusted workflow pin and remove this one-shot
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("scripts/ci/es80_today_trusted_capture_xcode_subject.py"); s=p.read_text(encoding="utf-8"); old="TRUSTED_WORKFLOW_BLOB_SHA = \"37244abb1dc4b1740cf24e83db7b7f9545760ac1\""; new="TRUSTED_WORKFLOW_BLOB_SHA = \"855d11ae2e4491eef692bce33504002155f4c1ee\""; assert s.count(old) == 1, f"expected one old pin, found {s.count(old)}"; p.write_text(s.replace(old, new, 1), encoding="utf-8")'
          rm -f .github/workflows/z-temp-rotate-prevalidation-pin.yml
          git config user.name "nembra-capture-recovery"
          git config user.email "nembra-capture-recovery@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): rotate trusted workflow pin"
          git push origin HEAD:"${GITHUB_REF_NAME}"
