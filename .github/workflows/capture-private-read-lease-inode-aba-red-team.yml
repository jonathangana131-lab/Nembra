name: Capture Private Read Lease Inode ABA Red Team

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_private_read_lease_inode_aba_red_team.py
      - .github/workflows/capture-private-read-lease-inode-aba-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exploit-positive-linux:
    name: Prove three-field planned identity is recyclable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind attacked exact product head and validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          PARENT=aa610e1000e58ba5e43e35a75ee8f22486aea5ec
          git merge-base --is-ancestor "$PARENT" HEAD
          expected="$RUNNER_TEMP/expected"
          actual="$RUNNER_TEMP/actual"
          cat > "$expected" <<'EOF'
          .github/workflows/capture-private-read-lease-inode-aba-red-team.yml
          scripts/ci/tests/test_capture_private_read_lease_inode_aba_red_team.py
          EOF
          git diff --name-only "$PARENT"...HEAD | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --check "$PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run exploit-positive inode ABA witness
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -I \
            scripts/ci/tests/test_capture_private_read_lease_inode_aba_red_team.py

      - name: Pin attacked identity grammar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          target = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef) and node.name == '_metadata_signature'
          )
          returned = ast.unparse(target.body[0].value)
          required = ('metadata.st_dev', 'metadata.st_ino', 'stat.S_IFMT(metadata.st_mode)')
          for fragment in required:
              assert fragment in returned, returned
          assert 'ctime' not in returned.lower(), returned
          assert 'birth' not in returned.lower(), returned
          assert 'gen' not in returned.lower(), returned
          print('EXPLOIT-POSITIVE: current planned identity has no temporal generation discriminator')
          PY

  probe-apfs-baseline:
    name: Probe macOS runner inode reuse without granting authority
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Probe exact three-field tuple reuse on the macOS baseline
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import tempfile
          import time

          helper_path = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py').resolve()
          spec = importlib.util.spec_from_file_location('nembra_apfs_inode_reuse_probe', helper_path)
          if spec is None or spec.loader is None:
              raise SystemExit('could not load selected-Xcode build orchestrator')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)

          observed = False
          attempts = 0
          with tempfile.TemporaryDirectory(prefix='nembra-apfs-inode-reuse-probe-') as temporary:
              target = Path(temporary) / 'accepted-directory'
              target.mkdir()
              expected = helper._path_signature(target)
              original_ctime_ns = target.stat().st_ctime_ns
              target.rmdir()
              time.sleep(0.005)

              for attempts in range(1, 100001):
                  target.mkdir()
                  current = helper._path_signature(target)
                  current_ctime_ns = target.stat().st_ctime_ns
                  if current == expected and current_ctime_ns != original_ctime_ns:
                      observed = True
                      marker = target / 'replacement.marker'
                      marker.write_bytes(b'replacement-generation\n')
                      descriptor = helper._open_pinned_path(target, True, expected)
                      try:
                          marker_descriptor = os.open('replacement.marker', os.O_RDONLY, dir_fd=descriptor)
                          try:
                              payload = os.read(marker_descriptor, 128)
                          finally:
                              os.close(marker_descriptor)
                      finally:
                          os.close(descriptor)
                      if payload != b'replacement-generation\n':
                          raise SystemExit('recycled tuple opened unexpected bytes')
                      break
                  target.rmdir()

          message = (
              f'APFS_REUSE_OBSERVED={1 if observed else 0}; attempts={attempts}; '
              'this probe is diagnostic only and never grants physical authority'
          )
          print(message)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## APFS inode-reuse probe\n\n' + message + '\n')
          PY
