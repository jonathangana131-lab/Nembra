name: Xcode 27 Scheduled PR Exact-Head QA

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: nembra-xcode27-pr-scheduler
  cancel-in-progress: false

env:
  ARTIFACTS_DIR: ${{ github.workspace }}/Artifacts/Xcode27Simulator
  STATUS_CONTEXT: Nembra/Xcode27 Exact Head

jobs:
  resolve:
    name: Select one ungated ready parallel PR
    runs-on: ubuntu-latest
    outputs:
      has_candidate: ${{ steps.pick.outputs.has_candidate }}
      head_sha: ${{ steps.pick.outputs.head_sha }}
      pr_number: ${{ steps.pick.outputs.pr_number }}
      head_ref: ${{ steps.pick.outputs.head_ref }}

    steps:
      - name: Select exact PR head
        id: pick
        uses: actions/github-script@v9
        env:
          STATUS_CONTEXT: ${{ env.STATUS_CONTEXT }}
        with:
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`
            const statusContext = process.env.STATUS_CONTEXT
            const stalePendingMs = 2 * 60 * 60 * 1000

            const { data: repositoryInfo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            const defaultBranch = repositoryInfo.default_branch

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'asc',
              per_page: 100,
            })

            const eligible = []

            for (const pr of pulls) {
              if (pr.draft) continue
              if (pr.base.ref !== defaultBranch) continue
              if (pr.head.repo?.full_name !== repository) continue
              if (!pr.head.ref.startsWith('parallel/')) continue

              const statusResponse = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                per_page: 100,
              })

              const matching = statusResponse.data.statuses
                .filter(status => status.context === statusContext)
                .sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at))

              const latest = matching[0]
              if (latest) {
                if (latest.state === 'pending') {
                  const ageMs = Date.now() - Date.parse(latest.updated_at)
                  if (Number.isFinite(ageMs) && ageMs < stalePendingMs) continue
                } else {
                  continue
                }
              }

              eligible.push(pr)
            }

            eligible.sort((a, b) => {
              const aPriority = (a.body || '').includes('XCODE27_SCHEDULE_PRIORITY: true') ? 1 : 0
              const bPriority = (b.body || '').includes('XCODE27_SCHEDULE_PRIORITY: true') ? 1 : 0
              if (aPriority !== bPriority) return bPriority - aPriority
              return Date.parse(a.updated_at) - Date.parse(b.updated_at)
            })

            const candidate = eligible[0]
            if (!candidate) {
              core.notice('No ready same-repository parallel PR needs an exact-head Xcode gate.')
              core.setOutput('has_candidate', 'false')
              core.setOutput('head_sha', '')
              core.setOutput('pr_number', '')
              core.setOutput('head_ref', '')
              return
            }

            core.notice(`Selected PR #${candidate.number} ${candidate.head.ref}@${candidate.head.sha}`)
            core.setOutput('has_candidate', 'true')
            core.setOutput('head_sha', candidate.head.sha)
            core.setOutput('pr_number', String(candidate.number))
            core.setOutput('head_ref', candidate.head.ref)

  mark-pending:
    name: Mark exact head pending
    needs: resolve
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish pending commit status
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          STATUS_CONTEXT: ${{ env.STATUS_CONTEXT }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Scheduled Xcode 27 exact-head QA queued',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  simulator-qa:
    name: Build, test, and capture exact scheduled PR head
    needs: [resolve, mark-pending]
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          EXPECTED_PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          EXPECTED_HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          printf 'PR: #%s\nHead ref: %s\nExpected exact PR head: %s\nActual checkout head: %s\n' \
            "$EXPECTED_PR_NUMBER" "$EXPECTED_HEAD_REF" "$EXPECTED_HEAD_SHA" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"

      - name: Validate project structure
        run: |
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py
          bash -n scripts/ci/xcode27_simulator_capture.sh

      - name: Validate core package
        working-directory: Packages/NembraCore
        run: swift test

      - name: Build, test, and capture Simulator states
        run: scripts/ci/xcode27_simulator_capture.sh

      - name: Upload Simulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-xcode27-scheduled-pr-${{ needs.resolve.outputs.pr_number }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/Xcode27Simulator
          if-no-files-found: warn
          retention-days: 30

  publish-status:
    name: Publish exact-head result
    needs: [resolve, mark-pending, simulator-qa]
    if: always() && needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish final commit status
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          SIMULATOR_RESULT: ${{ needs.simulator-qa.result }}
          STATUS_CONTEXT: ${{ env.STATUS_CONTEXT }}
        with:
          script: |
            const result = process.env.SIMULATOR_RESULT
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure'
            const description = `Xcode 27 exact-head QA ${result || 'unknown'}`.slice(0, 140)

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state,
              context: process.env.STATUS_CONTEXT,
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
