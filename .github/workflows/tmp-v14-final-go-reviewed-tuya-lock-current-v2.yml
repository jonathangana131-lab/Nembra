name: TEMP V14 Final-GO reviewed Tuya lock convergence v2

on:
  push:
    branches:
      - repair/v14-auth-final-go-reviewed-tuya-lock-current-sol
    paths:
      - .github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current-v2.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3
      - name: Verify failed first materializer left product untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9884b6de6a44f8c8a0ea355c0c7469175b6e90b0"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current-v2.yml"
          test "$(git diff --name-only bccdab041235982ee95a9a4bd366d7b1ec50ccda HEAD | sort)" = $'.github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current-v2.yml\n.github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current.yml'
      - name: Layer reviewed lock authority over current control plane
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            da86226ba36bb2d4f441cc3cb876244af17853cb \
            d8416aeba19b826cfb50bde9e0b3e2778766a286
          git diff --binary \
            da86226ba36bb2d4f441cc3cb876244af17853cb \
            d8416aeba19b826cfb50bde9e0b3e2778766a286 -- \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py \
            > /tmp/reviewed-lock-core.patch
          git apply --3way /tmp/reviewed-lock-core.patch
          test -z "$(git diff --name-only --diff-filter=U)"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py')
          s=p.read_text()
          replacements=[
            (
              '            installer = repository / GO.INSTALLER\n',
              '            accepted_lock = "a" * 64\n            installer = repository / GO.INSTALLER\n'
            ),
            (
              '                f"[[ \\\"${{PATH:-}}\\\" == {GO.TRUSTED_INSTALLER_PATH!r} ]] || exit 46\\n"\n',
              '                f"[[ \\\"${{PATH:-}}\\\" == {GO.TRUSTED_INSTALLER_PATH!r} ]] || exit 46\\n"\n                f"[[ \\\"${{NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256:-}}\\\" == {accepted_lock!r} ]] || exit 47\\n"\n'
            ),
            (
              '            os.environ["NEMBRA_TUYA_APP_KEY"] = "caller-key-must-not-cross"\n',
              '            os.environ["NEMBRA_TUYA_APP_KEY"] = "caller-key-must-not-cross"\n            os.environ["NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256"] = "b" * 64\n'
            ),
            (
              '                result = GO.installer(repository, source, private_device)\n',
              '                result = GO.installer(repository, source, private_device, accepted_lock)\n'
            ),
            (
              '            env = GO.installer_environment(device)\n',
              '            accepted_lock = "c" * 64\n            env = GO.installer_environment(device, accepted_lock)\n'
            ),
            (
              '            self.assertEqual(env["NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE"], str(device))\n',
              '            self.assertEqual(env["NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE"], str(device))\n            self.assertEqual(env["NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256"], accepted_lock)\n'
            ),
            (
              '                GO.installer_environment(alias / "device")\n',
              '                GO.installer_environment(alias / "device", "d" * 64)\n'
            ),
          ]
          for old,new in replacements:
              if s.count(old)!=1: raise SystemExit(f'env custody seam changed: {old!r} count={s.count(old)}')
              s=s.replace(old,new,1)
          marker='    def test_installer_environment_rejects_symlinked_private_device_parent(self) -> None:\n'
          extra='''    def test_noncanonical_tuya_lock_digest_is_rejected_before_installer(self) -> None:
              with tempfile.TemporaryDirectory(prefix="nembra-final-go-lock-shape-") as temporary:
                  device = Path(temporary).resolve(strict=True) / "device"
                  device.write_text("device", encoding="utf-8")
                  device.chmod(0o600)
                  for digest in ("A" * 64, "a" * 63, "not-a-digest"):
                      with self.assertRaises(GO.GoError):
                          GO.installer_environment(device, digest)

'''
          if s.count(marker)!=1: raise SystemExit('symlink test marker changed')
          s=s.replace(marker,extra+marker,1)
          p.write_text(s)
          PY

          grep -Fq 'stable_pr=("number","headSHA","headBranch","base","mainSHA","state","merged","draft")' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq '"mainSHA":main_sha' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'nembra-capture-human-review-github-v2' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'retained signed artifact Tuya dependency lock does not match prebuild GitHub review' scripts/ci/es80_authenticated_stationary_final_go.py
          python3 -B -c 'compile(open("scripts/ci/es80_authenticated_stationary_final_go.py").read(),"issuer","exec"); compile(open("scripts/ci/tests/test_es80_authenticated_stationary_final_go.py").read(),"tests","exec"); compile(open("scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py").read(),"envtests","exec")'
          python3 -B scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 -B scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 -B scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          test -z "$(find scripts/ci -type d -name __pycache__ -print -quit)"
      - name: Self-delete helpers and checkpoint clean convergence
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current.yml \
            .github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current-v2.yml
          expected=$'.github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current-v2.yml\n.github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current.yml\nscripts/ci/es80_authenticated_stationary_final_go.py\nscripts/ci/tests/test_es80_authenticated_stationary_final_go.py\nscripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py'
          actual="$(git diff --name-only bccdab041235982ee95a9a4bd366d7b1ec50ccda | sort)"
          test "$actual" = "$expected"
          git config user.name "nembra-v14-closure-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): bind Final-GO to reviewed Tuya lock"
          git push origin HEAD:repair/v14-auth-final-go-reviewed-tuya-lock-current-sol
