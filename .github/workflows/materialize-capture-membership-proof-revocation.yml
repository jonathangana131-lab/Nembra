name: Materialize Capture membership proof revocation

on:
  push:
    branches:
      - fix/v14-capture-membership-proof-revocation-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product ancestry and owned paths
        shell: bash
        run: |
          set -euo pipefail
          expected=52333deb09ea9a5964250097f83884d285f25d78
          test "$(git merge-base "$expected" HEAD)" = "$expected"
          unexpected="$(git diff --name-only "$expected"...HEAD | grep -Ev '^(Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipProofRevocationSourceTests.swift|\.github/workflows/materialize-capture-membership-proof-revocation.yml)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changed paths:"; echo "$unexpected"; exit 1; }

      - name: Revoke retained membership proof at view exit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          function_start = source.index("    func abandonCorrelationForViewExit()")
          function_end = source.index("    var privateConfig: Bool", function_start)
          cleanup = source[function_start:function_end]
          marker = "        acceptsViewScopedMembershipRequests = false\n"
          if cleanup.count(marker) != 1:
              raise SystemExit(f"Expected one view-exit admission marker, found {cleanup.count(marker)}")
          if "sdkDeviceMembershipVerified = false" in cleanup:
              raise SystemExit("Membership proof is already revoked in the guarded product function")
          insertion = (
              marker
              + "        sdkDeviceMembershipVerified = false\n"
              + "        membershipAccountUID = nil\n"
              + "        membershipDeviceID = nil\n"
          )
          cleanup = cleanup.replace(marker, insertion, 1)
          path.write_text(source[:function_start] + cleanup + source[function_end:])
          PY

      - name: Verify ordering contract without claiming Apple/Xcode acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = source.index("    func abandonCorrelationForViewExit()")
          end = source.index("    var privateConfig: Bool", start)
          cleanup = source[start:end]
          required = [
              "acceptsViewScopedMembershipRequests = false",
              "sdkDeviceMembershipVerified = false",
              "membershipAccountUID = nil",
              "membershipDeviceID = nil",
              "membershipRequestID = UUID()",
              "officialConnectionRequestID = UUID()",
              "if let token = currentConnectionToken",
          ]
          positions = {token: cleanup.index(token) for token in required}
          assert positions[required[0]] < positions[required[1]]
          assert positions[required[1]] < positions[required[4]]
          assert positions[required[2]] < positions[required[4]]
          assert positions[required[3]] < positions[required[4]]
          assert positions[required[4]] < positions[required[5]] < positions[required[6]]

          view_start = source.index("private struct SecureLinkView: View")
          hero = source.index("    private var hero: some View", view_start)
          view = source[view_start:hero]
          task_start = view.index(".task {")
          disappear = view.index(".onDisappear {", task_start)
          task = view[task_start:disappear]
          assert task.index("test.activateMembershipRequestsForView()") < task.index("sdkAccount.bootstrap()") < task.index("test.verifySDKMembership()")
          PY
          git diff --check

      - name: Commit repair and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-membership-proof-revocation.yml
          git config user.name "nembra-sol-worker"
          git config user.email "nembra-sol-worker@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipProofRevocationSourceTests.swift .github/workflows/materialize-capture-membership-proof-revocation.yml
          git diff --cached --check
          git commit -m "fix(capture): revoke view-lifetime membership proof"
          git push origin HEAD:fix/v14-capture-membership-proof-revocation-sol
