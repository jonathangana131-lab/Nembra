name: Capture Private Review Downstream Helper Execution Red Team

on:
  push:
    branches:
      - adversarial/v14-private-review-downstream-helper-exec-sol-20260811
  pull_request:
    paths:
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - Scripts/capture_tuya_private_input_provenance.py
      - Scripts/capture_cocoapods_generated_build_subject.py
      - Scripts/capture_tuya_private_input_build_guard.py
      - scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py
      - .github/workflows/capture-private-review-downstream-helper-execution-redteam.yml

permissions:
  contents: read

jobs:
  downstream-helper-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind to exact checked-out head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile adversarial regression
        run: python3 -m py_compile scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py
      - name: Reject mutable downstream authority helpers
        run: >-
          python3 -m unittest -v
          scripts.ci.tests.test_capture_private_review_downstream_helper_execution_custody
