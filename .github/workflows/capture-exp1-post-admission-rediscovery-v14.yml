name: Capture Experiment One post-admission rediscovery repair

on:
  push:
    branches:
      - feature/capture-exp1-post-admission-rediscovery-v14

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/capture-exp1-post-admission-rediscovery-v14
          fetch-depth: 0
      - name: Apply guarded truth repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          run_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift')
          run = run_path.read_text()
          run = run.replace('import Foundation\nimport NembraCore\n', 'import Dispatch\nimport Foundation\nimport NembraCore\n', 1)
          old = '''        let admissionIdentity: UUID\n        let powerCycleEvidence: PassiveBluetoothExperimentOnePowerCycleEvidence\n        let peripheralIdentifier: UUID\n        let recorder: PassiveCoreBluetoothCaptureRecorder\n'''
          new = '''        let admissionIdentity: UUID\n        let powerCycleEvidence: PassiveBluetoothExperimentOnePowerCycleEvidence\n        let peripheralIdentifier: UUID\n        let recorder: PassiveCoreBluetoothCaptureRecorder\n        let issuedAtUptimeNanoseconds: UInt64\n'''
          assert old in run
          run = run.replace(old, new, 1)
          old = '''            powerCycleEvidence: PassiveBluetoothExperimentOnePowerCycleEvidence,\n            peripheralIdentifier: UUID,\n            recorder: PassiveCoreBluetoothCaptureRecorder\n        ) {\n            self.admissionIdentity = admissionIdentity\n            self.powerCycleEvidence = powerCycleEvidence\n            self.peripheralIdentifier = peripheralIdentifier\n            self.recorder = recorder\n        }\n'''
          new = '''            powerCycleEvidence: PassiveBluetoothExperimentOnePowerCycleEvidence,\n            peripheralIdentifier: UUID,\n            recorder: PassiveCoreBluetoothCaptureRecorder,\n            issuedAtUptimeNanoseconds: UInt64\n        ) {\n            self.admissionIdentity = admissionIdentity\n            self.powerCycleEvidence = powerCycleEvidence\n            self.peripheralIdentifier = peripheralIdentifier\n            self.recorder = recorder\n            self.issuedAtUptimeNanoseconds = issuedAtUptimeNanoseconds\n        }\n'''
          assert old in run
          run = run.replace(old, new, 1)
          old = '''        powerCycleEvidence: PassiveBluetoothExperimentOnePowerCycleEvidence,\n        peripheralIdentifier: UUID,\n        recorder: PassiveCoreBluetoothCaptureRecorder\n    ) {\n        payload = Payload(\n            admissionIdentity: UUID(),\n            powerCycleEvidence: powerCycleEvidence,\n            peripheralIdentifier: peripheralIdentifier,\n            recorder: recorder\n        )\n    }\n'''
          new = '''        powerCycleEvidence: PassiveBluetoothExperimentOnePowerCycleEvidence,\n        peripheralIdentifier: UUID,\n        recorder: PassiveCoreBluetoothCaptureRecorder,\n        issuedAtUptimeNanoseconds: UInt64\n    ) {\n        payload = Payload(\n            admissionIdentity: UUID(),\n            powerCycleEvidence: powerCycleEvidence,\n            peripheralIdentifier: peripheralIdentifier,\n            recorder: recorder,\n            issuedAtUptimeNanoseconds: issuedAtUptimeNanoseconds\n        )\n    }\n'''
          assert old in run
          run = run.replace(old, new, 1)
          old = '''        let recorder = try beginCaptureRecorder(startedAt: startedAt)\n        return PassiveBluetoothExperimentOneCaptureAdmission(\n            powerCycleEvidence: evidence,\n            peripheralIdentifier: peripheralIdentifier,\n            recorder: recorder\n        )\n'''
          new = '''        let recorder = try beginCaptureRecorder(startedAt: startedAt)\n        let issuedAtUptimeNanoseconds = DispatchTime.now().uptimeNanoseconds\n        return PassiveBluetoothExperimentOneCaptureAdmission(\n            powerCycleEvidence: evidence,\n            peripheralIdentifier: peripheralIdentifier,\n            recorder: recorder,\n            issuedAtUptimeNanoseconds: issuedAtUptimeNanoseconds\n        )\n'''
          assert old in run
          run = run.replace(old, new, 1)
          run_path.write_text(run)

          controller_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift')
          controller = controller_path.read_text()
          old = '''        case experimentOneVehicleContextMismatch\n        case targetNotSelected\n'''
          new = '''        case experimentOneVehicleContextMismatch\n        case experimentOnePostAdmissionRediscoveryRequired(UUID)\n        case targetNotSelected\n'''
          assert old in controller
          controller = controller.replace(old, new, 1)
          old = '''        guard let peripheral = peripheralByIdentifier[payload.peripheralIdentifier],\n              let discovery = latestDiscoveryByIdentifier[payload.peripheralIdentifier] else {\n            throw ControllerError.unknownPeripheral(payload.peripheralIdentifier)\n        }\n        if discovery.isConnectable == false {\n            throw ControllerError.peripheralNotConnectable(payload.peripheralIdentifier)\n        }\n'''
          new = '''        guard let peripheral = peripheralByIdentifier[payload.peripheralIdentifier],\n              let discovery = latestDiscoveryByIdentifier[payload.peripheralIdentifier] else {\n            throw ControllerError.unknownPeripheral(payload.peripheralIdentifier)\n        }\n        guard let latestAdvertisement = latestAdvertisementByIdentifier[payload.peripheralIdentifier],\n              latestAdvertisement.receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds else {\n            throw ControllerError.experimentOnePostAdmissionRediscoveryRequired(payload.peripheralIdentifier)\n        }\n        if discovery.isConnectable == false {\n            throw ControllerError.peripheralNotConnectable(payload.peripheralIdentifier)\n        }\n'''
          assert old in controller
          controller = controller.replace(old, new, 1)
          old = '''        let latestAdvertisement = latestAdvertisementByIdentifier[payload.peripheralIdentifier]\n        guard observationBoundaryQueueGate.resetForNewCaptureSession() else {\n'''
          new = '''        guard observationBoundaryQueueGate.resetForNewCaptureSession() else {\n'''
          assert old in controller
          controller = controller.replace(old, new, 1)
          old = '''        if let latestAdvertisement {\n            enqueue(\n                .advertisement(latestAdvertisement.observation),\n                receivedAtUptimeNanoseconds: latestAdvertisement.receivedAtUptimeNanoseconds,\n                receivedAtDate: latestAdvertisement.receivedAtDate\n            )\n        }\n'''
          new = '''        enqueue(\n            .advertisement(latestAdvertisement.observation),\n            receivedAtUptimeNanoseconds: latestAdvertisement.receivedAtUptimeNanoseconds,\n            receivedAtDate: latestAdvertisement.receivedAtDate\n        )\n'''
          assert old in controller
          controller = controller.replace(old, new, 1)
          controller_path.write_text(controller)

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift')
          test_path.write_text('''import Foundation\nimport Testing\n@testable import NembraBluetoothCapture\n\n/// Software monotonic provenance contract for the Experiment One handoff.\n/// This proves callback chronology only; it does not claim BLE/RF emission time or physical ES80 identity.\nstruct ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests {\n    private static func source(named filename: String) throws -> String {\n        let testFile = URL(fileURLWithPath: #filePath)\n        let packageRoot = testFile\n            .deletingLastPathComponent()\n            .deletingLastPathComponent()\n            .deletingLastPathComponent()\n        return try String(\n            contentsOf: packageRoot\n                .appendingPathComponent("Sources")\n                .appendingPathComponent("NembraBluetoothCapture")\n                .appendingPathComponent(filename),\n            encoding: .utf8\n        )\n    }\n\n    private static func controllerSource() throws -> String {\n        try source(named: "ForegroundCoreBluetoothCaptureController.swift")\n    }\n\n    private static func runSource() throws -> String {\n        try source(named: "PassiveBluetoothExperimentOneRun.swift")\n    }\n\n    private static func consumerBody(_ source: String) throws -> Substring {\n        let start = try #require(source.range(of: "func connectUsingExperimentOneAdmission("))\n        let end = try #require(\n            source.range(\n                of: "public func cancelActiveConnection()",\n                range: start.upperBound..<source.endIndex\n            )\n        )\n        return source[start.lowerBound..<end.lowerBound]\n    }\n\n    @Test("sealed admission carries the producer-issued monotonic handoff boundary")\n    func admissionCarriesIssuedUptime() throws {\n        let source = try Self.runSource()\n        #expect(source.contains("issuedAtUptimeNanoseconds"))\n        #expect(source.contains("DispatchTime.now().uptimeNanoseconds"))\n    }\n\n    @Test("controller requires rediscovery after admission before installing its recorder")\n    func currentCatalogMustBePostAdmissionEvidence() throws {\n        let body = try Self.consumerBody(try Self.controllerSource())\n        let latestAdvertisement = try #require(\n            body.range(of: "latestAdvertisementByIdentifier[payload.peripheralIdentifier]")\n        )\n        let freshness = try #require(\n            body.range(of: "receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds")\n        )\n        let selectTarget = try #require(\n            body.range(of: "targetState.selectTarget(payload.peripheralIdentifier)")\n        )\n        let installRecorder = try #require(body.range(of: "recorder = payload.recorder"))\n\n        #expect(latestAdvertisement.lowerBound < freshness.lowerBound)\n        #expect(freshness.lowerBound < selectTarget.lowerBound)\n        #expect(freshness.lowerBound < installRecorder.lowerBound)\n    }\n\n    @Test("stale catalog evidence fails with a dedicated rediscovery error before recorder publication")\n    func staleCatalogHasExplicitFailure() throws {\n        let body = try Self.consumerBody(try Self.controllerSource())\n        let error = try #require(\n            body.range(of: "experimentOnePostAdmissionRediscoveryRequired(payload.peripheralIdentifier)")\n        )\n        let installRecorder = try #require(body.range(of: "recorder = payload.recorder"))\n        #expect(error.lowerBound < installRecorder.lowerBound)\n    }\n}\n''')
          PY
          git diff --check
          rm .github/workflows/capture-exp1-post-admission-rediscovery-v14.yml
          git status --short
      - name: Commit durable product repair
        shell: bash
        run: |
          git config user.name "nembra-go-worker"
          git config user.email "nembra-go-worker@users.noreply.github.com"
          git add -A
          git commit -m "[Capture Experiment One] Require post-admission rediscovery"
          git push origin HEAD:feature/capture-exp1-post-admission-rediscovery-v14
