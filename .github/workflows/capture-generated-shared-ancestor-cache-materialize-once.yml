name: Capture Generated Shared Ancestor Cache Materialize Once

on:
  pull_request:
    paths:
      - .github/workflows/capture-generated-shared-ancestor-cache-materialize-once.yml
  push:
    branches:
      - repair/v17-capture-generated-shared-ancestor-cache-sol-20260814
    paths:
      - .github/workflows/capture-generated-shared-ancestor-cache-materialize-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-generated-shared-ancestor-cache-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  EXACT_PARENT: fe40c025eb10247c73820f4001ab63affaa60af7

jobs:
  materialize:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind one-shot authoring scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = ".github/workflows/capture-generated-shared-ancestor-cache-materialize-once.yml"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize shared-ancestor descriptor continuity
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path

          helper_path = Path("scripts/ci/capture_accepted_build_input_snapshot.py")
          helper = helper_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          old_open = '''def _open_subject(root_fd: int, subject: Path) -> tuple[int, os.stat_result, str]:
              _safe_relative(subject)
              expected_kind = _GENERATED_SUBJECT_KINDS.get(subject)
              if expected_kind is None:
                  raise AcceptedBuildInputSnapshotError(f"unrecognized generated subject: {subject}")
              current = os.dup(root_fd)
              try:
                  for index, component in enumerate(subject.parts):
                      relative = Path(*subject.parts[: index + 1])
                      is_last = index == len(subject.parts) - 1
                      if is_last and expected_kind == "file":
                          descriptor, metadata = _open_file_at(current, component, relative)
                          os.close(current)
                          return descriptor, metadata, "file"
                      child = _open_directory_at(current, component, relative)
                      os.close(current)
                      current = child
                  metadata = os.fstat(current)
                  return current, metadata, "directory"
              except Exception:
                  try:
                      os.close(current)
                  except OSError:
                      pass
                  raise


'''.replace("          ", "")
          new_open = '''def _open_subject(
              root_fd: int,
              subject: Path,
              directory_cache: dict[Path, int] | None = None,
          ) -> tuple[int, os.stat_result, str]:
              _safe_relative(subject)
              expected_kind = _GENERATED_SUBJECT_KINDS.get(subject)
              if expected_kind is None:
                  raise AcceptedBuildInputSnapshotError(f"unrecognized generated subject: {subject}")
              current = os.dup(root_fd)
              try:
                  for index, component in enumerate(subject.parts):
                      relative = Path(*subject.parts[: index + 1])
                      is_last = index == len(subject.parts) - 1
                      if not is_last and directory_cache is not None and relative in directory_cache:
                          os.close(current)
                          current = os.dup(directory_cache[relative])
                          continue
                      if is_last and expected_kind == "file":
                          descriptor, metadata = _open_file_at(current, component, relative)
                          os.close(current)
                          return descriptor, metadata, "file"
                      child = _open_directory_at(current, component, relative)
                      if not is_last and directory_cache is not None:
                          if relative in directory_cache:
                              os.close(child)
                              raise AcceptedBuildInputSnapshotError(
                                  f"duplicate generated selector-cache admission: {relative}"
                              )
                          directory_cache[relative] = os.dup(child)
                      os.close(current)
                      current = child
                  metadata = os.fstat(current)
                  return current, metadata, "directory"
              except Exception:
                  try:
                      os.close(current)
                  except OSError:
                      pass
                  raise


def _close_directory_cache(directory_cache: dict[Path, int]) -> None:
              for descriptor in reversed(tuple(directory_cache.values())):
                  try:
                      os.close(descriptor)
                  except OSError:
                      pass
              directory_cache.clear()


'''.replace("          ", "")
          helper = replace_once(helper, old_open, new_open, "open-subject cache repair")

          old_manifest = '''    root_fd = _open_repository_root(root)
              try:
                  for subject in GENERATED_SUBJECTS:
                      if subject in seen:
                          raise AcceptedBuildInputSnapshotError(f"overlapping build-input subject: {subject}")
                      descriptor, metadata, kind = _open_subject(root_fd, subject)
                      try:
                          record: dict[str, object] = {"path": subject.as_posix()}
                          if kind == "file":
                              digest, size, after = _hash_open_file(descriptor, subject)
                              if not _same_object(metadata, after):
                                  raise AcceptedBuildInputSnapshotError(
                                      f"generated subject changed identity while reading: {subject}"
                                  )
                              record.update(
                                  type="file",
                                  sha256=digest,
                                  size=size,
                                  executable=bool(metadata.st_mode & (stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)),
                              )
                              seen.add(subject)
                              records.append(record)
                          else:
                              record.update(type="directory")
                              seen.add(subject)
                              records.append(record)
                              _manifest_directory(descriptor, subject, records, seen)
                      finally:
                          os.close(descriptor)
              finally:
                  os.close(root_fd)
'''.replace("          ", "")
          new_manifest = '''    root_fd = _open_repository_root(root)
              directory_cache: dict[Path, int] = {}
              try:
                  for subject in GENERATED_SUBJECTS:
                      if subject in seen:
                          raise AcceptedBuildInputSnapshotError(f"overlapping build-input subject: {subject}")
                      descriptor, metadata, kind = _open_subject(root_fd, subject, directory_cache)
                      try:
                          record: dict[str, object] = {"path": subject.as_posix()}
                          if kind == "file":
                              digest, size, after = _hash_open_file(descriptor, subject)
                              if not _same_object(metadata, after):
                                  raise AcceptedBuildInputSnapshotError(
                                      f"generated subject changed identity while reading: {subject}"
                                  )
                              record.update(
                                  type="file",
                                  sha256=digest,
                                  size=size,
                                  executable=bool(metadata.st_mode & (stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)),
                              )
                              seen.add(subject)
                              records.append(record)
                          else:
                              record.update(type="directory")
                              seen.add(subject)
                              records.append(record)
                              _manifest_directory(descriptor, subject, records, seen)
                      finally:
                          os.close(descriptor)
              finally:
                  _close_directory_cache(directory_cache)
                  os.close(root_fd)
'''.replace("          ", "")
          helper = replace_once(helper, old_manifest, new_manifest, "manifest cache lifetime")

          old_copy = '''def _copy_generated_subjects(source_root: Path, destination_root: Path) -> None:
              source_root = _absolute(source_root)
              destination_root = _absolute(destination_root)
              root_fd = _open_repository_root(source_root)
              try:
                  for subject in GENERATED_SUBJECTS:
                      descriptor, metadata, kind = _open_subject(root_fd, subject)
                      try:
                          if kind == "file":
                              _copy_open_file(
                                  descriptor,
                                  metadata,
                                  destination_root / subject,
                                  subject,
                              )
                          else:
                              _copy_directory_fd(descriptor, destination_root, subject)
                      finally:
                          os.close(descriptor)
              finally:
                  os.close(root_fd)
'''.replace("          ", "")
          new_copy = '''def _copy_generated_subjects(source_root: Path, destination_root: Path) -> None:
              source_root = _absolute(source_root)
              destination_root = _absolute(destination_root)
              root_fd = _open_repository_root(source_root)
              directory_cache: dict[Path, int] = {}
              try:
                  for subject in GENERATED_SUBJECTS:
                      descriptor, metadata, kind = _open_subject(root_fd, subject, directory_cache)
                      try:
                          if kind == "file":
                              _copy_open_file(
                                  descriptor,
                                  metadata,
                                  destination_root / subject,
                                  subject,
                              )
                          else:
                              _copy_directory_fd(descriptor, destination_root, subject)
                      finally:
                          os.close(descriptor)
              finally:
                  _close_directory_cache(directory_cache)
                  os.close(root_fd)
'''.replace("          ", "")
          helper = replace_once(helper, old_copy, new_copy, "copy cache lifetime")
          compile(helper, str(helper_path), "exec", dont_inherit=True)
          helper_path.write_text(helper, encoding="utf-8")

          regression = r'''#!/usr/bin/env python3
          """Permanent regression for coherent shared generated-selector ancestry."""
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import tempfile
          import unittest
          from unittest import mock

          REPOSITORY = Path(__file__).resolve().parents[3]
          HELPER = REPOSITORY / "scripts/ci/capture_accepted_build_input_snapshot.py"
          SOURCE_SHA = "a" * 40

          def load():
              spec = importlib.util.spec_from_file_location("nembra_shared_ancestor_continuity", HELPER)
              if spec is None or spec.loader is None:
                  raise RuntimeError("could not load accepted build-input helper")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          def seed_common(root: Path) -> None:
              (root / "Podfile.lock").write_text("PODS:\n  - Synthetic\n", encoding="utf-8")
              workspace = root / "NembraCapture.xcworkspace"
              workspace.mkdir()
              (workspace / "contents.xcworkspacedata").write_text("<Workspace/>\n", encoding="utf-8")
              pods = root / "Pods"
              pods.mkdir()
              (pods / "SyntheticPod.swift").write_text("// pod\n", encoding="utf-8")

          def make_generation(root: Path, name: str, sdk: bytes, runtime: bytes) -> Path:
              generation = root / name
              sdk_root = generation / "TuyaSDK"
              runtime_root = generation / "TuyaRuntime"
              sdk_root.mkdir(parents=True)
              runtime_root.mkdir(parents=True)
              (sdk_root / "sdk.bin").write_bytes(sdk)
              (runtime_root / "identity.bin").write_bytes(runtime)
              return generation

          def entry_sha(payload: dict[str, object], path: str) -> str:
              for entry in payload["entries"]:
                  if entry.get("path") == path:
                      return str(entry["sha256"])
              raise AssertionError(f"manifest entry missing: {path}")

          class CaptureGeneratedSharedAncestorContinuityTests(unittest.TestCase):
              def test_manifest_holds_one_localsecrets_generation_across_private_subjects(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-shared-ancestor-continuity-") as raw:
                      root = Path(raw)
                      seed_common(root)
                      generation_a = make_generation(root, "LocalSecrets.A", b"SDK-A\n", b"RUNTIME-A\n")
                      generation_b = make_generation(root, "LocalSecrets.B", b"SDK-B\n", b"RUNTIME-B\n")
                      generation_a.rename(root / "LocalSecrets")
                      pure_a = helper.canonical_generated_manifest(root, SOURCE_SHA)
                      original_open = helper._open_subject
                      swapped = False

                      def swap_before_runtime(root_fd: int, subject: Path, directory_cache=None):
                          nonlocal swapped
                          if subject == Path("LocalSecrets/TuyaRuntime") and not swapped:
                              (root / "LocalSecrets").rename(root / "LocalSecrets.A.attack")
                              generation_b.rename(root / "LocalSecrets")
                              swapped = True
                          return original_open(root_fd, subject, directory_cache)

                      with mock.patch.object(helper, "_open_subject", side_effect=swap_before_runtime):
                          held = helper.canonical_generated_manifest(root, SOURCE_SHA)
                      self.assertTrue(swapped)
                      self.assertEqual(held, pure_a)
                      payload = json.loads(held)
                      self.assertEqual(
                          entry_sha(payload, "LocalSecrets/TuyaSDK/sdk.bin"),
                          hashlib.sha256(b"SDK-A\n").hexdigest(),
                      )
                      self.assertEqual(
                          entry_sha(payload, "LocalSecrets/TuyaRuntime/identity.bin"),
                          hashlib.sha256(b"RUNTIME-A\n").hexdigest(),
                      )

              def test_copy_holds_one_localsecrets_generation_across_private_subjects(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-shared-ancestor-copy-") as raw:
                      root = Path(raw)
                      seed_common(root)
                      generation_a = make_generation(root, "LocalSecrets.A", b"SDK-A\n", b"RUNTIME-A\n")
                      generation_b = make_generation(root, "LocalSecrets.B", b"SDK-B\n", b"RUNTIME-B\n")
                      generation_a.rename(root / "LocalSecrets")
                      destination = root / "stage"
                      destination.mkdir()
                      original_open = helper._open_subject
                      swapped = False

                      def swap_before_runtime(root_fd: int, subject: Path, directory_cache=None):
                          nonlocal swapped
                          if subject == Path("LocalSecrets/TuyaRuntime") and not swapped:
                              (root / "LocalSecrets").rename(root / "LocalSecrets.A.attack")
                              generation_b.rename(root / "LocalSecrets")
                              swapped = True
                          return original_open(root_fd, subject, directory_cache)

                      with mock.patch.object(helper, "_open_subject", side_effect=swap_before_runtime):
                          helper._copy_generated_subjects(root, destination)
                      self.assertTrue(swapped)
                      self.assertEqual((destination / "LocalSecrets/TuyaSDK/sdk.bin").read_bytes(), b"SDK-A\n")
                      self.assertEqual(
                          (destination / "LocalSecrets/TuyaRuntime/identity.bin").read_bytes(),
                          b"RUNTIME-A\n",
                      )

          if __name__ == "__main__":
              unittest.main(verbosity=2)
          '''
          regression = "\n".join(line[10:] if line.startswith("          ") else line for line in regression.splitlines()) + "\n"
          regression_path = Path("scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py")
          compile(regression, str(regression_path), "exec", dont_inherit=True)
          regression_path.write_text(regression, encoding="utf-8")

          permanent_workflow = r'''name: Capture Generated Shared Ancestor Continuity

          on:
            pull_request:
              paths:
                - scripts/ci/capture_accepted_build_input_snapshot.py
                - scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
                - .github/workflows/capture-generated-shared-ancestor-continuity.yml
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: capture-generated-shared-ancestor-continuity-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          env:
            EXACT_PARENT: fe40c025eb10247c73820f4001ab63affaa60af7

          jobs:
            exact-portable:
              runs-on: ubuntu-latest
              timeout-minutes: 8
              steps:
                - uses: actions/checkout@v6
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0
                    persist-credentials: false
                - name: Bind serial repair delta and run full admission regressions
                  shell: bash
                  run: |
                    set -euo pipefail
                    expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "$expected_head"
                    test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
                    changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
                    expected="$(printf '%s\n' \
                      .github/workflows/capture-generated-shared-ancestor-continuity.yml \
                      scripts/ci/capture_accepted_build_input_snapshot.py \
                      scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
                    test "$changed" = "$expected"
                    git diff --check "$EXACT_PARENT"...HEAD
                    export PYTHONDONTWRITEBYTECODE=1
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
                    /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
                    test -z "$(git status --porcelain=v1 --untracked-files=all)"
          '''
          permanent_workflow = "\n".join(line[10:] if line.startswith("          ") else line for line in permanent_workflow.splitlines()) + "\n"
          Path(".github/workflows/capture-generated-shared-ancestor-continuity.yml").write_text(permanent_workflow, encoding="utf-8")
          PY

          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py

      - name: Replace authoring shim with permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/capture-generated-shared-ancestor-cache-materialize-once.yml
          git add \
            .github/workflows/capture-generated-shared-ancestor-continuity.yml \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git diff --cached --check
          changed="$(git diff --cached --name-only "$EXACT_PARENT" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-generated-shared-ancestor-continuity.yml \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git config user.name "nembra-capture-swarm"
          git config user.email "nembra-capture-swarm@users.noreply.github.com"
          git commit -m "security(capture): hold shared generated selector ancestors"
          target_ref="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git push origin HEAD:"$target_ref"
