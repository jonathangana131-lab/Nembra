name: Capture Private Read Lease Symlink Generation Race Red Team

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/ci/tests/test_capture_private_read_lease_symlink_generation_race_red_team.py
      - .github/workflows/capture-private-read-lease-symlink-generation-race-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-private-read-lease-symlink-generation-race-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 474507966619ce39288b20de29066711088cd986
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  exploit-positive:
    name: Expose pathname-raced symlink classification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact held-descriptor product and validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-symlink-generation-race-red-team.yml \
            scripts/ci/tests/test_capture_private_read-lease-symlink-generation-race-red-team.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exploit oracle without bytecode artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          path=Path('scripts/ci/tests/test_capture_private_read_lease_symlink_generation_race_red_team.py')
          compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
          PY

      - name: Require exploit-positive symlink generation race
        shell: bash
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          set +e
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_symlink_generation_race_red_team.py >"$output_file" 2>&1
          status=$?
          set -e
          cat "$output_file"
          if [ "$status" -ne 0 ]; then
            encoded="$(/usr/bin/python3 - "$output_file" <<'PY'
          from pathlib import Path
          import sys
          from urllib.parse import quote
          print(quote(Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace'), safe=''))
          PY
          )"
            printf '::error title=Symlink generation oracle failed (%s)::%s\n' "$RUNNER_OS" "$encoded"
            exit "$status"
          fi

      - name: Preserve held-descriptor component regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py

      - name: Preserve validation-only head and truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'NEMBRA_SYMLINK_GENERATION_BOUNDARY exploitPositive=true productionBytesChanged=false privateACLAuthorityMocked=true deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false'
