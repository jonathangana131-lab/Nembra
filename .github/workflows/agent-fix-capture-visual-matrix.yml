name: Agent fix Capture visual matrix

on:
  push:
    branches:
      - qa/es80-v14-capture-visual-matrix-gpt56

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/es80-v14-capture-visual-matrix-gpt56
          fetch-depth: 0

      - name: Correct representative correlation state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraUITests/ES80ResearchCaptureUITests.swift')
          s = p.read_text(encoding='utf-8')
          old = 'scenario: "firstPoweredOff",\n                requiredText: "Scooter OFF",\n                requiredIdentifier: "es80.capture.begin-window",\n                screenshotName: "Nembra Capture V14 — SIMULATOR QA — OFF 1 Ready"'
          new = 'scenario: "secondPoweredOff",\n                requiredText: "Scooter OFF",\n                requiredIdentifier: "es80.capture.begin-window",\n                screenshotName: "Nembra Capture V14 — SIMULATOR QA — OFF 2 Ready"'
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale correlation expectation, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -F 'scenario: "secondPoweredOff"' NembraUITests/ES80ResearchCaptureUITests.swift
          ! grep -F 'SIMULATOR QA — OFF 1 Ready' NembraUITests/ES80ResearchCaptureUITests.swift
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -frontend -parse NembraUITests/ES80ResearchCaptureUITests.swift
          fi

      - name: Self-delete helper and checkpoint correction
        shell: bash
        run: |
          rm .github/workflows/agent-fix-capture-visual-matrix.yml
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraUITests/ES80ResearchCaptureUITests.swift .github/workflows/agent-fix-capture-visual-matrix.yml
          git diff --cached --check
          git commit -m 'test(capture): use reachable OFF correlation fixture'
          git push origin HEAD:qa/es80-v14-capture-visual-matrix-gpt56
