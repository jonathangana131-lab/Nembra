name: V14 Capture Secret Prefix Custody 1138

on:
  push:
    branches:
      - fix/v14-capture-secret-prefix-custody-1138-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: fix/v14-capture-secret-prefix-custody-1138-sol
      - name: Materialize and validate exact-current repair
        shell: bash
        run: |
          set -euo pipefail
          PARENT='1138e0e953b0e2855d849e02d02e40b643a876ac'
          APP='NembraApp/App/NembraCaptureEntrypoint.swift'
          TEST='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift'
          test "$(git rev-parse HEAD~2)" = "$PARENT"
          python3 tools/v14_secret_prefix_custody_materialize.py
          swiftc -parse "$APP"
          swiftc -parse "$TEST"
          git add "$APP" "$TEST"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '2'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$APP"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST"
          python3 - <<'PY'
          secrets = ["abc", "abcdef"]
          secrets = sorted((s for s in secrets if s), key=lambda s: (-len(s), s))
          rendered = "abcdef"
          for secret in secrets:
              rendered = rendered.replace(secret, "<redacted>")
          assert rendered == "<redacted>", rendered
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-secret-prefix-custody-1138.yml tools/v14_secret_prefix_custody_materialize.py
          git commit -m 'fix(capture): redact overlapping secrets longest-first'
          git push origin HEAD:fix/v14-capture-secret-prefix-custody-1138-sol
