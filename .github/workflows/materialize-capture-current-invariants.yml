name: Materialize Capture Current Invariants

on:
  push:
    branches:
      - sol/v14-capture-current-invariants-1c408-r1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact flagship parent
        shell: bash
        run: |
          set -euo pipefail
          expected='1c40853f6991b4d09206df1d25ecff021458b7eb'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected"
          changed="$(git diff --name-only "$expected"..HEAD)"
          test "$changed" = '.github/workflows/materialize-capture-current-invariants.yml'

      - name: Apply current-product truth repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = app.read_text()

          revoked = '''        sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipRequestID = UUID()
          '''
          repaired = '''        sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipStatus = "Exact scooter membership must be verified again for this Secure Link session."
                  membershipRequestID = UUID()
          '''
          count = source.count(revoked)
          if count != 2:
              raise SystemExit(f'expected exactly two view/foreground membership-revocation blocks, found {count}')
          source = source.replace(revoked, repaired)

          insertion_anchor = '''    private func receivedApplicationUpdate(
                  _ update: [String: String],
                  token: TuyaReadOnlyConnectionToken
              ) async {
          '''
          if source.count(insertion_anchor) != 1:
              raise SystemExit('receivedApplicationUpdate anchor drifted')

          helper = '''    private func redactVerifiedAccountUID(in update: [String: String]) -> [String: String] {
                  guard let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),
                        !verifiedAccountUID.isEmpty else {
                      return update
                  }

                  let marker = "<redacted-account-uid>"
                  var sanitized: [String: String] = [:]
                  for key in update.keys.sorted() {
                      guard let value = update[key] else { continue }
                      let safeKey = key.replacingOccurrences(
                          of: verifiedAccountUID,
                          with: marker,
                          options: [.caseInsensitive]
                      )
                      let safeValue = value.replacingOccurrences(
                          of: verifiedAccountUID,
                          with: marker,
                          options: [.caseInsensitive]
                      )

                      var outputKey = safeKey
                      var collision = 2
                      while sanitized[outputKey] != nil {
                          outputKey = "\\(safeKey) [redacted-key-\\(collision)]"
                          collision += 1
                      }
                      sanitized[outputKey] = safeValue
                  }
                  return sanitized
              }

          '''
          source = source.replace(insertion_anchor, helper + insertion_anchor)

          old_receipt = '''            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)
                      await refreshLedgerSnapshot()
                      log("tuya_application_update", update.merging([
                          "generation": String(token.diagnosticGeneration)
                      ]) { current, _ in current })
          '''
          new_receipt = '''            let custodySafeUpdate = redactVerifiedAccountUID(in: update)
                      try await sessionLedger.recordApplicationUpdate(isNonEmpty: !custodySafeUpdate.isEmpty, for: token)
                      await refreshLedgerSnapshot()
                      log("tuya_application_update", custodySafeUpdate.merging([
                          "generation": String(token.diagnosticGeneration)
                      ]) { _, trusted in trusted })
          '''
          if source.count(old_receipt) != 1:
              raise SystemExit('application update custody block drifted')
          source = source.replace(old_receipt, new_receipt)

          duplicate = '''        "refreshtoken",
                  "sessionkey",
                  "authkey",
          '''
          simplified = '''        "refreshtoken",
                  "authkey",
          '''
          if source.count(duplicate) != 1:
              raise SystemExit('sessionkey duplicate simplification anchor drifted')
          source = source.replace(duplicate, simplified)

          app.write_text(source)

          tests = {
          'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift': r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Secure Link view-exit membership status revocation")
          struct TuyaSecureLinkViewMembershipStatusRevocationSourceTests {
              @Test("view exit cannot retain verified membership copy after revoking the membership proof")
              func exitRevokesMembershipStatusWithProof() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = String(try section(
                      in: source,
                      from: "private final class SecureLinkController",
                      to: "@MainActor\nprivate protocol OfficialTuyaDriver"
                  ))
                  let cleanup = String(try section(
                      in: controller,
                      from: "func abandonCorrelationForViewExit()",
                      to: "func appDidLoseForeground()"
                  ))

                  let clearVerified = try requiredOffset(containing: "sdkDeviceMembershipVerified = false", in: cleanup)
                  let statusReset = try requiredOffset(containing: "membershipStatus =", in: cleanup)
                  let revokeMembershipRequest = try requiredOffset(containing: "membershipRequestID = UUID()", in: cleanup)

                  #expect(clearVerified < statusReset)
                  #expect(statusReset < revokeMembershipRequest)
                  #expect(cleanup.contains("verified again for this Secure Link session"))
                  #expect(!cleanup.contains("membershipStatus = \"Exact scooter membership verified and leased to this current SDK account.\""))
              }

              private func requiredOffset(containing token: String, in source: String) throws -> String.Index {
                  guard let range = source.range(of: token) else {
                      Issue.record("Expected source token missing: \(token)")
                      throw SourceContractError.sectionMissing
                  }
                  return range.lowerBound
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          ''',
          'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaForegroundMembershipStatusRevocationSourceTests.swift': r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Secure Link foreground membership status revocation")
          struct TuyaForegroundMembershipStatusRevocationSourceTests {
              @Test("foreground loss revokes positive membership copy with membership authority")
              func foregroundLossResetsMembershipStatusBeforeRequestRotation() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let cleanup = String(try section(
                      in: source,
                      from: "func appDidLoseForeground()",
                      to: "var privateConfig: Bool"
                  ))

                  let clearVerified = try requiredOffset(containing: "sdkDeviceMembershipVerified = false", in: cleanup)
                  let statusReset = try requiredOffset(containing: "membershipStatus =", in: cleanup)
                  let revokeMembershipRequest = try requiredOffset(containing: "membershipRequestID = UUID()", in: cleanup)

                  #expect(clearVerified < statusReset)
                  #expect(statusReset < revokeMembershipRequest)
                  #expect(cleanup.contains("verified again for this Secure Link session"))
                  #expect(!cleanup.contains("membershipStatus = \"Exact scooter membership verified and leased to this current SDK account.\""))
              }

              private func requiredOffset(containing token: String, in source: String) throws -> String.Index {
                  guard let range = source.range(of: token) else {
                      Issue.record("Expected source token missing: \(token)")
                      throw SourceContractError.sectionMissing
                  }
                  return range.lowerBound
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          ''',
          'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift': r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application event metadata precedence")
          struct TuyaApplicationEventMetadataPrecedenceSourceTests {
              @Test("SDK application keys cannot overwrite Nembra generation provenance")
              func trustedGenerationWinsReservedKeyCollision() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let receiver = String(try section(
                      in: source,
                      from: "private func receivedApplicationUpdate(",
                      to: "private func startWatchdog"
                  ))

                  #expect(receiver.contains("log(\"tuya_application_update\""))
                  #expect(receiver.contains("\"generation\": String(token.diagnosticGeneration)"))
                  #expect(!receiver.contains(") { current, _ in current })"))
                  #expect(receiver.contains(") { _, trusted in trusted })"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          ''',
          'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift': r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application account-UID export custody")
          struct TuyaApplicationAccountUIDExportCustodySourceTests {
              @Test("accepted application evidence redacts the verified account UID before event custody")
              func applicationEvidenceCannotExportVerifiedAccountUID() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let receiver = String(try section(
                      in: source,
                      from: "private func receivedApplicationUpdate(",
                      to: "private func startWatchdog"
                  ))
                  let helper = String(try section(
                      in: source,
                      from: "private func redactVerifiedAccountUID(",
                      to: "private func receivedApplicationUpdate("
                  ))
                  let prepareExport = String(try section(
                      in: source,
                      from: "func prepareExport()",
                      to: "private func abandonPackageCorrelation()"
                  ))

                  #expect(prepareExport.contains("No account UID"))
                  #expect(source.contains("<redacted-account-uid>"))
                  #expect(receiver.contains("let custodySafeUpdate = redactVerifiedAccountUID(in: update)"))
                  #expect(receiver.contains("log(\"tuya_application_update\", custodySafeUpdate.merging(["))
                  #expect(!receiver.contains("log(\"tuya_application_update\", update.merging(["))
                  #expect(helper.contains("membershipAccountUID"))
                  #expect(helper.contains("safeKey = key.replacingOccurrences"))
                  #expect(helper.contains("safeValue = value.replacingOccurrences"))
              }

              @Test("account UID custody is value-bound rather than a blanket generic uid-key rule")
              func accountUIDCustodyDoesNotEraseGenericDeviceUIDKeys() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))

                  #expect(!driver.contains("\"uid\","))
                  #expect(!driver.contains("\"uid\"\n"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          '''
          }

          for path, body in tests.items():
              test_path = Path(path)
              if test_path.exists():
                  raise SystemExit(f'test path unexpectedly already exists: {path}')
              test_path.write_text(body.replace('\n          ', '\n').lstrip())
          PY

      - name: Source-contract smoke checks
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          assert source.count('membershipStatus = "Exact scooter membership must be verified again for this Secure Link session."') == 2
          assert 'log("tuya_application_update", update.merging([' not in source
          assert 'log("tuya_application_update", custodySafeUpdate.merging([' in source
          assert ']) { _, trusted in trusted })' in source
          assert '<redacted-account-uid>' in source
          assert source.count('        "sessionkey",') == 1
          PY
          git diff --check
          git status --short

      - name: Commit durable product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-current-invariants.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaForegroundMembershipStatusRevocationSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            .github/workflows/materialize-capture-current-invariants.yml
          git commit -m 'fix(capture): close current authority custody invariants'
          git push origin HEAD:sol/v14-capture-current-invariants-1c408-r1
