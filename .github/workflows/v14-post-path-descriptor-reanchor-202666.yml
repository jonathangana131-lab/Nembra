name: V14 Capture Post-Path Descriptor Reanchor 202666

on:
  push:
    branches:
      - fix/v14-private-provenance-post-path-202666-sol

permissions:
  contents: write

jobs:
  reanchor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v14-private-provenance-post-path-202666-sol
      - name: Import reviewed non-overlapping donor
        shell: bash
        run: |
          set -euo pipefail
          CURRENT='202666ed57be990978d874da4d7f086d11652eab'
          OLD='fa29a7135101897018723c40e6e2853388b09327'
          HELPER='Scripts/capture_tuya_private_input_provenance.py'
          TEST='scripts/ci/tests/test_capture_tuya_private_input_post_path_descriptor_custody.py'
          test "$(git rev-parse HEAD^)" = "$CURRENT"
          git diff --quiet "$OLD" "$CURRENT" -- "$HELPER"
          git fetch --no-tags origin fix/v14-private-provenance-post-path-fa29-sol:refs/remotes/origin/post-path-donor
          git show "origin/post-path-donor:$HELPER" > "$HELPER"
          git show "origin/post-path-donor:$TEST" > "$TEST"
          python3 -m py_compile "$HELPER" "$TEST"
          python3 "$TEST"
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_tree_cross_authority.py
          git add "$HELPER" "$TEST"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '2'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$HELPER"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-post-path-descriptor-reanchor-202666.yml
          git commit -m 'fix(capture): close post-path descriptor mutation window'
          git push origin HEAD:fix/v14-private-provenance-post-path-202666-sol
