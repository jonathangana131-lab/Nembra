name: Materialize V14 Capture primary rider language

on:
  push:
    branches:
      - polish/v14-capture-primary-language-483-sol

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply rider-first language repair
        run: python3 scripts/ci/apply_v14_capture_primary_language_polish.py
      - name: Validate source boundary
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCapturePrimaryLanguageSourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = app.index('private var preflightPanel')
          end = app.index('private var engineeringDisclosure', start)
          primary = app[start:end]
          for forbidden in ('Historical UUID','RSSI','FD50','DP query','package-owned scan window','passive Bluetooth correlation','accepted observation horizon','required field authority','prior session generation'):
              assert forbidden not in primary, forbidden
          for required in ('OFF → ON → OFF → ON signal pattern','read-only signal check','cannot send scooter commands','Read-only observation','This stopped attempt will not be reused'):
              assert required in primary, required
          assert 'test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)' in app
          assert 'test.canRestartFromFreshOFF1 && (!sdkAccount.loggedIn || !test.sdkAccountLoggedIn)' in app
          assert 'test.canRestartFromFreshOFF1 && test.sdkAccountLoggedIn && (!test.sdkDeviceMembershipVerified || !test.accountIdentityLeaseIsAuthorized)' in app
          assert 'raw FD50 bytes' in app
          assert 'No DP query or scooter command' in app
          PY
          git diff --check
      - name: Publish clean product polish
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/apply_v14_capture_primary_language_polish.py
          rm .github/workflows/materialize-v14-capture-primary-language-483.yml
          git add -A
          git diff --cached --check
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'polish(capture): keep protocol jargon out of primary flow'
          git push origin HEAD:polish/v14-capture-primary-language-483-sol
