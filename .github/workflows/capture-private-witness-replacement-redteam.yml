name: Capture Private Witness Replacement Red Team

on:
  pull_request:
    paths:
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - Scripts/capture_tuya_private_input_provenance.py
      - scripts/ci/tests/test_capture_private_input_review_witness.py
      - scripts/ci/tests/test_capture_private_witness_replacement.py
      - .github/workflows/capture-private-witness-replacement-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-witness-replacement:
    name: Reject replaced private generation and local witness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind diagnostic to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_input_review_witness.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_witness_replacement.py
      - name: Require external private-review authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_private_witness_replacement.py
