name: Temporary V14 Capture Protected Install Materializer

on:
  push:
    branches:
      - repair/v14-capture-signed-app-protected-install-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Materialize and validate exact install custody
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 61b3b769184d2771d56898bacf6347993ec994db HEAD
          changed="$(git diff --name-only 61b3b769184d2771d56898bacf6347993ec994db...HEAD | sort)"
          expected="$(printf '%s\n' .github/workflows/tmp-v14-capture-protected-install-materialize.yml scripts/ci/tmp_materialize_protected_install.py | sort)"
          test "$changed" = "$expected"
          git fetch --no-tags origin repair/v14-capture-signed-app-install-custody-gpt56-sol
          python3 -B scripts/ci/tmp_materialize_protected_install.py
          git show FETCH_HEAD:.github/workflows/capture-signed-app-install-custody.yml > .github/workflows/capture-signed-app-install-custody.yml
          /bin/bash -n scripts/field/install_one_time_capture.command
          python3 -B -c 'compile(open("scripts/ci/capture_signed_app_install_custody.py", encoding="utf-8").read(), "custody", "exec"); compile(open("scripts/ci/tests/test_capture_signed_app_install_custody.py", encoding="utf-8").read(), "tests", "exec")'
          python3 -B -I scripts/ci/tests/test_capture_signed_app_install_custody.py
          git diff --check
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          git rm .github/workflows/tmp-v14-capture-protected-install-materialize.yml scripts/ci/tmp_materialize_protected_install.py
          git add .github/workflows/capture-signed-app-install-custody.yml scripts/field/install_one_time_capture.command scripts/ci/tests/test_capture_signed_app_install_custody.py
          git diff --cached --check
          git config user.name "Nembra V14 Capture Closure"
          git config user.email "nembra-v14@users.noreply.github.com"
          git commit -m "fix(capture): protect exact signed app install subject"
          git push origin HEAD:repair/v14-capture-signed-app-protected-install-sol
