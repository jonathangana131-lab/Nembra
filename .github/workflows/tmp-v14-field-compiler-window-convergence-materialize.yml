name: Temporary V14 Field Compiler Window Convergence Materializer

on:
  push:
    branches:
      - integration/v14-field-compiler-window-convergence-sol-20260811
    paths:
      - .github/workflows/tmp-v14-field-compiler-window-convergence-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact clean composition base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "47740b53736f0dd277420693fa15e1de94075c27"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Import selected accepted field-authority ingredients
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            2d2b1197eab18570195532a1d401756d5c9582d2 \
            fd9b1758dfa93e0f0119f03d2573b95ae7a768c3 \
            b19e5a5a39e7ccaf84894bacf62242afde948779 \
            322fb6927ce0bc53d8f1b9fc30218ed3bc24876f

          git checkout 2d2b1197eab18570195532a1d401756d5c9582d2 -- \
            .github/workflows/capture-field-installer-git-authority-red-team.yml \
            Scripts/bootstrap_capture_tuya_sdk.sh \
            scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py

          git checkout fd9b1758dfa93e0f0119f03d2573b95ae7a768c3 -- \
            scripts/field/install_one_time_capture.command

          git checkout b19e5a5a39e7ccaf84894bacf62242afde948779 -- \
            .github/workflows/capture-field-build-provenance.yml \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldInstallerIntendedDeviceAuthoritySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldInstallerSourceCustodyOrderingSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldPythonIsolationSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateFieldInputProvenanceSourceTests.swift \
            scripts/ci/tests/test_capture_tuya_private_input_provenance.py

          git checkout 322fb6927ce0bc53d8f1b9fc30218ed3bc24876f -- \
            .github/workflows/capture-field-tracked-source-compiler-window-red-team.yml \
            scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py

          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py
          git diff --check

      - name: Publish clean selected composition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-materializer'
          git config user.email 'nembra-v14-materializer@users.noreply.github.com'
          git rm .github/workflows/tmp-v14-field-compiler-window-convergence-materialize.yml
          git add -A
          git diff --cached --check
          git commit -m 'Compose current field authority for compiler-window closure'
          git push origin HEAD:integration/v14-field-compiler-window-convergence-sol-20260811
