name: V14 Capture Final Provenance Identity 9695

on:
  push:
    branches:
      - fix/v14-private-provenance-final-identity-9695-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v14-private-provenance-final-identity-9695-sol

      - name: Assert exact ancestry and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          PARENT='9695af19c21c93b3eb4bc867613a6df0c9a3b3d4'
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          git diff --name-only "$PARENT" HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/v14-private-provenance-final-identity-9695.yml
          tools/v14_private_provenance_final_identity_materialize.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Materialize final file-identity custody
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v14_private_provenance_final_identity_materialize.py

      - name: Correct pathname-race interception for current pathlib
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py')
          s = p.read_text(encoding='utf-8')
          start_token = '    def test_file_fingerprint_rejects_same_inode_mutation_during_pathname_check(self) -> None:\n'
          end_token = '    def test_tree_rejects_file_replacement_after_individual_fingerprint(self) -> None:\n'
          start = s.index(start_token)
          end = s.index(end_token, start)
          replacement = '''    def test_file_fingerprint_rejects_same_inode_mutation_during_pathname_check(self) -> None:
              target = self.security_podspec
              original_stat = provenance.os.stat
              mutated = False

              def stat_then_mutate(path: os.PathLike[str] | str, *args: object, **kwargs: object) -> os.stat_result:
                  nonlocal mutated
                  metadata = original_stat(path, *args, **kwargs)
                  if kwargs.get("follow_symlinks") is False and Path(path) == target and not mutated:
                      mutated = True
                      original_inode = metadata.st_ino
                      size = metadata.st_size
                      target.write_bytes(b"R" * size)
                      os.utime(
                          target,
                          ns=(metadata.st_atime_ns, metadata.st_mtime_ns + 1_000_000_000),
                      )
                      final_metadata = original_stat(target)
                      self.assertEqual(final_metadata.st_ino, original_inode)
                      self.assertEqual(final_metadata.st_size, size)
                  return metadata

              with mock.patch.object(provenance.os, "stat", side_effect=stat_then_mutate):
                  with self.assertRaises(provenance.ProvenanceError):
                      provenance._file_fingerprint(target)
              self.assertTrue(mutated)

          '''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY

      - name: Parse provenance helper and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_provenance.py

      - name: Prove post-read fstat mutation regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py \
            CaptureTuyaPrivateInputProvenanceTests.test_file_fingerprint_rejects_same_inode_mutation_after_post_read_fstat

      - name: Prove pathname-check mutation regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py \
            CaptureTuyaPrivateInputProvenanceTests.test_file_fingerprint_rejects_same_inode_mutation_during_pathname_check

      - name: Run full provenance unit suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py

      - name: Prove exact effective repair scope
        shell: bash
        run: |
          set -euo pipefail
          HELPER='Scripts/capture_tuya_private_input_provenance.py'
          TEST='scripts/ci/tests/test_capture_tuya_private_input_provenance.py'
          git add "$HELPER" "$TEST"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '2'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$HELPER"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST"

      - name: Commit durable two-path checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-private-provenance-final-identity-9695.yml tools/v14_private_provenance_final_identity_materialize.py
          git commit -m 'fix(capture): close final private input identity race'
          git push origin HEAD:fix/v14-private-provenance-final-identity-9695-sol
