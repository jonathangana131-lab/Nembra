name: V14 Capture Final Provenance Identity 9695

on:
  push:
    branches:
      - fix/v14-private-provenance-final-identity-9695-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v14-private-provenance-final-identity-9695-sol

      - name: Assert exact ancestry and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          PARENT='9695af19c21c93b3eb4bc867613a6df0c9a3b3d4'
          test "$(git merge-base "$PARENT" HEAD)" = "$PARENT"
          git diff --name-only "$PARENT" HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/v14-private-provenance-final-identity-9695.yml
          tools/v14_private_provenance_final_identity_materialize.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Materialize final file-identity custody
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v14_private_provenance_final_identity_materialize.py

      - name: Correct pathname-race interception for current pathlib
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('original_lstat = provenance.os.lstat', 'original_stat = provenance.os.stat'),
              ('def lstat_then_mutate(', 'def stat_then_mutate('),
              ('metadata = original_lstat(path, *args, **kwargs)', 'metadata = original_stat(path, *args, **kwargs)'),
              ('if Path(path) == target and not mutated:', 'if kwargs.get("follow_symlinks") is False and Path(path) == target and not mutated:'),
              ('ns=(target.stat().st_atime_ns, metadata.st_mtime_ns + 1_000_000_000),', 'ns=(metadata.st_atime_ns, metadata.st_mtime_ns + 1_000_000_000),'),
              ('self.assertEqual(target.stat().st_ino, original_inode)\n                self.assertEqual(target.stat().st_size, size)', 'final_metadata = original_stat(target)\n                self.assertEqual(final_metadata.st_ino, original_inode)\n                self.assertEqual(final_metadata.st_size, size)'),
              ('mock.patch.object(provenance.os, "lstat", side_effect=lstat_then_mutate)', 'mock.patch.object(provenance.os, "stat", side_effect=stat_then_mutate)'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'pathname hook token drifted: {old!r} count={s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Parse provenance helper and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_provenance.py

      - name: Prove post-read fstat mutation regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py \
            CaptureTuyaPrivateInputProvenanceTests.test_file_fingerprint_rejects_same_inode_mutation_after_post_read_fstat

      - name: Prove pathname-check mutation regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py \
            CaptureTuyaPrivateInputProvenanceTests.test_file_fingerprint_rejects_same_inode_mutation_during_pathname_check

      - name: Run full provenance unit suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py

      - name: Prove exact effective repair scope
        shell: bash
        run: |
          set -euo pipefail
          HELPER='Scripts/capture_tuya_private_input_provenance.py'
          TEST='scripts/ci/tests/test_capture_tuya_private_input_provenance.py'
          git add "$HELPER" "$TEST"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '2'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$HELPER"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST"

      - name: Commit durable two-path checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-private-provenance-final-identity-9695.yml tools/v14_private_provenance_final_identity_materialize.py
          git commit -m 'fix(capture): close final private input identity race'
          git push origin HEAD:fix/v14-private-provenance-final-identity-9695-sol
