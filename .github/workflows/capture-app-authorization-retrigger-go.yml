name: Capture app authorization GO retrigger

on:
  push:
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - .github/workflows/capture-app-authorization-retrigger-go.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: product/capture-1-0-main-20260818
      TRIGGER_WORKFLOW: .github/workflows/capture-app-authorization-retrigger-go.yml
      AUTHORING_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Retrigger the accepted direct-source materializer exactly once
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$TRIGGER_WORKFLOW"
          test -f "$AUTHORING_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          printf '\n# GO retrigger from exact carrier head %s\n' "$GITHUB_SHA" >> "$AUTHORING_WORKFLOW"
          rm "$TRIGGER_WORKFLOW"

          git add -- "$AUTHORING_WORKFLOW" "$TRIGGER_WORKFLOW"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(capture): retrigger direct authorization materialization'

          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
