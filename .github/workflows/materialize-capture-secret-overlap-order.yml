name: Materialize Capture Secret Overlap Order

on:
  push:
    branches:
      - fix/v14-capture-secret-overlap-order-1138-sol
    paths:
      - '.github/workflows/materialize-capture-secret-overlap-order.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - product/v14-capture-guided-truth-current-sol
    paths:
      - '.github/workflows/materialize-capture-secret-overlap-order.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/v14-capture-secret-overlap-order-1138-sol
          fetch-depth: 0

      - name: Guard exact inspected product source
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "6f63d70f0b8ad63eb802548d0a23fbd95e15bffc"
          git merge-base --is-ancestor 1138e0e953b0e2855d849e02d02e40b643a876ac HEAD

      - name: Apply bounded longest-first secret repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()
          old = '''    private static var exactSecretValues: [String] {\n#if canImport(NembraTuyaPrivateConfig)\n        [NembraTuyaPrivateIdentity.appKey, NembraTuyaPrivateIdentity.appSecret]\n            .filter { !$0.isEmpty }\n#else\n        []\n#endif\n    }'''
          new = '''    private static var exactSecretValues: [String] {\n#if canImport(NembraTuyaPrivateConfig)\n        Set([NembraTuyaPrivateIdentity.appKey, NembraTuyaPrivateIdentity.appSecret])\n            .filter { !$0.isEmpty }\n            .sorted { left, right in\n                if left.count != right.count { return left.count > right.count }\n                return left < right\n            }\n#else\n        []\n#endif\n    }'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one exact-secret ordering anchor, found {source.count(old)}')
          source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Verify custody invariant
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          start = source.index('private static var exactSecretValues')
          end = source.index('private static func redactKnownSecretValues', start)
          block = source[start:end]
          assert 'Set([NembraTuyaPrivateIdentity.appKey, NembraTuyaPrivateIdentity.appSecret])' in block
          assert '.filter { !$0.isEmpty }' in block
          assert '.sorted { left, right in' in block
          assert 'left.count > right.count' in block
          assert 'return left < right' in block
          redactor = source[end:source.index('private static func redactedApplicationDescription', end)]
          assert 'for secret in exactSecretValues' in redactor
          assert 'replacingOccurrences(of: secret, with: "<redacted>")' in redactor
          PY
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretOverlapCustodySourceTests.swift
          git diff --check

      - name: Publish clean repair commit
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-capture-secret-overlap-order.yml
          git config user.name "nembra-sol-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretOverlapCustodySourceTests.swift
          git diff --cached --check
          git commit -m "fix(capture): redact overlapping private secrets longest-first"
          git push origin HEAD:fix/v14-capture-secret-overlap-order-1138-sol
