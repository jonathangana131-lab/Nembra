name: Capture signed-install authority materialize once

on:
  push:
    branches:
      - repair/v14-signed-origin-dedicated-uid-apfs-sol-20260812
    paths:
      - .github/workflows/capture-signed-install-authority-materialize-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact parent
        shell: bash
        env:
          EXPECTED_PARENT: 83ed9001385518e979a7b37265877054938ae5c0
          PRODUCT_PARENT: b9164701da15d7a773698599bf24ed3cb923f8ac
          MATERIALIZER: .github/workflows/capture-signed-install-authority-materialize-once.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          changed="$(git diff --name-only "$PRODUCT_PARENT"...HEAD)"
          test "$changed" = "$MATERIALIZER"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply narrow permanent-test transforms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor {old!r}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          pre_stage = "scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py"
          anchor = "    def test_placeholder_is_exactly_single_use(self) -> None:\n"
          addition = '''    def test_build_environment_rejects_ambient_xcode_selector_authority(self) -> None:
              helper = load(ORIGIN_HELPER, "capture_signed_app_build_origin_custody_environment")
              poison = {
                  "DEVELOPER_DIR": "/tmp/poison-developer",
                  "SDKROOT": "/tmp/poison-sdk",
                  "TOOLCHAINS": "poison-toolchain",
                  "__CF_USER_TEXT_ENCODING": "poison-encoding",
                  "CC": "/tmp/poison-cc",
                  "CXX": "/tmp/poison-cxx",
                  "SWIFT_EXEC": "/tmp/poison-swift",
                  "DYLD_INSERT_LIBRARIES": "/tmp/poison.dylib",
                  "LANG": "poison_LANG",
                  "LC_ALL": "poison_LC_ALL",
              }
              with tempfile.TemporaryDirectory(prefix="nembra-build-env-") as temporary:
                  home = Path(temporary)
                  with mock.patch.dict(helper.os.environ, poison, clear=True):
                      environment = helper._build_environment("nembrabuildtest", home)
                  self.assertEqual(
                      environment,
                      {
                          "HOME": str(home),
                          "USER": "nembrabuildtest",
                          "LOGNAME": "nembrabuildtest",
                          "PATH": "/usr/bin:/bin:/usr/sbin:/sbin",
                          "TMPDIR": str(home / "tmp"),
                          "LANG": "en_US.UTF-8",
                          "LC_ALL": "en_US.UTF-8",
                      },
                  )
              self.assertTrue(set(poison).isdisjoint(environment))

          '''
          replace_once(pre_stage, anchor, addition + anchor)

          real_xcode = "scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py"
          detach_anchor = "        detach = helper._detach_apfs(writable_device)\n"
          attack = '''        former_build_writable_attack = subprocess.run(
              ["/bin/sh", "-c", 'printf "BUILD_UID_AFTER_PATH_REVOKE\\n" >> "$1"', "sh", str(product)],
              env=build_environment,
              stdin=subprocess.DEVNULL,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              check=False,
              **structured_credentials(build_uid, build_gid, []),
          )
          if former_build_writable_attack.returncode == 0 or sha256(product) != before:
              emit_error(
                  "path-revocation",
                  "former build identity retained fresh writable pathname authority after root revocation",
              )
              return 75

          '''
          replace_once(real_xcode, detach_anchor, attack + detach_anchor)
          replace_once(
              real_xcode,
              '            "fieldAttackReturnCode": attack.returncode,\n',
              '            "fieldAttackReturnCode": attack.returncode,\n'
              '            "formerBuildWritablePathAttackReturnCode": former_build_writable_attack.returncode,\n',
          )
          replace_once(
              real_xcode,
              '            and evidence.get("fieldAttackReturnCode") != 0\n',
              '            and evidence.get("fieldAttackReturnCode") != 0\n'
              '            and evidence.get("formerBuildWritablePathAttackReturnCode") != 0\n',
          )
          PY

      - name: Compile transformed tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py \
            scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py

      - name: Run focused pre-stage regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py

      - name: Assert semantic witness source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'def test_build_environment_rejects_ambient_xcode_selector_authority' scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          grep -Fq 'BUILD_UID_AFTER_PATH_REVOKE' scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          grep -Fq 'formerBuildWritablePathAttackReturnCode' scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          git diff --check

      - name: Self-delete and push permanent tests
        shell: bash
        env:
          MATERIALIZER: .github/workflows/capture-signed-install-authority-materialize-once.yml
          BRANCH: repair/v14-signed-origin-dedicated-uid-apfs-sol-20260812
        run: |
          set -euo pipefail
          git rm "$MATERIALIZER"
          git add \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py \
            scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            "$MATERIALIZER" \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py \
            scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'nembra-swarm-materializer'
          git config user.email 'nembra-swarm@users.noreply.github.com'
          git commit -m 'Capture: lock environment and pathname authority regressions'
          git push origin "HEAD:$BRANCH"
