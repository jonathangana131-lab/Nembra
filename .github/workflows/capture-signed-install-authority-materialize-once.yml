name: Capture signed-install authority materialize once

on:
  push:
    branches:
      - repair/v14-signed-origin-dedicated-uid-apfs-sol-20260812
    paths:
      - .github/workflows/capture-signed-install-authority-materialize-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact parent
        shell: bash
        env:
          EXPECTED_PARENT: 2df8268de57319bfcf860d8ac20cb47536974090
          MATERIALIZER: .github/workflows/capture-signed-install-authority-materialize-once.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = "$MATERIALIZER"
      - name: Compile untouched real-Xcode witness
        shell: bash
        run: python3 -m py_compile scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
      - name: Compile untouched pre-stage witness
        shell: bash
        run: python3 -m py_compile scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
