name: Capture Final GO Build Subject R3 Materializer

on:
  push:
    branches:
      - repair/v14-auth-final-go-cocoapods-build-subject-r3-sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Three-way compose reviewed build-subject authority
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-pycache"
          git diff --binary \
            477b13acab3496484a28e1bcfe2b0b95fc2f66f2 \
            93909778674779871681db1ac4f28323b62ff5b9 \
            -- \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py \
            > "$RUNNER_TEMP/build-subject-authority.patch"
          test -s "$RUNNER_TEMP/build-subject-authority.patch"
          git apply --3way --index "$RUNNER_TEMP/build-subject-authority.patch"
          git diff --cached --check
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/es80_authenticated_stationary_signed_artifact.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py \
            scripts/ci/tests/test_es80_final_go_control_worktree_custody_current.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact_device_custody.py
          python3 scripts/ci/tests/test_es80_final_go_control_worktree_custody_current.py
      - name: Publish production-only recovery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/capture-final-go-build-subject-r3-materializer.yml
          git config user.name 'nembra-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): bind reviewed CocoaPods subject on current Final GO'
          git push origin HEAD:repair/v14-auth-final-go-cocoapods-build-subject-r3-sol
