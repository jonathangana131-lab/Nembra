name: ES80 Candidate Association Focused QA

on:
  push:
    branches:
      - 'parallel/es80-physical-candidate-correlation/ci/**'

permissions:
  contents: read

concurrency:
  group: nembra-es80-candidate-association-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test physical candidate association package slice
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify immutable checkout and exact product parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "10cd42ef98d7c74eab0a1aa747c417960c71ab40"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/es80-candidate-association-focused-qa.yml"
      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
      - name: Guard passive package against application writes
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 capture package must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi
      - name: Test NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture
      - name: Build NembraBluetoothCapture for iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
