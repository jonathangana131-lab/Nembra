name: Capture Private Read Lease Intermediate Symlink Red Team

on:
  pull_request:
    paths:
      - scripts/ci/capture_selected_xcode_build_orchestrator.py
      - scripts/ci/tests/test_capture_private_read_lease_intermediate_symlink_red_team.py
      - .github/workflows/capture-private-read-lease-intermediate-symlink-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exploit-positive-intermediate-symlink:
    name: Prove full-path nofollow admits raced intermediate target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind evidence to exact checked-out source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'Exact read-lease intermediate-symlink diagnostic head: %s\n' "$actual"

      - name: Reproduce intermediate-component nofollow escape
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-read-lease-symlink-pycache"
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_read_lease_intermediate_symlink_red_team.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_intermediate_symlink_red_team.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Classify product status
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'EXPLOIT-POSITIVE SUCCESS: attacked read-lease production remains RED for intermediate-component symlink custody.' \
            'No install, Bluetooth, Tuya traffic, telemetry, command, or physical ES80 authority is created.'
