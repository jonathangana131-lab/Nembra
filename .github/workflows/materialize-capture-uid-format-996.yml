name: Capture UID custody source normalization

on:
  push:
    branches:
      - review/v14-capture-account-uid-failclosed-7f5b-sol

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Guard reviewed lineage and helper-only pre-scope
        shell: bash
        run: |
          set -euo pipefail
          expected='996cf64500be2a32c55227f4dbcdefad8049a284'
          git merge-base --is-ancestor "$expected" HEAD^
          mapfile -t changed < <(git diff --name-only "$expected"..HEAD^)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != '.github/workflows/materialize-capture-uid-format-996.yml' ]]; then
            printf 'Unexpected pre-normalization scope:\n%s\n' "${changed[*]}" >&2
            exit 78
          fi

      - name: Normalize fail-closed guard formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()
          pattern = re.compile(
              r'        guard let custodySafeUpdate = applicationUpdateForEventCustody\(update\) else \{\n'
              r'.*?'
              r'        applicationUpdateAdmissionsInFlight \+= 1\n',
              re.DOTALL,
          )
          replacement = '''        guard let custodySafeUpdate = applicationUpdateForEventCustody(update) else {
              await invalidateSourceAuthority(
                  token: token,
                  message: "Verified account UID custody became unavailable before application evidence admission.",
                  kind: "application_account_uid_custody_unavailable"
              )
              return
          }

          applicationUpdateAdmissionsInFlight += 1
          '''
          matches = list(pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(f'expected bounded custody/admission range once; observed {len(matches)}')
          path.write_text(pattern.sub(replacement, source, count=1))
          PY
          git diff --check

      - name: Verify source contracts remain present
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          receiver = s[s.index('private func receivedApplicationUpdate('):s.index('private func startWatchdog')]
          expected = '''        guard let custodySafeUpdate = applicationUpdateForEventCustody(update) else {
              await invalidateSourceAuthority(
                  token: token,
                  message: "Verified account UID custody became unavailable before application evidence admission.",
                  kind: "application_account_uid_custody_unavailable"
              )
              return
          }
          '''
          assert expected in receiver
          assert receiver.index('guard let custodySafeUpdate = applicationUpdateForEventCustody(update)') < receiver.index('sessionLedger.recordApplicationUpdate')
          assert ') { _, trusted in trusted })' in receiver
          PY

      - name: Commit normalized source and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-uid-format-996.yml
          git config user.name 'nembra-sol'
          git config user.email 'nembra-sol@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/materialize-capture-uid-format-996.yml
          git diff --cached --check
          git commit -m 'style(capture): normalize UID custody guard'
          git push origin HEAD:review/v14-capture-account-uid-failclosed-7f5b-sol
