name: Capture UID custody source normalization

on:
  push:
    branches:
      - review/v14-capture-account-uid-failclosed-7f5b-sol

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact reviewed parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '996cf64500be2a32c55227f4dbcdefad8049a284'

      - name: Normalize fail-closed guard formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()
          old = '''        guard let custodySafeUpdate = applicationUpdateForEventCustody(update) else {
          await invalidateSourceAuthority(
              token: token,
              message: "Verified account UID custody became unavailable before application evidence admission.",
              kind: "application_account_uid_custody_unavailable"
          )
          return
          }
          '''
          new = '''        guard let custodySafeUpdate = applicationUpdateForEventCustody(update) else {
              await invalidateSourceAuthority(
                  token: token,
                  message: "Verified account UID custody became unavailable before application evidence admission.",
                  kind: "application_account_uid_custody_unavailable"
              )
              return
          }
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected malformed guard once; observed {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check

      - name: Verify source contracts remain present
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          receiver = s[s.index('private func receivedApplicationUpdate('):s.index('private func startWatchdog')]
          assert 'guard let custodySafeUpdate = applicationUpdateForEventCustody(update) else {' in receiver
          assert 'application_account_uid_custody_unavailable' in receiver
          assert receiver.index('guard let custodySafeUpdate = applicationUpdateForEventCustody(update)') < receiver.index('sessionLedger.recordApplicationUpdate')
          assert ') { _, trusted in trusted })' in receiver
          PY

      - name: Commit normalized source and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-uid-format-996.yml
          git config user.name 'nembra-sol'
          git config user.email 'nembra-sol@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/materialize-capture-uid-format-996.yml
          git diff --cached --check
          git commit -m 'style(capture): normalize UID custody guard'
          git push origin HEAD:review/v14-capture-account-uid-failclosed-7f5b-sol
