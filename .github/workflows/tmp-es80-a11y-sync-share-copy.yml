name: Temporary ES80 a11y share-copy sync

on:
  push:
    branches:
      - fix/es80-v14-accessibility-recomposition/gpt56-thinking

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify accessibility checkpoint
        run: test "$(git rev-parse HEAD^)" = "914f578c8c1717c668c78a58a9af08778de327b9"
      - name: Preserve concurrently accepted Share recovery copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          s = p.read_text()
          old1 = "Capture remains sealed and ready for analysis, but the temporary Share file could not be staged:"
          new1 = "Capture remains sealed and ready for analysis, but Nembra could not prepare the Share file:"
          old2 = "Capture remains sealed, but the exact final Share artifact did not earn analysis readiness:"
          new2 = "Capture remains sealed, but Nembra could not verify the Share file for analysis:"
          if s.count(old1) != 2 or s.count(old2) != 1:
              raise SystemExit("unexpected pre-#1119 Share recovery copy shape")
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
      - name: Verify scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "NembraApp/Features/Research/ES80CaptureShellView.swift"
      - name: Commit sync and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-a11y-sync-share-copy.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git commit -m "Capture accessibility: preserve Share recovery copy"
          git push origin HEAD:fix/es80-v14-accessibility-recomposition/gpt56-thinking
