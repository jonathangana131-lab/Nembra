name: Temporary Capture private install-log custody

on:
  push:
    branches:
      - fix/v14-capture-private-install-log-custody-sol

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v14-capture-private-install-log-custody-sol

      - name: Apply custody repair
        run: python3 scripts/_temp_harden_capture_install_log_custody.py

      - name: Validate shell and source contract shape
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          python3 - <<'PY'
          from pathlib import Path
          installer = Path('scripts/field/install_one_time_capture.command').read_text()
          required = [
              'mktemp "${TMPDIR:-/tmp}/nembra-authenticated-capture-install.XXXXXX"',
              'chmod 600 "$INSTALL_LOG"',
              'trap \'rm -f -- "$INSTALL_LOG"\' EXIT',
              'secret = sys.stdin.read()',
              'secret.replace("-", "")',
              'flags=re.IGNORECASE',
              'rm -f -- "$INSTALL_LOG"',
              'trap - EXIT',
          ]
          for token in required:
              assert token in installer, token
          assert 'nembra-authenticated-capture-install.log' not in installer
          assert 'INSTALL_DIAGNOSTIC="${INSTALL_DIAGNOSTIC//$DEVICE_UDID/<redacted-device>}"' not in installer
          PY
          git diff --check

      - name: Remove temporary patch transport
        run: |
          git rm .github/workflows/_temp_capture_private_install_log_custody.yml
          git rm scripts/_temp_harden_capture_install_log_custody.py

      - name: Commit product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldInstallerPrivateInstallLogCustodySourceTests.swift
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(capture): harden private install-log custody'
          git push origin HEAD:fix/v14-capture-private-install-log-custody-sol
