name: Materialize Capture Current Red-Team Convergence Sol

on:
  push:
    branches:
      - integration/v14-capture-current-redteam-convergence-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current product ancestry and helper scope
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          test "$(git merge-base HEAD "$parent")" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 4
          test "${changed[0]}" = '.github/workflows/materialize-capture-current-redteam-convergence-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift'
          test "${changed[2]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift'
          test "${changed[3]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift'

      - name: Materialize current-head Capture truth repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          membership_block = '        sdkDeviceMembershipVerified = false\n        membershipAccountUID = nil\n        membershipDeviceID = nil\n        membershipRequestID = UUID()\n'
          membership_repair = '        sdkDeviceMembershipVerified = false\n        membershipAccountUID = nil\n        membershipDeviceID = nil\n        membershipStatus = "Capture authority changed. Exact scooter membership must be verified again for a fresh Secure Link lifetime."\n        membershipRequestID = UUID()\n'
          if source.count(membership_block) != 2:
              raise SystemExit(f'expected two membership-revocation blocks, found {source.count(membership_block)}')
          source = source.replace(membership_block, membership_repair)

          receiver_marker = '    private func receivedApplicationUpdate(\n        _ update: [String: String],\n        token: TuyaReadOnlyConnectionToken\n    ) async {\n'
          helper = '    private func redactVerifiedAccountUID(from update: [String: String]) -> [String: String] {\n        guard let rawAccountUID = membershipAccountUID else { return update }\n        let accountUID = rawAccountUID.trimmingCharacters(in: .whitespacesAndNewlines)\n        guard !accountUID.isEmpty else { return update }\n\n        var sanitized: [String: String] = [:]\n        sanitized.reserveCapacity(update.count)\n        for (key, value) in update {\n            let sanitizedKey = key.replacingOccurrences(\n                of: accountUID,\n                with: "<redacted-account-uid>",\n                options: [.caseInsensitive, .literal]\n            )\n            let sanitizedValue = value.replacingOccurrences(\n                of: accountUID,\n                with: "<redacted-account-uid>",\n                options: [.caseInsensitive, .literal]\n            )\n            sanitized[sanitizedKey] = sanitizedValue\n        }\n        return sanitized\n    }\n\n'
          if source.count(receiver_marker) != 1:
              raise SystemExit(f'expected one application receiver, found {source.count(receiver_marker)}')
          if '<redacted-account-uid>' in source:
              raise SystemExit('account UID marker already exists; refresh current product before replaying this materializer')
          source = source.replace(receiver_marker, helper + receiver_marker, 1)

          old_log = '            log("tuya_application_update", update.merging([\n                "generation": String(token.diagnosticGeneration)\n            ]) { current, _ in current })\n'
          new_log = '            let sanitizedUpdate = redactVerifiedAccountUID(from: update)\n            log("tuya_application_update", sanitizedUpdate.merging([\n                "generation": String(token.diagnosticGeneration)\n            ]) { _, trusted in trusted })\n'
          if source.count(old_log) != 1:
              raise SystemExit(f'expected one untrusted-precedence application log, found {source.count(old_log)}')
          source = source.replace(old_log, new_log, 1)

          duplicate_secret = '        "refreshtoken",\n        "sessionkey",\n        "authkey",\n'
          simplified_secret = '        "refreshtoken",\n        "authkey",\n'
          if source.count(duplicate_secret) != 1:
              raise SystemExit(f'expected one duplicate sessionkey classifier tail, found {source.count(duplicate_secret)}')
          source = source.replace(duplicate_secret, simplified_secret, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify converged source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          assert s.count('membershipStatus = "Capture authority changed. Exact scooter membership must be verified again for a fresh Secure Link lifetime."') == 2
          assert 'let sanitizedUpdate = redactVerifiedAccountUID(from: update)' in s
          assert 'log("tuya_application_update", sanitizedUpdate.merging([' in s
          assert ']) { _, trusted in trusted })' in s
          assert ']) { current, _ in current })' not in s
          assert '<redacted-account-uid>' in s
          assert 'of: accountUID' in s
          assert s.count('        "sessionkey",') == 1
          print('Capture current-head truth convergence source invariants: PASS')
          PY
          git diff --check

      - name: Run focused portable source contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaSecureLinkViewMembershipStatusRevocationSourceTests
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaApplicationEventMetadataPrecedenceSourceTests
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaApplicationAccountUIDExportCustodySourceTests

      - name: Collapse materializer to clean product convergence
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          rm .github/workflows/materialize-capture-current-redteam-convergence-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          git add -u .github/workflows/materialize-capture-current-redteam-convergence-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): converge current red-team truth invariants'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 4
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift'
          test "${changed[2]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift'
          test "${changed[3]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:integration/v14-capture-current-redteam-convergence-sol
