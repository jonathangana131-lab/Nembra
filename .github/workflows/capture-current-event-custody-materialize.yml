name: Materialize Capture Current Event Custody

on:
  push:
    branches:
      - agent/v14-capture-current-event-custody-convergence-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-current-event-custody-convergence-sol
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureCurrentEventCustodySourceTests.swift

      - name: Apply current event custody convergence
        run: python3 scripts/ci/materialize_capture_current_event_custody.py apply

      - name: Verify bounded truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_current_event_custody.py verify
          python3 -m py_compile scripts/ci/materialize_capture_current_event_custody.py
          git diff --check

      - name: Publish clean product bytes
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          rm .github/workflows/capture-current-event-custody-materialize.yml
          rm scripts/ci/materialize_capture_current_event_custody.py
          git add -A
          changed="$(git diff --cached "$parent" --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureCurrentEventCustodySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$parent" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): close current application event custody gaps'
          git push origin HEAD:agent/v14-capture-current-event-custody-convergence-sol
