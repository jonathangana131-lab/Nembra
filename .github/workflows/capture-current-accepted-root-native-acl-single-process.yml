name: Capture Current Accepted Root Native ACL Single Process

on:
  pull_request:
    paths:
      - .github/workflows/capture-current-accepted-root-native-acl-single-process.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-acl-single-process:
    if: github.head_ref == 'validation/v17-capture-native-acl-single-process-gpt56sol-20260817'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          parent='f85b8c586d59fe036c4fc1a5f7624cc19bcfbbe5'
          /usr/bin/git merge-base --is-ancestor "$parent" HEAD
          changed="$(/usr/bin/git diff --name-only "$parent"...HEAD)"
          test "$changed" = '.github/workflows/capture-current-accepted-root-native-acl-single-process.yml'
          /usr/bin/git diff --quiet "$parent"...HEAD -- scripts/ci/capture_selected_xcode_build_orchestrator.py

      - name: Prove single-process held-fd ACL rollback after pathname replacement
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          field_user="$(/usr/bin/id -un)"
          work="$(mktemp -d "$RUNNER_TEMP/nembra-native-acl-single.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          cat > "$work/acl_single_process.c" <<'C'
          #include <sys/types.h>
          #include <sys/acl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static void die_errno(const char *label) {
              fprintf(stderr, "%s: %s\n", label, strerror(errno));
              exit(2);
          }

          static void die_message(const char *label) {
              fprintf(stderr, "%s\n", label);
              exit(3);
          }

          static int same_identity(const struct stat *a, const struct stat *b) {
              return a->st_dev == b->st_dev &&
                     a->st_ino == b->st_ino &&
                     (a->st_mode & S_IFMT) == (b->st_mode & S_IFMT);
          }

          static void require_fd_path_identity(int fd, const char *path, const char *label) {
              struct stat fd_stat;
              struct stat path_stat;
              if (fstat(fd, &fd_stat) != 0) die_errno("fstat");
              if (lstat(path, &path_stat) != 0) die_errno("lstat");
              if (!same_identity(&fd_stat, &path_stat)) die_message(label);
          }

          static char *acl_bytes(acl_t acl, ssize_t *length_out) {
              ssize_t length = 0;
              char *text = acl_to_text(acl, &length);
              if (!text) die_errno("acl_to_text");
              *length_out = length;
              return text;
          }

          static int bytes_equal(const char *a, ssize_t a_len, const char *b, ssize_t b_len) {
              return a_len == b_len && (a_len == 0 || memcmp(a, b, (size_t)a_len) == 0);
          }

          static void run_chmod_add(const char *principal, const char *path) {
              const char suffix[] = " allow list,search,readattr,readextattr,readsecurity";
              const char prefix[] = "user:";
              size_t needed = strlen(prefix) + strlen(principal) + strlen(suffix) + 1;
              char *acl_text = calloc(needed, 1);
              if (!acl_text) die_errno("calloc");
              if (snprintf(acl_text, needed, "%s%s%s", prefix, principal, suffix) < 0) {
                  free(acl_text);
                  die_message("snprintf ACL failed");
              }

              pid_t child = fork();
              if (child < 0) {
                  free(acl_text);
                  die_errno("fork");
              }
              if (child == 0) {
                  execl("/bin/chmod", "chmod", "+a", acl_text, path, (char *)NULL);
                  _exit(127);
              }

              int status = 0;
              if (waitpid(child, &status, 0) < 0) {
                  free(acl_text);
                  die_errno("waitpid");
              }
              free(acl_text);
              if (!WIFEXITED(status) || WEXITSTATUS(status) != 0) {
                  die_message("pathname chmod grant failed");
              }
          }

          int main(int argc, char **argv) {
              if (argc != 5) {
                  fprintf(stderr, "usage: %s PRINCIPAL SUBJECT MOVED REPLACEMENT\n", argv[0]);
                  return 64;
              }

              const char *principal = argv[1];
              const char *subject = argv[2];
              const char *moved = argv[3];
              const char *replacement = argv[4];

              int fd = open(subject, O_RDONLY | O_DIRECTORY | O_NOFOLLOW | O_CLOEXEC);
              if (fd < 0) die_errno("open subject");
              require_fd_path_identity(fd, subject, "pre-grant fd/path identity mismatch");

              acl_t baseline = acl_get_fd_np(fd, ACL_TYPE_EXTENDED);
              if (!baseline) die_errno("acl_get_fd_np baseline");
              acl_t rollback = acl_dup(baseline);
              if (!rollback) die_errno("acl_dup baseline");

              ssize_t baseline_len = 0;
              char *baseline_text = acl_bytes(baseline, &baseline_len);

              run_chmod_add(principal, subject);
              require_fd_path_identity(fd, subject, "post-grant fd/path identity mismatch");

              acl_t granted = acl_get_fd_np(fd, ACL_TYPE_EXTENDED);
              if (!granted) die_errno("acl_get_fd_np granted");
              ssize_t granted_len = 0;
              char *granted_text = acl_bytes(granted, &granted_len);
              if (bytes_equal(baseline_text, baseline_len, granted_text, granted_len)) {
                  die_message("held fd did not observe canonical-path ACL grant");
              }

              if (rename(subject, moved) != 0) die_errno("rename accepted object");
              require_fd_path_identity(fd, moved, "held fd lost moved accepted object identity");
              if (mkdir(replacement, 0700) != 0) die_errno("mkdir replacement");

              struct stat replacement_before_stat;
              if (lstat(replacement, &replacement_before_stat) != 0) die_errno("lstat replacement before");
              acl_t replacement_before = acl_get_file(replacement, ACL_TYPE_EXTENDED);
              if (!replacement_before) die_errno("acl_get_file replacement before");
              ssize_t replacement_before_len = 0;
              char *replacement_before_text = acl_bytes(replacement_before, &replacement_before_len);

              struct stat fd_stat;
              struct stat replacement_stat;
              if (fstat(fd, &fd_stat) != 0) die_errno("fstat accepted object before rollback");
              if (lstat(replacement, &replacement_stat) != 0) die_errno("lstat replacement identity");
              if (same_identity(&fd_stat, &replacement_stat)) {
                  die_message("attacker replacement unexpectedly aliases held accepted object");
              }

              if (acl_valid_fd_np(fd, ACL_TYPE_EXTENDED, rollback) != 0) {
                  die_errno("acl_valid_fd_np rollback");
              }
              if (acl_set_fd_np(fd, rollback, ACL_TYPE_EXTENDED) != 0) {
                  die_errno("acl_set_fd_np rollback");
              }

              acl_t restored = acl_get_fd_np(fd, ACL_TYPE_EXTENDED);
              if (!restored) die_errno("acl_get_fd_np restored");
              ssize_t restored_len = 0;
              char *restored_text = acl_bytes(restored, &restored_len);
              if (!bytes_equal(baseline_text, baseline_len, restored_text, restored_len)) {
                  die_message("fd-native rollback did not restore exact baseline ACL bytes");
              }
              require_fd_path_identity(fd, moved, "post-rollback held fd no longer matches moved accepted object");

              struct stat replacement_after_stat;
              if (lstat(replacement, &replacement_after_stat) != 0) die_errno("lstat replacement after");
              if (!same_identity(&replacement_before_stat, &replacement_after_stat) ||
                  replacement_before_stat.st_mode != replacement_after_stat.st_mode ||
                  replacement_before_stat.st_uid != replacement_after_stat.st_uid ||
                  replacement_before_stat.st_gid != replacement_after_stat.st_gid) {
                  die_message("fd-native rollback mutated replacement metadata");
              }

              acl_t replacement_after = acl_get_file(replacement, ACL_TYPE_EXTENDED);
              if (!replacement_after) die_errno("acl_get_file replacement after");
              ssize_t replacement_after_len = 0;
              char *replacement_after_text = acl_bytes(replacement_after, &replacement_after_len);
              if (!bytes_equal(
                      replacement_before_text,
                      replacement_before_len,
                      replacement_after_text,
                      replacement_after_len)) {
                  die_message("fd-native rollback mutated replacement ACL bytes");
              }

              printf(
                  "NEMBRA_NATIVE_ACL_SINGLE_PROCESS "
                  "preGrantIdentity=true grantObservedByHeldFd=true pathReplaced=true "
                  "baselineDuplicated=true exactHeldFdRollback=true replacementUntouched=true\n"
              );

              acl_free(replacement_after_text);
              acl_free(replacement_after);
              acl_free(restored_text);
              acl_free(restored);
              acl_free(replacement_before_text);
              acl_free(replacement_before);
              acl_free(granted_text);
              acl_free(granted);
              acl_free(baseline_text);
              acl_free(rollback);
              acl_free(baseline);
              close(fd);
              return 0;
          }
          C

          /usr/bin/clang -Wall -Wextra -Werror "$work/acl_single_process.c" -o "$work/acl_single_process"

          root="$(/usr/bin/sudo -n /usr/bin/mktemp -d /private/tmp/nembra-native-acl-single.XXXXXX)"
          trap '/usr/bin/sudo -n /bin/rm -rf "$root"; rm -rf "$work"' EXIT
          subject="$root/accepted-root"
          moved="$root/accepted-root.moved"
          replacement="$root/accepted-root"
          /usr/bin/sudo -n /bin/mkdir -m 700 "$subject"

          /usr/bin/sudo -n "$work/acl_single_process" \
            "$field_user" \
            "$subject" \
            "$moved" \
            "$replacement"

      - name: Preserve diagnostic-only boundary
        if: always()
        shell: bash
        run: |
          echo 'NEMBRA_NATIVE_ACL_SINGLE_PROCESS validationOnly=true productAuthorityChanged=false physicalAuthorityCreated=false'
