name: Apply Capture procedure rendezvous recovery

on:
  push:
    branches:
      - repair/v14-capture-procedure-rendezvous-recovery-sol

permissions:
  contents: write

concurrency:
  group: capture-procedure-rendezvous-recovery
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-procedure-rendezvous-recovery-sol
          fetch-depth: 2
      - name: Apply exact product patch and self-delete
        shell: bash
        env:
          EXPECTED_PARENT: dee52e17577d25dd6d928378b2fb530f321923bb
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git config user.name nembra-go-bot
          git config user.email nembra-go-bot@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          import base64
          
          PROCEDURE = "ES80-AUTHENTICATED-STATIONARY-v1"
          
          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old!r}")
              p.write_text(source.replace(old, new, 1))
          
          replace_once(
              "NembraApp/App/NembraCaptureBuildIdentity.swift",
              '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n',
              '    static let tuyaDependencyLockSHA256InfoKey = "NembraCaptureTuyaDependencyLockSHA256"\n    static let fieldProcedureIdentifier = "'+PROCEDURE+'"\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '        let tuyaDependencyLockSHA256: String\n        let tuyaDeviceID: String\n',
              '        let tuyaDependencyLockSHA256: String\n        let procedureIdentifier: String\n        let tuyaDeviceID: String\n'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '    var fieldBuildSourceCommitSHA: String { buildIdentity.sourceCommitSHA }\n    var sdkAccountLoggedIn: Bool',
              '    var fieldBuildSourceCommitSHA: String { buildIdentity.sourceCommitSHA }\n    var fieldProcedureIdentifier: String { NembraCaptureBuildIdentity.fieldProcedureIdentifier }\n    var sdkAccountLoggedIn: Bool'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '            LabeledContent("Source commit", value: test.fieldBuildSourceCommitSHA)\n            LabeledContent("Private SDK config"',
              '            LabeledContent("Source commit", value: test.fieldBuildSourceCommitSHA)\n            LabeledContent("Procedure", value: test.fieldProcedureIdentifier)\n            LabeledContent("Private SDK config"'
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '            schemaVersion: 9,\n            purpose: "Sanitized Tuya authenticated read-only stationary preflight"',
              '            schemaVersion: 10,\n            purpose: "Sanitized Tuya authenticated read-only stationary preflight"',
          )
          replace_once(
              "NembraApp/App/NembraCaptureEntrypoint.swift",
              '            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n            tuyaDeviceID: deviceID,',
              '            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n            procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier,\n            tuyaDeviceID: deviceID,'
          )
          runbook = Path("docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md")
          source = runbook.read_text()
          title = "# Nembra Capture P0 â€” secure-link gate\n"
          marker = f"PROCEDURE_ID: `{PROCEDURE}`"
          if marker in source:
              raise SystemExit("runbook already carries procedure marker unexpectedly")
          if source.count(title) != 1:
              raise SystemExit("runbook title anchor changed")
          runbook.write_text(source.replace(title, title + "\n" + marker + "\n", 1))
          installer = Path("scripts/field/install_one_time_capture.command")
          source = installer.read_text()
          bundle_anchor = 'BUNDLE_ID="com.jonathangana131.nembra.capturelearn"\n'
          if source.count(bundle_anchor) != 1:
              raise SystemExit("installer bundle anchor changed")
          source = source.replace(bundle_anchor, bundle_anchor + f'PROCEDURE_ID="{PROCEDURE}"\n', 1)
          launch_anchor = '    "The exact built device app was read back before installation and matched the requested source SHA, field-build identifier, and standalone bundle identifier." \\\n'
          procedure_line = '    "Field procedure: $PROCEDURE_ID. Confirm the same identifier in Capture before OFF1 and in the canonical runbook." \\\n'
          if source.count(launch_anchor) != 1:
              raise SystemExit("installer launch anchor changed")
          source = source.replace(launch_anchor, launch_anchor + procedure_line, 1)
          installer.write_text(source)
          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift")
          if test_path.exists():
              raise SystemExit("procedure source test unexpectedly already exists")
