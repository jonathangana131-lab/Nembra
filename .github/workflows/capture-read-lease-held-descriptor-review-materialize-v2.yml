name: Capture Held Descriptor Reviewed Materializer V2

on:
  push:
    branches:
      - hardening/v17-capture-read-lease-held-descriptor-custody-sol-20260814
    paths:
      - .github/workflows/capture-read-lease-held-descriptor-review-materialize-v2.yml

permissions:
  contents: write

env:
  EXACT_PARENT: aa610e1000e58ba5e43e35a75ee8f22486aea5ec

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact reviewed authoring surface
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' '.github/workflows/capture-read-lease-held-descriptor-materialize.yml' '.github/workflows/capture-read-lease-held-descriptor-review-materialize.yml' '.github/workflows/capture-read-lease-held-descriptor-review-materialize-v2.yml' 'scripts/ci/tmp_capture_read_lease_review_materializer.py' | LC_ALL=C sort)"
          actual="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize and harden held-descriptor authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/tmp_capture_read_lease_review_materializer.py
          git diff --check

      - name: Run portable authority regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m py_compile scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_private_read_lease_component_walk.py scripts/ci/tmp_capture_read_lease_review_materializer.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          git diff --check

      - name: Publish clean permanent repair
        shell: bash
        env:
          BRANCH: hardening/v17-capture-read-lease-held-descriptor-custody-sol-20260814
        run: |
          set -euo pipefail
          rm .github/workflows/capture-read-lease-held-descriptor-materialize.yml
          rm .github/workflows/capture-read-lease-held-descriptor-review-materialize.yml
          rm .github/workflows/capture-read-lease-held-descriptor-review-materialize-v2.yml
          rm scripts/ci/tmp_capture_read_lease_review_materializer.py
          expected="$(printf '%s\n' 'scripts/ci/capture_selected_xcode_build_orchestrator.py' 'scripts/ci/tests/test_capture_private_read_lease_component_walk.py' | LC_ALL=C sort)"
          actual="$(git diff --name-only "$EXACT_PARENT" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check
          git config user.name nembra-capture-authority-bot
          git config user.email nembra-capture-authority-bot@users.noreply.github.com
          git add -A
          git commit -m 'fix(capture): hold private lease descriptors through grant'
          git push origin "HEAD:$BRANCH"
          echo 'NEMBRA_HELD_DESCRIPTOR_LEASE_MATERIALIZED productionChanged=true validationOnly=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false'
