name: Materialize Capture Foreground Integrity Current Sol

on:
  push:
    branches:
      - fix/v14-capture-foreground-integrity-current-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current ancestry and helper scope
        shell: bash
        run: |
          set -euo pipefail
          parent='6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          test "$(git merge-base HEAD "$parent")" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-foreground-integrity-current-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift'

      - name: Materialize foreground-integrity closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          marker = '    var privateConfig: Bool { OfficialTuyaFactory.configured }\n'
          if source.count(marker) != 1:
              raise SystemExit(f'expected one controller insertion marker, found {source.count(marker)}')
          lines = [
              '    func appDidLoseForeground() {',
              '        // Accepted evidence is already immutable. Foreground loss cannot rewrite that sealed artifact.',
              '        guard phase != .accepted else { return }',
              '',
              '        // Foreground-only authority is revoked synchronously before inspecting radio/session state.',
              '        acceptsViewScopedMembershipRequests = false',
              '        sdkDeviceMembershipVerified = false',
              '        membershipAccountUID = nil',
              '        membershipDeviceID = nil',
              '        membershipStatus = "Capture left the foreground. Exact scooter membership must be verified again before a fresh OFF1 attempt."',
              '        membershipRequestID = UUID()',
              '        membershipBusy = false',
              '#if canImport(ThingSmartHomeKit)',
              '        membershipProbe = nil',
              '#endif',
              '        officialConnectionRequestID = UUID()',
              '        watchdog?.cancel()',
              '        watchdog = nil',
              '',
              '        if processCorrelationLease != nil || correlationSession != nil {',
              '            // Existing helper stops package transport before releasing its owner-token lease.',
              '            abandonPackageCorrelation()',
              '            resetDiscoverySessionOnly()',
              '            phase = .failed',
              '            message = "Capture left the foreground during Bluetooth target correlation. Restart from OFF1; interrupted windows are never reusable evidence."',
              '            log("foreground_integrity_lost_during_target_correlation")',
              '            return',
              '        }',
              '',
              '        if phase == .correlated || phase == .selected {',
              '            resetDiscoverySessionOnly()',
              '            phase = .failed',
              '            message = "Capture left the foreground after target correlation. The correlated target was revoked; freshly verify membership and restart from OFF1."',
              '            log("foreground_integrity_lost_after_target_correlation")',
              '            return',
              '        }',
              '',
              '        if let token = currentConnectionToken {',
              '            let wasObserving = phase == .observing',
              '            phase = .failed',
              '            message = wasObserving',
              '                ? "Capture left the foreground during authenticated observation. Background time is not accepted evidence; restart from OFF1."',
              '                : "Capture left the foreground before authenticated observation completed. Relaunch or re-enter Secure Link before a fresh OFF1 attempt."',
              '            log(',
              '                wasObserving ? "foreground_integrity_lost_during_observation" : "foreground_integrity_lost_before_observation",',
              '                ["generation": String(token.diagnosticGeneration)]',
              '            )',
              '            Task { @MainActor [self] in',
              '                guard self.currentConnectionToken == token else { return }',
              '                if wasObserving {',
              '                    await self.invalidateObservationContinuity(',
              '                        token: token,',
              '                        message: "App foreground integrity was lost during authenticated observation. Background time is not accepted evidence; no BLE disconnect is claimed.",',
              '                        kind: "foreground_integrity_lost_during_observation"',
              '                    )',
              '                } else {',
              '                    await self.invalidateInternalLifecycle(',
              '                        token: token,',
              '                        message: "App foreground integrity was lost before authenticated observation completed. The exact generation was retired; no BLE disconnect is claimed.",',
              '                        kind: "foreground_integrity_lost_before_observation"',
              '                    )',
              '                }',
              '                if self.currentConnectionToken == nil {',
              '                    self.resetDiscoverySessionOnly()',
              '                }',
              '            }',
              '            return',
              '        }',
              '',
              '        if phase == .authenticating {',
              '            // The request-generation fence above forces a pending beginConnection task to retire',
              '            // any package generation it later mints before the SDK connect call is admitted.',
              '            localBLESettlementToken = nil',
              '            sdkLocalBLEOnline = false',
              '            driver = nil',
              '            resetDiscoverySessionOnly()',
              '            phase = .failed',
              '            message = "Capture left the foreground during authentication. Freshly verify membership and restart from OFF1; no BLE disconnect is claimed."',
              '            log("foreground_integrity_lost_before_observation")',
              '            return',
              '        }',
              '',
              '        if phase == .baseline || phase == .powerOn || phase == .scanning {',
              '            resetDiscoverySessionOnly()',
              '            phase = .failed',
              '            message = "Capture left the foreground during Bluetooth target correlation. Restart from OFF1; interrupted windows are never reusable evidence."',
              '            log("foreground_integrity_lost_during_target_correlation")',
              '        }',
              '    }',
              '',
          ]
          source = source.replace(marker, '\n'.join(lines) + marker, 1)
          old_env = '    @Environment(\\.dynamicTypeSize) private var dynamicTypeSize\n'
          new_env = old_env + '    @Environment(\\.scenePhase) private var scenePhase\n'
          if source.count(old_env) != 1:
              raise SystemExit(f'expected one Secure Link dynamic type environment line, found {source.count(old_env)}')
          source = source.replace(old_env, new_env, 1)
          old_hooks = '        .onDisappear {\n            test.abandonCorrelationForViewExit()\n        }\n        .onChange(of: sdkAccount.loggedIn) { _, loggedIn in\n'
          new_hooks = '        .onDisappear {\n            test.abandonCorrelationForViewExit()\n        }\n        .onChange(of: scenePhase) { _, newPhase in\n            if newPhase == .active {\n                test.activateMembershipRequestsForView()\n                if sdkAccount.loggedIn { test.verifySDKMembership() }\n            } else {\n                test.appDidLoseForeground()\n            }\n        }\n        .onChange(of: sdkAccount.loggedIn) { _, loggedIn in\n'
          if source.count(old_hooks) != 1:
              raise SystemExit(f'expected one Secure Link lifecycle hook site, found {source.count(old_hooks)}')
          source = source.replace(old_hooks, new_hooks, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify foreground authority source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('    func appDidLoseForeground() {')
          end = s.index('    var privateConfig: Bool', start)
          cleanup = s[start:end]
          assert 'guard phase != .accepted else { return }' in cleanup
          ordered = [
              'acceptsViewScopedMembershipRequests = false',
              'sdkDeviceMembershipVerified = false',
              'membershipAccountUID = nil',
              'membershipDeviceID = nil',
              'membershipRequestID = UUID()',
              'officialConnectionRequestID = UUID()',
              'if processCorrelationLease != nil || correlationSession != nil',
          ]
          offsets = [cleanup.index(token) for token in ordered]
          assert offsets == sorted(offsets), offsets
          assert 'abandonPackageCorrelation()' in cleanup
          assert 'phase == .correlated || phase == .selected' in cleanup
          assert 'resetDiscoverySessionOnly()' in cleanup
          assert 'invalidateObservationContinuity(' in cleanup
          assert 'invalidateInternalLifecycle(' in cleanup
          assert 'Task { @MainActor [self] in' in cleanup
          for forbidden in ('recordObservedTransportLoss', 'endConnection', 'disconnectBLE', 'releasePackageCorrelationLease()'):
              assert forbidden not in cleanup, forbidden
          view_start = s.index('private struct SecureLinkView: View')
          view_end = s.index('    private var hero: some View', view_start)
          view = s[view_start:view_end]
          assert '@Environment(\\.scenePhase) private var scenePhase' in view
          assert '.onChange(of: scenePhase)' in view
          assert 'if newPhase == .active' in view
          assert 'test.activateMembershipRequestsForView()' in view
          assert 'if sdkAccount.loggedIn { test.verifySDKMembership() }' in view
          assert 'test.appDidLoseForeground()' in view
          print('Capture exact-current foreground-integrity contract: PASS')
          PY
          git diff --check

      - name: Collapse helper to two product paths
        shell: bash
        run: |
          set -euo pipefail
          parent='6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          rm .github/workflows/materialize-capture-foreground-integrity-current-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          git add -u .github/workflows/materialize-capture-foreground-integrity-current-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): fail closed on foreground loss'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-foreground-integrity-current-sol
