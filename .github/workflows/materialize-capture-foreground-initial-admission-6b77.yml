name: Materialize Capture Foreground Initial Admission 6b77

on:
  push:
    branches:
      - recovery/v14-capture-foreground-r3-initial-admission-6b77-sol

permissions:
  contents: write

concurrency:
  group: capture-foreground-initial-admission-6b77
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-foreground-r3-initial-admission-6b77-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact current product and reviewed foreground donor
        shell: bash
        run: |
          set -euo pipefail
          product='6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          donor='3dd9e48080e2cc797f6e349f9dcbd54921e94ef2'
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          testfile='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift'
          test "$(git merge-base HEAD "$product")" = "$product"
          test "$(git rev-parse "$donor:$app")" = "$(git rev-parse HEAD:$app)"
          test "$(git rev-parse "$donor:$testfile")" = "$(git rev-parse HEAD:$testfile)"
          mapfile -t extra < <(git diff --name-only "$donor"...HEAD | sort)
          mapfile -t wanted < <(printf '%s\n' '.github/workflows/materialize-capture-foreground-initial-admission-6b77.yml' 'scripts/ci/materialize_capture_foreground_initial_admission_6b77.py' | sort)
          test "${#extra[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do test "${extra[$i]}" = "${wanted[$i]}"; done

      - name: Fence inactive initial view admission and parse
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_foreground_initial_admission_6b77.py
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          git diff --check

      - name: Verify complete foreground truth boundary
        shell: bash
        run: |
          set -euo pipefail
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          grep -Fq '@Environment(\.scenePhase) private var scenePhase' "$app"
          grep -Fq 'if scenePhase == .active {' "$app"
          grep -Fq 'if scenePhase == .active, sdkAccount.loggedIn { test.verifySDKMembership() }' "$app"
          grep -Fq 'test.appDidLoseForeground()' "$app"
          grep -Fq 'test.appDidRegainForeground()' "$app"
          grep -Fq 'private var lifecycleRetirementToken: TuyaReadOnlyConnectionToken?' "$app"
          grep -Fq 'sdkDeviceMembershipVerified = false' "$app"
          grep -Fq 'membershipAccountUID = nil' "$app"
          grep -Fq 'membershipDeviceID = nil' "$app"
          grep -Fq 'Task { @MainActor [self] in' "$app"
          grep -Fq 'Relaunch before another authenticated stationary read-only attempt' "$app"
          controller="$(sed -n '/private final class SecureLinkController/,/@MainActor.*OfficialTuyaDriver/p' "$app")"
          ! grep -Fq 'disconnectBLE' <<<"$controller"
          ! grep -Fq 'publishDps(' <<<"$controller"
          ! grep -Fq 'queryDps(' <<<"$controller"
          ! grep -Fq 'writeValue(' <<<"$controller"

      - name: Publish clean two-path current-product repair
        shell: bash
        run: |
          set -euo pipefail
          product='6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          rm -f .github/workflows/materialize-capture-foreground-initial-admission-6b77.yml
          rm -f scripts/ci/materialize_capture_foreground_initial_admission_6b77.py
          git add -A
          git diff --cached --check
          mapfile -t effective < <(git diff --name-only "$product" | sort)
          mapfile -t wanted < <(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' | sort)
          test "${#effective[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do test "${effective[$i]}" = "${wanted[$i]}"; done
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git commit -m 'fix(capture): gate initial membership admission on foreground'
          git push origin HEAD:recovery/v14-capture-foreground-r3-initial-admission-6b77-sol
