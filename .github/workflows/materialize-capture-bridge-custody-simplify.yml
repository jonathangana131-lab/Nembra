name: Materialize Capture Bridge Custody Simplification

on:
  push:
    branches:
      - sol/v14-capture-bridge-custody-simplify-current-20260810

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-bridge-custody-simplify-current-20260810
          fetch-depth: 0

      - name: Guard exact current product parent
        run: |
          set -euo pipefail
          product_parent='e8acd80c6f220529a98a4a4829514829c3321daa'
          test "$(git merge-base "$product_parent" HEAD)" = "$product_parent"
          git diff --quiet "$product_parent" HEAD -- NembraApp/Features/Research/TuyaAccountBridge.swift
          git diff --quiet "$product_parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift

      - name: Apply current bridge closure
        run: python3 scripts/ci/materialize_capture_bridge_custody_simplify.py apply

      - name: Verify current bridge closure
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_bridge_custody_simplify.py verify
          python3 -m py_compile scripts/ci/materialize_capture_bridge_custody_simplify.py
          git diff --check

      - name: Publish clean product checkpoint
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-bridge-custody-simplify.yml
          rm scripts/ci/materialize_capture_bridge_custody_simplify.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): fence metadata status and retire legacy root"
          git push origin HEAD:sol/v14-capture-bridge-custody-simplify-current-20260810
