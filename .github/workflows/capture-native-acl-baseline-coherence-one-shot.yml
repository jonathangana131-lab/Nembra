# V17 one-shot production child: bind held-FD rollback ACL to canonical-path ACL before grant.
name: Capture native ACL baseline coherence one-shot

on:
  push:
    branches:
      - repair/v17-capture-native-acl-baseline-coherence-gpt56sol-20260817
    paths:
      - .github/workflows/capture-native-acl-baseline-coherence-one-shot.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact production parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "repair/v17-capture-native-acl-baseline-coherence-gpt56sol-20260817"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e70b40e3f38705e651865a066f36eb4440239be0 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize paired native ACL baseline authority
        shell: python
        run: |
          from pathlib import Path

          orchestrator = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          text = orchestrator.read_text()

          old_bindings = '''    library.acl_get_fd.argtypes = [ctypes.c_int]\n    library.acl_get_fd.restype = ctypes.c_void_p\n    library.acl_dup.argtypes = [ctypes.c_void_p]\n    library.acl_dup.restype = ctypes.c_void_p\n'''
          new_bindings = '''    library.acl_get_fd.argtypes = [ctypes.c_int]\n    library.acl_get_fd.restype = ctypes.c_void_p\n    library.acl_get_file.argtypes = [ctypes.c_char_p, ctypes.c_int]\n    library.acl_get_file.restype = ctypes.c_void_p\n    library.acl_to_text.argtypes = [ctypes.c_void_p, ctypes.POINTER(ctypes.c_ssize_t)]\n    library.acl_to_text.restype = ctypes.c_void_p\n    library.acl_dup.argtypes = [ctypes.c_void_p]\n    library.acl_dup.restype = ctypes.c_void_p\n'''
          if text.count(old_bindings) != 1:
              raise SystemExit(f"expected one Darwin ACL binding anchor, found {text.count(old_bindings)}")
          text = text.replace(old_bindings, new_bindings, 1)

          old_capture = '''def _capture_fd_acl_baseline(descriptor: int) -> int:\n    \"\"\"Retain an acl_t that can restore this exact held object in finally.\"\"\"\n    library = _darwin_acl_library()\n    ctypes.set_errno(0)\n    current = library.acl_get_fd(descriptor)\n    if current:\n        ctypes.set_errno(0)\n        baseline = library.acl_dup(current)\n        duplicate_errno = ctypes.get_errno()\n        library.acl_free(current)\n        if not baseline:\n            raise SelectedXcodeBuildOrchestratorError(\n                \"could not duplicate descriptor-pinned private read-lease ACL baseline\"\n                + (f\": errno {duplicate_errno}\" if duplicate_errno else \"\")\n            )\n        return int(baseline)\n\n    baseline_errno = ctypes.get_errno()\n    # Only the Darwin ENOENT result has been physically classified as an absent\n    # extended ACL. A null return with errno 0 is not evidence of absence and\n    # must never be promoted into an authoritative empty rollback baseline.\n    if baseline_errno != errno.ENOENT:\n        raise SelectedXcodeBuildOrchestratorError(\n            \"could not classify descriptor-pinned private read-lease ACL baseline\"\n            f\": errno {baseline_errno}\"\n        )\n    ctypes.set_errno(0)\n    empty = library.acl_init(0)\n    empty_errno = ctypes.get_errno()\n    if not empty:\n        raise SelectedXcodeBuildOrchestratorError(\n            \"could not create empty private read-lease ACL baseline\"\n            + (f\": errno {empty_errno}\" if empty_errno else \"\")\n        )\n    return int(empty)\n\n\n'''
          new_capture = '''_DARWIN_ACL_TYPE_EXTENDED = 0x00000100\n\n\nclass _NativeACLBaseline(int):\n    \"\"\"Retained rollback acl_t plus the exact native pre-grant classification.\"\"\"\n\n    def __new__(cls, value: int, semantics: bytes | None):\n        instance = int.__new__(cls, value)\n        instance.semantics = semantics\n        return instance\n\n\ndef _native_acl_text(library, acl: int, label: str) -> bytes:\n    length = ctypes.c_ssize_t(0)\n    ctypes.set_errno(0)\n    raw = library.acl_to_text(ctypes.c_void_p(int(acl)), ctypes.byref(length))\n    saved_errno = ctypes.get_errno()\n    if not raw:\n        raise SelectedXcodeBuildOrchestratorError(\n            f\"could not canonicalize {label} private read-lease ACL\"\n            + (f\": errno {saved_errno}\" if saved_errno else \"\")\n        )\n    try:\n        if length.value < 0:\n            raise SelectedXcodeBuildOrchestratorError(\n                f\"could not canonicalize {label} private read-lease ACL: negative text length\"\n            )\n        return ctypes.string_at(raw, length.value)\n    finally:\n        if library.acl_free(ctypes.c_void_p(int(raw))) != 0:\n            raise SelectedXcodeBuildOrchestratorError(\n                f\"could not free {label} private read-lease ACL text\"\n            )\n\n\ndef _capture_fd_acl_baseline(descriptor: int) -> _NativeACLBaseline:\n    \"\"\"Retain rollback acl_t and native semantics for this exact held object.\"\"\"\n    library = _darwin_acl_library()\n    ctypes.set_errno(0)\n    current = library.acl_get_fd(descriptor)\n    if current:\n        ctypes.set_errno(0)\n        baseline = library.acl_dup(current)\n        duplicate_errno = ctypes.get_errno()\n        if library.acl_free(current) != 0:\n            if baseline:\n                library.acl_free(baseline)\n            raise SelectedXcodeBuildOrchestratorError(\n                \"could not free descriptor-pinned private read-lease ACL acquisition\"\n            )\n        if not baseline:\n            raise SelectedXcodeBuildOrchestratorError(\n                \"could not duplicate descriptor-pinned private read-lease ACL baseline\"\n                + (f\": errno {duplicate_errno}\" if duplicate_errno else \"\")\n            )\n        try:\n            semantics = _native_acl_text(library, int(baseline), \"descriptor baseline\")\n        except Exception:\n            library.acl_free(baseline)\n            raise\n        return _NativeACLBaseline(int(baseline), semantics)\n\n    baseline_errno = ctypes.get_errno()\n    # Only the Darwin ENOENT result has been physically classified as an absent\n    # extended ACL. A null return with errno 0 is not evidence of absence and\n    # must never be promoted into an authoritative empty rollback baseline.\n    if baseline_errno != errno.ENOENT:\n        raise SelectedXcodeBuildOrchestratorError(\n            \"could not classify descriptor-pinned private read-lease ACL baseline\"\n            f\": errno {baseline_errno}\"\n        )\n    ctypes.set_errno(0)\n    empty = library.acl_init(0)\n    empty_errno = ctypes.get_errno()\n    if not empty:\n        raise SelectedXcodeBuildOrchestratorError(\n            \"could not create empty private read-lease ACL baseline\"\n            + (f\": errno {empty_errno}\" if empty_errno else \"\")\n        )\n    return _NativeACLBaseline(int(empty), None)\n\n\ndef _require_native_acl_baseline_coherence(\n    path: Path,\n    descriptor: int,\n    accepted_signature: tuple[int, int, int],\n    is_directory: bool,\n    baseline_acl: _NativeACLBaseline,\n) -> None:\n    \"\"\"Require held-FD and canonical-path native ACL views to describe one baseline.\"\"\"\n    semantics = getattr(baseline_acl, \"semantics\", object())\n    if semantics is not None and not isinstance(semantics, bytes):\n        raise SelectedXcodeBuildOrchestratorError(\n            \"descriptor-pinned private read-lease ACL baseline classification is unavailable\"\n        )\n\n    _require_canonical_acl_identity(path, descriptor, accepted_signature, is_directory)\n    library = _darwin_acl_library()\n    ctypes.set_errno(0)\n    current = library.acl_get_file(os.fsencode(path), _DARWIN_ACL_TYPE_EXTENDED)\n    path_errno = ctypes.get_errno()\n    path_semantics: bytes | None\n    if current:\n        try:\n            path_semantics = _native_acl_text(library, int(current), \"canonical path baseline\")\n        finally:\n            if library.acl_free(current) != 0:\n                raise SelectedXcodeBuildOrchestratorError(\n                    \"could not free canonical-path private read-lease ACL baseline\"\n                )\n    else:\n        if path_errno != errno.ENOENT:\n            raise SelectedXcodeBuildOrchestratorError(\n                \"could not classify canonical-path private read-lease ACL baseline\"\n                f\": errno {path_errno}\"\n            )\n        path_semantics = None\n\n    # The native comparison is authority only while the pathname still names the\n    # continuously held accepted object. Re-attest after native path acquisition.\n    _require_canonical_acl_identity(path, descriptor, accepted_signature, is_directory)\n    if (semantics is None) != (path_semantics is None):\n        raise SelectedXcodeBuildOrchestratorError(\n            \"descriptor/canonical-path private read-lease ACL baseline classes diverge\"\n        )\n    if semantics is not None and semantics != path_semantics:\n        raise SelectedXcodeBuildOrchestratorError(\n            \"descriptor/canonical-path private read-lease ACL baseline semantics diverge\"\n        )\n\n\n'''
          if text.count(old_capture) != 1:
              raise SystemExit(f"expected one FD baseline capture anchor, found {text.count(old_capture)}")
          text = text.replace(old_capture, new_capture, 1)

          old_grant = '''                if self._use_native_darwin_acl:\n                    record[\"native_baseline_acl\"] = _capture_fd_acl_baseline(descriptor)\n                    before = _path_acl_listing(\n                        path, descriptor, accepted_signature, is_directory\n                    )\n'''
          new_grant = '''                if self._use_native_darwin_acl:\n                    record[\"native_baseline_acl\"] = _capture_fd_acl_baseline(descriptor)\n                    _require_native_acl_baseline_coherence(\n                        path,\n                        descriptor,\n                        accepted_signature,\n                        is_directory,\n                        record[\"native_baseline_acl\"],\n                    )\n                    before = _path_acl_listing(\n                        path, descriptor, accepted_signature, is_directory\n                    )\n'''
          if text.count(old_grant) != 1:
              raise SystemExit(f"expected one strict native grant anchor, found {text.count(old_grant)}")
          orchestrator.write_text(text.replace(old_grant, new_grant, 1))

          tests_path = Path("scripts/ci/tests/test_capture_private_read_lease_rollback.py")
          tests = tests_path.read_text()
          old_enoent = '''        self.assertEqual(baseline, 0xC0FFEE)\n        library.acl_get_fd.assert_called_once_with(74)\n        library.acl_init.assert_called_once_with(0)\n        library.acl_free.assert_not_called()\n\n    def test_native_strict_revoke_restores_held_object_after_path_replacement(self) -> None:\n'''
          new_enoent = '''        self.assertEqual(baseline, 0xC0FFEE)\n        self.assertIsNone(baseline.semantics)\n        library.acl_get_fd.assert_called_once_with(74)\n        library.acl_init.assert_called_once_with(0)\n        library.acl_free.assert_not_called()\n\n    def test_native_seeded_fd_baseline_retains_canonical_semantics(self) -> None:\n        helper = load()\n        library = mock.Mock()\n        library.acl_get_fd.return_value = 0xA001\n        library.acl_dup.return_value = 0xA002\n        library.acl_free.return_value = 0\n\n        with (\n            mock.patch.object(helper, \"_darwin_acl_library\", return_value=library),\n            mock.patch.object(\n                helper, \"_native_acl_text\", return_value=b\"user:root allow readattr\\n\"\n            ) as canonicalize,\n        ):\n            baseline = helper._capture_fd_acl_baseline(75)\n\n        self.assertEqual(baseline, 0xA002)\n        self.assertEqual(baseline.semantics, b\"user:root allow readattr\\n\")\n        library.acl_get_fd.assert_called_once_with(75)\n        library.acl_dup.assert_called_once_with(0xA001)\n        canonicalize.assert_called_once_with(library, 0xA002, \"descriptor baseline\")\n        library.acl_free.assert_called_once_with(0xA001)\n\n    def test_native_baseline_coherence_accepts_equal_seeded_views(self) -> None:\n        helper = load()\n        library = mock.Mock()\n        library.acl_get_file.return_value = 0xB001\n        library.acl_free.return_value = 0\n        baseline = helper._NativeACLBaseline(0xB002, b\"seeded-acl\")\n\n        with (\n            mock.patch.object(helper, \"_darwin_acl_library\", return_value=library),\n            mock.patch.object(\n                helper, \"_native_acl_text\", return_value=b\"seeded-acl\"\n            ),\n            mock.patch.object(helper, \"_require_canonical_acl_identity\") as identity,\n        ):\n            helper._require_native_acl_baseline_coherence(\n                Path(\"/private/tmp/accepted\"), 81, (1, 2, 3), True, baseline\n            )\n\n        self.assertEqual(identity.call_count, 2)\n        library.acl_get_file.assert_called_once_with(\n            os.fsencode(Path(\"/private/tmp/accepted\")), helper._DARWIN_ACL_TYPE_EXTENDED\n        )\n        library.acl_free.assert_called_once_with(0xB001)\n\n    def test_native_baseline_coherence_rejects_semantic_mismatch_before_grant(self) -> None:\n        helper = load()\n        library = mock.Mock()\n        library.acl_get_file.return_value = 0xC001\n        library.acl_free.return_value = 0\n        baseline = helper._NativeACLBaseline(0xC002, b\"fd-acl\")\n\n        with (\n            mock.patch.object(helper, \"_darwin_acl_library\", return_value=library),\n            mock.patch.object(helper, \"_native_acl_text\", return_value=b\"path-acl\"),\n            mock.patch.object(helper, \"_require_canonical_acl_identity\"),\n            self.assertRaisesRegex(\n                helper.SelectedXcodeBuildOrchestratorError,\n                \"baseline semantics diverge\",\n            ),\n        ):\n            helper._require_native_acl_baseline_coherence(\n                Path(\"/private/tmp/accepted\"), 82, (1, 2, 3), True, baseline\n            )\n\n        library.acl_free.assert_called_once_with(0xC001)\n\n    def test_native_baseline_coherence_accepts_enoent_only_when_both_absent(self) -> None:\n        helper = load()\n        library = mock.Mock()\n\n        def absent_path(_path, _acl_type):\n            helper.ctypes.set_errno(helper.errno.ENOENT)\n            return None\n\n        library.acl_get_file.side_effect = absent_path\n        baseline = helper._NativeACLBaseline(0xD001, None)\n        with (\n            mock.patch.object(helper, \"_darwin_acl_library\", return_value=library),\n            mock.patch.object(helper, \"_require_canonical_acl_identity\") as identity,\n        ):\n            helper._require_native_acl_baseline_coherence(\n                Path(\"/private/tmp/accepted\"), 83, (1, 2, 3), True, baseline\n            )\n        self.assertEqual(identity.call_count, 2)\n\n    def test_native_baseline_coherence_rejects_mixed_absent_present_classes(self) -> None:\n        helper = load()\n        library = mock.Mock()\n\n        def absent_path(_path, _acl_type):\n            helper.ctypes.set_errno(helper.errno.ENOENT)\n            return None\n\n        library.acl_get_file.side_effect = absent_path\n        baseline = helper._NativeACLBaseline(0xD002, b\"fd-present\")\n        with (\n            mock.patch.object(helper, \"_darwin_acl_library\", return_value=library),\n            mock.patch.object(helper, \"_require_canonical_acl_identity\"),\n            self.assertRaisesRegex(\n                helper.SelectedXcodeBuildOrchestratorError,\n                \"baseline classes diverge\",\n            ),\n        ):\n            helper._require_native_acl_baseline_coherence(\n                Path(\"/private/tmp/accepted\"), 84, (1, 2, 3), True, baseline\n            )\n\n    def test_native_baseline_coherence_rejects_null_path_acl_without_enoent(self) -> None:\n        helper = load()\n        library = mock.Mock()\n        library.acl_get_file.return_value = None\n        baseline = helper._NativeACLBaseline(0xD003, None)\n        with (\n            mock.patch.object(helper, \"_darwin_acl_library\", return_value=library),\n            mock.patch.object(helper, \"_require_canonical_acl_identity\"),\n            self.assertRaisesRegex(\n                helper.SelectedXcodeBuildOrchestratorError,\n                \"could not classify canonical-path private read-lease ACL baseline: errno 0\",\n            ),\n        ):\n            helper._require_native_acl_baseline_coherence(\n                Path(\"/private/tmp/accepted\"), 85, (1, 2, 3), True, baseline\n            )\n\n    def test_native_strict_revoke_restores_held_object_after_path_replacement(self) -> None:\n'''
          if tests.count(old_enoent) != 1:
              raise SystemExit(f"expected one ENOENT regression anchor, found {tests.count(old_enoent)}")
          tests = tests.replace(old_enoent, new_enoent, 1)

          old_mocks = '''                mock.patch.object(\n                    helper, \"_capture_fd_acl_baseline\", return_value=4242\n                ) as capture,\n                mock.patch.object(\n                    helper, \"_path_acl_listing\", side_effect=lambda *_args: next(listings)\n                ),\n'''
          new_mocks = '''                mock.patch.object(\n                    helper, \"_capture_fd_acl_baseline\", return_value=4242\n                ) as capture,\n                mock.patch.object(\n                    helper, \"_require_native_acl_baseline_coherence\"\n                ) as coherence,\n                mock.patch.object(\n                    helper, \"_path_acl_listing\", side_effect=lambda *_args: next(listings)\n                ),\n'''
          if tests.count(old_mocks) != 1:
              raise SystemExit(f"expected one strict native mock anchor, found {tests.count(old_mocks)}")
          tests = tests.replace(old_mocks, new_mocks, 1)

          old_assert = '''            capture.assert_called_once_with(descriptor)\n            grant.assert_called_once()\n'''
          new_assert = '''            capture.assert_called_once_with(descriptor)\n            coherence.assert_called_once_with(subject, descriptor, signature, False, 4242)\n            grant.assert_called_once()\n'''
          if tests.count(old_assert) != 1:
              raise SystemExit(f"expected one strict native assertion anchor, found {tests.count(old_assert)}")
          tests_path.write_text(tests.replace(old_assert, new_assert, 1))

      - name: Run focused production regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-native-acl-coherence-pycache"
          python3 -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          git diff --check

      - name: Enforce narrow product delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py | sort)"
          test "$changed" = "$expected"
          grep -F 'library.acl_get_file.argtypes = [ctypes.c_char_p, ctypes.c_int]' scripts/ci/capture_selected_xcode_build_orchestrator.py
          grep -F '_require_native_acl_baseline_coherence(' scripts/ci/capture_selected_xcode_build_orchestrator.py
          ! grep -nE 'publishDps\(|writeValue\(|removeDevice|factoryReset' scripts/ci/capture_selected_xcode_build_orchestrator.py

      - name: Publish clean production child
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='repair/v17-capture-native-acl-baseline-coherence-gpt56sol-20260817'
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py \
                  scripts/ci/tests/test_capture_private_read_lease_rollback.py
          git rm .github/workflows/capture-native-acl-baseline-coherence-one-shot.yml
          git diff --cached --check
          git commit -m "Capture: bind native ACL rollback baseline to canonical path"
          git push origin HEAD:"$branch"
