name: One-shot fence legacy SDK acceptance

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
    paths:
      - '.github/workflows/one-shot-fence-legacy-sdk-acceptance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/one-time-ble-dump-gpt56
          fetch-depth: 1

      - name: Keep authenticated Tuya survival observation-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = p.read_text()
          needle = '''                switch TuyaAuthenticatedReadOnlyPreflight.verdict(for: self.ledgerSnapshot) {\n                case .readyForStationaryMapping:\n'''
          replacement = '''                // Structured Tuya SDK/application readiness is transport evidence only.\n                // It must never retire this authenticated generation before C7D09A22\n                // raw FD50 characteristic custody can be earned. Keep listening.\n                if case .readyForStationaryMapping = TuyaAuthenticatedReadOnlyPreflight.verdict(for: self.ledgerSnapshot) {\n                    self.message = "Authenticated Tuya application evidence is stable for generation \\(token.diagnosticGeneration), but physical GO remains blocked. Keeping the authenticated session alive for retained raw FD50 characteristic notifications beyond the historical rejection window."\n                    self.log("legacy_sdk_readiness_observation_only", [\n                        "generation": String(token.diagnosticGeneration),\n                        "authority": "tuya-sdk-application-evidence-not-physical-go"\n                    ])\n                    try? await Task.sleep(for: .seconds(1))\n                    continue\n                }\n\n                switch TuyaAuthenticatedReadOnlyPreflight.verdict(for: self.ledgerSnapshot) {\n                case .readyForStationaryMapping:\n'''
          count = s.count(needle)
          if count != 1:
              raise SystemExit(f'expected exactly one watchdog readiness switch, found {count}')
          p.write_text(s.replace(needle, replacement, 1))
          PY

          rm .github/workflows/one-shot-fence-legacy-sdk-acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/one-shot-fence-legacy-sdk-acceptance.yml
          git commit -m 'Physical truth: keep SDK readiness observation-only'
          git push origin HEAD:capture/one-time-ble-dump-gpt56
