name: Temporary Capture Root XXXL Recompose

on:
  push:
    branches:
      - product/v14-capture-root-xxxl-recompose-sol

permissions:
  contents: write

jobs:
  patch-root:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Apply exact presentation-only root recompose
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          expected_blob = 'f8bf601343e89809874f5a2f488bd0db3c2d9fd8'
          actual_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'Unexpected entrypoint blob: {actual_blob}; expected {expected_blob}')

          start_marker = '@MainActor\nprivate struct CaptureP0Root: View {'
          end_marker = '\n@MainActor\nprivate final class SecureLinkController'
          start = source.index(start_marker)
          end = source.index(end_marker, start)

          replacement = r'''@MainActor
          private struct CaptureP0Root: View {
              @StateObject private var tuya = TuyaAccountBridge()
              @State private var showEngineeringDetails = false
              @Environment(\.dynamicTypeSize) private var dynamicTypeSize

              var body: some View {
                  NavigationStack {
                      ZStack {
                          Color.black.ignoresSafeArea()
                          RadialGradient(
                              colors: [Color.cyan.opacity(0.13), Color.clear],
                              center: .topTrailing,
                              startRadius: 0,
                              endRadius: 560
                          )
                          .ignoresSafeArea()

                          ScrollView {
                              VStack(alignment: .leading, spacing: dynamicTypeSize.isAccessibilitySize ? 14 : 22) {
                                  rootHero

                                  rootPanel {
                                      rootAccountPanel
                                  }

                                  if tuya.isLinked {
                                      rootPanel {
                                          VStack(alignment: .leading, spacing: 14) {
                                              HStack {
                                                  VStack(alignment: .leading, spacing: 3) {
                                                      Text("Choose this scooter")
                                                          .font(.title3.bold())
                                                      Text("Nembra will verify the selected device again inside the official SDK before Bluetooth discovery.")
                                                          .font(.footnote)
                                                          .foregroundStyle(.secondary)
                                                  }
                                                  Spacer(minLength: 8)
                                                  if tuya.devices.isEmpty {
                                                      Button("Refresh") { tuya.refreshDevices() }
                                                          .buttonStyle(.bordered)
                                                  }
                                              }

                                              ForEach(tuya.devices) { device in
                                                  VStack(alignment: .leading, spacing: 10) {
                                                      HStack(alignment: .firstTextBaseline) {
                                                          VStack(alignment: .leading, spacing: 3) {
                                                              Text(device.name.isEmpty ? "Unnamed Tuya device" : device.name)
                                                                  .font(.headline)
                                                              let detail = [device.productName, device.category].filter { !$0.isEmpty }.joined(separator: " · ")
                                                              if !detail.isEmpty {
                                                                  Text(detail)
                                                                      .font(.caption)
                                                                      .foregroundStyle(.secondary)
                                                              }
                                                          }
                                                          Spacer()
                                                          if tuya.selectedDeviceID == device.id {
                                                              Image(systemName: "checkmark.circle.fill")
                                                                  .foregroundStyle(.green)
                                                                  .accessibilityLabel("Selected")
                                                          }
                                                      }

                                                      HStack(spacing: 10) {
                                                          Button(tuya.selectedDeviceID == device.id ? "Refresh metadata" : "Use this scooter") {
                                                              tuya.selectDevice(device)
                                                          }
                                                          .buttonStyle(.bordered)

                                                          if tuya.selectedDeviceID == device.id,
                                                             tuya.phase == .ready,
                                                             !device.productID.isEmpty,
                                                             !device.uuid.isEmpty {
                                                              NavigationLink("Continue to Capture") { SecureLinkView(device: device) }
                                                                  .buttonStyle(.borderedProminent)
                                                          }
                                                      }
                                                  }
                                                  .padding(14)
                                                  .background(.white.opacity(0.045), in: RoundedRectangle(cornerRadius: 16, style: .continuous))
                                              }
                                          }
                                      }
                                  }

                                  DisclosureGroup(isExpanded: $showEngineeringDetails) {
                                      VStack(alignment: .leading, spacing: 8) {
                                          Text("Account approval and device metadata only establish setup context. Capture independently verifies the current official SDK session and exact scooter membership before discovery.")
                                          Text("No scooter commands are sent by this setup flow.")
                                      }
                                      .font(.caption)
                                      .foregroundStyle(.secondary)
                                      .padding(.top, 8)
                                  } label: {
                                      Label("Engineering details", systemImage: "wrench.and.screwdriver")
                                          .font(.subheadline.weight(.semibold))
                                  }
                                  .tint(.secondary)
                              }
                              .frame(maxWidth: 720)
                              .padding(.horizontal, 20)
                              .padding(.top, dynamicTypeSize.isAccessibilitySize ? 12 : 22)
                              .padding(.bottom, 44)
                              .frame(maxWidth: .infinity)
                          }
                          .scrollIndicators(.hidden)
                      }
                      .navigationTitle("Nembra Capture")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }

              @ViewBuilder
              private var rootHero: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      Text("NEMBRA CAPTURE")
                          .font(.caption2.bold())
                          .tracking(1.5)
                          .foregroundStyle(.cyan)
                      Text("Prepare the scooter link")
                          .font(.largeTitle.bold())
                      if !dynamicTypeSize.isAccessibilitySize {
                          Text("One guided setup establishes the account and bound-device context Nembra will use before passive target correlation begins.")
                              .font(.body)
                              .foregroundStyle(.secondary)
                              .fixedSize(horizontal: false, vertical: true)
                      }
                  }
              }

              @ViewBuilder
              private var rootAccountPanel: some View {
                  VStack(alignment: .leading, spacing: dynamicTypeSize.isAccessibilitySize ? 10 : 14) {
                      Label(tuya.isLinked ? "Account link ready" : "Link your scooter account", systemImage: tuya.isLinked ? "checkmark.circle.fill" : "person.crop.circle.badge.checkmark")
                          .font(.title3.bold())
                          .foregroundStyle(tuya.isLinked ? Color.green : Color.primary)

                      if dynamicTypeSize.isAccessibilitySize {
                          accountLinkPrimaryFieldsAndAction
                          accountLinkSupportingCopy
                      } else {
                          accountLinkSupportingCopy
                          accountLinkPrimaryFieldsAndAction
                      }

                      if let data = tuya.qrPNGData,
                         let image = UIImage(data: data),
                         !tuya.isLinked {
                          Image(uiImage: image)
                              .interpolation(.none)
                              .resizable()
                              .scaledToFit()
                              .frame(maxWidth: 230)
                              .padding(10)
                              .background(.white, in: RoundedRectangle(cornerRadius: 16, style: .continuous))
                          Button("I approved it · check now") { tuya.checkApprovalNow() }
                              .buttonStyle(.bordered)
                              .controlSize(.large)
                      }

                      if tuya.phase == .failed {
                          Button("Reset account link") { tuya.resetLink() }
                              .buttonStyle(.bordered)
                      }
                  }
              }

              @ViewBuilder
              private var accountLinkPrimaryFieldsAndAction: some View {
                  if !tuya.isLinked {
                      TextField("Tuya Smart User Code", text: $tuya.userCode)
                          .textInputAutocapitalization(.never)
                          .autocorrectionDisabled()
                          .padding(12)
                          .background(.white.opacity(0.07), in: RoundedRectangle(cornerRadius: 14, style: .continuous))
                      Button("Create approval QR") { tuya.requestApproval() }
                          .buttonStyle(.borderedProminent)
                          .controlSize(.large)
                          .accessibilityIdentifier("nembra.capture.root.account-link-action")
                          .accessibilityHint("Creates a QR code to approve this account link in Tuya.")
                  }
              }

              @ViewBuilder
              private var accountLinkSupportingCopy: some View {
                  Text(tuya.statusMessage)
                      .font(.footnote)
                      .foregroundStyle(.secondary)
                      .fixedSize(horizontal: false, vertical: true)

                  if dynamicTypeSize.isAccessibilitySize {
                      Text("One guided setup establishes the account and bound-device context Nembra will use before passive target correlation begins.")
                          .font(.footnote)
                          .foregroundStyle(.secondary)
                          .fixedSize(horizontal: false, vertical: true)
                  }
              }

              @ViewBuilder
              private func rootPanel<Content: View>(@ViewBuilder content: () -> Content) -> some View {
                  content()
                      .padding(dynamicTypeSize.isAccessibilitySize ? 14 : 18)
                      .frame(maxWidth: .infinity, alignment: .leading)
                      .background(
                          RoundedRectangle(cornerRadius: 24, style: .continuous)
                              .fill(.white.opacity(0.055))
                              .overlay(
                                  RoundedRectangle(cornerRadius: 24, style: .continuous)
                                      .stroke(.white.opacity(0.09), lineWidth: 1)
                              )
                      )
              }
          }
          '''

          updated = source[:start] + replacement + source[end:]
          if updated == source:
              raise SystemExit('Root replacement produced no change')
          if updated.count(start_marker) != 1:
              raise SystemExit('CaptureP0Root marker count changed unexpectedly')
          if updated.count(end_marker) != 1:
              raise SystemExit('SecureLinkController marker count changed unexpectedly')
          required = [
              '@Environment(\\.dynamicTypeSize) private var dynamicTypeSize',
              'if !dynamicTypeSize.isAccessibilitySize',
              'private var rootAccountPanel: some View',
              'accountLinkPrimaryFieldsAndAction',
              'accountLinkSupportingCopy',
              'nembra.capture.root.account-link-action',
          ]
          for needle in required:
              if needle not in updated:
                  raise SystemExit(f'Missing required root-recompose source: {needle}')
          forbidden = ['publishDps', 'writeValue', 'NEMBRA_SIMULATION_', 'SIMCTL_CHILD_']
          root = updated[updated.index(start_marker):updated.index(end_marker)]
          for needle in forbidden:
              if needle in root:
                  raise SystemExit(f'Presentation-only root unexpectedly contains authority surface: {needle}')
          path.write_text(updated, encoding='utf-8')
          PY

          git diff --check -- NembraApp/App/NembraCaptureEntrypoint.swift
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Commit production recompose
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --cached --check
          git commit -m 'fix(capture): recompose root for Accessibility XXXL'
          git push origin HEAD:${GITHUB_REF_NAME}
