name: tmp V14 Bootstrap Dependency Guard Adapter

on:
  push:
    branches:
      - repair/v14-private-recovery-unlink-race-sol-4f57unlink-20260811
    paths:
      - .github/workflows/tmp-v14-bootstrap-resolution-adapter.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Bind to adapter-addition head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '983bd3fb9518ab7c7ae3f2ce62eb44a2bb71750c'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/tmp-v14-bootstrap-resolution-adapter.yml'

      - name: Route bootstrap through private-only adapter
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('Scripts/bootstrap_capture_tuya_sdk.sh')
          text = path.read_text(encoding='utf-8')
          old = 'PRIVATE_INPUT_RESOLUTION_GUARD="$SCRIPT_DIR/capture_tuya_private_input_build_guard.py"'
          new = 'PRIVATE_INPUT_RESOLUTION_GUARD="$SCRIPT_DIR/capture_tuya_private_dependency_resolution_guard.py"'
          if text.count(old) != 1:
              raise SystemExit('unexpected dependency-resolution guard variable shape')
          text = text.replace(old, new, 1)
          text = text.replace(
              '# The existing field-build guard is generic vnode custody: its --lockfile slot\n'
              '# is a watched regular-file anchor. During dependency resolution we deliberately\n',
              '# The dependency-resolution adapter invokes the canonical field guard through its\n'
              '# explicitly private-only run_guarded_build API. Its --lockfile slot remains a\n'
              '# watched regular-file anchor; during dependency resolution we deliberately\n',
              1,
          )
          text = text.replace(
              'echo "ERROR: private-input vnode custody guard is missing from the accepted source."',
              'echo "ERROR: private-input dependency-resolution custody adapter is missing from the accepted source."',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          /bin/bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_dependency_resolution_guard.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_failed_bootstrap_authority.py
          git diff --check

      - name: Publish durable call-site repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nembra Swarm'
          git config user.email 'noreply@users.noreply.github.com'
          git add Scripts/bootstrap_capture_tuya_sdk.sh
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Capture P0: use private-only guard for dependency resolution'
          git push origin "HEAD:${GITHUB_REF_NAME}"
