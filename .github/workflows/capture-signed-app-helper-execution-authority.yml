name: Capture Signed App Helper Execution Authority

on:
  push:
    branches:
      - repair/v14-signed-app-helper-execution-go56
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/capture_signed_app_install_custody.py
      - scripts/ci/tests/test_capture_signed_app_helper_execution_authority.py
      - .github/workflows/capture-signed-app-helper-execution-authority.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-helper-execution:
    name: Execute only exact accepted custody-helper bytes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'Exact helper-execution source: %s\n' "$actual"

      - name: Validate installer and executable authority regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_signed_app_helper_execution_authority.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_helper_execution_authority.py

      - name: Preserve physical truth boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'No outdoor ride is authorized by this installer.' scripts/field/install_one_time_capture.command
          grep -Fq 'run_accepted_signed_app_custody_helper' scripts/field/install_one_time_capture.command
          printf '%s\n' 'Helper execution custody creates no BLE, telemetry, command, or physical authority.'
