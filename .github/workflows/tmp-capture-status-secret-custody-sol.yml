name: Temporary Capture Status Secret Custody

on:
  push:
    branches:
      - repair/v14-capture-account-status-secret-custody-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-account-status-secret-custody-sol
          fetch-depth: 2

      - name: Guard exact reviewed parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e8acd80c6f220529a98a4a4829514829c3321daa"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tmp-capture-status-secret-custody-sol.yml"

      - name: Close status secret custody gap
        shell: python
        run: |
          from pathlib import Path

          bridge = Path("NembraApp/Features/Research/TuyaAccountBridge.swift")
          text = bridge.read_text()
          old_admit = "selectedDeviceStatus = statusMap"
          new_admit = "selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]"
          if text.count(old_admit) != 1:
              raise SystemExit(f"unexpected status admission anchor count: {text.count(old_admit)}")
          text = text.replace(old_admit, new_admit, 1)

          old_export = '"status": selectedDeviceStatus ?? [:],'
          new_export = '"status": Self.redactSecrets(selectedDeviceStatus ?? [:]),'
          if text.count(old_export) != 1:
              raise SystemExit(f"unexpected status export anchor count: {text.count(old_export)}")
          text = text.replace(old_export, new_export, 1)
          bridge.write_text(text)

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift")
          test_path.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya metadata status secret redaction source contract")
          struct TuyaMetadataStatusSecretRedactionSourceTests {
              @Test("raw status entries are redacted before retained UI state")
              func statusAdmissionCannotBypassRecursiveSecretRedaction() throws {
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let load = try section(in: bridge, from: "private func loadSelectedDeviceDetails", to: "private func signedGET")
                  let body = String(load)
                  #expect(body.contains("selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]"))
                  #expect(!body.contains("selectedDeviceStatus = statusMap"))
              }

              @Test("export re-applies redaction to retained status as defense in depth")
              func exportCannotTrustRetainedStatusMapWithoutRedaction() throws {
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let export = try section(in: bridge, from: "func prepareRedactedExport()", to: "func resetLink()")
                  let body = String(export)
                  #expect(body.contains("\"status\": Self.redactSecrets(selectedDeviceStatus ?? [:])"))
                  #expect(!body.contains("\"status\": selectedDeviceStatus ?? [:]"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          ''')

      - name: Verify narrow secret-custody repair
        shell: bash
        run: |
          set -euo pipefail
          bridge='NembraApp/Features/Research/TuyaAccountBridge.swift'
          test_file='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift'
          grep -Fq 'selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]' "$bridge"
          grep -Fq '"status": Self.redactSecrets(selectedDeviceStatus ?? [:]),' "$bridge"
          ! grep -Fq 'selectedDeviceStatus = statusMap' "$bridge"
          ! grep -Fq '"status": selectedDeviceStatus ?? [:],' "$bridge"
          grep -Fq 'secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "seckey", "authkey"]' "$bridge"
          swiftc -parse "$bridge"
          swiftc -parse "$test_file"
          git diff --check

      - name: Commit repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git add NembraApp/Features/Research/TuyaAccountBridge.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift
          git diff --cached --check
          git commit -m 'fix(capture): redact status metadata secrets at both custody boundaries'
          git push origin HEAD:repair/v14-capture-account-status-secret-custody-sol
