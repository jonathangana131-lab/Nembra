name: Capture exact inspection subject flagship composition

on:
  push:
    branches:
      - integration/es80-v14-exact-inspection-compose-go

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact live flagship parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0a8f6b765b007b35a3f3018966c9cc2214543886"

      - name: Merge reviewed exact-subject lineage
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="9e0482b2995e91e8e6bb1ee6720bb91dc599a6b3"
          git fetch --no-tags origin "$SOURCE_HEAD"
          test "$(git cat-file -t "$SOURCE_HEAD")" = commit
          git merge --no-ff --no-edit "$SOURCE_HEAD"

      - name: Validate composed producer integrity
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_private_runner.py
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_evidence.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          python3 scripts/ci/es80_signed_field_artifact_evidence.py --self-test
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
          git diff --check HEAD^

      - name: Remove temporary workflow and publish composed checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-capture-exact-inspection-compose-go.yml
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/zz-capture-exact-inspection-compose-go.yml
          git diff --cached --check
          git commit -m "chore(capture): retire temporary exact-subject composer"
          git push origin HEAD:integration/es80-v14-exact-inspection-compose-go
