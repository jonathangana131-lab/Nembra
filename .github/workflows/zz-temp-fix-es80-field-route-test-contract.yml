name: TEMP Fix ES80 field-route test contract

on:
  push:
    branches:
      - recovery/es80-today-field-route-test-contract-0f967-gpt56

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/es80-today-field-route-test-contract-0f967-gpt56
          fetch-depth: 0

      - name: Repair stale source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('NembraUITests/ES80ResearchCaptureUITests.swift')
          text = path.read_text(encoding='utf-8')

          old_gate = '''        XCTAssertTrue(
              appSource.contains("if PassiveBluetoothExperimentOneFieldExecutionGate.permitsPhysicalProcedure"),
              "The normal research route must still be downstream of the package field gate."
          )
'''
          new_gate = '''        XCTAssertTrue(
              appSource.contains("ES80ExperimentOneFieldNoGoView()"),
              "A denied or unavailable field admission must retain the dedicated physical NO-GO fallback."
          )
'''
          old_factory = '''        XCTAssertTrue(
              appSource.contains("PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()"),
              "The real field route must retain its package-owned attested factory."
          )
'''
          new_factory = '''        XCTAssertTrue(
              appSource.contains(".makeResearchAuthorizedES80ForCurrentApplication()"),
              "The real field route must retain the package-owned current-application authorization factory."
          )
'''

          for old, new, label in [
              (old_gate, new_gate, 'NO-GO route contract'),
              (old_factory, new_factory, 'authorized factory contract'),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one stale assertion, found {count}')
              text = text.replace(old, new, 1)

          if 'if PassiveBluetoothExperimentOneFieldExecutionGate.permitsPhysicalProcedure' in text:
              raise SystemExit('obsolete field-gate source assertion remains')
          if 'PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()' in text:
              raise SystemExit('obsolete coordinator factory assertion remains')

          required = [
              'appSource.contains("ES80ExperimentOneFieldNoGoView()")',
              'appSource.contains(".makeResearchAuthorizedES80ForCurrentApplication()")',
              'gateSource.contains(".noGo(.finalComposedBuildNotAuthorized)")',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing current authority marker: {marker}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" -eq 1
          git diff -- NembraUITests/ES80ResearchCaptureUITests.swift

      - name: Commit test-only repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-temp-fix-es80-field-route-test-contract.yml
          git config user.name nembra-v14-recovery
          git config user.email nembra-v14-recovery@users.noreply.github.com
          git add NembraUITests/ES80ResearchCaptureUITests.swift .github/workflows/zz-temp-fix-es80-field-route-test-contract.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 2
          git commit -m "test(capture): align field-route source contract"
          git push origin HEAD:recovery/es80-today-field-route-test-contract-0f967-gpt56
