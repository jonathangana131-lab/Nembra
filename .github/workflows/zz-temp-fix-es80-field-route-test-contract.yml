name: TEMP Fix ES80 field route test contract

on:
  push:
    branches:
      - recovery/es80-today-field-route-test-contract-0f967-gpt56

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded test-only repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("NembraUITests/ES80ResearchCaptureUITests.swift")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'appSource.contains("if PassiveBluetoothExperimentOneFieldExecutionGate.permitsPhysicalProcedure")',
                  'appSource.contains("ES80ExperimentOneFieldNoGoView()")',
              ),
              (
                  '"The normal research route must still be downstream of the package field gate."',
                  '"A denied or unavailable field admission must retain the dedicated physical NO-GO fallback."',
              ),
              (
                  'appSource.contains("PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()")',
                  'appSource.contains(".makeResearchAuthorizedES80ForCurrentApplication()")',
              ),
              (
                  '"The real field route must retain its package-owned attested factory."',
                  '"The real field route must retain the package-owned current-application authorization factory."',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("expected exactly one occurrence: " + old)
              text = text.replace(old, new, 1)

          required = [
              'appSource.contains("ES80ExperimentOneFieldNoGoView()")',
              'appSource.contains(".makeResearchAuthorizedES80ForCurrentApplication()")',
              'gateSource.contains(".noGo(.finalComposedBuildNotAuthorized)")',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit("missing current authority marker: " + marker)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" -eq 1

      - name: Commit repair and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-temp-fix-es80-field-route-test-contract.yml
          git config user.name nembra-v14-recovery
          git config user.email nembra-v14-recovery@users.noreply.github.com
          git add NembraUITests/ES80ResearchCaptureUITests.swift .github/workflows/zz-temp-fix-es80-field-route-test-contract.yml
          git diff --cached --check
          git commit -m "test(capture): align field route source contract"
          git push origin HEAD:recovery/es80-today-field-route-test-contract-0f967-gpt56
