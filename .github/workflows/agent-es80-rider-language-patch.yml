name: Agent ES80 rider language polish

on:
  push:
    branches:
      - capture-v14-no-go-rider-language

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture-v14-no-go-rider-language
          fetch-depth: 0
      - name: Apply exact rider-language transformation
        run: python3 .github/scripts/agent_es80_rider_language_patch.py
      - name: Verify product wording and truth boundary
        shell: bash
        run: |
          grep -F 'Text("Real scooter capture unavailable")' NembraApp/App/NembraApp.swift
          grep -F 'Text("Experiment One")' NembraApp/App/NembraApp.swift
          grep -F 'Text("Stationary scooter fingerprint")' NembraApp/App/NembraApp.swift
          ! grep -F 'lifecycle authority, provenance, runtime' NembraApp/App/NembraApp.swift
          ! grep -F 'Text(recipeID)' NembraApp/App/NembraApp.swift
          grep -F 'app.staticTexts["ES80-FINGERPRINT-v1"].exists' NembraUITests/ES80ResearchCaptureUITests.swift
          git diff --check
      - name: Remove temporary patch machinery and checkpoint polish
        shell: bash
        run: |
          rm .github/workflows/agent-es80-rider-language-patch.yml
          rm .github/scripts/agent_es80_rider_language_patch.py
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/App/NembraApp.swift NembraUITests/ES80ResearchCaptureUITests.swift .github/workflows/agent-es80-rider-language-patch.yml .github/scripts/agent_es80_rider_language_patch.py
          git commit -m 'polish(capture): remove rider-facing engineering jargon from NO-GO'
          git push origin HEAD:capture-v14-no-go-rider-language
