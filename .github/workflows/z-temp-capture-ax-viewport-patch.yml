name: Temporary Capture AX viewport patch

on:
  push:
    branches:
      - repair/capture-v14-ax-xxxl-lock-viewport/gpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply exact Accessibility copy repair through GitHub contents API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          /usr/bin/python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          branch = os.environ["GH_BRANCH"]
          token = os.environ["GH_TOKEN"]
          path = "NembraApp/App/NembraApp.swift"
          api = (
              f"https://api.github.com/repos/{repository}/contents/{path}"
              f"?ref={urllib.parse.quote(branch, safe='')}"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nembra-capture-ax-viewport-repair",
          }

          with urllib.request.urlopen(urllib.request.Request(api, headers=headers)) as response:
              current = json.load(response)

          source = base64.b64decode(current["content"]).decode("utf-8")
          old = '''                    if isAccessibilityLayout {
                        Text("Final exact-build checks are still in progress.")
                            .font(.caption.weight(.semibold))
                            .foregroundStyle(.secondary)
                            .fixedSize(horizontal: false, vertical: true)
                    }
          '''
          new = '''                    if isAccessibilityLayout {
                        Text("Final checks in progress.")
                            .font(.caption.weight(.semibold))
                            .foregroundStyle(.secondary)
                            .fixedSize(horizontal: false, vertical: true)
                    }
          '''

          # The YAML-safe closing indentation above is part of the Python string. Normalize only
          # that final indentation so the exact Swift block remains the sole admissible subject.
          old = old.removesuffix("          ")
          new = new.removesuffix("          ")

          if old not in source:
              if new in source:
                  print("Accessibility viewport copy is already repaired.")
                  raise SystemExit(0)
              raise SystemExit("Expected exact Accessibility copy block was not found; refusing to patch.")
          if source.count(old) != 1:
              raise SystemExit("Expected Accessibility copy block is not unique; refusing to patch.")

          updated = source.replace(old, new, 1)
          payload = json.dumps(
              {
                  "message": "fix(capture): keep AX physical lock above fold",
                  "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
                  "sha": current["sha"],
                  "branch": branch,
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/contents/{path}",
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          print("Created repair commit", result["commit"]["sha"])
          PY
