name: Temporary Capture AX viewport patch

on:
  push:
    branches:
      - repair/capture-v14-ax-xxxl-lock-viewport/gpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply exact Accessibility copy repair through GitHub contents API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          /usr/bin/python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          branch = os.environ["GH_BRANCH"]
          token = os.environ["GH_TOKEN"]
          path = "NembraApp/App/NembraApp.swift"
          api = (
              f"https://api.github.com/repos/{repository}/contents/{path}"
              f"?ref={urllib.parse.quote(branch, safe='')}"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nembra-capture-ax-viewport-repair",
          }

          try:
              with urllib.request.urlopen(urllib.request.Request(api, headers=headers)) as response:
                  current = json.load(response)

              source = base64.b64decode(current["content"]).decode("utf-8")
              old = 'Text("Final exact-build checks are still in progress.")'
              new = 'Text("Final checks in progress.")'
              old_count = source.count(old)
              new_count = source.count(new)
              if old_count == 0 and new_count == 1:
                  print("Accessibility viewport copy is already repaired.")
                  raise SystemExit(0)
              if old_count != 1:
                  raise RuntimeError(f"Expected exactly one visible AX copy literal, found {old_count}.")

              updated = source.replace(old, new, 1)
              payload = json.dumps(
                  {
                      "message": "fix(capture): keep AX physical lock above fold",
                      "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
                      "sha": current["sha"],
                      "branch": branch,
                  }
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/contents/{path}",
                  data=payload,
                  headers={**headers, "Content-Type": "application/json"},
                  method="PUT",
              )
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
              print("Created repair commit", result["commit"]["sha"])
          except Exception as error:
              print(f"::error title=Capture AX patch failed::{type(error).__name__}: {error}")
              raise
          PY
