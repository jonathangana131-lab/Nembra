name: Agent Capture rider-first current

on:
  push:
    branches:
      - product/es80-v14-rider-language-current-gpt56c

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/es80-v14-rider-language-current-gpt56c
          fetch-depth: 0

      - name: Apply rider-first primary Capture copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'Text("One sealed evidence life")',
                  'Text("Read-only capture")',
              ),
              (
                  'Text("Nembra carries the same package-owned Experiment One authority from repeated Bluetooth correlation into passive capture and immutable Horizon sealing. It performs no application characteristic-value writes and never turns a display name, RSSI, or service hint into target authority.")',
                  'Text("Nembra keeps this entire capture read-only. It follows the same scooter signal from the four-step OFF / ON check through observation and sealing, without changing scooter settings or guessing identity from a name or signal strength.")',
              ),
              ('eyebrow: "FIELD AUTHORITY",', 'eyebrow: "CAPTURE LOCKED",'),
              (
                  'message: "The package-owned physical execution gate is closed. No OFF / ON window, connection, capture, or seal action can advance through this coordinator.",',
                  'message: "The field safety lock is closed. No OFF / ON step, connection, capture, or seal action can begin until this exact build is authorized.",',
              ),
              (
                  'message: "Nembra is waiting for this exact window to report Bluetooth powered-on and active scanning. The producer\'s evidence clock has not started yet.",',
                  'message: "Nembra is waiting for Bluetooth to be ready and actively scanning for this exact window. The capture timing window has not started yet.",',
              ),
              (
                  '.accessibilityHint("Nembra is recording this bounded Bluetooth observation window.")',
                  '.accessibilityHint("Nembra is recording Bluetooth signals for this observation window.")',
              ),
              (
                  '.accessibilityHint("The package producer, not this timer, decides whether the window has enough evidence.")',
                  '.accessibilityHint("This countdown is guidance only. Nembra records the window only after the required observation is accepted.")',
              ),
              (
                  'guidanceFootnote("This countdown is display guidance only. The package producer accepts the window only from its own monotonic receipt boundary; tapping early cannot create evidence.")',
                  'guidanceFootnote("This countdown is guidance only. Nembra accepts the window only after the required observation time is recorded; tapping early cannot create evidence.")',
              ),
              (
                  'message: "No selectable full Bluetooth identifier was absent in both OFF windows and repeated in both ON windows. Nembra will not guess from name, signal strength, service hints, or short IDs.",',
                  'message: "No Bluetooth signal stayed absent in both OFF windows and repeated in both ON windows. Nembra will not guess from name, signal strength, service hints, or short IDs.",',
              ),
              (
                  'message: "More than one selectable full Bluetooth identifier repeated the OFF / ON pattern. Nembra refuses to break the tie with display name, RSSI, services, or a short identifier.",',
                  'message: "More than one Bluetooth signal repeated the OFF / ON pattern. Nembra refuses to break the tie with display name, signal strength, services, or a short identifier.",',
              ),
              (
                  'message: "One full CoreBluetooth identifier was selectable in both ON windows and absent from both OFF catalogs under this exact package-owned observation series. Treat it only as a correlated Bluetooth target.",',
                  'message: "One Bluetooth signal appeared in both ON windows and stayed absent from both OFF windows. Treat it only as a correlated Bluetooth target, not verified scooter identity.",',
              ),
              (
                  'message: "A fresh post-admission scan is looking for the exact full identifier that passed both OFF / ON cycles. Keep the scooter in the ON state from the final window.",',
                  'message: "A fresh confirmation scan is looking for the same signal that passed both OFF / ON cycles. Keep the scooter in the ON state from the final window.",',
              ),
              (
                  'message: "The same full CoreBluetooth identifier reappeared in the fresh scan epoch created after the sealed admission. This remains local correlation evidence, not permanent hardware authentication.",',
                  'message: "The same Bluetooth signal reappeared in the fresh confirmation scan. This remains local correlation evidence, not permanent hardware authentication.",',
              ),
              (
                  'message: "Nembra is connecting only to the package-owned correlated target. No application characteristic-value writes are permitted by this workflow.",',
                  'message: "Nembra is connecting only to the signal confirmed by the OFF / ON sequence. This capture stays read-only and does not change scooter settings or send controls.",',
              ),
              (
                  'message: "Nembra is passively discovering services, characteristics, descriptors, reads, and notifications for the exact run-owned target session. Ready is not shown until finite acquisition is mechanically complete.",',
                  'message: "Nembra is checking which information the selected signal exposes for passive reading. Observation starts only after this read-only discovery step finishes.",',
              ),
              (
                  'title: remaining == 0 ? "Waiting for accepted Horizon authority" : "Hold observation — \\(remaining)s",',
                  'title: remaining == 0 ? "Observation time recorded" : "Hold observation — \\(remaining)s",',
              ),
              (
                  'message: "Finite acquisition is Ready. Keep Nembra foregrounded and the scooter stationary while the accepted monotonic observation interval matures. The displayed timer is guidance only.",',
                  'message: "Read-only discovery is complete. Keep Nembra foregrounded and the scooter stationary while the required observation time is recorded. The displayed timer is guidance only.",',
              ),
              (
                  '? "Display guidance complete; waiting for accepted Horizon authority"',
                  '? "Display guidance complete; waiting for the capture seal to become available"',
              ),
              (
                  ': "Unavailable; waiting for accepted Horizon authority"',
                  ': "Unavailable; waiting for the required observation time"',
              ),
              (
                  '.accessibilityHint("Available only after the package accepts the required monotonic observation duration.")',
                  '.accessibilityHint("Available only after the required observation time has been recorded.")',
              ),
              ('eyebrow: "HORIZON READY",', 'eyebrow: "READY TO SEAL",'),
              (
                  'message: "The package-owned Ready epoch and required monotonic observation duration are both accepted. Finishing now requests one immutable Horizon from this same authority life.",',
                  'message: "Read-only discovery is complete and the required observation time has been recorded. Seal now to freeze this capture exactly once.",',
              ),
              (
                  'message: "Nembra is draining the accepted cutoff, committing Horizon, checking final authority, and materializing the immutable JSON artifact. Do not leave the app while this finishes.",',
                  'message: "Nembra is finishing queued read-only observations, locking the capture boundary, checking integrity, and sealing the capture file. Keep Nembra open until this finishes.",',
              ),
              ('healthItem("FINITE", value: observationReady ? "READY" : "WAIT")', 'healthItem("DISCOVERY", value: observationReady ? "READY" : "WAIT")'),
              ('healthItem("HORIZON", value: horizonReady ? "READY" : "HOLD")', 'healthItem("SEAL", value: horizonReady ? "READY" : "HOLD")'),
              (
                  r'Finite acquisition \(observationReady ? "ready" : "waiting"). Horizon \(horizonReady ? "ready" : "waiting").',
                  r'Read-only discovery \(observationReady ? "ready" : "waiting"). Seal \(horizonReady ? "ready" : "waiting").',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one current rider-copy anchor, found {count}: {old}")
              text = text.replace(old, new, 1)

          begin = text.index("    private var passiveSafetyPanel")
          end = text.index("    private var captureDetailsSheet", begin)
          primary = text[begin:end]
          banned = [
              "One sealed evidence life",
              "package-owned Experiment One authority",
              "package-owned physical execution gate",
              "producer's evidence clock",
              "package producer",
              "full CoreBluetooth identifier",
              "selectable full Bluetooth identifier",
              "post-admission scan",
              "fresh scan epoch created after the sealed admission",
              "package-owned correlated target",
              "finite acquisition",
              "Finite acquisition",
              "accepted Horizon authority",
              "accepted monotonic observation interval",
              "package-owned Ready epoch",
              "committing Horizon",
              "immutable JSON artifact",
              "application characteristic-value writes",
              "HORIZON READY",
              'healthItem("FINITE"',
              'healthItem("HORIZON"',
          ]
          for phrase in banned:
              if phrase in primary:
                  raise SystemExit(f"Primary Capture copy still exposes engineering vocabulary: {phrase}")

          for phrase in ["Scooter OFF", "Scooter ON", "Share Capture", "View Details", "DISCOVERY", "SEAL"]:
              if phrase not in primary:
                  raise SystemExit(f"Rider surface lost required product contract: {phrase}")
          if "PASSIVE / READ ONLY" not in text:
              raise SystemExit("Persistent read-only badge is missing")
          if "CoreBluetooth" not in text[end:] or "Truth boundary" not in text[end:]:
              raise SystemExit("Engineering truth no longer remains under Capture Details")

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Run focused package acceptance
        working-directory: Packages/NembraBluetoothCapture
        run: swift test

      - name: Parse app shell
        run: swiftc -frontend -parse NembraApp/Features/Research/ES80CaptureShellView.swift

      - name: Self-delete helper and checkpoint product delta
        shell: bash
        run: |
          rm .github/workflows/agent-capture-rider-current.yml
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/Features/Research/ES80CaptureShellView.swift \
                  .github/workflows/agent-capture-rider-current.yml
          git diff --cached --check
          git commit -m 'polish(capture): make primary states rider-readable'
          git push origin HEAD:product/es80-v14-rider-language-current-gpt56c
