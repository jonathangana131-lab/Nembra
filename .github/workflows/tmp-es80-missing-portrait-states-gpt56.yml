name: Temporary ES80 missing portrait states patch

on:
  push:
    branches:
      - test/es80-v14-missing-portrait-states/gpt56-thinking

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact visual parent
        run: test "$(git rev-parse HEAD^)" = "d6f8d13e0859740f2d151ce9e5bc0ebaa8e9459f"

      - name: Add only uncovered portrait states
        env:
          TEST_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path("NembraUITests/ES80ResearchCaptureUITests.swift")
          source = path.read_text(encoding="utf-8")
          marker = "    func testSimulatorQAAppSeamIsCompileBoundedAndProductionRouteRemainsLocked() throws {"
          test = base64.b64decode(os.environ["TEST_B64"]).decode("utf-8")
          if marker not in source:
              raise SystemExit("expected Simulator QA source-contract marker not found")
          if "testV14SimulatorQARetainsPreviouslyUncoveredPortraitStates" in source:
              raise SystemExit("missing-state visual gate already exists")
          path.write_text(source.replace(marker, test + marker, 1), encoding="utf-8")
          PY

      - name: Verify exact scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "NembraUITests/ES80ResearchCaptureUITests.swift"

      - name: Commit test and self-delete transformer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-missing-portrait-states-gpt56.yml
          git add NembraUITests/ES80ResearchCaptureUITests.swift
          git commit -m "Capture visual QA: retain missing portrait states"
          git push origin HEAD:test/es80-v14-missing-portrait-states/gpt56-thinking
