name: Capture 2709 Vnode Attribute Publish
on:
  push:
    branches: [repair/v14-capture-2709-vnode-attrib-sol]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Materialize validated patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          g=Path('Scripts/capture_tuya_private_input_build_guard.py');s=g.read_text()
          a='            "KQ_NOTE_EXTEND",\n            "KQ_NOTE_LINK",\n';b='            "KQ_NOTE_EXTEND",\n            "KQ_NOTE_ATTRIB",\n            "KQ_NOTE_LINK",\n'
          if s.count(a)!=1: raise SystemExit('flag anchor');s=s.replace(a,b,1)
          a='            | select.KQ_NOTE_EXTEND\n            | select.KQ_NOTE_LINK\n';b='            | select.KQ_NOTE_EXTEND\n            | select.KQ_NOTE_ATTRIB\n            | select.KQ_NOTE_LINK\n'
          if s.count(a)!=1: raise SystemExit('fflags anchor');g.write_text(s.replace(a,b,1))
          w=Path('.github/workflows/capture-cocoapods-build-subject-redteam.yml');s=w.read_text()
          a='      - scripts/ci/tests/test_capture_cocoapods_coherent_generation.py\n';s=s.replace(a,a+'      - scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n',1)
          a='          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_coherent_generation.py\n';s=s.replace(a,a+'          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n',1)
          s+='\n      - name: Require vnode attribute custody\n        shell: bash\n        run: python3 scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n'
          w.write_text(s)
          PY
          python3 scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py
          python3 scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          python3 scripts/ci/tests/test_capture_cocoapods_generated_symlink_authority.py
          python3 scripts/ci/tests/test_capture_cocoapods_coherent_generation.py
          git diff --check
      - name: Commit clean product diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/capture-2709-vnode-attrib-materializer.yml .github/workflows/capture-2709-vnode-attrib-retry.yml .github/workflows/capture-2709-vnode-attrib-publish.yml
          git add Scripts/capture_tuya_private_input_build_guard.py .github/workflows/capture-cocoapods-build-subject-redteam.yml scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py
          git diff --cached --check
          git config user.name jonathangana131-lab
          git config user.email jonathangana131@gmail.com
          git commit -m 'fix(capture): watch generated vnode attribute mutations'
          git push origin HEAD:repair/v14-capture-2709-vnode-attrib-sol
