name: tmp-v14-capture-transport-tighten
on:
  push:
    branches:
      - agent/v14-capture-final-transport-bytecode-sol
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tighten transport contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jonathangana131-lab/Nembra"
          test "$GITHUB_REF_NAME" = "agent/v14-capture-final-transport-bytecode-sol"
          python3 - <<'PY'
          from pathlib import Path

          bridge_path = Path('NembraApp/Features/Research/TuyaAccountBridge.swift')
          bridge = bridge_path.read_text()

          old_endpoint = '''            let endpointCandidate = rawEndpoint.contains("://") ? rawEndpoint : "https://\\(rawEndpoint)"
                      guard let endpointURL = URL(string: endpointCandidate),
                            endpointURL.scheme?.lowercased() == "https",
                            let endpointHost = endpointURL.host,
                            !endpointHost.isEmpty else {
                          throw BridgeError.malformed("Tuya approval returned an invalid secure API endpoint.")
                      }
                      let endpoint = endpointURL.absoluteString
          '''
          new_endpoint = '''            let endpointCandidate = rawEndpoint.contains("://") ? rawEndpoint : "https://\\(rawEndpoint)"
                      guard let endpointComponents = URLComponents(string: endpointCandidate),
                            endpointComponents.scheme?.lowercased() == "https",
                            let endpointHost = endpointComponents.host,
                            !endpointHost.isEmpty,
                            endpointComponents.user == nil,
                            endpointComponents.password == nil,
                            endpointComponents.query == nil,
                            endpointComponents.fragment == nil,
                            let endpointURL = endpointComponents.url else {
                          throw BridgeError.malformed("Tuya approval returned an invalid secure API endpoint.")
                      }
                      let endpoint = endpointURL.absoluteString
          '''
          assert bridge.count(old_endpoint) == 1, bridge.count(old_endpoint)
          bridge = bridge.replace(old_endpoint, new_endpoint, 1)

          old_request = '''        guard let requestURL = request.url,
                requestURL.scheme?.lowercased() == "https",
                let requestHost = requestURL.host,
                !requestHost.isEmpty else {
              throw BridgeError.invalidURL
          }
          let (data, response) = try await URLSession.shared.data(for: request)
                  guard let http = response as? HTTPURLResponse, (200..<300).contains(http.statusCode) else {
                      throw BridgeError.remote("HTTP request failed.")
                  }
          '''
          new_request = '''        guard let requestURL = request.url,
                requestURL.scheme?.lowercased() == "https",
                let requestHost = requestURL.host,
                !requestHost.isEmpty else {
              throw BridgeError.invalidURL
          }
          let (data, response) = try await URLSession.shared.data(
              for: request,
              delegate: HTTPSOnlyRedirectDelegate.shared
          )
          guard let http = response as? HTTPURLResponse,
                (200..<300).contains(http.statusCode),
                let responseURL = http.url,
                responseURL.scheme?.lowercased() == "https",
                let responseHost = responseURL.host,
                responseHost.caseInsensitiveCompare(requestHost) == .orderedSame,
                responseURL.port == requestURL.port else {
              throw BridgeError.remote("HTTPS request failed.")
          }
          '''
          assert bridge.count(old_request) == 1, bridge.count(old_request)
          bridge = bridge.replace(old_request, new_request, 1)

          import_marker = 'import UniformTypeIdentifiers\n\n'
          assert bridge.count(import_marker) == 1
          delegate = '''private final class HTTPSOnlyRedirectDelegate: NSObject, URLSessionTaskDelegate, @unchecked Sendable {
              static let shared = HTTPSOnlyRedirectDelegate()

              func urlSession(
                  _ session: URLSession,
                  task: URLSessionTask,
                  willPerformHTTPRedirection response: HTTPURLResponse,
                  newRequest request: URLRequest,
                  completionHandler: @escaping (URLRequest?) -> Void
              ) {
                  guard let originalURL = task.originalRequest?.url,
                        originalURL.scheme?.lowercased() == "https",
                        let originalHost = originalURL.host,
                        !originalHost.isEmpty,
                        let redirectURL = request.url,
                        redirectURL.scheme?.lowercased() == "https",
                        let redirectHost = redirectURL.host,
                        !redirectHost.isEmpty,
                        originalHost.caseInsensitiveCompare(redirectHost) == .orderedSame,
                        originalURL.port == redirectURL.port else {
                      completionHandler(nil)
                      return
                  }
                  completionHandler(request)
              }
          }

          '''
          bridge = bridge.replace(import_marker, import_marker + delegate, 1)
          bridge_path.write_text(bridge)

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAccountEndpointTransportSourceTests.swift')
          test = test_path.read_text()
          test = test.replace(
              '#expect(bridge.contains("endpointURL.scheme?.lowercased() == \\\"https\\\""))\n        #expect(bridge.contains("let endpointHost = endpointURL.host"))',
              '#expect(bridge.contains("endpointComponents.scheme?.lowercased() == \\\"https\\\""))\n        #expect(bridge.contains("let endpointHost = endpointComponents.host"))\n        #expect(bridge.contains("endpointComponents.user == nil"))\n        #expect(bridge.contains("endpointComponents.password == nil"))'
          )
          needle = '#expect(bridge.contains("requestURL.scheme?.lowercased() == \\\"https\\\""))'
          assert test.count(needle) == 1
          test = test.replace(
              needle,
              needle + '\n        #expect(bridge.contains("delegate: HTTPSOnlyRedirectDelegate.shared"))\n        #expect(bridge.contains("redirectURL.scheme?.lowercased() == \\\"https\\\""))\n        #expect(bridge.contains("originalHost.caseInsensitiveCompare(redirectHost) == .orderedSame"))\n        #expect(bridge.contains("responseHost.caseInsensitiveCompare(requestHost) == .orderedSame"))'
          )
          test_path.write_text(test)
          PY
          grep -Fq 'endpointComponents.scheme?.lowercased() == "https"' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'delegate: HTTPSOnlyRedirectDelegate.shared' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'redirectURL.scheme?.lowercased() == "https"' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'originalHost.caseInsensitiveCompare(redirectHost) == .orderedSame' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'responseHost.caseInsensitiveCompare(requestHost) == .orderedSame' NembraApp/Features/Research/TuyaAccountBridge.swift
          git diff --check
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-v14-capture-transport-tighten.yml
          git config user.name nembra-v14-bot
          git config user.email nembra-v14-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): fail closed on Tuya transport redirects'
          git push origin "HEAD:$GITHUB_REF_NAME"
