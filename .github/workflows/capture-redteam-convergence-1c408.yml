name: Capture Red-Team Convergence 1C408
on:
  push:
    branches: [sol/v14-capture-redteam-convergence-1c408-sol]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-redteam-convergence-1c408-sol
          fetch-depth: 0
      - name: Guard parent
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1c40853f6991b4d09206df1d25ecff021458b7eb HEAD
          git diff --quiet 1c40853f6991b4d09206df1d25ecff021458b7eb HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Apply and verify
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_redteam_convergence_1c408.py apply
          python3 scripts/ci/materialize_capture_redteam_convergence_1c408.py verify
          python3 -m py_compile scripts/ci/materialize_capture_redteam_convergence_1c408.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRedTeamConvergenceSourceTests.swift
          git diff --check
      - name: Commit materialized result
        run: |
          set -euo pipefail
          rm .github/workflows/capture-redteam-convergence-1c408.yml
          rm scripts/ci/materialize_capture_redteam_convergence_1c408.py
          git add -A
          test "$(git diff --name-only 1c40853f6991b4d09206df1d25ecff021458b7eb | wc -l | tr -d ' ')" = 2
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m 'fix(capture): converge current red-team truth blockers'
          git push origin HEAD:sol/v14-capture-redteam-convergence-1c408-sol
