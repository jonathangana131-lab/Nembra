name: Temporary current-spine producer custody transform

on:
  push:
    branches:
      - integration/es80-v14-producer-custody-current/gpt56-thinking-go

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose exact producer custody repair
        run: python3 .github/tmp_es80_producer_custody_transform.py
      - name: Validate source contracts
        run: |
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_python_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_descriptor_subject_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          git diff --check
      - name: Commit product delta and self-delete scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-producer-custody-current.yml .github/tmp_es80_producer_custody_transform.py
          git add scripts/ci/xcode27_signed_field_candidate.sh scripts/ci/tests/test_xcode27_signed_field_candidate_source.py scripts/ci/tests/test_xcode27_signed_field_candidate_python_custody_source.py scripts/ci/tests/test_xcode27_signed_field_candidate_descriptor_subject_custody_source.py
          git commit -m "fix(capture): bind signed-field producer tool custody"
          git push origin HEAD:integration/es80-v14-producer-custody-current/gpt56-thinking-go
