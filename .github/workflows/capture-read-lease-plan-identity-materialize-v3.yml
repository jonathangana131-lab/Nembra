name: Capture Read Lease Plan Identity Materialize V3

on:
  push:
    branches:
      - hardening/v17-capture-read-lease-component-walk-sol-20260814
    paths:
      - .github/workflows/capture-read-lease-plan-identity-materialize-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/v17-capture-read-lease-component-walk-sol-20260814
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact clean predecessor
        shell: bash
        run: |
          set -euo pipefail
          PARENT=8c135c7e423e82272e2750fda96e76b82e6b0fc7
          SELF=.github/workflows/capture-read-lease-plan-identity-materialize-v3.yml
          test "$(git merge-base HEAD "$PARENT")" = "$PARENT"
          test "$(git diff --name-only "$PARENT"...HEAD)" = "$SELF"

      - name: Carry planned identity into descriptor admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py')
          source = helper.read_text(encoding='utf-8')

          marker = '''    return metadata\n\n\ndef _validate_internal_symlink'''
          replacement = '''    return metadata\n\n\ndef _metadata_signature(metadata: os.stat_result) -> tuple[int, int, int]:\n    return metadata.st_dev, metadata.st_ino, stat.S_IFMT(metadata.st_mode)\n\n\ndef _validate_internal_symlink'''
          if source.count(marker) != 1:
              raise SystemExit('could not bind metadata-signature insertion seam')
          source = source.replace(marker, replacement)

          start = source.index('def _subject_entries(')
          end = source.index('\n\ndef _lease_paths(', start)
          subject_entries = '''def _subject_entries(subject: Path, *, include_signatures: bool = False) -> tuple:\n    try:\n        root_metadata = subject.lstat()\n    except OSError as error:\n        raise SelectedXcodeBuildOrchestratorError(\n            f"private read-lease subject is unavailable: {subject}"\n        ) from error\n    if stat.S_ISLNK(root_metadata.st_mode):\n        raise SelectedXcodeBuildOrchestratorError("private read-lease subject root may not be a symlink")\n    if stat.S_ISREG(root_metadata.st_mode):\n        entry = (subject, False, _metadata_signature(root_metadata))\n        return (entry if include_signatures else entry[:2],)\n    if not stat.S_ISDIR(root_metadata.st_mode):\n        raise SelectedXcodeBuildOrchestratorError(\n            f"private read-lease subject root has unsupported type: {subject}"\n        )\n\n    entries: list[tuple] = [\n        (subject, True, _metadata_signature(root_metadata))\n        if include_signatures\n        else (subject, True)\n    ]\n    for current_raw, directory_names, file_names in os.walk(subject, topdown=True, followlinks=False):\n        current = Path(current_raw)\n        kept_directories: list[str] = []\n        for name in directory_names:\n            candidate = current / name\n            metadata = candidate.lstat()\n            if stat.S_ISLNK(metadata.st_mode):\n                _validate_internal_symlink(candidate, subject)\n                continue\n            if not stat.S_ISDIR(metadata.st_mode):\n                raise SelectedXcodeBuildOrchestratorError(\n                    f"private read-lease directory entry changed type: {candidate}"\n                )\n            entry = (candidate, True, _metadata_signature(metadata))\n            entries.append(entry if include_signatures else entry[:2])\n            kept_directories.append(name)\n        directory_names[:] = kept_directories\n        for name in file_names:\n            candidate = current / name\n            metadata = candidate.lstat()\n            if stat.S_ISLNK(metadata.st_mode):\n                _validate_internal_symlink(candidate, subject)\n                continue\n            if not stat.S_ISREG(metadata.st_mode):\n                raise SelectedXcodeBuildOrchestratorError(\n                    f"private read-lease file entry is not regular: {candidate}"\n                )\n            entry = (candidate, False, _metadata_signature(metadata))\n            entries.append(entry if include_signatures else entry[:2])\n    return tuple(entries)\n'''
          source = source[:start] + subject_entries + source[end:]

          start = source.index('def _lease_paths(')
          end = source.index('\n\ndef _acl_text(', start)
          lease_paths = '''def _lease_paths(\n    subjects: Sequence[Path],\n    repo: Path,\n    *,\n    include_signatures: bool = False,\n) -> tuple:\n    """Return exact ACL subjects and optionally their identity at planning time."""\n\n    repo = _absolute_lexical(repo)\n    repo_metadata = _require_real_directory(repo, "repository root")\n    if not subjects:\n        raise SelectedXcodeBuildOrchestratorError("private read lease has no subjects")\n\n    ordered: list[tuple] = []\n    seen: set[Path] = set()\n\n    def admit(path: Path, host_only: bool, metadata: os.stat_result) -> None:\n        if path in seen:\n            return\n        signature = _metadata_signature(metadata)\n        ordered.append((path, host_only, signature) if include_signatures else (path, host_only))\n        seen.add(path)\n\n    # Widen host traversal only until the first ancestor already searchable by all.\n    current = repo.parent\n    private_hosts: list[tuple[Path, os.stat_result]] = []\n    while current != current.parent:\n        metadata = _require_real_directory(current, "repository host ancestry")\n        if metadata.st_mode & stat.S_IXOTH:\n            break\n        private_hosts.append((current, metadata))\n        current = current.parent\n    for path, metadata in reversed(private_hosts):\n        admit(path, True, metadata)\n\n    admit(repo, False, repo_metadata)\n\n    for raw_subject in subjects:\n        subject = _absolute_lexical(raw_subject)\n        try:\n            relative = subject.relative_to(repo)\n        except ValueError as error:\n            raise SelectedXcodeBuildOrchestratorError(\n                "private read-lease subject escaped the repository"\n            ) from error\n        if not relative.parts:\n            raise SelectedXcodeBuildOrchestratorError(\n                "private read-lease subject may not be the repository root"\n            )\n\n        cursor = repo\n        for component in relative.parts:\n            if component in ("", ".", ".."):\n                raise SelectedXcodeBuildOrchestratorError(\n                    "private read-lease subject has unsafe ancestry"\n                )\n            cursor = cursor / component\n            try:\n                metadata = cursor.lstat()\n            except OSError as error:\n                raise SelectedXcodeBuildOrchestratorError(\n                    f"private read-lease subject ancestry is unavailable: {cursor}"\n                ) from error\n            if stat.S_ISLNK(metadata.st_mode):\n                raise SelectedXcodeBuildOrchestratorError(\n                    f"private read-lease subject ancestry contains a symlink: {cursor}"\n                )\n            if cursor != subject and not stat.S_ISDIR(metadata.st_mode):\n                raise SelectedXcodeBuildOrchestratorError(\n                    f"private read-lease subject ancestry is not a directory: {cursor}"\n                )\n            admit(cursor, False, metadata)\n\n        for path, _is_directory, signature in _subject_entries(subject, include_signatures=True):\n            if path in seen:\n                continue\n            ordered.append((path, False, signature) if include_signatures else (path, False))\n            seen.add(path)\n\n    return tuple(ordered)\n'''
          source = source[:start] + lease_paths + source[end:]

          old_sig = 'def _open_pinned_path(path: Path, is_directory: bool) -> int:'
          new_sig = '''def _open_pinned_path(\n    path: Path,\n    is_directory: bool,\n    expected_signature: tuple[int, int, int] | None = None,\n) -> int:'''
          if source.count(old_sig) != 1:
              raise SystemExit('could not bind opener signature seam')
          source = source.replace(old_sig, new_sig)

          old_check = '''        # Full-path lookup below is diagnostic only after anchored selection.\n        if _descriptor_signature(descriptor) != _path_signature(path):\n            raise SelectedXcodeBuildOrchestratorError(\n                f"private read-lease pathname changed during anchored component walk: {path}"\n            )'''
          new_check = '''        actual_signature = _descriptor_signature(descriptor)\n        if expected_signature is not None and actual_signature != expected_signature:\n            raise SelectedXcodeBuildOrchestratorError(\n                f"private read-lease opened object disagrees with planned identity: {path}"\n            )\n        # Full-path lookup below is diagnostic only after anchored selection.\n        if actual_signature != _path_signature(path):\n            raise SelectedXcodeBuildOrchestratorError(\n                f"private read-lease pathname changed during anchored component walk: {path}"\n            )'''
          if source.count(old_check) != 1:
              raise SystemExit('could not bind opener identity-check seam')
          source = source.replace(old_check, new_check)

          old_grant = '''            for path, host_only in _lease_paths(self._subjects, self._repository):\n                metadata = path.lstat()\n                if stat.S_ISLNK(metadata.st_mode):\n                    raise SelectedXcodeBuildOrchestratorError(\n                        f"private read-lease plan targeted a symlink: {path}"\n                    )\n                is_directory = stat.S_ISDIR(metadata.st_mode)\n                if not is_directory and not stat.S_ISREG(metadata.st_mode):\n                    raise SelectedXcodeBuildOrchestratorError(\n                        f"private read-lease plan targeted unsupported type: {path}"\n                    )\n                descriptor = _open_pinned_path(path, is_directory)'''
          new_grant = '''            for path, host_only, expected_signature in _lease_paths(\n                self._subjects,\n                self._repository,\n                include_signatures=True,\n            ):\n                is_directory = stat.S_ISDIR(expected_signature[2])\n                if not is_directory and not stat.S_ISREG(expected_signature[2]):\n                    raise SelectedXcodeBuildOrchestratorError(\n                        f"private read-lease plan targeted unsupported type: {path}"\n                    )\n                descriptor = _open_pinned_path(path, is_directory, expected_signature)'''
          if source.count(old_grant) != 1:
              raise SystemExit('could not bind grant plan-consumption seam')
          source = source.replace(old_grant, new_grant)
          helper.write_text(source, encoding='utf-8')

          test = Path('scripts/ci/tests/test_capture_private_read_lease_component_walk.py')
          tests = test.read_text(encoding='utf-8')
          insertion = '''    def test_real_directory_replacement_is_rejected_against_planned_identity(self) -> None:\n        helper = load()\n        with tempfile.TemporaryDirectory(prefix="nembra-component-real-swap-") as raw:\n            outer = Path(raw)\n            repo = outer / "repo"\n            legitimate = repo / "LocalSecrets/TuyaSDK/Build"\n            legitimate.mkdir(parents=True)\n            planned = helper._lease_paths((legitimate,), repo, include_signatures=True)\n            expected = next(\n                signature\n                for path, _host_only, signature in planned\n                if path == legitimate\n            )\n\n            sdk = repo / "LocalSecrets/TuyaSDK"\n            original = repo / "LocalSecrets/TuyaSDK.original"\n            sdk.rename(original)\n            replacement = repo / "LocalSecrets/TuyaSDK/Build"\n            replacement.mkdir(parents=True)\n            self.assertFalse(sdk.is_symlink())\n            self.assertFalse(replacement.is_symlink())\n            self.assertNotEqual(expected, helper._path_signature(replacement))\n\n            with self.assertRaises(helper.SelectedXcodeBuildOrchestratorError):\n                helper._open_pinned_path(legitimate, True, expected)\n\n'''
          seam = '    def test_source_uses_dirfd_component_walk_before_path_diagnostic(self) -> None:\n'
          if tests.count(seam) != 1 or 'test_real_directory_replacement_is_rejected_against_planned_identity' in tests:
              raise SystemExit('could not bind component regression insertion seam')
          tests = tests.replace(seam, insertion + seam)
          tests = tests.replace(
              '        self.assertIn("O_NOFOLLOW", source)\n',
              '        self.assertIn("O_NOFOLLOW", source)\n        self.assertIn("expected_signature", source)\n',
          )
          test.write_text(tests, encoding='utf-8')
          PY

          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          for raw in (
              'scripts/ci/capture_selected_xcode_build_orchestrator.py',
              'scripts/ci/tests/test_capture_private_read_lease_component_walk.py',
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
          PY
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py

      - name: Publish repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          SELF=.github/workflows/capture-read-lease-plan-identity-materialize-v3.yml
          git rm "$SELF"
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git diff --cached --check
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git commit -m 'capture: bind lease admission to planned object identity'
          changed="$(git diff --name-only 578b389e7974ff8814020d773ee0115531b654be...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/capture-private-read-lease-component-walk.yml scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_private_read_lease_component_walk.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git push origin HEAD:hardening/v17-capture-read-lease-component-walk-sol-20260814
