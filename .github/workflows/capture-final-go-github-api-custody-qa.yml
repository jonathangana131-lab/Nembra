name: Capture Final GO GitHub API Custody QA

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_final_go_hardened_github_api_custody.py
      - .github/workflows/capture-final-go-github-api-custody-qa.yml

permissions:
  contents: read

jobs:
  github-api-custody:
    name: Reject caller-injected Final GO GitHub authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nembra-capture-final-go-api-custody-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true

    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile custody regression
        run: python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py scripts/ci/tests/test_es80_today_final_go_hardened_github_api_custody.py

      - name: Require repository-owned live GitHub authority
        run: python3 scripts/ci/tests/test_es80_today_final_go_hardened_github_api_custody.py -v
