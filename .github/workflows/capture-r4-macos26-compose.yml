name: Compose Capture truth on macOS 26

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: write

jobs:
  compose:
    if: github.event.head_commit.message == 'GO compose Capture truth on macOS 26'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sw_vers
          xcodebuild -version
          swift --version

      - name: Reuse reviewed r2 composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/capture-app-truth-repair-r2.yml').read_text()
          compose = source.index('      - name: Compose canonical Capture app truth\n')
          truth = source.index('      - name: Run focused truth contracts\n', compose)
          chunk = source[compose:truth]
          marker = '        run: |\n'
          if chunk.count(marker) != 1:
              raise SystemExit(f'compose run marker count: {chunk.count(marker)}')
          body = chunk.split(marker, 1)[1]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip() == '':
                  lines.append('')
              else:
                  raise SystemExit(f'unexpected compose indentation: {line!r}')
          Path('/tmp/nembra-compose-r2.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/nembra-compose-r2.sh
          git diff --check -- NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonAppIntegrationTests.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaIncompleteObservationSemanticTerminalTests.swift

      - name: Run focused Capture truth contracts
        shell: bash
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --filter TuyaAuthenticatedReadOnlySessionLedgerTests
          swift test --filter TuyaAuthenticatedTerminalHorizonTests
          swift test --filter TuyaAuthenticatedReadOnlyHorizonTests
          swift test --filter TuyaAuthenticatedReadOnlyHorizonTestsAppIntegration
          swift test --filter TuyaAppIncompleteHorizonTerminalSourceTests
          swift test --filter TuyaAlreadyTerminalObservationContinuitySourceTests
          swift test --filter TuyaDeviceSharingAuthenticationAuthorityTests

      - name: Publish only if canonical head is still unchanged
        shell: bash
        run: |
          set -euo pipefail
          branch='capture/current-main-tuya-readonly-convergence-gpt56'
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonAppIntegrationTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaIncompleteObservationSemanticTerminalTests.swift
          git diff --cached --check
          git diff --cached --quiet && { echo 'No product delta to publish'; exit 1; }
          git commit -m 'Capture V16.1: compose app truth and package-owned horizon'
          git push origin HEAD:"$branch"
