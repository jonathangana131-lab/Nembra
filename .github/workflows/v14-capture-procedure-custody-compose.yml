name: V14 Capture Procedure Custody Compose

on:
  push:
    branches:
      - integration/v14-capture-guided-plus-procedure-custody-sol

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-guided-plus-procedure-custody-sol
          fetch-depth: 0

      - name: Bind exact guided parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f6ad602ae178ac58416d3a636193f51489c8f638"

      - name: Recover reviewed built-procedure custody delta
        run: |
          set -euo pipefail
          donor=5b7eb00e2a049e28145dc0d15c4edd1bd8bdec27
          git show "$donor:NembraApp/App/NembraCaptureBuildIdentity.swift" > NembraApp/App/NembraCaptureBuildIdentity.swift
          git show "$donor:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift" > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift
          git show "$donor:scripts/field/install_one_time_capture.command" > scripts/field/install_one_time_capture.command

      - name: Verify procedure custody remains exact and guided product untouched
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          python3 - <<'PY'
          from pathlib import Path
          identity = Path('NembraApp/App/NembraCaptureBuildIdentity.swift').read_text()
          installer = Path('scripts/field/install_one_time_capture.command').read_text()
          entry = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          required_identity = [
              'static let procedureIdentifierInfoKey = "NembraCaptureProcedureIdentifier"',
              'static let fieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"',
              'let procedureIdentifier: String',
              'procedureIdentifier == Self.fieldProcedureIdentifier',
          ]
          required_installer = [
              'PROCEDURE_ID="ES80-AUTHENTICATED-STATIONARY-v1"',
              'INFOPLIST_KEY_NembraCaptureProcedureIdentifier=$PROCEDURE_ID',
              'BUILT_PROCEDURE_IDENTIFIER="$(/usr/bin/plutil -extract NembraCaptureProcedureIdentifier',
              '[[ "$BUILT_PROCEDURE_IDENTIFIER" == "$PROCEDURE_ID" ]]',
          ]
          missing = [s for s in required_identity if s not in identity] + [s for s in required_installer if s not in installer]
          if missing:
              raise SystemExit(f'missing procedure custody contract: {missing}')
          if 'schemaVersion: 10' not in entry or 'fieldProcedureIdentifier' not in entry or 'CAPTURE COMPLETE' not in entry:
              raise SystemExit('guided product/procedure export surface was not preserved')
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            NembraApp/App/NembraCaptureBuildIdentity.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift \
            scripts/field/install_one_time_capture.command | sort)"
          test "$changed" = "$expected"

      - name: Commit clean composed custody and remove materializer
        run: |
          set -euo pipefail
          rm -f .github/workflows/v14-capture-procedure-custody-compose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureBuildIdentity.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift \
            scripts/field/install_one_time_capture.command \
            .github/workflows/v14-capture-procedure-custody-compose.yml
          git diff --cached --check
          git commit -m 'harden(capture): bind guided build to canonical procedure'
          git push origin HEAD:integration/v14-capture-guided-plus-procedure-custody-sol
