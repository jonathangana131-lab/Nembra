name: Normalize Capture composed source formatting

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'GO normalize Capture composed source formatting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Normalize only composition indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = p.read_text()
          fixes = [
              (
                  '            )\n                  } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {',
                  '            )\n        } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {',
                  'application receipt catch indentation',
              ),
              (
                  '                    return\n                          } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {',
                  '                    return\n                } catch TuyaAuthenticatedReadOnlySessionLedger.MutationError.staleConnection {',
                  'watchdog catch indentation',
              ),
              (
                  '                        requirementRow("Repeated scooter data", ready: test.applicationUpdateCount >= TuyaAuthenticatedReadOnlyPreflight.minimumAuthenticatedApplicationPayloadCount)\n                    requirementRow("Scooter data stayed live", ready: test.applicationEvidenceSurvivedHistoricalWindow)',
                  '                        requirementRow("Repeated scooter data", ready: test.applicationUpdateCount >= TuyaAuthenticatedReadOnlyPreflight.minimumAuthenticatedApplicationPayloadCount)\n                        requirementRow("Scooter data stayed live", ready: test.applicationEvidenceSurvivedHistoricalWindow)',
                  'observation checklist indentation',
              ),
          ]
          for old, new, label in fixes:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Publish formatting checkpoint if branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          branch='capture/current-main-tuya-readonly-convergence-gpt56'
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --cached --check
          git diff --cached --quiet && { echo 'No formatting delta'; exit 1; }
          git commit -m 'Capture V16.1: normalize composed app formatting'
          git push origin HEAD:"$branch"
