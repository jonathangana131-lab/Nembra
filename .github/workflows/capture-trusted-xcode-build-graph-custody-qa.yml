name: Capture Trusted Xcode Build Graph Custody QA

on:
  pull_request:
    paths:
      - '.github/workflows/capture-xcode27-trusted-command.yml'
      - '.github/workflows/capture-trusted-xcode-build-graph-custody-qa.yml'
      - 'scripts/ci/tests/test_capture_trusted_xcode_build_graph_custody.py'

permissions:
  contents: read

jobs:
  build-graph-custody:
    name: Verify trusted build graph custody source contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_head="$(git rev-parse --verify HEAD^{commit})"
          printf 'Expected PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"

      - name: Verify build-graph custody source contract
        run: |
          python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_build_graph_custody.py
          python3 scripts/ci/tests/test_capture_trusted_xcode_build_graph_custody.py -v
