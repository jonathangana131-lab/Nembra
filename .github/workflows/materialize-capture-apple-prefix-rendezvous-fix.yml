name: Materialize Capture Apple Prefix Rendezvous Fix

on:
  pull_request:
    branches:
      - product/v14-capture-guided-truth-current-sol
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'sol/v14-capture-apple-prefix-rendezvous-fix-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Guard exact affected parent and scope
        shell: bash
        run: |
          set -euo pipefail
          PARENT=1b12dc56ec20a7dad30760b57a81106644ffc263
          git merge-base --is-ancestor "$PARENT" HEAD
          mapfile -t changed < <(git diff --name-only "$PARENT"..HEAD | sort)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift|.github/workflows/materialize-capture-apple-prefix-rendezvous-fix.yml) ;;
              *) echo "Unexpected pre-materialization path: $path" >&2; exit 1 ;;
            esac
          done
          grep -F 'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"' scripts/field/install_one_time_capture.command >/dev/null

      - name: Apply fail-closed Apple identity rendezvous repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/field/install_one_time_capture.command")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one repair subject, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once('EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"\n', '')

          replace_once(
          '''    apple = entitlements.get("com.apple.developer.applesignin")
              application = entitlements.get("application-identifier")
              team = entitlements.get("com.apple.developer.team-identifier")
          except Exception:
              raise SystemExit(2)
          if apple == ["Default"] and isinstance(application, str) and isinstance(team, str):
              sys.stdout.write(application + "\\t" + team)
          ''',
          '''    value = entitlements.get("com.apple.developer.applesignin")
              application = entitlements.get("application-identifier")
              team = entitlements.get("com.apple.developer.team-identifier")
          except Exception:
              raise SystemExit(2)
          if value == ["Default"] and isinstance(application, str) and isinstance(team, str):
              sys.stdout.write("Default\\t" + application + "\\t" + team)
          ''')

          replace_once(
          '''[[ "$BUILT_SIGNING_IDENTITY" == *$'\\t'* ]] || \\
              die "Final signed Capture app is missing required Sign in with Apple or exact application/team identity entitlements. Discard this candidate."
          BUILT_APPLICATION_IDENTIFIER="${BUILT_SIGNING_IDENTITY%%$'\\t'*}"
          BUILT_TEAM_IDENTIFIER="${BUILT_SIGNING_IDENTITY#*$'\\t'}"
          [[ "$BUILT_APPLICATION_IDENTIFIER" == "$EXPECTED_APPLICATION_IDENTIFIER" ]] || \\
              die "Final signed Capture app application-identifier does not match the selected team and Capture bundle identifier. Discard this candidate."
          [[ "$BUILT_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\
              die "Final signed Capture app team identifier does not match the selected Apple Development team. Discard this candidate."
          ''',
          '''IFS=$'\\t' read -r BUILT_APPLE_SIGNIN_ENTITLEMENT BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER <<< "$BUILT_SIGNING_IDENTITY"
          [[ "$BUILT_APPLE_SIGNIN_ENTITLEMENT" == "Default" ]] || \\
              die "Final signed Capture app does not carry the required Sign in with Apple entitlement. Enable the capability for this App ID/team and rebuild; do not install this candidate."
          [[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]] || \\
              die "Final signed Capture app application-identifier does not end with the exact Capture bundle identifier. Discard this candidate."
          [[ "$BUILT_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\
              die "Final signed Capture app team identifier does not match the selected Apple Development team. Discard this candidate."
          ''')

          replace_once(
          '''    entitlements = root.get("Entitlements", {})
              apple = entitlements.get("com.apple.developer.applesignin")
              application = entitlements.get("application-identifier")
              entitlement_team = entitlements.get("com.apple.developer.team-identifier")
              team_identifiers = root.get("TeamIdentifier")
          except Exception:
              raise SystemExit(2)
          if (apple == ["Default"] and isinstance(application, str) and isinstance(entitlement_team, str)
                  and isinstance(team_identifiers, list) and len(team_identifiers) == 1
                  and team_identifiers[0] == entitlement_team):
              sys.stdout.write(application + "\\t" + entitlement_team)
          ''',
          '''    value = root.get("Entitlements", {}).get("com.apple.developer.applesignin")
              entitlements = root.get("Entitlements", {})
              application = entitlements.get("application-identifier")
              entitlement_team = entitlements.get("com.apple.developer.team-identifier")
              team_identifiers = root.get("TeamIdentifier")
          except Exception:
              raise SystemExit(2)
          if (value == ["Default"] and isinstance(application, str) and isinstance(entitlement_team, str)
                  and isinstance(team_identifiers, list) and len(team_identifiers) == 1
                  and isinstance(team_identifiers[0], str)):
              sys.stdout.write("Default\\t" + application + "\\t" + entitlement_team + "\\t" + team_identifiers[0])
          ''')

          replace_once(
          '''[[ "$PROFILE_SIGNING_IDENTITY" == *$'\\t'* ]] || \\
              die "Embedded provisioning profile is missing required Sign in with Apple or exact application/team identity custody. Discard this candidate."
          PROFILE_APPLICATION_IDENTIFIER="${PROFILE_SIGNING_IDENTITY%%$'\\t'*}"
          PROFILE_TEAM_IDENTIFIER="${PROFILE_SIGNING_IDENTITY#*$'\\t'}"
          [[ "$PROFILE_APPLICATION_IDENTIFIER" == "$EXPECTED_APPLICATION_IDENTIFIER" ]] || \\
              die "Embedded provisioning profile application identifier does not match the selected team and Capture bundle identifier. Discard this candidate."
          [[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\
              die "Embedded provisioning profile team identity does not match the selected Apple Development team. Discard this candidate."
          say "Final signed app and embedded provisioning profile authorize Sign in with Apple for the exact selected App ID and team"
          unset SIGNED_ENTITLEMENTS_OUTPUT BUILT_SIGNING_IDENTITY BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER PROFILE_PLIST_XML PROFILE_SIGNING_IDENTITY PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER BUILT_PROFILE
          ''',
          '''IFS=$'\\t' read -r PROFILE_APPLE_SIGNIN_ENTITLEMENT PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER <<< "$PROFILE_SIGNING_IDENTITY"
          [[ "$PROFILE_APPLE_SIGNIN_ENTITLEMENT" == "Default" ]] || \\
              die "Embedded provisioning profile does not authorize Sign in with Apple for the final Capture app. Enable the capability for this App ID/team and rebuild; do not install this candidate."
          [[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]] || \\
              die "Embedded provisioning profile application identifier does not match the final signed Capture app identifier. Discard this candidate."
          [[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\
              die "Embedded provisioning profile team identity does not match the selected Apple Development team. Discard this candidate."
          [[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\
              die "Embedded provisioning profile root TeamIdentifier does not match the selected Apple Development team. Discard this candidate."
          say "Final signed app and embedded provisioning profile both authorize Sign in with Apple for the exact Capture App ID and selected team"
          unset SIGNED_ENTITLEMENTS_OUTPUT BUILT_SIGNING_IDENTITY BUILT_APPLE_SIGNIN_ENTITLEMENT BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER PROFILE_PLIST_XML PROFILE_SIGNING_IDENTITY PROFILE_APPLE_SIGNIN_ENTITLEMENT PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER BUILT_PROFILE
          ''')

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify corrected custody contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          python3 scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          python3 - <<'PY'
          from pathlib import Path
          installer = Path("scripts/field/install_one_time_capture.command").read_text(encoding="utf-8")
          test = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift").read_text(encoding="utf-8")
          required = [
              '[[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]]',
              '[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]]',
              '[[ "$BUILT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$BUILT_APPLE_SIGNIN_ENTITLEMENT" == "Default" ]]',
              '[[ "$PROFILE_APPLE_SIGNIN_ENTITLEMENT" == "Default" ]]',
          ]
          for needle in required:
              if needle not in installer:
                  raise SystemExit(f"missing corrected custody boundary: {needle}")
          if 'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"' in installer:
              raise SystemExit("invalid Team ID == App ID prefix assumption survived")
          if 'EXPECTED_APPLICATION_IDENTIFIER=\\"${TEAM_ID}.${BUNDLE_ID}\\"' in test:
              raise SystemExit("regression still blesses invalid Team ID/App ID prefix equivalence")
          install = installer.index('say "Installing SDK-integrated Capture on the intended iPhone"')
          for needle in required[:5]:
              if installer.index(needle) > install:
                  raise SystemExit(f"identity check occurs after install boundary: {needle}")
          print("Capture Apple App-ID-prefix rendezvous source contract: PASS")
          PY
          git diff --check

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-sol-materializer"
          git config user.email "nembra-sol-materializer@users.noreply.github.com"
          git rm .github/workflows/materialize-capture-apple-prefix-rendezvous-fix.yml
          git add scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift
          git diff --cached --check
          git commit -m "Fix Capture Apple App ID prefix custody"
          git push origin HEAD:sol/v14-capture-apple-prefix-rendezvous-fix-20260810
