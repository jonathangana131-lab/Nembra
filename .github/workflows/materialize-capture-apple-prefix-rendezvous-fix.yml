name: Materialize Capture Apple Prefix Rendezvous Fix

on:
  pull_request:
    branches:
      - product/v14-capture-guided-truth-current-sol
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'sol/v14-capture-apple-prefix-rendezvous-fix-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Guard exact affected parent and scope
        shell: bash
        run: |
          set -euo pipefail
          PARENT=1b12dc56ec20a7dad30760b57a81106644ffc263
          git merge-base --is-ancestor "$PARENT" HEAD
          mapfile -t changed < <(git diff --name-only "$PARENT"..HEAD | sort)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift|.github/workflows/materialize-capture-apple-prefix-rendezvous-fix.yml|.github/workflows/repair-capture-apple-prefix-materializer-verifier.yml|.github/workflows/repair-capture-apple-prefix-materializer-verifier-v2.yml) ;;
              *) echo "Unexpected pre-materialization path: $path" >&2; exit 1 ;;
            esac
          done
          grep -F 'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"' scripts/field/install_one_time_capture.command >/dev/null

      - name: Apply fail-closed Apple identity rendezvous repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/field/install_one_time_capture.command')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one repair subject, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          replace_once('EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"\n', '')

          replace_once(
              '[[ "$BUILT_APPLICATION_IDENTIFIER" == "$EXPECTED_APPLICATION_IDENTIFIER" ]] || \\\n    die "Final signed Capture app application-identifier does not match the selected team and Capture bundle identifier. Discard this candidate."',
              '[[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]] || \\\n    die "Final signed Capture app application-identifier does not end with the exact Capture bundle identifier. Discard this candidate."'
          )

          replace_once(
              '        and team_identifiers[0] == entitlement_team):\n    sys.stdout.write(application + "\\t" + entitlement_team)',
              '        and isinstance(team_identifiers[0], str)):\n    sys.stdout.write(application + "\\t" + entitlement_team + "\\t" + team_identifiers[0])'
          )

          replace_once(
              '''PROFILE_APPLICATION_IDENTIFIER="${PROFILE_SIGNING_IDENTITY%%$'\\t'*}"
PROFILE_TEAM_IDENTIFIER="${PROFILE_SIGNING_IDENTITY#*$'\\t'}"
[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$EXPECTED_APPLICATION_IDENTIFIER" ]] || \\
    die "Embedded provisioning profile application identifier does not match the selected team and Capture bundle identifier. Discard this candidate."
[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\
    die "Embedded provisioning profile team identity does not match the selected Apple Development team. Discard this candidate."
say "Final signed app and embedded provisioning profile authorize Sign in with Apple for the exact selected App ID and team"
unset SIGNED_ENTITLEMENTS_OUTPUT BUILT_SIGNING_IDENTITY BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER PROFILE_PLIST_XML PROFILE_SIGNING_IDENTITY PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER BUILT_PROFILE''',
              '''IFS=$'\\t' read -r PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER <<< "$PROFILE_SIGNING_IDENTITY"
[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]] || \\
    die "Embedded provisioning profile application identifier does not exactly match the final signed Capture app identifier. Wildcard or mismatched App ID authority is not accepted."
[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\
    die "Embedded provisioning profile entitlement team identity does not match the selected Apple Development team. Discard this candidate."
[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]] || \\
    die "Embedded provisioning profile root TeamIdentifier does not match the selected Apple Development team. Discard this candidate."
say "Final signed app and embedded provisioning profile authorize Sign in with Apple and agree on exact App ID/profile/team custody"
unset SIGNED_ENTITLEMENTS_OUTPUT BUILT_SIGNING_IDENTITY BUILT_APPLICATION_IDENTIFIER BUILT_TEAM_IDENTIFIER PROFILE_PLIST_XML PROFILE_SIGNING_IDENTITY PROFILE_APPLICATION_IDENTIFIER PROFILE_TEAM_IDENTIFIER PROFILE_ROOT_TEAM_IDENTIFIER BUILT_PROFILE'''
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify corrected custody contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          python3 scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          python3 - <<'PY'
          from pathlib import Path
          installer = Path('scripts/field/install_one_time_capture.command').read_text(encoding='utf-8')
          required = [
              '[[ "$BUILT_APPLICATION_IDENTIFIER" == *".$BUNDLE_ID" ]]',
              '[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]]',
              '[[ "$BUILT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
          ]
          for needle in required:
              if needle not in installer:
                  raise SystemExit(f'missing corrected custody boundary: {needle}')
          if 'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"' in installer:
              raise SystemExit('invalid Team ID == App ID prefix assumption survived')
          install = installer.index('say "Installing SDK-integrated Capture on the intended iPhone"')
          for needle in required:
              if installer.index(needle) > install:
                  raise SystemExit(f'identity check occurs after install boundary: {needle}')
          custody_start = installer.index('BUILT_APPLICATION_IDENTIFIER')
          custody = installer[custody_start:install]
          for forbidden in ('connectBLE', 'publishDps', 'writeValue', 'scanForPeripherals', 'NEMBRA_SIMULATION_'):
              if forbidden in custody:
                  raise SystemExit(f'signing custody introduced physical authority: {forbidden}')
          print('Capture Apple App-ID-prefix rendezvous source contract: PASS')
          PY
          git diff --check

      - name: Run focused regression
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaSignedAppleAppIdentityCustodySourceTests

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-sol-materializer"
          git config user.email "nembra-sol-materializer@users.noreply.github.com"
          git rm -f \
            .github/workflows/materialize-capture-apple-prefix-rendezvous-fix.yml \
            .github/workflows/repair-capture-apple-prefix-materializer-verifier.yml \
            .github/workflows/repair-capture-apple-prefix-materializer-verifier-v2.yml
          git add scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Fix Capture Apple App ID prefix custody"
          git push origin HEAD:sol/v14-capture-apple-prefix-rendezvous-fix-20260810
