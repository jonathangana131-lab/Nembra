name: agent wire horizon duration permit
on:
  push:
    branches: ['integration/es80-v14-controller-duration-gated/gpt56']
    paths: ['.github/workflows/agent-wire-horizon-duration-permit.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-controller-duration-gated/gpt56
          fetch-depth: 0
      - name: Apply trusted duration consumer
        shell: bash
        run: |
          python3 .nembra/agent-wire-horizon-duration-permit.py
          git rm .github/workflows/agent-wire-horizon-duration-permit.yml
          git rm .nembra/agent-wire-horizon-duration-permit.py
          git config user.name 'nembra-gpt56'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          git commit -m 'fix: require trusted 60s permit before Horizon admission'
          git push origin HEAD:integration/es80-v14-controller-duration-gated/gpt56
