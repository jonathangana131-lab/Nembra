name: Capture event export custody materializer

on:
  push:
    branches:
      - fix/v14-capture-event-export-custody-sol

permissions:
  contents: write

concurrency:
  group: capture-event-export-custody-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-event-export-custody-sol
          fetch-depth: 0

      - name: Guard exact source lineage and red contracts
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8069c0ffec496cacbe263016d8a7f4ca15ddc64e HEAD
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift

      - name: Materialize event/export custody repair
        shell: python3 {0}
        run: |
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()

          admission_anchor = "        applicationUpdateAdmissionsInFlight += 1"
          if source.count(admission_anchor) != 1:
              raise SystemExit(f'expected exactly one application admission anchor, found {source.count(admission_anchor)}')
          uid_custody = "\n".join([
              "        guard let verifiedAccountUID = membershipAccountUID,",
              "              !verifiedAccountUID.isEmpty else {",
              "            await invalidateSourceAuthority(",
              "                token: token,",
              "                message: \"Verified Tuya account identity became unavailable before application evidence could enter event custody.\" ,",
              "                kind: \"sdk_account_uid_unavailable_before_application_event_custody\"",
              "            )",
              "            return",
              "        }",
              "",
              "        let exportSafeUpdate = update.reduce(into: [String: String]()) { sanitized, entry in",
              "            let safeKey = entry.key.replacingOccurrences(",
              "                of: verifiedAccountUID,",
              "                with: \"<redacted-account-uid>\"",
              "            )",
              "            let safeValue = entry.value.replacingOccurrences(",
              "                of: verifiedAccountUID,",
              "                with: \"<redacted-account-uid>\"",
              "            )",
              "            sanitized[safeKey] = safeValue",
              "        }",
              "",
          ]).replace('custody.\" ,', 'custody.\",')
          source = source.replace(admission_anchor, uid_custody + admission_anchor, 1)

          raw_log = 'log("tuya_application_update", update.merging(['
          safe_log = 'log("tuya_application_update", exportSafeUpdate.merging(['
          if source.count(raw_log) != 1:
              raise SystemExit(f'expected exactly one raw application-event log merge, found {source.count(raw_log)}')
          source = source.replace(raw_log, safe_log, 1)

          untrusted_precedence = ']) { current, _ in current })'
          trusted_precedence = ']) { _, trusted in trusted })'
          if source.count(untrusted_precedence) != 1:
              raise SystemExit(f'expected exactly one untrusted merge precedence closure, found {source.count(untrusted_precedence)}')
          source = source.replace(untrusted_precedence, trusted_precedence, 1)

          duplicate_session_key = "\n".join([
              '        "refreshtoken",',
              '        "sessionkey",',
              '        "authkey",',
          ])
          deduplicated_session_key = "\n".join([
              '        "refreshtoken",',
              '        "authkey",',
          ])
          if source.count(duplicate_session_key) != 1:
              raise SystemExit(f'expected exactly one duplicate session-key classifier tail, found {source.count(duplicate_session_key)}')
          source = source.replace(duplicate_session_key, deduplicated_session_key, 1)

          path.write_text(source)

      - name: Focused source contracts
        shell: python3 {0}
        run: |
          from pathlib import Path

          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()

          def section(start, end):
              left = source.index(start)
              right = source.index(end, left + len(start))
              return source[left:right]

          receiver = section('private func receivedApplicationUpdate(', 'private func startWatchdog')
          assert 'guard let verifiedAccountUID = membershipAccountUID' in receiver
          assert receiver.count('<redacted-account-uid>') == 2
          assert 'entry.key.replacingOccurrences' in receiver
          assert 'entry.value.replacingOccurrences' in receiver
          assert receiver.count('of: verifiedAccountUID') >= 2
          assert 'log("tuya_application_update", update.merging([' not in receiver
          assert 'log("tuya_application_update", exportSafeUpdate.merging([' in receiver
          assert ']) { current, _ in current })' not in receiver
          assert ']) { _, trusted in trusted })' in receiver

          driver = section('@MainActor\nprivate final class SmartLifeDriver', '#endif\n\nprivate enum AppleAccountAuthorizationError')
          fragments_start = driver.index('private static let secretKeyFragments')
          fragments_end = driver.index('private static func redactApplicationSecrets', fragments_start)
          fragments = driver[fragments_start:fragments_end]
          assert fragments.count('"sessionkey"') == 1
          assert '"uid"' not in fragments

      - name: Verify effective scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only 8069c0ffec496cacbe263016d8a7f4ca15ddc64e...HEAD; git diff --name-only)
          printf '%s\n' "${changed[@]}" | sort -u > /tmp/changed.txt
          for required in \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift; do
            grep -Fxq "$required" /tmp/changed.txt
          done
          while IFS= read -r changed_path; do
            case "$changed_path" in
              NembraApp/App/NembraCaptureEntrypoint.swift|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift|.github/workflows/capture-event-export-custody-materialize.yml) ;;
              '') ;;
              *) echo "unexpected changed path: $changed_path" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt

      - name: Self-remove helper and publish clean donor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-event-export-custody-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            .github/workflows/capture-event-export-custody-materialize.yml
          git diff --cached --check
          git commit -m 'fix(capture): bind application export to trusted account provenance'
          git push origin HEAD:fix/v14-capture-event-export-custody-sol
