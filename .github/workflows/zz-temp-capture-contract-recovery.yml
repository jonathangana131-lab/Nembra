name: TEMP Capture source-contract recovery

on:
  push:
    branches:
      - fix/es80-v14-capture-source-contract-recovery-3a4c

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Apply demonstrated stale source-contract migrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          t = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests"

          # Rider-language source contracts: function ordering changed while the rider-first copy stayed.
          p = f"{t}/ES80CapturePrimaryProgressRiderLanguageAcceptanceTests.swift"
          replace(p,
              'from: "private func progressStage(",\n            to: "private func phaseShortName("',
              'from: "private func progressStage(",\n            to: "private func progressAccessibilityLabel("')
          replace(p,
              'from: "private func statusTitle(for phase: Phase)",\n            to: "private func phaseShortName("',
              'from: "private func statusTitle(for phase: Phase)",\n            to: "private func statusSymbol(for phase: Phase)"')
          replace(p,
              '#expect(primary.contains("Capture locked"))',
              '#expect(source.contains("case .physicalProcedureLocked: return \\"Capture locked\\""))')

          # Accessibility copy was intentionally rewritten rider-first; keep the display-only authority checks current.
          p = f"{t}/ES80CaptureAccessibilitySourceAcceptanceTests.swift"
          replace(p,
              '#expect(source.contains("The capture system, not this display timer, decides whether the window has enough evidence."))',
              '#expect(source.contains("This timer is guidance only. Nembra verifies the required observation before accepting this check."))')
          replace(p,
              '#expect(source.contains("This countdown is display guidance only."))',
              '#expect(source.contains("This countdown is guidance only. Nembra accepts the check only after the required observation time is recorded; finishing early cannot create a valid result."))')

          # Stationary preflight deliberately removed recipe jargon from rider UI; keep the actual per-run disconnected declaration pinned.
          p = f"{t}/ES80PhysicalRunbookChargerPreflightAcceptanceTests.swift"
          replace(p,
              '#expect(app.contains("Required for ES80-FINGERPRINT-v1"))',
              '#expect(app.contains("Keep charger unplugged for the whole capture"))')

          # Canonical private factory now documents the explicit denial. The source hit is the denial comment, not preference authority.
          p = f"{t}/PassiveBluetoothExperimentOneVerifiedAdmissionTests.swift"
          replace(p,
              '#expect(!source.contains("UserDefaults"))',
              '#expect(source.contains("cannot be enabled by UserDefaults"))')

          # Admission payload gained the producer-issued monotonic handoff receipt.
          p = f"{t}/PassiveBluetoothExperimentOnePublicAuthoritySurfaceTests.swift"
          replace(p,
              'fileprivateinit(admissionIdentity:UUID,powerCycleEvidence:PassiveBluetoothExperimentOnePowerCycleEvidence,peripheralIdentifier:UUID,recorder:PassiveCoreBluetoothCaptureRecorder)',
              'fileprivateinit(admissionIdentity:UUID,powerCycleEvidence:PassiveBluetoothExperimentOnePowerCycleEvidence,peripheralIdentifier:UUID,recorder:PassiveCoreBluetoothCaptureRecorder,issuedAtUptimeNanoseconds:UInt64)')

          # Controller now stages against a read-only preview before irreversible one-shot consumption.
          p = f"{t}/ForegroundCoreBluetoothCaptureControllerExperimentOneAdmissionContractTests.swift"
          replace(p,
              'peripheralByIdentifier[payload.peripheralIdentifier]',
              'peripheralByIdentifier[preview.peripheralIdentifier]')
          replace(p,
              'latestDiscoveryByIdentifier[payload.peripheralIdentifier]',
              'latestDiscoveryByIdentifier[preview.peripheralIdentifier]')

          p = f"{t}/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift"
          replace(p,
              'latestAdvertisementByIdentifier[payload.peripheralIdentifier]',
              'latestAdvertisementByIdentifier[preview.peripheralIdentifier]')
          replace(p,
              'receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds',
              'receivedAtUptimeNanoseconds > preview.issuedAtUptimeNanoseconds')

          # Coordinator avoids sorting/materializing the presentation catalog for exact UUID authority.
          p = f"{t}/PassiveBluetoothExperimentOneCoordinatorContractTests.swift"
          replace(p,
              'controller.discoveredPeripherals.first(where: { $0.id == identifier })',
              'controller.hasDiscoveredPeripheral(identifier: identifier)')

          # Abort recovery scheduling is now separated by explanatory fail-closed quarantine comments.
          p = f"{t}/ForegroundCoreBluetoothCaptureControllerAbortFreshSessionConsumerContractTests.swift"
          replace(p,
              '#expect(controller.contains("connectionPhase = .idle\\n        scheduleAbortedFreshTargetSessionRecoveryIfNeeded()"))',
              'let idle = try #require(controller.range(of: "connectionPhase = .idle"))\n        let schedule = try #require(controller.range(of: "scheduleAbortedFreshTargetSessionRecoveryIfNeeded()", range: idle.upperBound..<controller.endIndex))\n        #expect(idle.lowerBound < schedule.lowerBound)')

          # Fresh-session recovery may await one already-running old recorder drain; the publication/reopen transaction itself stays synchronous.
          p = f"{t}/ForegroundCoreBluetoothCaptureControllerTerminalFreshSessionConsumerTests.swift"
          replace(p,
              '#expect(!recovery.contains("await "))',
              'let synchronousStart = try #require(recovery.range(of: "let freshSession = try PassiveCoreBluetoothTerminalFreshTargetSession.create(")?.lowerBound)\n        #expect(!recovery[synchronousStart...].contains("await "))')
          PY

          rm .github/workflows/zz-temp-capture-contract-recovery.yml
          git diff --check
          git status --short
      - name: Commit test-only recovery
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(capture): migrate stale source contracts to current authority seams'
          git push origin HEAD:${{ github.ref_name }}
