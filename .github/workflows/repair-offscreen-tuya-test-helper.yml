name: Repair Offscreen Tuya Test Helper Collision

on:
  push:
    branches:
      - red/v14-capture-a267-offscreen-tuya-session-fence-sol

permissions:
  contents: write

jobs:
  repair-helper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: red/v14-capture-a267-offscreen-tuya-session-fence-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Rename only the colliding test helper in the materializer
        shell: bash
        run: |
          set -euo pipefail
          helper='.github/materializers/offscreen-tuya-session-a267.py'
          python3 - "$helper" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          old_call='begin.ranges(of: "self.secureLinkViewGeneration == viewGeneration").last'
          new_call='begin.offscreenRanges(of: "self.secureLinkViewGeneration == viewGeneration").last'
          old_decl='func ranges(of needle: String) -> [Range<String.Index>] {'
          new_decl='func offscreenRanges(of needle: String) -> [Range<String.Index>] {'
          if s.count(old_call) != 1 or s.count(old_decl) != 1:
              raise SystemExit('expected unique colliding helper call/declaration')
          s=s.replace(old_call, new_call, 1).replace(old_decl, new_decl, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'begin.offscreenRanges(of:' "$helper"
          grep -Fq 'func offscreenRanges(of needle: String)' "$helper"
          ! grep -Fq 'begin.ranges(of:' "$helper"
          ! grep -Fq 'func ranges(of needle: String)' "$helper"
          git diff --check
          git rm .github/workflows/repair-offscreen-tuya-test-helper.yml
          git add "$helper"
          git diff --cached --check
          git config user.name 'nembra-sol'
          git config user.email 'nembra-sol@users.noreply.github.com'
          git commit -m 'chore(capture): isolate offscreen regression helper name'
          git push origin HEAD:red/v14-capture-a267-offscreen-tuya-session-fence-sol