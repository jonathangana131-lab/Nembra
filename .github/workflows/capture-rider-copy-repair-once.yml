name: Repair Capture rider-facing receipt copy

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'GO repair Capture rider-facing receipt copy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind repair lineage
        shell: bash
        run: |
          set -euo pipefail
          parent='68ddd23821ac3eb143e32d0bb1c4b17e74455cbe'
          git merge-base --is-ancestor "$parent" HEAD
          changed="$(git diff --name-only "$parent"...HEAD)"
          test "$changed" = '.github/workflows/capture-rider-copy-repair-once.yml'

      - name: Repair primary rider copy and add regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text()
          replacements = {
              'message: "Application receipt chronology failed closed because the monotonic clock regressed."': 'message: "Scooter data timing became invalid, so this observation stopped safely. Relaunch Capture and start again from scooter OFF."',
              'message: "Application receipt crossed the package-owned continuous-observation horizon. The package already retired this generation; no disconnect is claimed."': 'message: "Scooter data arrived after this observation window was no longer valid. This does not prove Bluetooth disconnected. Relaunch Capture and start again from scooter OFF."',
              'message: "Application receipt reached the 60-second incomplete-evidence horizon without earning canonical stationary-mapping readiness. Required repeated application evidence remained incomplete. The package already retired this exact generation without another liveness sample or a Bluetooth-disconnect claim. Relaunch Capture and start again from scooter OFF."': 'message: "Scooter data did not become sufficient within 60 seconds. Keep the scooter stationary, relaunch Capture, and start again from scooter OFF."',
              'message: "Application receipt violated the current internal session lifecycle: \\(error.localizedDescription)"': 'message: "Scooter data could not be accepted into this observation. Relaunch Capture and start again from scooter OFF."',
              'message: "Authenticated liveness chronology regressed. The exact generation was retired without another clock sample."': 'message: "Observation timing became invalid, so this capture stopped safely. Relaunch Capture and start again from scooter OFF."',
              'message: "Authenticated-session liveness crossed the package-owned continuous-observation horizon. The package already retired this generation; no disconnect is claimed."': 'message: "Scooter data stopped satisfying the continuous observation window. This does not prove Bluetooth disconnected. Relaunch Capture and start again from scooter OFF."',
              'message: "Authenticated observation reached the 60-second incomplete-evidence horizon without earning canonical stationary-mapping readiness. Required repeated application evidence remained incomplete. The package already retired this exact generation without another liveness sample or a Bluetooth-disconnect claim. Relaunch Capture and start again from scooter OFF."': 'message: "Scooter data did not become sufficient within 60 seconds. Keep the scooter stationary, relaunch Capture, and start again from scooter OFF."',
              'message: "Authenticated liveness violated the current internal session lifecycle: \\(error.localizedDescription)"': 'message: "This observation could not continue safely. Relaunch Capture and start again from scooter OFF."',
          }
          for old, new in replacements.items():
              count = app.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old}')
              app = app.replace(old, new)
          app_path.write_text(app)

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkProductSurfaceSourceTests.swift')
          test = test_path.read_text()
          marker = '    @Test("large Dynamic Type receives a recomposed stage indicator")\n'
          if test.count(marker) != 1:
              raise SystemExit('product-surface insertion marker drifted')
          if 'capture-stopped receipt failures use rider-facing scooter language' in test:
              raise SystemExit('rider-copy regression already present')
          lines = [
              '    @Test("capture-stopped receipt failures use rider-facing scooter language")',
              '    func captureStoppedReceiptFailuresAvoidEngineeringJargon() throws {',
              '        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")',
              '        let receipt = String(try section(',
              '            in: app,',
              '            from: "private func receivedApplicationUpdate(",',
              '            to: "private func redactedApplicationEventDetails("',
              '        ))',
              '        let surface = String(try section(',
              '            in: app,',
              '            from: "private struct SecureLinkView: View",',
              '            to: "private struct SecureTransfer: Transferable"',
              '        ))',
              '',
              '        #expect(surface.contains("Text(test.message)"))',
              '        #expect(receipt.contains("mirrorAlreadyTerminalIncompleteObservationHorizon("))',
              '        #expect(!receipt.contains("message: \\"Application receipt"))',
              '        #expect(!receipt.contains("package-owned"))',
              '        #expect(receipt.contains("Scooter data did not become sufficient within 60 seconds."))',
              '    }',
              '',
          ]
          test = test.replace(marker, '\n'.join(lines) + '\n' + marker)
          test_path.write_text(test)

          receipt = app.split('private func receivedApplicationUpdate(', 1)[1].split('private func redactedApplicationEventDetails(', 1)[0]
          if 'message: "Application receipt' in receipt or 'package-owned' in receipt:
              raise SystemExit('rider-facing receipt copy still contains engineering jargon')
          if 'kind: "application_authenticated_incomplete_readiness_horizon_reached"' not in receipt:
              raise SystemExit('internal terminal kind was lost')
          PY

      - name: Publish repaired canonical bytes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-rider-copy-repair-once.yml
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Capture V16.1: keep stopped-state failures rider-facing'
          git fetch origin capture/current-main-tuya-readonly-convergence-gpt56
          test "$(git rev-parse origin/capture/current-main-tuya-readonly-convergence-gpt56)" = "$GITHUB_SHA"
          git push origin HEAD:capture/current-main-tuya-readonly-convergence-gpt56
