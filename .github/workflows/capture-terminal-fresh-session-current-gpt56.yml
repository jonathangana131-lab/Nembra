name: Capture terminal fresh-session gate exact-current convergence

on:
  push:
    branches:
      - feature/capture-v14-terminal-fresh-handoff-current-gpt56
    paths:
      - .github/workflows/capture-terminal-fresh-session-current-gpt56.yml

permissions:
  contents: write

jobs:
  compose-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/capture-v14-terminal-fresh-handoff-current-gpt56
          fetch-depth: 2

      - name: Verify exact staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c31d27823639f6de2ff9f9b79386281e46627149"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-terminal-fresh-session-current-gpt56.yml"

      - name: Compose terminal gate authority only
        shell: bash
        run: |
          set -euo pipefail
          base=50732571e01929ef22c79bd7f99178cf4f78a6bf
          source=28c9dde0398d14f353415b860d806215d597792b
          gate=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          gate_test=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothTerminalRealRecorderReopenTests.swift

          git fetch --no-tags origin "$base" "$source"
          git diff --binary "$base" "$source" -- "$gate" > /tmp/terminal-gate.patch
          test -s /tmp/terminal-gate.patch
          git apply --3way --index /tmp/terminal-gate.patch
          git show "$source:$gate_test" > "$gate_test"
          git add "$gate_test"

          rm .github/workflows/capture-terminal-fresh-session-current-gpt56.yml
          git add -u .github/workflows/capture-terminal-fresh-session-current-gpt56.yml
          git diff --cached --check

          grep -q 'case freshTargetSessionRequired' "$gate"
          grep -q 'case freshRecorderIdentityMismatch' "$gate"
          grep -q 'terminalResolvedFrontierNotApplied' "$gate"
          grep -q 'terminalQueueChangedAfterResolution' "$gate"
          grep -q 'requiredReadyTargetSessionGeneration' "$gate"
          grep -q 'reopenAfterTerminalFreshTargetSession' "$gate"
          grep -q 'freshTargetSession.recorderIdentity == ObjectIdentifier(installedRecorder)' "$gate"
          test -f "$gate_test"
          test ! -e .github/workflows/capture-terminal-fresh-session-current-gpt56.yml

      - name: Commit product-only gate convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-chatgpt56-thinking"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: require exact fresh recorder before terminal gate reopen"
          git push origin HEAD:feature/capture-v14-terminal-fresh-handoff-current-gpt56
