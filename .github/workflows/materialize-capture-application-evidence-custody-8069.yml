name: Materialize Capture Application Evidence Custody 8069

on:
  push:
    branches:
      - sol/v14-capture-application-evidence-custody-8069

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-application-evidence-custody-8069
          fetch-depth: 0

      - name: Guard exact product parent and bounded helper scope
        shell: bash
        run: |
          set -euo pipefail
          parent='8069c0ffec496cacbe263016d8a7f4ca15ddc64e'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/materialize-capture-application-evidence-custody-8069.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEvidenceCustodySourceTests.swift' \
            'scripts/ci/materialize_capture_application_evidence_custody_8069.py' | sort)"
          test "$changed" = "$expected"

      - name: Apply application evidence custody repair
        run: python3 scripts/ci/materialize_capture_application_evidence_custody_8069.py apply

      - name: Verify bounded truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_application_evidence_custody_8069.py verify
          python3 -m py_compile scripts/ci/materialize_capture_application_evidence_custody_8069.py
          git diff --check

      - name: Publish clean product bytes
        shell: bash
        run: |
          set -euo pipefail
          parent='8069c0ffec496cacbe263016d8a7f4ca15ddc64e'
          rm .github/workflows/materialize-capture-application-evidence-custody-8069.yml
          rm scripts/ci/materialize_capture_application_evidence_custody_8069.py
          git add -A
          changed="$(git diff --cached "$parent" --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEvidenceCustodySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$parent" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): bind application evidence custody'
          git push origin HEAD:sol/v14-capture-application-evidence-custody-8069
