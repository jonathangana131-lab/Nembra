name: Validate Capture Navigation Lease Regression Scope

on:
  push:
    branches:
      - sol/v14-capture-navigation-lease-regression-scope-20260810

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-navigation-lease-regression-scope-20260810
          fetch-depth: 0

      - name: Guard exact current product parent and one-file scope
        run: |
          set -euo pipefail
          parent='b22f9f412974cc5a3b3c257175900a2e78b21588'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          changed="$(git diff --name-only "$parent" HEAD | grep -v '^.github/workflows/validate-capture-navigation-lease-regression-scope.yml$' || true)"
          test "$changed" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift'

      - name: Parse and mechanically verify scoped regression
        shell: bash
        run: |
          set -euo pipefail
          test_file='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift'
          swiftc -parse "$test_file"
          grep -Fq 'from: "func abandonCorrelationForViewExit()"' "$test_file"
          grep -Fq 'to: "var privateConfig: Bool"' "$test_file"
          grep -Fq 'from: ".task {"' "$test_file"
          grep -Fq 'to: ".onChange(of: sdkAccount.loggedIn)"' "$test_file"
          grep -Fq '#expect(guardLine < abandonLine)' "$test_file"
          grep -Fq '#expect(abandonLine < failureLine)' "$test_file"
          grep -Fq '#expect(failureLine < recoveryLine)' "$test_file"
          grep -Fq '#expect(recoveryLine < logLine)' "$test_file"
          grep -Fq '#expect(disappearLine < hookCallLine)' "$test_file"
          git diff --check

      - name: Remove validation helper from final branch
        run: |
          set -euo pipefail
          rm .github/workflows/validate-capture-navigation-lease-regression-scope.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(capture): remove navigation regression validator"
          git push origin HEAD:sol/v14-capture-navigation-lease-regression-scope-20260810
