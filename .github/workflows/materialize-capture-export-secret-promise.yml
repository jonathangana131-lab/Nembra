name: Materialize Capture Export Secret Promise

on:
  push:
    branches: [fix/v14-capture-export-secret-promise-sol]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-export-secret-promise-sol
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact product source
        run: |
          set -euo pipefail
          parent=ca43d7943027f04a1dfe4ab5f777c24a167ea96b
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Materialize and validate shared classifier
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_export_secret_promise.py
          python3 -m py_compile scripts/ci/materialize_capture_export_secret_promise.py
          git diff --check
      - name: Publish clean repair
        run: |
          set -euo pipefail
          parent=ca43d7943027f04a1dfe4ab5f777c24a167ea96b
          rm .github/workflows/materialize-capture-export-secret-promise.yml
          rm scripts/ci/materialize_capture_export_secret_promise.py
          git add -A
          git diff --cached --check
          git config user.name nembra-sol
          git config user.email nembra-sol@users.noreply.github.com
          git commit -m 'fix(capture): match application redaction to export promise'
          test "$(git diff --name-only "$parent" HEAD | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift' | sort)"
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-export-secret-promise-sol
