name: Capture Private Read Lease Plan Generation Split Red Team

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_private_read_lease_plan_generation_split_red_team.py
      - .github/workflows/capture-private-read-lease-plan-generation-split-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-private-read-lease-plan-generation-split-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: aa610e1000e58ba5e43e35a75ee8f22486aea5ec
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  exploit-positive:
    name: Expose mixed-generation pathname planning
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact attacked product head and validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-plan-generation-split-red-team.yml \
            scripts/ci/tests/test_capture_private_read_lease_plan_generation_split_red_team.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile oracle without bytecode artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          path=Path('scripts/ci/tests/test_capture_private_read_lease_plan_generation_split_red_team.py')
          compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
          PY

      - name: Require exploit-positive mixed-generation grant
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_plan_generation_split_red_team.py

      - name: Preserve current component-walk regression
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py

      - name: Preserve exact validation-only head
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'NEMBRA_PLAN_GENERATION_SPLIT_BOUNDARY exploitPositive=true productionBytesChanged=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false'
