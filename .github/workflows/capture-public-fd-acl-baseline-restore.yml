name: Capture Public FD ACL Baseline Restore

on:
  push:
    branches:
      - validation/v17-capture-public-fd-acl-baseline-restore-sol-20260817
  pull_request:
    paths:
      - .github/workflows/capture-public-fd-acl-baseline-restore.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-public-fd-acl-baseline-restore-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTACKED_PARENT: b87d375e5ae419fd5569c2cd63a6b42fc45174b0

jobs:
  public-fd-baseline-restore:
    name: Classify public acl_set_fd grant + baseline restore
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact attacked parent and validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$ATTACKED_PARENT^{commit}"
          git merge-base --is-ancestor "$ATTACKED_PARENT" HEAD
          changed="$(git diff --name-only "$ATTACKED_PARENT"...HEAD)"
          test "$changed" = '.github/workflows/capture-public-fd-acl-baseline-restore.yml'
          git diff --check "$ATTACKED_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Build staged SDK-public descriptor ACL oracle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/fd_acl_stage.c" <<'C'
          #include <sys/types.h>
          #include <sys/acl.h>
          #include <sys/stat.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <grp.h>
          #include <pwd.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static void die(const char *label) {
              fprintf(stderr, "%s: %s\n", label, strerror(errno));
              exit(70);
          }

          static acl_t path_acl(const char *path) {
              acl_t acl = acl_get_file(path, ACL_TYPE_EXTENDED);
              if (!acl) die("acl_get_file");
              return acl;
          }

          static void apply_path_acl_to_fd(const char *source, int fd) {
              acl_t acl = path_acl(source);
              if (acl_set_fd(fd, acl) != 0) die("acl_set_fd");
              if (acl_free(acl) != 0) die("acl_free");
          }

          static void require_same_identity(int fd, const char *path) {
              struct stat a;
              struct stat b;
              if (fstat(fd, &a) != 0) die("fstat");
              if (lstat(path, &b) != 0) die("lstat");
              if (a.st_dev != b.st_dev || a.st_ino != b.st_ino ||
                  (a.st_mode & S_IFMT) != (b.st_mode & S_IFMT)) {
                  fputs("held fd no longer names original vnode\n", stderr);
                  exit(71);
              }
          }

          static void grant_after_rename(
              const char *accepted,
              const char *held,
              const char *desired
          ) {
              int fd = open(accepted, O_RDONLY | O_DIRECTORY);
              if (fd < 0) die("open accepted");
              require_same_identity(fd, accepted);
              if (rename(accepted, held) != 0) die("rename accepted to held");
              if (mkdir(accepted, 0700) != 0) die("mkdir hostile replacement");

              char replacement_payload[2048];
              if (snprintf(
                      replacement_payload,
                      sizeof(replacement_payload),
                      "%s/replacement.txt",
                      accepted
                  ) >= (int)sizeof(replacement_payload)) {
                  fputs("replacement path too long\n", stderr);
                  exit(72);
              }
              int replacement_fd = open(
                  replacement_payload,
                  O_WRONLY | O_CREAT | O_TRUNC,
                  0644
              );
              if (replacement_fd < 0) die("create replacement payload");
              if (write(replacement_fd, "R", 1) != 1) die("write replacement payload");
              if (close(replacement_fd) != 0) die("close replacement payload");

              require_same_identity(fd, held);
              struct stat held_stat;
              struct stat replacement_stat;
              if (lstat(held, &held_stat) != 0) die("lstat held");
              if (lstat(accepted, &replacement_stat) != 0) die("lstat replacement");
              if (held_stat.st_dev == replacement_stat.st_dev &&
                  held_stat.st_ino == replacement_stat.st_ino) {
                  fputs("hostile replacement aliases original vnode\n", stderr);
                  exit(73);
              }

              apply_path_acl_to_fd(desired, fd);
              if (close(fd) != 0) die("close held fd");
              puts("NEMBRA_FD_ACL_STAGE grantAfterRename=true originalVnodeRetained=true");
          }

          static void apply_to_path(const char *target, const char *source) {
              int fd = open(target, O_RDONLY | O_DIRECTORY);
              if (fd < 0) die("open rollback target");
              apply_path_acl_to_fd(source, fd);
              if (close(fd) != 0) die("close rollback target");
              puts("NEMBRA_FD_ACL_STAGE baselineApply=true");
          }

          static int can_read_as(const char *principal, const char *path) {
              struct passwd *pw = getpwnam(principal);
              if (!pw) {
                  fputs("principal lookup failed\n", stderr);
                  return 74;
              }
              if (setgroups(0, NULL) != 0) die("setgroups");
              if (setgid(pw->pw_gid) != 0) die("setgid");
              if (setuid(pw->pw_uid) != 0) die("setuid");
              int fd = open(path, O_RDONLY);
              if (fd < 0) return errno == EACCES ? 1 : 75;
              char byte = 0;
              ssize_t got = read(fd, &byte, 1);
              if (close(fd) != 0) return 76;
              return got == 1 ? 0 : 77;
          }

          static void dump_acl(const char *path) {
              acl_t acl = path_acl(path);
              ssize_t length = 0;
              char *text = acl_to_text(acl, &length);
              if (!text) die("acl_to_text");
              if (fwrite(text, 1, (size_t)length, stdout) != (size_t)length) {
                  die("fwrite acl text");
              }
              if (acl_free(text) != 0) die("acl_free text");
              if (acl_free(acl) != 0) die("acl_free acl");
          }

          int main(int argc, char **argv) {
              if (argc >= 2 && strcmp(argv[1], "grant-after-rename") == 0 && argc == 5) {
                  grant_after_rename(argv[2], argv[3], argv[4]);
                  return 0;
              }
              if (argc >= 2 && strcmp(argv[1], "apply") == 0 && argc == 4) {
                  apply_to_path(argv[2], argv[3]);
                  return 0;
              }
              if (argc >= 2 && strcmp(argv[1], "can-read") == 0 && argc == 4) {
                  return can_read_as(argv[2], argv[3]);
              }
              if (argc >= 2 && strcmp(argv[1], "dump") == 0 && argc == 3) {
                  dump_acl(argv[2]);
                  return 0;
              }
              fputs("invalid fd_acl_stage invocation\n", stderr);
              return 64;
          }
          C
          /usr/bin/clang -Wall -Wextra -Werror -O2 \
            "$RUNNER_TEMP/fd_acl_stage.c" \
            -o "$RUNNER_TEMP/fd_acl_stage"

      - name: Prepare resolvable ACL fixtures
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          principal=nobody
          /usr/bin/id "$principal" >/dev/null
          root="/private/tmp/nembra-public-fd-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/sudo -n /bin/rm -rf "$root"
          /usr/bin/sudo -n /bin/mkdir -m 0755 "$root"
          /usr/bin/sudo -n /bin/mkdir -m 0700 \
            "$root/absent.accepted" \
            "$root/seeded.accepted" \
            "$root/baseline-absent" \
            "$root/baseline-seeded" \
            "$root/desired"
          printf 'A' | /usr/bin/sudo -n /usr/bin/tee "$root/absent.accepted/payload.txt" >/dev/null
          printf 'S' | /usr/bin/sudo -n /usr/bin/tee "$root/seeded.accepted/payload.txt" >/dev/null
          /usr/bin/sudo -n /bin/chmod 0644 \
            "$root/absent.accepted/payload.txt" \
            "$root/seeded.accepted/payload.txt"
          /usr/bin/sudo -n /bin/chmod -N \
            "$root/absent.accepted" \
            "$root/seeded.accepted" \
            "$root/baseline-absent" \
            "$root/baseline-seeded" \
            "$root/desired"
          /usr/bin/sudo -n /bin/chmod +a 'user:root allow readattr' \
            "$root/seeded.accepted" "$root/baseline-seeded"
          /usr/bin/sudo -n /bin/chmod +a \
            "user:${principal} allow list,search,readattr,readextattr,readsecurity" \
            "$root/desired"
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" dump "$root/baseline-absent" \
            > "$RUNNER_TEMP/baseline-absent.acl"
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" dump "$root/baseline-seeded" \
            > "$RUNNER_TEMP/baseline-seeded.acl"
          echo 'NEMBRA_FD_ACL_STAGE fixtures=true principalResolved=true'

      - name: Absent baseline - descriptor grant after hostile pathname replacement
        shell: bash
        run: |
          set -euo pipefail
          root="/private/tmp/nembra-public-fd-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" grant-after-rename \
            "$root/absent.accepted" "$root/absent.held" "$root/desired"

      - name: Absent baseline - grant creates real subject access only to original
        shell: bash
        run: |
          set -euo pipefail
          root="/private/tmp/nembra-public-fd-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" can-read nobody \
            "$root/absent.held/payload.txt"
          if /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" can-read nobody \
              "$root/absent.accepted/replacement.txt"; then
            echo 'hostile replacement unexpectedly became readable' >&2
            exit 1
          else
            rc=$?
            test "$rc" -eq 1
          fi
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" dump "$root/absent.accepted" \
            > "$RUNNER_TEMP/absent-replacement-before-rollback.acl"
          echo 'NEMBRA_FD_ACL_STAGE absentActualSubjectGrant=true replacementUnaffected=true'

      - name: Absent baseline - public descriptor restore accepts empty baseline
        shell: bash
        run: |
          set -euo pipefail
          root="/private/tmp/nembra-public-fd-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" apply \
            "$root/absent.held" "$root/baseline-absent"

      - name: Absent baseline - restore revokes access and preserves replacement
        shell: bash
        run: |
          set -euo pipefail
          root="/private/tmp/nembra-public-fd-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" can-read nobody \
              "$root/absent.held/payload.txt"; then
            echo 'subject retained access after empty-baseline restore' >&2
            exit 1
          else
            rc=$?
            test "$rc" -eq 1
          fi
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" dump "$root/absent.held" \
            > "$RUNNER_TEMP/absent-restored.acl"
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" dump "$root/absent.accepted" \
            > "$RUNNER_TEMP/absent-replacement-after-rollback.acl"
          diff -u "$RUNNER_TEMP/baseline-absent.acl" "$RUNNER_TEMP/absent-restored.acl"
          diff -u \
            "$RUNNER_TEMP/absent-replacement-before-rollback.acl" \
            "$RUNNER_TEMP/absent-replacement-after-rollback.acl"
          echo 'NEMBRA_FD_ACL_STAGE absentEmptyBaselineRestore=true accessRevoked=true'

      - name: Seeded baseline - descriptor grant after hostile pathname replacement
        shell: bash
        run: |
          set -euo pipefail
          root="/private/tmp/nembra-public-fd-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" grant-after-rename \
            "$root/seeded.accepted" "$root/seeded.held" "$root/desired"

      - name: Seeded baseline - grant creates real subject access only to original
        shell: bash
        run: |
          set -euo pipefail
          root="/private/tmp/nembra-public-fd-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" can-read nobody \
            "$root/seeded.held/payload.txt"
          if /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" can-read nobody \
              "$root/seeded.accepted/replacement.txt"; then
            echo 'hostile replacement unexpectedly became readable' >&2
            exit 1
          else
            rc=$?
            test "$rc" -eq 1
          fi
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" dump "$root/seeded.accepted" \
            > "$RUNNER_TEMP/seeded-replacement-before-rollback.acl"
          echo 'NEMBRA_FD_ACL_STAGE seededActualSubjectGrant=true replacementUnaffected=true'

      - name: Seeded baseline - public descriptor restore accepts nonempty baseline
        shell: bash
        run: |
          set -euo pipefail
          root="/private/tmp/nembra-public-fd-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" apply \
            "$root/seeded.held" "$root/baseline-seeded"

      - name: Seeded baseline - restore revokes access and preserves exact ACL text
        shell: bash
        run: |
          set -euo pipefail
          root="/private/tmp/nembra-public-fd-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" can-read nobody \
              "$root/seeded.held/payload.txt"; then
            echo 'subject retained access after seeded-baseline restore' >&2
            exit 1
          else
            rc=$?
            test "$rc" -eq 1
          fi
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" dump "$root/seeded.held" \
            > "$RUNNER_TEMP/seeded-restored.acl"
          /usr/bin/sudo -n "$RUNNER_TEMP/fd_acl_stage" dump "$root/seeded.accepted" \
            > "$RUNNER_TEMP/seeded-replacement-after-rollback.acl"
          diff -u "$RUNNER_TEMP/baseline-seeded.acl" "$RUNNER_TEMP/seeded-restored.acl"
          diff -u \
            "$RUNNER_TEMP/seeded-replacement-before-rollback.acl" \
            "$RUNNER_TEMP/seeded-replacement-after-rollback.acl"
          echo 'NEMBRA_FD_ACL_STAGE seededBaselineRestore=true accessRevoked=true exactCanonicalAclText=true'

      - name: Preserve validation-only truth boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="/private/tmp/nembra-public-fd-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/sudo -n /bin/rm -rf "$root" 2>/dev/null || true
          echo 'NEMBRA_FD_ACL_STAGE validationOnly=true productionLeaseChanged=false physicalAuthorityCreated=false'
