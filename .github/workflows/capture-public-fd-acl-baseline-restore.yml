name: Capture Seeded ACL Held-FD Restore

on:
  pull_request:
    paths:
      - .github/workflows/capture-public-fd-acl-baseline-restore.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  ATTACKED_PARENT: b87d375e5ae419fd5569c2cd63a6b42fc45174b0

jobs:
  seeded-held-fd-restore:
    if: github.head_ref == 'validation/v17-capture-public-fd-acl-baseline-restore-sol-20260817'
    name: Prove seeded ACL exact restore on held original
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$ATTACKED_PARENT^{commit}"
          git merge-base --is-ancestor "$ATTACKED_PARENT" HEAD
          changed="$(git diff --name-only "$ATTACKED_PARENT"...HEAD)"
          test "$changed" = '.github/workflows/capture-public-fd-acl-baseline-restore.yml'
          git diff --check "$ATTACKED_PARENT"...HEAD
          git diff --quiet "$ATTACKED_PARENT"...HEAD -- scripts/ci/capture_selected_xcode_build_orchestrator.py

      - name: Classify seeded descriptor snapshot and exact restore
        id: oracle
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          field_user="$(/usr/bin/id -un)"
          field_uid="$(/usr/bin/id -u)"
          field_gid="$(/usr/bin/id -g)"
          test "$field_uid" != '0'

          work="$(mktemp -d "$RUNNER_TEMP/nembra-seeded-acl-fd.XXXXXX")"
          root="$(/usr/bin/sudo -n /usr/bin/mktemp -d /private/tmp/nembra-seeded-acl-fd.XXXXXX)"
          cleanup() {
            /usr/bin/sudo -n /bin/rm -rf "$root" >/dev/null 2>&1 || true
            /bin/rm -rf "$work"
          }
          trap cleanup EXIT
          /usr/bin/sudo -n /bin/chmod 0711 "$root"
          subject="$root/accepted-root"
          moved="$root/accepted-root.moved"
          replacement="$root/accepted-root"
          /usr/bin/sudo -n /bin/mkdir -m 0700 "$subject"
          /usr/bin/sudo -n /bin/chmod -N "$subject"
          /usr/bin/sudo -n /bin/chmod +a 'user:root allow readattr' "$subject"

          cat > "$work/seeded_acl_fd_restore.c" <<'C'
          #include <sys/types.h>
          #include <sys/acl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <dirent.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <grp.h>
          #include <stdbool.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static void die_errno(const char *label) {
              fprintf(stderr, "%s: %s\n", label, strerror(errno));
              exit(2);
          }

          static void fail(const char *message) {
              fprintf(stderr, "%s\n", message);
              exit(3);
          }

          static void require_same_identity(int fd, const char *path, const char *label) {
              struct stat by_fd;
              struct stat by_path;
              if (fstat(fd, &by_fd) != 0) die_errno("fstat");
              if (lstat(path, &by_path) != 0) die_errno("lstat");
              if (by_fd.st_dev != by_path.st_dev ||
                  by_fd.st_ino != by_path.st_ino ||
                  (by_fd.st_mode & S_IFMT) != (by_path.st_mode & S_IFMT)) {
                  fprintf(stderr, "%s: descriptor/path identity diverged\n", label);
                  exit(4);
              }
          }

          static int list_as(const char *path, uid_t uid, gid_t gid) {
              pid_t child = fork();
              if (child < 0) die_errno("fork access probe");
              if (child == 0) {
                  if (setgroups(0, NULL) != 0) _exit(120);
                  if (setgid(gid) != 0) _exit(121);
                  if (setuid(uid) != 0) _exit(122);
                  DIR *dir = opendir(path);
                  if (!dir) _exit(10);
                  while (readdir(dir) != NULL) { }
                  if (closedir(dir) != 0) _exit(11);
                  _exit(0);
              }
              int status = 0;
              if (waitpid(child, &status, 0) < 0) die_errno("waitpid access probe");
              if (!WIFEXITED(status)) return 125;
              return WEXITSTATUS(status);
          }

          static void chmod_add(const char *path, const char *principal) {
              char ace[1024];
              if (snprintf(
                      ace,
                      sizeof(ace),
                      "user:%s allow list,search,readattr,readextattr,readsecurity",
                      principal
                  ) >= (int)sizeof(ace)) {
                  fail("ACE is too long");
              }
              pid_t child = fork();
              if (child < 0) die_errno("fork chmod");
              if (child == 0) {
                  execl("/bin/chmod", "chmod", "+a", ace, path, (char *)NULL);
                  _exit(127);
              }
              int status = 0;
              if (waitpid(child, &status, 0) < 0) die_errno("waitpid chmod");
              if (!WIFEXITED(status) || WEXITSTATUS(status) != 0) {
                  fail("canonical-path chmod +a failed");
              }
          }

          static char *acl_text_copy(acl_t acl) {
              ssize_t length = 0;
              char *raw = acl_to_text(acl, &length);
              if (!raw) die_errno("acl_to_text");
              char *copy = calloc((size_t)length + 1, 1);
              if (!copy) die_errno("calloc acl text");
              memcpy(copy, raw, (size_t)length);
              copy[length] = '\0';
              if (acl_free(raw) != 0) die_errno("acl_free text");
              return copy;
          }

          static acl_t require_path_acl(const char *path, const char *label) {
              errno = 0;
              acl_t acl = acl_get_file(path, ACL_TYPE_EXTENDED);
              if (!acl) {
                  fprintf(stderr, "%s: path extended ACL unavailable errno=%d\n", label, errno);
                  exit(5);
              }
              return acl;
          }

          static char *maybe_path_acl_text(const char *path) {
              errno = 0;
              acl_t acl = acl_get_file(path, ACL_TYPE_EXTENDED);
              if (!acl) {
                  if (errno == ENOENT) return strdup("<ABSENT>");
                  die_errno("acl_get_file optional");
              }
              char *text = acl_text_copy(acl);
              if (acl_free(acl) != 0) die_errno("acl_free optional path acl");
              return text;
          }

          int main(int argc, char **argv) {
              if (argc != 7) {
                  fprintf(stderr, "usage: %s PRINCIPAL UID GID SUBJECT MOVED REPLACEMENT\n", argv[0]);
                  return 64;
              }
              const char *principal = argv[1];
              uid_t uid = (uid_t)strtoul(argv[2], NULL, 10);
              gid_t gid = (gid_t)strtoul(argv[3], NULL, 10);
              const char *subject = argv[4];
              const char *moved = argv[5];
              const char *replacement = argv[6];

              if (list_as(subject, uid, gid) == 0) {
                  fail("field identity unexpectedly listed seeded 0700 baseline");
              }

              int fd = open(subject, O_RDONLY | O_DIRECTORY | O_NOFOLLOW | O_CLOEXEC);
              if (fd < 0) die_errno("open accepted root");
              require_same_identity(fd, subject, "baseline");

              acl_t baseline_path_acl = require_path_acl(subject, "baseline-path");
              char *baseline_path_text = acl_text_copy(baseline_path_acl);
              if (acl_free(baseline_path_acl) != 0) die_errno("acl_free baseline path");

              errno = 0;
              acl_t baseline_fd_acl = acl_get_fd(fd);
              if (!baseline_fd_acl) die_errno("acl_get_fd seeded baseline");
              char *baseline_fd_text = acl_text_copy(baseline_fd_acl);
              if (strcmp(baseline_fd_text, baseline_path_text) != 0) {
                  fprintf(
                      stderr,
                      "seeded baseline fd/path ACL semantics diverge\npath=%s\nfd=%s\n",
                      baseline_path_text,
                      baseline_fd_text
                  );
                  exit(6);
              }
              printf("NEMBRA_SEEDED_ACL_BASELINE fdPathEqual=true text=%s\n", baseline_path_text);

              require_same_identity(fd, subject, "immediately-before-grant");
              chmod_add(subject, principal);
              require_same_identity(fd, subject, "immediately-after-grant");
              if (list_as(subject, uid, gid) != 0) {
                  fail("field identity could not list after canonical-path grant");
              }

              acl_t after_grant_acl = require_path_acl(subject, "after-grant-path");
              char *after_grant_text = acl_text_copy(after_grant_acl);
              if (acl_free(after_grant_acl) != 0) die_errno("acl_free after grant");
              if (strcmp(after_grant_text, baseline_path_text) == 0) {
                  fail("path-native ACL did not change after grant");
              }

              if (rename(subject, moved) != 0) die_errno("rename accepted root");
              if (mkdir(replacement, 0700) != 0) die_errno("mkdir attacker replacement");
              require_same_identity(fd, moved, "post-replacement original identity");
              if (list_as(moved, uid, gid) != 0) {
                  fail("moved original lost field access before restore");
              }
              if (list_as(replacement, uid, gid) == 0) {
                  fail("attacker replacement unexpectedly inherited field access");
              }
              char *replacement_before = maybe_path_acl_text(replacement);

              errno = 0;
              int set_result = acl_set_fd(fd, baseline_fd_acl);
              int set_errno = errno;
              printf("NEMBRA_SEEDED_ACL_SET_FD result=%d errno=%d\n", set_result, set_errno);
              if (set_result != 0) {
                  errno = set_errno;
                  die_errno("acl_set_fd seeded baseline restore");
              }
              require_same_identity(fd, moved, "post-restore original identity");

              if (list_as(moved, uid, gid) == 0) {
                  fail("field identity retained list/search after seeded restore");
              }
              if (list_as(replacement, uid, gid) == 0) {
                  fail("attacker replacement gained field access during restore");
              }

              acl_t restored_path_acl = require_path_acl(moved, "restored-path");
              char *restored_path_text = acl_text_copy(restored_path_acl);
              if (acl_free(restored_path_acl) != 0) die_errno("acl_free restored path");
              if (strcmp(restored_path_text, baseline_path_text) != 0) {
                  fprintf(
                      stderr,
                      "seeded original canonical ACL did not restore exactly\nexpected=%s\nactual=%s\n",
                      baseline_path_text,
                      restored_path_text
                  );
                  exit(7);
              }

              char *replacement_after = maybe_path_acl_text(replacement);
              if (strcmp(replacement_before, replacement_after) != 0) {
                  fail("attacker replacement ACL changed during held-fd restore");
              }

              puts(
                  "NEMBRA_SEEDED_ACL_FD_RESTORE "
                  "baselineNonempty=true fdPathBaselineEqual=true canonicalPathGrant=true "
                  "separateUIDGrantObserved=true pathReplaced=true originalIdentityRetained=true "
                  "publicAclSetFdRestore=true exactCanonicalBaselineRestored=true "
                  "separateUIDRevoked=true replacementUntouched=true"
              );

              free(replacement_after);
              free(restored_path_text);
              free(replacement_before);
              free(after_grant_text);
              free(baseline_fd_text);
              free(baseline_path_text);
              if (acl_free(baseline_fd_acl) != 0) die_errno("acl_free baseline fd");
              if (close(fd) != 0) die_errno("close accepted root fd");
              return 0;
          }
          C

          /usr/bin/clang -Wall -Wextra -Werror "$work/seeded_acl_fd_restore.c" -o "$work/seeded_acl_fd_restore"

          set +e
          output="$(/usr/bin/sudo -n "$work/seeded_acl_fd_restore" \
            "$field_user" "$field_uid" "$field_gid" \
            "$subject" "$moved" "$replacement" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$status" > "$RUNNER_TEMP/nembra-seeded-acl-fd-status.txt"
          printf '%s\n' "$output" > "$RUNNER_TEMP/nembra-seeded-acl-fd-output.txt"
          exit "$status"

      - name: Publish exact classifier result to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const statusPath = path.join(process.env.RUNNER_TEMP, 'nembra-seeded-acl-fd-status.txt');
            const outputPath = path.join(process.env.RUNNER_TEMP, 'nembra-seeded-acl-fd-output.txt');
            const status = fs.existsSync(statusPath) ? fs.readFileSync(statusPath, 'utf8').trim() : 'missing';
            let output = fs.existsSync(outputPath) ? fs.readFileSync(outputPath, 'utf8') : 'classifier did not persist output';
            output = output.slice(-12000).replaceAll('```', '~~~');
            const body = [
              `NEMBRA_SEEDED_ACL_FD_RESTORE_DIAGNOSTIC exactHead=${process.env.EXACT_HEAD} exit=${status}`,
              '',
              '```text',
              output,
              '```',
              '',
              'Validation only. Production `_PrivateReadLease` unchanged. PHYSICAL NO-GO.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Reassert classifier result after durable diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/nembra-seeded-acl-fd-status.txt"
          test -f "$status_file"
          test "$(cat "$status_file")" = '0'

      - name: Preserve validation-only truth boundary
        if: always()
        shell: bash
        run: |
          echo 'NEMBRA_SEEDED_ACL_FD_RESTORE validationOnly=true productionLeaseChanged=false physicalAuthorityCreated=false'
          echo 'No install, device, Bluetooth, Tuya, DP, telemetry, command, or riding authority is created by this classifier.'
