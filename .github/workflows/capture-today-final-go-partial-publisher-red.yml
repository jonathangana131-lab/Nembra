name: Capture TODAY Final GO Partial Publisher Red

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_final_go_publication.py
      - scripts/ci/tests/test_es80_today_final_go_partial_publisher_red.py
      - .github/workflows/capture-today-final-go-partial-publisher-red.yml

permissions:
  contents: read

jobs:
  partial-publisher-regression:
    name: Require rollback after partial publisher success
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile publication module and regression
        run: |
          python3 -m py_compile scripts/ci/es80_today_final_go_publication.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_partial_publisher_red.py
      - name: Require failed invocation to retract linked GO destination
        run: python3 scripts/ci/tests/test_es80_today_final_go_partial_publisher_red.py -v
