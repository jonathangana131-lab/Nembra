name: Patch Home Metric Accessibility

on:
  push:
    branches:
      - feature/home-rebuild
    paths:
      - .github/workflows/patch-home-metric-accessibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-rebuild
          fetch-depth: 0
      - name: Add stable metric identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraApp/Features/Home/HomeView.swift')
          s = p.read_text()
          replacements = [
              ('''                    icon: batteryIcon,\n                    valueStyle: batteryValueStyle\n''', '''                    icon: batteryIcon,\n                    accessibilityIdentifier: "home.metric.battery",\n                    valueStyle: batteryValueStyle\n'''),
              ('''                    icon: "point.bottomleft.forward.to.point.topright.scurvepath",\n                    accessibilityTitle: "Scooter Trip"\n''', '''                    icon: "point.bottomleft.forward.to.point.topright.scurvepath",\n                    accessibilityTitle: "Scooter Trip",\n                    accessibilityIdentifier: "home.metric.trip"\n'''),
              ('''                    value: vehicle.state.rideMode?.displayName ?? "—",\n                    icon: "gauge.with.dots.needle.67percent"\n''', '''                    value: vehicle.state.rideMode?.displayName ?? "—",\n                    icon: "gauge.with.dots.needle.67percent",\n                    accessibilityIdentifier: "home.metric.mode"\n'''),
              ('''        icon: String,\n        accessibilityTitle: String? = nil,\n        valueStyle: Color = .primary\n''', '''        icon: String,\n        accessibilityTitle: String? = nil,\n        accessibilityIdentifier: String,\n        valueStyle: Color = .primary\n'''),
              ('''        .accessibilityLabel(accessibilityTitle ?? title)\n        .accessibilityValue(value)\n''', '''        .accessibilityLabel(accessibilityTitle ?? title)\n        .accessibilityValue(value)\n        .accessibilityIdentifier(accessibilityIdentifier)\n'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected HomeView pattern not found:\n{old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NembraApp/Features/Home/HomeView.swift
          git commit -m "fix: expose stable Home metric semantics"
          git push origin HEAD:feature/home-rebuild
