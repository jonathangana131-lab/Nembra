name: V14 Capture Tuya Lock Provenance Patch

on:
  push:
    branches:
      - agent/v14-capture-compiled-tuya-provenance-current-sol

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-compiled-tuya-provenance-current-sol
          fetch-depth: 0

      - name: Apply exact guarded product changes
        shell: python
        run: |
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guard failed {path}: expected 1, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def count_replace(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"guard failed {path}: expected {expected}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          installer = "scripts/field/install_one_time_capture.command"
          anchor = '[[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || die "Private workspace bootstrap changed tracked or unignored accepted-source inputs. Review and re-accept before building."\n\n'
          provenance_lines = [
              '# Bind the exact resolved private SDK dependency graph to the physical evidence',
              '# instrument. This SHA-256 is non-secret provenance; it does not self-authorize',
              '# software acceptance, but it prevents two different private Pod graphs from',
              '# masquerading as the same accepted field build.',
              'TUYA_LOCK_FILE="$ROOT/Podfile.lock"',
              'TUYA_PROVENANCE_FILE="$ROOT/LocalSecrets/TuyaRuntime/ResolvedTuyaDependencyProvenance.txt"',
              '[[ -f "$TUYA_LOCK_FILE" ]] || die "Tuya Podfile.lock is missing after bootstrap. Do not build an unauditable private dependency graph."',
              '[[ -f "$TUYA_PROVENANCE_FILE" ]] || die "Resolved Tuya dependency provenance is missing after bootstrap. Re-run private bootstrap."',
              'TUYA_LOCK_SHA256="$(shasum -a 256 "$TUYA_LOCK_FILE" | awk \'{print $1}\' | tr \'[:upper:]\' \'[:lower:]\')"',
              '[[ "$TUYA_LOCK_SHA256" =~ ^[0-9a-f]{64}$ ]] || die "Could not compute a valid full SHA-256 for Podfile.lock."',
              'RECORDED_TUYA_LOCK_SHA256="$(awk -F= \'$1 == "podfile_lock_sha256" {print $2}\' "$TUYA_PROVENANCE_FILE" | tail -n 1 | tr \'[:upper:]\' \'[:lower:]\')"',
              '[[ "$RECORDED_TUYA_LOCK_SHA256" =~ ^[0-9a-f]{64}$ ]] || die "Bootstrap provenance does not contain a valid full Podfile.lock SHA-256."',
              '[[ "$TUYA_LOCK_SHA256" == "$RECORDED_TUYA_LOCK_SHA256" ]] || die "Podfile.lock changed after private bootstrap provenance was recorded. Re-run bootstrap before installing."',
              'say "Resolved Tuya dependency fingerprint matched bootstrap custody record: $TUYA_LOCK_SHA256"',
              '',
          ]
          once(installer, anchor, anchor + '\n'.join(provenance_lines) + '\n')
          once(
              installer,
              '    "NEMBRA_CAPTURE_BUILD_IDENTIFIER=$BUILD_LABEL" \\\n    "NEMBRA_CAPTURE_BUILD_COMMIT_SHA=$SOURCE_SHA" \\\n    build',
              '    "NEMBRA_CAPTURE_BUILD_IDENTIFIER=$BUILD_LABEL" \\\n    "NEMBRA_CAPTURE_BUILD_COMMIT_SHA=$SOURCE_SHA" \\\n    "NEMBRA_CAPTURE_TUYA_PODFILE_LOCK_SHA256=$TUYA_LOCK_SHA256" \\\n    build',
          )

          project = "NembraCapture.xcodeproj/project.pbxproj"
          project_old = '\t\t\t\tINFOPLIST_KEY_NembraCaptureSourceCommitSHA = "$(NEMBRA_CAPTURE_BUILD_COMMIT_SHA)";\n'
          project_new = project_old + '\t\t\t\tINFOPLIST_KEY_NembraCaptureTuyaPodfileLockSHA256 = "$(NEMBRA_CAPTURE_TUYA_PODFILE_LOCK_SHA256)";\n'
          count_replace(project, project_old, project_new, 2)

          identity_lines = [
              'import Foundation',
              '',
              'struct NembraCaptureBuildIdentity: Codable, Equatable, Sendable {',
              '    static let buildIdentifierInfoKey = "NembraCaptureBuildIdentifier"',
              '    static let sourceCommitSHAInfoKey = "NembraCaptureSourceCommitSHA"',
              '    static let tuyaPodfileLockSHA256InfoKey = "NembraCaptureTuyaPodfileLockSHA256"',
              '',
              '    let buildIdentifier: String',
              '    let sourceCommitSHA: String',
              '    let tuyaPodfileLockSHA256: String',
              '',
              '    static var current: Self {',
              '        from(infoDictionary: Bundle.main.infoDictionary ?? [:])',
              '    }',
              '',
              '    static func from(infoDictionary: [String: Any]) -> Self {',
              '        Self(',
              '            buildIdentifier: (infoDictionary[buildIdentifierInfoKey] as? String) ?? "",',
              '            sourceCommitSHA: ((infoDictionary[sourceCommitSHAInfoKey] as? String) ?? "").lowercased(),',
              '            tuyaPodfileLockSHA256: ((infoDictionary[tuyaPodfileLockSHA256InfoKey] as? String) ?? "").lowercased()',
              '        )',
              '    }',
              '',
              '    var isAuthoritativeFieldBuild: Bool {',
              '        guard Self.isLowercaseHex(sourceCommitSHA, count: 40),',
              '              tuyaPodfileLockSHA256.count == 64,',
              '              Self.isLowercaseHex(tuyaPodfileLockSHA256, count: 64) else { return false }',
              '',
              '        let expectedIdentifier = "capture-v14-\\(sourceCommitSHA.prefix(12))"',
              '        return buildIdentifier == expectedIdentifier',
              '    }',
              '',
              '    var blocker: String? {',
              '        guard isAuthoritativeFieldBuild else {',
              '            return "This build has no valid exact source + Tuya dependency provenance. Install Capture through the repository field installer before physical evidence collection."',
              '        }',
              '        return nil',
              '    }',
              '',
              '    private static func isLowercaseHex(_ value: String, count: Int) -> Bool {',
              '        guard value.count == count else { return false }',
              '        return value.utf8.allSatisfy { byte in',
              '            (byte >= 48 && byte <= 57) || (byte >= 97 && byte <= 102)',
              '        }',
              '    }',
              '}',
              '',
          ]
          Path("NembraApp/App/NembraCaptureBuildIdentity.swift").write_text('\n'.join(identity_lines))

          entry = "NembraApp/App/NembraCaptureEntrypoint.swift"
          once(entry, '        let sourceCommitSHA: String\n        let tuyaDeviceID: String', '        let sourceCommitSHA: String\n        let tuyaPodfileLockSHA256: String\n        let tuyaDeviceID: String')
          once(entry, '            schemaVersion: 8,', '            schemaVersion: 9,')
          once(entry, '            sourceCommitSHA: buildIdentity.sourceCommitSHA,\n            tuyaDeviceID: deviceID,', '            sourceCommitSHA: buildIdentity.sourceCommitSHA,\n            tuyaPodfileLockSHA256: buildIdentity.tuyaPodfileLockSHA256,\n            tuyaDeviceID: deviceID,')
          once(entry, 'Sanitized diagnostics ready with exact compiled build provenance.', 'Sanitized diagnostics ready with exact compiled source + Tuya dependency provenance.')

          workflow = ".github/workflows/capture-field-build-provenance.yml"
          once(workflow, '      - NembraApp/App/NembraCaptureBuildIdentity.swift\n      - NembraCapture.xcodeproj/project.pbxproj', '      - NembraApp/App/NembraCaptureBuildIdentity.swift\n      - NembraApp/App/NembraCaptureEntrypoint.swift\n      - NembraCapture.xcodeproj/project.pbxproj')
          once(workflow, "          identity='NembraApp/App/NembraCaptureBuildIdentity.swift'\n          project='NembraCapture.xcodeproj/project.pbxproj'", "          identity='NembraApp/App/NembraCaptureBuildIdentity.swift'\n          entrypoint='NembraApp/App/NembraCaptureEntrypoint.swift'\n          project='NembraCapture.xcodeproj/project.pbxproj'")
          once(workflow, "          grep -Fq 'NEMBRA_CAPTURE_BUILD_COMMIT_SHA=\"$SOURCE_SHA\"' \"$installer\"\n", "          grep -Fq 'NEMBRA_CAPTURE_BUILD_COMMIT_SHA=\"$SOURCE_SHA\"' \"$installer\"\n          grep -Fq 'ResolvedTuyaDependencyProvenance.txt' \"$installer\"\n          grep -Fq 'podfile_lock_sha256' \"$installer\"\n          grep -Fq 'NEMBRA_CAPTURE_TUYA_PODFILE_LOCK_SHA256=\"$TUYA_LOCK_SHA256\"' \"$installer\"\n")
          once(workflow, "          grep -Fq 'INFOPLIST_KEY_NembraCaptureSourceCommitSHA = \"$(NEMBRA_CAPTURE_BUILD_COMMIT_SHA)\";' \"$project\"\n", "          grep -Fq 'INFOPLIST_KEY_NembraCaptureSourceCommitSHA = \"$(NEMBRA_CAPTURE_BUILD_COMMIT_SHA)\";' \"$project\"\n          grep -Fq 'INFOPLIST_KEY_NembraCaptureTuyaPodfileLockSHA256 = \"$(NEMBRA_CAPTURE_TUYA_PODFILE_LOCK_SHA256)\";' \"$project\"\n")
          once(workflow, "          grep -Fq 'static let sourceCommitSHAInfoKey = \"NembraCaptureSourceCommitSHA\"' \"$identity\"\n          grep -Fq 'sourceCommitSHA.count == 40' \"$identity\"\n", "          grep -Fq 'static let sourceCommitSHAInfoKey = \"NembraCaptureSourceCommitSHA\"' \"$identity\"\n          grep -Fq 'static let tuyaPodfileLockSHA256InfoKey = \"NembraCaptureTuyaPodfileLockSHA256\"' \"$identity\"\n          grep -Fq 'tuyaPodfileLockSHA256.count == 64' \"$identity\"\n")
          once(workflow, "          grep -Fq 'let expectedIdentifier = \"capture-v14-\\(sourceCommitSHA.prefix(12))\"' \"$identity\"\n", "          grep -Fq 'let expectedIdentifier = \"capture-v14-\\(sourceCommitSHA.prefix(12))\"' \"$identity\"\n          grep -Fq 'let tuyaPodfileLockSHA256: String' \"$entrypoint\"\n          grep -Fq 'tuyaPodfileLockSHA256: buildIdentity.tuyaPodfileLockSHA256' \"$entrypoint\"\n          grep -Fq 'schemaVersion: 9' \"$entrypoint\"\n")
          once(workflow, "          label='capture-v14-0123456789ab'\n", "          label='capture-v14-0123456789ab'\n          lock_sha='abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'\n")
          once(workflow, '            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$sha" \\\n            build', '            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$sha" \\\n            NEMBRA_CAPTURE_TUYA_PODFILE_LOCK_SHA256="$lock_sha" \\\n            build')
          once(workflow, '          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$sha"', '          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$sha"\n          test "$(plutil -extract NembraCaptureTuyaPodfileLockSHA256 raw -o - "$plist")" = "$lock_sha"')

      - name: Validate resulting source
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          grep -Fq 'NEMBRA_CAPTURE_TUYA_PODFILE_LOCK_SHA256="$TUYA_LOCK_SHA256"' scripts/field/install_one_time_capture.command
          grep -Fq 'tuyaPodfileLockSHA256.count == 64' NembraApp/App/NembraCaptureBuildIdentity.swift
          grep -Fq 'schemaVersion: 9' NembraApp/App/NembraCaptureEntrypoint.swift
          test "$(grep -Fc 'INFOPLIST_KEY_NembraCaptureTuyaPodfileLockSHA256' NembraCapture.xcodeproj/project.pbxproj)" = 2
          git diff --check

      - name: Commit product repair and remove patch runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-tuya-lock-provenance-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): bind Tuya dependency graph to field provenance'
          git push origin HEAD:agent/v14-capture-compiled-tuya-provenance-current-sol
