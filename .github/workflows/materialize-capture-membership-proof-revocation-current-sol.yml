name: Materialize Capture Membership Proof Revocation

on:
  push:
    branches:
      - "repair/v14-capture-membership-proof-revocation-current-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current-product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='52333deb09ea9a5964250097f83884d285f25d78'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-membership-proof-revocation-current-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipProofRevocationSourceTests.swift'

      - name: Revoke prior-view positive membership proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          marker = '''        acceptsViewScopedMembershipRequests = false
          membershipRequestID = UUID()
          '''
          if source.count(marker) != 1:
              raise SystemExit(f'expected one view-exit membership marker, found {source.count(marker)}')
          replacement = '''        acceptsViewScopedMembershipRequests = false
          sdkDeviceMembershipVerified = false
          membershipAccountUID = nil
          membershipDeviceID = nil
          membershipRequestID = UUID()
          '''
          source = source.replace(marker, replacement, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify fail-closed lifecycle ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('func abandonCorrelationForViewExit()')
          end = s.index('var privateConfig: Bool', start)
          cleanup = s[start:end]

          required = (
              'acceptsViewScopedMembershipRequests = false',
              'sdkDeviceMembershipVerified = false',
              'membershipAccountUID = nil',
              'membershipDeviceID = nil',
              'membershipRequestID = UUID()',
              'officialConnectionRequestID = UUID()',
              'if let token = currentConnectionToken',
              'invalidateInternalLifecycle(',
          )
          for token in required:
              assert token in cleanup, token

          close = cleanup.index('acceptsViewScopedMembershipRequests = false')
          clear_verified = cleanup.index('sdkDeviceMembershipVerified = false')
          clear_account = cleanup.index('membershipAccountUID = nil')
          clear_device = cleanup.index('membershipDeviceID = nil')
          revoke_membership = cleanup.index('membershipRequestID = UUID()')
          revoke_official = cleanup.index('officialConnectionRequestID = UUID()')
          inspect_transport = cleanup.index('if let token = currentConnectionToken')

          assert close < clear_verified < revoke_membership
          assert close < clear_account < revoke_membership
          assert close < clear_device < revoke_membership
          assert revoke_membership < revoke_official < inspect_transport
          assert 'Task { @MainActor [self] in' in cleanup
          assert 'test.activateMembershipRequestsForView()' in s
          assert 'test.verifySDKMembership()' in s

          for forbidden in (
              'disconnectBLE', 'endConnection', 'recordObservedTransportLoss',
              'publishDps', 'queryDps', 'writeValue', 'writeWithoutResponse',
          ):
              assert forbidden not in cleanup, forbidden

          print('Capture membership proof revocation source contract: PASS')
          PY
          git diff --check

      - name: Collapse helper into clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          parent='52333deb09ea9a5964250097f83884d285f25d78'
          rm .github/workflows/materialize-capture-membership-proof-revocation-current-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipProofRevocationSourceTests.swift
          git add -u .github/workflows/materialize-capture-membership-proof-revocation-current-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' \
            commit -m 'fix(capture): revoke membership proof on view exit'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipProofRevocationSourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:repair/v14-capture-membership-proof-revocation-current-sol
