name: Materialize Capture Event Custody Reentrancy BA3

on:
  push:
    branches:
      - "repair/v14-capture-event-custody-reentrancy-ba3-sol"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-event-custody-reentrancy-ba3-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyReentrancySourceTests.swift'

      - name: Freeze privacy custody before accepted ledger suspension
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          receiver_start = source.index('    private func receivedApplicationUpdate(')
          helper_start = source.index('    private func redactedApplicationEventDetails(', receiver_start)
          receiver = source[receiver_start:helper_start]

          admission = '        applicationUpdateAdmissionsInFlight += 1\n        defer { applicationUpdateAdmissionsInFlight -= 1 }\n'
          if receiver.count(admission) != 1:
              raise SystemExit('application update admission point changed or is ambiguous')
          custody_lines = [
              '        guard let custodySafeUpdate = redactedApplicationEventDetails(update) else {',
              '            await invalidateSourceAuthority(',
              '                token: token,',
              '                message: "Verified Tuya account identity became unavailable before application evidence could enter immutable custody.",',
              '                kind: "sdk_account_uid_custody_unavailable"',
              '            )',
              '            return',
              '        }',
              '',
          ]
          custody = '\n'.join(custody_lines) + '\n'
          receiver = receiver.replace(admission, custody + admission, 1)

          old_event = '            var eventDetails = redactedApplicationEventDetails(update)\n'
          new_event = '            var eventDetails = custodySafeUpdate\n'
          if receiver.count(old_event) != 1:
              raise SystemExit('post-await event redaction call changed or is ambiguous')
          receiver = receiver.replace(old_event, new_event, 1)
          source = source[:receiver_start] + receiver + source[helper_start:]

          helper_start = source.index('    private func redactedApplicationEventDetails(')
          helper_end = source.index('    private func startWatchdog', helper_start)
          helper_lines = [
              '    private func redactedApplicationEventDetails(_ update: [String: String]) -> [String: String]? {',
              '        guard let accountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),',
              '              !accountUID.isEmpty else { return nil }',
              '',
              '        var redacted: [String: String] = [:]',
              '        redacted.reserveCapacity(update.count)',
              '        for key in update.keys.sorted() {',
              '            guard let value = update[key] else { continue }',
              '            let redactedKey = key.replacingOccurrences(',
              '                of: accountUID,',
              '                with: "<redacted-account-uid>",',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '            let redactedValue = value.replacingOccurrences(',
              '                of: accountUID,',
              '                with: "<redacted-account-uid>",',
              '                options: [.caseInsensitive, .literal]',
              '            )',
              '',
              '            var uniqueKey = redactedKey',
              '            var collisionSuffix = 2',
              '            while redacted[uniqueKey] != nil {',
              '                uniqueKey = "\\(redactedKey)#\\(collisionSuffix)"',
              '                collisionSuffix += 1',
              '            }',
              '            redacted[uniqueKey] = redactedValue',
              '        }',
              '        return redacted',
              '    }',
              '',
          ]
          helper = '\n'.join(helper_lines) + '\n'
          source = source[:helper_start] + helper + source[helper_end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify adversarial custody contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          receiver_start = s.index('private func receivedApplicationUpdate(')
          helper_start = s.index('private func redactedApplicationEventDetails(', receiver_start)
          watchdog = s.index('private func startWatchdog', helper_start)
          receiver = s[receiver_start:helper_start]
          helper = s[helper_start:watchdog]
          custody = receiver.index('guard let custodySafeUpdate = redactedApplicationEventDetails(update)')
          ledger = receiver.index('try await sessionLedger.recordApplicationUpdate')
          refresh = receiver.index('await refreshLedgerSnapshot()')
          event = receiver.index('var eventDetails = custodySafeUpdate')
          log = receiver.index('log("tuya_application_update", eventDetails)')
          assert custody < ledger
          assert custody < refresh
          assert ledger < event < log
          assert 'var eventDetails = redactedApplicationEventDetails(update)' not in receiver
          assert 'sdk_account_uid_custody_unavailable' in receiver
          assert '-> [String: String]?' in helper
          assert '!accountUID.isEmpty else { return nil }' in helper
          assert 'return update' not in helper
          assert 'for key in update.keys.sorted()' in helper
          assert 'while redacted[uniqueKey] != nil' in helper
          assert 'uniqueKey = "\\(redactedKey)#\\(collisionSuffix)"' in helper
          assert '<redacted-account-uid>' in helper
          for block in (receiver, helper):
              for forbidden in ('queryDps','publishDps','writeValue','writeWithoutResponse','disconnectBLE','endConnection('):
                  assert forbidden not in block, forbidden
          print('Capture event custody reentrancy contract: PASS')
          PY
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyReentrancySourceTests.swift
          git diff --check

      - name: Collapse materializer into clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          parent='ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          rm .github/workflows/materialize-capture-event-custody-reentrancy-ba3-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git add -u .github/workflows/materialize-capture-event-custody-reentrancy-ba3-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): freeze account UID custody before ledger await'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyReentrancySourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:repair/v14-capture-event-custody-reentrancy-ba3-sol
