name: Reconcile ES80 passive integration with current main

on:
  push:
    branches:
      - parallel/recover-es80-passive-integration/chat-c7r4m

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration product
        uses: actions/checkout@v6
        with:
          fetch-depth: 12

      - name: Verify exact pre-reconcile product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=35ff612cd8b43e655db3ae9244d8650aadd9db2c
          WORKFLOW=.github/workflows/reconcile-es80-passive-integration-chat-c7r4m.yml
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git diff --name-only "$PRODUCT" HEAD)" = "$WORKFLOW"

      - name: Merge exact current main without stale overwrite
        shell: bash
        run: |
          set -euo pipefail
          MAIN=e07d6c72e4117370c76f084f446bdf55ee515a1d
          WORKFLOW=.github/workflows/reconcile-es80-passive-integration-chat-c7r4m.yml

          git fetch --no-tags origin "$MAIN"
          git config user.name "nembra-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-commit --no-ff "$MAIN"
          git rm "$WORKFLOW"

          # Current-main product must remain present exactly; only the accepted passive slice may differ.
          test "$(git hash-object Packages/NembraCore/Sources/NembraCore/RideAverageSpeedStatistics.swift)" = "$(git rev-parse "$MAIN:Packages/NembraCore/Sources/NembraCore/RideAverageSpeedStatistics.swift")"
          test "$(git hash-object Packages/NembraCore/Tests/NembraCoreTests/RideAverageSpeedStatisticsTests.swift)" = "$(git rev-parse "$MAIN:Packages/NembraCore/Tests/NembraCoreTests/RideAverageSpeedStatisticsTests.swift")"

          git diff --check "$MAIN"
          test "$(git diff --name-only "$MAIN" | wc -l | tr -d ' ')" = 44
          test -z "$(git diff --name-only "$MAIN" -- .github/workflows NembraApp NembraAppTests NembraUITests)"

          while IFS=$'\t' read -r status path rest; do
            case "$path" in
              Packages/NembraBluetoothCapture/*)
                test "$status" = A
                ;;
              Packages/NembraCore/Package.swift)
                test "$status" = M
                ;;
              Packages/NembraCore/Sources/NembraCore/PassiveBluetoothCapture.swift|\
              Packages/NembraCore/Tests/NembraCoreTests/PassiveBluetoothCaptureTests.swift|\
              docs/ES80_COREBLUETOOTH_CAPTURE_ADAPTER.md|\
              docs/ES80_PHYSICAL_CAPTURE_RUNBOOK.md|\
              docs/ES80_PROTOCOL_CAPTURE.md)
                test "$status" = A
                ;;
              *)
                echo "Unexpected reconciled integration path: $status $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-status "$MAIN")

          test "$(git diff --numstat "$MAIN" -- Packages/NembraCore/Package.swift)" = $'4\t0\tPackages/NembraCore/Package.swift'
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 capture integration must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

          git commit -m "[recover es80 passive integration] Reconcile current main"
          git push origin "HEAD:${GITHUB_REF_NAME}"
