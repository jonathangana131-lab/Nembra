name: Capture Whole-Source Compiler Window Current Red Team

on:
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_whole_source_compiler_window_current.py
      - .github/workflows/capture-whole-source-compiler-window-current-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exploit-positive-current-source-window:
    name: Prove current field-owned source window remains mutable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind evidence to exact checked-out source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'Exact whole-source diagnostic head: %s\n' "$actual"

      - name: Reproduce endpoint-equality source-consumption gap
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-whole-source-red-team-pycache"
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_whole_source_compiler_window_current.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_whole_source_compiler_window_current.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Classify product status
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'EXPLOIT-POSITIVE SUCCESS: current Capture production remains RED for whole-source compiler-window custody.' \
            'This workflow does not authorize install, device access, Bluetooth, Tuya traffic, telemetry, commands, or physical ES80 work.'
