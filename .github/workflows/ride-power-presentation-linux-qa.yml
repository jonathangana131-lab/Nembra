name: Ride Power Presentation Linux QA

on:
  push:
    branches:
      - 'qa/ride-power-presentation-linux/chat-h4n7q'

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify product ancestor and unchanged core tree
        env:
          PRODUCT_HEAD: 8059b1c7a3b7cf8b186d50c31718c2d8dab0e5b6
        run: |
          git merge-base --is-ancestor "$PRODUCT_HEAD" HEAD
          git diff --exit-code "$PRODUCT_HEAD" HEAD -- \
            Packages/NembraCore/Sources/NembraCore \
            Packages/NembraCore/Tests/NembraCoreTests
      - name: Swift toolchain
        run: swift --version
      - name: NembraCore tests
        run: swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors
