name: chat-k4m7v reconcile #440 dd107

on:
  push:
    branches:
      - 'parallel/es80-preh-observation-abort/chat-k4m7v'
    paths:
      - '.github/workflows/chat-k4m7v-reconcile-dd107.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-preh-observation-abort/chat-k4m7v
          fetch-depth: 0
      - name: Merge exact canonical #440 only
        shell: bash
        env:
          EXPECTED_PARENT_SHA: dd1075243c68b013f2e499902a0a1fb5836c2870
        run: |
          set -euo pipefail
          git config user.name 'nembra-chat-k4m7v'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin parallel/es80-boundary-transaction-composition/chat-k4v7p
          parent="$(git rev-parse FETCH_HEAD)"
          printf 'Expected #440: %s\nFetched #440:  %s\n' "$EXPECTED_PARENT_SHA" "$parent"
          test "$parent" = "$EXPECTED_PARENT_SHA"

          set +e
          git merge --no-commit --no-ff "$parent"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'Conflicts:\n%s\n' "$conflicts"
            while IFS= read -r path; do
              case "$path" in
                Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryTransactionDecisionTests.swift)
                  git checkout "$parent" -- "$path"
                  git add "$path"
                  ;;
                '') ;;
                *)
                  echo "Unexpected canonical conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'chore: reconcile pre-H recovery onto exact #440 one-shot head'
          git rm .github/workflows/chat-k4m7v-reconcile-dd107.yml
          git commit -m 'chore: remove canonical reconciliation workflow'
          git push origin HEAD:parallel/es80-preh-observation-abort/chat-k4m7v
