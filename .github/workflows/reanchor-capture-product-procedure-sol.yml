name: Reanchor Capture product procedure sol

on:
  push:
    branches:
      - reanchor/v14-capture-product-onto-procedure-sol

permissions:
  contents: write

jobs:
  reanchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reanchor/v14-capture-product-onto-procedure-sol
          fetch-depth: 0
      - name: Diagnose exact merge
        shell: bash
        run: |
          set -u
          truth='8b9c1cabeeffdec7cb12f9a74f53320c11e7eae0'
          product_parent='d5915a97c1359846b103f08602db78eac815a47f'
          echo "::notice title=reanchor-head::HEAD=$(git rev-parse HEAD) parent=$(git rev-parse HEAD^) mergeBase=$(git merge-base "$product_parent" HEAD)"
          git fetch origin 'refs/heads/integration/v14-capture-final-stationary-convergence-sol:refs/remotes/origin/integration/v14-capture-final-stationary-convergence-sol'
          echo "::notice title=reanchor-truth::remote=$(git rev-parse refs/remotes/origin/integration/v14-capture-final-stationary-convergence-sol) expected=$truth"
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git merge --no-commit --no-ff "$truth"
          status=$?
          unresolved="$(git diff --name-only --diff-filter=U | tr '\n' '|')"
          echo "::notice title=reanchor-merge::status=$status unresolved=$unresolved"
          git merge --abort >/dev/null 2>&1 || true
          exit 0
