name: V14 Capture Auth Promotion Materializer

on:
  push:
    branches:
      - repair/v14-capture-auth-promotion-a7a-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: repair/v14-capture-auth-promotion-a7a-sol
      - name: Materialize exact-current repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = 'a7a28ca6e744d4bad8be08fd3553a2af8c609b15'
          python3 tools/v14_auth_promotion_materialize.py
          git fetch --no-tags origin refs/pull/2433/head:refs/remotes/origin/red-2433
          TEST_PATH='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationPromotionReentrancySourceTests.swift'
          git show origin/red-2433:"$TEST_PATH" > "$TEST_PATH"
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse "$TEST_PATH"
          git add NembraApp/App/NembraCaptureEntrypoint.swift "$TEST_PATH"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '2'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx 'NembraApp/App/NembraCaptureEntrypoint.swift'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST_PATH"
          test -z "$(git status --short | grep '^??' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-auth-promotion-materializer.yml tools/v14_auth_promotion_materialize.py
          git commit -m 'fix(capture): fence auth promotion after suspension'
          git push origin HEAD:repair/v14-capture-auth-promotion-a7a-sol
