name: Instrument Capture r2 truth filters

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Instrument Capture r2 truth filters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/current-main-tuya-readonly-convergence-gpt56
          fetch-depth: 0
      - name: Make truth failures individually visible
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/capture-app-truth-repair-r2.yml')
          s = p.read_text()
          start_marker = '      - name: Run focused truth contracts\n'
          end_marker = '      - name: Publish coherent canonical repair\n'
          if s.count(start_marker) != 1 or s.count(end_marker) != 1:
              raise SystemExit('r2 truth-step anchors are not unique')
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = '''      - name: Run focused truth contracts\n        shell: bash\n        working-directory: Packages/NembraBluetoothCapture\n        run: |\n          set -uo pipefail\n          failed=0\n          for filter in \\\n            TuyaAuthenticatedReadOnlySessionLedgerTests \\\n            TuyaAuthenticatedTerminalHorizonTests \\\n            TuyaAuthenticatedReadOnlyHorizonTests \\\n            TuyaAuthenticatedReadOnlyHorizonTestsAppIntegration \\\n            TuyaAppIncompleteHorizonTerminalSourceTests \\\n            TuyaAlreadyTerminalObservationContinuitySourceTests \\\n            TuyaDeviceSharingAuthenticationAuthorityTests\n          do\n            if swift test --filter "$filter"; then\n              echo "::notice title=Capture truth filter passed::$filter"\n            else\n              echo "::error title=Capture truth filter failed::$filter"\n              failed=1\n            fi\n          done\n          exit "$failed"\n\n'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          rm .github/workflows/capture-r2-diagnostic-patch.yml
          git diff --check
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'GO apply canonical Capture app truth repairs r2'
          git push origin HEAD:capture/current-main-tuya-readonly-convergence-gpt56
