name: chat-g5t8m recorded Horizon recovery patch
on:
  push:
    branches: ['parallel/es80-recorded-horizon-recovery/chat-g5t8m']
    paths: ['.github/workflows/chat-g5t8m-recorded-horizon-recovery.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-recorded-horizon-recovery/chat-g5t8m
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          transaction = 'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift'
          replace_one(
              transaction,
              '''    struct RecordedHorizonBoundary: Equatable, Sendable {\n        private let decision: PassiveCoreBluetoothObservationBoundaryDecision\n        private let transaction: PassiveCoreBluetoothObservationBoundaryQueueGate.Transaction\n        private let authorityFence: PassiveCoreBluetoothArtifactAuthorityFence\n\n        var queueCutoff: UInt64 { decision.queueCutoff }\n        var authority: PassiveCoreBluetoothArtifactAuthorityContext { decision.authority }\n        var observedAtUptimeNanoseconds: UInt64 { decision.observedAtUptimeNanoseconds }\n        var observedAtDate: Date { decision.observedAtDate }\n''',
              '''    struct RecordedHorizonBoundary: Equatable, Sendable {\n        private let decision: PassiveCoreBluetoothObservationBoundaryDecision\n        private let transaction: PassiveCoreBluetoothObservationBoundaryQueueGate.Transaction\n        private let authorityFence: PassiveCoreBluetoothArtifactAuthorityFence\n\n        var queueCutoff: UInt64 { decision.queueCutoff }\n        var authority: PassiveCoreBluetoothArtifactAuthorityContext { decision.authority }\n        var observedAtUptimeNanoseconds: UInt64 { decision.observedAtUptimeNanoseconds }\n        var observedAtDate: Date { decision.observedAtDate }\n        var transactionRevision: UInt64 { transaction.revision }\n        var transactionIdentity: UUID { transaction.identity }\n'''
          )

          gate = 'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift'
          replace_one(
              gate,
              '''        enum Origin: Equatable, Sendable {\n            case uncommittedReadyRejectedBeforeRecorderMutation\n            case recordedReadyInvalidatedBeforeGateCommit\n            case committedReadyInvalidated\n        }\n''',
              '''        enum Origin: Equatable, Sendable {\n            case uncommittedReadyRejectedBeforeRecorderMutation\n            case recordedReadyInvalidatedBeforeGateCommit\n            case committedReadyInvalidated\n            case recordedHorizonInvalidatedBeforeGateCommit\n        }\n'''
          )
          replace_one(
              gate,
              '''        let abandonedReadyTransactionIdentity: UUID\n        let abandonedTargetSessionGeneration: UInt64\n        let origin: Origin\n\n        fileprivate init(\n            abandonedReadyTransaction: Transaction,\n            origin: Origin\n        ) {\n            abandonedReadyAuthority = abandonedReadyTransaction.authority\n            abandonedReadyQueueCutoff = abandonedReadyTransaction.queueCutoff\n            abandonedReadyTransactionRevision = abandonedReadyTransaction.revision\n            abandonedReadyTransactionIdentity = abandonedReadyTransaction.identity\n            abandonedTargetSessionGeneration = abandonedReadyTransaction.authority.targetSessionGeneration\n            self.origin = origin\n        }\n''',
              '''        let abandonedReadyTransactionIdentity: UUID\n        let abandonedTargetSessionGeneration: UInt64\n        let abandonedHorizonQueueCutoff: UInt64?\n        let abandonedHorizonTransactionRevision: UInt64?\n        let abandonedHorizonTransactionIdentity: UUID?\n        let origin: Origin\n\n        /// The furthest queue prefix that has already participated in durable lifecycle\n        /// evidence for this abandoned epoch. A recorded-but-uncommitted Horizon extends\n        /// this through H; Ready-only aborts stop at the Ready cutoff.\n        var abandonedEvidenceQueueCutoff: UInt64 {\n            abandonedHorizonQueueCutoff ?? abandonedReadyQueueCutoff\n        }\n\n        fileprivate init(\n            abandonedReadyTransaction: Transaction,\n            origin: Origin,\n            abandonedHorizonTransaction: Transaction? = nil\n        ) {\n            abandonedReadyAuthority = abandonedReadyTransaction.authority\n            abandonedReadyQueueCutoff = abandonedReadyTransaction.queueCutoff\n            abandonedReadyTransactionRevision = abandonedReadyTransaction.revision\n            abandonedReadyTransactionIdentity = abandonedReadyTransaction.identity\n            abandonedTargetSessionGeneration = abandonedReadyTransaction.authority.targetSessionGeneration\n            abandonedHorizonQueueCutoff = abandonedHorizonTransaction?.queueCutoff\n            abandonedHorizonTransactionRevision = abandonedHorizonTransaction?.revision\n            abandonedHorizonTransactionIdentity = abandonedHorizonTransaction?.identity\n            self.origin = origin\n        }\n'''
          )
          replace_one(
              gate,
              '''    /// Abort quarantine is intentionally irreversible in this slice. Raw FIFO\n    /// retirement alone cannot reopen lifecycle admission because retired positions\n''',
              '''    /// Covers the distinct partial state where the Horizon recorder append\n    /// succeeded but its exact queue transaction did not commit. The durable Horizon\n    /// marker is preserved as historical incomplete evidence; it is never promoted to\n    /// terminal/frozen authority. Exact producer identity is required before the whole\n    /// observation epoch can enter abort quarantine.\n    @discardableResult\n    mutating func abortRecordedHorizonBeforeGateCommit(\n        _ recordedHorizon: PassiveCoreBluetoothObservationBoundaryTransactionDecision.RecordedHorizonBoundary\n    ) throws -> ObservationEpochAbortReceipt {\n        guard case let .drainingHorizon(currentHorizon) = phase,\n              let ready = committedReadyTransaction else {\n            throw StateError.invalidTransition\n        }\n        guard currentHorizon.authority == recordedHorizon.authority,\n              currentHorizon.queueCutoff == recordedHorizon.queueCutoff,\n              currentHorizon.revision == recordedHorizon.transactionRevision,\n              currentHorizon.identity == recordedHorizon.transactionIdentity else {\n            throw StateError.staleTransaction\n        }\n        let receipt = ObservationEpochAbortReceipt(\n            abandonedReadyTransaction: ready,\n            origin: .recordedHorizonInvalidatedBeforeGateCommit,\n            abandonedHorizonTransaction: currentHorizon\n        )\n        committedReadyTransaction = nil\n        phase = .abortQuarantined(receipt)\n        return receipt\n    }\n\n    /// Abort quarantine is intentionally irreversible in this slice. Raw FIFO\n    /// retirement alone cannot reopen lifecycle admission because retired positions\n'''
          )

          retirement = 'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothAbortedObservationQueueRetirement.swift'
          replace_one(
              retirement,
              '''/// Synchronous MainActor retirement of queued evidence after a pre-H Ready\n/// attempt/epoch has been intentionally abandoned.\n''',
              '''/// Synchronous MainActor retirement of queued evidence after a pre-terminal\n/// observation epoch has been intentionally abandoned.\n'''
          )
          replace_one(
              retirement,
              '''        guard currentSettledQueueSequence >= abortReceipt.abandonedReadyQueueCutoff else {\n            throw StateError.readyPrefixNotSettled(\n                settled: currentSettledQueueSequence,\n                readyCutoff: abortReceipt.abandonedReadyQueueCutoff\n            )\n        }\n\n        var previousSequence = currentSettledQueueSequence\n''',
              '''        let abandonedEvidenceCutoff = abortReceipt.abandonedEvidenceQueueCutoff\n        guard currentSettledQueueSequence >= abandonedEvidenceCutoff else {\n            throw StateError.readyPrefixNotSettled(\n                settled: currentSettledQueueSequence,\n                readyCutoff: abandonedEvidenceCutoff\n            )\n        }\n\n        var previousSequence = currentSettledQueueSequence\n'''
          )
          replace_one(
              retirement,
              '''            guard evidence.queueSequence > abortReceipt.abandonedReadyQueueCutoff else {\n                throw StateError.readyPrefixStillPending(\n                    queueSequence: evidence.queueSequence,\n                    readyCutoff: abortReceipt.abandonedReadyQueueCutoff\n                )\n            }\n''',
              '''            guard evidence.queueSequence > abandonedEvidenceCutoff else {\n                throw StateError.readyPrefixStillPending(\n                    queueSequence: evidence.queueSequence,\n                    readyCutoff: abandonedEvidenceCutoff\n                )\n            }\n'''
          )

          tests = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothPreHObservationRecoveryTests.swift'
          p = Path(tests)
          s = p.read_text()
          start = s.index('''    @Test("committed Ready abort preserves exact identity and reopens only for bound fresh session")''')
          end = s.index('''    @Test("canonical fence rejection proves zero Ready mutation and consumes one-shot admission")''', start)
          replacement = '''    @Test("committed Ready abort stays quarantined after raw retirement until resolved chronology is integrated")\n    @MainActor\n    func committedReadyAbortDoesNotPrematurelyReopen() async throws {\n        var gate = PassiveCoreBluetoothObservationBoundaryQueueGate()\n        let fixture = try await committedReady(gate: &gate)\n        let abort = try gate.abortObservationEpoch(fixture.epoch)\n\n        #expect(abort.origin == .committedReadyInvalidated)\n        #expect(abort.abandonedReadyQueueCutoff == fixture.epoch.queueCutoff)\n        #expect(abort.abandonedReadyTransactionRevision == fixture.epoch.transactionRevision)\n        #expect(abort.abandonedReadyTransactionIdentity == fixture.epoch.transactionIdentity)\n        #expect(abort.abandonedHorizonQueueCutoff == nil)\n        #expect(abort.abandonedEvidenceQueueCutoff == fixture.epoch.queueCutoff)\n        #expect(gate.phase == .abortQuarantined(abort))\n        #expect(gate.permittedDrainUpperBound(firstPending: 3, pendingTail: 3) == nil)\n        #expect(!gate.resetForNewCaptureSession())\n\n        var pending = [\n            PendingEvent(\n                queueSequence: 3,\n                authority: .init(\n                    targetSessionGeneration: authority.targetSessionGeneration,\n                    authorityGeneration: authority.authorityGeneration + 1\n                )\n            )\n        ]\n        let retirement = try PassiveCoreBluetoothAbortedObservationQueueRetirement.retire(\n            from: &pending,\n            currentLastEnqueuedEventSequence: 3,\n            currentSettledQueueSequence: 2,\n            drainIsIdle: true,\n            abortedGate: gate,\n            identity: { .init(queueSequence: $0.queueSequence, authority: $0.authority) }\n        )\n        #expect(pending.isEmpty)\n        #expect(retirement.abortReceipt == abort)\n        #expect(gate.phase == .abortQuarantined(abort))\n        #expect(!gate.resetForNewCaptureSession())\n\n        #expect(throws: PassiveCoreBluetoothObservationBoundaryQueueGate.StateError.invalidTransition) {\n            _ = try gate.begin(\n                .finiteAcquisitionReady,\n                through: 4,\n                authority: .init(targetSessionGeneration: 8, authorityGeneration: 1)\n            )\n        }\n    }\n\n'''
          p.write_text(s[:start] + replacement + s[end:])

          horizon_tests = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothRecordedHorizonRecoveryTests.swift')
          if horizon_tests.exists():
              raise SystemExit(f'{horizon_tests} already exists')
          horizon_tests.write_text(r'''import Foundation
import NembraCore
import Testing
@testable import NembraBluetoothCapture

@Suite("Passive CoreBluetooth recorded Horizon recovery")
struct PassiveCoreBluetoothRecordedHorizonRecoveryTests {
    private struct PendingEvent: Equatable {
        let queueSequence: UInt64
        let authority: PassiveCoreBluetoothArtifactAuthorityContext
    }

    private let authority = PassiveCoreBluetoothArtifactAuthorityContext(
        targetSessionGeneration: 7,
        authorityGeneration: 11
    )

    private let es80 = VehicleIdentity(
        manufacturer: "AOVOPRO",
        model: "ES80",
        displayName: "AOVOPRO ES80",
        protocolFamily: "Tuya / AOVOPRO (hardware validation pending)"
    )

    @MainActor
    private func readyAndHorizon(
        gate: inout PassiveCoreBluetoothObservationBoundaryQueueGate,
        fence: PassiveCoreBluetoothArtifactAuthorityFence,
        recorder: PassiveCoreBluetoothCaptureRecorder,
        readyCutoff: UInt64 = 2,
        horizonCutoff: UInt64 = 4
    ) async throws -> (
        epoch: PassiveCoreBluetoothObservationBoundaryTransactionDecision.CommittedReadyEpoch,
        admission: PassiveCoreBluetoothObservationBoundaryTransactionDecision.HorizonAdmission,
        recorded: PassiveCoreBluetoothObservationBoundaryTransactionDecision.RecordedHorizonBoundary
    ) {
        let ready = try PassiveCoreBluetoothObservationBoundaryTransactionDecision.beginReady(
            queueCutoff: readyCutoff,
            processedThrough: readyCutoff,
            authorityFence: fence,
            gate: &gate
        )
        let recordedReady = try await ready.recordBoundary(on: recorder)
        let epoch = try recordedReady.markBoundaryRecorded(
            on: &gate,
            lastProcessedQueueSequence: readyCutoff
        )
        let admission = try epoch.beginHorizon(
            queueCutoff: horizonCutoff,
            processedThrough: readyCutoff,
            gate: &gate
        )
        let recorded = try await admission.recordBoundary(on: recorder)
        return (epoch, admission, recorded)
    }

    @Test("durable Horizon plus failed queue commit quarantines exact epoch without fabricating terminal freeze")
    @MainActor
    func recordedHorizonCommitFailureQuarantinesIncompleteEpoch() async throws {
        let recorder = try PassiveCoreBluetoothCaptureRecorder(
            vehicleIdentity: es80,
            startedAt: Date(timeIntervalSince1970: 1)
        )
        let fence = PassiveCoreBluetoothArtifactAuthorityFence(authority: authority)
        var gate = PassiveCoreBluetoothObservationBoundaryQueueGate()
        let fixture = try await readyAndHorizon(gate: &gate, fence: fence, recorder: recorder)
        let active = try #require(gate.activeTransaction)

        #expect(active.identity == fixture.recorded.transactionIdentity)
        #expect(active.revision == fixture.recorded.transactionRevision)
        #expect((await recorder.snapshot()).observationBoundaries.count == 2)

        let replacement = PassiveCoreBluetoothArtifactAuthorityContext(
            targetSessionGeneration: authority.targetSessionGeneration,
            authorityGeneration: authority.authorityGeneration + 1
        )
        try fence.transition(from: authority, to: replacement)

        #expect(throws: PassiveCoreBluetoothObservationBoundaryQueueGate.StateError.authorityChanged) {
            _ = try fixture.recorded.markBoundaryRecorded(
                on: &gate,
                lastProcessedQueueSequence: fixture.recorded.queueCutoff
            )
        }
        #expect(gate.phase == .drainingHorizon(active))
        #expect(!gate.isTerminal)

        let abort = try gate.abortRecordedHorizonBeforeGateCommit(fixture.recorded)
        #expect(abort.origin == .recordedHorizonInvalidatedBeforeGateCommit)
        #expect(abort.abandonedReadyTransactionIdentity == fixture.epoch.transactionIdentity)
        #expect(abort.abandonedHorizonQueueCutoff == fixture.recorded.queueCutoff)
        #expect(abort.abandonedHorizonTransactionRevision == fixture.recorded.transactionRevision)
        #expect(abort.abandonedHorizonTransactionIdentity == fixture.recorded.transactionIdentity)
        #expect(abort.abandonedEvidenceQueueCutoff == fixture.recorded.queueCutoff)
        #expect(gate.phase == .abortQuarantined(abort))
        #expect(!gate.isTerminal)
        #expect(gate.permittedDrainUpperBound(firstPending: 5, pendingTail: 5) == nil)
        #expect(!gate.resetForNewCaptureSession())

        await #expect(throws: PassiveCoreBluetoothObservationBoundaryMutationAttemptError.alreadyAttempted) {
            _ = try await fixture.admission.recordBoundary(on: recorder)
        }
        #expect((await recorder.snapshot()).observationBoundaries.count == 2)

        var pending = [PendingEvent(queueSequence: 5, authority: replacement)]
        let retirement = try PassiveCoreBluetoothAbortedObservationQueueRetirement.retire(
            from: &pending,
            currentLastEnqueuedEventSequence: 5,
            currentSettledQueueSequence: 4,
            drainIsIdle: true,
            abortedGate: gate,
            identity: { .init(queueSequence: $0.queueSequence, authority: $0.authority) }
        )
        #expect(pending.isEmpty)
        #expect(retirement.abortReceipt == abort)
        #expect(retirement.validatedSettledQueueSequence == 4)
        #expect(gate.phase == .abortQuarantined(abort))
    }

    @Test("recorded Horizon retirement requires chronology settled through H, not merely Ready")
    @MainActor
    func retirementRequiresSettledHorizonCutoff() async throws {
        let recorder = try PassiveCoreBluetoothCaptureRecorder(
            vehicleIdentity: es80,
            startedAt: Date(timeIntervalSince1970: 1)
        )
        let fence = PassiveCoreBluetoothArtifactAuthorityFence(authority: authority)
        var gate = PassiveCoreBluetoothObservationBoundaryQueueGate()
        let fixture = try await readyAndHorizon(gate: &gate, fence: fence, recorder: recorder)
        let abort = try gate.abortRecordedHorizonBeforeGateCommit(fixture.recorded)

        var pending = [
            PendingEvent(queueSequence: 3, authority: authority),
            PendingEvent(queueSequence: 4, authority: authority),
            PendingEvent(queueSequence: 5, authority: authority)
        ]
        let original = pending
        #expect(throws: PassiveCoreBluetoothAbortedObservationQueueRetirement.StateError.readyPrefixNotSettled(settled: 2, readyCutoff: 4)) {
            _ = try PassiveCoreBluetoothAbortedObservationQueueRetirement.retire(
                from: &pending,
                currentLastEnqueuedEventSequence: 5,
                currentSettledQueueSequence: 2,
                drainIsIdle: true,
                abortedGate: gate,
                identity: { .init(queueSequence: $0.queueSequence, authority: $0.authority) }
            )
        }
        #expect(pending == original)
        #expect(abort.abandonedEvidenceQueueCutoff == 4)
    }

    @Test("equal-scalar foreign recorded Horizon cannot quarantine another gate")
    @MainActor
    func foreignRecordedHorizonFailsExactIdentity() async throws {
        let recorderA = try PassiveCoreBluetoothCaptureRecorder(
            vehicleIdentity: es80,
            startedAt: Date(timeIntervalSince1970: 1)
        )
        let recorderB = try PassiveCoreBluetoothCaptureRecorder(
            vehicleIdentity: es80,
            startedAt: Date(timeIntervalSince1970: 1)
        )
        let fenceA = PassiveCoreBluetoothArtifactAuthorityFence(authority: authority)
        let fenceB = PassiveCoreBluetoothArtifactAuthorityFence(authority: authority)
        var gateA = PassiveCoreBluetoothObservationBoundaryQueueGate()
        var gateB = PassiveCoreBluetoothObservationBoundaryQueueGate()
        let a = try await readyAndHorizon(gate: &gateA, fence: fenceA, recorder: recorderA)
        let b = try await readyAndHorizon(gate: &gateB, fence: fenceB, recorder: recorderB)

        #expect(a.recorded.authority == b.recorded.authority)
        #expect(a.recorded.queueCutoff == b.recorded.queueCutoff)
        #expect(a.recorded.transactionRevision == b.recorded.transactionRevision)
        #expect(a.recorded.transactionIdentity != b.recorded.transactionIdentity)

        #expect(throws: PassiveCoreBluetoothObservationBoundaryQueueGate.StateError.staleTransaction) {
            _ = try gateB.abortRecordedHorizonBeforeGateCommit(a.recorded)
        }
        #expect(gateB.activeTransaction?.identity == b.recorded.transactionIdentity)
    }

    @Test("unchanged authority still commits Horizon and reaches terminal only after explicit freeze")
    @MainActor
    func normalHorizonCommitAndFreezeRemainsAvailable() async throws {
        let recorder = try PassiveCoreBluetoothCaptureRecorder(
            vehicleIdentity: es80,
            startedAt: Date(timeIntervalSince1970: 1)
        )
        let fence = PassiveCoreBluetoothArtifactAuthorityFence(authority: authority)
        var gate = PassiveCoreBluetoothObservationBoundaryQueueGate()
        let fixture = try await readyAndHorizon(gate: &gate, fence: fence, recorder: recorder)

        let committed = try fixture.recorded.markBoundaryRecorded(
            on: &gate,
            lastProcessedQueueSequence: fixture.recorded.queueCutoff
        )
        #expect(!gate.isTerminal)
        try committed.completeHorizonArtifactFreeze(on: &gate)
        #expect(gate.isTerminal)
    }
}
''')
          PY
          git rm .github/workflows/chat-g5t8m-recorded-horizon-recovery.yml
          git config user.name 'nembra-chat-g5t8m'
          git config user.email 'nembra-chat-g5t8m@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture
          git commit -m 'fix: quarantine recorded Horizon commit failures'
          git push origin HEAD:parallel/es80-recorded-horizon-recovery/chat-g5t8m
