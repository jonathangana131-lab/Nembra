name: Materialize Capture Failed Diagnostics DE74

on:
  push:
    branches:
      - fix/v14-capture-failed-diagnostics-de74-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-failed-diagnostics-de74-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact lineage and materialize failed-state controls
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor de74365b94c01720e01aabf39b76c7e4b316c47d HEAD
          test "$(git diff --name-only de74365b94c01720e01aabf39b76c7e4b316c47d HEAD | sort)" = "$(printf '%s\n' '.github/workflows/materialize-capture-failed-diagnostics-de74-sol.yml' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureFailedDiagnosticsProductSourceTests.swift' | sort)"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          def add_control_to_panel(source: str, start_marker: str, end_marker: str, label: str) -> str:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              section = source[start:end]
              if 'failureDiagnosticsControls' in section:
                  raise SystemExit(f'{label}: diagnostics control already present')
              tail = '\n            }\n        }\n    }\n\n'
              index = section.rfind(tail)
              if index < 0:
                  raise SystemExit(f'{label}: outer VStack tail missing')
              section = section[:index] + '\n\n                failureDiagnosticsControls' + section[index:]
              return source[:start] + section + source[end:]

          source = add_control_to_panel(
              source,
              '    private var failureRecoveryContextPanel: some View {',
              '    private var failurePanel: some View {',
              'recovery failure panel'
          )
          source = add_control_to_panel(
              source,
              '    private var failurePanel: some View {',
              '    private var completionPanel: some View {',
              'terminal failure panel'
          )

          insertion = '''    private var failureDiagnosticsControls: some View {
              VStack(alignment: .leading, spacing: 10) {
                  Divider()
                      .overlay(.white.opacity(0.10))

                  Text("FAILED ATTEMPT DIAGNOSTICS")
                      .font(.caption2.bold())
                      .tracking(1.1)
                      .foregroundStyle(.orange)

                  Text("Sanitized diagnostics describe this stopped attempt only. They are not an accepted Capture artifact or physical success.")
                      .font(.footnote)
                      .foregroundStyle(.secondary)
                      .fixedSize(horizontal: false, vertical: true)

                  if let data = test.exportData {
                      ShareLink(item: SecureTransfer(data: data, name: test.exportName), preview: SharePreview(test.exportName)) {
                          Label("Share diagnostics", systemImage: "square.and.arrow.up")
                              .frame(maxWidth: .infinity)
                      }
                      .buttonStyle(.bordered)
                      .controlSize(.large)
                      .accessibilityHint("Shares sanitized diagnostics from this stopped attempt. This is not an accepted Capture artifact.")
                  } else {
                      Button {
                          test.prepareExport()
                      } label: {
                          Label("Prepare diagnostics", systemImage: "doc.badge.gearshape")
                              .frame(maxWidth: .infinity)
                      }
                      .buttonStyle(.bordered)
                      .controlSize(.large)
                      .accessibilityHint("Prepares sanitized diagnostic JSON for this stopped attempt without creating accepted evidence.")
                  }
              }
          }

          '''
          sdk_anchor = '    private var sdkAuthorizationPanel: some View {'
          if source.count(sdk_anchor) != 1:
              raise SystemExit('SDK authorization insertion anchor is not unique')
          source = source.replace(sdk_anchor, insertion + sdk_anchor, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify authority split, product contract, and Swift syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')

          recovery = source[source.index('    private var failureRecoveryContextPanel: some View {'):source.index('    private var failurePanel: some View {')]
          terminal = source[source.index('    private var failurePanel: some View {'):source.index('    private var completionPanel: some View {')]
          diagnostics = source[source.index('    private var failureDiagnosticsControls: some View {'):source.index('    private var sdkAuthorizationPanel: some View {')]
          prepare = source[source.index('    func prepareExport() {'):source.index('    private func abandonPackageCorrelation()', source.index('    func prepareExport() {'))]

          for panel, name in [(recovery, 'recovery'), (terminal, 'terminal')]:
              if panel.count('failureDiagnosticsControls') != 1:
                  raise SystemExit(f'{name} panel does not consume exactly one common diagnostics primitive')

          for token in ['test.prepareExport()', 'test.exportData', 'ShareLink', 'Share diagnostics', 'Prepare diagnostics', 'not an accepted Capture artifact']:
              if token not in diagnostics:
                  raise SystemExit(f'failed diagnostics primitive missing: {token}')

          for token in ['if phase == .accepted', 'sealedAcceptedExport', 'makeExport(', 'phase: phase']:
              if token not in prepare:
                  raise SystemExit(f'accepted/failed export authority split missing: {token}')

          forbidden = ['CAPTURE COMPLETE', 'Ready for analysis', 'Share Capture']
          for token in forbidden:
              if token in diagnostics:
                  raise SystemExit(f'failed diagnostics primitive falsely claims accepted completion: {token}')
          print('Capture failed diagnostics product/source authority contract: PASS')
          PY
          git diff --check
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureFailedDiagnosticsProductSourceTests.swift

      - name: Collapse helper into product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-failed-diagnostics-de74-sol.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat(capture): expose sanitized failed-attempt diagnostics'
          git push origin HEAD:fix/v14-capture-failed-diagnostics-de74-sol
