name: Materialize Capture Per-Window BLE Ownership Fence

on:
  push:
    branches:
      - fix/v14-capture-per-window-ble-fence-eee5-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-per-window-ble-fence-eee5-sol
          fetch-depth: 0

      - name: Guard unchanged current product source
        run: |
          set -euo pipefail
          product_parent='eee5a96fae1d30796ba5707f0a7f30f4f4d62530'
          git merge-base --is-ancestor "$product_parent" HEAD
          git diff --quiet "$product_parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationPerWindowBLEOwnershipSourceTests.swift

      - name: Apply per-window ownership repair
        run: python3 scripts/ci/materialize_capture_per_window_ble_fence.py

      - name: Verify source contract and effective diff
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          body = app.split('private func startCurrentCorrelationWindow()', 1)[1].split('func finishCorrelationWindow()', 1)[0]
          ownership = body.index('guard !OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID) else')
          scanner = body.index('try session.startCurrentWindow()')
          assert ownership < scanner
          guarded = body[ownership:scanner]
          assert 'correlationSession?.abandonCurrentWindow()' in guarded
          assert 'correlationSession = nil' in guarded
          assert 'sdk_local_ble_ownership_changed_during_target_correlation' in guarded
          assert 'return' in guarded
          for forbidden in ('disconnectBLE', 'publishDps', 'queryDps', 'writeValue', 'sessionLedger.endConnection'):
              assert forbidden not in body
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationPerWindowBLEOwnershipSourceTests.swift').read_text(encoding='utf-8')
          assert 'every fresh correlation window rechecks global Tuya local-BLE ownership before package scan' in test
          assert 'ownership loss abandons the in-progress series and fails closed' in test
          print('capture per-window BLE ownership source contract: PASS')
          PY

      - name: Publish clean product bytes
        run: |
          set -euo pipefail
          product_parent='eee5a96fae1d30796ba5707f0a7f30f4f4d62530'
          rm .github/workflows/capture-per-window-ble-fence-materialize.yml
          rm scripts/ci/materialize_capture_per_window_ble_fence.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): fence every correlation window from Tuya BLE"
          test "$(git diff --name-only "$product_parent" HEAD | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationPerWindowBLEOwnershipSourceTests.swift' | sort)"
          git diff --check "$product_parent" HEAD
          git push origin HEAD:fix/v14-capture-per-window-ble-fence-eee5-sol
