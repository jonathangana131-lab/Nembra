name: Capture current-main entrypoint authorization materialize once

on:
  push:
    branches:
      - capture/current-main-entrypoint-authorization-gpt56
    paths:
      - .github/workflows/capture-current-main-entrypoint-auth-materialize-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/capture-current-main-entrypoint-auth-materialize-once.yml

permissions:
  contents: write

concurrency:
  group: capture-current-main-entrypoint-auth-materialize-once
  cancel-in-progress: false

jobs:
  materialize-test-publish:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TARGET_BRANCH: capture/current-main-entrypoint-authorization-gpt56
      TRIGGER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      SELF_WORKFLOW: .github/workflows/capture-current-main-entrypoint-auth-materialize-once.yml
      DONOR_BRANCH: product/capture-1-0-main-20260818
      DONOR_WORKFLOW: .github/workflows/capture-app-authorization-race-safe-go.yml
      EXPECTED_APP_BLOB: 5d1bc8aa617063730c234c596bb82db199c8b0c4
    steps:
      - name: Checkout exact current-main convergence head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind immutable current-main subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_APP_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute reviewed lifecycle transform from donor carrier
        shell: python
        run: |
          import os
          import subprocess
          import textwrap

          donor_branch = os.environ["DONOR_BRANCH"]
          donor_workflow = os.environ["DONOR_WORKFLOW"]
          subprocess.run(["git", "fetch", "origin", donor_branch], check=True)
          workflow = subprocess.check_output(
              ["git", "show", f"FETCH_HEAD:{donor_workflow}"],
              text=True,
          )
          start_marker = "      - name: Execute reviewed carrier-native lifecycle materializer\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Keep exact-freeze helper outside watchdog source-oracle interval"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          outer = textwrap.dedent(workflow[start:end])

          namespace = {
              "__name__": "__main__",
              "__file__": "<current-main-reviewed-authorization-donor>",
          }
          exec(compile(outer, namespace["__file__"], "exec", dont_inherit=True), namespace)

      - name: Apply donor post-transform authority hardening
        shell: python
        run: |
          import os
          import subprocess
          import textwrap

          donor_branch = os.environ["DONOR_BRANCH"]
          donor_workflow = os.environ["DONOR_WORKFLOW"]
          workflow = subprocess.check_output(
              ["git", "show", f"FETCH_HEAD:{donor_workflow}"],
              text=True,
          )
          start_marker = "      - name: Keep exact-freeze helper outside watchdog source-oracle interval\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Enforce transformed authority shape"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          chunks = block.split("\n      - name: Bind selected authentication to exact post-OFF1 authorization stage\n        shell: python\n        run: |\n")
          first = textwrap.dedent(chunks[0])
          second = textwrap.dedent(chunks[1])
          for index, program in enumerate((first, second), 1):
              ns = {"__name__": "__main__", "__file__": f"<current-main-auth-hardening-{index}>"}
              exec(compile(program, ns["__file__"], "exec", dont_inherit=True), ns)

      - name: Enforce non-authorizing transformed shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'publishDps(' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'writeValue(' "$APP_SOURCE")" = 0

      - name: Run exact current-main lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py -v

      - name: Run focused app-authorization contracts
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project NembraCapture.xcodeproj -scheme 'Nembra Capture' -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/NembraCurrentMainEntrypointAuthorization" CODE_SIGNING_ALLOWED=NO build

      - name: Publish tested entrypoint and retire authoring workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$TRIGGER_SHA"
          rm "$SELF_WORKFLOW"
          git add -- "$APP_SOURCE" "$SELF_WORKFLOW"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture: wire current-main field authorization lifecycle'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$TRIGGER_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CURRENT_MAIN_AUTH_LIFECYCLE physicalAuthorityCreated=false\n'
