name: Materialize Current Capture Foreground Integrity R2

on:
  push:
    branches: [agent/capture-foreground-current-bcea]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-foreground-current-bcea
          fetch-depth: 0
      - name: Apply foreground-integrity repair on exact current product
        shell: bash
        run: |
          set -euo pipefail
          product='bcea598c9a520064e1c4de9b47dcd0143685b3a1'
          expected_parent='26e7ce7095cfcd5f78a9e504e86c1a3b5a36679c'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git merge-base HEAD "$product")" = "$product"
          mapfile -t before < <(git diff --name-only "$product"...HEAD | sort)
          test "${#before[@]}" = 2
          test "${before[0]}" = '.github/workflows/materialize-capture-foreground-current-bcea-r2.yml'
          test "${before[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift'

          python3 - <<'PY'
          from pathlib import Path
          p=Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s=p.read_text(encoding='utf-8')
          if 'func appDidLoseForeground()' in s or '@Environment(\\.scenePhase)' in s:
              raise SystemExit('foreground-integrity repair already exists')

          marker='    var privateConfig: Bool { OfficialTuyaFactory.configured }\n'
          if s.count(marker)!=1: raise SystemExit('controller insertion marker drifted')
          method='''    func appDidLoseForeground() {\n        // Foreground is part of Capture evidence authority. Close the same view-scoped admission\n        // used by membership verification before revoking any already-issued async grants.\n        acceptsViewScopedMembershipRequests = false\n        membershipRequestID = UUID()\n        membershipBusy = false\n        sdkDeviceMembershipVerified = false\n        membershipAccountUID = nil\n        membershipDeviceID = nil\n#if canImport(ThingSmartHomeKit)\n        membershipProbe = nil\n#endif\n        officialConnectionRequestID = UUID()\n        watchdog?.cancel()\n        watchdog = nil\n\n        if processCorrelationLease != nil || correlationSession != nil {\n            // Package transport must stop before its owner-token process lease is released.\n            abandonPackageCorrelation()\n            phase = .failed\n            message = "Capture left the foreground during Bluetooth target correlation. Restart from OFF1; interrupted windows are never reusable evidence."\n            log("foreground_integrity_lost_during_target_correlation")\n            return\n        }\n\n        guard let token = currentConnectionToken else {\n            if phase == .authenticating {\n                // Driver handoff without a package token is app-local authority only. The rotated\n                // officialConnectionRequestID forces any pending ledger task to retire before SDK connect.\n                localBLESettlementToken = nil\n                sdkLocalBLEOnline = false\n                driver = nil\n                phase = .failed\n                message = "Capture left the foreground during authentication. Relaunch before another authenticated attempt; no BLE disconnect is claimed."\n                log("foreground_integrity_lost_before_observation")\n            }\n            return\n        }\n\n        let wasObserving = phase == .observing\n        phase = .failed\n        message = wasObserving\n            ? "Capture left the foreground during authenticated observation. Restart from OFF1; background time is not accepted evidence and no BLE disconnect is claimed."\n            : "Capture left the foreground before authenticated observation. Relaunch before another authenticated attempt; no BLE disconnect is claimed."\n        log(\n            wasObserving ? "foreground_integrity_lost_during_observation" : "foreground_integrity_lost_before_observation",\n            ["generation": String(token.diagnosticGeneration)]\n        )\n\n        Task { @MainActor [weak self] in\n            guard let self, self.currentConnectionToken == token else { return }\n            if wasObserving {\n                await self.invalidateObservationContinuity(\n                    token: token,\n                    message: "App foreground integrity was lost during authenticated observation. Restart from OFF1; background time is not accepted evidence and no BLE disconnect is claimed.",\n                    kind: "foreground_integrity_lost_during_observation"\n                )\n            } else {\n                await self.invalidateInternalLifecycle(\n                    token: token,\n                    message: "App foreground integrity was lost before authenticated observation. Relaunch before another authenticated attempt; no BLE disconnect is claimed.",\n                    kind: "foreground_integrity_lost_before_observation"\n                )\n            }\n        }\n    }\n\n'''
          s=s.replace(marker,method+marker,1)

          env='    @Environment(\\.dynamicTypeSize) private var dynamicTypeSize\n'
          if s.count(env)!=1: raise SystemExit('scene environment marker drifted')
          s=s.replace(env,env+'    @Environment(\\.scenePhase) private var scenePhase\n',1)

          old_task='''        .task {\n            test.activateMembershipRequestsForView()\n            sdkAccount.bootstrap()\n            if sdkAccount.loggedIn { test.verifySDKMembership() }\n            while !Task.isCancelled {\n                test.consumeCorrelationAsyncInvalidation()\n                try? await Task.sleep(nanoseconds: 250_000_000)\n            }\n        }\n'''
          new_task='''        .task {\n            test.activateMembershipRequestsForView()\n            if scenePhase == .active {\n                sdkAccount.bootstrap()\n                if sdkAccount.loggedIn { test.verifySDKMembership() }\n            } else {\n                test.appDidLoseForeground()\n            }\n            while !Task.isCancelled {\n                test.consumeCorrelationAsyncInvalidation()\n                try? await Task.sleep(nanoseconds: 250_000_000)\n            }\n        }\n'''
          if s.count(old_task)!=1: raise SystemExit('Secure Link task anchor drifted')
          s=s.replace(old_task,new_task,1)

          lifecycle='''        .onDisappear {\n            test.abandonCorrelationForViewExit()\n        }\n        .onChange(of: sdkAccount.loggedIn) { _, loggedIn in\n'''
          replacement='''        .onDisappear {\n            test.abandonCorrelationForViewExit()\n        }\n        .onChange(of: scenePhase) { _, newPhase in\n            if newPhase == .active {\n                // Reopen membership admission only for this still-visible Secure Link view.\n                // Re-verification is read-only; correlation/authentication never auto-restarts.\n                test.activateMembershipRequestsForView()\n                if sdkAccount.loggedIn { test.verifySDKMembership() }\n            } else {\n                test.appDidLoseForeground()\n            }\n        }\n        .onChange(of: sdkAccount.loggedIn) { _, loggedIn in\n'''
          if s.count(lifecycle)!=1: raise SystemExit('Secure Link lifecycle anchor drifted')
          s=s.replace(lifecycle,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          a=s.index('func appDidLoseForeground()'); b=s.index('var privateConfig: Bool',a); c=s[a:b]
          required=(
            'acceptsViewScopedMembershipRequests = false',
            'membershipRequestID = UUID()',
            'sdkDeviceMembershipVerified = false',
            'officialConnectionRequestID = UUID()',
            'watchdog?.cancel()',
            'abandonPackageCorrelation()',
            'let wasObserving = phase == .observing',
            'invalidateObservationContinuity(',
            'invalidateInternalLifecycle(',
          )
          for q in required:
              if q not in c: raise SystemExit(f'missing foreground invariant: {q}')
          if not (c.index('acceptsViewScopedMembershipRequests = false') < c.index('membershipRequestID = UUID()') < c.index('officialConnectionRequestID = UUID()') < c.index('if processCorrelationLease')):
              raise SystemExit('foreground revocation ordering violated')
          for q in ('releasePackageCorrelationLease()','recordObservedTransportLoss','endConnection','disconnectBLE'):
              if q in c: raise SystemExit(f'forbidden foreground semantic: {q}')
          for q in ('@Environment(\\.scenePhase) private var scenePhase','if scenePhase == .active','.onChange(of: scenePhase)','if newPhase == .active'):
              if q not in s: raise SystemExit(f'missing scene contract: {q}')
          print('foreground-integrity integrated source contract: PASS')
          PY

          git diff --check
          rm .github/workflows/materialize-capture-foreground-current-bcea-r2.yml
          git config user.name nembra-v14-bot
          git config user.email nembra-v14-bot@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift .github/workflows/materialize-capture-foreground-current-bcea-r2.yml
          git diff --cached --check
          git commit -m 'fix(capture): bind evidence to foreground integrity'
          git push origin HEAD:agent/capture-foreground-current-bcea
