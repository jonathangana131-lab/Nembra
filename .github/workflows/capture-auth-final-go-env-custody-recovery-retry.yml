name: Capture Auth Final GO Environment Custody Recovery Retry

on:
  push:
    branches:
      - repair/v14-auth-final-go-env-custody-recovery-sol

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Materialize validated repair from exact parent
        shell: bash
        run: |
          set -euo pipefail
          parent=a79681b538ffdd70b0538c251438f8590c6f0b9f
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git show df55af199722cca66d1c4dce4acc4da78007a0ba:scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py > scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/ci/es80_authenticated_stationary_final_go.py'); s=p.read_text()
          a='import argparse, hashlib, importlib.util, json, os, re, stat, subprocess, sys, urllib.request, zipfile\n'
          b='import argparse, hashlib, importlib.util, json, os, pwd, re, stat, subprocess, sys, urllib.request, zipfile\n'
          if s.count(a)!=1: raise SystemExit('import anchor drift')
          s=s.replace(a,b,1)
          a='BUNDLE="com.jonathangana131.nembra.capturelearn"; DEVICE="iPhone 12"; PRODUCT="iPhone13,2"\n'
          b=a+'TRUSTED_INSTALLER_PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin"\n'
          if s.count(a)!=1: raise SystemExit('constant anchor drift')
          s=s.replace(a,b,1)
          a='''def installer(repo:Path,source:str,device:Path):
              root=repo.expanduser().resolve(strict=True); device_path=canonical_private_path(device,"private intended-device identifier"); env=os.environ.copy(); env["NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE"]=str(device_path)
              try:p=subprocess.run(["/bin/bash",str(root/INSTALLER),source],cwd=root,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              except OSError as e: raise GoError("private installer execution failed") from e
              if p.returncode or "SDK-INTEGRATED CAPTURE LAUNCHED" not in p.stdout or canon(git(root,"rev-parse","HEAD"),"post-install HEAD")!=source or git(root,"status","--porcelain=v1","--untracked-files=all"): raise GoError("private installer did not preserve exact accepted field subject")
              return {"authority":"accepted-candidate-private-installer-execution-v1","result":"success","sourceCommitSHA":source,"buildIdentifier":f"capture-v14-{source[:12]}","bundleIdentifier":BUNDLE,"procedureIdentifier":PROC,"baselineDevice":DEVICE,"baselineProductType":PRODUCT,"baselineOS":"iOS 27"}
          '''
          b='''def installer_environment(device:Path)->dict[str,str]:
              account=pwd.getpwuid(os.getuid()); device_path=canonical_private_path(device,"private intended-device identifier")
              return {"PATH":TRUSTED_INSTALLER_PATH,"HOME":account.pw_dir,"USER":account.pw_name,"LOGNAME":account.pw_name,"LANG":"en_US.UTF-8","LC_ALL":"en_US.UTF-8","BASH_ENV":"/dev/null","ENV":"/dev/null","NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE":str(device_path)}

          def installer(repo:Path,source:str,device:Path):
              root=repo.expanduser().resolve(strict=True); env=installer_environment(device)
              try:p=subprocess.run(["/bin/bash","--noprofile","--norc","-p",str(root/INSTALLER),source],cwd=root,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              except OSError as e: raise GoError("private installer execution failed") from e
              if p.returncode or "SDK-INTEGRATED CAPTURE LAUNCHED" not in p.stdout or canon(git(root,"rev-parse","HEAD"),"post-install HEAD")!=source or git(root,"status","--porcelain=v1","--untracked-files=all"): raise GoError("private installer did not preserve exact accepted field subject")
              return {"authority":"accepted-candidate-private-installer-execution-v1","result":"success","sourceCommitSHA":source,"buildIdentifier":f"capture-v14-{source[:12]}","bundleIdentifier":BUNDLE,"procedureIdentifier":PROC,"baselineDevice":DEVICE,"baselineProductType":PRODUCT,"baselineOS":"iOS 27"}
          '''
          if s.count(a)!=1: raise SystemExit('installer anchor drift')
          p.write_text(s.replace(a,b,1))
          w=Path('.github/workflows/capture-authenticated-stationary-final-go.yml'); t=w.read_text()
          a='      - scripts/ci/tests/test_es80_authenticated_stationary_final_go.py\n'; b=a+'      - scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py\n'
          if t.count(a)!=2: raise SystemExit('workflow path anchor drift')
          t=t.replace(a,b)
          a='          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py\n'; b=a+'          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py\n'
          if t.count(a)!=1: raise SystemExit('workflow run anchor drift')
          w.write_text(t.replace(a,b,1))
          PY
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/es80_authenticated_stationary_signed_artifact.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          grep -Fq 'device_path=canonical_private_path(device,"private intended-device identifier")' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'stable_pr=("number","headSHA","headBranch","base","state","merged","draft")' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'env=installer_environment(device)' scripts/ci/es80_authenticated_stationary_final_go.py
          ! grep -Fq 'env=os.environ.copy()' scripts/ci/es80_authenticated_stationary_final_go.py
          git diff --check
      - name: Publish clean recovery
        shell: bash
        run: |
          set -euo pipefail
          parent=a79681b538ffdd70b0538c251438f8590c6f0b9f
          git rm .github/workflows/capture-auth-final-go-env-custody-recovery-materializer.yml .github/workflows/capture-auth-final-go-env-custody-recovery-retry.yml
          git add .github/workflows/capture-authenticated-stationary-final-go.yml scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          expected="$({ printf '%s\n' '.github/workflows/capture-authenticated-stationary-final-go.yml' 'scripts/ci/es80_authenticated_stationary_final_go.py' 'scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py'; } | sort)"
          actual="$(git diff --cached --name-only "$parent" | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name 'jonathangana131-lab'
          git config user.email 'jonathangana131@gmail.com'
          git commit -m 'fix(capture): compose Final-GO installer environment custody'
          git push origin HEAD:repair/v14-auth-final-go-env-custody-recovery-sol
