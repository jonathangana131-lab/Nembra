name: Nembra Experiment One shared publisher transform

"on":
  push:
    branches:
      - integration/es80-v14-experiment-one-shared-publisher/chat-gpt56-go3

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact flagship controller source
        shell: bash
        run: |
          set -euo pipefail
          file=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          test "$(git hash-object "$file")" = "6bd0ac1957f593919ba98b110cd795c2a4cdd1fc"

      - name: Apply shared-publisher refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/v14_experiment_one_shared_publisher_patch.py

      - name: Assert shared-publisher truth and preserved safety
        shell: bash
        run: |
          set -euo pipefail
          file=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -Fq 'private struct ExperimentOneCaptureAuthority' "$file"
          grep -Fq 'private var experimentOneCaptureAuthority: ExperimentOneCaptureAuthority?' "$file"
          grep -Fq 'using admission: PassiveBluetoothExperimentOneCaptureAdmission' "$file"
          grep -Fq 'beginExperimentOneTargetSession(using: payload)' "$file"
          grep -Fq 'experimentOneAuthority: nil' "$file"
          grep -Fq 'experimentOneCaptureAuthority = experimentOneAuthority' "$file"
          test "$(grep -Fc 'admission.consume()' "$file")" = "1"
          test "$(grep -Fc 'PassiveCoreBluetoothCaptureRecorder(' "$file")" = "1"
          ! grep -Fq 'connectUsingExperimentOneAdmission' "$file"
          ! sed -n '/func connect(/,/private func connectionCandidate/p' "$file" | grep -Fq 'writeValue('
          grep -Fq 'receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds' "$file"
          grep -Fq 'foregroundEvidenceIntegrityValid = true' "$file"
          grep -Fq 'try self.validateBoundaryAuthority(admission.authority)' "$file"
          ! grep -Fq 'try? self.observationBoundaryQueueGate.abortRecordedReadyBeforeGateCommit' "$file"
          ! grep -Fq 'try? observationBoundaryQueueGate.abortRecordedHorizonBeforeGateCommit' "$file"
          git diff --check

      - name: Remove staging files and commit product
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-nembra-experiment-one-shared-publisher.yml
          rm scripts/ci/v14_experiment_one_shared_publisher_patch.py
          git config user.name 'nembra-chatgpt56-go3'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
                  .github/workflows/zz-nembra-experiment-one-shared-publisher.yml \
                  scripts/ci/v14_experiment_one_shared_publisher_patch.py
          git diff --cached --check
          git commit -m 'refactor: preserve Experiment One provenance in shared session publication'
          git push origin HEAD:integration/es80-v14-experiment-one-shared-publisher/chat-gpt56-go3
