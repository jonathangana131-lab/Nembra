name: Capture Field Accepted Bash Source Identity Red Team

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_field_accepted_bash_source_identity_red_team.py
      - .github/workflows/capture-field-accepted-bash-source-identity-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-bash-source-identity:
    name: Prove verified Bash preserves accepted script identity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact validation head to attacked production parent
        shell: bash
        env:
          ATTACKED_PARENT: 947f592239a800f636e0626b2a0b9233ccbac38d
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$source_sha" = "${{ github.event.pull_request.head.sha }}"
          fi
          git cat-file -e "${ATTACKED_PARENT}^{commit}"
          changed_paths="$(git diff --name-only "$ATTACKED_PARENT"...HEAD | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/capture-field-accepted-bash-source-identity-red-team.yml' \
            'scripts/ci/tests/test_capture_field_accepted_bash_source_identity_red_team.py')"
          if [[ "$changed_paths" != "$expected_paths" ]]; then
            printf 'Accepted-Bash identity diagnostic must remain exactly two-path validation-only. Changed paths:\n' >&2
            printf '%s\n' "$changed_paths" | /usr/bin/sed 's/^/  /' >&2
            exit 20
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove accepted bootstrap source identity is preserved
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_accepted_bash_source_identity_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_accepted_bash_source_identity_red_team.py
          git diff --check

      - name: Preserve validation-only truth boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'This expected-red workflow performs no Xcode device operation, install, Bluetooth/Tuya action, credential handling, or physical experiment.'
