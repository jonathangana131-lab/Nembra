name: Capture Field Build Presentation Successor Patch

on:
  push:
    branches:
      - integration/v14-capture-final-preflight-authority-sol
    paths:
      - .github/workflows/capture-field-build-presentation-successor-patch.yml
      - Scripts/apply_capture_field_build_presentation_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-final-preflight-authority-sol
          fetch-depth: 0
      - name: Apply field-build presentation repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_field_build_presentation_patch.py
          rm Scripts/apply_capture_field_build_presentation_patch.py
          rm .github/workflows/capture-field-build-presentation-successor-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): make field-build provenance visible and fail-closed"
          git push origin HEAD:integration/v14-capture-final-preflight-authority-sol
