name: Capture source-attribution sync-cut materializer

on:
  push:
    branches:
      - capture/application-delivery-cutoff-repair-sol-20260814

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXACT_PARENT: 8894077b25c77ea40debc15019427e01bd6bbfb3
      BASE: 29fb304613c142ba99e1259e9d612c1919309145
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/application-delivery-cutoff-repair-sol-20260814
          fetch-depth: 0
          persist-credentials: true
      - name: Close source authority synchronously before retirement task
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_PARENT"
          test -f scripts/ci/materialize_capture_source_attribution_sync_cut.py
          python3 scripts/ci/materialize_capture_source_attribution_sync_cut.py
          test ! -e scripts/ci/materialize_capture_source_attribution_sync_cut.py
          test ! -e .github/workflows/capture-source-attribution-sync-cut-materializer.yml
          test ! -e scripts/ci/materialize_capture_source_attribution_donor.py
          test ! -e .github/workflows/capture-source-attribution-donor-materializer.yml
          git add -A
          git diff --cached --check "$BASE"
          git diff --cached --name-only "$BASE" | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          printf '%s\n' \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlySessionLedgerTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSmartLifeApplicationSourceAttributionSourceTests.swift \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          grep -Fq 'sourceAuthorityFailure: @escaping @MainActor () -> Void' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'self.acceptanceCutIsClosed = true' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'self.watchdog?.cancel()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'self.phase = .failed' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'callbackDeviceID == expectedDeviceID' NembraApp/App/NembraCaptureEntrypoint.swift
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git commit -m 'Capture V16.1: synchronously close mismatched SmartLife source authority'
          git push origin HEAD:capture/application-delivery-cutoff-repair-sol-20260814
