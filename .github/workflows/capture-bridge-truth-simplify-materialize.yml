name: Materialize Capture Bridge Truth Simplification

on:
  push:
    branches:
      - sol/v14-capture-bridge-truth-simplify-e8acd
    paths:
      - .github/workflows/capture-bridge-truth-simplify-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-bridge-truth-simplify-e8acd
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          product_parent='e8acd80c6f220529a98a4a4829514829c3321daa'
          git merge-base --is-ancestor "$product_parent" HEAD
          git diff --quiet "$product_parent" HEAD -- NembraApp/Features/Research/TuyaAccountBridge.swift
          git diff --quiet "$product_parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift
          actual="$(git diff --name-only "$product_parent" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-bridge-truth-simplify-materialize.yml' 'scripts/ci/materialize_capture_bridge_truth_simplification.py' | sort)"
          test "$actual" = "$expected"

      - name: Apply bridge truth convergence
        run: python3 scripts/ci/materialize_capture_bridge_truth_simplification.py apply

      - name: Verify bridge truth convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_bridge_truth_simplification.py verify
          python3 -m py_compile scripts/ci/materialize_capture_bridge_truth_simplification.py
          git diff --check
          grep -Fq 'selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq '"status": Self.redactSecrets(selectedDeviceStatus ?? [:])' NembraApp/Features/Research/TuyaAccountBridge.swift
          ! grep -Fq 'struct NembraCaptureRootView: View' NembraApp/Features/Research/TuyaAccountBridge.swift
          ! grep -Fq 'func captureCard() -> some View' NembraApp/Features/Research/TuyaAccountBridge.swift

      - name: Publish clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-bridge-truth-simplify-materialize.yml
          rm scripts/ci/materialize_capture_bridge_truth_simplification.py
          rm -rf scripts/ci/__pycache__
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): redact status and retire legacy root"
          git push origin HEAD:sol/v14-capture-bridge-truth-simplify-e8acd
