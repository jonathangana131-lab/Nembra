name: Materialize Capture correlation progress truth

on:
  push:
    branches:
      - repair/v14-capture-correlation-progress-current-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source repair
        run: python3 scripts/ci/apply_capture_correlation_progress_truth.py
      - name: Validate focused source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = source.index('private struct SecureLinkView: View')
          end = source.index('private struct SecureTransfer: Transferable', start)
          body = source[start:end]
          assert 'Text("\\(min(test.correlationCompletedWindowCount + 1, 4))/4")' not in body
          assert 'private var correlationDisplayedWindowOrdinal: Int' in body
          assert 'test.phase == .correlated ? 4' in body
          assert 'min(test.correlationCompletedWindowCount + 1, 4)' in body
          assert 'Text("\\(correlationDisplayedWindowOrdinal)/4")' in body
          PY
          git diff --check
      - name: Publish clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/apply_capture_correlation_progress_truth.py
          rm .github/workflows/materialize-capture-correlation-progress-truth.yml
          git diff --check
          git add -A
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): present completed correlation as four of four'
          git push origin HEAD:repair/v14-capture-correlation-progress-current-sol
