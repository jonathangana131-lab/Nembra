name: V14 Capture Premium Product R2 Converge

on:
  push:
    branches:
      - repair/v14-capture-premium-root-convergence-gate-sol

permissions:
  contents: write

jobs:
  converge:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-premium-root-convergence-gate-sol
          fetch-depth: 0

      - name: Patch current-spine product surface
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/patch_capture_premium_product_r2.py
          /usr/bin/python3 scripts/ci/patch_capture_premium_product_r2_followup.py

      - name: Verify source and adversarial product contracts
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkProductSurfaceSourceTests.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkProductRecoveryTruthSourceTests.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkRestartAuthoritySourceTests.swift
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          /usr/bin/python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py
          git diff --check

      - name: Preserve Apple-only package acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/CoreBluetoothCaptureMapping.swift
          grep -q 'import CoreBluetooth' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/CoreBluetoothCaptureMapping.swift
          {
            echo '### Acceptance boundary'
            echo 'This Ubuntu job only materializes and source-checks the premium Capture candidate.'
            echo 'NembraBluetoothCapture imports Apple CoreBluetooth and cannot be accepted by Linux swift test.'
            echo 'The resulting unchanged product SHA still requires the repository Mac/Xcode exact-head Capture suite before composition or physical GO.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit clean product candidate and retire convergence tooling
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/patch_capture_premium_product_r2.py
          rm scripts/ci/patch_capture_premium_product_r2_followup.py
          rm .github/workflows/v14-capture-premium-product-r2-converge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(capture): close premium root and recovery truth'
          git push origin HEAD:repair/v14-capture-premium-root-convergence-gate-sol
