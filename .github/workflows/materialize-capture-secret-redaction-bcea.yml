name: Materialize Capture application secret redaction

on:
  push:
    branches:
      - sol/v14-capture-application-secret-redaction-bcea

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Verify exact product ancestry and helper-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bcea598c9a520064e1c4de9b47dcd0143685b3a1 HEAD
          test "$(git diff --name-only bcea598c9a520064e1c4de9b47dcd0143685b3a1..HEAD)" = ".github/workflows/materialize-capture-secret-redaction-bcea.yml"

      - name: Apply fail-closed application secret redaction
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = source_path.read_text()
          old = "\n".join([
              "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {",
              "        guard let dps, !dps.isEmpty else { return }",
              "        var sanitized: [String: String] = [:]",
              "        for (key, value) in dps {",
              "            sanitized[String(describing: key)] = String(describing: value)",
              "        }",
              "        onApplicationUpdate?(sanitized)",
              "    }",
          ])
          new = "\n".join([
              "    private static let secretKeyFragments = [",
              "        \"localkey\",",
              "        \"accesstoken\",",
              "        \"refreshtoken\",",
              "        \"authkey\",",
              "        \"seckey\"",
              "    ]",
              "",
              "    private static func isSecretKey(_ key: String) -> Bool {",
              "        let normalized = key.lowercased().filter { $0.isLetter || $0.isNumber }",
              "        return secretKeyFragments.contains { normalized.contains($0) }",
              "    }",
              "",
              "    private static func redactApplicationSecrets(_ object: Any) -> Any {",
              "        if let dictionary = object as? [AnyHashable: Any] {",
              "            var sanitized: [AnyHashable: Any] = [:]",
              "            sanitized.reserveCapacity(dictionary.count)",
              "            for (key, value) in dictionary {",
              "                let keyString = String(describing: key)",
              "                sanitized[key] = isSecretKey(keyString)",
              "                    ? \"<redacted>\"",
              "                    : redactApplicationSecrets(value)",
              "            }",
              "            return sanitized",
              "        }",
              "        if let array = object as? [Any] {",
              "            return array.map(redactApplicationSecrets)",
              "        }",
              "        return object",
              "    }",
              "",
              "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {",
              "        guard let dps, !dps.isEmpty else { return }",
              "        var sanitized: [String: String] = [:]",
              "        sanitized.reserveCapacity(dps.count)",
              "        for (key, value) in dps {",
              "            let keyString = String(describing: key)",
              "            if Self.isSecretKey(keyString) {",
              "                sanitized[keyString] = \"<redacted>\"",
              "            } else {",
              "                sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))",
              "            }",
              "        }",
              "        onApplicationUpdate?(sanitized)",
              "    }",
          ])
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one unsanitized dpsUpdate body, found {source.count(old)}")
          source_path.write_text(source.replace(old, new))

      - name: Validate materialized source contract
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          python - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          section = source.split('@MainActor\nprivate final class SmartLifeDriver', 1)[1].split('#endif\n\nprivate enum AppleAccountAuthorizationError', 1)[0]
          required = [
              'private static func redactApplicationSecrets(_ object: Any) -> Any',
              'secretKeyFragments', 'localkey', 'accesstoken', 'refreshtoken', 'authkey', 'seckey',
              'key.lowercased().filter', '$0.isLetter || $0.isNumber',
              'array.map(redactApplicationSecrets)',
              'String(describing: Self.redactApplicationSecrets(value))',
              'sanitized[keyString] = "<redacted>"',
              'onApplicationUpdate?(sanitized)'
          ]
          missing = [item for item in required if item not in section]
          if missing:
              raise SystemExit(f'missing source-contract anchors: {missing}')
          if section.count('onApplicationUpdate?(sanitized)') != 1:
              raise SystemExit('controller admission must remain singular')
          if 'String(describing: key)] = String(describing: value)' in section:
              raise SystemExit('unsanitized application projection survived')
          PY
          git diff --check

      - name: Publish product repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-secret-redaction-bcea.yml
          git config user.name "nembra-sol-worker"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/materialize-capture-secret-redaction-bcea.yml
          git commit -m "fix(capture): redact authenticated application secrets"
          git push origin HEAD:sol/v14-capture-application-secret-redaction-bcea
