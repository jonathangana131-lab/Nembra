name: Materialize Capture metadata secret redaction

on:
  push:
    branches:
      - product/v14-capture-metadata-secret-redaction-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current product ancestry
        shell: bash
        run: |
          set -euo pipefail
          base='2bb37639656fb114c5767f6311586042b9ee4ef2'
          test "$(git merge-base HEAD "$base")" = "$base"
          allowed="$(printf '%s\n' '.github/workflows/materialize-v14-capture-metadata-secret-redaction.yml' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift' | sort)"
          test "$(git diff --name-only "$base" HEAD | sort)" = "$allowed"

      - name: Apply normalized secret-key classification
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('NembraApp/Features/Research/TuyaAccountBridge.swift')
          source = path.read_text(encoding='utf-8')
          old = '''            for (key, value) in dictionary {\n                let normalized = key.lowercased()\n                if normalized == "local_key" || normalized == "localkey" || normalized.contains("access_token") || normalized.contains("refresh_token") || normalized == "seckey" || normalized == "sec_key" || normalized == "auth_key" || normalized == "authkey" {\n                    output[key] = "<redacted>"\n                } else {\n                    output[key] = redactSecrets(value)\n                }\n            }\n'''
          new = '''            let secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "seckey", "authkey"]\n            for (key, value) in dictionary {\n                let normalized = String(key.lowercased().filter { $0.isLetter || $0.isNumber })\n                if secretKeyFragments.contains(where: normalized.contains) {\n                    output[key] = "<redacted>"\n                } else {\n                    output[key] = redactSecrets(value)\n                }\n            }\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy redaction block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          grep -Fq 'let secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "seckey", "authkey"]' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'key.lowercased().filter { $0.isLetter || $0.isNumber }' NembraApp/Features/Research/TuyaAccountBridge.swift
          ! grep -Fq 'normalized.contains("access_token")' NembraApp/Features/Research/TuyaAccountBridge.swift
          ! grep -Fq 'normalized.contains("refresh_token")' NembraApp/Features/Research/TuyaAccountBridge.swift
          git diff --check

      - name: Publish clean security successor
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/materialize-v14-capture-metadata-secret-redaction.yml'
          rm "$workflow"
          git add -A
          expected="$(printf '%s\n' "$workflow" 'NembraApp/Features/Research/TuyaAccountBridge.swift' | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): normalize Tuya metadata secret keys'
          git push origin HEAD:product/v14-capture-metadata-secret-redaction-sol
