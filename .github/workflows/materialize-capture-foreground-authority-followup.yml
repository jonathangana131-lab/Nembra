name: Materialize Capture foreground authority follow-up

on:
  push:
    branches:
      - sol/v14-capture-foreground-authority-followup-1c408

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - name: Verify current-product ancestry and helper-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1c40853f6991b4d09206df1d25ecff021458b7eb HEAD
          test "$(git diff --name-only 1c40853f6991b4d09206df1d25ecff021458b7eb..HEAD)" = ".github/workflows/materialize-capture-foreground-authority-followup.yml"

      - name: Materialize missing foreground authority fences
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          old_start = "\n".join([
              "    func appDidLoseForeground() {",
              "        guard !foregroundIntegrityLossHandled else { return }",
              "        foregroundIntegrityLossHandled = true",
          ])
          new_start = "\n".join([
              "    func appDidLoseForeground() {",
              "        // Sealed acceptance is immutable under later scene transitions.",
              "        guard phase != .accepted else { return }",
              "        guard !foregroundIntegrityLossHandled else { return }",
              "        foregroundIntegrityLossHandled = true",
          ])
          if source.count(old_start) != 1:
              raise SystemExit(f"expected one foreground entry anchor, found {source.count(old_start)}")
          source = source.replace(old_start, new_start)

          old_boundary = "\n".join([
              "        if processCorrelationLease != nil || correlationSession != nil {",
              "            // Existing helper stops package transport before releasing this controller's lease.",
              "            abandonPackageCorrelation()",
              "            phase = .failed",
              "            message = \"Capture left the foreground during Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; interrupted windows are never reusable evidence.\"",
              "            log(\"foreground_integrity_lost_during_target_correlation\")",
              "            return",
              "        }",
              "",
              "        guard let token = currentConnectionToken else {",
          ])
          new_boundary = "\n".join([
              "        if processCorrelationLease != nil || correlationSession != nil {",
              "            // Existing helper stops package transport before releasing this controller's lease.",
              "            abandonPackageCorrelation()",
              "            phase = .failed",
              "            message = \"Capture left the foreground during Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; interrupted windows are never reusable evidence.\"",
              "            log(\"foreground_integrity_lost_during_target_correlation\")",
              "            return",
              "        }",
              "",
              "        if phase == .correlated || phase == .selected {",
              "            // Scanner retirement does not make correlated/selected target evidence safe to carry across foreground loss.",
              "            resetDiscoverySessionOnly()",
              "            phase = .failed",
              "            message = \"Capture left the foreground after target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; pre-background target authority cannot be reused.\"",
              "            log(\"foreground_integrity_lost_after_target_correlation\")",
              "            return",
              "        }",
              "",
              "        guard let token = currentConnectionToken else {",
          ])
          if source.count(old_boundary) != 1:
              raise SystemExit(f"expected one post-correlation boundary, found {source.count(old_boundary)}")
          source = source.replace(old_boundary, new_boundary)
          path.write_text(source)

      - name: Validate source repair and worktree scope
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          python - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          start = source.index('func appDidLoseForeground()')
          end = source.index('var privateConfig: Bool', start)
          cleanup = source[start:end]
          required = [
              'guard phase != .accepted else { return }',
              'if phase == .correlated || phase == .selected',
              'resetDiscoverySessionOnly()',
              'foreground_integrity_lost_after_target_correlation',
              'pre-background target authority cannot be reused',
              'Task { @MainActor [self] in',
          ]
          missing = [item for item in required if item not in cleanup]
          if missing:
              raise SystemExit(f'missing foreground authority anchors: {missing}')
          if cleanup.index('guard phase != .accepted else { return }') > cleanup.index('sdkDeviceMembershipVerified = false'):
              raise SystemExit('accepted guard occurs after authority mutation')
          if cleanup.index('if phase == .correlated || phase == .selected') > cleanup.index('guard let token = currentConnectionToken else'):
              raise SystemExit('correlated/selected reset occurs after token fallthrough')
          for forbidden in ['recordObservedTransportLoss', 'sessionLedger.endConnection', 'disconnectBLE', 'releasePackageCorrelationLease()']:
              if forbidden in cleanup:
                  raise SystemExit(f'forbidden foreground transport authority: {forbidden}')
          PY
          test "$(git diff --name-only)" = "NembraApp/App/NembraCaptureEntrypoint.swift"
          git diff --check

      - name: Publish clean source repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-foreground-authority-followup.yml
          git config user.name "nembra-sol-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/materialize-capture-foreground-authority-followup.yml' 'NembraApp/App/NembraCaptureEntrypoint.swift' | sort)"
          git commit -m "fix(capture): revoke correlated authority on foreground loss"
          git push origin HEAD:sol/v14-capture-foreground-authority-followup-1c408
