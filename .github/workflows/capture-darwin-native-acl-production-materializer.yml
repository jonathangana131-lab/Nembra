name: Capture Darwin Native ACL Production Materializer

on:
  pull_request:
    paths:
      - .github/workflows/capture-darwin-native-acl-production-materializer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'repair/v17-capture-darwin-native-acl-production-gpt56sol-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact parent and authoring scope
        shell: bash
        run: |
          set -euo pipefail
          parent='b87d375e5ae419fd5569c2cd63a6b42fc45174b0'
          /usr/bin/git merge-base --is-ancestor "$parent" HEAD
          changed="$(/usr/bin/git diff --name-only "$parent"...HEAD)"
          test "$changed" = '.github/workflows/capture-darwin-native-acl-production-materializer.yml'

      - name: Materialize production and permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          orchestrator = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py')
          source = orchestrator.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one seam, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              'import argparse\nimport base64\nimport hashlib\n',
              'import argparse\nimport base64\nimport ctypes\nimport errno\nimport hashlib\n',
              'native ACL imports',
          )

          acl_marker = '''def _principal_already_present(listing: str, principal: str) -> bool:\n'''
          native_helpers = r'''def _require_canonical_acl_identity(
              path: Path,
              descriptor: int,
              accepted_signature: tuple[int, int, int],
              is_directory: bool,
          ) -> None:
              if _descriptor_signature(descriptor) != accepted_signature:
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease held descriptor changed at ACL transition: {path}"
                  )
              diagnostic = _open_pinned_path(path, is_directory, accepted_signature)
              os.close(diagnostic)


          def _path_acl_listing(
              path: Path,
              descriptor: int,
              accepted_signature: tuple[int, int, int],
              is_directory: bool,
          ) -> str:
              """Inspect ACL through the canonical path only while it names the held vnode."""
              _require_canonical_acl_identity(
                  path, descriptor, accepted_signature, is_directory
              )
              completed = subprocess.run(
                  ["/bin/ls", "-Hlde", str(path)],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              if completed.returncode != 0:
                  detail = (completed.stderr or "").strip()
                  raise SelectedXcodeBuildOrchestratorError(
                      "could not inspect canonical private read-lease ACL"
                      + (f": {detail[-800:]}" if detail else "")
                  )
              _require_canonical_acl_identity(
                  path, descriptor, accepted_signature, is_directory
              )
              return completed.stdout


          def _chmod_acl_path(
              path: Path,
              descriptor: int,
              accepted_signature: tuple[int, int, int],
              is_directory: bool,
              acl: str,
          ) -> None:
              """Grant through a freshly identity-bound canonical path; revoke never uses it."""
              _require_canonical_acl_identity(
                  path, descriptor, accepted_signature, is_directory
              )
              completed = subprocess.run(
                  ["/bin/chmod", "+a", acl, str(path)],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              if completed.returncode != 0:
                  detail = ((completed.stdout or "") + "\n" + (completed.stderr or "")).strip()
                  raise SelectedXcodeBuildOrchestratorError(
                      "could not +a canonical private read-lease ACL"
                      + (f": {detail[-800:]}" if detail else "")
                  )
              _require_canonical_acl_identity(
                  path, descriptor, accepted_signature, is_directory
              )


          def _darwin_acl_library():
              if sys.platform != "darwin":
                  raise SelectedXcodeBuildOrchestratorError(
                      "native private read-lease ACL transport requires Darwin"
                  )
              library = ctypes.CDLL(None, use_errno=True)
              library.acl_get_fd.argtypes = [ctypes.c_int]
              library.acl_get_fd.restype = ctypes.c_void_p
              library.acl_dup.argtypes = [ctypes.c_void_p]
              library.acl_dup.restype = ctypes.c_void_p
              library.acl_init.argtypes = [ctypes.c_int]
              library.acl_init.restype = ctypes.c_void_p
              library.acl_set_fd.argtypes = [ctypes.c_int, ctypes.c_void_p]
              library.acl_set_fd.restype = ctypes.c_int
              library.acl_free.argtypes = [ctypes.c_void_p]
              library.acl_free.restype = ctypes.c_int
              return library


          def _capture_fd_acl_baseline(descriptor: int) -> int:
              """Retain an acl_t that can restore this exact held object in finally."""
              library = _darwin_acl_library()
              ctypes.set_errno(0)
              current = library.acl_get_fd(descriptor)
              if current:
                  ctypes.set_errno(0)
                  baseline = library.acl_dup(current)
                  duplicate_errno = ctypes.get_errno()
                  library.acl_free(current)
                  if not baseline:
                      raise SelectedXcodeBuildOrchestratorError(
                          "could not duplicate descriptor-pinned private read-lease ACL baseline"
                          + (f": errno {duplicate_errno}" if duplicate_errno else "")
                      )
                  return int(baseline)

              baseline_errno = ctypes.get_errno()
              if baseline_errno not in (0, errno.ENOENT):
                  raise SelectedXcodeBuildOrchestratorError(
                      "could not capture descriptor-pinned private read-lease ACL baseline"
                      f": errno {baseline_errno}"
                  )
              ctypes.set_errno(0)
              empty = library.acl_init(0)
              empty_errno = ctypes.get_errno()
              if not empty:
                  raise SelectedXcodeBuildOrchestratorError(
                      "could not create empty private read-lease ACL baseline"
                      + (f": errno {empty_errno}" if empty_errno else "")
                  )
              return int(empty)


          def _restore_fd_acl_baseline(descriptor: int, baseline_acl: int) -> None:
              if baseline_acl <= 0:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease native ACL baseline is unavailable"
                  )
              library = _darwin_acl_library()
              ctypes.set_errno(0)
              result = library.acl_set_fd(descriptor, ctypes.c_void_p(baseline_acl))
              saved_errno = ctypes.get_errno()
              if result != 0:
                  raise SelectedXcodeBuildOrchestratorError(
                      "could not restore descriptor-pinned private read-lease ACL baseline"
                      + (f": errno {saved_errno}" if saved_errno else "")
                  )


          def _free_fd_acl_baseline(baseline_acl: int) -> None:
              if baseline_acl <= 0:
                  return
              library = _darwin_acl_library()
              if library.acl_free(ctypes.c_void_p(baseline_acl)) != 0:
                  raise SelectedXcodeBuildOrchestratorError(
                      "could not free descriptor-pinned private read-lease ACL baseline"
                  )


          '''
          if source.count(acl_marker) != 1:
              raise SystemExit('native ACL helper insertion seam moved')
          source = source.replace(acl_marker, native_helpers + acl_marker, 1)

          replace_once(
              '''    def __init__(self, subjects: Sequence[Path], repo: Path) -> None:\n        self._subjects = tuple(_absolute_lexical(Path(subject)) for subject in subjects)\n''',
              '''    def __init__(\n        self,\n        subjects: Sequence[Path],\n        repo: Path,\n        *,\n        use_native_darwin_acl: bool = False,\n    ) -> None:\n        self._subjects = tuple(_absolute_lexical(Path(subject)) for subject in subjects)\n''',
              'lease constructor',
          )
          replace_once(
              '''        self._repository = _absolute_lexical(repo)\n        self._opened: list[dict[str, object]] = []\n''',
              '''        self._repository = _absolute_lexical(repo)\n        self._use_native_darwin_acl = bool(use_native_darwin_acl)\n        self._opened: list[dict[str, object]] = []\n''',
              'lease mode storage',
          )
          replace_once(
              '''                    "before": "",\n                    "acl": "",\n                    "added": False,\n''',
              '''                    "before": "",\n                    "acl": "",\n                    "added": False,\n                    "native_baseline_acl": 0,\n''',
              'lease record baseline',
          )

          old_grant = '''                is_directory = bool(record["is_directory"])\n                before = _acl_listing(descriptor)\n                if _principal_already_present(before, principal):\n                    raise SelectedXcodeBuildOrchestratorError(\n                        f"private read-lease principal already has ACL authority: {path}"\n                    )\n                acl = _acl_text(principal, is_directory, host_only)\n                record["before"] = before\n                record["acl"] = acl\n                try:\n                    _chmod_acl(descriptor, "+a", acl)\n                except Exception:\n                    # A command-level failure does not prove the kernel left the ACL\n                    # unchanged. Classify while the exact held descriptor remains live.\n                    try:\n                        after_failed = _acl_listing(descriptor)\n                    except Exception:\n                        record["added"] = True\n                    else:\n                        record["added"] = after_failed != before\n                    raise\n                record["added"] = True\n                after = _acl_listing(descriptor)\n                if after == before or not _principal_already_present(after, principal):\n                    raise SelectedXcodeBuildOrchestratorError(\n                        f"private read-lease ACL did not materialize exactly: {path}"\n                    )\n'''
          new_grant = '''                is_directory = bool(record["is_directory"])\n                if self._use_native_darwin_acl:\n                    record["native_baseline_acl"] = _capture_fd_acl_baseline(descriptor)\n                    before = _path_acl_listing(\n                        path, descriptor, accepted_signature, is_directory\n                    )\n                else:\n                    before = _acl_listing(descriptor)\n                if _principal_already_present(before, principal):\n                    raise SelectedXcodeBuildOrchestratorError(\n                        f"private read-lease principal already has ACL authority: {path}"\n                    )\n                acl = _acl_text(principal, is_directory, host_only)\n                record["before"] = before\n                record["acl"] = acl\n                if self._use_native_darwin_acl:\n                    # The accepted-root parent is root-custodied. Grant through the\n                    # canonical path only while it names the held vnode; exact rollback\n                    # authority remains the retained descriptor baseline, never the path.\n                    record["added"] = True\n                    _chmod_acl_path(\n                        path, descriptor, accepted_signature, is_directory, acl\n                    )\n                    after = _path_acl_listing(\n                        path, descriptor, accepted_signature, is_directory\n                    )\n                else:\n                    try:\n                        _chmod_acl(descriptor, "+a", acl)\n                    except Exception:\n                        # A command-level failure does not prove the kernel left the ACL\n                        # unchanged. Classify while the exact held descriptor remains live.\n                        try:\n                            after_failed = _acl_listing(descriptor)\n                        except Exception:\n                            record["added"] = True\n                        else:\n                            record["added"] = after_failed != before\n                        raise\n                    record["added"] = True\n                    after = _acl_listing(descriptor)\n                if after == before or not _principal_already_present(after, principal):\n                    raise SelectedXcodeBuildOrchestratorError(\n                        f"private read-lease ACL did not materialize exactly: {path}"\n                    )\n'''
          replace_once(old_grant, new_grant, 'grant transport')

          old_revoke = '''                if bool(record["added"]):\n                    accepted_signature = record.get("accepted_signature")\n                    is_directory = record.get("is_directory")\n                    path_matches = False\n                    if (\n                        isinstance(accepted_signature, tuple)\n                        and len(accepted_signature) == 3\n                        and isinstance(is_directory, bool)\n                    ):\n                        try:\n                            diagnostic = _open_pinned_path(\n                                path, is_directory, accepted_signature\n                            )\n                        except Exception:\n                            path_matches = False\n                        else:\n                            os.close(diagnostic)\n                            path_matches = True\n                    else:\n                        try:\n                            path_matches = (\n                                _descriptor_signature(descriptor) == _path_signature(path)\n                            )\n                        except Exception:\n                            path_matches = False\n                    if not path_matches:\n                        failures.append(\n                            f"private read-lease pathname no longer identifies opened object: {path}"\n                        )\n                    _chmod_acl(descriptor, "-a", str(record["acl"]))\n                    restored = _acl_listing(descriptor)\n                    if restored != str(record["before"]):\n                        failures.append(\n                            f"private read-lease did not restore exact ACL listing: {path}"\n                        )\n'''
          new_revoke = '''                if bool(record["added"]):\n                    accepted_signature = record.get("accepted_signature")\n                    is_directory = record.get("is_directory")\n                    path_matches = False\n                    if (\n                        isinstance(accepted_signature, tuple)\n                        and len(accepted_signature) == 3\n                        and isinstance(is_directory, bool)\n                    ):\n                        if _descriptor_signature(descriptor) != accepted_signature:\n                            raise SelectedXcodeBuildOrchestratorError(\n                                f"private read-lease held descriptor changed before revoke: {path}"\n                            )\n                        try:\n                            diagnostic = _open_pinned_path(\n                                path, is_directory, accepted_signature\n                            )\n                        except Exception:\n                            path_matches = False\n                        else:\n                            os.close(diagnostic)\n                            path_matches = True\n                    else:\n                        try:\n                            path_matches = (\n                                _descriptor_signature(descriptor) == _path_signature(path)\n                            )\n                        except Exception:\n                            path_matches = False\n                    if self._use_native_darwin_acl:\n                        _restore_fd_acl_baseline(\n                            descriptor, int(record.get("native_baseline_acl", 0))\n                        )\n                        # Path replacement is not a rollback failure: descriptor custody\n                        # intentionally restores the original vnode. Verify path text only\n                        # when the canonical name still identifies that exact object.\n                        if path_matches:\n                            restored = _path_acl_listing(\n                                path, descriptor, accepted_signature, is_directory\n                            )\n                            if restored != str(record["before"]):\n                                failures.append(\n                                    f"private read-lease did not restore exact ACL listing: {path}"\n                                )\n                    else:\n                        if not path_matches:\n                            failures.append(\n                                f"private read-lease pathname no longer identifies opened object: {path}"\n                            )\n                        _chmod_acl(descriptor, "-a", str(record["acl"]))\n                        restored = _acl_listing(descriptor)\n                        if restored != str(record["before"]):\n                            failures.append(\n                                f"private read-lease did not restore exact ACL listing: {path}"\n                            )\n'''
          replace_once(old_revoke, new_revoke, 'revoke transport')

          replace_once(
              '''            finally:\n                try:\n                    os.close(descriptor)\n                except OSError as error:\n                    failures.append(f"{path}: descriptor close failed: {error}")\n''',
              '''            finally:\n                try:\n                    if self._use_native_darwin_acl:\n                        _free_fd_acl_baseline(int(record.get("native_baseline_acl", 0)))\n                        record["native_baseline_acl"] = 0\n                except Exception as error:\n                    failures.append(f"{path}: native ACL baseline free failed: {error}")\n                try:\n                    os.close(descriptor)\n                except OSError as error:\n                    failures.append(f"{path}: descriptor close failed: {error}")\n''',
              'native baseline cleanup',
          )

          replace_once(
              '''        lease = _PrivateReadLease(private_subjects, lease_repo)\n''',
              '''        lease = _PrivateReadLease(\n            private_subjects,\n            lease_repo,\n            use_native_darwin_acl=(accepted_root is not None),\n        )\n''',
              'strict accepted-root native lease activation',
          )

          compile(source, str(orchestrator), 'exec')
          orchestrator.write_text(source)

          real_test = Path('scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py')
          real_source = real_test.read_text()
          old = '        lease = helper._PrivateReadLease((root,), root)\n'
          new = '        lease = helper._PrivateReadLease((root,), root, use_native_darwin_acl=True)\n'
          if real_source.count(old) != 1:
              raise SystemExit('real whole-root lease activation seam moved')
          real_test.write_text(real_source.replace(old, new, 1))

          rollback = Path('scripts/ci/tests/test_capture_private_read_lease_rollback.py')
          rollback_source = rollback.read_text()
          if 'import importlib.util\n' not in rollback_source:
              raise SystemExit('rollback import seam moved')
          rollback_source = rollback_source.replace(
              'import importlib.util\n', 'import importlib.util\nimport os\n', 1
          )
          marker = '\n\nif __name__ == "__main__":\n'
          if rollback_source.count(marker) != 1:
              raise SystemExit('rollback test insertion seam moved')
          regression = r'''

              def test_native_strict_revoke_restores_held_object_after_path_replacement(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-lease-native-revoke-") as temporary:
                      repo, subject = self._subject(temporary)
                      descriptor = os.open(subject, os.O_RDONLY)
                      signature = helper._descriptor_signature(descriptor)
                      lease = helper._PrivateReadLease(
                          (subject,), repo, use_native_darwin_acl=True
                      )
                      events: list[tuple[str, int]] = []
                      listings = iter((
                          "",
                          " 0: user:nembrabuildnative allow read,readattr,readextattr,readsecurity\n",
                      ))

                      with (
                          mock.patch.object(
                              helper,
                              "_lease_paths",
                              return_value=((subject, False, signature, descriptor),),
                          ),
                          mock.patch.object(helper, "_validate_lease_subject_symlinks"),
                          mock.patch.object(
                              helper, "_capture_fd_acl_baseline", return_value=4242
                          ) as capture,
                          mock.patch.object(
                              helper, "_path_acl_listing", side_effect=lambda *_args: next(listings)
                          ),
                          mock.patch.object(helper, "_chmod_acl_path") as grant,
                          mock.patch.object(
                              helper,
                              "_restore_fd_acl_baseline",
                              side_effect=lambda fd, baseline: events.append(("restore", baseline)),
                          ) as restore,
                          mock.patch.object(
                              helper,
                              "_free_fd_acl_baseline",
                              side_effect=lambda baseline: events.append(("free", baseline)),
                          ) as free,
                          mock.patch.object(helper, "_chmod_acl") as legacy_chmod,
                      ):
                          lease.grant("nembrabuildnative")
                          moved = repo / "private.fixture.moved"
                          subject.rename(moved)
                          subject.write_bytes(b"attacker replacement\n")
                          lease.revoke()

                      capture.assert_called_once_with(descriptor)
                      grant.assert_called_once()
                      restore.assert_called_once_with(descriptor, 4242)
                      free.assert_called_once_with(4242)
                      legacy_chmod.assert_not_called()
                      self.assertEqual(events, [("restore", 4242), ("free", 4242)])
                      self.assertEqual(lease._opened, [])
                      self.assertEqual(lease._principal, "")
          '''
          rollback_source = rollback_source.replace(marker, regression + marker, 1)
          compile(rollback_source, str(rollback), 'exec')
          rollback.write_text(rollback_source)
          PY

          /usr/bin/python3 scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          for path in (
              Path('scripts/ci/capture_selected_xcode_build_orchestrator.py'),
              Path('scripts/ci/tests/test_capture_private_read_lease_rollback.py'),
              Path('scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py'),
          ):
              compile(path.read_text(), str(path), 'exec')
          PY
          /usr/bin/git diff --check

      - name: Publish clean production head
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git rm .github/workflows/capture-darwin-native-acl-production-materializer.yml
          changed="$(/usr/bin/git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py | sort)"
          test "$changed" = "$expected"
          /usr/bin/git config user.name 'github-actions[bot]'
          /usr/bin/git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          /usr/bin/git add scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/git commit -m 'fix(capture): restore accepted-root ACL through held fd'
          /usr/bin/git push origin HEAD:repair/v17-capture-darwin-native-acl-production-gpt56sol-20260817
