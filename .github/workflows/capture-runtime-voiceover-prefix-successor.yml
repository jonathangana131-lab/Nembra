name: Capture Runtime VoiceOver Prefix Successor

on:
  pull_request:
    paths:
      - .github/workflows/capture-runtime-voiceover-prefix-successor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-voiceover-prefix:
    name: Exact f557 iPhone 12 VoiceOver prefix-aware matrix
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      BOUNDARY_PARENT_SHA: 124cf01e697b94443201542d118213912b130d4b
      COMPOSED_PRODUCT_SHA: f557f0aa9b9cd7afb2942a48a28a1212a464192f
      PARENT_GENERATED_WITNESS_SHA256: d9c66019a35982ab29f0f379320427dfcb64f86236a154958f84fa62bea80f42
      PREDECESSOR_RUN_ID: '31592551120'
      PREDECESSOR_ARTIFACT_ID: '9140459294'
      PREDECESSOR_ARTIFACT_DIGEST: sha256:0a848e10eee0a38001f85ee0641c0544faa4acacb819cb7964636258a4da4549

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact recovery lineage and regenerate parent witness
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          expected_sha='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$source_sha" = "$expected_sha"
          git cat-file -e "${BOUNDARY_PARENT_SHA}^{commit}"
          git cat-file -e "${COMPOSED_PRODUCT_SHA}^{commit}"
          git merge-base --is-ancestor "$BOUNDARY_PARENT_SHA" HEAD
          git merge-base --is-ancestor "$COMPOSED_PRODUCT_SHA" HEAD
          changed_paths="$(git diff --name-only "$BOUNDARY_PARENT_SHA"...HEAD | LC_ALL=C sort)"
          test "$changed_paths" = '.github/workflows/capture-runtime-voiceover-prefix-successor.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          parent_workflow="$RUNNER_TEMP/capture-runtime-voiceover-boundary-parent.yml"
          witness_source="$RUNNER_TEMP/CaptureRuntimeVoiceOver.source.swift"
          parent_witness="$RUNNER_TEMP/CaptureRuntimeVoiceOver.parent.generated.swift"
          successor_witness="$RUNNER_TEMP/CaptureRuntimeVoiceOver.prefix.generated.swift"
          generator="$RUNNER_TEMP/regenerate-parent-witness.py"

          git show "${BOUNDARY_PARENT_SHA}:.github/workflows/capture-runtime-voiceover-boundary-successor.yml" > "$parent_workflow"
          git show 'dd204e1e943af853e02857db145127810791b04b:scripts/ci/capture_runtime_voiceover_xcuitest.swift' > "$witness_source"

          /usr/bin/python3 - "$parent_workflow" "$generator" <<'PY'
          import pathlib, sys
          workflow = pathlib.Path(sys.argv[1]).read_text()
          output = pathlib.Path(sys.argv[2])
          start = '          /usr/bin/python3 - "$witness_source" "$witness" <<\'PY\'\n'
          end = '\n          PY\n\n          grep -Fq'
          begin = workflow.index(start) + len(start)
          finish = workflow.index(end, begin)
          embedded = workflow[begin:finish]
          lines = embedded.splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('parent generator indentation contract changed')
          generator = '\n'.join(line[10:] for line in lines) + '\n'
          output.write_text(generator)
          PY

          /usr/bin/python3 "$generator" "$witness_source" "$parent_witness"
          parent_hash="$(shasum -a 256 "$parent_witness" | awk '{print $1}')"
          test "$parent_hash" = "$PARENT_GENERATED_WITNESS_SHA256"

          cp "$parent_witness" "$successor_witness"
          /usr/bin/python3 - "$successor_witness" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()

          hero_block = '\n'.join([
              '        XCTAssertTrue(',
              '            app.staticTexts.matching(NSPredicate(format: "label == %@", heroAuthority)).firstMatch.waitForExistence(timeout: 3),',
              '            "The compact sighted hero must retain the full nonlocalized spoken authority restored by the #2990 finding."',
              '        )',
          ])
          hero_guard = '\n'.join([
              hero_block,
              '        XCTAssertEqual(',
              '            app.staticTexts.matching(NSPredicate(format: "label == %@", heroAuthority)).firstMatch.label,',
              '            heroAuthority,',
              '            "Full fail-closed hero semantics must remain exact even when VoiceOver automation returns only a bounded utterance prefix."',
              '        )',
          ])
          if source.count(hero_block) != 1:
              raise SystemExit(f'explicit full hero semantic equality: expected one hero block, found {source.count(hero_block)}')
          source = source.replace(hero_block, hero_guard)

          for phrase in [
              'Bluetooth and physical evidence stay locked',
              'reviewed field build and fresh scooter authority',
          ]:
              needle = f'                "{phrase}",\n'
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f'standard VoiceOver prefix contract for {phrase!r}: expected one isolated speech requirement, found {count}')
              source = source.replace(needle, '')

          if source.count('firstMatch.label') != 1:
              raise SystemExit('full hero semantic equality must exist exactly once')
          if source.count('Bluetooth and physical evidence stay locked') != 1:
              raise SystemExit('full Bluetooth-lock hero authority must remain present exactly once')
          if source.count('reviewed field build and fresh scooter authority') != 1:
              raise SystemExit('full reviewed-build hero authority must remain present exactly once')
          if 'terminalBoundary != nil || successfulMoves >= 64' not in source:
              raise SystemExit('fail-closed terminal-boundary policy was lost')
          if 'classifiedVoiceOverCode3' not in source:
              raise SystemExit('exact Code-3 classifier was lost')
          path.write_text(source)
          PY

          successor_hash="$(shasum -a 256 "$successor_witness" | awk '{print $1}')"
          printf 'NEMBRA_RUNTIME_AX_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          printf 'NEMBRA_RUNTIME_AX_WITNESS=%s\n' "$successor_witness" >> "$GITHUB_ENV"
          printf 'NEMBRA_RUNTIME_AX_PARENT_WITNESS_SHA256=%s\n' "$parent_hash" >> "$GITHUB_ENV"
          printf 'NEMBRA_RUNTIME_AX_WITNESS_SHA256=%s\n' "$successor_hash" >> "$GITHUB_ENV"

      - name: Record exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            xcodebuild -version
            sw_vers
            xcrun simctl version || true
          } > "$RUNNER_TEMP/CaptureRuntimeVoiceOver.toolchain.txt" 2>&1
          test -s "$RUNNER_TEMP/CaptureRuntimeVoiceOver.toolchain.txt"

      - name: Build exact public-unprovisioned standalone Capture app
        shell: bash
        run: |
          set -euo pipefail
          procedure='ES80-AUTHENTICATED-STATIONARY-v1'
          label="capture-v14-${NEMBRA_RUNTIME_AX_SOURCE_SHA:0:12}"
          rm -rf /tmp/NembraCaptureRuntimeAXDerived
          xcodebuild -project NembraCapture.xcodeproj -scheme 'Nembra Capture' -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureRuntimeAXDerived CODE_SIGNING_ALLOWED=NO \
            NEMBRA_CAPTURE_BUILD_IDENTIFIER="$label" \
            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$NEMBRA_RUNTIME_AX_SOURCE_SHA" \
            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="" \
            NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER="$procedure" build
          plist='/tmp/NembraCaptureRuntimeAXDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app/Info.plist'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = 'com.jonathangana131.nembra.capturelearn'
          test "$(plutil -extract NembraCaptureBuildIdentifier raw -o - "$plist")" = "$label"
          test "$(plutil -extract NembraCaptureSourceCommitSHA raw -o - "$plist")" = "$NEMBRA_RUNTIME_AX_SOURCE_SHA"
          test "$(plutil -extract NembraCaptureProcedureIdentifier raw -o - "$plist")" = "$procedure"
          test -z "$(plutil -extract NembraCaptureTuyaDependencyLockSHA256 raw -o - "$plist" 2>/dev/null || true)"

      - name: Create exact iPhone 12 iOS 27 baseline and inject successor witness
        shell: bash
        run: |
          set -euo pipefail
          runtime="$({ xcrun simctl list runtimes -j | /usr/bin/python3 -c '
          import json,sys
          rows=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable", True) and str(r.get("identifier", "")).startswith("com.apple.CoreSimulator.SimRuntime.iOS-27")]
          if not rows: raise SystemExit(1)
          rows.sort(key=lambda r: tuple(int(p) for p in str(r.get("version","0")).split(".") if p.isdigit()), reverse=True)
          print(rows[0]["identifier"])
          '; } 2>/dev/null)"
          device_type="$({ xcrun simctl list devicetypes -j | /usr/bin/python3 -c '
          import json,sys
          for row in json.load(sys.stdin)["devicetypes"]:
              if row.get("name") == "iPhone 12": print(row["identifier"]); raise SystemExit(0)
          raise SystemExit(1)
          '; } 2>/dev/null)"
          test "$device_type" = 'com.apple.CoreSimulator.SimDeviceType.iPhone-12'
          udid="$(xcrun simctl create "Nembra Capture VoiceOver Prefix ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$device_type" "$runtime")"
          printf 'NEMBRA_RUNTIME_AX_UDID=%s\n' "$udid" >> "$GITHUB_ENV"
          printf 'NEMBRA_RUNTIME_AX_RUNTIME=%s\n' "$runtime" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl ui "$udid" content_size large
          xcrun simctl install "$udid" '/tmp/NembraCaptureRuntimeAXDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app'
          test -f NembraUITests/NembraUITests.swift
          printf '\n' >> NembraUITests/NembraUITests.swift
          cat "$NEMBRA_RUNTIME_AX_WITNESS" >> NembraUITests/NembraUITests.swift
          git diff --check -- NembraUITests/NembraUITests.swift

      - name: Run exact Standard and Accessibility XXXL contracts
        shell: bash
        run: |
          set -euo pipefail
          bundle='com.jonathangana131.nembra.capturelearn'
          rm -rf /tmp/NembraRuntimeVoiceOverUITests
          for state in standard ax5; do
            if [[ "$state" == standard ]]; then
              size='large'
              test_id='testStandaloneCaptureStandardVoiceOverPreservesFirstFoldAuthority'
            else
              size='accessibility-extra-extra-extra-large'
              test_id='testStandaloneCaptureAccessibilityXXXLVoiceOverRemainsActionFirst'
            fi
            result="$RUNNER_TEMP/CaptureRuntimeVoiceOver.${state}.xcresult"
            rm -rf "$result"
            xcrun simctl ui "$NEMBRA_RUNTIME_AX_UDID" content_size "$size"
            xcrun simctl terminate "$NEMBRA_RUNTIME_AX_UDID" "$bundle" >/dev/null 2>&1 || true
            set +e
            xcodebuild test -project Nembra.xcodeproj -scheme Nembra -configuration Debug \
              -destination "platform=iOS Simulator,id=$NEMBRA_RUNTIME_AX_UDID" \
              -derivedDataPath /tmp/NembraRuntimeVoiceOverUITests \
              -resultBundlePath "$result" CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
              -only-testing:NembraUITests/CaptureRuntimeVoiceOverUITests/"$test_id"
            status=$?
            set -e
            printf '%s\n' "$status" > "$RUNNER_TEMP/CaptureRuntimeVoiceOver.${state}.exit-status.txt"
          done
          test "$(cat "$RUNNER_TEMP/CaptureRuntimeVoiceOver.standard.exit-status.txt")" = 0
          test "$(cat "$RUNNER_TEMP/CaptureRuntimeVoiceOver.ax5.exit-status.txt")" = 0

      - name: Seal exact simulator-only prefix evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/CaptureRuntimeVoiceOverPrefixEvidence"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/CaptureRuntimeVoiceOver.toolchain.txt" "$evidence/"
          cp "$NEMBRA_RUNTIME_AX_WITNESS" "$evidence/generated-runtime-witness.swift"
          for state in standard ax5; do
            result="$RUNNER_TEMP/CaptureRuntimeVoiceOver.${state}.xcresult"
            test -d "$result"
            xcrun xcresulttool get test-results tests --path "$result" --compact > "$evidence/${state}.tests.json"
            xcrun xcresulttool get object --legacy --path "$result" --format json > "$evidence/${state}.legacy-root.json"
            cp "$RUNNER_TEMP/CaptureRuntimeVoiceOver.${state}.exit-status.txt" "$evidence/"
            ditto -c -k --sequesterRsrc --keepParent "$result" "$evidence/${state}.xcresult.zip"
          done

          /usr/bin/python3 - "$evidence" <<'PY'
          import hashlib, json, os, pathlib, sys
          evidence = pathlib.Path(sys.argv[1])
          ids = {
              'standard': 'testStandaloneCaptureStandardVoiceOverPreservesFirstFoldAuthority',
              'ax5': 'testStandaloneCaptureAccessibilityXXXLVoiceOverRemainsActionFirst',
          }
          states = []
          for state, needle in ids.items():
              tests = json.loads((evidence / f'{state}.tests.json').read_text())
              legacy = json.loads((evidence / f'{state}.legacy-root.json').read_text())
              count = int(legacy['metrics']['testsCount']['_value'])
              if count != 1:
                  raise SystemExit(f'{state}: expected exactly one executed test, got {count}')
              strings = []
              def walk(value):
                  if isinstance(value, dict):
                      for child in value.values(): walk(child)
                  elif isinstance(value, list):
                      for child in value: walk(child)
                  elif isinstance(value, str):
                      strings.append(value)
              walk(tests)
              if not any(needle in value for value in strings):
                  raise SystemExit(f'{state}: target test identity missing')
              status = int((evidence / f'CaptureRuntimeVoiceOver.{state}.exit-status.txt').read_text())
              states.append({
                  'state': state,
                  'targetedTestIdentifier': needle,
                  'executedTestCount': count,
                  'xcodebuildExitStatus': status,
                  'xcresultZipSHA256': hashlib.sha256((evidence / f'{state}.xcresult.zip').read_bytes()).hexdigest(),
              })
          manifest = {
              'schemaVersion': 7,
              'authority': 'capture-runtime-accessibility-simulator-only',
              'sourceCommitSHA': os.environ['NEMBRA_RUNTIME_AX_SOURCE_SHA'],
              'boundaryParentSHA': os.environ['BOUNDARY_PARENT_SHA'],
              'composedProductParentSHA': os.environ['COMPOSED_PRODUCT_SHA'],
              'productSourceBytesChangedFromComposedParent': False,
              'baselineDevice': 'iPhone 12',
              'baselineOS': 'iOS 27',
              'simulatorRuntime': os.environ['NEMBRA_RUNTIME_AX_RUNTIME'],
              'captureBundleIdentifier': 'com.jonathangana131.nembra.capturelearn',
              'parentGeneratedWitnessSHA256': os.environ['NEMBRA_RUNTIME_AX_PARENT_WITNESS_SHA256'],
              'generatedWitnessSHA256': os.environ['NEMBRA_RUNTIME_AX_WITNESS_SHA256'],
              'predecessorRunID': int(os.environ['PREDECESSOR_RUN_ID']),
              'predecessorArtifactID': int(os.environ['PREDECESSOR_ARTIFACT_ID']),
              'predecessorArtifactDigest': os.environ['PREDECESSOR_ARTIFACT_DIGEST'],
              'retainedFinding': 'standard VoiceOver automation returned multiple long utterances at exactly 64 characters before terminal Code-3; full hero semantic label remained separately hierarchy-addressable',
              'standardLongHeroPolicy': 'exact full accessibility label equality plus VoiceOver-reachable prefix and ordered downstream semantics',
              'voiceOverBoundaryPolicy': 'exact retained Code-3 shapes only; zero startup speech fails; terminal boundary accepted only after all required reachable phrases',
              'states': states,
              'visualEvidenceRequiredSeparatelyForSightedGlyphGeometry': True,
              'physicalAuthorityCreated': False,
              'protocolAuthorityCreated': False,
          }
          (evidence / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          if any(state['xcodebuildExitStatus'] != 0 for state in states):
              raise SystemExit('runtime matrix not green')
          PY

      - name: Upload retained prefix evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nembra-capture-runtime-voiceover-prefix-f557-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/CaptureRuntimeVoiceOverPrefixEvidence
          if-no-files-found: error
          retention-days: 14

      - name: Delete temporary Simulator
        if: always()
        shell: bash
        run: |
          if [[ -n "${NEMBRA_RUNTIME_AX_UDID:-}" ]]; then
            xcrun simctl shutdown "$NEMBRA_RUNTIME_AX_UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$NEMBRA_RUNTIME_AX_UDID" >/dev/null 2>&1 || true
          fi
