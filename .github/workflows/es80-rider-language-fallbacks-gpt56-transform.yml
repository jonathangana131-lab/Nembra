name: ES80 rider language transform

on:
  push:
    branches:
      - product/es80-v14-rider-language-fallbacks-gpt56
    paths:
      - .github/workflows/es80-rider-language-fallbacks-gpt56-transform.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/es80-v14-rider-language-fallbacks-gpt56
          fetch-depth: 0
      - name: Apply reviewed product copy transform
        run: python3 scripts/ci/es80_rider_language_fallbacks_gpt56_transform.py
      - name: Validate generated source
        run: |
          git diff --check
          grep -F 'Keep unplugged for the whole capture' NembraApp/App/NembraApp.swift
          grep -F 'healthItem("DISCOVERY"' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'healthItem("SEAL"' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -F 'rendered helper and fallback copy stays rider-first' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift
      - name: Commit product checkpoint and remove temporary construction files
        env:
          TARGET_BRANCH: product/es80-v14-rider-language-fallbacks-gpt56
        run: |
          rm .github/workflows/es80-rider-language-fallbacks-gpt56-transform.yml
          rm scripts/ci/es80_rider_language_fallbacks_gpt56_transform.py
          git config user.name "nembra-gpt56-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraApp.swift \
                  NembraApp/Features/Research/ES80CaptureShellView.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureStationaryPreflightRiderLanguageAcceptanceTests.swift \
                  .github/workflows/es80-rider-language-fallbacks-gpt56-transform.yml \
                  scripts/ci/es80_rider_language_fallbacks_gpt56_transform.py
          git commit -m "[Capture product v14] Finish human-first field language"
          git push origin "HEAD:${TARGET_BRANCH}"
