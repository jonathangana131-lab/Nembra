name: Capture private path custody recovery

on:
  push:
    branches:
      - agent/capture-private-path-custody-recovery-v14

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact current-spine parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f7acab6842c5a3b3a0d2caaa5e664215e1655a4f"

      - name: Recover stronger private-path custody on current API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner = Path("scripts/ci/es80_signed_field_artifact_private_runner.py")
          tests = Path("scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py")

          source = runner.read_text(encoding="utf-8")
          start = source.index("def require_external_private_input")
          end = source.index("\n\nMAX_INSPECTOR_SOURCE_BYTES", start)
          replacement = r'''def _repository_directory_identity(repository_root: Path) -> tuple[int, int]:
              """Resolve only the trusted repository root and return its directory identity."""
              try:
                  resolved_repository = repository_root.resolve(strict=True)
                  metadata = os.stat(resolved_repository)
              except OSError as exc:
                  raise PrivateInputError("could not resolve intended-device verification privacy boundary") from exc
              if not stat.S_ISDIR(metadata.st_mode):
                  raise PrivateInputError("repository privacy boundary must resolve to one directory")
              return metadata.st_dev, metadata.st_ino


          def _open_private_identifier_without_symlink_components(path: Path, repository_root: Path) -> int:
              """Open one external canonical path while refusing symlinks in every caller component."""
              if (
                  not hasattr(os, "O_NOFOLLOW")
                  or not hasattr(os, "O_DIRECTORY")
                  or os.open not in os.supports_dir_fd
              ):
                  raise PrivateInputError("this platform cannot enforce component-wise no-follow private input")
              if not path.is_absolute() or path.anchor != os.sep:
                  raise PrivateInputError("intended-device verification file path must be one canonical absolute path")

              components = path.parts[1:]
              if not components or any(component in ("", ".", "..") for component in components):
                  raise PrivateInputError("intended-device verification file path is not canonical")

              repository_identity = _repository_directory_identity(repository_root)
              close_on_exec = os.O_CLOEXEC if hasattr(os, "O_CLOEXEC") else 0
              directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | close_on_exec
              file_flags = os.O_RDONLY | os.O_NOFOLLOW | close_on_exec

              try:
                  parent_descriptor = os.open(os.sep, directory_flags)
              except OSError as exc:
                  raise PrivateInputError("private verification path root could not be opened safely") from exc

              try:
                  root_metadata = os.fstat(parent_descriptor)
                  if (root_metadata.st_dev, root_metadata.st_ino) == repository_identity:
                      raise PrivateInputError("intended-device verification file must live outside the Nembra repository")

                  for component in components[:-1]:
                      try:
                          next_descriptor = os.open(component, directory_flags, dir_fd=parent_descriptor)
                      except OSError as exc:
                          raise PrivateInputError(
                              "intended-device verification path contains an unsafe directory component"
                          ) from exc

                      next_metadata = os.fstat(next_descriptor)
                      if (next_metadata.st_dev, next_metadata.st_ino) == repository_identity:
                          os.close(next_descriptor)
                          raise PrivateInputError(
                              "intended-device verification file must live outside the Nembra repository"
                          )
                      os.close(parent_descriptor)
                      parent_descriptor = next_descriptor

                  try:
                      return os.open(components[-1], file_flags, dir_fd=parent_descriptor)
                  except OSError as exc:
                      raise PrivateInputError(
                          "intended-device verification file is not a readable regular non-symlink file"
                      ) from exc
              finally:
                  os.close(parent_descriptor)


          def read_private_identifier(path: Path, repository_root: Path) -> str:
              """Read one external opaque identifier through one stable component-wise no-follow descriptor."""
              descriptor = _open_private_identifier_without_symlink_components(path, repository_root)

              try:
                  metadata = os.fstat(descriptor)
                  if not stat.S_ISREG(metadata.st_mode):
                      raise PrivateInputError("intended-device verification input must be one regular file")
                  if metadata.st_size < 1 or metadata.st_size > MAX_IDENTIFIER_BYTES:
                      raise PrivateInputError("intended-device verification input has an invalid bounded size")
                  if metadata.st_mode & 0o077:
                      raise PrivateInputError("intended-device verification file must not be accessible by group/other")
                  if hasattr(os, "geteuid") and metadata.st_uid != os.geteuid():
                      raise PrivateInputError("intended-device verification file must be owned by the current user")
                  if metadata.st_nlink != 1:
                      raise PrivateInputError("intended-device verification file must have exactly one hard link")

                  with os.fdopen(descriptor, "rb", closefd=False) as handle:
                      raw = handle.read(MAX_IDENTIFIER_BYTES + 1)
                  final_metadata = os.fstat(descriptor)
                  if (
                      len(raw) != metadata.st_size
                      or _stable_file_identity(final_metadata) != _stable_file_identity(metadata)
                  ):
                      raise PrivateInputError("intended-device verification file changed while being read")
              finally:
                  os.close(descriptor)

              try:
                  value = raw.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise PrivateInputError("intended-device verification input must be valid UTF-8") from exc

              if not value or value != value.strip():
                  raise PrivateInputError("intended-device verification input must be one exact nonblank value")
              if any(ord(character) < 33 or ord(character) == 127 for character in value):
                  raise PrivateInputError("intended-device verification input contains a forbidden character")
              if len(value.encode("utf-8")) > MAX_IDENTIFIER_BYTES:
                  raise PrivateInputError("intended-device verification input exceeds the bounded size")
              if value in os.fspath(path):
                  raise PrivateInputError("intended-device verification file path must not contain the raw identifier")
              return value
          '''
          # Strip the indentation used only to keep this YAML readable.
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines())
          source = source[:start] + replacement + source[end:]

          old_identity = '''def _stable_file_identity(metadata: os.stat_result) -> tuple[int, int, int, int, int, int, int, int]:\n    """Return descriptor metadata whose change makes a verification read non-stable."""\n    return (\n        metadata.st_dev,\n        metadata.st_ino,\n        metadata.st_mode,\n        metadata.st_uid,\n        metadata.st_gid,\n        metadata.st_size,\n        metadata.st_mtime_ns,\n        metadata.st_ctime_ns,\n    )\n'''
          new_identity = '''def _stable_file_identity(metadata: os.stat_result) -> tuple[int, int, int, int, int, int, int, int, int]:\n    """Return descriptor metadata whose change makes a verification read non-stable."""\n    return (\n        metadata.st_dev,\n        metadata.st_ino,\n        metadata.st_mode,\n        metadata.st_uid,\n        metadata.st_gid,\n        metadata.st_nlink,\n        metadata.st_size,\n        metadata.st_mtime_ns,\n        metadata.st_ctime_ns,\n    )\n'''
          if source.count(old_identity) != 1:
              raise SystemExit("stable identity contract moved unexpectedly")
          source = source.replace(old_identity, new_identity, 1)

          old_root = '        root = Path(temporary)\n        repository_root = root / "repository"\n'
          new_root = '        root = Path(temporary).resolve(strict=True)\n        repository_root = root / "repository"\n'
          if source.count(old_root) != 1:
              raise SystemExit("self-test fixture root moved unexpectedly")
          source = source.replace(old_root, new_root, 1)

          anchor = '''        relative_private_file = Path("device-id")\n        try:\n            read_private_identifier(relative_private_file, repository_root)\n        except PrivateInputError:\n            pass\n        else:\n            raise AssertionError("relative verification input path must fail closed")\n\n'''
          extra = '''        relative_private_file = Path("device-id")\n        try:\n            read_private_identifier(relative_private_file, repository_root)\n        except PrivateInputError:\n            pass\n        else:\n            raise AssertionError("relative verification input path must fail closed")\n\n        identifier_named_file = root / expected\n        identifier_named_file.write_text(expected, encoding="utf-8")\n        identifier_named_file.chmod(0o600)\n        try:\n            read_private_identifier(identifier_named_file, repository_root)\n        except PrivateInputError:\n            pass\n        else:\n            raise AssertionError("verification input path containing the raw identifier must fail closed")\n\n        real_parent = root / "real-parent"\n        real_parent.mkdir()\n        ancestor_file = real_parent / "device-id"\n        ancestor_file.write_text(expected, encoding="utf-8")\n        ancestor_file.chmod(0o600)\n        symlink_parent = root / "symlink-parent"\n        try:\n            symlink_parent.symlink_to(real_parent, target_is_directory=True)\n        except (OSError, NotImplementedError):\n            symlink_parent = None\n        if symlink_parent is not None:\n            try:\n                read_private_identifier(symlink_parent / "device-id", repository_root)\n            except PrivateInputError:\n                pass\n            else:\n                raise AssertionError("symlinked verification-input ancestor must fail closed")\n\n        hardlink_file = root / "hardlink-source"\n        hardlink_file.write_text(expected, encoding="utf-8")\n        hardlink_file.chmod(0o600)\n        hardlink_alias = root / "hardlink-alias"\n        try:\n            os.link(hardlink_file, hardlink_alias)\n        except OSError:\n            hardlink_alias = None\n        if hardlink_alias is not None:\n            try:\n                read_private_identifier(hardlink_file, repository_root)\n            except PrivateInputError:\n                pass\n            else:\n                raise AssertionError("multiply-linked verification input must fail closed")\n\n'''
          if source.count(anchor) != 1:
              raise SystemExit("self-test insertion point moved unexpectedly")
          source = source.replace(anchor, extra, 1)
          runner.write_text(source, encoding="utf-8")

          test_source = tests.read_text(encoding="utf-8")
          test_source = test_source.replace("self.assertIn('require_external_private_input(path, repository_root)', runner)\n", "self.assertIn('_open_private_identifier_without_symlink_components(path, repository_root)', runner)\n")
          test_source = test_source.replace("self.assertIn('os.path.commonpath([path_text, repository_text]) == repository_text', runner)\n", "self.assertIn('(next_metadata.st_dev, next_metadata.st_ino) == repository_identity', runner)\n")

          old_comment = '''        # The verification value is read only inside the runner after a no-follow descriptor open.\n        # It must never become an OS-visible child-process argument or environment value.\n        self.assertIn('os.O_NOFOLLOW', runner)\n        self.assertIn('os.fstat(descriptor)', runner)\n        self.assertIn('metadata.st_uid != os.geteuid()', runner)\n'''
          new_comment = '''        # The verification value is read only after each caller path component is opened without\n        # following symlinks. The accepted file must remain external, singly linked, and private.\n        self.assertIn('os.O_NOFOLLOW', runner)\n        self.assertIn('os.O_DIRECTORY', runner)\n        self.assertIn('os.open not in os.supports_dir_fd', runner)\n        self.assertIn('dir_fd=parent_descriptor', runner)\n        self.assertIn('os.fstat(descriptor)', runner)\n        self.assertIn('metadata.st_uid != os.geteuid()', runner)\n        self.assertIn('metadata.st_nlink != 1', runner)\n        self.assertIn('value in os.fspath(path)', runner)\n'''
          if test_source.count(old_comment) != 1:
              raise SystemExit("intended-device source-contract comment moved unexpectedly")
          test_source = test_source.replace(old_comment, new_comment, 1)

          # macOS temp roots may be spelled through /var or /tmp symlinks. Resolve only the fixture
          # root so the test does not accidentally exercise an OS alias rather than its intended case.
          test_source = test_source.replace('private_file = Path(temporary) / "device-id"', 'private_file = Path(temporary).resolve(strict=True) / "device-id"')

          simple_ns = '''                    st_gid=metadata.st_gid,\n                    st_size=metadata.st_size,\n'''
          if test_source.count(simple_ns) != 1:
              raise SystemExit("same-size mutation metadata fixture moved unexpectedly")
          test_source = test_source.replace(simple_ns, '''                    st_gid=metadata.st_gid,\n                    st_nlink=metadata.st_nlink,\n                    st_size=metadata.st_size,\n''', 1)

          insertion = '''            self.assertEqual(call_count, 2)\n\n\nif __name__ == "__main__":\n'''
          added_tests = '''            self.assertEqual(call_count, 2)\n\n    def test_symlinked_ancestor_directory_fails_closed(self) -> None:\n        runner = load_private_runner()\n        expected = "00008101-001234567890001E"\n        with tempfile.TemporaryDirectory(prefix="nembra-private-ancestor-test-") as temporary:\n            root = Path(temporary).resolve(strict=True)\n            real_parent = root / "real-parent"\n            real_parent.mkdir()\n            private_file = real_parent / "device-id"\n            private_file.write_text(expected, encoding="utf-8")\n            private_file.chmod(0o600)\n            symlink_parent = root / "symlink-parent"\n            symlink_parent.symlink_to(real_parent, target_is_directory=True)\n            with self.assertRaisesRegex(runner.PrivateInputError, "unsafe directory component"):\n                runner.read_private_identifier(symlink_parent / "device-id", REPOSITORY_ROOT)\n\n    def test_multiply_linked_private_input_fails_closed(self) -> None:\n        runner = load_private_runner()\n        expected = "00008101-001234567890001E"\n        with tempfile.TemporaryDirectory(prefix="nembra-private-hardlink-test-") as temporary:\n            root = Path(temporary).resolve(strict=True)\n            private_file = root / "device-id"\n            private_file.write_text(expected, encoding="utf-8")\n            private_file.chmod(0o600)\n            alias = root / "device-id-alias"\n            os.link(private_file, alias)\n            with self.assertRaisesRegex(runner.PrivateInputError, "exactly one hard link"):\n                runner.read_private_identifier(private_file, REPOSITORY_ROOT)\n\n    def test_visible_private_path_cannot_contain_raw_identifier(self) -> None:\n        runner = load_private_runner()\n        expected = "00008101-001234567890001E"\n        with tempfile.TemporaryDirectory(prefix="nembra-private-path-test-") as temporary:\n            root = Path(temporary).resolve(strict=True)\n            private_file = root / expected\n            private_file.write_text(expected, encoding="utf-8")\n            private_file.chmod(0o600)\n            with self.assertRaisesRegex(runner.PrivateInputError, "path must not contain the raw identifier"):\n                runner.read_private_identifier(private_file, REPOSITORY_ROOT)\n\n\nif __name__ == "__main__":\n'''
          if test_source.count(insertion) != 1:
              raise SystemExit("intended-device regression insertion point moved unexpectedly")
          test_source = test_source.replace(insertion, added_tests, 1)
          tests.write_text(test_source, encoding="utf-8")
          PY

      - name: Validate recovered private-path contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_private_runner.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          git diff --check

      - name: Commit product recovery and remove transformer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-capture-private-path-custody-recovery.yml
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/es80_signed_field_artifact_private_runner.py \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py \
                  .github/workflows/zz-capture-private-path-custody-recovery.yml
          git diff --cached --check
          git commit -m "fix(capture): close private path alias custody"
          git push origin HEAD:agent/capture-private-path-custody-recovery-v14
