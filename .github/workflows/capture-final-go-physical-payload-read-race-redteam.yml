name: Capture Final GO Physical Payload Read Race Red Team

on:
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_private_review_final_go.py
      - scripts/ci/tests/test_es80_final_go_physical_payload_read_race.py
      - .github/workflows/capture-final-go-physical-payload-read-race-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-payload-read-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact diagnostic checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Require descriptor-bound physical tracked-file reads
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_es80_final_go_physical_payload_read_race.py
          /usr/bin/python3 -I scripts/ci/tests/test_es80_final_go_physical_payload_read_race.py
          git diff --check
