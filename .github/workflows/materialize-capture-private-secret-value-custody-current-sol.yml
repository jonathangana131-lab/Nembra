name: Materialize Capture Private Secret Value Custody Current Sol

on:
  push:
    branches:
      - "fix/v14-capture-private-secret-value-custody-current-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact product parent
        shell: bash
        run: |
          set -euo pipefail
          expected="c38cb8f4c66ec1e1e8f6cdbe7fb77955daf18b5e"
          test "$(git rev-parse HEAD^)" = "$expected" || {
            echo "Expected parent $expected, got $(git rev-parse HEAD^)" >&2
            exit 1
          }

      - name: Materialize exact-value custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text(encoding="utf-8")
          class_start = source.index("@MainActor\nprivate final class SmartLifeDriver")
          class_end = source.index("}\n#endif\n\nprivate enum AppleAccountAuthorizationError", class_start) + 2
          driver = source[class_start:class_end]

          callback_start = driver.index("    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {")
          callback_end = driver.index("    private static let secretKeyFragments = [", callback_start)
          old_callback = driver[callback_start:callback_end]
          new_callback = '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              guard let dps, !dps.isEmpty else { return }
              let exactSecretValues = Self.exactSecretValues
              var sanitized: [String: String] = [:]
              sanitized.reserveCapacity(dps.count)
              for (key, value) in dps {
                  let keyString = String(describing: key)
                  let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }
                  let baseCustodyKey = Self.redactExactApplicationSecretValues(
                      in: keyString,
                      exactSecretValues: exactSecretValues
                  )
                  let custodyKey = Self.uniqueCustodyKey(baseCustodyKey, existing: sanitized)
                  if Self.secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {
                      sanitized[custodyKey] = "<redacted>"
                  } else {
                      let keySanitizedValue = Self.redactApplicationSecrets(
                          value,
                          exactSecretValues: exactSecretValues
                      )
                      sanitized[custodyKey] = Self.redactExactApplicationSecretValues(
                          in: String(describing: keySanitizedValue),
                          exactSecretValues: exactSecretValues
                      )
                  }
              }
              onApplicationUpdate?(sanitized)
          }

          '''
          driver = driver[:callback_start] + new_callback + driver[callback_end:]

          sanitizer_start = driver.index("    private static func redactApplicationSecrets(_ object: Any) -> Any {")
          old_sanitizer = driver[sanitizer_start:-2]
          new_sanitizer = '''    private static var exactSecretValues: [String] {
          #if canImport(NembraTuyaPrivateConfig)
              return [
                  NembraTuyaPrivateIdentity.appKey,
                  NembraTuyaPrivateIdentity.appSecret,
              ]
              .filter { !$0.isEmpty }
              .sorted {
                  if $0.count != $1.count { return $0.count > $1.count }
                  return $0 < $1
              }
          #else
              return []
          #endif
          }

          private static func redactExactApplicationSecretValues(
              in rendered: String,
              exactSecretValues: [String]
          ) -> String {
              exactSecretValues.reduce(rendered) { partial, secret in
                  partial.replacingOccurrences(
                      of: secret,
                      with: "<redacted-private-application-secret>",
                      options: [.literal]
                  )
              }
          }

          private static func uniqueCustodyKey(
              _ baseKey: String,
              existing: [String: String]
          ) -> String {
              guard existing[baseKey] != nil else { return baseKey }
              var ordinal = 2
              while existing["\\(baseKey)#\\(ordinal)"] != nil {
                  ordinal += 1
              }
              return "\\(baseKey)#\\(ordinal)"
          }

          private static func redactApplicationSecrets(
              _ object: Any,
              exactSecretValues: [String]
          ) -> Any {
              if let dictionary = object as? [AnyHashable: Any] {
                  var sanitized: [String: Any] = [:]
                  sanitized.reserveCapacity(dictionary.count)
                  for (key, value) in dictionary {
                      let keyString = String(describing: key)
                      let normalizedKey = keyString.lowercased().filter { $0.isLetter || $0.isNumber }
                      let baseCustodyKey = redactExactApplicationSecretValues(
                          in: keyString,
                          exactSecretValues: exactSecretValues
                      )
                      var custodyKey = baseCustodyKey
                      var collisionOrdinal = 2
                      while sanitized[custodyKey] != nil {
                          custodyKey = "\\(baseCustodyKey)#\\(collisionOrdinal)"
                          collisionOrdinal += 1
                      }
                      if secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {
                          sanitized[custodyKey] = "<redacted>"
                      } else {
                          sanitized[custodyKey] = redactApplicationSecrets(
                              value,
                              exactSecretValues: exactSecretValues
                          )
                      }
                  }
                  return sanitized
              }
              if let array = object as? [Any] {
                  return array.map {
                      redactApplicationSecrets($0, exactSecretValues: exactSecretValues)
                  }
              }
              let rendered = String(describing: object)
              let redacted = redactExactApplicationSecretValues(
                  in: rendered,
                  exactSecretValues: exactSecretValues
              )
              return redacted == rendered ? object : redacted
          }
          '''
          driver = driver[:sanitizer_start] + new_sanitizer + "}\n"
          source = source[:class_start] + driver + source[class_end:]
          path.write_text(source, encoding="utf-8")

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift")
          if test_path.exists():
              raise SystemExit(f"Refusing to overwrite existing {test_path}")
          test_path.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application private secret-value custody")
          struct TuyaApplicationSecretValueCustodySourceTests {
              @Test("compiled AppKey and AppSecret participate in exact value redaction")
              func privateApplicationIdentityIsValueBoundBeforeEventCustody() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))
                  let callback = String(try section(
                      in: driver,
                      from: "func device(_ device: ThingSmartDevice?, dpsUpdate",
                      to: "private static let secretKeyFragments"
                  ))

                  #expect(driver.contains("private static var exactSecretValues: [String]"))
                  #expect(driver.contains("NembraTuyaPrivateIdentity.appKey"))
                  #expect(driver.contains("NembraTuyaPrivateIdentity.appSecret"))
                  #expect(driver.contains(".filter { !$0.isEmpty }"))
                  #expect(driver.contains("if $0.count != $1.count { return $0.count > $1.count }"))
                  #expect(driver.contains("private static func redactExactApplicationSecretValues("))
                  #expect(driver.contains("options: [.literal]"))
                  #expect(driver.contains("<redacted-private-application-secret>"))
                  #expect(callback.contains("let exactSecretValues = Self.exactSecretValues"))
                  #expect(callback.contains("Self.redactApplicationSecrets("))
                  #expect(callback.contains("exactSecretValues: exactSecretValues"))
                  #expect(!callback.contains("String(describing: Self.redactApplicationSecrets(value))"))
              }

              @Test("exact private values are scrubbed from opaque keys and nested scalar descriptions")
              func exactSecretsCannotHideBehindInnocuousSDKKeys() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))

                  #expect(driver.contains("in: keyString"))
                  #expect(driver.contains("let rendered = String(describing: object)"))
                  #expect(driver.contains("redacted == rendered ? object : redacted"))
                  #expect(driver.contains("return array.map"))
                  #expect(driver.contains("while sanitized[custodyKey] != nil"))
                  #expect(driver.contains("uniqueCustodyKey"))
              }

              @Test("credential-shaped key redaction remains intact")
              func keyBasedCredentialRedactionIsPreserved() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))
                  for fragment in [
                      "localkey", "sessionkey", "appkey", "appsecret", "password",
                      "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey",
                  ] {
                      #expect(driver.contains("\"\(fragment)\""))
                  }
                  #expect(driver.contains("secretKeyFragments.contains"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start),
                        let b = source.range(of: end, range: a.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[a.lowerBound..<b.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let root = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: root.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          ''', encoding="utf-8")
          PY

      - name: Validate source and adversarial behavior
        shell: bash
        run: |
          set -euo pipefail
          app="NembraApp/App/NembraCaptureEntrypoint.swift"
          test_file="Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift"
          swiftc -frontend -parse "$app"
          swiftc -frontend -parse "$test_file"
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")
          start = s.index("@MainActor\nprivate final class SmartLifeDriver")
          end = s.index("#endif\n\nprivate enum AppleAccountAuthorizationError", start)
          d = s[start:end]
          required = [
              "NembraTuyaPrivateIdentity.appKey",
              "NembraTuyaPrivateIdentity.appSecret",
              "private static var exactSecretValues: [String]",
              ".filter { !$0.isEmpty }",
              "if $0.count != $1.count { return $0.count > $1.count }",
              "options: [.literal]",
              "<redacted-private-application-secret>",
              "let exactSecretValues = Self.exactSecretValues",
              "let rendered = String(describing: object)",
              "uniqueCustodyKey",
              "while sanitized[custodyKey] != nil",
          ]
          missing = [x for x in required if x not in d]
          if missing:
              raise SystemExit(f"missing secret custody invariants: {missing}")
          if "sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))" in d:
              raise SystemExit("unsafe key-only callback rendering remains")
          for fragment in ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey"]:
              if f'"{fragment}"' not in d:
                  raise SystemExit(f"lost credential key classifier: {fragment}")
          print("Private application secret-value source invariants: PASS")
          PY

          cat > /tmp/private_secret_probe.swift <<'SWIFT'
          import Foundation

          func redact(_ rendered: String, secrets: [String]) -> String {
              secrets.reduce(rendered) { partial, secret in
                  partial.replacingOccurrences(of: secret, with: "<redacted>", options: [.literal])
              }
          }
          let appKey = "KEY-123"
          let appSecret = "KEY-123-SECRET-SUFFIX"
          let secrets = [appKey, appSecret]
              .filter { !$0.isEmpty }
              .sorted {
                  if $0.count != $1.count { return $0.count > $1.count }
                  return $0 < $1
              }
          let opaque = redact("17=KEY-123-SECRET-SUFFIX", secrets: secrets)
          precondition(!opaque.contains(appKey))
          precondition(!opaque.contains(appSecret))
          precondition(!opaque.contains("SECRET-SUFFIX"))
          let nested = redact("[\"73\": [\"value\": \"prefix KEY-123 suffix\"]]", secrets: secrets)
          precondition(!nested.contains(appKey))
          precondition(redact("ordinary-value", secrets: secrets) == "ordinary-value")
          let caseVariant = redact("key-123", secrets: secrets)
          precondition(caseVariant == "key-123")
          SWIFT
          swift /tmp/private_secret_probe.swift
          git diff --check

      - name: Commit clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          product="c38cb8f4c66ec1e1e8f6cdbe7fb77955daf18b5e"
          rm .github/workflows/materialize-capture-private-secret-value-custody-current-sol.yml
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$product" | sort)
          expected=(
            "NembraApp/App/NembraCaptureEntrypoint.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}" || {
            printf 'Unexpected effective paths:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          }
          git config user.name "Nembra V14 Sol"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): bind exact private secret values before custody"
          git push origin HEAD:fix/v14-capture-private-secret-value-custody-current-sol
