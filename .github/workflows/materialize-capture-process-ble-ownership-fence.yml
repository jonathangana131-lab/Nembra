name: Materialize Capture Process BLE Ownership Fence

on:
  push:
    branches:
      - fix/v14-capture-process-ble-ownership-fence-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-process-ble-ownership-fence-sol
          fetch-depth: 0

      - name: Guard unchanged product source
        run: |
          set -euo pipefail
          product_parent='a480923c9263389923e334fdca0c8df59ad1b822'
          git merge-base --is-ancestor "$product_parent" HEAD
          git diff --quiet "$product_parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaProcessLifetimeBLEOwnershipFenceSourceTests.swift

      - name: Apply process ownership repair
        run: python3 scripts/ci/materialize_capture_process_ble_ownership_fence.py apply

      - name: Verify process ownership repair
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_process_ble_ownership_fence.py verify
          git diff --check

      - name: Publish clean product bytes
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-process-ble-ownership-fence.yml
          rm scripts/ci/materialize_capture_process_ble_ownership_fence.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): enforce process-lifetime BLE ownership fence"
          git push origin HEAD:fix/v14-capture-process-ble-ownership-fence-sol
