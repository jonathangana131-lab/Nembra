name: Wire Phase 10 speed instrumentation

on:
  push:
    branches: ["feature/speed-instrumentation-v2"]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/speed-instrumentation-v2
          fetch-depth: 0

      - name: Wire Phase 10 sources into Nembra target
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Nembra.xcodeproj/project.pbxproj')
          text = p.read_text()

          build_anchor = '\t\tA00000000000000000000032 /* DashboardView.swift in Sources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000032 /* DashboardView.swift */; };\n'
          if 'A00000000000000000000033 /* SpeedInstrumentModel.swift in Sources */' not in text:
              if build_anchor not in text:
                  raise SystemExit('Dashboard build-file anchor missing')
              text = text.replace(
                  build_anchor,
                  build_anchor
                  + '\t\tA00000000000000000000033 /* SpeedInstrumentModel.swift in Sources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000033 /* SpeedInstrumentModel.swift */; };\n'
                  + '\t\tA00000000000000000000034 /* RollingSpeedValueView.swift in Sources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000034 /* RollingSpeedValueView.swift */; };\n',
                  1,
              )

          file_anchor = '\t\tB00000000000000000000032 /* DashboardView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = DashboardView.swift; sourceTree = "<group>"; };\n'
          if 'B00000000000000000000033 /* SpeedInstrumentModel.swift */' not in text:
              if file_anchor not in text:
                  raise SystemExit('Dashboard file-reference anchor missing')
              text = text.replace(
                  file_anchor,
                  file_anchor
                  + '\t\tB00000000000000000000033 /* SpeedInstrumentModel.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = SpeedInstrumentModel.swift; sourceTree = "<group>"; };\n'
                  + '\t\tB00000000000000000000034 /* RollingSpeedValueView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RollingSpeedValueView.swift; sourceTree = "<group>"; };\n',
                  1,
              )

          group_old = '\t\t\tchildren = (B00000000000000000000032);\n\t\t\tname = Dashboard;\n'
          group_new = '\t\t\tchildren = (B00000000000000000000032, B00000000000000000000033, B00000000000000000000034);\n\t\t\tname = Dashboard;\n'
          if group_old in text:
              text = text.replace(group_old, group_new, 1)

          source_old = 'A00000000000000000000028, A00000000000000000000029, A00000000000000000000032);'
          source_new = 'A00000000000000000000028, A00000000000000000000029, A00000000000000000000032, A00000000000000000000033, A00000000000000000000034);'
          if source_old in text:
              text = text.replace(source_old, source_new, 1)

          required = [
              'A00000000000000000000033 /* SpeedInstrumentModel.swift in Sources */',
              'A00000000000000000000034 /* RollingSpeedValueView.swift in Sources */',
              'B00000000000000000000033 /* SpeedInstrumentModel.swift */',
              'B00000000000000000000034 /* RollingSpeedValueView.swift */',
              source_new,
          ]
          if not all(x in text for x in required):
              raise SystemExit('Phase 10 project wiring incomplete')
          p.write_text(text)
          PY

          scripts/validate_pbxproj_references.py

      - name: Commit wiring and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wire-speed-instrumentation-v2.yml
          git add Nembra.xcodeproj/project.pbxproj
          git commit -m 'build: wire Phase 10 speed instrumentation into Xcode project'
          git push origin HEAD:feature/speed-instrumentation-v2
