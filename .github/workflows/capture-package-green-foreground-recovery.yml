name: Capture Package Green Foreground Recovery

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/capture-package-green-foreground-recovery.yml'
      - 'Packages/NembraBluetoothCapture/**'

permissions:
  contents: read

jobs:
  package-green:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run complete Capture package and require green
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/capture-package-green-foreground-recovery.log"
          set +e
          (cd Packages/NembraBluetoothCapture && swift test) 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          /usr/bin/python3 -I - "$log" "$status" <<'PY'
          import re, sys
          from collections import Counter
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').splitlines()
          status = int(sys.argv[2])
          files = Counter()
          for line in lines:
              match = re.search(r'at ([A-Za-z0-9_]+\.swift):\d+:\d+:', line)
              if match and ('recorded an issue' in line or 'Caught error' in line):
                  files[match.group(1)] += 1

          total = sum(files.values())
          target = 'TuyaCaptureForegroundIntegritySourceTests.swift'
          passed_summary = any(
              re.search(r'Test run with \d+ tests in \d+ suites passed', line)
              for line in lines
          )

          print(f'PACKAGE_GREEN_ISSUES {total}')
          print(f'TARGET_ISSUES {files[target]} {target}')
          print(f'SWIFT_TEST_STATUS {status}')
          print(f'PASSED_SUMMARY {passed_summary}')
          for name, count in files.most_common():
              print(f'PACKAGE_ISSUES {count:3d} {name}')

          if files[target] != 0:
              raise SystemExit(f'foreground-integrity target still reports {files[target]} issue(s)')
          if total != 0:
              raise SystemExit(f'expected package green / 0 issue records; observed {total}')
          if status != 0:
              raise SystemExit(f'swift test exited {status} despite zero parsed issue records')
          if not passed_summary:
              raise SystemExit('missing Swift Testing passed summary')
          PY

      - name: Upload exact package-green log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capture-package-green-foreground-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/capture-package-green-foreground-recovery.log
          retention-days: 7
          if-no-files-found: error
