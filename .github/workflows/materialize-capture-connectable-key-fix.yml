name: Materialize Capture Connectable Key Repair

on:
  push:
    branches:
      - recovery/v14-capture-provenance-simulator-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-provenance-simulator-sol
          fetch-depth: 0

      - name: Replace invalid CoreBluetooth advertisement symbol
        shell: bash
        run: |
          set -euo pipefail
          path='NembraApp/Features/Research/ES80CaptureShellView.swift'
          expected_blob='8cebdc1d68df63ea606261cd1e8ca33cc18b4de0'
          actual_blob="$(git hash-object "$path")"
          test "$actual_blob" = "$expected_blob"
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          text = path.read_text(encoding="utf-8")
          old = "CBAdvertisementDataIsConnectableKey"
          new = "CBAdvertisementDataIsConnectable"
          if text.count(old) != 2:
              raise SystemExit(f"expected exactly 2 invalid connectable-key references, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          test "$(grep -o 'CBAdvertisementDataIsConnectable' "$path" | wc -l | tr -d ' ')" = '2'
          ! grep -Fq 'CBAdvertisementDataIsConnectableKey' "$path"
          git diff --check

      - name: Commit repaired source and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nembra Capture Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-connectable-key-fix.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(capture): use valid CoreBluetooth connectable key'
          git push origin HEAD:recovery/v14-capture-provenance-simulator-sol
