name: TEMP V14 Final-GO reviewed lock convergence v3

on:
  push:
    branches:
      - repair/v14-auth-final-go-reviewed-tuya-lock-current-sol
    paths:
      - .github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current-v3.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - name: Converge and validate
        run: python3 -B scripts/ci/tmp_v14_converge_reviewed_lock.py
      - name: Remove helpers and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current.yml \
            .github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current-v2.yml \
            .github/workflows/tmp-v14-final-go-reviewed-tuya-lock-current-v3.yml \
            scripts/ci/tmp_v14_converge_reviewed_lock.py
          expected=$'scripts/ci/es80_authenticated_stationary_final_go.py\nscripts/ci/tests/test_es80_authenticated_stationary_final_go.py\nscripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py'
          actual="$(git diff --name-only bccdab041235982ee95a9a4bd366d7b1ec50ccda | sort)"
          test "$actual" = "$expected"
          git config user.name "nembra-v14-closure-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): bind Final-GO to reviewed Tuya lock"
          git push origin HEAD:repair/v14-auth-final-go-reviewed-tuya-lock-current-sol
