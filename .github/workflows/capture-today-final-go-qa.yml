name: Capture TODAY Final GO QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_final_go_record.py
      - scripts/ci/tests/test_es80_today_final_go_record.py
      - .github/workflows/capture-today-final-go-qa.yml

permissions:
  contents: read

jobs:
  final-go-authority:
    name: Validate external Final GO authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nembra-capture-today-final-go-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true

    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile Final GO verifier and adversarial tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_final_go_record.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_record.py

      - name: Run Final GO adversarial suite
        run: python3 scripts/ci/tests/test_es80_today_final_go_record.py -v

      - name: Reject naked Boolean Final GO CLI authority
        run: |
          set -euo pipefail
          help="$(python3 scripts/ci/es80_today_final_go_record.py --help)"
          ! grep -Eq -- '--(terminal-software-acceptance|installed-without-rebuild|retained-app-evidence-inspected|intended-device-membership-accepted|no-application-write-authority|research-admission-live|canonical-coordinator-permitted|preflight-healthy|charger-disconnected|stationary)' <<<"$help"
          grep -Fq -- '--operator-attestation' <<<"$help"
          grep -Fq -- '--trusted-xcode-run-id' <<<"$help"
          grep -Fq -- '--trusted-xcode-job-id' <<<"$help"
          grep -Fq -- '--trusted-xcode-artifact-id' <<<"$help"

      - name: Verify current trusted workflow contract is pinned exactly
        run: |
          set -euo pipefail
          grep -Fq 'TRUSTED_WORKFLOW_NAME = "Xcode 27 PR Exact-Head QA"' scripts/ci/es80_today_final_go_record.py
          grep -Fq 'TRUSTED_JOB_NAME = "Build, test, and capture exact PR head"' scripts/ci/es80_today_final_go_record.py
          grep -Fq 'PINNED_CROSSCHECK_COMMIT = "c12c935cac5470d37e731359f9ffdb9b18d6f85d"' scripts/ci/es80_today_final_go_record.py
          grep -Fq 'name: Xcode 27 PR Exact-Head QA' .github/workflows/xcode27-pr-command.yml
          grep -Fq 'name: Build, test, and capture exact PR head' .github/workflows/xcode27-pr-command.yml
