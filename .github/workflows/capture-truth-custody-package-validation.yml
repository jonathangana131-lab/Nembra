name: Capture truth custody package validation

on:
  push:
    branches:
      - agent/v14-capture-truth-custody-convergence-sol
    paths:
      - .github/workflows/capture-truth-custody-package-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-truth-custody-convergence-sol
      - name: Toolchain identity
        run: swift --version
      - name: NembraBluetoothCapture package tests
        run: swift test --package-path Packages/NembraBluetoothCapture
