name: chat-g5v6 terminal receipt identity patch
on:
  push:
    branches:
      - parallel/es80-terminal-receipt-identity-v14/chat-g5v6
    paths:
      - .github/workflows/chat-g5v6-terminal-receipt-identity-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: parallel/es80-terminal-receipt-identity-v14/chat-g5v6
          fetch-depth: 0
      - name: Bind terminal receipts to exact gate transaction identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          retirement = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothTerminalQueueRetirement.swift')
          resolution = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothTerminalQueueResolution.swift')

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          s = retirement.read_text()
          if not s.startswith('import Foundation\n'):
              s = 'import Foundation\n\n' + s
          s = replace_one(s,
              '        let terminalTransactionRevision: UInt64\n        let horizonQueueCutoff: UInt64',
              '        let terminalTransactionRevision: UInt64\n        let terminalTransactionIdentity: UUID\n        let horizonQueueCutoff: UInt64',
              'retirement receipt field')
          s = replace_one(s,
              '            terminalTransactionRevision: UInt64,\n            horizonQueueCutoff: UInt64,',
              '            terminalTransactionRevision: UInt64,\n            terminalTransactionIdentity: UUID,\n            horizonQueueCutoff: UInt64,',
              'retirement init arg')
          s = replace_one(s,
              '            self.terminalTransactionRevision = terminalTransactionRevision\n            self.horizonQueueCutoff = horizonQueueCutoff',
              '            self.terminalTransactionRevision = terminalTransactionRevision\n            self.terminalTransactionIdentity = terminalTransactionIdentity\n            self.horizonQueueCutoff = horizonQueueCutoff',
              'retirement init assignment')
          s = replace_one(s,
              '            terminalTransactionRevision: transaction.revision,\n            horizonQueueCutoff: transaction.queueCutoff,',
              '            terminalTransactionRevision: transaction.revision,\n            terminalTransactionIdentity: transaction.identity,\n            horizonQueueCutoff: transaction.queueCutoff,',
              'retirement producer')
          retirement.write_text(s)

          s = resolution.read_text()
          if not s.startswith('import Foundation\n'):
              s = 'import Foundation\n\n' + s
          s = replace_one(s,
              '        let terminalTransactionRevision: UInt64\n        let horizonQueueCutoff: UInt64',
              '        let terminalTransactionRevision: UInt64\n        let terminalTransactionIdentity: UUID\n        let horizonQueueCutoff: UInt64',
              'resolution receipt field')
          s = replace_one(s,
              '            terminalTransactionRevision: UInt64,\n            horizonQueueCutoff: UInt64,',
              '            terminalTransactionRevision: UInt64,\n            terminalTransactionIdentity: UUID,\n            horizonQueueCutoff: UInt64,',
              'resolution init arg')
          s = replace_one(s,
              '            self.terminalTransactionRevision = terminalTransactionRevision\n            self.horizonQueueCutoff = horizonQueueCutoff',
              '            self.terminalTransactionRevision = terminalTransactionRevision\n            self.terminalTransactionIdentity = terminalTransactionIdentity\n            self.horizonQueueCutoff = horizonQueueCutoff',
              'resolution init assignment')
          s = replace_one(s,
              '        guard transaction.revision == retirementReceipt.terminalTransactionRevision,\n              transaction.queueCutoff == retirementReceipt.horizonQueueCutoff else {',
              '        guard transaction.revision == retirementReceipt.terminalTransactionRevision,\n              transaction.identity == retirementReceipt.terminalTransactionIdentity,\n              transaction.queueCutoff == retirementReceipt.horizonQueueCutoff else {',
              'resolution exact terminal check')
          s = replace_one(s,
              '            terminalTransactionRevision: retirementReceipt.terminalTransactionRevision,\n            horizonQueueCutoff: horizon,',
              '            terminalTransactionRevision: retirementReceipt.terminalTransactionRevision,\n            terminalTransactionIdentity: retirementReceipt.terminalTransactionIdentity,\n            horizonQueueCutoff: horizon,',
              'resolution producer')
          resolution.write_text(s)
          PY
          git diff --check
      - name: Commit hardening and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/chat-g5v6-terminal-receipt-identity-patch.yml
          git config user.name 'nembra-chat-g5v6'
          git config user.email 'nembra-chat-g5v6@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothTerminalQueueRetirement.swift
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothTerminalQueueResolution.swift
          git commit -m 'capture: bind terminal receipts to exact transaction identity'
          git push origin HEAD:parallel/es80-terminal-receipt-identity-v14/chat-g5v6
