name: tmp V14 Private Recovery Inode Reuse Materializer R2

on:
  push:
    branches:
      - repair/v14-private-recovery-unlink-race-sol-4f57unlink-20260811
    paths:
      - .github/workflows/tmp-v14-private-recovery-inode-reuse-materialize-r2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20

      - name: Bind temporary construction lineage
        shell: bash
        run: |
          set -euo pipefail
          base='9e14bdf0813fe6d3fe930692f75e7060efa58889'
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-v14-private-recovery-inode-reuse-materialize-r2.yml' \
            '.github/workflows/tmp-v14-private-recovery-inode-reuse-materialize.yml' \
            'scripts/ci/tmp_v14_private_recovery_inode_reuse_materialize.py' | sort)"
          test "$changed" = "$expected"

      - name: Materialize durable repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tmp_v14_private_recovery_inode_reuse_materialize.py
          rm -f \
            .github/workflows/tmp-v14-private-recovery-inode-reuse-materialize.yml \
            .github/workflows/tmp-v14-private-recovery-inode-reuse-materialize-r2.yml \
            scripts/ci/tmp_v14_private_recovery_inode_reuse_materialize.py

      - name: Validate descriptor-bound recovery
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_crash_residue.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_recovery_unlink_race.py
          /usr/bin/python3 -I Scripts/provision_capture_tuya_identity_writer.py --self-test
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_crash_residue.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_recovery_unlink_race.py
          /bin/bash -n Scripts/provision_capture_tuya_identity.sh
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib

          writer = Path('Scripts/provision_capture_tuya_identity_writer.py').read_bytes()
          digest = hashlib.sha256(writer).hexdigest()
          shell = Path('Scripts/provision_capture_tuya_identity.sh').read_text(encoding='utf-8')
          swift = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift').read_text(encoding='utf-8')
          assert f'WRITER_SHA256="{digest}"' in shell
          assert digest in swift
          PY
          test -z "$(git grep -l 'a49c6fbe38eabe4983875e2291ce97911ba82d4c4ccfe7c8d7b69ade61edeaf1' -- . ':!*.md' || true)"
          test ! -e .github/workflows/tmp-v14-private-recovery-inode-reuse-materialize.yml
          test ! -e .github/workflows/tmp-v14-private-recovery-inode-reuse-materialize-r2.yml
          test ! -e scripts/ci/tmp_v14_private_recovery_inode_reuse_materialize.py
          git diff --check

      - name: Publish clean durable repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nembra Swarm'
          git config user.email 'noreply@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain=v1)"
          git commit -m 'Capture P0: preserve crash-residue inode authority'
          git push origin "HEAD:${GITHUB_REF_NAME}"
