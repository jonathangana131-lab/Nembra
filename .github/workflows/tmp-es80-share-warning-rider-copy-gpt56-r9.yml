name: Temporary ES80 share-warning rider-copy transform r9

on:
  push:
    branches:
      - product/es80-v14-share-warning-rider-copy-gpt56-r9

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard, transform, and verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected_parent = "613a801340a8b2dbac102aa54c3ded5fe0485f30"
          workflow = ".github/workflows/tmp-es80-share-warning-rider-copy-gpt56-r9.yml"
          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          if parent != expected_parent:
              raise SystemExit(f"transformer parent drifted: {parent} != {expected_parent}")
          changed = subprocess.check_output(["git", "diff", "--name-only", "HEAD^..HEAD"], text=True).splitlines()
          if changed != [workflow]:
              raise SystemExit(f"transformer commit scope drifted: {changed!r}")

          shell_path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift")
          shell = shell_path.read_text(encoding="utf-8")
          old_warning = 'sharePreparationWarning = "Capture is sealed, but this run has no retained operator setup declaration. Start a fresh Experiment One rather than inventing setup provenance at export time."'
          new_warning = 'sharePreparationWarning = "Capture is sealed, but this run is missing the setup confirmation needed to prepare a Share file. Start a fresh capture."'
          if shell.count(old_warning) != 1:
              raise SystemExit("expected exactly one stale Share warning")
          shell = shell.replace(old_warning, new_warning, 1)
          shell_path.write_text(shell, encoding="utf-8")

          tests = test_path.read_text(encoding="utf-8")
          list_anchor = '        let implementationPhrasesThatMustStayOutOfHelpers = [\n            "evidence life",'
          list_replacement = '        let implementationPhrasesThatMustStayOutOfHelpers = [\n            "Experiment One",\n            "package-owned",\n            "CoreBluetooth",\n            "evidence life",'
          if tests.count(list_anchor) != 1:
              raise SystemExit("forbidden-list anchor drifted")
          tests = tests.replace(list_anchor, list_replacement, 1)
          old_specific = '            "package-owned CoreBluetooth controller",\n'
          if tests.count(old_specific) != 1:
              raise SystemExit("specific CoreBluetooth phrase anchor drifted")
          tests = tests.replace(old_specific, '', 1)
          assert_anchor = '        #expect(helperSurface.contains("Simulator QA interruption fixture"))'
          if tests.count(assert_anchor) != 1:
              raise SystemExit("positive assertion anchor drifted")
          tests = tests.replace(assert_anchor, assert_anchor + '\n        #expect(helperSurface.contains("missing the setup confirmation needed to prepare a Share file"))', 1)
          test_path.write_text(tests, encoding="utf-8")

          subprocess.run(["git", "diff", "--check"], check=True)
          final_shell = shell_path.read_text(encoding="utf-8")
          final_tests = test_path.read_text(encoding="utf-8")
          if old_warning in final_shell:
              raise SystemExit("stale rider-facing Share warning remains")
          if final_shell.count("missing the setup confirmation needed to prepare a Share file") != 1:
              raise SystemExit("new Share warning missing or duplicated")
          for phrase in ['"Experiment One"', '"package-owned"', '"CoreBluetooth"']:
              if phrase not in final_tests:
                  raise SystemExit(f"broad helper regression missing {phrase}")
          PY

      - name: Commit product copy and self-delete transformer
        run: |
          set -euo pipefail
          WORKFLOW=".github/workflows/tmp-es80-share-warning-rider-copy-gpt56-r9.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$WORKFLOW"
          git add NembraApp/Features/Research/ES80CaptureShellView.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git commit -m "Capture: keep Share recovery warning rider-first"
          git push origin HEAD:product/es80-v14-share-warning-rider-copy-gpt56-r9
