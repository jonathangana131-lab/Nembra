name: Materialize Capture Apple Tuya login child

on:
  push:
    branches:
      - fix/v14-capture-apple-login-current-5227-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-apple-login-current-5227-sol
          fetch-depth: 0

      - name: Materialize reviewed product patch
        shell: bash
        run: |
          set -euo pipefail
          base='522716b8112fda6456beba24a62a6a563e66629a'
          branch='fix/v14-capture-apple-login-current-5227-sol'
          helper='.github/workflows/materialize-v14-capture-apple-login.yml'
          script='scripts/apply_capture_apple_login.py'
          test "$(git merge-base HEAD "$base")" = "$base"
          python3 "$script"
          rm -- "$helper" "$script"

          expected=$'NembraCapture.xcodeproj/project.pbxproj\nNembraApp/App/NembraCapture.entitlements\nNembraApp/App/NembraCaptureEntrypoint.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppleAccountAuthenticationSourceTests.swift'
          actual="$(git diff --name-only "$base" -- | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"

          git add NembraCapture.xcodeproj/project.pbxproj \
                  NembraApp/App/NembraCapture.entitlements \
                  NembraApp/App/NembraCaptureEntrypoint.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppleAccountAuthenticationSourceTests.swift \
                  "$helper" "$script"
          git config user.name 'nembra-v14-swarm'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(capture): support Apple-backed Tuya account login'
          git push origin "HEAD:$branch"
