name: Capture Tracked Casefold Directory Alias Red Team

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_tracked_casefold_directory_alias_red_team.py
      - .github/workflows/capture-tracked-casefold-directory-alias-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-tracked-casefold-directory-alias-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_ATTACKED_PARENT: ff169cf7400d67d421a451d6d0d1d860353bf9e0

jobs:
  macos-exploit-positive:
    name: Prove tracked Git directory alias collapse on field macOS
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact attacked helper and diagnostic-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_ATTACKED_PARENT")" = "$EXACT_ATTACKED_PARENT"
          test "$(git rev-parse "$EXACT_ATTACKED_PARENT:scripts/ci/capture_accepted_build_input_snapshot.py")" = \
               "$(git rev-parse "HEAD:scripts/ci/capture_accepted_build_input_snapshot.py")"
          changed="$(git diff --name-only "$EXACT_ATTACKED_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-tracked-casefold-directory-alias-red-team.yml \
            scripts/ci/tests/test_capture_tracked_casefold_directory_alias_red_team.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_ATTACKED_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute exploit-positive case-fold namespace witness
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_tracked_casefold_directory_alias_red_team.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve expected-red truth boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "NEMBRA_TRACKED_CASEFOLD_DIRECTORY_ALIAS exploitReproduced=true productionAccepted=false generatedManifestBypassed=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false"
