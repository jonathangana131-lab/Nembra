name: TEMP V14 Final-GO Reviewed Lock Recovery

on:
  push:
    branches:
      - recovery/v14-final-go-reviewed-lock-current-bcc-sol

permissions:
  contents: write

jobs:
  capture-conflicts:
    if: github.repository == 'jonathangana131-lab/Nembra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-final-go-reviewed-lock-current-bcc-sol
          fetch-depth: 0
      - name: Verify second failed attempt changed no product bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5240d10596b8418288167899eb1094e8cc2db198"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tmp-v14-final-go-reviewed-lock-recovery.yml"
          test "$(git diff --name-only bccdab041235982ee95a9a4bd366d7b1ec50ccda...HEAD)" = ".github/workflows/tmp-v14-final-go-reviewed-lock-recovery.yml"
      - name: Capture deterministic three-way conflict subjects
        shell: bash
        run: |
          set -euo pipefail
          BASE=da86226ba36bb2d4f441cc3cb876244af17853cb
          OURS=bccdab041235982ee95a9a4bd366d7b1ec50ccda
          THEIRS=d8416aeba19b826cfb50bde9e0b3e2778766a286
          mkdir -p recovery-debug
          paths=(
            scripts/ci/es80_authenticated_stationary_final_go.py
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
            scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          )
          for path in "${paths[@]}"; do
            name="$(basename "$path")"
            git show "$OURS:$path" > /tmp/ours
            git show "$BASE:$path" > /tmp/base
            git show "$THEIRS:$path" > /tmp/theirs
            git merge-file -p -L current-bcc -L common-da862 -L reviewed-lock-d841 /tmp/ours /tmp/base /tmp/theirs > "recovery-debug/$name" || true
          done
          grep -R -n '^<<<<<<<\|^=======\|^>>>>>>>' recovery-debug > recovery-debug/conflict-index.txt || true
          test -s recovery-debug/conflict-index.txt
      - name: Publish disposable conflict evidence and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-v14-final-go-reviewed-lock-recovery.yml
          git config user.name "jonathangana131-lab"
          git config user.email "jonathangana131@gmail.com"
          git add recovery-debug .github/workflows/tmp-v14-final-go-reviewed-lock-recovery.yml
          git commit -m "debug(capture): retain reviewed-lock merge conflict evidence"
          git push origin HEAD:recovery/v14-final-go-reviewed-lock-current-bcc-sol
