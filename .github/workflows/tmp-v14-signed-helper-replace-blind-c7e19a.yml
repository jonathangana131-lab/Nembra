name: Temporary V14 Signed Helper Replace-Blind Repair

on:
  push:
    branches:
      - repair/v14-capture-signed-helper-replace-blind-c7e19a
    paths:
      - .github/workflows/tmp-v14-signed-helper-replace-blind-c7e19a.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-capture-signed-helper-replace-blind-c7e19a
          fetch-depth: 0

      - name: Materialize replacement-blind signed-helper custody
        shell: bash
        run: |
          set -euo pipefail
          trigger="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path

          installer = Path('scripts/field/install_one_time_capture.command')
          source = installer.read_text(encoding='utf-8')
          replacements = {
              'SIGNED_APP_CUSTODY_HELPER_BLOB="$(/usr/bin/git rev-parse "$SOURCE_SHA:$SIGNED_APP_CUSTODY_HELPER_PATH" 2>/dev/null)"':
              'SIGNED_APP_CUSTODY_HELPER_BLOB="$(GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git rev-parse "$SOURCE_SHA:$SIGNED_APP_CUSTODY_HELPER_PATH" 2>/dev/null)"',
              'SIGNED_APP_CUSTODY_HELPER_BASE64="$(/usr/bin/git cat-file blob "$SIGNED_APP_CUSTODY_HELPER_BLOB" | /usr/bin/base64)"':
              'SIGNED_APP_CUSTODY_HELPER_BASE64="$(GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git cat-file blob "$SIGNED_APP_CUSTODY_HELPER_BLOB" | /usr/bin/base64)"',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'installer replacement expected exactly one match, found {count}: {old}')
              source = source.replace(old, new, 1)
          installer.write_text(source, encoding='utf-8')

          test = Path('scripts/ci/tests/test_capture_signed_app_install_custody.py')
          text = test.read_text(encoding='utf-8')
          anchor = '''        self.assertGreaterEqual(hash_marker, 0)\n        self.assertLess(blob_marker, indexes["fingerprint"])\n'''
          insertion = '''        self.assertGreaterEqual(hash_marker, 0)\n        self.assertIn(\n            'SIGNED_APP_CUSTODY_HELPER_BLOB="$(GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git rev-parse',\n            source,\n        )\n        self.assertIn(\n            'SIGNED_APP_CUSTODY_HELPER_BASE64="$(GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git cat-file blob',\n            source,\n        )\n        self.assertNotIn('SIGNED_APP_CUSTODY_HELPER_BLOB="$(/usr/bin/git rev-parse', source)\n        self.assertNotIn('SIGNED_APP_CUSTODY_HELPER_BASE64="$(/usr/bin/git cat-file blob', source)\n        self.assertLess(blob_marker, indexes["fingerprint"])\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'test insertion anchor expected exactly once, found {text.count(anchor)}')
          text = text.replace(anchor, insertion, 1)
          test.write_text(text, encoding='utf-8')
          PY

          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_signed_app_install_custody.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_install_custody.py
          git diff --check
          rm .github/workflows/tmp-v14-signed-helper-replace-blind-c7e19a.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git status --short
          git config user.name 'nembra-capture-bot'
          git config user.email 'nembra-capture-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): make signed helper Git reads replacement-blind'
          git fetch origin repair/v14-capture-signed-helper-replace-blind-c7e19a
          test "$(git rev-parse FETCH_HEAD)" = "$trigger"
          git push origin HEAD:repair/v14-capture-signed-helper-replace-blind-c7e19a
