name: TEMP Capture Authority Chain Indent Recovery

on:
  push:
    branches:
      - repair/v14-capture-authority-chain-indent-recovery-sol
    paths:
      - .github/workflows/tmp-v14-capture-authority-chain-indent-recovery.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-authority-chain-indent-recovery-sol
          fetch-depth: 0
      - name: Execute reviewed materializer payload with YAML indent normalization
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/nembra-authority-materializer-recovery-error.txt
          python3 - <<'PY'
          from pathlib import Path
          import traceback

          workflow = Path('.github/workflows/capture-authority-chain-materialize.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          try:
              if workflow.count(start) != 1:
                  raise RuntimeError(f'expected one payload start, found {workflow.count(start)}')
              payload = workflow.split(start, 1)[1].split(end, 1)[0]
              # A global dedent is wrong here: the payload intentionally contains
              # zero-indented lines inside triple-quoted fixture text. Strip only
              # the YAML run-block prefix from lines that actually carry it.
              prefix = ' ' * 10
              payload = '\n'.join(
                  line[len(prefix):] if line.startswith(prefix) else line
                  for line in payload.splitlines()
              ) + '\n'
              exec(compile(payload, '<capture-authority-chain-materializer>', 'exec'), {})
          except BaseException:
              Path('/tmp/nembra-authority-materializer-recovery-error.txt').write_text(traceback.format_exc(), encoding='utf-8')
          PY
          if [[ -s /tmp/nembra-authority-materializer-recovery-error.txt ]]; then
            cat /tmp/nembra-authority-materializer-recovery-error.txt
            git reset --hard HEAD
            cp /tmp/nembra-authority-materializer-recovery-error.txt .nembra-authority-materializer-recovery-error
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .nembra-authority-materializer-recovery-error
            git commit -m 'Capture: retain recovery materializer failure'
            git push origin HEAD:repair/v14-capture-authority-chain-indent-recovery-sol
            exit 1
          fi
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          bash -n scripts/field/install_one_time_capture.command
          python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_review_commitment.py
          python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_review_helper_execution_custody.py
          git diff --check
          git status --short
      - name: Publish recovered authority-chain repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Scripts/bootstrap_capture_tuya_sdk.sh \
            Scripts/capture_tuya_private_input_build_guard.py \
            scripts/field/install_one_time_capture.command \
            scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py \
            scripts/ci/tests/test_capture_private_review_commitment.py \
            scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py \
            scripts/ci/tests/test_capture_private_review_helper_execution_custody.py \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldSDKDependencyProvenanceSourceTests.swift
          git diff --cached --quiet && { echo 'ERROR: materializer produced no production/test diff' >&2; exit 1; }
          git commit -m 'Capture: bind complete field authority helper chain'
          git push origin HEAD:repair/v14-capture-authority-chain-indent-recovery-sol
