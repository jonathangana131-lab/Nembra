name: Capture Application Event Custody Materializer

on:
  push:
    branches:
      - repair/v14-capture-app-event-custody-8069-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/v14-capture-app-event-custody-8069-sol

      - name: Verify exact product ancestry and untouched app source
        run: |
          set -euo pipefail
          product=8069c0ffec496cacbe263016d8a7f4ca15ddc64e
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --exit-code "$product" -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Materialize application event custody
        run: python3 scripts/materialize_capture_app_event_custody.py

      - name: Validate custody invariants
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          c = s[s.index('private final class SecureLinkController'):s.index('@MainActor\nprivate protocol OfficialTuyaDriver')]
          r = c[c.index('private func receivedApplicationUpdate('):c.index('private func startWatchdog')]
          assert 'verifiedAccountUID' in r
          assert 'redactVerifiedAccountUID(update' in r
          assert ') { _, trusted in trusted })' in r
          assert ') { current, _ in current })' not in r
          assert 'key.replacingOccurrences(of: verifiedAccountUID' in r
          assert 'value.replacingOccurrences(of: verifiedAccountUID' in r
          assert '<redacted-account-uid>' in r
          d = s[s.index('@MainActor\nprivate final class SmartLifeDriver'):s.index('#endif\n\nprivate enum AppleAccountAuthorizationError')]
          assert d.count('"sessionkey"') == 1
          assert '"uid",' not in d
          PY

      - name: Publish clean two-path convergence
        run: |
          set -euo pipefail
          product=8069c0ffec496cacbe263016d8a7f4ca15ddc64e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git rm scripts/materialize_capture_app_event_custody.py .github/workflows/capture-app-event-custody-materialize.yml
          git commit -m 'Capture: seal application event custody'
          expected=$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyConvergenceSourceTests.swift' | sort)
          actual=$(git diff --name-only "$product" HEAD | sort)
          test "$actual" = "$expected"
          git diff --check "$product" HEAD
          git push origin HEAD:repair/v14-capture-app-event-custody-8069-sol
