name: Capture Field Authorization Exact-Head

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - product/capture-1-0-main-20260818
      - capture/app-container-directory-bootstrap-recovery-gpt56sol
    paths:
      - 'NembraApp/App/NembraCaptureEntrypoint.swift'
      - 'NembraApp/App/NembraCaptureFieldAuthorizationController.swift'
      - 'Packages/NembraBluetoothCapture/Sources/NembraCaptureAppAuthorization/**'
      - 'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/AuthenticatedStationaryCaptureFieldAuthorization.swift'
      - 'Packages/NembraBluetoothCapture/Tests/NembraCaptureAppAuthorizationTests/**'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureAuthorizationTransferBootstrapSourceTests.swift'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedFieldCapability*'
      - 'scripts/ci/es80_*field_authorization*'
      - 'scripts/ci/tests/test_es80_*field_authorization*'
      - 'scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py'
      - 'scripts/ci/tests/test_es80_rendezvous_signer_private_custody_boundary.py'
      - '.github/workflows/capture-app-authorization-close-one-shot.yml'
      - '.github/workflows/capture-app-authorization-race-safe-go.yml'
      - '.github/workflows/capture-field-authorization-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-field-authorization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      SOURCE_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
      MATERIALIZER_WORKFLOW: .github/workflows/capture-app-authorization-race-safe-go.yml
    steps:
      - name: Checkout immutable PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout dispatched ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact subject
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            test "$actual" = "${{ github.event.pull_request.head.sha }}"
          fi
          test -f "$APP_SOURCE"
          test -f "$SOURCE_WORKFLOW"
          test -f "$MATERIALIZER_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'NEMBRA_CAPTURE_FIELD_AUTHORIZATION_SUBJECT=%s physicalAuthorityCreated=false\n' "$actual"

      - name: Materialize canonical lifecycle transform in exact-head workspace
        shell: python
        run: |
          import os
          from pathlib import Path
          import textwrap

          workflow = Path(os.environ["MATERIALIZER_WORKFLOW"]).read_text(encoding="utf-8")
          marker = "      - name: Materialize canonical lifecycle transform\n"
          section = workflow.index(marker)
          run_marker = "        run: |\n"
          start = workflow.index(run_marker, section) + len(run_marker)
          end = workflow.index("\n      - name:", start)
          program = textwrap.dedent(workflow[start:end])
          required = [
              "SOURCE_WORKFLOW",
              "admitOFF1Start",
              "admitAuthenticationStart",
              "admitOfficialConnectionStart",
              "admitObservationStart",
              "freezeAcceptedArtifactForAuthorizationSeal",
              "sealAfterAcceptedArtifactFreeze",
              "app.write_text(source, encoding=\"utf-8\")",
          ]
          for token in required:
              if token not in program:
                  raise SystemExit(f"race-safe materializer missing required token: {token}")
          namespace = {
              "__name__": "__main__",
              "__file__": "<capture-field-authorization-exact-head-materializer>",
          }
          exec(compile(program, namespace["__file__"], "exec", dont_inherit=True), namespace)

      - name: Enforce transformed exact-head authority shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = "$APP_SOURCE"
          grep -Fq 'import NembraCaptureAppAuthorization' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage != .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0

      - name: Run real-entrypoint lifecycle source contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py

      - name: Run and retain package authorization and exact-freeze contracts
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set -uo pipefail
          diagnostics="${RUNNER_TEMP}/capture-field-authorization-contracts"
          rm -rf "$diagnostics"
          mkdir -p "$diagnostics"
          failures=0
          filters=(
            AuthenticatedStationaryCaptureCapabilityGateTests
            AuthenticatedStationaryCaptureAppAuthorizerTests
            AuthenticatedStationaryCaptureAppAuthorizerPreSigningTests
            AuthenticatedStationaryCaptureAppSessionTests
            AuthenticatedStationaryCaptureAuthorizationInboxTests
            AuthenticatedStationaryCaptureSignerRendezvousDocumentTests
            AuthenticatedStationaryCaptureSignerRendezvousOutboxTests
            AuthenticatedStationaryCaptureAuthoritySurfaceSourceTests
            CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
            CaptureAuthorizationTransferBootstrapSourceTests
            TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests
          )
          for filter in "${filters[@]}"; do
            printf '\n===== %s =====\n' "$filter"
            if swift test --filter "$filter" 2>&1 | tee "$diagnostics/${filter}.log"; then
              printf 'PASS %s\n' "$filter" | tee -a "$diagnostics/summary.txt"
            else
              status=${PIPESTATUS[0]}
              printf 'FAIL %s exit=%s\n' "$filter" "$status" | tee -a "$diagnostics/summary.txt"
              failures=1
            fi
          done
          printf '%s\n' "$failures" > "$diagnostics/failures"

      - name: Upload package authorization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-field-authorization-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-field-authorization-contracts
          if-no-files-found: error
          retention-days: 14

      - name: Enforce package authorization contract verdict
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/capture-field-authorization-contracts/failures"
          test "$(cat "${RUNNER_TEMP}/capture-field-authorization-contracts/failures")" = 0

      - name: Run frozen signer custody contracts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_sign_field_authorization_execution_custody.py
          /usr/bin/python3 -I scripts/ci/tests/test_es80_rendezvous_signer_private_custody_boundary.py
          /usr/bin/python3 -I scripts/ci/tests/test_es80_sign_field_authorization_from_rendezvous.py
          test ! -e LocalSecrets
          printf '%s\n' 'Signer custody tests exercised only public fixtures; no private key, signed private IPA, device install, or physical GO was created.'

      - name: Build standalone Capture with field authority still disabled
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NembraCaptureFieldAuthorizationExactHead" \
            CODE_SIGNING_ALLOWED=NO \
            build
