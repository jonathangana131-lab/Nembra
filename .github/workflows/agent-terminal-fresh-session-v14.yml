name: Agent Terminal Fresh Session V14

on:
  push:
    branches:
      - agent/capture-terminal-fresh-session-v14-current

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/capture-terminal-fresh-session-v14-current
          fetch-depth: 0
      - name: Compose reviewed terminal authority delta
        run: python3 .github/agent_terminal_fresh_session_v14.py
