name: Capture TODAY Final GO Trust Contract Red R3

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_final_go_trust_contract_red_r3.py
      - .github/workflows/capture-today-final-go-trust-contract-red-r3.yml

permissions:
  contents: read

jobs:
  trust-contract-red:
    name: Require retained-artifact and Git lookup trust invariants
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile trust modules and regression
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_trusted_capture_xcode_subject.py
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_trust_contract_red_r3.py
      - name: Require fail-closed trust contracts
        run: python3 scripts/ci/tests/test_es80_today_final_go_trust_contract_red_r3.py -v
