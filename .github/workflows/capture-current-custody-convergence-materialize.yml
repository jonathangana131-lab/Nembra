name: Capture current-custody convergence materializer

on:
  push:
    branches:
      - repair/v14-capture-current-custody-convergence-8069-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current product and pre-mutation scope
        shell: bash
        run: |
          set -euo pipefail
          base=8069c0ffec496cacbe263016d8a7f4ca15ddc64e
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base"...HEAD | sort)
          expected=(
            ".github/workflows/capture-current-custody-convergence-materialize.yml"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"
          git diff --quiet "$base"...HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Materialize current product truth repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          def section(source: str, start_marker: str, end_marker: str):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return start, end, source[start:end]

          # View exit must revoke completed target authority even after the package scanner/lease
          # has already retired at final-window seal.
          start, end, view_exit = section(text, "    func abandonCorrelationForViewExit() {", "    func appDidLoseForeground() {")
          anchor = '''        guard processCorrelationLease != nil || correlationSession != nil else { return }
              // Existing helper stops package transport before releasing this controller's lease.
              abandonPackageCorrelation()
          '''
          replacement = '''        if phase == .correlated || phase == .selected {
                  resetDiscoverySessionOnly()
                  phase = .failed
                  message = "Bluetooth target correlation was abandoned when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."
                  log("target_correlation_abandoned_on_view_exit")
                  return
              }

              guard processCorrelationLease != nil || correlationSession != nil else { return }
              // Existing helper stops package transport before releasing this controller's lease.
              abandonPackageCorrelation()
          '''
          if view_exit.count(anchor) != 1:
              raise SystemExit(f"expected one view-exit live-correlation guard, found {view_exit.count(anchor)}")
          view_exit = view_exit.replace(anchor, replacement, 1)
          text = text[:start] + view_exit + text[end:]

          # Account identity is an earned view/current-account lease. Scrub exact UID occurrences
          # from both untrusted keys and values without classifying generic device `uid` keys.
          receiver_anchor = "    private func receivedApplicationUpdate(\n"
          helper = '''    private static func redactVerifiedAccountUID(
              in update: [String: String],
              accountUID: String
          ) -> [String: String] {
              let uid = accountUID.trimmingCharacters(in: .whitespacesAndNewlines)
              guard !uid.isEmpty else { return update }

              var sanitized: [String: String] = [:]
              for (originalKey, originalValue) in update.sorted(by: { $0.key < $1.key }) {
                  let baseKey = originalKey.replacingOccurrences(
                      of: uid,
                      with: "<redacted-account-uid>",
                      options: [.literal]
                  )
                  let redactedValue = originalValue.replacingOccurrences(
                      of: uid,
                      with: "<redacted-account-uid>",
                      options: [.literal]
                  )

                  var key = baseKey
                  var collisionIndex = 2
                  while sanitized[key] != nil {
                      key = "\\(baseKey)#\\(collisionIndex)"
                      collisionIndex += 1
                  }
                  sanitized[key] = redactedValue
              }
              return sanitized
          }

          '''
          if text.count(receiver_anchor) != 1:
              raise SystemExit(f"expected one application-update receiver anchor, found {text.count(receiver_anchor)}")
          text = text.replace(receiver_anchor, helper + receiver_anchor, 1)

          start, end, receiver = section(text, "    private func receivedApplicationUpdate(", "    private func startWatchdog")
          old_custody = '''            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)
                  await refreshLedgerSnapshot()
                  log("tuya_application_update", update.merging([
                      "generation": String(token.diagnosticGeneration)
                  ]) { current, _ in current })
                  message = "Receiving same-generation scooter application data · \\(applicationUpdateCount) update(s). Canonical readiness still depends on the sealed observation horizon."
          '''
          new_custody = '''            try await sessionLedger.recordApplicationUpdate(isNonEmpty: !update.isEmpty, for: token)
                  await refreshLedgerSnapshot()
                  guard accountIdentityLeaseIsAuthorized,
                        let accountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),
                        !accountUID.isEmpty else {
                      await invalidateSourceAuthority(
                          token: token,
                          message: "SDK account identity lease changed before application event custody could be sealed.",
                          kind: "sdk_account_identity_lease_changed_before_application_event_custody"
                      )
                      return
                  }
                  let redactedUpdate = Self.redactVerifiedAccountUID(in: update, accountUID: accountUID)
                  log("tuya_application_update", redactedUpdate.merging([
                      "generation": String(token.diagnosticGeneration)
                  ]) { _, trusted in trusted })
                  message = "Receiving same-generation scooter application data · \\(applicationUpdateCount) update(s). Canonical readiness still depends on the sealed observation horizon."
          '''
          if receiver.count(old_custody) != 1:
              raise SystemExit(f"expected one raw application event custody block, found {receiver.count(old_custody)}")
          receiver = receiver.replace(old_custody, new_custody, 1)
          text = text[:start] + receiver + text[end:]

          # Remove only the duplicate sessionkey classifier entry; preserve all credential classes.
          duplicate = '''        "accesstoken",
                  "refreshtoken",
                  "sessionkey",
                  "authkey",
          '''
          simplified = '''        "accesstoken",
                  "refreshtoken",
                  "authkey",
          '''
          if text.count(duplicate) != 1:
              raise SystemExit(f"expected one duplicate sessionkey tail, found {text.count(duplicate)}")
          text = text.replace(duplicate, simplified, 1)

          path.write_text(text)
          PY

      - name: Verify exact truth boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()

          def section(start_marker, end_marker):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[start:end]

          view_exit = section("    func abandonCorrelationForViewExit() {", "    func appDidLoseForeground() {")
          foreground = section("    func appDidLoseForeground() {", "    var privateConfig: Bool")
          receiver = section("    private func receivedApplicationUpdate(", "    private func startWatchdog")
          helper = section("    private static func redactVerifiedAccountUID(", "    private func receivedApplicationUpdate(")
          driver = section("@MainActor\nprivate final class SmartLifeDriver", "#endif\n\nprivate enum AppleAccountAuthorizationError")

          # Preserve the already-landed foreground/membership hardening and close its residual view-exit gap.
          for item in [
              "guard phase != .accepted else { return }",
              "foreground_integrity_lost_after_target_correlation",
              "resetDiscoverySessionOnly()",
              "membershipStatus = \"Exact scooter membership must be verified again",
          ]:
              if item not in foreground:
                  raise SystemExit(f"landed foreground truth regressed: {item}")
          for item in [
              "if phase == .correlated || phase == .selected",
              "resetDiscoverySessionOnly()",
              "target_correlation_abandoned_on_view_exit",
          ]:
              if item not in view_exit:
                  raise SystemExit(f"view-exit target revocation missing: {item}")
          if view_exit.index("resetDiscoverySessionOnly()") > view_exit.index("guard processCorrelationLease != nil || correlationSession != nil else { return }"):
              raise SystemExit("view-exit completed target authority is reset after the no-live-lease return")

          # Post-await admission must re-prove the exact account lease before event custody.
          required_receiver = [
              "try await sessionLedger.recordApplicationUpdate",
              "await refreshLedgerSnapshot()",
              "guard accountIdentityLeaseIsAuthorized",
              "membershipAccountUID",
              "redactVerifiedAccountUID(in: update, accountUID: accountUID)",
              '"generation": String(token.diagnosticGeneration)',
              ") { _, trusted in trusted })",
              "sdk_account_identity_lease_changed_before_application_event_custody",
          ]
          for item in required_receiver:
              if item not in receiver:
                  raise SystemExit(f"application event custody missing: {item}")
          if receiver.index("guard accountIdentityLeaseIsAuthorized") < receiver.index("await refreshLedgerSnapshot()"):
              raise SystemExit("post-await lease recheck is not after the suspension boundary")
          if 'log("tuya_application_update", update.merging([' in receiver:
              raise SystemExit("raw application update still enters immutable event custody")
          if ") { current, _ in current })" in receiver:
              raise SystemExit("SDK application metadata can still override Nembra provenance")

          for item in [
              "originalKey.replacingOccurrences",
              "originalValue.replacingOccurrences",
              '"<redacted-account-uid>"',
              "accountUID",
          ]:
              if item not in helper:
                  raise SystemExit(f"value-bound account UID redaction missing: {item}")

          # Do not erase generic UID-shaped device evidence or weaken secret-key custody.
          if '"uid",' in driver or '"uid"\n' in driver:
              raise SystemExit("blanket generic uid key classifier introduced")
          if driver.count('"sessionkey"') != 1:
              raise SystemExit("sessionkey classifier must remain exactly once")
          for item in ['"localkey"', '"appkey"', '"appsecret"', '"password"', '"accounttoken"', '"accesstoken"', '"refreshtoken"', '"authkey"', '"seckey"']:
              if item not in driver:
                  raise SystemExit(f"existing secret classifier regressed: {item}")

          for name, body in [("view exit", view_exit), ("foreground", foreground), ("receiver", receiver)]:
              for forbidden in ["queryDps", "publishDps", "publishDpsWithSuccess", "writeValue"]:
                  if forbidden in body:
                      raise SystemExit(f"{name} repair introduced forbidden control authority: {forbidden}")
          for forbidden in ["endConnection(", "disconnectBLE"]:
              if forbidden in view_exit or forbidden in foreground:
                  raise SystemExit(f"lifecycle repair invented BLE-disconnect authority: {forbidden}")
          PY
          git diff --check
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          fi

      - name: Retire one-shot helper and checkpoint clean product delta
        shell: bash
        run: |
          set -euo pipefail
          base=8069c0ffec496cacbe263016d8a7f4ca15ddc64e
          rm .github/workflows/capture-current-custody-convergence-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            .github/workflows/capture-current-custody-convergence-materialize.yml
          mapfile -t effective < <(git diff --cached --name-only "$base" | sort)
          expected=(
            "NembraApp/App/NembraCaptureEntrypoint.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundTargetRevocationSourceTests.swift"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${effective[*]}" = "${expected_sorted[*]}"
          git config user.name "nembra-v14-materializer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): close current application custody gaps"
          git push origin HEAD:repair/v14-capture-current-custody-convergence-8069-sol
