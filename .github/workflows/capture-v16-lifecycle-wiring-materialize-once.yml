name: Capture V16 lifecycle wiring gate materialize once

on:
  push:
    branches:
      - ci/capture-v16-lifecycle-wiring-gpt56sol-20260821
    paths:
      - .github/workflows/capture-v16-lifecycle-wiring-materialize-once.yml

permissions:
  contents: write

concurrency:
  group: capture-v16-lifecycle-wiring-gate-materialize-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ci/capture-v16-lifecycle-wiring-gpt56sol-20260821
      TARGET_WORKFLOW: .github/workflows/capture-v16-standalone.yml
      SELF_WORKFLOW: .github/workflows/capture-v16-lifecycle-wiring-materialize-once.yml
      LIFECYCLE_ORACLE: scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py
      SUBJECT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact authoring head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize V16 lifecycle acceptance gate
        shell: python
        run: |
          import os
          from pathlib import Path

          path = Path(os.environ["TARGET_WORKFLOW"])
          source = path.read_text(encoding="utf-8")
          oracle = os.environ["LIFECYCLE_ORACLE"]

          trigger_anchor = "      - 'Packages/NembraCore/**'\n      - '.github/workflows/capture-v16-standalone.yml'\n"
          trigger_replacement = (
              "      - 'Packages/NembraCore/**'\n"
              f"      - '{oracle}'\n"
              "      - '.github/workflows/capture-v16-standalone.yml'\n"
          )
          if source.count(trigger_anchor) != 1:
              raise SystemExit(
                  f"V16 lifecycle trigger anchor count was {source.count(trigger_anchor)}; refusing"
              )
          source = source.replace(trigger_anchor, trigger_replacement, 1)

          compile_anchor = (
              "            scripts/ci/es80_retained_install_manifest.py \\\n"
              "            scripts/ci/tests/test_es80_retained_install_manifest.py \\\n"
              "            scripts/ci/tests/test_es80_retained_install_installer_chronology.py\n"
          )
          compile_replacement = (
              "            scripts/ci/es80_retained_install_manifest.py \\\n"
              "            scripts/ci/tests/test_es80_retained_install_manifest.py \\\n"
              "            scripts/ci/tests/test_es80_retained_install_installer_chronology.py \\\n"
              f"            {oracle}\n"
          )
          if source.count(compile_anchor) != 1:
              raise SystemExit(
                  f"V16 lifecycle py_compile anchor count was {source.count(compile_anchor)}; refusing"
              )
          source = source.replace(compile_anchor, compile_replacement, 1)

          run_anchor = (
              "          /usr/bin/python3 -I scripts/ci/tests/test_es80_retained_install_installer_chronology.py\n"
              "          test ! -e LocalSecrets\n"
          )
          run_replacement = (
              "          /usr/bin/python3 -I scripts/ci/tests/test_es80_retained_install_installer_chronology.py\n"
              f"          /usr/bin/python3 -I {oracle} -v\n"
              "          test ! -e LocalSecrets\n"
          )
          if source.count(run_anchor) != 1:
              raise SystemExit(
                  f"V16 lifecycle execution anchor count was {source.count(run_anchor)}; refusing"
              )
          source = source.replace(run_anchor, run_replacement, 1)

          if source.count(oracle) != 3:
              raise SystemExit(
                  f"expected lifecycle oracle in trigger/compile/run exactly three times, got {source.count(oracle)}"
              )
          path.write_text(source, encoding="utf-8")

      - name: Verify narrow acceptance-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$SUBJECT_SHA"
          test "$(git diff --name-only)" = "$TARGET_WORKFLOW"
          git diff --check
          grep -Fq -- "- '$LIFECYCLE_ORACLE'" "$TARGET_WORKFLOW"
          grep -Fq -- "/usr/bin/python3 -I $LIFECYCLE_ORACLE -v" "$TARGET_WORKFLOW"
          /usr/bin/python3 -m py_compile "$LIFECYCLE_ORACLE"
          test "$(grep -Fc -- "$LIFECYCLE_ORACLE" "$TARGET_WORKFLOW")" = 3

      - name: Publish tested gate and retire authoring workflow
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$SUBJECT_SHA"
          rm "$SELF_WORKFLOW"
          git add -- "$TARGET_WORKFLOW" "$SELF_WORKFLOW"
          git diff --cached --check
          /usr/bin/python3 - <<'PY'
          import os
          import subprocess

          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          expected = {os.environ["SELF_WORKFLOW"], os.environ["TARGET_WORKFLOW"]}
          if actual != expected:
              raise SystemExit(
                  f"staged path set mismatch: actual={sorted(actual)!r} expected={sorted(expected)!r}"
              )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(capture): require lifecycle wiring oracle in V16'
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CAPTURE_V16_LIFECYCLE_GATE materialized=%s parent=%s physicalAuthorityCreated=false\n' "$(git rev-parse HEAD)" "$SUBJECT_SHA"
