name: V14 current application seal custody repair

on:
  push:
    branches:
      - repair/v14-capture-application-seal-custody-current-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - name: Verify exact current flagship parent
        run: test "$(git rev-parse HEAD^^)" = "cbde7710b6b8f49f6f501b9f9bcf643047c9e804"
      - name: Patch and validate portable custody contracts
        run: |
          python3 scripts/ci/v14_current_application_seal_custody_patch.py
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationSealCustodySourceTests.swift
      - name: Commit clean product delta and retire materializer
        env:
          BRANCH: repair/v14-capture-application-seal-custody-current-sol
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')" = "$EVENT_SHA"
          rm scripts/ci/v14_current_application_seal_custody_patch.py
          rm .github/workflows/v14-current-application-seal-custody.yml
          git config user.name "nembra-v14-integration"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationSealCustodySourceTests.swift scripts/ci/v14_current_application_seal_custody_patch.py .github/workflows/v14-current-application-seal-custody.yml
          git commit -m "fix(capture): close accepted application seal custody"
          git push origin "HEAD:$BRANCH"
