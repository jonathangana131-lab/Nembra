name: Materialize Capture Foreground Target Authority Convergence

on:
  push:
    branches:
      - sol/v14-capture-foreground-integrity-4b41-r3

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-foreground-integrity-4b41-r3
          fetch-depth: 0

      - name: Guard reviewed convergence input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '47943987963d229990060a0321087715066063f1'
          construction_parent='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          test "$(git merge-base "$construction_parent" HEAD)" = "$construction_parent"
          grep -Fq 'func appDidLoseForeground()' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'private func revokeTargetCorrelationAuthorityForForegroundLoss()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq ']) { current, _ in current })' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Apply and verify fail-closed convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tighten_capture_foreground_target_authority.py apply
          python3 scripts/ci/tighten_capture_foreground_target_authority.py verify
          python3 -m py_compile scripts/ci/tighten_capture_foreground_target_authority.py
          git diff --check

      - name: Publish clean product bytes
        shell: bash
        run: |
          set -euo pipefail
          construction_parent='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          rm .github/workflows/capture-foreground-target-authority-converge.yml
          rm scripts/ci/tighten_capture_foreground_target_authority.py
          git add -A
          changed="$(git diff --cached "$construction_parent" --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$construction_parent" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): close foreground target and event provenance authority'
          git push origin HEAD:sol/v14-capture-foreground-integrity-4b41-r3
