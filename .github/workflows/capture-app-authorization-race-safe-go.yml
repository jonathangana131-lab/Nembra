name: Capture app authorization race-safe GO
# Carrier-native sole writer. Relevant authority/integration changes retrigger this pinned materializer.
# Exact-head checkout plus a remote-head compare immediately before publication makes concurrent
# carrier movement fail closed; the later carrier-changing push then queues a fresh exact subject.

on:
  push:
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - .github/workflows/capture-app-authorization-race-safe-go.yml
      - NembraApp/App/NembraCaptureFieldAuthorizationController.swift
      - Packages/NembraBluetoothCapture/Sources/NembraCaptureAppAuthorization/**
      - NembraCapture.xcodeproj/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-app-authorization-race-safe-go
  cancel-in-progress: false

jobs:
  materialize-test-publish:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TARGET_BRANCH: product/capture-1-0-main-20260818
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      SOURCE_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
      SELF_WORKFLOW: .github/workflows/capture-app-authorization-race-safe-go.yml
      STALE_RETRIGGER: .github/workflows/capture-app-authorization-retrigger-go.yml
      STALE_DIRECT: .github/workflows/capture-authority-v3-direct-materialize-once.yml
      MATERIALIZER_COMMIT: 3cf110f4ddaa3188ac2bcb44dd2393f1c1a69f10
      EXPECTED_MATERIALIZER_BLOB: 8a0baf6cbafa5c9a50e853a972b8f7a45c6131f3
      EXPECTED_SOURCE_WORKFLOW_BLOB: 497efb5bf0bfe1eb811eaac68efc56897f1b987b
      EXPECTED_APP_BLOB: 627c17949d15aaf26ca28c12abb9bb684ab0e731
    steps:
      - name: Checkout exact triggering carrier head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact reviewed materialization subjects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$MATERIALIZER_COMMIT" HEAD
          test "$(git rev-parse "$MATERIALIZER_COMMIT:$SELF_WORKFLOW")" = "$EXPECTED_MATERIALIZER_BLOB"
          test "$(git rev-parse HEAD:"$SOURCE_WORKFLOW")" = "$EXPECTED_SOURCE_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_APP_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute reviewed carrier-native lifecycle materializer
        shell: python
        run: |
          import os
          import subprocess
          import textwrap

          workflow_path = os.environ["SELF_WORKFLOW"]
          commit = os.environ["MATERIALIZER_COMMIT"]
          workflow = subprocess.check_output(
              ["git", "show", f"{commit}:{workflow_path}"],
              text=True,
          )
          start_marker = "      - name: Materialize canonical lifecycle transform\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Enforce transformed authority shape"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          program = textwrap.dedent(workflow[start:end])
          required = [
              "fieldBuildCanPrepareAuthorization",
              "prepareAuthorizationTransferDirectoryForFieldTransport",
              "admitOFF1Start",
              "admitAuthenticationStart",
              "admitOfficialConnectionStart",
              "admitObservationStart",
              "freezeAcceptedArtifactForAuthorizationSeal",
              "sealAfterAcceptedArtifactFreeze",
          ]
          for token in required:
              if token not in program:
                  raise SystemExit(f"pinned materializer missing required token: {token}")
          namespace = {
              "__name__": "__main__",
              "__file__": "<pinned-capture-app-authorization-race-safe-materializer>",
          }
          exec(compile(program, namespace["__file__"], "exec", dont_inherit=True), namespace)

      - name: Enforce transformed authority shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = "$APP_SOURCE"
          grep -Fq 'import NembraCaptureAppAuthorization' "$APP_SOURCE"
          grep -Fq 'fieldBuildCanPrepareAuthorization' "$APP_SOURCE"
          grep -Fq 'prepareAuthorizationTransferDirectoryForFieldTransport()' "$APP_SOURCE"
          grep -Fq 'buildIdentity.hasCompleteFieldBuildMetadata' "$APP_SOURCE"
          grep -Fq 'fieldBuildMetadataComplete' "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'fieldAuthorizationObservationAdmitted' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          grep -Fq 'field_authorization_or_artifact_freeze_rejected' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0

      - name: Run exact lifecycle source contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py -v

      - name: Run focused adversarial authorization contracts
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests
          swift test --filter TuyaFieldBuildPresentationAuthoritySourceTests
          swift test --filter CaptureP0RootVisualAcceptanceTests

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NembraCaptureAppAuthorizationPinnedGO" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish only the exact tested carrier subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

          rm -f "$SOURCE_WORKFLOW" "$SELF_WORKFLOW" "$STALE_RETRIGGER" "$STALE_DIRECT"
          git add -- "$APP_SOURCE"
          for retired in "$SOURCE_WORKFLOW" "$SELF_WORKFLOW" "$STALE_RETRIGGER" "$STALE_DIRECT"; do
            if git ls-files --error-unmatch "$retired" >/dev/null 2>&1; then
              git add -- "$retired"
            fi
          done
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(capture): wire one-time field authorization into SecureLink'
          materialized="$(git rev-parse HEAD)"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CAPTURE_APP_AUTHORIZATION_PINNED_GO materialized=%s trigger=%s physicalAuthorityCreated=false\n' "$materialized" "$GITHUB_SHA"
