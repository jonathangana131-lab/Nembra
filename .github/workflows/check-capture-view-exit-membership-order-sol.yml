name: Check Capture view-exit membership ordering

on:
  push:
    branches:
      - test/v14-capture-view-exit-membership-order-sol

permissions:
  contents: write

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Bind exact product and test-only scope
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=a267d0b6d16c1fee881dd23bc2ca5abc15baf9fe
          WORKFLOW=.github/workflows/check-capture-view-exit-membership-order-sol.yml
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          git merge-base --is-ancestor "$PRODUCT" HEAD
          actual="$(git diff --name-only "$PRODUCT" HEAD | sort)"
          expected="$(printf '%s\n%s\n' "$TEST" "$WORKFLOW" | sort)"
          test "$actual" = "$expected"

      - name: Parse and execute ordering assertions against current product
        shell: bash
        run: |
          set -euo pipefail
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          swiftc -parse "$TEST"
          python3 <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = source.index("    func abandonCorrelationForViewExit()")
          end = source.index("    var privateConfig: Bool", start)
          cleanup = source[start:end]
          required = {
              "revoke": "membershipRequestID = UUID()",
              "busy": "membershipBusy = false",
              "probe": "membershipProbe = nil",
              "early": "guard processCorrelationLease != nil || correlationSession != nil else { return }",
              "abandon": "abandonPackageCorrelation()",
          }
          offsets = {key: cleanup.index(value) for key, value in required.items()}
          if not (offsets["revoke"] < offsets["early"] and offsets["busy"] < offsets["early"] and offsets["probe"] < offsets["early"] < offsets["abandon"]):
              raise SystemExit("view-exit membership revocation ordering regressed")
          if "releasePackageCorrelationLease()" in cleanup:
              raise SystemExit("view-exit helper bypasses transport-first abandonment")
          verify_start = source.index("    func verifySDKMembership(completion:")
          verify_end = source.index("    func retry()", verify_start)
          verify = source[verify_start:verify_end]
          if "self.membershipRequestID == requestID" not in verify:
              raise SystemExit("membership completion lost exact-generation fence")
          baseline = source[source.index("    func startBaseline()"):source.index("    private func beginCorrelationSeries()")]
          auth = source[source.index("    func authenticate()"):source.index("    private func beginOfficialConnection(candidate: Candidate)")]
          if "verifySDKMembership" not in baseline or "self.beginCorrelationSeries()" not in baseline:
              raise SystemExit("pre-OFF1 membership path changed")
          if "verifySDKMembership" not in auth or "self.beginOfficialConnection(candidate: candidate)" not in auth:
              raise SystemExit("pre-auth membership path changed")
          PY
          git diff --check

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=a267d0b6d16c1fee881dd23bc2ca5abc15baf9fe
          WORKFLOW=.github/workflows/check-capture-view-exit-membership-order-sol.yml
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          rm "$WORKFLOW"
          test "$(git diff --name-only "$PRODUCT")" = "$TEST"
          git diff --check
          git add "$WORKFLOW"
          git config user.name "nembra-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci(capture): retire hidden membership ordering runner"
          git push origin "HEAD:${GITHUB_REF_NAME}"
