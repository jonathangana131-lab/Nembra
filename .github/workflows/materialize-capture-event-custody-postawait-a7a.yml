name: Materialize Capture post-await event custody a7a

on:
  push:
    branches:
      - fix/v14-capture-event-custody-postawait-a7a-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product ancestry and owned paths
        shell: bash
        run: |
          set -euo pipefail
          expected=a7a28ca6e744d4bad8be08fd3553a2af8c609b15
          test "$(git merge-base "$expected" HEAD)" = "$expected"
          unexpected="$(git diff --name-only "$expected"...HEAD | grep -Ev '^(Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift|\.github/workflows/materialize-capture-event-custody-postawait-a7a.yml)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changed paths:"; echo "$unexpected"; exit 1; }

      - name: Fence immutable application-event custody after actor hops
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          start = source.index("    private func receivedApplicationUpdate(")
          end = source.index("    private func redactedApplicationEventDetails(", start)
          receiver = source[start:end]

          refresh = "            await refreshLedgerSnapshot()\n"
          custody = "            var eventDetails = custodySafeUpdate\n"
          if receiver.count(refresh) != 1 or receiver.count(custody) != 1:
              raise SystemExit("Expected exact a7a application-custody suspension shape")
          if "sdk_source_authority_changed_before_application_event_custody" in receiver:
              raise SystemExit("Post-await authority fence already present; refresh product instead of replaying")

          fence_lines = [
              "            await refreshLedgerSnapshot()",
              "",
              "            // The ledger hops above may interleave account/view lifecycle changes. Revalidate",
              "            // the exact generation and account lease immediately before immutable event custody.",
              "            guard currentConnectionToken == token,",
              "                  phase == .observing,",
              "                  !acceptanceCutIsClosed,",
              "                  sdkAccountLoggedIn,",
              "                  sdkDeviceMembershipVerified,",
              "                  accountIdentityLeaseIsAuthorized,",
              "                  membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines) == leasedAccountUID else {",
              "                if currentConnectionToken == token {",
              "                    await invalidateSourceAuthority(",
              "                        token: token,",
              "                        message: \"SDK account/device authority changed before application evidence could enter event custody.\",",
              "                        kind: \"sdk_source_authority_changed_before_application_event_custody\"",
              "                    )",
              "                }",
              "                return",
              "            }",
              "",
          ]
          fence = "\n".join(fence_lines)
          receiver = receiver.replace(refresh, fence, 1)
          source = source[:start] + receiver + source[end:]
          path.write_text(source)
          PY

      - name: Verify post-await ordering and syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = source.index("    private func receivedApplicationUpdate(")
          end = source.index("    private func redactedApplicationEventDetails(", start)
          receiver = source[start:end]

          snapshot = receiver.index("let custodySafeUpdate = redactedApplicationEventDetails(update, accountUID: leasedAccountUID)")
          ledger = receiver.index("try await sessionLedger.recordApplicationUpdate", snapshot)
          refresh = receiver.index("await refreshLedgerSnapshot()", ledger)
          token = receiver.index("guard currentConnectionToken == token,", refresh)
          uid = receiver.index("membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines) == leasedAccountUID", token)
          custody = receiver.index("var eventDetails = custodySafeUpdate", uid)
          log = receiver.index('log("tuya_application_update"', custody)
          assert snapshot < ledger < refresh < token < uid < custody < log
          assert "sdk_source_authority_changed_before_application_event_custody" in receiver
          assert "phase == .observing" in receiver[token:uid]
          assert "sdkAccountLoggedIn" in receiver[token:uid]
          assert "sdkDeviceMembershipVerified" in receiver[token:uid]
          assert "accountIdentityLeaseIsAuthorized" in receiver[token:uid]
          PY
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          git diff --check

      - name: Commit exact-current repair and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-event-custody-postawait-a7a.yml
          git config user.name "nembra-sol-worker"
          git config user.email "nembra-sol-worker@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift .github/workflows/materialize-capture-event-custody-postawait-a7a.yml
          git diff --cached --check
          git commit -m "fix(capture): fence post-await application event custody"
          git push origin HEAD:fix/v14-capture-event-custody-postawait-a7a-sol
