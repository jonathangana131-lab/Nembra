name: Capture Guided Calibration Build

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-guided-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build guided Capture app
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Validate plist
        run: plutil -lint NembraApp/Info.plist

      - name: Enforce no application characteristic writes
        shell: bash
        run: |
          set -euo pipefail
          file='NembraApp/Features/Research/ES80CaptureShellView.swift'
          if grep -En '(^|[^A-Za-z])writeValue[[:space:]]*\(' "$file"; then
            echo 'ERROR: guided Capture utility must not call CoreBluetooth writeValue(...)'
            exit 1
          fi

      - name: Build iOS Simulator app only
        run: |
          set -o pipefail
          rm -rf /tmp/NembraGuidedCaptureDerived
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraGuidedCaptureDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-guided-capture-build.log

      - name: Verify product exists
        run: |
          test -d /tmp/NembraGuidedCaptureDerived/Build/Products/Debug-iphonesimulator/Nembra.app

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guided-capture-build-log
          path: /tmp/nembra-guided-capture-build.log
          if-no-files-found: ignore
