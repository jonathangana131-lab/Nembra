name: Capture Guided Calibration Build

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
  pull_request:
    branches:
      - capture/one-time-ble-dump-gpt56
    paths:
      - 'NembraApp/App/NembraCapture*.swift'
      - 'NembraApp/Features/Research/**'
      - 'Packages/NembraBluetoothCapture/**'
      - 'NembraCapture.xcodeproj/**'
      - 'Nembra.xcodeproj/**'
      - 'Podfile'
      - 'Scripts/bootstrap_capture_tuya_sdk.sh'
      - 'scripts/field/install_one_time_capture.command'
      - '.github/workflows/capture-guided-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-guided-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build guided Capture app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Validate project and private-SDK contract
        run: |
          set -euo pipefail
          plutil -lint NembraApp/Info.plist
          bash -n scripts/field/install_one_time_capture.command
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          ruby -c Podfile
          grep -Fq "pod 'ThingSmartCryption', :path => './LocalSecrets/TuyaSDK'" Podfile
          grep -Fq "pod 'ThingSmartHomeKit', '~> 7.8.0'" Podfile
          grep -Fq "pod 'ThingSmartBusinessExtensionKit', '~> 7.8.0'" Podfile
          grep -Fq 'LocalSecrets/' .gitignore
          grep -Fq 'XCLocalSwiftPackageReference "Packages/NembraBluetoothCapture"' NembraCapture.xcodeproj/project.pbxproj
          for source in \
            NembraCaptureP0Root.swift \
            NembraCaptureSecureLinkController.swift \
            NembraCaptureTuyaSDK.swift \
            NembraCaptureSecureLinkView.swift; do
            grep -Fq "$source" NembraCapture.xcodeproj/project.pbxproj
          done

      - name: Enforce read-only single-owner authority
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'NembraApp/App/NembraCaptureEntrypoint.swift'
            'NembraApp/App/NembraCaptureP0Root.swift'
            'NembraApp/App/NembraCaptureSecureLinkController.swift'
            'NembraApp/App/NembraCaptureTuyaSDK.swift'
            'NembraApp/App/NembraCaptureSecureLinkView.swift'
            'NembraApp/Features/Research/ES80CaptureShellView.swift'
          )
          banned='writeValue[[:space:]]*\(|publishDps[[:space:]]*\(|publishDps[[:space:]]*:|setDps[[:space:]]*\(|removeDevice[[:space:]]*\(|resetFactory[[:space:]]*\(|unbind[[:space:]]*\('
          if grep -En "$banned" "${files[@]}"; then
            echo 'ERROR: Capture must not expose CoreBluetooth writes or Tuya DP/control/reset/unbind calls.'
            exit 1
          fi
          if grep -En 'central[[:space:]]*\.[[:space:]]*connect[[:space:]]*\(' NembraApp/App/NembraCaptureSecureLinkController.swift; then
            echo 'ERROR: official Tuya SDK must remain the sole authenticated BLE connection owner.'
            exit 1
          fi
          grep -Fq 'TuyaAuthenticatedReadOnlySessionLedger' NembraApp/App/NembraCaptureSecureLinkController.swift
          grep -Fq 'TuyaSDKAccountDeviceMembershipGate' NembraApp/App/NembraCaptureSecureLinkController.swift
          grep -Fq 'recordApplicationUpdate' NembraApp/App/NembraCaptureSecureLinkController.swift
          grep -Fq 'ThingSmartHomeManager' NembraApp/App/NembraCaptureTuyaSDK.swift
          grep -Fq 'sharedDeviceList' NembraApp/App/NembraCaptureTuyaSDK.swift
          grep -Fq 'ThingSmartBLEManager.sharedInstance().connectBLE' NembraApp/App/NembraCaptureTuyaSDK.swift
          grep -Fq 'sendVerifyCode' NembraApp/App/NembraCaptureTuyaSDK.swift
          if grep -En 'login\([^\n]*(password:|withPassword:)|loginBy(Email|Phone)|loginWith(Email|Phone)[^\n]*password' NembraApp/App/NembraCaptureTuyaSDK.swift; then
            echo 'ERROR: Capture must not collect/use a Tuya account password.'
            exit 1
          fi

      - name: Test Tuya authenticated authority
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaAuthenticatedReadOnlyPreflightTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaAuthenticatedReadOnlySessionLedgerTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaSDKAccountDeviceMembershipGateTests

      # Public CI intentionally has no private Tuya security package. The source must
      # therefore compile and remain fail-closed without claiming a provisioned field build.
      - name: Build standalone Capture Simulator fallback
        run: |
          set -o pipefail
          rm -rf /tmp/NembraCaptureSimulatorDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureSimulatorDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-capture-simulator-build.log

      - name: Verify standalone Simulator product exists
        run: test -d '/tmp/NembraCaptureSimulatorDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app'

      - name: Build standalone Capture iPhone fallback unsigned
        run: |
          set -o pipefail
          rm -rf /tmp/NembraCaptureDeviceDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/NembraCaptureDeviceDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-capture-device-build.log

      - name: Verify standalone iPhone product exists
        run: test -d '/tmp/NembraCaptureDeviceDerived/Build/Products/Debug-iphoneos/Nembra Capture.app'

      - name: Build Nembra Simulator regression
        run: |
          set -o pipefail
          rm -rf /tmp/NembraGuidedCaptureSimulatorDerived
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraGuidedCaptureSimulatorDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-guided-capture-simulator-build.log

      - name: Verify Nembra Simulator product exists
        run: test -d /tmp/NembraGuidedCaptureSimulatorDerived/Build/Products/Debug-iphonesimulator/Nembra.app

      - name: Build Nembra iPhone regression unsigned
        run: |
          set -o pipefail
          rm -rf /tmp/NembraGuidedCaptureDeviceDerived
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/NembraGuidedCaptureDeviceDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-guided-capture-device-build.log

      - name: Verify Nembra iPhone product exists
        run: test -d /tmp/NembraGuidedCaptureDeviceDerived/Build/Products/Debug-iphoneos/Nembra.app

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guided-capture-build-logs
          path: |
            /tmp/nembra-capture-simulator-build.log
            /tmp/nembra-capture-device-build.log
            /tmp/nembra-guided-capture-simulator-build.log
            /tmp/nembra-guided-capture-device-build.log
          if-no-files-found: ignore
