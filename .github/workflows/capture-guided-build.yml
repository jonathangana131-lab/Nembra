name: Capture Guided Calibration Build

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-guided-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build guided Capture app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Validate plist, installers, and Tuya SDK contract
        run: |
          set -euo pipefail
          plutil -lint NembraApp/Info.plist
          bash -n scripts/field/install_one_time_capture.command
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          bash -n Scripts/provision_capture_tuya_identity.sh
          ruby -c Podfile
          grep -Fq "pod 'ThingSmartCryption', :path => './LocalSecrets/TuyaSDK'" Podfile
          grep -Fq "pod 'NembraTuyaPrivateConfig', :path => './LocalSecrets/TuyaRuntime'" Podfile
          grep -Fq "pod 'ThingSmartHomeKit', '~> 7.8.0'" Podfile
          grep -Fq "pod 'ThingSmartBusinessExtensionKit', '~> 7.8.0'" Podfile
          grep -Fq 'LocalSecrets/' .gitignore

      - name: Enforce active Capture read-only and SDK-account contract
        shell: bash
        run: |
          set -euo pipefail
          active='NembraApp/App/NembraCaptureEntrypoint.swift'
          legacy='NembraApp/Features/Research/ES80CaptureShellView.swift'
          installer='scripts/field/install_one_time_capture.command'

          # The currently installed Capture entrypoint and the retained legacy shell
          # must not grow a direct CoreBluetooth application write path. Documented
          # Tuya SDK authentication/session establishment remains the only allowed
          # transport writer for this preflight.
          if grep -En '(^|[^A-Za-z])writeValue[[:space:]]*\(' "$active" "$legacy"; then
            echo 'ERROR: Capture preflight must not call CoreBluetooth writeValue(...)'
            exit 1
          fi

          # The official SDK account gate must remain present; metadata QR approval
          # alone is not accepted as BLE authentication authority. Check selector
          # labels independently so normal multiline Swift formatting stays valid.
          grep -Fq 'ThingSmartUser.sharedInstance()' "$active"
          grep -Fq 'sendVerifyCode' "$active"
          grep -Fq 'withUserName:' "$active"
          grep -Fq 'withEmail:' "$active"
          grep -Fq 'withMobile:' "$active"
          grep -Fq 'ThingSmartBLEManager.sharedInstance().connectBLE' "$active"

          # Field AppKey/AppSecret authority must come only from the ignored local
          # NembraTuyaPrivateConfig pod. Reintroducing ProcessInfo launch secrets or
          # devicectl environment arguments would expose the app secret via host argv.
          grep -Fq 'canImport(NembraTuyaPrivateConfig)' "$active"
          grep -Fq 'NembraTuyaPrivateIdentity.appKey' "$active"
          grep -Fq 'NembraTuyaPrivateIdentity.appSecret' "$active"
          if grep -Fq 'ProcessInfo.processInfo.environment["NEMBRA_TUYA_APP_' "$active"; then
            echo 'ERROR: Capture must not source Tuya AppKey/AppSecret from launch environment'
            exit 1
          fi
          if grep -Fq -- '--environment-variables' "$installer"; then
            echo 'ERROR: field installer must not pass Tuya secrets through devicectl argv'
            exit 1
          fi

          # The official SDK currently delivers structured dpsUpdate dictionaries,
          # not byte-exact FD50 payloads. The app must advance canonical chronology
          # through the structured-update API rather than serializing/synthesizing
          # bytes to satisfy an old Data-taking ledger contract.
          if grep -Fq 'recordApplicationPayload(' "$active"; then
            echo 'ERROR: Capture must use recordApplicationUpdate(isNonEmpty:) for SDK dpsUpdate evidence'
            exit 1
          fi
          grep -Fq 'recordApplicationUpdate(isNonEmpty:' "$active"

          # Keep password-based Tuya login out of the field utility. Verification-code
          # login is sufficient and avoids collecting/persisting the account password.
          if grep -En 'login\([^\n]*(password:|withPassword:)|loginBy(Email|Phone)|loginWith(Email|Phone)[^\n]*password' "$active"; then
            echo 'ERROR: Capture must not collect/use a Tuya account password'
            exit 1
          fi

      - name: Test Tuya authenticated preflight authority
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/NembraBluetoothCapture \
            --filter TuyaAuthenticatedReadOnlyPreflightTests

      # This is the exact standalone project Joey installs for field learning.
      # CI intentionally compiles it without the private Tuya security package;
      # canImport(ThingSmartHomeKit) therefore stays false and the app must remain
      # fail-closed. A green result proves the real Capture sources/project wiring
      # compile, not that the privately provisioned physical candidate is accepted.
      - name: Build standalone Capture Simulator fallback
        run: |
          set -o pipefail
          rm -rf /tmp/NembraCaptureSimulatorDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureSimulatorDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-capture-simulator-build.log

      - name: Verify standalone Simulator product exists
        run: |
          test -d '/tmp/NembraCaptureSimulatorDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app'

      - name: Build standalone Capture iPhone fallback unsigned
        run: |
          set -o pipefail
          rm -rf /tmp/NembraCaptureDeviceDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/NembraCaptureDeviceDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-capture-device-build.log

      - name: Verify standalone iPhone product exists
        run: |
          test -d '/tmp/NembraCaptureDeviceDerived/Build/Products/Debug-iphoneos/Nembra Capture.app'

      # Keep the normal Nembra build as a regression gate because this long-lived
      # research branch also carries app/package changes. It is not the Capture
      # product acceptance gate and must not substitute for the standalone build.
      - name: Build Nembra Simulator regression
        run: |
          set -o pipefail
          rm -rf /tmp/NembraGuidedCaptureSimulatorDerived
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraGuidedCaptureSimulatorDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-guided-capture-simulator-build.log

      - name: Verify Nembra Simulator product exists
        run: |
          test -d /tmp/NembraGuidedCaptureSimulatorDerived/Build/Products/Debug-iphonesimulator/Nembra.app

      - name: Build Nembra iPhone regression unsigned
        run: |
          set -o pipefail
          rm -rf /tmp/NembraGuidedCaptureDeviceDerived
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/NembraGuidedCaptureDeviceDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-guided-capture-device-build.log

      - name: Verify Nembra iPhone product exists
        run: |
          test -d /tmp/NembraGuidedCaptureDeviceDerived/Build/Products/Debug-iphoneos/Nembra.app

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guided-capture-build-logs
          path: |
            /tmp/nembra-capture-simulator-build.log
            /tmp/nembra-capture-device-build.log
            /tmp/nembra-guided-capture-simulator-build.log
            /tmp/nembra-guided-capture-device-build.log
          if-no-files-found: ignore
