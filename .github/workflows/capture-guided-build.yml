name: Capture Guided Calibration Build

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-guided-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build guided Capture app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Validate plist, installers, and Tuya SDK contract
        run: |
          set -euo pipefail
          plutil -lint NembraApp/Info.plist
          bash -n scripts/field/install_one_time_capture.command
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          ruby -c Podfile
          grep -Fq "pod 'ThingSmartCryption', :path => './LocalSecrets/TuyaSDK'" Podfile
          grep -Fq "pod 'ThingSmartHomeKit', '~> 7.8.0'" Podfile
          grep -Fq "pod 'ThingSmartBusinessExtensionKit', '~> 7.8.0'" Podfile
          grep -Fq 'LocalSecrets/' .gitignore

      - name: Enforce Capture read-only control boundary
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'NembraApp/Features/Research/ES80CaptureShellView.swift'
            'NembraApp/App/NembraCaptureEntrypoint.swift'
          )
          banned='writeValue[[:space:]]*\(|publishDps[[:space:]]*\(|publishDps[[:space:]]*:|setDps[[:space:]]*\(|removeDevice[[:space:]]*\(|resetFactory[[:space:]]*\(|unbind[[:space:]]*\('
          if grep -En "$banned" "${files[@]}"; then
            echo 'ERROR: Capture must not expose CoreBluetooth writes or Tuya DP/control/reset/unbind calls.'
            exit 1
          fi
          if grep -En 'central[[:space:]]*\.[[:space:]]*connect[[:space:]]*\(' NembraApp/App/NembraCaptureEntrypoint.swift; then
            echo 'ERROR: after identification, the official Tuya SDK must remain the sole authenticated BLE connection owner.'
            exit 1
          fi

      - name: Test Tuya authenticated preflight authority
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/NembraBluetoothCapture \
            --filter TuyaAuthenticatedReadOnlyPreflightTests

      - name: Build standalone Capture Simulator target
        run: |
          set -o pipefail
          rm -rf /tmp/NembraStandaloneCaptureSimulatorDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraStandaloneCaptureSimulatorDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-standalone-capture-simulator-build.log

      - name: Verify standalone Capture Simulator product exists
        run: |
          test -d '/tmp/NembraStandaloneCaptureSimulatorDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app'

      - name: Build standalone Capture physical-iPhone target unsigned
        run: |
          set -o pipefail
          rm -rf /tmp/NembraStandaloneCaptureDeviceDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/NembraStandaloneCaptureDeviceDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-standalone-capture-device-build.log

      - name: Verify standalone Capture iPhone product exists
        run: |
          test -d '/tmp/NembraStandaloneCaptureDeviceDerived/Build/Products/Debug-iphoneos/Nembra Capture.app'

      - name: Build integrated Nembra Simulator app
        run: |
          set -o pipefail
          rm -rf /tmp/NembraGuidedCaptureSimulatorDerived
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraGuidedCaptureSimulatorDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-guided-capture-simulator-build.log

      - name: Verify integrated Simulator product exists
        run: |
          test -d /tmp/NembraGuidedCaptureSimulatorDerived/Build/Products/Debug-iphonesimulator/Nembra.app

      - name: Build integrated Nembra physical iPhone target unsigned
        run: |
          set -o pipefail
          rm -rf /tmp/NembraGuidedCaptureDeviceDerived
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/NembraGuidedCaptureDeviceDerived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/nembra-guided-capture-device-build.log

      - name: Verify integrated iPhone product exists
        run: |
          test -d /tmp/NembraGuidedCaptureDeviceDerived/Build/Products/Debug-iphoneos/Nembra.app

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guided-capture-build-logs
          path: |
            /tmp/nembra-standalone-capture-simulator-build.log
            /tmp/nembra-standalone-capture-device-build.log
            /tmp/nembra-guided-capture-simulator-build.log
            /tmp/nembra-guided-capture-device-build.log
          if-no-files-found: ignore
