name: Capture private tree snapshot recovery materializer

on:
  push:
    branches:
      - agent/v14-capture-private-tree-snapshot-recovery-sol
    paths:
      - .github/workflows/capture-private-tree-snapshot-recovery-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v14-capture-private-tree-snapshot-recovery-sol
          fetch-depth: 0

      - name: Bind exact current product and disjoint donor paths
        shell: bash
        run: |
          set -euo pipefail
          current='e18181d7cc06bb43d569eff07dbc5f3e2c3428ae'
          donor='17a77b6526a0daede10247f898cffa94476328ff'
          git merge-base --is-ancestor "$current" HEAD
          git fetch --no-tags origin sol/v14-capture-private-tree-custody-29000
          donor_parent="$(git rev-parse "$donor^")"
          git diff --quiet "$donor_parent" "$current" -- \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          test -z "$(git diff --name-only "$current" HEAD -- ':!.github/workflows/capture-private-tree-snapshot-recovery-materialize.yml')"

      - name: Transplant reviewed donor and close final pathname race
        shell: bash
        run: |
          set -euo pipefail
          donor='17a77b6526a0daede10247f898cffa94476328ff'
          git show "$donor:Scripts/capture_tuya_private_input_provenance.py" > Scripts/capture_tuya_private_input_provenance.py
          git show "$donor:scripts/ci/tests/test_capture_tuya_private_input_provenance.py" > scripts/ci/tests/test_capture_tuya_private_input_provenance.py

          python3 - <<'PY'
          from pathlib import Path

          helper = Path("Scripts/capture_tuya_private_input_provenance.py")
          source = helper.read_text()
          old = (
              "            or current_path.st_dev != after.st_dev\n"
              "            or current_path.st_ino != after.st_ino\n"
          )
          new = "            or _stat_identity(current_path) != _stat_identity(after)\n"
          if source.count(old) != 1:
              raise SystemExit(f"stable-file pathname identity fence changed; matches={source.count(old)}")
          helper.write_text(source.replace(old, new, 1))

          tests = Path("scripts/ci/tests/test_capture_tuya_private_input_provenance.py")
          test_source = tests.read_text()
          marker = "    def test_tree_rejects_file_replacement_after_individual_fingerprint(self) -> None:\n"
          if test_source.count(marker) != 1:
              raise SystemExit("tree race test insertion marker changed")
          regression_lines = [
              "    def test_file_fingerprint_rejects_same_inode_mutation_after_final_descriptor_stat(self) -> None:",
              "        target = self.security_podspec",
              "        size = target.stat().st_size",
              "        inode = target.stat().st_ino",
              "        original_lstat = Path.lstat",
              "        mutated = False",
              "",
              "        def mutate_then_lstat(path: Path) -> os.stat_result:",
              "            nonlocal mutated",
              "            if path == target and not mutated:",
              "                mutated = True",
              "                target.write_bytes(b\"Q\" * size)",
              "            return original_lstat(path)",
              "",
              "        with mock.patch.object(Path, \"lstat\", autospec=True, side_effect=mutate_then_lstat):",
              "            with self.assertRaises(provenance.ProvenanceError):",
              "                provenance._file_fingerprint(target)",
              "",
              "        self.assertTrue(mutated)",
              "        self.assertEqual(target.stat().st_ino, inode)",
              "",
              "",
          ]
          regression = "\n".join(regression_lines)
          tests.write_text(test_source.replace(marker, regression + marker, 1))
          PY
          git diff --check

      - name: Run complete private provenance adversarial suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          python3 -m py_compile scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py

          python3 - <<'PY'
          from pathlib import Path
          s = Path("Scripts/capture_tuya_private_input_provenance.py").read_text()
          t = Path("scripts/ci/tests/test_capture_tuya_private_input_provenance.py").read_text()
          assert "_stat_identity(current_path) != _stat_identity(after)" in s
          assert "current_path.st_dev != after.st_dev" not in s
          assert "current_path.st_ino != after.st_ino" not in s
          assert "test_file_fingerprint_rejects_same_inode_mutation_after_final_descriptor_stat" in t
          assert "test_tree_rejects_entry_added_after_directory_enumeration" in t
          assert "test_tree_rejects_file_replacement_after_individual_fingerprint" in t
          PY

      - name: Collapse to exact two-path corrected repair
        shell: bash
        run: |
          set -euo pipefail
          current='e18181d7cc06bb43d569eff07dbc5f3e2c3428ae'
          rm .github/workflows/capture-private-tree-snapshot-recovery-materialize.yml
          git add -A
          git diff --cached --check "$current"
          git diff --cached --name-only "$current" | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          Scripts/capture_tuya_private_input_provenance.py
          scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): bind private tree fingerprints to stable snapshots'
          git push origin HEAD:agent/v14-capture-private-tree-snapshot-recovery-sol
