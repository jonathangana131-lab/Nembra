name: Validate Capture export secret classifier

on:
  push:
    branches:
      - agent/v14-capture-export-secret-classifier-sol

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Verify exact current-product ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          expected='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          git merge-base --is-ancestor "$expected" HEAD
          actual="$(git diff --name-only "$expected" HEAD | sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/validate-capture-export-secret-classifier-sol.yml' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift' | sort)"
          test "$actual" = "$wanted"

      - name: Compile and execute portable sanitizer behavior
        shell: bash
        run: |
          set -euo pipefail
          source='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift'
          test_source='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift'

          swiftc -warnings-as-errors -emit-library -module-name SanitizerProbe "$source" -o /tmp/libSanitizerProbe.so
          swiftc -frontend -parse "$test_source"

          cp "$source" /tmp/main.swift
          cat >> /tmp/main.swift <<'SWIFT'

          private func require(_ condition: @autoclosure () -> Bool, _ message: String) {
              guard condition() else {
                  fatalError(message)
              }
          }

          let promisedSpellings = [
              "local_key", "session-key", "app.key", "appSecret", "password",
              "account_token", "accessToken", "refresh-token", "auth_key", "secKey"
          ]
          for key in promisedSpellings {
              require(TuyaApplicationUpdateSecretSanitizer.isSecretKey(key), "missing secret class: \(key)")
          }

          let projected = TuyaApplicationUpdateSecretSanitizer.sanitizeForStringProjection([
              "password": "do-not-export",
              "ordinary": "evidence",
              "nested": [
                  "session_key": "session-value",
                  "items": [["appSecret": "app-secret-value"], ["watts": 120]],
              ],
          ])
          require(projected["password"] == "<redacted>", "top-level secret escaped")
          require(projected["ordinary"] == "evidence", "ordinary evidence changed")
          require(projected["nested"]?.contains("session-value") == false, "nested session key escaped")
          require(projected["nested"]?.contains("app-secret-value") == false, "nested app secret escaped")
          require(projected["nested"]?.contains("<redacted>") == true, "nested redaction marker missing")
          require(!TuyaApplicationUpdateSecretSanitizer.isSecretKey("battery"), "ordinary battery key over-redacted")
          SWIFT

          swiftc -warnings-as-errors /tmp/main.swift -o /tmp/sanitizer-probe
          /tmp/sanitizer-probe
          git diff --check

      - name: Retire validation workflow checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-capture-export-secret-classifier-sol.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only)" = '.github/workflows/validate-capture-export-secret-classifier-sol.yml'
          git commit -m 'chore(capture): retire classifier validation helper'
          git push origin HEAD:agent/v14-capture-export-secret-classifier-sol
