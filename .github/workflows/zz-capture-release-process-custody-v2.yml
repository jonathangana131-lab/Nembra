name: Capture release process custody v2
on:
  push:
    branches: [agent/capture-release-process-custody-v14]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard transform checkpoint
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5270a09b2df1741240ac678f10585d87856464da"
      - name: Recover red-team tests
        run: |
          set -euo pipefail
          git fetch --no-tags origin f1bd5e25f61431b03c614793eaa5c255c489b27f 8af5a1dc4628bf205b52961d2aa26647cd12dbeb
          git show f1bd5e25f61431b03c614793eaa5c255c489b27f:scripts/ci/tests/test_xcode27_signed_field_candidate_process_custody_source.py > scripts/ci/tests/test_xcode27_signed_field_candidate_process_custody_source.py
          git show 8af5a1dc4628bf205b52961d2aa26647cd12dbeb:scripts/ci/tests/test_xcode27_signed_field_candidate_git_environment_custody_source.py > scripts/ci/tests/test_xcode27_signed_field_candidate_git_environment_custody_source.py
          git show 8af5a1dc4628bf205b52961d2aa26647cd12dbeb:scripts/ci/tests/test_xcode27_signed_field_candidate_xcode_environment_custody_source.py > scripts/ci/tests/test_xcode27_signed_field_candidate_xcode_environment_custody_source.py
          python3 scripts/ci/_tmp_release_process_custody_transform.py
      - name: Validate combined custody
        run: |
          set -euo pipefail
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_python_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_descriptor_subject_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_process_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_git_environment_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_xcode_environment_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          git diff --check
      - name: Commit product repair
        run: |
          set -euo pipefail
          rm .github/workflows/zz-capture-release-process-custody-transform.yml
          rm .github/workflows/zz-capture-release-process-custody-v2.yml
          rm scripts/ci/_tmp_release_process_custody_transform.py
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): isolate release process authority"
          git push origin HEAD:agent/capture-release-process-custody-v14
