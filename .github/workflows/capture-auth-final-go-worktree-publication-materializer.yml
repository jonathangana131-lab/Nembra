name: Capture Final GO Worktree Publication Materializer

on:
  push:
    branches:
      - repair/v14-auth-final-go-worktree-publication-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind exact current control parent
        shell: bash
        run: |
          set -euo pipefail
          expected='a79681b538ffdd70b0538c251438f8590c6f0b9f'
          git merge-base --is-ancestor "$expected" HEAD
          test "$(git diff --name-only "$expected"..HEAD | wc -l | tr -d ' ')" = '1'
          test "$(git diff --name-only "$expected"..HEAD)" = '.github/workflows/capture-auth-final-go-worktree-publication-materializer.yml'
      - name: Materialize source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/ci/es80_authenticated_stationary_final_go.py')
          s=p.read_text()
          a=s.index('def candidate(repo:Path,source:str):')
          b=s.index('\ndef device_hash(path:Path):',a)
          candidate=(
          'def candidate(repo:Path,source:str):\n'
          '    root=repo.expanduser().resolve(strict=True)\n'
          '    if canon(git(root,"rev-parse","HEAD"),"candidate HEAD")!=source or git(root,"status","--porcelain=v1","--untracked-files=all"): raise GoError("candidate checkout is not exact clean accepted source")\n'
          '    authority=(("installer",INSTALLER),("runbook",RUNBOOK),("buildIdentity",IDENTITY))\n'
          '    blobs={key:git(root,"rev-parse",f"HEAD:{path}").lower() for key,path in authority}\n'
          '    if any(not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}",x) for x in blobs.values()): raise GoError("candidate Git blob invalid")\n'
          '    paths=[root/path for _,path in authority]\n'
          '    if any(not path.is_file() or path.is_symlink() for path in paths): raise GoError("candidate authority path is not a regular non-symlink file")\n'
          '    for key,path in authority:\n'
          '        if git(root,"hash-object","--no-filters","--",path).lower()!=blobs[key]: raise GoError(f"candidate working {key} bytes differ from accepted Git blob")\n'
          '    ins=paths[0].read_text(); rb=paths[1].read_text(); ident=paths[2].read_text()\n'
          '    for key,path in authority:\n'
          '        if git(root,"hash-object","--no-filters","--",path).lower()!=blobs[key]: raise GoError(f"candidate working {key} bytes changed during authority read")\n'
          '    if f\'PROCEDURE_ID="{PROC}"\' not in ins or f\'BUNDLE_ID="{BUNDLE}"\' not in ins or f"PROCEDURE_ID: `{PROC}`" not in rb or f\'static let requiredFieldProcedureIdentifier = "{PROC}"\' not in ident or "ES80-FINGERPRINT-v1" in ins or "NEMBRA_ES80_TODAY_RESEARCH" in ins: raise GoError("candidate carries wrong/retired field authority")\n'
          '    return {"sourceCommitSHA":source,"installerGitBlob":blobs["installer"],"runbookGitBlob":blobs["runbook"],"buildIdentityGitBlob":blobs["buildIdentity"]}\n'
          )
          s=s[:a]+candidate+s[b+1:]
          a=s.index('def publication():')
          b=s.index('\ndef main(argv=None):',a)
          publication=(
          'def publication():\n'
          '    p=Path(__file__).with_name("es80_today_final_go_publication.py"); spec=importlib.util.spec_from_file_location("pub",p)\n'
          '    if not spec or not spec.loader: raise GoError("publication helper unavailable")\n'
          '    module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); return module\n\n'
          'def publish_go_record(output:Path,raw:bytes,module_loader=publication):\n'
          '    module=module_loader(); publication_error=getattr(module,"FinalGoPublicationError",None)\n'
          '    try:return module.publish_record_no_replace(output,raw)\n'
          '    except Exception as error:\n'
          '        if isinstance(publication_error,type) and isinstance(error,publication_error): raise GoError(f"GO record publication rejected: {error}") from error\n'
          '        raise\n'
          )
          s=s[:a]+publication+s[b+1:]
          old='d=publication().publish_record_no_replace(a.output,raw)'
          if s.count(old)!=1: raise SystemExit(f'publication call count={s.count(old)}')
          s=s.replace(old,'d=publish_go_record(a.output,raw)',1)
          p.write_text(s)
          PY
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py
          git diff --check
          grep -Fq 'hash-object","--no-filters' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'd=publish_go_record(a.output,raw)' scripts/ci/es80_authenticated_stationary_final_go.py
      - name: Commit product source repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --short | wc -l | tr -d ' ')" = '1'
          test "$(git status --short | sed 's/^...//')" = 'scripts/ci/es80_authenticated_stationary_final_go.py'
          git config user.name 'nembra-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/ci/es80_authenticated_stationary_final_go.py
          git commit -m 'fix(capture): bind Final-GO working authority bytes'
          git push origin HEAD:repair/v14-auth-final-go-worktree-publication-sol
