name: Capture Final GO Worktree Publication Materializer

on:
  push:
    branches:
      - repair/v14-auth-final-go-worktree-publication-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind exact current control parent
        shell: bash
        run: |
          set -euo pipefail
          expected='a79681b538ffdd70b0538c251438f8590c6f0b9f'
          git merge-base --is-ancestor "$expected" HEAD
          test "$(git diff --name-only "$expected"..HEAD | wc -l | tr -d ' ')" = '1'
          test "$(git diff --name-only "$expected"..HEAD)" = '.github/workflows/capture-auth-final-go-worktree-publication-materializer.yml'
      - name: Materialize reviewed custody fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/ci/es80_authenticated_stationary_final_go.py')
          source = source_path.read_text()
          old_candidate = '''def candidate(repo:Path,source:str):
              root=repo.expanduser().resolve(strict=True)
              if canon(git(root,"rev-parse","HEAD"),"candidate HEAD")!=source or git(root,"status","--porcelain=v1","--untracked-files=all"): raise GoError("candidate checkout is not exact clean accepted source")
              blobs={k:git(root,"rev-parse",f"HEAD:{p}").lower() for k,p in (("installer",INSTALLER),("runbook",RUNBOOK),("buildIdentity",IDENTITY))}
              if any(not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}",x) for x in blobs.values()): raise GoError("candidate Git blob invalid")
              paths=[root/INSTALLER,root/RUNBOOK,root/IDENTITY]
              if any(not p.is_file() or p.is_symlink() for p in paths): raise GoError("candidate authority path is not a regular non-symlink file")
              ins=paths[0].read_text(); rb=paths[1].read_text(); ident=paths[2].read_text()
              if f'PROCEDURE_ID="{PROC}"' not in ins or f'BUNDLE_ID="{BUNDLE}"' not in ins or f"PROCEDURE_ID: `{PROC}`" not in rb or f'static let requiredFieldProcedureIdentifier = "{PROC}"' not in ident or "ES80-FINGERPRINT-v1" in ins or "NEMBRA_ES80_TODAY_RESEARCH" in ins: raise GoError("candidate carries wrong/retired field authority")
              return {"sourceCommitSHA":source,"installerGitBlob":blobs["installer"],"runbookGitBlob":blobs["runbook"],"buildIdentityGitBlob":blobs["buildIdentity"]}
          '''
          new_candidate = '''def candidate(repo:Path,source:str):
              root=repo.expanduser().resolve(strict=True)
              if canon(git(root,"rev-parse","HEAD"),"candidate HEAD")!=source or git(root,"status","--porcelain=v1","--untracked-files=all"): raise GoError("candidate checkout is not exact clean accepted source")
              authority=(("installer",INSTALLER),("runbook",RUNBOOK),("buildIdentity",IDENTITY))
              blobs={key:git(root,"rev-parse",f"HEAD:{path}").lower() for key,path in authority}
              if any(not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}",x) for x in blobs.values()): raise GoError("candidate Git blob invalid")
              paths=[root/path for _,path in authority]
              if any(not p.is_file() or p.is_symlink() for p in paths): raise GoError("candidate authority path is not a regular non-symlink file")
              for key,path in authority:
                  raw_blob=git(root,"hash-object","--no-filters","--",path).lower()
                  if raw_blob!=blobs[key]: raise GoError(f"candidate working {key} bytes differ from accepted Git blob")
              ins=paths[0].read_text(); rb=paths[1].read_text(); ident=paths[2].read_text()
              for key,path in authority:
                  raw_blob=git(root,"hash-object","--no-filters","--",path).lower()
                  if raw_blob!=blobs[key]: raise GoError(f"candidate working {key} bytes changed during authority read")
              if f'PROCEDURE_ID="{PROC}"' not in ins or f'BUNDLE_ID="{BUNDLE}"' not in ins or f"PROCEDURE_ID: `{PROC}`" not in rb or f'static let requiredFieldProcedureIdentifier = "{PROC}"' not in ident or "ES80-FINGERPRINT-v1" in ins or "NEMBRA_ES80_TODAY_RESEARCH" in ins: raise GoError("candidate carries wrong/retired field authority")
              return {"sourceCommitSHA":source,"installerGitBlob":blobs["installer"],"runbookGitBlob":blobs["runbook"],"buildIdentityGitBlob":blobs["buildIdentity"]}
          '''
          old_candidate = old_candidate.replace('          ', '')
          new_candidate = new_candidate.replace('          ', '')
          if source.count(old_candidate) != 1:
              raise SystemExit(f'candidate anchor count={source.count(old_candidate)}')
          source = source.replace(old_candidate, new_candidate, 1)

          old_publication = '''def publication():
              p=Path(__file__).with_name("es80_today_final_go_publication.py"); s=importlib.util.spec_from_file_location("pub",p)
              if not s or not s.loader: raise GoError("publication helper unavailable")
              m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m

          def main(argv=None):
          '''.replace('          ', '')
          new_publication = '''def publication():
              p=Path(__file__).with_name("es80_today_final_go_publication.py"); s=importlib.util.spec_from_file_location("pub",p)
              if not s or not s.loader: raise GoError("publication helper unavailable")
              m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m

          def publish_go_record(output:Path,raw:bytes,module_loader=publication):
              module=module_loader(); publication_error=getattr(module,"FinalGoPublicationError",None)
              try:return module.publish_record_no_replace(output,raw)
              except Exception as error:
                  if isinstance(publication_error,type) and isinstance(error,publication_error): raise GoError(f"GO record publication rejected: {error}") from error
                  raise

          def main(argv=None):
          '''.replace('          ', '')
          if source.count(old_publication) != 1:
              raise SystemExit(f'publication anchor count={source.count(old_publication)}')
          source = source.replace(old_publication, new_publication, 1)
          old_call = 'raw=(json.dumps(r,indent=2,sort_keys=True)+"\\n").encode(); d=publication().publish_record_no_replace(a.output,raw)'
          new_call = 'raw=(json.dumps(r,indent=2,sort_keys=True)+"\\n").encode(); d=publish_go_record(a.output,raw)'
          if source.count(old_call) != 1:
              raise SystemExit(f'publication call count={source.count(old_call)}')
          source = source.replace(old_call, new_call, 1)
          source_path.write_text(source)

          test_path = Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go.py')
          tests = test_path.read_text()
          old_end = "if __name__=='__main__':unittest.main(verbosity=2)"
          additions = ''' def test_candidate_rejects_clean_filter_worktree_bytes_that_do_not_match_head_blob(self):
              installer=self.f.repo/go.INSTALLER;original=installer.read_text();installer.write_text(original+'# local-filter-only\\n')
              info=self.f.repo/'.git/info/attributes';info.write_text(f'{go.INSTALLER} filter=nembra-hide-local\\n')
              subprocess.run(['/usr/bin/git','-C',str(self.f.repo),'config','filter.nembra-hide-local.clean',"sed '/# local-filter-only$/d'"],check=True)
              subprocess.run(['/usr/bin/git','-C',str(self.f.repo),'config','filter.nembra-hide-local.smudge','cat'],check=True)
              self.assertEqual(subprocess.check_output(['/usr/bin/git','-C',str(self.f.repo),'status','--porcelain=v1','--untracked-files=all'],text=True).strip(),'')
              self.no(lambda:go.candidate(self.f.repo,self.f.s))
             def test_publication_helper_error_is_translated_to_goerror(self):
              class FakePublication:
               class FinalGoPublicationError(RuntimeError):pass
               @staticmethod
               def publish_record_no_replace(path,raw):raise FakePublication.FinalGoPublicationError('occupied output')
              with self.assertRaises(go.GoError):go.publish_go_record(self.f.r/'go.json',b'{}\\n',module_loader=lambda:FakePublication)
             if __name__=='__main__':unittest.main(verbosity=2)'''
          additions = additions.replace('             ', '')
          if tests.count(old_end) != 1:
              raise SystemExit(f'test end count={tests.count(old_end)}')
          test_path.write_text(tests.replace(old_end, additions, 1))
          PY
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          git diff --check
      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/capture-auth-final-go-worktree-publication-materializer.yml
          git diff --check
          test "$(git status --short | wc -l | tr -d ' ')" = '3'
          git config user.name 'nembra-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): bind Final-GO working authority bytes'
          git push origin HEAD:repair/v14-auth-final-go-worktree-publication-sol
