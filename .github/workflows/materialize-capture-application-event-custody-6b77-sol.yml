name: Materialize Capture application-event custody 6b77

on:
  push:
    branches:
      - repair/v14-capture-application-event-custody-6b77-sol
    paths:
      - .github/workflows/materialize-capture-application-event-custody-6b77-sol.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-application-event-custody-6b77-sol
          fetch-depth: 0

      - name: Guard exact current product and recovery scope
        shell: bash
        run: |
          set -euo pipefail
          parent='6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          test "$(git merge-base HEAD "$parent")" = "$parent"
          test "$(git rev-parse "$parent:NembraApp/App/NembraCaptureEntrypoint.swift")" = "$(git rev-parse HEAD:NembraApp/App/NembraCaptureEntrypoint.swift)"
          unexpected="$(git diff --name-only "$parent"...HEAD | grep -Ev '^(.github/workflows/materialize-capture-application-event-custody-6b77-sol.yml|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventAuthorityCustodySourceTests.swift)$' || true)"
          test -z "$unexpected"

      - name: Apply bounded accepted-event custody repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text(encoding="utf-8")

          old_guard = (
              "        guard sdkAccountLoggedIn,\n"
              "              sdkDeviceMembershipVerified,\n"
              "              accountIdentityLeaseIsAuthorized,\n"
              "              let driver else {\n"
          )
          new_guard = (
              "        guard sdkAccountLoggedIn,\n"
              "              sdkDeviceMembershipVerified,\n"
              "              accountIdentityLeaseIsAuthorized,\n"
              "              let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),\n"
              "              !verifiedAccountUID.isEmpty,\n"
              "              let driver else {\n"
          )

          start = text.index("    private func receivedApplicationUpdate(")
          end = text.index("    private func startWatchdog", start)
          receiver = text[start:end]
          if receiver.count(old_guard) != 1:
              raise SystemExit("application source-authority guard anchor changed")
          receiver = receiver.replace(old_guard, new_guard, 1)

          old_log = (
              "            log(\"tuya_application_update\", update.merging([\n"
              "                \"generation\": String(token.diagnosticGeneration)\n"
              "            ]) { current, _ in current })\n"
          )
          new_log = (
              "            var eventDetails = update.reduce(into: [String: String]()) { details, entry in\n"
              "                let redactedKey = entry.key.replacingOccurrences(\n"
              "                    of: verifiedAccountUID,\n"
              "                    with: \"<redacted-account-uid>\",\n"
              "                    options: [.literal]\n"
              "                )\n"
              "                let redactedValue = entry.value.replacingOccurrences(\n"
              "                    of: verifiedAccountUID,\n"
              "                    with: \"<redacted-account-uid>\",\n"
              "                    options: [.literal]\n"
              "                )\n"
              "                details[redactedKey] = redactedValue\n"
              "            }\n"
              "            eventDetails[\"generation\"] = String(token.diagnosticGeneration)\n"
              "            log(\"tuya_application_update\", eventDetails)\n"
          )
          if receiver.count(old_log) != 1:
              raise SystemExit("application event log anchor changed")
          receiver = receiver.replace(old_log, new_log, 1)
          path.write_text(text[:start] + receiver + text[end:], encoding="utf-8")
          PY

      - name: Verify account-secret and provenance custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")
          start = s.index("private func receivedApplicationUpdate(")
          end = s.index("private func startWatchdog", start)
          body = s[start:end]
          uid = body.index("let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines)")
          ledger = body.index("try await sessionLedger.recordApplicationUpdate")
          details = body.index("var eventDetails = update.reduce")
          generation = body.index('eventDetails["generation"] = String(token.diagnosticGeneration)')
          event_log = body.index('log("tuya_application_update", eventDetails)')
          assert uid < ledger < details < generation < event_log
          assert body.count("of: verifiedAccountUID") == 2
          assert body.count('with: "<redacted-account-uid>"') == 2
          assert 'log("tuya_application_update", update.merging([' not in body
          assert ') { current, _ in current })' not in body
          for forbidden in ("disconnectBLE", "publishDps", "queryDps", "writeValue"):
              assert forbidden not in body
          PY
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventAuthorityCustodySourceTests.swift
          git diff --check

      - name: Commit clean two-path repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-v14-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/materialize-capture-application-event-custody-6b77-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventAuthorityCustodySourceTests.swift
          git commit -m "fix(capture): seal application-event authority custody"
          git push origin HEAD:repair/v14-capture-application-event-custody-6b77-sol
