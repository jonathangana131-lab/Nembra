name: Capture Failed Stage Rail 8F18
on:
  push:
    branches: [sol/v14-capture-failed-stage-rail-8f18-sol]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.actor != 'github-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-failed-stage-rail-8f18-sol
          fetch-depth: 0
      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='8f18cbaf51f122b487ec7f3baf4d0e9dbc3301c5'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFailedStageRailAccessibilitySourceTests.swift
      - name: Apply and verify stopped-state semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_failed_stage_rail_8f18.py apply
          python3 scripts/ci/materialize_capture_failed_stage_rail_8f18.py verify
          python3 -m py_compile scripts/ci/materialize_capture_failed_stage_rail_8f18.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFailedStageRailAccessibilitySourceTests.swift
          git diff --check
      - name: Publish clean two-path result
        shell: bash
        run: |
          set -euo pipefail
          parent='8f18cbaf51f122b487ec7f3baf4d0e9dbc3301c5'
          rm .github/workflows/capture-failed-stage-rail-8f18.yml
          rm scripts/ci/materialize_capture_failed_stage_rail_8f18.py
          git add -A
          changed="$(git diff --name-only "$parent" | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFailedStageRailAccessibilitySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m 'fix(capture): present failed attempts as stopped'
          git push origin HEAD:sol/v14-capture-failed-stage-rail-8f18-sol
