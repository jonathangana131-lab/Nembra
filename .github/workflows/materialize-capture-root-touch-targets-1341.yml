name: Materialize Capture root touch targets 1341
on:
  push:
    branches: [fix/v14-capture-root-touch-targets-1341-sol]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Guard exact product lineage
        shell: bash
        run: |
          set -euo pipefail
          expected='134132fd581666c39376f1e6f5c58460dd1e0174'
          test "$(git rev-parse HEAD^)" = "$expected"
      - name: Enlarge critical root setup controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NembraApp/App/NembraCaptureEntrypoint.swift'); s=p.read_text()
          pairs=[
          ('Button("Reset account link") { tuya.resetLink() }\n                                        .buttonStyle(.bordered)','Button("Reset account link") { tuya.resetLink() }\n                                        .buttonStyle(.bordered)\n                                        .controlSize(.large)'),
          ('Button("Refresh") { tuya.refreshDevices() }\n                                                .buttonStyle(.bordered)','Button("Refresh") { tuya.refreshDevices() }\n                                                .buttonStyle(.bordered)\n                                                .controlSize(.large)'),
          ('                                                .buttonStyle(.bordered)\n\n                                                if tuya.selectedDeviceID == device.id,','                                                .buttonStyle(.bordered)\n                                                .controlSize(.large)\n\n                                                if tuya.selectedDeviceID == device.id,'),
          ('NavigationLink("Continue to Capture") { SecureLinkView(device: device) }\n                                                        .buttonStyle(.borderedProminent)','NavigationLink("Continue to Capture") { SecureLinkView(device: device) }\n                                                        .buttonStyle(.borderedProminent)\n                                                        .controlSize(.large)')]
          for old,new in pairs:
              if s.count(old)!=1: raise SystemExit(f'seam drifted: {old[:50]} count={s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Verify focused source and Swift syntax
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureRootCriticalTouchTargetsSourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(); r=s[s.index('private struct CaptureP0Root: View'):s.index('@MainActor\nprivate final class SecureLinkController')]
          for t in ['Button("Reset account link")','Button("Refresh")','Button(tuya.selectedDeviceID == device.id ? "Refresh metadata" : "Use this scooter")','NavigationLink("Continue to Capture")']:
              i=r.index(t); assert '.controlSize(.large)' in r[i:i+640], t
          PY
      - name: Publish clean app-visible repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-root-touch-targets-1341.yml
          git config user.name nembra-sol
          git config user.email nembra-sol@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureRootCriticalTouchTargetsSourceTests.swift .github/workflows/materialize-capture-root-touch-targets-1341.yml
          git diff --cached --check
          git commit -m 'fix(capture): enlarge root setup touch targets'
          git push origin HEAD:fix/v14-capture-root-touch-targets-1341-sol
