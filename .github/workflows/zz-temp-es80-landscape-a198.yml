name: TEMP ES80 landscape a198 builder

on:
  push:
    branches:
      - builder/es80-landscape-a198-gpt56

permissions:
  contents: write

jobs:
  build-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: builder/es80-landscape-a198-gpt56
          fetch-depth: 0
      - name: Apply guarded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/zz_temp_es80_landscape_a198.py
          git diff --check
          git diff -- NembraApp/App/NembraApp.swift NembraApp/Features/Research/ES80CaptureShellView.swift NembraUITests/ES80ResearchCaptureUITests.swift
      - name: Commit intended tree only
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/zz_temp_es80_landscape_a198.py
          rm .github/workflows/zz-temp-es80-landscape-a198.yml
          git config user.name nembra-v14-go-worker
          git config user.email nembra-v14-go-worker@users.noreply.github.com
          git add -A
          git commit -m "fix(capture): close retained landscape acceptance gaps"
          git push origin HEAD:builder/es80-landscape-a198-gpt56
