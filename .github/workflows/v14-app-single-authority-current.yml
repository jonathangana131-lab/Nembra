name: V14 app single authority current

on:
  push:
    branches:
      - feature/es80-v14-app-single-authority-current/gpt56-thinking

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/es80-v14-app-single-authority-current/gpt56-thinking
      - name: Apply, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/v14_app_single_authority.py')
          text = path.read_text()
          start = text.index('shell = replace_once(\n    shell,\n    """        case .correlatedTarget, .targetReacquired:')
          end = text.index('shell_path.write_text(shell)', start)
          replacement = '''shell = replace_once(
              shell,
              '        case .correlatedTarget, .targetReacquired:\n            "checkmark.circle.fill"',
              '        case .correlatedTarget, .targetReacquired:\n            "checkmark.circle.fill"\n        case .captureSessionArmed:\n            "wave.3.right.circle.fill"',
              "status symbol",
          )
          shell = replace_once(
              shell,
              '        case .correlatedTarget:\n            .green',
              '        case .correlatedTarget, .captureSessionArmed:\n            .green',
              "status color",
          )
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          set +e
          python3 .github/scripts/v14_app_single_authority.py > /tmp/app-patch.log 2>&1
          code=$?
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$code" -ne 0 ]; then
            cp /tmp/app-patch.log .github/scripts/v14_app_patch_failure.txt
            git add .github/scripts/v14_app_patch_failure.txt
            git commit -m '[Capture v14] Record app authority patch mismatch'
            git push origin HEAD:feature/es80-v14-app-single-authority-current/gpt56-thinking
            exit 0
          fi
          ! grep -n 'PassiveBluetoothPowerCycleObservationSession(' NembraApp/Features/Research/ES80CaptureShellView.swift
          ! grep -n 'try? ForegroundCoreBluetoothCaptureController(' NembraApp/App/NembraApp.swift
          ! grep -n 'Passive capture binding not available in this build' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -q 'PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()' NembraApp/App/NembraApp.swift
          grep -q 'coordinator.prepareCaptureRediscovery()' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -q 'coordinator.connectPreparedCapture()' NembraApp/Features/Research/ES80CaptureShellView.swift
          git diff --check
          rm -f .github/scripts/v14_app_patch_failure.txt .github/scripts/v14_app_single_authority.py .github/workflows/v14-app-single-authority-current.yml
          git add NembraApp/App/NembraApp.swift NembraApp/Features/Research/ES80CaptureShellView.swift NembraAppTests/NembraAppTests.swift .github/scripts/v14_app_patch_failure.txt .github/scripts/v14_app_single_authority.py .github/workflows/v14-app-single-authority-current.yml
          git diff --cached --check
          git commit -m '[Capture v14] Wire package-owned Experiment One through app'
          git push origin HEAD:feature/es80-v14-app-single-authority-current/gpt56-thinking
