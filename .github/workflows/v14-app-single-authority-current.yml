name: V14 app single authority current

on:
  push:
    branches:
      - feature/es80-v14-app-single-authority-current/gpt56-thinking

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/es80-v14-app-single-authority-current/gpt56-thinking
      - name: Apply exact app authority patch
        run: python3 .github/scripts/v14_app_single_authority.py
      - name: Verify and publish product-only head
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'PassiveBluetoothPowerCycleObservationSession(' NembraApp/Features/Research/ES80CaptureShellView.swift
          ! grep -n 'try? ForegroundCoreBluetoothCaptureController(' NembraApp/App/NembraApp.swift
          ! grep -n 'Passive capture binding not available in this build' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -q 'PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()' NembraApp/App/NembraApp.swift
          grep -q 'coordinator.prepareCaptureRediscovery()' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -q 'coordinator.connectPreparedCapture()' NembraApp/Features/Research/ES80CaptureShellView.swift
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/v14_app_single_authority.py .github/workflows/v14-app-single-authority-current.yml
          git add NembraApp/App/NembraApp.swift NembraApp/Features/Research/ES80CaptureShellView.swift NembraAppTests/NembraAppTests.swift .github/scripts/v14_app_single_authority.py .github/workflows/v14-app-single-authority-current.yml
          git diff --cached --check
          git commit -m '[Capture v14] Wire package-owned Experiment One through app'
          git push origin HEAD:feature/es80-v14-app-single-authority-current/gpt56-thinking
