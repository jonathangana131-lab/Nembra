name: Materialize V14 Capture final truth seam

on:
  push:
    branches:
      - agent/v14-capture-final-truth-seam-sol
    paths:
      - .github/workflows/materialize-v14-capture-final-truth-seam.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-final-truth-seam-sol
          fetch-depth: 0

      - name: Bind exact construction parent and patch source
        shell: bash
        env:
          EXPECTED_PARENT: 1c40853f6991b4d09206df1d25ecff021458b7eb
          EXPECTED_ENTRYPOINT_BLOB: c58be3f6bc0cf33a9f6d0d950b7d011ff8aa1d25
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "$EXPECTED_ENTRYPOINT_BLOB"

          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          def section(text: str, start: str, end: str):
              start_i = text.index(start)
              end_i = text.index(end, start_i + len(start))
              return start_i, end_i, text[start_i:end_i]

          def replace_section(text: str, start: str, end: str, transform):
              start_i, end_i, body = section(text, start, end)
              updated = transform(body)
              if updated == body:
                  raise SystemExit(f"section transform made no change: {start}")
              return text[:start_i] + updated + text[end_i:]

          revoke_pattern = re.compile(
              r'(?m)^(?P<i>\s*)sdkDeviceMembershipVerified = false\n'
              r'(?P=i)membershipAccountUID = nil\n'
              r'(?P=i)membershipDeviceID = nil\n'
              r'(?P=i)membershipRequestID = UUID\(\)$'
          )

          def revoke_status(body: str):
              def repl(match):
                  i = match.group('i')
                  return (
                      f'{i}sdkDeviceMembershipVerified = false\n'
                      f'{i}membershipAccountUID = nil\n'
                      f'{i}membershipDeviceID = nil\n'
                      f'{i}membershipStatus = "Scooter membership must be verified again for this Secure Link session."\n'
                      f'{i}membershipRequestID = UUID()'
                  )
              updated, count = revoke_pattern.subn(repl, body, count=1)
              if count != 1:
                  raise SystemExit(f"expected one membership revocation sequence, found {count}")
              return updated

          source = replace_section(
              source,
              "    func abandonCorrelationForViewExit() {",
              "    func appDidLoseForeground() {",
              revoke_status,
          )
          source = replace_section(
              source,
              "    func appDidLoseForeground() {",
              "    var privateConfig: Bool",
              revoke_status,
          )

          receiver_start, receiver_end, receiver = section(
              source,
              "    private func receivedApplicationUpdate(",
              "    private func startWatchdog"
          )

          admissions = re.compile(r'(?m)^(?P<i>\s*)applicationUpdateAdmissionsInFlight \+= 1$')
          matches = list(admissions.finditer(receiver))
          if len(matches) != 1:
              raise SystemExit(f"expected one application admission counter, found {len(matches)}")
          m = matches[0]
          i = m.group('i')
          guard = (
              f'{i}guard let acceptedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),\n'
              f'{i}      !acceptedAccountUID.isEmpty else {{\n'
              f'{i}    await invalidateSourceAuthority(\n'
              f'{i}        token: token,\n'
              f'{i}        message: "Verified Tuya account identity disappeared before application evidence custody.",\n'
              f'{i}        kind: "sdk_account_uid_authority_missing_during_observation"\n'
              f'{i}    )\n'
              f'{i}    return\n'
              f'{i}}}\n\n'
          )
          receiver = receiver[:m.start()] + guard + receiver[m.start():]

          log_pattern = re.compile(
              r'(?m)^(?P<i>\s*)log\("tuya_application_update", update\.merging\(\[\n'
              r'(?P=i)\s*"generation": String\(token\.diagnosticGeneration\)\n'
              r'(?P=i)\]\) \{ current, _ in current \}\)$'
          )
          log_matches = list(log_pattern.finditer(receiver))
          if len(log_matches) != 1:
              raise SystemExit(f"expected one untrusted application event merge, found {len(log_matches)}")
          lm = log_matches[0]
          li = lm.group('i')
          safe_log = (
              f'{li}let exportSafeUpdate = update.mapValues {{ value in\n'
              f'{li}    value.replacingOccurrences(\n'
              f'{li}        of: acceptedAccountUID,\n'
              f'{li}        with: "<redacted-account-uid>",\n'
              f'{li}        options: [.literal]\n'
              f'{li}    )\n'
              f'{li}}}\n'
              f'{li}log("tuya_application_update", exportSafeUpdate.merging([\n'
              f'{li}    "generation": String(token.diagnosticGeneration)\n'
              f'{li}]) {{ _, trusted in trusted }})'
          )
          receiver = receiver[:lm.start()] + safe_log + receiver[lm.end():]
          source = source[:receiver_start] + receiver + source[receiver_end:]

          fragments_start, fragments_end, fragments = section(
              source,
              "    private static let secretKeyFragments",
              "    private static func"
          )
          session_line = re.compile(r'(?m)^\s*"sessionkey",\s*$')
          session_matches = list(session_line.finditer(fragments))
          if len(session_matches) != 2:
              raise SystemExit(f"expected exactly two sessionkey classifier entries, found {len(session_matches)}")
          second = session_matches[1]
          remove_start = second.start()
          remove_end = second.end()
          if remove_end < len(fragments) and fragments[remove_end:remove_end + 1] == "\n":
              remove_end += 1
          fragments = fragments[:remove_start] + fragments[remove_end:]
          source = source[:fragments_start] + fragments + source[fragments_end:]

          if source.count("<redacted-account-uid>") != 1:
              raise SystemExit("account UID redaction sentinel count is not exactly one")
          if source.count(") { current, _ in current })") != 0:
              raise SystemExit("untrusted metadata precedence closure still present")

          path.write_text(source)
          PY

          git diff --check

      - name: Run Capture authority package
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Seal effective product diff and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-v14-capture-final-truth-seam.yml
          git diff --check

          mapfile -t paths < <(git diff --name-only 1c40853f6991b4d09206df1d25ecff021458b7eb -- \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift)
          test "${#paths[@]}" -eq 4

          git config user.name "nembra-sol-worker"
          git config user.email "nembra-sol-worker@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git add -u .github/workflows/materialize-v14-capture-final-truth-seam.yml
          git commit -m "fix(capture): close final app truth seam"
          git push origin HEAD:agent/v14-capture-final-truth-seam-sol
