name: Apply V14 Capture fresh-correlation repair

on:
  push:
    branches: [recovery/v14-capture-fresh-correlation-app-sol]
    paths:
      - '.github/workflows/apply-v14-capture-fresh-correlation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact staged product blobs
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "77317e0a3f68c5d3dbef50e35d6b0b71159079e1"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldGoPrerequisiteSourceTests.swift)" = "bb6e9f418876ed2524091690b0433928294ac5f2"
          python3 -m py_compile .ci-patches/apply-v14-capture-fresh-correlation.py

      - name: Apply deterministic authority repair
        run: |
          set -euo pipefail
          python3 .ci-patches/apply-v14-capture-fresh-correlation.py
          git diff --check
          ! grep -Fq 'var likely: Bool { knownID }' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'accepted-prior-physical-corebluetooth-uuid' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'PassiveBluetoothPowerCycleObservationSession(minimumWindowDuration: 10)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'fresh-repeated-off-on-full-corebluetooth-id' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'authenticationAcquisitionFailed(' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Commit product repair and retire helper
        run: |
          set -euo pipefail
          rm .ci-patches/apply-v14-capture-fresh-correlation.py
          rm .github/workflows/apply-v14-capture-fresh-correlation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): earn fresh target correlation before Tuya auth"
          git push origin HEAD:recovery/v14-capture-fresh-correlation-app-sol
