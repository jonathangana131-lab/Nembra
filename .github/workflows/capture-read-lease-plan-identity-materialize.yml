name: Capture Read Lease Plan Identity Materializer

on:
  push:
    branches:
      - hardening/v17-capture-read-lease-real-directory-continuity-sol-20260814
    paths:
      - .github/workflows/capture-read-lease-plan-identity-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-read-lease-plan-identity-materialize-${{ github.ref }}
  cancel-in-progress: true

env:
  OLD_AUTHORING_HEAD: 33191e2e495baf91e42c0c663bf541d26d719ed6
  PRODUCT_PARENT: 092e109853eeb6cb3ade6c7a9d401c0f55598d99
  SELF: .github/workflows/capture-read-lease-plan-identity-materialize.yml
  BRANCH: hardening/v17-capture-read-lease-real-directory-continuity-sol-20260814

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Recover and patch original materializer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$OLD_AUTHORING_HEAD^{commit}"
          git cat-file -e "$PRODUCT_PARENT^{commit}"
          git show "$OLD_AUTHORING_HEAD:$SELF" > /tmp/materializer.yml
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path

          path = Path('/tmp/materializer.yml')
          text = path.read_text(encoding='utf-8')
          old_parent = 'EXACT_PARENT: 1b31d21eb285cd654c7c7dbd3e5c5276eb0945aa'
          new_parent = 'EXACT_PARENT: 092e109853eeb6cb3ade6c7a9d401c0f55598d99'
          if text.count(old_parent) != 1:
              raise SystemExit('could not bind original exact parent')
          text = text.replace(old_parent, new_parent, 1)

          old_marker = "          marker = '    _require_real_directory(repo, \"repository root\")\\n'\n"
          new_marker = "          marker = '    _require_real_directory(repo, \"repository root\")\\n    if not subjects:\\n'\n"
          if text.count(old_marker) != 1:
              raise SystemExit('could not bind original repository-root marker')
          text = text.replace(old_marker, new_marker, 1)

          old_replacement = "              '    _record_planned_identity(identities, repo, repo_metadata)\\n',\n"
          new_replacement = (
              "              '    _record_planned_identity(identities, repo, repo_metadata)\\n'\n"
              "              '    if not subjects:\\n',\n"
          )
          if text.count(old_replacement) != 1:
              raise SystemExit('could not bind original repository-root replacement')
          text = text.replace(old_replacement, new_replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Rebase materializer onto exact current component-walk head
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCT_PARENT"
          cp /tmp/materializer.yml "$SELF"
          git add "$SELF"
          test "$(git diff --cached --name-only)" = "$SELF"
          git diff --cached --check
          git config user.name 'nembra-swarm-plan-identity'
          git config user.email 'nembra-swarm@users.noreply.github.com'
          git commit -m 'ci(capture): rebind plan identity materializer to component-walk head'
          git push --force-with-lease="refs/heads/$BRANCH:$GITHUB_SHA" origin "HEAD:refs/heads/$BRANCH"
