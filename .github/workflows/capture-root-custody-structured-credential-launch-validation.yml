name: Capture Root Custody Structured Credential Launch Validation

on:
  push:
    branches:
      - validation/v17-capture-root-custody-structured-credential-launch-sol-20260815
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_accepted_build_root_custody_structured_credentials.py
      - .github/workflows/capture-root-custody-structured-credential-launch-validation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_ROOT_CUSTODY_PARENT: 7900d7d1fdab3a21c51190892d11d7e4e7ef43b0
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  validate:
    name: Re-run sealed-root witness with structured credentials
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation-only child
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(git merge-base HEAD "$EXACT_ROOT_CUSTODY_PARENT")" = "$EXACT_ROOT_CUSTODY_PARENT"
          actual="$(git diff --name-only "$EXACT_ROOT_CUSTODY_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-root-custody-structured-credential-launch-validation.yml \
            scripts/ci/tests/test_capture_accepted_build_root_custody_structured_credentials.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test "$(git hash-object scripts/ci/tests/test_capture_accepted_build_root_custody.py)" = \
            "$(git rev-parse "$EXACT_ROOT_CUSTODY_PARENT:scripts/ci/tests/test_capture_accepted_build_root_custody.py")"
          test "$(git hash-object scripts/ci/capture_accepted_build_root_custody.py)" = \
            "$(git rev-parse "$EXACT_ROOT_CUSTODY_PARENT:scripts/ci/capture_accepted_build_root_custody.py")"
          git diff --check "$EXACT_ROOT_CUSTODY_PARENT"...HEAD

      - name: Compile unchanged custody and structured launcher
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              "scripts/ci/capture_accepted_build_root_custody.py",
              "scripts/ci/tests/test_capture_accepted_build_root_custody.py",
              "scripts/ci/tests/test_capture_accepted_build_root_custody_structured_credentials.py",
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          PY
          grep -Fq 'user=field.pw_uid' scripts/ci/tests/test_capture_accepted_build_root_custody_structured_credentials.py
          grep -Fq 'group=field.pw_gid' scripts/ci/tests/test_capture_accepted_build_root_custody_structured_credentials.py
          grep -Fq 'extra_groups=extra_groups' scripts/ci/tests/test_capture_accepted_build_root_custody_structured_credentials.py
          ! grep -Fq 'preexec_fn=' scripts/ci/tests/test_capture_accepted_build_root_custody_structured_credentials.py

      - name: Require noninteractive root authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true

      - name: Re-run complete unchanged sealed-root assertions
        shell: bash
        run: |
          set -euo pipefail
          field_user="$(/usr/bin/id -un)"
          set +e
          output="$(/usr/bin/sudo -n env \
            NEMBRA_TEST_FIELD_USER="$field_user" \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -B -I \
            scripts/ci/tests/test_capture_accepted_build_root_custody_structured_credentials.py \
            --field-user "$field_user" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status != 0 )); then
            detail="$(printf '%s\n' "$output" | tail -n 28 | tail -c 4000)"
            detail="${detail//'%'/'%25'}"
            detail="${detail//$'\r'/'%0D'}"
            detail="${detail//$'\n'/'%0A'}"
            printf '::error file=scripts/ci/tests/test_capture_accepted_build_root_custody_structured_credentials.py,title=Structured credential root-custody witness::%s\n' "$detail"
            exit "$status"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve validation boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "NEMBRA_ROOT_CUSTODY_STRUCTURED_CREDENTIAL_VALIDATION productionBytesChanged=false xcodeBuildWired=false signingAuthority=false installAuthority=false deviceTouched=false bluetoothTouched=false physicalAuthorityCreated=false"
