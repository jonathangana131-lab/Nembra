name: TMP V14 Private Identity Completion Materializer

on:
  push:
    branches:
      - repair/v14-private-identity-final-name-crash-recovery-sol-20260811
    paths:
      - scripts/tmp_v14_private_identity_completion_materializer.py
      - .github/workflows/tmp-v14-private-identity-completion-materializer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind materializer to exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize production closure
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/tmp_v14_private_identity_completion_materializer.py

      - name: Validate permanent private identity closure
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_publication_races.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_destination_ancestor_swap_current.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_final_name_binding_2874.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_crash_residue.py
          /usr/bin/python3 -I Scripts/provision_capture_tuya_identity_writer.py --self-test
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_publication_races.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_same_inode_payload_current.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_destination_ancestor_swap_current.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_final_name_binding_2874.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_crash_residue.py
          bash -n Scripts/provision_capture_tuya_identity.sh
          writer_digest="$(sha256sum Scripts/provision_capture_tuya_identity_writer.py | awk '{print $1}')"
          grep -Fq "WRITER_SHA256=\"${writer_digest}\"" Scripts/provision_capture_tuya_identity.sh
          grep -Fq "WRITER_SHA256=\\\"${writer_digest}\\\"" Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift
          git diff --check

      - name: Prove exact materialized path scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-identity-publication-races-redteam.yml \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift \
            Scripts/provision_capture_tuya_identity.sh \
            Scripts/provision_capture_tuya_identity_writer.py \
            scripts/ci/tests/test_capture_private_identity_crash_residue.py | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Publish clean product head and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/tmp_v14_private_identity_completion_materializer.py
          rm -f .github/workflows/tmp-v14-private-identity-completion-materializer.yml
          git add \
            .github/workflows/capture-private-identity-publication-races-redteam.yml \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift \
            Scripts/provision_capture_tuya_identity.sh \
            Scripts/provision_capture_tuya_identity_writer.py \
            scripts/ci/tests/test_capture_private_identity_crash_residue.py \
            scripts/tmp_v14_private_identity_completion_materializer.py \
            .github/workflows/tmp-v14-private-identity-completion-materializer.yml
          git diff --cached --check
          git config user.name "jonathangana131-lab"
          git config user.email "jonathangana131@gmail.com"
          git commit -m "Capture: close private identity recovery authority"
          git push origin HEAD:repair/v14-private-identity-final-name-crash-recovery-sol-20260811
