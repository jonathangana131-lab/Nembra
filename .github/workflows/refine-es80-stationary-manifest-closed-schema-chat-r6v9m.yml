name: Refine ES80 stationary manifest closed schema

on:
  push:
    branches:
      - parallel/recover-es80-stationary-manifest-current-runtime/chat-r6v9m

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8
      - name: Reject unknown schema-v1 fields
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=3ae598c4d511eda2e77591e6f1d2e03a2ceeb6cd
          WORKFLOW=.github/workflows/refine-es80-stationary-manifest-closed-schema-chat-r6v9m.yml
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothStationaryCaptureManifest.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothStationaryCaptureManifestTests.swift
          DOC=docs/ES80_STATIONARY_CAPTURE_MANIFEST.md
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git diff --name-only "$PRODUCT" HEAD)" = "$WORKFLOW"

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothStationaryCaptureManifest.swift")
          source = source_path.read_text()

          old = """    case unsupportedSchemaVersion(Int)\n    case manifestDoesNotMatchCapture\n"""
          new = """    case unsupportedSchemaVersion(Int)\n    case unexpectedManifestField(String)\n    case manifestDoesNotMatchCapture\n"""
          assert source.count(old) == 1
          source = source.replace(old, new)

          old = """    public static func verifyCaptureBinding(\n        manifestJSON: Data,\n        captureJSON: Data\n    ) throws -> PassiveBluetoothStationaryCaptureManifest {\n        let decoder = JSONDecoder()\n"""
          new = """    public static func verifyCaptureBinding(\n        manifestJSON: Data,\n        captureJSON: Data\n    ) throws -> PassiveBluetoothStationaryCaptureManifest {\n        try validateSchemaShape(manifestJSON)\n\n        let decoder = JSONDecoder()\n"""
          assert source.count(old) == 1
          source = source.replace(old, new)

          anchor = """    public static func encode(\n        _ manifest: PassiveBluetoothStationaryCaptureManifest,\n        prettyPrinted: Bool = true\n    ) throws -> Data {\n"""
          helper = """    private static func validateSchemaShape(_ data: Data) throws {\n        guard let root = try JSONSerialization.jsonObject(with: data) as? [String: Any] else {\n            return\n        }\n\n        try rejectUnexpectedKeys(\n            in: root,\n            allowed: [\n                \"schemaVersion\", \"experimentKind\", \"experimentID\", \"preparedAt\",\n                \"nembraBuildCommitSHA\", \"setup\", \"sourceArtifact\", \"evidenceSummary\"\n            ],\n            path: \"\"\n        )\n\n        if let setup = root[\"setup\"] as? [String: Any] {\n            try rejectUnexpectedKeys(\n                in: setup,\n                allowed: [\"chargerState\", \"executionContext\", \"stockAppReferenceSetup\"],\n                path: \"setup\"\n            )\n        }\n        if let sourceArtifact = root[\"sourceArtifact\"] as? [String: Any] {\n            try rejectUnexpectedKeys(\n                in: sourceArtifact,\n                allowed: [\n                    \"sha256\", \"byteCount\", \"captureSessionID\",\n                    \"selectedPeripheralIdentifier\"\n                ],\n                path: \"sourceArtifact\"\n            )\n        }\n        if let evidenceSummary = root[\"evidenceSummary\"] as? [String: Any] {\n            try rejectUnexpectedKeys(\n                in: evidenceSummary,\n                allowed: [\n                    \"targetGATTRecordCount\", \"targetValueRecordCount\",\n                    \"stockAppMarkerCount\", \"continuityBreakCount\"\n                ],\n                path: \"evidenceSummary\"\n            )\n        }\n    }\n\n    private static func rejectUnexpectedKeys(\n        in object: [String: Any],\n        allowed: Set<String>,\n        path: String\n    ) throws {\n        for key in object.keys.sorted() where !allowed.contains(key) {\n            let qualified = path.isEmpty ? key : \"\\(path).\\(key)\"\n            throw PassiveBluetoothStationaryCaptureManifestError\n                .unexpectedManifestField(qualified)\n        }\n    }\n\n""" + anchor
          assert source.count(anchor) == 1
          source = source.replace(anchor, helper)
          source_path.write_text(source)

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothStationaryCaptureManifestTests.swift")
          tests = test_path.read_text()
          anchor = """    private func makeManifest(captureJSON: Data) throws -> PassiveBluetoothStationaryCaptureManifest {\n"""
          insertion = """    @Test\n    func unknownSchemaVersionOneFieldsFailClosedInsteadOfBeingIgnored() throws {\n        let captureJSON = try makeCapture()\n        let manifest = try makeManifest(captureJSON: captureJSON)\n        let manifestJSON = try PassiveBluetoothStationaryCaptureManifestJSON.encode(manifest)\n\n        var topLevel = try #require(JSONSerialization.jsonObject(with: manifestJSON) as? [String: Any])\n        topLevel[\"physicallyVerified\"] = true\n        let topLevelJSON = try JSONSerialization.data(withJSONObject: topLevel, options: [.sortedKeys])\n\n        #expect(throws: PassiveBluetoothStationaryCaptureManifestError.unexpectedManifestField(\"physicallyVerified\")) {\n            _ = try PassiveBluetoothStationaryCaptureManifestJSON.verifyCaptureBinding(\n                manifestJSON: topLevelJSON,\n                captureJSON: captureJSON\n            )\n        }\n\n        var nested = try #require(JSONSerialization.jsonObject(with: manifestJSON) as? [String: Any])\n        var setup = try #require(nested[\"setup\"] as? [String: Any])\n        setup[\"backgroundCaptureAttested\"] = true\n        nested[\"setup\"] = setup\n        let nestedJSON = try JSONSerialization.data(withJSONObject: nested, options: [.sortedKeys])\n\n        #expect(throws: PassiveBluetoothStationaryCaptureManifestError.unexpectedManifestField(\"setup.backgroundCaptureAttested\")) {\n            _ = try PassiveBluetoothStationaryCaptureManifestJSON.verifyCaptureBinding(\n                manifestJSON: nestedJSON,\n                captureJSON: captureJSON\n            )\n        }\n    }\n\n""" + anchor
          assert tests.count(anchor) == 1
          tests = tests.replace(anchor, insertion)
          test_path.write_text(tests)

          doc_path = Path("docs/ES80_STATIONARY_CAPTURE_MANIFEST.md")
          doc = doc_path.read_text()
          anchor = """The schema-v1 execution context is required rather than defaulted. An imported sidecar missing `setup.executionContext` fails JSON decoding instead of silently assuming the physical procedure was followed.\n"""
          addition = anchor + """\nSchema v1 is also closed-world during verification: unrecognized keys at the top level or inside `setup`, `sourceArtifact`, or `evidenceSummary` are rejected rather than silently ignored by `JSONDecoder`. An unsupported field such as `physicallyVerified` therefore cannot travel beside an otherwise valid sidecar and appear to gain legitimacy from a successful capture-binding check. New semantics require a deliberate schema/version change.\n"""
          assert doc.count(anchor) == 1
          doc = doc.replace(anchor, addition)
          doc_path.write_text(doc)
          PY

          git config user.name nembra-integration-bot
          git config user.email actions@users.noreply.github.com
          git rm "$WORKFLOW"
          git add "$SOURCE" "$TEST" "$DOC"
          test "$(git diff --cached --name-only "$PRODUCT" | wc -l | tr -d ' ')" = 3
          test -z "$(git diff --cached --name-only "$PRODUCT" | grep -v -E '^(Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothStationaryCaptureManifest.swift|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothStationaryCaptureManifestTests.swift|docs/ES80_STATIONARY_CAPTURE_MANIFEST.md)$')"
          git diff --cached --check
          git commit -m "[es80 stationary manifest] Reject unknown sidecar claims"
          git push origin "HEAD:${GITHUB_REF_NAME}"
