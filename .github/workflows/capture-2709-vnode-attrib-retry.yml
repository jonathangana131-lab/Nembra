name: Capture 2709 Vnode Attribute Retry

on:
  push:
    branches:
      - repair/v14-capture-2709-vnode-attrib-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact parent and repair inputs
        shell: bash
        run: |
          set -euo pipefail
          parent=61c56465700f08602137529887644c05e794c6cc
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          test -f scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Add vnode attribute production custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          guard=Path('Scripts/capture_tuya_private_input_build_guard.py')
          s=guard.read_text()
          old='            "KQ_NOTE_EXTEND",\n            "KQ_NOTE_LINK",\n'
          new='            "KQ_NOTE_EXTEND",\n            "KQ_NOTE_ATTRIB",\n            "KQ_NOTE_LINK",\n'
          if s.count(old)!=1: raise SystemExit('required flag anchor drift')
          s=s.replace(old,new,1)
          old='            | select.KQ_NOTE_EXTEND\n            | select.KQ_NOTE_LINK\n'
          new='            | select.KQ_NOTE_EXTEND\n            | select.KQ_NOTE_ATTRIB\n            | select.KQ_NOTE_LINK\n'
          if s.count(old)!=1: raise SystemExit('fflags anchor drift')
          guard.write_text(s.replace(old,new,1))

          workflow=Path('.github/workflows/capture-cocoapods-build-subject-redteam.yml')
          w=workflow.read_text()
          path_anchor='      - scripts/ci/tests/test_capture_cocoapods_coherent_generation.py\n'
          if w.count(path_anchor)!=1: raise SystemExit('workflow path anchor drift')
          w=w.replace(path_anchor,path_anchor+'      - scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n',1)
          compile_anchor='          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_coherent_generation.py\n'
          if w.count(compile_anchor)!=1: raise SystemExit('workflow compile anchor drift')
          w=w.replace(compile_anchor,compile_anchor+'          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n',1)
          w += '\n      - name: Require vnode custody for generated metadata changes\n        shell: bash\n        run: |\n          set -euo pipefail\n          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py\n'
          workflow.write_text(w)
          PY

      - name: Validate focused and existing generated-subject suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py
          python3 scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py
          python3 scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          python3 scripts/ci/tests/test_capture_cocoapods_generated_symlink_authority.py
          python3 scripts/ci/tests/test_capture_cocoapods_coherent_generation.py
          grep -Fq '"KQ_NOTE_ATTRIB"' Scripts/capture_tuya_private_input_build_guard.py
          grep -Fq '| select.KQ_NOTE_ATTRIB' Scripts/capture_tuya_private_input_build_guard.py
          grep -Fq '_ensure_fd_budget(len(watch_paths))' Scripts/capture_tuya_private_input_build_guard.py
          git diff --check

      - name: Publish clean child
        shell: bash
        run: |
          set -euo pipefail
          parent=61c56465700f08602137529887644c05e794c6cc
          git rm .github/workflows/capture-2709-vnode-attrib-materializer.yml .github/workflows/capture-2709-vnode-attrib-retry.yml
          git add Scripts/capture_tuya_private_input_build_guard.py .github/workflows/capture-cocoapods-build-subject-redteam.yml scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py
          expected="$({ printf '%s\n' '.github/workflows/capture-cocoapods-build-subject-redteam.yml' 'Scripts/capture_tuya_private_input_build_guard.py' 'scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py'; } | sort)"
          actual="$(git diff --cached --name-only "$parent" | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name 'jonathangana131-lab'
          git config user.email 'jonathangana131@gmail.com'
          git commit -m 'fix(capture): watch generated vnode attribute mutations'
          git push origin HEAD:repair/v14-capture-2709-vnode-attrib-sol
