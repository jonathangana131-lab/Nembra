name: V14 sealed export generation scope

on:
  push:
    branches:
      - repair/v14-capture-sealed-application-export-prefix-v2-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - name: Verify repair parent
        run: test "$(git rev-parse HEAD^^)" = "72169289b2c8c0b03dacbcd72cc292aa87d8b9e6"
      - name: Patch and validate
        run: |
          python3 scripts/ci/v14_sealed_export_generation_scope_patch.py
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift
      - name: Commit clean repair
        env:
          BRANCH: repair/v14-capture-sealed-application-export-prefix-v2-sol
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')" = "$EVENT_SHA"
          rm scripts/ci/v14_sealed_export_generation_scope_patch.py
          rm .github/workflows/v14-sealed-export-generation-scope.yml
          git config user.name "nembra-v14-integration"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift scripts/ci/v14_sealed_export_generation_scope_patch.py .github/workflows/v14-sealed-export-generation-scope.yml
          git commit -m "fix(capture): scope seal parity to current generation"
          git push origin "HEAD:$BRANCH"
