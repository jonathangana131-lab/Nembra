name: Materialize Capture View Exit Membership b59

on:
  push:
    branches:
      - recovery/v14-capture-view-exit-membership-b59-sol2

permissions:
  contents: write

concurrency:
  group: capture-view-exit-membership-b59-sol2
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-view-exit-membership-b59-sol2
          fetch-depth: 0

      - name: Guard exact product ancestry and staged scope
        shell: bash
        run: |
          set -euo pipefail
          base='b59cd71272b465bcad70fcc3425382bb29541b2e'
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base:$app")" = "$(git rev-parse HEAD:$app)"
          mapfile -t changed < <(git diff --name-only "$base"...HEAD | sort)
          mapfile -t wanted < <(printf '%s\n' \
            '.github/workflows/materialize-capture-view-exit-membership-b59-sol2.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaViewExitMembershipCallbackRetirementSourceTests.swift' | sort)
          test "${#changed[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do test "${changed[$i]}" = "${wanted[$i]}"; done

      - name: Revoke pending membership callback authority on view exit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          start_token = '    func abandonCorrelationForViewExit() {'
          end_token = '\n    var privateConfig: Bool'
          if source.count(start_token) != 1:
              raise SystemExit(f'expected one view-exit cleanup, found {source.count(start_token)}')
          start = source.index(start_token)
          end = source.index(end_token, start)
          old = source[start:end]
          required_old = (
              'guard processCorrelationLease != nil || correlationSession != nil else { return }',
              'abandonPackageCorrelation()',
              'target_correlation_abandoned_on_view_exit',
          )
          for needle in required_old:
              if needle not in old:
                  raise SystemExit(f'current cleanup contract drifted: {needle}')
          if 'membershipRequestID = UUID()' in old or 'membershipProbe = nil' in old:
              raise SystemExit('view-exit membership callback retirement already present; do not replay')
          new = '''    func abandonCorrelationForViewExit() {
        // Secure Link can disappear while either current-account membership proof is still
        // in flight: before OFF1 correlation starts, or during the final selected-target
        // recheck immediately before Tuya BLE ownership. Revoke that callback generation
        // before any no-scanner early return so neither late success can start hidden work.
        membershipRequestID = UUID()
        membershipBusy = false
#if canImport(ThingSmartHomeKit)
        membershipProbe = nil
#endif

        guard processCorrelationLease != nil || correlationSession != nil else { return }
        // Preserve the accepted radio ordering: package scanner/session retirement first,
        // then owner-token lease release inside abandonPackageCorrelation().
        abandonPackageCorrelation()
        phase = .failed
        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."
        log("target_correlation_abandoned_on_view_exit")
    }
'''
          source = source[:start] + new + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate current-product lifecycle and truth boundaries
        shell: bash
        run: |
          set -euo pipefail
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          testfile='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaViewExitMembershipCallbackRetirementSourceTests.swift'
          python3 <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start=s.index('func abandonCorrelationForViewExit()')
          end=s.index('var privateConfig: Bool', start)
          cleanup=s[start:end]
          required=(
              'membershipRequestID = UUID()',
              'membershipBusy = false',
              'membershipProbe = nil',
              'guard processCorrelationLease != nil || correlationSession != nil else { return }',
              'abandonPackageCorrelation()',
              'target_correlation_abandoned_on_view_exit',
          )
          for needle in required:
              assert needle in cleanup, needle
          assert cleanup.index('membershipRequestID = UUID()') < cleanup.index('guard processCorrelationLease')
          assert cleanup.index('membershipProbe = nil') < cleanup.index('guard processCorrelationLease')
          assert cleanup.index('guard processCorrelationLease') < cleanup.index('abandonPackageCorrelation()')
          assert 'releasePackageCorrelationLease()' not in cleanup
          for forbidden in ('connectBLE(', 'disconnectBLE', 'publishDps', 'queryDps', 'writeValue('):
              assert forbidden not in cleanup, forbidden

          verify=s[s.index('func verifySDKMembership(completion:'):s.index('func retry()', s.index('func verifySDKMembership(completion:'))]
          baseline=s[s.index('func startBaseline()'):s.index('private func beginCorrelationSeries()', s.index('func startBaseline()'))]
          auth=s[s.index('func authenticate()'):s.index('private func beginOfficialConnection(candidate:', s.index('func authenticate()'))]
          assert 'self.membershipRequestID == requestID' in verify
          assert 'verifySDKMembership' in baseline and 'self.beginCorrelationSeries()' in baseline
          assert 'verifySDKMembership' in auth and 'self.beginOfficialConnection(candidate: candidate)' in auth

          # Preserve the current process-global ownership and app-visible AX/lifecycle closures.
          for needle in (
              'guard !packageCorrelationRetiredForProcess,',
              'activePackageCorrelationOwner == nil,',
              'private var processCorrelationLease: UUID?',
              'OfficialTuyaFactory.acquirePackageCorrelationLease()',
              'if dynamicTypeSize.isAccessibilitySize {',
              '.accessibilityLabel("Correlation progress")',
              '.accessibilityLabel("Read-only observation progress")',
              'test.abandonCorrelationForViewExit()',
              'if test.canRestartFromFreshOFF1 {',
          ):
              assert needle in s, needle
          print('current-product view-exit membership callback retirement: PASS')
          PY
          swiftc -frontend -parse "$app"
          swiftc -frontend -parse "$testfile"
          git diff --check

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          base='b59cd71272b465bcad70fcc3425382bb29541b2e'
          rm -f .github/workflows/materialize-capture-view-exit-membership-b59-sol2.yml
          git add -A
          git diff --cached --check
          mapfile -t effective < <(git diff --name-only "$base" | sort)
          mapfile -t wanted < <(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaViewExitMembershipCallbackRetirementSourceTests.swift' | sort)
          test "${#effective[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do test "${effective[$i]}" = "${wanted[$i]}"; done
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git commit -m 'fix(capture): revoke hidden membership starts on view exit'
          git push origin HEAD:recovery/v14-capture-view-exit-membership-b59-sol2
