name: Nembra GO V17 Capture Retirement Repair

on:
  push:
    branches:
      - recovery/v17-capture-post-ds-retirement-provenance-sol-20260814
    paths:
      - .github/workflows/nembra-go-v17-capture-retirement-repair.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: recovery/v17-capture-post-ds-retirement-provenance-sol-20260814
  EXACT_PARENT: 3568250ee02556185610dd895e3f6d1c8f28dd33

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind temporary materializer to exact Capture carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/nembra-go-v17-capture-retirement-repair.yml \
            scripts/ci/materialize_capture_retirement_repair.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize proved production repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/materialize_capture_retirement_repair.py
          python3 scripts/ci/materialize_capture_retirement_repair.py
          python3 -m py_compile \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          python3 -B -I scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Commit four-path production delta and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/nembra-go-v17-capture-retirement-repair.yml
          rm scripts/ci/materialize_capture_retirement_repair.py
          changed="$(git diff --name-only "$EXACT_PARENT" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-field-build-provenance.yml \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check
          git config user.name "nembra-go-worker"
          git config user.email "nembra-go-worker@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Capture: compose proved post-DS principal retirement"
          git push origin "HEAD:${TARGET_BRANCH}"
