name: Capture Trusted Xcode Process-Environment Custody Expected Red

on:
  push:
    branches:
      - validation/v14-trusted-xcode-process-env-custody-red/gpt56-go

permissions:
  contents: read

jobs:
  expected-red:
    name: Prove trusted producer process-environment gap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify exact checked-out head
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse --verify HEAD^{commit})" = "$GITHUB_SHA"

      - name: Run process-environment custody regression
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_process_environment_custody_red.py
          python3 scripts/ci/tests/test_capture_trusted_xcode_process_environment_custody_red.py

      - name: Diff hygiene
        if: always()
        run: git diff --check
