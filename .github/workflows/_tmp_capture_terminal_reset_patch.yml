name: Temporary Capture terminal-reset convergence patch

on:
  push:
    branches:
      - integration/v14-capture-final-app-authority-r2-gpt56
    paths:
      - .github/workflows/_tmp_capture_terminal_reset_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-final-app-authority-r2-gpt56
          fetch-depth: 0

      - name: Apply exact field-controller patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          replacements = [
              (
                  'private static let maximumObservationPollGapNanoseconds: UInt64 = 5_000_000_000',
                  'private static let maximumObservationPollGapNanoseconds = TuyaAuthenticatedReadOnlySessionLedger.maximumContinuousObservationGapNanoseconds'
              ),
              (
                  '''        resetDiscoverySessionOnly()\n        phase = .baseline''',
                  '''        guard currentConnectionToken == nil else {\n            failLocally(\n                "A prior authenticated generation has not been terminally retired. Relaunch Capture before starting another attempt.",\n                "active_generation_blocks_discovery_reset"\n            )\n            return\n        }\n        resetDiscoverySessionOnly()\n        phase = .baseline'''
              ),
              (
                  '''        if let token = currentConnectionToken {\n            currentConnectionToken = nil\n            Task { [sessionLedger] in\n                try? await sessionLedger.endConnection(for: token)\n            }\n        }''',
                  '''        // Active authenticated generations must be terminally retired by their\n        // owning outcome path before a new discovery attempt. Generic reset never\n        // manufactures a transport-disconnect terminal.\n        assert(currentConnectionToken == nil)'''
              ),
              (
                  '''                    } catch {\n                        self.failLocally("Canonical readiness could not be sealed: \\(error.localizedDescription)", "accepted_prefix_seal_failed")\n                    }''',
                  '''                    } catch {\n                        await self.invalidateObservedAuthority(\n                            token: token,\n                            message: "Canonical readiness could not be sealed: \\(error.localizedDescription)",\n                            kind: "accepted_prefix_seal_failed"\n                        )\n                    }'''
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old[:90]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          rm .github/workflows/_tmp_capture_terminal_reset_patch.yml

          git config user.name "nembra-v14-bot"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/_tmp_capture_terminal_reset_patch.yml
          git commit -m "fix(capture): keep generic reset out of transport terminal"
          git push origin HEAD:integration/v14-capture-final-app-authority-r2-gpt56
