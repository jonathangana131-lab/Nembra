name: tmp V14 Signed Origin Mac GID Signing Prereq Probe

on:
  push:
    branches:
      - research/v14-signed-origin-normalization-4f51fg
    paths:
      - .github/workflows/tmp-v14-signed-origin-mac-gid-signing-prereq-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind research ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f76e6ae54b4304df5b02db4f46a72f67daa276e2 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Capture non-secret normal-session signing baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          identity_output="$(/usr/bin/security find-identity -v -p codesigning 2>&1)"
          identity_status="$?"
          set -e
          identity_count="$(printf '%s\n' "$identity_output" | /usr/bin/grep -c '".*"' || true)"
          keychain_count="$(/usr/bin/security list-keychains -d user 2>/dev/null | /usr/bin/wc -l | /usr/bin/tr -d ' ')"
          printf 'Normal user signing baseline: security_status=%s identity_count=%s user_keychain_lines=%s\n' "$identity_status" "$identity_count" "$keychain_count"
          echo "identity_status=$identity_status" >> "$GITHUB_OUTPUT"
          echo "identity_count=$identity_count" >> "$GITHUB_OUTPUT"
          echo "keychain_count=$keychain_count" >> "$GITHUB_OUTPUT"
          unset identity_output

      - name: Probe signing prerequisites and process drain under transient GID
        id: probe
        shell: bash
        env:
          NORMAL_IDENTITY_STATUS: ${{ steps.baseline.outputs.identity_status }}
          NORMAL_IDENTITY_COUNT: ${{ steps.baseline.outputs.identity_count }}
          NORMAL_KEYCHAIN_COUNT: ${{ steps.baseline.outputs.keychain_count }}
        run: |
          set -euo pipefail
          operator_uid="$(id -u)"
          operator_gid="$(id -g)"
          operator_user="$(id -un)"
          operator_home="$HOME"
          operator_tmp="${TMPDIR:-/tmp}"
          repo="$GITHUB_WORKSPACE"
          root="/private/tmp/nembra-v14-mac-gid-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report="$RUNNER_TEMP/nembra-v14-mac-gid-signing-report.txt"
          log="$RUNNER_TEMP/nembra-v14-mac-gid-signing-xcodebuild.log"
          sudo -n rm -rf -- "$root"
          rm -f -- "$report" "$log"

          ephemeral_gid=61000
          while id -G | tr ' ' '\n' | grep -Fxq "$ephemeral_gid"; do ephemeral_gid=$((ephemeral_gid + 1)); done

          sudo -n /usr/bin/python3 - \
            "$repo" "$root" "$operator_uid" "$operator_gid" "$ephemeral_gid" \
            "$operator_user" "$operator_home" "$operator_tmp" "$log" "$report" \
            "$NORMAL_IDENTITY_STATUS" "$NORMAL_IDENTITY_COUNT" "$NORMAL_KEYCHAIN_COUNT" <<'PY'
          import json
          import os
          from pathlib import Path
          import signal
          import stat
          import subprocess
          import sys

          repo = Path(sys.argv[1]).resolve()
          root = Path(sys.argv[2])
          uid = int(sys.argv[3])
          normal_gid = int(sys.argv[4])
          ephemeral_gid = int(sys.argv[5])
          user = sys.argv[6]
          home = sys.argv[7]
          tmpdir = sys.argv[8]
          log_path = Path(sys.argv[9])
          report_path = Path(sys.argv[10])
          normal_security_status = int(sys.argv[11])
          normal_identity_count = int(sys.argv[12])
          normal_keychain_count = int(sys.argv[13])

          if os.geteuid() != 0:
              raise SystemExit('signing prerequisite supervisor must be root')

          protected = root / 'protected-derived'
          root.mkdir(mode=0o711)
          os.chown(root, 0, 0); os.chmod(root, 0o711)
          protected.mkdir(mode=0o770)
          os.chown(protected, 0, ephemeral_gid); os.chmod(protected, 0o770)

          base_env = dict(os.environ)
          base_env.update({'HOME': home, 'USER': user, 'LOGNAME': user, 'TMPDIR': tmpdir})

          def dropped_capture(argv):
              read_fd, write_fd = os.pipe()
              pid = os.fork()
              if pid == 0:
                  try:
                      os.close(read_fd)
                      os.setgroups([])
                      os.setgid(ephemeral_gid)
                      os.setuid(uid)
                      completed = subprocess.run(argv, env=base_env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False)
                      payload = json.dumps({
                          'status': completed.returncode,
                          'count': completed.stdout.count(b'"') // 2 if argv[1:3] == ['find-identity', '-v'] else len([line for line in completed.stdout.splitlines() if line.strip()]),
                      }).encode('utf-8')
                      os.write(write_fd, payload)
                  except BaseException as exc:
                      os.write(write_fd, json.dumps({'error': type(exc).__name__ + ':' + str(exc)}).encode('utf-8', 'replace'))
                  finally:
                      os._exit(0)
              os.close(write_fd)
              payload = os.read(read_fd, 65536)
              os.close(read_fd)
              os.waitpid(pid, 0)
              return json.loads(payload.decode('utf-8'))

          identity_probe = dropped_capture(['/usr/bin/security', 'find-identity', '-v', '-p', 'codesigning'])
          keychain_probe = dropped_capture(['/usr/bin/security', 'list-keychains', '-d', 'user'])
          if 'error' in identity_probe or 'error' in keychain_probe:
              raise SystemExit(f'transient-GID security probe failed: {identity_probe!r} {keychain_probe!r}')
          if identity_probe['status'] != normal_security_status:
              raise SystemExit(f'codesigning identity status changed under transient GID: normal={normal_security_status} transient={identity_probe}')
          # The exact output formatting can vary; require at least the same
          # identity visibility when the normal session has identities.
          if normal_identity_count > 0 and identity_probe['count'] < normal_identity_count:
              raise SystemExit(f'codesigning identity visibility regressed under transient GID: normal={normal_identity_count} transient={identity_probe}')
          if normal_keychain_count > 0 and keychain_probe['count'] < normal_keychain_count:
              raise SystemExit(f'user keychain visibility regressed under transient GID: normal={normal_keychain_count} transient={keychain_probe}')

          # Same-UID normal-GID sibling must remain outside the output root.
          denied = dropped_capture(['/usr/bin/python3', '-I', '-c', f'import os; os.listdir({str(protected)!r})'])
          if denied.get('status') == 0:
              raise SystemExit('normal-group same-UID child traversed protected DerivedData')

          log_fd = os.open(log_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          os.fchown(log_fd, uid, normal_gid)
          os.set_inheritable(log_fd, True)
          build_pid = os.fork()
          if build_pid == 0:
              try:
                  os.setsid()
                  os.chdir(repo)
                  os.setgroups([])
                  os.setgid(ephemeral_gid)
                  os.setuid(uid)
                  os.dup2(log_fd, 1); os.dup2(log_fd, 2)
                  if log_fd not in (1, 2): os.close(log_fd)
                  argv = [
                      '/usr/bin/xcodebuild',
                      '-project', 'NembraCapture.xcodeproj',
                      '-scheme', 'Nembra Capture',
                      '-configuration', 'Debug',
                      '-sdk', 'iphonesimulator',
                      '-destination', 'generic/platform=iOS Simulator',
                      '-derivedDataPath', str(protected),
                      'build',
                  ]
                  os.execve('/usr/bin/xcodebuild', argv, base_env)
              except BaseException as exc:
                  os.write(2, ('probe child setup failed: ' + type(exc).__name__ + ':' + str(exc) + '\n').encode())
                  os._exit(127)
          os.close(log_fd)
          _, wait_status = os.waitpid(build_pid, 0)
          build_status = os.WEXITSTATUS(wait_status) if os.WIFEXITED(wait_status) else 128 + os.WTERMSIG(wait_status)

          leftover_group = False
          try:
              os.killpg(build_pid, 0)
          except ProcessLookupError:
              pass
          else:
              leftover_group = True
              try:
                  os.killpg(build_pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass

          os.chmod(protected, 0o700)
          app = protected / 'Build' / 'Products' / 'Debug-iphonesimulator' / 'Nembra Capture.app'
          if build_status != 0 or not app.is_dir():
              raise SystemExit(f'signed Simulator xcodebuild failed under transient GID: exit={build_status} app={app.is_dir()}')
          if leftover_group:
              raise SystemExit('xcodebuild returned while its trusted process group still had live descendants; production must not snapshot yet')

          verify = subprocess.run(['/usr/bin/codesign', '--verify', '--deep', '--strict', str(app)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False)
          if verify.returncode != 0:
              raise SystemExit('Simulator app produced under transient GID failed codesign verification after root lock')

          result = {
              'probe_head': os.environ.get('GITHUB_SHA', ''),
              'normal_security_status': normal_security_status,
              'normal_identity_count': normal_identity_count,
              'transient_identity_status': identity_probe['status'],
              'transient_identity_count_lower_bound': identity_probe['count'],
              'normal_user_keychain_lines': normal_keychain_count,
              'transient_user_keychain_lines': keychain_probe['count'],
              'same_uid_normal_gid_output_access': 'denied',
              'xcodebuild_simulator_signing_exit': build_status,
              'xcodebuild_process_group_drained': True,
              'protected_parent_mode_before_post_build_verify': oct(stat.S_IMODE(protected.stat().st_mode)),
              'codesign_verify_after_root_lock': 'success',
              'scope': 'Mac signing prerequisite research only; not physical-device provisioning or #2955 acceptance',
          }
          report_path.write_text(json.dumps(result, sort_keys=True) + '\n', encoding='utf-8')
          os.chown(report_path, uid, normal_gid); os.chmod(report_path, 0o600)
          PY

          sudo -n rm -rf -- "$root"
          cat "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Surface failed diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/nembra-v14-mac-gid-signing-xcodebuild.log" ]]; then
            grep -iE 'error:|permission denied|operation not permitted|codesign|security|failed' "$RUNNER_TEMP/nembra-v14-mac-gid-signing-xcodebuild.log" | tail -n 40 || true
          fi

      - name: Publish research result
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.probe.outputs.report }}
        run: |
          set -euo pipefail
          {
            echo '### Signed-origin Mac transient-GID signing/process research'
            echo
            echo 'Research only; no production source or hardware authority moved.'
            echo
            echo '```json'
            cat "$REPORT"
            echo '```'
            echo
            echo 'This only clears Simulator signing/keychain-query/process-group prerequisites. Physical iOS automatic provisioning, selected-Xcode child environment, private-input build-window custody, root snapshot semantics, and exact #2955 replay remain mandatory before a production repair can be accepted.'
            echo
            echo '**PHYSICAL NO-GO.**'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment 2871 --body-file "$RUNNER_TEMP/comment.md"
