name: Materialize Capture Residual Truth 1c408

on:
  push:
    branches:
      - agent/v14-capture-residual-truth-1c408
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-capture-residual-truth-1c408
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact construction scope
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=1c40853f6991b4d09206df1d25ecff021458b7eb
          git merge-base --is-ancestor "$expected_parent" HEAD
          mapfile -t paths < <(git diff --name-only "$expected_parent"...HEAD | sort)
          expected=(
            .github/workflows/materialize-v14-capture-residual-truth.yml
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${paths[@]}")

      - name: Apply fail-closed Capture repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          status_old = '''        sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipRequestID = UUID()'''
          status_new = '''        sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipStatus = "Exact scooter membership must be verified again for this Secure Link session."
                  membershipRequestID = UUID()'''
          if source.count(status_old) != 2:
              raise SystemExit(f"expected exactly two membership-revocation sites, found {source.count(status_old)}")
          source = source.replace(status_old, status_new)

          duplicate_sessionkey = '''        "refreshtoken",
                  "sessionkey",
                  "authkey",'''
          simplified_sessionkey = '''        "refreshtoken",
                  "authkey",'''
          if source.count(duplicate_sessionkey) != 1:
              raise SystemExit("expected the single duplicated SmartLife sessionkey classifier tail")
          source = source.replace(duplicate_sessionkey, simplified_sessionkey, 1)

          start = source.index("    private func receivedApplicationUpdate(")
          end = source.index("    private func startWatchdog", start)
          receiver = source[start:end]

          guard_old = '''        guard sdkAccountLoggedIn,
                  sdkDeviceMembershipVerified,
                  accountIdentityLeaseIsAuthorized,
                  let driver else {'''
          guard_new = '''        guard sdkAccountLoggedIn,
                  sdkDeviceMembershipVerified,
                  accountIdentityLeaseIsAuthorized,
                  let driver,
                  let verifiedAccountUID = membershipAccountUID,
                  !verifiedAccountUID.isEmpty else {'''
          if receiver.count(guard_old) != 1:
              raise SystemExit("expected one application-update source-authority guard")
          receiver = receiver.replace(guard_old, guard_new, 1)

          admission_old = '''        applicationUpdateAdmissionsInFlight += 1
                  defer { applicationUpdateAdmissionsInFlight -= 1 }

                  do {'''
          admission_new = '''        applicationUpdateAdmissionsInFlight += 1
                  defer { applicationUpdateAdmissionsInFlight -= 1 }

                  // Account identity is authority, not application evidence. Scrub the exact
                  // verified UID value while preserving unrelated device/application keys.
                  let exportSafeUpdate = update.mapValues { value in
                      value.replacingOccurrences(
                          of: verifiedAccountUID,
                          with: "<redacted-account-uid>",
                          options: [.literal]
                      )
                  }

                  do {'''
          if receiver.count(admission_old) != 1:
              raise SystemExit("expected one application-update admission boundary")
          receiver = receiver.replace(admission_old, admission_new, 1)

          log_old = '''            log("tuya_application_update", update.merging([
                      "generation": String(token.diagnosticGeneration)
                  ]) { current, _ in current })'''
          log_new = '''            log("tuya_application_update", exportSafeUpdate.merging([
                      "generation": String(token.diagnosticGeneration)
                  ]) { _, trusted in trusted })'''
          if receiver.count(log_old) != 1:
              raise SystemExit("expected the single untrusted-first application event log")
          receiver = receiver.replace(log_old, log_new, 1)

          source = source[:start] + receiver + source[end:]
          path.write_text(source)
          PY

      - name: Validate focused truth contracts
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaSecureLinkViewMembershipStatusRevocationSourceTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaApplicationEventMetadataPrecedenceSourceTests
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaApplicationAccountUIDExportCustodySourceTests
          git diff --check

      - name: Verify effective scope and publish donor
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=1c40853f6991b4d09206df1d25ecff021458b7eb
          rm .github/workflows/materialize-v14-capture-residual-truth.yml
          mapfile -t paths < <(git diff --name-only "$expected_parent" | sort)
          expected=(
            NembraApp/App/NembraCaptureEntrypoint.swift
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${paths[@]}")
          git diff --check "$expected_parent"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(capture): close residual event and membership truth gaps"
          git push origin HEAD:agent/v14-capture-residual-truth-1c408
