name: V14 integrate application seal custody

on:
  push:
    branches:
      - repair/v14-capture-application-seal-custody-current-sol

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Compose reviewed product paths onto unchanged flagship
        env:
          BASE_BRANCH: integration/v14-capture-final-stationary-convergence-sol
          DONOR_BRANCH: repair/v14-capture-application-seal-custody-current-sol
          EXPECTED_BASE: 749a85e18ca4ce0c9b46929b11c633e155960015
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dc53f55fce44b17ea70119875ea9eb26617028e4"

          # Retire this one-shot runner first so the donor returns to a product-only tree.
          rm .github/workflows/v14-integrate-application-seal-custody.yml
          git config user.name "nembra-v14-integration"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/v14-integrate-application-seal-custody.yml
          git commit -m "chore(capture): retire seal custody integration runner"
          donor_head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/heads/$DONOR_BRANCH" | awk '{print $1}')" = "$EVENT_SHA"
          git push origin "HEAD:$DONOR_BRANCH"

          # Exact-head compare-and-swap: never overwrite newer swarm work.
          git fetch origin "$BASE_BRANCH"
          remote_base="$(git rev-parse FETCH_HEAD)"
          test "$remote_base" = "$EXPECTED_BASE"
          git switch --detach "$remote_base"

          # Compose only the two source-reviewed product paths; no donor workflow/history is replayed.
          git checkout "$donor_head" -- \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationSealCustodySourceTests.swift
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationSealCustodySourceTests.swift

          python3 - <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          assert "func consumeCorrelationAsyncInvalidation()" in app
          assert "captureAttemptEventStartIndex = events.count" in app
          assert "guard !acceptanceSealInProgress else" in app
          assert "applicationAdmissionInFlightCount += 1" in app
          assert "acceptedApplicationEventCount(for: token) == self.applicationUpdateCount" in app
          assert "let eventsAtSealBarrier = Array(self.events.dropFirst(self.captureAttemptEventStartIndex))" in app
          assert "sealedAcceptedEventPrefix = eventsAtSealBarrier" in app
          assert "events: sealedAcceptedEventPrefix" in app
          assert Path("scripts/field/install_one_time_capture.command").exists()
          PY

          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationSealCustodySourceTests.swift
          git commit -m "fix(capture): close accepted application seal custody"
          integrated_head="$(git rev-parse HEAD)"

          # Re-check the remote immediately before publish; fail rather than racing another closer.
          test "$(git ls-remote origin "refs/heads/$BASE_BRANCH" | awk '{print $1}')" = "$EXPECTED_BASE"
          git push origin "HEAD:$BASE_BRANCH"
          echo "Integrated exact head: $integrated_head"
