name: Materialize signed app install custody r2

on:
  push:
    branches:
      - repair/v14-capture-signed-app-install-custody-r2-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-signed-app-install-custody-r2-sol
          fetch-depth: 0

      - name: Patch installer and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          installer = Path("scripts/field/install_one_time_capture.command")
          source = installer.read_text(encoding="utf-8")

          authority_marker = 'say "Final signed app and embedded provisioning profile authorize Sign in with Apple for one exact App ID and the selected team"\n'
          if source.count(authority_marker) != 1:
              raise SystemExit("installer authority marker drifted")
          if "SIGNED_APP_SUBJECT_SHA256=" in source:
              raise SystemExit("installer already contains signed-app custody wiring")
          authority_replacement = authority_marker + (
              'SIGNED_APP_INSTALL_GUARD="$ROOT/Scripts/capture_signed_app_install_guard.py"\n'
              '[[ -f "$SIGNED_APP_INSTALL_GUARD" ]] || die "Signed-app install custody guard is missing from the accepted source."\n'
              'SIGNED_APP_SUBJECT_SHA256="$(/usr/bin/python3 -I "$SIGNED_APP_INSTALL_GUARD" --digest-only --app "$APP")" || \\\n'
              '    die "Could not seal the exact signed Capture app install subject. Discard this candidate."\n'
              '[[ "$SIGNED_APP_SUBJECT_SHA256" =~ ^[0-9a-f]{64}$ ]] || die "Signed Capture app install-subject fingerprint is malformed. Discard this candidate."\n'
              'say "Final signed Capture app install subject sealed for devicectl custody"\n'
          )
          source = source.replace(authority_marker, authority_replacement, 1)

          old_install = (
              '    if xcrun devicectl device install app --device "$COREDEVICE_ID" "$APP" >"$INSTALL_LOG" 2>&1; then\n'
              '        INSTALLED=1\n'
              '        break\n'
              '    fi\n'
          )
          if source.count(old_install) != 1:
              raise SystemExit("installer devicectl call marker drifted")
          new_install = (
              '    if /usr/bin/python3 -I "$SIGNED_APP_INSTALL_GUARD" \\\n'
              '        --app "$APP" \\\n'
              '        --expected-sha256 "$SIGNED_APP_SUBJECT_SHA256" \\\n'
              '        -- xcrun devicectl device install app --device "$COREDEVICE_ID" "$APP" >"$INSTALL_LOG" 2>&1; then\n'
              '        INSTALLED=1\n'
              '        break\n'
              '    else\n'
              '        INSTALL_RC="$?"\n'
              '        if [[ "$INSTALL_RC" == "74" ]]; then\n'
              '            die "The signed Capture app changed after verification or while devicectl was consuming it. Discard this candidate; no install authority remains."\n'
              '        fi\n'
              '    fi\n'
          )
          source = source.replace(old_install, new_install, 1)
          installer.write_text(source, encoding="utf-8")
          Path(".github/workflows/materialize-signed-app-install-custody-r2.yml").unlink()
          PY

          python3 -m py_compile Scripts/capture_signed_app_install_guard.py
          python3 -m py_compile scripts/ci/tests/test_capture_signed_app_install_guard.py
          python3 -m py_compile scripts/ci/tests/test_capture_signed_app_install_subject.py
          python3 -I scripts/ci/tests/test_capture_signed_app_install_guard.py
          python3 -I scripts/ci/tests/test_capture_signed_app_install_subject.py
          bash -n scripts/field/install_one_time_capture.command
          grep -Fq 'SIGNED_APP_SUBJECT_SHA256="$(/usr/bin/python3 -I "$SIGNED_APP_INSTALL_GUARD" --digest-only --app "$APP")"' scripts/field/install_one_time_capture.command
          grep -Fq -- '--expected-sha256 "$SIGNED_APP_SUBJECT_SHA256"' scripts/field/install_one_time_capture.command
          git diff --check
          git status --short

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/field/install_one_time_capture.command .github/workflows/materialize-signed-app-install-custody-r2.yml
          git commit -m "capture: bind verified app to devicectl install"
          git push origin HEAD:repair/v14-capture-signed-app-install-custody-r2-sol
