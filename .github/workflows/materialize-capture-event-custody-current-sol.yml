name: Materialize Capture Event Custody Current Sol

on:
  push:
    branches:
      - "fix/v14-capture-event-custody-current-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Verify exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          product="8069c0ffec496cacbe263016d8a7f4ca15ddc64e"
          test "$(git rev-parse HEAD^)" = "$product" || {
            echo "Expected parent $product, got $(git rev-parse HEAD^)" >&2
            exit 1
          }
          git diff --quiet "$product" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Materialize trusted event custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text(encoding="utf-8")

          helper = '''    private static func redactVerifiedAccountUID(
              in update: [String: String],
              verifiedAccountUID: String
          ) -> [String: String] {
              let marker = "<redacted-account-uid>"
              var redacted: [String: String] = [:]
              redacted.reserveCapacity(update.count)

              // Sorting makes only collision-key suffixing deterministic. It does not alter the
              // package ledger's receipt chronology or promote dictionary order into evidence.
              for (rawKey, rawValue) in update.sorted(by: { $0.key < $1.key }) {
                  let baseKey = rawKey.replacingOccurrences(
                      of: verifiedAccountUID,
                      with: marker,
                      options: [.literal]
                  )
                  let value = rawValue.replacingOccurrences(
                      of: verifiedAccountUID,
                      with: marker,
                      options: [.literal]
                  )
                  var admittedKey = baseKey
                  var collisionOrdinal = 2
                  while redacted[admittedKey] != nil {
                      admittedKey = "\\(baseKey)#\\(collisionOrdinal)"
                      collisionOrdinal += 1
                  }
                  redacted[admittedKey] = value
              }
              return redacted
          }

          '''
          marker = "    private func receivedApplicationUpdate(\n"
          if source.count(marker) != 1:
              raise SystemExit(f"expected one receivedApplicationUpdate marker, found {source.count(marker)}")
          if "private static func redactVerifiedAccountUID(" in source:
              raise SystemExit("verified-account UID helper unexpectedly already exists")
          source = source.replace(marker, helper + marker, 1)

          start = source.index("    private func receivedApplicationUpdate(")
          end = source.index("    private func startWatchdog", start)
          before, admission, after = source[:start], source[start:end], source[end:]

          transport = '''        guard driver.isLocallyConnected(uuid: tuyaUUID) else {
              await recordObservedTransportLoss(token: token)
              return
          }
          '''
          if admission.count(transport) != 1:
              raise SystemExit(f"expected one local transport guard, found {admission.count(transport)}")
          lease_bound_custody = transport + '''        guard let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),
                !verifiedAccountUID.isEmpty else {
              await invalidateSourceAuthority(
                  token: token,
                  message: "The verified Tuya account identity lease became unavailable before application evidence custody.",
                  kind: "sdk_account_uid_lease_missing_during_observation"
              )
              return
          }
          let exportSafeUpdate = Self.redactVerifiedAccountUID(
              in: update,
              verifiedAccountUID: verifiedAccountUID
          )
          '''
          admission = admission.replace(transport, lease_bound_custody, 1)

          raw_log = '''            log("tuya_application_update", update.merging([
                  "generation": String(token.diagnosticGeneration)
              ]) { current, _ in current })
          '''
          trusted_log = '''            log("tuya_application_update", exportSafeUpdate.merging([
                  "generation": String(token.diagnosticGeneration)
              ]) { _, trusted in trusted })
          '''
          if admission.count(raw_log) != 1:
              raise SystemExit(f"expected one raw/untrusted event merge, found {admission.count(raw_log)}")
          admission = admission.replace(raw_log, trusted_log, 1)
          source = before + admission + after

          list_start = source.index("    private static let secretKeyFragments = [")
          list_end = source.index("    ]", list_start)
          fragments = source[list_start:list_end]
          needle = '"sessionkey"'
          if fragments.count(needle) != 2:
              raise SystemExit(f"expected exactly two sessionkey classifier entries before simplification, found {fragments.count(needle)}")
          first = fragments.index(needle)
          second = fragments.index(needle, first + len(needle))
          line_start = fragments.rfind("\n", 0, second) + 1
          line_end = fragments.find("\n", second)
          if line_end == -1:
              raise SystemExit("duplicate sessionkey line terminator missing")
          duplicate_line = fragments[line_start:line_end + 1]
          if duplicate_line.strip() != '"sessionkey",':
              raise SystemExit(f"unexpected duplicate classifier line: {duplicate_line!r}")
          fragments = fragments[:line_start] + fragments[line_end + 1:]
          source = source[:list_start] + fragments + source[list_end:]

          path.write_text(source, encoding="utf-8")
          PY

          for spec in \
            "a8eb9b93eea7e5de1a9c80468cadf378989b5edd Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift" \
            "8010d108a043fbe2ff03fa3bb0d1518aa7047c08 Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift"
          do
            head="${spec%% *}"
            test_path="${spec#* }"
            test ! -e "$test_path" || { echo "Refusing to overwrite $test_path" >&2; exit 1; }
            git fetch --no-tags --depth=1 origin "$head"
            git show "$head:$test_path" > "$test_path"
          done

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDKeyCustodySourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application account-UID key custody")
          struct TuyaApplicationAccountUIDKeyCustodySourceTests {
              @Test("verified account UID is scrubbed from both application keys and values before log custody")
              func exactAccountUIDCannotSurviveMalformedKeyOrValue() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let helper = String(try section(
                      in: source,
                      from: "private static func redactVerifiedAccountUID(",
                      to: "private func receivedApplicationUpdate("
                  ))
                  let admission = String(try section(
                      in: source,
                      from: "private func receivedApplicationUpdate(",
                      to: "private func startWatchdog"
                  ))

                  #expect(helper.contains("rawKey.replacingOccurrences("))
                  #expect(helper.contains("rawValue.replacingOccurrences("))
                  #expect(helper.components(separatedBy: "of: verifiedAccountUID").count - 1 == 2)
                  #expect(helper.contains("<redacted-account-uid>"))
                  #expect(helper.contains("while redacted[admittedKey] != nil"))
                  #expect(admission.contains("let exportSafeUpdate = Self.redactVerifiedAccountUID("))
                  #expect(admission.contains("verifiedAccountUID: verifiedAccountUID"))
                  #expect(admission.contains("exportSafeUpdate.merging(["))
                  #expect(!admission.contains("update.merging(["))
              }

              @Test("UID scrubber is bound to the already-earned membership lease")
              func custodyUsesMembershipLeaseSnapshotRatherThanFreshGlobalIdentityLookup() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let admission = String(try section(
                      in: source,
                      from: "private func receivedApplicationUpdate(",
                      to: "private func startWatchdog"
                  ))

                  #expect(admission.contains("let verifiedAccountUID = membershipAccountUID?.trimmingCharacters"))
                  #expect(admission.contains("!verifiedAccountUID.isEmpty"))
                  #expect(!admission.contains("OfficialTuyaFactory.currentAccountUID"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          SWIFT

      - name: Validate custody behavior and source contracts
        shell: bash
        run: |
          set -euo pipefail
          app="NembraApp/App/NembraCaptureEntrypoint.swift"
          tests=(
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDKeyCustodySourceTests.swift"
          )
          swiftc -frontend -parse "$app"
          for test_file in "${tests[@]}"; do
            swiftc -frontend -parse "$test_file"
          done

          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")
          helper_start = source.index("    private static func redactVerifiedAccountUID(")
          update_start = source.index("    private func receivedApplicationUpdate(", helper_start)
          update_end = source.index("    private func startWatchdog", update_start)
          helper = source[helper_start:update_start]
          update = source[update_start:update_end]

          for token in (
              "rawKey.replacingOccurrences(",
              "rawValue.replacingOccurrences(",
              "of: verifiedAccountUID",
              'let marker = "<redacted-account-uid>"',
              "while redacted[admittedKey] != nil",
          ):
              assert token in helper, token
          assert helper.count("of: verifiedAccountUID") == 2
          assert "let verifiedAccountUID = membershipAccountUID?.trimmingCharacters" in update
          assert "let exportSafeUpdate = Self.redactVerifiedAccountUID(" in update
          assert 'log("tuya_application_update", exportSafeUpdate.merging([' in update
          assert '"generation": String(token.diagnosticGeneration)' in update
          assert ") { _, trusted in trusted })" in update
          assert 'log("tuya_application_update", update.merging([' not in update
          assert ") { current, _ in current })" not in update

          driver_start = source.index("@MainActor\nprivate final class SmartLifeDriver")
          driver_end = source.index("#endif\n\nprivate enum AppleAccountAuthorizationError", driver_start)
          driver = source[driver_start:driver_end]
          assert '"uid",' not in driver
          list_start = driver.index("private static let secretKeyFragments = [")
          list_end = driver.index("    ]", list_start)
          classifier = driver[list_start:list_end]
          assert classifier.count('"sessionkey"') == 1, classifier
          for fragment in ("localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey"):
              assert f'"{fragment}"' in classifier, fragment
          print("Capture application event custody source invariants: PASS")
          PY

          cat > /tmp/nembra_event_custody_probe.swift <<'SWIFT'
          import Foundation

          func redact(_ update: [String: String], uid: String) -> [String: String] {
              let marker = "<redacted-account-uid>"
              var redacted: [String: String] = [:]
              for (rawKey, rawValue) in update.sorted(by: { $0.key < $1.key }) {
                  let baseKey = rawKey.replacingOccurrences(of: uid, with: marker, options: [.literal])
                  let value = rawValue.replacingOccurrences(of: uid, with: marker, options: [.literal])
                  var admittedKey = baseKey
                  var collisionOrdinal = 2
                  while redacted[admittedKey] != nil {
                      admittedKey = "\(baseKey)#\(collisionOrdinal)"
                      collisionOrdinal += 1
                  }
                  redacted[admittedKey] = value
              }
              return redacted
          }

          let uid = "account-ABC-123"
          let raw = [
              "owner": "prefix account-ABC-123 suffix",
              "account-ABC-123-key": "first",
              "<redacted-account-uid>-key": "second",
              "uid": "device-uid-is-legitimate",
              "generation": "forged-generation",
          ]
          let cleaned = redact(raw, uid: uid)
          precondition(!cleaned.keys.joined().contains(uid))
          precondition(!cleaned.values.joined().contains(uid))
          precondition(cleaned["uid"] == "device-uid-is-legitimate")
          precondition(cleaned.values.contains("first"))
          precondition(cleaned.values.contains("second"))
          precondition(cleaned.count == raw.count)
          var event = cleaned
          event.merge(["generation": "42"]) { _, trusted in trusted }
          precondition(event["generation"] == "42")
          SWIFT
          swift /tmp/nembra_event_custody_probe.swift
          git diff --check

      - name: Commit durable current-product repair
        shell: bash
        run: |
          set -euo pipefail
          product="8069c0ffec496cacbe263016d8a7f4ca15ddc64e"
          rm .github/workflows/materialize-capture-event-custody-current-sol.yml
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$product" | sort)
          expected=(
            "NembraApp/App/NembraCaptureEntrypoint.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDKeyCustodySourceTests.swift"
            "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}" || {
            echo "Unexpected effective paths:" >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          }
          git config user.name "Nembra V14 Sol"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): bind application event custody to trusted authority"
          git push origin HEAD:fix/v14-capture-event-custody-current-sol
