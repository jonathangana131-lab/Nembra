name: Materialize Capture CocoaPods Subject Authority R2

on:
  push:
    branches:
      - repair/v14-capture-cocoapods-build-subject-authority-r2-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'ci(capture): materialize CocoaPods subject authority'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-cocoapods-build-subject-authority-r2-sol
          fetch-depth: 0

      - name: Patch exact bootstrap authority boundary
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('Scripts/bootstrap_capture_tuya_sdk.sh')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one bootstrap marker, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              'PROVENANCE_HELPER="$SCRIPT_DIR/capture_tuya_private_input_provenance.py"\nREVIEW_ONLY=0',
              'PROVENANCE_HELPER="$SCRIPT_DIR/capture_tuya_private_input_provenance.py"\nCOCOAPODS_BUILD_SUBJECT_HELPER="$SCRIPT_DIR/capture_cocoapods_build_subject.py"\nREVIEW_ONLY=0',
          )

          replace_once(
              '  ACCEPTED_LOCK_SHA256="$(printf \'%s\' "$NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256" | tr \'[:upper:]\' \'[:lower:]\')"\nelse\n  unset NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 || true\n  ACCEPTED_LOCK_SHA256=""',
              '  ACCEPTED_LOCK_SHA256="$(printf \'%s\' "$NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256" | tr \'[:upper:]\' \'[:lower:]\')"\n  : "${NEMBRA_CAPTURE_ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256:?Set NEMBRA_CAPTURE_ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256 to the preaccepted 64-hex generated CocoaPods build-subject SHA-256 before field bootstrap.}"\n  [[ "$NEMBRA_CAPTURE_ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || {\n    echo "ERROR: NEMBRA_CAPTURE_ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256 must be exactly 64 hex characters." >&2\n    exit 1\n  }\n  ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256="$(printf \'%s\' "$NEMBRA_CAPTURE_ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256" | tr \'[:upper:]\' \'[:lower:]\')"\nelse\n  unset NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 NEMBRA_CAPTURE_ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256 || true\n  ACCEPTED_LOCK_SHA256=""\n  ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256=""',
          )

          replace_once(
              'if [[ ! -f "$PROVENANCE_HELPER" ]]; then\n  echo "ERROR: private Tuya input provenance helper is missing from the accepted source." >&2\n  exit 6\nfi',
              'if [[ ! -f "$PROVENANCE_HELPER" ]]; then\n  echo "ERROR: private Tuya input provenance helper is missing from the accepted source." >&2\n  exit 6\nfi\n\nif [[ ! -f "$COCOAPODS_BUILD_SUBJECT_HELPER" ]]; then\n  echo "ERROR: CocoaPods generated-build subject helper is missing from the accepted source." >&2\n  exit 6\nfi',
          )

          marker = "printf 'Resolving the official Tuya SmartLife iOS SDK and private field identity for Nembra Capture...\\n'"
          precheck = r'''if [[ "$REVIEW_ONLY" == "0" ]]; then
            [[ -f Podfile.lock ]] || {
              echo "ERROR: normal field bootstrap requires the reviewed Podfile.lock to already exist before CocoaPods starts. Run --resolve-lock-for-review first, review that exact lock, then retry from the unchanged workspace." >&2
              exit 16
            }
            PRE_COCOAPODS_LOCK_SHA256="$(shasum -a 256 Podfile.lock | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
            [[ "$PRE_COCOAPODS_LOCK_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
              echo "ERROR: could not compute the pre-CocoaPods Podfile.lock SHA-256." >&2
              exit 16
            }
            [[ "$PRE_COCOAPODS_LOCK_SHA256" == "$ACCEPTED_LOCK_SHA256" ]] || {
              echo "ERROR: on-disk Podfile.lock does not match the preaccepted dependency lock before CocoaPods. Refusing to run the generator." >&2
              exit 16
            }
            printf 'Preaccepted Tuya dependency lock matched before CocoaPods: %s\n' "$PRE_COCOAPODS_LOCK_SHA256"
          fi

          '''.replace('          ', '')
          replace_once(marker, precheck + marker)

          mode_guard = '''[[ "$(stat -f '%Lp' "$DEPENDENCY_PROVENANCE" 2>/dev/null || true)" == "600" ]] || {
            echo "ERROR: private Tuya dependency provenance record is not mode 0600." >&2
            exit 15
          }'''.replace('          ', '')
          subject_block = mode_guard + r'''

          if ! COCOAPODS_BUILD_SUBJECT_SHA256="$(/usr/bin/python3 -I "$COCOAPODS_BUILD_SUBJECT_HELPER" \
            --lockfile "$REPO_ROOT/Podfile.lock" \
            --pods "$REPO_ROOT/Pods" \
            --workspace "$REPO_ROOT/NembraCapture.xcworkspace")"
          then
            echo "ERROR: exact generated CocoaPods build subject could not be fingerprinted." >&2
            exit 17
          fi
          [[ "$COCOAPODS_BUILD_SUBJECT_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "ERROR: generated CocoaPods build-subject fingerprint is malformed." >&2
            exit 17
          }'''.replace('          ', '')
          replace_once(mode_guard, subject_block)

          replace_once(
              '  Podfile.lock SHA-256: $LOCK_SHA256\n  Local private-input fingerprint record: $DEPENDENCY_PROVENANCE',
              '  Podfile.lock SHA-256: $LOCK_SHA256\n  CocoaPods generated build subject SHA-256: $COCOAPODS_BUILD_SUBJECT_SHA256\n  Local private-input fingerprint record: $DEPENDENCY_PROVENANCE',
          )
          replace_once(
              'Review and bind this exact dependency-lock digest to the exact accepted Capture\nsource through the current Final-GO control plane before any field build/install.\nThen rerun the normal bootstrap/installer with that accepted digest supplied as\nNEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256.',
              'Review and bind both the exact dependency-lock digest and generated CocoaPods\nbuild-subject digest to the exact accepted Capture source before any field build/install.\nThen rerun normal bootstrap with both reviewed values supplied as\nNEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 and\nNEMBRA_CAPTURE_ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256.',
          )

          old_accept = '''[[ "$LOCK_SHA256" == "$ACCEPTED_LOCK_SHA256" ]] || {
            echo "ERROR: resolved Podfile.lock does not match the preaccepted dependency-lock SHA-256. Stop before xcodebuild/install and review the new dependency subject." >&2
            exit 16
          }
          printf 'Preaccepted Tuya dependency lock matched: %s\n' "$LOCK_SHA256"
          unset ACCEPTED_LOCK_SHA256 NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 || true'''.replace('          ', '')
          new_accept = old_accept.replace(
              "printf 'Preaccepted Tuya dependency lock matched: %s\\n' \"$LOCK_SHA256\"\nunset ACCEPTED_LOCK_SHA256 NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 || true",
              "[[ \"$COCOAPODS_BUILD_SUBJECT_SHA256\" == \"$ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256\" ]] || {\n  echo \"ERROR: generated CocoaPods build subject does not match the preaccepted build-subject SHA-256. Stop before xcodebuild/install and review the new generated build subject.\" >&2\n  exit 18\n}\nprintf 'Preaccepted Tuya dependency lock matched: %s\\n' \"$LOCK_SHA256\"\nprintf 'Preaccepted generated CocoaPods build subject matched: %s\\n' \"$COCOAPODS_BUILD_SUBJECT_SHA256\"\nunset ACCEPTED_LOCK_SHA256 ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256 NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256 NEMBRA_CAPTURE_ACCEPTED_COCOAPODS_BUILD_SUBJECT_SHA256 || true",
          )
          replace_once(old_accept, new_accept)

          replace_once(
              '  Podfile.lock SHA-256: $LOCK_SHA256\n  Local private-input fingerprint record: $DEPENDENCY_PROVENANCE\n\nNEXT BUILD RULE:',
              '  Podfile.lock SHA-256: $LOCK_SHA256\n  CocoaPods generated build subject SHA-256: $COCOAPODS_BUILD_SUBJECT_SHA256\n  Local private-input fingerprint record: $DEPENDENCY_PROVENANCE\n\nNEXT BUILD RULE:',
          )

          path.write_text(source, encoding='utf-8')
          PY

          rm .github/workflows/materialize-capture-cocoapods-subject-r2.yml
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          /usr/bin/python3 -m py_compile Scripts/capture_cocoapods_build_subject.py scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          /usr/bin/python3 -I Scripts/capture_cocoapods_build_subject.py --self-test
          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          git diff --check

      - name: Commit clean product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-capture-bot'
          git config user.email 'nembra-capture-bot@users.noreply.github.com'
          git add Scripts/bootstrap_capture_tuya_sdk.sh .github/workflows/materialize-capture-cocoapods-subject-r2.yml
          git commit -m 'fix(capture): bind reviewed CocoaPods build subject'
          git push origin HEAD:repair/v14-capture-cocoapods-build-subject-authority-r2-sol
