name: Recover Capture trusted generation 8069
on:
  push:
    branches: [repair/v14-capture-trusted-event-generation-8069-sol]
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 8}
      - name: Repair exact collision policy
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=8069c0ffec496cacbe263016d8a7f4ca15ddc64e
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          WORKFLOW=.github/workflows/recover-capture-trusted-event-generation-8069-sol.yml
          actual="$(git diff --name-only "$PRODUCT" HEAD | sort)"; expected="$(printf '%s\n%s\n' "$TEST" "$WORKFLOW" | sort)"; test "$actual" = "$expected"
          python3 <<'PY'
          from pathlib import Path
          p=Path('NembraApp/App/NembraCaptureEntrypoint.swift'); s=p.read_text(); a=s.index('    private func receivedApplicationUpdate('); b=s.index('    private func startWatchdog',a); r=s[a:b]
          old=') { current, _ in current })'; new=') { _, trusted in trusted })'
          if r.count(old)!=1: raise SystemExit(f'expected one seam, found {r.count(old)}')
          r=r.replace(old,new,1); p.write_text(s[:a]+r+s[b:])
          if old in r or new not in r or '"generation": String(token.diagnosticGeneration)' not in r: raise SystemExit('trusted precedence missing')
          PY
          swiftc -parse "$TEST"; git diff --check
      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=8069c0ffec496cacbe263016d8a7f4ca15ddc64e
          APP=NembraApp/App/NembraCaptureEntrypoint.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          WORKFLOW=.github/workflows/recover-capture-trusted-event-generation-8069-sol.yml
          rm "$WORKFLOW"
          actual="$(git diff --name-only "$PRODUCT" | sort)"; expected="$(printf '%s\n%s\n' "$APP" "$TEST" | sort)"; test "$actual" = "$expected"
          git diff --check; git add "$APP" "$WORKFLOW"; git config user.name nembra-recovery-bot; git config user.email actions@users.noreply.github.com; git commit -m 'fix(capture): protect trusted event generation provenance'; git push origin "HEAD:${GITHUB_REF_NAME}"
