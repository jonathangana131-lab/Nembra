name: Capture Tracked Namespace Coherence Publish Once

on:
  push:
    branches:
      - repair/v17-capture-generated-private-selector-fd-custody-sol-20260814
    paths:
      - .github/workflows/capture-tracked-namespace-coherence-publish-once.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4

      - name: Materialize tested tracked namespace repair
        shell: bash
        run: |
          set -euo pipefail
          base=694adcba037bb9293b14125cee34a13533b3bf5e
          test "$(git merge-base HEAD "$base")" = "$base"
          python3 -B - <<'PY'
          from pathlib import Path

          helper = Path('scripts/ci/capture_accepted_build_input_snapshot.py')
          text = helper.read_text(encoding='utf-8')
          anchor = 'def _git_environment() -> dict[str, str]:\n'
          addition = '''def _assert_tracked_namespace_coherence(paths: Iterable[Path]) -> None:\n    """Reject tracked paths whose prefixes collapse in the field macOS namespace."""\n\n    seen: dict[tuple[str, ...], tuple[str, ...]] = {}\n    for relative in sorted(paths, key=lambda value: value.as_posix()):\n        _safe_relative(relative)\n        raw_parts = relative.parts\n        key_parts = _namespace_key(relative)\n        for length in range(1, len(raw_parts) + 1):\n            raw_prefix = raw_parts[:length]\n            key_prefix = key_parts[:length]\n            previous = seen.get(key_prefix)\n            if previous is not None and previous != raw_prefix:\n                raise AcceptedBuildInputSnapshotError(\n                    "accepted tracked source has namespace-equivalent paths: "\n                    f"{'/'.join(previous)} vs {'/'.join(raw_prefix)}"\n                )\n            seen[key_prefix] = raw_prefix\n\n\n'''
          if text.count(anchor) != 1 or '_assert_tracked_namespace_coherence' in text:
              raise SystemExit('tracked namespace helper anchor mismatch')
          text = text.replace(anchor, addition + anchor)
          old = '        entries.append((mode, kind, oid, relative))\n    return tuple(entries)\n'
          new = '        entries.append((mode, kind, oid, relative))\n    _assert_tracked_namespace_coherence(relative for _mode, _kind, _oid, relative in entries)\n    return tuple(entries)\n'
          if text.count(old) != 1:
              raise SystemExit('git tree return anchor mismatch')
          text = text.replace(old, new)
          old = '''    if destination.exists():\n        raise AcceptedBuildInputSnapshotError("tracked-source destination already exists")\n    destination.mkdir(parents=True, mode=0o755)\n    written: set[Path] = set()\n    for mode, _kind, oid, relative in _git_tree_entries(repo, source_sha):\n'''
          new = '''    if destination.exists():\n        raise AcceptedBuildInputSnapshotError("tracked-source destination already exists")\n    entries = _git_tree_entries(repo, source_sha)\n    destination.mkdir(parents=True, mode=0o755)\n    written: set[Path] = set()\n    for mode, _kind, oid, relative in entries:\n'''
          if text.count(old) != 1:
              raise SystemExit('materialization admission-order anchor mismatch')
          helper.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('scripts/ci/tests/test_capture_accepted_build_input_snapshot.py')
          text = tests.read_text(encoding='utf-8')
          marker = '    def test_casefolded_tracked_ancestor_cannot_alias_generated_subject(self) -> None:\n'
          regression = '''    def test_case_distinct_tracked_prefixes_fail_before_materialization(self) -> None:\n        with tempfile.TemporaryDirectory() as raw:\n            root = Path(raw) / "repo"\n            root.mkdir()\n            git(root, "init", "-q")\n            git(root, "config", "user.email", "capture@example.invalid")\n            git(root, "config", "user.name", "Capture Test")\n            (root / "Foo").mkdir()\n            (root / "foo").mkdir()\n            (root / "Foo/A.swift").write_text("UPPER\\n", encoding="utf-8")\n            (root / "foo/B.swift").write_text("lower\\n", encoding="utf-8")\n            git(root, "add", "Foo/A.swift", "foo/B.swift")\n            git(root, "commit", "-qm", "case-distinct tracked namespace")\n            source_sha = git(root, "rev-parse", "HEAD")\n            with self.assertRaises(snapshot.AcceptedBuildInputSnapshotError):\n                snapshot._git_tree_entries(root, source_sha)\n            destination = Path(raw) / "stage"\n            with self.assertRaises(snapshot.AcceptedBuildInputSnapshotError):\n                snapshot.materialize_tracked_source(root, source_sha, destination)\n            self.assertFalse(destination.exists())\n\n'''
          if text.count(marker) != 1 or 'test_case_distinct_tracked_prefixes_fail_before_materialization' in text:
              raise SystemExit('tracked namespace regression anchor mismatch')
          tests.write_text(text.replace(marker, regression + marker), encoding='utf-8')
          PY

          python3 -B scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check

      - name: Publish exact permanent delta
        shell: bash
        run: |
          set -euo pipefail
          base=694adcba037bb9293b14125cee34a13533b3bf5e
          rm \
            .github/workflows/capture-tracked-namespace-coherence-materialize-once.yml \
            .github/workflows/capture-tracked-namespace-coherence-recovery-once.yml \
            .github/workflows/capture-tracked-namespace-coherence-publish-once.yml
          git config user.name "nembra-capture-materializer"
          git config user.email "capture-materializer@users.noreply.github.com"
          git add -A
          staged="$(git diff --cached --name-only "$base" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            'scripts/ci/capture_accepted_build_input_snapshot.py' \
            'scripts/ci/tests/test_capture_accepted_build_input_snapshot.py' | LC_ALL=C sort)"
          printf 'staged relative to clean repair head:\n%s\n' "$staged"
          test "$staged" = "$expected"
          test -z "$(git diff --cached --name-only | grep -E '(__pycache__|\.pyc$)' || true)"
          git commit -m "Reject tracked namespace-equivalent source paths"
          git push origin HEAD:repair/v17-capture-generated-private-selector-fd-custody-sol-20260814
