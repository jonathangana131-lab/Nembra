name: Capture Authority Chain Diagnostic

on:
  push:
    branches:
      - repair/v14-private-review-hmac-helper-execution-sol

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-review-hmac-helper-execution-sol
      - name: Exercise authority-chain materializer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import traceback

          try:
              workflow = Path('.github/workflows/capture-authority-chain-materialize.yml').read_text(encoding='utf-8')
              start = "          python3 - <<'PY'\n"
              end = "\n          PY\n"
              if workflow.count(start) != 1:
                  raise RuntimeError('materializer payload start is not unique')
              payload = workflow.split(start, 1)[1].split(end, 1)[0]
              prefix = "          "
              normalized = "\n".join(
                  line[len(prefix):] if line.startswith(prefix) else line
                  for line in payload.splitlines()
              )
              strict = '    if count != 1:\n        raise SystemExit(f"{label}: expected one match, found {count}")\n    return text.replace(old, new, 1)'
              compatible = '    if label == "bootstrap review helper output" and count == 2:\n        return text.replace(old, new, 1)\n    if count != 1:\n        raise SystemExit(f"{label}: expected one match, found {count}")\n    return text.replace(old, new, 1)'
              if normalized.count(strict) != 1:
                  raise RuntimeError('materializer replace_once definition changed unexpectedly')
              normalized = normalized.replace(strict, compatible, 1)
              replacement_sensitive = (
                  '    source = subprocess.check_output(\n'
                  '        ["/usr/bin/git", "show", f"{source_sha}:{relative_path}"],\n'
                  '        cwd=root,\n'
                  '        stderr=subprocess.DEVNULL,\n'
                  '    )'
              )
              replacement_blind = (
                  '    git_environment = {\n'
                  '        "GIT_NO_REPLACE_OBJECTS": "1",\n'
                  '        "GIT_CONFIG_NOSYSTEM": "1",\n'
                  '        "GIT_CONFIG_GLOBAL": "/dev/null",\n'
                  '        "LANG": "C",\n'
                  '        "LC_ALL": "C",\n'
                  '    }\n'
                  '    source = subprocess.check_output(\n'
                  '        ["/usr/bin/git", "show", f"{source_sha}:{relative_path}"],\n'
                  '        cwd=root,\n'
                  '        env=git_environment,\n'
                  '        stderr=subprocess.DEVNULL,\n'
                  '    )'
              )
              if normalized.count(replacement_sensitive) != 1:
                  raise RuntimeError('accepted-source Git execution authority changed unexpectedly')
              normalized = normalized.replace(replacement_sensitive, replacement_blind, 1)
              exec(compile(normalized, '<capture-authority-chain-materializer>', 'exec'), {})
          except BaseException:
              Path('capture-authority-materializer-error.txt').write_text(traceback.format_exc(), encoding='utf-8')
              raise
          PY
      - name: Syntax-check bootstrap
        run: bash -n Scripts/bootstrap_capture_tuya_sdk.sh
      - name: Syntax-check field installer
        run: bash -n scripts/field/install_one_time_capture.command
      - name: Compile build guard
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py 2>capture-build-guard-compile-error.txt; then
            cat capture-build-guard-compile-error.txt >&2
            exit 1
          fi
          rm -f capture-build-guard-compile-error.txt
      - name: Compile downstream red-team
        run: python3 -m py_compile scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py
      - name: Compile private-review commitment tests
        run: python3 -m py_compile scripts/ci/tests/test_capture_private_review_commitment.py
      - name: Compile CocoaPods subject tests
        run: python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
      - name: Compile helper custody tests
        run: python3 -m py_compile scripts/ci/tests/test_capture_private_review_helper_execution_custody.py
      - name: Prove replacement-blind field helper behavior
        run: python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_git_replace_custody
      - name: Validate materialized diff
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'ERROR: authority materializer produced no production/test diff' >&2
            exit 1
          fi
          git diff --stat
      - name: Upload exact failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-authority-materializer-error
          path: |
            capture-authority-materializer-error.txt
            capture-build-guard-compile-error.txt
            Scripts/capture_tuya_private_input_build_guard.py
          if-no-files-found: error
          retention-days: 1
