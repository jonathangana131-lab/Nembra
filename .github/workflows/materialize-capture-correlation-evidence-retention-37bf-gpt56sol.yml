name: Materialize Capture Correlation Evidence Retention 37bf

on:
  push:
    branches:
      - repair/v14-capture-correlation-evidence-retention-37bf-gpt56sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-correlation-evidence-retention-37bf-gpt56sol
          fetch-depth: 0
          persist-credentials: true

      - name: Reanchor validated donor onto exact current product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=37bf3bf6502c470f69915c5e1e5f81721e846ae4
          DONOR_BASE=ba3a1eeae36caca6dd84beaabd0f15f4f0b57925
          DONOR_HEAD=be3a0f6719ecba5dbfcb84800533a35e22d8317a
          WORKFLOW=.github/workflows/materialize-capture-correlation-evidence-retention-37bf-gpt56sol.yml
          APP=NembraApp/App/NembraCaptureEntrypoint.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundCorrelationEvidenceRetentionSourceTests.swift
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git diff --name-only "$PRODUCT" HEAD)" = "$WORKFLOW"
          git fetch --no-tags origin "$DONOR_BASE" "$DONOR_HEAD"
          git diff --binary "$DONOR_BASE" "$DONOR_HEAD" -- "$APP" "$TEST" > /tmp/correlation-retention.patch
          test -s /tmp/correlation-retention.patch
          git apply --3way /tmp/correlation-retention.patch

      - name: Verify current-lineage truth contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          view = s[s.index('func abandonCorrelationForViewExit()'):s.index('func appDidLoseForeground()')]
          fg = s[s.index('func appDidLoseForeground()'):s.index('var privateConfig: Bool')]
          for block, event in ((view, 'target_correlation_abandoned_on_view_exit'), (fg, 'foreground_integrity_lost_after_target_correlation')):
              start = block.index('if phase == .correlated || phase == .selected')
              tail = block.index('return', start)
              completed = block[start:tail]
              for token in ('pendingCorrelatedTargetID = nil', 'selectedID = nil', 'targetCorrelationOperatorConfirmed = false', event):
                  assert token in completed, token
              for forbidden in ('resetDiscoverySessionOnly()', 'correlationProvenance = nil', 'targetCorrelationMethod = nil', 'targetCorrelationWindowCount = nil', 'candidates.removeAll()'):
                  assert forbidden not in completed, forbidden
          begin = s[s.index('private func beginCorrelationSeries()'):s.index('func startNextCorrelationWindow()')]
          assert 'resetDiscoverySessionOnly()' in begin
          assert 'guard phase != .accepted else { return }' in fg
          receiver = s[s.index('private func receivedApplicationUpdate('):s.index('private func startWatchdog')]
          assert 'let custodySafeUpdate = redactedApplicationEventDetails(update, accountUID: leasedAccountUID)' in receiver
          assert receiver.index('let custodySafeUpdate =') < receiver.index('try await sessionLedger.recordApplicationUpdate')
          assert 'while redacted[custodyKey] != nil' in receiver
          assert 'eventDetails["generation"] = String(token.diagnosticGeneration)' in receiver
          print('Current-lineage Capture evidence + event custody contract: PASS')
          PY
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundCorrelationEvidenceRetentionSourceTests.swift
          git diff --check

      - name: Collapse into clean exact-current donor
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=37bf3bf6502c470f69915c5e1e5f81721e846ae4
          WORKFLOW=.github/workflows/materialize-capture-correlation-evidence-retention-37bf-gpt56sol.yml
          APP=NembraApp/App/NembraCaptureEntrypoint.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundCorrelationEvidenceRetentionSourceTests.swift
          git rm "$WORKFLOW"
          git add "$APP" "$TEST"
          git diff --cached --check
          git -c user.name='nembra-gpt56-sol' -c user.email='actions@users.noreply.github.com' commit -m 'fix(capture): preserve completed correlation evidence on current product'
          mapfile -t changed < <(git diff --name-only "$PRODUCT" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = "$APP"
          test "${changed[1]}" = "$TEST"
          git diff --check "$PRODUCT" HEAD
          git push origin HEAD:repair/v14-capture-correlation-evidence-retention-37bf-gpt56sol