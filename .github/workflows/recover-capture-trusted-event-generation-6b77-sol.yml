name: Recover Capture trusted event generation 6b77

on:
  push:
    branches:
      - repair/v14-capture-trusted-event-generation-6b77-sol

permissions:
  contents: write

jobs:
  repair-event-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Bind exact current product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=6b778f2104af34dbe5b80da31ddb3ca422f9667c
          WORKFLOW=.github/workflows/recover-capture-trusted-event-generation-6b77-sol.yml
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git merge-base --is-ancestor "$PRODUCT" HEAD
          actual="$(git diff --name-only "$PRODUCT" HEAD | sort)"
          expected="$(printf '%s\n%s\n' "$TEST" "$WORKFLOW" | sort)"
          test "$actual" = "$expected"

      - name: Give trusted generation collision precedence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          start = source.index("    private func receivedApplicationUpdate(")
          end = source.index("    private func startWatchdog", start)
          receiver = source[start:end]
          old = ") { current, _ in current })"
          new = ") { _, trusted in trusted })"
          if receiver.count(old) != 1:
              raise SystemExit(f"expected one untrusted collision policy, found {receiver.count(old)}")
          receiver = receiver.replace(old, new, 1)
          source = source[:start] + receiver + source[end:]
          path.write_text(source)
          if old in receiver or new not in receiver:
              raise SystemExit("trusted generation precedence not established")
          if '"generation": String(token.diagnosticGeneration)' not in receiver:
              raise SystemExit("trusted generation metadata disappeared")
          for forbidden in ("publishDps", "queryDps", "writeValue", "disconnectBLE"):
              if forbidden in receiver: raise SystemExit(f"forbidden authority path: {forbidden}")
          PY
          git diff --check
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift

      - name: Commit exact repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=6b778f2104af34dbe5b80da31ddb3ca422f9667c
          WORKFLOW=.github/workflows/recover-capture-trusted-event-generation-6b77-sol.yml
          APP=NembraApp/App/NembraCaptureEntrypoint.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          rm "$WORKFLOW"
          actual="$(git diff --name-only "$PRODUCT" | sort)"
          expected="$(printf '%s\n%s\n' "$APP" "$TEST" | sort)"
          test "$actual" = "$expected"
          git diff --check
          git add "$APP" "$WORKFLOW"
          git config user.name "nembra-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): protect application event generation provenance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
