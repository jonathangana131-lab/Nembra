name: Capture Current Accepted Root Filesec FD Remove Probe

on:
  push:
    branches:
      - diagnostic/v17-capture-darwin-filesec-fd-acl-remove-sol
    paths:
      - .github/workflows/capture-current-accepted-root-filesec-fd-remove-probe.yml
  pull_request:
    paths:
      - .github/workflows/capture-current-accepted-root-filesec-fd-remove-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesec-fd-remove-oracle:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact parent and one-file diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='b87d375e5ae419fd5569c2cd63a6b42fc45174b0'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          changed="$(git diff --name-only "$expected_parent" HEAD)"
          test "$changed" = '.github/workflows/capture-current-accepted-root-filesec-fd-remove-probe.yml'
          printf 'NEMBRA_FILESEC_FD_REMOVE_SCOPE exactParent=%s oneFile=true validationOnly=true\n' "$expected_parent"

      - name: Prove descriptor-safe removal of an originally absent ACL
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          field_user="$(/usr/bin/id -un)"
          work="$(mktemp -d "$RUNNER_TEMP/nembra-filesec-fd-remove.XXXXXX")"
          root="$(mktemp -d /private/tmp/nembra-filesec-fd-remove.XXXXXX)"
          trap 'rm -rf "$work" "$root"' EXIT

          cat > "$work/filesec_fd_remove.c" <<'C'
          #include <sys/types.h>
          #include <sys/acl.h>
          #include <sys/fcntl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static void die_errno(const char *label) {
              fprintf(stderr, "%s: %s\n", label, strerror(errno));
              exit(2);
          }

          static void die_text(const char *label) {
              fprintf(stderr, "%s\n", label);
              exit(3);
          }

          static void require_identity(int fd, const char *path, const char *label) {
              struct stat fs;
              struct stat ps;
              if (fstat(fd, &fs) != 0) die_errno("fstat");
              if (lstat(path, &ps) != 0) die_errno("lstat");
              if (fs.st_dev != ps.st_dev || fs.st_ino != ps.st_ino ||
                  (fs.st_mode & S_IFMT) != (ps.st_mode & S_IFMT)) {
                  fprintf(stderr, "%s fd=(%llu,%llu,%o) path=(%llu,%llu,%o)\n",
                          label,
                          (unsigned long long)fs.st_dev,
                          (unsigned long long)fs.st_ino,
                          fs.st_mode & S_IFMT,
                          (unsigned long long)ps.st_dev,
                          (unsigned long long)ps.st_ino,
                          ps.st_mode & S_IFMT);
                  exit(4);
              }
          }

          static void run_chmod(const char *op, const char *value, const char *path) {
              pid_t child = fork();
              if (child < 0) die_errno("fork");
              if (child == 0) {
                  if (value != NULL) {
                      execl("/bin/chmod", "/bin/chmod", op, value, path, (char *)NULL);
                  } else {
                      execl("/bin/chmod", "/bin/chmod", op, path, (char *)NULL);
                  }
                  _exit(127);
              }
              int status = 0;
              if (waitpid(child, &status, 0) < 0) die_errno("waitpid");
              if (!WIFEXITED(status) || WEXITSTATUS(status) != 0) {
                  fprintf(stderr, "chmod %s failed status=%d path=%s\n", op, status, path);
                  exit(5);
              }
          }

          static int acl_has_entry(acl_t acl) {
              if (acl == NULL) return 0;
              acl_entry_t entry = NULL;
              errno = 0;
              int result = acl_get_entry(acl, ACL_FIRST_ENTRY, &entry);
              if (result == 0) return 1;
              if (result == -1 && errno == EINVAL) return 0;
              die_errno("acl_get_entry");
              return 0;
          }

          static int path_has_acl_entry(const char *path) {
              errno = 0;
              acl_t acl = acl_get_file(path, ACL_TYPE_EXTENDED);
              if (acl == NULL) {
                  if (errno == 0 || errno == ENOENT || errno == ENOATTR) return 0;
                  die_errno("acl_get_file path");
              }
              int present = acl_has_entry(acl);
              if (acl_free(acl) != 0) die_errno("acl_free path");
              return present;
          }

          static int fd_has_acl_entry(int fd) {
              errno = 0;
              acl_t acl = acl_get_fd_np(fd, ACL_TYPE_EXTENDED);
              if (acl == NULL) {
                  if (errno == 0 || errno == ENOENT || errno == ENOATTR) return 0;
                  die_errno("acl_get_fd_np");
              }
              int present = acl_has_entry(acl);
              if (acl_free(acl) != 0) die_errno("acl_free fd");
              return present;
          }

          static void remove_acl_on_held_fd(int fd) {
              filesec_t fsec = filesec_init();
              if (fsec == NULL) die_errno("filesec_init");
              if (filesec_set_property(fsec, FILESEC_ACL, _FILESEC_REMOVE_ACL) != 0) {
                  die_errno("filesec_set_property FILESEC_ACL remove");
              }
              if (fchmodx_np(fd, fsec) != 0) die_errno("fchmodx_np remove ACL");
              filesec_free(fsec);
          }

          int main(int argc, char **argv) {
              if (argc != 3) {
                  fprintf(stderr, "usage: %s ROOT FIELD_USER\n", argv[0]);
                  return 64;
              }

              const char *root = argv[1];
              const char *principal = argv[2];
              char accepted[1024];
              char moved[1024];
              if (snprintf(accepted, sizeof(accepted), "%s/accepted", root) >= (int)sizeof(accepted) ||
                  snprintf(moved, sizeof(moved), "%s/original-moved", root) >= (int)sizeof(moved)) {
                  die_text("path buffer exhausted");
              }

              if (mkdir(accepted, 0700) != 0) die_errno("mkdir accepted");
              run_chmod("-N", NULL, accepted);
              if (path_has_acl_entry(accepted)) die_text("synthetic baseline was not ACL-absent");

              int fd = open(accepted, O_RDONLY | O_DIRECTORY);
              if (fd < 0) die_errno("open accepted");
              require_identity(fd, accepted, "pre-grant identity mismatch");

              char grant[1024];
              if (snprintf(grant, sizeof(grant),
                           "user:%s allow list,search,readattr,readextattr,readsecurity",
                           principal) >= (int)sizeof(grant)) {
                  die_text("grant buffer exhausted");
              }
              run_chmod("+a", grant, accepted);
              require_identity(fd, accepted, "post-grant identity mismatch");
              if (!path_has_acl_entry(accepted)) die_text("canonical pathname did not observe grant");

              int fd_grant_visible = fd_has_acl_entry(fd);

              if (rename(accepted, moved) != 0) die_errno("rename original accepted root");
              if (mkdir(accepted, 0700) != 0) die_errno("mkdir attacker replacement");
              run_chmod("-N", NULL, accepted);
              require_identity(fd, moved, "moved original identity mismatch");
              if (path_has_acl_entry(accepted)) die_text("attacker replacement unexpectedly had ACL");

              remove_acl_on_held_fd(fd);
              require_identity(fd, moved, "post-remove original identity mismatch");

              if (path_has_acl_entry(moved)) die_text("moved original ACL was not removed");
              if (fd_has_acl_entry(fd)) die_text("held fd still exposes ACL after filesec removal");
              if (path_has_acl_entry(accepted)) die_text("attacker replacement ACL changed");

              printf("NEMBRA_FILESEC_FD_REMOVE_ORACLE exactOriginalObject=true canonicalGrantVisible=true heldFdGrantVisible=%s absentBaselineRestored=true replacementUntouched=true deleteFdNpUsed=false fchmodxDescriptorRemove=true physicalAuthorityCreated=false\n",
                     fd_grant_visible ? "true" : "false");

              if (close(fd) != 0) die_errno("close fd");
              if (rmdir(accepted) != 0) die_errno("rmdir replacement");
              if (rmdir(moved) != 0) die_errno("rmdir moved");
              return 0;
          }
          C

          /usr/bin/clang -Wall -Wextra -Werror "$work/filesec_fd_remove.c" -o "$work/filesec_fd_remove"
          /usr/bin/sudo -n "$work/filesec_fd_remove" "$root" "$field_user"

      - name: Preserve diagnostic-only truth boundary
        if: always()
        shell: bash
        run: echo 'NEMBRA_FILESEC_FD_REMOVE validationOnly=true productionLeaseChanged=false installAuthorized=false bluetoothAuthorized=false physicalAuthorityCreated=false'