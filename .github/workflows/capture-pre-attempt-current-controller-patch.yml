name: Capture pre-attempt current-controller patch

on:
  push:
    branches:
      - agent/es80-horizon-pre-attempt-current-554-v14
    paths:
      - .github/workflows/capture-pre-attempt-current-controller-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/es80-horizon-pre-attempt-current-554-v14
          fetch-depth: 2

      - name: Verify exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "df718a0eba38b67e49f308783c2db37ee11a6edb"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-pre-attempt-current-controller-patch.yml"

      - name: Apply exact fail-closed controller consumption
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          controller = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          source = controller.read_text()
          old = "\n".join([
              "        do {",
              "            await flushPendingEvents(through: horizonAdmission.queueCutoff)",
              "            try ensureCaptureHealthy()",
              "            try validateBoundaryAuthority(horizonAdmission.authority)",
              "",
              "            let horizonMutationOutcome = try await horizonAdmission",
              "                .recordBoundaryWithMutationOutcome(on: recorder)",
          ])
          new = "\n".join([
              "        do {",
              "            // H allocation has already moved the queue gate into its exact draining",
              "            // transaction. If FIFO drain, foreground health, or authority validation",
              "            // fails before the first recorder attempt, consume the producer-owned",
              "            // unused-admission permit and quarantine that exact zero-mutation H.",
              "            // This is distinct from mutation-point authority rejection below.",
              "            do {",
              "                await flushPendingEvents(through: horizonAdmission.queueCutoff)",
              "                try ensureCaptureHealthy()",
              "                try validateBoundaryAuthority(horizonAdmission.authority)",
              "            } catch {",
              "                let preAttemptFailure = error",
              "                do {",
              "                    let abandonment = try horizonAdmission.abandonBeforeRecorderAttempt()",
              "                    try observationBoundaryQueueGate.abortHorizonBeforeRecorderAttempt(",
              "                        after: abandonment",
              "                    )",
              "                } catch {",
              "                    // Failure to prove/quarantine the exact unused H is stronger than",
              "                    // the triggering health/authority error. Keep capture fail-closed.",
              "                    throw error",
              "                }",
              "                throw preAttemptFailure",
              "            }",
              "",
              "            let horizonMutationOutcome = try await horizonAdmission",
              "                .recordBoundaryWithMutationOutcome(on: recorder)",
          ])
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one controller patch site, found {source.count(old)}")
          controller.write_text(source.replace(old, new))

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerPreAttemptHorizonRecoveryTests.swift")
          if test_path.exists():
              raise SystemExit(f"refusing to overwrite existing {test_path}")
          test_path.write_text('''import Foundation
          import Testing

          @Suite("Foreground CoreBluetooth pre-attempt Horizon recovery")
          struct ForegroundCoreBluetoothCaptureControllerPreAttemptHorizonRecoveryTests {
              private static func controllerSource() throws -> String {
                  let testFile = URL(fileURLWithPath: #filePath)
                  let packageRoot = testFile
                      .deletingLastPathComponent() // NembraBluetoothCaptureTests
                      .deletingLastPathComponent() // Tests
                      .deletingLastPathComponent() // package root
                  return try String(
                      contentsOf: packageRoot
                          .appendingPathComponent("Sources")
                          .appendingPathComponent("NembraBluetoothCapture")
                          .appendingPathComponent("ForegroundCoreBluetoothCaptureController.swift"),
                      encoding: .utf8
                  )
              }

              @Test("allocated H quarantines before the first recorder attempt when pre-attempt validation fails")
              func controllerConsumesExactUnusedAdmissionBeforeRecorderAttempt() throws {
                  let source = try Self.controllerSource()
                  let horizon = try #require(source.range(of: "let horizonAdmission = try durationPermit.beginHorizon("))
                  let flush = try #require(source.range(
                      of: "await flushPendingEvents(through: horizonAdmission.queueCutoff)",
                      range: horizon.lowerBound..<source.endIndex
                  ))
                  let failure = try #require(source.range(
                      of: "let preAttemptFailure = error",
                      range: flush.lowerBound..<source.endIndex
                  ))
                  let abandonment = try #require(source.range(
                      of: "let abandonment = try horizonAdmission.abandonBeforeRecorderAttempt()",
                      range: failure.lowerBound..<source.endIndex
                  ))
                  let quarantine = try #require(source.range(
                      of: "try observationBoundaryQueueGate.abortHorizonBeforeRecorderAttempt(",
                      range: abandonment.lowerBound..<source.endIndex
                  ))
                  let recorderAttempt = try #require(source.range(
                      of: ".recordBoundaryWithMutationOutcome(on: recorder)",
                      range: quarantine.lowerBound..<source.endIndex
                  ))

                  #expect(horizon.lowerBound < flush.lowerBound)
                  #expect(flush.lowerBound < failure.lowerBound)
                  #expect(failure.lowerBound < abandonment.lowerBound)
                  #expect(abandonment.lowerBound < quarantine.lowerBound)
                  #expect(quarantine.lowerBound < recorderAttempt.lowerBound)
              }

              @Test("pre-attempt abandonment stays distinct from mutation-point rejection")
              func controllerPreservesDistinctZeroMutationOrigins() throws {
                  let source = try Self.controllerSource()

                  #expect(source.components(separatedBy: "abandonBeforeRecorderAttempt()").count - 1 == 1)
                  #expect(source.components(separatedBy: "abortHorizonBeforeRecorderAttempt(").count - 1 == 1)
                  #expect(source.contains("case let .rejectedBeforeMutation(rejection):"))
                  #expect(source.contains("abortUncommittedHorizon(after: rejection)"))
              }
          }
          ''')

          Path(".github/workflows/capture-pre-attempt-current-controller-patch.yml").unlink()
          PY

          git diff --check
          test "$(grep -c 'abandonBeforeRecorderAttempt()' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift)" = "1"
          test "$(grep -c 'abortHorizonBeforeRecorderAttempt(' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift)" = "1"
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerPreAttemptHorizonRecoveryTests.swift

      - name: Commit exact product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-gpt56"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: consume pre-attempt Horizon abandonment in controller"
          git push origin HEAD:agent/es80-horizon-pre-attempt-current-554-v14
