name: Temporary ES80 Horizon Ready Accessibility XXXL evidence

on:
  push:
    branches:
      - test/es80-v14-horizon-xxxl-visual-evidence/gpt56-thinking

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact staged-test checkpoint
        run: test "$(git rev-parse HEAD^)" = "c2b596f2e825acc69b69dfe87b0080fd94a74270"

      - name: Insert staged Horizon Ready Accessibility XXXL gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path("NembraUITests/ES80ResearchCaptureUITests.swift")
          staged = Path(".github/tmp/es80-horizon-xxxl-test.swiftpart")
          source = target.read_text(encoding="utf-8")
          test = staged.read_text(encoding="utf-8")
          function_name = "func testV14SimulatorQAHorizonReadyLandscapeKeepsFinishAndTruthVisible()"
          function_index = source.index(function_name)
          insertion_index = source.rfind("    @MainActor", 0, function_index)
          if insertion_index < 0:
              raise SystemExit("Horizon Ready landscape @MainActor boundary missing")
          if "testV14SimulatorQAHorizonReadyRemainsActionableAtAccessibilityExtraExtraExtraLarge" in source:
              raise SystemExit("Horizon Ready Accessibility XXXL gate already exists")
          target.write_text(source[:insertion_index] + test + source[insertion_index:], encoding="utf-8")
          PY

      - name: Verify exact UI-test scope and contract
        run: |
          git diff --check
          test "$(git diff --name-only)" = "NembraUITests/ES80ResearchCaptureUITests.swift"
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraUITests/ES80ResearchCaptureUITests.swift").read_text()
          start = source.index("func testV14SimulatorQAHorizonReadyRemainsActionableAtAccessibilityExtraExtraExtraLarge()")
          end = source.index("func testV14SimulatorQAHorizonReadyLandscapeKeepsFinishAndTruthVisible()", start)
          block = source[start:end]
          for token in [
              "--es80-capture-qa-scenario=observationHorizonReady",
              "UICTContentSizeCategoryAccessibilityExtraExtraExtraLarge",
              "es80.capture-shell",
              "es80.capture.simulator-qa",
              "es80.capture.experiment-progress",
              "Capture health.",
              "Capture can be sealed",
              "es80.capture.finish",
              "Accessibility XXXL",
          ]:
              assert token in block, token
          assert block.count("assertVisibleInScreenshotViewport(") >= 5
          assert block.count("bringIntoScreenshotViewport(") >= 5
          PY

      - name: Commit visual gate and self-delete temporary transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-horizon-xxxl-visual-evidence.yml .github/tmp/es80-horizon-xxxl-test.swiftpart
          git add NembraUITests/ES80ResearchCaptureUITests.swift
          git commit -m "Capture visual QA: retain Horizon Ready at Accessibility XXXL"
          git push origin HEAD:test/es80-v14-horizon-xxxl-visual-evidence/gpt56-thinking
