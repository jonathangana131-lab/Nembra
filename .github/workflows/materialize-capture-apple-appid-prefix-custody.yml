name: Materialize Capture Prefix-Safe Apple App ID Custody

on:
  push:
    branches:
      - fix/v14-capture-apple-appid-prefix-custody-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-apple-appid-prefix-custody-sol
          fetch-depth: 0

      - name: Guard exact flawed product parent and scope
        shell: bash
        run: |
          set -euo pipefail
          parent='1b12dc56ec20a7dad30760b57a81106644ffc263'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift
          grep -Fq 'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"' scripts/field/install_one_time_capture.command

      - name: Apply prefix-safe identity repair
        run: python3 scripts/ci/materialize_capture_apple_appid_prefix_custody.py

      - name: Verify installer and source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          installer = Path('scripts/field/install_one_time_capture.command').read_text(encoding='utf-8')
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift').read_text(encoding='utf-8')
          assert 'EXPECTED_APPLICATION_IDENTIFIER="${TEAM_ID}.${BUNDLE_ID}"' not in installer
          required = (
              'APP_ID_SUFFIX=".${BUNDLE_ID}"',
              '[[ "$BUILT_APPLICATION_IDENTIFIER" == *"$APP_ID_SUFFIX" ]]',
              '[[ "$BUILT_APPLICATION_IDENTIFIER" != *"*"* ]]',
              'BUILT_APP_ID_PREFIX="${BUILT_APPLICATION_IDENTIFIER%$APP_ID_SUFFIX}"',
              '[[ "$BUILT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_APPLICATION_IDENTIFIER" == "$BUILT_APPLICATION_IDENTIFIER" ]]',
              '[[ "$PROFILE_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              '[[ "$PROFILE_ROOT_TEAM_IDENTIFIER" == "$TEAM_ID" ]]',
              'com.apple.developer.applesignin',
              'application-identifier',
              'com.apple.developer.team-identifier',
              'TeamIdentifier',
          )
          for needle in required:
              assert needle in installer, needle
          install = installer.index('say "Installing SDK-integrated Capture on the intended iPhone"')
          for needle in required[1:8]:
              assert installer.index(needle) < install, needle
          assert 'preserves App ID prefix while proving exact bundle and selected team' in test
          assert 'profile identity is matched to signed app rather than synthesized from Team ID' in test
          print('prefix-safe Apple App ID source contract: PASS')
          PY

      - name: Publish clean two-path product repair
        shell: bash
        run: |
          set -euo pipefail
          parent='1b12dc56ec20a7dad30760b57a81106644ffc263'
          rm .github/workflows/materialize-capture-apple-appid-prefix-custody.yml
          rm scripts/ci/materialize_capture_apple_appid_prefix_custody.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): preserve Apple App ID prefix custody"
          test "$(git diff --name-only "$parent" HEAD | sort)" = "$(printf '%s\n' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift' 'scripts/field/install_one_time_capture.command' | sort)"
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-apple-appid-prefix-custody-sol
