name: Materialize Capture Account UID Custody 648C

on:
  push:
    branches:
      - sol/v14-capture-account-uid-custody-648c-r1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact convergence parent
        shell: bash
        run: |
          set -euo pipefail
          BASE=648c39f52b8c8155c58f665520f002b895e22663
          test "$(git rev-parse HEAD^)" = "$BASE"
          mapfile -t paths < <(git diff --name-only "$BASE"...HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = ".github/workflows/materialize-capture-account-uid-custody-648c.yml"

      - name: Apply account UID event-custody repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          app = app_path.read_text()

          helper_anchor = '''    private func receivedApplicationUpdate(
              _ update: [String: String],
              token: TuyaReadOnlyConnectionToken
          ) async {'''
          if app.count(helper_anchor) != 1:
              raise SystemExit(f"expected one application-update receiver, found {app.count(helper_anchor)}")
          if "redactedApplicationUpdateForExport" in app:
              raise SystemExit("account UID export scrubber already exists; refresh live product instead of replaying")

          helper = '''    private func redactedApplicationUpdateForExport(_ update: [String: String]) -> [String: String] {
              // The same-account lease is the identity authority already admitted by the caller.
              // Scrub that opaque account identifier from both keys and values before immutable
              // event custody without treating generic UID-named device fields as secrets.
              guard let leasedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),
                    !leasedAccountUID.isEmpty else {
                  return update
              }

              let marker = "<redacted-account-uid>"
              var redacted: [String: String] = [:]
              for originalKey in update.keys.sorted() {
                  guard let originalValue = update[originalKey] else { continue }
                  let redactedBaseKey = originalKey.replacingOccurrences(of: leasedAccountUID, with: marker)
                  var redactedKey = redactedBaseKey
                  var collisionSuffix = 2
                  while redacted[redactedKey] != nil {
                      redactedKey = "\\(redactedBaseKey)#\\(collisionSuffix)"
                      collisionSuffix += 1
                  }
                  redacted[redactedKey] = originalValue.replacingOccurrences(of: leasedAccountUID, with: marker)
              }
              return redacted
          }

'''
          app = app.replace(helper_anchor, helper + helper_anchor, 1)

          admission_anchor = '''        guard driver.isLocallyConnected(uuid: tuyaUUID) else {
              await recordObservedTransportLoss(token: token)
              return
          }

          applicationUpdateAdmissionsInFlight += 1'''
          admission_replacement = '''        guard driver.isLocallyConnected(uuid: tuyaUUID) else {
              await recordObservedTransportLoss(token: token)
              return
          }

          let exportSafeUpdate = redactedApplicationUpdateForExport(update)
          applicationUpdateAdmissionsInFlight += 1'''
          if app.count(admission_anchor) != 1:
              raise SystemExit(f"expected one post-authority update admission anchor, found {app.count(admission_anchor)}")
          app = app.replace(admission_anchor, admission_replacement, 1)

          log_anchor = '''            log("tuya_application_update", update.merging([
                  "generation": String(token.diagnosticGeneration)
              ]) { _, trusted in trusted })'''
          log_replacement = '''            log("tuya_application_update", exportSafeUpdate.merging([
                  "generation": String(token.diagnosticGeneration)
              ]) { _, trusted in trusted })'''
          if app.count(log_anchor) != 1:
              raise SystemExit(f"expected one trusted-generation application log anchor, found {app.count(log_anchor)}")
          app = app.replace(log_anchor, log_replacement, 1)
          app_path.write_text(app)

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift")
          if test_path.exists():
              raise SystemExit("account UID custody test already exists; refresh instead of overwriting")
          test_path.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application account-UID export custody")
          struct TuyaApplicationAccountUIDExportCustodySourceTests {
              @Test("accepted application evidence scrubs the verified account UID before event custody")
              func applicationEvidenceCannotExportVerifiedAccountUID() throws {
                  let source = try entrypointSource()
                  let helper = String(try section(
                      in: source,
                      from: "private func redactedApplicationUpdateForExport(",
                      to: "private func receivedApplicationUpdate("
                  ))
                  let receiver = String(try section(
                      in: source,
                      from: "private func receivedApplicationUpdate(",
                      to: "private func startWatchdog"
                  ))
                  let prepareExport = String(try section(
                      in: source,
                      from: "func prepareExport()",
                      to: "private func abandonPackageCorrelation()"
                  ))

                  #expect(prepareExport.contains("No account UID"))
                  #expect(source.contains("<redacted-account-uid>"))
                  #expect(helper.contains("membershipAccountUID?.trimmingCharacters"))
                  #expect(helper.contains("originalValue.replacingOccurrences(of: leasedAccountUID"))
                  #expect(receiver.contains("let exportSafeUpdate = redactedApplicationUpdateForExport(update)"))
                  #expect(receiver.contains("log(\"tuya_application_update\", exportSafeUpdate.merging(["))
                  #expect(!receiver.contains("log(\"tuya_application_update\", update.merging(["))
                  #expect(receiver.contains("]) { _, trusted in trusted })"))
              }

              @Test("malformed account-UID-bearing keys are scrubbed without blanket UID-key deletion")
              func accountUIDBearingKeysCannotEscape() throws {
                  let source = try entrypointSource()
                  let helper = String(try section(
                      in: source,
                      from: "private func redactedApplicationUpdateForExport(",
                      to: "private func receivedApplicationUpdate("
                  ))
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))

                  #expect(helper.contains("originalKey.replacingOccurrences(of: leasedAccountUID"))
                  #expect(helper.contains("while redacted[redactedKey] != nil"))
                  #expect(!driver.contains("\"uid\","))
                  #expect(!driver.contains("\"uid\"\n"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start),
                        let b = source.range(of: end, range: a.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw ContractError.missing
                  }
                  return source[a.lowerBound..<b.lowerBound]
              }

              private func entrypointSource() throws -> String {
                  var root = URL(fileURLWithPath: #filePath)
                  for _ in 0..<5 { root.deleteLastPathComponent() }
                  return try String(contentsOf: root.appendingPathComponent("NembraApp/App/NembraCaptureEntrypoint.swift"), encoding: .utf8)
              }

              private enum ContractError: Error { case missing }
          }
          ''')
          PY

      - name: Verify focused truth contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          helper = app.split("private func redactedApplicationUpdateForExport(", 1)[1].split("private func receivedApplicationUpdate(", 1)[0]
          receiver = app.split("private func receivedApplicationUpdate(", 1)[1].split("private func startWatchdog", 1)[0]
          assert 'membershipAccountUID?.trimmingCharacters' in helper
          assert '<redacted-account-uid>' in helper
          assert 'originalKey.replacingOccurrences(of: leasedAccountUID' in helper
          assert 'originalValue.replacingOccurrences(of: leasedAccountUID' in helper
          assert 'let exportSafeUpdate = redactedApplicationUpdateForExport(update)' in receiver
          assert 'log("tuya_application_update", exportSafeUpdate.merging([' in receiver
          assert 'log("tuya_application_update", update.merging([' not in receiver
          assert ']) { _, trusted in trusted })' in receiver
          PY
          git diff --check

      - name: Run focused package source tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaApplicationAccountUIDExportCustodySourceTests
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaApplicationEventMetadataPrecedenceSourceTests
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaSecureLinkViewMembershipStatusRevocationSourceTests
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaExportSecretClassifierConvergenceSourceTests

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          BASE=648c39f52b8c8155c58f665520f002b895e22663
          rm .github/workflows/materialize-capture-account-uid-custody-648c.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            .github/workflows/materialize-capture-account-uid-custody-648c.yml
          git diff --cached --check
          mapfile -t paths < <(git diff --cached --name-only "$BASE")
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = "NembraApp/App/NembraCaptureEntrypoint.swift"
          test "${paths[1]}" = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift"
          git config user.name "nembra-sol-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): redact verified account uid before event custody"
          git push origin HEAD:sol/v14-capture-account-uid-custody-648c-r1
