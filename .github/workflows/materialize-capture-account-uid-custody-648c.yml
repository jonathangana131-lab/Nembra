name: Materialize Capture Account UID Custody 648C

on:
  push:
    branches:
      - sol/v14-capture-account-uid-custody-648c

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact stacked parent
        shell: bash
        run: |
          set -euo pipefail
          BASE=648c39f52b8c8155c58f665520f002b895e22663
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t paths < <(git diff --name-only "$BASE"...HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = ".github/workflows/materialize-capture-account-uid-custody-648c.yml"

      - name: Apply value-bound account UID custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          helper_marker = "    private func receivedApplicationUpdate(\n"
          if source.count(helper_marker) != 1:
              raise SystemExit(f"expected one application receiver marker, found {source.count(helper_marker)}")

          helper = r'''    private func exportSafeApplicationUpdate(
              _ update: [String: String]
          ) -> [String: String]? {
              guard accountIdentityLeaseIsAuthorized,
                    let verifiedAccountUID = membershipAccountUID,
                    !verifiedAccountUID.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
                  return nil
              }

              let redactionMarker = "<redacted-account-uid>"
              var sanitized: [String: String] = [:]
              for (key, value) in update {
                  let redactedKey = key.replacingOccurrences(of: verifiedAccountUID, with: redactionMarker)
                  let redactedValue = value.replacingOccurrences(of: verifiedAccountUID, with: redactionMarker)
                  guard sanitized[redactedKey] == nil else { return nil }
                  sanitized[redactedKey] = redactedValue
              }
              return sanitized
          }

'''
          source = source.replace(helper_marker, helper + helper_marker, 1)

          admission_marker = '''        applicationUpdateAdmissionsInFlight += 1
          defer { applicationUpdateAdmissionsInFlight -= 1 }
'''
          if source.count(admission_marker) != 1:
              raise SystemExit(f"expected one application admission marker, found {source.count(admission_marker)}")
          admission = '''        guard let exportSafeUpdate = exportSafeApplicationUpdate(update) else {
              await invalidateSourceAuthority(
                  token: token,
                  message: "Authenticated application evidence could not be sanitized against the verified account UID without ambiguity.",
                  kind: "application_account_uid_redaction_failed"
              )
              return
          }

'''
          source = source.replace(admission_marker, admission + admission_marker, 1)

          old_log = '''            log("tuya_application_update", update.merging([
              "generation": String(token.diagnosticGeneration)
          ]) { _, trusted in trusted })'''
          new_log = '''            log("tuya_application_update", exportSafeUpdate.merging([
              "generation": String(token.diagnosticGeneration)
          ]) { _, trusted in trusted })'''
          if source.count(old_log) != 1:
              raise SystemExit(f"expected one trusted-precedence application log, found {source.count(old_log)}")
          source = source.replace(old_log, new_log, 1)
          path.write_text(source)
          PY

          TEST_PATH=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          test ! -e "$TEST_PATH"
          git fetch --no-tags origin 8010d108a043fbe2ff03fa3bb0d1518aa7047c08
          git show 8010d108a043fbe2ff03fa3bb0d1518aa7047c08:"$TEST_PATH" > "$TEST_PATH"

      - name: Verify fail-closed custody contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          receiver = source.split("private func receivedApplicationUpdate(", 1)[1].split("private func startWatchdog", 1)[0]
          helper = source.split("private func exportSafeApplicationUpdate(", 1)[1].split("private func receivedApplicationUpdate(", 1)[0]
          assert '<redacted-account-uid>' in helper
          assert 'membershipAccountUID' in helper
          assert 'accountIdentityLeaseIsAuthorized' in helper
          assert 'key.replacingOccurrences(of: verifiedAccountUID' in helper
          assert 'value.replacingOccurrences(of: verifiedAccountUID' in helper
          assert 'guard sanitized[redactedKey] == nil else { return nil }' in helper
          assert 'guard let exportSafeUpdate = exportSafeApplicationUpdate(update)' in receiver
          assert receiver.index('guard let exportSafeUpdate') < receiver.index('recordApplicationUpdate')
          assert 'log("tuya_application_update", exportSafeUpdate.merging([' in receiver
          assert 'log("tuya_application_update", update.merging([' not in receiver
          assert ']) { _, trusted in trusted })' in receiver
          assert 'No account UID' in source

          driver = source.split('@MainActor\nprivate final class SmartLifeDriver', 1)[1].split('#endif\n\nprivate enum AppleAccountAuthorizationError', 1)[0]
          assert '"uid",' not in driver
          assert '"uid"\n' not in driver
          PY
          git diff --check

      - name: Publish clean two-path product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE=648c39f52b8c8155c58f665520f002b895e22663
          rm .github/workflows/materialize-capture-account-uid-custody-648c.yml
          git add -A
          mapfile -t paths < <(git diff --cached --name-only "$BASE")
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = "NembraApp/App/NembraCaptureEntrypoint.swift"
          test "${paths[1]}" = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift"
          git config user.name "nembra-sol"
          git config user.email "nembra-sol@users.noreply.github.com"
          git commit -m "fix(capture): scrub verified account UID before event custody"
          git push origin HEAD:sol/v14-capture-account-uid-custody-648c
