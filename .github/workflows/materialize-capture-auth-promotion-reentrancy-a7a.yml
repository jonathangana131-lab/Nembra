name: Materialize Capture Auth Promotion Reentrancy A7A

on:
  push:
    branches:
      - repair/v14-capture-auth-promotion-reentrancy-a7a-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product parent and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='a7a28ca6e744d4bad8be08fd3553a2af8c609b15'
          test "$(git rev-parse HEAD^)" = "$BASE"
          mapfile -t paths < <(git diff --name-only "$BASE"...HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = '.github/workflows/materialize-capture-auth-promotion-reentrancy-a7a.yml'

      - name: Apply post-await authority repair and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text(encoding='utf-8')
          old = '''                    try await sessionLedger.markAuthenticated(for: token, method: .smartLifeAppSDK)
                    await refreshLedgerSnapshot()
                    phase = .observing
                    message = "Authenticated generation \\(token.diagnosticGeneration) is live. Waiting for a genuine application update and the canonical 45-second horizon…"
                    log("sdk_local_ble_authenticated", [
                        "generation": String(token.diagnosticGeneration),
                        "localBLEOnline": "true"
                    ])
                    startWatchdog(token: token)
          '''
          new = '''                    try await sessionLedger.markAuthenticated(for: token, method: .smartLifeAppSDK)
                    await refreshLedgerSnapshot()

                    // Both actor hops above may interleave foreground/view/account retirement.
                    // Never resurrect app-visible observation state after another task has already
                    // revoked this exact generation or moved the controller out of authentication.
                    guard currentConnectionToken == token,
                          phase == .authenticating else {
                        log("stale_authentication_promotion_ignored", [
                            "generation": String(token.diagnosticGeneration),
                            "phase": phase.rawValue
                        ])
                        return
                    }
                    guard sdkAccountLoggedIn,
                          sdkDeviceMembershipVerified,
                          accountIdentityLeaseIsAuthorized else {
                        await invalidateSourceAuthority(
                            token: token,
                            message: "Tuya account/device source authority changed while authentication promotion was crossing the package actor boundary.",
                            kind: "sdk_source_authority_lost_during_auth_promotion"
                        )
                        return
                    }
                    guard driver.isLocallyConnected(uuid: tuyaUUID) else {
                        await recordObservedTransportLoss(token: token)
                        return
                    }

                    phase = .observing
                    message = "Authenticated generation \\(token.diagnosticGeneration) is live. Waiting for a genuine application update and the canonical 45-second horizon…"
                    log("sdk_local_ble_authenticated", [
                        "generation": String(token.diagnosticGeneration),
                        "localBLEOnline": "true"
                    ])
                    startWatchdog(token: token)
          '''
          if app.count(old) != 1:
              raise SystemExit(f'expected one authentication promotion block, found {app.count(old)}')
          app_path.write_text(app.replace(old, new, 1), encoding='utf-8')

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationPromotionReentrancySourceTests.swift')
          if test_path.exists():
              raise SystemExit('auth promotion reentrancy regression already exists; refresh live product instead of replaying')
          test_path.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya authentication promotion reentrancy")
          struct TuyaAuthenticationPromotionReentrancySourceTests {
              @Test("post-await auth promotion cannot resurrect a retired generation")
              func authenticatedPromotionRevalidatesAuthorityAfterActorHops() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let authenticated = String(try section(
                      in: source,
                      from: "private func authenticated(token: TuyaReadOnlyConnectionToken) async",
                      to: "private func authenticationFailed(token: TuyaReadOnlyConnectionToken) async"
                  ))

                  let promotion = try #require(authenticated.range(of: "try await sessionLedger.markAuthenticated(for: token, method: .smartLifeAppSDK)"))
                  let refresh = try #require(authenticated.range(
                      of: "await refreshLedgerSnapshot()",
                      range: promotion.upperBound..<authenticated.endIndex
                  ))
                  let observing = try #require(authenticated.range(
                      of: "phase = .observing",
                      range: refresh.upperBound..<authenticated.endIndex
                  ))
                  let postAwaitFence = String(authenticated[refresh.upperBound..<observing.lowerBound])

                  #expect(postAwaitFence.contains("currentConnectionToken == token"))
                  #expect(postAwaitFence.contains("phase == .authenticating"))
                  #expect(postAwaitFence.contains("sdkAccountLoggedIn"))
                  #expect(postAwaitFence.contains("sdkDeviceMembershipVerified"))
                  #expect(postAwaitFence.contains("accountIdentityLeaseIsAuthorized"))
                  #expect(postAwaitFence.contains("driver.isLocallyConnected(uuid: tuyaUUID)"))
                  #expect(postAwaitFence.contains("invalidateSourceAuthority("))
                  #expect(postAwaitFence.contains("recordObservedTransportLoss(token: token)"))
              }

              @Test("watchdog starts only after the post-await authority fence")
              func watchdogCannotStartForRetiredPromotion() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let authenticated = String(try section(
                      in: source,
                      from: "private func authenticated(token: TuyaReadOnlyConnectionToken) async",
                      to: "private func authenticationFailed(token: TuyaReadOnlyConnectionToken) async"
                  ))

                  let refresh = try #require(authenticated.range(of: "await refreshLedgerSnapshot()"))
                  let fence = try #require(authenticated.range(
                      of: "guard currentConnectionToken == token",
                      range: refresh.upperBound..<authenticated.endIndex
                  ))
                  let observing = try #require(authenticated.range(
                      of: "phase = .observing",
                      range: fence.upperBound..<authenticated.endIndex
                  ))
                  let watchdog = try #require(authenticated.range(
                      of: "startWatchdog(token: token)",
                      range: observing.upperBound..<authenticated.endIndex
                  ))

                  #expect(refresh.lowerBound < fence.lowerBound)
                  #expect(fence.lowerBound < observing.lowerBound)
                  #expect(observing.lowerBound < watchdog.lowerBound)
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start),
                        let b = source.range(of: end, range: a.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \\(start) ... \\(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[a.lowerBound..<b.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let root = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: root.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          ''', encoding='utf-8')
          PY

      - name: Validate focused source and package contracts
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationPromotionReentrancySourceTests.swift
          git diff --check
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaAuthenticationPromotionReentrancySourceTests
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaTransportSuccessAuthoritySourceTests
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors --filter TuyaCaptureForegroundCorrelationEvidenceRetentionSourceTests

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          BASE='a7a28ca6e744d4bad8be08fd3553a2af8c609b15'
          rm .github/workflows/materialize-capture-auth-promotion-reentrancy-a7a.yml
          git add -A
          git diff --cached --check
          mapfile -t paths < <(git diff --cached --name-only "$BASE")
          test "${#paths[@]}" -eq 2
          printf '%s\n' "${paths[@]}" | grep -Fxq 'NembraApp/App/NembraCaptureEntrypoint.swift'
          printf '%s\n' "${paths[@]}" | grep -Fxq 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationPromotionReentrancySourceTests.swift'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): fence auth promotion after actor suspension'
          git push origin HEAD:repair/v14-capture-auth-promotion-reentrancy-a7a-sol
