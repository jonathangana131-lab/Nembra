name: Temporary Capture async-invalidation recovery

on:
  push:
    branches:
      - cell/v14-capture-async-invalidation-recovery-sol

permissions:
  contents: write

jobs:
  apply-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v6
        with:
          ref: cell/v14-capture-async-invalidation-recovery-sol

      - name: Apply fail-closed app lifecycle recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text()

          old = '''    var correlationProgress: PassiveBluetoothPowerCycleObservationProgress? { correlationSession?.progress }
              var correlationWindowIsScanning: Bool { correlationProgress?.isScanning == true }
          '''.replace('              var', '    var')
          new = '''    var correlationProgress: PassiveBluetoothPowerCycleObservationProgress? { correlationSession?.progress }
              var correlationSeriesIsInvalidated: Bool { correlationProgress?.isSeriesInvalidated == true }
              var correlationWindowIsScanning: Bool { correlationProgress?.isScanning == true }
          '''.replace('              var', '    var')
          if old not in app:
              raise SystemExit('correlation progress insertion point changed; refusing stale edit')
          app = app.replace(old, new, 1)

          old = '''    func startNextCorrelationWindow() {
              guard phase == .powerOn else { return }
              startCurrentCorrelationWindow()
          }

              private func startCurrentCorrelationWindow() {
          '''.replace('              guard', '        guard').replace('              startCurrent', '        startCurrent').replace('              private', '    private')
          new = '''    func startNextCorrelationWindow() {
              guard phase == .powerOn else { return }
              startCurrentCorrelationWindow()
          }

              func consumeAsynchronousCorrelationInvalidation() {
              guard phase == .baseline || phase == .scanning,
                    let session = correlationSession,
                    session.progress?.isSeriesInvalidated == true else { return }

              let invalidatedWindow = correlationWindowLabel
              // The package has already retired this observation-series authority. Releasing the
              // app reference and entering the existing local failure path creates no new receipt,
              // candidate authority, timestamp, BLE fact, or physical claim.
              session.abandonCurrentWindow()
              correlationSession = nil
              failLocally(
                  "\\(invalidatedWindow) Bluetooth correlation was invalidated before it could be sealed. Restart the complete OFF1→ON1→OFF2→ON2 series from OFF1.",
                  "target_correlation_async_invalidated"
              )
          }

              private func startCurrentCorrelationWindow() {
          '''.replace('              guard', '        guard').replace('              startCurrent', '        startCurrent').replace('              func consume', '    func consume').replace('              let invalidated', '        let invalidated').replace('              // The package', '        // The package').replace('              // app', '        // app').replace('              session.abandon', '        session.abandon').replace('              correlationSession', '        correlationSession').replace('              failLocally', '        failLocally').replace('                  "', '            "').replace('                  "target', '            "target').replace('              )', '        )').replace('              private', '    private')
          if old not in app:
              raise SystemExit('correlation lifecycle insertion point changed; refusing stale edit')
          app = app.replace(old, new, 1)

          old = '''            .background(Color.black.ignoresSafeArea())
          }
              .navigationTitle("Secure Link")
          '''.replace('          }', '        }').replace('              .navigation', '        .navigation')
          new = '''            .background(Color.black.ignoresSafeArea())
              .onChange(of: test.correlationSeriesIsInvalidated) { _, invalidated in
                  if invalidated { test.consumeAsynchronousCorrelationInvalidation() }
              }
          }
              .navigationTitle("Secure Link")
          '''.replace('              .onChange', '            .onChange').replace('                  if', '                if').replace('              }', '            }').replace('          }', '        }').replace('              .navigation', '        .navigation')
          if old not in app:
              raise SystemExit('TimelineView insertion point changed; refusing stale edit')
          app = app.replace(old, new, 1)

          required = [
              'var correlationSeriesIsInvalidated: Bool { correlationProgress?.isSeriesInvalidated == true }',
              'func consumeAsynchronousCorrelationInvalidation()',
              'session.progress?.isSeriesInvalidated == true',
              '"target_correlation_async_invalidated"',
              '.onChange(of: test.correlationSeriesIsInvalidated)',
              'test.consumeAsynchronousCorrelationInvalidation()'
          ]
          for token in required:
              if token not in app:
                  raise SystemExit(f'missing repaired contract token: {token}')
          app_path.write_text(app)

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationAsyncInvalidationPresentationSourceTests.swift')
          test_path.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture correlation asynchronous invalidation presentation")
          struct TuyaCorrelationAsyncInvalidationPresentationSourceTests {
              @Test("asynchronous package invalidation cannot leave the field flow trapped in a scan phase")
              func invalidatedCorrelationSeriesHasAnAppRecoveryConsumer() throws {
                  let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = try section(
                      in: app,
                      from: "private final class SecureLinkController",
                      to: "private protocol OfficialTuyaDriver"
                  )

                  #expect(controller.contains("var correlationSeriesIsInvalidated: Bool"))
                  #expect(controller.contains("session.progress?.isSeriesInvalidated == true"))
                  #expect(controller.contains("target_correlation_async_invalidated"))
                  #expect(controller.contains("func consumeAsynchronousCorrelationInvalidation()"))
              }

              @Test("existing TimelineView consumes the terminal without a second polling clock")
              func timelineRefreshDrivesLifecycleRecovery() throws {
                  let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let view = try section(in: app, from: "private struct SecureLinkView", to: "#Preview")

                  #expect(view.contains("TimelineView(.periodic"))
                  #expect(view.contains(".onChange(of: test.correlationSeriesIsInvalidated)"))
                  #expect(view.contains("test.consumeAsynchronousCorrelationInvalidation()"))
                  #expect(!view.contains("correlationInvalidationTask"))
                  #expect(!view.contains("Task.sleep(for: .milliseconds(100))"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \\(start) ... \\(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          '''.replace('          ', ''))
          PY

      - name: Remove temporary mutation workflow from product branch
        run: git rm .github/workflows/_temp_capture_async_invalidation_recovery.yml

      - name: Commit exact recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationAsyncInvalidationPresentationSourceTests.swift
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(capture): recover asynchronous correlation invalidation'
          git push origin HEAD:cell/v14-capture-async-invalidation-recovery-sol
