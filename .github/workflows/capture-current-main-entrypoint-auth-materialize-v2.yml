name: Capture current-main entrypoint authorization materialize v2

on:
  push:
    branches:
      - capture/current-main-entrypoint-authorization-gpt56
    paths:
      - .github/workflows/capture-current-main-entrypoint-auth-materialize-v2.yml

permissions:
  contents: write

concurrency:
  group: capture-current-main-entrypoint-auth-materialize-v2
  cancel-in-progress: false

jobs:
  materialize-test-publish:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TARGET_BRANCH: capture/current-main-entrypoint-authorization-gpt56
      TRIGGER_SHA: ${{ github.sha }}
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      SELF_WORKFLOW: .github/workflows/capture-current-main-entrypoint-auth-materialize-v2.yml
      STALE_WORKFLOW: .github/workflows/capture-current-main-entrypoint-auth-materialize-once.yml
      DONOR_BRANCH: product/capture-1-0-main-20260818
      DONOR_WORKFLOW: .github/workflows/capture-app-authorization-race-safe-go.yml
      DONOR_SOURCE_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
      DONOR_MATERIALIZER_COMMIT: 3cf110f4ddaa3188ac2bcb44dd2393f1c1a69f10
      EXPECTED_DONOR_MATERIALIZER_BLOB: 8a0baf6cbafa5c9a50e853a972b8f7a45c6131f3
      EXPECTED_DONOR_SOURCE_BLOB: 2cb91114a605be7f6808eb10b4201cd58bb419e0
      EXPECTED_APP_BLOB: 5d1bc8aa617063730c234c596bb82db199c8b0c4
    steps:
      - name: Checkout exact current-main convergence head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind immutable current-main and donor subjects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_APP_BLOB"
          git fetch origin "$DONOR_BRANCH"
          test "$(git rev-parse "$DONOR_MATERIALIZER_COMMIT:$DONOR_WORKFLOW")" = "$EXPECTED_DONOR_MATERIALIZER_BLOB"
          test "$(git rev-parse FETCH_HEAD:"$DONOR_SOURCE_WORKFLOW")" = "$EXPECTED_DONOR_SOURCE_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute reviewed pinned inner lifecycle transform
        shell: python
        run: |
          import os
          import subprocess
          import textwrap
          from pathlib import Path

          donor_workflow = os.environ["DONOR_WORKFLOW"]
          donor_source_workflow = os.environ["DONOR_SOURCE_WORKFLOW"]
          donor_commit = os.environ["DONOR_MATERIALIZER_COMMIT"]

          workflow = subprocess.check_output(
              ["git", "show", f"{donor_commit}:{donor_workflow}"], text=True
          )
          start_marker = "      - name: Materialize canonical lifecycle transform\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Enforce transformed authority shape"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          program = textwrap.dedent(workflow[start:end])

          source_bytes = subprocess.check_output(
              ["git", "show", f"FETCH_HEAD:{donor_source_workflow}"], text=True
          )
          source_path = Path(os.environ["RUNNER_TEMP"]) / "capture-app-authorization-close-one-shot.yml"
          source_path.write_text(source_bytes, encoding="utf-8")
          old_source = os.environ.get("SOURCE_WORKFLOW")
          os.environ["SOURCE_WORKFLOW"] = str(source_path)
          try:
              ns = {"__name__": "__main__", "__file__": "<current-main-pinned-inner-authorization-transform>"}
              exec(compile(program, ns["__file__"], "exec", dont_inherit=True), ns)
          finally:
              if old_source is None:
                  os.environ.pop("SOURCE_WORKFLOW", None)
              else:
                  os.environ["SOURCE_WORKFLOW"] = old_source

      - name: Apply reviewed donor post-transform authority hardening
        shell: python
        run: |
          import os
          import subprocess
          import textwrap

          donor_workflow = os.environ["DONOR_WORKFLOW"]
          workflow = subprocess.check_output(
              ["git", "show", f"FETCH_HEAD:{donor_workflow}"], text=True
          )
          start_marker = "      - name: Keep exact-freeze helper outside watchdog source-oracle interval\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Enforce transformed authority shape"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          chunks = block.split("\n      - name: Bind selected authentication to exact post-OFF1 authorization stage\n        shell: python\n        run: |\n")
          if len(chunks) != 2:
              raise SystemExit("reviewed donor hardening boundary changed")
          for index, program in enumerate(map(textwrap.dedent, chunks), 1):
              ns = {"__name__": "__main__", "__file__": f"<current-main-auth-hardening-{index}>"}
              exec(compile(program, ns["__file__"], "exec", dont_inherit=True), ns)

      - name: Enforce non-authorizing transformed shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'publishDps(' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'writeValue(' "$APP_SOURCE")" = 0

      - name: Run exact current-main lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py -v

      - name: Run focused app-authorization contracts
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project NembraCapture.xcodeproj -scheme 'Nembra Capture' -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/NembraCurrentMainEntrypointAuthorizationV2" CODE_SIGNING_ALLOWED=NO build

      - name: Publish tested entrypoint and retire authoring workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$TRIGGER_SHA"
          rm "$SELF_WORKFLOW" "$STALE_WORKFLOW"
          git add -- "$APP_SOURCE" "$SELF_WORKFLOW" "$STALE_WORKFLOW"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture: wire current-main field authorization lifecycle'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$TRIGGER_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CURRENT_MAIN_AUTH_LIFECYCLE physicalAuthorityCreated=false\n'
