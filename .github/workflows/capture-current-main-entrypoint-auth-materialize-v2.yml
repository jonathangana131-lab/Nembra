name: Capture current-main entrypoint authorization materialize v2

on:
  push:
    branches:
      - capture/current-main-entrypoint-authorization-gpt56
    paths:
      - .github/workflows/capture-current-main-entrypoint-auth-materialize-v2.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/capture-current-main-entrypoint-auth-materialize-v2.yml

permissions:
  contents: write

concurrency:
  group: capture-current-main-entrypoint-auth-materialize-v2
  cancel-in-progress: false

jobs:
  materialize-test-publish:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TARGET_BRANCH: capture/current-main-entrypoint-authorization-gpt56
      TRIGGER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      SELF_WORKFLOW: .github/workflows/capture-current-main-entrypoint-auth-materialize-v2.yml
      STALE_WORKFLOW: .github/workflows/capture-current-main-entrypoint-auth-materialize-once.yml
      DIAGNOSTIC_WORKFLOW: .github/workflows/capture-current-main-auth-anchor-diagnostic.yml
      DONOR_BRANCH: product/capture-1-0-main-20260818
      DONOR_SOURCE_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
      EXPECTED_DONOR_SOURCE_BLOB: 2cb91114a605be7f6808eb10b4201cd58bb419e0
      EXPECTED_APP_BLOB: 5d1bc8aa617063730c234c596bb82db199c8b0c4
    steps:
      - name: Checkout exact current-main convergence head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TRIGGER_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind immutable current-main and donor subjects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_APP_BLOB"
          git fetch origin "$DONOR_BRANCH"
          test "$(git rev-parse FETCH_HEAD:"$DONOR_SOURCE_WORKFLOW")" = "$EXPECTED_DONOR_SOURCE_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute reviewed lifecycle transform with current-main semantic anchors
        shell: python
        run: |
          import ast
          import os
          import subprocess
          import textwrap

          source_workflow = subprocess.check_output(
              ["git", "show", f"FETCH_HEAD:{os.environ['DONOR_SOURCE_WORKFLOW']}"], text=True
          )
          marker = "      - name: Materialize field authorization into real SecureLink lifecycle\n"
          section = source_workflow.index(marker)
          run_marker = "        run: |\n"
          start = source_workflow.index(run_marker, section) + len(run_marker)
          end = source_workflow.index("\n      - name:", start)
          program = textwrap.dedent(source_workflow[start:end])

          required = [
              "admitOFF1Start",
              "admitAuthenticationStart",
              "admitOfficialConnectionStart",
              "admitObservationStart",
              "freezeAcceptedArtifactForAuthorizationSeal",
              "sealAfterAcceptedArtifactFreeze",
              "path.write_text(source, encoding=\"utf-8\")",
          ]
          for token in required:
              if token not in program:
                  raise SystemExit(f"pinned lifecycle transform missing required token: {token}")
          if "insert_after_once" in program:
              raise SystemExit("pinned lifecycle transform unexpectedly contains historical insert_after_once helper")

          old_source_literal = '"import Foundation\\nimport NembraBluetoothCapture\\nimport SwiftUI\\n"'
          old_replacement_literal = '"import Foundation\\nimport NembraBluetoothCapture\\nimport NembraCaptureAppAuthorization\\nimport SwiftUI\\n"'
          if program.count(old_source_literal) != 1 or program.count(old_replacement_literal) != 1:
              raise SystemExit("pinned lifecycle import replacement changed; refusing to guess")
          program = program.replace(old_source_literal, '"import NembraBluetoothCapture\\n"', 1)
          program = program.replace(
              old_replacement_literal,
              '"import NembraBluetoothCapture\\nimport NembraCaptureAppAuthorization\\n"',
              1,
          )

          current_phase_old = "    @Published private(set) var phase: Phase = .idle\n"
          current_phase_new = '''    @Published private(set) var phase: Phase = .idle {\n        didSet {\n            // Every failed app lifecycle is terminal for the one-time authorization attempt.\n            if phase == .failed {\n                fieldAuthorization.revoke()\n            }\n        }\n    }\n'''

          current_freeze_old = '''                        self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut\n                        self.currentConnectionToken = nil\n                        self.sealedAcceptedExport = self.makeExport(\n                            exportedAt: Date(),\n                            phase: .accepted,\n                            events: acceptedEventPrefixAtCut\n                        )\n                        self.exportData = nil\n                        self.phase = .accepted\n                        self.prepareExport()\n'''
          current_freeze_new = '''                        self.sealedAcceptedEventPrefix = acceptedEventPrefixAtCut\n                        self.sealedAcceptedExport = self.makeExport(\n                            exportedAt: Date(),\n                            phase: .accepted,\n                            events: acceptedEventPrefixAtCut\n                        )\n                        self.exportData = nil\n                        do {\n                            try self.freezeAcceptedArtifactForAuthorizationSeal()\n                            try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()\n                        } catch {\n                            self.fieldAuthorization.revoke()\n                            self.sealedAcceptedExport = nil\n                            self.exportData = nil\n                            self.fieldAuthorizationStatus = "One-time field authorization was revoked before accepted-artifact promotion."\n                            self.currentConnectionToken = nil\n                            self.localBLESettlementToken = nil\n                            self.sdkLocalBLEOnline = false\n                            self.driver = nil\n                            self.phase = .failed\n                            self.message = "The accepted evidence could not complete immutable artifact authorization sealing: \\(error.localizedDescription). Relaunch Capture before another attempt."\n                            self.log("field_authorization_or_artifact_freeze_rejected", [\n                                "generation": String(token.diagnosticGeneration),\n                                "error": error.localizedDescription\n                            ])\n                            return\n                        }\n                        self.fieldAuthorizationStatus = "One-time field authorization sealed with the verified accepted artifact."\n                        self.currentConnectionToken = nil\n                        self.phase = .accepted\n'''

          helper_anchor = '''    }\n\n    private func recordObservedTransportLoss(token: TuyaReadOnlyConnectionToken) async {\n'''
          current_helper_new = '''    }\n\n    private func freezeAcceptedArtifactForAuthorizationSeal() throws {\n        guard let sealedAcceptedExport else {\n            throw NSError(\n                domain: "NembraCapture.AcceptedArtifactAuthorization",\n                code: 1,\n                userInfo: [NSLocalizedDescriptionKey: "immutable accepted export was unavailable before authorization seal"]\n            )\n        }\n        let encoder = JSONEncoder()\n        encoder.outputFormatting = [.prettyPrinted, .sortedKeys, .withoutEscapingSlashes]\n        encoder.dateEncodingStrategy = .iso8601\n        let exactBytes = try encoder.encode(sealedAcceptedExport)\n        let artifactSeal = ExactByteArtifactSeal(sealing: exactBytes)\n        let verifiedBytes = try artifactSeal.verifiedBytes()\n        guard artifactSeal.verifies(verifiedBytes) else {\n            throw ExactByteArtifactSealError.sealedBytesIntegrityMismatch\n        }\n        self.exportData = verifiedBytes\n        self.exportName = "Nembra-Capture-\\(deviceID.prefix(8)).json"\n    }\n\n    private func recordObservedTransportLoss(token: TuyaReadOnlyConnectionToken) async {\n'''

          class AdaptCurrentMain(ast.NodeTransformer):
              def visit_Call(self, node):
                  self.generic_visit(node)
                  if not isinstance(node.func, ast.Name) or node.func.id != "replace_once":
                      return node
                  if len(node.args) < 3:
                      return node
                  try:
                      label = ast.literal_eval(node.args[2])
                  except Exception:
                      return node
                  if label == "failed-phase terminal authorization":
                      node.args[0] = ast.Constant(current_phase_old)
                      node.args[1] = ast.Constant(current_phase_new)
                  elif label == "freeze before capability seal":
                      node.args[0] = ast.Constant(current_freeze_old)
                      node.args[1] = ast.Constant(current_freeze_new)
                  elif label == "immutable artifact freeze helper":
                      node.args[0] = ast.Constant(helper_anchor)
                      node.args[1] = ast.Constant(current_helper_new)
                  return node

          tree = AdaptCurrentMain().visit(ast.parse(program))
          ast.fix_missing_locations(tree)
          program = ast.unparse(tree)

          ns = {"__name__": "__main__", "__file__": "<current-main-semantic-authorization-transform>"}
          exec(compile(program, ns["__file__"], "exec", dont_inherit=True), ns)

      - name: Enforce non-authorizing transformed shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = "$APP_SOURCE"
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          grep -Fq 'ExactByteArtifactSeal(sealing: exactBytes)' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'publishDps(' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'writeValue(' "$APP_SOURCE")" = 0

      - name: Run exact current-main lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py -v

      - name: Run focused app-authorization contracts
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project NembraCapture.xcodeproj -scheme 'Nembra Capture' -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/NembraCurrentMainEntrypointAuthorizationV2" CODE_SIGNING_ALLOWED=NO build

      - name: Publish tested entrypoint and retire authoring workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$TRIGGER_SHA"
          rm "$SELF_WORKFLOW" "$STALE_WORKFLOW" "$DIAGNOSTIC_WORKFLOW"
          git add -- "$APP_SOURCE" "$SELF_WORKFLOW" "$STALE_WORKFLOW" "$DIAGNOSTIC_WORKFLOW"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture: wire current-main field authorization lifecycle'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$TRIGGER_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CURRENT_MAIN_AUTH_LIFECYCLE physicalAuthorityCreated=false\n'
