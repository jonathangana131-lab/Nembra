name: Capture TODAY Final GO Crosscheck Execution QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_final_go_foundation.py
      - scripts/ci/es80_today_final_go_crosscheck_execution.py
      - scripts/ci/tests/test_es80_today_final_go_foundation.py
      - scripts/ci/tests/test_es80_today_final_go_crosscheck_execution.py
      - scripts/ci/tests/test_es80_today_final_go_crosscheck_receipt_custody.py
      - .github/workflows/capture-today-final-go-crosscheck-execution-qa.yml

permissions:
  contents: read

jobs:
  pinned-crosscheck-execution:
    name: Require pinned producer execution for crosscheck PASS
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile execution custody and regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_final_go_foundation.py
          python3 -m py_compile scripts/ci/es80_today_final_go_crosscheck_execution.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_crosscheck_execution.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_crosscheck_receipt_custody.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_foundation.py

      - name: Prove exact pinned producer execution custody
        run: python3 scripts/ci/tests/test_es80_today_final_go_crosscheck_execution.py -v

      - name: Reject handwritten independent PASS receipt
        run: python3 scripts/ci/tests/test_es80_today_final_go_crosscheck_receipt_custody.py -v

      - name: Preserve historical foundation adversarial suite
        run: python3 scripts/ci/tests/test_es80_today_final_go_foundation.py

      - name: Require pinned isolated execution seam in authority composer
        run: |
          set -euo pipefail
          grep -Fq 'verify_pinned_crosscheck_execution' scripts/ci/es80_today_final_go_crosscheck_execution.py
          grep -Fq '"-I"' scripts/ci/es80_today_final_go_crosscheck_execution.py
          grep -Fq 'retained crosscheck receipt bytes were not emitted by the pinned producer' scripts/ci/es80_today_final_go_crosscheck_execution.py
          grep -Fq 'candidate_root=candidate_root' scripts/ci/es80_today_final_go_foundation.py
