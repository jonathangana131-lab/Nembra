name: Capture Root Large Type Materializer

on:
  push:
    branches:
      - visual/v14-capture-root-large-type-hierarchy-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recompose public lock screen without changing authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text(encoding="utf-8")

          def replace_section(label: str, start_marker: str, end_marker: str, replacement: str) -> None:
              global text
              if text.count(start_marker) != 1 or text.count(end_marker) != 1:
                  raise SystemExit(f"{label}: section markers are not unique")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + replacement + "\n\n" + text[end:]

          replace_section(
              "root hero",
              "    @ViewBuilder\n    private var rootHero: some View {",
              "    private var buildAuthorityStatus: some View {",
              '''    @ViewBuilder
          private var rootHero: some View {
              VStack(alignment: .leading, spacing: isAccessibilityLayout ? 4 : 8) {
                  Text(isAccessibilityLayout ? "Prepare scooter link" : "Prepare the scooter link")
                      .font(isAccessibilityLayout ? .title2.bold() : .largeTitle.bold())
                      .fixedSize(horizontal: false, vertical: true)
                      .accessibilityAddTraits(.isHeader)

                  if !isAccessibilityLayout {
                      Text("Link the Tuya Smart account that owns this scooter. Bluetooth and physical evidence stay locked until the reviewed field build and fresh scooter authority are verified.")
                          .font(.body)
                          .foregroundStyle(Color.white.opacity(0.78))
                          .fixedSize(horizontal: false, vertical: true)
                  }
              }
          }''',
          )

          replace_section(
              "build authority status",
              "    private var buildAuthorityStatus: some View {",
              "    private var accountSetupPanel: some View {",
              '''    private var buildAuthorityStatus: some View {
              HStack(alignment: .top, spacing: 12) {
                  Image(systemName: fieldBuildIsAuthoritative ? "checkmark.shield.fill" : "lock.shield.fill")
                      .font(.title3)
                      .foregroundStyle(fieldBuildIsAuthoritative ? Color.green : Color.orange)
                      .accessibilityHidden(true)

                  VStack(alignment: .leading, spacing: 4) {
                      Text(fieldBuildIsAuthoritative ? "Build provenance ready" : "Physical capture locked")
                          .font(isAccessibilityLayout ? .subheadline.weight(.semibold) : .headline)
                          .foregroundStyle(fieldBuildIsAuthoritative ? Color.green : Color.orange)
                          .fixedSize(horizontal: false, vertical: true)

                      if !isAccessibilityLayout {
                          Text(
                              fieldBuildIsAuthoritative
                                  ? "The reviewed build is ready. Account and scooter authority must still be verified before Bluetooth starts."
                                  : "Account setup is available. Bluetooth scanning, connection, and physical evidence stay locked until the reviewed field build is installed."
                          )
                          .font(.subheadline)
                          .foregroundStyle(Color.white.opacity(0.76))
                          .fixedSize(horizontal: false, vertical: true)
                      }
                  }
              }
              .padding(.vertical, isAccessibilityLayout ? 4 : 10)
              .frame(maxWidth: .infinity, alignment: .leading)
              .overlay(alignment: .top) {
                  Rectangle()
                      .fill(Color.white.opacity(0.14))
                      .frame(height: 1)
              }
              .overlay(alignment: .bottom) {
                  Rectangle()
                      .fill(Color.white.opacity(0.10))
                      .frame(height: 1)
              }
              .accessibilityElement(children: .combine)
              .accessibilityLabel(fieldBuildIsAuthoritative ? "Build provenance ready" : "Physical capture locked")
              .accessibilityValue(
                  fieldBuildIsAuthoritative
                      ? "Build provenance is ready. Account and scooter authority are still required before Bluetooth starts."
                      : "This public build can prepare account metadata only. Bluetooth and physical evidence collection are locked."
              )
          }''',
          )

          account_start_marker = "    private var accountSetupPanel: some View {"
          account_end_marker = "    private var statusText: some View {"
          if text.count(account_start_marker) != 1 or text.count(account_end_marker) != 1:
              raise SystemExit("account setup: section markers are not unique")
          account_start = text.index(account_start_marker)
          account_end = text.index(account_end_marker, account_start)
          account = text[account_start:account_end]
          old_heading = ': (isAccessibilityLayout ? "Account metadata" : "Prepare account metadata")'
          new_heading = ': (isAccessibilityLayout ? "Set up account metadata" : "Prepare account metadata")'
          if account.count(old_heading) != 1:
              raise SystemExit(f"account action heading: expected one match, found {account.count(old_heading)}")
          account = account.replace(old_heading, new_heading, 1)
          text = text[:account_start] + account + text[account_end:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify patch and retire materializer
        run: |
          git diff --check
          git diff -- NembraApp/App/NembraCaptureEntrypoint.swift
          git rm .github/workflows/capture-root-large-type-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git config user.name "nembra-capture-bot"
          git config user.email "capture@nembra.invalid"
          git commit -m "Capture: recompose locked root for large type"
          git push origin HEAD:visual/v14-capture-root-large-type-hierarchy-sol-20260811
