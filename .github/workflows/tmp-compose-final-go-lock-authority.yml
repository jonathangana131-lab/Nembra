name: Temporary Compose Final GO Lock Authority

on:
  push:
    branches:
      - repair/v14-final-go-lock-authority-1b1-sol
    paths:
      - scripts/ci/tmp_compose_final_go_lock_authority.py
      - .github/workflows/tmp-compose-final-go-lock-authority.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-final-go-lock-authority-1b1-sol
          fetch-depth: 0

      - name: Resolve, test, and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin repair/v14-final-go-lock-authority-compose-sol
          test "$(git rev-parse FETCH_HEAD)" = "7a0da0eb08cac328f2212eb2d2a7c7af0265b7c1"
          python3 scripts/ci/tmp_compose_final_go_lock_authority.py
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          rm scripts/ci/tmp_compose_final_go_lock_authority.py .github/workflows/tmp-compose-final-go-lock-authority.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): compose reviewed lock with prechecked device authority'
          git push origin HEAD:repair/v14-final-go-lock-authority-1b1-sol
