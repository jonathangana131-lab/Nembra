name: Capture V16 combined closure r2 materialize once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - .github/workflows/capture-v16-closure-combined-r2-materialize-once.yml

permissions:
  contents: write

concurrency:
  group: capture-v16-closure-combined-r2-materialize-once
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/capture-v16-closure-combined-r2-gpt56sol-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ci/capture-v16-closure-combined-r2-gpt56sol-20260821
      CARRIER_PARENT: bd2d6f892453211e90eee4604976eacb6a9ea2c8
      TARGET_WORKFLOW: .github/workflows/capture-v16-standalone.yml
      TARGET_BLOB: 6dc545a21adef28417d47752b02b34c1cebd7352
      SELF_WORKFLOW: .github/workflows/capture-v16-closure-combined-r2-materialize-once.yml
      LIFECYCLE_ORACLE: scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py
    steps:
      - name: Checkout exact authoring head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact carrier subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          test "$(git rev-parse HEAD:"$TARGET_WORKFLOW")" = "$TARGET_BLOB"
          test "$(git diff --name-only HEAD^ HEAD)" = "$SELF_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize combined V16 acceptance closure
        shell: python
        run: |
          import os
          from pathlib import Path

          path = Path(os.environ["TARGET_WORKFLOW"])
          source = path.read_text(encoding="utf-8")
          lifecycle = os.environ["LIFECYCLE_ORACLE"]

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              source = source.replace(old, new, 1)

          signer_paths = [
              "scripts/ci/es80_signed_field_artifact_private_runner.py",
              "scripts/ci/es80_sign_field_authorization_from_rendezvous.py",
              "scripts/ci/es80_field_authorization_rendezvous.py",
              "scripts/ci/es80_field_authorization_envelope.py",
              "scripts/ci/es80_signed_field_artifact_evidence.py",
              "scripts/ci/es80_run_materialized_field_authorization_signer.py",
              "scripts/ci/es80_materialize_field_authorization_signer_runtime.py",
              "scripts/ci/es80_materialize_field_authorization_signer_bundle.py",
              "scripts/ci/tests/test_es80_sign_field_authorization_from_rendezvous.py",
              "scripts/ci/tests/test_es80_signed_field_artifact_path_custody.py",
              "scripts/ci/tests/test_es80_sign_field_authorization_execution_custody.py",
              "scripts/ci/tests/test_es80_rendezvous_signer_private_custody_boundary.py",
              "scripts/ci/tests/test_es80_materialized_field_authorization_signer_runtime.py",
              "scripts/ci/tests/test_es80_materialized_field_authorization_signer_execution_snapshot.py",
              "scripts/ci/tests/test_es80_field_authorization_private_key_path_custody.py",
              "scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py",
          ]

          trigger_anchor = "      - 'Packages/NembraCore/**'\n      - '.github/workflows/capture-v16-standalone.yml'\n"
          trigger_lines = "".join(f"      - '{item}'\n" for item in signer_paths + [lifecycle])
          replace_once(
              trigger_anchor,
              "      - 'Packages/NembraCore/**'\n" + trigger_lines + "      - '.github/workflows/capture-v16-standalone.yml'\n",
              "combined V16 trigger set",
          )

          compile_anchor = (
              "            scripts/ci/es80_signed_field_artifact_private_runner.py \\\n"
              "            scripts/ci/es80_retained_install_manifest.py \\\n"
              "            scripts/ci/tests/test_es80_retained_install_manifest.py \\\n"
              "            scripts/ci/tests/test_es80_retained_install_installer_chronology.py\n"
          )
          compile_replacement = (
              "            scripts/ci/es80_signed_field_artifact_private_runner.py \\\n"
              "            scripts/ci/es80_retained_install_manifest.py \\\n"
              "            scripts/ci/es80_signed_field_artifact_evidence.py \\\n"
              "            scripts/ci/es80_field_authorization_envelope.py \\\n"
              "            scripts/ci/es80_field_authorization_rendezvous.py \\\n"
              "            scripts/ci/es80_sign_field_authorization_from_rendezvous.py \\\n"
              "            scripts/ci/es80_run_materialized_field_authorization_signer.py \\\n"
              "            scripts/ci/es80_materialize_field_authorization_signer_runtime.py \\\n"
              "            scripts/ci/es80_materialize_field_authorization_signer_bundle.py \\\n"
              "            scripts/ci/tests/test_es80_retained_install_manifest.py \\\n"
              "            scripts/ci/tests/test_es80_retained_install_installer_chronology.py \\\n"
              "            scripts/ci/tests/test_es80_sign_field_authorization_from_rendezvous.py \\\n"
              "            scripts/ci/tests/test_es80_signed_field_artifact_path_custody.py \\\n"
              "            scripts/ci/tests/test_es80_sign_field_authorization_execution_custody.py \\\n"
              "            scripts/ci/tests/test_es80_rendezvous_signer_private_custody_boundary.py \\\n"
              "            scripts/ci/tests/test_es80_materialized_field_authorization_signer_runtime.py \\\n"
              "            scripts/ci/tests/test_es80_materialized_field_authorization_signer_execution_snapshot.py \\\n"
              "            scripts/ci/tests/test_es80_field_authorization_private_key_path_custody.py \\\n"
              "            scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py \\\n"
              f"            {lifecycle}\n"
          )
          replace_once(compile_anchor, compile_replacement, "combined V16 py_compile set")

          run_anchor = (
              "          /usr/bin/python3 -I scripts/ci/tests/test_es80_retained_install_installer_chronology.py\n"
              "          test ! -e LocalSecrets\n"
          )
          run_replacement = (
              "          /usr/bin/python3 -I scripts/ci/tests/test_es80_retained_install_installer_chronology.py\n"
              f"          /usr/bin/python3 -I {lifecycle} -v\n"
              "          /usr/bin/python3 -I scripts/ci/es80_signed_field_artifact_evidence.py --self-test\n"
              "          test -d /private/tmp\n"
              "          TMPDIR=/private/tmp /usr/bin/python3 scripts/ci/es80_field_authorization_envelope.py --self-test\n"
              "          /usr/bin/python3 -I scripts/ci/tests/test_es80_sign_field_authorization_from_rendezvous.py\n"
              "          /usr/bin/python3 -I scripts/ci/tests/test_es80_signed_field_artifact_path_custody.py\n"
              "          /usr/bin/python3 -I scripts/ci/tests/test_es80_sign_field_authorization_execution_custody.py\n"
              "          /usr/bin/python3 -I scripts/ci/tests/test_es80_rendezvous_signer_private_custody_boundary.py\n"
              "          /usr/bin/python3 scripts/ci/tests/test_es80_materialized_field_authorization_signer_runtime.py\n"
              "          /usr/bin/python3 scripts/ci/tests/test_es80_materialized_field_authorization_signer_execution_snapshot.py\n"
              "          /usr/bin/python3 scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py\n"
              "          /usr/bin/python3 scripts/ci/tests/test_es80_field_authorization_private_key_path_custody.py\n"
              "          test -z \"$(git status --porcelain=v1 --untracked-files=all)\"\n"
              "          test ! -e LocalSecrets\n"
          )
          replace_once(run_anchor, run_replacement, "combined V16 execution set")

          replace_once(
              "          printf '%s\\n' 'Validated public handoff code only; CI did not provision secrets, build a private workspace, install an app, or authorize a physical run.'\n",
              "          printf '%s\\n' 'Validated public handoff, lifecycle oracle, and synthetic signer custody/runtime only; CI did not provision secrets, use a production private key, build a private workspace, install an app, or authorize a physical run.'\n",
              "combined V16 truth wording",
          )

          if source.count(lifecycle) != 3:
              raise SystemExit(f"lifecycle oracle must appear exactly 3 times, got {source.count(lifecycle)}")
          for required in signer_paths:
              if required not in source:
                  raise SystemExit(f"missing signer-custody trigger/test subject: {required}")
          path.write_text(source, encoding="utf-8")

      - name: Verify narrow combined gate delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "$TARGET_WORKFLOW"
          git diff --check
          /usr/bin/python3 -m py_compile "$LIFECYCLE_ORACLE"
          test "$(grep -Fc -- "$LIFECYCLE_ORACLE" "$TARGET_WORKFLOW")" = 3
          grep -Fq -- 'test_es80_sign_field_authorization_execution_custody.py' "$TARGET_WORKFLOW"
          grep -Fq -- 'test_es80_materialized_field_authorization_signer_execution_snapshot.py' "$TARGET_WORKFLOW"
          grep -Fq -- 'test_es80_field_authorization_private_key_path_custody.py' "$TARGET_WORKFLOW"
          grep -Fq -- 'test -z "$(git status --porcelain=v1 --untracked-files=all)"' "$TARGET_WORKFLOW"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' NembraApp/App/NembraCaptureEntrypoint.swift)" = 0

      - name: Publish target-only successor and retire authoring workflow
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "${{ github.event.pull_request.head.sha }}"
          rm "$SELF_WORKFLOW"
          git add -- "$TARGET_WORKFLOW" "$SELF_WORKFLOW"
          git diff --cached --check
          actual="$(git diff --cached --name-status | LC_ALL=C sort)"
          expected="$(printf 'D\t%s\nM\t%s\n' "$SELF_WORKFLOW" "$TARGET_WORKFLOW" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(capture): combine V16 lifecycle and signer custody closure'
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CAPTURE_V16_COMBINED_CLOSURE materialized=%s parent=%s physicalAuthorityCreated=false\n' "$(git rev-parse HEAD)" "$CARRIER_PARENT"
