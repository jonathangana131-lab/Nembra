name: Capture Private Read Lease Converge Recovery Once

on:
  push:
    branches:
      - repair/v17-capture-private-read-lease-guard-compose-sol-20260814
    paths:
      - .github/workflows/capture-private-read-lease-converge-recovery-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind production input and exact hardening source
        shell: bash
        run: |
          set -euo pipefail
          BASE=4da6534f9fde9aa84d6ffb16d0301cd69c375760
          HARDENING_BRANCH=hardening/v17-capture-private-read-lease-4da-sol-20260814
          HARDENING_SHA=578b389e7974ff8814020d773ee0115531b654be
          OLD=.github/workflows/capture-private-read-lease-converge-once.yml
          V2=.github/workflows/capture-private-read-lease-converge-v2-once.yml
          SELF=.github/workflows/capture-private-read-lease-converge-recovery-once.yml

          actual="$(git diff --name-only "$BASE" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$OLD" "$V2" "$SELF" | LC_ALL=C sort)"
          test "$actual" = "$expected"

          git fetch --no-tags origin "refs/heads/$HARDENING_BRANCH:refs/remotes/origin/$HARDENING_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$HARDENING_BRANCH")" = "$HARDENING_SHA"
          hardening_paths="$(git diff --name-only "$BASE" "$HARDENING_SHA" | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py | LC_ALL=C sort)"
          test "$hardening_paths" = "$expected_paths"

      - name: Compose exact already-proven hardening tree
        shell: bash
        run: |
          set -euo pipefail
          HARDENING_SHA=578b389e7974ff8814020d773ee0115531b654be
          git checkout "$HARDENING_SHA" -- \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py

      - name: Re-prove converged portable contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-private-read-lease-converge-recovery-pycache"
          python3 -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py \
            scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py \
            scripts/ci/tests/test_capture_private_read_lease_descriptor_transport.py
          python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_descriptor_transport.py
          git diff --check

      - name: Delete transient scaffolds and publish convergence
        shell: bash
        env:
          BRANCH: repair/v17-capture-private-read-lease-guard-compose-sol-20260814
          OLD: .github/workflows/capture-private-read-lease-converge-once.yml
          V2: .github/workflows/capture-private-read-lease-converge-v2-once.yml
          SELF: .github/workflows/capture-private-read-lease-converge-recovery-once.yml
        run: |
          set -euo pipefail
          git rm "$OLD" "$V2" "$SELF"
          git add \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            "$OLD" \
            "$V2" \
            "$SELF" \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'nembra-swarm-materializer'
          git config user.email 'nembra-swarm@users.noreply.github.com'
          git commit -m 'capture: converge fail-closed least-authority private lease'
          git push origin "HEAD:$BRANCH"
