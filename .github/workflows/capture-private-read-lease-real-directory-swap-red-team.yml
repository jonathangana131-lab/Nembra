name: Capture Private Read Lease Real Directory Swap Red Team

on:
  pull_request:
    paths:
      - scripts/ci/capture_selected_xcode_build_orchestrator.py
      - scripts/ci/tests/test_capture_private_read_lease_real_directory_swap_red_team.py
      - .github/workflows/capture-private-read-lease-real-directory-swap-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-private-read-lease-real-directory-swap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_ATTACKED_PARENT: 64d3433e2ae5a507ec685e6703996bb8e7aec868

jobs:
  exploit-positive:
    name: Prove pathname plan can admit replaced real directory
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact attacked component-walk head
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_ATTACKED_PARENT")" = "$EXACT_ATTACKED_PARENT"
          changed="$(git diff --name-only "$EXACT_ATTACKED_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-real-directory-swap-red-team.yml \
            scripts/ci/tests/test_capture_private_read_lease_real_directory_swap_red_team.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_ATTACKED_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute exploit-positive real-directory substitution witness
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_real_directory_swap_red_team.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_real_directory_swap_red_team.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve expected-red truth boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "NEMBRA_REAL_DIRECTORY_SWAP_CLASSIFIER exploitReproduced=true productionAccepted=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false"
