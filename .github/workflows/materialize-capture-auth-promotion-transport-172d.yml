name: Materialize Capture Auth Promotion Transport 172d

on:
  push:
    branches:
      - fix/v14-capture-auth-promotion-transport-172d-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-auth-promotion-transport-172d-sol
          fetch-depth: 0

      - name: Guard exact lineage and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          base='172dca56a1bc018e192feec197ceb17f81db5dab'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"...HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/scripts/materialize_capture_auth_promotion_transport_172d.py' \
            '.github/workflows/materialize-capture-auth-promotion-transport-172d.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationPromotionTransportTruthSourceTests.swift' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Apply and verify live-transport fence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize_capture_auth_promotion_transport_172d.py apply
          python3 .github/scripts/materialize_capture_auth_promotion_transport_172d.py verify
          python3 -m py_compile .github/scripts/materialize_capture_auth_promotion_transport_172d.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationPromotionTransportTruthSourceTests.swift
          git diff --check

      - name: Publish clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-auth-promotion-transport-172d.yml
          rm .github/scripts/materialize_capture_auth_promotion_transport_172d.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): recheck transport before auth promotion'
          git push origin HEAD:fix/v14-capture-auth-promotion-transport-172d-sol
