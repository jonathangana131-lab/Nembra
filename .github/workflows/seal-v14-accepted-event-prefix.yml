name: Seal V14 accepted application evidence prefix

on:
  push:
    branches: [integration/v14-capture-final-field-security-sol]
    paths:
      - '.github/workflows/seal-v14-accepted-event-prefix.yml'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact field-security product input
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "010145472719c94294199e44ffc7c96cdfa732d1"
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift
          python3 -m py_compile .ci-patches/seal-v14-accepted-event-prefix.py

      - name: Freeze accepted evidence prefix
        run: |
          set -euo pipefail
          python3 .ci-patches/seal-v14-accepted-event-prefix.py
          git diff --check
          grep -Fq 'self.sealedAcceptedEventPrefix = self.events' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'events: exportEvents' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'sealedAcceptedEventPrefix = nil' NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift

      - name: Commit product and retire patch machinery
        run: |
          set -euo pipefail
          rm .ci-patches/seal-v14-accepted-event-prefix.py
          rm .github/workflows/seal-v14-accepted-event-prefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): freeze accepted application evidence export"
          git push origin HEAD:integration/v14-capture-final-field-security-sol
