name: Capture Build UID Retirement Convergence

on:
  pull_request:
    paths:
      - .github/workflows/capture-build-uid-retirement-convergence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-build-uid-retirement-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retirement-convergence:
    name: Prove launch-domain and stale-cache retirement convergence
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact current carrier and one-path validation scope
        shell: bash
        env:
          EXACT_PARENT: 3568250ee02556185610dd895e3f6d1c8f28dd33
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          git cat-file -e "${EXACT_PARENT}^{commit}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          test "$(git diff --name-only "$EXACT_PARENT"...HEAD)" = '.github/workflows/capture-build-uid-retirement-convergence.yml'
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize converged retirement candidate only in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          helper='scripts/ci/capture_signed_app_build_origin_custody.py'
          cp "$helper" "$RUNNER_TEMP/capture_signed_app_build_origin_custody.py.original"
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/capture_signed_app_build_origin_custody.py')
          source = path.read_text(encoding='utf-8')

          numeric_anchor = '''def _numeric_principal_in_use(candidate: int) -> bool:\n    if candidate <= 0 or _id_in_use(candidate):\n        return True\n    live, zombies = _process_state_for_uid(candidate)\n    return bool(live or zombies)\n\n\n'''
          numeric_replacement = '''def _numeric_principal_in_use(candidate: int) -> bool:\n    if candidate <= 0 or _id_in_use(candidate):\n        return True\n    live, zombies = _process_state_for_uid(candidate)\n    if live or zombies:\n        return True\n    if sys.platform == "darwin":\n        domain_present, _, _ = _launch_domain_state(candidate)\n        if domain_present:\n            return True\n    return False\n\n\n'''
          if source.count(numeric_anchor) != 1:
              raise SystemExit('current exact numeric-principal anchor was not found once')
          source = source.replace(numeric_anchor, numeric_replacement)

          assert_anchor = '''def _assert_local_build_identity_retired(name: str, uid: int, *, timeout: float = 6.0) -> None:\n    if uid <= 0:\n        raise BuildOriginCustodyError("cannot verify retirement for a missing build UID")\n    zombies = _wait_for_no_live_uid(uid, timeout=timeout)\n    deadline = time.monotonic() + timeout\n    latest_lookups: tuple[str, ...] = ()\n    while True:\n        latest_lookups = _identity_lookup_survivors(name, uid)\n        if not latest_lookups:\n            return\n        if time.monotonic() >= deadline:\n            break\n        subprocess.run(\n            ["/usr/bin/dscacheutil", "-flushcache"],\n            stdin=subprocess.DEVNULL,\n            stdout=subprocess.DEVNULL,\n            stderr=subprocess.DEVNULL,\n            check=False,\n        )\n        time.sleep(0.05)\n    raise BuildOriginCustodyError(\n        "ephemeral build identity survived retirement: "\n        f"zombie_pids={list(zombies)} identity_lookups={list(latest_lookups)}"\n    )\n\n\n'''
          if source.count(assert_anchor) != 1:
              raise SystemExit('current exact retirement assertion anchor was not found once')

          retirement_helpers = '''def _launch_domain_state(uid: int) -> tuple[bool, int, str]:\n    if uid <= 0:\n        raise BuildOriginCustodyError("cannot inspect launch domain for root or invalid UID")\n    target = f"user/{uid}"\n    completed = subprocess.run(\n        ["/bin/launchctl", "print", target],\n        stdin=subprocess.DEVNULL,\n        stdout=subprocess.DEVNULL,\n        stderr=subprocess.PIPE,\n        text=True,\n        check=False,\n    )\n    detail = (completed.stderr or "").strip()\n    if completed.returncode == 0:\n        return True, 0, ""\n    absent_markers = (\n        "Could not find domain",\n        "Could not find service",\n        "No such process",\n        "No such file or directory",\n    )\n    if any(marker in detail for marker in absent_markers):\n        return False, completed.returncode, detail[-1000:]\n    raise BuildOriginCustodyError(\n        f"could not classify dedicated build launch domain: exit {completed.returncode}"\n        + (f": {detail[-1000:]}" if detail else ": empty diagnostic")\n    )\n\n\ndef _request_local_build_launch_domain_retirement(uid: int) -> tuple[bool, int | None]:\n    present, _, _ = _launch_domain_state(uid)\n    if not present:\n        return False, None\n    target = f"user/{uid}"\n    bootout = subprocess.run(\n        ["/bin/launchctl", "bootout", target],\n        stdin=subprocess.DEVNULL,\n        stdout=subprocess.PIPE,\n        stderr=subprocess.PIPE,\n        text=True,\n        check=False,\n    )\n    if bootout.returncode != 0:\n        detail = (bootout.stderr or "").strip()\n        raise BuildOriginCustodyError(\n            f"could not request dedicated build launch-domain retirement: exit {bootout.returncode}"\n            + (f": {detail[-1000:]}" if detail else "")\n        )\n    return True, bootout.returncode\n\n\ndef _classify_local_build_launch_domain_after_retirement(\n    uid: int,\n    requested: tuple[bool, int | None],\n    *,\n    quiescence: float = 2.0,\n) -> None:\n    domain_present_before, initial_bootout_rc = requested\n    present_after_zero_live_and_ds_delete, _, _ = _launch_domain_state(uid)\n    second_bootout_rc: int | None = None\n    second_bootout_tearing_down = False\n    if present_after_zero_live_and_ds_delete:\n        target = f"user/{uid}"\n        second = subprocess.run(\n            ["/bin/launchctl", "bootout", target],\n            stdin=subprocess.DEVNULL,\n            stdout=subprocess.PIPE,\n            stderr=subprocess.PIPE,\n            text=True,\n            check=False,\n        )\n        second_bootout_rc = second.returncode\n        detail = (second.stderr or "").strip()\n        if second.returncode == 124 and detail == "Boot-out failed: 124: Domain is tearing down":\n            second_bootout_tearing_down = True\n        elif second.returncode != 0:\n            raise BuildOriginCustodyError(\n                f"could not classify post-delete dedicated build launch domain: exit {second.returncode}"\n                + (f": {detail[-1000:]}" if detail else "")\n            )\n\n    deadline = time.monotonic() + quiescence\n    polls = 0\n    domain_absent_observed = False\n    latest_zombies: tuple[int, ...] = ()\n    final_domain_present = present_after_zero_live_and_ds_delete\n    while True:\n        polls += 1\n        live, latest_zombies = _process_state_for_uid(uid)\n        if live:\n            raise BuildOriginCustodyError(\n                "retired build UID regained live process authority during launch-domain quiescence: "\n                f"live_pids={list(live)}"\n            )\n        final_domain_present, _, _ = _launch_domain_state(uid)\n        if not final_domain_present:\n            domain_absent_observed = True\n        if time.monotonic() >= deadline:\n            break\n        time.sleep(0.05)\n\n    numeric_reuse_blocked = _numeric_principal_in_use(uid)\n    if final_domain_present and not numeric_reuse_blocked:\n        raise BuildOriginCustodyError(\n            "lingering launch-domain metadata would permit premature numeric principal reuse"\n        )\n    print(\n        "NEMBRA_BUILD_UID_LAUNCH_DOMAIN_RETIREMENT_JSON="\n        + json.dumps(\n            {\n                "schema": 5,\n                "uid": uid,\n                "domainPresentBefore": domain_present_before,\n                "initialBootoutReturnCode": initial_bootout_rc,\n                "domainPresentAfterZeroLiveAndDSDelete": present_after_zero_live_and_ds_delete,\n                "secondBootoutReturnCode": second_bootout_rc,\n                "secondBootoutTearingDownObserved": second_bootout_tearing_down,\n                "zeroLiveProvedBeforeDSDelete": True,\n                "directRecordDeletionRequestedBeforeDomainClassification": True,\n                "zeroLiveQuiescenceSeconds": quiescence,\n                "zeroLiveQuiescenceProved": True,\n                "zombieUIDProcessesAtClassification": list(latest_zombies),\n                "domainAbsentObservedDuringQuiescence": domain_absent_observed,\n                "domainLingeringAtRetirement": final_domain_present,\n                "numericReuseBlockedAtRetirement": numeric_reuse_blocked,\n                "physicalAuthorityCreated": False,\n            },\n            sort_keys=True,\n            separators=(",", ":"),\n        ),\n        file=sys.stderr,\n    )\n\n\ndef _direct_local_record_present(kind: str, name: str) -> bool:\n    completed = subprocess.run(\n        ["/usr/bin/dscl", ".", "-read", f"/{kind}/{name}"],\n        stdin=subprocess.DEVNULL,\n        stdout=subprocess.PIPE,\n        stderr=subprocess.PIPE,\n        text=True,\n        check=False,\n    )\n    if completed.returncode == 0:\n        return True\n    detail = ((completed.stdout or "") + "\\n" + (completed.stderr or "")).strip()\n    if "eDSRecordNotFound" in detail or "-14136" in detail:\n        return False\n    raise BuildOriginCustodyError(\n        f"could not classify direct Directory Services {kind} record: exit {completed.returncode}"\n        + (f": {detail[-1000:]}" if detail else ": empty diagnostic")\n    )\n\n\ndef _assert_local_build_identity_retired(name: str, uid: int, *, timeout: float = 6.0) -> None:\n    if uid <= 0:\n        raise BuildOriginCustodyError("cannot verify retirement for a missing build UID")\n    zombies = _wait_for_no_live_uid(uid, timeout=timeout)\n    deadline = time.monotonic() + timeout\n    while True:\n        user_present = _direct_local_record_present("Users", name)\n        group_present = _direct_local_record_present("Groups", name)\n        if not user_present and not group_present:\n            stale_lookups = _identity_lookup_survivors(name, uid)\n            if stale_lookups and not _numeric_principal_in_use(uid):\n                raise BuildOriginCustodyError(\n                    "stale retired identity metadata would permit premature numeric principal reuse"\n                )\n            print(\n                "NEMBRA_BUILD_UID_RETIREMENT_JSON="\n                + json.dumps(\n                    {\n                        "schema": 2,\n                        "uid": uid,\n                        "directUserRecordPresent": False,\n                        "directGroupRecordPresent": False,\n                        "liveUIDProcesses": [],\n                        "zombieUIDProcesses": list(zombies),\n                        "staleLookupCount": len(stale_lookups),\n                        "numericReuseBlockedWhileStale": bool(stale_lookups),\n                        "physicalAuthorityCreated": False,\n                    },\n                    sort_keys=True,\n                    separators=(",", ":"),\n                ),\n                file=sys.stderr,\n            )\n            return\n        if time.monotonic() >= deadline:\n            raise BuildOriginCustodyError(\n                "direct local build identity survived retirement: "\n                f"user_record={user_present} group_record={group_present} zombie_pids={list(zombies)}"\n            )\n        subprocess.run(\n            ["/usr/bin/dscacheutil", "-flushcache"],\n            stdin=subprocess.DEVNULL,\n            stdout=subprocess.DEVNULL,\n            stderr=subprocess.DEVNULL,\n            check=False,\n        )\n        time.sleep(0.05)\n\n\n'''
          source = source.replace(assert_anchor, retirement_helpers)

          remove_anchor = '''def _remove_local_build_identity(name: str, uid: int | None, *, require_absent: bool = False) -> None:\n    if sys.platform != "darwin":\n        return\n    if uid is not None and uid > 0:\n        killed = subprocess.run(\n            ["/usr/bin/pkill", "-9", "-u", str(uid), ".*"],\n            stdin=subprocess.DEVNULL,\n            stdout=subprocess.DEVNULL,\n            stderr=subprocess.DEVNULL,\n            check=False,\n        )\n        if require_absent and killed.returncode not in (0, 1):\n            raise BuildOriginCustodyError(\n                f"could not request build-principal process retirement: pkill exit {killed.returncode}"\n            )\n        if require_absent:\n            _wait_for_no_live_uid(uid)\n    subprocess.run(\n        ["/usr/bin/dscl", ".", "-delete", f"/Users/{name}"],\n        stdin=subprocess.DEVNULL,\n        stdout=subprocess.DEVNULL,\n        stderr=subprocess.DEVNULL,\n        check=False,\n    )\n    subprocess.run(\n        ["/usr/bin/dscl", ".", "-delete", f"/Groups/{name}"],\n        stdin=subprocess.DEVNULL,\n        stdout=subprocess.DEVNULL,\n        stderr=subprocess.DEVNULL,\n        check=False,\n    )\n    subprocess.run(["/usr/bin/dscacheutil", "-flushcache"], check=False)\n    if require_absent:\n        if uid is None:\n            raise BuildOriginCustodyError("cannot verify retirement for a missing build UID")\n        _assert_local_build_identity_retired(name, uid)\n\n\n'''
          remove_replacement = '''def _remove_local_build_identity(name: str, uid: int | None, *, require_absent: bool = False) -> None:\n    if sys.platform != "darwin":\n        return\n    launch_retirement: tuple[bool, int | None] | None = None\n    if uid is not None and uid > 0:\n        if require_absent:\n            launch_retirement = _request_local_build_launch_domain_retirement(uid)\n        killed = subprocess.run(\n            ["/usr/bin/pkill", "-9", "-u", str(uid), ".*"],\n            stdin=subprocess.DEVNULL,\n            stdout=subprocess.DEVNULL,\n            stderr=subprocess.DEVNULL,\n            check=False,\n        )\n        if require_absent and killed.returncode not in (0, 1):\n            raise BuildOriginCustodyError(\n                f"could not request build-principal process retirement: pkill exit {killed.returncode}"\n            )\n        if require_absent:\n            _wait_for_no_live_uid(uid)\n    subprocess.run(\n        ["/usr/bin/dscl", ".", "-delete", f"/Users/{name}"],\n        stdin=subprocess.DEVNULL,\n        stdout=subprocess.DEVNULL,\n        stderr=subprocess.DEVNULL,\n        check=False,\n    )\n    subprocess.run(\n        ["/usr/bin/dscl", ".", "-delete", f"/Groups/{name}"],\n        stdin=subprocess.DEVNULL,\n        stdout=subprocess.DEVNULL,\n        stderr=subprocess.DEVNULL,\n        check=False,\n    )\n    subprocess.run(["/usr/bin/dscacheutil", "-flushcache"], check=False)\n    if require_absent:\n        if uid is None:\n            raise BuildOriginCustodyError("cannot verify retirement for a missing build UID")\n        if launch_retirement is None:\n            raise BuildOriginCustodyError("launch-domain retirement state was not captured")\n        _classify_local_build_launch_domain_after_retirement(uid, launch_retirement)\n        _assert_local_build_identity_retired(name, uid)\n\n\n'''
          if source.count(remove_anchor) != 1:
              raise SystemExit('current exact build-identity removal anchor was not found once')
          source = source.replace(remove_anchor, remove_replacement)
          compile(source, str(path), 'exec', dont_inherit=True)
          path.write_text(source, encoding='utf-8')
          PY

          grep -Fq 'def _classify_local_build_launch_domain_after_retirement' "$helper"
          grep -Fq 'Boot-out failed: 124: Domain is tearing down' "$helper"
          grep -Fq 'zeroLiveQuiescenceProved' "$helper"
          grep -Fq 'domainLingeringAtRetirement' "$helper"
          grep -Fq 'numericReuseBlockedAtRetirement' "$helper"
          grep -Fq 'domain_present, _, _ = _launch_domain_state(candidate)' "$helper"
          grep -Fq 'NEMBRA_BUILD_UID_LAUNCH_DOMAIN_RETIREMENT_JSON=' "$helper"
          grep -Fq 'NEMBRA_BUILD_UID_RETIREMENT_JSON=' "$helper"
          grep -Fq '["/usr/bin/pkill", "-9", "-u", str(uid), ".*"]' "$helper"
          /usr/bin/python3 -m py_compile "$helper"

      - name: Prove lightweight retirement and ordinary-field non-authority
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-uid-lightweight-retirement.log"
          /usr/bin/sudo /usr/bin/python3 -B -I - <<'PY' >"$log" 2>&1
          import importlib.util
          import json
          import os
          from pathlib import Path
          import pwd
          import shutil
          import subprocess
          import sys
          import tempfile
          import time

          path = Path('scripts/ci/capture_signed_app_build_origin_custody.py').resolve()
          spec = importlib.util.spec_from_file_location('nembra_retirement_candidate', path)
          if spec is None or spec.loader is None:
              raise SystemExit('could not load retirement candidate')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          field_name = os.environ.get('SUDO_USER', '')
          if not field_name:
              raise SystemExit('sudo did not identify the real runner field account')
          field = pwd.getpwnam(field_name)
          field_groups = tuple(sorted(set(os.getgrouplist(field.pw_name, field.pw_gid))))
          if field.pw_uid <= 0 or field.pw_gid <= 0 or any(value <= 0 for value in field_groups):
              raise SystemExit('field authority vector is invalid')

          uid = module._choose_ephemeral_id()
          name = f'nembralight{uid}'
          root = Path(tempfile.mkdtemp(prefix='nembra-light-retirement.', dir='/private/tmp'))
          home = root / 'home'
          home.mkdir(mode=0o700)
          sentinel = root / 'retired-owned.bin'
          child = None
          created = False
          try:
              module._create_local_build_identity(name, uid, uid, home)
              created = True
              sentinel.write_bytes(b'retired-owner-sentinel\n')
              os.chown(sentinel, uid, uid)
              os.chmod(sentinel, 0o600)
              child = subprocess.Popen(
                  ['/bin/sleep', '120'],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  env={'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','HOME':'/var/empty','LANG':'C','LC_ALL':'C'},
                  **module._structured_credentials(uid, uid, ()),
              )
              time.sleep(0.15)
              live, _ = module._process_state_for_uid(uid)
              if child.pid not in live:
                  raise SystemExit(f'lightweight dedicated UID process was not observable: {live}')

              module._remove_local_build_identity(name, uid, require_absent=True)
              created = False
              try:
                  child.wait(timeout=2.0)
              except subprocess.TimeoutExpired as error:
                  raise SystemExit('retired lightweight process did not reap') from error
              live, zombies = module._process_state_for_uid(uid)
              if live or zombies:
                  raise SystemExit(f'lightweight retired UID still has process entries: live={live} zombies={zombies}')

              domain_present, _, _ = module._launch_domain_state(uid)
              if domain_present and not module._numeric_principal_in_use(uid):
                  raise SystemExit('lingering launch domain did not block numeric UID reuse after child reap')

              field_probe_source = r'''
import json
import os
from pathlib import Path
import subprocess
import sys
uid=int(sys.argv[1]); sentinel=Path(sys.argv[2]); out={}
def denied(key, operation):
    try:
        operation()
    except PermissionError:
        out[key]=True
    except OSError as error:
        if error.errno in (1,13): out[key]=True
        else: raise
    else:
        out[key]=False
denied('setgroupsDenied', lambda: os.setgroups([uid]))
denied('setgidDenied', lambda: os.setgid(uid))
denied('setuidDenied', lambda: os.setuid(uid))
denied('retiredOwnedReadDenied', lambda: sentinel.read_bytes())
denied('retiredOwnedWriteDenied', lambda: sentinel.write_bytes(b'field-attack'))
asuser=subprocess.run(['/bin/launchctl','asuser',str(uid),'/usr/bin/true'],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,check=False)
out['launchctlAsuserDenied']=asuser.returncode != 0
out['launchctlAsuserReturnCode']=asuser.returncode
print(json.dumps(out,sort_keys=True,separators=(',',':')))
'''
              field_probe = subprocess.run(
                  ['/usr/bin/python3','-B','-I','-c',field_probe_source,str(uid),str(sentinel)],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
                  env={'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','HOME':field.pw_dir,'USER':field.pw_name,'LOGNAME':field.pw_name,'LANG':'C','LC_ALL':'C'},
                  **module._structured_credentials(field.pw_uid, field.pw_gid, field_groups),
              )
              if field_probe.returncode != 0:
                  raise SystemExit(f'ordinary-field authority probe failed unexpectedly: {field_probe.stderr[-800:]}')
              payload = json.loads(field_probe.stdout)
              required = ('setgroupsDenied','setgidDenied','setuidDenied','retiredOwnedReadDenied','retiredOwnedWriteDenied','launchctlAsuserDenied')
              if any(payload.get(key) is not True for key in required):
                  raise SystemExit(f'ordinary field retained retired-principal authority: {payload}')
              if sentinel.read_bytes() != b'retired-owner-sentinel\n':
                  raise SystemExit('ordinary-field probe changed retired-owned sentinel')
              print('NEMBRA_LIGHTWEIGHT_FIELD_AUTHORITY_JSON=' + json.dumps({
                  'schema':1,
                  'domainLingeringAfterChildReap':domain_present,
                  'numericReuseBlockedIfDomainLingering':(not domain_present) or module._numeric_principal_in_use(uid),
                  'setgroupsDenied':True,
                  'setgidDenied':True,
                  'setuidDenied':True,
                  'retiredOwnedReadDenied':True,
                  'retiredOwnedWriteDenied':True,
                  'launchctlAsuserDenied':True,
                  'launchctlAsuserReturnCode':payload['launchctlAsuserReturnCode'],
                  'physicalAuthorityCreated':False,
              },sort_keys=True,separators=(',',':')))
              print('NEMBRA_LIGHTWEIGHT_BUILD_UID_RETIREMENT_ACCEPTED physicalAuthorityCreated=false')
          finally:
              if child is not None and child.poll() is None:
                  child.kill()
                  try: child.wait(timeout=1.0)
                  except Exception: pass
              if created:
                  module._remove_local_build_identity(name, uid, require_absent=False)
              shutil.rmtree(root, ignore_errors=True)
          PY
          cat "$log"
          grep -Fq 'NEMBRA_LIGHTWEIGHT_BUILD_UID_RETIREMENT_ACCEPTED physicalAuthorityCreated=false' "$log"
          grep -Fq 'NEMBRA_BUILD_UID_LAUNCH_DOMAIN_RETIREMENT_JSON=' "$log"
          grep -Fq 'NEMBRA_BUILD_UID_RETIREMENT_JSON=' "$log"
          grep -Fq 'NEMBRA_LIGHTWEIGHT_FIELD_AUTHORITY_JSON=' "$log"
          /usr/bin/python3 -B -I - "$log" <<'PY'
          import json,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          launch_marker='NEMBRA_BUILD_UID_LAUNCH_DOMAIN_RETIREMENT_JSON='
          field_marker='NEMBRA_LIGHTWEIGHT_FIELD_AUTHORITY_JSON='
          launch=[json.loads(line[len(launch_marker):]) for line in lines if line.startswith(launch_marker)]
          field=[json.loads(line[len(field_marker):]) for line in lines if line.startswith(field_marker)]
          if len(launch) != 1 or len(field) != 1:
              raise SystemExit(f'expected one launch + one field authority marker, found {len(launch)} / {len(field)}')
          item=launch[0]
          assert item['schema'] == 5
          assert item['zeroLiveProvedBeforeDSDelete'] is True
          assert item['directRecordDeletionRequestedBeforeDomainClassification'] is True
          assert item['zeroLiveQuiescenceProved'] is True
          assert item['physicalAuthorityCreated'] is False
          if item['domainLingeringAtRetirement']:
              assert item['numericReuseBlockedAtRetirement'] is True
          authority=field[0]
          assert authority['schema'] == 1
          assert authority['setgroupsDenied'] is True
          assert authority['setgidDenied'] is True
          assert authority['setuidDenied'] is True
          assert authority['retiredOwnedReadDenied'] is True
          assert authority['retiredOwnedWriteDenied'] is True
          assert authority['launchctlAsuserDenied'] is True
          assert authority['numericReuseBlockedIfDomainLingering'] is True
          assert authority['physicalAuthorityCreated'] is False
          PY

      - name: Execute exact real-Xcode custody fixture with converged retirement candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          log="$RUNNER_TEMP/build-uid-retirement-convergence-real-xcode.log"
          set +e
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          printf '%s\n' "$status" > "$RUNNER_TEMP/build-uid-retirement-convergence-real-xcode.status"
          test "$status" -eq 0
          grep -Fq 'NEMBRA_REAL_XCODE_ORIGIN_JSON=' "$log"
          grep -Fq 'NEMBRA_BUILD_UID_LAUNCH_DOMAIN_RETIREMENT_JSON=' "$log"
          grep -Fq 'NEMBRA_BUILD_UID_RETIREMENT_JSON=' "$log"
          if grep -Fq 'NEMBRA_REAL_XCODE_ORIGIN_ERROR=' "$log"; then
            echo 'ERROR: real-Xcode fixture emitted an authority failure.' >&2
            exit 1
          fi

      - name: Require real-Xcode + retirement semantic evidence
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - "$RUNNER_TEMP/build-uid-retirement-convergence-real-xcode.log" <<'PY'
          import json
          from pathlib import Path
          import sys

          lines=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          real_marker='NEMBRA_REAL_XCODE_ORIGIN_JSON='
          launch_marker='NEMBRA_BUILD_UID_LAUNCH_DOMAIN_RETIREMENT_JSON='
          retire_marker='NEMBRA_BUILD_UID_RETIREMENT_JSON='
          real=[json.loads(line[len(real_marker):]) for line in lines if line.startswith(real_marker)]
          launch=[json.loads(line[len(launch_marker):]) for line in lines if line.startswith(launch_marker)]
          retire=[json.loads(line[len(retire_marker):]) for line in lines if line.startswith(retire_marker)]
          if len(real) != 1 or not launch or not retire:
              raise SystemExit(f'missing real-Xcode/launch/retirement evidence: {len(real)} / {len(launch)} / {len(retire)}')
          evidence=real[0]
          required=(
              evidence.get('schemaVersion') == 5
              and evidence.get('buildEffectiveGroupAuthorityAttested') is True
              and evidence.get('execBoundCredentialAttestationUsed') is True
              and evidence.get('buildIdentityDistinctFromField') is True
              and evidence.get('xcodebuildReturnCode') == 0
              and evidence.get('nonForcedDetachReturnCode') == 0
              and evidence.get('readonlyNonForcedDetachReturnCode') == 0
              and evidence.get('buildPrincipalRetired') is True
              and evidence.get('compilerProductSHA256') == evidence.get('readonlyRemountSHA256')
              and evidence.get('physicalAuthorityCreated') is False
          )
          if not required:
              raise SystemExit(f'real-Xcode authority evidence failed: {evidence}')
          for item in launch:
              assert item['schema'] == 5
              assert item['zeroLiveProvedBeforeDSDelete'] is True
              assert item['directRecordDeletionRequestedBeforeDomainClassification'] is True
              assert item['zeroLiveQuiescenceProved'] is True
              assert item['physicalAuthorityCreated'] is False
              if item['domainLingeringAtRetirement']:
                  assert item['numericReuseBlockedAtRetirement'] is True
          for item in retire:
              assert item['schema'] == 2
              assert item['directUserRecordPresent'] is False
              assert item['directGroupRecordPresent'] is False
              assert item['liveUIDProcesses'] == []
              assert item['physicalAuthorityCreated'] is False
              if item['staleLookupCount']:
                  assert item['numericReuseBlockedWhileStale'] is True
          print('BUILD_UID_RETIREMENT_CONVERGENCE_ACCEPTED physicalAuthorityCreated=false')
          PY

      - name: Restore exact production bytes
        if: always()
        shell: bash
        env:
          EXACT_PARENT: 3568250ee02556185610dd895e3f6d1c8f28dd33
        run: |
          set -euo pipefail
          helper='scripts/ci/capture_signed_app_build_origin_custody.py'
          test -f "$RUNNER_TEMP/capture_signed_app_build_origin_custody.py.original"
          cp "$RUNNER_TEMP/capture_signed_app_build_origin_custody.py.original" "$helper"
          test "$(git diff --name-only "$EXACT_PARENT"...HEAD)" = '.github/workflows/capture-build-uid-retirement-convergence.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' 'VALIDATION ONLY. Production bytes restored. PHYSICAL NO-GO.'

      - name: Retain sanitized retirement evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capture-build-uid-retirement-convergence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/build-uid-lightweight-retirement.log
            ${{ runner.temp }}/build-uid-retirement-convergence-real-xcode.log
            ${{ runner.temp }}/build-uid-retirement-convergence-real-xcode.status
          if-no-files-found: warn
          retention-days: 30
