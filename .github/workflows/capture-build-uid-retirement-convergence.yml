name: Capture Build UID Retirement Convergence

on:
  pull_request:
    paths:
      - .github/workflows/capture-build-uid-retirement-convergence.yml
      - scripts/ci/tests/test_capture_build_uid_retirement_convergence.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-build-uid-retirement-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retirement-convergence:
    name: Prove build UID retirement convergence
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact current carrier and validation-only scope
        shell: bash
        env:
          EXACT_PARENT: 3568250ee02556185610dd895e3f6d1c8f28dd33
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          git cat-file -e "${EXACT_PARENT}^{commit}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-build-uid-retirement-convergence.yml \
            scripts/ci/tests/test_capture_build_uid_retirement_convergence.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Compile and pin fail-closed authority boundary
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -m py_compile scripts/ci/tests/test_capture_build_uid_retirement_convergence.py
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          source = Path('scripts/ci/tests/test_capture_build_uid_retirement_convergence.py').read_text(encoding='utf-8')
          required = (
              'domain_present, _, _ = _launch_domain_state(candidate)',
              'retired build UID regained live process authority during launch-domain quiescence',
              'lingering launch-domain metadata would permit premature numeric principal reuse',
              'Boot-out failed: 124: Domain is tearing down',
              'directUserRecordPresent',
              'directGroupRecordPresent',
              'launchctlAsuserDenied',
              'retiredOwnedReadDenied',
              'retiredOwnedWriteDenied',
              'setgroupsDenied',
              'setgidDenied',
              'setuidDenied',
              'test_capture_signed_app_real_xcode_group_custody.py',
              'candidateProductionBytesPersisted": False',
              'physicalAuthorityCreated": False',
          )
          missing = [fragment for fragment in required if fragment not in source]
          if missing:
              raise SystemExit('missing retirement convergence invariant(s): ' + repr(missing))
          forbidden = (
              'NEMBRA_TUYA_APP_KEY',
              'NEMBRA_TUYA_APP_SECRET',
              'CBCentralManager',
              'CoreBluetooth',
              'devicectl',
              'allowProvisioningUpdates',
              'allowProvisioningDeviceRegistration',
          )
          for fragment in forbidden:
              if fragment in source:
                  raise SystemExit('retirement convergence crossed forbidden product/physical boundary: ' + fragment)
          PY

      - name: Execute lightweight + real-Xcode retirement oracles
        shell: bash
        env:
          EXACT_PARENT: 3568250ee02556185610dd895e3f6d1c8f28dd33
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          OUT="$RUNNER_TEMP/capture-build-uid-retirement-convergence"
          mkdir -m 700 "$OUT"
          set +e
          /usr/bin/python3 -B -I \
            scripts/ci/tests/test_capture_build_uid_retirement_convergence.py \
            --expected-parent "$EXACT_PARENT" \
            --output-dir "$OUT" \
            >"$OUT/runner.stdout.log" \
            2>"$OUT/runner.stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$OUT/runner.status"
          cat "$OUT/runner.stdout.log"
          cat "$OUT/runner.stderr.log" >&2
          for log in \
            "$OUT/build-uid-lightweight-retirement.log" \
            "$OUT/build-uid-retirement-convergence-real-xcode.log"; do
            if test -f "$log"; then cat "$log"; fi
          done
          test "$status" -eq 0
          /usr/bin/python3 -B -I - "$OUT/build-uid-retirement-convergence-summary.json" "$EXACT_PARENT" <<'PY'
          import json,sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload['schema'] == 1
          assert payload['productionParent'] == sys.argv[2]
          assert payload['lightweightAccepted'] is True
          assert payload['ordinaryFieldAuthorityDenied'] is True
          assert payload['realXcodeAccepted'] is True
          assert payload['candidateProductionBytesPersisted'] is False
          assert payload['physicalAuthorityCreated'] is False
          PY
          shasum -a 256 "$OUT"/* | tee "$OUT/evidence.sha256"

      - name: Restore exact production workspace bytes
        if: always()
        shell: bash
        env:
          EXACT_PARENT: 3568250ee02556185610dd895e3f6d1c8f28dd33
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree -- scripts/ci/capture_signed_app_build_origin_custody.py
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/capture-build-uid-retirement-convergence.yml scripts/ci/tests/test_capture_build_uid_retirement_convergence.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' 'VALIDATION ONLY. Production workspace bytes restored. PHYSICAL NO-GO.'

      - name: Retain sanitized convergence evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capture-build-uid-retirement-convergence-${{ github.run_id }}
          path: ${{ runner.temp }}/capture-build-uid-retirement-convergence/
          if-no-files-found: warn
          retention-days: 30
