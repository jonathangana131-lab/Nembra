name: Temp ES80 final staging ownership repair

on:
  push:
    branches:
      - fix/es80-v14-final-staging-ownership-current

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused ownership repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          producer = Path('scripts/ci/xcode27_signed_field_candidate.sh')
          source = producer.read_text()

          replacements = [
              (
                  'FINAL_STAGING_DIR="$ARTIFACTS_PARENT/.nembra-field-candidate-$BUILD_INSTANCE_ID.staging"\n',
                  'FINAL_STAGING_DIR="$ARTIFACTS_PARENT/.nembra-field-candidate-$BUILD_INSTANCE_ID.staging"\nFINAL_STAGING_OWNED=0\n',
              ),
              (
                  '  if [[ -n "${FINAL_STAGING_DIR:-}" && -e "$FINAL_STAGING_DIR" ]]; then\n    rm -rf "$FINAL_STAGING_DIR"\n  fi\n',
                  '  if [[ "${FINAL_STAGING_OWNED:-0}" == "1" && -n "${FINAL_STAGING_DIR:-}" && -e "$FINAL_STAGING_DIR" ]]; then\n    rm -rf "$FINAL_STAGING_DIR"\n  fi\n',
              ),
              (
                  'mkdir "$FINAL_STAGING_DIR"\ncp -p "$EXPORT_OPTIONS_SNAPSHOT" "$FINAL_STAGING_DIR/ExportOptions.plist"\n',
                  'mkdir "$FINAL_STAGING_DIR"\nFINAL_STAGING_OWNED=1\ncp -p "$EXPORT_OPTIONS_SNAPSHOT" "$FINAL_STAGING_DIR/ExportOptions.plist"\n',
              ),
              (
                  '# Ownership moved atomically to ARTIFACTS_DIR; cleanup must never target the published candidate.\nFINAL_STAGING_DIR=""\n',
                  '# Ownership moved atomically to ARTIFACTS_DIR; cleanup must never target the published candidate.\nFINAL_STAGING_OWNED=0\nFINAL_STAGING_DIR=""\n',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one producer replacement target: {old!r}')
              source = source.replace(old, new, 1)
          producer.write_text(source)

          tests = Path('scripts/ci/tests/test_xcode27_signed_field_candidate_source.py')
          test_source = tests.read_text()
          anchor = "        self.assertIn('FINAL_STAGING_DIR=\"$ARTIFACTS_PARENT/.nembra-field-candidate-$BUILD_INSTANCE_ID.staging\"', self.source)\n"
          insertion = anchor + "        self.assertIn('FINAL_STAGING_OWNED=0', self.source)\n        self.assertIn('FINAL_STAGING_OWNED=1', self.source)\n        self.assertIn('if [[ \"${FINAL_STAGING_OWNED:-0}\" == \"1\"', self.source)\n        self.assertEqual(self.source.count('FINAL_STAGING_OWNED=1'), 1)\n        self.assertLess(\n            self.source.index('mkdir \"$FINAL_STAGING_DIR\"'),\n            self.source.index('FINAL_STAGING_OWNED=1'),\n        )\n        self.assertLess(\n            self.source.index('FINAL_STAGING_OWNED=1'),\n            self.source.index('rename_exclusive(source, destination'),\n        )\n        self.assertLess(\n            self.source.index('rename_exclusive(source, destination'),\n            self.source.rindex('FINAL_STAGING_OWNED=0'),\n        )\n"
          if test_source.count(anchor) != 1:
              raise SystemExit('expected exactly one final staging test anchor')
          test_source = test_source.replace(anchor, insertion, 1)
          tests.write_text(test_source)
          PY

      - name: Validate repair
        run: |
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          git diff --check

      - name: Commit product-only result
        run: |
          git config user.name "nembra-v14-transform"
          git config user.email "nembra-v14-transform@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-final-staging-ownership.yml
          git add scripts/ci/xcode27_signed_field_candidate.sh scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          git commit -m "[Capture producer v14] Own final staging before cleanup"
          git push origin HEAD:${GITHUB_REF_NAME}
