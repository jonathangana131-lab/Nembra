name: Materialize Capture provenance and status truth

on:
  push:
    branches:
      - agent/v14-capture-provenance-status-truth-sol
    paths:
      - .github/workflows/materialize-v14-capture-provenance-status-truth.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Verify exact construction parent
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          expected_source_blob='c58be3f6bc0cf33a9f6d0d950b7d011ff8aa1d25'
          workflow='.github/workflows/materialize-v14-capture-provenance-status-truth.yml'
          git merge-base --is-ancestor "$expected_parent" HEAD
          test "$(git rev-parse "HEAD:NembraApp/App/NembraCaptureEntrypoint.swift")" = "$expected_source_blob"
          changed="$(git diff --name-only "$expected_parent"..HEAD)"
          test "$changed" = "$workflow"

      - name: Apply exact truth repairs and regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()

          status_old = '''        membershipDeviceID = nil
                  membershipRequestID = UUID()
          '''
          status_new = '''        membershipDeviceID = nil
                  membershipStatus = "Exact scooter membership must be verified again for this Secure Link attempt."
                  membershipRequestID = UUID()
          '''
          if source.count(status_old) != 2:
              raise SystemExit(f'expected exactly two membership revocation seams, found {source.count(status_old)}')
          source = source.replace(status_old, status_new)

          generation_old = ']) { current, _ in current })'
          generation_new = ']) { _, trusted in trusted })'
          if source.count(generation_old) != 1:
              raise SystemExit(f'expected exactly one untrusted generation merge seam, found {source.count(generation_old)}')
          source = source.replace(generation_old, generation_new)
          path.write_text(source)
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application event metadata precedence")
          struct TuyaApplicationEventMetadataPrecedenceSourceTests {
              @Test("SDK application keys cannot overwrite Nembra generation provenance")
              func trustedGenerationWinsReservedKeyCollision() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let receiver = String(try section(
                      in: source,
                      from: "private func receivedApplicationUpdate(",
                      to: "private func startWatchdog"
                  ))

                  #expect(receiver.contains("log(\"tuya_application_update\""))
                  #expect(receiver.contains("\"generation\": String(token.diagnosticGeneration)"))
                  #expect(!receiver.contains(") { current, _ in current })"))
                  #expect(
                      receiver.contains(") { _, trusted in trusted })")
                          || receiver.contains("{ trusted, _ in trusted }")
                  )
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          SWIFT

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Secure Link membership status revocation")
          struct TuyaSecureLinkViewMembershipStatusRevocationSourceTests {
              @Test("view exit and foreground loss revoke verified copy with the membership proof")
              func lifecycleRevocationsResetMembershipStatusWithProof() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = String(try section(
                      in: source,
                      from: "private final class SecureLinkController",
                      to: "@MainActor\nprivate protocol OfficialTuyaDriver"
                  ))
                  let viewExit = String(try section(
                      in: controller,
                      from: "func abandonCorrelationForViewExit()",
                      to: "func appDidLoseForeground()"
                  ))
                  let foregroundLoss = String(try section(
                      in: controller,
                      from: "func appDidLoseForeground()",
                      to: "var privateConfig: Bool"
                  ))

                  for cleanup in [viewExit, foregroundLoss] {
                      let clearVerified = try requiredOffset(
                          containing: "sdkDeviceMembershipVerified = false",
                          in: cleanup
                      )
                      let statusReset = try requiredOffset(
                          containing: "membershipStatus = \"Exact scooter membership must be verified again for this Secure Link attempt.\"",
                          in: cleanup
                      )
                      let revokeMembershipRequest = try requiredOffset(
                          containing: "membershipRequestID = UUID()",
                          in: cleanup
                      )

                      #expect(clearVerified < statusReset)
                      #expect(statusReset < revokeMembershipRequest)
                      #expect(!cleanup.contains("membershipStatus = \"Exact scooter membership verified and leased to this current SDK account.\""))
                  }
              }

              @Test("revoked authority exposes explicit re-verification copy")
              func revokedMembershipRendersReverificationCopy() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let controller = String(try section(
                      in: source,
                      from: "private final class SecureLinkController",
                      to: "@MainActor\nprivate protocol OfficialTuyaDriver"
                  ))
                  #expect(controller.contains("membershipStatus = \"Exact scooter membership must be verified again for this Secure Link attempt.\""))
              }

              private func requiredOffset(containing token: String, in source: String) throws -> String.Index {
                  guard let range = source.range(of: token) else {
                      Issue.record("Expected source token missing: \(token)")
                      throw SourceContractError.sectionMissing
                  }
                  return range.lowerBound
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          SWIFT

          rm .github/workflows/materialize-v14-capture-provenance-status-truth.yml

      - name: Validate effective scope and source invariants
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/materialize-v14-capture-provenance-status-truth.yml'
          expected_paths=$'.github/workflows/materialize-v14-capture-provenance-status-truth.yml\nNembraApp/App/NembraCaptureEntrypoint.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift'
          test ! -e "$workflow"
          actual_paths="$(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)"
          printf 'Materialized working-tree scope:\n%s\n' "$actual_paths"
          test "$actual_paths" = "$(printf '%s\n' "$expected_paths" | sort)"
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          git diff --check
          /usr/bin/python3 <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          assert source.count('membershipStatus = "Exact scooter membership must be verified again for this Secure Link attempt."') == 2
          assert ']) { current, _ in current })' not in source
          assert source.count(']) { _, trusted in trusted })') == 1
          assert source.count('"generation": String(token.diagnosticGeneration)') >= 1
          generation_test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift').read_text()
          status_test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift').read_text()
          assert 'trustedGenerationWinsReservedKeyCollision' in generation_test
          assert 'lifecycleRevocationsResetMembershipStatusWithProof' in status_test
          PY

      - name: Commit materialized successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift \
            .github/workflows/materialize-v14-capture-provenance-status-truth.yml
          git commit -m 'fix(capture): bind provenance and revoked status truth'
          git push origin HEAD:agent/v14-capture-provenance-status-truth-sol
