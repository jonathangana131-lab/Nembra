name: Capture TODAY Single Final GO Entrypoint Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_final_go_record.py
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_final_go_single_entrypoint.py
      - .github/workflows/capture-today-single-final-go-entrypoint-qa.yml

permissions:
  contents: read

jobs:
  single-entrypoint:
    name: Reject legacy Final GO executable authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile single-entrypoint regression
        run: python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_single_entrypoint.py
      - name: Require the legacy Final GO CLI to fail closed
        run: python3 scripts/ci/tests/test_es80_today_final_go_single_entrypoint.py -v
