name: Agent ES80 compose explicit charger preflight

on:
  push:
    branches:
      - capture-v14-recovery-failure-atomicity

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture-v14-recovery-failure-atomicity
          fetch-depth: 0

      # Product commits are path-disjoint from the package-only recovery/authority spine.
      - name: Cherry-pick reviewed charger preflight commits only
        shell: bash
        run: |
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin feature/es80-v14-explicit-charger-preflight/gpt56-go
          git cherry-pick 9f391f22ed505b49fa7a0e5232074e74ac6a9d34
          git cherry-pick b72b1ba8de7324d0920c306841f9e65a4d4bfece
          rm .github/workflows/agent-es80-compose-charger-preflight.yml
          git add .github/workflows/agent-es80-compose-charger-preflight.yml
          git commit -m 'chore(capture): remove temporary charger compose workflow'
          git push origin HEAD:capture-v14-recovery-failure-atomicity
