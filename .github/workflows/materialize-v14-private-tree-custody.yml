name: Materialize V14 Private Tree Custody

on:
  push:
    branches:
      - sol/v14-capture-private-tree-custody-38c69

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "38c69bcf6660f42468c954a9196f35d3bdff2680"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-v14-private-tree-custody.yml"

      - name: Apply descriptor custody and close tree snapshot race
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin a5cb12ed97241ba274d23f311d67cf84623ceb29 4401e6a31e227273da20220d351b1b85e63faa5b
          git diff --binary a5cb12ed97241ba274d23f311d67cf84623ceb29..4401e6a31e227273da20220d351b1b85e63faa5b -- \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_provenance.py | git apply --index

          python3 - <<'PY'
          import base64
          from pathlib import Path

          helper = Path('Scripts/capture_tuya_private_input_provenance.py')
          source = helper.read_text(encoding='utf-8')
          start = source.index('def _tree_fingerprint(')
          end = source.index('\ndef build_record(', start)
          replacement = base64.b64decode('').decode('utf-8')
          source = source[:start] + replacement + source[end + 1:]
          helper.write_text(source, encoding='utf-8')

          tests = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py')
          test_source = tests.read_text(encoding='utf-8')
          new_tests = base64.b64decode('').decode('utf-8')
          anchor = '    def test_record_symlink_is_rejected(self) -> None:\n'
          if test_source.count(anchor) != 1:
              raise SystemExit('test insertion anchor missing')
          test_source = test_source.replace(anchor, new_tests + anchor, 1)
          tests.write_text(test_source, encoding='utf-8')
          PY

      - name: Validate focused private provenance custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          s = Path('Scripts/capture_tuya_private_input_provenance.py').read_text(encoding='utf-8')
          assert 'os.open(path, flags)' in s
          assert 'lockfile.read_bytes()' not in s
          assert 'observed_directory_members' in s
          assert '_directory_member_names(directory) != members' in s
          assert '_assert_unchanged_tree_entry(path, identity, "F")' in s
          t = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py').read_text(encoding='utf-8')
          assert 'test_tree_rejects_file_replacement_after_individual_fingerprint' in t
          assert 'test_tree_rejects_entry_added_after_directory_enumeration' in t
          PY
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' 'Scripts/capture_tuya_private_input_provenance.py' 'scripts/ci/tests/test_capture_tuya_private_input_provenance.py' | sort)"

      - name: Commit clean closure checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-v14-private-tree-custody.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(capture): bind private tree fingerprints to stable snapshots"
          git push origin HEAD:sol/v14-capture-private-tree-custody-38c69
