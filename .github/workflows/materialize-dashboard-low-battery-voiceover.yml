name: Materialize Dashboard Low Battery VoiceOver

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - recovery/v14-dashboard-energyrail-current-main-sol2
    paths:
      - '.github/workflows/materialize-dashboard-low-battery-voiceover.yml'
      - 'NembraAppTests/DashboardLowBatteryAccessibilitySourceTests.swift'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/v14-dashboard-low-battery-voiceover-c5cb-sol
          fetch-depth: 0

      - name: Guard exact inspected Dashboard source
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/Features/Dashboard/DashboardView.swift)" = "5a9f8a4fc868a58138abf8d5217bcaa10be4cd08"
          git merge-base --is-ancestor c5cb2e16374108a070cb292fddeaa39e7cfd82f7 HEAD

      - name: Apply bounded accessibility repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/Features/Dashboard/DashboardView.swift')
          source = path.read_text()

          old_compact = '''        .accessibilityElement(children: .ignore)\n        .accessibilityLabel(title)\n        .accessibilityValue(retained && value != "—" ? "Last known \\(value)" : value)\n    }\n\n    @ViewBuilder\n    private var accessibilityControlStrip: some View {'''
          new_compact = '''        .accessibilityElement(children: .ignore)\n        .accessibilityLabel(title)\n        .accessibilityValue(compactMetricAccessibilityValue(title: title, value: value, warning: warning, retained: retained))\n    }\n\n    private func compactMetricAccessibilityValue(\n        title: String,\n        value: String,\n        warning: Bool,\n        retained: Bool\n    ) -> String {\n        if retained, value != "—" { return "Last known \\(value)" }\n        if warning, value != "—" { return "\\(title) low, \\(value)" }\n        return value\n    }\n\n    @ViewBuilder\n    private var accessibilityControlStrip: some View {'''
          if source.count(old_compact) != 1:
              raise SystemExit(f'expected one compact metric accessibility anchor, found {source.count(old_compact)}')
          source = source.replace(old_compact, new_compact)

          old_label = '.accessibilityLabel(batteryReadout == .charge ? "Battery" : "Estimated range")'
          new_label = '.accessibilityLabel(batteryReadout == .charge ? "Battery" : "Learned range")'
          if source.count(old_label) != 1:
              raise SystemExit(f'expected one range accessibility label anchor, found {source.count(old_label)}')
          source = source.replace(old_label, new_label)

          old_value = '''            if isRetainedBatteryData, batteryPercent != nil {\n                return "Last known \\(batteryText)"\n            }\n            if batteryPercent == nil {'''
          new_value = '''            if isRetainedBatteryData, batteryPercent != nil {\n                return "Last known \\(batteryText)"\n            }\n            if batteryInstrumentWarning {\n                return "Low battery, \\(batteryText)"\n            }\n            if batteryPercent == nil {'''
          if source.count(old_value) != 1:
              raise SystemExit(f'expected one battery accessibility value anchor, found {source.count(old_value)}')
          source = source.replace(old_value, new_value)

          path.write_text(source)
          PY

      - name: Verify focused contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/Features/Dashboard/DashboardView.swift').read_text()
          assert '.accessibilityValue(compactMetricAccessibilityValue(title: title, value: value, warning: warning, retained: retained))' in source
          assert 'if warning, value != "—" { return "\\(title) low, \\(value)" }' in source
          assert 'if batteryInstrumentWarning' in source
          assert 'return "Low battery, \\(batteryText)"' in source
          assert '.accessibilityLabel(batteryReadout == .charge ? "Battery" : "Learned range")' in source
          assert '.accessibilityLabel(batteryReadout == .charge ? "Battery" : "Estimated range")' not in source
          PY
          git diff --check

      - name: Publish clean repair commit
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-dashboard-low-battery-voiceover.yml
          git config user.name "nembra-sol-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/Features/Dashboard/DashboardView.swift NembraAppTests/DashboardLowBatteryAccessibilitySourceTests.swift
          git diff --cached --check
          git commit -m "fix(dashboard): announce low battery to VoiceOver"
          git push origin HEAD:repair/v14-dashboard-low-battery-voiceover-c5cb-sol
