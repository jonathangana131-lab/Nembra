name: "Temporary ES80 Horizon Dynamic Type evidence"

on:
  push:
    branches:
      - "qa/es80-v14-horizon-dynamic-type-evidence/gpt56-thinking-go"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply guarded visual-evidence transform
        shell: bash
        env:
          EXPECTED_PARENT: "c12b7898087e5788f54e8c0638db389b731bf4cf"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 scripts/ci/tmp_es80_v14_horizon_dynamic_type_evidence_gpt56.py
          git diff --check
          git config user.name "gpt56-thinking-go"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-v14-horizon-dynamic-type-evidence-gpt56.yml
          git rm scripts/ci/tmp_es80_v14_horizon_dynamic_type_evidence_gpt56.py
          git add NembraUITests/ES80ResearchCaptureUITests.swift
          git commit -m "test(capture): retain Horizon Dynamic Type visual evidence"
          git push origin HEAD:"${GITHUB_REF_NAME}"
