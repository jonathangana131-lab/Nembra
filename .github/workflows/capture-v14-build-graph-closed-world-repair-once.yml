name: Capture V14 build-graph closed-world repair once

on:
  push:
    branches:
      - repair/v14-capture-build-graph-closed-world-gpt56-go
    paths:
      - .github/workflows/capture-v14-build-graph-closed-world-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Harden build-graph custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/capture-xcode27-trusted-command.yml')
          source = workflow.read_text(encoding='utf-8')
          old = "/usr/bin/python3 - <<'PY'"
          new = "/usr/bin/python3 -I - <<'PY'"
          if source.count(old) != 1:
              raise SystemExit(f'expected one non-isolated build-graph interpreter, found {source.count(old)}')
          source = source.replace(old, new, 1)
          anchor = '          for relative, expected_blob in expected.items():\n'
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one build-graph loop anchor, found {source.count(anchor)}')
          guard = (
              '          canonical_scheme = "Nembra.xcodeproj/xcshareddata/xcschemes/Nembra.xcscheme"\n'
              '          scheme_candidates = sorted(\n'
              '              path.relative_to(root).as_posix()\n'
              '              for path in (root / "Nembra.xcodeproj").rglob("*.xcscheme")\n'
              '              if path.is_file() or path.is_symlink()\n'
              '          )\n'
              '          if scheme_candidates != [canonical_scheme]:\n'
              '              raise SystemExit("trusted build graph refuses alternate Xcode schemes: " + repr(scheme_candidates))\n'
              '\n'
              '          for package_relative in ("Packages/NembraCore", "Packages/NembraBluetoothCapture"):\n'
              '              package_root = root / package_relative\n'
              '              versioned_manifests = sorted(path.name for path in package_root.glob("Package@swift-*.swift"))\n'
              '              if versioned_manifests:\n'
              '                  raise SystemExit(f"trusted build graph refuses version-specific SwiftPM manifests in {package_relative}: " + repr(versioned_manifests))\n'
              '\n'
          )
          workflow.write_text(source.replace(anchor, guard + anchor, 1), encoding='utf-8')
          PY

          printf '%s' '' | base64 --decode > scripts/ci/tests/test_capture_trusted_xcode_build_graph_closed_world.py

          python3 - <<'PY'
          from pathlib import Path
          qa = Path('.github/workflows/capture-trusted-xcode-build-graph-custody-qa.yml')
          source = qa.read_text(encoding='utf-8')
          path_anchor = "      - 'scripts/ci/tests/test_capture_trusted_xcode_build_graph_custody.py'\n"
          run_anchor = "          python3 scripts/ci/tests/test_capture_trusted_xcode_build_graph_custody.py -v\n"
          if source.count(path_anchor) != 1 or source.count(run_anchor) != 1:
              raise SystemExit('unexpected build-graph QA anchors')
          source = source.replace(path_anchor, path_anchor + "      - 'scripts/ci/tests/test_capture_trusted_xcode_build_graph_closed_world.py'\n", 1)
          source = source.replace(run_anchor, run_anchor + "          python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_build_graph_closed_world.py\n          python3 scripts/ci/tests/test_capture_trusted_xcode_build_graph_closed_world.py -v\n", 1)
          qa.write_text(source, encoding='utf-8')
          PY

          new_blob="$(git hash-object .github/workflows/capture-xcode27-trusted-command.yml)"
          test "$new_blob" != '524b011c6147142281c3fed62d3bb402c7f2be63'
          python3 - "$new_blob" <<'PY'
          from pathlib import Path
          import sys
          old_blob = '524b011c6147142281c3fed62d3bb402c7f2be63'
          new_blob = sys.argv[1]
          for path in [Path('.github/workflows/capture-today-final-go-qa.yml'), Path('.github/workflows/capture-today-trusted-default-xcode-subject-qa.yml'), Path('scripts/ci/es80_today_trusted_capture_xcode_subject.py')]:
              source = path.read_text(encoding='utf-8')
              count = source.count(old_blob)
              if count < 1:
                  raise SystemExit(f'{path}: missing current trusted workflow pin')
              path.write_text(source.replace(old_blob, new_blob), encoding='utf-8')
              print(path, count)
          PY

          python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_build_graph_closed_world.py
          python3 scripts/ci/tests/test_capture_trusted_xcode_build_graph_closed_world.py -v
          python3 scripts/ci/tests/test_capture_trusted_xcode_build_graph_custody.py -v
          git diff --check

      - name: Commit repair and self-delete generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-closure-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/capture-v14-build-graph-closed-world-repair-once.yml
          git add .github/workflows/capture-xcode27-trusted-command.yml .github/workflows/capture-trusted-xcode-build-graph-custody-qa.yml .github/workflows/capture-today-final-go-qa.yml .github/workflows/capture-today-trusted-default-xcode-subject-qa.yml scripts/ci/es80_today_trusted_capture_xcode_subject.py scripts/ci/tests/test_capture_trusted_xcode_build_graph_closed_world.py
          git diff --cached --check
          git commit -m 'fix(capture): close trusted build-graph alias custody'
          git push origin HEAD:"$GITHUB_REF_NAME"
