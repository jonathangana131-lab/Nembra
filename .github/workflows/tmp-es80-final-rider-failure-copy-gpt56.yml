name: Temporary ES80 final rider failure-copy cleanup

on:
  push:
    branches:
      - product/es80-v14-final-rider-failure-copy-gpt56

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep raw package diagnostics out of rider failure states
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell_path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          source = shell_path.read_text(encoding="utf-8")

          old_idle = 'return .failed(coordinator.lastDiagnostic ?? "The passive target connection ended before an accepted observation could be sealed. Start a fresh Experiment One rather than replaying consumed authority.")'
          new_idle = 'return .failed("The scooter connection ended before this capture could be sealed. Start a fresh Experiment One.")'
          old_restart = 'localFailureMessage = "Nembra could not create a fresh Experiment One run: \\(String(describing: error))"'
          new_restart = 'localFailureMessage = "Nembra could not start a fresh Experiment One. Close and reopen Nembra, then try again."'

          for old, new in ((old_idle, new_idle), (old_restart, new_restart)):
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one current copy occurrence: {old}")
              source = source.replace(old, new)

          forbidden = [
              "coordinator.lastDiagnostic ??",
              "replaying consumed authority",
              "Nembra could not create a fresh Experiment One run:",
          ]
          leftovers = [phrase for phrase in forbidden if phrase in source]
          if leftovers:
              raise SystemExit(f"primary failure diagnostic leak remains: {leftovers}")

          shell_path.write_text(source, encoding="utf-8")

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift")
          test_source = test_path.read_text(encoding="utf-8")
          old_list_tail = '''            "package-owned Experiment One workflow",\n            "fresh package-owned Experiment One workflow"\n'''
          new_list_tail = '''            "package-owned Experiment One workflow",\n            "fresh package-owned Experiment One workflow",\n            "replaying consumed authority",\n            "coordinator.lastDiagnostic ??",\n            "Nembra could not create a fresh Experiment One run:"\n'''
          if test_source.count(old_list_tail) != 1:
              raise SystemExit("phase/restart forbidden-list anchor drifted")
          test_source = test_source.replace(old_list_tail, new_list_tail)

          loop_end = '''        }\n    }\n\n    @Test("engineering truth remains available in Details instead of being deleted")\n'''
          expectations = '''        }\n\n        #expect(helperSurface.contains("The scooter connection ended before this capture could be sealed."))\n        #expect(helperSurface.contains("Nembra could not start a fresh Experiment One. Close and reopen Nembra, then try again."))\n    }\n\n    @Test("engineering truth remains available in Details instead of being deleted")\n'''
          if test_source.count(loop_end) != 1:
              raise SystemExit("phase/restart expectation insertion anchor drifted")
          test_source = test_source.replace(loop_end, expectations)
          test_path.write_text(test_source, encoding="utf-8")
          PY

      - name: Verify truth and effective scope
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          shell = Path("NembraApp/Features/Research/ES80CaptureShellView.swift").read_text()
          required = [
              "guard status.physicalProcedurePermitted else",
              "PassiveBluetoothExperimentOneFinalShareIntegrity.inspect(artifact.json)",
              "finalShareIntegrityReport != nil",
              "Truth boundary",
              "CoreBluetooth",
              "does not authenticate the physical ES80",
              "es80.capture-shell",
          ]
          missing = [item for item in required if item not in shell]
          if missing:
              raise SystemExit(f"truth/action contract disappeared: {missing}")
          PY
          git diff -- NembraApp/Features/Research/ES80CaptureShellView.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift

      - name: Commit product copy and remove transformer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-final-rider-failure-copy-gpt56.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift
          git commit -m "fix(capture): keep raw diagnostics out of rider failures"
          git push origin HEAD:product/es80-v14-final-rider-failure-copy-gpt56
