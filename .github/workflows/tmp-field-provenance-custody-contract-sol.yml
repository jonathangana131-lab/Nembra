name: Temporary Field Provenance Custody Contract Repair

on:
  push:
    branches:
      - repair/v14-capture-field-provenance-custody-contract-sol
    paths:
      - .github/workflows/tmp-field-provenance-custody-contract-sol.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-field-provenance-custody-contract-sol
      - name: Repair secured-helper source contract and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_field_provenance_custody_contract_sol.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check
          rm -f .github/workflows/tmp-field-provenance-custody-contract-sol.yml
          rm -f scripts/ci/tmp_field_provenance_custody_contract_sol.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/capture-field-build-provenance.yml .github/workflows/tmp-field-provenance-custody-contract-sol.yml scripts/ci/tmp_field_provenance_custody_contract_sol.py
          git commit -m 'Capture: align provenance gate with accepted helper custody'
          git push origin HEAD:repair/v14-capture-field-provenance-custody-contract-sol
