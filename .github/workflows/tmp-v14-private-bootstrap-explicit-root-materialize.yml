name: Temporary V14 Private Bootstrap Explicit Root Materializer

on:
  push:
    branches:
      - repair/v14-private-bootstrap-explicit-root-gpt56-20260811

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-bootstrap-explicit-root-gpt56-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact starting subject
        shell: bash
        run: |
          set -euo pipefail
          TEST_PARENT=7cda879dafcc376c5125855af6038805767ae870
          git merge-base --is-ancestor "$TEST_PARENT" HEAD
          changed_from_parent="$(git diff --name-only "$TEST_PARENT"...HEAD | LC_ALL=C sort)"
          test "$changed_from_parent" = ".github/workflows/tmp-v14-private-bootstrap-explicit-root-materialize.yml"
          test "$(git hash-object Scripts/bootstrap_capture_tuya_sdk.sh)" = "f1a66b2c77f01c575b059bba9da9e44384356e30"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Replace only bootstrap root-resolution preamble
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("Scripts/bootstrap_capture_tuya_sdk.sh")
          source = path.read_text(encoding="utf-8")
          old = textwrap.dedent('''#!/bin/bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          REPO_ROOT="$(cd "$SCRIPT_DIR/.." && pwd)"
          ''')
          new = textwrap.dedent('''#!/bin/bash
          set -euo pipefail

          if [[ -n "${NEMBRA_ACCEPTED_SOURCE_ROOT:-}" ]]; then
            [[ "$NEMBRA_ACCEPTED_SOURCE_ROOT" == /* ]] || {
              echo "ERROR: explicit accepted source root must be absolute." >&2
              exit 19
            }
            PHYSICAL_CWD="$(pwd -P)"
            [[ "$NEMBRA_ACCEPTED_SOURCE_ROOT" == "$PHYSICAL_CWD" ]] || {
              unset PHYSICAL_CWD
              echo "ERROR: explicit accepted source root must equal the physical working directory." >&2
              exit 19
            }
            REPO_ROOT="$PHYSICAL_CWD"
            SCRIPT_DIR="$REPO_ROOT/Scripts"
            unset PHYSICAL_CWD NEMBRA_ACCEPTED_SOURCE_ROOT || true
          else
            SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd -P)"
            REPO_ROOT="$(cd "$SCRIPT_DIR/.." && pwd -P)"
          fi
          readonly SCRIPT_DIR REPO_ROOT
          ''')
          if source.count(old) != 1:
              raise SystemExit("expected bootstrap preamble was not present exactly once")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_bootstrap_verified_stdin_root.py
          git diff --check

      - name: Self-delete materializer and publish production change
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-v14-private-bootstrap-explicit-root-materialize.yml
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-v14-private-bootstrap-explicit-root-materialize.yml' \
            'Scripts/bootstrap_capture_tuya_sdk.sh' | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git config user.name "nembra-v14-materializer"
          git config user.email "nembra-v14-materializer@users.noreply.github.com"
          git add Scripts/bootstrap_capture_tuya_sdk.sh
          git commit -m "fix(capture): admit verified-stdin bootstrap root"
          git push origin HEAD:repair/v14-private-bootstrap-explicit-root-gpt56-20260811
