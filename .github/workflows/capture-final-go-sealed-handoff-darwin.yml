name: Capture Final GO Sealed Handoff Darwin Kqueue

on:
  pull_request:
    paths:
      - .github/workflows/capture-final-go-sealed-handoff-darwin.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin-kqueue-authority:
    name: Prove real Darwin vnode custody and sealed handoff
    runs-on: macos-15
    timeout-minutes: 15
    env:
      EXACT_PRODUCTION_PARENT: 899e5dc5cc5e71617bfe4151cdb1da20c576fbc2
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/nembra-finalgo-darwin-pycache
    steps:
      - name: Checkout immutable exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact production parent and validation-only delta
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git merge-base "$EXACT_PRODUCTION_PARENT" HEAD)" = "$EXACT_PRODUCTION_PARENT"
          mapfile -t changed < <(git diff --name-only "$EXACT_PRODUCTION_PARENT" HEAD | LC_ALL=C sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/capture-final-go-sealed-handoff-darwin.yml"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exact Final-GO and adversarial contracts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py \
            scripts/ci/tests/test_es80_final_go_sealed_candidate_handoff.py \
            scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py

      - name: Prove production selects real Darwin kqueue backend
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys

          path = Path("scripts/ci/es80_authenticated_stationary_private_review_final_go.py").resolve()
          spec = importlib.util.spec_from_file_location("nembra_final_go_darwin_backend_subject", path)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load Final-GO subject")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          backend = module._previous._default_backend()
          try:
              name = type(backend).__name__
              if name != "_KqueueMutationBackend":
                  raise SystemExit(f"expected _KqueueMutationBackend on Darwin, got {name}")
          finally:
              backend.close()
          PY

      - name: Replay #3024 and #3030 races through real kqueue custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py

      - name: Prove sealed handoff and committed-parent custody on Darwin
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_es80_final_go_sealed_candidate_handoff.py
          /usr/bin/python3 scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py

      - name: Diff and worktree hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXACT_PRODUCTION_PARENT" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
