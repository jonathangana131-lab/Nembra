name: Temporary ES80 schema-v2 closure hardening

on:
  push:
    branches:
      - recovery/es80-v14-field-evidence-v2-closure-gpt56

permissions:
  contents: write

jobs:
  atomic-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recovery/es80-v14-field-evidence-v2-closure-gpt56

      - name: Make signed-field evidence publication failure-atomic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('scripts/ci/es80_signed_field_artifact_evidence.py')
          text = p.read_text()
          start = text.index('def write_outputs(ipa_path: Path, output_dir: Path, inspection: dict) -> dict[str, Path]:')
          end = text.index('\n\ndef self_test() -> None:', start)
          replacement = textwrap.dedent('''
          def write_outputs(ipa_path: Path, output_dir: Path, inspection: dict) -> dict[str, Path]:
              """Publish the complete evidence set only after every staged subject re-verifies."""
              ipa_path = ipa_path.resolve()
              output_dir = output_dir.resolve()
              if output_dir.exists():
                  raise EvidenceError(f"refusing to overwrite existing field evidence directory: {output_dir}")

              field_evidence = inspection["field_evidence"]
              external_bytes = inspection["external_bytes"]
              field_bytes = canonical_json_bytes(field_evidence)
              if sha256_file(ipa_path) != field_evidence["ipaSHA256"]:
                  raise EvidenceError("input IPA digest diverged after inspection")
              if hashlib.sha256(external_bytes).hexdigest() != field_evidence["externalBuildRecordSHA256"]:
                  raise EvidenceError("external build record digest diverged from field evidence")

              output_dir.parent.mkdir(parents=True, exist_ok=True)
              staging = Path(tempfile.mkdtemp(prefix=f".{output_dir.name}.staging-", dir=str(output_dir.parent)))
              try:
                  retained_ipa = staging / "build-evidence" / "NembraField.ipa"
                  retained_ipa.parent.mkdir(parents=True, exist_ok=True)
                  external_path = staging / "NembraCaptureExternalBuildRecord.json"
                  field_path = staging / "NembraCaptureSignedFieldArtifactEvidence.json"

                  shutil.copy2(ipa_path, retained_ipa)
                  external_path.write_bytes(external_bytes)
                  field_path.write_bytes(field_bytes)

                  if sha256_file(retained_ipa) != field_evidence["ipaSHA256"]:
                      raise EvidenceError("retained IPA bytes diverged from inspected input")
                  if sha256_file(external_path) != field_evidence["externalBuildRecordSHA256"]:
                      raise EvidenceError("written external build record digest diverged from field evidence")
                  if field_path.read_bytes() != field_bytes:
                      raise EvidenceError("written signed-field evidence bytes diverged from staged evidence")

                  if output_dir.exists():
                      raise EvidenceError(f"field evidence directory appeared during staging: {output_dir}")
                  staging.rename(output_dir)
              except Exception:
                  if staging.exists():
                      shutil.rmtree(staging, ignore_errors=True)
                  raise

              return {
                  "retained_ipa": output_dir / "build-evidence" / "NembraField.ipa",
                  "external_record": output_dir / "NembraCaptureExternalBuildRecord.json",
                  "field_evidence": output_dir / "NembraCaptureSignedFieldArtifactEvidence.json",
              }
          ''').lstrip()
          p.write_text(text[:start] + replacement + text[end:])

          t = Path('scripts/ci/tests/test_es80_signed_field_artifact_evidence.py')
          tests = t.read_text()
          if 'from unittest import mock\n' not in tests:
              tests = tests.replace('import unittest\n', 'import unittest\nfrom unittest import mock\n', 1)
          anchor = '    def test_source_bundle_platform_and_build_label_mismatches_fail_closed(self):\n'
          method = textwrap.dedent('''
              def test_write_outputs_failure_never_publishes_partial_final_directory(self):
                  with tempfile.TemporaryDirectory() as temp:
                      root = Path(temp)
                      ipa = root / "Nembra.ipa"
                      make_ipa(ipa)
                      inspection = signed_field_evidence.inspect_ipa(ipa, HEAD, signing_probe=fake_signing_probe)
                      output = root / "field-evidence"

                      with mock.patch.object(Path, "rename", side_effect=OSError("simulated publish failure")):
                          with self.assertRaisesRegex(OSError, "simulated publish failure"):
                              signed_field_evidence.write_outputs(ipa, output, inspection)

                      self.assertFalse(output.exists())
                      self.assertEqual(list(root.glob(".field-evidence.staging-*")), [])

                      paths = signed_field_evidence.write_outputs(ipa, output, inspection)
                      self.assertTrue(output.is_dir())
                      self.assertTrue(all(path.is_file() for path in paths.values()))
                      with self.assertRaisesRegex(
                          signed_field_evidence.EvidenceError,
                          "refusing to overwrite existing field evidence directory",
                      ):
                          signed_field_evidence.write_outputs(ipa, output, inspection)
          ''')
          method = textwrap.indent(method.strip() + '\n\n', '    ')
          if anchor not in tests:
              raise SystemExit('test insertion anchor not found')
          tests = tests.replace(anchor, method + anchor, 1)
          t.write_text(tests)
          PY

      - name: Run focused producer regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_evidence.py scripts/ci/tests/test_es80_signed_field_artifact_evidence.py
          python3 -m unittest discover -s scripts/ci/tests -p 'test_es80_signed_field_artifact_evidence.py' -v

      - name: Commit tested delta and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-es80-v2-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/ci/es80_signed_field_artifact_evidence.py scripts/ci/tests/test_es80_signed_field_artifact_evidence.py .github/workflows/tmp-es80-v2-closure.yml
          git diff --cached --check
          git commit -m '[Capture field provenance v14] Publish schema-v2 evidence atomically'
          git push origin HEAD:recovery/es80-v14-field-evidence-v2-closure-gpt56
