name: Capture Secret Custody 8069
on:
  push:
    branches: [sol/v14-capture-secret-custody-8069-sol]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.actor != 'github-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-secret-custody-8069-sol
          fetch-depth: 0
      - name: Guard exact product parent
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8069c0ffec496cacbe263016d8a7f4ca15ddc64e HEAD
          git diff --quiet 8069c0ffec496cacbe263016d8a7f4ca15ddc64e HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Apply and verify secret custody
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_secret_custody_8069.py apply
          python3 scripts/ci/materialize_capture_secret_custody_8069.py verify
          python3 -m py_compile scripts/ci/materialize_capture_secret_custody_8069.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureSecretCustodyConvergenceSourceTests.swift
          git diff --check
      - name: Commit clean two-path result
        run: |
          set -euo pipefail
          rm .github/workflows/capture-secret-custody-8069.yml
          rm scripts/ci/materialize_capture_secret_custody_8069.py
          git add -A
          test "$(git diff --name-only 8069c0ffec496cacbe263016d8a7f4ca15ddc64e | wc -l | tr -d ' ')" = 2
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m 'fix(capture): close application secret custody'
          git push origin HEAD:sol/v14-capture-secret-custody-8069-sol
