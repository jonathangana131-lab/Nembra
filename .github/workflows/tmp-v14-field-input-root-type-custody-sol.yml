name: TEMP V14 Field Input Root Type Custody Sol

on:
  push:
    branches:
      - repair/v14-capture-field-installer-git-authority-sol-20260811

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-field-installer-git-authority-sol-20260811
          fetch-depth: 0
      - name: Bind exact repair ancestry and source blobs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6eb8b0e8b9fcc6f36de68170c4a617be92ccb51d HEAD
          test "$(git rev-parse HEAD:scripts/field/install_one_time_capture.command)" = d735a673a94ebc99f0a89ce4d370bc0d458c3739
          test "$(git rev-parse HEAD:scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py)" = 1a64a2e5c7348608cc22b2ac750ae9e19890932e
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize root type custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tmp_materialize_field_input_root_type_custody_sol.py
      - name: Verify permanent result
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/ci/tmp_materialize_field_input_root_type_custody_sol.py
          test ! -e .github/workflows/tmp-v14-field-input-root-type-custody-sol.yml
          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py
          git diff --check
          /bin/rm -rf -- scripts/ci/tests/__pycache__
      - name: Verify exact publish path set
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          /usr/bin/python3 - <<'PY'
          import subprocess
          expected = {
              "scripts/field/install_one_time_capture.command",
              "scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py",
              "scripts/ci/tmp_materialize_field_input_root_type_custody_sol.py",
              ".github/workflows/tmp-v14-field-input-root-type-custody-sol.yml",
          }
          actual = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected materialized path set: {sorted(actual)}")
          PY
      - name: Publish permanent result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nembra V14 Sol"
          git config user.email "nembra-v14-sol@users.noreply.github.com"
          git commit -m "Capture: reject aliased field input allowlist roots"
          git push origin HEAD:repair/v14-capture-field-installer-git-authority-sol-20260811
