name: Capture SDK Provenance Contract Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/capture-package-sdk-provenance-diagnostic.yml'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldSDKDependencyProvenanceSourceTests.swift'

permissions:
  contents: read

jobs:
  package-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Run Capture package
        id: package
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/capture-package-sdk-provenance.log"
          set +e
          (cd Packages/NembraBluetoothCapture && swift test) 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          /usr/bin/python3 -I - "$log" <<'PY'
          import re, sys
          from collections import Counter
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          files = Counter()
          for line in lines:
              match = re.search(r'at ([A-Za-z0-9_]+\\.swift):\\d+:\\d+:', line)
              if match and ('recorded an issue' in line or 'Caught error' in line):
                  files[match.group(1)] += 1
          print(f'PACKAGE_TOTAL_ISSUES {sum(files.values())}')
          for name, count in files.most_common():
              print(f'PACKAGE_ISSUES {count:3d} {name}')
          PY
      - name: Upload exact package log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capture-package-sdk-provenance-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/capture-package-sdk-provenance.log
          retention-days: 7
          if-no-files-found: error
      - name: Preserve package failure truth
        env:
          PACKAGE_STATUS: ${{ steps.package.outputs.status }}
        run: test "$PACKAGE_STATUS" = 0
