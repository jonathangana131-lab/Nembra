name: Capture Private Read Lease Converge V2 Once

on:
  push:
    branches:
      - repair/v17-capture-private-read-lease-guard-compose-sol-20260814
    paths:
      - .github/workflows/capture-private-read-lease-converge-v2-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact convergence input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "634050e7bbc890c08daacbffff145d6e79ff0643"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-private-read-lease-converge-v2-once.yml"

      - name: Materialize least-authority fail-closed lease patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip -d | python3 -

      - name: Prove converged portable contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_private_read_lease_rollback.py scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py scripts/ci/tests/test_capture_private_read_lease_descriptor_transport.py
          python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_descriptor_transport.py
          git diff --check

      - name: Self-delete and publish convergence
        shell: bash
        env:
          BRANCH: repair/v17-capture-private-read-lease-guard-compose-sol-20260814
          SELF: .github/workflows/capture-private-read-lease-converge-v2-once.yml
        run: |
          set -euo pipefail
          git rm "$SELF"
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_private_read_lease_rollback.py
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$SELF" scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_private_read_lease_rollback.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'nembra-swarm-materializer'
          git config user.email 'nembra-swarm@users.noreply.github.com'
          git commit -m 'capture: converge fail-closed least-authority private lease'
          git push origin "HEAD:$BRANCH"
