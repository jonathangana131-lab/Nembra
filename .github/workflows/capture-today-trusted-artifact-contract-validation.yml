name: VALIDATION ONLY Capture Final GO authority repair confirmation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/es80_today_final_go_record.py
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_trusted_xcode_preserves_external_record_contract.py
      - scripts/ci/tests/test_es80_today_final_go_hardened_git_custody.py
      - .github/workflows/capture-today-trusted-artifact-contract-validation.yml

permissions:
  contents: read

jobs:
  confirmation:
    name: Confirm independent artifact and Git authority repairs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile authority confirmation regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_final_go_record.py
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py
          python3 -m py_compile scripts/ci/es80_today_trusted_capture_xcode_subject.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_trusted_xcode_preserves_external_record_contract.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_hardened_git_custody.py

      - name: Preserve retained external build-record contract
        run: python3 scripts/ci/tests/test_es80_today_trusted_xcode_preserves_external_record_contract.py -v

      - name: Preserve closed Git custody for workflow authority
        run: python3 scripts/ci/tests/test_es80_today_final_go_hardened_git_custody.py -v
