name: VALIDATION ONLY Capture trusted-Xcode retained-record contract

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/es80_today_final_go_record.py
      - scripts/ci/es80_today_final_go_foundation.py
      - scripts/ci/tests/test_es80_today_trusted_xcode_preserves_external_record_contract.py
      - .github/workflows/capture-today-trusted-artifact-contract-validation.yml

permissions:
  contents: read

jobs:
  expected-red:
    name: Preserve canonical retained external-record admission
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(/usr/bin/git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Compile authority modules and regression
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_final_go_record.py
          python3 -m py_compile scripts/ci/es80_today_final_go_foundation.py
          python3 -m py_compile scripts/ci/es80_today_trusted_capture_xcode_subject.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_trusted_xcode_preserves_external_record_contract.py

      - name: Reject weaker retained external build records
        run: python3 scripts/ci/tests/test_es80_today_trusted_xcode_preserves_external_record_contract.py -v
