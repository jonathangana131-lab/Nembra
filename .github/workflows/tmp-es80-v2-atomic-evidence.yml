name: Temporary ES80 v2 evidence atomicity hardening

on:
  push:
    branches:
      - feature/es80-v14-signed-field-evidence-v2-atomic-gpt56

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/es80-v14-signed-field-evidence-v2-atomic-gpt56

      - name: Apply narrow evidence durability hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/ci/es80_signed_field_artifact_evidence.py")
          text = script_path.read_text()

          marker = "\n\ndef extract_ipa_safely(ipa_path: Path, destination: Path) -> Path:\n"
          if marker not in text:
              raise SystemExit("extract_ipa_safely marker not found")
          helper = '''

          def _require_unique_member_path(
              member: PurePosixPath,
              seen_members: set[str],
              seen_casefolded_members: set[str],
          ) -> None:
              canonical = member.as_posix()
              folded = canonical.casefold()
              if canonical in seen_members or folded in seen_casefolded_members:
                  raise EvidenceError(
                      f"IPA contains duplicate or case-colliding ZIP member path: {canonical!r}"
                  )
              seen_members.add(canonical)
              seen_casefolded_members.add(folded)
          '''
          helper = "\n".join(line[10:] if line.startswith("          ") else line for line in helper.splitlines())
          text = text.replace(marker, helper + marker, 1)

          old = "    app_roots: set[str] = set()\n    with archive:\n"
          new = (
              "    app_roots: set[str] = set()\n"
              "    seen_members: set[str] = set()\n"
              "    seen_casefolded_members: set[str] = set()\n"
              "    with archive:\n"
          )
          if old not in text:
              raise SystemExit("archive seen-member insertion point not found")
          text = text.replace(old, new, 1)

          old = "            member = _safe_member_path(info.filename.rstrip(\"/\"))\n            mode = (info.external_attr >> 16) & 0o177777\n"
          new = (
              "            member = _safe_member_path(info.filename.rstrip(\"/\"))\n"
              "            _require_unique_member_path(member, seen_members, seen_casefolded_members)\n"
              "            mode = (info.external_attr >> 16) & 0o177777\n"
          )
          if old not in text:
              raise SystemExit("archive member validation insertion point not found")
          text = text.replace(old, new, 1)

          start = text.index("def write_outputs(ipa_path: Path, output_dir: Path, inspection: dict) -> dict[str, Path]:")
          end = text.index("\n\ndef self_test() -> None:", start)
          atomic = '''def write_outputs(ipa_path: Path, output_dir: Path, inspection: dict) -> dict[str, Path]:
              """Publish one complete evidence directory only after every staged subject re-verifies."""
              ipa_path = ipa_path.resolve()
              output_dir = output_dir.resolve()
              if output_dir.exists():
                  raise EvidenceError(f"refusing to overwrite existing field evidence directory: {output_dir}")

              field_evidence = inspection["field_evidence"]
              external_bytes = inspection["external_bytes"]
              field_bytes = canonical_json_bytes(field_evidence)
              if sha256_file(ipa_path) != field_evidence["ipaSHA256"]:
                  raise EvidenceError("input IPA digest diverged after inspection")
              if hashlib.sha256(external_bytes).hexdigest() != field_evidence["externalBuildRecordSHA256"]:
                  raise EvidenceError("external build record digest diverged from field evidence")

              parent = output_dir.parent
              parent.mkdir(parents=True, exist_ok=True)
              staging = Path(tempfile.mkdtemp(prefix=f".{output_dir.name}.staging-", dir=str(parent)))

              try:
                  retained_ipa = staging / "build-evidence" / "NembraField.ipa"
                  retained_ipa.parent.mkdir(parents=True, exist_ok=True)
                  external_path = staging / "NembraCaptureExternalBuildRecord.json"
                  field_path = staging / "NembraCaptureSignedFieldArtifactEvidence.json"

                  shutil.copy2(ipa_path, retained_ipa)
                  external_path.write_bytes(external_bytes)
                  field_path.write_bytes(field_bytes)

                  if sha256_file(retained_ipa) != field_evidence["ipaSHA256"]:
                      raise EvidenceError("retained IPA bytes diverged from inspected input")
                  if sha256_file(external_path) != field_evidence["externalBuildRecordSHA256"]:
                      raise EvidenceError("written external build record digest diverged from field evidence")
                  if field_path.read_bytes() != field_bytes:
                      raise EvidenceError("written signed-field evidence bytes diverged from staged evidence")

                  if output_dir.exists():
                      raise EvidenceError(f"field evidence directory appeared during staging: {output_dir}")
                  staging.rename(output_dir)
              except Exception:
                  if staging.exists():
                      shutil.rmtree(staging, ignore_errors=True)
                  raise

              return {
                  "retained_ipa": output_dir / "build-evidence" / "NembraField.ipa",
                  "external_record": output_dir / "NembraCaptureExternalBuildRecord.json",
                  "field_evidence": output_dir / "NembraCaptureSignedFieldArtifactEvidence.json",
              }
          '''
          atomic = "\n".join(line[10:] if line.startswith("          ") else line for line in atomic.splitlines())
          text = text[:start] + atomic + text[end:]
          script_path.write_text(text)

          test_path = Path("scripts/ci/tests/test_es80_signed_field_artifact_evidence.py")
          tests = test_path.read_text()
          if "from unittest import mock\n" not in tests:
              tests = tests.replace("import unittest\n", "import unittest\nimport warnings\nfrom unittest import mock\n", 1)

          insertion = '''
              def test_duplicate_or_case_colliding_member_path_fails_closed(self):
                  for duplicate_name in (
                      "Payload/Nembra.app/Info.plist",
                      "Payload/Nembra.app/info.plist",
                  ):
                      with self.subTest(duplicate_name=duplicate_name), tempfile.TemporaryDirectory() as temp:
                          ipa = Path(temp) / "Nembra.ipa"
                          make_ipa(ipa)
                          with warnings.catch_warnings():
                              warnings.simplefilter("ignore", UserWarning)
                              with zipfile.ZipFile(ipa, "a") as archive:
                                  archive.writestr(duplicate_name, b"shadow")
                          with self.assertRaisesRegex(
                              signed_field_evidence.EvidenceError,
                              "duplicate or case-colliding",
                          ):
                              signed_field_evidence.inspect_ipa(
                                  ipa,
                                  HEAD,
                                  signing_probe=fake_signing_probe,
                              )

              def test_write_outputs_failure_never_exposes_partial_final_directory(self):
                  with tempfile.TemporaryDirectory() as temp:
                      root = Path(temp)
                      ipa = root / "Nembra.ipa"
                      make_ipa(ipa)
                      inspection = signed_field_evidence.inspect_ipa(
                          ipa,
                          HEAD,
                          signing_probe=fake_signing_probe,
                      )
                      output = root / "atomic-out"

                      with mock.patch.object(Path, "rename", side_effect=OSError("simulated publish failure")):
                          with self.assertRaisesRegex(OSError, "simulated publish failure"):
                              signed_field_evidence.write_outputs(ipa, output, inspection)

                      self.assertFalse(output.exists())
                      self.assertEqual(list(root.glob(".atomic-out.staging-*")), [])

                      paths = signed_field_evidence.write_outputs(ipa, output, inspection)
                      self.assertTrue(output.is_dir())
                      self.assertTrue(all(path.is_file() for path in paths.values()))
                      with self.assertRaisesRegex(
                          signed_field_evidence.EvidenceError,
                          "refusing to overwrite existing field evidence directory",
                      ):
                          signed_field_evidence.write_outputs(ipa, output, inspection)

          '''
          insertion = "\n".join(line[14:] if line.startswith("              ") else line for line in insertion.splitlines())
          anchor = "    def test_embedded_external_authority_files_fail_closed(self):\n"
          if anchor not in tests:
              raise SystemExit("test insertion anchor not found")
          tests = tests.replace(anchor, insertion + "\n" + anchor, 1)
          test_path.write_text(tests)
          PY

      - name: Validate narrowed v2 hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_signed_field_artifact_evidence.py \
            scripts/ci/tests/test_es80_signed_field_artifact_evidence.py
          python3 -m unittest discover \
            -s scripts/ci/tests \
            -p 'test_es80_signed_field_artifact_evidence.py' \
            -v

      - name: Publish functional delta and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-es80-v2-atomic-evidence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/ci/es80_signed_field_artifact_evidence.py \
            scripts/ci/tests/test_es80_signed_field_artifact_evidence.py \
            .github/workflows/tmp-es80-v2-atomic-evidence.yml
          git diff --cached --check
          git commit -m '[Capture field provenance v14] Publish v2 evidence atomically'
          git push origin HEAD:feature/es80-v14-signed-field-evidence-v2-atomic-gpt56
