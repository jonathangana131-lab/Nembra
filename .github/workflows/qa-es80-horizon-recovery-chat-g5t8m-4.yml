name: ES80 Horizon recovery exact-product QA v4

on:
  push:
    branches:
      - cell/es80-horizon-recovery/ci/chat-g5t8m-4

permissions:
  contents: read

jobs:
  horizon-recovery-qa:
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Checkout validation mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify exact product parent and workflow-only delta
        env:
          EXPECTED_PRODUCT_SHA: 70d7b2f46319d5561a9df31c16be8009ba53617e
          EXPECTED_WORKFLOW_PATH: .github/workflows/qa-es80-horizon-recovery-chat-g5t8m-4.yml
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          printf 'Expected product parent: %s\nActual product parent:   %s\n' "$EXPECTED_PRODUCT_SHA" "$actual_parent"
          test "$actual_parent" = "$EXPECTED_PRODUCT_SHA"
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf 'Validation-only delta:\n%s\n' "$changed"
          test "$changed" = "$EXPECTED_WORKFLOW_PATH"

      - name: Report Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Reject application characteristic writes
        run: |
          set -euo pipefail
          if grep -R --include='*.swift' -nE '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Application characteristic-value write path detected in NembraBluetoothCapture Sources.' >&2
            exit 1
          fi
          echo 'No application .writeValue(...) call found in NembraBluetoothCapture Sources.'

      - name: Verify complete Horizon recovery source contract
        run: |
          set -euo pipefail
          gate='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift'
          transaction='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift'
          retirement='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothAbortedObservationQueueRetirement.swift'
          recorded_tests='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothRecordedHorizonRecoveryTests.swift'
          zero_h_tests='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothUncommittedHorizonRecoveryTests.swift'
          grep -Fq 'case uncommittedHorizonAbandonedBeforeRecorderMutation' "$gate"
          grep -Fq 'case uncommittedHorizonRejectedBeforeRecorderMutation' "$gate"
          grep -Fq 'case recordedHorizonInvalidatedBeforeGateCommit' "$gate"
          grep -Fq 'case committedHorizonInvalidatedBeforeArtifactFreeze' "$gate"
          grep -Fq 'mutating func abortUncommittedHorizon' "$gate"
          grep -Fq 'mutating func abortRecordedHorizonBeforeGateCommit' "$gate"
          grep -Fq 'mutating func abortCommittedHorizonBeforeArtifactFreeze' "$gate"
          grep -Fq 'struct HorizonRecorderMutationAbandonmentReceipt' "$transaction"
          grep -Fq 'func abandonBeforeRecorderMutation()' "$transaction"
          grep -Fq 'enum HorizonRecorderMutationOutcome' "$transaction"
          grep -Fq 'func recordBoundaryWithMutationOutcome' "$transaction"
          grep -Fq 'var transactionIdentity: UUID' "$transaction"
          grep -Fq 'let abandonedEvidenceCutoff = abortReceipt.abandonedEvidenceQueueCutoff' "$retirement"
          test -f "$recorded_tests"
          test -f "$zero_h_tests"

      - name: Run NembraCore tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors

      - name: Run full capture package tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Build capture package for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
