name: Temporary close signed app origin failure path

on:
  push:
    branches:
      - repair/v14-signed-app-build-origin-custody-sol-20260811

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Run signed app origin failure-path hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPYCACHEPREFIX: /tmp/nembra-origin-failure-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact hardening head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Lock and retire before interpreting build result
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          helper = Path('scripts/ci/capture_signed_app_build_origin_custody.py')
          lines = helper.read_text(encoding='utf-8').splitlines(keepends=True)
          if_line = '        if returncode != 0:\n'
          comment_line = '        # Revoke the transient filesystem capability at the first privileged instruction after the\n'
          retire_line = '        _terminate_remaining_process_group(process.pid)\n'
          if lines.count(if_line) != 1 or lines.count(comment_line) != 1 or lines.count(retire_line) != 1:
              raise SystemExit('failure-path authority markers changed')
          if_i = lines.index(if_line)
          comment_i = lines.index(comment_line)
          retire_i = lines.index(retire_line)
          if not (if_i < comment_i < retire_i):
              raise SystemExit('failure-path authority precondition changed')
          failure_block = lines[if_i:comment_i]
          del lines[if_i:comment_i]
          retire_i = lines.index(retire_line)
          lines[retire_i + 1:retire_i + 1] = failure_block
          helper.write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Validate failure-path hardening
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/ci/capture_signed_app_build_origin_custody.py').read_text(encoding='utf-8')
          wait = source.index('returncode = process.wait()')
          owner = source.index('os.chown(derived_root, 0, 0)', wait)
          mode = source.index('os.chmod(derived_root, 0o700)', owner)
          retire = source.index('_terminate_remaining_process_group(process.pid)', mode)
          fail = source.index('if returncode != 0:', retire)
          fingerprint = source.index('source_fingerprint = str(fingerprint(source_app))', fail)
          if not wait < owner < mode < retire < fail < fingerprint:
              raise SystemExit('build-return authority closure order is not exact')
          PY
          bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Publish non-workflow hardening
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/ci/capture_signed_app_build_origin_custody.py
          git diff --cached --check
          git config user.name 'nembra-sol-swarm'
          git config user.email 'nembra-sol-swarm@users.noreply.github.com'
          git commit -m 'Close build output authority on failure too'
          git push origin HEAD:repair/v14-signed-app-build-origin-custody-sol-20260811
