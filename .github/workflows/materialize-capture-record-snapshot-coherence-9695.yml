name: Materialize Capture whole-record provenance fence

on:
  push:
    branches:
      - sol/v14-capture-record-snapshot-coherence-9695

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Verify exact product ancestry and construction scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9695af19c21c93b3eb4bc867613a6df0c9a3b3d4 HEAD
          test "$(git diff --name-only 9695af19c21c93b3eb4bc867613a6df0c9a3b3d4..HEAD | sort)" = "$(printf '%s\n' \
            '.github/workflows/materialize-capture-record-snapshot-coherence-9695.yml' \
            'scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py' \
            'tools/materialize_capture_record_snapshot_coherence_9695.py' | sort)"

      - name: Apply record-level generation fence
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_capture_record_snapshot_coherence_9695.py

      - name: Validate provenance chronology
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python - <<'PY'
          from pathlib import Path
          source = Path('Scripts/capture_tuya_private_input_provenance.py').read_text()
          start = source.index('def build_record(')
          end = source.index('\ndef _record_text', start)
          build = source[start:end]
          required = [
              '_stat_identity(current_path) != _stat_identity(after)',
              'def _tree_generation_witness(',
              'def _record_generation_witness(',
              'before_generation = _record_generation_witness',
              'after_generation = _record_generation_witness',
              'private build input set changed while provenance record was built',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'missing whole-record provenance invariants: {missing}')
          if '    return {' in build:
              raise SystemExit('build_record still returns sequential component digests without a whole-record fence')
          PY
          test "$(git diff --name-only)" = "Scripts/capture_tuya_private_input_provenance.py"
          git diff --check

      - name: Publish clean repair and retire construction helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-record-snapshot-coherence-9695.yml
          rm tools/materialize_capture_record_snapshot_coherence_9695.py
          git config user.name "nembra-sol-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): fence private provenance as one snapshot"
          git push origin HEAD:sol/v14-capture-record-snapshot-coherence-9695
