name: Materialize Capture Current Red-Team Convergence

on:
  push:
    branches:
      - converge/v14-capture-redteam-current-1c40-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/v14-capture-redteam-current-1c40-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact parent and import accepted red contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1c40853f6991b4d09206df1d25ecff021458b7eb"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-capture-redteam-current-1c40-sol.yml"

          for sha in \
            a8eb9b93eea7e5de1a9c80468cadf378989b5edd \
            8010d108a043fbe2ff03fa3bb0d1518aa7047c08 \
            5b209e9a0766d780d38889d222b70ecbe085bdb1 \
            ec55d27270d80bdfa556eff3b598880dd8f5c231 \
            078c43bba35dee1dd522ed04f8aaa18e6eda4d21
          do
            git fetch --no-tags origin "$sha"
          done

          git show a8eb9b93eea7e5de1a9c80468cadf378989b5edd:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git show 8010d108a043fbe2ff03fa3bb0d1518aa7047c08:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          git show 5b209e9a0766d780d38889d222b70ecbe085bdb1:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift \
            > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          git show ec55d27270d80bdfa556eff3b598880dd8f5c231:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift \
            > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift
          git show 078c43bba35dee1dd522ed04f8aaa18e6eda4d21:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift \
            > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift

      - name: Materialize product truth repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          entrypoint_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = entrypoint_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              '''    func abandonCorrelationForViewExit() {
                  // Close the screen-lifetime admission boundary before revoking every already-issued grant.
                  // A later SwiftUI/account callback must not mint a replacement membership probe off-screen.
                  acceptsViewScopedMembershipRequests = false
                  sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipRequestID = UUID()
          ''',
              '''    func abandonCorrelationForViewExit() {
                  // Close the screen-lifetime admission boundary before revoking every already-issued grant.
                  // A later SwiftUI/account callback must not mint a replacement membership probe off-screen.
                  acceptsViewScopedMembershipRequests = false
                  sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipStatus = "Scooter membership authority was revoked. Verify this scooter again for the current Secure Link session."
                  membershipRequestID = UUID()
          ''',
              'view-exit membership status revocation'
          )

          source = replace_once(
              source,
              '''    func appDidLoseForeground() {
                  guard !foregroundIntegrityLossHandled else { return }
                  foregroundIntegrityLossHandled = true
          ''',
              '''    func appDidLoseForeground() {
                  // Sealed accepted artifacts remain immutable/shareable across scene transitions.
                  guard phase != .accepted else { return }
                  guard !foregroundIntegrityLossHandled else { return }
                  foregroundIntegrityLossHandled = true
          ''',
              'accepted-artifact foreground guard'
          )

          source = replace_once(
              source,
              '''        acceptsViewScopedMembershipRequests = false
                  sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipRequestID = UUID()
                  membershipBusy = false
          ''',
              '''        acceptsViewScopedMembershipRequests = false
                  sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipStatus = "Scooter membership authority was revoked by foreground loss. Verify this scooter again before a fresh OFF1 correlation."
                  membershipRequestID = UUID()
                  membershipBusy = false
          ''',
              'foreground membership status revocation'
          )

          source = replace_once(
              source,
              '''        guard let token = currentConnectionToken else {
                  if phase == .authenticating {
          ''',
              '''        if phase == .correlated || phase == .selected {
                  // A completed/confirmed target is still mutable current-attempt authority. It may
                  // not cross an app foreground interruption even after the live scanner/lease ended.
                  resetDiscoverySessionOnly()
                  phase = .failed
                  message = "Capture left the foreground after Bluetooth target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; the pre-background target cannot be reused."
                  log("foreground_integrity_lost_after_target_correlation")
                  return
              }

              guard let token = currentConnectionToken else {
                  if phase == .authenticating {
          ''',
              'post-correlation foreground invalidation'
          )

          source = replace_once(
              source,
              '''        guard sdkAccountLoggedIn,
                  sdkDeviceMembershipVerified,
                  accountIdentityLeaseIsAuthorized,
                  let driver else {
          ''',
              '''        guard sdkAccountLoggedIn,
                  sdkDeviceMembershipVerified,
                  accountIdentityLeaseIsAuthorized,
                  let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),
                  !verifiedAccountUID.isEmpty,
                  let driver else {
          ''',
              'verified account UID event-custody lease'
          )

          source = replace_once(
              source,
              '''            log("tuya_application_update", update.merging([
                  "generation": String(token.diagnosticGeneration)
              ]) { current, _ in current })
          ''',
              '''            let eventDetails = redactVerifiedAccountUID(
                  from: update,
                  verifiedAccountUID: verifiedAccountUID
              )
              log("tuya_application_update", eventDetails.merging([
                  "generation": String(token.diagnosticGeneration)
              ]) { _, trusted in trusted })
          ''',
              'trusted event provenance and account UID custody'
          )

          helper_anchor = '''    private func startWatchdog(token: TuyaReadOnlyConnectionToken) {
          '''
          helper = '''    private func redactVerifiedAccountUID(
              from update: [String: String],
              verifiedAccountUID: String
          ) -> [String: String] {
              var redacted: [String: String] = [:]
              for (key, value) in update {
                  let redactedKey = key.replacingOccurrences(
                      of: verifiedAccountUID,
                      with: "<redacted-account-uid>"
                  )
                  let redactedValue = value.replacingOccurrences(
                      of: verifiedAccountUID,
                      with: "<redacted-account-uid>"
                  )

                  // Redacting a credential-shaped key must not silently drop a second application
                  // field that maps to the same safe key. Preserve both under deterministic suffixes.
                  var uniqueKey = redactedKey
                  var suffix = 2
                  while redacted[uniqueKey] != nil {
                      uniqueKey = "\(redactedKey)#\(suffix)"
                      suffix += 1
                  }
                  redacted[uniqueKey] = redactedValue
              }
              return redacted
          }

          '''
          source = replace_once(
              source,
              helper_anchor,
              helper + helper_anchor,
              'account UID redaction helper insertion'
          )

          source = replace_once(
              source,
              '''        "accesstoken",
                  "refreshtoken",
                  "sessionkey",
                  "authkey",
          ''',
              '''        "accesstoken",
                  "refreshtoken",
                  "authkey",
          ''',
              'duplicate sessionkey simplification'
          )

          entrypoint_path.write_text(source, encoding='utf-8')

          bridge_path = Path('NembraApp/Features/Research/TuyaAccountBridge.swift')
          bridge = bridge_path.read_text(encoding='utf-8')
          bridge = replace_once(
              bridge,
              'let secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "sessionkey", "seckey", "authkey"]',
              'let secretKeyFragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "seckey", "authkey"]',
              'metadata/export secret classifier parity'
          )
          bridge_path.write_text(bridge, encoding='utf-8')
          PY

      - name: Verify current red-team closure mechanically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          bridge = Path('NembraApp/Features/Research/TuyaAccountBridge.swift').read_text(encoding='utf-8')

          required_source = [
              'guard phase != .accepted else { return }',
              'phase == .correlated || phase == .selected',
              'resetDiscoverySessionOnly()',
              'foreground_integrity_lost_after_target_correlation',
              'Scooter membership authority was revoked.',
              'Scooter membership authority was revoked by foreground loss.',
              '<redacted-account-uid>',
              'redactVerifiedAccountUID(',
              'eventDetails.merging([',
              ']) { _, trusted in trusted })',
          ]
          for token in required_source:
              if token not in source:
                  raise SystemExit(f'missing current red-team source contract: {token}')

          forbidden_source = [
              'log("tuya_application_update", update.merging([',
              ']) { current, _ in current })',
          ]
          for token in forbidden_source:
              if token in source:
                  raise SystemExit(f'forbidden stale event-custody source remains: {token}')

          smartlife = source[source.index('private final class SmartLifeDriver'):]
          if smartlife.split('private static func redactApplicationSecrets', 1)[0].count('"sessionkey"') != 1:
              raise SystemExit('SmartLifeDriver secret classifier must contain exactly one sessionkey entry')

          for token in ['localkey','sessionkey','appkey','appsecret','password','accounttoken','accesstoken','refreshtoken','authkey','seckey']:
              if token not in bridge.lower():
                  raise SystemExit(f'metadata bridge missing promised secret class: {token}')

          test_paths = [
              'TuyaApplicationEventMetadataPrecedenceSourceTests.swift',
              'TuyaApplicationAccountUIDExportCustodySourceTests.swift',
              'TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift',
              'TuyaCaptureForegroundIntegrityCurrentSourceTests.swift',
              'TuyaMetadataSecretRedactionSourceTests.swift',
          ]
          test_root = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests')
          for name in test_paths:
              if not (test_root / name).is_file():
                  raise SystemExit(f'missing absorbed red-team regression: {name}')

          print('Capture current red-team closure source contract: PASS')
          PY
          git diff --check
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
            swiftc -parse NembraApp/Features/Research/TuyaAccountBridge.swift
            for test in \
              Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
              Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
              Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift \
              Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift \
              Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift
            do
              swiftc -parse "$test"
            done
          fi

      - name: Collapse helper into product commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-redteam-current-1c40-sol.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): close current red-team authority seams'
          git diff --check 1c40853f6991b4d09206df1d25ecff021458b7eb HEAD
          git push origin HEAD:converge/v14-capture-redteam-current-1c40-sol
