name: Capture Final GO Tuya Lock Current Recovery

on:
  push:
    branches:
      - recovery/v14-final-go-tuya-lock-current-sol

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact current parent
        shell: bash
        run: |
          set -euo pipefail
          parent=7557c5502c25cbcd0c44984eb19e8c62145d8435
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          test "$(git diff --name-only "$parent" HEAD)" = '.github/workflows/capture-final-go-tuya-lock-current-recovery.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git cat-file -e da86226ba36bb2d4f441cc3cb876244af17853cb^{commit}
          git cat-file -e d8416aeba19b826cfb50bde9e0b3e2778766a286^{commit}

      - name: Recover accepted reviewed-lock ingredient by three-way merge
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary da86226ba36bb2d4f441cc3cb876244af17853cb d8416aeba19b826cfb50bde9e0b3e2778766a286 -- \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py > /tmp/tuya-lock-authority.patch
          test -s /tmp/tuya-lock-authority.patch
          git apply --3way /tmp/tuya-lock-authority.patch
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Validate full composed authority stack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/es80_authenticated_stationary_signed_artifact.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          grep -Fq 'nembra-capture-human-review-github-v2' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'tuyaDependencyLockSHA256' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'GO control plane does not contain the exact current main authority' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'candidate does not contain the exact current main authority' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'candidate authority path has suppressed index worktree tracking' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'canonical_private_path(device,"private intended-device identifier")' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'env=installer_environment(device' scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq '["/bin/bash","--noprofile","--norc","-p"' scripts/ci/es80_authenticated_stationary_final_go.py
          git diff --check

      - name: Publish clean recovered ingredient
        shell: bash
        run: |
          set -euo pipefail
          parent=7557c5502c25cbcd0c44984eb19e8c62145d8435
          git rm .github/workflows/capture-final-go-tuya-lock-current-recovery.yml
          git add \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          expected="$({ printf '%s\n' \
            'scripts/ci/es80_authenticated_stationary_final_go.py' \
            'scripts/ci/tests/test_es80_authenticated_stationary_final_go.py' \
            'scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py'; } | sort)"
          actual="$(git diff --cached --name-only "$parent" | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name 'jonathangana131-lab'
          git config user.email 'jonathangana131@gmail.com'
          git commit -m 'fix(capture): compose reviewed Tuya lock authority on current Final GO'
          git push origin HEAD:recovery/v14-final-go-tuya-lock-current-sol
