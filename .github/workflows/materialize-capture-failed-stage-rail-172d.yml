name: Materialize Capture failed stage rail 172d

on:
  push:
    branches:
      - fix/v14-capture-failed-stage-rail-172d-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '172dca56a1bc018e192feec197ceb17f81db5dab'

      - name: Materialize stopped-attempt rail and terminal copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = app_path.read_text()

          stage_anchor = '''    @ViewBuilder
              private var stageRail: some View {
                  if dynamicTypeSize.isAccessibilitySize {
          '''
          stage_replacement = '''    @ViewBuilder
              private var stageRail: some View {
                  if test.phase == .failed {
                      HStack(spacing: 10) {
                          Image(systemName: "stop.circle.fill")
                              .font(.headline)
                              .foregroundStyle(.orange)
                              .accessibilityHidden(true)
                          VStack(alignment: .leading, spacing: 2) {
                              Text("Attempt stopped")
                                  .font(.caption.weight(.bold))
                                  .foregroundStyle(.orange)
                              Text(test.canRestartFromFreshOFF1
                                   ? "Begin again from scooter OFF"
                                   : "Relaunch before another attempt")
                                  .font(.subheadline.weight(.semibold))
                          }
                          Spacer()
                      }
                      .accessibilityElement(children: .ignore)
                      .accessibilityLabel("Capture attempt stopped")
                      .accessibilityValue(test.canRestartFromFreshOFF1
                                          ? "Restore the requirement, then begin a new attempt from scooter off"
                                          : "Relaunch Capture before another attempt")
                  } else if dynamicTypeSize.isAccessibilitySize {
          '''
          if source.count(stage_anchor) != 1:
              raise SystemExit(f'expected stage rail anchor once; observed {source.count(stage_anchor)}')
          source = source.replace(stage_anchor, stage_replacement, 1)

          paused = '"Capture paused"'
          if source.count(paused) != 3:
              raise SystemExit(f'expected exactly three stopped-attempt paused labels; observed {source.count(paused)}')
          source = source.replace(paused, '"Capture stopped"')
          app_path.write_text(source)

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFailedStageRailAccessibilitySourceTests.swift')
          test_path.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Capture failed stage-rail accessibility truth")
          struct CaptureFailedStageRailAccessibilitySourceTests {
              @Test("failed Capture uses an explicit stopped rail before normal procedure stages")
              func failedRailDoesNotPresentTargetAsCurrent() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let stageRail = String(try section(
                      in: source,
                      from: "private var stageRail: some View",
                      to: "private var primarySurface: some View"
                  ))

                  let failedMarker = try #require(stageRail.range(of: "if test.phase == .failed"))
                  let normalRailMarker = try #require(stageRail.range(of: "else if dynamicTypeSize.isAccessibilitySize"))
                  #expect(failedMarker.lowerBound < normalRailMarker.lowerBound)

                  let failedPrefix = String(stageRail[..<normalRailMarker.lowerBound])
                  #expect(failedPrefix.contains("Attempt stopped"))
                  #expect(failedPrefix.contains("Capture attempt stopped"))
                  #expect(failedPrefix.contains("accessibilityLabel"))
                  #expect(failedPrefix.contains("accessibilityValue"))
                  #expect(failedPrefix.contains("Begin again from scooter OFF"))
                  #expect(failedPrefix.contains("Relaunch before another attempt"))
              }

              @Test("failed product copy is terminal rather than resumable")
              func failedHeroAndPanelsUseStoppedLanguage() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let phaseTitle = String(try section(
                      in: source,
                      from: "private var phaseTitle: String",
                      to: "private var phaseSubtitle: String"
                  ))
                  let failedPanels = String(try section(
                      in: source,
                      from: "private var failureRecoveryContextPanel: some View",
                      to: "private var failureDiagnosticsControls: some View"
                  ))

                  #expect(phaseTitle.contains("case .failed: return \"Capture stopped\""))
                  #expect(!phaseTitle.contains("case .failed: return \"Capture paused\""))
                  #expect(!failedPanels.contains("Capture paused"))
                  #expect(failedPanels.components(separatedBy: "Capture stopped").count - 1 == 2)
                  #expect(failedPanels.contains("This stopped attempt will not be reused."))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          ''')
          PY

      - name: Verify source contract and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFailedStageRailAccessibilitySourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          rail = source[source.index('private var stageRail: some View'):source.index('private var primarySurface: some View')]
          assert rail.index('if test.phase == .failed') < rail.index('else if dynamicTypeSize.isAccessibilitySize')
          assert 'Capture attempt stopped' in rail
          assert 'Attempt stopped' in rail
          assert 'Capture paused' not in source[source.index('private var failureRecoveryContextPanel: some View'):source.index('private var completionPanel: some View')]
          assert 'case .failed: return "Capture stopped"' in source
          PY

      - name: Publish clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-failed-stage-rail-172d.yml
          git config user.name 'nembra-sol'
          git config user.email 'nembra-sol@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFailedStageRailAccessibilitySourceTests.swift \
                  .github/workflows/materialize-capture-failed-stage-rail-172d.yml
          git diff --cached --check
          git commit -m 'fix(capture): mark failed attempts stopped'
          git push origin HEAD:fix/v14-capture-failed-stage-rail-172d-sol
