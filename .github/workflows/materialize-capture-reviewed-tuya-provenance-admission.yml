name: Materialize Capture Reviewed Tuya Provenance Admission

on:
  push:
    branches:
      - agent/v14-capture-reviewed-tuya-provenance-admission-4b41-sol
    paths:
      - .github/workflows/materialize-capture-reviewed-tuya-provenance-admission.yml
      - scripts/ci/materialize_capture_reviewed_tuya_provenance_admission.py

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact construction parent
        shell: bash
        run: |
          set -euo pipefail
          parent=4b41c9ad783f568d0d353acc9f7016a9bd0b64c2
          git cat-file -e "${parent}^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf 'Construction paths before materialization:\n%s\n' "${changed[*]}"
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/materialize-capture-reviewed-tuya-provenance-admission.yml|scripts/ci/materialize_capture_reviewed_tuya_provenance_admission.py) ;;
              *) echo "Unexpected pre-materialization path: $path" >&2; exit 1 ;;
            esac
          done

      - name: Materialize bounded field-gate repair
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_reviewed_tuya_provenance_admission.py apply
          python3 scripts/ci/materialize_capture_reviewed_tuya_provenance_admission.py verify

      - name: Validate portable provenance admission contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/materialize_capture_reviewed_tuya_provenance_admission.py
          python3 scripts/ci/tests/test_capture_tuya_reviewed_provenance_admission.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Prove final semantic scope
        shell: bash
        run: |
          set -euo pipefail
          parent=4b41c9ad783f568d0d353acc9f7016a9bd0b64c2
          mapfile -t semantic < <(git diff --name-only "$parent" -- \
            ':(exclude).github/workflows/materialize-capture-reviewed-tuya-provenance-admission.yml' \
            ':(exclude)scripts/ci/materialize_capture_reviewed_tuya_provenance_admission.py' | sort)
          expected=(
            Scripts/bootstrap_capture_tuya_sdk.sh
            scripts/ci/tests/test_capture_tuya_reviewed_provenance_admission.py
            scripts/field/install_one_time_capture.command
          )
          [[ "${semantic[*]}" == "${expected[*]}" ]] || {
            printf 'Unexpected semantic scope:\n%s\n' "${semantic[*]}" >&2
            exit 1
          }

      - name: Publish clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-reviewed-tuya-provenance-admission.yml
          rm scripts/ci/materialize_capture_reviewed_tuya_provenance_admission.py
          git add -A
          git diff --cached --check
          mapfile -t final < <(git diff --cached --name-only | sort)
          expected=(
            Scripts/bootstrap_capture_tuya_sdk.sh
            scripts/ci/tests/test_capture_tuya_reviewed_provenance_admission.py
            scripts/field/install_one_time_capture.command
          )
          [[ "${final[*]}" == "${expected[*]}" ]] || {
            printf 'Unexpected final checkpoint scope:\n%s\n' "${final[*]}" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): require preserved Tuya provenance for field build"
          git push origin HEAD:agent/v14-capture-reviewed-tuya-provenance-admission-4b41-sol
