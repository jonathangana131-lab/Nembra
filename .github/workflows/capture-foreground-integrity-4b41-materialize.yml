name: Materialize Capture Foreground Integrity 4b41

on:
  push:
    branches:
      - sol/v14-capture-foreground-integrity-4b41-r3

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-foreground-integrity-4b41-r3
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift

      - name: Apply foreground-integrity lifecycle repair
        run: python3 scripts/ci/materialize_capture_foreground_integrity_4b41.py apply

      - name: Verify bounded truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_foreground_integrity_4b41.py verify
          python3 -m py_compile scripts/ci/materialize_capture_foreground_integrity_4b41.py
          git diff --check

      - name: Publish clean product bytes
        shell: bash
        run: |
          set -euo pipefail
          parent='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          rm .github/workflows/capture-foreground-integrity-4b41-materialize.yml
          rm scripts/ci/materialize_capture_foreground_integrity_4b41.py
          git add -A
          changed="$(git diff --cached "$parent" --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$parent" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): fail closed on foreground integrity loss'
          git push origin HEAD:sol/v14-capture-foreground-integrity-4b41-r3
