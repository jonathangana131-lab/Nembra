name: VALIDATION ONLY - Signed IPA Reinspection Path Custody Red

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - scripts/ci/es80_today_signed_candidate_reinspection.py
      - scripts/ci/tests/test_es80_today_signed_candidate_reinspection_path_custody.py
      - .github/workflows/validation-signed-reinspection-ipa-path-custody-expected-red.yml

permissions:
  contents: read

jobs:
  expected-red:
    name: Reject IPA path swap after descriptor-bound read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile signed reinspection path-custody witness
        run: python3 -m py_compile scripts/ci/tests/test_es80_today_signed_candidate_reinspection_path_custody.py

      - name: Prove Apple-tool extraction consumes authenticated IPA bytes
        run: python3 scripts/ci/tests/test_es80_today_signed_candidate_reinspection_path_custody.py -v
