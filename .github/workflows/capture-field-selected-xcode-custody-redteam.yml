name: Capture Field Selected Xcode Custody Red Team

on:
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_field_selected_xcode_custody.py
      - .github/workflows/capture-field-selected-xcode-custody-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-xcode-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact diagnostic checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Require selected Xcode custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_selected_xcode_custody.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_selected_xcode_custody.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          git diff --check
