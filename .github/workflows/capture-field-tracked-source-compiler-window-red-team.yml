name: Capture Field Tracked Source Compiler Window Red Team

on:
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - Scripts/capture_tuya_private_input_build_guard.py
      - scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py
      - .github/workflows/capture-field-tracked-source-compiler-window-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-source-compiler-window:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact diagnostic checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Demonstrate tracked-source compiler-window authority gap
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py
          git diff --check
