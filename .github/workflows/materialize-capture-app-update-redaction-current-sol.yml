name: Materialize current Capture application update redaction

on:
  push:
    branches:
      - agent/v14-capture-app-update-redaction-current-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify exact parent and helper-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected='52333deb09ea9a5964250097f83884d285f25d78'
          test "$(git rev-parse HEAD^)" = "$expected"
          test "$(git diff --name-only "$expected" HEAD)" = '.github/workflows/materialize-capture-app-update-redaction-current-sol.yml'

      - name: Apply fail-closed SDK application redaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()
          class_marker = '@MainActor\nprivate final class SmartLifeDriver'
          method_marker = '    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {'
          end_marker = '\n    }\n}\n#endif\n\nprivate enum AppleAccountAuthorizationError'

          class_start = source.index(class_marker)
          method_start = source.index(method_marker, class_start)
          end_boundary = source.index(end_marker, method_start)
          method_end = end_boundary + len('\n    }')
          old_block = source[method_start:method_end]
          legacy = 'sanitized[String(describing: key)] = String(describing: value)'

          if legacy not in old_block:
              raise SystemExit('exact current parent no longer contains the demonstrated unsanitized projection')
          if 'redactApplicationSecrets' in old_block:
              raise SystemExit('redaction helper already present; refusing overlapping repair')

          lines = [
              '    private static let secretKeyFragments = [',
              '        "localkey",',
              '        "accesstoken",',
              '        "refreshtoken",',
              '        "authkey",',
              '        "seckey"',
              '    ]',
              '',
              '    private static func normalizedApplicationKey(_ key: String) -> String {',
              '        key.lowercased().filter { $0.isLetter || $0.isNumber }',
              '    }',
              '',
              '    private static func redactApplicationSecrets(_ object: Any) -> Any {',
              '        if let dictionary = object as? [AnyHashable: Any] {',
              '            var sanitized: [String: Any] = [:]',
              '            for (key, value) in dictionary {',
              '                let keyString = String(describing: key)',
              '                let normalizedKey = normalizedApplicationKey(keyString)',
              '                if secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {',
              '                    sanitized[keyString] = "<redacted>"',
              '                } else {',
              '                    sanitized[keyString] = redactApplicationSecrets(value)',
              '                }',
              '            }',
              '            return sanitized',
              '        }',
              '        if let array = object as? [Any] {',
              '            return array.map(redactApplicationSecrets)',
              '        }',
              '        return object',
              '    }',
              '',
              '    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {',
              '        guard let dps, !dps.isEmpty else { return }',
              '        var sanitized: [String: String] = [:]',
              '        for (key, value) in dps {',
              '            let keyString = String(describing: key)',
              '            let normalizedKey = Self.normalizedApplicationKey(keyString)',
              '            if Self.secretKeyFragments.contains(where: { normalizedKey.contains($0) }) {',
              '                sanitized[keyString] = "<redacted>"',
              '            } else {',
              '                sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))',
              '            }',
              '        }',
              '        onApplicationUpdate?(sanitized)',
              '    }',
          ]
          replacement = '\n'.join(lines)
          updated = source[:method_start] + replacement + source[method_end:]

          for needle in (
              'private static func redactApplicationSecrets(_ object: Any) -> Any',
              'key.lowercased().filter { $0.isLetter || $0.isNumber }',
              'array.map(redactApplicationSecrets)',
              'String(describing: Self.redactApplicationSecrets(value))',
              'sanitized[keyString] = "<redacted>"',
              'onApplicationUpdate?(sanitized)',
          ):
              if needle not in updated:
                  raise SystemExit(f'materialized source missing {needle}')
          if legacy in updated[class_start:updated.index('#endif', class_start)]:
              raise SystemExit('legacy unsanitized projection survived')

          path.write_text(updated)
          PY

          rm .github/workflows/materialize-capture-app-update-redaction-current-sol.yml
          git diff --check

      - name: Commit current-parent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only)" = $'.github/workflows/materialize-capture-app-update-redaction-current-sol.yml\nNembraApp/App/NembraCaptureEntrypoint.swift'
          git commit -m 'fix(capture): redact authenticated application secrets'
          git push origin HEAD:agent/v14-capture-app-update-redaction-current-sol
