name: Capture current native ACL baseline coherence one-shot

on:
  pull_request:
    paths:
      - .github/workflows/capture-native-acl-coherence-current-one-shot.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'repair/v17-capture-native-acl-coherence-current-gpt56sol-20260817'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='ec91775a613f3504723cca390cfa108e3e076143'
          test "${{ github.head_ref }}" = 'repair/v17-capture-native-acl-coherence-current-gpt56sol-20260817'
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          /usr/bin/git merge-base --is-ancestor "$parent" HEAD
          changed="$(/usr/bin/git diff --name-only "$parent"...HEAD)"
          test "$changed" = '.github/workflows/capture-native-acl-coherence-current-one-shot.yml'
          /usr/bin/git diff --check "$parent"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize native fd-path baseline coherence
        shell: python
        run: |
          from pathlib import Path

          orchestrator = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py')
          text = orchestrator.read_text(encoding='utf-8')

          marker = 'def _darwin_acl_library():\n'
          replacement = '_ACL_TYPE_EXTENDED = 0x00000100\n\n\n' + marker
          if text.count(marker) != 1:
              raise SystemExit(f'expected one Darwin ACL library marker, found {text.count(marker)}')
          text = text.replace(marker, replacement, 1)

          marker = '''    library.acl_get_fd.argtypes = [ctypes.c_int]\n    library.acl_get_fd.restype = ctypes.c_void_p\n'''
          replacement = '''    library.acl_get_fd.argtypes = [ctypes.c_int]\n    library.acl_get_fd.restype = ctypes.c_void_p\n    library.acl_get_file.argtypes = [ctypes.c_char_p, ctypes.c_int]\n    library.acl_get_file.restype = ctypes.c_void_p\n    library.acl_to_text.argtypes = [\n        ctypes.c_void_p,\n        ctypes.POINTER(ctypes.c_ssize_t),\n    ]\n    library.acl_to_text.restype = ctypes.c_void_p\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one Darwin ACL prototype marker, found {text.count(marker)}')
          text = text.replace(marker, replacement, 1)

          marker = '\n\ndef _restore_fd_acl_baseline(descriptor: int, baseline_acl: int) -> None:\n'
          helper = r'''

def _native_acl_text(library, acl_handle: int, *, context: str) -> bytes:
    if acl_handle <= 0:
        raise SelectedXcodeBuildOrchestratorError(
            f"private read-lease native ACL is unavailable for {context}"
        )
    length = ctypes.c_ssize_t(0)
    ctypes.set_errno(0)
    text_pointer = library.acl_to_text(
        ctypes.c_void_p(acl_handle), ctypes.byref(length)
    )
    saved_errno = ctypes.get_errno()
    if not text_pointer:
        raise SelectedXcodeBuildOrchestratorError(
            f"could not canonicalize private read-lease native ACL for {context}"
            + (f": errno {saved_errno}" if saved_errno else "")
        )
    try:
        if length.value < 0:
            raise SelectedXcodeBuildOrchestratorError(
                f"private read-lease native ACL text length is invalid for {context}"
            )
        return ctypes.string_at(text_pointer, length.value)
    finally:
        if library.acl_free(ctypes.c_void_p(text_pointer)) != 0:
            raise SelectedXcodeBuildOrchestratorError(
                f"could not free private read-lease native ACL text for {context}"
            )


def _free_native_acl_object(library, acl_handle: int, *, context: str) -> None:
    if acl_handle <= 0:
        return
    if library.acl_free(ctypes.c_void_p(acl_handle)) != 0:
        raise SelectedXcodeBuildOrchestratorError(
            f"could not free private read-lease native ACL object for {context}"
        )


def _require_native_acl_baseline_coherence(
    path: Path,
    descriptor: int,
    baseline_acl: int,
    accepted_signature: tuple[int, int, int],
    is_directory: bool,
) -> None:
    """Prove the retained fd rollback baseline equals canonical pre-grant truth."""
    _require_canonical_acl_identity(
        path, descriptor, accepted_signature, is_directory
    )
    library = _darwin_acl_library()
    ctypes.set_errno(0)
    path_acl = library.acl_get_file(os.fsencode(path), _ACL_TYPE_EXTENDED)
    path_errno = ctypes.get_errno()
    if path_acl:
        path_acl_handle = int(path_acl)
        try:
            baseline_text = _native_acl_text(
                library, baseline_acl, context=f"held descriptor baseline {path}"
            )
            path_text = _native_acl_text(
                library, path_acl_handle, context=f"canonical path baseline {path}"
            )
        finally:
            _free_native_acl_object(
                library, path_acl_handle, context=f"canonical path baseline {path}"
            )
        if baseline_text != path_text:
            raise SelectedXcodeBuildOrchestratorError(
                f"private read-lease native ACL baseline does not match canonical path: {path}"
            )
    else:
        if path_errno != errno.ENOENT:
            raise SelectedXcodeBuildOrchestratorError(
                f"could not classify canonical private read-lease ACL baseline: {path}"
                + (f": errno {path_errno}" if path_errno else ": null result without errno")
            )
        ctypes.set_errno(0)
        descriptor_acl = library.acl_get_fd(descriptor)
        descriptor_errno = ctypes.get_errno()
        if descriptor_acl:
            descriptor_acl_handle = int(descriptor_acl)
            _free_native_acl_object(
                library,
                descriptor_acl_handle,
                context=f"descriptor absence cross-check {path}",
            )
            raise SelectedXcodeBuildOrchestratorError(
                f"private read-lease native ACL baseline does not match canonical path: {path}"
            )
        if descriptor_errno != errno.ENOENT:
            raise SelectedXcodeBuildOrchestratorError(
                f"could not classify descriptor private read-lease ACL baseline: {path}"
                + (
                    f": errno {descriptor_errno}"
                    if descriptor_errno
                    else ": null result without errno"
                )
            )
    _require_canonical_acl_identity(
        path, descriptor, accepted_signature, is_directory
    )
'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one restore marker, found {text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)

          marker = '''                if self._use_native_darwin_acl:\n                    record["native_baseline_acl"] = _capture_fd_acl_baseline(descriptor)\n                    before = _path_acl_listing(\n                        path, descriptor, accepted_signature, is_directory\n                    )\n'''
          replacement = '''                if self._use_native_darwin_acl:\n                    record["native_baseline_acl"] = _capture_fd_acl_baseline(descriptor)\n                    _require_native_acl_baseline_coherence(\n                        path,\n                        descriptor,\n                        int(record["native_baseline_acl"]),\n                        accepted_signature,\n                        is_directory,\n                    )\n                    before = _path_acl_listing(\n                        path, descriptor, accepted_signature, is_directory\n                    )\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one native baseline call marker, found {text.count(marker)}')
          orchestrator.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          witness = Path('scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py')
          test_text = witness.read_text(encoding='utf-8')

          marker = '''def seed(root: Path):\n'''
          helpers = r'''def acl_listing(path: Path) -> str:
    completed = subprocess.run(
        ["/bin/ls", "-Hlde", str(path)],
        stdin=subprocess.DEVNULL,
        stdout=subprocess.PIPE,
        stderr=subprocess.PIPE,
        text=True,
        check=False,
    )
    if completed.returncode != 0:
        raise RuntimeError(completed.stderr or "could not inspect ACL")
    return completed.stdout


def add_acl(path: Path, ace: str) -> None:
    completed = subprocess.run(
        ["/bin/chmod", "+a", ace, str(path)],
        stdin=subprocess.DEVNULL,
        stdout=subprocess.PIPE,
        stderr=subprocess.PIPE,
        text=True,
        check=False,
    )
    if completed.returncode != 0:
        raise RuntimeError(completed.stderr or "could not seed ACL")


'''
          if test_text.count(marker) != 1:
              raise SystemExit(f'expected one seed marker, found {test_text.count(marker)}')
          test_text = test_text.replace(marker, helpers + marker, 1)

          marker = '''        after = field_run(self.field, self.groups, probe, *targets)\n        self.assertNotEqual(after.returncode, 0)\n'''
          addition = r'''        after = field_run(self.field, self.groups, probe, *targets)
        self.assertNotEqual(after.returncode, 0)

    def test_seeded_native_acl_baseline_is_restored_exactly(self):
        helper = load()
        root = self.outer / "accepted-seeded"
        root.mkdir(mode=0o700)
        seed(root)
        add_acl(root, "user:root allow readattr")
        baseline = acl_listing(root)
        target = root / "Podfile.lock"
        probe = "from pathlib import Path; import sys; Path(sys.argv[1]).read_bytes()"
        self.assertNotEqual(field_run(self.field, self.groups, probe, target).returncode, 0)

        lease = helper._PrivateReadLease((root,), root, use_native_darwin_acl=True)
        lease.grant(self.field.pw_name)
        try:
            during = field_run(self.field, self.groups, probe, target)
            self.assertEqual(during.returncode, 0, during.stderr)
        finally:
            lease.revoke()

        self.assertEqual(acl_listing(root), baseline)
        self.assertNotEqual(field_run(self.field, self.groups, probe, target).returncode, 0)

    def test_seeded_fd_path_baseline_mismatch_fails_before_authority(self):
        helper = load()
        root = self.outer / "accepted-mismatch"
        root.mkdir(mode=0o700)
        seed(root)
        add_acl(root, "user:root allow readattr")
        target = root / "Podfile.lock"
        probe = "from pathlib import Path; import sys; Path(sys.argv[1]).read_bytes()"
        original_capture = helper._capture_fd_acl_baseline
        mutated = False

        def capture_then_mutate(descriptor: int) -> int:
            nonlocal mutated
            baseline = original_capture(descriptor)
            if (
                not mutated
                and helper._descriptor_signature(descriptor)
                == helper._path_signature(root)
            ):
                add_acl(root, "group:wheel allow readattr")
                mutated = True
            return baseline

        helper._capture_fd_acl_baseline = capture_then_mutate
        lease = helper._PrivateReadLease((root,), root, use_native_darwin_acl=True)
        with self.assertRaisesRegex(
            helper.SelectedXcodeBuildOrchestratorError,
            "native ACL baseline does not match canonical path",
        ):
            lease.grant(self.field.pw_name)
        self.assertTrue(mutated)
        self.assertFalse(lease._opened)
        self.assertEqual(lease._principal, "")
        self.assertNotEqual(field_run(self.field, self.groups, probe, target).returncode, 0)
'''
          if test_text.count(marker) != 1:
              raise SystemExit(f'expected one existing test tail, found {test_text.count(marker)}')
          witness.write_text(test_text.replace(marker, addition, 1), encoding='utf-8')

      - name: Enforce two-path permanent delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          grep -q '_require_native_acl_baseline_coherence' scripts/ci/capture_selected_xcode_build_orchestrator.py
          grep -q 'acl_get_file' scripts/ci/capture_selected_xcode_build_orchestrator.py
          grep -q 'acl_to_text' scripts/ci/capture_selected_xcode_build_orchestrator.py
          grep -q 'test_seeded_fd_path_baseline_mismatch_fails_before_authority' scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py
          git diff --check

      - name: Commit exact materialized product ingredient
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py \
                  scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py
          git rm .github/workflows/capture-native-acl-coherence-current-one-shot.yml
          git diff --cached --check
          git commit -m 'Capture: require native ACL baseline coherence'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "NEMBRA_NATIVE_ACL_COHERENCE_MATERIALIZED_SHA=$(git rev-parse HEAD)"

      - name: Prove exact materialized seeded-baseline behavior
        shell: bash
        run: |
          set -euo pipefail
          materialized="$(git rev-parse HEAD)"
          /usr/bin/python3 -B -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py
          field_user="$(/usr/bin/id -un)"
          /usr/bin/sudo -n env \
            NEMBRA_TEST_FIELD_USER="$field_user" \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -B -I \
            scripts/ci/tests/test_capture_accepted_root_real_whole_read_lease.py \
            --field-user "$field_user"
          test "$(git rev-parse HEAD)" = "$materialized"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "NEMBRA_NATIVE_ACL_COHERENCE exactHead=$materialized fdPathSemanticEqualityRequired=true seededBaselineExactRestore=true mismatchFailsBeforeAuthority=true nullErrnoStillFailsClosed=true pathnameLossStillTerminal=true physicalAuthorityCreated=false"

      - name: Publish exact tested ingredient
        shell: bash
        run: |
          set -euo pipefail
          branch='repair/v17-capture-native-acl-coherence-current-gpt56sol-20260817'
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git push origin HEAD:"$branch"
          echo 'Production ingredient only. Final #3553/#3535 carrier must compose this and re-earn unchanged-head compiler/private/provenance/install gates. Physical NO-GO.'
