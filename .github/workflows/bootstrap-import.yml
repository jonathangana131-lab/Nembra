name: Bootstrap Nembra Source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct tested Nembra tree
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/part* > /tmp/nembra.b64
          echo "240a6b9b33ed5f2a67c83829fe1fed3171fa48a1fa62ba4b73d39e9f3c23b05c  /tmp/nembra.b64" | sha256sum -c -

          base64 --decode /tmp/nembra.b64 > /tmp/nembra.tar.gz
          echo "f14f0656e1c180cf7c3a931ca12a961244045f9345c9f3e249fd746df1fe1cef  /tmp/nembra.tar.gz" | sha256sum -c -

          gzip -dc /tmp/nembra.tar.gz > /tmp/nembra.tar
          tar -xf /tmp/nembra.tar

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import tested Nembra codebase"
          git push origin HEAD:main
