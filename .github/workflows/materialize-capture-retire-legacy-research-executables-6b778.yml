name: Materialize Capture Legacy Research Executable Retirement 6b778

on:
  push:
    branches:
      - sol/v14-capture-retire-legacy-research-executables-6b778

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current product and retired-doc / live-executable split
        shell: bash
        run: |
          set -euo pipefail
          parent='6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          test "$(git rev-parse HEAD^)" = "$parent"
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = '.github/workflows/materialize-capture-retire-legacy-research-executables-6b778.yml'
          test "$(git rev-parse "$parent:CAPTURE_TODAY_FIELD_READY_DIRECTIVE.md")" = '5f1092ee8a744e1417bf3659a9f9b02086afee84'
          test "$(git rev-parse "$parent:scripts/ci/xcode27_today_research_field_candidate.sh")" = 'b42ab38b98609c14f7b8cdcc46d653a7a3468cc6'
          test "$(git rev-parse "$parent:scripts/ci/xcode27_signed_field_candidate.sh")" = 'd9a3621ef5b0b3cdd2a70163ca71b35a1ce28b50'
          grep -Fq 'RETIRED / NON-AUTHORITATIVE / PHYSICAL NO-GO' CAPTURE_TODAY_FIELD_READY_DIRECTIVE.md
          grep -Fq 'exec "$CANONICAL_PRODUCER" --nembra-today-research-build "$@"' scripts/ci/xcode27_today_research_field_candidate.sh
          grep -Fq 'TODAY_RESEARCH_BUILD_MODE=1' scripts/ci/xcode27_signed_field_candidate.sh
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayExecutableAuthorityRetirementSourceTests.swift

      - name: Apply previously validated executable retirement only
        shell: bash
        run: |
          set -euo pipefail
          donor='b305d4487bb2ac31e99df994a64f494eed2c4bf9'
          git fetch --no-tags origin sol/v14-capture-retire-today-fingerprint-3f269
          test "$(git rev-parse FETCH_HEAD)" = "$donor"
          git checkout "$donor" -- scripts/ci/xcode27_today_research_field_candidate.sh scripts/ci/xcode27_signed_field_candidate.sh
          printf '%s' '' | base64 -d > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayExecutableAuthorityRetirementSourceTests.swift
          git diff --check

      - name: Validate fail-closed legacy execution and current authority
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/xcode27_today_research_field_candidate.sh
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          set +e
          wrapper_output="$(bash -p scripts/ci/xcode27_today_research_field_candidate.sh 2>&1)"
          wrapper_status=$?
          producer_output="$(bash -p scripts/ci/xcode27_signed_field_candidate.sh --nembra-today-research-build 2>&1)"
          producer_status=$?
          set -e
          test "$wrapper_status" = 64
          test "$producer_status" = 64
          grep -Fq 'SUPERSEDED:' <<< "$wrapper_output"
          grep -Fq 'ES80-AUTHENTICATED-STATIONARY-v1' <<< "$wrapper_output"
          grep -Fq 'SUPERSEDED: --nembra-today-research-build' <<< "$producer_output"
          grep -Fq 'RETIRED / NON-AUTHORITATIVE / PHYSICAL NO-GO' CAPTURE_TODAY_FIELD_READY_DIRECTIVE.md
          grep -Fq 'PROCEDURE_ID="ES80-AUTHENTICATED-STATIONARY-v1"' scripts/field/install_one_time_capture.command
          grep -Fq 'requiredFieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"' NembraApp/App/NembraCaptureBuildIdentity.swift
          grep -Fq "procedure='ES80-AUTHENTICATED-STATIONARY-v1'" .github/workflows/capture-field-build-provenance.yml
          grep -Fq 'PROCEDURE_ID: `ES80-AUTHENTICATED-STATIONARY-v1`' docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayExecutableAuthorityRetirementSourceTests.swift

      - name: Collapse helper and publish clean current-product repair
        shell: bash
        run: |
          set -euo pipefail
          parent='6b778f2104af34dbe5b80da31ddb3ca422f9667c'
          rm .github/workflows/materialize-capture-retire-legacy-research-executables-6b778.yml
          git add scripts/ci/xcode27_today_research_field_candidate.sh \
            scripts/ci/xcode27_signed_field_candidate.sh \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayExecutableAuthorityRetirementSourceTests.swift
          git add -u .github/workflows/materialize-capture-retire-legacy-research-executables-6b778.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): retire legacy Research executable authority'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 3
          test "${changed[0]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaLegacyTodayExecutableAuthorityRetirementSourceTests.swift'
          test "${changed[1]}" = 'scripts/ci/xcode27_signed_field_candidate.sh'
          test "${changed[2]}" = 'scripts/ci/xcode27_today_research_field_candidate.sh'
          git diff --check "$parent" HEAD
          git push origin HEAD:sol/v14-capture-retire-legacy-research-executables-6b778
