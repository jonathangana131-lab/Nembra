name: Reanchor Capture app-secret custody on 172d

on:
  push:
    branches:
      - fix/v14-capture-app-secret-value-custody-172d-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only the proven two-path semantic delta
        shell: bash
        run: |
          set -euo pipefail
          base=172dca56a1bc018e192feec197ceb17f81db5dab
          oldbase=d56a30c699fbdecec6130537d3f3f4f4232f5c47
          donor=797e871fda2ab9f2e9e0abea6de58bc7f78300e3
          workflow=.github/workflows/capture-app-secret-value-custody-172d-materializer.yml
          source=NembraApp/App/NembraCaptureEntrypoint.swift
          test=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"
          git diff --binary "$oldbase" "$donor" -- "$source" "$test" > /tmp/secret-custody.patch
          test -s /tmp/secret-custody.patch
          git apply --check /tmp/secret-custody.patch
          git apply /tmp/secret-custody.patch
          git diff --check
          grep -Fq 'NembraTuyaPrivateIdentity.appKey' "$source"
          grep -Fq 'NembraTuyaPrivateIdentity.appSecret' "$source"
          grep -Fq 'let exactSecretValues = Self.exactSecretValues' "$source"
          ! grep -Fq 'String(describing: Self.redactApplicationSecrets(value))' "$source"
          if command -v swiftc >/dev/null 2>&1; then swiftc -parse "$source"; fi
          rm "$workflow"
          test "$(git status --short | awk '{print $2}' | sort)" = "$(printf '%s\n%s\n' "$source" "$test" | sort)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(capture): bind private app secrets to event custody'
          git push origin HEAD:fix/v14-capture-app-secret-value-custody-172d-sol
