# One-shot repair for the failed component-walk authoring workflow.
name: Capture Read Lease Materializer Whitespace Repair Once

on:
  pull_request:
    paths:
      - .github/workflows/capture-read-lease-materializer-whitespace-repair-once.yml
  push:
    branches:
      - hardening/v17-capture-read-lease-component-walk-sol-20260814
    paths:
      - .github/workflows/capture-read-lease-materializer-whitespace-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact failed authoring state
        shell: bash
        run: |
          set -euo pipefail
          BASE=578b389e7974ff8814020d773ee0115531b654be
          MATERIALIZER=.github/workflows/capture-read-lease-component-walk-materialize.yml
          SELF=.github/workflows/capture-read-lease-materializer-whitespace-repair-once.yml
          changed="$(git diff --name-only "$BASE"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$MATERIALIZER" "$SELF" | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Remove the double indentation stripping bug
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/capture-read-lease-component-walk-materialize.yml')
          source = path.read_text(encoding='utf-8')
          marker = ".replace('          ', '')"
          count = source.count(marker)
          if count != 4:
              raise SystemExit(f'expected exactly four double-indent stripping calls, found {count}')
          path.write_text(source.replace(marker, ''), encoding='utf-8')
          PY
          git diff --check

      - name: Self-delete and publish repaired authoring workflow
        shell: bash
        env:
          BRANCH: hardening/v17-capture-read-lease-component-walk-sol-20260814
          MATERIALIZER: .github/workflows/capture-read-lease-component-walk-materialize.yml
          SELF: .github/workflows/capture-read-lease-materializer-whitespace-repair-once.yml
        run: |
          set -euo pipefail
          git rm "$SELF"
          git add "$MATERIALIZER"
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$MATERIALIZER" "$SELF" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'nembra-swarm-materializer'
          git config user.email 'nembra-swarm@users.noreply.github.com'
          git commit -m 'ci(capture): fix component-walk authoring whitespace'
          git push origin "HEAD:$BRANCH"
