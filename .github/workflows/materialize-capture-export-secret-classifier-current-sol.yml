name: Materialize current Capture shared export secret classifier

on:
  push:
    branches:
      - agent/v14-capture-export-secret-classifier-current-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - name: Verify exact product ancestry and prerequisite scope
        shell: bash
        run: |
          set -euo pipefail
          expected='870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81'
          git merge-base --is-ancestor "$expected" HEAD
          actual="$(git diff --name-only "$expected" HEAD | sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/materialize-capture-export-secret-classifier-current-sol.yml' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift' | sort)"
          test "$actual" = "$wanted"

      - name: Replace duplicated app policy with shared package sanitizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()
          class_marker = '@MainActor\nprivate final class SmartLifeDriver'
          method_marker = '    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {'
          class_start = source.index(class_marker)
          method_start = source.index(method_marker, class_start)
          class_end = source.index('\n}\n#endif\n\nprivate enum AppleAccountAuthorizationError', method_start)
          current_tail = source[method_start:class_end]

          for needle in (
              'private static let secretKeyFragments = [',
              '"appkey",',
              '"appsecret",',
              '"password",',
              '"accounttoken",',
              'private static func redactApplicationSecrets(_ object: Any) -> Any',
              'String(describing: Self.redactApplicationSecrets(value))',
          ):
              if needle not in current_tail:
                  raise SystemExit(f'current product sanitizer changed; missing {needle}')

          replacement = '''    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {
              guard let dps, !dps.isEmpty else { return }
              onApplicationUpdate?(
                  TuyaApplicationUpdateSecretSanitizer.sanitizeForStringProjection(dps)
              )
          }
          '''
          updated = source[:method_start] + replacement + source[class_end:]
          driver = updated[class_start:updated.index('#endif', class_start)]

          if 'TuyaApplicationUpdateSecretSanitizer.sanitizeForStringProjection(dps)' not in driver:
              raise SystemExit('shared sanitizer call missing after rewrite')
          for forbidden in (
              'private static let secretKeyFragments',
              'private static func redactApplicationSecrets',
              'String(describing: value)',
          ):
              if forbidden in driver:
                  raise SystemExit(f'duplicated app sanitizer policy survived: {forbidden}')

          path.write_text(updated)
          PY

      - name: Validate shared authority and source contracts
        shell: bash
        run: |
          set -euo pipefail
          helper='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift'
          behavior='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift'
          promise='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift'
          app='NembraApp/App/NembraCaptureEntrypoint.swift'

          swiftc -warnings-as-errors -emit-library -module-name SanitizerProbe "$helper" -o /tmp/libSanitizerProbe.so
          swiftc -frontend -parse "$behavior"
          swiftc -frontend -parse "$promise"
          swiftc -frontend -parse "$app"

          for fragment in localkey sessionkey appkey appsecret password accounttoken accesstoken refreshtoken authkey seckey; do
            grep -q "\"${fragment}\"" "$helper"
          done
          grep -q 'TuyaApplicationUpdateSecretSanitizer.sanitizeForStringProjection(dps)' "$app"
          ! grep -A80 'private final class SmartLifeDriver' "$app" | grep -q 'private static let secretKeyFragments'
          grep -q 'secretsRedacted: true' "$app"
          grep -q 'No account UID, AppKey/AppSecret, password, account token, local_key, session key' "$app"
          git diff --check

      - name: Execute portable secret-custody behavior probe
        shell: bash
        run: |
          set -euo pipefail
          helper='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift'
          cp "$helper" /tmp/main.swift
          cat >> /tmp/main.swift <<'SWIFT'

          private func require(_ condition: @autoclosure () -> Bool, _ message: String) {
              guard condition() else { fatalError(message) }
          }

          let promisedSpellings = [
              "local_key", "session-key", "app.key", "appSecret", "password",
              "account_token", "accessToken", "refresh-token", "auth_key", "secKey"
          ]
          for key in promisedSpellings {
              require(TuyaApplicationUpdateSecretSanitizer.isSecretKey(key), "missing promised class: \(key)")
          }

          let projected = TuyaApplicationUpdateSecretSanitizer.sanitizeForStringProjection([
              "password": "do-not-export",
              "ordinary": "evidence",
              "nested": [
                  "session_key": "session-value",
                  "items": [["appSecret": "app-secret-value"], ["watts": 120]],
              ],
          ])
          require(projected["password"] == "<redacted>", "top-level password escaped")
          require(projected["ordinary"] == "evidence", "ordinary evidence changed")
          require(projected["nested"]?.contains("session-value") == false, "session key escaped")
          require(projected["nested"]?.contains("app-secret-value") == false, "app secret escaped")
          require(projected["nested"]?.contains("<redacted>") == true, "redaction marker missing")
          require(!TuyaApplicationUpdateSecretSanitizer.isSecretKey("battery"), "battery over-redacted")
          SWIFT
          swiftc -warnings-as-errors /tmp/main.swift -o /tmp/sanitizer-probe
          /tmp/sanitizer-probe

      - name: Retire helper workflow and commit simplification
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-export-secret-classifier-current-sol.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only '870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81' | sort)"
          wanted="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift' | sort)"
          test "$actual" = "$wanted"
          git commit -m 'refactor(capture): centralize export secret custody'
          git push origin HEAD:agent/v14-capture-export-secret-classifier-current-sol
