name: Materialize Capture view-exit hidden-start recovery

on:
  push:
    branches:
      - recovery/v14-capture-view-exit-hidden-start-b59-sol

permissions:
  contents: write

concurrency:
  group: capture-view-exit-hidden-start-b59-sol
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-view-exit-hidden-start-b59-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact current product and recovery scope
        shell: bash
        run: |
          set -euo pipefail
          parent='b59cd71272b465bcad70fcc3425382bb29541b2e'
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-parse "$parent:NembraApp/App/NembraCaptureEntrypoint.swift")" = "$(git rev-parse HEAD:NembraApp/App/NembraCaptureEntrypoint.swift)"
          unexpected="$(git diff --name-only "$parent"...HEAD | grep -Ev '^(.github/workflows/materialize-capture-view-exit-hidden-start-b59-sol.yml|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift)$' || true)"
          test -z "$unexpected"

      - name: Apply bounded hidden-start authority retirement
        shell: python
        run: |
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          old = '''    func abandonCorrelationForViewExit() {
        guard processCorrelationLease != nil || correlationSession != nil else { return }
        abandonPackageCorrelation()
        phase = .failed
        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."
        log("target_correlation_abandoned_on_view_exit")
    }'''
          new = '''    func abandonCorrelationForViewExit() {
        // Secure Link can disappear while current-account membership enumeration is still
        // in flight, before OFF1 owns a scanner/lease. Revoke that callback authority first
        // so a late successful membership result cannot start hidden package correlation.
        membershipRequestID = UUID()
        membershipBusy = false
#if canImport(ThingSmartHomeKit)
        membershipProbe = nil
#endif

        guard processCorrelationLease != nil || correlationSession != nil else { return }
        // Preserve the accepted radio ordering: explicit package transport retirement first,
        // then owner-token lease release inside abandonPackageCorrelation().
        abandonPackageCorrelation()
        phase = .failed
        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."
        log("target_correlation_abandoned_on_view_exit")
    }'''
          if source.count(old) != 1:
              raise SystemExit(f'exact view-exit helper anchor changed: {source.count(old)}')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

      - name: Verify truth and no-authority expansion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = source.index('func abandonCorrelationForViewExit()')
          end = source.index('var privateConfig: Bool', start)
          cleanup = source[start:end]
          required = (
              'membershipRequestID = UUID()',
              'membershipBusy = false',
              'membershipProbe = nil',
              'guard processCorrelationLease != nil || correlationSession != nil else { return }',
              'abandonPackageCorrelation()',
              'target_correlation_abandoned_on_view_exit',
          )
          for needle in required:
              assert needle in cleanup, needle
          assert cleanup.index('membershipRequestID = UUID()') < cleanup.index('guard processCorrelationLease')
          assert cleanup.index('membershipProbe = nil') < cleanup.index('guard processCorrelationLease')
          assert 'releasePackageCorrelationLease()' not in cleanup
          for forbidden in ('connectBLE(', 'publishDps', 'writeValue', 'disconnect'):
              assert forbidden not in cleanup, forbidden
          assert 'guard !packageCorrelationRetiredForProcess,' in source, 'single official-driver retirement guard lost'
          assert '.onDisappear {' in source and 'test.abandonCorrelationForViewExit()' in source, 'view exit hook lost'
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift').read_text(encoding='utf-8')
          for needle in ('membershipRequestID = UUID()', 'membershipBusy = false', 'membershipProbe = nil', 'abandonPackageCorrelation()'):
              assert needle in test, needle
          print('view-exit hidden-start authority recovery contract: PASS')
          PY
          git diff --check

      - name: Publish clean two-path recovery and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m "fix(capture): cancel hidden correlation start on view exit"
          git rm .github/workflows/materialize-capture-view-exit-hidden-start-b59-sol.yml
          git commit -m "chore(capture): retire hidden-start recovery materializer"
          git push origin HEAD:recovery/v14-capture-view-exit-hidden-start-b59-sol
