name: ES80 V14 Rider Copy Guard Cardinality Fix

on:
  push:
    branches:
      - "polish/es80-v14-human-first-rider-copy-current/chatgpt56-thinking-go"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "polish/es80-v14-human-first-rider-copy-current/chatgpt56-thinking-go"

      - name: Correct exact-match cardinality
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/ci/tmp_es80_rider_copy_second_pass.py")
          fixer = Path(".github/workflows/es80-v14-rider-copy-guard-cardinality-fix.yml")
          text = script.read_text(encoding="utf-8")
          old = "('begin this bounded observation window.', 'begin this capture window.', 2),"
          new = "('begin this bounded observation window.', 'begin this capture window.', 1),"
          if text.count(old) != 1:
              raise SystemExit(f"expected one old cardinality guard, got {text.count(old)}")
          script.write_text(text.replace(old, new, 1), encoding="utf-8")
          fixer.unlink()
          PY
          git diff --check
          test ! -e .github/workflows/es80-v14-rider-copy-guard-cardinality-fix.yml

      - name: Commit corrected guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-go-worker"
          git config user.email "nembra-go-worker@users.noreply.github.com"
          git add scripts/ci/tmp_es80_rider_copy_second_pass.py .github/workflows/es80-v14-rider-copy-guard-cardinality-fix.yml
          git commit -m "[Capture product v14] Correct rider-copy guard cardinality"
          git push origin HEAD:"polish/es80-v14-human-first-rider-copy-current/chatgpt56-thinking-go"
