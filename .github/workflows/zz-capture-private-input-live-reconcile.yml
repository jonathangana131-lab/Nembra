name: Capture external private-input live reconciliation

on:
  push:
    branches:
      - integration/es80-v14-private-input-external-compose-go

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact composed parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6e00efb0e15cce730a3dcffc0e4cc74d1fabf323"

      - name: Merge exact live flagship head
        shell: bash
        run: |
          set -euo pipefail
          LIVE_FLAGSHIP="67571443bd0812b2fee4a608d4a0f820b47ea9df"
          git fetch --no-tags origin "$LIVE_FLAGSHIP"
          test "$(git cat-file -t "$LIVE_FLAGSHIP")" = commit
          git merge-base --is-ancestor 77bfc265601b8e52d0cf89a6d5b2426dcfcc20cc "$LIVE_FLAGSHIP"
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff --no-edit "$LIVE_FLAGSHIP"

      - name: Validate reconciled privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_private_runner.py
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_evidence.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          python3 scripts/ci/es80_signed_field_artifact_evidence.py --self-test
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
          git diff --check HEAD^
          test "$(git diff --name-only 67571443bd0812b2fee4a608d4a0f820b47ea9df...HEAD | sort)" = "$(printf '%s\n' \
            .github/workflows/zz-capture-private-input-live-reconcile.yml \
            scripts/ci/es80_signed_field_artifact_private_runner.py \
            scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py \
            scripts/ci/tests/test_xcode27_signed_field_candidate_source.py \
            scripts/ci/xcode27_signed_field_candidate.sh | sort)"

      - name: Remove reconciler and publish checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-capture-private-input-live-reconcile.yml
          git add .github/workflows/zz-capture-private-input-live-reconcile.yml
          git diff --cached --check
          git commit -m "chore(capture): retire external-input reconciler"
          git push origin HEAD:integration/es80-v14-private-input-external-compose-go
