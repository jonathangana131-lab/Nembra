name: Temporary Retire Passive Final GO CLI

on:
  push:
    branches:
      - repair/v14-retire-passive-final-go-cli-sol
    paths:
      - .github/workflows/tmp-retire-passive-final-go-cli.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-retire-passive-final-go-cli-sol
          fetch-depth: 0

      - name: Bind to exact flagship parent
        shell: bash
        env:
          EXPECTED_BASE: 8292b51e5df90744950e7f0d4a04684523520563
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git diff --name-only "$EXPECTED_BASE" HEAD)" = '.github/workflows/tmp-retire-passive-final-go-cli.yml'

      - name: Fence retired passive issuer direct execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path('scripts/ci/es80_today_final_go_hardened.py')
          text = script.read_text()
          old = '''def main(argv: list[str] | None = None) -> int:
              args = _args(sys.argv[1:] if argv is None else argv)
              values = vars(args).copy()
              output = values.pop("output")
              try:
                  record = build_final_go_record(**values)
                  raw = (json.dumps(record, indent=2, sort_keys=True) + "\\n").encode()
                  record_sha = publish_record_no_replace(output, raw)
              except (FinalGoError, FileNotFoundError, OSError) as error:
                  print(f"TODAY Final GO: NO-GO: {error}", file=sys.stderr)
                  return 2
              print(f"TODAY Final GO record: {output.resolve(strict=True)}")
              print(f"record_sha256={record_sha}")
              print("PHYSICAL RESULT COLLECTED: NO")
              return 0
          '''.replace('\n          ', '\n')
          new = '''RETIRED_DIRECT_EXECUTION_MESSAGE = (
              "retired ES80-FINGERPRINT-v1 Final GO authority is non-authorizing; "
              "current physical authorization requires the external reviewed "
              "ES80-AUTHENTICATED-STATIONARY-v1 control plane"
          )
          
          
          def main(argv: list[str] | None = None) -> int:
              # Preserve the historical validator library for adversarial regression evidence,
              # but never let this retired passive-procedure executable publish GO again.
              _ = argv
              print(f"TODAY Final GO: NO-GO: {RETIRED_DIRECT_EXECUTION_MESSAGE}", file=sys.stderr)
              return 2
          '''.replace('\n          ', '\n')
          if text.count(old) != 1 or 'RETIRED_DIRECT_EXECUTION_MESSAGE' in text:
              raise SystemExit('retired issuer main transform did not match exact parent')
          script.write_text(text.replace(old, new, 1))

          tests = Path('scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py')
          text = tests.read_text()
          marker = '    def test_public_foundation_imported_builder_is_non_authorizing(self):\n'
          addition = '''    def test_retired_hardened_entrypoint_is_non_authorizing(self):
              completed = subprocess.run(
                  [sys.executable, str(CI_DIR / "es80_today_final_go_hardened.py"), "--help"],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              self.assertEqual(completed.returncode, 2)
              self.assertEqual(completed.stdout, "")
              self.assertIn("retired ES80-FINGERPRINT-v1 Final GO authority is non-authorizing", completed.stderr)
              self.assertIn("ES80-AUTHENTICATED-STATIONARY-v1", completed.stderr)
              self.assertNotIn("TODAY Final GO record:", completed.stderr)
          
          '''.replace('\n          ', '\n')
          if text.count(marker) != 1 or 'test_retired_hardened_entrypoint_is_non_authorizing' in text:
              raise SystemExit('retired direct-execution test insertion mismatch')
          tests.write_text(text.replace(marker, addition + marker, 1))

          workflow = Path('.github/workflows/capture-today-final-go-qa.yml')
          text = workflow.read_text()
          old = '''      - name: Reject naked Boolean Final GO CLI authority
                run: |
                  set -euo pipefail
                  help="$(python3 scripts/ci/es80_today_final_go_hardened.py --help)"
                  ! grep -Eq -- '--(terminal-software-acceptance|installed-without-rebuild|retained-app-evidence-inspected|intended-device-membership-accepted|no-application-write-authority|research-admission-live|canonical-coordinator-permitted|preflight-healthy|charger-disconnected|stationary)' <<<"$help"
                  grep -Fq -- '--operator-attestation' <<<"$help"
                  grep -Fq -- '--trusted-xcode-run-id' <<<"$help"
                  grep -Fq -- '--trusted-xcode-job-id' <<<"$help"
                  grep -Fq -- '--trusted-xcode-artifact-id' <<<"$help"
          '''.replace('\n                ', '\n      ').replace('\n                  ', '\n        ')
          new = '''      - name: Reject retired passive Final GO executable authority
                run: |
                  set -euo pipefail
                  set +e
                  output="$(python3 scripts/ci/es80_today_final_go_hardened.py --help 2>&1)"
                  status=$?
                  set -e
                  test "$status" -eq 2
                  grep -Fq 'retired ES80-FINGERPRINT-v1 Final GO authority is non-authorizing' <<<"$output"
                  grep -Fq 'ES80-AUTHENTICATED-STATIONARY-v1' <<<"$output"
                  ! grep -Fq 'TODAY Final GO record:' <<<"$output"
          '''.replace('\n                ', '\n      ').replace('\n                  ', '\n        ')
          if text.count(old) != 1:
              raise SystemExit('legacy workflow CLI assertion block did not match exact parent')
          workflow.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Validate retired authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py
          python3 scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py -v
          python3 scripts/ci/tests/test_es80_today_final_go_hardened.py -v
          python3 scripts/ci/tests/test_es80_today_final_go_legacy_entrypoint.py -v
          set +e
          output="$(python3 scripts/ci/es80_today_final_go_hardened.py --help 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -Fq 'retired ES80-FINGERPRINT-v1 Final GO authority is non-authorizing' <<<"$output"
          grep -Fq 'ES80-AUTHENTICATED-STATIONARY-v1' <<<"$output"
          ! grep -Fq 'TODAY Final GO record:' <<<"$output"
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('.github/workflows/capture-today-final-go-qa.yml').read_text())
          PY

      - name: Publish clean repair checkpoint
        shell: bash
        env:
          BRANCH: repair/v14-retire-passive-final-go-cli-sol
        run: |
          set -euo pipefail
          trigger="$(git rev-parse HEAD)"
          rm .github/workflows/tmp-retire-passive-final-go-cli.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          expected="$(cat <<'EOF' | sort
          .github/workflows/capture-today-final-go-qa.yml
          .github/workflows/tmp-retire-passive-final-go-cli.yml
          scripts/ci/es80_today_final_go_hardened.py
          scripts/ci/tests/test_es80_today_final_go_direct_execution_disabled.py
          EOF
          )"
          actual="$(git status --porcelain=v1 | sed -E 's/^...//' | sort)"
          test "$actual" = "$expected"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): retire passive Final-GO executable authority'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$trigger"
          git push origin HEAD:"$BRANCH"