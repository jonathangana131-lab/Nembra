name: Diagnose Capture stamped Simulator f0fb

on:
  push:
    branches:
      - diagnostic/v14-capture-simulator-f0fb-sol

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f0fb83da5f57f9e92d29cf6ab444dc856e74c3a4
      - name: Apply already-proven compile fixes in workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shell = Path('NembraApp/Features/Research/ES80CaptureShellView.swift')
          shell_text = shell.read_text()
          old = 'CBAdvertisementDataIsConnectableKey'
          if shell_text.count(old) != 2:
              raise SystemExit(f'expected two stale connectable symbols, found {shell_text.count(old)}')
          shell.write_text(shell_text.replace(old, 'CBAdvertisementDataIsConnectable'))

          entry = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          entry_text = entry.read_text()
          old_boundary = '            membershipDeviceID: membershipDeviceID\n'
          new_boundary = '            membershipDeviceID: membershipDeviceID ?? ""\n'
          if entry_text.count(old_boundary) != 1:
              raise SystemExit(f'expected one optional membership device boundary, found {entry_text.count(old_boundary)}')
          entry.write_text(entry_text.replace(old_boundary, new_boundary, 1))
          PY
      - name: Reproduce stamped Simulator build with surfaced diagnostics
        shell: bash
        run: |
          set -uo pipefail
          sha='f0fb83da5f57f9e92d29cf6ab444dc856e74c3a4'
          dependency_sha='abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
          procedure='ES80-AUTHENTICATED-STATIONARY-v1'
          label="capture-v14-${sha:0:12}"
          log="$RUNNER_TEMP/nembra-capture-sim-build.log"
          rm -rf /tmp/NembraCaptureProvenanceDerived
          set +e
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureProvenanceDerived \
            CODE_SIGNING_ALLOWED=NO \
            NEMBRA_CAPTURE_BUILD_IDENTIFIER="$label" \
            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$sha" \
            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="$dependency_sha" \
            INFOPLIST_KEY_NembraCaptureProcedureIdentifier="$procedure" \
            build >"$log" 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            python3 - "$log" "$status" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          status = sys.argv[2]
          lines = path.read_text(errors='replace').splitlines()
          interesting = []
          patterns = [r'\berror:', r'BUILD FAILED', r'Command .* failed', r'Undefined symbols', r'No such module', r'could not build', r'failed with exit code']
          for line in lines:
              if any(re.search(p, line, re.I) for p in patterns):
                  interesting.append(line.strip())
          seen = set()
          emitted = 0
          for line in interesting:
              if not line or line in seen:
                  continue
              seen.add(line)
              safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Stamped Simulator build::{safe[:3000]}')
              emitted += 1
              if emitted >= 20:
                  break
          if emitted == 0:
              tail = '\n'.join(lines[-60:])
              safe = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Stamped Simulator build tail::{safe[:3000]}')
          raise SystemExit(int(status))
          PY
          fi

          plist='/tmp/NembraCaptureProvenanceDerived/Build/Products/Debug-iphonesimulator/Nembra Capture.app/Info.plist'
          if [[ ! -f "$plist" ]]; then
            echo '::error title=Stamped Simulator provenance::built app Info.plist is missing'
            exit 1
          fi

          failures=0
          check_plist() {
            local key="$1" expected="$2" actual=''
            if ! actual="$(plutil -extract "$key" raw -o - "$plist" 2>/dev/null)"; then
              echo "::error title=Stamped Simulator provenance::$key is missing from built Info.plist"
              failures=$((failures + 1))
              return
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::error title=Stamped Simulator provenance::$key mismatch: expected '$expected', got '$actual'"
              failures=$((failures + 1))
            else
              echo "$key=$actual"
            fi
          }

          check_plist NembraCaptureBuildIdentifier "$label"
          check_plist NembraCaptureSourceCommitSHA "$sha"
          check_plist NembraCaptureTuyaDependencyLockSHA256 "$dependency_sha"
          check_plist NembraCaptureProcedureIdentifier "$procedure"
          test "$failures" = '0'
