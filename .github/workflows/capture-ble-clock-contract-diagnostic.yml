name: Capture BLE + Clock Contract Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/capture-ble-clock-contract-diagnostic.yml'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMidSeriesBLEOwnershipSourceTests.swift'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppChronologyIntegrityTerminalSourceTests.swift'

permissions:
  contents: read

jobs:
  package-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact diagnostic composition
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PRODUCT_ANCESTOR: 4189c060f214ba561c9cbb01d715a1e00b7f5be4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          actual="$(git diff --name-only "$PRODUCT_ANCESTOR" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-ble-clock-contract-diagnostic.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAppChronologyIntegrityTerminalSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMidSeriesBLEOwnershipSourceTests.swift' | sort)"
          test "$actual" = "$expected"
          git diff --check "$PRODUCT_ANCESTOR" HEAD
      - name: Run Capture package and retain differential
        id: package
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/capture-ble-clock-contract.log"
          set +e
          (cd Packages/NembraBluetoothCapture && swift test) 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          /usr/bin/python3 -I - "$log" <<'PY'
          import re, sys
          from collections import Counter
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          files = Counter()
          total = None
          for line in lines:
              match = re.search(r'at ([A-Za-z0-9_]+\.swift):\d+:\d+:', line)
              if match and ('recorded an issue' in line or 'Caught error' in line):
                  files[match.group(1)] += 1
              final = re.search(r'Test run with 923 tests in 226 suites failed .* with (\d+) issues\.', line)
              if final:
                  total = int(final.group(1))
          for name, count in files.most_common():
              print(f'PACKAGE_ISSUES {count:3d} {name}')
          targets = (
              'TuyaMidSeriesBLEOwnershipSourceTests.swift',
              'TuyaAppChronologyIntegrityTerminalSourceTests.swift',
          )
          for target in targets:
              if files[target] != 0:
                  raise SystemExit(f'target still has {files[target]} issue(s): {target}')
          if total != 76:
              raise SystemExit(f'expected exact 78 -> 76 differential; observed total={total!r}')
          print('EXACT_DIFFERENTIAL 78 -> 76; target files 0 issues')
          PY
      - name: Upload exact package log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capture-ble-clock-contract-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/capture-ble-clock-contract.log
          retention-days: 7
          if-no-files-found: error
      - name: Preserve global package failure truth
        env:
          PACKAGE_STATUS: ${{ steps.package.outputs.status }}
        run: |
          test "$PACKAGE_STATUS" != 0
          echo 'Targeted differential passed, but the Capture package remains globally red by design.'
