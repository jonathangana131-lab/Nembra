name: Capture TODAY Final GO Authority Red Team R2

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_final_go_publication.py
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/es80_today_final_go_hardened.py
      - scripts/ci/tests/test_es80_today_final_go_authority_redteam_r2.py
      - .github/workflows/capture-today-final-go-authority-redteam-r2.yml

permissions:
  contents: read

jobs:
  authority-redteam:
    name: Reproduce current Final GO authority blockers
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile current authority modules and red-team regression
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_today_final_go_publication.py
          python3 -m py_compile scripts/ci/es80_today_trusted_capture_xcode_subject.py
          python3 -m py_compile scripts/ci/es80_today_final_go_hardened.py
          python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_authority_redteam_r2.py
      - name: Require fail-closed current Final GO authority
        run: python3 scripts/ci/tests/test_es80_today_final_go_authority_redteam_r2.py -v
