name: Capture Trusted Xcode Producer Workflow Parity QA

on:
  push:
    branches:
      - validation/v14-trusted-xcode-producer-workflow-parity/gpt56-go
  pull_request:
    paths:
      - .github/workflows/capture-xcode27-trusted-command.yml
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/tests/test_capture_trusted_xcode_producer_workflow_parity.py
      - .github/workflows/capture-trusted-xcode-producer-workflow-parity-qa.yml

permissions:
  contents: read

jobs:
  parity:
    name: Require trusted workflow producer custody parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile parity regression
        run: python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_producer_workflow_parity.py
      - name: Require workflow/verifier producer-custody parity
        run: python3 scripts/ci/tests/test_capture_trusted_xcode_producer_workflow_parity.py -v
