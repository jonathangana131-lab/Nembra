name: Recover Capture view-exit membership revocation r2

on:
  push:
    branches:
      - repair/v14-capture-view-exit-membership-race-r2-sol

permissions:
  contents: write

jobs:
  materialize-hidden-start-fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Bind exact product parent and regression scope
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_PARENT=b59cd71272b465bcad70fcc3425382bb29541b2e
          WORKFLOW=.github/workflows/recover-capture-view-exit-membership-race-r2-sol.yml
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          git merge-base --is-ancestor "$PRODUCT_PARENT" HEAD
          actual="$(git diff --name-only "$PRODUCT_PARENT" HEAD | sort)"
          expected="$(printf '%s\n%s\n' "$TEST" "$WORKFLOW" | sort)"
          test "$actual" = "$expected"

      - name: Revoke membership callback generation before exit early return
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          old = (
              "    func abandonCorrelationForViewExit() {\n"
              "        guard processCorrelationLease != nil || correlationSession != nil else { return }\n"
              "        abandonPackageCorrelation()\n"
              "        phase = .failed\n"
              "        message = \"Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series.\"\n"
              "        log(\"target_correlation_abandoned_on_view_exit\")\n"
              "    }\n"
          )
          new = (
              "    func abandonCorrelationForViewExit() {\n"
              "        // A current-account membership result can still be in flight before OFF1 exists\n"
              "        // or during the final pre-authentication recheck. Revoke that callback generation\n"
              "        // before any no-scanner/no-lease early return so leaving Secure Link cannot start\n"
              "        // hidden package correlation or official Tuya ownership after navigation exit.\n"
              "        membershipRequestID = UUID()\n"
              "        membershipBusy = false\n"
              "#if canImport(ThingSmartHomeKit)\n"
              "        membershipProbe = nil\n"
              "#endif\n"
              "        guard processCorrelationLease != nil || correlationSession != nil else { return }\n"
              "        abandonPackageCorrelation()\n"
              "        phase = .failed\n"
              "        message = \"Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series.\"\n"
              "        log(\"target_correlation_abandoned_on_view_exit\")\n"
              "    }\n"
          )
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one current view-exit cleanup seam, found {source.count(old)}")
          source = source.replace(old, new, 1)
          path.write_text(source)

          start = source.index("    func abandonCorrelationForViewExit()")
          end = source.index("    var privateConfig: Bool", start)
          cleanup = source[start:end]
          revoke = cleanup.index("membershipRequestID = UUID()")
          busy = cleanup.index("membershipBusy = false")
          probe = cleanup.index("membershipProbe = nil")
          early = cleanup.index("guard processCorrelationLease != nil || correlationSession != nil else { return }")
          abandon = cleanup.index("abandonPackageCorrelation()")
          if not (revoke < early and busy < early and probe < early < abandon):
              raise SystemExit("membership callback revocation is not ordered before the no-correlation early return")
          for forbidden in (
              "releasePackageCorrelationLease()", "disconnectBLE", "connectBLE", "publishDps",
              "queryDps", "writeValue", "sessionLedger.endConnection", "driver = nil",
              "currentConnectionToken = nil",
          ):
              if forbidden in cleanup:
                  raise SystemExit(f"view-exit revocation gained forbidden authority mutation: {forbidden}")

          verification_start = source.index("    func verifySDKMembership(completion:")
          verification_end = source.index("    func retry()", verification_start)
          verification = source[verification_start:verification_end]
          if "self.membershipRequestID == requestID" not in verification:
              raise SystemExit("membership callback no longer consumes exact request-generation authority")
          baseline_start = source.index("    func startBaseline()")
          baseline_end = source.index("    private func beginCorrelationSeries()", baseline_start)
          baseline = source[baseline_start:baseline_end]
          if "verifySDKMembership" not in baseline or "self.beginCorrelationSeries()" not in baseline:
              raise SystemExit("pre-OFF1 membership completion path changed")
          auth_start = source.index("    func authenticate()")
          auth_end = source.index("    private func beginOfficialConnection(candidate: Candidate)", auth_start)
          auth = source[auth_start:auth_end]
          if "verifySDKMembership" not in auth or "self.beginOfficialConnection(candidate: candidate)" not in auth:
              raise SystemExit("pre-auth membership completion path changed")
          PY

          git diff --check
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift

      - name: Commit two-path repair and self-remove runner
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_PARENT=b59cd71272b465bcad70fcc3425382bb29541b2e
          WORKFLOW=.github/workflows/recover-capture-view-exit-membership-race-r2-sol.yml
          PRODUCT=NembraApp/App/NembraCaptureEntrypoint.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift

          rm "$WORKFLOW"
          git diff --check
          actual="$(git diff --name-only "$PRODUCT_PARENT" | sort)"
          expected="$(printf '%s\n%s\n' "$PRODUCT" "$TEST" | sort)"
          test "$actual" = "$expected"

          git add "$PRODUCT" "$WORKFLOW"
          git config user.name "nembra-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): revoke hidden membership starts on view exit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
