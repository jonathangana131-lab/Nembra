name: Capture Lifecycle Closure R2

on:
  push:
    branches:
      - agent/v14-capture-lifecycle-closure-r2-sol
    paths:
      - .github/workflows/capture-lifecycle-closure-r2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-lifecycle-closure-r2-sol
          fetch-depth: 0
      - name: Apply authority repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_lifecycle_closure_r2.py
          rm Scripts/apply_capture_lifecycle_closure_r2.py
          rm .github/workflows/capture-lifecycle-closure-r2.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          diff_text="$(git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift)"
          grep -Fq 'invalidateInternalLifecycle' <<<"$diff_text"
          grep -Fq 'self.phase == .selected' <<<"$diff_text"
          grep -Fq 'self.targetCorrelationOperatorConfirmed' <<<"$diff_text"
          grep -Fq 'guard phase == .selected' <<<"$diff_text"
          ! grep -Fq 'phase == .selected || phase == .failed' <<<"$diff_text"
          git commit -m "fix(capture): close confirmation and auth-start authority"
          git push origin HEAD:agent/v14-capture-lifecycle-closure-r2-sol
