name: agent compose terminal queue resolution
on:
  push:
    branches: ['integration/es80-v14-controller-duration-gated/gpt56']
    paths: ['.github/workflows/agent-compose-terminal-queue-resolution.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-controller-duration-gated/gpt56
          fetch-depth: 0
      - name: Apply terminal queue retirement and resolution
        shell: bash
        run: |
          python3 .nembra/agent-compose-terminal-queue-resolution.py
          git rm .github/workflows/agent-compose-terminal-queue-resolution.yml
          git rm .nembra/agent-compose-terminal-queue-resolution.py
          git config user.name 'nembra-gpt56'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          git commit -m 'fix: resolve terminal FIFO without laundering recorder frontier'
          git push origin HEAD:integration/es80-v14-controller-duration-gated/gpt56
