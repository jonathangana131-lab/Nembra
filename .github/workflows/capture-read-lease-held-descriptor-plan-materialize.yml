name: Capture Held Descriptor Lease Plan Materializer

on:
  pull_request:
    paths:
      - .github/workflows/capture-read-lease-held-descriptor-plan-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-held-descriptor-plan-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: aa610e1000e58ba5e43e35a75ee8f22486aea5ec
  MATERIALIZER: .github/workflows/capture-read-lease-held-descriptor-plan-materialize.yml

jobs:
  materialize:
    name: Materialize held-descriptor planning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact attacked parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = "$MATERIALIZER"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize descriptor-custodied lease plan
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py')
          source = helper.read_text(encoding='utf-8')

          lease_start = source.index('def _lease_paths(')
          lease_end = source.index('\ndef _acl_text(', lease_start)
          lease_impl = textwrap.dedent('''\
          def _lease_paths(
              subjects: Sequence[Path],
              repo: Path,
              *,
              include_signatures: bool = False,
              include_descriptors: bool = False,
          ) -> tuple:
              """Plan exact ACL subjects; descriptor mode is the production object authority.

              The legacy/signature projections are diagnostic compatibility surfaces only.
              Production descriptor mode pins each admitted object immediately and holds every
              descriptor until grant/revoke. A final parent-child coherence pass proves that
              independently pinned descendants belong to the same held ancestry generation.
              """

              if include_signatures and include_descriptors:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease plan cannot request signatures and descriptors together"
                  )

              repo = _absolute_lexical(repo)
              repo_metadata = _require_real_directory(repo, "repository root")
              if not subjects:
                  raise SelectedXcodeBuildOrchestratorError("private read lease has no subjects")

              ordered: list[tuple] = []
              seen: set[Path] = set()

              def append_descriptor(path: Path, host_only: bool, is_directory: bool) -> None:
                  descriptor = _open_pinned_path(path, is_directory)
                  ordered.append(
                      (path, host_only, _descriptor_signature(descriptor), descriptor)
                  )

              def admit(path: Path, host_only: bool, metadata: os.stat_result) -> None:
                  if path in seen:
                      return
                  is_directory = stat.S_ISDIR(metadata.st_mode)
                  if not is_directory and not stat.S_ISREG(metadata.st_mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease plan targeted unsupported type: {path}"
                      )
                  if include_descriptors:
                      append_descriptor(path, host_only, is_directory)
                  else:
                      signature = _metadata_signature(metadata)
                      ordered.append(
                          (path, host_only, signature)
                          if include_signatures
                          else (path, host_only)
                      )
                  seen.add(path)

              try:
                  # Widen host traversal only until the first ancestor already searchable by all.
                  current = repo.parent
                  private_hosts: list[tuple[Path, os.stat_result]] = []
                  while current != current.parent:
                      metadata = _require_real_directory(current, "repository host ancestry")
                      if metadata.st_mode & stat.S_IXOTH:
                          break
                      private_hosts.append((current, metadata))
                      current = current.parent
                  for path, metadata in reversed(private_hosts):
                      admit(path, True, metadata)

                  admit(repo, False, repo_metadata)

                  for raw_subject in subjects:
                      subject = _absolute_lexical(raw_subject)
                      try:
                          relative = subject.relative_to(repo)
                      except ValueError as error:
                          raise SelectedXcodeBuildOrchestratorError(
                              "private read-lease subject escaped the repository"
                          ) from error
                      if not relative.parts:
                          raise SelectedXcodeBuildOrchestratorError(
                              "private read-lease subject may not be the repository root"
                          )

                      cursor = repo
                      for component in relative.parts:
                          if component in ("", ".", ".."):
                              raise SelectedXcodeBuildOrchestratorError(
                                  "private read-lease subject has unsafe ancestry"
                              )
                          cursor = cursor / component
                          try:
                              metadata = cursor.lstat()
                          except OSError as error:
                              raise SelectedXcodeBuildOrchestratorError(
                                  f"private read-lease subject ancestry is unavailable: {cursor}"
                              ) from error
                          if stat.S_ISLNK(metadata.st_mode):
                              raise SelectedXcodeBuildOrchestratorError(
                                  f"private read-lease subject ancestry contains a symlink: {cursor}"
                              )
                          if cursor != subject and not stat.S_ISDIR(metadata.st_mode):
                              raise SelectedXcodeBuildOrchestratorError(
                                  f"private read-lease subject ancestry is not a directory: {cursor}"
                              )
                          admit(cursor, False, metadata)

                      subject_entries = _subject_entries(
                          subject,
                          include_signatures=(include_signatures or include_descriptors),
                      )
                      for entry in subject_entries:
                          if include_signatures or include_descriptors:
                              path, is_directory, signature = entry
                          else:
                              path, is_directory = entry
                              signature = None
                          if path in seen:
                              continue
                          if include_descriptors:
                              append_descriptor(path, False, is_directory)
                          elif include_signatures:
                              ordered.append((path, False, signature))
                          else:
                              ordered.append((path, False))
                          seen.add(path)

                  if include_descriptors:
                      _verify_descriptor_plan(tuple(ordered))
                  return tuple(ordered)
              except Exception:
                  if include_descriptors:
                      for entry in reversed(ordered):
                          if len(entry) != 4:
                              continue
                          try:
                              os.close(int(entry[3]))
                          except OSError:
                              pass
                  raise
          ''')
          source = source[:lease_start] + lease_impl + source[lease_end:]

          descriptor_marker = '\ndef _descriptor_path(descriptor: int) -> str:'
          insert_at = source.index(descriptor_marker)
          descriptor_helpers = textwrap.dedent('''\

          def _open_pinned_child(
              parent_descriptor: int,
              name: str,
              is_directory: bool,
              expected_signature: tuple[int, int, int],
          ) -> int:
              """Re-open one held-plan child through its held parent directory."""
              if not name or name in (".", "..") or os.sep in name:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease child name is unsafe"
                  )
              nofollow = getattr(os, "O_NOFOLLOW", 0)
              odirectory = getattr(os, "O_DIRECTORY", 0)
              if nofollow == 0 or odirectory == 0 or os.open not in os.supports_dir_fd:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease child verification requires openat no-follow support"
                  )
              flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | nofollow
              if is_directory:
                  flags |= odirectory
              try:
                  descriptor = os.open(name, flags, dir_fd=parent_descriptor)
              except OSError as error:
                  raise SelectedXcodeBuildOrchestratorError(
                      f"private read-lease child is no longer reachable from held parent: {name}"
                  ) from error
              try:
                  mode = os.fstat(descriptor).st_mode
                  if is_directory != stat.S_ISDIR(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease held child changed type: {name}"
                      )
                  if not is_directory and not stat.S_ISREG(mode):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease held child is not regular: {name}"
                      )
                  if _descriptor_signature(descriptor) != expected_signature:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease held ancestry disagrees with pinned child: {name}"
                      )
                  result = descriptor
                  descriptor = -1
                  return result
              finally:
                  if descriptor >= 0:
                      os.close(descriptor)


          def _verify_descriptor_plan(
              plan: Sequence[tuple[Path, bool, tuple[int, int, int], int]],
          ) -> None:
              """Require one coherent held ancestry generation before any ACL mutation."""
              by_path = {Path(path): entry for entry in plan for path in (entry[0],)}
              if len(by_path) != len(plan):
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease descriptor plan contains duplicate paths"
                  )
              for path_raw, host_only, signature, descriptor in plan:
                  path = Path(path_raw)
                  is_directory = stat.S_ISDIR(signature[2])
                  if not is_directory and not stat.S_ISREG(signature[2]):
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease held descriptor has unsupported type: {path}"
                      )
                  if host_only and not is_directory:
                      raise SelectedXcodeBuildOrchestratorError(
                          "private read-lease host traversal plan targeted a file"
                      )
                  if _descriptor_signature(descriptor) != signature:
                      raise SelectedXcodeBuildOrchestratorError(
                          f"private read-lease held descriptor changed identity: {path}"
                      )

                  parent = by_path.get(path.parent)
                  if parent is not None:
                      parent_signature = parent[2]
                      if not stat.S_ISDIR(parent_signature[2]):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease held parent is not a directory: {path.parent}"
                          )
                      diagnostic = _open_pinned_child(
                          int(parent[3]), path.name, is_directory, signature
                      )
                  else:
                      # Topmost admitted host path is still checked through the real
                      # root-anchored component walker. All descendants are checked
                      # through already-held parents, preventing mixed generations.
                      diagnostic = _open_pinned_path(path, is_directory, signature)
                  os.close(diagnostic)
          ''')
          source = source[:insert_at] + descriptor_helpers + source[insert_at:]

          grant_start = source.index('    def grant(self, principal: str) -> None:')
          grant_end = source.index('\n    def revoke(', grant_start)
          grant_impl = textwrap.indent(textwrap.dedent('''\
          def grant(self, principal: str) -> None:
              if self._opened or self._principal:
                  raise SelectedXcodeBuildOrchestratorError("private read lease is already active")
              if re.fullmatch(r"[A-Za-z0-9_.-]+", principal) is None:
                  raise SelectedXcodeBuildOrchestratorError("build principal name is malformed")
              self._principal = principal
              try:
                  pinned_plan = _lease_paths(
                      self._subjects,
                      self._repository,
                      include_descriptors=True,
                  )
                  self._opened = [
                      {
                          "descriptor": descriptor,
                          "path": path,
                          "before": "",
                          "acl": "",
                          "added": False,
                          "accepted_signature": accepted_signature,
                          "is_directory": stat.S_ISDIR(accepted_signature[2]),
                      }
                      for path, _host_only, accepted_signature, descriptor in pinned_plan
                  ]

                  for record, (path, host_only, accepted_signature, descriptor) in zip(
                      self._opened, pinned_plan
                  ):
                      is_directory = bool(record["is_directory"])
                      before = _acl_listing(descriptor)
                      if _principal_already_present(before, principal):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease principal already has ACL authority: {path}"
                          )
                      acl = _acl_text(principal, is_directory, host_only)
                      record["before"] = before
                      record["acl"] = acl
                      try:
                          _chmod_acl(descriptor, "+a", acl)
                      except Exception:
                          # A command-level failure does not prove the kernel left the ACL
                          # unchanged. Classify while the exact held descriptor remains live.
                          try:
                              after_failed = _acl_listing(descriptor)
                          except Exception:
                              record["added"] = True
                          else:
                              record["added"] = after_failed != before
                          raise
                      record["added"] = True
                      after = _acl_listing(descriptor)
                      if after == before or not _principal_already_present(after, principal):
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease ACL did not materialize exactly: {path}"
                          )
                      if _descriptor_signature(descriptor) != accepted_signature:
                          raise SelectedXcodeBuildOrchestratorError(
                              f"private read-lease held descriptor changed after grant: {path}"
                          )
                      diagnostic = _open_pinned_path(
                          path, is_directory, accepted_signature
                      )
                      os.close(diagnostic)
              except Exception as error:
                  try:
                      self.revoke()
                  except Exception as rollback_error:
                      raise SelectedXcodeBuildOrchestratorError(
                          "private read-lease admission failed and exact rollback also failed"
                      ) from rollback_error
                  raise error
          '''), '    ')
          source = source[:grant_start] + grant_impl + source[grant_end:]

          revoke_start = source.index('    def revoke(self, *, suppress_errors: bool = False) -> None:')
          revoke_end = source.index('\n\ndef _git_read_environment', revoke_start)
          revoke_impl = textwrap.indent(textwrap.dedent('''\
          def revoke(self, *, suppress_errors: bool = False) -> None:
              failures: list[str] = []
              for record in reversed(self._opened):
                  descriptor = int(record["descriptor"])
                  path = Path(record["path"])
                  try:
                      if bool(record["added"]):
                          accepted_signature = record.get("accepted_signature")
                          is_directory = record.get("is_directory")
                          path_matches = False
                          if (
                              isinstance(accepted_signature, tuple)
                              and len(accepted_signature) == 3
                              and isinstance(is_directory, bool)
                          ):
                              try:
                                  diagnostic = _open_pinned_path(
                                      path, is_directory, accepted_signature
                                  )
                              except Exception:
                                  path_matches = False
                              else:
                                  os.close(diagnostic)
                                  path_matches = True
                          else:
                              try:
                                  path_matches = (
                                      _descriptor_signature(descriptor) == _path_signature(path)
                                  )
                              except Exception:
                                  path_matches = False
                          if not path_matches:
                              failures.append(
                                  f"private read-lease pathname no longer identifies opened object: {path}"
                              )
                          _chmod_acl(descriptor, "-a", str(record["acl"]))
                          restored = _acl_listing(descriptor)
                          if restored != str(record["before"]):
                              failures.append(
                                  f"private read-lease did not restore exact ACL listing: {path}"
                              )
                  except Exception as error:
                      failures.append(f"{path}: {error}")
                  finally:
                      try:
                          os.close(descriptor)
                      except OSError as error:
                          failures.append(f"{path}: descriptor close failed: {error}")
              self._opened.clear()
              self._principal = ""
              if failures and not suppress_errors:
                  raise SelectedXcodeBuildOrchestratorError(
                      "private read-lease revocation failed: " + "; ".join(failures)
                  )
          '''), '    ')
          source = source[:revoke_start] + revoke_impl + source[revoke_end:]
          helper.write_text(source, encoding='utf-8')

          test = Path('scripts/ci/tests/test_capture_private_read_lease_component_walk.py')
          test.write_text(textwrap.dedent('''\
          #!/usr/bin/env python3
          """Portable regressions for component-anchored, held-descriptor lease admission."""
          from __future__ import annotations

          import importlib.util
          import inspect
          import os
          from pathlib import Path
          import tempfile
          import unittest
          from unittest import mock

          REPO = Path(__file__).resolve().parents[3]
          HELPER = REPO / "scripts/ci/capture_selected_xcode_build_orchestrator.py"


          def load():
              spec = importlib.util.spec_from_file_location("nembra_component_walk", HELPER)
              if spec is None or spec.loader is None:
                  raise RuntimeError("could not load selected-Xcode orchestrator")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          class CapturePrivateReadLeaseComponentWalkTests(unittest.TestCase):
              def test_intermediate_symlink_swap_is_rejected_after_plan(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-walk-") as raw:
                      outer = Path(raw)
                      repo = outer / "repo"
                      legitimate = repo / "LocalSecrets/TuyaSDK/Build"
                      legitimate.mkdir(parents=True)
                      planned = helper._lease_paths((legitimate,), repo)
                      self.assertIn((legitimate, False), planned)

                      sdk = repo / "LocalSecrets/TuyaSDK"
                      sdk.rename(repo / "LocalSecrets/TuyaSDK.original")
                      attacker = outer / "attacker/TuyaSDK"
                      attacker_build = attacker / "Build"
                      attacker_build.mkdir(parents=True)
                      sdk.symlink_to(attacker, target_is_directory=True)

                      plain = os.open(legitimate, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
                      try:
                          self.assertEqual(os.fstat(plain).st_ino, attacker_build.stat().st_ino)
                      finally:
                          os.close(plain)

                      with self.assertRaises(helper.SelectedXcodeBuildOrchestratorError):
                          helper._open_pinned_path(legitimate, True)

              def test_real_directory_and_regular_file_still_open(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-walk-control-") as raw:
                      root = Path(raw)
                      directory = root / "a/b/c"
                      directory.mkdir(parents=True)
                      file = directory / "private.fixture"
                      file.write_bytes(b"fixture\\n")
                      for path, is_directory in ((directory, True), (file, False)):
                          descriptor = helper._open_pinned_path(path, is_directory)
                          try:
                              self.assertEqual(
                                  helper._descriptor_signature(descriptor),
                                  helper._path_signature(path),
                              )
                          finally:
                              os.close(descriptor)

              def test_real_directory_replacement_is_rejected_against_planned_identity(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-real-swap-") as raw:
                      outer = Path(raw)
                      repo = outer / "repo"
                      legitimate = repo / "LocalSecrets/TuyaSDK/Build"
                      legitimate.mkdir(parents=True)
                      planned = helper._lease_paths((legitimate,), repo, include_signatures=True)
                      expected = next(
                          signature
                          for path, _host_only, signature in planned
                          if path == legitimate
                      )

                      sdk = repo / "LocalSecrets/TuyaSDK"
                      sdk.rename(repo / "LocalSecrets/TuyaSDK.original")
                      replacement = repo / "LocalSecrets/TuyaSDK/Build"
                      replacement.mkdir(parents=True)
                      self.assertFalse(sdk.is_symlink())
                      self.assertFalse(replacement.is_symlink())
                      self.assertNotEqual(expected, helper._path_signature(replacement))

                      with self.assertRaises(helper.SelectedXcodeBuildOrchestratorError):
                          helper._open_pinned_path(legitimate, True, expected)

              def test_descriptor_plan_rejects_mixed_generation_descendant(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-mixed-generation-") as raw:
                      outer = Path(raw)
                      outer.chmod(0o711)
                      repo = outer / "repo"
                      subject = repo / "LocalSecrets/TuyaSDK/Build"
                      subject.mkdir(parents=True)
                      (subject / "accepted.bin").write_bytes(b"accepted\\n")

                      sdk = repo / "LocalSecrets/TuyaSDK"
                      accepted_sdk = repo / "LocalSecrets/TuyaSDK.accepted"
                      attacker_sdk = outer / "attacker/TuyaSDK"
                      attacker_build = attacker_sdk / "Build"
                      attacker_build.mkdir(parents=True)
                      (attacker_build / "substituted.bin").write_bytes(b"substituted\\n")

                      real_subject_entries = helper._subject_entries
                      swapped = False

                      def swap_after_ancestry(path: Path, *, include_signatures: bool = False):
                          nonlocal swapped
                          if Path(path) == subject and not swapped:
                              sdk.rename(accepted_sdk)
                              attacker_sdk.rename(sdk)
                              swapped = True
                          return real_subject_entries(path, include_signatures=include_signatures)

                      with mock.patch.object(
                          helper,
                          "_subject_entries",
                          side_effect=swap_after_ancestry,
                      ):
                          with self.assertRaisesRegex(
                              helper.SelectedXcodeBuildOrchestratorError,
                              "held ancestry disagrees|no longer reachable",
                          ):
                              helper._lease_paths(
                                  (subject,), repo, include_descriptors=True
                              )
                      self.assertTrue(swapped)

              def test_actual_grant_rejects_mixed_generation_before_acl_mutation(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-mixed-grant-") as raw:
                      outer = Path(raw)
                      outer.chmod(0o711)
                      repo = outer / "repo"
                      subject = repo / "LocalSecrets/TuyaSDK/Build"
                      subject.mkdir(parents=True)
                      (subject / "accepted.bin").write_bytes(b"accepted\\n")

                      sdk = repo / "LocalSecrets/TuyaSDK"
                      accepted_sdk = repo / "LocalSecrets/TuyaSDK.accepted"
                      attacker_sdk = outer / "attacker/TuyaSDK"
                      attacker_build = attacker_sdk / "Build"
                      attacker_build.mkdir(parents=True)
                      (attacker_build / "substituted.bin").write_bytes(b"substituted\\n")
                      real_subject_entries = helper._subject_entries
                      swapped = False

                      def swap_after_ancestry(path: Path, *, include_signatures: bool = False):
                          nonlocal swapped
                          if Path(path) == subject and not swapped:
                              sdk.rename(accepted_sdk)
                              attacker_sdk.rename(sdk)
                              swapped = True
                          return real_subject_entries(path, include_signatures=include_signatures)

                      def unexpected_acl(_descriptor: int) -> str:
                          raise AssertionError("mixed-generation descriptor reached ACL inspection")

                      lease = helper._PrivateReadLease((subject,), repo)
                      with (
                          mock.patch.object(
                              helper,
                              "_subject_entries",
                              side_effect=swap_after_ancestry,
                          ),
                          mock.patch.object(helper, "_acl_listing", side_effect=unexpected_acl),
                      ):
                          with self.assertRaises(helper.SelectedXcodeBuildOrchestratorError):
                              lease.grant("nembramixedgeneration")
                      self.assertTrue(swapped)
                      self.assertFalse(lease._opened)
                      self.assertEqual(lease._principal, "")

              def test_held_descriptor_prevents_inode_reuse_after_admission(self) -> None:
                  helper = load()
                  with tempfile.TemporaryDirectory(prefix="nembra-component-held-inode-") as raw:
                      repo = Path(raw) / "repo"
                      subject = repo / "LocalSecrets/TuyaSDK/Build"
                      subject.mkdir(parents=True)
                      plan = helper._lease_paths((subject,), repo, include_descriptors=True)
                      try:
                          entry = next(item for item in plan if item[0] == subject)
                          accepted_signature = entry[2]
                          accepted_descriptor = int(entry[3])
                          self.assertEqual(
                              helper._descriptor_signature(accepted_descriptor),
                              accepted_signature,
                          )

                          retired = repo / "LocalSecrets/TuyaSDK/Build.retired"
                          subject.rename(retired)
                          retired.rmdir()
                          for _ in range(2000):
                              subject.mkdir()
                              self.assertNotEqual(
                                  helper._path_signature(subject), accepted_signature
                              )
                              subject.rmdir()
                      finally:
                          for _path, _host_only, _signature, descriptor in reversed(plan):
                              os.close(int(descriptor))

              def test_source_production_grant_consumes_held_descriptor_plan(self) -> None:
                  helper = load()
                  opener = inspect.getsource(helper._open_pinned_path)
                  lease_paths = inspect.getsource(helper._lease_paths)
                  verifier = inspect.getsource(helper._verify_descriptor_plan)
                  grant = inspect.getsource(helper._PrivateReadLease.grant)
                  self.assertIn("dir_fd=current", opener)
                  self.assertIn("O_NOFOLLOW", opener)
                  self.assertIn("include_descriptors", lease_paths)
                  self.assertIn("_verify_descriptor_plan", lease_paths)
                  self.assertIn("_open_pinned_child", verifier)
                  self.assertIn("include_descriptors=True", grant)
                  self.assertIn("accepted_signature, descriptor", grant)
                  self.assertNotIn("include_signatures=True", grant)


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          '''), encoding='utf-8')
          PY

          git diff --check
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py

      - name: Publish clean serial hardening head
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git add \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git commit -m 'capture: hold descriptor plan through private lease grant'
          git rm "$MATERIALIZER"
          git commit -m 'capture: remove held-descriptor materializer'
          final="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          test "$final" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$HEAD_REF"
