name: TEMP Materialize clean selected-Xcode provenance contract

on:
  push:
    branches:
      - repair/v14-selected-xcode-provenance-clean-sol-gpt56-20260811
    paths:
      - .github/workflows/tmp-v14-selected-xcode-provenance-cleanup-gpt56.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-selected-xcode-provenance-clean-sol-gpt56-20260811
          fetch-depth: 0

      - name: Bind materializer to triggering head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Finish selected-tool provenance assertions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/capture-field-build-provenance.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          counts = {
              'discovery': 0,
              'install': 0,
              'xcodebuild': 0,
          }
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped == "grep -Fq 'devicectl list devices --hide-headers' \"$installer\"":
                  indent = line[:len(line) - len(line.lstrip())]
                  ending = '\n' if line.endswith('\n') else ''
                  line = indent + "grep -Fq '\"$SELECTED_DEVICECTL\" list devices --hide-headers' \"$installer\"" + ending
                  counts['discovery'] += 1
              elif stripped == "grep -Fq 'devicectl device install app --device \"$COREDEVICE_ID\"' \"$installer\"":
                  indent = line[:len(line) - len(line.lstrip())]
                  ending = '\n' if line.endswith('\n') else ''
                  line = indent + "grep -Fq '\"$SELECTED_DEVICECTL\" device install app --device \"$COREDEVICE_ID\"' \"$installer\"" + ending
                  counts['install'] += 1
              elif "build_line=\"$(grep -nF -- '-- /usr/bin/xcodebuild \\" in line:
                  line = line.replace("-- /usr/bin/xcodebuild \\", "-- \"$SELECTED_XCODEBUILD\" \\", 1)
                  counts['xcodebuild'] += 1
              out.append(line)

          if counts != {'discovery': 1, 'install': 1, 'xcodebuild': 1}:
              raise SystemExit(f'unexpected stale assertion cardinality: {counts}')

          source = ''.join(out)
          required = (
              "grep -Fq 'read_verified_accepted_git_blob() {' \"$installer\"",
              "grep -Fq 'PRIVATE_DEVICE_RUNNER_RELATIVE=\"scripts/ci/es80_signed_field_artifact_private_runner.py\"' \"$installer\"",
              "grep -Fq 'read_verified_accepted_git_blob \"$PRIVATE_DEVICE_RUNNER_RELATIVE\" |' \"$installer\"",
              "grep -Fq '\"$SELECTED_DEVICECTL\" list devices --hide-headers' \"$installer\"",
              "grep -Fq '\"$SELECTED_DEVICECTL\" device install app --device \"$COREDEVICE_ID\"' \"$installer\"",
              "build_line=\"$(grep -nF -- '-- \"$SELECTED_XCODEBUILD\" \\",
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'stronger provenance assertion missing after rewrite: {marker}')

          forbidden = (
              "grep -Fq 'devicectl list devices --hide-headers' \"$installer\"",
              "grep -Fq 'devicectl device install app --device \"$COREDEVICE_ID\"' \"$installer\"",
              "build_line=\"$(grep -nF -- '-- /usr/bin/xcodebuild \\",
              "run_authority_git show \"$SOURCE_SHA:scripts/ci/es80_signed_field_artifact_private_runner.py\"",
          )
          for marker in forbidden:
              if marker in source:
                  raise SystemExit(f'stale weaker provenance assertion remains: {marker}')

          path.write_text(source, encoding='utf-8')
          PY

          bash -n scripts/field/install_one_time_capture.command
          grep -Fq '"$SELECTED_DEVICECTL" list devices --hide-headers' scripts/field/install_one_time_capture.command
          grep -Fq '"$SELECTED_DEVICECTL" device install app --device "$COREDEVICE_ID"' scripts/field/install_one_time_capture.command
          grep -Fq -- '-- "$SELECTED_XCODEBUILD" \' scripts/field/install_one_time_capture.command
          git diff --check
          test "$(git diff --name-only | LC_ALL=C sort)" = '.github/workflows/capture-field-build-provenance.yml'

      - name: Publish clean contract and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-v14-selected-xcode-provenance-cleanup-gpt56.yml
          git add .github/workflows/capture-field-build-provenance.yml
          git diff --cached --check
          git config user.name "nembra-swarm-materializer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Capture: align provenance with selected Xcode tools"
          git push origin HEAD:repair/v14-selected-xcode-provenance-clean-sol-gpt56-20260811
