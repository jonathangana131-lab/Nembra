name: Materialize Capture Provenance Open Binding D7FB R2

on:
  push:
    branches:
      - sol/v14-capture-provenance-open-binding-d7fb-r2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact current regressed product parent
        shell: bash
        run: |
          set -euo pipefail
          expected='d7fbec98107098d7aa70f33c3ce0cb6555dab9e0'
          test "$(git rev-parse HEAD^)" = "$expected"
          test "$(git diff --name-only "$expected"..HEAD)" = '.github/workflows/materialize-capture-provenance-open-binding-d7fb-r2.yml'
          grep -Fq 'def test_file_fingerprint_rejects_same_inode_mutation_after_final_descriptor_stat' scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          grep -Fq 'def test_tree_binds_open_descriptor_to_enumerated_file_identity' scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          grep -Fq 'record_snapshot_after = _record_identity_snapshot' Scripts/capture_tuya_private_input_provenance.py

      - name: Bind opened file descriptor to enumerated identity and final pathname
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('Scripts/capture_tuya_private_input_provenance.py')
          source=path.read_text()

          old_signature='def _read_stable_regular_file_sha256(path: Path) -> tuple[os.stat_result, str]:\n'
          new_signature='''def _read_stable_regular_file_sha256(\n    path: Path,\n    *,\n    expected_identity: tuple[int, ...] | None = None,\n) -> tuple[os.stat_result, str]:\n'''
          if source.count(old_signature) != 1:
              raise SystemExit('stable-read signature drifted')
          source=source.replace(old_signature,new_signature)

          old_before='''        before = os.fstat(descriptor)\n        if not stat.S_ISREG(before.st_mode):\n            raise ProvenanceError(f"required private build input is not a regular file: {path.name}")\n\n        digest = hashlib.sha256()\n'''
          new_before='''        before = os.fstat(descriptor)\n        if not stat.S_ISREG(before.st_mode):\n            raise ProvenanceError(f"required private build input is not a regular file: {path.name}")\n        if expected_identity is not None and _stat_identity(before) != expected_identity:\n            raise ProvenanceError(f"private build input pathname changed before fingerprinting: {path.name}")\n\n        digest = hashlib.sha256()\n'''
          if source.count(old_before) != 1:
              raise SystemExit('descriptor admission block drifted')
          source=source.replace(old_before,new_before)

          old_final='''        if (\n            stat.S_ISLNK(current_path.st_mode)\n            or not stat.S_ISREG(current_path.st_mode)\n            or current_path.st_dev != after.st_dev\n            or current_path.st_ino != after.st_ino\n        ):\n            raise ProvenanceError(f"private build input pathname changed during fingerprinting: {path.name}")\n'''
          new_final='''        if (\n            stat.S_ISLNK(current_path.st_mode)\n            or not stat.S_ISREG(current_path.st_mode)\n            or _stat_identity(current_path) != _stat_identity(after)\n        ):\n            raise ProvenanceError(f"private build input pathname changed during fingerprinting: {path.name}")\n'''
          if source.count(old_final) != 1:
              raise SystemExit('final pathname block drifted')
          source=source.replace(old_final,new_final)

          old_file='''def _file_fingerprint(path: Path) -> str:\n    metadata, content_sha256 = _read_stable_regular_file_sha256(path)\n'''
          new_file='''def _file_fingerprint(\n    path: Path,\n    *,\n    expected_identity: tuple[int, ...] | None = None,\n) -> str:\n    metadata, content_sha256 = _read_stable_regular_file_sha256(\n        path,\n        expected_identity=expected_identity,\n    )\n'''
          if source.count(old_file) != 1:
              raise SystemExit('file fingerprint signature drifted')
          source=source.replace(old_file,new_file)

          old_tree='                fingerprint = _file_fingerprint(path)\n'
          new_tree='                fingerprint = _file_fingerprint(path, expected_identity=identity)\n'
          if source.count(old_tree) != 1:
              raise SystemExit(f'expected exactly one unbound tree file fingerprint call, found {source.count(old_tree)}')
          source=source.replace(old_tree,new_tree)

          path.write_text(source)
          PY

      - name: Run complete portable private provenance acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          for test_file in scripts/ci/tests/test_capture_tuya_private_input*.py; do
            echo "==> $test_file"
            python3 "$test_file"
          done
          grep -Fq '_stat_identity(current_path) != _stat_identity(after)' Scripts/capture_tuya_private_input_provenance.py
          grep -Fq '_file_fingerprint(path, expected_identity=identity)' Scripts/capture_tuya_private_input_provenance.py
          grep -Fq 'record_snapshot_after = _record_identity_snapshot' Scripts/capture_tuya_private_input_provenance.py
          git diff --check

      - name: Commit durable exact-parent repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-provenance-open-binding-d7fb-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/capture_tuya_private_input_provenance.py .github/workflows/materialize-capture-provenance-open-binding-d7fb-r2.yml
          git commit -m 'fix(capture): bind provenance reads to enumerated identity'
          git push origin HEAD:sol/v14-capture-provenance-open-binding-d7fb-r2
