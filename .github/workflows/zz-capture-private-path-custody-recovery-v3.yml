name: Capture private path custody recovery v3

on:
  push:
    branches:
      - agent/capture-private-path-custody-recovery-v14

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard v2 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "72c329d476e80da3aae1e3ca41d5db530cd771f1"

      - name: Reapply reviewed recovery and repair traversal-aware tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          v2 = Path(".github/workflows/zz-capture-private-path-custody-recovery-v2.yml")
          text = v2.read_text(encoding="utf-8")
          opener = "          python3 - <<'PY'\n"
          start = text.index(opener) + len(opener)
          end = text.index("\n          PY", start)
          transform = textwrap.dedent(text[start:end])
          exec(compile(transform, "<private-path-custody-recovery-v3-base>", "exec"), {})

          tests = Path("scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py")
          source = tests.read_text(encoding="utf-8")
          if source.count('"path must be absolute"') != 1:
              raise SystemExit("relative-path regression wording moved unexpectedly")
          source = source.replace('"path must be absolute"', '"canonical absolute path"', 1)

          old_counter = '''            call_count = 0\n\n            def fstat_with_changed_metadata(descriptor):\n                nonlocal call_count\n                call_count += 1\n                metadata = real_fstat(descriptor)\n                if call_count != 2:\n                    return metadata\n                return SimpleNamespace(\n'''
          new_counter = '''            private_inode = os.stat(private_file).st_ino\n            private_fstat_count = 0\n\n            def fstat_with_changed_metadata(descriptor):\n                nonlocal private_fstat_count\n                metadata = real_fstat(descriptor)\n                if metadata.st_ino != private_inode:\n                    return metadata\n                private_fstat_count += 1\n                if private_fstat_count != 2:\n                    return metadata\n                return SimpleNamespace(\n'''
          if source.count(old_counter) != 1:
              raise SystemExit("same-size mutation fstat fixture moved unexpectedly")
          source = source.replace(old_counter, new_counter, 1)
          if source.count("            self.assertEqual(call_count, 2)\n") != 1:
              raise SystemExit("same-size mutation call-count assertion moved unexpectedly")
          source = source.replace(
              "            self.assertEqual(call_count, 2)\n",
              "            self.assertEqual(private_fstat_count, 2)\n",
              1,
          )
          tests.write_text(source, encoding="utf-8")
          PY

      - name: Validate combined external and alias-custody contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_private_runner.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          git diff --check

      - name: Commit product recovery and remove all transformer files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-capture-private-path-custody-recovery.yml
          rm .github/workflows/zz-capture-private-path-custody-recovery-v2.yml
          rm .github/workflows/zz-capture-private-path-custody-recovery-v3.yml
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/es80_signed_field_artifact_private_runner.py \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py \
                  .github/workflows/zz-capture-private-path-custody-recovery.yml \
                  .github/workflows/zz-capture-private-path-custody-recovery-v2.yml \
                  .github/workflows/zz-capture-private-path-custody-recovery-v3.yml
          git diff --cached --check
          git commit -m "fix(capture): close private path alias custody"
          git push origin HEAD:agent/capture-private-path-custody-recovery-v14
