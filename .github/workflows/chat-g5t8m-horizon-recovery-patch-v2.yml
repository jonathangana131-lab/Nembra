name: chat-g5t8m Horizon recovery patch v2
on:
  push:
    branches: ['parallel/es80-recorded-horizon-recovery/chat-g5t8m']
    paths: ['.github/workflows/chat-g5t8m-horizon-recovery-patch-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-recorded-horizon-recovery/chat-g5t8m
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {s.count(old)}')
              p.write_text(s.replace(old, new, 1))

          transaction = 'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift'
          one(transaction, '''    struct RecordedHorizonBoundary: Equatable, Sendable {\n        private let decision: PassiveCoreBluetoothObservationBoundaryDecision\n        private let transaction: PassiveCoreBluetoothObservationBoundaryQueueGate.Transaction\n        private let authorityFence: PassiveCoreBluetoothArtifactAuthorityFence\n\n        var queueCutoff: UInt64 { decision.queueCutoff }\n        var authority: PassiveCoreBluetoothArtifactAuthorityContext { decision.authority }\n        var observedAtUptimeNanoseconds: UInt64 { decision.observedAtUptimeNanoseconds }\n        var observedAtDate: Date { decision.observedAtDate }\n''', '''    struct RecordedHorizonBoundary: Equatable, Sendable {\n        private let decision: PassiveCoreBluetoothObservationBoundaryDecision\n        private let transaction: PassiveCoreBluetoothObservationBoundaryQueueGate.Transaction\n        private let authorityFence: PassiveCoreBluetoothArtifactAuthorityFence\n\n        var queueCutoff: UInt64 { decision.queueCutoff }\n        var authority: PassiveCoreBluetoothArtifactAuthorityContext { decision.authority }\n        var observedAtUptimeNanoseconds: UInt64 { decision.observedAtUptimeNanoseconds }\n        var observedAtDate: Date { decision.observedAtDate }\n        var transactionRevision: UInt64 { transaction.revision }\n        var transactionIdentity: UUID { transaction.identity }\n''')

          gate = 'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift'
          one(gate, '''        enum Origin: Equatable, Sendable {\n            case uncommittedReadyRejectedBeforeRecorderMutation\n            case recordedReadyInvalidatedBeforeGateCommit\n            case committedReadyInvalidated\n        }\n''', '''        enum Origin: Equatable, Sendable {\n            case uncommittedReadyRejectedBeforeRecorderMutation\n            case recordedReadyInvalidatedBeforeGateCommit\n            case committedReadyInvalidated\n            case recordedHorizonInvalidatedBeforeGateCommit\n        }\n''')
          one(gate, '''        let abandonedReadyTransactionIdentity: UUID\n        let abandonedTargetSessionGeneration: UInt64\n        let origin: Origin\n\n        fileprivate init(\n            abandonedReadyTransaction: Transaction,\n            origin: Origin\n        ) {\n            abandonedReadyAuthority = abandonedReadyTransaction.authority\n            abandonedReadyQueueCutoff = abandonedReadyTransaction.queueCutoff\n            abandonedReadyTransactionRevision = abandonedReadyTransaction.revision\n            abandonedReadyTransactionIdentity = abandonedReadyTransaction.identity\n            abandonedTargetSessionGeneration = abandonedReadyTransaction.authority.targetSessionGeneration\n            self.origin = origin\n        }\n''', '''        let abandonedReadyTransactionIdentity: UUID\n        let abandonedTargetSessionGeneration: UInt64\n        let abandonedHorizonQueueCutoff: UInt64?\n        let abandonedHorizonTransactionRevision: UInt64?\n        let abandonedHorizonTransactionIdentity: UUID?\n        let origin: Origin\n\n        /// Furthest queue prefix already represented by durable lifecycle evidence in\n        /// this abandoned epoch. Recorded-but-uncommitted Horizon extends it through H.\n        var abandonedEvidenceQueueCutoff: UInt64 {\n            abandonedHorizonQueueCutoff ?? abandonedReadyQueueCutoff\n        }\n\n        fileprivate init(\n            abandonedReadyTransaction: Transaction,\n            origin: Origin,\n            abandonedHorizonTransaction: Transaction? = nil\n        ) {\n            abandonedReadyAuthority = abandonedReadyTransaction.authority\n            abandonedReadyQueueCutoff = abandonedReadyTransaction.queueCutoff\n            abandonedReadyTransactionRevision = abandonedReadyTransaction.revision\n            abandonedReadyTransactionIdentity = abandonedReadyTransaction.identity\n            abandonedTargetSessionGeneration = abandonedReadyTransaction.authority.targetSessionGeneration\n            abandonedHorizonQueueCutoff = abandonedHorizonTransaction?.queueCutoff\n            abandonedHorizonTransactionRevision = abandonedHorizonTransaction?.revision\n            abandonedHorizonTransactionIdentity = abandonedHorizonTransaction?.identity\n            self.origin = origin\n        }\n''')
          one(gate, '''    /// Abort quarantine is intentionally irreversible in this slice. Raw FIFO\n    /// retirement alone cannot reopen lifecycle admission because retired positions\n''', '''    /// A Horizon recorder append may win under valid authority, then its queue commit\n    /// can fail before terminal freeze. Preserve that durable H as incomplete historical\n    /// evidence and quarantine the exact producer-issued epoch; never promote it to\n    /// terminal/frozen authority merely because the recorder mutation succeeded.\n    @discardableResult\n    mutating func abortRecordedHorizonBeforeGateCommit(\n        _ recordedHorizon: PassiveCoreBluetoothObservationBoundaryTransactionDecision.RecordedHorizonBoundary\n    ) throws -> ObservationEpochAbortReceipt {\n        guard case let .drainingHorizon(currentHorizon) = phase,\n              let ready = committedReadyTransaction else {\n            throw StateError.invalidTransition\n        }\n        guard currentHorizon.authority == recordedHorizon.authority,\n              currentHorizon.queueCutoff == recordedHorizon.queueCutoff,\n              currentHorizon.revision == recordedHorizon.transactionRevision,\n              currentHorizon.identity == recordedHorizon.transactionIdentity else {\n            throw StateError.staleTransaction\n        }\n        let receipt = ObservationEpochAbortReceipt(\n            abandonedReadyTransaction: ready,\n            origin: .recordedHorizonInvalidatedBeforeGateCommit,\n            abandonedHorizonTransaction: currentHorizon\n        )\n        committedReadyTransaction = nil\n        phase = .abortQuarantined(receipt)\n        return receipt\n    }\n\n    /// Abort quarantine is intentionally irreversible in this slice. Raw FIFO\n    /// retirement alone cannot reopen lifecycle admission because retired positions\n''')

          retirement = 'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothAbortedObservationQueueRetirement.swift'
          one(retirement, '''/// Synchronous MainActor retirement of queued evidence after a pre-H Ready\n/// attempt/epoch has been intentionally abandoned.\n''', '''/// Synchronous MainActor retirement of queued evidence after a pre-terminal\n/// observation epoch has been intentionally abandoned.\n''')
          one(retirement, '''        guard currentSettledQueueSequence >= abortReceipt.abandonedReadyQueueCutoff else {\n            throw StateError.readyPrefixNotSettled(\n                settled: currentSettledQueueSequence,\n                readyCutoff: abortReceipt.abandonedReadyQueueCutoff\n            )\n        }\n\n        var previousSequence = currentSettledQueueSequence\n''', '''        let abandonedEvidenceCutoff = abortReceipt.abandonedEvidenceQueueCutoff\n        guard currentSettledQueueSequence >= abandonedEvidenceCutoff else {\n            throw StateError.readyPrefixNotSettled(\n                settled: currentSettledQueueSequence,\n                readyCutoff: abandonedEvidenceCutoff\n            )\n        }\n\n        var previousSequence = currentSettledQueueSequence\n''')
          one(retirement, '''            guard evidence.queueSequence > abortReceipt.abandonedReadyQueueCutoff else {\n                throw StateError.readyPrefixStillPending(\n                    queueSequence: evidence.queueSequence,\n                    readyCutoff: abortReceipt.abandonedReadyQueueCutoff\n                )\n            }\n''', '''            guard evidence.queueSequence > abandonedEvidenceCutoff else {\n                throw StateError.readyPrefixStillPending(\n                    queueSequence: evidence.queueSequence,\n                    readyCutoff: abandonedEvidenceCutoff\n                )\n            }\n''')

          tests = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothPreHObservationRecoveryTests.swift')
          s = tests.read_text()
          start = s.index('    @Test("committed Ready abort preserves exact identity and reopens only for bound fresh session")')
          end = s.index('    @Test("canonical fence rejection proves zero Ready mutation and consumes one-shot admission")', start)
          replacement = (
              '    @Test("committed Ready abort stays quarantined after raw retirement until resolved chronology is integrated")\n'
              '    @MainActor\n'
              '    func committedReadyAbortDoesNotPrematurelyReopen() async throws {\n'
              '        var gate = PassiveCoreBluetoothObservationBoundaryQueueGate()\n'
              '        let fixture = try await committedReady(gate: &gate)\n'
              '        let abort = try gate.abortObservationEpoch(fixture.epoch)\n\n'
              '        #expect(abort.origin == .committedReadyInvalidated)\n'
              '        #expect(abort.abandonedReadyQueueCutoff == fixture.epoch.queueCutoff)\n'
              '        #expect(abort.abandonedReadyTransactionRevision == fixture.epoch.transactionRevision)\n'
              '        #expect(abort.abandonedReadyTransactionIdentity == fixture.epoch.transactionIdentity)\n'
              '        #expect(abort.abandonedHorizonQueueCutoff == nil)\n'
              '        #expect(abort.abandonedEvidenceQueueCutoff == fixture.epoch.queueCutoff)\n'
              '        #expect(gate.phase == .abortQuarantined(abort))\n'
              '        #expect(gate.permittedDrainUpperBound(firstPending: 3, pendingTail: 3) == nil)\n'
              '        #expect(!gate.resetForNewCaptureSession())\n\n'
              '        var pending = [PendingEvent(queueSequence: 3, authority: authority)]\n'
              '        let retirement = try PassiveCoreBluetoothAbortedObservationQueueRetirement.retire(\n'
              '            from: &pending,\n'
              '            currentLastEnqueuedEventSequence: 3,\n'
              '            currentSettledQueueSequence: 2,\n'
              '            drainIsIdle: true,\n'
              '            abortedGate: gate,\n'
              '            identity: { .init(queueSequence: $0.queueSequence, authority: $0.authority) }\n'
              '        )\n'
              '        #expect(pending.isEmpty)\n'
              '        #expect(retirement.abortReceipt == abort)\n'
              '        #expect(gate.phase == .abortQuarantined(abort))\n'
              '        #expect(!gate.resetForNewCaptureSession())\n'
              '        #expect(throws: PassiveCoreBluetoothObservationBoundaryQueueGate.StateError.invalidTransition) {\n'
              '            _ = try gate.begin(.finiteAcquisitionReady, through: 4, authority: .init(targetSessionGeneration: 8, authorityGeneration: 1))\n'
              '        }\n'
              '    }\n\n'
          )
          tests.write_text(s[:start] + replacement + s[end:])
          PY
          git rm .github/workflows/chat-g5t8m-recorded-horizon-recovery.yml
          git rm .github/workflows/chat-g5t8m-horizon-recovery-patch-v2.yml
          git config user.name 'nembra-chat-g5t8m'
          git config user.email 'nembra-chat-g5t8m@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture
          git commit -m 'fix: quarantine recorded Horizon commit failures'
          git push origin HEAD:parallel/es80-recorded-horizon-recovery/chat-g5t8m
