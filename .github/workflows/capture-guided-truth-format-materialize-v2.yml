name: Capture Guided Truth Format Materializer V2

on:
  push:
    branches:
      - product/v14-capture-guided-truth-closure-sol

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize exact helper formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "1c20ab3778fa8279cd11ec9584605eaff31f1a69"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          start = source.index("    private func redactAccountUIDFromApplicationDetails(")
          end = source.index("    private func startWatchdog", start)
          lines = [
              "    private func redactAccountUIDFromApplicationDetails(",
              "        _ details: [String: String],",
              "        accountUID: String",
              "    ) -> [String: String] {",
              "        let exactAccountUID = accountUID.trimmingCharacters(in: .whitespacesAndNewlines)",
              "        guard !exactAccountUID.isEmpty else { return details }",
              "",
              "        func redacted(_ text: String) -> String {",
              "            text.replacingOccurrences(",
              "                of: exactAccountUID,",
              "                with: \"<redacted-account-uid>\",",
              "                options: [.caseInsensitive, .literal]",
              "            )",
              "        }",
              "",
              "        var sanitized: [String: String] = [:]",
              "        for key in details.keys.sorted() {",
              "            guard let value = details[key] else { continue }",
              "            let baseKey = redacted(key)",
              "            var admittedKey = baseKey",
              "            var collisionOrdinal = 2",
              "            while sanitized[admittedKey] != nil {",
              "                admittedKey = \"\\(baseKey)#\\(collisionOrdinal)\"",
              "                collisionOrdinal += 1",
              "            }",
              "            sanitized[admittedKey] = redacted(value)",
              "        }",
              "        return sanitized",
              "    }",
              "",
              "",
          ]
          replacement = "\n".join(lines)
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          expected = "    private func redactAccountUIDFromApplicationDetails(\n        _ details: [String: String],\n        accountUID: String\n    ) -> [String: String] {"
          assert expected in s
          PY
          git diff --check
      - name: Publish normalized checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-guided-truth-format-materialize-v2.yml
          git config user.name "nembra-capture-closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(capture): enforce account UID helper indentation"
          git push origin HEAD:product/v14-capture-guided-truth-closure-sol
