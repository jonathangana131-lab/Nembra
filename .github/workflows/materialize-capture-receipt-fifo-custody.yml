name: Materialize Capture receipt FIFO custody correction

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/materialize-capture-receipt-fifo-custody.yml'
      - 'scripts/ci/materialize_capture_receipt_fifo_custody.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-capture-receipt-fifo-custody-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      EXACT_PARENT: 79067c2ed19114a2cbf31cfcea434df925190826
      WORKFLOW_PATH: .github/workflows/materialize-capture-receipt-fifo-custody.yml
      SCRIPT_PATH: scripts/ci/materialize_capture_receipt_fifo_custody.py
    steps:
      - name: Checkout immutable construction head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact #3292 head and constructor-only delta
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          printf '%s\n' "$WORKFLOW_PATH" "$SCRIPT_PATH" | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize package FIFO, occurrence custody, and test-scope repair
        run: |
          set -euo pipefail
          python3 -B "$SCRIPT_PATH"
          rm "$WORKFLOW_PATH" "$SCRIPT_PATH"

      - name: Verify four-path correction delta
        run: |
          set -euo pipefail
          git diff --check "$EXACT_PARENT"
          git diff --name-only "$EXACT_PARENT" | LC_ALL=C sort > "$RUNNER_TEMP/final-actual"
          printf '%s\n' \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAcceptedApplicationEvidenceSealSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlySessionLedgerTests.swift \
            | LC_ALL=C sort > "$RUNNER_TEMP/final-expected"
          diff -u "$RUNNER_TEMP/final-expected" "$RUNNER_TEMP/final-actual"
          test ! -e "$WORKFLOW_PATH"
          test ! -e "$SCRIPT_PATH"
          grep -Fq 'public nonisolated func captureApplicationDelivery(' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift
          ! grep -Fq 'public nonisolated func captureApplicationReceipt(' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift
          grep -Fq 'private var pendingApplicationSequences: [UInt64] = []' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift
          grep -Fq 'guard first == receipt.deliverySequence else' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift
          grep -Fq 'pendingApplicationSequences.removeFirst()' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift
          grep -Fq 'captureApplicationDelivery(' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'extension TuyaAuthenticatedReadOnlySessionLedgerTests {' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlySessionLedgerTests.swift
          grep -Fq 'applicationDeliveryFIFOIsPackageOwned' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlySessionLedgerTests.swift
          ! grep -Fq 'isNonEmpty: true,' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlySessionLedgerTests.swift || true

      - name: Commit materialized correction and retire constructor
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'nembra-receipt-fifo-materializer'
          git config user.email 'nembra-receipt-fifo-materializer@users.noreply.github.com'
          git add -A
          git commit -m 'capture: enforce package FIFO callback delivery custody'
          git push origin "HEAD:$BRANCH"
