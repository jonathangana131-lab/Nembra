name: Validate Expanded Capture Application Secret Sanitizer

on:
  push:
    branches:
      - sol/v14-capture-application-secret-sanitizer-523
    paths:
      - .github/workflows/capture-application-secret-sanitizer-expanded-check.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-application-secret-sanitizer-523
          fetch-depth: 0

      - name: Compile and execute expanded custody harness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cat > /tmp/main.swift <<'SWIFT'
          import Foundation

          let sentinel = "SECRET-SENTINEL"
          let secretKeys = [
              "local_key", "session-key", "App-Key", "appSecret", "password",
              "account_token", "ACCESS-TOKEN", "refresh.token", "authKey", "sec_key",
          ]
          var input: [AnyHashable: Any] = [:]
          for key in secretKeys { input[key] = sentinel }
          input["ordinary"] = "kept"
          input["payload"] = [
              "items": [
                  ["sessionKey": sentinel],
                  ["app_secret": sentinel],
                  ["plain": "still-kept"],
              ],
          ] as [String: Any]

          let output = TuyaApplicationUpdateSecretSanitizer.sanitize(input)
          for key in secretKeys {
              precondition(output[key] == "<redacted>", "failed to redact \(key)")
          }
          precondition(output["ordinary"] == "kept")
          let payload = output["payload"] ?? ""
          precondition(payload.contains("<redacted>"))
          precondition(!payload.contains(sentinel))
          precondition(payload.contains("still-kept"))
          print("expanded export-promise sanitizer: PASS")
          SWIFT
          swiftc -warnings-as-errors \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift \
            /tmp/main.swift \
            -o /tmp/capture-secret-sanitizer-expanded
          /tmp/capture-secret-sanitizer-expanded
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift

      - name: Publish clean validated package head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-application-secret-sanitizer-expanded-check.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(capture): retain expanded sanitizer contract"
          git push origin HEAD:sol/v14-capture-application-secret-sanitizer-523
