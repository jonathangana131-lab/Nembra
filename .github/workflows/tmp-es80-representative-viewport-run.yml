name: TEMP ES80 representative viewport repair

on:
  push:
    branches:
      - fix/es80-v14-representative-viewport-proof/gpt56-thinking-go

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_es80_representative_viewport_repair.py
          git diff --check
          rm scripts/ci/tmp_es80_representative_viewport_repair.py
          rm .github/workflows/tmp-es80-representative-viewport-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[Capture visual QA v14] Prove representative screenshot viewports"
          git push origin HEAD:${{ github.ref_name }}
