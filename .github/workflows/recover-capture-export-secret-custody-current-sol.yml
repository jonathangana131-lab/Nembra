name: Recover Capture export secret custody current

on:
  push:
    branches:
      - repair/v14-capture-export-secret-custody-current-sol

permissions:
  contents: write

jobs:
  materialize-secret-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Bind exact product and additive package scope
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=4b41c9ad783f568d0d353acc9f7016a9bd0b64c2
          WORKFLOW=.github/workflows/recover-capture-export-secret-custody-current-sol.yml
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift
          TEST1=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift
          TEST2=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift
          git merge-base --is-ancestor "$PRODUCT" HEAD
          actual="$(git diff --name-only "$PRODUCT" HEAD | sort)"
          expected="$(printf '%s\n%s\n%s\n%s\n' "$SOURCE" "$TEST1" "$TEST2" "$WORKFLOW" | sort)"
          test "$actual" = "$expected"

      - name: Replace duplicated app classifier with canonical sanitizer
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          start_marker = "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {\n"
          end_marker = "}\n#endif\n\nprivate enum AppleAccountAuthorizationError"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = (
              "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {\n"
              "        guard let dps, !dps.isEmpty else { return }\n"
              "        let sanitized = TuyaApplicationUpdateSecretSanitizer.sanitize(dps)\n"
              "        onApplicationUpdate?(sanitized)\n"
              "    }\n"
          )
          source = source[:start] + replacement + source[end:]
          path.write_text(source)

          driver_start = source.index("@MainActor\nprivate final class SmartLifeDriver")
          driver_end = source.index("#endif\n\nprivate enum AppleAccountAuthorizationError", driver_start)
          driver = source[driver_start:driver_end]
          required = (
              "TuyaApplicationUpdateSecretSanitizer.sanitize(dps)",
              "onApplicationUpdate?(sanitized)",
          )
          for needle in required:
              if needle not in driver:
                  raise SystemExit(f"missing canonical application custody seam: {needle}")
          for stale in (
              "private static let secretKeyFragments",
              "private static func redactApplicationSecrets",
              "String(describing: Self.redactApplicationSecrets(value))",
          ):
              if stale in driver:
                  raise SystemExit(f"duplicated app-local secret classifier remains: {stale}")
          for forbidden in ("publishDps", "queryDps", "writeValue", "disconnectBLE"):
              if forbidden in driver[driver.index(start_marker.strip()):]:
                  raise SystemExit(f"secret custody gained forbidden command path: {forbidden}")
          PY
          git diff --check

      - name: Execute sanitizer behavior and source contracts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift
          TEST1=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift
          TEST2=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift
          swiftc -parse "$SOURCE" "$TEST1" "$TEST2"
          cat > /tmp/SecretCustodyHarness.swift <<'SWIFT'
          import Foundation

          @main
          enum Harness {
              static func main() {
                  let secrets: [String: String] = [
                      "local_key": "LOCAL",
                      "session-key": "SESSION",
                      "appKey": "APPKEY",
                      "app.secret": "APPSECRET",
                      "password": "PASSWORD",
                      "account_token": "ACCOUNT",
                      "access-token": "ACCESS",
                      "refresh.token": "REFRESH",
                      "authKey": "AUTH",
                      "sec_key": "SEC",
                  ]
                  var update: [AnyHashable: Any] = ["speed": 17]
                  for (key, value) in secrets { update[key] = value }
                  update["payload"] = [
                      "session_key": "NESTED_SESSION",
                      "items": [["appSecret": "NESTED_APPSECRET"], ["plain": "keep"]]
                  ] as [String: Any]
                  let output = TuyaApplicationUpdateSecretSanitizer.sanitize(update)
                  for key in secrets.keys {
                      precondition(output[key] == TuyaApplicationUpdateSecretSanitizer.redactedValue)
                  }
                  let projected = output["payload"] ?? ""
                  for secret in ["NESTED_SESSION", "NESTED_APPSECRET"] { precondition(!projected.contains(secret)) }
                  precondition(projected.contains("<redacted>"))
                  precondition(projected.contains("keep"))
                  precondition(output["speed"] == "17")
              }
          }
          SWIFT
          swiftc -warnings-as-errors "$SOURCE" /tmp/SecretCustodyHarness.swift -o /tmp/secret-custody-harness
          /tmp/secret-custody-harness
          python3 <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          sanitizer = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift").read_text()
          required = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey"]
          for fragment in required:
              if f'"{fragment}"' not in sanitizer:
                  raise SystemExit(f"missing export-promised credential class: {fragment}")
          if "secretsRedacted: true" not in app:
              raise SystemExit("accepted export no longer asserts redacted-secret custody")
          promise = "No account UID, AppKey/AppSecret, password, account token, local_key, session key"
          if promise not in app:
              raise SystemExit("operator export promise changed without secret-custody review")
          if "let sanitized = TuyaApplicationUpdateSecretSanitizer.sanitize(dps)" not in app:
              raise SystemExit("SmartLifeDriver is not consuming the canonical sanitizer")
          PY

      - name: Commit four-path repair and self-remove runner
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=4b41c9ad783f568d0d353acc9f7016a9bd0b64c2
          WORKFLOW=.github/workflows/recover-capture-export-secret-custody-current-sol.yml
          APP=NembraApp/App/NembraCaptureEntrypoint.swift
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift
          TEST1=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift
          TEST2=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift
          rm "$WORKFLOW"
          git diff --check
          actual="$(git diff --name-only "$PRODUCT" | sort)"
          expected="$(printf '%s\n%s\n%s\n%s\n' "$APP" "$SOURCE" "$TEST1" "$TEST2" | sort)"
          test "$actual" = "$expected"
          git add "$APP" "$WORKFLOW"
          git config user.name "nembra-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): match application secret custody to export promise"
          git push origin "HEAD:${GITHUB_REF_NAME}"
