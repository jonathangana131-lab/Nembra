name: Temporary ES80 rider-language transform

on:
  push:
    branches:
      - product/es80-v14-rider-language-closure-gpt56-go2

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite only primary rider copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          source = path.read_text(encoding="utf-8")
          start_marker = "    private var passiveSafetyPanel"
          details_marker = "    private var captureDetailsSheet"
          start = source.index(start_marker)
          end = source.index(details_marker, start)
          prefix = source[:start]
          rider = source[start:end]
          details = source[end:]

          replacements = [
              (
                  'Text("One sealed evidence life")',
                  'Text("One read-only capture")',
              ),
              (
                  'Text("Nembra carries the same package-owned Experiment One authority from repeated Bluetooth correlation into passive capture and immutable Horizon sealing. It performs no application characteristic-value writes and never turns a display name, RSSI, or service hint into target authority.")',
                  'Text("Nembra keeps one continuous read-only capture from Scooter OFF / Scooter ON matching through the final seal. It never sends application characteristic-value writes, and names, signal strength, or service hints never decide which signal belongs to this run.")',
              ),
              (
                  'message: "The package-owned physical execution gate is closed. No OFF / ON window, connection, capture, or seal action can advance through this coordinator."',
                  'message: "This build is still locked for real scooter capture. No OFF / ON step, connection, recording, or seal can start until the field checks are complete."',
              ),
              (
                  'message: "Nembra is waiting for this exact window to report Bluetooth powered-on and active scanning. The producer\'s evidence clock has not started yet."',
                  'message: "Nembra is opening this observation window and waiting for Bluetooth scanning to begin. The capture window has not started yet."',
              ),
              (
                  'guidanceFootnote("This countdown is display guidance only. The package producer accepts the window only from its own monotonic receipt boundary; tapping early cannot create evidence.")',
                  'guidanceFootnote("This countdown is guidance only. Nembra records the window only after the required observation is accepted; tapping early cannot shorten it.")',
              ),
              (
                  'message: "One full CoreBluetooth identifier was selectable in both ON windows and absent from both OFF catalogs under this exact package-owned observation series. Treat it only as a correlated Bluetooth target."',
                  'message: "One Bluetooth signal appeared in both ON windows and stayed absent from both OFF windows. Nembra has correlated that signal to this run; this is not permanent scooter identity."',
              ),
              (
                  'message: "A fresh post-admission scan is looking for the exact full identifier that passed both OFF / ON cycles. Keep the scooter in the ON state from the final window."',
                  'message: "Nembra is looking again for the same Bluetooth signal that passed both OFF / ON cycles. Keep the scooter ON as it was in the final window."',
              ),
              (
                  'message: "The same full CoreBluetooth identifier reappeared in the fresh scan epoch created after the sealed admission. This remains local correlation evidence, not permanent hardware authentication."',
                  'message: "The same Bluetooth signal has reappeared after confirmation. It is ready for read-only observation, but it is still correlated signal evidence—not permanent hardware identity."',
              ),
              (
                  'message: "Nembra is connecting only to the package-owned correlated target. No application characteristic-value writes are permitted by this workflow."',
                  'message: "Nembra is connecting only to the signal confirmed by the OFF / ON sequence. This workflow remains read only and does not send application characteristic-value writes."',
              ),
              (
                  'message: "Nembra is passively discovering services, characteristics, descriptors, reads, and notifications for the exact run-owned target session. Ready is not shown until finite acquisition is mechanically complete."',
                  'message: "Nembra is reading the available Bluetooth surface without sending control writes. Ready appears only after this read-only setup is complete."',
              ),
              (
                  'message: "Finite acquisition is Ready. Keep Nembra foregrounded and the scooter stationary while the accepted monotonic observation interval matures. The displayed timer is guidance only."',
                  'message: "Read-only setup is complete. Keep Nembra foregrounded and the scooter stationary while the required observation time completes. The displayed timer is guidance only."',
              ),
              (
                  'message: "The package-owned Ready epoch and required monotonic observation duration are both accepted. Finishing now requests one immutable Horizon from this same authority life."',
                  'message: "The read-only setup and required observation time are complete. Sealing now freezes this run into one final Capture artifact."',
              ),
              (
                  'title: "Freezing immutable evidence",',
                  'title: "Sealing Capture",',
              ),
              (
                  'message: "Nembra is draining the accepted cutoff, committing Horizon, checking final authority, and materializing the immutable JSON artifact. Do not leave the app while this finishes."',
                  'message: "Nembra is finishing the accepted read-only observations, checking the final Capture, and preparing it for sharing. Keep Nembra open until sealing finishes."',
              ),
              (
                  'title: "Evidence failed closed",',
                  'title: "Capture stopped safely",',
              ),
              (
                  'Text("Nembra is recording the bounded CoreBluetooth advertisement catalog for this exact window. Keep the phone nearby and the app foregrounded; do not open the stock scooter app during this series.")',
                  'Text("Nembra is recording nearby Bluetooth signals for this window. Keep the phone nearby and Nembra open; do not open the stock scooter app during this series.")',
              ),
              (
                  'Text("The exact \\(report.finalShareByteCount.formatted())-byte final Share artifact passed the package-owned outer, SoftwareExport, and immutable Capture integrity checks. No protocol field meaning is claimed yet.")',
                  'Text("The exact \\(report.finalShareByteCount.formatted())-byte Capture passed every required integrity check and is ready to share for analysis. No protocol field meaning is claimed yet.")',
              ),
              (
                  'Text("\\(artifact.captureJSON.count.formatted()) immutable capture bytes are sealed from this Experiment One authority. Analysis readiness is not earned until the package verifies the exact final Share bytes and their nested evidence.")',
                  'Text("\\(artifact.captureJSON.count.formatted()) capture bytes are sealed. Nembra still needs to finish the Share integrity check before this run is ready for analysis.")',
              ),
          ]

          for old, new in replacements:
              if old not in rider:
                  raise SystemExit(f"expected current rider copy not found: {old}")
              rider = rider.replace(old, new)

          # Catch secondary/error/accessibility occurrences without deleting the same truth from Details.
          fallback = {
              "full CoreBluetooth identifier": "Bluetooth signal identity",
              "post-admission scan": "fresh target scan",
              "fresh scan epoch created after the sealed admission": "fresh scan after confirmation",
              "package-owned correlated target": "confirmed Bluetooth target",
              "finite acquisition": "read-only setup",
              "accepted Horizon authority": "capture readiness",
              "accepted monotonic observation interval": "required observation time",
              "package-owned Ready epoch": "read-only readiness",
              "committing Horizon": "sealing the capture",
              "immutable JSON artifact": "final Capture artifact",
              "Evidence failed closed": "Capture stopped safely",
              "bounded CoreBluetooth advertisement catalog": "nearby Bluetooth signals",
              "package-owned outer, SoftwareExport, and immutable Capture integrity checks": "required Capture integrity checks",
              "One sealed evidence life": "One read-only capture",
              "package-owned Experiment One authority": "single Capture run",
              "package-owned physical execution gate": "field safety lock",
              "producer's evidence clock": "capture window",
              "producer accepts the window only from its own monotonic receipt boundary": "capture records the window only after the required observation is accepted",
          }
          for old, new in fallback.items():
              rider = rider.replace(old, new)

          forbidden = list(fallback)
          leftovers = [phrase for phrase in forbidden if phrase in rider]
          if leftovers:
              raise SystemExit(f"engineering phrases still present in primary rider surface: {leftovers}")

          required = [
              "PASSIVE / READ ONLY",
              "Scooter OFF",
              "Scooter ON",
              "Share Capture",
              "View Details",
              "guard status.physicalProcedurePermitted else",
              "declaredStationarySetup = nil",
              "PassiveBluetoothExperimentOneFinalShareIntegrity.inspect(artifact.json)",
              "finalShareIntegrityReport != nil",
          ]
          combined = prefix + rider + details
          missing = [value for value in required if value not in combined]
          if missing:
              raise SystemExit(f"required truth/action contract disappeared: {missing}")

          stable_ids = [
              "es80.capture.begin-window",
              "es80.capture.confirm-setup",
              "es80.capture.complete-window",
              "es80.capture.restart-correlation",
              "es80.capture.confirm-correlated-target",
              "es80.capture.restart-rediscovery",
              "es80.capture.connect-prepared-target",
              "es80.capture.finish",
              "es80.capture.share",
              "es80.capture.prepare-share",
              "es80.capture.share-unavailable",
              "es80.capture.view-details",
              "es80.capture.restart-experiment",
              "es80.capture.experiment-progress",
              "es80.capture.single-authority",
              "es80.capture.complete",
              "es80.capture-shell",
          ]
          missing_ids = [value for value in stable_ids if value not in combined]
          if missing_ids:
              raise SystemExit(f"stable Capture identifiers disappeared: {missing_ids}")

          # Engineering truth must remain in Details.
          for value in [
              "Truth boundary",
              "CoreBluetooth",
              "Software Export SHA-256",
              "Runtime executable SHA-256",
              "does not authenticate the physical ES80",
          ]:
              if value not in details:
                  raise SystemExit(f"engineering Details truth disappeared: {value}")

          path.write_text(combined, encoding="utf-8")
          PY

      - name: Verify effective scope
        run: |
          git diff --check
          git diff -- NembraApp/Features/Research/ES80CaptureShellView.swift

      - name: Commit product copy and self-delete transformer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-rider-language-transform-gpt56-go2.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git commit -m "Capture: make primary field flow rider-first"
          git push origin HEAD:product/es80-v14-rider-language-closure-gpt56-go2
