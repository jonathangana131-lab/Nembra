name: ES80 V14 Rider Copy Second Pass Runner

# API-triggered after guarded cardinality correction.
on:
  push:
    branches:
      - "polish/es80-v14-human-first-rider-copy-current/chatgpt56-thinking-go"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "polish/es80-v14-human-first-rider-copy-current/chatgpt56-thinking-go"

      - name: Apply guarded product-language pass
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_es80_rider_copy_second_pass.py
          git diff --check
          test ! -e .github/workflows/es80-v14-rider-copy-second-pass.yml
          test ! -e .github/workflows/es80-v14-rider-copy-second-pass-runner.yml
          test ! -e scripts/ci/tmp_es80_rider_copy_second_pass.py

      - name: Commit product-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-go-worker"
          git config user.email "nembra-go-worker@users.noreply.github.com"
          git add -A
          git commit -m "[Capture product v14] Finish human-first rider copy"
          git push origin HEAD:"polish/es80-v14-human-first-rider-copy-current/chatgpt56-thinking-go"
