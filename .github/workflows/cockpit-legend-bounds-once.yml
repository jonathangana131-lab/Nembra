name: Cockpit compact Energy Rail legend bounds one-shot

on:
  pull_request:
    types: [synchronize]
    branches:
      - main
    paths:
      - .github/workflows/cockpit-legend-bounds-once.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'product/cockpit-energy-rail-mainline-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: product/cockpit-energy-rail-mainline-20260820
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_PARENT: d832eb2edee7a8ca476044ffc178d172d63f480f
      SELF_WORKFLOW: .github/workflows/cockpit-legend-bounds-once.yml
      INSTRUMENT_SOURCE: NembraApp/Features/Dashboard/SpeedInstrumentModel.swift
      APP_TESTS: NembraAppTests/NembraAppTests.swift

    steps:
      - name: Checkout exact bounded authoring head
        uses: actions/checkout@v6
        with:
          ref: product/cockpit-energy-rail-mainline-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact parent and one-file trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT"...HEAD)" = "$SELF_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize bounded permanent rail legends
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          def require_once(source: str, token: str, label: str) -> None:
              count = source.count(token)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")

          instrument_path = Path("NembraApp/Features/Dashboard/SpeedInstrumentModel.swift")
          instrument = instrument_path.read_text(encoding="utf-8")

          struct_anchor = "private struct DashboardEnergyRailView: View {"
          require_once(instrument, struct_anchor, "Energy Rail view")
          if "enum DashboardEnergyRailLegendPolicy" in instrument:
              raise SystemExit("legend policy already exists; refuse replay")

          policy = '''enum DashboardEnergyRailLegendPolicy {
              static func frameHeight(for pointSize: CGFloat) -> CGFloat {
                  max(14, ceil(pointSize * 1.55))
              }

              static func centerY(
                  desiredY: CGFloat,
                  railHeight: CGFloat,
                  pointSize: CGFloat
              ) -> CGFloat? {
                  guard desiredY.isFinite,
                        railHeight.isFinite,
                        pointSize.isFinite,
                        railHeight > 0,
                        pointSize > 0 else {
                      return nil
                  }

                  let labelHeight = frameHeight(for: pointSize)
                  // Permanent legends are decorative. At the 44pt accessibility rail floor,
                  // omit them instead of letting glyphs escape into stopped controls.
                  guard railHeight >= max(52, labelHeight * 2.75) else { return nil }

                  let inset = max(2, labelHeight * 0.15)
                  let minimumCenter = inset + labelHeight / 2
                  let maximumCenter = railHeight - inset - labelHeight / 2
                  guard maximumCenter >= minimumCenter else { return nil }
                  return min(max(desiredY, minimumCenter), maximumCenter)
              }
          }

          private struct DashboardEnergyRailView: View {'''
          instrument = instrument.replace(struct_anchor, policy, 1)

          block_start = '                Text("0")\n'
          block_end = (
              '\n            }\n'
              '        }\n'
              '        .accessibilityElement(children: .ignore)\n'
              '        .accessibilityLabel("Propulsion power")'
          )
          require_once(instrument, block_start, "zero legend start")
          start = instrument.index(block_start)
          end = instrument.find(block_end, start)
          if end < 0:
              raise SystemExit("Energy Rail legend boundary missing")
          old_block = instrument[start:end]
          for token in [
              'Text("PROPULSION  →")',
              'if let scaleText = semantics.scaleText {',
              '.position(x: geometry.start.x, y: geometry.start.y + 17)',
              '.position(x: proxy.size.width * 0.24, y: proxy.size.height * 0.90)',
              '.position(x: proxy.size.width * 0.78, y: proxy.size.height * 0.90)',
          ]:
              require_once(old_block, token, f"legacy legend token {token}")
          if len(old_block) > 1_600:
              raise SystemExit(f"legacy legend block unexpectedly large: {len(old_block)} bytes")

          new_block = '''                if let zeroLabelY = DashboardEnergyRailLegendPolicy.centerY(
                      desiredY: geometry.start.y + 17,
                      railHeight: proxy.size.height,
                      pointSize: smallLabelSize
                  ) {
                      Text("0")
                          .font(.system(size: smallLabelSize, weight: .semibold, design: .monospaced))
                          .foregroundStyle(NembraColor.secondaryText.opacity(0.88))
                          .frame(height: DashboardEnergyRailLegendPolicy.frameHeight(for: smallLabelSize))
                          .position(x: geometry.start.x, y: zeroLabelY)
                          .accessibilityHidden(true)
                  }

                  if let propulsionLabelY = DashboardEnergyRailLegendPolicy.centerY(
                      desiredY: proxy.size.height * 0.90,
                      railHeight: proxy.size.height,
                      pointSize: smallLabelSize
                  ) {
                      Text("PROPULSION  →")
                          .font(.system(size: smallLabelSize, weight: .bold, design: .default))
                          .tracking(1.5)
                          .foregroundStyle(NembraColor.secondaryText.opacity(0.88))
                          .frame(height: DashboardEnergyRailLegendPolicy.frameHeight(for: smallLabelSize))
                          .position(x: proxy.size.width * 0.24, y: propulsionLabelY)
                          .accessibilityHidden(true)
                  }

                  if let scaleText = semantics.scaleText,
                     let scaleLabelY = DashboardEnergyRailLegendPolicy.centerY(
                         desiredY: proxy.size.height * 0.90,
                         railHeight: proxy.size.height,
                         pointSize: microLabelSize
                     ) {
                      Text(scaleText)
                          .font(.system(size: microLabelSize, weight: .semibold, design: .monospaced))
                          .tracking(0.5)
                          .foregroundStyle(NembraColor.secondaryText.opacity(0.88))
                          .frame(height: DashboardEnergyRailLegendPolicy.frameHeight(for: microLabelSize))
                          .position(x: proxy.size.width * 0.78, y: scaleLabelY)
                          .accessibilityHidden(true)
                  }'''
          instrument = instrument[:start] + new_block + instrument[end:]
          instrument_path.write_text(instrument, encoding="utf-8")

          tests_path = Path("NembraAppTests/NembraAppTests.swift")
          tests = tests_path.read_text(encoding="utf-8")
          test_anchor = "    func testPowerPeakLabelPolicyStaysInsideRailOrOmitsCompactLabel() throws {\n"
          require_once(tests, test_anchor, "peak label regression insertion")
          if "testEnergyRailPermanentLegendPolicyStaysInsideRailOrOmitsCompactLabels" in tests:
              raise SystemExit("legend regression already exists; refuse replay")

          regression = textwrap.indent(textwrap.dedent('''
          func testEnergyRailPermanentLegendPolicyStaysInsideRailOrOmitsCompactLabels() throws {
              for pointSize: CGFloat in [8, 13, 15] {
                  XCTAssertNil(
                      DashboardEnergyRailLegendPolicy.centerY(
                          desiredY: 39.6,
                          railHeight: 44,
                          pointSize: pointSize
                      ),
                      "The 44pt accessibility rail must omit decorative legends rather than draw into stopped controls."
                  )
              }

              let railHeight: CGFloat = 82
              let pointSize: CGFloat = 10
              let frameHeight = DashboardEnergyRailLegendPolicy.frameHeight(for: pointSize)
              for desiredY: CGFloat in [38, 73.8, 99] {
                  let centerY = try XCTUnwrap(
                      DashboardEnergyRailLegendPolicy.centerY(
                          desiredY: desiredY,
                          railHeight: railHeight,
                          pointSize: pointSize
                      )
                  )
                  XCTAssertGreaterThanOrEqual(centerY - frameHeight / 2, 0)
                  XCTAssertLessThanOrEqual(centerY + frameHeight / 2, railHeight)
              }
          }
          ''').strip(), "    ") + "\n\n"
          tests = tests.replace(test_anchor, regression + test_anchor, 1)
          tests_path.write_text(tests, encoding="utf-8")

      - name: Enforce bounded source delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' "$APP_TESTS" "$INSTRUMENT_SOURCE" | sort)"
          test "$actual" = "$expected"
          grep -Fq 'enum DashboardEnergyRailLegendPolicy' "$INSTRUMENT_SOURCE"
          grep -Fq 'testEnergyRailPermanentLegendPolicyStaysInsideRailOrOmitsCompactLabels' "$APP_TESTS"

      - name: Publish exact bounded closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD"
          git rm -- "$SELF_WORKFLOW"
          git add -- "$INSTRUMENT_SOURCE" "$APP_TESTS"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cockpit): bound compact Energy Rail legends'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD"
          git push origin HEAD:"$TARGET_BRANCH"
