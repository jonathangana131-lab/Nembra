name: V14 Capture Composed Final Repair

on:
  push:
    branches:
      - repair/v14-capture-composed-final-gaps-sol
    paths:
      - .github/workflows/v14-capture-composed-final-repair.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    name: Repair composed Capture and validate exact product
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify immutable composed parent
        shell: bash
        run: |
          set -euo pipefail
          expected='8fbe70b3b26821d1ef62ac8009d919f49919fb99'
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || { echo "unexpected parent: $actual" >&2; exit 1; }

      - name: Apply exact source repair and current contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = app_path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement match, found {count}: {old[:120]!r}')
              source = source.replace(old, new, 1)

          def replace_section(start: str, end: str, replacement: str) -> None:
              global source
              start_index = source.find(start)
              if start_index < 0:
                  raise SystemExit(f'missing section start: {start}')
              end_index = source.find(end, start_index + len(start))
              if end_index < 0:
                  raise SystemExit(f'missing section end: {end}')
              source = source[:start_index] + replacement + source[end_index:]

          replace_once(
              '        case idle, baseline, powerOn, scanning, selected, authenticating, observing, accepted, failed\n',
              '        case idle, baseline, powerOn, scanning, correlated, selected, authenticating, observing, accepted, failed\n'
          )

          replace_once(
              '    struct Export: Codable {\n',
              '''    struct TargetCorrelationCandidateExport: Codable {\n        let peripheralID: String\n        let isConnectable: Bool?\n    }\n\n    struct TargetCorrelationWindowExport: Codable {\n        let phase: String\n        let windowSequence: UInt64\n        let startedAtUptimeNanoseconds: UInt64\n        let endedAtUptimeNanoseconds: UInt64\n        let observedCandidateCount: Int\n        let candidates: [TargetCorrelationCandidateExport]\n    }\n\n    struct TargetCorrelationExport: Codable {\n        let method: String\n        let observationSeriesIdentities: [String]\n        let windows: [TargetCorrelationWindowExport]\n        let repeatableCandidateIDs: [String]\n        let disposition: String\n        let correlatedPeripheralID: String?\n        let operatorConfirmed: Bool\n    }\n\n    struct Export: Codable {\n'''
          )
          replace_once(
              '        let selectedPeripheralID: String?\n        let phase: Phase\n',
              '        let selectedPeripheralID: String?\n        let targetCorrelation: TargetCorrelationExport?\n        let phase: Phase\n'
          )

          replace_once(
              '    private var correlationSession: PassiveBluetoothPowerCycleObservationSession?\n',
              '    private var correlationSession: PassiveBluetoothPowerCycleObservationSession?\n    private var correlationResult: PassiveBluetoothPowerCycleObservationResult?\n    private var correlationConfirmedByOperator = false\n'
          )
          replace_once(
              '    var currentAccountUID: String? { OfficialTuyaFactory.currentAccountUID }\n    var selected: Candidate? { selectedID.flatMap { byID[$0] } }\n',
              '    var currentAccountUID: String? { OfficialTuyaFactory.currentAccountUID }\n    var fieldBuildIsAuthoritative: Bool { buildIdentity.isAuthoritativeFieldBuild }\n    var selected: Candidate? { selectedID.flatMap { byID[$0] } }\n'
