        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          grep -Fq 'case idle, baseline, powerOn, scanning, correlated, selected' "$app"
          grep -Fq 'func confirmCorrelatedTarget()' "$app"
          grep -Fq 'markChronologyIntegrityInvalidated' "$app"
          grep -Fq 'targetCorrelation: targetCorrelationExport' "$app"
          grep -Fq 'schemaVersion: 8' "$app"
          grep -Fq 'var fieldBuildIsAuthoritative: Bool { buildIdentity.isAuthoritativeFieldBuild }' "$app"
          ! grep -q 'writeValue(' "$app"

      - name: Capture package warnings-as-errors tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Standalone Capture Simulator build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/NembraCaptureV14RepairDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureV14RepairDerived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish exact repaired product and self-retire transformer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v14-capture-composed-final-repair.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests
          git diff --cached --check
          git config user.name 'nembra-v14-capture-closer'
