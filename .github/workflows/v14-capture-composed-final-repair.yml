name: V14 Capture Composed Final Repair

on:
  push:
    branches:
      - repair/v14-capture-composed-final-gaps-sol
    paths:
      - .github/workflows/v14-capture-composed-final-repair.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    name: Repair composed Capture and validate exact product
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Verify exact composed product bytes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8fbe70b3b26821d1ef62ac8009d919f49919fb99 HEAD
          test "$(git rev-parse HEAD:NembraApp/App/NembraCaptureEntrypoint.swift)" = be6f3271b83a7f23172b4d7eb0bfb675d2f98545
          test "$(git rev-parse HEAD:Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift)" = 0950b34fbc56fdfd8ea2f723cedea21ede42c38c

      - name: Apply deterministic product repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/v14_capture_composed_final_repair.py
          git diff --check

      - name: Verify source safety contract
        shell: bash
        run: |
          set -euo pipefail
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          grep -Fq 'case idle, baseline, powerOn, scanning, correlated, selected' "$app"
          grep -Fq 'func confirmCorrelatedTarget()' "$app"
          grep -Fq 'markChronologyIntegrityInvalidated' "$app"
          grep -Fq 'targetCorrelation: targetCorrelationExport' "$app"
          grep -Fq 'schemaVersion: 8' "$app"
          grep -Fq 'var fieldBuildIsAuthoritative: Bool { buildIdentity.isAuthoritativeFieldBuild }' "$app"
          ! grep -q 'writeValue(' "$app"

      - name: Capture package warnings-as-errors tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Standalone Capture Simulator build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/NembraCaptureV14RepairDerived
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureV14RepairDerived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish exact repaired product and self-retire helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v14-capture-composed-final-repair.yml scripts/ci/v14_capture_composed_final_repair.py
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests
          git diff --cached --check
          git config user.name 'nembra-v14-capture-closer'
          git config user.email 'nembra-v14-capture-closer@users.noreply.github.com'
          git commit -m 'fix(capture): close composed field authority gaps'
          git push origin HEAD:repair/v14-capture-composed-final-gaps-sol
