        log("candidate_selected", [
            "id": id.uuidString,
            "authority": "fresh-repeated-off-on-full-corebluetooth-id",
            "operatorConfirmed": "true",
            "correlation": "OFF1-ON1-OFF2-ON2"
        ])
    }

