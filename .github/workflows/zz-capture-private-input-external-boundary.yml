name: Capture private input external boundary

on:
  push:
    branches:
      - agent/capture-private-input-external-boundary-v14

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact flagship parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c3a6238159e5e16de7dc1387f9eb621ac52fe345"

      - name: Require intended-device input outside repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement site, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          runner = Path("scripts/ci/es80_signed_field_artifact_private_runner.py")
          producer = Path("scripts/ci/xcode27_signed_field_candidate.sh")
          intended_test = Path("scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py")
          source_test = Path("scripts/ci/tests/test_xcode27_signed_field_candidate_source.py")

          replace_once(
              runner,
              '''def read_private_identifier(path: Path) -> str:\n    """Read one opaque identifier through one no-follow descriptor without repairing the bytes."""\n    if not hasattr(os, "O_NOFOLLOW"):\n''',
              '''def require_external_private_input(path: Path, repository_root: Path) -> None:\n    """Reject private verification material whose resolved path lives inside the repository."""\n    if not path.is_absolute():\n        raise PrivateInputError("intended-device verification file path must be absolute")\n    try:\n        resolved_path = path.resolve(strict=True)\n        resolved_repository = repository_root.resolve(strict=True)\n    except OSError as exc:\n        raise PrivateInputError("could not resolve intended-device verification privacy boundary") from exc\n    try:\n        resolved_path.relative_to(resolved_repository)\n    except ValueError:\n        return\n    raise PrivateInputError("intended-device verification file must live outside the Nembra repository")\n\n\ndef read_private_identifier(path: Path, repository_root: Path) -> str:\n    """Read one external opaque identifier through one no-follow descriptor without repairing bytes."""\n    require_external_private_input(path, repository_root)\n    if not hasattr(os, "O_NOFOLLOW"):\n''',
          )

          replace_once(
              runner,
              '''    intended_device_identifier = read_private_identifier(args.intended_device_udid_file)\n''',
              '''    intended_device_identifier = read_private_identifier(\n        args.intended_device_udid_file,\n        args.repository_root,\n    )\n''',
          )

          replace_once(
              runner,
              '''    with tempfile.TemporaryDirectory(prefix="nembra-private-device-input-") as temporary:\n        root = Path(temporary)\n\n        private_file = root / "device-id"\n        private_file.write_text(expected, encoding="utf-8")\n        private_file.chmod(0o600)\n        assert read_private_identifier(private_file) == expected\n''',
              '''    with tempfile.TemporaryDirectory(prefix="nembra-private-device-input-") as temporary:\n        root = Path(temporary)\n        repository_root = root / "repository"\n        repository_root.mkdir()\n\n        private_file = root / "device-id"\n        private_file.write_text(expected, encoding="utf-8")\n        private_file.chmod(0o600)\n        assert read_private_identifier(private_file, repository_root) == expected\n\n        repository_private_file = repository_root / "ignored-device-id"\n        repository_private_file.write_text(expected, encoding="utf-8")\n        repository_private_file.chmod(0o600)\n        try:\n            read_private_identifier(repository_private_file, repository_root)\n        except PrivateInputError:\n            pass\n        else:\n            raise AssertionError("repository-contained verification input must fail closed")\n\n        relative_private_file = Path("device-id")\n        try:\n            read_private_identifier(relative_private_file, repository_root)\n        except PrivateInputError:\n            pass\n        else:\n            raise AssertionError("relative verification input path must fail closed")\n''',
          )

          for old, new in [
              ('read_private_identifier(newline_file)', 'read_private_identifier(newline_file, repository_root)'),
              ('read_private_identifier(permissive_file)', 'read_private_identifier(permissive_file, repository_root)'),
              ('read_private_identifier(symlink_file)', 'read_private_identifier(symlink_file, repository_root)'),
              ('read_private_identifier(oversized)', 'read_private_identifier(oversized, repository_root)'),
          ]:
              replace_once(runner, old, new)

          replace_once(
              runner,
              '''    parser.add_argument(\n        "--intended-device-udid-file",\n        type=Path,\n        help="private mode-0600 file containing the verification-only intended field-device identifier",\n    )\n''',
              '''    parser.add_argument(\n        "--intended-device-udid-file",\n        type=Path,\n        help="external private mode-0600 file containing the verification-only intended field-device identifier",\n    )\n    parser.add_argument(\n        "--repository-root",\n        type=Path,\n        help="exact repository root that the private intended-device input must resolve outside",\n    )\n''',
          )

          replace_once(
              runner,
              '''                args.intended_device_udid_file,\n                args.canonical_inspector_fd,\n                args.validate_intended_device_udid_file,\n''',
              '''                args.intended_device_udid_file,\n                args.repository_root,\n                args.canonical_inspector_fd,\n                args.validate_intended_device_udid_file,\n''',
          )

          replace_once(
              runner,
              '''    if args.validate_intended_device_udid_file is not None:\n        if any(\n            value is not None\n            for value in (\n                args.ipa,\n                args.output_dir,\n                args.expected_source_sha,\n                args.intended_device_udid_file,\n                args.canonical_inspector_fd,\n            )\n        ):\n            raise PrivateInputError("private-input validation cannot be combined with inspector arguments")\n        read_private_identifier(args.validate_intended_device_udid_file)\n        print("private intended-device verification input: PASS")\n        return 0\n''',
              '''    if args.validate_intended_device_udid_file is not None:\n        if any(\n            value is not None\n            for value in (\n                args.ipa,\n                args.output_dir,\n                args.expected_source_sha,\n                args.intended_device_udid_file,\n                args.canonical_inspector_fd,\n            )\n        ):\n            raise PrivateInputError("private-input validation cannot be combined with inspector arguments")\n        if args.repository_root is None:\n            raise PrivateInputError("private-input validation requires --repository-root")\n        read_private_identifier(args.validate_intended_device_udid_file, args.repository_root)\n        print("private intended-device verification input: PASS")\n        return 0\n''',
          )

          replace_once(
              runner,
              '''            ("--intended-device-udid-file", args.intended_device_udid_file),\n            ("--canonical-inspector-fd", args.canonical_inspector_fd),\n''',
              '''            ("--intended-device-udid-file", args.intended_device_udid_file),\n            ("--repository-root", args.repository_root),\n            ("--canonical-inspector-fd", args.canonical_inspector_fd),\n''',
          )

          replace_once(
              producer,
              '''if ! python3 /dev/fd/7 \\\n  --validate-intended-device-udid-file "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE"\n''',
              '''if ! python3 /dev/fd/7 \\\n  --validate-intended-device-udid-file "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" \\\n  --repository-root "$ROOT"\n''',
          )
          replace_once(
              producer,
              '''  --intended-device-udid-file "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" \\\n  --canonical-inspector-fd 8 \\\n''',
              '''  --intended-device-udid-file "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE" \\\n  --repository-root "$ROOT" \\\n  --canonical-inspector-fd 8 \\\n''',
          )

          replace_once(
              intended_test,
              '''PRIVATE_RUNNER = Path(__file__).resolve().parents[1] / "es80_signed_field_artifact_private_runner.py"\n''',
              '''PRIVATE_RUNNER = Path(__file__).resolve().parents[1] / "es80_signed_field_artifact_private_runner.py"\nREPOSITORY_ROOT = PRIVATE_RUNNER.resolve().parents[2]\n''',
          )
          replace_once(
              intended_test,
              '''        self.assertIn(\n            '--intended-device-udid-file "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE"',\n            source,\n        )\n''',
              '''        self.assertIn(\n            '--intended-device-udid-file "$NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE"',\n            source,\n        )\n        self.assertEqual(source.count('--repository-root "$ROOT"'), 2)\n        self.assertIn('require_external_private_input(path, repository_root)', runner)\n        self.assertIn('resolved_path.relative_to(resolved_repository)', runner)\n''',
          )
          replace_once(
              intended_test,
              '''                    runner.read_private_identifier(private_file)\n''',
              '''                    runner.read_private_identifier(private_file, REPOSITORY_ROOT)\n''',
          )
          replace_once(
              intended_test,
              '''                    runner.read_private_identifier(private_file)\n\n            self.assertEqual(call_count, 2)\n''',
              '''                    runner.read_private_identifier(private_file, REPOSITORY_ROOT)\n\n            self.assertEqual(call_count, 2)\n''',
          )
          replace_once(
              intended_test,
              '''    def test_same_size_in_place_mutation_fails_closed(self) -> None:\n''',
              '''    def test_repository_contained_private_input_fails_closed(self) -> None:\n        runner = load_private_runner()\n        with tempfile.TemporaryDirectory(dir=REPOSITORY_ROOT, prefix=".nembra-private-boundary-test-") as temporary:\n            private_file = Path(temporary) / "ignored-device-id"\n            private_file.write_text("00008101-001234567890001E", encoding="utf-8")\n            private_file.chmod(0o600)\n            try:\n                with self.assertRaisesRegex(\n                    runner.PrivateInputError,\n                    "must live outside the Nembra repository",\n                ):\n                    runner.read_private_identifier(private_file, REPOSITORY_ROOT)\n            finally:\n                private_file.unlink(missing_ok=True)\n\n    def test_relative_private_input_path_fails_closed(self) -> None:\n        runner = load_private_runner()\n        with self.assertRaisesRegex(\n            runner.PrivateInputError,\n            "path must be absolute",\n        ):\n            runner.read_private_identifier(Path("device-id"), REPOSITORY_ROOT)\n\n    def test_same_size_in_place_mutation_fails_closed(self) -> None:\n''',
          )

          replace_once(
              source_test,
              '''PRIVATE_RUNNER = Path(__file__).resolve().parents[1] / "es80_signed_field_artifact_private_runner.py"\n''',
              '''PRIVATE_RUNNER = Path(__file__).resolve().parents[1] / "es80_signed_field_artifact_private_runner.py"\nREPOSITORY_ROOT = PRIVATE_RUNNER.resolve().parents[2]\n''',
          )
          replace_once(
              source_test,
              '''        self.assertIn('--canonical-inspector-fd 8', self.source)\n''',
              '''        self.assertIn('--canonical-inspector-fd 8', self.source)\n        self.assertEqual(self.source.count('--repository-root "$ROOT"'), 2)\n''',
          )
          replace_once(
              source_test,
              '''                    [sys.executable, f"/dev/fd/{runner_fd}", "--validate-intended-device-udid-file", str(private_file)],\n''',
              '''                    [\n                        sys.executable, f"/dev/fd/{runner_fd}",\n                        "--validate-intended-device-udid-file", str(private_file),\n                        "--repository-root", str(REPOSITORY_ROOT),\n                    ],\n''',
          )
          replace_once(
              source_test,
              '''                        "--intended-device-udid-file", str(private_file),\n                        "--canonical-inspector-fd", str(inspector_fd),\n''',
              '''                        "--intended-device-udid-file", str(private_file),\n                        "--repository-root", str(REPOSITORY_ROOT),\n                        "--canonical-inspector-fd", str(inspector_fd),\n''',
          )
          PY

      - name: Validate privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 -m py_compile scripts/ci/es80_signed_field_artifact_private_runner.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/es80_signed_field_artifact_private_runner.py --self-test
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_source.py
          python3 scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py
          git diff --check

      - name: Commit product hardening and remove transformer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-capture-private-input-external-boundary.yml
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/es80_signed_field_artifact_private_runner.py \
                  scripts/ci/xcode27_signed_field_candidate.sh \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_source.py \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py \
                  .github/workflows/zz-capture-private-input-external-boundary.yml
          git diff --cached --check
          git commit -m "fix(capture): require external private device input"
          git push origin HEAD:agent/capture-private-input-external-boundary-v14
