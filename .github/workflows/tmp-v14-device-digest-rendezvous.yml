name: Temporary Capture Device Digest Rendezvous

on:
  pull_request:
    branches:
      - repair/v14-capture-device-digest-rendezvous-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Transform and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_materialize_device_digest_rendezvous.py
          bash -n scripts/field/install_one_time_capture.command
          grep -Fq 'NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256' scripts/field/install_one_time_capture.command
          grep -Fq 'hmac.compare_digest(actual_digest, expected_digest)' scripts/field/install_one_time_capture.command
          grep -Fq 'intendedDeviceIdentityMustMatchFinalGoDigest' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldInstallerIntendedDeviceAuthoritySourceTests.swift
          git diff --check
      - name: Checkpoint product repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-v14-go"
          git config user.email "nembra-v14-go@users.noreply.github.com"
          git add scripts/field/install_one_time_capture.command Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldInstallerIntendedDeviceAuthoritySourceTests.swift
          git commit -m "fix(capture): bind private install to intended-device digest"
          git push origin HEAD:repair/v14-capture-device-digest-rendezvous-sol
