name: TEMP V14 Dedicated UID Cross-Sudo Identity Bind

on:
  push:
    branches:
      - fix/v14-dedicated-uid-cross-sudo-identity-sol-20260811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v14-dedicated-uid-cross-sudo-identity-sol-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize exact UID/GID bind
        shell: bash
        env:
          PARENT: 2c687bac0331575f5b3835d66684085e9d65bfa9
          SOURCE: scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$PARENT")" = "$PARENT"

          if grep -Fq 'evidence.get("fieldUID") == field_uid' "$SOURCE" \
             && grep -Fq 'evidence.get("fieldPrimaryGID") == field_primary_gid' "$SOURCE"; then
            printf 'Cross-sudo field UID/GID bind already materialized.\n'
            exit 0
          fi

          /usr/bin/python3 -I - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          identity_old = '''    if os.getuid() <= 0 or os.geteuid() != os.getuid() or os.getegid() != os.getgid():\n        emit_error("identity", "field probe requires one stable non-root invoking identity before sudo")\n        return 80\n    field_primary_gid = os.getgid()\n'''
          identity_new = '''    field_uid = os.getuid()\n    if field_uid <= 0 or os.geteuid() != field_uid or os.getegid() != os.getgid():\n        emit_error("identity", "field probe requires one stable non-root invoking identity before sudo")\n        return 80\n    field_primary_gid = os.getgid()\n'''
          if source.count(identity_old) != 1:
              raise SystemExit(f"pre-sudo identity site missing/ambiguous: {source.count(identity_old)}")
          source = source.replace(identity_old, identity_new)

          semantic_old = '''        if not (\n            evidence.get("xcodebuildReturnCode") == 0\n'''
          semantic_new = '''        if not (\n            evidence.get("fieldUID") == field_uid\n            and evidence.get("fieldPrimaryGID") == field_primary_gid\n            and evidence.get("xcodebuildReturnCode") == 0\n'''
          if source.count(semantic_old) != 1:
              raise SystemExit(f"parent semantic site missing/ambiguous: {source.count(semantic_old)}")
          source = source.replace(semantic_old, semantic_new)

          required = (
              'field_uid = os.getuid()',
              'evidence.get("fieldUID") == field_uid',
              'evidence.get("fieldPrimaryGID") == field_primary_gid',
              'evidence.get("fieldActiveSupplementaryGroups") == field_active_groups',
          )
          for marker in required:
              if marker not in source:
                  raise SystemExit(f"missing repaired identity marker: {marker}")
          path.write_text(source, encoding="utf-8")
          PY

          /usr/bin/python3 -m py_compile "$SOURCE"
          git diff --check "$PARENT" -- "$SOURCE"
          changed="$(git diff --name-only "$PARENT"...HEAD; git diff --name-only -- "$SOURCE")"
          printf 'Materialized source diff:\n'
          git diff -- "$SOURCE"

          git config user.name 'Nembra Swarm Constructor'
          git config user.email 'nembra-swarm@users.noreply.github.com'
          git add -- "$SOURCE"
          git commit -m 'Bind dedicated-UID evidence to pre-sudo field identity'
          git push origin HEAD:refs/heads/fix/v14-dedicated-uid-cross-sudo-identity-sol-20260811
