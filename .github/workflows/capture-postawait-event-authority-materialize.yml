name: Capture post-await event authority materializer

on:
  push:
    branches:
      - agent/v14-capture-postawait-event-authority-sol
    paths:
      - .github/workflows/capture-postawait-event-authority-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-postawait-event-authority-sol
          fetch-depth: 0

      - name: Bind exact flagship parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ba3a1eeae36caca6dd84beaabd0f15f4f0b57925 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply bounded authority repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          s = p.read_text()

          receiver_start = s.index("    private func receivedApplicationUpdate(")
          helper_start = s.index("    private func redactedApplicationEventDetails(", receiver_start)
          watchdog_start = s.index("    private func startWatchdog", helper_start)
          receiver = s[receiver_start:helper_start]
          helper = s[helper_start:watchdog_start]

          admission = "        applicationUpdateAdmissionsInFlight += 1\n"
          if receiver.count(admission) != 1:
              raise SystemExit("unexpected application admission shape")
          uid_lease = (
              "        guard let verifiedAccountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),\n"
              "              !verifiedAccountUID.isEmpty else {\n"
              "            await invalidateSourceAuthority(\n"
              "                token: token,\n"
              "                message: \"The verified Tuya account UID lease became unavailable before application evidence custody.\",\n"
              "                kind: \"sdk_account_uid_lease_missing_during_observation\"\n"
              "            )\n"
              "            return\n"
              "        }\n\n"
          )
          receiver = receiver.replace(admission, uid_lease + admission, 1)

          refresh = "            await refreshLedgerSnapshot()\n"
          if receiver.count(refresh) != 1:
              raise SystemExit("unexpected application ledger refresh shape")
          post_await = (
              "            guard sdkAccountLoggedIn,\n"
              "                  sdkDeviceMembershipVerified,\n"
              "                  accountIdentityLeaseIsAuthorized,\n"
              "                  membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines) == verifiedAccountUID else {\n"
              "                await invalidateSourceAuthority(\n"
              "                    token: token,\n"
              "                    message: \"SDK account/device source authority changed before application evidence could enter immutable event custody.\",\n"
              "                    kind: \"sdk_source_authority_changed_before_application_event_custody\"\n"
              "                )\n"
              "                return\n"
              "            }\n"
          )
          receiver = receiver.replace(refresh, refresh + post_await, 1)

          old_call = "            var eventDetails = redactedApplicationEventDetails(update)\n"
          new_call = (
              "            var eventDetails = redactedApplicationEventDetails(\n"
              "                update,\n"
              "                verifiedAccountUID: verifiedAccountUID\n"
              "            )\n"
          )
          if receiver.count(old_call) != 1:
              raise SystemExit("unexpected application redaction call shape")
          receiver = receiver.replace(old_call, new_call, 1)

          old_helper_head = (
              "    private func redactedApplicationEventDetails(_ update: [String: String]) -> [String: String] {\n"
              "        guard let accountUID = membershipAccountUID?.trimmingCharacters(in: .whitespacesAndNewlines),\n"
              "              !accountUID.isEmpty else {\n"
              "            return update\n"
              "        }\n"
          )
          new_helper_head = (
              "    private func redactedApplicationEventDetails(\n"
              "        _ update: [String: String],\n"
              "        verifiedAccountUID: String\n"
              "    ) -> [String: String] {\n"
              "        let accountUID = verifiedAccountUID.trimmingCharacters(in: .whitespacesAndNewlines)\n"
              "        guard !accountUID.isEmpty else { return [:] }\n"
          )
          if helper.count(old_helper_head) != 1:
              raise SystemExit("unexpected event redaction helper shape")
          helper = helper.replace(old_helper_head, new_helper_head, 1)

          s = s[:receiver_start] + receiver + helper + s[watchdog_start:]
          p.write_text(s)
          PY
          git diff --check

      - name: Verify post-await source authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          a = s.index("    private func receivedApplicationUpdate(")
          b = s.index("    private func redactedApplicationEventDetails(", a)
          c = s.index("    private func startWatchdog", b)
          receiver = s[a:b]
          helper = s[b:c]

          refresh = receiver.index("await refreshLedgerSnapshot()")
          recheck = receiver.index("sdk_source_authority_changed_before_application_event_custody")
          log = receiver.index('log("tuya_application_update"')
          assert refresh < recheck < log
          assert "membershipAccountUID?.trimmingCharacters" in receiver
          assert "accountIdentityLeaseIsAuthorized" in receiver[refresh:log]
          assert "verifiedAccountUID: verifiedAccountUID" in receiver
          assert "verifiedAccountUID: String" in helper
          assert "return update" not in helper
          assert '<redacted-account-uid>' in helper
          PY

      - name: Commit product repair and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-postawait-event-authority-materialize.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/capture-postawait-event-authority-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): revalidate event authority after await"
          git push origin HEAD:agent/v14-capture-postawait-event-authority-sol
