name: ES80 Experiment One recoverable rediscovery patch

on:
  push:
    branches:
      - integration/es80-v14-experiment-one-recoverable-rediscovery/chatgpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/es80-v14-experiment-one-recoverable-rediscovery/chatgpt56-go

      - name: Apply exact guarded product patch
        run: python3 scripts/ci/es80_experiment_one_recoverable_rediscovery_patch.py

      - name: Validate and self-clean staging tooling
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'let preview = admission.stagingPreview()' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -F 'let payload = try admission.consume()' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -F 'payload.admissionIdentity == preview.admissionIdentity' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -F 'recorder = payload.recorder' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          rm -f .github/workflows/es80_experiment_one_recoverable_rediscovery_patch.yml
          rm -f scripts/ci/es80_experiment_one_recoverable_rediscovery_patch.py
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift \
                  Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneRecoverableRediscoveryTests.swift \
                  .github/workflows/es80_experiment_one_recoverable_rediscovery_patch.yml \
                  scripts/ci/es80_experiment_one_recoverable_rediscovery_patch.py
          git commit -m '[Capture Experiment One] preserve admission across recoverable rediscovery'
          git push origin HEAD:integration/es80-v14-experiment-one-recoverable-rediscovery/chatgpt56-go
