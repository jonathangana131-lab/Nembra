name: Temporary V14 Permanent Signed ACL macOS Gate

on:
  push:
    branches:
      - repair/v14-capture-signed-helper-replace-blind-c7e19a
    paths:
      - .github/workflows/tmp-v14-signed-acl-permanent-macos-c7e19a.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-capture-signed-helper-replace-blind-c7e19a
          fetch-depth: 0

      - name: Promote real macOS ACL proof into permanent exact-head gate
        shell: bash
        run: |
          set -euo pipefail
          trigger="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/capture-signed-app-install-custody.yml')
          source = path.read_text(encoding='utf-8')
          anchor = '''  accepted-runner-transport:\n'''
          job = '''  macos-acl-strip-custody:\n    name: Reject inherited ACL authority on real macOS\n    runs-on: macos-15\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n\n      - name: Bind ACL evidence to exact checked-out source\n        shell: bash\n        env:\n          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}\n        run: |\n          set -euo pipefail\n          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"\n          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"\n          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]\n          test "$actual" = "$expected"\n          test -z "$(git status --porcelain=v1 --untracked-files=all)"\n\n      - name: Prove protected ditto snapshot strips inherited ACLs\n        shell: bash\n        run: |\n          set -euo pipefail\n          fixture="$(mktemp -d)"\n          stage_root=""\n          cleanup() {\n            rm -rf -- "$fixture"\n            if [[ -n "$stage_root" ]]; then sudo /bin/rm -rf -- "$stage_root"; fi\n          }\n          trap cleanup EXIT\n\n          source_app="$fixture/Nembra Capture.app"\n          mkdir -p "$source_app"\n          printf 'accepted signed subject\\n' > "$source_app/subject.txt"\n          /bin/chmod +a "$(id -un) allow write,delete,add_file,add_subdirectory,file_inherit,directory_inherit" "$source_app"\n          /usr/bin/find "$source_app" -acl -print -quit | /usr/bin/grep -q .\n\n          sudo /bin/mkdir -p /private/tmp\n          stage_root="$(sudo /usr/bin/mktemp -d /private/tmp/nembra-authenticated-capture-install.XXXXXX)"\n          sudo /usr/bin/ditto --noacl "$source_app" "$stage_root/Nembra Capture.app"\n          staged_acl="$(sudo /usr/bin/find "$stage_root" -acl -print -quit)"\n          test -z "$staged_acl"\n          test -z "$(git status --porcelain=v1 --untracked-files=all)"\n\n  accepted-runner-transport:\n'''
          if '  macos-acl-strip-custody:\n' in source:
              raise SystemExit('permanent macOS ACL job already exists')
          if source.count(anchor) != 1:
              raise SystemExit(f'accepted-runner anchor expected exactly once, found {source.count(anchor)}')
          source = source.replace(anchor, job, 1)
          path.write_text(source, encoding='utf-8')
          PY

          grep -Fq 'macos-acl-strip-custody:' .github/workflows/capture-signed-app-install-custody.yml
          grep -Fq '/usr/bin/ditto --noacl "$source_app" "$stage_root/Nembra Capture.app"' .github/workflows/capture-signed-app-install-custody.yml
          grep -Fq '/usr/bin/find "$stage_root" -acl -print -quit' .github/workflows/capture-signed-app-install-custody.yml
          git diff --check
          rm .github/workflows/tmp-v14-signed-acl-permanent-macos-c7e19a.yml
          git config user.name 'nembra-capture-bot'
          git config user.email 'nembra-capture-bot@users.noreply.github.com'
          git add -A
          git commit -m 'test(capture): make signed-app ACL proof permanent on macOS'
          git fetch origin repair/v14-capture-signed-helper-replace-blind-c7e19a
          test "$(git rev-parse FETCH_HEAD)" = "$trigger"
          git push origin HEAD:repair/v14-capture-signed-helper-replace-blind-c7e19a
