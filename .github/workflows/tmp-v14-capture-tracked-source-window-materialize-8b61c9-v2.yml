          git rm .github/workflows/tmp-v14-capture-tracked-source-window-materialize-8b61c9.yml
          git rm .github/workflows/tmp-v14-capture-tracked-source-window-materialize-8b61c9-v2.yml
          git config user.name "nembra-swarm"
          git config user.email "nembra-swarm@users.noreply.github.com"
          git add Scripts/capture_tuya_private_input_build_guard.py scripts/field/install_one_time_capture.command scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          git commit -m "Bind accepted tracked source through field compiler window"
          git push origin HEAD:repair/v14-field-installer-ignore-independent-sol-8b61c9-20260811
