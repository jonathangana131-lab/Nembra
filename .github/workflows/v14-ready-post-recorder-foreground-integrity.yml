name: V14 Ready post-recorder foreground integrity

on:
  push:
    branches:
      - integration/es80-v14-terminal-controller-fresh-handoff/gpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Ready post-recorder foreground recheck
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift')
          s = p.read_text()
          old = '''                    case let .recorded(recordedReady):
                        do {
                            // This typed queue commit is intentionally the immediate
'''
          new = '''                    case let .recorded(recordedReady):
                        do {
                            try self.requireForegroundEvidenceIntegrity()
                            // This typed queue commit is intentionally the immediate
'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Ready recorded-return seam, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift').read_text()
          a = s.index('case let .recorded(recordedReady):')
          b = s.index('recordedReady.markBoundaryRecorded(', a)
          seam = s[a:b]
          assert 'try self.requireForegroundEvidenceIntegrity()' in seam
          assert 'await ' not in seam
          PY
      - name: Commit product and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/v14-ready-post-recorder-foreground-integrity.yml
          git add -A
          git diff --cached --check
          git config user.name nembra-v14-gpt56
          git config user.email actions@users.noreply.github.com
          git commit --amend --no-edit
          git push origin HEAD:integration/es80-v14-terminal-controller-fresh-handoff/gpt56-go
