name: Materialize Capture Session Key Redaction

on:
  push:
    branches:
      - sol/v14-capture-sessionkey-redaction-3f269-20260810

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-sessionkey-redaction-3f269-20260810
          fetch-depth: 0
      - name: Guard source scope
        run: |
          set -euo pipefail
          parent=3f26906d68c6d886fa5c19a3349f7c538e5392a6
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --quiet "$parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
      - name: Apply correction
        run: python3 scripts/ci/materialize_capture_sessionkey_redaction.py apply
      - name: Verify correction
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_sessionkey_redaction.py verify
          python3 -m py_compile scripts/ci/materialize_capture_sessionkey_redaction.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          git diff --check
      - name: Publish clean product checkpoint
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-sessionkey-redaction.yml
          rm scripts/ci/materialize_capture_sessionkey_redaction.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): redact session-key application updates'
          git push origin HEAD:sol/v14-capture-sessionkey-redaction-3f269-20260810
