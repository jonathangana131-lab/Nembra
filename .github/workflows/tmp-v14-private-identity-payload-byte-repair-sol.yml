name: TEMP V14 Private Identity Payload Byte Repair Sol

on:
  push:
    branches:
      - repair/v14-private-identity-payload-byte-custody-2858-sol
    paths:
      - .github/workflows/tmp-v14-private-identity-payload-byte-repair-sol.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-identity-payload-byte-custody-2858-sol
          fetch-depth: 0
      - name: Materialize and validate repair
        run: python3 .swarm-tmp/v14-private-identity-payload-byte-repair-sol.py
      - name: Publish product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/provision_capture_tuya_identity_writer.py
          git add Scripts/provision_capture_tuya_identity.sh
          git add scripts/ci/tests/test_capture_private_identity_publication_races.py
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 4
          git commit -m 'Capture: bind published private identity payload bytes'
          git push origin HEAD:repair/v14-private-identity-payload-byte-custody-2858-sol
