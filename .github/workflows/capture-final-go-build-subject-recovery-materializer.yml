name: Capture Final GO Build Subject Recovery Materializer

on:
  push:
    branches:
      - repair/v14-auth-final-go-cocoapods-build-subject-r2-sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compose and validate recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/_compose_final_go_build_subject_recovery.py
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact_device_custody.py
          git diff --check
      - name: Publish clean production recovery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/capture-final-go-build-subject-recovery-materializer.yml scripts/ci/_compose_final_go_build_subject_recovery.py
          git config user.name 'nembra-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): compose reviewed CocoaPods subject into current Final GO'
          git push origin HEAD:repair/v14-auth-final-go-cocoapods-build-subject-r2-sol
