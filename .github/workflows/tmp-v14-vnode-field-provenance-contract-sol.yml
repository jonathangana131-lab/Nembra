name: TEMP V14 Vnode Field Provenance Contract Repair (Sol)

on:
  push:
    branches:
      - repair/v14-capture-vnode-field-provenance-contract-sol-20260811
    paths:
      - .github/workflows/tmp-v14-vnode-field-provenance-contract-sol.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-vnode-field-provenance-contract-sol-20260811
          fetch-depth: 0
      - name: Apply exact provenance contract repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/capture-field-build-provenance.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          grep -Fq '"$PROVENANCE_HELPER" snapshot' "$bootstrap"'''
          new = '''          grep -Fq 'run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" snapshot' "$bootstrap"'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale direct provenance-helper assertion; found {text.count(old)}')
          text = text.replace(old, new, 1)
          if old in text:
              raise SystemExit('stale direct provenance-helper assertion remains')
          required_guard = '''guard_line="$(grep -nF 'run_accepted_source_python "$TUYA_BUILD_WINDOW_GUARD_RELATIVE" \\' "$installer" | sed -n '1s/:.*//p')"'''
          if required_guard not in text:
              raise SystemExit('accepted-source build-window guard ordering assertion is missing')
          path.write_text(text, encoding='utf-8')
          PY
          grep -Fq 'run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" snapshot' .github/workflows/capture-field-build-provenance.yml
          grep -Fq 'run_accepted_source_python "$TUYA_BUILD_WINDOW_GUARD_RELATIVE" \' .github/workflows/capture-field-build-provenance.yml
          if grep -Fq '"$PROVENANCE_HELPER" snapshot' .github/workflows/capture-field-build-provenance.yml; then
            echo 'stale direct provenance-helper assertion remains' >&2
            exit 1
          fi
          git diff --check
      - name: Publish clean one-file candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-v14-vnode-field-provenance-contract-sol.yml
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Capture: align vnode field provenance helper custody contract'
          git push origin HEAD:repair/v14-capture-vnode-field-provenance-contract-sol-20260811