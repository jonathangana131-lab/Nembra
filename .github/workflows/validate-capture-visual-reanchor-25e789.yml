name: Validate parked Capture visual reanchor 25e789

on:
  push:
    branches:
      - qa/v14-capture-visual-25e789

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product parent and QA-only scope
        shell: bash
        run: |
          set -euo pipefail
          base='25e789ea04c523b6d7e2507013b6c415006642d4'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/capture-standalone-visual-evidence.yml' \
            '.github/workflows/validate-capture-visual-reanchor-25e789.yml' \
            'scripts/ci/capture_standalone_visual_evidence.sh' \
            'scripts/ci/tests/test_capture_standalone_visual_evidence.py' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Validate current visual truth contract without Simulator
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py
          grep -Fq 'static let requiredFieldProcedureIdentifier = "ES80-AUTHENTICATED-STATIONARY-v1"' NembraApp/App/NembraCaptureBuildIdentity.swift
          grep -Fq 'procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier' NembraApp/App/NembraCaptureEntrypoint.swift
          test "$(grep -Fc 'INFOPLIST_KEY_NembraCaptureProcedureIdentifier = "$(NEMBRA_CAPTURE_PROCEDURE_IDENTIFIER)";' NembraCapture.xcodeproj/project.pbxproj)" = 2
          git diff --check

      - name: Collapse validation scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-capture-visual-reanchor-25e789.yml
          git add .github/workflows/validate-capture-visual-reanchor-25e789.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci(capture): collapse visual reanchor validation scaffold'
          git push origin HEAD:qa/v14-capture-visual-25e789
