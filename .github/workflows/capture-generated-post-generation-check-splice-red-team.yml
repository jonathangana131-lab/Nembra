name: Capture Generated Post Generation Check Splice Red Team

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_generated_post_generation_check_splice_red_team.py
      - .github/workflows/capture-generated-post-generation-check-splice-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-generated-post-generation-check-splice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: 010e7db4a22523885aa0775c30cd2ad071fedba3
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  exploit-positive:
    name: Expose post-generation-check splice (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact generation-stamped product and validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-generated-post-generation-check-splice-red-team.yml \
            scripts/ci/tests/test_capture_generated_post_generation_check_splice_red_team.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exploit oracle without bytecode artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/tests/test_capture_generated_post_generation_check_splice_red_team.py')
          compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
          PY

      - name: Require exploit-positive post-generation-check splice
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_post_generation_check_splice_red_team.py

      - name: Preserve validation-only truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'NEMBRA_GENERATED_POST_GENERATION_CHECK_SPLICE exploitPositive=true productionBytesChanged=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false'
