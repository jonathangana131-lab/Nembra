name: Materialize Final GO Control Worktree Custody

on:
  push:
    branches:
      - repair/v14-final-go-control-worktree-custody-r2-sol
    paths:
      - scripts/ci/_materialize_final_go_control_worktree_custody.py
      - .github/workflows/_materialize-final-go-control-worktree-custody.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-final-go-control-worktree-custody-r2-sol
      - name: Materialize production source
        run: |
          set -euo pipefail
          python3 scripts/ci/_materialize_final_go_control_worktree_custody.py
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py
      - name: Remove temporary materializer
        run: |
          rm scripts/ci/_materialize_final_go_control_worktree_custody.py
          rm .github/workflows/_materialize-final-go-control-worktree-custody.yml
      - name: Commit production repair
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-materializer'
          git config user.email 'nembra-go-materializer@users.noreply.github.com'
          git add -A
          git commit -m 'fix(final-go): bind control authority worktree bytes'
          git push origin HEAD:repair/v14-final-go-control-worktree-custody-r2-sol
