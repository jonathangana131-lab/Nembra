name: TEMP ES80 rider status finalize

on:
  push:
    branches:
      - fix/es80-v14-rider-language/gpt56-thinking-go

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Finalize status and VoiceOver language
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'case .acquiring: return "Finite acquisition"': 'case .acquiring: return "Passive discovery"',
              'case .readyToSeal: return "Horizon ready"': 'case .readyToSeal: return "Ready to seal"',
              '"Experiment One progress, capture sealed and ready for analysis"': '"Capture progress, sealed and ready for analysis"',
              '"Experiment One progress, capture sealed; final artifact integrity not yet verified"': '"Capture progress, sealed; final file integrity not yet verified"',
              '"Experiment One progress, observation Horizon ready to seal"': '"Capture progress, observation ready to seal"',
              '"Experiment One progress, four correlation windows complete and passive observation ready"': '"Capture progress, four OFF / ON checks complete and passive observation ready"',
              '"Experiment One progress, \\(min(completedWindows, 4)) of 4 correlation windows complete"': '"Capture progress, \\(min(completedWindows, 4)) of 4 OFF / ON checks complete"',
              'return "The package-owned physical execution gate is closed for this build."': 'return "This build is still locked for scooter capture."',
              'return "Foreground integrity was lost after Experiment One began. Start a fresh experiment."': 'return "Nembra left the foreground after capture began. Start a fresh capture."',
              'return "The correlated-target admission is already prepared. Continue the current rediscovery."': 'return "The scooter signal is already confirmed. Continue the fresh scan."',
              'return "No sealed correlated-target admission is ready for this step."': 'return "Confirm the repeated scooter signal before continuing."',
              'return "The four-window evidence authority or ordering is invalid."': 'return "The four OFF / ON checks are invalid or out of order. Start again from OFF 1."',
              'return "The exact correlated target has not reappeared in the fresh post-admission scan yet. Keep scanning and retry."': 'return "The confirmed scooter signal has not reappeared in the fresh scan yet. Keep scanning and retry."',
              'return "The exact correlated target is visible but CoreBluetooth reports it as non-connectable."': 'return "The confirmed scooter signal is visible but cannot be opened for passive observation."',
              'return "The package-owned passive capture controller is unavailable."': 'return "Bluetooth capture is unavailable for this capture session."',
              'return "The accepted Ready epoch and minimum monotonic observation interval are not complete yet."': 'return "Passive discovery and the required observation period are not complete yet."',
              'return "This Experiment One artifact is already immutable."': 'return "This capture is already sealed."',
              'return "The package-owned Bluetooth controller has not been instantiated for this build."': 'return "Bluetooth capture is not ready for this build."',
              'return "The producer\'s monotonic receipt window has not reached the required minimum yet."': 'return "The required observation period is not complete yet."',
              'return "The producer could not establish a monotonic observation window."': 'return "Nembra could not establish a valid observation window."',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          text = Path("NembraApp/Features/Research/ES80CaptureShellView.swift").read_text(encoding="utf-8")
          start = text.index("    private var passiveSafetyPanel")
          details = text.index("    private var captureDetailsSheet", start)
          phase = text.index("    private func phase(", details)
          rider = text[start:details]
          runtime = text[phase:]
          forbidden = [
              "fresh fresh", "package Nembra", "Finite acquisition", "immutable Horizon",
              "package-owned observation series", "same authority life", "final authority",
              "package-owned CoreBluetooth controller", "package-owned Experiment One workflow",
              "package-issued observation authority", "consumed authority", "foreground-invalidated evidence life",
              'healthItem("FINITE"', 'healthItem("HORIZON"', "Experiment One progress",
              'case .readyToSeal: return "Horizon ready"',
          ]
          remaining = [p for p in forbidden if p in rider or p in runtime]
          if remaining:
              raise SystemExit(f"rider copy quality regressions remain: {remaining}")
          for required in ("Scooter OFF", "Scooter ON", "PASSIVE / READ ONLY", "Share Capture", "View Details"):
              if required not in rider:
                  raise SystemExit(f"required rider copy disappeared: {required}")
          details_text = text[details:phase]
          for required in ("Truth boundary", "CoreBluetooth", "Software Export SHA-256", "Runtime executable SHA-256"):
              if required not in details_text:
                  raise SystemExit(f"engineering details truth disappeared: {required}")
          for invariant in (
              "guard status.physicalProcedurePermitted else",
              "PassiveBluetoothExperimentOneFinalShareIntegrity.inspect(artifact.json)",
              "es80.capture.finish",
              "es80.capture.share",
              "physicalProcedurePermitted: false",
          ):
              if invariant not in text:
                  raise SystemExit(f"truth/action invariant disappeared: {invariant}")
          PY

          git diff --check
          rm -f .github/workflows/tmp-es80-rider-copy-quality.yml
          rm -f .github/workflows/tmp-es80-rider-copy-finalize.yml
          rm -f .github/workflows/tmp-es80-rider-status-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[Capture product v14] Refine rider status and accessibility language"
          git push origin HEAD:${{ github.ref_name }}
