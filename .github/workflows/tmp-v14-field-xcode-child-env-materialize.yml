name: TMP V14 Field Xcode Child Environment

on:
  push:
    branches:
      - repair/v14-field-xcode-child-env-sol-20260811
    paths:
      - .github/workflows/tmp-v14-field-xcode-child-env-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-field-xcode-child-env-sol-20260811
          fetch-depth: 0

      - name: Bind exact construction head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize closed compiler child environment
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('Scripts/capture_tuya_private_input_build_guard.py')
          source = path.read_text(encoding='utf-8')

          old_import = 'import os\nimport resource\n'
          new_import = 'import os\nimport pwd\nimport resource\n'
          if source.count(old_import) != 1:
              raise SystemExit(f'import seam count={source.count(old_import)}')
          source = source.replace(old_import, new_import, 1)

          marker = 'def run_guarded_build(\n'
          helper = '''def _closed_xcode_environment() -> dict[str, str]:\n    """Return the complete caller-independent environment admitted to xcodebuild.\n\n    Build settings and toolchain selectors are passed explicitly in the command\n    or selected by the separately reviewed system Xcode boundary. The compiler\n    child therefore receives no ambient caller environment. HOME/identity come\n    from the effective account database so automatic Apple signing can retain\n    its normal user credential/profile lookup without trusting caller variables.\n    """\n    try:\n        account = pwd.getpwuid(os.geteuid())\n    except (KeyError, OSError) as exc:\n        raise BuildGuardError("could not resolve effective account for closed xcodebuild environment") from exc\n\n    home = account.pw_dir\n    if (\n        not account.pw_name\n        or not home\n        or not os.path.isabs(home)\n        or "\\x00" in account.pw_name\n        or "\\x00" in home\n    ):\n        raise BuildGuardError("effective account is not usable for closed xcodebuild environment")\n\n    return {\n        "PATH": "/usr/bin:/bin:/usr/sbin:/sbin",\n        "HOME": home,\n        "USER": account.pw_name,\n        "LOGNAME": account.pw_name,\n        "LANG": "en_US.UTF-8",\n    }\n\n\n'''
          if source.count(marker) != 1:
              raise SystemExit(f'run_guarded_build seam count={source.count(marker)}')
          source = source.replace(marker, helper + marker, 1)

          old_spawn = '        process = popen_factory(list(command))\n'
          new_spawn = '        process = popen_factory(list(command), env=_closed_xcode_environment())\n'
          if source.count(old_spawn) != 1:
              raise SystemExit(f'compiler spawn seam count={source.count(old_spawn)}')
          source = source.replace(old_spawn, new_spawn, 1)
          path.write_text(source, encoding='utf-8')
          PY

          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_xcode_environment_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_xcode_environment_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_developer_dir_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_window_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Publish tested production guard
        shell: bash
        env:
          BRANCH: repair/v14-field-xcode-child-env-sol-20260811
        run: |
          set -euo pipefail
          git add Scripts/capture_tuya_private_input_build_guard.py
          git diff --cached --check
          git config user.name "Nembra V14 Swarm"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): close xcodebuild child environment"
          git push origin "HEAD:$BRANCH"
