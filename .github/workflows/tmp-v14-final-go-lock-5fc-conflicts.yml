name: TEMP V14 Final-GO Lock 5fc Conflict Inspector
on:
  push:
    branches: [recovery/v14-final-go-reviewed-lock-current-5fc-sol]
permissions:
  contents: write
jobs:
  inspect:
    if: github.repository == 'jonathangana131-lab/Nembra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-final-go-reviewed-lock-current-5fc-sol
          fetch-depth: 0
      - name: Verify exact current parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5fc7eb8f0eb08ae309e021ed4c8c3c62d543300c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tmp-v14-final-go-lock-5fc-conflicts.yml"
      - name: Capture three-way merge subjects
        run: |
          set -euo pipefail
          BASE=da86226ba36bb2d4f441cc3cb876244af17853cb
          OURS=5fc7eb8f0eb08ae309e021ed4c8c3c62d543300c
          THEIRS=d8416aeba19b826cfb50bde9e0b3e2778766a286
          mkdir -p recovery-debug-5fc
          paths=(scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py)
          for path in "${paths[@]}"; do
            name="$(basename "$path")"
            git show "$OURS:$path" >/tmp/ours
            git show "$BASE:$path" >/tmp/base
            git show "$THEIRS:$path" >/tmp/theirs
            git merge-file -p -L current-5fc -L common-da862 -L reviewed-lock-d841 /tmp/ours /tmp/base /tmp/theirs >"recovery-debug-5fc/$name" || true
          done
          grep -R -n '^<<<<<<<\|^=======\|^>>>>>>>' recovery-debug-5fc > recovery-debug-5fc/conflict-index.txt || true
      - name: Publish disposable evidence and self-delete
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-v14-final-go-lock-5fc-conflicts.yml
          git config user.name jonathangana131-lab
          git config user.email jonathangana131@gmail.com
          git add recovery-debug-5fc .github/workflows/tmp-v14-final-go-lock-5fc-conflicts.yml
          git commit -m "debug(capture): retain current reviewed-lock merge evidence"
          git push origin HEAD:recovery/v14-final-go-reviewed-lock-current-5fc-sol
