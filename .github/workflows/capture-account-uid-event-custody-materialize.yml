name: Materialize Capture Account UID Event Custody

on:
  push:
    branches:
      - fix/v14-capture-current-truth-two-red-870-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-current-truth-two-red-870-sol
          fetch-depth: 0

      - name: Guard exact clean foreground predecessor
        shell: bash
        run: |
          set -euo pipefail
          predecessor='a84d278cf92e1814fdb2a39270878dbb8ffc481a'
          git merge-base --is-ancestor "$predecessor" HEAD
          git diff --quiet "$predecessor" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift

      - name: Apply account-UID event custody
        run: python3 scripts/ci/materialize_capture_account_uid_event_custody.py apply

      - name: Verify bounded custody repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_account_uid_event_custody.py verify
          python3 -m py_compile scripts/ci/materialize_capture_account_uid_event_custody.py
          git diff --check

      - name: Publish clean current truth candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-account-uid-event-custody-materialize.yml
          rm scripts/ci/materialize_capture_account_uid_event_custody.py
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-account-uid-event-custody-materialize.yml' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift' \
            'scripts/ci/materialize_capture_account_uid_event_custody.py' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): redact verified account UID from events'
          git push origin HEAD:fix/v14-capture-current-truth-two-red-870-sol
