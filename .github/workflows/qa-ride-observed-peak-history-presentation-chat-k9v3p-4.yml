name: Ride observed-peak history presentation exact-product QA v4

on:
  push:
    branches:
      - cell/ride-observed-peak-history-presentation/ci/chat-k9v3p-4

permissions:
  contents: read

jobs:
  observed-peak-history-presentation-qa:
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Checkout validation mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify exact product parent and workflow-only delta
        env:
          EXPECTED_PRODUCT_SHA: dc855a006aed7d7c2d9e70881bb9bea3657ea6dd
          EXPECTED_WORKFLOW_PATH: .github/workflows/qa-ride-observed-peak-history-presentation-chat-k9v3p-4.yml
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          printf 'Expected product parent: %s\nActual product parent:   %s\n' "$EXPECTED_PRODUCT_SHA" "$actual_parent"
          test "$actual_parent" = "$EXPECTED_PRODUCT_SHA"

          changed="$(git diff --name-only HEAD^ HEAD)"
          printf 'Validation-only delta:\n%s\n' "$changed"
          test "$changed" = "$EXPECTED_WORKFLOW_PATH"

      - name: Report Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Run NembraCore tests with warnings as errors
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors
