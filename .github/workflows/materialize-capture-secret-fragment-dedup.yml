name: Materialize Capture Secret Fragment Dedup

on:
  push:
    branches:
      - fix/v14-capture-secret-fragment-dedup-870-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-secret-fragment-dedup-870-sol
          fetch-depth: 0

      - name: Verify exact anchored helper scope
        shell: bash
        run: |
          set -euo pipefail
          base='870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81'
          test "$(git rev-parse HEAD^)" = "$base"
          changed="$(git diff --name-only "$base"...HEAD)"
          test "$changed" = '.github/workflows/materialize-capture-secret-fragment-dedup.yml'

      - name: Remove duplicate classifier entry and strengthen regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift')

          source = source_path.read_text(encoding='utf-8')
          duplicate = '''        "refreshtoken",
                  "sessionkey",
                  "authkey",'''
          replacement = '''        "refreshtoken",
                  "authkey",'''
          if source.count(duplicate) != 1:
              raise SystemExit(f'expected exactly one merge-created duplicate sequence, found {source.count(duplicate)}')
          source = source.replace(duplicate, replacement, 1)
          source_path.write_text(source, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          needle = '''            #expect(driver.contains("\\"\\(fragment)\\""), "Application sanitizer must redact export-promised credential key: \\(fragment)")'''
          strengthened = needle + '''
                      #expect(
                          driver.components(separatedBy: "\\"\\(fragment)\\"").count == 2,
                          "Application sanitizer credential fragments must be unique: \\(fragment)"
                      )'''
          if test.count(needle) != 1:
              raise SystemExit(f'expected exactly one fragment assertion to strengthen, found {test.count(needle)}')
          test = test.replace(needle, strengthened, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = source.index('    private static let secretKeyFragments = [')
          end = source.index('    private static func redactApplicationSecrets', start)
          classifier = source[start:end]
          expected = [
              'localkey', 'sessionkey', 'appkey', 'appsecret', 'password',
              'accounttoken', 'accesstoken', 'refreshtoken', 'authkey', 'seckey'
          ]
          for fragment in expected:
              count = classifier.count(f'"{fragment}"')
              if count != 1:
                  raise SystemExit(f'{fragment} must appear exactly once in classifier, found {count}')
          PY

          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift
          git diff --check

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-secret-fragment-dedup.yml
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateExportSecretPromiseSourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Capture: deduplicate export-secret classifier'
          git push origin HEAD:fix/v14-capture-secret-fragment-dedup-870-sol
