name: Materialize current Capture whole-record provenance fence

on:
  push:
    branches:
      - sol/v14-capture-record-coherence-88eb

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Verify exact product ancestry and construction scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 88eb3d1e2876c01beb1d5298c5c28388c0bc7c3c HEAD
          test "$(git diff --name-only 88eb3d1e2876c01beb1d5298c5c28388c0bc7c3c..HEAD | sort)" = "$(printf '%s\n' \
            '.github/workflows/materialize-capture-record-coherence-88eb.yml' \
            'scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py' \
            'tools/materialize_capture_record_coherence_88eb.py' | sort)"

      - name: Apply whole-record identity generation fence
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_capture_record_coherence_88eb.py

      - name: Validate component and record-level provenance chronology
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python - <<'PY'
          from pathlib import Path
          source = Path('Scripts/capture_tuya_private_input_provenance.py').read_text()
          start = source.index('def build_record(')
          end = source.index('\ndef _record_text', start)
          build = source[start:end]
          required = [
              '_stat_identity(current_path) != _stat_identity(after)',
              'def _record_file_identity_snapshot(',
              'def _record_tree_identity_snapshot(',
              'def _record_identity_snapshot(',
              '_assert_internal_symlink(path, root_resolved)',
              'record_identity_before = _record_identity_snapshot',
              'record_identity_after = _record_identity_snapshot',
              'private Tuya build inputs changed while the complete provenance record was constructed',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'missing whole-record provenance invariants: {missing}')
          if '    return {' in build:
              raise SystemExit('build_record still returns sequential component digests without a whole-record fence')
          for unsupported in [
              'private build tree contains an unsupported directory entry',
              'private build tree contains an unsupported file entry',
          ]:
              if unsupported not in source:
                  raise SystemExit(f'record witness lost tree type parity: {unsupported}')
          PY
          test "$(git diff --name-only)" = "Scripts/capture_tuya_private_input_provenance.py"
          git diff --check

      - name: Publish clean two-path repair and retire construction helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-record-coherence-88eb.yml
          rm tools/materialize_capture_record_coherence_88eb.py
          git config user.name "nembra-sol-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            '.github/workflows/materialize-capture-record-coherence-88eb.yml' \
            'Scripts/capture_tuya_private_input_provenance.py' \
            'tools/materialize_capture_record_coherence_88eb.py' | sort)"
          git commit -m "fix(capture): fence private provenance as one record generation"
          git push origin HEAD:sol/v14-capture-record-coherence-88eb
