name: Materialize Capture Signed App Install Custody Repair

on:
  push:
    branches:
      - repair/v14-capture-signed-app-install-custody-gpt56-sol
    paths:
      - scripts/ci/materialize_capture_signed_app_install_custody.py
      - .github/workflows/materialize-capture-signed-app-install-custody.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-signed-app-install-custody-gpt56-sol
          fetch-depth: 0

      - name: Materialize exact installer delta
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/materialize_capture_signed_app_install_custody.py

      - name: Validate materialized repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          /usr/bin/python3 -m py_compile scripts/ci/capture_signed_app_install_custody.py scripts/ci/tests/test_capture_signed_app_install_custody.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_signed_app_install_custody.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          test ! -e .github/workflows/materialize-capture-signed-app-install-custody.yml
          test ! -e scripts/ci/materialize_capture_signed_app_install_custody.py

      - name: Commit durable product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nembra Capture Sol"
          git config user.email "nembra-capture-sol@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): protect exact signed app install subject"
          git push origin HEAD:repair/v14-capture-signed-app-install-custody-gpt56-sol
