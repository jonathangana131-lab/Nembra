name: Diagnose Capture package f0

on:
  push:
    branches:
      - diagnostic/v14-capture-package-f0-sol

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f0fb83da5f57f9e92d29cf6ab444dc856e74c3a4
      - name: Run Capture package and surface exact failures
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/nembra-capture-package.log"
          set +e
          swift test --package-path Packages/NembraBluetoothCapture >"$log" 2>&1
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo 'Capture package is green at exact f0.'
            exit 0
          fi
          python3 - "$log" "$status" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          status = int(sys.argv[2])
          lines = path.read_text(errors='replace').splitlines()

          patterns = [
              r'\berror:',
              r'Expectation failed',
              r'Issue recorded',
              r'^✘ ',
              r'^Test Case .* failed',
              r'^Test Suite .* failed',
          ]
          selected = []
          for idx, line in enumerate(lines):
              if any(re.search(p, line) for p in patterns):
                  start = max(0, idx - 3)
                  end = min(len(lines), idx + 5)
                  selected.append(' | '.join(x.strip() for x in lines[start:end] if x.strip()))

          # Always include the terminal summary separately so an interleaved Swift
          # Testing failure cannot be hidden behind high-volume start messages.
          tail = ' | '.join(x.strip() for x in lines[-120:] if x.strip())
          if tail:
              selected.append('TERMINAL OUTPUT: ' + tail)

          seen = set()
          emitted = 0
          for item in selected:
              if not item or item in seen:
                  continue
              seen.add(item)
              safe = item.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Capture package exact failure::{safe[:5000]}')
              emitted += 1
              if emitted >= 20:
                  break
          if emitted == 0:
              print('::error title=Capture package exact failure::swift test exited nonzero without a recognized failure marker')
          raise SystemExit(status)
          PY
