name: Materialize Capture Event Custody Convergence d56a

on:
  push:
    branches:
      - agent/v14-capture-event-custody-convergence-d56a-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-event-custody-convergence-d56a-sol
          fetch-depth: 0

      - name: Guard exact d56a product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='d56a30c699fbdecec6130537d3f3f4f4232f5c47'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Apply event custody convergence
        run: python3 scripts/ci/materialize_capture_event_custody_convergence_d56a.py apply

      - name: Verify exact-current truth contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_event_custody_convergence_d56a.py verify
          python3 -m py_compile scripts/ci/materialize_capture_event_custody_convergence_d56a.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyAdmissionRaceSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift
          git diff --check

      - name: Record Apple-only package gate boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '@preconcurrency import CoreBluetooth' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/CoreBluetoothCaptureMapping.swift
          echo 'CoreBluetooth package execution is delegated to the trusted xcode-27 exact-head runner.'

      - name: Publish clean seven-path product delta
        shell: bash
        run: |
          set -euo pipefail
          parent='d56a30c699fbdecec6130537d3f3f4f4232f5c47'
          rm .github/workflows/capture-event-custody-convergence-d56a-materialize.yml
          rm scripts/ci/materialize_capture_event_custody_convergence_d56a.py
          git add -A
          changed="$(git diff --cached "$parent" --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyAdmissionRaceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$parent" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): close authenticated application event custody gaps'
          git push origin HEAD:agent/v14-capture-event-custody-convergence-d56a-sol
