name: V14 Capture Correlation Compose

on:
  push:
    branches:
      - integration/v14-capture-guided-truth-custody-current-sol

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-guided-truth-custody-current-sol
          fetch-depth: 0

      - name: Bind exact composed parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "101976ce79f92af15fc06ca7be056a1435b287aa"

      - name: Apply guarded correlation presentation repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()
          old = 'Text("\\(min(test.correlationCompletedWindowCount + 1, 4))/4")'
          new = 'Text("\\(correlationDisplayedWindowOrdinal)/4")'
          if source.count(old) != 1:
              raise SystemExit(f'expected one stale correlation ordinal, found {source.count(old)}')
          source = source.replace(old, new, 1)
          marker = '    private var correlationPanel: some View {\n'
          if source.count(marker) != 1:
              raise SystemExit('correlationPanel marker not unique')
          helper = '    private var correlationDisplayedWindowOrdinal: Int {\n        test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)\n    }\n\n'
          source = source.replace(marker, helper + marker, 1)
          path.write_text(source)
          PY
          git show 8454064b6e6ef0d4078fb257299c0f037509e818:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift

      - name: Verify composed truth contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          entry = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          identity = Path('NembraApp/App/NembraCaptureBuildIdentity.swift').read_text()
          installer = Path('scripts/field/install_one_time_capture.command').read_text()
          assert 'Text("\\(correlationDisplayedWindowOrdinal)/4")' in entry
          assert 'test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)' in entry
          assert 'Text("\\(min(test.correlationCompletedWindowCount + 1, 4))/4")' not in entry
          assert 'schemaVersion: 10' in entry
          assert 'CAPTURE COMPLETE' in entry
          assert 'procedureIdentifier == Self.fieldProcedureIdentifier' in identity
          assert 'INFOPLIST_KEY_NembraCaptureProcedureIdentifier=$PROCEDURE_ID' in installer
          PY
          git diff --check

      - name: Commit composed truth and remove materializer
        run: |
          set -euo pipefail
          rm -f .github/workflows/v14-capture-correlation-compose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift \
            .github/workflows/v14-capture-correlation-compose.yml
          git diff --cached --check
          git commit -m 'fix(capture): compose truthful completed correlation progress'
          git push origin HEAD:integration/v14-capture-guided-truth-custody-current-sol
