name: Capture Tracked Namespace Coherence Materializer Once

on:
  push:
    branches:
      - repair/v17-capture-generated-private-selector-fd-custody-sol-20260814
    paths:
      - .github/workflows/capture-tracked-namespace-coherence-materialize-once.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Bind exact clean repair head
        shell: bash
        run: |
          set -euo pipefail
          parent=694adcba037bb9293b14125cee34a13533b3bf5e
          test "$(git rev-parse HEAD^)" = "$parent"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-tracked-namespace-coherence-materialize-once.yml"

      - name: Add tracked namespace coherence without changing evidence semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path

          helper = Path('scripts/ci/capture_accepted_build_input_snapshot.py')
          text = helper.read_text(encoding='utf-8')
          anchor = '''def _git_environment() -> dict[str, str]:\n'''
          addition = '''def _assert_tracked_namespace_coherence(paths: Iterable[Path]) -> None:\n    """Reject tracked paths whose prefixes collapse in the field macOS namespace."""\n\n    seen: dict[tuple[str, ...], tuple[str, ...]] = {}\n    for relative in sorted(paths, key=lambda value: value.as_posix()):\n        _safe_relative(relative)\n        raw_parts = relative.parts\n        key_parts = _namespace_key(relative)\n        for length in range(1, len(raw_parts) + 1):\n            raw_prefix = raw_parts[:length]\n            key_prefix = key_parts[:length]\n            previous = seen.get(key_prefix)\n            if previous is not None and previous != raw_prefix:\n                raise AcceptedBuildInputSnapshotError(\n                    "accepted tracked source has namespace-equivalent paths: "\n                    f"{'/'.join(previous)} vs {'/'.join(raw_prefix)}"\n                )\n            seen[key_prefix] = raw_prefix\n\n\n'''
          if text.count(anchor) != 1 or '_assert_tracked_namespace_coherence' in text:
              raise SystemExit('tracked namespace helper anchor mismatch')
          text = text.replace(anchor, addition + anchor)
          return_anchor = '''        entries.append((mode, kind, oid, relative))\n    return tuple(entries)\n'''
          replacement = '''        entries.append((mode, kind, oid, relative))\n    _assert_tracked_namespace_coherence(relative for _mode, _kind, _oid, relative in entries)\n    return tuple(entries)\n'''
          if text.count(return_anchor) != 1:
              raise SystemExit('git tree return anchor mismatch')
          helper.write_text(text.replace(return_anchor, replacement), encoding='utf-8')

          tests = Path('scripts/ci/tests/test_capture_accepted_build_input_snapshot.py')
          text = tests.read_text(encoding='utf-8')
          marker = '''    def test_casefolded_tracked_ancestor_cannot_alias_generated_subject(self) -> None:\n'''
          regression = '''    def test_case_distinct_tracked_prefixes_fail_before_materialization(self) -> None:\n        with tempfile.TemporaryDirectory() as raw:\n            root = Path(raw) / "repo"\n            root.mkdir()\n            git(root, "init", "-q")\n            git(root, "config", "user.email", "capture@example.invalid")\n            git(root, "config", "user.name", "Capture Test")\n            (root / "Foo").mkdir()\n            (root / "foo").mkdir()\n            (root / "Foo/A.swift").write_text("UPPER\\n", encoding="utf-8")\n            (root / "foo/B.swift").write_text("lower\\n", encoding="utf-8")\n            git(root, "add", "Foo/A.swift", "foo/B.swift")\n            git(root, "commit", "-qm", "case-distinct tracked namespace")\n            source_sha = git(root, "rev-parse", "HEAD")\n\n            with self.assertRaises(snapshot.AcceptedBuildInputSnapshotError):\n                snapshot._git_tree_entries(root, source_sha)\n            destination = Path(raw) / "stage"\n            with self.assertRaises(snapshot.AcceptedBuildInputSnapshotError):\n                snapshot.materialize_tracked_source(root, source_sha, destination)\n            self.assertFalse(destination.exists())\n\n'''
          if text.count(marker) != 1 or 'test_case_distinct_tracked_prefixes_fail_before_materialization' in text:
              raise SystemExit('tracked namespace regression anchor mismatch')
          tests.write_text(text.replace(marker, regression + marker), encoding='utf-8')
          PY

          python3 -B -m py_compile \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          python3 -B scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check

      - name: Publish only permanent helper and regression
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-tracked-namespace-coherence-materialize-once.yml
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          git config user.name "nembra-capture-materializer"
          git config user.email "capture-materializer@users.noreply.github.com"
          git add -A
          staged="$(git diff --cached --name-only 694adcba037bb9293b14125cee34a13533b3bf5e | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-tracked-namespace-coherence-materialize-once.yml' \
            'scripts/ci/capture_accepted_build_input_snapshot.py' \
            'scripts/ci/tests/test_capture_accepted_build_input_snapshot.py' | LC_ALL=C sort)"
          test "$staged" = "$expected"
          git commit -m "Reject tracked namespace-equivalent source paths"
          git push origin HEAD:repair/v17-capture-generated-private-selector-fd-custody-sol-20260814
