name: Capture app authorization carrier recovery one-shot

on:
  push:
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - .github/workflows/capture-app-authorization-carrier-recovery-one-shot.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: xcode-27
    timeout-minutes: 35
    concurrency:
      group: capture-app-authorization-carrier-writer
      cancel-in-progress: false
    env:
      TARGET_BRANCH: product/capture-1-0-main-20260818
      EXPECTED_SOURCE_BLOB: 627c17949d15aaf26ca28c12abb9bb684ab0e731
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      SOURCE_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
      RECOVERY_WRITER: .github/workflows/capture-app-authorization-carrier-recovery-one-shot.yml
    steps:
      - name: Checkout exact carrier trigger head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact fail-closed carrier subject
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test -f "$SOURCE_WORKFLOW"
          test -f "$RECOVERY_WRITER"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute reviewed lifecycle materializer and signed-attempt correction
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/capture-app-authorization-close-one-shot.yml").read_text(encoding="utf-8")
          section = workflow.index("      - name: Materialize field authorization into real SecureLink lifecycle")
          run_marker = "        run: |\n"
          start = workflow.index(run_marker, section) + len(run_marker)
          end = workflow.index("\n      - name: Enforce truth-preserving source shape", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, "capture-app-authorization-carrier-recovery-materializer", "exec"), {"__name__": "__main__"})

          # Recover the already-reviewed #3783 correction after materializing the legacy donor.
          # Complete bundle metadata is provenance/transport eligibility only; the independently
          # signed live attempt owns OFF1 and the subsequent read-only lifecycle authority.
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text(encoding="utf-8")

          old_property = "    var fieldBuildIsAuthoritative: Bool { buildIdentity.isAuthoritativeFieldBuild }"
          new_property = "    var fieldBuildMetadataReady: Bool { buildIdentity.hasCompleteFieldBuildMetadata }"
          assert text.count(old_property) == 1
          text = text.replace(old_property, new_property)

          old_handoff = "        guard phase == .idle, buildIdentity.isAuthoritativeFieldBuild else { return }"
          new_handoff = "        guard phase == .idle, buildIdentity.hasCompleteFieldBuildMetadata else { return }"
          assert text.count(old_handoff) == 1
          text = text.replace(old_handoff, new_handoff)

          legacy_guard = '''        guard buildIdentity.isAuthoritativeFieldBuild else {
              failLocally(buildIdentity.blocker ?? "Exact field-build provenance is unavailable.", "field_build_identity_unavailable")
              return
          }
'''
          assert text.count(legacy_guard) == 2
          text = text.replace(legacy_guard, "")

          legacy_connection_guard = "              buildIdentity.isAuthoritativeFieldBuild,\n"
          assert text.count(legacy_connection_guard) == 1
          text = text.replace(legacy_connection_guard, "")

          assert text.count("test.fieldBuildIsAuthoritative") >= 1
          text = text.replace("test.fieldBuildIsAuthoritative", "test.fieldBuildMetadataReady")

          selected_gate = ".disabled(!authorityReady || test.membershipBusy)"
          assert text.count(selected_gate) == 1
          text = text.replace(selected_gate, ".disabled(test.membershipBusy)")

          helper_start_marker = "    private func freezeAcceptedArtifactForAuthorizationSeal() throws {"
          record_marker = "    private func recordObservedTransportLoss(token: TuyaReadOnlyConnectionToken) async {"
          watchdog_marker = "    private func startWatchdog(token: TuyaReadOnlyConnectionToken) {"
          helper_start = text.index(helper_start_marker)
          record_start = text.index(record_marker, helper_start)
          helper_block = text[helper_start:record_start]
          assert "ExactByteArtifactSeal(sealing:" in helper_block
          assert "verifiedCanonicalValue(" in helper_block
          text = text[:helper_start] + text[record_start:]
          watchdog_start = text.index(watchdog_marker)
          text = text[:watchdog_start] + helper_block + text[watchdog_start:]

          path.write_text(text, encoding="utf-8")

      - name: Enforce fail-closed lifecycle source shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'import NembraCaptureAppAuthorization' "$APP_SOURCE"
          grep -Fq 'private let fieldAuthorization = NembraCaptureFieldAuthorizationController()' "$APP_SOURCE"
          grep -Fq 'buildIdentity.hasCompleteFieldBuildMetadata' "$APP_SOURCE"
          test "$(grep -Fc 'buildIdentity.isAuthoritativeFieldBuild' "$APP_SOURCE")" = 0
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'publishDps(' "$APP_SOURCE")" = 0
          test "$(grep -Fc 'writeValue(' "$APP_SOURCE")" = 0
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py -v
          /usr/bin/python3 -I scripts/ci/tests/test_es80_capture_build_identity.py -v

      - name: Run focused authorization truth contracts
        shell: bash
        run: |
          set -euo pipefail
          cd Packages/NembraBluetoothCapture
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NembraCaptureAppAuthorizationRecovery" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish only the clean tested carrier successor
        shell: bash
        run: |
          set -euo pipefail
          rm "$SOURCE_WORKFLOW" "$RECOVERY_WRITER"
          git add -- "$APP_SOURCE" "$SOURCE_WORKFLOW" "$RECOVERY_WRITER"
          git diff --cached --check
          actual="$(git diff --cached --name-status | LC_ALL=C sort)"
          expected="$(printf 'D\t%s\nD\t%s\nM\t%s\n' "$RECOVERY_WRITER" "$SOURCE_WORKFLOW" "$APP_SOURCE" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(capture): wire signed-attempt field authorization into SecureLink'
          successor="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
          printf 'NEMBRA_CAPTURE_APP_AUTHORIZATION_RECOVERY materialized=%s trigger=%s physicalAuthorityCreated=false\n' "$successor" "$GITHUB_SHA"
