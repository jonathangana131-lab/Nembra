name: Temporary Capture Private Identity Provenance Live Repair

on:
  push:
    branches:
      - agent/v14-capture-private-identity-custody-live-sol
    paths:
      - .github/workflows/tmp-capture-private-identity-provenance-live.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-private-identity-custody-live-sol
          fetch-depth: 0

      - name: Validate and wire private identity custody
        shell: bash
        env:
          EXPECTED_PARENT: d65a4ea3ecd3ed607b8465102380d338f6e4fe42
          BRANCH: agent/v14-capture-private-identity-custody-live-sol
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" "$actual")" = '.github/workflows/tmp-capture-private-identity-provenance-live.yml'

          bash -n Scripts/provision_capture_tuya_identity.sh
          python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          python3 -I Scripts/provision_capture_tuya_identity_writer.py --self-test

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          output="$(printf 'dummy-app-key\ndummy-app-secret\n' | NEMBRA_TUYA_RUNTIME_DIR="$tmp/runtime" bash Scripts/provision_capture_tuya_identity.sh 2>&1)"
          test -f "$tmp/runtime/NembraTuyaPrivateConfig.podspec"
          test -f "$tmp/runtime/Sources/NembraTuyaPrivateConfig/NembraTuyaPrivateIdentity.swift"
          test "$(stat -c '%a' "$tmp/runtime/NembraTuyaPrivateConfig.podspec")" = 600
          test "$(stat -c '%a' "$tmp/runtime/Sources/NembraTuyaPrivateConfig/NembraTuyaPrivateIdentity.swift")" = 600
          ! grep -R -Fq 'dummy-app-secret' "$tmp/runtime"
          ! grep -Fq 'dummy-app-secret' <<< "$output"
          if printf 'second-key\nsecond-secret\n' | NEMBRA_TUYA_RUNTIME_DIR="$tmp/runtime" bash Scripts/provision_capture_tuya_identity.sh >/dev/null 2>&1; then
            echo 'ERROR: provisioner reused an existing runtime destination.' >&2
            exit 1
          fi
          mkdir "$tmp/outside"
          ln -s "$tmp/outside" "$tmp/runtime-link"
          if printf 'link-key\nlink-secret\n' | NEMBRA_TUYA_RUNTIME_DIR="$tmp/runtime-link" bash Scripts/provision_capture_tuya_identity.sh >/dev/null 2>&1; then
            echo 'ERROR: provisioner followed a runtime symlink.' >&2
            exit 1
          fi
          test -z "$(find "$tmp/outside" -mindepth 1 -print -quit)"
          rm -rf "$tmp"
          trap - EXIT

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/capture-field-build-provenance.yml')
          text = path.read_text()

          def insert_after_first(marker: str, addition: str) -> None:
              global text
              if addition.strip() in text:
                  return
              index = text.find(marker)
              if index < 0:
                  raise SystemExit(f'missing provenance marker: {marker!r}')
              end = index + len(marker)
              text = text[:end] + addition + text[end:]

          insert_after_first(
              '      - Scripts/provision_capture_tuya_identity.sh\n',
              '      - Scripts/provision_capture_tuya_identity_writer.py\n',
          )
          insert_after_first(
              '          bash -n Scripts/provision_capture_tuya_identity.sh\n',
              '          /usr/bin/python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py\n'
              '          /usr/bin/python3 -I Scripts/provision_capture_tuya_identity_writer.py --self-test\n',
          )
          insert_after_first(
              "          private_identity_provisioner='Scripts/provision_capture_tuya_identity.sh'\n",
              "          private_identity_writer='Scripts/provision_capture_tuya_identity_writer.py'\n",
          )
          insert_after_first(
              '          test -f "$private_identity_provisioner"\n',
              '          test -f "$private_identity_writer"\n',
          )
          insert_after_first(
              "          grep -Fq 'NEMBRA_TUYA_RUNTIME_DIR' \"$private_identity_provisioner\"\n",
              "          grep -Fq 'provision_capture_tuya_identity_writer.py' \"$private_identity_provisioner\"\n"
              "          grep -Fq 'O_NOFOLLOW' \"$private_identity_writer\"\n"
              "          grep -Fq 'O_DIRECTORY' \"$private_identity_writer\"\n"
              "          grep -Fq 'O_EXCL' \"$private_identity_writer\"\n"
              "          grep -Fq 'dir_fd=parent_fd' \"$private_identity_writer\"\n",
          )
          path.write_text(text)
          PY

          grep -Fq -- '- Scripts/provision_capture_tuya_identity_writer.py' .github/workflows/capture-field-build-provenance.yml
          grep -Fq '/usr/bin/python3 -I Scripts/provision_capture_tuya_identity_writer.py --self-test' .github/workflows/capture-field-build-provenance.yml
          grep -Fq "private_identity_writer='Scripts/provision_capture_tuya_identity_writer.py'" .github/workflows/capture-field-build-provenance.yml
          grep -Fq 'O_NOFOLLOW' .github/workflows/capture-field-build-provenance.yml

          git config user.name 'nembra-v14-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/capture-field-build-provenance.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/capture-field-build-provenance.yml'
          git commit -m 'ci(capture): validate private identity filesystem custody'
          git push origin "HEAD:$BRANCH"
