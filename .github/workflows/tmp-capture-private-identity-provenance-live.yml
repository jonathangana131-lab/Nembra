name: Temporary Capture Private Identity Provenance Live Repair

on:
  push:
    branches:
      - agent/v14-capture-private-identity-custody-live-sol
    paths:
      - .github/workflows/tmp-capture-private-identity-provenance-live.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-private-identity-custody-live-sol
          fetch-depth: 0

      - name: Bind exact repair trigger
        shell: bash
        env:
          EXPECTED_PARENT: fa83a3701fa975e7f8727298d99a4b02cbd90e14
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" "$actual")" = '.github/workflows/tmp-capture-private-identity-provenance-live.yml'

      - name: Patch provenance source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/capture-field-build-provenance.yml')
          text = path.read_text()

          def after(marker: str, addition: str) -> None:
              global text
              if addition in text:
                  return
              index = text.find(marker)
              if index < 0:
                  raise SystemExit(f'missing provenance marker: {marker!r}')
              end = index + len(marker)
              text = text[:end] + addition + text[end:]

          after('      - Scripts/provision_capture_tuya_identity.sh\n',
                '      - Scripts/provision_capture_tuya_identity_writer.py\n')
          after('          bash -n Scripts/provision_capture_tuya_identity.sh\n',
                '          /usr/bin/python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py\n'
                '          /usr/bin/python3 -I Scripts/provision_capture_tuya_identity_writer.py --self-test\n')
          after("          private_identity_provisioner='Scripts/provision_capture_tuya_identity.sh'\n",
                "          private_identity_writer='Scripts/provision_capture_tuya_identity_writer.py'\n")
          after('          test -f "$private_identity_provisioner"\n',
                '          test -f "$private_identity_writer"\n')
          after("          grep -Fq 'NEMBRA_TUYA_RUNTIME_DIR' \"$private_identity_provisioner\"\n",
                "          grep -Fq 'provision_capture_tuya_identity_writer.py' \"$private_identity_provisioner\"\n"
                "          grep -Fq 'O_NOFOLLOW' \"$private_identity_writer\"\n"
                "          grep -Fq 'O_DIRECTORY' \"$private_identity_writer\"\n"
                "          grep -Fq 'O_EXCL' \"$private_identity_writer\"\n"
                "          grep -Fq 'dir_fd=parent_fd' \"$private_identity_writer\"\n")
          path.write_text(text)
          PY

          grep -Fq -- '- Scripts/provision_capture_tuya_identity_writer.py' .github/workflows/capture-field-build-provenance.yml
          grep -Fq '/usr/bin/python3 -I Scripts/provision_capture_tuya_identity_writer.py --self-test' .github/workflows/capture-field-build-provenance.yml
          grep -Fq "private_identity_writer='Scripts/provision_capture_tuya_identity_writer.py'" .github/workflows/capture-field-build-provenance.yml
          grep -Fq 'dir_fd=parent_fd' .github/workflows/capture-field-build-provenance.yml
          test "$(git diff --name-only)" = '.github/workflows/capture-field-build-provenance.yml'

      - name: Commit provenance source
        shell: bash
        env:
          BRANCH: agent/v14-capture-private-identity-custody-live-sol
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/capture-field-build-provenance.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/capture-field-build-provenance.yml'
          git commit -m 'ci(capture): validate private identity filesystem custody'
          git push origin "HEAD:$BRANCH"
