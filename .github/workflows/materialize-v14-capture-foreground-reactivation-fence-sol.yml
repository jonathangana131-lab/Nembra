name: Materialize Capture Foreground Reactivation Fence

on:
  push:
    branches:
      - integration/v14-capture-authority-provenance-convergence-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-authority-provenance-convergence-sol
          fetch-depth: 0
          persist-credentials: true
      - name: Close foreground-return double-terminal race
        run: python3 scripts/ci/materialize_v14_capture_foreground_reactivation_fence_sol.py
