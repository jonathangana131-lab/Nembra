name: Materialize Capture Signed Apple Prefix Correction

on:
  push:
    branches:
      - sol/v14-capture-signed-apple-identity-prefix-correction-20260810

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-signed-apple-identity-prefix-correction-20260810
          fetch-depth: 0

      - name: Guard exact corrected product parent
        run: |
          set -euo pipefail
          product_parent='1b12dc56ec20a7dad30760b57a81106644ffc263'
          test "$(git merge-base "$product_parent" HEAD)" = "$product_parent"
          git diff --quiet "$product_parent" HEAD -- scripts/field/install_one_time_capture.command
          git diff --quiet "$product_parent" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift

      - name: Apply App ID prefix correction
        run: python3 scripts/ci/materialize_capture_signed_apple_prefix_correction.py apply

      - name: Verify corrected authority contract
        run: python3 scripts/ci/materialize_capture_signed_apple_prefix_correction.py verify

      - name: Parse materializer
        run: python3 -m py_compile scripts/ci/materialize_capture_signed_apple_prefix_correction.py

      - name: Parse field installer
        run: bash -n scripts/field/install_one_time_capture.command

      - name: Parse corrected Swift regression
        run: swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSignedAppleAppIdentityCustodySourceTests.swift

      - name: Check diff whitespace
        run: git diff --check

      - name: Publish clean correction
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-signed-apple-prefix-correction.yml
          rm scripts/ci/materialize_capture_signed_apple_prefix_correction.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): allow distinct Apple App ID prefix"
          git push origin HEAD:sol/v14-capture-signed-apple-identity-prefix-correction-20260810
