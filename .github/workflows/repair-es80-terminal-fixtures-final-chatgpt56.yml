name: Repair ES80 terminal fixture authority

on:
  push:
    branches:
      - fix/es80-today-bcb-capture-package-gate/chatgpt56-go

permissions:
  contents: write

jobs:
  repair:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify exact frozen candidate parent
        run: test "$(git rev-parse HEAD^)" = "bcb9bf250b9ffa9c6301ffcfc36c75634b55e525"
      - name: Update stale terminal fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests')
          specs = {
              'PassiveCoreBluetoothTerminalQueueRetirementTests.swift': 'terminalAuthority',
              'PassiveCoreBluetoothTerminalQueueResolutionTests.swift': 'boundaryAuthority',
          }
          for filename, authority in specs.items():
              path = root / filename
              source = path.read_text()
              old = '''        let horizon = try gate.begin(\n            .observationHorizon,\n            through: horizonQueueCutoff,\n            processedThrough: 8,\n            authority: ''' + authority + '''\n        )'''
              new = '''        let horizon = try gate.beginObservationHorizon(\n            through: horizonQueueCutoff,\n            processedThrough: 8,\n            authority: ''' + authority + ''',\n            establishedByReadyRevision: ready.revision,\n            establishedByReadyIdentity: ready.identity\n        )'''
              if source.count(old) != 1:
                  raise SystemExit(f'expected one legacy Horizon fixture in {path}; got {source.count(old)}')
              path.write_text(source.replace(old, new))

          resolution = root / 'PassiveCoreBluetoothTerminalQueueResolutionTests.swift'
          source = resolution.read_text()
          old = '#expect(error == .terminalAuthorityChanged)'
          new = '#expect(error == .staleTerminalTransaction)'
          if source.count(old) != 1:
              raise SystemExit(f'expected one stale authority precedence assertion; got {source.count(old)}')
          resolution.write_text(source.replace(old, new))
          PY
          git diff --check
      - name: Validate terminal queue suites
        working-directory: Packages/NembraBluetoothCapture
        run: swift test --filter PassiveCoreBluetoothTerminalQueue
      - name: Commit product-only test repair
        shell: bash
        run: |
          rm .github/workflows/repair-es80-terminal-fixtures-final-chatgpt56.yml
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothTerminalQueueRetirementTests.swift
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothTerminalQueueResolutionTests.swift
          git add -u .github/workflows/repair-es80-terminal-fixtures-final-chatgpt56.yml
          git diff --cached --check
          git config user.name "nembra-capture-bot"
          git config user.email "nembra-capture-bot@users.noreply.github.com"
          git commit -m "test(capture): align terminal fixtures with V14 identity"
          git push origin HEAD
