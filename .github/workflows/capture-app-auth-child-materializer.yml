name: Capture app authorization child materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - product/capture-1-0-main-20260818

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'recovery/capture-app-auth-close-gpt56sol-20260819'
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      EXPECTED_SOURCE_BLOB: 627c17949d15aaf26ca28c12abb9bb684ab0e731
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      SOURCE_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
      RECOVERY_WORKFLOW: .github/workflows/capture-app-auth-recovery-one-shot.yml
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact reviewed source and materializer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_SOURCE_BLOB"
          test -f "$SOURCE_WORKFLOW"
          test -f "$RECOVERY_WORKFLOW"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize exact-freeze authorization lifecycle
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/capture-app-authorization-close-one-shot.yml").read_text(encoding="utf-8")
          section = workflow.index("      - name: Materialize field authorization into real SecureLink lifecycle")
          run_marker = "        run: |\n"
          start = workflow.index(run_marker, section) + len(run_marker)
          end = workflow.index("\n      - name: Enforce truth-preserving source shape", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, "capture-app-authorization-materializer", "exec"), {"__name__": "__main__"})

      - name: Verify strengthened source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'fieldAuthorization.stage == .armed' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitOFF1Start()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitAuthenticationStart()' "$APP_SOURCE"
          grep -Fq 'try fieldAuthorization.admitOfficialConnectionStart()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.admitObservationStart()' "$APP_SOURCE"
          grep -Fq 'try self.freezeAcceptedArtifactForAuthorizationSeal()' "$APP_SOURCE"
          grep -Fq 'try self.fieldAuthorization.sealAfterAcceptedArtifactFreeze()' "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          (
            cd Packages/NembraBluetoothCapture
            swift test --filter AuthenticatedStationaryCaptureAppSessionTests
            swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
            swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests
          )

      - name: Build standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/NembraCaptureAppAuthorizationChild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish only this exact tested recovery head
        shell: bash
        run: |
          set -euo pipefail
          rm "$SOURCE_WORKFLOW" "$RECOVERY_WORKFLOW"
          git add -- "$APP_SOURCE" "$SOURCE_WORKFLOW" "$RECOVERY_WORKFLOW"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(capture): wire one-time field authorization into SecureLink'
          materialized="$(git rev-parse HEAD)"
          git fetch origin 'recovery/capture-app-auth-close-gpt56sol-20260819'
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git push origin HEAD:'recovery/capture-app-auth-close-gpt56sol-20260819'
          printf 'NEMBRA_CAPTURE_APP_AUTHORIZATION_CHILD materialized=%s trigger=%s physicalAuthorityCreated=false\n' "$materialized" "${{ github.event.pull_request.head.sha }}"
