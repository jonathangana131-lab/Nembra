name: ES80 Comparison macOS Compile

on:
  push:
    branches:
      - 'cell/es80-capture-comparison-truth/ci/chat-b7q4n-macos-*'

permissions:
  contents: read

jobs:
  package:
    name: Supplemental comparison package compile/test
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
      - name: Guard passive adapter against application writes
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            exit 1
          fi
      - name: Test NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture
