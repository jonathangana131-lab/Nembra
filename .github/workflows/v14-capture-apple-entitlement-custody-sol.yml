name: V14 Capture Apple Entitlement Custody Sol

on:
  push:
    branches:
      - truth/v14-capture-apple-entitlement-custody-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: truth/v14-capture-apple-entitlement-custody-sol
          fetch-depth: 0
      - name: Guard exact product parent
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 483b9fb943f1ba2825e24955b5a819fec7d2a449 HEAD
      - name: Materialize signed entitlement custody
        run: python3 scripts/ci/materialize_capture_apple_entitlement_custody.py
      - name: Verify source contract
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          python3 scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          git diff --check
      - name: Commit clean field-custody successor
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-apple-entitlement-custody-sol.yml
          rm scripts/ci/materialize_capture_apple_entitlement_custody.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): prove Apple sign-in entitlement custody"
          git push origin HEAD:truth/v14-capture-apple-entitlement-custody-sol
