name: Materialize Capture Account UID Custody 648

on:
  push:
    branches:
      - sol/v14-capture-truth-convergence-1c408

permissions:
  contents: write

jobs:
  materialize-account-uid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact convergence parent
        shell: bash
        run: |
          set -euo pipefail
          BASE=648c39f52b8c8155c58f665520f002b895e22663
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t paths < <(git diff --name-only "$BASE"...HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = ".github/workflows/materialize-capture-account-uid-custody-648.yml"

      - name: Add tested exact-secret redactor and consume it in Capture
        shell: bash
        run: |
          set -euo pipefail
          cat > Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaExactSecretValueRedactor.swift <<'SWIFT'
          import Foundation

          /// Redacts one already-authorized exact secret from application evidence without treating
          /// generic key names (for example `uid`) as secrets. Key collisions introduced by
          /// redaction are preserved under deterministic non-authoritative suffixes rather than
          /// silently dropping one of the original fields.
          public enum TuyaExactSecretValueRedactor: Sendable {
              public static func redact(
                  fields: [String: String],
                  exactSecret: String,
                  marker: String
              ) -> [String: String] {
                  guard !exactSecret.isEmpty else { return fields }

                  var output: [String: String] = [:]
                  for originalKey in fields.keys.sorted() {
                      guard let originalValue = fields[originalKey] else { continue }
                      let redactedKey = originalKey.replacingOccurrences(of: exactSecret, with: marker)
                      let redactedValue = originalValue.replacingOccurrences(of: exactSecret, with: marker)

                      var admittedKey = redactedKey
                      var collisionIndex = 1
                      while output[admittedKey] != nil {
                          admittedKey = "\(redactedKey)#redacted-collision-\(collisionIndex)"
                          collisionIndex += 1
                      }
                      output[admittedKey] = redactedValue
                  }
                  return output
              }
          }
          SWIFT

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExactSecretValueRedactorTests.swift <<'SWIFT'
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya exact secret value redactor")
          struct TuyaExactSecretValueRedactorTests {
              private let secret = "account-UID-123"
              private let marker = "<redacted-account-uid>"

              @Test("exact account UID is scrubbed from values while generic uid key survives")
              func valueRedactionPreservesGenericUIDKey() {
                  let result = TuyaExactSecretValueRedactor.redact(
                      fields: ["uid": "device-uid-456", "owner": "prefix-account-UID-123-suffix"],
                      exactSecret: secret,
                      marker: marker
                  )
                  #expect(result["uid"] == "device-uid-456")
                  #expect(result["owner"] == "prefix-<redacted-account-uid>-suffix")
                  #expect(!result.keys.joined().contains(secret))
                  #expect(!result.values.joined().contains(secret))
              }

              @Test("malformed account-UID-bearing keys are scrubbed")
              func keyRedaction() {
                  let result = TuyaExactSecretValueRedactor.redact(
                      fields: ["device-account-UID-123-owner": "safe"],
                      exactSecret: secret,
                      marker: marker
                  )
                  #expect(result["device-<redacted-account-uid>-owner"] == "safe")
                  #expect(!result.keys.joined().contains(secret))
              }

              @Test("redaction-created key collisions preserve both evidence fields deterministically")
              func collisionPreservation() {
                  let result = TuyaExactSecretValueRedactor.redact(
                      fields: [
                          "owner-account-UID-123": "secret account-UID-123",
                          "owner-<redacted-account-uid>": "already marker text",
                      ],
                      exactSecret: secret,
                      marker: marker
                  )
                  #expect(result.count == 2)
                  #expect(Set(result.values) == Set([marker, "already marker text"]))
                  #expect(result.keys.allSatisfy { !$0.contains(secret) })
                  #expect(result.values.allSatisfy { !$0.contains(secret) })
                  #expect(result.keys.contains("owner-<redacted-account-uid>"))
                  #expect(result.keys.contains("owner-<redacted-account-uid>#redacted-collision-1"))
              }

              @Test("empty exact secret is a no-op rather than matching every string boundary")
              func emptySecretNoOp() {
                  let fields = ["uid": "device-uid", "value": "ordinary"]
                  #expect(TuyaExactSecretValueRedactor.redact(fields: fields, exactSecret: "", marker: marker) == fields)
              }
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          start = source.index("    private func receivedApplicationUpdate(")
          end = source.index("    private func startWatchdog", start)
          receiver = source[start:end]

          authority = "              accountIdentityLeaseIsAuthorized,\n              let driver else {"
          replacement = "              accountIdentityLeaseIsAuthorized,\n              let verifiedAccountUID = currentAccountUID,\n              !verifiedAccountUID.isEmpty,\n              membershipAccountUID == verifiedAccountUID,\n              let driver else {"
          if receiver.count(authority) != 1:
              raise SystemExit(f"expected one application authority seam, found {receiver.count(authority)}")
          receiver = receiver.replace(authority, replacement, 1)

          log_prefix = '            log("tuya_application_update", update.merging(['
          if receiver.count(log_prefix) != 1:
              raise SystemExit(f"expected one trusted application event log seam, found {receiver.count(log_prefix)}")
          redacted_log_prefix = '''            let accountUIDRedactedUpdate = TuyaExactSecretValueRedactor.redact(
                  fields: update,
                  exactSecret: verifiedAccountUID,
                  marker: "<redacted-account-uid>"
              )
              log("tuya_application_update", accountUIDRedactedUpdate.merging(['''
          receiver = receiver.replace(log_prefix, redacted_log_prefix, 1)
          path.write_text(source[:start] + receiver + source[end:])
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift <<'SWIFT'
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya application account-UID export custody")
          struct TuyaApplicationAccountUIDExportCustodySourceTests {
              @Test("accepted application evidence redacts the verified account UID before event custody")
              func applicationEvidenceCannotExportVerifiedAccountUID() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let updateAdmission = String(try section(in: source, from: "private func receivedApplicationUpdate(", to: "private func startWatchdog"))
                  let prepareExport = String(try section(in: source, from: "func prepareExport()", to: "private func abandonPackageCorrelation()"))
                  #expect(prepareExport.contains("No account UID"))
                  #expect(updateAdmission.contains("let verifiedAccountUID = currentAccountUID"))
                  #expect(updateAdmission.contains("membershipAccountUID == verifiedAccountUID"))
                  #expect(updateAdmission.contains("<redacted-account-uid>"))
                  #expect(updateAdmission.contains("TuyaExactSecretValueRedactor.redact"))
                  #expect(updateAdmission.contains("fields: update"))
                  #expect(updateAdmission.contains("exactSecret: verifiedAccountUID"))
                  #expect(!updateAdmission.contains("log(\"tuya_application_update\", update.merging(["))
                  #expect(updateAdmission.contains("accountUIDRedactedUpdate.merging(["))
                  #expect(updateAdmission.contains(") { _, trusted in trusted })"))
              }

              @Test("account UID custody is value-bound rather than a blanket generic uid-key rule")
              func accountUIDCustodyDoesNotEraseGenericDeviceUIDKeys() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(in: source, from: "@MainActor\nprivate final class SmartLifeDriver", to: "#endif\n\nprivate enum AppleAccountAuthorizationError"))
                  #expect(!driver.contains("\"uid\","))
                  #expect(!driver.contains("\"uid\"\n"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start), let b = source.range(of: end, range: a.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[a.lowerBound..<b.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let root = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent().deletingLastPathComponent().deletingLastPathComponent()
                      .deletingLastPathComponent().deletingLastPathComponent()
                  return try String(contentsOf: root.appendingPathComponent(relativePath), encoding: .utf8)
              }
              private enum SourceContractError: Error { case sectionMissing }
          }
          SWIFT

      - name: Validate package behavior and app custody contract
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter 'TuyaExactSecretValueRedactorTests|TuyaApplicationAccountUIDExportCustodySourceTests|TuyaApplicationEventMetadataPrecedenceSourceTests|TuyaSecureLinkViewMembershipStatusRevocationSourceTests|TuyaExportSecretClassifierConvergenceSourceTests'
          python3 - <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          receiver = app.split("private func receivedApplicationUpdate(", 1)[1].split("private func startWatchdog", 1)[0]
          assert 'let verifiedAccountUID = currentAccountUID' in receiver
          assert 'membershipAccountUID == verifiedAccountUID' in receiver
          assert 'TuyaExactSecretValueRedactor.redact' in receiver
          assert 'marker: "<redacted-account-uid>"' in receiver
          assert 'log("tuya_application_update", update.merging([' not in receiver
          assert 'accountUIDRedactedUpdate.merging([' in receiver
          assert ']) { _, trusted in trusted })' in receiver
          driver = app.split("@MainActor\nprivate final class SmartLifeDriver", 1)[1].split("#endif\n\nprivate enum AppleAccountAuthorizationError", 1)[0]
          assert '"uid",' not in driver
          PY
          git diff --check

      - name: Publish clean account-UID closure
        shell: bash
        run: |
          set -euo pipefail
          BASE=648c39f52b8c8155c58f665520f002b895e22663
          WORKFLOW=.github/workflows/materialize-capture-account-uid-custody-648.yml
          SOURCE=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaExactSecretValueRedactor.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExactSecretValueRedactorTests.swift
          SOURCE_TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=("$WORKFLOW" "NembraApp/App/NembraCaptureEntrypoint.swift" "$SOURCE" "$TEST" "$SOURCE_TEST")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${staged[*]}" = "${expected_sorted[*]}"
          git commit -m "fix(capture): bind account UID export custody"
          mapfile -t incremental < <(git diff --name-only "$BASE"...HEAD | sort)
          expected_incremental=("NembraApp/App/NembraCaptureEntrypoint.swift" "$SOURCE" "$TEST" "$SOURCE_TEST")
          mapfile -t expected_incremental_sorted < <(printf '%s\n' "${expected_incremental[@]}" | sort)
          test "${incremental[*]}" = "${expected_incremental_sorted[*]}"
          git diff --check "$BASE"...HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
