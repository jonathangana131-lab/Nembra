name: V14 Capture Root Truth Copy Materializer

on:
  push:
    branches:
      - product/v14-capture-guided-final-truth-gpt56sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact setup-authority wording repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text(encoding='utf-8')
          old = 'Text("One guided setup proves the account and scooter Nembra will use before passive target correlation begins.")'
          new = 'Text("One guided setup establishes the account and bound-device context Nembra will use before passive target correlation begins.")'
          if app.count(old) != 1:
              raise SystemExit(f'expected one stale root authority claim, found {app.count(old)}')
          app_path.write_text(app.replace(old, new, 1), encoding='utf-8')

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift')
          test = test_path.read_text(encoding='utf-8')
          anchor = '        #expect(body.contains("NEMBRA CAPTURE"))\n'
          addition = (
              '        #expect(body.contains("One guided setup establishes the account and bound-device context Nembra will use before passive target correlation begins."))\n'
              '        #expect(!body.contains("proves the account and scooter"))\n'
          )
          if addition not in test:
              if test.count(anchor) != 1:
                  raise SystemExit('root product source-test anchor changed')
              test = test.replace(anchor, anchor + addition, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          grep -Fq 'One guided setup establishes the account and bound-device context Nembra will use before passive target correlation begins.' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'One guided setup proves the account and scooter Nembra will use before passive target correlation begins.' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq '#expect(!body.contains("proves the account and scooter"))' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          grep -Fq 'accessibilityLabel("Authenticated observation progress")' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'procedureIdentifier == Self.fieldProcedureIdentifier' NembraApp/App/NembraCaptureBuildIdentity.swift
          ! grep -Fq 'let localKey:' NembraApp/Features/Research/TuyaAccountBridge.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          git diff --check

      - name: Publish clean root truth bytes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-v14-capture-root-copy-gpt56sol.yml
          git add -A
          git diff --cached --check
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): separate setup context from target proof'
          git push origin HEAD:product/v14-capture-guided-final-truth-gpt56sol
