name: Temporary Private Identity Publication Custody Materializer

on:
  push:
    branches:
      - repair/v14-private-identity-publication-custody-sol
    paths:
      - .github/workflows/tmp-private-identity-publication-custody-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-identity-publication-custody-sol
          fetch-depth: 0

      - name: Close mismatch cleanup and pin exact writer bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          writer_path = Path('Scripts/provision_capture_tuya_identity_writer.py')
          writer = writer_path.read_text()
          marker = '\ndef _validate_existing_output(parent_fd: int, name: str) -> None:\n'
          helper = r'''
          def _remove_final_if_same_inode_beneath(
              checkout_fd: int,
              relative_path: str,
              expected_dev: int,
              expected_ino: int,
          ) -> None:
              components = _relative_components(relative_path)
              parent_fd = os.dup(checkout_fd)
              try:
                  for component in components[:-1]:
                      next_fd = os.open(component, _directory_flags(), dir_fd=parent_fd)
                      os.close(parent_fd)
                      parent_fd = next_fd
                  try:
                      named = os.stat(components[-1], dir_fd=parent_fd, follow_symlinks=False)
                  except FileNotFoundError:
                      return
                  if (
                      stat.S_ISREG(named.st_mode)
                      and named.st_uid == os.geteuid()
                      and named.st_nlink == 1
                      and named.st_dev == expected_dev
                      and named.st_ino == expected_ino
                  ):
                      os.unlink(components[-1], dir_fd=parent_fd)
                      os.fsync(parent_fd)
              except OSError:
                  return
              finally:
                  os.close(parent_fd)
          '''.replace('\n          ', '\n')
          if 'def _remove_final_if_same_inode_beneath(' not in writer:
              if writer.count(marker) != 1:
                  raise SystemExit('cleanup helper insertion point is not unique')
              writer = writer.replace(marker, '\n' + helper + marker, 1)

          old = '''        if (
                      not stat.S_ISREG(final.st_mode)
                      or final.st_uid != os.geteuid()
                      or final.st_nlink != 1
                      or final.st_size != len(payload)
                      or final.st_dev != sealed.st_dev
                      or final.st_ino != sealed.st_ino
                  ):
                      raise ProvisionError("published private identity output is not the sealed staging inode")
          '''.replace('\n          ', '\n')
          new = '''        if (
                      not stat.S_ISREG(final.st_mode)
                      or final.st_uid != os.geteuid()
                      or final.st_nlink != 1
                      or final.st_size != len(payload)
                      or final.st_dev != sealed.st_dev
                      or final.st_ino != sealed.st_ino
                  ):
                      _remove_final_if_same_inode_beneath(
                          checkout_fd,
                          destination_relative,
                          final.st_dev,
                          final.st_ino,
                      )
                      raise ProvisionError("published private identity output is not the sealed staging inode")
          '''.replace('\n          ', '\n')
          if '_remove_final_if_same_inode_beneath(\n                checkout_fd,' not in writer:
              if writer.count(old) != 1:
                  raise SystemExit('final inode rejection block is not the expected shape')
              writer = writer.replace(old, new, 1)
          writer_path.write_text(writer)

          digest = hashlib.sha256(writer_path.read_bytes()).hexdigest()
          if not re.fullmatch(r'[0-9a-f]{64}', digest):
              raise SystemExit('derived writer digest is not canonical')
          print(f'writer_sha256={digest}')

          shell_path = Path('Scripts/provision_capture_tuya_identity.sh')
          shell = shell_path.read_text()
          shell, count = re.subn(
              r'WRITER_SHA256="[0-9a-f]{64}"',
              f'WRITER_SHA256="{digest}"',
              shell,
              count=1,
          )
          if count != 1:
              raise SystemExit('writer digest pin in shell is not unique')
          shell_path.write_text(shell)

          custody_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift')
          custody = custody_path.read_text()
          custody, count = re.subn(
              r'WRITER_SHA256=\\"[0-9a-f]{64}\\"',
              f'WRITER_SHA256=\\"{digest}\\"',
              custody,
              count=1,
          )
          if count != 1:
              raise SystemExit('writer digest source assertion is not unique')
          old_assertions = '''        #expect(writer.contains("dir_fd=parent_fd"))
                  #expect(writer.contains("src_dir_fd=parent_fd"))
                  #expect(writer.contains("dst_dir_fd=parent_fd"))
          '''.replace('\n                  ', '\n        ')
          new_assertions = '''        #expect(writer.contains("_DARWIN_RENAME_NOFOLLOW_ANY"))
                  #expect(writer.contains("_DARWIN_RENAME_RESOLVE_BENEATH"))
                  #expect(writer.contains("renameatx_np"))
                  #expect(writer.contains("src_dir_fd=checkout_fd"))
                  #expect(writer.contains("dst_dir_fd=checkout_fd"))
                  #expect(writer.contains("final.st_dev != sealed.st_dev"))
                  #expect(writer.contains("final.st_ino != sealed.st_ino"))
                  #expect(writer.contains("_remove_final_if_same_inode_beneath"))
          '''.replace('\n                  ', '\n        ')
          if custody.count(old_assertions) != 1:
              raise SystemExit('old writer publication assertions did not match once')
          custody_path.write_text(custody.replace(old_assertions, new_assertions, 1))

          root_contract_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityCheckoutRootCustodySourceTests.swift')
          contract = root_contract_path.read_text()
          marker = '        #expect(writer.contains("_ensure_private_directory(checkout_fd, \\"LocalSecrets\\")"))\n'
          additions = '''        #expect(writer.contains("_require_private_chain("))
                  #expect(writer.contains("_DARWIN_RENAME_NOFOLLOW_ANY"))
                  #expect(writer.contains("_DARWIN_RENAME_RESOLVE_BENEATH"))
                  #expect(writer.contains("renameatx_np"))
                  #expect(writer.contains("temporary_name = f\\".nembra-private-stage-"))
                  #expect(writer.contains("LocalSecrets/TuyaRuntime/NembraTuyaPrivateConfig.podspec"))
                  #expect(writer.contains("NembraTuyaPrivateIdentity.swift"))
                  #expect(writer.contains("final.st_dev != sealed.st_dev"))
                  #expect(writer.contains("final.st_ino != sealed.st_ino"))
                  #expect(writer.contains("_remove_final_if_same_inode_beneath"))
          '''.replace('\n                  ', '\n        ')
          if additions.strip() not in contract:
              if contract.count(marker) != 1:
                  raise SystemExit('root custody source-contract insertion point not unique')
              contract = contract.replace(marker, marker + additions, 1)
          root_contract_path.write_text(contract)

          provenance_path = Path('.github/workflows/capture-field-build-provenance.yml')
          provenance = provenance_path.read_text()
          path_marker = '      - scripts/ci/tests/test_capture_private_identity_checkout_root_swap.py\n'
          path_line = '      - scripts/ci/tests/test_capture_private_identity_publication_races.py\n'
          if path_line not in provenance:
              if provenance.count(path_marker) != 1:
                  raise SystemExit('provenance path insertion point not unique')
              provenance = provenance.replace(path_marker, path_marker + path_line, 1)
          command_marker = '          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_checkout_root_swap.py\n'
          commands = (
              '          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_publication_races.py\n'
              '          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_publication_races.py\n'
          )
          if commands not in provenance:
              if provenance.count(command_marker) != 1:
                  raise SystemExit('provenance command insertion point not unique')
              provenance = provenance.replace(command_marker, command_marker + commands, 1)
          ignore_marker = "          grep -Fxq 'LocalSecrets/' \"$ignore\"\n"
          ignore_line = "          grep -Fxq '.nembra-private-stage-*' \"$ignore\"\n"
          if ignore_line not in provenance:
              if provenance.count(ignore_marker) != 1:
                  raise SystemExit('provenance ignore insertion point not unique')
              provenance = provenance.replace(ignore_marker, ignore_marker + ignore_line, 1)
          writer_marker = "          grep -Fq '_require_checkout_path_identity' \"$private_identity_writer\"\n"
          writer_lines = (
              "          grep -Fq '_DARWIN_RENAME_NOFOLLOW_ANY' \"$private_identity_writer\"\n"
              "          grep -Fq '_DARWIN_RENAME_RESOLVE_BENEATH' \"$private_identity_writer\"\n"
              "          grep -Fq 'renameatx_np' \"$private_identity_writer\"\n"
              "          grep -Fq 'final.st_ino != sealed.st_ino' \"$private_identity_writer\"\n"
              "          grep -Fq '_remove_final_if_same_inode_beneath' \"$private_identity_writer\"\n"
          )
          if writer_lines not in provenance:
              if provenance.count(writer_marker) != 1:
                  raise SystemExit('provenance writer-contract insertion point not unique')
              provenance = provenance.replace(writer_marker, writer_marker + writer_lines, 1)
          provenance_path.write_text(provenance)
          PY

      - name: Run publication custody acceptance on Linux fallback
        shell: bash
        run: |
          set -euo pipefail
          bash -n Scripts/provision_capture_tuya_identity.sh
          /usr/bin/python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          /usr/bin/python3 -I Scripts/provision_capture_tuya_identity_writer.py --self-test
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_publication_races.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_publication_races.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_checkout_root_swap.py
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_checkout_root_swap.py
          git diff --check

      - name: Publish clean repair checkpoint
        shell: bash
        env:
          BRANCH: repair/v14-private-identity-publication-custody-sol
        run: |
          set -euo pipefail
          trigger="$(git rev-parse HEAD)"
          rm .github/workflows/tmp-private-identity-publication-custody-materializer.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): close private identity publication races'
          expected="$(cat <<'EOF' | sort
.gitignore
.github/workflows/capture-field-build-provenance.yml
Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityCheckoutRootCustodySourceTests.swift
Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPrivateIdentityProvisionerCustodyTests.swift
Scripts/provision_capture_tuya_identity.sh
Scripts/provision_capture_tuya_identity_writer.py
scripts/ci/tests/test_capture_private_identity_publication_races.py
EOF
)"
          base="c6593e8c04f5453c63a6b209c88f1e3997c9e859"
          actual="$(git diff --name-only "$base" HEAD | sort)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$trigger"
          git push origin HEAD:"$BRANCH"