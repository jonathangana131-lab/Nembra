name: TEMP Materialize selected Xcode tool-file custody

on:
  push:
    branches:
      - repair/v14-selected-xcode-tool-file-custody-sol-1316sx-20260811
    paths:
      - .github/workflows/tmp-v14-selected-xcode-tool-file-custody-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-selected-xcode-tool-file-custody-sol-1316sx-20260811
          fetch-depth: 0

      - name: Bind materializer to triggering head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize exact tool-file custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          path = Path("scripts/field/install_one_time_capture.command")
          source = path.read_text(encoding="utf-8")

          new_helper = dedent(r'''\
          validate_root_custodied_path() {
              local candidate="$1"
              local expected_kind="$2"
              /usr/bin/env -i \
                  PATH=/usr/bin:/bin \
                  HOME=/tmp \
                  LANG=C \
                  LC_ALL=C \
                  NEMBRA_CUSTODY_PATH="$candidate" \
                  NEMBRA_CUSTODY_KIND="$expected_kind" \
                  /usr/bin/python3 -I - <<'PY_CUSTODY'
          import os
          from pathlib import Path
          import stat

          raw = os.environ.get("NEMBRA_CUSTODY_PATH", "")
          kind = os.environ.get("NEMBRA_CUSTODY_KIND", "")
          path = Path(raw)
          if not raw or "\x00" in raw or not path.is_absolute():
              raise SystemExit("selected Xcode custody requires one absolute path")
          if kind not in {"directory", "file"}:
              raise SystemExit("selected Xcode custody kind is unsupported")
          try:
              resolved = path.resolve(strict=True)
          except OSError as error:
              raise SystemExit("selected Xcode custody path is unavailable") from error
          if resolved != path:
              raise SystemExit("selected Xcode custody refuses symlink/alias resolution")
          current = Path(path.anchor)
          for component in path.parts[1:]:
              current = current / component
              try:
                  metadata = os.lstat(current)
              except OSError as error:
                  raise SystemExit("selected Xcode custody ancestry is unavailable") from error
              leaf = current == path
              if stat.S_ISLNK(metadata.st_mode):
                  raise SystemExit("selected Xcode custody refuses symlink ancestry or subjects")
              if leaf and kind == "file":
                  if not stat.S_ISREG(metadata.st_mode):
                      raise SystemExit("selected Xcode custody expected one regular file")
              elif not stat.S_ISDIR(metadata.st_mode):
                  raise SystemExit("selected Xcode custody requires real directory ancestry")
              if metadata.st_uid != 0 or metadata.st_mode & 0o022:
                  raise SystemExit("selected Xcode custody requires root-owned non-group/world-writable metadata")
          if kind == "directory" and not path.is_dir():
              raise SystemExit("selected Xcode custody expected one directory")
          if kind == "file" and (not path.is_file() or path.is_symlink()):
              raise SystemExit("selected Xcode custody expected one real regular file")
          PY_CUSTODY
          }
          ''')

          helper_pattern = re.compile(r'(?ms)^validate_root_custodied_path\(\) \{.*?^\}\n')
          source, helper_count = helper_pattern.subn(new_helper, source, count=1)
          if helper_count != 1:
              raise SystemExit(f"materializer expected one custody helper, found {helper_count}")

          new_selection = dedent(r'''\
          SELECTED_DEVELOPER_DIR="$(/usr/bin/xcode-select -p)"
          [[ -n "$SELECTED_DEVELOPER_DIR" ]] || die "Could not resolve the system-selected Xcode developer directory."
          readonly SELECTED_DEVELOPER_DIR
          [[ "$SELECTED_DEVELOPER_DIR" == /* ]] || die "System-selected Xcode developer directory is not absolute."
          validate_root_custodied_path "$SELECTED_DEVELOPER_DIR" directory || die "System-selected Xcode developer tree is not under trusted root custody."
          SELECTED_XCODEBUILD="$(DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun --find xcodebuild)" || die "Could not resolve xcodebuild from the selected Xcode 27 developer tree."
          readonly SELECTED_XCODEBUILD
          [[ "$SELECTED_XCODEBUILD" == "$SELECTED_DEVELOPER_DIR"/* ]] || die "Selected xcodebuild escaped the admitted Xcode developer tree."
          validate_root_custodied_path "$(dirname "$SELECTED_XCODEBUILD")" directory || die "Selected xcodebuild parent escaped trusted root custody."
          validate_root_custodied_path "$SELECTED_XCODEBUILD" file || die "Selected xcodebuild executable is not under exact root-owned non-group/world-writable file custody."
          [[ -x "$SELECTED_XCODEBUILD" ]] || die "Selected xcodebuild is not executable."
          SELECTED_XCODE_VERSION="$("$SELECTED_XCODEBUILD" -version 2>/dev/null)" || die "Could not interrogate the exact selected Xcode toolchain."
          SELECTED_XCODE_FIRST_LINE="${SELECTED_XCODE_VERSION%%$'\n'*}"
          [[ "$SELECTED_XCODE_FIRST_LINE" =~ ^Xcode[[:space:]]27([.]|$) ]] || die "Selected developer tree must identify as Xcode 27 before physical device discovery or build admission."
          SELECTED_XCTRACE="$(DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun --find xctrace)" || die "Could not resolve xctrace from the selected Xcode 27 developer tree."
          readonly SELECTED_XCTRACE
          [[ "$SELECTED_XCTRACE" == "$SELECTED_DEVELOPER_DIR"/* ]] || die "Selected xctrace escaped the admitted Xcode developer tree."
          validate_root_custodied_path "$SELECTED_XCTRACE" file || die "Selected xctrace executable is not under exact root-owned non-group/world-writable file custody."
          [[ -x "$SELECTED_XCTRACE" ]] || die "Selected xctrace is not executable."
          SELECTED_DEVICECTL="$(DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun --find devicectl)" || die "Could not resolve devicectl from the selected Xcode 27 developer tree."
          readonly SELECTED_DEVICECTL
          [[ "$SELECTED_DEVICECTL" == "$SELECTED_DEVELOPER_DIR"/* ]] || die "Selected devicectl escaped the admitted Xcode developer tree."
          validate_root_custodied_path "$SELECTED_DEVICECTL" file || die "Selected devicectl executable is not under exact root-owned non-group/world-writable file custody."
          [[ -x "$SELECTED_DEVICECTL" ]] || die "Selected devicectl is not executable."
          say "Selected Xcode 27 developer tree and exact physical tool files admitted under root custody"
          unset SELECTED_XCODE_VERSION SELECTED_XCODE_FIRST_LINE || true
          ''')

          selection_pattern = re.compile(
              r'(?ms)^SELECTED_DEVELOPER_DIR="\$\(/usr/bin/xcode-select -p\)"\n.*?^unset SELECTED_XCODE_VERSION SELECTED_XCODE_FIRST_LINE \|\| true\n'
          )
          source, selection_count = selection_pattern.subn(new_selection, source, count=1)
          if selection_count != 1:
              raise SystemExit(f"materializer expected one selected-Xcode admission block, found {selection_count}")

          replacements = (
              ('DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun xctrace list devices', '"$SELECTED_XCTRACE" list devices', "xctrace execution"),
              ('DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun devicectl list devices', '"$SELECTED_DEVICECTL" list devices', "devicectl discovery execution"),
              ('DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun devicectl device install app', '"$SELECTED_DEVICECTL" device install app', "devicectl install execution"),
              ('DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR" /usr/bin/xcrun devicectl device process launch', '"$SELECTED_DEVICECTL" device process launch', "devicectl launch execution"),
          )
          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"materializer expected exactly one {label} subject, found {count}")
              source = source.replace(old, new, 1)

          for forbidden in (
              '/usr/bin/xcrun xctrace list devices',
              '/usr/bin/xcrun devicectl list devices',
              '/usr/bin/xcrun devicectl device install app',
              '/usr/bin/xcrun devicectl device process launch',
          ):
              if forbidden in source:
                  raise SystemExit(f"mutable selected-tool re-resolution remains: {forbidden}")

          path.write_text(source, encoding="utf-8")
          PY

          /usr/bin/python3 -I scripts/ci/tests/test_capture_field_selected_xcode_tool_file_custody.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Publish durable repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-v14-selected-xcode-tool-file-custody-materialize.yml
          git add scripts/field/install_one_time_capture.command \
                  scripts/ci/tests/test_capture_field_selected_xcode_tool_file_custody.py \
                  .github/workflows/capture-field-selected-xcode-tool-file-custody.yml
          git diff --cached --check
          git config user.name "nembra-swarm-materializer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Capture: custody exact selected Xcode tool files"
          git push origin HEAD:repair/v14-selected-xcode-tool-file-custody-sol-1316sx-20260811
