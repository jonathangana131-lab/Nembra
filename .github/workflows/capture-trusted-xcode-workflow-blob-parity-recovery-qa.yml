name: Capture Trusted Xcode Workflow Blob Parity Recovery QA

on:
  push:
    branches:
      - validation/v14-trusted-workflow-blob-parity-recovery/gpt56-go
  pull_request:
    paths:
      - .github/workflows/capture-xcode27-trusted-command.yml
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/tests/test_capture_trusted_xcode_workflow_blob_parity.py
      - .github/workflows/capture-trusted-xcode-workflow-blob-parity-recovery-qa.yml

permissions:
  contents: read

jobs:
  parity:
    name: Require exact trusted workflow blob parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile workflow-blob parity regression
        run: python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_workflow_blob_parity.py
      - name: Require workflow bytes and verifier pin to match
        run: python3 scripts/ci/tests/test_capture_trusted_xcode_workflow_blob_parity.py -v
