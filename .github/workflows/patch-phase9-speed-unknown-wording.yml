name: Patch Phase 9 speed-unknown wording

on:
  push:
    branches:
      - feature/landscape-dashboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/landscape-dashboard
          fetch-depth: 0

      - name: Shorten compact Lock subtitle without changing semantics
        run: |
          python3 <<'PY'
          from pathlib import Path
          home = Path('NembraApp/Features/Home/HomeView.swift')
          text = home.read_text()
          old = 'guard let speed = confirmedVehicleSpeedKilometersPerHour else { return "Speed unavailable" }'
          new = 'guard let speed = confirmedVehicleSpeedKilometersPerHour else { return "Speed unknown" }'
          if text.count(old) != 1:
              raise SystemExit('Home wording anchor missing or ambiguous')
          home.write_text(text.replace(old, new, 1))

          tests = Path('NembraUITests/NembraUITests.swift')
          text = tests.read_text()
          old = 'XCTAssertTrue(lock.label.contains("Speed unavailable"))'
          new = 'XCTAssertTrue(lock.label.contains("Speed unknown"))'
          if text.count(old) != 1:
              raise SystemExit('UI-test wording anchor missing or ambiguous')
          tests.write_text(text.replace(old, new, 1))
          PY
          grep -q 'return "Speed unknown"' NembraApp/Features/Home/HomeView.swift
          grep -q 'contains("Speed unknown")' NembraUITests/NembraUITests.swift

      - name: Commit wording fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-phase9-speed-unknown-wording.yml
          git add NembraApp/Features/Home/HomeView.swift NembraUITests/NembraUITests.swift
          git commit -m 'polish: fit unknown-speed Lock subtitle'
          git push origin HEAD:feature/landscape-dashboard
