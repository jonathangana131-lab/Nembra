name: Capture Generated Shared Ancestor Rearm

on:
  push:
    branches:
      - recovery/v17-capture-shared-ancestor-rearm-indent-sol-20260815
    paths:
      - .github/workflows/capture-generated-shared-ancestor-rearm.yml

permissions:
  contents: read

env:
  EXACT_PARENT: fe40c025eb10247c73820f4001ab63affaa60af7

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-generated-shared-ancestor-cache-materialize-once.yml \
            .github/workflows/capture-generated-shared-ancestor-rearm.yml | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute reviewed materialization payload
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B - 2>&1 <<'PY' | tee /tmp/nembra-shared-ancestor-materializer.log
          from pathlib import Path

          source = Path('.github/workflows/capture-generated-shared-ancestor-cache-materialize-once.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start_marker = "          /usr/bin/python3 -B - <<'PY'"
          end_marker = "          PY"
          try:
              start = lines.index(start_marker) + 1
              end = lines.index(end_marker, start)
          except ValueError as exc:
              raise SystemExit(f'reviewed materializer payload markers missing: {exc}')
          payload_lines = lines[start:end]
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload_lines) + '\n'

          template_scrub = '.replace("          ", "")'
          scrub_count = payload.count(template_scrub)
          if scrub_count != 6:
              raise SystemExit(
                  f'reviewed materializer template-scrub count drifted: expected 6, found {scrub_count}'
              )
          payload = payload.replace(template_scrub, '')

          regression_scrub = 'regression = "\\n".join(line[10:] if line.startswith("          ") else line for line in regression.splitlines()) + "\\n"'
          regression_preserve = 'regression = "\\n".join(regression.splitlines()) + "\\n"'
          regression_scrub_count = payload.count(regression_scrub)
          if regression_scrub_count != 1:
              raise SystemExit(
                  f'reviewed materializer regression-scrub count drifted: expected 1, found {regression_scrub_count}'
              )
          payload = payload.replace(regression_scrub, regression_preserve, 1)

          compile(payload, '<reviewed-shared-ancestor-materializer>', 'exec', dont_inherit=True)
          namespace = {'__name__': '__main__'}
          exec(payload, namespace, namespace)
          PY

          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py 2>&1 | tee -a /tmp/nembra-shared-ancestor-materializer.log
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py 2>&1 | tee -a /tmp/nembra-shared-ancestor-materializer.log

      - name: Retain materialization diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-generated-shared-ancestor-materializer-${{ github.sha }}
          path: /tmp/nembra-shared-ancestor-materializer.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify permanent three-path repair
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/capture-generated-shared-ancestor-cache-materialize-once.yml \
            .github/workflows/capture-generated-shared-ancestor-rearm.yml
          git add \
            .github/workflows/capture-generated-shared-ancestor-continuity.yml \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git diff --cached --check
          changed="$(git diff --cached --name-only "$EXACT_PARENT" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-generated-shared-ancestor-continuity.yml \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Retain reviewed permanent payload
        uses: actions/upload-artifact@v4
        with:
          name: capture-generated-shared-ancestor-reviewed-payload-${{ github.sha }}
          path: |
            .github/workflows/capture-generated-shared-ancestor-continuity.yml
            scripts/ci/capture_accepted_build_input_snapshot.py
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          if-no-files-found: error
          retention-days: 7
