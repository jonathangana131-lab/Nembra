name: Temporary Capture Current Premium AX Truth Convergence

on:
  push:
    branches:
      - recovery/v14-capture-current-premium-ax-truth-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compose guarded current-parent premium root
        shell: bash
        run: |
          set -euo pipefail
          base='1bfdb77bd1bdeb97a434570e7c23c5dbefe72c82'
          premium='3c1d4394b7b443936240131e6d0d91ca01e49383'
          git merge-base --is-ancestor "$base" HEAD
          git fetch --no-tags origin "$premium"

          before="$(git diff --name-only "$base"...HEAD | sort)"
          expected=$'.github/workflows/tmp-v14-capture-current-premium-ax-truth-sol.yml\nscripts/ci/tmp_v14_capture_current_premium_ax_truth_sol.py'
          test "$before" = "$expected"

          python3 scripts/ci/tmp_v14_capture_current_premium_ax_truth_sol.py
          git diff --check

          root='NembraApp/App/NembraCaptureEntrypoint.swift'
          test "$(grep -Fc 'private func rootSection<Content: View>' "$root")" = 1
          test "$(grep -Fc '.accessibilityAddTraits(.isHeader)' "$root")" -ge 1
          grep -Fq 'Build provenance ready' "$root"
          grep -Fq 'Continue to preflight' "$root"
          grep -Fq 'Public build: account metadata only. Bluetooth and physical evidence stay locked.' "$root"
          grep -Fq '.frame(maxWidth: .infinity, minHeight: 50)' "$root"
          grep -Fq '.tint(.cyan)' "$root"
          if sed -n '/private struct CaptureP0Root: View/,/private final class SecureLinkController/p' "$root" | grep -Eq 'private func rootPanel|writeValue|publishDps|queryDps|SIMCTL_CHILD_|NEMBRA_SIMULATION_|\.dynamicTypeSize\('; then
            echo 'Premium root truth/accessibility invariant failed.' >&2
            exit 1
          fi

          git rm .github/workflows/tmp-v14-capture-current-premium-ax-truth-sol.yml
          git rm scripts/ci/tmp_v14_capture_current_premium_ax_truth_sol.py

          after="$(git diff --name-only "$base" | sort)"
          expected_after=$'NembraApp/App/NembraCaptureEntrypoint.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureP0RootVisualAcceptanceTests.swift'
          test "$after" = "$expected_after"

          git config user.name 'nembra-v14-premium-convergence-sol'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$root" Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureP0RootVisualAcceptanceTests.swift
          git commit -m 'fix(capture): converge premium root on final spine'
          git push origin HEAD:${GITHUB_REF_NAME}
