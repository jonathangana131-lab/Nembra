name: Capture account UID fail-closed review materializer

on:
  push:
    branches:
      - review/v14-capture-account-uid-failclosed-7f5b-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Guard reviewed lineage and clean helper scope
        shell: bash
        run: |
          set -euo pipefail
          expected='7f5b655355d04099a687ca570aa7de9b4cbe7bdd'
          git merge-base --is-ancestor "$expected" HEAD^
          mapfile -t changed < <(git diff --name-only "$expected"..HEAD^)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != '.github/workflows/materialize-capture-account-uid-failclosed-review.yml' ]]; then
            printf 'Unexpected pre-materialization scope:\n%s\n' "${changed[*]}" >&2
            exit 78
          fi

      - name: Make account UID custody fail closed before evidence admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = source_path.read_text()

          replacements = [
              (
                  'private func applicationUpdateForEventCustody(_ update: [String: String]) -> [String: String] {',
                  'private func applicationUpdateForEventCustody(_ update: [String: String]) -> [String: String]? {'
              ),
              (
                  '!verifiedAccountUID.isEmpty else { return update }',
                  '!verifiedAccountUID.isEmpty else { return nil }'
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected exact token once: {old!r}; observed {source.count(old)}')
              source = source.replace(old, new)

          admission_anchor = '        applicationUpdateAdmissionsInFlight += 1\n'
          custody_guard = '''        guard let custodySafeUpdate = applicationUpdateForEventCustody(update) else {
              await invalidateSourceAuthority(
                  token: token,
                  message: "Verified account UID custody became unavailable before application evidence admission.",
                  kind: "application_account_uid_custody_unavailable"
              )
              return
          }

          '''
          if source.count(admission_anchor) != 1:
              raise SystemExit(f'expected admission anchor once; observed {source.count(admission_anchor)}')
          source = source.replace(admission_anchor, custody_guard + admission_anchor)

          stale_projection = '            let custodySafeUpdate = applicationUpdateForEventCustody(update)\n'
          if source.count(stale_projection) != 1:
              raise SystemExit(f'expected stale in-do projection once; observed {source.count(stale_projection)}')
          source = source.replace(stale_projection, '')
          source_path.write_text(source)

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift')
          test = test_path.read_text()
          anchor = '    private func section(in source: String, from start: String, to end: String) throws -> Substring {\n'
          addition = '''    @Test("missing earned account UID fails closed before application evidence admission")
              func missingAccountUIDCannotFallBackToRawApplicationEvidence() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let helper = String(try section(
                      in: source,
                      from: "private func applicationUpdateForEventCustody(",
                      to: "private func receivedApplicationUpdate("
                  ))
                  let updateAdmission = String(try section(
                      in: source,
                      from: "private func receivedApplicationUpdate(",
                      to: "private func startWatchdog"
                  ))

                  #expect(helper.contains("-> [String: String]?"))
                  #expect(helper.contains("else { return nil }"))
                  #expect(!helper.contains("else { return update }"))

                  let custodyGuard = try requiredOffset(
                      containing: "guard let custodySafeUpdate = applicationUpdateForEventCustody(update)",
                      in: updateAdmission
                  )
                  let ledgerAdmission = try requiredOffset(
                      containing: "sessionLedger.recordApplicationUpdate",
                      in: updateAdmission
                  )
                  #expect(custodyGuard < ledgerAdmission)
                  #expect(updateAdmission.contains("application_account_uid_custody_unavailable"))
              }

              private func requiredOffset(containing token: String, in source: String) throws -> String.Index {
                  guard let range = source.range(of: token) else {
                      Issue.record("Expected source token missing: \\(token)")
                      throw SourceContractError.sectionMissing
                  }
                  return range.lowerBound
              }

          '''
          if test.count(anchor) != 1:
              raise SystemExit(f'expected test insertion anchor once; observed {test.count(anchor)}')
          test = test.replace(anchor, addition + anchor)
          test_path.write_text(test)
          PY

      - name: Verify narrow review invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          t = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift').read_text()
          receiver = s[s.index('private func receivedApplicationUpdate('):s.index('private func startWatchdog')]
          helper = s[s.index('private func applicationUpdateForEventCustody('):s.index('private func receivedApplicationUpdate(')]
          assert 'else { return update }' not in helper
          assert 'else { return nil }' in helper
          assert 'guard let custodySafeUpdate = applicationUpdateForEventCustody(update)' in receiver
          assert receiver.index('guard let custodySafeUpdate = applicationUpdateForEventCustody(update)') < receiver.index('sessionLedger.recordApplicationUpdate')
          assert 'application_account_uid_custody_unavailable' in receiver
          assert 'log("tuya_application_update", custodySafeUpdate.merging([' in receiver
          assert ') { _, trusted in trusted })' in receiver
          assert 'missingAccountUIDCannotFallBackToRawApplicationEvidence' in t
          PY

      - name: Commit durable reviewed repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-account-uid-failclosed-review.yml
          git config user.name 'nembra-sol'
          git config user.email 'nembra-sol@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
                  .github/workflows/materialize-capture-account-uid-failclosed-review.yml
          git diff --cached --check
          git commit -m 'fix(capture): fail closed account UID event custody'
          git push origin HEAD:review/v14-capture-account-uid-failclosed-7f5b-sol
