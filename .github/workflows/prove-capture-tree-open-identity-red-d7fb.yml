name: Prove Capture tree open identity RED d7fb

on:
  push:
    branches:
      - red/v14-capture-tree-open-identity-d7fb

permissions:
  contents: write

jobs:
  prove-red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product parent and test-only intent
        shell: bash
        run: |
          set -euo pipefail
          base='d7fbec98107098d7aa70f33c3ce0cb6555dab9e0'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/prove-capture-tree-open-identity-red-d7fb.yml' \
            'scripts/ci/tests/test_capture_tuya_private_input_tree_open_identity.py' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Require current product to fail the new adversarial contract
        shell: bash
        run: |
          set -u
          set +e
          python3 scripts/ci/tests/test_capture_tuya_private_input_tree_open_identity.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED unexpectedly passed; do not publish this blocker.' >&2
            exit 1
          fi
          grep -Eq 'FAILED|AssertionError|failure' /tmp/red.log

      - name: Publish clean test-only RED checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prove-capture-tree-open-identity-red-d7fb.yml
          git add .github/workflows/prove-capture-tree-open-identity-red-d7fb.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci(capture): collapse tree open-identity RED scaffold'
          git push origin HEAD:red/v14-capture-tree-open-identity-d7fb
