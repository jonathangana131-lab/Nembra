name: Capture Field Selected Xcode Tool ACL Custody Current

on:
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_field_selected_xcode_tool_acl_custody_current.py
      - .github/workflows/capture-field-selected-xcode-tool-acl-custody-current.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-field-selected-xcode-tool-acl-custody-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selected-xcode-acl-custody:
    name: Reject extended ACL authority on selected Xcode subjects
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile custody regression and parse field installer
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-selected-xcode-acl-pycache"
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_selected_xcode_tool_acl_custody_current.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove leaf and ancestry ACL authority fail closed on real macOS
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/xcodebuild -version
          /usr/bin/python3 -B scripts/ci/tests/test_capture_field_selected_xcode_tool_acl_custody_current.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve physical truth boundary and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'ACL custody validation performs no device discovery, build, install, launch, Bluetooth, Tuya, or physical experiment.\n'
