name: Materialize Capture View Membership Admission

on:
  push:
    branches:
      - sol/v14-capture-view-membership-admission-fd6
    paths:
      - .github/workflows/capture-view-membership-admission-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-view-membership-admission-fd6
          fetch-depth: 0

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='fd6f7b508912d6a956d4ab2f9d5faf7c0049dd56'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-view-membership-admission-materialize.yml' 'scripts/ci/materialize_capture_view_membership_admission.py' | sort)"
          test "$actual" = "$expected"

      - name: Apply lifecycle admission fence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_view_membership_admission.py apply
          python3 scripts/ci/materialize_capture_view_membership_admission.py verify

      - name: Validate exact scope and parse
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/materialize_capture_view_membership_admission.py
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift
          fi
          git diff --check
          parent='fd6f7b508912d6a956d4ab2f9d5faf7c0049dd56'
          changed="$(git diff --name-only "$parent" | grep -v -E '^(\.github/workflows/capture-view-membership-admission-materialize.yml|scripts/ci/materialize_capture_view_membership_admission.py)$' | sort)"
          expected="$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$parent" -- scripts/field/install_one_time_capture.command
          git diff --quiet "$parent" -- NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'private static var activePackageCorrelationOwner: UUID?' NembraApp/App/NembraCaptureEntrypoint.swift
          test "$(grep -Fc 'if dynamicTypeSize.isAccessibilitySize' NembraApp/App/NembraCaptureEntrypoint.swift)" -ge 3

      - name: Publish clean two-path checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-view-membership-admission-materialize.yml
          rm scripts/ci/materialize_capture_view_membership_admission.py
          rm -rf scripts/ci/__pycache__
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): fence membership work to Secure Link lifetime"
          git push origin HEAD:sol/v14-capture-view-membership-admission-fd6
