name: Capture Authenticated Stationary Final GO

on:
  push:
    paths:
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/es80_authenticated_stationary_signed_artifact.py
      - scripts/ci/es80_today_final_go_publication.py
      - scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
      - scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
      - scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
      - scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact_device_custody.py
      - scripts/ci/tests/test_es80_final_go_control_worktree_custody_current.py
      - scripts/ci/tests/test_es80_final_go_control_module_execution_custody.py
      - .github/workflows/capture-authenticated-stationary-final-go.yml
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/es80_authenticated_stationary_signed_artifact.py
      - scripts/ci/es80_today_final_go_publication.py
      - scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
      - scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
      - scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
      - scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact_device_custody.py
      - scripts/ci/tests/test_es80_final_go_control_worktree_custody_current.py
      - scripts/ci/tests/test_es80_final_go_control_module_execution_custody.py
      - .github/workflows/capture-authenticated-stationary-final-go.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-tests:
    name: Authenticated stationary GO authority tests
    # Keep control-plane tests off the scarce self-hosted Mac; no physical install runs in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile and red-team issuer + retained signed artifact authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/es80_authenticated_stationary_signed_artifact.py \
            scripts/ci/tests/test_es80_final_go_control_worktree_custody_current.py \
            scripts/ci/tests/test_es80_final_go_control_module_execution_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact_device_custody.py
          python3 scripts/ci/tests/test_es80_final_go_control_worktree_custody_current.py
          python3 scripts/ci/tests/test_es80_final_go_control_module_execution_custody.py
