name: Apply Capture correlation provenance

on:
  push:
    branches:
      - agent/v14-capture-correlation-export-provenance-sol

permissions:
  contents: write

jobs:
  apply-product-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-correlation-export-provenance-sol
          fetch-depth: 0
      - name: Verify exact convergence parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9891e8c1d81227d62608f1f632d02525756cd3cc"
      - name: Apply deterministic product patch
        run: python3 scripts/ci/apply_capture_correlation_export_provenance.py
      - name: Verify truth boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'targetCorrelationProvenance: correlationProvenance' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'snapshot.observationSeriesIdentity.rawValue.uuidString' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'schemaVersion: 8' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'PassiveBluetoothPowerCycleTargetCorrelation.assess(' NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Commit product and regression only
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/apply_capture_correlation_export_provenance.py
          rm .github/workflows/apply-capture-correlation-export-provenance.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(capture): preserve target-correlation provenance in export'
          git push origin HEAD:agent/v14-capture-correlation-export-provenance-sol
