name: Materialize Current Capture View Membership Fence

on:
  push:
    branches:
      - sol/v14-capture-view-membership-admission-8e4
    paths:
      - .github/workflows/capture-view-membership-admission-8e4-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-view-membership-admission-8e4
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-view-membership-admission-8e4-materialize.yml' 'scripts/ci/materialize_capture_view_membership_admission_8e4.py' | sort)"
          test "$actual" = "$expected"

      - name: Apply screen-lifetime admission fence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_view_membership_admission_8e4.py apply
          python3 scripts/ci/materialize_capture_view_membership_admission_8e4.py verify

      - name: Validate source, scope, and authority preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/materialize_capture_view_membership_admission_8e4.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift
          git diff --check
          parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          test_path='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipAdmissionSourceTests.swift'
          git add -N "$test_path"
          changed="$(git diff --name-only "$parent" | grep -v -E '^(\.github/workflows/capture-view-membership-admission-8e4-materialize.yml|scripts/ci/materialize_capture_view_membership_admission_8e4.py)$' | sort)"
          expected="$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' "$test_path" | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$parent" -- scripts/field/install_one_time_capture.command
          git diff --quiet "$parent" -- NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'private static var activePackageCorrelationOwner: UUID?' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'officialConnectionRequestID = UUID()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'await self.invalidateInternalLifecycle(' NembraApp/App/NembraCaptureEntrypoint.swift
          test "$(grep -Fc 'if dynamicTypeSize.isAccessibilitySize' NembraApp/App/NembraCaptureEntrypoint.swift)" -ge 3

      - name: Publish clean two-path checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-view-membership-admission-8e4-materialize.yml
          rm scripts/ci/materialize_capture_view_membership_admission_8e4.py
          rm -rf scripts/ci/__pycache__
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): fence membership work to Secure Link lifetime"
          git push origin HEAD:sol/v14-capture-view-membership-admission-8e4
