name: Materialize Capture Truth Convergence 1c408

on:
  push:
    branches:
      - "repair/v14-capture-truth-convergence-1c408-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current-product parent and test-only staging
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 3
          test "${changed[0]}" = '.github/workflows/materialize-capture-truth-convergence-1c408-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift'
          test "${changed[2]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkMembershipStatusRevocationSourceTests.swift'

      - name: Materialize trusted provenance and lifecycle status revocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          # 1) SDK application evidence may never override Nembra-owned generation provenance.
          receiver_start = source.index('private func receivedApplicationUpdate(')
          receiver_end = source.index('private func startWatchdog', receiver_start)
          receiver = source[receiver_start:receiver_end]
          old = ''']) { current, _ in current })'''
          new = ''']) { _, trusted in trusted })'''
          if receiver.count(old) != 1:
              raise SystemExit(f'expected one untrusted event-metadata collision closure, found {receiver.count(old)}')
          receiver = receiver.replace(old, new, 1)
          source = source[:receiver_start] + receiver + source[receiver_end:]

          # 2) Every lifecycle path that synchronously revokes membership proof must revoke its
          # operator-facing positive status before async request generations rotate.
          status_line = 'membershipStatus = "Exact scooter membership must be verified again for this Secure Link session."'
          sections = (
              ('func abandonCorrelationForViewExit()', 'func appDidLoseForeground()'),
              ('func appDidLoseForeground()', 'var privateConfig: Bool'),
          )
          for start_token, end_token in sections:
              start = source.index(start_token)
              end = source.index(end_token, start + len(start_token))
              cleanup = source[start:end]
              if 'membershipStatus =' in cleanup:
                  raise SystemExit(f'membership status revocation already present or ambiguous in {start_token}')
              required = (
                  'sdkDeviceMembershipVerified = false',
                  'membershipAccountUID = nil',
                  'membershipDeviceID = nil',
                  'membershipRequestID = UUID()',
              )
              for token in required:
                  if cleanup.count(token) != 1:
                      raise SystemExit(f'ambiguous {token} in {start_token}')
              if not (
                  cleanup.index('sdkDeviceMembershipVerified = false')
                  < cleanup.index('membershipDeviceID = nil')
                  < cleanup.index('membershipRequestID = UUID()')
              ):
                  raise SystemExit(f'membership proof ordering changed in {start_token}')
              request_offset = cleanup.index('membershipRequestID = UUID()')
              line_start = cleanup.rfind('\n', 0, request_offset) + 1
              indentation = cleanup[line_start:request_offset]
              if indentation.strip():
                  raise SystemExit(f'could not derive request indentation in {start_token}')
              cleanup = cleanup[:line_start] + indentation + status_line + '\n' + cleanup[line_start:]
              source = source[:start] + cleanup + source[end:]

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify converged truth boundaries and foreground preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')

          receiver_start = s.index('private func receivedApplicationUpdate(')
          receiver_end = s.index('private func startWatchdog', receiver_start)
          receiver = s[receiver_start:receiver_end]
          assert 'log("tuya_application_update"' in receiver
          assert '"generation": String(token.diagnosticGeneration)' in receiver
          assert ']) { _, trusted in trusted })' in receiver
          assert ']) { current, _ in current })' not in receiver
          assert 'recordApplicationUpdate' in receiver
          assert 'currentConnectionToken == token' in receiver

          status = 'membershipStatus = "Exact scooter membership must be verified again for this Secure Link session."'
          view_exit_start = s.index('func abandonCorrelationForViewExit()')
          foreground_start = s.index('func appDidLoseForeground()', view_exit_start)
          private_config = s.index('var privateConfig: Bool', foreground_start)
          view_exit = s[view_exit_start:foreground_start]
          foreground = s[foreground_start:private_config]

          for name, cleanup in (('view exit', view_exit), ('foreground loss', foreground)):
              clear_verified = cleanup.index('sdkDeviceMembershipVerified = false')
              clear_account = cleanup.index('membershipAccountUID = nil')
              clear_device = cleanup.index('membershipDeviceID = nil')
              reset_status = cleanup.index(status)
              revoke_membership = cleanup.index('membershipRequestID = UUID()')
              assert clear_verified < reset_status < revoke_membership, name
              assert clear_account < reset_status < revoke_membership, name
              assert clear_device < reset_status < revoke_membership, name
              assert 'membership verified and leased' not in cleanup.lower(), name

          # Preserve the just-accepted foreground-integrity architecture from product 1c408.
          assert 'foregroundIntegrityLossHandled = true' in foreground
          assert 'guard currentConnectionToken == nil else { return }' in s
          assert 'if foregroundIntegrityLossHandled { return }' in view_exit
          assert 'abandonPackageCorrelation()' in foreground
          assert 'Task { @MainActor [self] in' in foreground
          assert 'guard self.currentConnectionToken == token else { return }' in foreground
          assert '@Environment(\\.scenePhase) private var scenePhase' in s
          assert '.onChange(of: scenePhase)' in s

          for cleanup in (receiver, view_exit, foreground):
              for forbidden in (
                  'queryDps', 'publishDps', 'writeValue', 'writeWithoutResponse', 'disconnectBLE'
              ):
                  assert forbidden not in cleanup, forbidden

          print('Capture current truth convergence contract: PASS')
          PY
          git diff --check

      - name: Collapse helper into clean three-path convergence
        shell: bash
        run: |
          set -euo pipefail
          parent='1c40853f6991b4d09206df1d25ecff021458b7eb'
          rm .github/workflows/materialize-capture-truth-convergence-1c408-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkMembershipStatusRevocationSourceTests.swift
          git add -u .github/workflows/materialize-capture-truth-convergence-1c408-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' \
            commit -m 'fix(capture): converge provenance and membership status truth'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 3
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift'
          test "${changed[2]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkMembershipStatusRevocationSourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:repair/v14-capture-truth-convergence-1c408-sol
