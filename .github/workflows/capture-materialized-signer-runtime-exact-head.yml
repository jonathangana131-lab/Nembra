name: Capture Materialized Signer Runtime Exact-Head

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - 'scripts/ci/es80_run_materialized_field_authorization_signer.py'
      - 'scripts/ci/es80_materialize_field_authorization_signer_runtime.py'
      - 'scripts/ci/es80_materialize_field_authorization_signer_bundle.py'
      - 'scripts/ci/es80_sign_field_authorization_from_rendezvous.py'
      - 'scripts/ci/es80_field_authorization_rendezvous.py'
      - 'scripts/ci/es80_field_authorization_envelope.py'
      - 'scripts/ci/es80_signed_field_artifact_evidence.py'
      - 'scripts/ci/tests/test_es80_materialized_field_authorization_signer_runtime.py'
      - 'scripts/ci/tests/test_es80_materialized_field_authorization_signer_execution_snapshot.py'
      - '.github/workflows/capture-materialized-signer-runtime-exact-head.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: capture-materialized-signer-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Materialized signer runtime / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout immutable pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact pull-request subject
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          /usr/bin/git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          /usr/bin/git diff --check "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"

      - name: Exercise materialized signer runtime and ephemeral signing
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile \
            scripts/ci/es80_run_materialized_field_authorization_signer.py \
            scripts/ci/es80_materialize_field_authorization_signer_runtime.py \
            scripts/ci/tests/test_es80_materialized_field_authorization_signer_runtime.py \
            scripts/ci/tests/test_es80_materialized_field_authorization_signer_execution_snapshot.py
          /usr/bin/python3 scripts/ci/tests/test_es80_materialized_field_authorization_signer_runtime.py
          /usr/bin/python3 scripts/ci/tests/test_es80_materialized_field_authorization_signer_execution_snapshot.py
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"

      - name: Reject pull-request head movement
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            })
            const pr = response.data
            if (pr.state !== 'open') {
              core.setFailed('Pull request closed during materialized signer runtime validation.')
            }
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Pull request source repository changed during validation.')
            }
            if (pr.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              core.setFailed('Pull request head moved; this run is stale and non-evidence.')
            }
