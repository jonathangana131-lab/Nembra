name: Temporary clean Capture AX copy truth materializer

on:
  push:
    branches:
      - recovery/v14-capture-final-ax-copy-truth-sol
    paths:
      - .github/workflows/tmp-capture-ax-copy-clean-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: recovery/v14-capture-final-ax-copy-truth-sol
          fetch-depth: 2
          persist-credentials: true

      - name: Apply exact build-authority copy repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fd1ba71c3f3df0f2a0a78b445138c85cb05c1181"
          python3 <<'PY'
          from pathlib import Path

          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = app.read_text()
          old = 'Text("Account setup only in this public build.")'
          new = 'Text(fieldBuildIsAuthoritative ? "Account metadata only here. Bluetooth stays locked until preflight verifies account and scooter authority." : "Account setup only in this public build.")'
          if source.count(old) != 1:
              raise SystemExit(f'expected one AX copy occurrence, found {source.count(old)}')
          app.write_text(source.replace(old, new, 1))

          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift')
          tests = test.read_text()
          old_test = '#expect(root.contains("Account setup only in this public build."))'
          new_test = '#expect(root.contains("fieldBuildIsAuthoritative ? \\"Account metadata only here. Bluetooth stays locked until preflight verifies account and scooter authority.\\" : \\"Account setup only in this public build.\\""))'
          if tests.count(old_test) != 1:
              raise SystemExit(f'expected one AX copy assertion, found {tests.count(old_test)}')
          test.write_text(tests.replace(old_test, new_test, 1))
          PY
          git diff --check

      - name: Commit product-only result and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nembra Capture Closure'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-capture-ax-copy-clean-materializer.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          git diff --cached --check
          git commit -m 'fix(capture): scope AX account copy to build authority'
          git push origin HEAD:recovery/v14-capture-final-ax-copy-truth-sol
