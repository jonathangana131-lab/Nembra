name: Capture Final GO Sealed Record Handoff

on:
  push:
    branches:
      - repair/v14-final-go-sealed-record-handoff-sol-20260811
    paths:
      - scripts/ci/es80_authenticated_stationary_private_review_final_go.py
      - scripts/ci/tests/test_es80_final_go_sealed_record_handoff.py
      - scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py
      - scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py
      - .github/workflows/capture-final-go-continuous-tracked-tree-custody.yml
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_private_review_final_go.py
      - scripts/ci/tests/test_es80_final_go_sealed_record_handoff.py
      - scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py
      - scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py
      - .github/workflows/capture-final-go-continuous-tracked-tree-custody.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sealed-record-handoff:
    name: Seal source authority before tracked-tree release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXACT_PARENT: cb36f9265f08708c8e47564f62f4857aeae7af0f
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/nembra-finalgo-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact continuous-custody parent and five-path successor
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          mapfile -t changed < <(git diff --name-only "$EXACT_PARENT" HEAD | LC_ALL=C sort)
          expected=(
            .github/workflows/capture-final-go-continuous-tracked-tree-custody.yml
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py
            scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py
            scripts/ci/tests/test_es80_final_go_sealed_record_handoff.py
            scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile sealed handoff and inherited authority contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_private_review_final_go.py \
            scripts/ci/tests/test_es80_final_go_sealed_record_handoff.py \
            scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py \
            scripts/ci/tests/test_es80_final_go_git_object_chain_custody.py \
            scripts/ci/tests/test_es80_final_go_descriptor_read_custody.py \
            scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py

      - name: Prove detached authority handoff before release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_final_go_sealed_record_handoff.py

      - name: Preserve immediate parent execution custody
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_private_review_committed_parent_execution_custody.py

      - name: Preserve continuous whole-tree mutation custody
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_final_go_continuous_tracked_tree_custody.py

      - name: Preserve object-chain descriptor and raw-candidate authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_final_go_git_object_chain_custody.py
          python3 scripts/ci/tests/test_es80_final_go_descriptor_read_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_private_review_final_go.py \
            CandidateRawFilesystemAuthorityTests.test_child_executes_exact_2873_parent_blob \
            CandidateRawFilesystemAuthorityTests.test_inherited_parent_candidate_runs_through_raw_authority \
            CandidateRawFilesystemAuthorityTests.test_core_worktree_decoy_cannot_redirect_physical_candidate

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$EXACT_PARENT" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
