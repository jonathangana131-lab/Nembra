name: App Icon Source Repair

on:
  push:
    branches:
      - parallel/utility-app-icon-source-check/chat-n4x7p

permissions:
  contents: write

env:
  TARGET_BRANCH: parallel/product-identity-app-icon/chat-n4x7p
  EXPECTED_TARGET_HEAD: e6c4d3311e6d9df67f90c5a256cfdad1e47c79a8

jobs:
  regenerate-corrupt-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact owned product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Fail closed if product head moved
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_TARGET_HEAD" || {
            echo "Product head moved: expected $EXPECTED_TARGET_HEAD, found $actual" >&2
            exit 1
          }

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned Pillow
        run: python -m pip install --disable-pip-version-check Pillow==12.2.0

      - name: Regenerate PNGs from the checked-in source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_nembra_app_icon.py
          python scripts/generate_nembra_app_icon.py --check

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('NembraApp/Resources/Assets.xcassets/AppIcon.appiconset')
          expected = {
              'NembraAppIcon-default.png': ('RGB', False),
              'NembraAppIcon-dark.png': ('RGBA', True),
              'NembraAppIcon-tinted.png': ('L', False),
          }

          for filename, (mode, needs_transparency) in expected.items():
              path = root / filename
              with Image.open(path) as image:
                  image.load()
                  assert image.size == (1024, 1024), (filename, image.size)
                  assert image.mode == mode, (filename, image.mode)
                  if needs_transparency:
                      alpha_min, alpha_max = image.getchannel('A').getextrema()
                      assert alpha_min == 0 and alpha_max == 255, (
                          filename,
                          alpha_min,
                          alpha_max,
                      )
              print(f'{filename}: decodes as 1024x1024 {mode}')
          PY

      - name: Prove the repair is asset-only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test -n "$changed" || {
            echo 'Expected corrupt PNG repair to change at least one asset.' >&2
            exit 1
          }

          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^NembraApp/Resources/Assets\.xcassets/AppIcon\.appiconset/NembraAppIcon-(default|dark|tinted)\.png$' || true)"
          test -z "$unexpected" || {
            echo 'Unexpected changed paths:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }

          printf '%s\n' "$changed"
          git diff --check

      - name: Commit and push without rewriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse FETCH_HEAD)"
          test "$remote_head" = "$EXPECTED_TARGET_HEAD" || {
            echo "Remote product head moved before repair: $remote_head" >&2
            exit 1
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            NembraApp/Resources/Assets.xcassets/AppIcon.appiconset/NembraAppIcon-default.png \
            NembraApp/Resources/Assets.xcassets/AppIcon.appiconset/NembraAppIcon-dark.png \
            NembraApp/Resources/Assets.xcassets/AppIcon.appiconset/NembraAppIcon-tinted.png
          git diff --cached --check
          git commit -m '[product-identity] Regenerate app icons from source'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Repaired product head: $(git rev-parse HEAD)"
          git hash-object \
            NembraApp/Resources/Assets.xcassets/AppIcon.appiconset/NembraAppIcon-default.png \
            NembraApp/Resources/Assets.xcassets/AppIcon.appiconset/NembraAppIcon-dark.png \
            NembraApp/Resources/Assets.xcassets/AppIcon.appiconset/NembraAppIcon-tinted.png
