name: TEMP V14 Capture HTTPS transport repair

on:
  push:
    branches:
      - repair/v14-capture-https-transport-sol

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate HTTPS transport boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/temp_v14_capture_https_transport_repair.py
          git diff --check

      - name: Commit durable repair and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-v14-capture-https-transport-repair.yml
          rm -f scripts/ci/temp_v14_capture_https_transport_repair.py
          git add -A
          git diff --cached --check
          git config user.name "nembra-v14-sol"
          git config user.email "nembra-v14-sol@users.noreply.github.com"
          git commit -m "fix(capture): require HTTPS for Tuya account transport"
          git push origin HEAD:repair/v14-capture-https-transport-sol
