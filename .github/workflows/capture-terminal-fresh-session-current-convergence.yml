name: Capture terminal fresh-session current convergence

on:
  push:
    branches:
      - integration/es80-v14-terminal-current-convergence/chatgpt56-thinking-go
    paths:
      - .github/workflows/capture-terminal-fresh-session-current-convergence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-terminal-current-convergence/chatgpt56-thinking-go
          fetch-depth: 2

      - name: Verify exact staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2011fb73ed297d8b5b3adb710f351d3a6268a658"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-terminal-fresh-session-current-convergence.yml"

      - name: Apply reviewed terminal fresh-session delta
        shell: bash
        run: |
          set -euo pipefail
          base=50732571e01929ef22c79bd7f99178cf4f78a6bf
          source=28c9dde0398d14f353415b860d806215d597792b
          controller=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          gate=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          controller_test=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerTerminalFreshSessionConsumerTests.swift
          gate_test=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothTerminalRealRecorderReopenTests.swift

          git fetch --no-tags origin "$base" "$source"
          git diff --binary "$base" "$source" -- "$controller" > /tmp/terminal-controller.patch
          git diff --binary "$base" "$source" -- "$gate" > /tmp/terminal-gate.patch
          test -s /tmp/terminal-controller.patch
          test -s /tmp/terminal-gate.patch
          git apply --3way --index /tmp/terminal-controller.patch
          git apply --3way --index /tmp/terminal-gate.patch

          mkdir -p "$(dirname "$controller_test")"
          git show "$source:$controller_test" > "$controller_test"
          git show "$source:$gate_test" > "$gate_test"
          git add "$controller_test" "$gate_test"

          rm .github/workflows/capture-terminal-fresh-session-current-convergence.yml
          git add -u .github/workflows/capture-terminal-fresh-session-current-convergence.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "5"
          test -f "$controller_test"
          test -f "$gate_test"
          test ! -e .github/workflows/capture-terminal-fresh-session-current-convergence.yml

      - name: Commit exact product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-chatgpt56-thinking"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: consume terminal resolution into exact fresh recorder on current Capture spine"
          git push origin HEAD:integration/es80-v14-terminal-current-convergence/chatgpt56-thinking-go
