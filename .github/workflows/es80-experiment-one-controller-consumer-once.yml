name: ES80 Experiment One controller consumer one-shot

on:
  push:
    branches:
      - agent/es80-experiment-one-controller-consumer-v14

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Assert exact staged ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=9876d5597a5b0e60c66fe4fe3966c29f405367d1
          git merge-base --is-ancestor "$BASE" HEAD
          ACTUAL="$(git diff --name-only "$BASE" HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/es80-experiment-one-controller-consumer-once.yml' \
            'scripts/ci/es80_experiment_one_controller_consumer_once.py' | sort)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Apply controller admission consumer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/es80_experiment_one_controller_consumer_once.py

      - name: Verify exact product shape
        shell: bash
        run: |
          set -euo pipefail
          CONTROLLER=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneAdmissionContractTests.swift
          test -f "$TEST"
          test "$(grep -c 'admission.consume()' "$CONTROLLER")" -eq 1
          test "$(grep -c 'PassiveCoreBluetoothCaptureRecorder(' "$CONTROLLER")" -eq 1
          grep -F 'recorder = payload.recorder' "$CONTROLLER"
          grep -F 'targetState.selectTarget(payload.peripheralIdentifier)' "$CONTROLLER"
          ! grep -F 'public func connectUsingExperimentOneAdmission(' "$CONTROLLER"

      - name: Commit product result and remove one-shot scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/es80-experiment-one-controller-consumer-once.yml
          rm scripts/ci/es80_experiment_one_controller_consumer_once.py
          git config user.name 'nembra-v14-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          ACTUAL="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/es80-experiment-one-controller-consumer-once.yml' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneAdmissionContractTests.swift' \
            'scripts/ci/es80_experiment_one_controller_consumer_once.py' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git commit -m 'Consume sealed Experiment One admission in controller'
          git push origin HEAD:${GITHUB_REF_NAME}
