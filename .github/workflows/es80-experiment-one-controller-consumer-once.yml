name: ES80 Experiment One controller consumer one-shot

on:
  push:
    branches:
      - agent/es80-experiment-one-controller-consumer-v14

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assert exact source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9876d5597a5b0e60c66fe4fe3966c29f405367d1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/es80-experiment-one-controller-consumer-once.yml"

      - name: Apply exact controller admission consumer
        shell: python
        run: |
          from pathlib import Path

          controller_path = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          source = controller_path.read_text()
          if "func connectUsingExperimentOneAdmission(" in source:
              raise SystemExit("Experiment One controller consumer already exists")

          anchor = """    /// Cancels the active attempt without allowing a subsequent attempt to the\n    /// same CoreBluetooth peripheral until one of its terminal callbacks arrives.\n"""
          if source.count(anchor) != 1:
              raise SystemExit(f"expected one insertion anchor, found {source.count(anchor)}")

          method = r'''    /// Consumes one package-issued Experiment One admission and connects only to
    /// the exact full CoreBluetooth UUID that the completed four-window producer
    /// correlated. The run-owned recorder is installed directly; this path never
    /// creates or substitutes a second recorder and never treats correlation as
    /// physical ES80 authentication.
    ///
    /// The admission is intentionally consumed before UUID catalog validation. If
    /// the correlated target is no longer in this controller's current discovery
    /// epoch, the one-shot handoff is burned and Experiment One must reacquire fresh
    /// correlation evidence rather than replay stale authority.
    func connectUsingExperimentOneAdmission(
        _ admission: PassiveBluetoothExperimentOneCaptureAdmission,
        timeout: TimeInterval = 12
    ) throws {
        try ensureCaptureHealthy()
        guard !observationBoundaryQueueGate.isTerminal else {
            throw ControllerError.captureFinalized
        }
        guard !observationBoundaryBlocksArtifactMutation else {
            throw ControllerError.captureIncomplete
        }
        guard centralManager.state == .poweredOn else {
            throw ControllerError.bluetoothNotPoweredOn
        }
        guard let timeoutNanoseconds = PassiveCoreBluetoothAcquisitionPolicy.connectionTimeoutNanoseconds(timeout) else {
            throw ControllerError.invalidConnectionTimeout
        }
        guard connectionPhase == .idle else {
            throw ControllerError.connectionAlreadyActive
        }
        // Experiment One owns one sealed provenance life. Never splice its recorder
        // into a controller that already has a durable target session.
        guard recorder == nil, targetState.selectedTargetIdentifier == nil else {
            throw ControllerError.captureIncomplete
        }

        let payload = try admission.consume()
        guard let peripheral = peripheralByIdentifier[payload.peripheralIdentifier],
              let discovery = latestDiscoveryByIdentifier[payload.peripheralIdentifier] else {
            throw ControllerError.unknownPeripheral(payload.peripheralIdentifier)
        }
        guard peripheral.identifier == payload.peripheralIdentifier else {
            throw ControllerError.unknownPeripheral(payload.peripheralIdentifier)
        }
        if discovery.isConnectable == false {
            throw ControllerError.peripheralNotConnectable(payload.peripheralIdentifier)
        }

        do {
            try targetState.validateCanBeginAttempt(for: payload.peripheralIdentifier)
        } catch PassiveCoreBluetoothTargetState.StateError.peripheralAwaitingTerminalCallback(let identifier) {
            throw ControllerError.peripheralAwaitingTerminalCallback(identifier)
        } catch PassiveCoreBluetoothTargetState.StateError.generationExhausted {
            throw ControllerError.attemptGenerationExhausted
        } catch {
            throw ControllerError.targetNotSelected
        }

        guard targetSessionGeneration != UInt64.max else {
            throw ControllerError.captureFailed
        }
        guard observationBoundaryQueueGate.resetForNewCaptureSession() else {
            throw ControllerError.captureIncomplete
        }
        committedReadyEpoch = nil

        let previousAuthority = currentArtifactAuthorityContext()
        let freshAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
            targetSessionGeneration: targetSessionGeneration + 1,
            authorityGeneration: 1
        )
        do {
            try artifactAuthorityFence.transition(
                from: previousAuthority,
                to: freshAuthority
            )
        } catch {
            failCapture(error)
            throw ControllerError.captureFailed
        }
        targetSessionGeneration = freshAuthority.targetSessionGeneration
        artifactAuthorityGeneration = freshAuthority.authorityGeneration
        lastFinalizedArtifactAuthority = nil

        targetState.selectTarget(payload.peripheralIdentifier)
        acquisitionLedger.beginTargetSession()
        gattIdentityRegistry.reset()
        selectedTargetCancellationPending = false
        foregroundEvidenceIntegrityValid = true
        hasUsedInitialSessionIdentity = true
        recorder = payload.recorder

        // Do not backfill this recorder with an advertisement observed before the
        // admission was consumed. Four-window correlation owns that earlier evidence;
        // this recorder begins with post-admission transport/GATT evidence.
        do {
            _ = try targetState.beginAttempt(for: payload.peripheralIdentifier)
        } catch PassiveCoreBluetoothTargetState.StateError.peripheralAwaitingTerminalCallback(let identifier) {
            throw ControllerError.peripheralAwaitingTerminalCallback(identifier)
        } catch PassiveCoreBluetoothTargetState.StateError.generationExhausted {
            throw ControllerError.attemptGenerationExhausted
        } catch {
            throw ControllerError.targetNotSelected
        }

        acquisitionLedger.beginConnectionAttempt()
        selectedTargetCancellationPending = false
        guard advanceArtifactAuthority() else {
            throw ControllerError.captureFailed
        }

        stopScanning()
        connectionPhase = .connecting(payload.peripheralIdentifier)
        activePeripheral = peripheral
        peripheral.delegate = self
        centralManager.connect(peripheral, options: nil)
        scheduleConnectionTimeout(for: peripheral, nanoseconds: timeoutNanoseconds)
    }

'''
          controller_path.write_text(source.replace(anchor, method + anchor))

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneAdmissionContractTests.swift")
          if test_path.exists():
              raise SystemExit(f"unexpected existing test: {test_path}")
          test_path.write_text(r'''import Foundation
import Testing
@testable import NembraBluetoothCapture

/// Source-level ownership contract for the first controller consumer of the sealed
/// Experiment One admission. Software provenance only; no physical ES80 claim.
struct ForegroundCoreBluetoothCaptureControllerExperimentOneAdmissionContractTests {
    private static func controllerSource() throws -> String {
        let testFile = URL(fileURLWithPath: #filePath)
        let packageRoot = testFile
            .deletingLastPathComponent()
            .deletingLastPathComponent()
            .deletingLastPathComponent()
        return try String(
            contentsOf: packageRoot
                .appendingPathComponent("Sources")
                .appendingPathComponent("NembraBluetoothCapture")
                .appendingPathComponent("ForegroundCoreBluetoothCaptureController.swift"),
            encoding: .utf8
        )
    }

    private static func codeOnly(_ source: String) -> String {
        source
            .split(separator: "\n", omittingEmptySubsequences: false)
            .map { line in
                guard let comment = line.range(of: "//") else { return String(line) }
                return String(line[..<comment.lowerBound])
            }
            .joined(separator: "\n")
    }

    @Test("controller consumes sealed Experiment One admission exactly once without public app authority")
    func admissionIsPackageOwnedOneShotAuthority() throws {
        let source = Self.codeOnly(try Self.controllerSource())
        #expect(source.contains("func connectUsingExperimentOneAdmission("))
        #expect(!source.contains("public func connectUsingExperimentOneAdmission("))
        #expect(source.components(separatedBy: "admission.consume()").count - 1 == 1)
        #expect(source.contains("let payload = try admission.consume()"))
    }

    @Test("consumed full UUID must exist in this controller's current catalog")
    func consumedTargetMustBeFreshlyDiscoveredByThisController() throws {
        let source = Self.codeOnly(try Self.controllerSource())
        #expect(source.contains("peripheralByIdentifier[payload.peripheralIdentifier]"))
        #expect(source.contains("latestDiscoveryByIdentifier[payload.peripheralIdentifier]"))
        #expect(source.contains("targetState.selectTarget(payload.peripheralIdentifier)"))
    }

    @Test("Experiment One installs the exact run-owned recorder without generic recorder creation")
    func exactRunOwnedRecorderIsInstalled() throws {
        let source = Self.codeOnly(try Self.controllerSource())
        #expect(source.contains("recorder = payload.recorder"))
        #expect(!source.contains("beginTargetSessionIfNeeded(for: payload.peripheralIdentifier)"))
        #expect(!source.contains("connect(to: payload.peripheralIdentifier"))
        #expect(source.components(separatedBy: "PassiveCoreBluetoothCaptureRecorder(").count - 1 == 1)
    }

    @Test("sealed admission cannot be spliced into an existing durable target session")
    func existingTargetSessionFailsBeforeAdmissionConsumption() throws {
        let source = Self.codeOnly(try Self.controllerSource())
        guard let start = source.range(of: "func connectUsingExperimentOneAdmission("),
              let end = source.range(of: "public func cancelActiveConnection()", range: start.upperBound..<source.endIndex) else {
            Issue.record("could not isolate Experiment One consumer body")
            return
        }
        let body = String(source[start.lowerBound..<end.lowerBound])
        let sessionGuard = try #require(body.range(of: "guard recorder == nil"))
        let consumption = try #require(body.range(of: "let payload = try admission.consume()"))
        #expect(sessionGuard.lowerBound < consumption.lowerBound)
    }
}
''')

          updated = controller_path.read_text()
          required = [
              "func connectUsingExperimentOneAdmission(",
              "let payload = try admission.consume()",
              "peripheralByIdentifier[payload.peripheralIdentifier]",
              "latestDiscoveryByIdentifier[payload.peripheralIdentifier]",
              "targetState.selectTarget(payload.peripheralIdentifier)",
              "recorder = payload.recorder",
          ]
          for token in required:
              if token not in updated:
                  raise SystemExit(f"missing required token: {token}")
          if updated.count("admission.consume()") != 1:
              raise SystemExit("admission consumption must be exactly one-shot in controller source")
          if updated.count("PassiveCoreBluetoothCaptureRecorder(") != 1:
              raise SystemExit("controller must retain exactly one generic recorder constructor")
          for forbidden in (
              "beginTargetSessionIfNeeded(for: payload.peripheralIdentifier)",
              "connect(to: payload.peripheralIdentifier",
              "public func connectUsingExperimentOneAdmission(",
          ):
              if forbidden in updated:
                  raise SystemExit(f"forbidden consumer shape: {forbidden}")

      - name: Commit product result and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/es80-experiment-one-controller-consumer-once.yml
          git config user.name "nembra-v14-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneAdmissionContractTests.swift \
                  .github/workflows/es80-experiment-one-controller-consumer-once.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            '.github/workflows/es80-experiment-one-controller-consumer-once.yml' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOneAdmissionContractTests.swift' | sort)"
          git commit -m "Consume sealed Experiment One admission in controller"
          git push origin HEAD:${GITHUB_REF_NAME}
