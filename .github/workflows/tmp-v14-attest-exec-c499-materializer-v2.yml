name: Temporary V14 attest-exec c499 materializer v2
on:
  push:
    branches: [repair/v14-signed-origin-attest-exec-c499-sol-20260812-go2]
permissions:
  contents: write
concurrency:
  group: tmp-v14-attest-exec-c499-materializer-v2
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Bind exact moved parent and temporary-only branch
        shell: bash
        env:
          EXACT_PARENT: c4996ea91cc3482ca8a8d661fd1436a2eee745df
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          actual="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/tmp-v14-attest-exec-c499-materializer-v2.yml .github/workflows/tmp-v14-attest-exec-c499-materializer.yml | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - name: Materialize same-process authority boundary
        shell: bash
        env:
          PROVEN_IMPL: bace66cbce401568ef97e2898eba1e894c28df60
        run: |
          set -euo pipefail
          git show "$PROVEN_IMPL:scripts/ci/capture_signed_app_build_origin_custody.py" > scripts/ci/capture_signed_app_build_origin_custody.py
          python3 - <<'PY'
          from pathlib import Path

          pre = Path("scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py")
          s = pre.read_text(encoding="utf-8")
          old = '''            "identity_create": "_create_local_build_identity(build_name, build_uid, build_gid, home)",
                      "group_attestation": "_attest_build_identity_groups(\\n            build_name,",
                      "image": "_create_apfs_image(image)",
                      "attach_rw": "writable_device = _attach_apfs(image, mountpoint, readonly=False)",
          '''
          new = '''            "identity_create": "_create_local_build_identity(build_name, build_uid, build_gid, home)",
                      "image": "_create_apfs_image(image)",
                      "attach_rw": "writable_device = _attach_apfs(image, mountpoint, readonly=False)",
                      "group_attestation": "attested_command = _credential_attesting_exec_command(\\n            guarded_command,",
          '''
          if s.count(old) != 1: raise SystemExit("expected one marker-order block")
          s = s.replace(old, new, 1)
          old = '        self.assertLess(indexes["group_attestation"], indexes["image"])\n'
          new = '        self.assertLess(indexes["attach_rw"], indexes["group_attestation"])\n        self.assertLess(indexes["group_attestation"], indexes["spawn"])\n'
          if s.count(old) != 1: raise SystemExit("expected one old group-attestation ordering assertion")
          s = s.replace(old, new, 1)
          old = '''        self.assertIn("if effective != expected:", source)
                  self.assertIn("if effective.intersection(field_only):", source)
          '''
          new = '''        self.assertIn("attested_command = _credential_attesting_exec_command(", source)
                  self.assertIn("build = subprocess.run(\\n            attested_command,", source)
                  self.assertIn("raw_groups=sorted(set(os.getgroups()))", source)
                  self.assertIn("if not identity_exact or not groups_exact or field_only_leak:", source)
                  self.assertIn("os.execve(command[0], command, os.environ)", source)
                  self.assertIn("effectiveZeroSupplementaryGroupsClaim':False", source)
                  self.assertNotIn("def _attest_build_identity_groups(", source)
          '''
          if s.count(old) != 1: raise SystemExit("expected one old group-source assertion block")
          s = s.replace(old, new, 1)
          start = s.index("    def test_effective_build_groups_must_match_fresh_directory_service_baseline")
          end = s.index("    def test_verified_identity_retirement_requires_name_and_numeric_absence", start)
          s = s[:start] + r'''    def test_credential_attesting_exec_binds_fresh_ds_baseline_to_same_compiler_process(self) -> None:
                  helper = load(ORIGIN_HELPER, "capture_signed_app_build_origin_custody_attest_exec")
                  with mock.patch.object(helper.os, "getgrouplist", return_value=[12, 61, 100, 701, 55001]):
                      wrapped = helper._credential_attesting_exec_command(
                          ["/usr/bin/true", "accepted-compiler-argument"], name="nembrabuildtest",
                          uid=55001, gid=55001, field_groups=(20, 33, 61, 80, 701),
                      )
                  self.assertEqual(wrapped[:4], ["/usr/bin/python3", "-B", "-I", "-c"])
                  child_source = wrapped[4]
                  contract = helper.json.loads(wrapped[5])
                  self.assertEqual(contract["effectiveGroups"], [12, 61, 100, 701])
                  self.assertEqual(contract["fieldOnlyGroups"], [20, 33, 80])
                  self.assertEqual(wrapped[6:], ["/usr/bin/true", "accepted-compiler-argument"])
                  self.assertIn("os.getgroups()", child_source)
                  self.assertIn("raise SystemExit(126)", child_source)
                  self.assertIn("os.execve(command[0], command, os.environ)", child_source)
                  self.assertIn("effectiveZeroSupplementaryGroupsClaim", child_source)
                  with self.assertRaises(helper.BuildOriginCustodyError):
                      helper._credential_attesting_exec_command(
                          ["xcodebuild"], name="nembrabuildtest", uid=55001, gid=55001, field_groups=(),
                      )

          ''' + s[end:]
          pre.write_text(s, encoding="utf-8")

          p = Path("scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py")
          w = p.read_text(encoding="utf-8")
          start = w.index("        try:\n            build_directory_groups = helper._attest_build_identity_groups(")
          end = w.index("\n\n        helper._create_apfs_image(image)", start)
          w = w[:start] + w[end + 2:]
          old = '''        build = subprocess.run(
                      command,
                      cwd=source_root,
          '''
          new = '''        attested_command = helper._credential_attesting_exec_command(
                      command, name=build_name, uid=build_uid, gid=build_gid, field_groups=field_groups,
                  )
                  build = subprocess.run(
                      attested_command,
                      cwd=source_root,
          '''
          if w.count(old) != 1: raise SystemExit("expected one real-Xcode launch")
          w = w.replace(old, new, 1)
          gate = '''        if build.returncode != 0:
                      emit_error(
          '''
          att = '''        credential_records = [
                      line[len(helper.GROUP_ATTESTOR_MARKER):]
                      for line in (build.stdout or "").splitlines()
                      if line.startswith(helper.GROUP_ATTESTOR_MARKER)
                  ]
                  if len(credential_records) != 1:
                      emit_error("effective-credentials", "missing or ambiguous same-process build credential attestation", build_output=build.stdout)
                      return 72
                  try:
                      credential_attestation = json.loads(credential_records[0])
                  except json.JSONDecodeError:
                      emit_error("effective-credentials", "same-process build credential attestation is malformed", build_output=build.stdout)
                      return 72
                  if not (credential_attestation.get("identityExact") is True and credential_attestation.get("groupsExact") is True and credential_attestation.get("fieldOnlyLeak") == [] and credential_attestation.get("effectiveZeroSupplementaryGroupsClaim") is False):
                      emit_error("effective-credentials", "same-process compiler credential authority rejected", build_output=build.stdout)
                      return 72
                  expected_effective_groups = credential_attestation.get("expectedEffectiveGroups")
                  if not isinstance(expected_effective_groups, list) or any(not isinstance(group, int) for group in expected_effective_groups):
                      emit_error("effective-credentials", "same-process credential baseline is malformed", build_output=build.stdout)
                      return 72
                  build_directory_groups = sorted(set([build_gid, *expected_effective_groups]))

          '''
          if w.count(gate) != 1: raise SystemExit("expected one Xcode status gate")
          w = w.replace(gate, att + gate, 1)
          old = '            "buildEffectiveGroupAuthorityAttested": True,\n'
          new = '''            "buildEffectiveGroupAuthorityAttested": True,
                      "buildCredentialAttestation": credential_attestation,
                      "buildCredentialAttestationSameExecTransition": True,
                      "effectiveZeroSupplementaryGroupsClaim": False,
          '''
          if w.count(old) != 1: raise SystemExit("expected one evidence marker")
          w = w.replace(old, new, 1)
          old = '            and evidence.get("buildEffectiveGroupAuthorityAttested") is True\n'
          new = '''            and evidence.get("buildEffectiveGroupAuthorityAttested") is True
                      and evidence.get("buildCredentialAttestationSameExecTransition") is True
                      and evidence.get("effectiveZeroSupplementaryGroupsClaim") is False
                      and evidence.get("buildCredentialAttestation", {}).get("identityExact") is True
                      and evidence.get("buildCredentialAttestation", {}).get("groupsExact") is True
                      and evidence.get("buildCredentialAttestation", {}).get("fieldOnlyLeak") == []
          '''
          if w.count(old) != 1: raise SystemExit("expected one parent evidence marker")
          p.write_text(w.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/tmp-v14-attest-exec-c499-materializer.yml
          rm .github/workflows/tmp-v14-attest-exec-c499-materializer-v2.yml
      - name: Validate focused moved-head contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile scripts/ci/capture_signed_app_build_origin_custody.py scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          python3 scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py -v
          grep -Fq 'def _credential_attesting_exec_command(' scripts/ci/capture_signed_app_build_origin_custody.py
          grep -Fq 'os.execve(command[0], command, os.environ)' scripts/ci/capture_signed_app_build_origin_custody.py
          ! grep -Fq 'def _attest_build_identity_groups(' scripts/ci/capture_signed_app_build_origin_custody.py
          grep -Fq 'buildCredentialAttestationSameExecTransition' scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          grep -Fq '_remove_local_build_identity(build_name, build_uid, require_absent=True)' scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          grep -Fq '"-owners",' scripts/ci/capture_signed_app_build_origin_custody.py
          git diff --check
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/tmp-v14-attest-exec-c499-materializer-v2.yml .github/workflows/tmp-v14-attest-exec-c499-materializer.yml scripts/ci/capture_signed_app_build_origin_custody.py scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - name: Publish clean stacked delta
        shell: bash
        env:
          BRANCH: repair/v14-signed-origin-attest-exec-c499-sol-20260812-go2
        run: |
          set -euo pipefail
          git config user.name nembra-swarm
          git config user.email nembra-swarm@users.noreply.github.com
          git add -A -- .github/workflows/tmp-v14-attest-exec-c499-materializer-v2.yml .github/workflows/tmp-v14-attest-exec-c499-materializer.yml scripts/ci/capture_signed_app_build_origin_custody.py scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py scripts/ci/tests/test_capture_signed_app_real_xcode_group_custody.py
          git commit -m "Capture P0: bind c499 credential attestation to compiler exec"
          git push origin "HEAD:$BRANCH"
