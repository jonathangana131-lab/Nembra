name: Capture continuity truth one-shot

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bind exact triggering head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${GITHUB_REF_NAME}" = "capture/one-time-ble-dump-gpt56"
          test -z "$(git status --porcelain)"

      - name: Repair continuity presentation truth
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          app_path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift")

          app = app_path.read_text()
          start_marker = "private func mirrorAlreadyTerminalObservationContinuity"
          end_marker = "private func invalidateObservationContinuity"
          start = app.find(start_marker)
          end = app.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit("continuity mirror section not found")
          section = app[start:end]
          replacement = (
              r"\1// Package-owned continuity retirement is not observed transport loss. Preserve the\n"
              r"\1// last actual SDK-local BLE state instead of fabricating an offline observation."
          )
          section, count = re.subn(r"(?m)^(\s*)sdkLocalBLEOnline = false\s*$", replacement, section)
          if count != 1:
              raise SystemExit(f"expected exactly one BLE-offline mutation in continuity mirror, found {count}")
          app_path.write_text(app[:start] + section + app[end:])

          tests = test_path.read_text()
          old_test = '#expect(helper.contains("sdkLocalBLEOnline = false"))'
          new_test = '#expect(!helper.contains("sdkLocalBLEOnline = false"))'
          if tests.count(old_test) != 1:
              raise SystemExit(f"expected exactly one stale BLE-offline assertion, found {tests.count(old_test)}")
          test_path.write_text(tests.replace(old_test, new_test, 1))
          PY

      - name: Verify exact read-only delta
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected=$'NembraApp/App/NembraCaptureEntrypoint.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift'
          test "$actual" = "$expected"
          grep -F 'Package-owned continuity retirement is not observed transport loss.' NembraApp/App/NembraCaptureEntrypoint.swift >/dev/null
          grep -F '#expect(!helper.contains("sdkLocalBLEOnline = false"))' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift >/dev/null
          ! git diff -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -E '^\+.*(publishDps\(|writeValue\(|removeDevice|factoryReset)'

      - name: Run focused continuity truth regression
        id: focused_regression
        continue-on-error: true
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/capture-continuity-truth-regression.log"
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaAlreadyTerminalObservationContinuitySourceTests 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain focused regression diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-continuity-truth-regression-${{ github.sha }}
          path: ${{ runner.temp }}/capture-continuity-truth-regression.log
          if-no-files-found: error

      - name: Enforce focused regression verdict
        run: |
          set -euo pipefail
          test "${{ steps.focused_regression.outputs.status }}" = "0"

      - name: Publish coherent repair and retire helper
        run: |
          set -euo pipefail
          rm .github/workflows/capture-continuity-truth-one-shot.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift \
            .github/workflows/capture-continuity-truth-one-shot.yml
          git diff --cached --check
          git config user.name "nembra-capture-bot"
          git config user.email "nembra-capture-bot@users.noreply.github.com"
          git commit -m "Capture: preserve BLE truth on continuity retirement"
          git push origin HEAD:capture/one-time-ble-dump-gpt56
