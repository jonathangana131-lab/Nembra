name: Capture Field Selected Xcode Tool ACL Custody

on:
  push:
    branches:
      - validation/v14-selected-xcode-acl-red-diagnostics-sol-20260811
    paths:
      - .github/workflows/capture-field-selected-xcode-tool-acl-custody.yml
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_field_selected_xcode_tool_acl_custody.py
      - .github/workflows/capture-field-selected-xcode-tool-acl-custody.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-tool-acl-custody:
    name: Reject selected-tool ACL mutation and replacement authority
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact clean production scope
        shell: bash
        env:
          EXACT_PARENT: 0807fc75a7edb51597d9e926c747cd5e6c400771
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$source_sha" = "$expected"
          git cat-file -e "${EXACT_PARENT}^{commit}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed_paths="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/capture-field-selected-xcode-tool-acl-custody.yml' \
            'scripts/ci/tests/test_capture_field_selected_xcode_tool_acl_custody.py' \
            'scripts/field/install_one_time_capture.command')"
          if [[ "$changed_paths" != "$expected_paths" ]]; then
            printf 'ACL production repair must remain exactly three-path relative to the clean selected-Xcode parent. Changed paths:\n' >&2
            printf '%s\n' "$changed_paths" | /usr/bin/sed 's/^/  /' >&2
            exit 20
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'NEMBRA_ACL_REPAIR_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"

      - name: Compile ACL authority regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_selected_xcode_tool_acl_custody.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Exercise ACL authority regression with retained diagnostics
        id: acl_regression
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/nembra-selected-xcode-acl-regression.txt"
          set +e
          /usr/bin/python3 scripts/ci/tests/test_capture_field_selected_xcode_tool_acl_custody.py >"$output" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/nembra-selected-xcode-acl-regression.rc"
          cat "$output"
          if [[ "$rc" != 0 ]]; then
            diagnostic="$(tail -n 220 "$output" | /usr/bin/python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            printf '::error title=Selected Xcode ACL regression red::%s\n' "$diagnostic"
          fi
          exit "$rc"

      - name: Preserve exact red-or-green ACL evidence
        if: always()
        shell: bash
        env:
          ACL_REGRESSION_OUTCOME: ${{ steps.acl_regression.outcome }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/nembra-selected-xcode-acl-regression.txt"
          rc_file="$RUNNER_TEMP/nembra-selected-xcode-acl-regression.rc"
          printf 'ACL regression outcome: %s\n' "$ACL_REGRESSION_OUTCOME"
          if [[ -f "$output" ]]; then
            printf '%s\n' '--- retained ACL regression output ---'
            cat "$output"
          fi
          if [[ -f "$rc_file" ]]; then
            printf 'ACL regression return code: %s\n' "$(cat "$rc_file")"
          fi
          git diff --check 0807fc75a7edb51597d9e926c747cd5e6c400771 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Enforce ACL authority verdict
        if: always()
        shell: bash
        env:
          ACL_REGRESSION_OUTCOME: ${{ steps.acl_regression.outcome }}
        run: |
          set -euo pipefail
          test "$ACL_REGRESSION_OUTCOME" = success
          test "$(cat "$RUNNER_TEMP/nembra-selected-xcode-acl-regression.rc")" = 0

      - name: Preserve physical truth boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'Repair head: %s\n' "${NEMBRA_ACL_REPAIR_SOURCE_SHA:-unavailable}"
          printf 'This gate performs no Xcode device discovery, install, launch, Bluetooth action, Tuya action, telemetry capture, or physical experiment.\n'