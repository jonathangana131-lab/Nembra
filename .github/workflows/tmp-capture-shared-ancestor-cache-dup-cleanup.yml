name: Capture Shared Ancestor Cache Dup Cleanup Materialize Once

on:
  push:
    branches:
      - repair/v17-capture-shared-ancestor-cache-dup-cleanup-3251-sol-20260815
    paths:
      - .github/workflows/tmp-capture-shared-ancestor-cache-dup-cleanup.yml

permissions:
  contents: write

env:
  EXACT_PARENT: 32519114061374744ba1b43d63147dea13623fff

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact stacked authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD)"
          test "$changed" = '.github/workflows/tmp-capture-shared-ancestor-cache-dup-cleanup.yml'
          test "$(git rev-parse "HEAD:scripts/ci/capture_accepted_build_input_snapshot.py")" = \
               "$(git rev-parse "$EXACT_PARENT:scripts/ci/capture_accepted_build_input_snapshot.py")"
          test "$(git rev-parse "HEAD:scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py")" = \
               "$(git rev-parse "$EXACT_PARENT:scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py")"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Close child descriptor on cache-dup failure and add regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          helper = Path("scripts/ci/capture_accepted_build_input_snapshot.py")
          source = helper.read_text(encoding="utf-8")
          old = (
              "            child = _open_directory_at(current, component, relative)\n"
              "            if not is_last and directory_cache is not None:\n"
              "                directory_cache[relative] = os.dup(child)\n"
              "            os.close(current)\n"
              "            current = child\n"
          )
          new = (
              "            child = _open_directory_at(current, component, relative)\n"
              "            try:\n"
              "                if not is_last and directory_cache is not None:\n"
              "                    directory_cache[relative] = os.dup(child)\n"
              "            except Exception:\n"
              "                os.close(child)\n"
              "                raise\n"
              "            os.close(current)\n"
              "            current = child\n"
          )
          if source.count(old) != 1:
              raise SystemExit(f"helper patch anchor drifted: found {source.count(old)}")
          source = source.replace(old, new, 1)
          compile(source, str(helper), "exec", dont_inherit=True)
          helper.write_text(source, encoding="utf-8")

          regression = Path("scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py")
          test_source = regression.read_text(encoding="utf-8")
          old_imports = "import hashlib\nimport importlib.util\nimport json\n"
          new_imports = "import errno\nimport hashlib\nimport importlib.util\nimport json\nimport os\n"
          if test_source.count(old_imports) != 1:
              raise SystemExit("regression import anchor drifted")
          test_source = test_source.replace(old_imports, new_imports, 1)

          marker = '\nif __name__ == "__main__":\n'
          if test_source.count(marker) != 1:
              raise SystemExit("regression insertion marker drifted")
          method_body = dedent(r'''
          def test_cache_dup_failure_closes_newly_opened_child_descriptor(self) -> None:
              helper = load()
              with tempfile.TemporaryDirectory(prefix="nembra-shared-ancestor-cache-dup-cleanup-") as raw:
                  root = Path(raw)
                  (root / "LocalSecrets/TuyaSDK").mkdir(parents=True)
                  root_fd = helper._open_repository_root(root)
                  real_dup = os.dup
                  real_open_directory = helper._open_directory_at
                  opened_children: list[int] = []
                  dup_calls = 0

                  def capture_open(parent_fd: int, name: str, relative: Path) -> int:
                      descriptor = real_open_directory(parent_fd, name, relative)
                      opened_children.append(descriptor)
                      return descriptor

                  def fail_cache_dup(descriptor: int) -> int:
                      nonlocal dup_calls
                      dup_calls += 1
                      if dup_calls == 2:
                          raise OSError(errno.EMFILE, "synthetic cache-dup exhaustion")
                      return real_dup(descriptor)

                  cache: dict[Path, int] = {}
                  try:
                      with (
                          mock.patch.object(helper, "_open_directory_at", side_effect=capture_open),
                          mock.patch.object(helper.os, "dup", side_effect=fail_cache_dup),
                      ):
                          with self.assertRaisesRegex(OSError, "synthetic cache-dup exhaustion"):
                              helper._open_subject(
                                  root_fd,
                                  Path("LocalSecrets/TuyaSDK"),
                                  cache,
                              )

                      self.assertEqual(dup_calls, 2)
                      self.assertEqual(cache, {})
                      self.assertEqual(len(opened_children), 1)
                      with self.assertRaises(OSError):
                          os.fstat(opened_children[0])
                  finally:
                      for descriptor in opened_children:
                          try:
                              os.close(descriptor)
                          except OSError:
                              pass
                      os.close(root_fd)
          ''').lstrip("\n")
          method = "\n" + indent(method_body, "    ") + "\n"
          test_source = test_source.replace(marker, method + marker, 1)
          compile(test_source, str(regression), "exec", dont_inherit=True)
          regression.write_text(test_source, encoding="utf-8")
          PY

          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check

      - name: Publish tested stacked repair
        shell: bash
        run: |
          set -euo pipefail
          git add \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git diff --cached --check
          changed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git config user.name "nembra-capture-swarm"
          git config user.email "nembra-capture-swarm@users.noreply.github.com"
          git commit -m "security(capture): close shared-ancestor cache dup failure fd"
          git push origin HEAD:repair/v17-capture-shared-ancestor-cache-dup-cleanup-3251-sol-20260815
