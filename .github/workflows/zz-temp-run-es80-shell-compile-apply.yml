name: TEMP Run ES80 Simulator shell compile repair

on:
  push:
    branches:
      - fix/es80-today-simulator-preflight-snapshot-0519-gpt56

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute guarded repair payload
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          carrier = Path('.github/workflows/temp-apply-es80-shell-simulator-conditional-fix.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          if carrier.count(marker) != 1 or carrier.count(end_marker) != 1:
              raise SystemExit('guarded repair payload markers are not unique')
          payload = carrier.split(marker, 1)[1].split(end_marker, 1)[0]
          exec(dedent(payload), {'__name__': '__main__'})
          PY
          git diff --check
          test -n "$(git diff -- NembraApp/Features/Research/ES80CaptureShellView.swift)"

      - name: Commit repair and remove temporary applicators
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-apply-es80-shell-simulator-conditional-fix.yml
          rm .github/workflows/zz-temp-run-es80-shell-compile-apply.yml
          git config user.name nembra-v14-simulator-compile
          git config user.email nembra-v14-simulator-compile@users.noreply.github.com
          git add NembraApp/Features/Research/ES80CaptureShellView.swift .github/workflows/temp-apply-es80-shell-simulator-conditional-fix.yml .github/workflows/zz-temp-run-es80-shell-compile-apply.yml
          git commit -m "fix(capture): make Simulator shell conditionals compile-safe"
          git push origin HEAD:fix/es80-today-simulator-preflight-snapshot-0519-gpt56
