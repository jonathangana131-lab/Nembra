name: Materialize Capture Foreground Integrity Recovery

on:
  push:
    branches:
      - recovery/v14-capture-foreground-integrity-8e4-sol2

permissions:
  contents: write

concurrency:
  group: capture-foreground-integrity-8e4-sol2
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-foreground-integrity-8e4-sol2
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact parent and staged recovery scope
        shell: bash
        run: |
          set -euo pipefail
          parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- "$app"
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          mapfile -t wanted < <(printf '%s\n' '.github/workflows/materialize-capture-foreground-integrity-r2-sol.yml' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' 'scripts/ci/materialize_capture_foreground_integrity_8e4.py' | sort)
          test "${#changed[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do test "${changed[$i]}" = "${wanted[$i]}"; done

      - name: Materialize and validate foreground-integrity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_foreground_integrity_8e4.py
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          git diff --check

      - name: Publish clean two-path successor
        shell: bash
        run: |
          set -euo pipefail
          parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          rm -f .github/workflows/materialize-capture-foreground-integrity-r2-sol.yml
          rm -f scripts/ci/materialize_capture_foreground_integrity_8e4.py
          git add -A
          git diff --cached --check
          mapfile -t effective < <(git diff --name-only "$parent" | sort)
          mapfile -t wanted < <(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift' | sort)
          test "${#effective[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do test "${effective[$i]}" = "${wanted[$i]}"; done
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git commit -m 'fix(capture): fail closed on foreground loss'
          git push origin HEAD:recovery/v14-capture-foreground-integrity-8e4-sol2
