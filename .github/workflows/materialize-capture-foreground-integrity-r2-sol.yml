name: Materialize Capture Foreground Integrity R2

on:
  push:
    branches:
      - fix/v14-capture-foreground-integrity-r2-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-foreground-integrity-r2-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact parent and untouched product source
        shell: bash
        run: |
          set -euo pipefail
          parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-foreground-integrity-r2-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift'

      - name: Apply fail-closed foreground-integrity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          marker = '    var privateConfig: Bool { OfficialTuyaFactory.configured }\n'
          if source.count(marker) != 1:
              raise SystemExit('controller insertion marker mismatch')
          method = "\n".join([
              '    func appDidLoseForeground() {',
              '        // Capture evidence is foreground-only. Revoke pending async grants first.',
              '        membershipRequestID = UUID()',
              '        membershipBusy = false',
              '#if canImport(ThingSmartHomeKit)',
              '        membershipProbe = nil',
              '#endif',
              '        officialConnectionRequestID = UUID()',
              '        watchdog?.cancel()',
              '        watchdog = nil',
              '',
              '        if processCorrelationLease != nil || correlationSession != nil {',
              '            abandonPackageCorrelation()',
              '            phase = .failed',
              '            message = "Capture left the foreground during Bluetooth target correlation. Restart from OFF1; interrupted windows are never reusable evidence."',
              '            log("foreground_integrity_lost_during_target_correlation")',
              '            return',
              '        }',
              '',
              '        guard let token = currentConnectionToken else {',
              '            if phase == .authenticating {',
              '                localBLESettlementToken = nil',
              '                sdkLocalBLEOnline = false',
              '                driver = nil',
              '                phase = .failed',
              '                message = "Capture left the foreground during authentication. Relaunch before another authenticated attempt; no BLE disconnect is claimed."',
              '                log("foreground_integrity_lost_before_observation")',
              '            }',
              '            return',
              '        }',
              '',
              '        let wasObserving = phase == .observing',
              '        phase = .failed',
              '        message = wasObserving',
              '            ? "Capture left the foreground during authenticated observation. Restart from OFF1; background time is not accepted evidence and no BLE disconnect is claimed."',
              '            : "Capture left the foreground before authenticated observation. Relaunch before another authenticated attempt; no BLE disconnect is claimed."',
              '        log(',
              '            wasObserving ? "foreground_integrity_lost_during_observation" : "foreground_integrity_lost_before_observation",',
              '            ["generation": String(token.diagnosticGeneration)]',
              '        )',
              '',
              '        Task { @MainActor [weak self] in',
              '            guard let self, self.currentConnectionToken == token else { return }',
              '            if wasObserving {',
              '                await self.invalidateObservationContinuity(',
              '                    token: token,',
              '                    message: "App foreground integrity was lost during authenticated observation. Restart from OFF1; background time is not accepted evidence and no BLE disconnect is claimed.",',
              '                    kind: "foreground_integrity_lost_during_observation"',
              '                )',
              '            } else {',
              '                await self.invalidateInternalLifecycle(',
              '                    token: token,',
              '                    message: "App foreground integrity was lost before authenticated observation. Relaunch before another authenticated attempt; no BLE disconnect is claimed.",',
              '                    kind: "foreground_integrity_lost_before_observation"',
              '                )',
              '            }',
              '        }',
              '    }',
              '',
              '',
          ])
          source = source.replace(marker, method + marker, 1)
          env = '    @Environment(\\.dynamicTypeSize) private var dynamicTypeSize\n'
          if source.count(env) != 1:
              raise SystemExit('scene environment marker mismatch')
          source = source.replace(env, env + '    @Environment(\\.scenePhase) private var scenePhase\n', 1)
          view = "\n".join([
              '        .onDisappear {',
              '            test.abandonCorrelationForViewExit()',
              '        }',
              '',
          ])
          if source.count(view) != 1:
              raise SystemExit('view lifecycle marker mismatch')
          scene = "\n".join([
              '        .onChange(of: scenePhase) { _, newPhase in',
              '            if newPhase != .active {',
              '                test.appDidLoseForeground()',
              '            }',
              '        }',
              '',
          ])
          source = source.replace(view, view + scene, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify lifecycle truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('func appDidLoseForeground()')
          end = s.index('var privateConfig: Bool', start)
          cleanup = s[start:end]
          for required in ('membershipRequestID = UUID()', 'membershipBusy = false', 'membershipProbe = nil', 'officialConnectionRequestID = UUID()', 'watchdog?.cancel()', 'if processCorrelationLease != nil || correlationSession != nil', 'abandonPackageCorrelation()', 'foreground_integrity_lost_during_target_correlation', 'invalidateObservationContinuity(', 'foreground_integrity_lost_during_observation', 'invalidateInternalLifecycle(', 'foreground_integrity_lost_before_observation'):
              assert required in cleanup, required
          assert cleanup.index('membershipRequestID = UUID()') < cleanup.index('if processCorrelationLease')
          assert cleanup.index('officialConnectionRequestID = UUID()') < cleanup.index('if processCorrelationLease')
          for forbidden in ('releasePackageCorrelationLease()', 'recordObservedTransportLoss', 'endConnection', 'disconnectBLE'):
              assert forbidden not in cleanup, forbidden
          assert '@Environment(\\.scenePhase) private var scenePhase' in s
          assert '.onChange(of: scenePhase)' in s
          assert 'if newPhase != .active' in s
          assert 'test.appDidLoseForeground()' in s
          print('Capture foreground-integrity source contract: PASS')
          PY
          git diff --check

      - name: Collapse helper into clean two-path product repair
        shell: bash
        run: |
          set -euo pipefail
          parent='8e4d28c9bd1c3ba6dd3a9c9292bd9f1ff27a40ac'
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-foreground-integrity-r2-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          git diff --cached --check
          git commit -m 'fix(capture): fail closed on foreground loss'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:fix/v14-capture-foreground-integrity-r2-sol
