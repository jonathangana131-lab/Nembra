name: Temporary Final GO Device Digest Rendezvous

on:
  pull_request:
    branches:
      - repair/v14-final-go-device-digest-rendezvous-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Transform and red-team
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_materialize_final_go_device_digest.py
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          git diff --check
      - name: Checkpoint authority repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nembra-v14-go"
          git config user.email "nembra-v14-go@users.noreply.github.com"
          git add scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          git commit -m "fix(capture): bind Final GO to candidate device digest"
          git push origin HEAD:repair/v14-final-go-device-digest-rendezvous-sol
