name: TEMP V14 Field Installer Git Authority Review (Sol)

on:
  push:
    branches:
      - repair/v14-field-installer-git-authority-sol-20260811
    paths:
      - .github/workflows/tmp-v14-field-installer-git-authority-review-sol.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize owner patch in review worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_EXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/tmp-v14-materialize-field-installer-git-authority-sol.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines()) + "\n"
          Path('/tmp/nembra-field-authority-patch.py').write_text(body, encoding='utf-8')
          PY_EXTRACT
          python3 /tmp/nembra-field-authority-patch.py
          bash -n scripts/field/install_one_time_capture.command
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
      - name: Ambient Git-dir/work-tree witness remains valid
        run: >-
          python3 -m unittest -v
          scripts.ci.tests.test_capture_field_installer_git_authority_red_team.CaptureFieldInstallerGitAuthorityRedTeamTests.test_ambient_git_dir_and_work_tree_can_validate_other_bytes
      - name: Repository core.worktree witness remains valid
        run: >-
          python3 -m unittest -v
          scripts.ci.tests.test_capture_field_installer_git_authority_red_team.CaptureFieldInstallerGitAuthorityRedTeamTests.test_repository_core_worktree_can_hide_real_checkout_rewrite
      - name: Repaired installer source closes authority split
        run: >-
          python3 -m unittest -v
          scripts.ci.tests.test_capture_field_installer_git_authority_red_team.CaptureFieldInstallerGitAuthorityRedTeamTests.test_field_installer_must_not_split_git_authority_from_bootstrap_execution
