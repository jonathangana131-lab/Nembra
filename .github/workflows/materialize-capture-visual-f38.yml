name: Reanchor Capture visual harness on f38

on:
  push:
    branches:
      - qa/v14-capture-visual-f38-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reanchor reviewed three-file visual harness
        shell: bash
        run: |
          set -euo pipefail
          product='f38a4b808c5956b4de5fcdf58d18113e9d5ca23b'
          donor='050e79a6c99fbc68dfcef668a368de1bc3a0f21f'
          workflow='.github/workflows/materialize-capture-visual-f38.yml'
          paths=(
            '.github/workflows/capture-standalone-visual-evidence.yml'
            'scripts/ci/capture_standalone_visual_evidence.sh'
            'scripts/ci/tests/test_capture_standalone_visual_evidence.py'
          )
          test "$(git rev-parse HEAD^)" = "$product"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"
          for path in "${paths[@]}"; do
            test ! -e "$path"
            mkdir -p "$(dirname "$path")"
            git show "$donor:$path" > "$path"
          done
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py
          git diff --check
          rm "$workflow"
          actual="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' "${paths[@]}" "$workflow" | sort)"
          test "$actual" = "$expected"
          git config user.name 'Nembra V14 Sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'qa(capture): reanchor exact iPhone 12 visual evidence'
          git push origin HEAD:qa/v14-capture-visual-f38-sol
