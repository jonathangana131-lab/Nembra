name: Materialize Capture Visual F38

on:
  push:
    branches:
      - qa/v14-capture-visual-f38a4b-20260810

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          expected='f38a4b808c5956b4de5fcdf58d18113e9d5ca23b'
          test "$(git rev-parse HEAD^)" = "$expected"
          test "$(git diff --name-only "$expected"..HEAD)" = '.github/workflows/materialize-capture-visual-f38.yml'

      - name: Restore reviewed QA-only visual harness
        shell: bash
        run: |
          set -euo pipefail
          donor='050e79a6c99fbc68dfcef668a368de1bc3a0f21f'
          git checkout "$donor" -- \
            .github/workflows/capture-standalone-visual-evidence.yml \
            scripts/ci/capture_standalone_visual_evidence.sh \
            scripts/ci/tests/test_capture_standalone_visual_evidence.py
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py
          git diff --check
          changed="$(git diff --name-only HEAD -- . ':!.github/workflows/materialize-capture-visual-f38.yml' | sort)"
          expected_paths="$(printf '%s\n' '.github/workflows/capture-standalone-visual-evidence.yml' 'scripts/ci/capture_standalone_visual_evidence.sh' 'scripts/ci/tests/test_capture_standalone_visual_evidence.py' | sort)"
          test "$changed" = "$expected_paths"

      - name: Commit QA-only checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-visual-f38.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/capture-standalone-visual-evidence.yml \
            scripts/ci/capture_standalone_visual_evidence.sh \
            scripts/ci/tests/test_capture_standalone_visual_evidence.py \
            .github/workflows/materialize-capture-visual-f38.yml
          git commit -m 'test(capture): reanchor iPhone 12 visual evidence on f38'
          git push origin HEAD:qa/v14-capture-visual-f38a4b-20260810
