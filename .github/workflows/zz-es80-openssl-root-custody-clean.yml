name: Temporary cleanup for ES80 OpenSSL custody recovery

on:
  push:
    branches:
      - fix/es80-v14-openssl-root-custody/gpt56-thinking-go

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated Python cache residue
        run: |
          rm -rf scripts/ci/__pycache__ scripts/ci/tests/__pycache__
          rm .github/workflows/zz-es80-openssl-root-custody-clean.yml
          git config user.name "Nembra V14 custody recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: remove signer validation cache residue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
