name: Apply V14 Capture correlation progress truth

on:
  push:
    branches:
      - fix/v14-capture-correlation-progress-sol

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply phase-aware correlation ordinal and self-delete
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi

          EXPECTED_PARENT='5e96004ec565a5a19df8312f64985862a0443cdc'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/fix/v14-capture-correlation-progress-sol | cut -f1)" = "$GITHUB_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          view_start = source.index("private struct SecureLinkView: View {")
          view_end = source.index("private struct SecureTransfer: Transferable", view_start)
          body = source[view_start:view_end]

          anchor = '    private let stageLabels = ["Target", "Secure link", "Observe", "Seal"]\n'
          replacement = anchor + '''\n    private var correlationDisplayedWindowOrdinal: Int {\n        test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)\n    }\n'''
          if body.count(anchor) != 1:
              raise SystemExit(f"expected one stage-label anchor, found {body.count(anchor)}")
          body = body.replace(anchor, replacement, 1)

          old = 'Text("\\(min(test.correlationCompletedWindowCount + 1, 4))/4")'
          new = 'Text("\\(correlationDisplayedWindowOrdinal)/4")'
          if body.count(old) != 1:
              raise SystemExit(f"expected one visible raw correlation ordinal, found {body.count(old)}")
          body = body.replace(old, new, 1)

          if 'test.phase == .correlated ? 4 : min(test.correlationCompletedWindowCount + 1, 4)' not in body:
              raise SystemExit("completed correlation is not pinned to 4/4")
          if old in body:
              raise SystemExit("raw live-session ordinal still drives visible progress")
          if new not in body:
              raise SystemExit("phase-aware correlation ordinal is not visible")

          path.write_text(source[:view_start] + body + source[view_end:])
          PY

          git show 6508c5d8e2902589164d6cef34b30c5326c86599:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift \
            > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationProgressPresentationTruthSourceTests.swift

          rm .github/workflows/apply-v14-capture-correlation-progress.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): show completed correlation as four of four'
          git push origin HEAD:fix/v14-capture-correlation-progress-sol
