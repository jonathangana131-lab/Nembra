name: Temporary ES80 fresh charger preflight patch

on:
  push:
    branches:
      - integration/es80-v14-fresh-charger-preflight/chatgpt56-thinking-go

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Capture preflight repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraApp.swift')
          shell_path = Path('NembraApp/Features/Research/ES80CaptureShellView.swift')
          tests_path = Path('NembraAppTests/NembraAppTests.swift')
          workflow_path = Path('.github/workflows/_temporary_es80_fresh_charger_preflight_patch.yml')

          app = app_path.read_text()
          shell = shell_path.read_text()
          tests = tests_path.read_text()

          old = '''private struct ES80ExperimentOneStationaryPreflightView: View {
              let coordinator: PassiveBluetoothExperimentOneCoordinator

              @State private var selectedChargerState: PassiveBluetoothStationaryCaptureChargerState?
              @State private var disconnectedDeclarationAccepted = false

              var body: some View {
                  if disconnectedDeclarationAccepted {
                      ES80CaptureShellView(coordinator: coordinator)
                  } else {
          '''
          new = '''private struct ES80ExperimentOneStationaryPreflightView: View {
              @State private var coordinator: PassiveBluetoothExperimentOneCoordinator
              @State private var selectedChargerState: PassiveBluetoothStationaryCaptureChargerState?
              @State private var disconnectedDeclarationAccepted = false

              init(coordinator: PassiveBluetoothExperimentOneCoordinator) {
                  _coordinator = State(initialValue: coordinator)
              }

              var body: some View {
                  if disconnectedDeclarationAccepted {
                      ES80CaptureShellView(
                          coordinator: coordinator,
                          onFreshExperimentRequested: makeFreshExperimentCoordinator
                      )
                  } else {
          '''
          if app.count(old) != 1:
              raise SystemExit(f'preflight ownership anchor count = {app.count(old)}')
          app = app.replace(old, new, 1)

          old = '''    private var canContinue: Bool {
          '''
          new = '''    /// A new Experiment One is a new declared setup life. A restart may mint a fresh
              /// package-owned coordinator, but it must also return through charger preflight instead of
              /// carrying the previous run's disconnected declaration into new evidence.
              private func makeFreshExperimentCoordinator() throws -> PassiveBluetoothExperimentOneCoordinator {
                  let freshCoordinator = try PassiveBluetoothExperimentOneCoordinator()
                  coordinator = freshCoordinator
                  selectedChargerState = nil
                  disconnectedDeclarationAccepted = false
                  return freshCoordinator
              }

              private var canContinue: Bool {
          '''
          if app.count(old) != 1:
              raise SystemExit(f'canContinue anchor count = {app.count(old)}')
          app = app.replace(old, new, 1)

          old = '''    @State private var showingDetails = false

              init(coordinator: PassiveBluetoothExperimentOneCoordinator) {
                  _coordinator = State(initialValue: coordinator)
              }
          '''
          new = '''    @State private var showingDetails = false

              private let onFreshExperimentRequested: () throws -> PassiveBluetoothExperimentOneCoordinator

              init(
                  coordinator: PassiveBluetoothExperimentOneCoordinator,
                  onFreshExperimentRequested: @escaping () throws -> PassiveBluetoothExperimentOneCoordinator
              ) {
                  _coordinator = State(initialValue: coordinator)
                  self.onFreshExperimentRequested = onFreshExperimentRequested
              }
          '''
          if shell.count(old) != 1:
              raise SystemExit(f'shell initializer anchor count = {shell.count(old)}')
          shell = shell.replace(old, new, 1)

          old = '''        do {
                      coordinator = try PassiveBluetoothExperimentOneCoordinator()
                  } catch {
                      localFailureMessage = "Nembra could not create a fresh package-owned Experiment One workflow: \\(String(describing: error))"
                  }
          '''
          new = '''        do {
                      coordinator = try onFreshExperimentRequested()
                  } catch {
                      localFailureMessage = "Nembra could not create a fresh package-owned Experiment One workflow: \\(String(describing: error))"
                  }
          '''
          if shell.count(old) != 1:
              raise SystemExit(f'restart coordinator anchor count = {shell.count(old)}')
          shell = shell.replace(old, new, 1)

          old = '''        XCTAssertTrue(app.contains("PassiveBluetoothExperimentOneCoordinator"))
                  XCTAssertFalse(app.contains("try? ForegroundCoreBluetoothCaptureController("))
              }
          '''
          new = '''        XCTAssertTrue(app.contains("PassiveBluetoothExperimentOneCoordinator"))
                  XCTAssertFalse(app.contains("try? ForegroundCoreBluetoothCaptureController("))
                  XCTAssertTrue(
                      app.contains("onFreshExperimentRequested: makeFreshExperimentCoordinator"),
                      "Fresh Experiment One must return through parent-owned stationary preflight."
                  )
                  XCTAssertTrue(app.contains("selectedChargerState = nil"))
                  XCTAssertTrue(app.contains("disconnectedDeclarationAccepted = false"))
              }
          '''
          if tests.count(old) != 1:
              raise SystemExit(f'app test anchor count = {tests.count(old)}')
          tests = tests.replace(old, new, 1)

          old = '''        XCTAssertTrue(shell.contains("finalShareIntegrityReport != nil"))
                  XCTAssertTrue(shell.contains("Integrity check required"))
                  XCTAssertTrue(shell.contains("Ready for analysis"))

                  XCTAssertFalse(
          '''
          new = '''        XCTAssertTrue(shell.contains("finalShareIntegrityReport != nil"))
                  XCTAssertTrue(shell.contains("Integrity check required"))
                  XCTAssertTrue(shell.contains("Ready for analysis"))
                  XCTAssertTrue(
                      shell.contains("coordinator = try onFreshExperimentRequested()"),
                      "Shell restart must delegate fresh-run ownership to stationary preflight."
                  )
                  XCTAssertFalse(
                      shell.contains("coordinator = try PassiveBluetoothExperimentOneCoordinator()"),
                      "The shell must not mint a fresh run behind an already-accepted charger declaration."
                  )

                  XCTAssertFalse(
          '''
          if tests.count(old) != 1:
              raise SystemExit(f'shell test anchor count = {tests.count(old)}')
          tests = tests.replace(old, new, 1)

          # Mechanical truth guards: exactly one production shell call, all fresh-run construction
          # outside the shell, and physical execution gate untouched by this patch.
          if app.count('ES80CaptureShellView(') != 1:
              raise SystemExit('unexpected ES80CaptureShellView call-site count')
          if 'coordinator = try PassiveBluetoothExperimentOneCoordinator()' in shell:
              raise SystemExit('shell still self-mints a coordinator on restart')
          if 'PassiveBluetoothExperimentOneFieldExecutionGate' not in app:
              raise SystemExit('package physical field gate unexpectedly absent')

          app_path.write_text(app)
          shell_path.write_text(shell)
          tests_path.write_text(tests)
          workflow_path.unlink()
          PY

          git diff --check
          git diff --exit-code -- Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneFieldExecutionGate.swift

      - name: Commit durable product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraApp.swift \
                  NembraApp/Features/Research/ES80CaptureShellView.swift \
                  NembraAppTests/NembraAppTests.swift \
                  .github/workflows/_temporary_es80_fresh_charger_preflight_patch.yml
          git commit -m "[Capture preflight v14] Re-require charger declaration after restart"
          git push origin HEAD:integration/es80-v14-fresh-charger-preflight/chatgpt56-thinking-go
