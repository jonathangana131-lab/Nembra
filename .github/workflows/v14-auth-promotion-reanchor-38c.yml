name: V14 Capture Auth Promotion Reanchor 38C

on:
  push:
    branches:
      - repair/v14-capture-auth-promotion-38c-sol

permissions:
  contents: write

jobs:
  reanchor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          ref: repair/v14-capture-auth-promotion-38c-sol
      - name: Import reviewed non-overlapping repair
        shell: bash
        run: |
          set -euo pipefail
          CURRENT='38c69bcf6660f42468c954a9196f35d3bdff2680'
          OLD_BASE='a7a28ca6e744d4bad8be08fd3553a2af8c609b15'
          DONOR='a83776c1bd586043a3e5b438d71cfeeaac63fd40'
          APP='NembraApp/App/NembraCaptureEntrypoint.swift'
          TEST='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationPromotionReentrancySourceTests.swift'
          test "$(git rev-parse HEAD^)" = "$CURRENT"
          git diff --quiet "$OLD_BASE" "$CURRENT" -- "$APP"
          git show "$DONOR:$APP" > "$APP"
          git show "$DONOR:$TEST" > "$TEST"
          swiftc -parse "$APP"
          swiftc -parse "$TEST"
          git add "$APP" "$TEST"
          git diff --cached --check
          mapfile -t EFFECTIVE < <(git diff --cached --name-only HEAD)
          test "${#EFFECTIVE[@]}" = '2'
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$APP"
          printf '%s\n' "${EFFECTIVE[@]}" | grep -Fx "$TEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v14-auth-promotion-reanchor-38c.yml
          git commit -m 'fix(capture): fence auth promotion after suspension'
          git push origin HEAD:repair/v14-capture-auth-promotion-38c-sol
