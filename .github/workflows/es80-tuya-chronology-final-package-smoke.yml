name: ES80 Tuya Chronology Final Package Smoke

on:
  push:
    branches:
      - qa/es80-tuya-chronology/chat-k8p3v-38d09a2

permissions:
  contents: read

jobs:
  nembra-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable product mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify immutable product parent
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD=38d09a22cbdd3791c7502964f65621289a04d3ce
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"
          changed="$(git diff --name-only "$PRODUCT_HEAD" HEAD)"
          test "$changed" = ".github/workflows/es80-tuya-chronology-final-package-smoke.yml"
          echo "QA mirror contains exactly one workflow-only commit above $PRODUCT_HEAD"

      - name: Report Swift toolchain
        run: swift --version

      - name: Test NembraCore with warnings as errors
        run: swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors
