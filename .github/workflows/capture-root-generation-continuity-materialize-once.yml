name: Capture Root Generation Continuity Materialize Once

on:
  push:
    branches:
      - repair/v17-capture-root-generation-continuity-gpt56-20260815
    paths:
      - .github/workflows/capture-root-generation-continuity-materialize-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXACT_PARENT: 385e311807fbc832b03fe894eec19f4ed624167e
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-root-generation-continuity-gpt56-20260815
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact authoring child
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-root-generation-continuity-materialize-once.yml \
            scripts/ci/materialize_capture_root_generation_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize root-generation repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/materialize_capture_root_generation_continuity.py

      - name: Prove focused and inherited regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish permanent product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git commit -m 'fix(capture): bind generated repo root generation'
          git rm \
            .github/workflows/capture-root-generation-continuity-materialize-once.yml \
            scripts/ci/materialize_capture_root_generation_continuity.py
          git commit -m 'ci(capture): remove root-generation materializer'
          git push origin HEAD:repair/v17-capture-root-generation-continuity-gpt56-20260815

      - name: Preserve truth boundary
        shell: bash
        run: |
          echo 'NEMBRA_ROOT_GENERATION_REPAIR physicalAuthorityCreated=false deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false'
