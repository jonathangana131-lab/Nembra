name: Materialize Capture Application Event Custody

on:
  push:
    branches:
      - sol/v14-capture-membership-status-current-1c408

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-membership-status-current-1c408
          fetch-depth: 0

      - name: Guard exact lineage and scope
        run: |
          set -euo pipefail
          base=1c40853f6991b4d09206df1d25ecff021458b7eb
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"...HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/scripts/materialize_capture_application_event_custody_1c408.py
          .github/workflows/materialize-capture-application-event-custody-1c408.yml
          NembraApp/App/NembraCaptureEntrypoint.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Materialize product repair
        run: python3 .github/scripts/materialize_capture_application_event_custody_1c408.py

      - name: Validate source contracts
        run: |
          set -euo pipefail
          source=NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse "$source"
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          test "$(grep -Foc 'membershipStatus = "Exact scooter membership must be verified again for this Secure Link session."' "$source")" -eq 2
          grep -Fq 'let exportSafeUpdate = redactedApplicationUpdateForEventCustody(update)' "$source"
          grep -Fq ']) { _, trusted in trusted })' "$source"
          if grep -Fq ']) { current, _ in current })' "$source"; then exit 1; fi
          grep -Fq 'with: "<redacted-account-uid>"' "$source"
          grep -Fq 'key.replacingOccurrences(' "$source"
          grep -Fq 'value.replacingOccurrences(' "$source"
          git diff --check

      - name: Publish clean convergence checkpoint
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-application-event-custody-1c408.yml
          rm .github/scripts/materialize_capture_application_event_custody_1c408.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): close application event export custody gaps'
          git push origin HEAD:sol/v14-capture-membership-status-current-1c408
