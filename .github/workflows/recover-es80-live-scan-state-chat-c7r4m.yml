name: Recover ES80 live scan truth

on:
  push:
    branches:
      - parallel/recover-es80-passive-lifecycle-marker-fence/chat-c7r4m

permissions:
  contents: write

jobs:
  apply-live-scan-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact incumbent product
        uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Verify immutable product parent
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_PARENT=0b28cd78000573526cf7aec896d591c7a1197925
          WORKFLOW=.github/workflows/recover-es80-live-scan-state-chat-c7r4m.yml
          git merge-base --is-ancestor "$PRODUCT_PARENT" HEAD
          test "$(git diff --name-only "$PRODUCT_PARENT" HEAD)" = "$WORKFLOW"

      - name: Separate scan request intent from CoreBluetooth current state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          controller = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift")
          tests = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerSourceContractTests.swift")
          view = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ES80PassiveCaptureResearchView.swift")

          source = controller.read_text()

          replacements = [
              (
                  '''    public private(set) var bluetoothState: CBManagerState = .unknown\n    public private(set) var isScanning = false\n    public private(set) var connectionPhase: ConnectionPhase = .idle\n''',
                  '''    public private(set) var bluetoothState: CBManagerState = .unknown\n\n    /// True while Nembra still owns an explicit foreground scan request. This is\n    /// request intent only; use `isScanning` for CoreBluetooth's current state.\n    public var isScanRequested: Bool {\n        scanRequested\n    }\n\n    /// True only when Nembra owns the request and the exact CoreBluetooth\n    /// manager currently reports that it is scanning. This is software transport\n    /// state, not RF completeness or scan-generation provenance.\n    public var isScanning: Bool {\n        scanRequested && centralManager?.isScanning == true\n    }\n\n    public private(set) var connectionPhase: ConnectionPhase = .idle\n'''
              ),
              (
                  '''    private var gattIdentityRegistry = PassiveCoreBluetoothGATTIdentityRegistry()\n    private var selectedTargetCancellationPending = false\n\n    private var centralManager: CBCentralManager!\n''',
                  '''    private var gattIdentityRegistry = PassiveCoreBluetoothGATTIdentityRegistry()\n    private var selectedTargetCancellationPending = false\n    private var scanRequested = false\n\n    private var centralManager: CBCentralManager!\n'''
              ),
              (
                  '''        clearCandidateCatalog()\n        centralManager.scanForPeripherals(\n            withServices: PassiveCoreBluetoothAcquisitionPolicy.foregroundResearchServiceFilter,\n            options: PassiveCoreBluetoothAcquisitionPolicy.foregroundResearchScanOptions(\n                captureAdvertisementCadence: captureAdvertisementCadence\n            )\n        )\n        isScanning = true\n''',
                  '''        clearCandidateCatalog()\n        scanRequested = true\n        centralManager.scanForPeripherals(\n            withServices: PassiveCoreBluetoothAcquisitionPolicy.foregroundResearchServiceFilter,\n            options: PassiveCoreBluetoothAcquisitionPolicy.foregroundResearchScanOptions(\n                captureAdvertisementCadence: captureAdvertisementCadence\n            )\n        )\n'''
              ),
              (
                  '''    public func stopScanning() {\n        centralManager.stopScan()\n        isScanning = false\n    }\n''',
                  '''    public func stopScanning() {\n        scanRequested = false\n        centralManager.stopScan()\n    }\n'''
              ),
              (
                  '''        centralManager.stopScan()\n        isScanning = false\n        connectionTimeoutTask?.cancel()\n''',
                  '''        scanRequested = false\n        centralManager.stopScan()\n        connectionTimeoutTask?.cancel()\n'''
              ),
              (
                  '''        guard central.state == .poweredOn else {\n            if isScanning {\n                central.stopScan()\n                isScanning = false\n            }\n''',
                  '''        guard central.state == .poweredOn else {\n            scanRequested = false\n            if central.isScanning {\n                central.stopScan()\n            }\n'''
              ),
              (
                  '''            callbackIsFromActiveManager: central === centralManager,\n            isPoweredOn: central.state == .poweredOn,\n            isScanning: isScanning\n''',
                  '''            callbackIsFromActiveManager: central === centralManager,\n            isPoweredOn: central.state == .poweredOn,\n            isScanning: scanRequested && central.isScanning\n'''
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"controller replacement seam expected once, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          if "isScanning = true" in source or "isScanning = false" in source:
              raise SystemExit("stored isScanning assignments remain after computed-state migration")
          controller.write_text(source)

          view_source = view.read_text()
          view_replacements = [
              (
                  '''            Toggle("Capture advertisement cadence", isOn: $captureAdvertisementCadence)\n                .disabled(controller.isScanning || artifactInteractionLocked)\n\n            HStack {\n                Button(controller.isScanning ? "Stop scan" : "Start scan") {\n                    perform {\n                        if controller.isScanning {\n''',
                  '''            Toggle("Capture advertisement cadence", isOn: $captureAdvertisementCadence)\n                .disabled(controller.isScanRequested || artifactInteractionLocked)\n\n            HStack {\n                Button(controller.isScanRequested ? "Stop scan" : "Start scan") {\n                    perform {\n                        if controller.isScanRequested {\n'''
              ),
              (
                  '''                ContentUnavailableView(\n                    controller.isScanning ? "Scanning…" : "No discoveries yet",\n                    systemImage: "antenna.radiowaves.left.and.right",\n''',
                  '''                ContentUnavailableView(\n                    scanEmptyStateTitle,\n                    systemImage: "antenna.radiowaves.left.and.right",\n'''
              ),
              (
                  '''    private var artifactInteractionLocked: Bool {\n        artifactReadOperation != nil || exportDocument != nil || isExporting\n    }\n''',
                  '''    private var scanEmptyStateTitle: String {\n        if controller.isScanning {\n            return "Scanning…"\n        }\n        if controller.isScanRequested {\n            return "Scan requested — not active"\n        }\n        return "No discoveries yet"\n    }\n\n    private var artifactInteractionLocked: Bool {\n        artifactReadOperation != nil || exportDocument != nil || isExporting\n    }\n'''
              ),
          ]
          for old, new in view_replacements:
              count = view_source.count(old)
              if count != 1:
                  raise SystemExit(f"research-view replacement seam expected once, found {count}: {old[:80]!r}")
              view_source = view_source.replace(old, new, 1)
          view.write_text(view_source)

          test_source = tests.read_text()
          helper_anchor = '''        return try String(contentsOf: controller, encoding: .utf8)\n    }\n\n    private static func section(\n'''
          helper_replacement = '''        return try String(contentsOf: controller, encoding: .utf8)\n    }\n\n    private static func researchViewSource() throws -> String {\n        let testFile = URL(fileURLWithPath: #filePath)\n        let packageRoot = testFile\n            .deletingLastPathComponent() // NembraBluetoothCaptureTests\n            .deletingLastPathComponent() // Tests\n            .deletingLastPathComponent() // NembraBluetoothCapture package root\n        let view = packageRoot\n            .appendingPathComponent("Sources")\n            .appendingPathComponent("NembraBluetoothCapture")\n            .appendingPathComponent("ES80PassiveCaptureResearchView.swift")\n        return try String(contentsOf: view, encoding: .utf8)\n    }\n\n    private static func section(\n'''
          if test_source.count(helper_anchor) != 1:
              raise SystemExit("expected one controller-source helper anchor")
          test_source = test_source.replace(helper_anchor, helper_replacement, 1)

          test_anchor = '''    @Test\n    func cancellationCallGraphKeepsEvidenceBoundaryBeforeRetirement() throws {\n'''
          test_addition = '''    @Test\n    func discoveryAdmissionRequiresRequestIntentAndCurrentManagerScanState() throws {\n        let source = try Self.controllerSource()\n        let body = try Self.section(\n            in: source,\n            from: "    public func centralManager(\\n        _ central: CBCentralManager,\\n        didDiscover peripheral: CBPeripheral,",\n            to: "    public func centralManager(_ central: CBCentralManager, didConnect peripheral: CBPeripheral)"\n        )\n\n        let admissionOffset = try Self.offset(\n            of: "guard PassiveCoreBluetoothDiscoveryAdmissionPolicy.accepts(",\n            in: body\n        )\n        let managerIdentityOffset = try Self.offset(\n            of: "callbackIsFromActiveManager: central === centralManager",\n            in: body\n        )\n        let poweredOnOffset = try Self.offset(\n            of: "isPoweredOn: central.state == .poweredOn",\n            in: body\n        )\n        let currentScanOffset = try Self.offset(\n            of: "isScanning: scanRequested && central.isScanning",\n            in: body\n        )\n        let receiptOffset = try Self.offset(of: "let receipt = callbackReceipt()", in: body)\n        let candidateMutationOffset = try Self.offset(\n            of: "peripheralByIdentifier[peripheral.identifier] = peripheral",\n            in: body\n        )\n\n        #expect(admissionOffset < managerIdentityOffset)\n        #expect(managerIdentityOffset < poweredOnOffset)\n        #expect(poweredOnOffset < currentScanOffset)\n        #expect(currentScanOffset < receiptOffset)\n        #expect(currentScanOffset < candidateMutationOffset)\n    }\n\n    @Test\n    func scanStateSeparatesRequestIntentFromFrameworkCurrentness() throws {\n        let source = try Self.controllerSource()\n        #expect(source.contains("private var scanRequested = false"))\n        #expect(source.contains("public var isScanRequested: Bool"))\n        #expect(source.contains("scanRequested && centralManager?.isScanning == true"))\n        #expect(!source.contains("isScanning = true"))\n        #expect(!source.contains("isScanning = false"))\n\n        let scanControls = try Self.section(\n            in: source,\n            from: "    public func startScanning(captureAdvertisementCadence: Bool = false) throws {",\n            to: "    /// Explicitly selects the observed peripheral"\n        )\n        let requestOffset = try Self.offset(of: "scanRequested = true", in: scanControls)\n        let startOffset = try Self.offset(of: "centralManager.scanForPeripherals(", in: scanControls)\n        let stopIntentOffset = try Self.offset(of: "scanRequested = false", in: scanControls)\n        let stopTransportOffset = try Self.offset(of: "centralManager.stopScan()", in: scanControls)\n        #expect(requestOffset < startOffset)\n        #expect(startOffset < stopIntentOffset)\n        #expect(stopIntentOffset < stopTransportOffset)\n\n        let centralState = try Self.section(\n            in: source,\n            from: "    public func centralManagerDidUpdateState(_ central: CBCentralManager) {",\n            to: "    public func centralManager(\\n        _ central: CBCentralManager,\\n        didDiscover peripheral: CBPeripheral,"\n        )\n        let clearIntentOffset = try Self.offset(of: "scanRequested = false", in: centralState)\n        let frameworkStateOffset = try Self.offset(of: "if central.isScanning {", in: centralState)\n        #expect(clearIntentOffset < frameworkStateOffset)\n    }\n\n    @Test\n    func researchUIUsesIntentForControlsAndLiveStateForPresentation() throws {\n        let source = try Self.researchViewSource()\n        #expect(source.contains(".disabled(controller.isScanRequested || artifactInteractionLocked)"))\n        #expect(source.contains("Button(controller.isScanRequested ? \\\"Stop scan\\\" : \\\"Start scan\\\")"))\n        #expect(source.contains("if controller.isScanRequested {"))\n        #expect(source.contains("if controller.isScanning {\\n            return \\\"Scanning…\\\""))\n        #expect(source.contains("if controller.isScanRequested {\\n            return \\\"Scan requested — not active\\\""))\n    }\n\n    @Test\n    func cancellationCallGraphKeepsEvidenceBoundaryBeforeRetirement() throws {\n'''
          if test_source.count(test_anchor) != 1:
              raise SystemExit("expected one cancellation-test anchor")
          if "discoveryAdmissionRequiresRequestIntentAndCurrentManagerScanState" in test_source:
              raise SystemExit("scan-state regressions already present")
          test_source = test_source.replace(test_anchor, test_addition, 1)
          tests.write_text(test_source)
          PY

          grep -Fq 'isScanning: scanRequested && central.isScanning' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -Fq 'scanRequested && centralManager?.isScanning == true' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -Fq 'Scan requested — not active' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ES80PassiveCaptureResearchView.swift
          grep -Fq 'discoveryAdmissionRequiresRequestIntentAndCurrentManagerScanState' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerSourceContractTests.swift

      - name: Commit product-only delta and remove patch runner
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_PARENT=0b28cd78000573526cf7aec896d591c7a1197925
          WORKFLOW=.github/workflows/recover-es80-live-scan-state-chat-c7r4m.yml
          CONTROLLER=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          VIEW=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ES80PassiveCaptureResearchView.swift
          TESTS=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerSourceContractTests.swift

          git rm "$WORKFLOW"
          mapfile -t EFFECTIVE < <(git diff --name-only "$PRODUCT_PARENT" | sort)
          mapfile -t EXPECTED < <(printf '%s\n' "$CONTROLLER" "$VIEW" "$TESTS" | sort)
          test "${#EFFECTIVE[@]}" -eq 3
          test "${EFFECTIVE[0]}" = "${EXPECTED[0]}"
          test "${EFFECTIVE[1]}" = "${EXPECTED[1]}"
          test "${EFFECTIVE[2]}" = "${EXPECTED[2]}"

          git add "$CONTROLLER" "$VIEW" "$TESTS"
          git config user.name "nembra-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "[recover es80 passive lifecycle] Separate scan intent from live state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
