name: TMP V14 Field Selected Xcode Custody Materialize

on:
  push:
    branches:
      - repair/v14-field-selected-xcode-custody-sol-20260811
    paths:
      - .github/workflows/tmp-v14-field-selected-xcode-custody-materialize.yml
      - scripts/ci/tmp_materialize_selected_xcode_custody.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-field-selected-xcode-custody-sol-20260811
          fetch-depth: 0

      - name: Bind exact construction head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply selected Xcode custody patch
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tmp_materialize_selected_xcode_custody.py
          /usr/bin/python3 scripts/ci/tmp_materialize_selected_xcode_custody.py
          /usr/bin/python3 -c 'from pathlib import Path; p=Path("scripts/field/install_one_time_capture.command"); s=p.read_text(); s=s.replace("SELECTED_DEVELOPER_DIR=\"$(/usr/bin/xcode-select -p)\" || die \"Could not resolve the system-selected Xcode developer directory.\"", "SELECTED_DEVELOPER_DIR=\"$(/usr/bin/xcode-select -p)\"\n[[ -n \"$SELECTED_DEVELOPER_DIR\" ]] || die \"Could not resolve the system-selected Xcode developer directory.\""); s=s.replace("DEVELOPER_DIR=\"$SELECTED_DEVELOPER_DIR\" DEVELOPER_DIR=\"$SELECTED_DEVELOPER_DIR\" /usr/bin/xcrun", "DEVELOPER_DIR=\"$SELECTED_DEVELOPER_DIR\" /usr/bin/xcrun"); p.write_text(s)'
          git diff --check

      - name: Compile focused authority tests
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile \
            Scripts/capture_tuya_private_input_build_guard.py \
            scripts/ci/tests/test_capture_field_selected_xcode_custody.py \
            scripts/ci/tests/test_capture_field_xcode_environment_authority.py \
            scripts/ci/tests/test_capture_field_developer_dir_authority.py

      - name: Test selected Xcode custody
        shell: bash
        run: |
          set +e
          /usr/bin/python3 scripts/ci/tests/test_capture_field_selected_xcode_custody.py
          status=$?
          if [[ "$status" != "0" ]]; then
            context="$(grep -nE 'xcode-select|SELECTED_DEVELOPER_DIR|SELECTED_XCODEBUILD' scripts/field/install_one_time_capture.command || true)"
            escaped="$(printf '%s' "$context" | /usr/bin/python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))')"
            printf '::error title=Generated selected Xcode custody lines::%s\n' "$escaped"
            exit "$status"
          fi

      - name: Test closed xcodebuild child environment
        shell: bash
        run: /usr/bin/python3 scripts/ci/tests/test_capture_field_xcode_environment_authority.py

      - name: Test caller developer-dir fence
        shell: bash
        run: /usr/bin/python3 scripts/ci/tests/test_capture_field_developer_dir_authority.py

      - name: Test inherited tracked-source windows
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_window_authority.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_tracked_source_compiler_window_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_cocoapods_vnode_attribute_custody.py

      - name: Validate field installer shell
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Publish clean tested production bytes
        shell: bash
        env:
          BRANCH: repair/v14-field-selected-xcode-custody-sol-20260811
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/tmp-v14-field-selected-xcode-custody-materialize.yml \
            scripts/ci/tmp_materialize_selected_xcode_custody.py
          git add \
            scripts/field/install_one_time_capture.command \
            scripts/ci/tests/test_capture_field_selected_xcode_custody.py
          git diff --cached --check
          git config user.name "Nembra V14 Swarm"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): pin selected Xcode field custody"
          git push origin "HEAD:$BRANCH"
