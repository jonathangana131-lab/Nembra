name: Temporary Capture final-review blocker repair

on: [push]

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/repair/v14-capture-final-review-blockers-gpt56'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded non-workflow repair
        shell: bash
        run: |
          python3 .github/scripts/tmp_capture_final_review_blockers_gpt56.py
          git diff --check
          git restore -- .github/workflows/capture-field-build-provenance.yml
          git restore -- .github/workflows/tmp-capture-final-review-blockers-gpt56.yml
          git restore -- .github/scripts/tmp_capture_final_review_blockers_gpt56.py
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'NembraApp/Features/Research/TuyaAccountBridge.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldDependencyProvenanceSourceTests.swift' | sort)"
      - name: Commit source and test repair only
        shell: bash
        run: |
          git config user.name "nembra-v14-gpt56"
          git config user.email "nembra-v14-gpt56@users.noreply.github.com"
          git add NembraApp/Features/Research/TuyaAccountBridge.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldDependencyProvenanceSourceTests.swift
          git diff --cached --check
          git commit -m "fix(capture): preserve status endpoint truth"
          git push origin HEAD:repair/v14-capture-final-review-blockers-gpt56
