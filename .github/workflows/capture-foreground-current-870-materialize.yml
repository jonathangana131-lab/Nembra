name: Materialize Current Capture Foreground Integrity

on:
  push:
    branches:
      - sol/v14-capture-foreground-current-870
    paths:
      - .github/workflows/capture-foreground-current-870-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-foreground-current-870
          fetch-depth: 0

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-foreground-current-870-materialize.yml' 'scripts/ci/materialize_capture_foreground_current_870.py' | sort)"
          test "$actual" = "$expected"

      - name: Apply foreground integrity closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_foreground_current_870.py apply
          python3 scripts/ci/materialize_capture_foreground_current_870.py verify

      - name: Validate parse, scope, and current truth anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/materialize_capture_foreground_current_870.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift
          git diff --check
          parent='870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81'
          test_path='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegritySourceTests.swift'
          git add -N "$test_path"
          changed="$(git diff --name-only "$parent" | grep -v -E '^(\.github/workflows/capture-foreground-current-870-materialize.yml|scripts/ci/materialize_capture_foreground_current_870.py)$' | sort)"
          expected="$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' "$test_path" | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$parent" -- scripts/field/install_one_time_capture.command
          git diff --quiet "$parent" -- NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'private var acceptsViewScopedMembershipRequests = false' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'private var officialConnectionRequestID = UUID()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq '"accounttoken"' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Relaunch before a new stationary read-only attempt' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Publish clean two-path checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-foreground-current-870-materialize.yml
          rm scripts/ci/materialize_capture_foreground_current_870.py
          rm -rf scripts/ci/__pycache__
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): fail closed on foreground loss"
          git push origin HEAD:sol/v14-capture-foreground-current-870
