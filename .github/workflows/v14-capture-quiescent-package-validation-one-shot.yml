name: V14 Capture Quiescent Package Validation One Shot

on:
  push:
    branches:
      - integration/v14-capture-quiescent-application-evidence-sol

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/v14-capture-quiescent-application-evidence-sol
          fetch-depth: 0

      - name: Validate full Capture package
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          swift test --package-path Packages/NembraBluetoothCapture

      - name: Retire validator after green package proof
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-quiescent-package-validation-one-shot.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add .github/workflows/v14-capture-quiescent-package-validation-one-shot.yml
          git commit -m 'chore(capture): retire green quiescent package validator'
          git push origin HEAD:integration/v14-capture-quiescent-application-evidence-sol
