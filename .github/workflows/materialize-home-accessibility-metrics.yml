name: Materialize Home Accessibility Metrics

on:
  push:
    branches:
      - agent/v14-home-accessibility-metric-layout-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact base
        run: |
          test "$(git rev-parse HEAD^)" = "969428349de610282fca3cc3a9b82cab636d3f5a"
      - name: Patch Home accessibility layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/Features/Home/HomeView.swift')
          source = path.read_text()

          old_env = '''    @Environment(VehicleStore.self) private var vehicle
    @Environment(\\.openURL) private var openURL
    @State private var showLockConfirmation = false
'''
          new_env = '''    @Environment(VehicleStore.self) private var vehicle
    @Environment(\\.openURL) private var openURL
    @Environment(\\.dynamicTypeSize) private var dynamicTypeSize
    @State private var showLockConfirmation = false
'''
          if source.count(old_env) != 1:
              raise SystemExit('unexpected HomeView environment anchor')
          source = source.replace(old_env, new_env, 1)

          old_metrics = '''            HStack(spacing: 0) {
                statusMetric(
                    title: "Battery",
                    value: batteryText,
                    icon: batteryIcon,
                    accessibilityIdentifier: "home.metric.battery",
                    valueStyle: batteryValueStyle
                )
                metricDivider
                statusMetric(
                    title: "Trip",
                    value: tripDistanceText,
                    icon: "point.bottomleft.forward.to.point.topright.scurvepath",
                    accessibilityTitle: "Scooter Trip",
                    accessibilityIdentifier: "home.metric.trip"
                )
                metricDivider
                statusMetric(
                    title: "Mode",
                    value: vehicle.state.rideMode?.displayName ?? "—",
                    icon: "gauge.with.dots.needle.67percent",
                    accessibilityIdentifier: "home.metric.mode"
                )
            }
'''
          new_metrics = '''            if dynamicTypeSize.isAccessibilitySize {
                VStack(alignment: .leading, spacing: 12) {
                    statusMetric(
                        title: "Battery",
                        value: batteryText,
                        icon: batteryIcon,
                        accessibilityIdentifier: "home.metric.battery",
                        valueStyle: batteryValueStyle
                    )
                    Divider()
                    statusMetric(
                        title: "Trip",
                        value: tripDistanceText,
                        icon: "point.bottomleft.forward.to.point.topright.scurvepath",
                        accessibilityTitle: "Scooter Trip",
                        accessibilityIdentifier: "home.metric.trip"
                    )
                    Divider()
                    statusMetric(
                        title: "Mode",
                        value: vehicle.state.rideMode?.displayName ?? "—",
                        icon: "gauge.with.dots.needle.67percent",
                        accessibilityIdentifier: "home.metric.mode"
                    )
                }
            } else {
                HStack(spacing: 0) {
                    statusMetric(
                        title: "Battery",
                        value: batteryText,
                        icon: batteryIcon,
                        accessibilityIdentifier: "home.metric.battery",
                        valueStyle: batteryValueStyle
                    )
                    metricDivider
                    statusMetric(
                        title: "Trip",
                        value: tripDistanceText,
                        icon: "point.bottomleft.forward.to.point.topright.scurvepath",
                        accessibilityTitle: "Scooter Trip",
                        accessibilityIdentifier: "home.metric.trip"
                    )
                    metricDivider
                    statusMetric(
                        title: "Mode",
                        value: vehicle.state.rideMode?.displayName ?? "—",
                        icon: "gauge.with.dots.needle.67percent",
                        accessibilityIdentifier: "home.metric.mode"
                    )
                }
            }
'''
          if source.count(old_metrics) != 1:
              raise SystemExit('unexpected Home status metric anchor')
          source = source.replace(old_metrics, new_metrics, 1)
          path.write_text(source)

          test = Path('Packages/NembraCore/Tests/NembraCoreTests/HomeAccessibilityMetricLayoutSourceTests.swift')
          test.write_text('''import Foundation\nimport Testing\n\n@Test("Home status metrics reflow at Accessibility Dynamic Type")\nfunc homeStatusMetricsReflowAtAccessibilityDynamicType() throws {\n    let sourceURL = URL(fileURLWithPath: #filePath)\n        .deletingLastPathComponent()\n        .deletingLastPathComponent()\n        .deletingLastPathComponent()\n        .deletingLastPathComponent()\n        .deletingLastPathComponent()\n        .appendingPathComponent("NembraApp/Features/Home/HomeView.swift")\n    let source = try String(contentsOf: sourceURL, encoding: .utf8)\n\n    #expect(source.contains("@Environment(\\\\.dynamicTypeSize) private var dynamicTypeSize"))\n    #expect(source.contains("if dynamicTypeSize.isAccessibilitySize"))\n    #expect(source.contains("VStack(alignment: .leading, spacing: 12)"))\n    #expect(source.contains("home.metric.battery"))\n    #expect(source.contains("home.metric.trip"))\n    #expect(source.contains("home.metric.mode"))\n}\n''')
          PY
          git diff --check
          grep -q '@Environment(\.dynamicTypeSize) private var dynamicTypeSize' NembraApp/Features/Home/HomeView.swift
          grep -q 'if dynamicTypeSize.isAccessibilitySize' NembraApp/Features/Home/HomeView.swift
      - name: Remove materializer and publish clean product diff
        run: |
          rm .github/workflows/materialize-home-accessibility-metrics.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(home): reflow status metrics for accessibility text"
          git push origin HEAD:${GITHUB_REF_NAME}
