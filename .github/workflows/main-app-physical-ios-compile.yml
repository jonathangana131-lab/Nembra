name: Main App Physical iOS Compile

on:
  pull_request:
    paths:
      - Packages/NembraCore/Sources/NembraCore/SimulationConfiguration.swift
      - Packages/NembraCore/Tests/NembraCoreTests/SimulationConfigurationTests.swift
      - NembraApp/App/AppBootstrap.swift
      - NembraAppTests/NembraAppTests.swift
      - .github/workflows/main-app-physical-ios-compile.yml
  push:
    paths:
      - .github/workflows/main-app-physical-ios-compile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nembra-main-app-physical-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-device:
    name: Compile exact source for physical iOS
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Resolve immutable source head
        id: source
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test -n "$PR_HEAD_SHA"
            printf 'sha=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout immutable exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checkout and Xcode 27
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          printf 'Expected exact head: %s\nActual checkout: %s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          xcodebuild -version
          plutil -lint Nembra.xcodeproj/project.pbxproj
          scripts/validate_pbxproj_references.py

      - name: Compile main app for physical iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          derived="${RUNNER_TEMP}/NembraPhysicalIOSCompile"
          rm -rf "$derived"
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify device product was emitted
        shell: bash
        run: |
          set -euo pipefail
          product="${RUNNER_TEMP}/NembraPhysicalIOSCompile/Build/Products/Debug-iphoneos/Nembra.app"
          test -d "$product"
          test -f "$product/Info.plist"
          printf 'NEMBRA_MAIN_APP_PHYSICAL_IOS_COMPILE head=%s product=%s simulatorEvidence=false physicalHardwareEvidence=false\n' \
            "${{ steps.source.outputs.sha }}" "$product" | tee -a "$GITHUB_STEP_SUMMARY"
