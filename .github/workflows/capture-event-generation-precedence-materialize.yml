name: Capture event generation precedence materializer

on:
  push:
    branches:
      - fix/v14-capture-event-generation-precedence-sol

permissions:
  contents: write

concurrency:
  group: capture-event-generation-precedence-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-event-generation-precedence-sol
          fetch-depth: 0

      - name: Guard exact source lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81 HEAD
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift

      - name: Materialize trusted precedence repair
        shell: python3 {0}
        run: |
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()
          old = '''log("tuya_application_update", update.merging([
                          "generation": String(token.diagnosticGeneration)
                      ]) { current, _ in current })'''
          new = '''log("tuya_application_update", update.merging([
                          "generation": String(token.diagnosticGeneration)
                      ]) { _, trusted in trusted })'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one untrusted-precedence event merge, found {count}')
          path.write_text(source.replace(old, new, 1))

      - name: Focused source contract
        shell: python3 {0}
        run: |
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          start = source.index('private func receivedApplicationUpdate(')
          end = source.index('private func startWatchdog', start)
          receiver = source[start:end]
          assert 'log("tuya_application_update"' in receiver
          assert '"generation": String(token.diagnosticGeneration)' in receiver
          assert ']) { current, _ in current })' not in receiver
          assert ']) { _, trusted in trusted })' in receiver

      - name: Verify effective scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only 870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81...HEAD; git diff --name-only)
          printf '%s\n' "${changed[@]}" | sort -u > /tmp/changed.txt
          grep -Fxq 'NembraApp/App/NembraCaptureEntrypoint.swift' /tmp/changed.txt
          grep -Fxq 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' /tmp/changed.txt
          while IFS= read -r path; do
            case "$path" in
              NembraApp/App/NembraCaptureEntrypoint.swift|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift|.github/workflows/capture-event-generation-precedence-materialize.yml) ;;
              '') ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt

      - name: Self-remove helper and publish clean donor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-event-generation-precedence-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift .github/workflows/capture-event-generation-precedence-materialize.yml
          git diff --cached --check
          git commit -m 'fix(capture): preserve trusted event generation provenance'
          git push origin HEAD:fix/v14-capture-event-generation-precedence-sol
