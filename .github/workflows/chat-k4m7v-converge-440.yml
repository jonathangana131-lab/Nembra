name: chat-k4m7v converge onto #440

on:
  push:
    branches:
      - 'parallel/es80-preh-observation-abort/chat-k4m7v'
    paths:
      - '.github/workflows/chat-k4m7v-converge-440.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-preh-observation-abort/chat-k4m7v
          fetch-depth: 0
      - name: Merge exact canonical composition and remove superseded fence lineage
        shell: bash
        env:
          EXPECTED_PARENT_SHA: 8ff2ee865c0c8546dce752e265df4c6aabcc7285
        run: |
          set -euo pipefail
          git config user.name 'nembra-chat-k4m7v'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin parallel/es80-boundary-transaction-composition/chat-k4v7p
          actual_parent="$(git rev-parse FETCH_HEAD)"
          printf 'Expected canonical parent: %s\nFetched canonical parent:  %s\n' "$EXPECTED_PARENT_SHA" "$actual_parent"
          test "$actual_parent" = "$EXPECTED_PARENT_SHA"

          set +e
          git merge --no-commit --no-ff "$actual_parent"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            printf 'Merge conflicts before canonical restoration:\n'
            git diff --name-only --diff-filter=U
          fi

          canonical_paths=(
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothArtifactAuthorityFence.swift'
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothCaptureRecorder.swift'
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryDecision.swift'
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift'
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryDecisionTests.swift'
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryTransactionDecisionTests.swift'
          )
          for path in "${canonical_paths[@]}"; do
            git checkout "$actual_parent" -- "$path"
            git add "$path"
          done

          obsolete='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothArtifactAuthorityMutationFence.swift'
          if git ls-files --error-unmatch "$obsolete" >/dev/null 2>&1; then
            git rm "$obsolete"
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            printf 'Unexpected unresolved conflicts:\n%s\n' "$remaining" >&2
            exit 1
          fi

          git commit -m 'chore: converge pre-H recovery on canonical boundary composition'
          git rm .github/workflows/chat-k4m7v-converge-440.yml
          git commit -m 'chore: remove canonical convergence workflow'
          git push origin HEAD:parallel/es80-preh-observation-abort/chat-k4m7v
