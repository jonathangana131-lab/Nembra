name: chat-m6v2q terminal reopen composition

on:
  push:
    branches:
      - parallel/es80-terminal-fresh-reopen/chat-m6v2q-3
    paths:
      - .github/workflows/chat-m6v2q-terminal-reopen-compose.yml

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: parallel/es80-terminal-fresh-reopen/chat-m6v2q-3
          fetch-depth: 0

      - name: Apply shared fresh-session fence and terminal reopen tests
        env:
          EXPECTED_COMPOSITION_PARENT: 6ce0708adac0e540baee9391d3bbebdb0fe39d55
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          printf 'Expected composition parent: %s\nActual parent:              %s\n' "$EXPECTED_COMPOSITION_PARENT" "$actual_parent"
          test "$actual_parent" = "$EXPECTED_COMPOSITION_PARENT"

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift')
          source = source_path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              '        case horizonArtifactNotReady\n        case freshTargetSessionRequired\n',
              '        case horizonArtifactNotReady\n        case freshTargetSessionRequired\n        case terminalQueueChangedAfterRetirement(expected: UInt64, actual: UInt64)\n        case retainedEvidenceRoutingRequired(retainedCount: Int)\n',
              'state errors',
          )

          replace_once(
              '''    /// A pre-H abort may reopen only the lifecycle grammar, never the old\n    /// durable capture session. Until a Ready transaction arrives under a\n    /// strictly newer target-session generation, this fence prevents the\n    /// abandoned recorder/session from earning a second Ready boundary.\n    private var abandonedTargetSessionGeneration: UInt64?\n''',
              '''    /// Returning to `.awaitingReady` after either an incomplete pre-H abort\n    /// or a completed terminal artifact may reopen only the lifecycle grammar,\n    /// never the old durable capture session. Until a Ready transaction arrives\n    /// under a strictly newer target-session generation, this fence prevents a\n    /// retired/abandoned recorder session from earning another Ready boundary.\n    private var freshTargetSessionAfterGeneration: UInt64?\n''',
              'shared fresh-session fence declaration',
          )

          replace_once(
              '''            if let abandonedTargetSessionGeneration {\n                guard authority.targetSessionGeneration > abandonedTargetSessionGeneration else {\n                    throw StateError.freshTargetSessionRequired\n                }\n            }\n''',
              '''            if let freshTargetSessionAfterGeneration {\n                guard authority.targetSessionGeneration > freshTargetSessionAfterGeneration else {\n                    throw StateError.freshTargetSessionRequired\n                }\n            }\n''',
              'ready admission fence',
          )

          replace_once(
              '            abandonedTargetSessionGeneration = nil\n            phase = .drainingReady(transaction)\n',
              '            freshTargetSessionAfterGeneration = nil\n            phase = .drainingReady(transaction)\n',
              'fence clear after accepted fresh Ready',
          )

          replace_once(
              '''        abandonedTargetSessionGeneration =\n            committedReadyTransaction.authority.targetSessionGeneration\n''',
              '''        freshTargetSessionAfterGeneration =\n            committedReadyTransaction.authority.targetSessionGeneration\n''',
              'pre-H abort fence assignment',
          )

          marker = '''    /// Requests a fresh lifecycle grammar only when no observation transaction has\n'''
          if source.count(marker) != 1:
              raise SystemExit(f'terminal reopen insertion marker count={source.count(marker)}')

          terminal_reopen = '''    /// Reopens the lifecycle grammar only after the controller has synchronously\n    /// retired the exact terminal authority's post-H queue evidence and presents the\n    /// producer-issued retirement receipt from that operation.\n    ///\n    /// This transition is MainActor-isolated and synchronous by design. The caller\n    /// must invoke it immediately after retirement, without an intervening `await`,\n    /// and pass the controller's current global `lastEnqueuedEventSequence`. If any\n    /// callback advanced that sequence after retirement, the receipt is stale and the\n    /// gate remains terminal.\n    ///\n    /// A retirement receipt that preserved any pending evidence is not sufficient to\n    /// reopen by itself. The gate remains terminal until separately accepted routing,\n    /// quarantine, or adoption authority proves those retained recorder destinations\n    /// are safe. This overload intentionally has no way to forge or guess that proof.\n    ///\n    /// Successful terminal retirement reopens only the queue grammar. The next Ready\n    /// must use a strictly newer durable target-session generation, sharing the same\n    /// fresh-session fence used by pre-H abandonment. Receipt authority, Horizon\n    /// cutoff, terminal transaction revision, and global queue tail must all match\n    /// before any state mutates. The gate instance and `nextRevision` are preserved.\n    @MainActor\n    mutating func reopenAfterTerminalQueueRetirement(\n        _ receipt: PassiveCoreBluetoothTerminalQueueRetirement.Receipt,\n        currentLastEnqueuedEventSequence: UInt64\n    ) throws {\n        guard case let .terminal(transaction) = phase else {\n            throw StateError.invalidTransition\n        }\n        guard receipt.terminalTransactionRevision == transaction.revision,\n              receipt.horizonQueueCutoff == transaction.queueCutoff else {\n            throw StateError.staleTransaction\n        }\n        guard receipt.terminalAuthority == transaction.authority else {\n            throw StateError.authorityChanged\n        }\n        guard currentLastEnqueuedEventSequence == receipt.validatedQueueTailSequence else {\n            throw StateError.terminalQueueChangedAfterRetirement(\n                expected: receipt.validatedQueueTailSequence,\n                actual: currentLastEnqueuedEventSequence\n            )\n        }\n        guard !receipt.requiresRetainedEvidenceRoutingBeforeReopen else {\n            throw StateError.retainedEvidenceRoutingRequired(\n                retainedCount: receipt.retainedPendingEvidenceCount\n            )\n        }\n\n        freshTargetSessionAfterGeneration = transaction.authority.targetSessionGeneration\n        committedReadyTransaction = nil\n        phase = .awaitingReady\n    }\n\n'''
          source = source.replace(marker, terminal_reopen + marker, 1)

          replace_once(
              '''    /// A pre-H abort is the one explicit exception: it may return the gate to\n    /// `.awaitingReady`, but its fresh-target-session fence survives this no-op\n    /// reset and requires a strictly newer durable target session before Ready.\n    ///\n    /// Terminal artifact freeze proves the immutable artifact is sealed; it does NOT\n    /// prove callbacks intentionally withheld after Horizon have been retired from\n    /// the controller FIFO. Reopening here would erase their terminal quarantine and\n    /// make old-generation post-cut evidence drainable again. Terminal -> fresh still\n    /// requires the separate controller-owned post-H retirement/reopen authority.\n''',
              '''    /// Pre-H abort and the explicit post-H retirement transition may return the\n    /// gate to `.awaitingReady`, but their shared fresh-target-session fence survives\n    /// this no-op reset and requires a strictly newer durable target session before\n    /// another Ready can begin.\n    ///\n    /// Terminal artifact freeze by itself proves only that the immutable artifact is\n    /// sealed. It does not retire withheld post-H callbacks and cannot reach this\n    /// reset path without the receipt-gated terminal transition above.\n''',
              'reset documentation',
          )

          if 'private var abandonedTargetSessionGeneration' in source:
              raise SystemExit('old private abort-only fence remains')
          source_path.write_text(source)

          tests = r'''import Testing
          @testable import NembraBluetoothCapture

          @MainActor
          struct PassiveCoreBluetoothObservationBoundaryQueueGateFreshReopenTests {
              private typealias Gate = PassiveCoreBluetoothObservationBoundaryQueueGate
              private typealias Retirement = PassiveCoreBluetoothTerminalQueueRetirement

              private struct Event: Equatable {
                  let queueSequence: UInt64
                  let authority: PassiveCoreBluetoothArtifactAuthorityContext
              }

              private let terminalAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                  targetSessionGeneration: 7,
                  authorityGeneration: 11
              )

              @Test
              func exactRetirementRequiresFreshTargetSessionAndPreservesRevision() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  var events = [
                      Event(queueSequence: 13, authority: terminalAuthority),
                      Event(queueSequence: 14, authority: terminalAuthority)
                  ]

                  let receipt = try retirementReceipt(events: &events, currentTail: 14, gate: gate)
                  #expect(events.isEmpty)
                  #expect(!receipt.requiresRetainedEvidenceRoutingBeforeReopen)
                  #expect(gate.resetForNewCaptureSession() == false)

                  try gate.reopenAfterTerminalQueueRetirement(
                      receipt,
                      currentLastEnqueuedEventSequence: 14
                  )
                  #expect(gate.phase == .awaitingReady)

                  let sameSessionNewAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 7,
                      authorityGeneration: 12
                  )
                  let sameSessionError = captureGateError {
                      try gate.begin(
                          .finiteAcquisitionReady,
                          through: 14,
                          authority: sameSessionNewAuthority
                      )
                  }
                  #expect(sameSessionError == .freshTargetSessionRequired)
                  #expect(gate.phase == .awaitingReady)

                  let freshAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 8,
                      authorityGeneration: 1
                  )
                  let nextReady = try gate.begin(
                      .finiteAcquisitionReady,
                      through: 14,
                      authority: freshAuthority
                  )
                  #expect(nextReady.revision == terminal.horizon.revision + 1)
                  #expect(nextReady.revision == 3)
                  #expect(nextReady.authority == freshAuthority)
              }

              @Test
              func normalResetCannotEraseTerminalFreshSessionFence() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  var events: [Event] = []
                  let receipt = try retirementReceipt(events: &events, currentTail: 12, gate: gate)

                  try gate.reopenAfterTerminalQueueRetirement(
                      receipt,
                      currentLastEnqueuedEventSequence: 12
                  )
                  #expect(gate.resetForNewCaptureSession())

                  let sameSessionAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 7,
                      authorityGeneration: 99
                  )
                  let error = captureGateError {
                      try gate.begin(
                          .finiteAcquisitionReady,
                          through: 12,
                          authority: sameSessionAuthority
                      )
                  }
                  #expect(error == .freshTargetSessionRequired)
                  #expect(gate.phase == .awaitingReady)
              }

              @Test
              func retainedEvidenceCannotReopenWithoutSeparateRoutingAuthority() throws {
                  let newerAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 8,
                      authorityGeneration: 1
                  )
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  var events = [
                      Event(queueSequence: 13, authority: terminalAuthority),
                      Event(queueSequence: 14, authority: newerAuthority)
                  ]

                  let receipt = try retirementReceipt(events: &events, currentTail: 14, gate: gate)
                  #expect(events.map(\.queueSequence) == [14])
                  #expect(receipt.requiresRetainedEvidenceRoutingBeforeReopen)
                  #expect(receipt.retainedPendingEvidenceCount == 1)

                  let error = captureGateError {
                      try gate.reopenAfterTerminalQueueRetirement(
                          receipt,
                          currentLastEnqueuedEventSequence: 14
                      )
                  }
                  #expect(error == .retainedEvidenceRoutingRequired(retainedCount: 1))
                  #expect(gate.phase == .terminal(terminal.horizon))
                  #expect(gate.permittedDrainUpperBound(firstPending: 14, pendingTail: 14) == nil)
              }

              @Test
              func callbackArrivalAfterRetirementKeepsGateTerminal() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  var events = [
                      Event(queueSequence: 13, authority: terminalAuthority),
                      Event(queueSequence: 14, authority: terminalAuthority)
                  ]
                  let receipt = try retirementReceipt(events: &events, currentTail: 14, gate: gate)
                  #expect(events.isEmpty)

                  let error = captureGateError {
                      try gate.reopenAfterTerminalQueueRetirement(
                          receipt,
                          currentLastEnqueuedEventSequence: 15
                      )
                  }
                  #expect(error == .terminalQueueChangedAfterRetirement(expected: 14, actual: 15))
                  #expect(gate.phase == .terminal(terminal.horizon))
                  #expect(gate.permittedDrainUpperBound(firstPending: 15, pendingTail: 15) == nil)
              }

              @Test
              func receiptFromDifferentTerminalTransactionFailsAtomically() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  let otherTerminal = try terminalGate(horizonQueueCutoff: 13, authority: terminalAuthority)
                  var otherEvents: [Event] = []
                  let otherReceipt = try retirementReceipt(
                      events: &otherEvents,
                      currentTail: 13,
                      gate: otherTerminal.gate
                  )

                  let error = captureGateError {
                      try gate.reopenAfterTerminalQueueRetirement(
                          otherReceipt,
                          currentLastEnqueuedEventSequence: 13
                      )
                  }
                  #expect(error == .staleTransaction)
                  #expect(gate.phase == .terminal(terminal.horizon))
              }

              @Test
              func receiptFromDifferentArtifactAuthorityFailsAtomically() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  let otherAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 8,
                      authorityGeneration: 1
                  )
                  let otherTerminal = try terminalGate(horizonQueueCutoff: 12, authority: otherAuthority)
                  var otherEvents: [Event] = []
                  let otherReceipt = try retirementReceipt(
                      events: &otherEvents,
                      currentTail: 12,
                      gate: otherTerminal.gate
                  )

                  let error = captureGateError {
                      try gate.reopenAfterTerminalQueueRetirement(
                          otherReceipt,
                          currentLastEnqueuedEventSequence: 12
                      )
                  }
                  #expect(error == .authorityChanged)
                  #expect(gate.phase == .terminal(terminal.horizon))
              }

              @Test
              func retirementReceiptCannotBeReplayedAfterSuccessfulReopen() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  var events: [Event] = []
                  let receipt = try retirementReceipt(events: &events, currentTail: 12, gate: gate)

                  try gate.reopenAfterTerminalQueueRetirement(
                      receipt,
                      currentLastEnqueuedEventSequence: 12
                  )
                  #expect(gate.phase == .awaitingReady)

                  let replayError = captureGateError {
                      try gate.reopenAfterTerminalQueueRetirement(
                          receipt,
                          currentLastEnqueuedEventSequence: 12
                      )
                  }
                  #expect(replayError == .invalidTransition)
                  #expect(gate.phase == .awaitingReady)
              }

              private func retirementReceipt(
                  events: inout [Event],
                  currentTail: UInt64,
                  gate: Gate
              ) throws -> Retirement.Receipt {
                  try Retirement.retire(
                      from: &events,
                      currentLastEnqueuedEventSequence: currentTail,
                      terminalGate: gate
                  ) { event in
                      Retirement.PendingEvidenceIdentity(
                          queueSequence: event.queueSequence,
                          authority: event.authority
                      )
                  }
              }

              private func terminalGate(
                  horizonQueueCutoff: UInt64,
                  authority: PassiveCoreBluetoothArtifactAuthorityContext
              ) throws -> (gate: Gate, horizon: Gate.Transaction) {
                  var gate = Gate()
                  let ready = try gate.begin(
                      .finiteAcquisitionReady,
                      through: 5,
                      authority: authority
                  )
                  try gate.markBoundaryRecorded(
                      ready,
                      lastProcessedQueueSequence: 5,
                      currentAuthority: authority
                  )
                  let horizon = try gate.begin(
                      .observationHorizon,
                      through: horizonQueueCutoff,
                      processedThrough: 8,
                      authority: authority
                  )
                  try gate.markBoundaryRecorded(
                      horizon,
                      lastProcessedQueueSequence: horizonQueueCutoff,
                      currentAuthority: authority
                  )
                  try gate.completeHorizonArtifactFreeze(
                      horizon,
                      currentAuthority: authority
                  )
                  return (gate, horizon)
              }

              private func captureGateError(
                  _ operation: () throws -> Void
              ) -> Gate.StateError? {
                  do {
                      try operation()
                      return nil
                  } catch {
                      return error as? Gate.StateError
                  }
              }
          }
          '''
          # Strip the workflow's indentation while preserving Swift formatting.
          import textwrap
          tests = textwrap.dedent(tests)
          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateFreshReopenTests.swift')
          if test_path.exists():
              raise SystemExit('fresh-reopen test path unexpectedly already exists')
          test_path.write_text(tests)
          PY

          git config user.name 'nembra-chat-m6v2q'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateFreshReopenTests.swift
          git rm .github/workflows/chat-m6v2q-terminal-reopen-compose.yml
          git commit -m 'Require fresh durable session after terminal retirement'
          git push origin HEAD:parallel/es80-terminal-fresh-reopen/chat-m6v2q-3
