name: Capture Private Read Lease Component Walk

on:
  pull_request:
    paths:
      - scripts/ci/capture_selected_xcode_build_orchestrator.py
      - scripts/ci/tests/test_capture_private_read_lease_component_walk.py
      - .github/workflows/capture-private-read-lease-component-walk.yml
      - .github/workflows/capture-read-lease-held-descriptor-plan-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-private-read-lease-held-plan-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: aa610e1000e58ba5e43e35a75ee8f22486aea5ec
  BOOTSTRAP: .github/workflows/capture-read-lease-held-descriptor-plan-materialize.yml
  PERMANENT_GATE: .github/workflows/capture-private-read-lease-component-walk.yml
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  bootstrap-held-plan:
    name: Bootstrap held-descriptor planning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact authoring input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$PERMANENT_GATE" "$BOOTSTRAP" | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Extract and execute exact embedded materialization payload
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/capture-read-lease-held-descriptor-plan-materialize.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start_marker = "          /usr/bin/python3 -B -I - <<'PY'"
          end_marker = "          PY"
          starts = [index for index, line in enumerate(lines) if line == start_marker]
          if len(starts) != 1:
              raise SystemExit(f'expected one embedded payload start, found {len(starts)}')
          start = starts[0] + 1
          try:
              end = lines.index(end_marker, start)
          except ValueError as error:
              raise SystemExit('embedded payload end marker missing') from error
          payload_lines = lines[start:end]
          if not payload_lines or any(not line.startswith('          ') for line in payload_lines if line):
              raise SystemExit('embedded payload indentation changed')
          payload = '\n'.join(line[10:] if line else '' for line in payload_lines) + '\n'
          completed = subprocess.run(
              ['/usr/bin/python3', '-B', '-I', '-'],
              input=payload,
              text=True,
              check=False,
          )
          if completed.returncode != 0:
              raise SystemExit(completed.returncode)
          PY

      - name: Validate materialized production bytes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py

      - name: Publish only permanent product and regression paths
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$HEAD_REF"
          git checkout "$EXACT_PARENT" -- "$PERMANENT_GATE"
          git rm "$BOOTSTRAP"
          git add \
            "$PERMANENT_GATE" \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            "$BOOTSTRAP" \
            "$PERMANENT_GATE" \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'nembra-swarm-bot'
          git config user.email 'nembra-swarm-bot@users.noreply.github.com'
          git commit -m 'capture: hold descriptors through private lease planning'
          final="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          wanted="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py | LC_ALL=C sort)"
          test "$final" = "$wanted"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$HEAD_REF"
