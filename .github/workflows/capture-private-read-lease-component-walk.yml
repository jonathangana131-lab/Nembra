name: Capture Private Read Lease Component Walk

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget_red_team.py
      - .github/workflows/capture-private-read-lease-component-walk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-private-read-lease-post-validation-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PRODUCT: 16e6ccf5d9736a8c47d4e78eaba86f1cffd02e9c
  EXPECTED_PRODUCT_HELPER_BLOB: c65158590c6d7b2a50862015e6b6dd6e22b33f6e
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  exploit-positive:
    name: Reprove post-validation symlink retarget (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact current product and validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PRODUCT")" = "$EXACT_PRODUCT"
          changed="$(git diff --name-only "$EXACT_PRODUCT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-component-walk.yml \
            scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget_red_team.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse "$EXACT_PRODUCT:scripts/ci/capture_selected_xcode_build_orchestrator.py")" = "$EXPECTED_PRODUCT_HELPER_BLOB"
          test "$(git rev-parse HEAD:scripts/ci/capture_selected_xcode_build_orchestrator.py)" = "$EXPECTED_PRODUCT_HELPER_BLOB"
          git diff --check "$EXACT_PRODUCT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile exploit oracle without bytecode artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          path=Path('scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget_red_team.py')
          compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
          PY

      - name: Require exploit-positive post-validation retarget
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget_red_team.py

      - name: Preserve validation-only truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'NEMBRA_POST_VALIDATION_SYMLINK_RETARGET_CURRENT exactProduct=16e6ccf5d9736a8c47d4e78eaba86f1cffd02e9c exploitPositive=true productBytesChanged=false aclAuthorityMocked=true deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false'
