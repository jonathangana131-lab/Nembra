name: Capture Private Read Lease Component Walk

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/ci/capture_selected_xcode_build_orchestrator.py
      - scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget.py
      - .github/workflows/capture-private-read-lease-component-walk.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  EXACT_PARENT: ca5de78540957f34abc2cbff53b564a93a519078
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  materialize:
    name: Materialize final symlink authority-handoff repair
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact authoring delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-component-walk.yml \
            scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Materialize production repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/capture_selected_xcode_build_orchestrator.py')
          source = path.read_text(encoding='utf-8')
          anchor = (
              '                diagnostic = _open_pinned_path(\n'
              '                    path, is_directory, accepted_signature\n'
              '                )\n'
              '                os.close(diagnostic)\n'
              '        except Exception as error:\n'
          )
          replacement = (
              '                diagnostic = _open_pinned_path(\n'
              '                    path, is_directory, accepted_signature\n'
              '                )\n'
              '                os.close(diagnostic)\n'
              '\n'
              '            # A held directory descriptor does not freeze mutable symlink entries.\n'
              '            # Reclassify every admitted directory subject after all ACLs materialize,\n'
              '            # immediately before authority is handed to the exec-bound build guard.\n'
              '            # The guard\'s initial generation snapshot and vnode monitoring then cover\n'
              '            # the subsequent compiler window.\n'
              '            opened_by_path = {\n'
              '                Path(record["path"]): record for record in self._opened\n'
              '            }\n'
              '            for subject in self._subjects:\n'
              '                subject_record = opened_by_path.get(subject)\n'
              '                if subject_record is None:\n'
              '                    raise SelectedXcodeBuildOrchestratorError(\n'
              '                        "accepted private read-lease subject has no held descriptor"\n'
              '                    )\n'
              '                if not bool(subject_record["is_directory"]):\n'
              '                    continue\n'
              '                _validate_subject_symlinks_from_descriptor(\n'
              '                    subject,\n'
              '                    int(subject_record["descriptor"]),\n'
              '                )\n'
              '        except Exception as error:\n'
          )
          if source.count(anchor) != 1:
              raise SystemExit('production insertion seam is not exact')
          path.write_text(source.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Prove focused repair before publication
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              'scripts/ci/capture_selected_xcode_build_orchestrator.py',
              'scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget.py',
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
          PY
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_post_validation_symlink_retarget.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git diff --check

      - name: Publish product checkpoint
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_HEAD_REF:-}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(capture): revalidate symlinks at lease handoff'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Preserve truth boundary
        shell: bash
        run: |
          echo 'NEMBRA_SYMLINK_HANDOFF_MATERIALIZER physicalAuthorityCreated=false deviceTouched=false bluetoothTouched=false commandAuthorityCreated=false'
