name: Capture Private Read Lease Component Walk

on:
  pull_request:
    paths:
      - scripts/ci/capture_selected_xcode_build_orchestrator.py
      - scripts/ci/tests/test_capture_private_read_lease_component_walk.py
      - scripts/ci/tests/test_capture_private_read_lease_held_symlink_policy.py
      - .github/workflows/capture-private-read-lease-component-walk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-private-read-lease-component-walk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Exact acceptance extends the held-descriptor serial head with descriptor-bound symlink policy.
  EXACT_PARENT: 474507966619ce39288b20de29066711088cd986
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  component-walk:
    name: Prove held-generation private lease admission
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact serial hardening delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-private-read-lease-component-walk.yml \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_held_symlink_policy.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use canonical Darwin temporary root for no-follow fixtures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test -d /private/tmp
          test ! -L /private/tmp
          echo "TMPDIR=/private/tmp" >> "$GITHUB_ENV"

      - name: Compile component-walk sources without artifacts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              "scripts/ci/capture_selected_xcode_build_orchestrator.py",
              "scripts/ci/tests/test_capture_private_read_lease_component_walk.py",
              "scripts/ci/tests/test_capture_private_read_lease_held_symlink_policy.py",
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          PY

      - name: Prove held-generation symlink policy
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_held_symlink_policy.py

      - name: Prove component-walk behavior
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py

      - name: Preserve selected-Xcode composition regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py

      - name: Preserve rollback regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py

      - name: Preserve host-ancestry regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py

      - name: Preserve clean exact head
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve truth boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "NEMBRA_COMPONENT_WALK_BOUNDARY productionLeaseChanged=true heldSymlinkPolicy=true deviceTouched=false bluetoothTouched=false telemetryCreated=false commandAuthorityCreated=false physicalAuthorityCreated=false"
