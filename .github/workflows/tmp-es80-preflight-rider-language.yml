name: Temporary ES80 preflight rider-language transform

on:
  push:
    branches:
      - agent/es80-v14-preflight-rider-language

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply first-screen rider-language closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path("NembraApp/App/NembraApp.swift")
          source = app.read_text(encoding="utf-8")
          old = 'detail: "Required for ES80-FINGERPRINT-v1",'
          new = 'detail: "Required before OFF 1",'
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one rider-visible recipe token, found {source.count(old)}")
          source = source.replace(old, new)

          beginning = source.index("private struct ES80ExperimentOneStationaryPreflightView")
          end = source.index("private struct ES80ExperimentOneFieldNoGoView", beginning)
          preflight = source[beginning:end]
          if "ES80-FINGERPRINT-v1" in preflight:
              raise SystemExit("exact recipe token remains rider-visible in stationary preflight")
          for required in (
              'detail: "Required before OFF 1"',
              'title: "Disconnected"',
              'title: "Connected"',
              'PassiveBluetoothStationaryCaptureChargerState.disconnected.rawValue',
              'Text("Nembra cannot sense the charger directly.',
              'accessibilityIdentifier("es80.capture.stationary-preflight")',
              'accessibilityIdentifier("es80.capture.preflight.continue")',
          ):
              if required not in preflight:
                  raise SystemExit(f"preflight truth/action contract disappeared: {required}")

          details = source[end:]
          if 'Text(recipeID)' not in details or 'Text("Engineering details")' not in details:
              raise SystemExit("exact recipe identity must remain available under engineering details")

          app.write_text(source, encoding="utf-8")
          PY

          cat > Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CapturePreflightRiderLanguageAcceptanceTests.swift <<'SWIFT'
          import Foundation
          import Testing

          @Suite("ES80 Capture preflight rider-language acceptance")
          struct ES80CapturePreflightRiderLanguageAcceptanceTests {
              private static func appSource() throws -> String {
                  let testFile = URL(fileURLWithPath: #filePath)
                  let repositoryRoot = testFile
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()

                  return try String(
                      contentsOf: repositoryRoot
                          .appendingPathComponent("NembraApp")
                          .appendingPathComponent("App")
                          .appendingPathComponent("NembraApp.swift"),
                      encoding: .utf8
                  )
              }

              private static func stationaryPreflight(in source: String) throws -> Substring {
                  let beginning = try #require(
                      source.range(of: "private struct ES80ExperimentOneStationaryPreflightView")
                  )
                  let end = try #require(
                      source.range(
                          of: "private struct ES80ExperimentOneFieldNoGoView",
                          range: beginning.lowerBound..<source.endIndex
                      )
                  )
                  return source[beginning.lowerBound..<end.lowerBound]
              }

              @Test("stationary preflight keeps exact recipe identifiers out of primary rider copy")
              func primaryPreflightIsHumanFirst() throws {
                  let source = try Self.appSource()
                  let preflight = try Self.stationaryPreflight(in: source)

                  #expect(!preflight.contains("ES80-FINGERPRINT-v1"))
                  #expect(preflight.contains("Required before OFF 1"))
                  #expect(preflight.contains("Disconnected"))
                  #expect(preflight.contains("Connected"))
                  #expect(preflight.contains("Nembra cannot sense the charger directly"))
              }

              @Test("copy cleanup cannot weaken charger gate or fresh-run reset")
              func chargerTruthAndActionsRemainStable() throws {
                  let source = try Self.appSource()
                  let preflight = try Self.stationaryPreflight(in: source)

                  #expect(preflight.contains("PassiveBluetoothStationaryCaptureChargerState.disconnected.rawValue"))
                  #expect(preflight.contains("guard selectedChargerState?.rawValue"))
                  #expect(preflight.contains("selectedChargerState = nil"))
                  #expect(preflight.contains("disconnectedDeclarationAccepted = false"))
                  #expect(preflight.contains("es80.capture.stationary-preflight"))
                  #expect(preflight.contains("es80.capture.preflight.charger-blocked"))
                  #expect(preflight.contains("es80.capture.preflight.continue"))
              }

              @Test("exact recipe identity remains available under engineering details")
              func recipeIdentityRemainsInDetails() throws {
                  let source = try Self.appSource()
                  let detailsStart = try #require(
                      source.range(of: "private struct ES80ExperimentOneFieldNoGoView")
                  )
                  let details = source[detailsStart.lowerBound..<source.endIndex]

                  #expect(details.contains("Text(\"Engineering details\")"))
                  #expect(details.contains("Text(recipeID)"))
                  #expect(details.contains("es80.capture.recipe-id"))
                  #expect(details.contains("Physical authorization"))
                  #expect(details.contains("NO-GO"))
              }
          }
          SWIFT

          git diff --check
          git status --short
          git config user.name "nembra-go-worker"
          git config user.email "nembra-go-worker@users.noreply.github.com"
          git add NembraApp/App/NembraApp.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CapturePreflightRiderLanguageAcceptanceTests.swift
          git rm .github/workflows/tmp-es80-preflight-rider-language.yml
          git commit -m "Capture: make stationary preflight rider-first"
          git push origin HEAD:agent/es80-v14-preflight-rider-language
