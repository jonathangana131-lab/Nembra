name: VALIDATION ONLY - Capture Final GO Import Authority Red

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_final_go_record.py
      - scripts/ci/es80_today_final_go_foundation.py
      - scripts/ci/tests/test_es80_today_final_go_import_authority_red.py
      - .github/workflows/capture-today-final-go-import-authority-red.yml

permissions:
  contents: read

jobs:
  expected-red:
    name: Require historical Final GO import to be non-authorizing
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile expected-red import-authority regression
        run: python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_import_authority_red.py
      - name: Prove ordinary imported builder fails closed
        run: python3 scripts/ci/tests/test_es80_today_final_go_import_authority_red.py -v
