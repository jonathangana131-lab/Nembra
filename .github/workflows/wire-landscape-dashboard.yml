name: Wire landscape Dashboard

on:
  push:
    branches: ["feature/landscape-dashboard"]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/landscape-dashboard
          fetch-depth: 0

      - name: Wire Dashboard source
        run: |
          python3 scripts/wire_dashboard_project.py
          scripts/validate_pbxproj_references.py

      - name: Commit project wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Nembra.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo 'No project changes required.'
            exit 0
          fi
          git commit -m 'build: wire landscape Dashboard into Xcode project'
          git push origin HEAD:feature/landscape-dashboard
