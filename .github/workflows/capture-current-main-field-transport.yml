name: Capture Current-Main Field Authorization Transport

on:
  pull_request:
    paths:
      - '.github/workflows/capture-current-main-field-transport.yml'
      - 'scripts/ci/es80_signed_field_artifact_private_runner.py'
      - 'scripts/ci/tests/test_es80_field_authorization_container_transport.py'
      - 'scripts/ci/xcode27_devicectl_manifest_transport_contract.sh'
      - 'scripts/field/transfer_field_authorization.command'

permissions:
  contents: write

concurrency:
  group: capture-current-main-field-transport-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  transport-contract:
    name: Exact-device app-container transport contract
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind immutable PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Verify source transport contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/ci/tests/test_es80_field_authorization_container_transport.py
          /bin/bash -n scripts/field/transfer_field_authorization.command
          /bin/bash scripts/field/transfer_field_authorization.command --self-test

      - name: Prove exact Xcode devicectl app-container help contract
        shell: bash
        run: |
          set -euo pipefail
          export ARTIFACTS_DIR="$RUNNER_TEMP/nembra-field-transport-help"
          /bin/bash scripts/ci/xcode27_devicectl_manifest_transport_contract.sh

      - name: Re-assert non-authorizing scope
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          from pathlib import Path
          paths = [
              Path('scripts/field/transfer_field_authorization.command'),
              Path('scripts/ci/xcode27_devicectl_manifest_transport_contract.sh'),
              Path('scripts/ci/es80_signed_field_artifact_private_runner.py'),
          ]
          text = '\n'.join(p.read_text(encoding='utf-8') for p in paths)
          forbidden = (
              'publishDps(', 'writeValue(', 'resetFactory', 'removeDevice',
              'firmwareUpgrade', 'devicectl device install',
              'devicectl device process launch',
          )
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit('authorizing primitive present: ' + ', '.join(found))
          print('FIELD_TRANSPORT_NON_AUTHORIZING_SCOPE_CONFIRMED')
          PY

      - name: Verify clean checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"

  materialize-poll-safe-successor:
    name: Materialize exact-device plus poll-safe successor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: capture/current-main-field-transport-gpt56sol

      - name: Bind exact authoring head and donor
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='2cfa3804f05c44da9055968111e2181f50ef036b'
          donor='310f15f1fa2d151f209b0f8fa9ef7b58dd82053b'
          base='7d8dc3cf0f2580bc849f884b4e6a639fb4b80fd8'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/capture-current-main-field-transport.yml'
          git fetch --no-tags origin 'refs/heads/capture/v14-field-authorization-poll-safe-gpt56sol:refs/remotes/origin/poll-safe-donor'
          test "$(git rev-parse refs/remotes/origin/poll-safe-donor)" = "$donor"
          git cat-file -e "${base}^{commit}"
          mapfile -t donor_paths < <(git diff --name-only "$base" "$donor" | LC_ALL=C sort)
          expected_paths=(
            'Packages/NembraBluetoothCapture/Sources/NembraCaptureAppAuthorization/AuthenticatedStationaryCaptureAuthorizationInbox.swift'
            'Packages/NembraBluetoothCapture/Tests/NembraCaptureAppAuthorizationTests/AuthenticatedStationaryCaptureAuthorizationInboxTests.swift'
            'scripts/ci/tests/test_es80_field_authorization_container_transport.py'
            'scripts/field/transfer_field_authorization.command'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_paths[@]}" | LC_ALL=C sort)
          test "${donor_paths[*]}" = "${expected_sorted[*]}"

      - name: Three-way compose reviewed poll-safe donor
        shell: bash
        run: |
          set -euo pipefail
          base='7d8dc3cf0f2580bc849f884b4e6a639fb4b80fd8'
          donor='310f15f1fa2d151f209b0f8fa9ef7b58dd82053b'
          paths=(
            'Packages/NembraBluetoothCapture/Sources/NembraCaptureAppAuthorization/AuthenticatedStationaryCaptureAuthorizationInbox.swift'
            'Packages/NembraBluetoothCapture/Tests/NembraCaptureAppAuthorizationTests/AuthenticatedStationaryCaptureAuthorizationInboxTests.swift'
            'scripts/ci/tests/test_es80_field_authorization_container_transport.py'
            'scripts/field/transfer_field_authorization.command'
          )
          git diff --binary --full-index "$base" "$donor" -- "${paths[@]}" > /tmp/poll-safe.patch
          test -s /tmp/poll-safe.patch
          git apply --3way --index /tmp/poll-safe.patch
          git diff --cached --check

      - name: Verify composed non-authorizing invariants
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/field/transfer_field_authorization.command'
          grep -F 'PRIVATE_DEVICE_READER_RELATIVE_PATH="scripts/ci/es80_signed_field_artifact_private_runner.py"' "$script"
          grep -F 'NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE' "$script"
          grep -F 'Caller-selected CoreDevice does not match the retained manifest' "$script"
          grep -F 'retained-install-manifest.incoming' "$script"
          grep -F 'retained-install-manifest.commit' "$script"
          grep -F 'authorization-envelope.incoming' "$script"
          grep -F 'authorization-envelope.commit' "$script"
          grep -F 'make_commit_record' "$script"
          ! grep -F 'MANIFEST_REMOTE="$FIELD_DIRECTORY/retained-install-manifest.json"' "$script"
          ! grep -F 'ENVELOPE_REMOTE="$FIELD_DIRECTORY/authorization-envelope.json"' "$script"
          ! grep -F 'publishDps' "$script"
          ! grep -F 'writeValue(' "$script"

      - name: Run focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B scripts/ci/tests/test_es80_field_authorization_container_transport.py
          /bin/bash -n scripts/field/transfer_field_authorization.command
          /bin/bash scripts/field/transfer_field_authorization.command --self-test
          swift test --package-path Packages/NembraBluetoothCapture

      - name: Publish clean self-retired successor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_parent='2cfa3804f05c44da9055968111e2181f50ef036b'
          git checkout "$expected_parent" -- .github/workflows/capture-current-main-field-transport.yml
          rm -f .github/workflows/capture-current-main-poll-safe-materializer.yml
          git add \
            .github/workflows/capture-current-main-field-transport.yml \
            .github/workflows/capture-current-main-poll-safe-materializer.yml \
            Packages/NembraBluetoothCapture/Sources/NembraCaptureAppAuthorization/AuthenticatedStationaryCaptureAuthorizationInbox.swift \
            Packages/NembraBluetoothCapture/Tests/NembraCaptureAppAuthorizationTests/AuthenticatedStationaryCaptureAuthorizationInboxTests.swift \
            scripts/ci/tests/test_es80_field_authorization_container_transport.py \
            scripts/field/transfer_field_authorization.command
          git diff --cached --check
          git config user.name 'nembra-capture-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Capture: make current-main authorization handoff poll-safe'
          git push origin HEAD:capture/current-main-field-transport-gpt56sol
