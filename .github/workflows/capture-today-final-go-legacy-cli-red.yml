name: Capture TODAY Final GO Legacy CLI Expected Red

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - scripts/ci/es80_today_final_go_record.py
      - scripts/ci/tests/test_es80_today_final_go_legacy_cli_disabled.py
      - .github/workflows/capture-today-final-go-legacy-cli-red.yml

permissions:
  contents: read

jobs:
  legacy-cli-authority:
    name: Reject executable legacy Final GO authority
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Compile legacy CLI authority guard
        run: python3 -m py_compile scripts/ci/tests/test_es80_today_final_go_legacy_cli_disabled.py
      - name: Require legacy foundation CLI to fail closed
        run: python3 scripts/ci/tests/test_es80_today_final_go_legacy_cli_disabled.py -v
