name: V14 Capture Status Secret Redaction e8

on:
  push:
    branches:
      - fix/v14-capture-status-secret-redaction-e8-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-status-secret-redaction-e8-sol
          fetch-depth: 0

      - name: Guard current product and patch both status custody boundaries
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          expected = "e8acd80c6f220529a98a4a4829514829c3321daa"
          changed = subprocess.check_output(["git", "diff", "--name-only", f"{expected}...HEAD"], text=True).splitlines()
          if changed != [".github/workflows/v14-capture-status-secret-redaction-e8.yml"]:
              raise SystemExit(f"stale or contaminated status-redaction helper ancestry: {changed}")

          path = Path("NembraApp/Features/Research/TuyaAccountBridge.swift")
          text = path.read_text()
          old = "        selectedDeviceStatus = statusMap\n"
          new = "        selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]\n"
          if text.count(old) != 1:
              raise SystemExit(f"status admission anchor drifted: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '            "status": selectedDeviceStatus ?? [:],\n'
          new = '            "status": Self.redactSecrets(selectedDeviceStatus ?? [:]),\n'
          if text.count(old) != 1:
              raise SystemExit(f"status export anchor drifted: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Add focused adversarial regression and validate preservation
        shell: python
        run: |
          from pathlib import Path
          test = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift")
          test.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya metadata status secret redaction source contract")
          struct TuyaMetadataStatusSecretRedactionSourceTests {
              @Test("raw status entries are redacted before retained UI state")
              func statusAdmissionCannotBypassRecursiveSecretRedaction() throws {
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let load = try section(in: bridge, from: "private func loadSelectedDeviceDetails", to: "private func signedGET")
                  let body = String(load)
                  #expect(body.contains("selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]"))
                  #expect(!body.contains("selectedDeviceStatus = statusMap"))
              }

              @Test("export re-applies redaction to retained status as defense in depth")
              func exportCannotTrustRetainedStatusMapWithoutRedaction() throws {
                  let bridge = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let export = try section(in: bridge, from: "func prepareRedactedExport()", to: "func resetLink()")
                  let body = String(export)
                  #expect(body.contains("\"status\": Self.redactSecrets(selectedDeviceStatus ?? [:])"))
                  #expect(!body.contains("\"status\": selectedDeviceStatus ?? [:]"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let a = source.range(of: start), let b = source.range(of: end, range: a.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[a.lowerBound..<b.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let root = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent().deletingLastPathComponent()
                      .deletingLastPathComponent().deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: root.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          '''.replace("          ", ""))

      - name: Validate current truth and publish clean two-path repair
        run: |
          set -euo pipefail
          git diff --check
          swiftc -frontend -parse NembraApp/Features/Research/TuyaAccountBridge.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift
          bridge='NembraApp/Features/Research/TuyaAccountBridge.swift'
          grep -Fq 'selectedDeviceStatus = Self.redactSecrets(statusMap) as? [String: Any] ?? [:]' "$bridge"
          grep -Fq '"status": Self.redactSecrets(selectedDeviceStatus ?? [:])' "$bridge"
          ! grep -Fq 'selectedDeviceStatus = statusMap' "$bridge"
          ! grep -Fq '"status": selectedDeviceStatus ?? [:]' "$bridge"
          grep -Fq 'selectedDeviceID == device.id' "$bridge"
          grep -Fq 'Self.redactSecrets(rawDetail)' "$bridge"
          grep -Fq 'Self.redactSecrets(specs["result"]' "$bridge"
          grep -Fq 'Self.redactSecrets(strategy["result"]' "$bridge"
          rm -f .github/workflows/v14-capture-status-secret-redaction-e8.yml
          git add NembraApp/Features/Research/TuyaAccountBridge.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift
          git diff --cached --check
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git commit -m 'fix(capture): redact status secrets at retention and export'
          git push origin HEAD:fix/v14-capture-status-secret-redaction-e8-sol
