name: tmp V14 Signed Origin Descendant Drain Red Team

on:
  push:
    branches:
      - test/capture-signed-origin-prereq-sol-1312t8-20260811
    paths:
      - scripts/ci/tests/test_capture_signed_origin_build_descendant_drain.py
      - .github/workflows/tmp-v14-signed-origin-descendant-drain-red-team.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  expected-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact research ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f76e6ae54b4304df5b02db4f46a72f67daa276e2 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Confirm expected-red post-return output-authority witness
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/descendant-authority.log"
          set +e
          python3 scripts/ci/tests/test_capture_signed_origin_build_descendant_drain.py >"$log" 2>&1
          status="$?"
          set -e
          cat "$log"
          if [[ "$status" -eq 0 ]]; then
            echo '::error title=Expected-red unexpectedly green::Current build guard no longer reproduces post-return descendant output authority; independently review the mechanism before treating this diagnostic as obsolete.'
            exit 1
          fi
          grep -F 'Capture build guard returned while a build descendant retained post-return output mutation authority.' "$log" >/dev/null || {
            echo '::error title=Diagnostic failed for wrong reason::Expected causal post-return output mutation assertion was not observed.'
            exit 1
          }
          echo "Expected-red confirmed at $GITHUB_SHA: a direct build descendant performed a mutation causally gated until after run_guarded_build returned." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish research checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/comment.md" <<EOF
          ### Signed-origin post-return builder-authority expected-red

          Research only; no production source or hardware authority moved.

          Exact diagnostic head \`$GITHUB_SHA\` mechanically reproduced a stronger form of the process-family prerequisite: using the real \`run_guarded_build\` admission/poll/completion/finally path, a descendant of the direct build child performed a mutation that was causally gated until **after** \`run_guarded_build\` returned.

          This does **not** claim real Xcode leaks such a descendant. It proves only that direct-child completion is not itself mechanical revocation of descendant output authority. Any transient-GID compiler-output repair must prove the relevant builder process family is drained, or otherwise loses output authority, before root lock / first protected snapshot.

          This is complementary to #2955: actual compiler-produced output still has to remain causally bound through the first protected snapshot. No post-build self-derived digest is promoted by this test.

          **PHYSICAL NO-GO.**
          EOF
          gh pr comment 2871 --body-file "$RUNNER_TEMP/comment.md"
