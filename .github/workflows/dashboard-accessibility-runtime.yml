name: Dashboard Accessibility Runtime Closure

on:
  push:
    branches:
      - qa/v14-dashboard-accessibility-runtime/gpt56-auto5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-accessibility-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-runtime:
    name: Accessibility screenshot + launch performance
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      ARTIFACTS_DIR: ${{ github.workspace }}/Artifacts/DashboardAccessibility
      DERIVED_DATA: ${{ runner.temp }}/NembraDashboardAccessibilityDerived
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6

      - name: Validate project and test source
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint Nembra.xcodeproj/project.pbxproj
          grep -F 'testLandscapeDashboardAccessibilityRuntimeClosure' NembraUITests/NembraUITests.swift
          grep -F 'testLandscapeDashboardLaunchPerformance' NembraUITests/NembraUITests.swift
          grep -F 'simulatorQualifiedLiveSpeedKilometersPerHour' NembraApp/Features/Dashboard/DashboardView.swift
          grep -F '.frame(width: 44, height: 44)' NembraApp/Features/Dashboard/DashboardView.swift

      - name: Create iOS 27 iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS_DIR"
          xcodebuild -version | tee "$ARTIFACTS_DIR/xcode-version.txt"
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          r=json.load(sys.stdin)["runtimes"]
          c=[x for x in r if x.get("isAvailable", True) and str(x.get("identifier", "")).startswith("com.apple.CoreSimulator.SimRuntime.iOS-27")]
          if not c: raise SystemExit(1)
          c.sort(key=lambda x: tuple(int(p) for p in str(x.get("version","0")).split(".") if p.isdigit()), reverse=True)
          print(c[0]["identifier"])
          ')"
          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys
          items=json.load(sys.stdin)["devicetypes"]
          for name in ["iPhone 12", "iPhone 17", "iPhone 17 Pro", "iPhone 16"]:
              for x in items:
                  if x.get("name")==name:
                      print(x["identifier"]); raise SystemExit(0)
          raise SystemExit(1)
          ')"
          UDID="$(xcrun simctl create "Nembra Dashboard AX $GITHUB_RUN_ID" "$DEVICE_TYPE" "$RUNTIME_ID")"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "runtime=$RUNTIME_ID" > "$ARTIFACTS_DIR/simulator.txt"
          echo "device_type=$DEVICE_TYPE" >> "$ARTIFACTS_DIR/simulator.txt"
          echo "udid=$UDID" >> "$ARTIFACTS_DIR/simulator.txt"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Enable Accessibility XXXL and Increased Contrast
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl ui "$SIM_UDID" content_size accessibility-extra-extra-extra-large
          xcrun simctl ui "$SIM_UDID" increase_contrast enabled
          xcrun simctl ui "$SIM_UDID" appearance dark
          {
            echo '--- simctl ui help ---'
            xcrun simctl help ui || true
          } > "$ARTIFACTS_DIR/simctl-ui.txt" 2>&1

      - name: Run real Dashboard accessibility screenshot test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA" "$ARTIFACTS_DIR/accessibility.xcresult"
          set -o pipefail
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$ARTIFACTS_DIR/accessibility.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            -collect-test-diagnostics never \
            -only-testing:NembraUITests/NembraUITests/testLandscapeDashboardAccessibilityRuntimeClosure \
            CODE_SIGNING_ALLOWED=NO \
            test | tee "$ARTIFACTS_DIR/accessibility-xcodebuild.log"
          mkdir -p "$ARTIFACTS_DIR/accessibility-attachments"
          xcrun xcresulttool export attachments \
            --path "$ARTIFACTS_DIR/accessibility.xcresult" \
            --output-path "$ARTIFACTS_DIR/accessibility-attachments" \
            > "$ARTIFACTS_DIR/accessibility-attachments.log" 2>&1 || true

      - name: Restore standard accessibility settings for performance
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl ui "$SIM_UDID" content_size large
          xcrun simctl ui "$SIM_UDID" increase_contrast disabled

      - name: Measure real Dashboard launch-to-responsive performance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACTS_DIR/performance.xcresult"
          set -o pipefail
          xcodebuild \
            -project Nembra.xcodeproj \
            -scheme Nembra \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$ARTIFACTS_DIR/performance.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            -collect-test-diagnostics never \
            -only-testing:NembraUITests/NembraUITests/testLandscapeDashboardLaunchPerformance \
            CODE_SIGNING_ALLOWED=NO \
            test | tee "$ARTIFACTS_DIR/performance-xcodebuild.log"

      - name: Shutdown Simulator
        if: always()
        shell: bash
        run: |
          xcrun simctl shutdown "$SIM_UDID" >/dev/null 2>&1 || true
          xcrun simctl delete "$SIM_UDID" >/dev/null 2>&1 || true

      - name: Upload Dashboard closure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-accessibility-runtime-${{ github.run_number }}-${{ github.run_attempt }}
          path: Artifacts/DashboardAccessibility
          if-no-files-found: warn
          retention-days: 30
