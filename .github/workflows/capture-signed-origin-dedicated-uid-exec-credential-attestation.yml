name: Capture Signed Origin Dedicated UID Exec Credential Attestation

on:
  push:
    branches:
      - validation/v14-dedicated-uid-exec-credential-attestation-sol-20260812
    paths:
      - .github/workflows/capture-signed-origin-dedicated-uid-exec-credential-attestation.yml
      - scripts/ci/tests/test_capture_signed_app_dedicated_uid_exec_credential_attestation.py
  pull_request:
    paths:
      - .github/workflows/capture-signed-origin-dedicated-uid-exec-credential-attestation.yml
      - scripts/ci/tests/test_capture_signed_app_dedicated_uid_exec_credential_attestation.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-dedicated-uid-exec-credential-attestation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-exec-credential-attestation:
    name: Validate exec-bound build credential attestation
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact validation scope
        shell: bash
        env:
          EXACT_PARENT: c4996ea91cc3482ca8a8d661fd1436a2eee745df
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          actual_paths="$RUNNER_TEMP/nembra-exec-attest-actual.txt"
          expected_paths="$RUNNER_TEMP/nembra-exec-attest-expected.txt"
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$actual_paths"
          cat > "$expected_paths" <<'EOF'
          .github/workflows/capture-signed-origin-dedicated-uid-exec-credential-attestation.yml
          scripts/ci/tests/test_capture_signed_app_dedicated_uid_exec_credential_attestation.py
          EOF
          LC_ALL=C sort -o "$expected_paths" "$expected_paths"
          diff -u "$expected_paths" "$actual_paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile and source-audit exec attestor
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-exec-attest-pycache"
          probe='scripts/ci/tests/test_capture_signed_app_dedicated_uid_exec_credential_attestation.py'
          /usr/bin/python3 -m py_compile \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            "$probe"
          grep -Fq 'helper._structured_credentials(build_uid, build_gid, ())' "$probe"
          grep -Fq 'os.getgrouplist(build_name, build_gid)' "$probe"
          grep -Fq 'os.execve(' "$probe"
          grep -Fq 'samePIDAcrossExec' "$probe"
          grep -Fq 'negativeUnexpectedGroupRejected' "$probe"
          grep -Fq 'negativePayloadSuppressed' "$probe"
          grep -Fq 'effectiveZeroSupplementaryGroupsClaim' "$probe"
          grep -Fq 'privateTuyaInputExercised' "$probe"
          grep -Fq 'appleIdentityExercised' "$probe"
          grep -Fq 'xcodebuildExercised' "$probe"
          grep -Fq 'physicalAuthorityCreated' "$probe"
          if grep -Fq 'preexec_fn=' "$probe"; then
            printf 'Exec attestation may not hide credential changes in preexec_fn.\n' >&2
            exit 21
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run exec-bound credential attestation
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/nembra-dedicated-uid-exec-credential-attestation.log"
          set +e
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_dedicated_uid_exec_credential_attestation.py 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'probe_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Seal retained classification
        if: always()
        shell: bash
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.probe_status }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/nembra-dedicated-uid-exec-credential-attestation.log"
          out="$RUNNER_TEMP/nembra-dedicated-uid-exec-credential-attestation.json"
          /usr/bin/python3 - "$log" "$out" "${PROBE_STATUS:-missing}" "$EXACT_HEAD" <<'PY'
          import hashlib, json, pathlib, sys
          log = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          status = sys.argv[3]
          head = sys.argv[4].lower()
          text = log.read_text(encoding="utf-8", errors="replace") if log.exists() else ""
          payload = {
              "schemaVersion": 1,
              "exactValidationHead": head,
              "exactProductionParent": "c4996ea91cc3482ca8a8d661fd1436a2eee745df",
              "probeStatus": status,
              "successEvidence": [line for line in text.splitlines() if line.startswith("NEMBRA_DEDICATED_UID_EXEC_ATTESTATION_JSON=")],
              "redEvidence": [line for line in text.splitlines() if line.startswith("NEMBRA_DEDICATED_UID_EXEC_ATTESTATION_ERROR=")],
              "probeLogSHA256": hashlib.sha256(text.encode("utf-8")).hexdigest(),
              "physicalAuthorityCreated": False,
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Retain exact exec-attestation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-dedicated-uid-exec-credential-attestation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nembra-dedicated-uid-exec-credential-attestation.log
            ${{ runner.temp }}/nembra-dedicated-uid-exec-credential-attestation.json
          if-no-files-found: error
          retention-days: 7

      - name: Require exact exec-bound credential contract
        shell: bash
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.probe_status }}
        run: |
          set -euo pipefail
          test "${PROBE_STATUS:-missing}" = 0
          log="$RUNNER_TEMP/nembra-dedicated-uid-exec-credential-attestation.log"
          grep -q '^NEMBRA_DEDICATED_UID_EXEC_ATTESTATION_JSON=' "$log"
          grep -q '"preExecIdentityExact": true' "$log"
          grep -q '"postExecIdentityExact": true' "$log"
          grep -q '"preExecDirectoryServiceBaselineExact": true' "$log"
          grep -q '"postExecDirectoryServiceBaselineExact": true' "$log"
          grep -q '"samePIDAcrossExec": true' "$log"
          grep -q '"execPayloadTokenBound": true' "$log"
          grep -q '"preExecFieldOnlyGroupsLeaked": \[\]' "$log"
          grep -q '"postExecFieldOnlyGroupsLeaked": \[\]' "$log"
          grep -q '"negativeUnexpectedGroupRejected": true' "$log"
          grep -q '"negativePayloadSuppressed": true' "$log"
          grep -q '"effectiveZeroSupplementaryGroupsClaim": false' "$log"
          grep -q '"execBoundCredentialAttestationAccepted": true' "$log"
          grep -q '"privateTuyaInputExercised": false' "$log"
          grep -q '"appleIdentityExercised": false' "$log"
          grep -q '"xcodebuildExercised": false' "$log"
          grep -q '"physicalAuthorityCreated": false' "$log"

      - name: Diff hygiene
        if: always()
        shell: bash
        env:
          EXACT_PARENT: c4996ea91cc3482ca8a8d661fd1436a2eee745df
        run: |
          set -euo pipefail
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
