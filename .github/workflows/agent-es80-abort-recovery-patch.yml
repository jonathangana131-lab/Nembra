name: Agent ES80 abort recovery patch

on:
  push:
    branches:
      - agent/es80-abort-fresh-controller-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/es80-abort-fresh-controller-recovery
          fetch-depth: 0
      - name: Apply exact source transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift')
          text = controller.read_text()
          old = '''        clearAcquisitionObjects()
                  connectionPhase = .idle
              }

              private func ensureCaptureHealthy() throws {'''
          new = '''        clearAcquisitionObjects()
                  connectionPhase = .idle
                  // Abort quarantine may be entered by the terminal callback itself.
                  // Schedule here so recovery does not depend on a second callback that
                  // CoreBluetooth is not required to deliver. The scheduler still refuses
                  // to run while any retired same-target attempt awaits its real terminal.
                  scheduleAbortedFreshTargetSessionRecoveryIfNeeded()
              }

              private func ensureCaptureHealthy() throws {'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one failCapture tail, found {text.count(old)}')
          controller.write_text(text.replace(old, new, 1))

          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerAbortFreshSessionConsumerContractTests.swift')
          text = test.read_text()
          old = '''        #expect(controller.contains("scheduleAbortedFreshTargetSessionRecoveryIfNeeded()"))
                  #expect(controller.contains("captureFailed = false"))'''
          new = '''        #expect(controller.contains("scheduleAbortedFreshTargetSessionRecoveryIfNeeded()"))
                  #expect(controller.contains("connectionPhase = .idle\\n        scheduleAbortedFreshTargetSessionRecoveryIfNeeded()"))
                  #expect(controller.contains("captureFailed = false"))'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one recovery contract anchor, found {text.count(old)}')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Verify focused transformation
        shell: bash
        run: |
          grep -F 'scheduleAbortedFreshTargetSessionRecoveryIfNeeded()' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          grep -F 'connectionPhase = .idle\n        scheduleAbortedFreshTargetSessionRecoveryIfNeeded()' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerAbortFreshSessionConsumerContractTests.swift
          git diff --check
      - name: Remove temporary workflow and checkpoint product change
        shell: bash
        run: |
          rm .github/workflows/agent-es80-abort-recovery-patch.yml
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerAbortFreshSessionConsumerContractTests.swift .github/workflows/agent-es80-abort-recovery-patch.yml
          git commit -m 'fix(capture): schedule abort recovery at fail-closed boundary'
          git push origin HEAD:agent/es80-abort-fresh-controller-recovery