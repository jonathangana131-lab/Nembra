name: Capture Private Identity Failed Bootstrap Admission Red Team

on:
  push:
    branches:
      - redteam/v14-private-identity-failed-bootstrap-admission-sol-54c8boot
  pull_request:
    paths:
      - Scripts/provision_capture_tuya_identity_writer.py
      - Scripts/provision_capture_tuya_identity.sh
      - Scripts/bootstrap_capture_tuya_sdk.sh
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_private_identity_failed_bootstrap_admission_red_team.py
      - .github/workflows/capture-private-identity-failed-bootstrap-admission-redteam.yml

permissions:
  contents: read

jobs:
  reject-failed-private-identity-bootstrap-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 40

      - name: Bind diagnostic to exact clean #2944 candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          base='462d4d3862e48af8aa2582733a7c2cf011075b30'
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-private-identity-failed-bootstrap-admission-redteam.yml' \
            'scripts/ci/tests/test_capture_private_identity_failed_bootstrap_admission_red_team.py' | sort)"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile downstream admission diagnostic
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_failed_bootstrap_admission_red_team.py
          /bin/bash -n Scripts/bootstrap_capture_tuya_sdk.sh

      - name: Reject failed private identity before later CocoaPods admission
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_failed_bootstrap_admission_red_team.py
