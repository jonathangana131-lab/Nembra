name: Capture Private Identity Failed Bootstrap Admission Red Team

on:
  push:
    branches:
      - redteam/v14-private-identity-failed-bootstrap-admission-sol-54c8boot

permissions:
  contents: read

jobs:
  reject-failed-private-identity-bootstrap-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REDTEAM_BASE_SHA: 462d4d3862e48af8aa2582733a7c2cf011075b30
      TARGET_SHA: 1834a39ac44e09cf12426cf28cb95ed3c008e9a2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 80

      - name: Bind diagnostic branch and capture witness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$REDTEAM_BASE_SHA" HEAD
          changed="$(git diff --name-only "$REDTEAM_BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/capture-private-identity-failed-bootstrap-admission-redteam.yml' \
            'scripts/ci/tests/test_capture_private_identity_failed-bootstrap-admission-red_team.py' | sort)"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cp scripts/ci/tests/test_capture_private_identity_failed_bootstrap_admission_red_team.py "$RUNNER_TEMP/failed-bootstrap-witness.py"

      - name: Re-anchor to exact production descendant
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p scripts/ci/tests
          cp "$RUNNER_TEMP/failed-bootstrap-witness.py" scripts/ci/tests/test_capture_private_identity_failed_bootstrap_admission_red_team.py

      - name: Compile exact-target downstream admission diagnostic
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/provision_capture_tuya_identity_writer.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_private_identity_failed_bootstrap_admission_red_team.py
          /bin/bash -n Scripts/bootstrap_capture_tuya_sdk.sh

      - name: Reject failed private identity before later CocoaPods admission
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_capture_private_identity_failed_bootstrap_admission_red_team.py
