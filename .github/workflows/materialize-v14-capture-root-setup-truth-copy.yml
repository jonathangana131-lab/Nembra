name: Materialize Capture root setup truth copy

on:
  push:
    branches:
      - repair/v14-capture-root-setup-truth-copy-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-root-setup-truth-copy-sol
          fetch-depth: 0

      - name: Apply exact truth-language repair
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='39b574275f390cfa14c4e106cdabc54c1b9580b2'
          workflow='.github/workflows/materialize-v14-capture-root-setup-truth-copy.yml'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"

          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text(encoding='utf-8')
          old = 'Text("One guided setup proves the account and scooter Nembra will use before passive target correlation begins.")'
          new = 'Text("One guided setup establishes the account and bound-device context Nembra will use before passive target correlation begins.")'
          if app.count(old) != 1:
              raise SystemExit(f'expected one root hero truth anchor, found {app.count(old)}')
          if new in app:
              raise SystemExit('replacement already present before materialization')
          app_path.write_text(app.replace(old, new, 1), encoding='utf-8')

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift')
          test = test_path.read_text(encoding='utf-8')
          anchor = '        #expect(body.contains("NEMBRA CAPTURE"))\n'
          addition = (
              '        #expect(body.contains("One guided setup establishes the account and bound-device context Nembra will use before passive target correlation begins."))\n'
              '        #expect(!body.contains("proves the account and scooter"))\n'
          )
          if addition not in test:
              if test.count(anchor) != 1:
                  raise SystemExit(f'expected one root source-contract anchor, found {test.count(anchor)}')
              test = test.replace(anchor, anchor + addition, 1)
              test_path.write_text(test, encoding='utf-8')
          PY

          rm -- "$workflow"
          git add -A
          git diff --cached --check
          expected_paths="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift' | sort)"
          actual_paths="$(git diff --cached --name-only "$expected_parent" | sort)"
          test "$actual_paths" = "$expected_paths"
          grep -Fq 'One guided setup establishes the account and bound-device context Nembra will use before passive target correlation begins.' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'One guided setup proves the account and scooter Nembra will use before passive target correlation begins.' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq '#expect(!body.contains("proves the account and scooter"))' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift

          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git commit -m 'fix(capture): stop overstating setup authority' -m 'Keep account authorization and bound-device metadata distinct from later physical Bluetooth target correlation. Product behavior and transport authority are unchanged.'
          git push origin HEAD:repair/v14-capture-root-setup-truth-copy-sol
