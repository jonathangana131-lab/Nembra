name: ES80 Ready to Horizon duration exact-product QA

on:
  push:
    branches:
      - cell/es80-ready-horizon-duration-gate/ci/chat-g5v6-1

permissions:
  contents: read

jobs:
  duration-gate-qa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 40
      - name: Verify exact product parent and workflow-only mirror
        env:
          EXPECTED_PRODUCT_SHA: 9ccdf3f0b557264d1d6a88f94f32d04aab881cbe
          EXPECTED_BASE_SHA: b0e06801382e584baab2ebb92dac1c1d67ee3bea
          EXPECTED_WORKFLOW_PATH: .github/workflows/qa-es80-ready-horizon-duration-chat-g5v6-1.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$EXPECTED_WORKFLOW_PATH"
          actual="$(git diff --name-only "$EXPECTED_BASE_SHA" "$EXPECTED_PRODUCT_SHA" | sort)"
          expected="$(printf '%s\n' \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothExperimentOneHorizonDurationGate.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothExperimentOneHorizonDurationGateTests.swift | sort)"
          test "$actual" = "$expected"
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Verify passive and non-forgeable production surface
        run: |
          set -euo pipefail
          source=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothExperimentOneHorizonDurationGate.swift
          test "$(grep -c 'static func admit(' "$source")" -eq 1
          grep -q 'DispatchTime.now().uptimeNanoseconds' "$source"
          grep -q 'fileprivate init(' "$source"
          if grep -R --include='*.swift' -nE '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            exit 1
          fi
      - name: Run NembraCore tests
        run: swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors
      - name: Run full capture package tests
        run: swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors
      - name: Build capture package for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          xcodebuild -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
