name: ES80 Experiment One Rediscovery Composition QA

on:
  push:
    branches:
      - parallel/es80-experiment-one-rediscovery/chat-b3m8p

permissions:
  contents: read

jobs:
  validate-composition:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable head and both accepted dependency ancestries
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor 535b6d1fafc978c3a3254f2369f71c918ae679ae HEAD
          git merge-base --is-ancestor 1bb34f0d02019d59fbe34b6227ab00edca7c6733 HEAD

      - name: Verify exact dependency-relative product shape
        run: |
          base="320de702c607312cfac7bce05999e3dc5b44a30d"
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/es80-experiment-one-rediscovery-ci.yml' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCaptureEvidenceAssessment.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneStructuralEvidenceAssessment.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothPowerCycleObservationSession.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOnePublicAuthoritySurfaceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneStatusPromotionPolicyTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneStructuralEvidenceAssessmentTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneStructuralHorizonScopeTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneStructuralReceiptIntegrityTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneVehicleContextTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothPowerCycleScanDeliveryPolicyTests.swift' | sort)"
          test "$changed" = "$expected"

      - name: Test Bluetooth capture package with warnings as errors
        working-directory: Packages/NembraBluetoothCapture
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build capture package for generic iOS Simulator with warnings as errors
        working-directory: Packages/NembraBluetoothCapture
        run: |
          xcodebuild \
            -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Guard Experiment One and passive producer against application writes
        run: |
          if grep -R -n -E 'writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive capture package must not add application characteristic writes.' >&2
            exit 1
          fi

      - name: Guard accepted rediscovery policy wiring
        run: |
          producer='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothPowerCycleObservationSession.swift'
          grep -Fq 'static let allowsDuplicateDiscoveryCallbacks = true' "$producer"
          grep -Fq 'CBCentralManagerScanOptionAllowDuplicatesKey:' "$producer"
          grep -Fq 'PassiveBluetoothPowerCycleScanDeliveryPolicy.allowsDuplicateDiscoveryCallbacks' "$producer"
          if grep -Fq 'CBCentralManagerScanOptionAllowDuplicatesKey: false' "$producer"; then
            echo 'Accepted rediscovery repair regressed to duplicate filtering.' >&2
            exit 1
          fi

      - name: Guard producer-private Experiment One authority surface
        run: |
          run_file='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift'
          compact_run="$(tr -d '[:space:]' < "$run_file")"
          required=(
            'fileprivateinit?(result:PassiveBluetoothPowerCycleObservationResult)'
            'fileprivateinit(observationSeriesIdentity:PassiveBluetoothCandidateObservationSeriesIdentity,session:PassiveBluetoothCaptureSession)'
            'fileprivatefuncbeginCaptureRecorder('
            'fileprivatefunccaptureEvidenceSnapshot()'
            'fileprivatefunccaptureEvidenceAssessment()'
          )
          for token in "${required[@]}"; do
            printf '%s' "$compact_run" | grep -Fq "$token"
          done

      - name: Guard descriptive structural replay and Horizon scoping
        run: |
          structural='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneStructuralEvidenceAssessment.swift'
          compact_structural="$(tr -d '[:space:]' < "$structural")"
          printf '%s' "$compact_structural" | grep -Fq 'receipt.observedCandidateCount==snapshot.candidates.count'
          printf '%s' "$compact_structural" | grep -Fq 'throughSequenceNumber:horizon.recordSequenceWatermark'
          printf '%s' "$compact_structural" | grep -Fq 'record.sequenceNumber<=horizonWatermark'
          printf '%s' "$compact_structural" | grep -Fq 'casestructurallyCoherent(UUID)'
          if printf '%s' "$compact_structural" | grep -Fq 'casecoherentCaptureEvidence(UUID)'; then
            echo 'Descriptive structural evaluator must not expose authority/PASS wording.' >&2
            exit 1
          fi

      - name: Guard unfinished authority/PASS surface from clients
        run: |
          compact_run="$(tr -d '[:space:]' < Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift)"
          compact_assessment="$(tr -d '[:space:]' < Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCaptureEvidenceAssessment.swift)"
          forbidden=(
            'publicfinalclassPassiveBluetoothExperimentOneRun'
            'publicstructPassiveBluetoothExperimentOnePowerCycleEvidence'
            'publicstructPassiveBluetoothExperimentOneCaptureEvidence'
            'publicfuncbeginCaptureRecorder('
            'publicfunccaptureEvidenceSnapshot('
            'publicfunccaptureEvidenceAssessment('
            'publicstructPassiveBluetoothExperimentOneCaptureEvidenceAssessment'
            'publicenumPassiveBluetoothExperimentOneStatusPromotionPolicy'
            'publicstaticfuncassess('
          )
          for token in "${forbidden[@]}"; do
            if printf '%s%s' "$compact_run" "$compact_assessment" | grep -Fq "$token"; then
              echo "Unfinished Experiment One authority/PASS surface became public: $token" >&2
              exit 1
            fi
          done
