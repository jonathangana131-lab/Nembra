name: Capture Private Review Downstream Current V2 Independent Review

on:
  push:
    branches:
      - review/v14-private-review-downstream-current-v2-sol
    paths:
      - .github/workflows/capture-private-review-downstream-current-v2-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-snapshot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind review to exact head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile Capture authority regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Scripts/capture_tuya_private_input_build_guard.py \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py \
            scripts/ci/tests/test_capture_field_accepted_source_git_replace_custody.py
      - name: Run Capture authority regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            scripts.ci.tests.test_capture_private_review_downstream_helper_execution_custody \
            scripts.ci.tests.test_capture_field_accepted_source_git_replace_custody
