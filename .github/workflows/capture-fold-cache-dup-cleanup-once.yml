name: Capture Fold Cache-Dup Cleanup Once

on:
  push:
    branches:
      - repair/v17-capture-generated-shared-ancestor-cache-sol-20260814
    paths:
      - .github/workflows/capture-fold-cache-dup-cleanup-once.yml

permissions:
  contents: write

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-generated-shared-ancestor-cache-sol-20260814
          fetch-depth: 0

      - name: Bind authoring parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a183b50e14391b1b562966d4a56e558229d3a9a9"
          test "$(git diff --name-only HEAD^...HEAD)" = ".github/workflows/capture-fold-cache-dup-cleanup-once.yml"

      - name: Fold proven cache-dup cleanup and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path("scripts/ci/capture_accepted_build_input_snapshot.py")
          text = helper.read_text(encoding="utf-8")
          old = '''            child = _open_directory_at(current, component, relative)
            if not is_last and directory_cache is not None:
                held = os.dup(child)
                directory_cache[relative] = (held, os.fstat(held))
            os.close(current)
            current = child
'''
          new = '''            child = _open_directory_at(current, component, relative)
            held: int | None = None
            try:
                if not is_last and directory_cache is not None:
                    held = os.dup(child)
                    admitted = os.fstat(held)
                    directory_cache[relative] = (held, admitted)
                    held = None
            except Exception:
                if held is not None:
                    try:
                        os.close(held)
                    except OSError:
                        pass
                os.close(child)
                raise
            os.close(current)
            current = child
'''
          if text.count(old) != 1:
              raise SystemExit("helper cache-dup seam did not match exactly once")
          helper.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py")
          text = test.read_text(encoding="utf-8")
          old_imports = '''import hashlib
import importlib.util
import json
from pathlib import Path
'''
          new_imports = '''import errno
import hashlib
import importlib.util
import json
import os
from pathlib import Path
'''
          if text.count(old_imports) != 1:
              raise SystemExit("continuity-test imports did not match exactly once")
          text = text.replace(old_imports, new_imports)
          marker = '''\n\nif __name__ == "__main__":
    unittest.main(verbosity=2)
'''
          regression = '''

    def test_cache_dup_failure_closes_newly_opened_child_descriptor(self) -> None:
        helper = load()
        with tempfile.TemporaryDirectory(prefix="nembra-shared-ancestor-cache-dup-cleanup-") as raw:
            root = Path(raw)
            (root / "LocalSecrets/TuyaSDK").mkdir(parents=True)
            root_fd = helper._open_repository_root(root)
            real_dup = os.dup
            real_open_directory = helper._open_directory_at
            opened_children: list[int] = []
            dup_calls = 0

            def capture_open(parent_fd: int, name: str, relative: Path) -> int:
                descriptor = real_open_directory(parent_fd, name, relative)
                opened_children.append(descriptor)
                return descriptor

            def fail_cache_dup(descriptor: int) -> int:
                nonlocal dup_calls
                dup_calls += 1
                if dup_calls == 2:
                    raise OSError(errno.EMFILE, "synthetic cache-dup exhaustion")
                return real_dup(descriptor)

            cache: dict[Path, tuple[int, os.stat_result]] = {}
            try:
                with (
                    mock.patch.object(helper, "_open_directory_at", side_effect=capture_open),
                    mock.patch.object(helper.os, "dup", side_effect=fail_cache_dup),
                ):
                    with self.assertRaisesRegex(OSError, "synthetic cache-dup exhaustion"):
                        helper._open_subject(
                            root_fd,
                            Path("LocalSecrets/TuyaSDK"),
                            cache,
                        )

                self.assertEqual(dup_calls, 2)
                self.assertEqual(cache, {})
                self.assertEqual(len(opened_children), 1)
                with self.assertRaises(OSError):
                    os.fstat(opened_children[0])
            finally:
                for descriptor in opened_children:
                    try:
                        os.close(descriptor)
                    except OSError:
                        pass
                os.close(root_fd)
'''
          if text.count(marker) != 1:
              raise SystemExit("continuity-test insertion marker did not match exactly once")
          test.write_text(text.replace(marker, regression + marker), encoding="utf-8")
          PY

          python3 -m py_compile scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish folded cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/capture_accepted_build_input_snapshot.py scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git commit -m "fix(capture): close cache-dup child descriptor on failure"
          git push origin HEAD:repair/v17-capture-generated-shared-ancestor-cache-sol-20260814
