name: Capture Package Contracts 8c2 QA

on:
  push:
    branches:
      - sol/v14-capture-package-contracts-8c2-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-package:
    name: Validate current Capture package contracts
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify exact product parent and validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          product='818d486b1e296399f1d7966ffdc22bc2cd496571'
          test "$(git rev-parse HEAD^)" = "$product"
          changed="$(git diff --name-only "$product" HEAD)"
          test "$changed" = '.github/workflows/capture-package-contracts-8c2-qa.yml'
      - name: Run repaired source-contract suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            TuyaCrossControllerBLEOwnershipLeaseSourceTests \
            TuyaSecureLinkProductSurfaceSourceTests \
            TuyaExplicitCorrelatedTargetConfirmationSourceTests \
            TuyaApplicationEventMetadataPrecedenceSourceTests
          do
            swift test --package-path Packages/NembraBluetoothCapture --filter "$suite"
          done
      - name: Run exact Capture package
        shell: bash
        run: |
          set +e
          swift test --package-path Packages/NembraBluetoothCapture > /tmp/capture-package.log 2>&1
          rc=$?
          set -e
          tail -n 120 /tmp/capture-package.log
          if [[ "$rc" -ne 0 ]]; then
            count=0
            while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              printf '::error file=Packages/NembraBluetoothCapture,title=Capture package remaining failure::%s\n' "$escaped"
              count=$((count + 1))
              [[ "$count" -ge 50 ]] && break
            done < <(grep -E 'recorded an issue|Caught error:|Expectation failed:|Test run with .*issue|Suite .* failed after|Test .* failed after|error:' /tmp/capture-package.log)
            exit "$rc"
          fi
          printf '%s\n' 'Capture package is green on the current recovery plus the four source-contract repairs.'
