name: Capture Package Contracts 8c2 QA

on:
  push:
    branches:
      - sol/v14-capture-package-contracts-8c2-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-package:
    name: Validate current Capture package contracts
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify exact product ancestry and validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          product='8c2e4baefb36d304662e84c9dcf78ef04e48437e'
          git merge-base --is-ancestor "$product" HEAD
          changed="$(git diff --name-only "$product" HEAD)"
          printf '%s\n' "$changed"
          expected="$(cat <<'EOF'
          .github/workflows/capture-package-contracts-8c2-qa.yml
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipLeaseSourceTests.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExplicitCorrelatedTargetConfirmationSourceTests.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkProductSurfaceSourceTests.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSessionTerminalRetirementSourceTests.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaTransportSuccessAuthoritySourceTests.swift
          EOF
          )"
          test "$changed" = "$expected"
      - name: Run repaired source-contract suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            TuyaCrossControllerBLEOwnershipLeaseSourceTests \
            TuyaSecureLinkProductSurfaceSourceTests \
            TuyaExplicitCorrelatedTargetConfirmationSourceTests \
            TuyaApplicationEventMetadataPrecedenceSourceTests \
            TuyaTransportSuccessAuthoritySourceTests \
            TuyaSessionTerminalRetirementSourceTests
          do
            swift test --package-path Packages/NembraBluetoothCapture --filter "$suite"
          done
      - name: Run exact Capture package
        shell: bash
        run: |
          set +e
          swift test --package-path Packages/NembraBluetoothCapture > /tmp/capture-package.log 2>&1
          rc=$?
          set -e
          tail -n 120 /tmp/capture-package.log
          if [[ "$rc" -ne 0 ]]; then
            count=0
            while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              printf '::error file=Packages/NembraBluetoothCapture,title=Capture package remaining failure::%s\n' "$escaped"
              count=$((count + 1))
              [[ "$count" -ge 50 ]] && break
            done < <(grep -E 'recorded an issue|Caught error:|Expectation failed:|Test run with .*issue|Suite .* failed after|Test .* failed after' /tmp/capture-package.log)
            exit "$rc"
          fi
          printf '%s\n' 'Capture package is green on the current recovery plus the six source-contract repairs.'
