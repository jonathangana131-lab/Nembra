name: Temporary Capture human-first closure transform

on:
  push:
    branches:
      - agent/capture-human-first-closure-v14

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/capture-human-first-closure-v14
          fetch-depth: 0

      - name: Close remaining primary-copy leaks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell_path = Path("NembraApp/Features/Research/ES80CaptureShellView.swift")
          shell = shell_path.read_text(encoding="utf-8")
          app_path = Path("NembraApp/App/NembraApp.swift")
          app = app_path.read_text(encoding="utf-8")

          shell_replacements = [
              ('eyebrow: "FIELD AUTHORITY",', 'eyebrow: "FIELD STATUS",'),
              (
                  '.accessibilityHint("The package producer, not this timer, decides whether the window has enough evidence.")',
                  '.accessibilityHint("This timer is guidance only; Nembra decides when enough observations were actually recorded.")',
              ),
              (
                  'message: "No selectable full Bluetooth identifier was absent in both OFF windows and repeated in both ON windows. Nembra will not guess from name, signal strength, service hints, or short IDs.",',
                  'message: "No Bluetooth signal was absent in both OFF windows and repeated in both ON windows. Nembra will not guess from name, signal strength, service hints, or a short ID.",',
              ),
              (
                  'message: "More than one selectable full Bluetooth identifier repeated the OFF / ON pattern. Nembra refuses to break the tie with display name, RSSI, services, or a short identifier.",',
                  'message: "More than one Bluetooth signal repeated the OFF / ON pattern. Nembra refuses to break the tie with name, signal strength, service hints, or a short ID.",',
              ),
              ('eyebrow: "PASSIVE ACQUISITION",', 'eyebrow: "PASSIVE DISCOVERY",'),
              ('title: "Learning the readable surface",', 'title: "Reading available data",'),
              (
                  '.accessibilityHint("Available only after the package accepts the required monotonic observation duration.")',
                  '.accessibilityHint("Available only after Nembra has recorded the required observation time.")',
              ),
              ('eyebrow: "HORIZON READY",', 'eyebrow: "READY TO SEAL",'),
              ('healthItem("FINITE", value: observationReady ? "READY" : "WAIT")', 'healthItem("DISCOVERY", value: observationReady ? "READY" : "WAIT")'),
              ('healthItem("HORIZON", value: horizonReady ? "READY" : "HOLD")', 'healthItem("DURATION", value: horizonReady ? "READY" : "HOLD")'),
              (
                  '"Capture health. Target \\(connection == .connected ? "bound" : "waiting"). Finite acquisition \\(observationReady ? "ready" : "waiting"). Horizon \\(horizonReady ? "ready" : "waiting")."',
                  '"Capture health. Target \\(connection == .connected ? "bound" : "waiting"). Discovery \\(observationReady ? "ready" : "waiting"). Observation duration \\(horizonReady ? "ready" : "waiting")."',
              ),
              (
                  'return .failed("Nembra left the active foreground after Experiment One began. This evidence life cannot regain capture authority; start a fresh Experiment One.")',
                  'return .failed("Nembra left the foreground after capture began, so this run can no longer be trusted. Start a fresh Experiment One.")',
              ),
              (
                  'return .failed(coordinator.lastDiagnostic ?? "The passive target connection ended before an accepted observation could be sealed. Start a fresh Experiment One rather than replaying consumed authority.")',
                  'return .failed(coordinator.lastDiagnostic ?? "The passive target connection ended before the observation could be sealed. Start a fresh Experiment One; this session cannot be reused.")',
              ),
              (
                  'return .bluetoothUnavailable("The package-owned CoreBluetooth controller is unavailable for this coordinator.")',
                  'return .bluetoothUnavailable("Bluetooth capture is unavailable for this run. Check Bluetooth and start a fresh Experiment One.")',
              ),
              (
                  'return .correlationFailed("The four windows did not preserve one valid package-issued observation authority and required OFF 1, ON 1, OFF 2, ON 2 ordering.")',
                  'return .correlationFailed("The four windows did not remain one continuous valid observation series in the required OFF 1, ON 1, OFF 2, ON 2 order.")',
              ),
              (
                  'return .correlationFailed("The package-owned Experiment One workflow has no active correlation progress and no final result.")',
                  'return .correlationFailed("Nembra lost the active OFF / ON sequence before it produced a result. Start again from OFF 1.")',
              ),
              (
                  'return .correlationFailed("A known Bluetooth, scan-liveness, or foreground gap invalidated this four-window observation series.")',
                  'return .correlationFailed("A Bluetooth, scanning, or foreground interruption invalidated this four-window observation series.")',
              ),
              (
                  'localFailureMessage = "Nembra could not create a fresh package-owned Experiment One workflow: \\(String(describing: error))"',
                  'localFailureMessage = "Nembra could not create a fresh Capture run: \\(experimentErrorMessage(error))"',
              ),
              ('return "The package-owned physical execution gate is closed for this build."', 'return "This build is still locked for real scooter capture."'),
              ('return "The correlated-target admission is already prepared. Continue the current rediscovery."', 'return "The target is already confirmed. Continue looking for that same signal."'),
              ('return "No sealed correlated-target admission is ready for this step."', 'return "Confirm one correlated Bluetooth signal before this step."'),
              ('return "The four-window evidence authority or ordering is invalid."', 'return "The four OFF / ON windows were not one valid ordered observation series."'),
              ('return "The exact correlated target has not reappeared in the fresh post-admission scan yet. Keep scanning and retry."', 'return "The same correlated signal has not reappeared yet. Keep the scooter ON and retry."'),
              ('return "The exact correlated target is visible but CoreBluetooth reports it as non-connectable."', 'return "The correlated signal is visible but cannot be opened for a passive Bluetooth connection."'),
              ('return "The package-owned passive capture controller is unavailable."', 'return "Bluetooth capture is unavailable for this run."'),
              ('return "The accepted Ready epoch and minimum monotonic observation interval are not complete yet."', 'return "Discovery or the required observation time is not complete yet."'),
              ('return "This Experiment One artifact is already immutable."', 'return "This Capture is already sealed."'),
              ('return "The accepted correlation-window duration is invalid in this build."', 'return "This build has an invalid required observation-window duration."'),
              ('return "All four correlation windows are already sealed."', 'return "All four OFF / ON windows are already complete."'),
              ('return "This correlation series was invalidated by a known evidence gap."', 'return "A known interruption invalidated this four-window series."'),
              ('return "The current correlation window is already active."', 'return "This observation window is already running."'),
              ('return "No correlation window is currently active."', 'return "No observation window is running."'),
              ('return "Scanning was requested, but the authoritative receipt window has not opened yet."', 'return "Nembra is still waiting for Bluetooth scanning to become ready."'),
              ('return "CoreBluetooth never confirmed scan readiness inside the bounded startup interval."', 'return "Bluetooth scanning did not become ready in time. Start this window again."'),
              ('return "The exact window\'s CoreBluetooth scan became inactive."', 'return "Bluetooth scanning stopped during this window."'),
              ('return "The producer\'s monotonic receipt window has not reached the required minimum yet."', 'return "Keep this window running until Nembra accepts the required observation time."'),
              ('return "The producer could not establish a monotonic observation window."', 'return "Nembra could not keep a reliable timing sequence for this window. Start a fresh experiment."'),
              ('return "The local observation-window sequence was exhausted."', 'return "This OFF / ON sequence has already ended."'),
              ('return "The package-owned Bluetooth controller has not been instantiated for this build."', 'return "Bluetooth capture is not ready on this build."'),
              ('return "Waiting for CoreBluetooth to report its state."', 'return "Waiting for Bluetooth status."'),
              ('return "CoreBluetooth reported an unknown future state. Capture remains unavailable."', 'return "Bluetooth reported an unsupported future state. Capture remains unavailable."'),
              ('if presentationCanFinalizeObservationHorizon(status: status) { return "H READY" }', 'if presentationCanFinalizeObservationHorizon(status: status) { return "SEAL READY" }'),
              ('if presentationConnection(status: status) == .connected { return "ACQUIRE" }', 'if presentationConnection(status: status) == .connected { return "DISCOVER" }'),
              ('return "Experiment One progress, observation Horizon ready to seal"', 'return "Experiment One progress, required observation complete and ready to seal"'),
              ('case .complete: return "Evidence, sealed."', 'case .complete: return "Capture, sealed."'),
              ('case .readyToSeal, .observing: return "Hold the evidence line."', 'case .readyToSeal, .observing: return "Keep it steady."'),
              ('case .acquiring, .connecting, .rediscoveringTarget, .targetReacquired: return "Bind the real signal."', 'case .acquiring, .connecting, .rediscoveringTarget, .targetReacquired: return "Stay with this signal."'),
              ('default: return "Find the real scooter signal."', 'default: return "Find the scooter signal."'),
              ('case .correlationFailed, .failed: return "Evidence stopped"', 'case .correlationFailed, .failed: return "Capture stopped"'),
              ('case .acquiring: return "Finite acquisition"', 'case .acquiring: return "Read-only discovery"'),
              ('case .readyToSeal: return "Horizon ready"', 'case .readyToSeal: return "Ready to seal"'),
              ('case .finalizing: return "Sealing artifact"', 'case .finalizing: return "Sealing capture"'),
          ]

          for old, new in shell_replacements:
              count = shell.count(old)
              if count != 1:
                  raise SystemExit(f"shell guard failed: expected one occurrence, found {count}: {old}")
              shell = shell.replace(old, new)

          old_preflight = 'detail: "Required for ES80-FINGERPRINT-v1",'
          new_preflight = 'detail: "Required for this capture",'
          if app.count(old_preflight) != 1:
              raise SystemExit(f"app guard failed: expected one recipe-bearing preflight detail, found {app.count(old_preflight)}")
          app = app.replace(old_preflight, new_preflight)

          primary_forbidden = [
              "full Bluetooth identifier",
              "FIELD AUTHORITY",
              "PASSIVE ACQUISITION",
              'healthItem("FINITE"',
              'healthItem("HORIZON"',
              "The package producer, not this timer",
              "Available only after the package accepts the required monotonic observation duration",
              "package-owned CoreBluetooth controller",
              "package-owned Experiment One workflow",
              "producer's monotonic receipt window",
              "post-admission scan",
              "accepted Ready epoch",
              "authoritative receipt window",
              "CoreBluetooth never confirmed scan readiness",
              "CoreBluetooth scan became inactive",
              'return "Finite acquisition"',
              'return "Horizon ready"',
          ]
          leaked = [value for value in primary_forbidden if value in shell]
          if leaked:
              raise SystemExit(f"shell guard failed: primary/helper engineering copy remains: {leaked}")

          preflight_start = app.index("private struct ES80ExperimentOneStationaryPreflightView")
          preflight_end = app.index("private struct ES80ExperimentOneFieldNoGoView", preflight_start)
          preflight = app[preflight_start:preflight_end]
          if "ES80-FINGERPRINT-v1" in preflight:
              raise SystemExit("app guard failed: recipe token remains in primary stationary preflight")

          required_shell = [
              "PASSIVE / READ ONLY",
              "Scooter OFF",
              "Scooter ON",
              "Share Capture",
              "View Details",
              "guard status.physicalProcedurePermitted else",
              "PassiveBluetoothExperimentOneFinalShareIntegrity.inspect(artifact.json)",
              "finalShareIntegrityReport != nil",
              "Truth boundary",
              "CoreBluetooth",
              "Software Export SHA-256",
              "Runtime executable SHA-256",
              "does not authenticate the physical ES80",
          ]
          missing_shell = [value for value in required_shell if value not in shell]
          if missing_shell:
              raise SystemExit(f"shell guard failed: truth/action contract disappeared: {missing_shell}")

          required_app = [
              'detail: "Required for this capture"',
              'title: "Disconnected"',
              'title: "Connected"',
              'Text("Disconnect charger to continue")',
              'PassiveBluetoothExperimentOneFieldExecutionGate.permitsPhysicalProcedure',
              'selectedChargerState = nil',
              'disconnectedDeclarationAccepted = false',
          ]
          missing_app = [value for value in required_app if value not in app]
          if missing_app:
              raise SystemExit(f"app guard failed: charger truth/action contract disappeared: {missing_app}")

          shell_path.write_text(shell, encoding="utf-8")
          app_path.write_text(app, encoding="utf-8")
          PY
          git diff --check

      - name: Commit product-only delta and remove transformer
        run: |
          git config user.name "nembra-v14-human-first-closure"
          git config user.email "noreply@github.com"
          git add NembraApp/App/NembraApp.swift NembraApp/Features/Research/ES80CaptureShellView.swift
          git rm .github/workflows/temporary-human-first-closure-transform.yml
          git diff --cached --check
          git commit -m "capture: close remaining primary engineering copy leaks"
          git push origin HEAD:agent/capture-human-first-closure-v14
