name: Capture Accepted Root Whole Read Lease Red Team

on:
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_accepted_root_whole_read_lease_red_team.py
      - .github/workflows/capture-accepted-root-whole-read-lease-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-accepted-root-whole-read-lease-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: bf2f1e1d718849ef6741ec532e28975527311e95

jobs:
  exploit-positive:
    name: Whole accepted-root read lease gap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-accepted-root-whole-read-lease-red-team.yml \
            scripts/ci/tests/test_capture_accepted_root_whole_read_lease_red_team.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          for path in \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/capture_accepted_build_root_custody.py \
            scripts/ci/capture_selected_xcode_build_orchestrator.py; do
            test "$(git hash-object "$path")" = "$(git rev-parse "$EXACT_PARENT:$path")"
          done

      - name: Run exploit-positive whole-root lease classifier
        id: oracle
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export TMPDIR="${{ runner.temp }}"
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_root_whole_read_lease_red_team.py \
            2>&1 | tee "$RUNNER_TEMP/accepted-root-whole-read-lease-${{ matrix.os }}.log"

      - name: Capture checkout cleanliness diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/checkout-status-${{ matrix.os }}.log"
          git diff --no-ext-diff -- > "$RUNNER_TEMP/checkout-unstaged-diff-${{ matrix.os }}.log"
          git diff --cached --no-ext-diff -- > "$RUNNER_TEMP/checkout-staged-diff-${{ matrix.os }}.log"

      - name: Retain validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accepted-root-whole-read-lease-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/accepted-root-whole-read-lease-${{ matrix.os }}.log
            ${{ runner.temp }}/checkout-status-${{ matrix.os }}.log
            ${{ runner.temp }}/checkout-unstaged-diff-${{ matrix.os }}.log
            ${{ runner.temp }}/checkout-staged-diff-${{ matrix.os }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exploit-positive verdict and clean checkout
        if: always()
        shell: bash
        env:
          ORACLE_OUTCOME: ${{ steps.oracle.outcome }}
        run: |
          set -euo pipefail
          test "$ORACLE_OUTCOME" = success
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "EXPLOIT_POSITIVE=true"
          echo "PRODUCT_ACCEPTANCE=false"
          echo "PHYSICAL_AUTHORITY=false"
