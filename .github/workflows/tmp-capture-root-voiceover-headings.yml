name: Temporary Capture root VoiceOver heading materializer

on:
  push:
    branches:
      - agent/v14-capture-live-main-visual-acceptance-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Guard exact frozen lineage and add section heading semantics
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='5a2b79c3f3c135a004b4f8c92aae0a8757c161d3'
          expected_product='89843dcaf63a0c3c48a0dc605878df2e4362f0fd'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git rev-parse HEAD^^)" = "$expected_product"
          test "$(git diff --name-only "$expected_product"..HEAD)" = '.github/workflows/tmp-capture-root-voiceover-headings.yml'
          python3 - <<'PY'
          from pathlib import Path
          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          app = app_path.read_text()
          account_old = "                        .font(isAccessibilityLayout ? .headline : .title3.bold())\n                        .foregroundStyle(tuya.isLinked ? Color.green : Color.primary)\n"
          account_new = "                        .font(isAccessibilityLayout ? .headline : .title3.bold())\n                        .accessibilityAddTraits(.isHeader)\n                        .foregroundStyle(tuya.isLinked ? Color.green : Color.primary)\n"
          if app.count(account_old) != 1:
              raise SystemExit(f'account heading seam changed: {app.count(account_old)} matches')
          app = app.replace(account_old, account_new, 1)
          scooter_old = "            Text(\"Choose this scooter\")\n                .font(.title3.bold())\n"
          scooter_new = "            Text(\"Choose this scooter\")\n                .font(.title3.bold())\n                .accessibilityAddTraits(.isHeader)\n"
          if app.count(scooter_old) != 1:
              raise SystemExit(f'scooter heading seam changed: {app.count(scooter_old)} matches')
          app_path.write_text(app.replace(scooter_old, scooter_new, 1))
          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift')
          test = test_path.read_text()
          anchor = "        #expect(root.contains(\".accessibilityAddTraits(.isHeader)\"))\n        #expect(root.contains(\"Text(\\\"Tuya Smart user code\\\")\"))\n"
          replacement = "        #expect(root.contains(\".accessibilityAddTraits(.isHeader)\"))\n        #expect(root.contains(\".font(isAccessibilityLayout ? .headline : .title3.bold())\\n                        .accessibilityAddTraits(.isHeader)\"))\n        #expect(root.contains(\"Text(\\\"Choose this scooter\\\")\\n                .font(.title3.bold())\\n                .accessibilityAddTraits(.isHeader)\"))\n        #expect(root.contains(\"Text(\\\"Tuya Smart user code\\\")\"))\n"
          if test.count(anchor) != 1:
              raise SystemExit(f'focused accessibility source-test seam changed: {test.count(anchor)} matches')
          test_path.write_text(test.replace(anchor, replacement, 1))
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift' | sort)"

      - name: Commit semantic repair and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-capture-root-voiceover-headings.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          git diff --cached --check
          git commit -m 'fix(capture): expose setup sections to VoiceOver rotor'
          git push origin HEAD:agent/v14-capture-live-main-visual-acceptance-sol
