name: Materialize Capture Application Secret Value Custody d56a

on:
  push:
    branches:
      - sol/v14-capture-application-secret-value-custody-d56a

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact product ancestry and helper-only scope
        shell: bash
        run: |
          set -euo pipefail
          parent='d56a30c699fbdecec6130537d3f3f4f4232f5c47'
          git merge-base --is-ancestor "$parent" HEAD
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/scripts/materialize-capture-application-secret-value-custody.py'
          test "${changed[1]}" = '.github/workflows/materialize-capture-application-secret-value-custody-d56a.yml'
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift
          grep -Fq 'sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Import exact RED contract
        shell: bash
        run: |
          set -euo pipefail
          red='8801b67d45e6082f08cf98394411cf5f2e748621'
          path='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift'
          git fetch --no-tags origin red/v14-capture-application-secret-value-custody-a7a28-sol
          test "$(git rev-parse FETCH_HEAD)" = "$red"
          git show "$red:$path" > "$path"

      - name: Apply exact-value custody repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize-capture-application-secret-value-custody.py
          git diff --check

      - name: Validate RED contract shape and Swift syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = source.index('@MainActor\nprivate final class SmartLifeDriver')
          end = source.index('#endif\n\nprivate enum AppleAccountAuthorizationError', start)
          driver = source[start:end]
          callback = driver[driver.index('func device(_ device: ThingSmartDevice?, dpsUpdate'):driver.index('private static let secretKeyFragments')]
          assert 'NembraTuyaPrivateIdentity.appKey' in driver
          assert 'NembraTuyaPrivateIdentity.appSecret' in driver
          assert 'exactSecretValues' in driver
          assert 'replacingOccurrences' in driver
          assert 'String(describing: Self.redactApplicationSecrets(value))' not in callback
          assert 'redactingExactApplicationSecrets' in callback
          assert 'collisionSafeRedactedKey' in callback
          print('application exact-secret value custody: PASS')
          PY
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift

      - name: Collapse helpers and publish clean donor
        shell: bash
        run: |
          set -euo pipefail
          parent='d56a30c699fbdecec6130537d3f3f4f4232f5c47'
          rm .github/workflows/materialize-capture-application-secret-value-custody-d56a.yml
          rm .github/scripts/materialize-capture-application-secret-value-custody.py
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift
          git add -u .github/workflows/materialize-capture-application-secret-value-custody-d56a.yml \
            .github/scripts/materialize-capture-application-secret-value-custody.py
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' \
            commit -m 'fix(capture): bind private app secrets to event custody'
          mapfile -t effective < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${effective[@]}"
          test "${#effective[@]}" = 2
          test "${effective[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${effective[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:sol/v14-capture-application-secret-value-custody-d56a
