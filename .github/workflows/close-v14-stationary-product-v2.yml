name: Close V14 stationary Capture product v2

on:
  push:
    branches: [integration/v14-capture-stationary-product-closure-sol]
    paths:
      - '.github/workflows/close-v14-stationary-product-v2.yml'

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact convergence inputs
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "be6f3271b83a7f23172b4d7eb0bfb675d2f98545"
          test "$(git hash-object Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift)" = "0950b34fbc56fdfd8ea2f723cedea21ede42c38c"
          python3 -m py_compile .ci-patches/close-v14-stationary-product.py

      - name: Narrow the one ambiguous deterministic replacement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.ci-patches/close-v14-stationary-product.py')
          s = p.read_text()
          old = '''app = replace_once(
              app,
              '        if phase == .baseline || phase == .powerOn || phase == .scanning {\\n            correlationSession?.abandonCurrentWindow()\\n            correlationSession = nil\\n        }',
              '        if phase == .baseline || phase == .powerOn || phase == .scanning {\\n            stopCorrelationProgressObservation()\\n            correlationSession?.abandonCurrentWindow()\\n            correlationSession = nil\\n        }\\n        pendingCorrelatedTargetID = nil\\n        selectedID = nil\\n        targetCorrelationOperatorConfirmed = false',
              'membership revokes target promotion',
          )'''
          new = '''app = replace_once(
              app,
              '        membershipDeviceID = nil\\n        if phase == .baseline || phase == .powerOn || phase == .scanning {\\n            correlationSession?.abandonCurrentWindow()\\n            correlationSession = nil\\n        }\\n        membershipStatus = "Official SDK login changed. Exact scooter membership must be verified again."',
              '        membershipDeviceID = nil\\n        if phase == .baseline || phase == .powerOn || phase == .scanning {\\n            stopCorrelationProgressObservation()\\n            correlationSession?.abandonCurrentWindow()\\n            correlationSession = nil\\n        }\\n        pendingCorrelatedTargetID = nil\\n        selectedID = nil\\n        targetCorrelationOperatorConfirmed = false\\n        membershipStatus = "Official SDK login changed. Exact scooter membership must be verified again."',
              'membership revokes target promotion',
          )'''
          if s.count(old) != 1:
              raise SystemExit(f'helper ambiguity patch expected one source block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 -m py_compile .ci-patches/close-v14-stationary-product.py

      - name: Apply deterministic product closure
        run: |
          set -u
          set +e
          python3 .ci-patches/close-v14-stationary-product.py > .ci-patches/last-close-error.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci-patches/last-close-error.txt
            git commit -m "ci: persist stationary closure patch failure v2" || true
            git push origin HEAD:integration/v14-capture-stationary-product-closure-sol
            exit "$status"
          fi
          rm -f .ci-patches/last-close-error.txt
          git diff --check
          ! grep -Fq 'var likely: Bool { knownID }' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'accepted-prior-physical-corebluetooth-uuid' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'try? await sessionLedger.markAuthenticationFailed(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'try? await sessionLedger.markSourceAuthorityInvalidated(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'try? await sessionLedger.markObservationContinuityInvalidated(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'try? await sessionLedger.endConnection(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq '@Published private(set) var correlationProgress' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'func confirmCorrelatedTarget()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'targetCorrelationOperatorConfirmed = true' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'sessionLedger.markInternalLifecycleFailure(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'public func markInternalLifecycleFailure' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift

      - name: Commit product and retire patch machinery
        run: |
          set -euo pipefail
          rm -f .ci-patches/close-v14-stationary-product.py
          rm -f .ci-patches/last-close-error.txt
          rm -f .github/workflows/close-v14-stationary-product.yml
          rm -f .github/workflows/close-v14-stationary-product-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): close stationary target and lifecycle product"
          git push origin HEAD:integration/v14-capture-stationary-product-closure-sol
