name: "Temporary ES80 progress accessibility closure"

on:
  push:
    branches:
      - "product/es80-v14-progress-accessibility-current/gpt56-thinking-go"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply guarded transform
        shell: bash
        env:
          EXPECTED_PARENT: "de9eb4d0c2ffb314f1df98e32050405a79e94abc"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 scripts/ci/tmp_es80_v14_progress_accessibility_current_gpt56.py
          git diff --check
          git config user.name "gpt56-thinking-go"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-v14-progress-accessibility-current-gpt56.yml
          git rm scripts/ci/tmp_es80_v14_progress_accessibility_current_gpt56.py
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git add NembraUITests/ES80ResearchCaptureUITests.swift
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureRiderLanguageAcceptanceTests.swift
          git commit -m "fix(capture): recompose progress for accessibility"
          git push origin HEAD:"${GITHUB_REF_NAME}"
