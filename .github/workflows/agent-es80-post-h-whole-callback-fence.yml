name: agent es80 post h whole callback fence
on:
  push:
    branches: ['agent/es80-controller-canonical-boundary-v14']
    paths: ['.github/workflows/agent-es80-post-h-whole-callback-fence.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/es80-controller-canonical-boundary-v14
          fetch-depth: 0
      - name: Apply whole post-H callback fence
        shell: bash
        run: |
          python3 .nembra/agent-es80-post-h-whole-callback-fence.py
          git rm .github/workflows/agent-es80-post-h-whole-callback-fence.yml
          git rm .nembra/agent-es80-post-h-whole-callback-fence.py
          git config user.name 'nembra-gpt56'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          git commit -m 'fix: fence the complete post-H callback surface'
          git push origin HEAD:agent/es80-controller-canonical-boundary-v14
