name: Expose composed Capture compiler failure

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: read

jobs:
  compiler:
    if: github.event.head_commit.message == 'Expose composed Capture compiler failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/current-main-tuya-readonly-convergence-gpt56
          fetch-depth: 0

      - name: Reuse reviewed r2 composition in working tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/capture-app-truth-repair-r2.yml').read_text()
          compose = source.index('      - name: Compose canonical Capture app truth\n')
          truth = source.index('      - name: Run focused truth contracts\n', compose)
          chunk = source[compose:truth]
          marker = '        run: |\n'
          body = chunk.split(marker, 1)[1]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '): lines.append(line[10:])
              elif line.strip() == '': lines.append('')
              else: raise SystemExit(f'unexpected compose indentation: {line!r}')
          Path('/tmp/nembra-compose-r2.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/nembra-compose-r2.sh

      - name: Expose Swift compiler diagnostics
        shell: bash
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set +e
          swift test --filter TuyaAuthenticatedReadOnlySessionLedgerTests > /tmp/swift.log 2>&1
          status=$?
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/swift.log').read_text(errors='replace').splitlines()
          hits = [line for line in lines if 'error:' in line.lower() or 'fatal error' in line.lower()]
          if not hits:
              hits = lines[-40:]
          for i, line in enumerate(hits[:30], 1):
              msg = line.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:6000]
              print(f'::error title=Swift diagnostic {i}::{msg}')
          PY
          exit "$status"
