name: V14 Capture Account Custody Reanchor

on:
  push:
    branches:
      - integration/v14-capture-account-custody-current-sol

permissions:
  contents: write

jobs:
  reanchor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-account-custody-current-sol
          fetch-depth: 0

      - name: Compose exact live product and preserve bridge custody only
        shell: bash
        run: |
          set -euo pipefail
          donor='6cb021f317226e61b4023f78cc21d277b8fa6b84'
          product='380bca6dfa7c4346058aca8286cced23209c970a'
          test "$(git rev-parse HEAD^)" = "$donor"
          git fetch origin product/v14-capture-guided-truth-current-sol
          test "$(git rev-parse origin/product/v14-capture-guided-truth-current-sol)" = "$product"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff "$product"
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -vFx 'NembraApp/App/NembraCaptureEntrypoint.swift' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected reanchor conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              git merge --abort || true
              exit 1
            fi
          fi

          # Entrypoint is deliberately NOT part of this recovery lane. Always restore the exact
          # current product version even if Git can auto-merge the donor's one-line affordance.
          git checkout "$product" -- NembraApp/App/NembraCaptureEntrypoint.swift
          git add NembraApp/App/NembraCaptureEntrypoint.swift

          rm .github/workflows/v14-capture-account-custody-reanchor.yml
          git add -A
          git diff --cached --check
          git commit -m "merge(capture): reanchor account custody core onto live product"

          mapfile -t effective < <(git diff --name-only "$product" HEAD)
          expected=(
            'NembraApp/Features/Research/TuyaAccountBridge.swift'
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAccountBridgeAsyncCustodySourceTests.swift'
          )
          test "${#effective[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${effective[@]}" | grep -Fxq "$path"
          done
          git diff --quiet "$product" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'private var operationGeneration: UInt64 = 0' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'guard phase != .requestingApproval else { return }' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'generation == operationGeneration' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'selectedDeviceID == device.id' NembraApp/Features/Research/TuyaAccountBridge.swift
          grep -Fq 'reset retires in-flight account work so stale callbacks cannot resurrect a link' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAccountBridgeAsyncCustodySourceTests.swift

          git push origin HEAD:integration/v14-capture-account-custody-current-sol
