name: Capture root truth visual converge one-shot

on:
  push:
    branches:
      - recovery/v14-capture-root-truth-visual-convergence-sol2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: recovery/v14-capture-root-truth-visual-convergence-sol2
          persist-credentials: true
          fetch-depth: 1

      - name: Apply provenance-scoped product language
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          visual = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureP0RootVisualAcceptanceTests.swift')
          surface = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift')

          def replace_exact(path: Path, old: str, new: str, expected: int) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches for {old!r}, found {count}')
              path.write_text(text.replace(old, new))

          replace_exact(
              app,
              'fieldBuildIsAuthoritative ? "Field build ready" : "Physical capture locked"',
              'fieldBuildIsAuthoritative ? "Build provenance ready" : "Physical capture locked"',
              2,
          )
          replace_exact(
              app,
              'fieldBuildIsAuthoritative ? "Field build authority: ready" : "Field build authority: locked"',
              'fieldBuildIsAuthoritative ? "Build provenance: ready" : "Build provenance: locked"',
              1,
          )
          replace_exact(
              app,
              'NavigationLink(fieldBuildIsAuthoritative ? "Continue to Capture" : "View locked preflight")',
              'NavigationLink(fieldBuildIsAuthoritative ? "Continue to preflight" : "View locked preflight")',
              1,
          )

          for path in (visual, surface):
              replace_exact(
                  path,
                  'Text(fieldBuildIsAuthoritative ? \\"Field build ready\\" : \\"Physical capture locked\\")',
                  'Text(fieldBuildIsAuthoritative ? \\"Build provenance ready\\" : \\"Physical capture locked\\")',
                  1,
              )
              replace_exact(
                  path,
                  'NavigationLink(fieldBuildIsAuthoritative ? \\"Continue to Capture\\" : \\"View locked preflight\\")',
                  'NavigationLink(fieldBuildIsAuthoritative ? \\"Continue to preflight\\" : \\"View locked preflight\\")',
                  1,
              )

          # Adversarial static checks: preserve the fail-closed public warning and
          # make the previously over-promoting visible phrases impossible.
          app_text = app.read_text()
          required = [
              'Build provenance ready',
              'Build provenance: ready',
              'Continue to preflight',
              'This public build can prepare account metadata, but it cannot scan, connect, or collect physical scooter evidence.',
              'View locked preflight',
              'buildIdentity.isAuthoritativeFieldBuild',
          ]
          for token in required:
              if token not in app_text:
                  raise SystemExit(f'missing required token: {token}')
          forbidden = [
              'Field build ready',
              'Field build authority: ready',
              'Continue to Capture',
          ]
          root = app_text.split('@MainActor\nprivate final class SecureLinkController', 1)[0]
          for token in forbidden:
              if token in root:
                  raise SystemExit(f'over-promoting root phrase survived: {token}')
          PY
          git diff --check

      - name: Commit production + source-contract convergence and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -- .github/workflows/capture-root-truth-visual-converge-once.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureP0RootVisualAcceptanceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift
          git diff --cached --check
          git commit -m 'fix(capture): scope root readiness to build provenance'
          git push origin HEAD:recovery/v14-capture-root-truth-visual-convergence-sol2
