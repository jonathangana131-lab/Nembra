name: V14 Capture trust convergence once

on:
  push:
    branches:
      - 'recovery/v14-capture-trust-convergence-current-main/gpt56-go'
    paths:
      - '.github/workflows/v14-capture-trust-convergence-once.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compose trust fixes and rotate exact workflow pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/capture-xcode27-trusted-command.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          graph_needle = (
              '          root = Path(os.environ["GITHUB_WORKSPACE"])\n'
              '          expected = {\n'
          )
          graph_replacement = (
              '          root = Path(os.environ["GITHUB_WORKSPACE"])\n'
              '          canonical_scheme = "Nembra.xcodeproj/xcshareddata/xcschemes/Nembra.xcscheme"\n'
              '          scheme_paths = {\n'
              '              path.relative_to(root).as_posix()\n'
              '              for path in root.rglob("*.xcscheme")\n'
              '          }\n'
              '          if scheme_paths != {canonical_scheme}:\n'
              '              raise SystemExit(\n'
              '                  "trusted Xcode authority requires exactly the canonical shared scheme; found: "\n'
              '                  + repr(sorted(scheme_paths))\n'
              '              )\n'
              '\n'
              '          expected = {\n'
          )
          if workflow.count(graph_needle) != 1:
              raise SystemExit('expected exactly one trusted build-graph root seam')
          workflow = workflow.replace(graph_needle, graph_replacement, 1)

          producer_marker = '              PATH=/usr/bin:/bin:/usr/sbin:/sbin \\\n'
          if workflow.count(producer_marker) != 1:
              raise SystemExit('expected exactly one pinned-producer privileged PATH seam')
          run_id_literal = '$' + '{{ github.run_id }}'
          run_attempt_literal = '$' + '{{ github.run_attempt }}'
          producer_replacement = (
              producer_marker
              + f'              GITHUB_RUN_ID="{run_id_literal}" \\\n'
              + f'              GITHUB_RUN_ATTEMPT="{run_attempt_literal}" \\\n'
          )
          workflow = workflow.replace(producer_marker, producer_replacement, 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

          old_blob="524b011c6147142281c3fed62d3bb402c7f2be63"
          new_blob="$(git hash-object .github/workflows/capture-xcode27-trusted-command.yml)"
          export OLD_TRUSTED_WORKFLOW_BLOB="$old_blob"
          export NEW_TRUSTED_WORKFLOW_BLOB="$new_blob"
          printf 'Rotating trusted workflow blob %s -> %s\n' "$old_blob" "$new_blob"

          python3 - <<'PY'
          import os
          from pathlib import Path

          old = os.environ['OLD_TRUSTED_WORKFLOW_BLOB']
          new = os.environ['NEW_TRUSTED_WORKFLOW_BLOB']
          paths = (
              Path('scripts/ci/es80_today_trusted_capture_xcode_subject.py'),
              Path('.github/workflows/capture-today-final-go-qa.yml'),
              Path('.github/workflows/capture-today-trusted-default-xcode-subject-qa.yml'),
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one old trusted-workflow pin, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 -m py_compile \
            scripts/ci/es80_today_trusted_capture_xcode_subject.py \
            scripts/ci/tests/test_capture_trusted_xcode_build_graph_custody.py \
            scripts/ci/tests/test_capture_trusted_xcode_bash_environment_custody.py \
            scripts/ci/tests/test_es80_today_trusted_capture_xcode_subject.py
          python3 scripts/ci/tests/test_capture_trusted_xcode_build_graph_custody.py -v
          python3 scripts/ci/tests/test_capture_trusted_xcode_bash_environment_custody.py -v
          python3 scripts/ci/tests/test_es80_today_trusted_capture_xcode_subject.py -v
          grep -Fq "TRUSTED_WORKFLOW_BLOB_SHA = \"$new_blob\"" scripts/ci/es80_today_trusted_capture_xcode_subject.py
          git diff --check

          rm -- .github/workflows/v14-capture-trust-convergence-once.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add \
            .github/workflows/capture-xcode27-trusted-command.yml \
            .github/workflows/capture-today-final-go-qa.yml \
            .github/workflows/capture-today-trusted-default-xcode-subject-qa.yml \
            scripts/ci/es80_today_trusted_capture_xcode_subject.py \
            .github/workflows/v14-capture-trust-convergence-once.yml
          git diff --cached --check
          git commit -m 'fix(capture): converge trusted run and scheme custody'
          git push origin HEAD:recovery/v14-capture-trust-convergence-current-main/gpt56-go
