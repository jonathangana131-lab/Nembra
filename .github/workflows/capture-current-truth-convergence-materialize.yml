name: Capture Current Truth Convergence Materializer

on:
  push:
    branches:
      - repair/v14-capture-current-truth-convergence-1c40-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/v14-capture-current-truth-convergence-1c40-sol

      - name: Verify exact product ancestry and untouched app source
        run: |
          set -euo pipefail
          product=1c40853f6991b4d09206df1d25ecff021458b7eb
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --exit-code "$product" -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Materialize convergence
        run: python3 scripts/materialize_capture_current_truth_convergence.py

      - name: Validate converged source invariants
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          c = s[s.index('private final class SecureLinkController'):s.index('@MainActor\nprivate protocol OfficialTuyaDriver')]
          a = c[c.index('func activateMembershipRequestsForView()'):c.index('func abandonCorrelationForViewExit()')]
          assert 'OfficialTuyaFactory.packageCorrelationMayStart' in a
          assert a.index('OfficialTuyaFactory.packageCorrelationMayStart') < a.index('foregroundIntegrityLossHandled = false')
          for start, end in (('func abandonCorrelationForViewExit()', 'func appDidLoseForeground()'), ('func appDidLoseForeground()', 'var privateConfig: Bool')):
              x = c[c.index(start):c.index(end, c.index(start))]
              assert x.index('sdkDeviceMembershipVerified = false') < x.index('membershipStatus =') < x.index('membershipRequestID = UUID()')
          r = c[c.index('private func receivedApplicationUpdate('):c.index('private func startWatchdog')]
          assert 'redactVerifiedAccountUID(update' in r
          assert ') { _, trusted in trusted })' in r
          assert ') { current, _ in current })' not in r
          assert 'key.replacingOccurrences(of: verifiedAccountUID' in r
          assert 'value.replacingOccurrences(of: verifiedAccountUID' in r
          d = s[s.index('@MainActor\nprivate final class SmartLifeDriver'):s.index('#endif\n\nprivate enum AppleAccountAuthorizationError')]
          assert d.count('"sessionkey"') == 1
          assert '"uid",' not in d
          PY

      - name: Publish clean two-path convergence
        run: |
          set -euo pipefail
          product=1c40853f6991b4d09206df1d25ecff021458b7eb
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git rm scripts/materialize_capture_current_truth_convergence.py .github/workflows/capture-current-truth-convergence-materialize.yml
          git commit -m 'Capture: converge current app-source truth gates'
          expected=$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureCurrentTruthConvergenceSourceTests.swift' | sort)
          actual=$(git diff --name-only "$product" HEAD | sort)
          test "$actual" = "$expected"
          git diff --check "$product" HEAD
          git push origin HEAD:repair/v14-capture-current-truth-convergence-1c40-sol
