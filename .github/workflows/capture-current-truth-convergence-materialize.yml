name: Materialize Capture Current Truth Convergence

on:
  push:
    branches:
      - agent/capture-current-truth-convergence-1c40

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-current-truth-convergence-1c40
          fetch-depth: 0

      - name: Guard exact product ancestry and red-only scope
        shell: bash
        run: |
          set -euo pipefail
          base='1c40853f6991b4d09206df1d25ecff021458b7eb'
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/capture-current-truth-convergence-materialize.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift' | sort)"
          test "$changed" = "$wanted"

      - name: Materialize reviewed production repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          def rewrite_section(source, start_marker, end_marker, transform):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              before = source[:start]
              section = source[start:end]
              after = source[end:]
              rewritten = transform(section)
              if rewritten == section:
                  raise SystemExit(f'no change made in section {start_marker}')
              return before + rewritten + after

          def view_exit(section):
              proof = '        membershipDeviceID = nil\n        membershipRequestID = UUID()'
              if section.count(proof) != 1:
                  raise SystemExit('view-exit membership proof shape changed')
              section = section.replace(
                  proof,
                  '        membershipDeviceID = nil\n        membershipStatus = "Secure Link ended. Exact scooter membership must be verified again for a new Capture view."\n        membershipRequestID = UUID()',
                  1,
              )
              marker = '        guard processCorrelationLease != nil || correlationSession != nil else { return }\n'
              if section.count(marker) != 1:
                  raise SystemExit('view-exit correlation terminal marker changed')
              cleanup = '''        if phase == .correlated || phase == .selected {
              resetDiscoverySessionOnly()
              phase = .failed
              message = "Correlated target authority ended with Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."
              log("target_correlation_authority_revoked_on_view_exit")
              return
          }

          '''
              return section.replace(marker, cleanup + marker, 1)

          source = rewrite_section(
              source,
              '    func abandonCorrelationForViewExit() {',
              '    func appDidLoseForeground() {',
              view_exit,
          )

          def foreground(section):
              opening = '    func appDidLoseForeground() {\n        guard !foregroundIntegrityLossHandled else { return }'
              if section.count(opening) != 1:
                  raise SystemExit('foreground opening shape changed')
              section = section.replace(
                  opening,
                  '    func appDidLoseForeground() {\n        guard phase != .accepted else { return }\n        guard !foregroundIntegrityLossHandled else { return }',
                  1,
              )
              proof = '        membershipDeviceID = nil\n        membershipRequestID = UUID()'
              if section.count(proof) != 1:
                  raise SystemExit('foreground membership proof shape changed')
              section = section.replace(
                  proof,
                  '        membershipDeviceID = nil\n        membershipStatus = "Capture left the foreground. Exact scooter membership must be verified again before retry."\n        membershipRequestID = UUID()',
                  1,
              )
              marker = '        guard let token = currentConnectionToken else {\n'
              if section.count(marker) != 1:
                  raise SystemExit('foreground token marker changed')
              cleanup = '''        if phase == .correlated || phase == .selected {
              resetDiscoverySessionOnly()
              phase = .failed
              message = "Capture left the foreground after target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; pre-background target authority is never reusable evidence."
              log("foreground_integrity_lost_after_target_correlation")
              return
          }

          '''
              return section.replace(marker, cleanup + marker, 1)

          source = rewrite_section(
              source,
              '    func appDidLoseForeground() {',
              '    var privateConfig: Bool',
              foreground,
          )

          def application_update(section):
              old = ']) { current, _ in current })'
              new = ']) { _, trusted in trusted })'
              if section.count(old) != 1:
                  raise SystemExit(f'application provenance merge shape changed: {section.count(old)} matches')
              return section.replace(old, new, 1)

          source = rewrite_section(
              source,
              '    private func receivedApplicationUpdate(',
              '    private func startWatchdog',
              application_update,
          )

          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/capture-current-truth-convergence-materialize.yml').unlink()
          PY

      - name: Verify effective semantic scope
        shell: bash
        run: |
          set -euo pipefail
          base='1c40853f6991b4d09206df1d25ecff021458b7eb'
          git diff --check
          changed="$(git diff --name-only "$base" | sort)"
          wanted="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift' | sort)"
          test "$changed" = "$wanted"
          grep -Fq 'guard phase != .accepted else { return }' NembraApp/App/NembraCaptureEntrypoint.swift
          test "$(grep -Fo 'phase == .correlated || phase == .selected' NembraApp/App/NembraCaptureEntrypoint.swift | wc -l | tr -d ' ')" -ge 2
          grep -Fq 'target_correlation_authority_revoked_on_view_exit' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'foreground_integrity_lost_after_target_correlation' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq ']) { _, trusted in trusted })' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(capture): close current foreground and provenance gaps'
          git push origin HEAD:agent/capture-current-truth-convergence-1c40
