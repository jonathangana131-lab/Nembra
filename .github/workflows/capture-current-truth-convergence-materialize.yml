name: Capture current truth convergence materializer

on:
  push:
    branches:
      - fix/v14-capture-current-truth-convergence-sol

permissions:
  contents: write

concurrency:
  group: capture-current-truth-convergence-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-current-truth-convergence-sol
          fetch-depth: 0

      - name: Guard exact source lineage and red contracts
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1c40853f6991b4d09206df1d25ecff021458b7eb HEAD
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift

      - name: Materialize current truth convergence
        shell: python3 {0}
        run: |
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text()

          status_old = '''        sdkDeviceMembershipVerified = false
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipRequestID = UUID()'''
          status_new = '''        sdkDeviceMembershipVerified = false
                  membershipStatus = "Exact scooter membership must be verified again for this Secure Link session."
                  membershipAccountUID = nil
                  membershipDeviceID = nil
                  membershipRequestID = UUID()'''
          status_count = source.count(status_old)
          if status_count != 2:
              raise SystemExit(f'expected exactly two proof-revocation blocks, found {status_count}')
          source = source.replace(status_old, status_new)

          uid_anchor = '''        guard driver.isLocallyConnected(uuid: tuyaUUID) else {
                  await recordObservedTransportLoss(token: token)
                  return
              }

              applicationUpdateAdmissionsInFlight += 1'''
          uid_repair = '''        guard driver.isLocallyConnected(uuid: tuyaUUID) else {
                  await recordObservedTransportLoss(token: token)
                  return
              }
              guard let verifiedAccountUID = membershipAccountUID,
                    !verifiedAccountUID.isEmpty else {
                  await invalidateSourceAuthority(
                      token: token,
                      message: "Verified Tuya account identity became unavailable before application evidence could enter event custody.",
                      kind: "sdk_account_uid_unavailable_before_application_event_custody"
                  )
                  return
              }

              let exportSafeUpdate = update.reduce(into: [String: String]()) { sanitized, entry in
                  let safeKey = entry.key.replacingOccurrences(
                      of: verifiedAccountUID,
                      with: "<redacted-account-uid>"
                  )
                  let safeValue = entry.value.replacingOccurrences(
                      of: verifiedAccountUID,
                      with: "<redacted-account-uid>"
                  )
                  sanitized[safeKey] = safeValue
              }

              applicationUpdateAdmissionsInFlight += 1'''
          if source.count(uid_anchor) != 1:
              raise SystemExit('expected exactly one application-event custody insertion anchor')
          source = source.replace(uid_anchor, uid_repair, 1)

          generation_old = '''            log("tuya_application_update", update.merging([
                      "generation": String(token.diagnosticGeneration)
                  ]) { current, _ in current })'''
          generation_new = '''            log("tuya_application_update", exportSafeUpdate.merging([
                      "generation": String(token.diagnosticGeneration)
                  ]) { _, trusted in trusted })'''
          if source.count(generation_old) != 1:
              raise SystemExit('expected exactly one untrusted application-event generation merge')
          source = source.replace(generation_old, generation_new, 1)

          duplicate_session_key = '''        "refreshtoken",
                  "sessionkey",
                  "authkey",'''
          deduplicated_session_key = '''        "refreshtoken",
                  "authkey",'''
          if source.count(duplicate_session_key) != 1:
              raise SystemExit('expected exactly one duplicate session-key classifier tail')
          source = source.replace(duplicate_session_key, deduplicated_session_key, 1)

          path.write_text(source)

      - name: Focused source contracts
        shell: python3 {0}
        run: |
          from pathlib import Path

          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()

          def section(start, end):
              left = source.index(start)
              right = source.index(end, left + len(start))
              return source[left:right]

          exit_cleanup = section('func abandonCorrelationForViewExit()', 'func appDidLoseForeground()')
          foreground_cleanup = section('func appDidLoseForeground()', 'var privateConfig: Bool')
          for name, cleanup in [('view-exit', exit_cleanup), ('foreground', foreground_cleanup)]:
              clear = cleanup.index('sdkDeviceMembershipVerified = false')
              status = cleanup.index('membershipStatus =')
              revoke = cleanup.index('membershipRequestID = UUID()')
              assert clear < status < revoke, name
              assert 'verified and leased' not in cleanup.lower(), name
              assert 'verif' in cleanup.lower(), name

          receiver = section('private func receivedApplicationUpdate(', 'private func startWatchdog')
          assert 'guard let verifiedAccountUID = membershipAccountUID' in receiver
          assert receiver.count('<redacted-account-uid>') == 2
          assert 'entry.key.replacingOccurrences' in receiver
          assert 'entry.value.replacingOccurrences' in receiver
          assert 'log("tuya_application_update", update.merging([' not in receiver
          assert 'log("tuya_application_update", exportSafeUpdate.merging([' in receiver
          assert ']) { current, _ in current })' not in receiver
          assert ']) { _, trusted in trusted })' in receiver

          driver = section('@MainActor\nprivate final class SmartLifeDriver', '#endif\n\nprivate enum AppleAccountAuthorizationError')
          fragments_start = driver.index('private static let secretKeyFragments')
          fragments_end = driver.index('private static func redactApplicationSecrets', fragments_start)
          fragments = driver[fragments_start:fragments_end]
          assert fragments.count('"sessionkey"') == 1
          assert '"uid"' not in fragments

      - name: Verify effective scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only 1c40853f6991b4d09206df1d25ecff021458b7eb...HEAD; git diff --name-only)
          printf '%s\n' "${changed[@]}" | sort -u > /tmp/changed.txt
          for required in \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift; do
            grep -Fxq "$required" /tmp/changed.txt
          done
          while IFS= read -r changed_path; do
            case "$changed_path" in
              NembraApp/App/NembraCaptureEntrypoint.swift|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift|Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift|.github/workflows/capture-current-truth-convergence-materialize.yml) ;;
              '') ;;
              *) echo "unexpected changed path: $changed_path" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt

      - name: Self-remove helper and publish clean donor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-current-truth-convergence-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift \
            .github/workflows/capture-current-truth-convergence-materialize.yml
          git diff --cached --check
          git commit -m 'fix(capture): converge event and membership custody truth'
          git push origin HEAD:fix/v14-capture-current-truth-convergence-sol
