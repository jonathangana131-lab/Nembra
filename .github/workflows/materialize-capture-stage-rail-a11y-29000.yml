name: Materialize Capture stage rail a11y 29000

on:
  push:
    branches:
      - fix/v14-capture-stage-rail-a11y-29000-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact product ancestry and owned paths
        shell: bash
        run: |
          set -euo pipefail
          expected=29000f240d1b5710bbe116de94a22c030d10da8e
          test "$(git merge-base "$expected" HEAD)" = "$expected"
          unexpected="$(git diff --name-only "$expected"...HEAD | grep -Ev '^(Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureStageRailAcceptedAccessibilitySourceTests.swift|scripts/ci/materialize_capture_stage_rail_a11y_29000.py|\.github/workflows/materialize-capture-stage-rail-a11y-29000.yml)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changed paths:"; echo "$unexpected"; exit 1; }

      - name: Materialize accepted stage accessibility semantics
        shell: bash
        run: python3 scripts/ci/materialize_capture_stage_rail_a11y_29000.py

      - name: Verify syntax
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureStageRailAcceptedAccessibilitySourceTests.swift
          git diff --check

      - name: Commit repair and retire construction helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-stage-rail-a11y-29000.yml
          rm scripts/ci/materialize_capture_stage_rail_a11y_29000.py
          git config user.name "nembra-sol-worker"
          git config user.email "nembra-sol-worker@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureStageRailAcceptedAccessibilitySourceTests.swift .github/workflows/materialize-capture-stage-rail-a11y-29000.yml scripts/ci/materialize_capture_stage_rail_a11y_29000.py
          git diff --cached --check
          git commit -m "fix(capture): align accepted stage accessibility"
          git push origin HEAD:fix/v14-capture-stage-rail-a11y-29000-sol
