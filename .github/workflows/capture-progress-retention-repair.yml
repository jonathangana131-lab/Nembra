name: Capture progress retention repair

on:
  push:
    branches:
      - recovery/v14-capture-correlation-progress-current-sol

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch observer ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = path.read_text()
          old_guard = '                guard let self, self.correlationSession === session else { return }'
          new_guard = '                guard self?.correlationSession === session else { return }'
          old_assign = '                    self.correlationProgress = progress'
          new_assign = '                    self?.correlationProgress = progress'
          if s.count(old_guard) != 1:
              raise SystemExit('strong observer guard anchor missing or ambiguous')
          if s.count(old_assign) != 1:
              raise SystemExit('strong observer assignment anchor missing or ambiguous')
          s = s.replace(old_guard, new_guard, 1)
          s = s.replace(old_assign, new_assign, 1)
          path.write_text(s)
          PY
          git diff --check
          if grep -Fq 'guard let self, self.correlationSession === session' NembraApp/App/NembraCaptureEntrypoint.swift; then exit 1; fi

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git rm .github/workflows/capture-progress-retention-repair.yml
          git commit -m 'fix(capture): keep progress observer weak across sleeps'
          git push origin HEAD:recovery/v14-capture-correlation-progress-current-sol
