name: Temporary V14 Capture Protected Install Helper Transport

on:
  push:
    branches:
      - repair/v14-capture-signed-app-protected-install-sol

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repair exact helper transport and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1e7252ea5bf6bf8bfde7c5719c760181d6beaf6e HEAD
          python3 -B scripts/ci/tmp_fix_protected_install_helper_transport.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          python3 -B -c 'compile(open("scripts/ci/capture_signed_app_install_custody.py", encoding="utf-8").read(), "custody", "exec"); compile(open("scripts/ci/tests/test_capture_signed_app_install_custody.py", encoding="utf-8").read(), "tests", "exec")'
          python3 -B -I scripts/ci/tests/test_capture_signed_app_install_custody.py
          git diff --check
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          git rm .github/workflows/tmp-v14-capture-protected-install-helper-transport.yml scripts/ci/tmp_fix_protected_install_helper_transport.py
          git add scripts/field/install_one_time_capture.command scripts/ci/tests/test_capture_signed_app_install_custody.py
          git diff --cached --check
          git config user.name "Nembra V14 Capture Closure"
          git config user.email "nembra-v14@users.noreply.github.com"
          git commit -m "fix(capture): execute exact custody helper bytes"
          git push origin HEAD:repair/v14-capture-signed-app-protected-install-sol
