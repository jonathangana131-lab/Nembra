name: Wire Nembra UI Test Target

on:
  push:
    branches:
      - feature/home-rebuild
    paths:
      - .github/workflows/wire-ui-tests.yml

permissions:
  contents: write

jobs:
  wire-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/home-rebuild
          fetch-depth: 0

      - name: Apply validated Xcode project patch
        run: |
          git apply --check scripts/ci/nembra-ui-target.patch
          git apply scripts/ci/nembra-ui-target.patch
          rm scripts/ci/nembra-ui-target.patch
          git diff --check

      - name: Commit target wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nembra.xcodeproj scripts/ci/nembra-ui-target.patch
          git commit -m "test: wire Home UI test target into Xcode project"
          git push origin HEAD:feature/home-rebuild
