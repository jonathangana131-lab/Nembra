name: Capture Physical App-Container Probe Source

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - 'scripts/field/probe_capture_app_container_transport.command'
      - 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaPhysicalAppContainerTransportProbeSourceTests.swift'
      - '.github/workflows/capture-physical-app-container-roundtrip-source.yml'

permissions:
  contents: read

concurrency:
  group: capture-physical-app-container-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PROBE: scripts/field/probe_capture_app_container_transport.command
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and macOS syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          xcodebuild -version
          bash -n "$PROBE"
          test "$(grep -Fc 'ENV_DEVICE_UDID="${NEMBRA_CAPTURE_DEVICE_UDID:-}"' "$PROBE")" = 1
          test "$(grep -Fc 'ARG_DEVICE_UDID="${1:-}"' "$PROBE")" = 1
          test "$(grep -Fc 'environment and positional iPhone selectors disagree' "$PROBE")" = 1
          test "$(grep -Fc 'DEVICE_UDID="${ENV_DEVICE_UDID:-$ARG_DEVICE_UDID}"' "$PROBE")" = 1
          test "$(grep -Fc 'DEVICE_UDID="${NEMBRA_CAPTURE_DEVICE_UDID:-${1:-}}"' "$PROBE" || true)" = 0
          test "$(grep -Fc 'devicectl device copy to' "$PROBE")" = 1
          test "$(grep -Fc 'devicectl device copy from' "$PROBE")" = 1
          test "$(grep -Fc -- '--remove-existing-content' "$PROBE" || true)" = 0
          test "$(grep -Ec 'retained-install-manifest[.]json|authorization-envelope[.]json|signer-rendezvous[.]json' "$PROBE" || true)" = 0
          test "$(grep -Fc 'REMOTE_SENTINEL="tmp/nembra-capture-transport-probe-$NONCE.bin"' "$PROBE")" = 1
          test "$(grep -Fc 'RUN_DIR="$ARTIFACTS_ROOT/run-$RUN_ID"' "$PROBE")" = 1
          test "$(grep -Fc '/bin/mkdir "$RUN_DIR"' "$PROBE")" = 1
          test "$(grep -Fc 'RESULT_TMP="$ARTIFACTS_DIR/.result-$NONCE.tmp"' "$PROBE")" = 1
          test "$(grep -Fc '/bin/mv -f -- "$RESULT_TMP" "$RESULT_PATH"' "$PROBE")" = 1
          test "$(grep -Fc 'field_authorization_subdirectory_listing_succeeded=true' "$PROBE")" = 1
          test "$(grep -Fc 'field_authorization_directory_present=true' "$PROBE" || true)" = 0
          test "$(grep -Fc 'authorization_payload_file_transferred=false' "$PROBE")" = 1
          test "$(grep -Fc 'authorization_subject_touched=false' "$PROBE" || true)" = 0
          test "$(grep -Fc 'raw_device_output_persisted=false' "$PROBE")" = 1
          test "$(grep -Fc 'installed_build_identity_verified=false' "$PROBE")" = 1
          test "$(grep -Fc 'installed_build_identity_verified=true' "$PROBE" || true)" = 0
          test "$(grep -Fc 'captureAuthorized=false' "$PROBE")" = 1
          test "$(grep -Fc 'physicalAuthorityCreated=false' "$PROBE")" = 1
          test "$(grep -Fc 'protocolSemanticsCreated=false' "$PROBE")" = 1

      - name: Run focused probe truth suite
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter TuyaPhysicalAppContainerTransportProbeSourceTests

      - name: State exact-head truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          printf '%s\n' 'PROVEN: the exact PR head parses on the Xcode 27 Mac and passes the focused non-authorizing bundle-level app-container probe source contract, including unambiguous physical-iPhone selector admission, unique-run/atomic-result stale-evidence rejection, and listing-success-only handoff semantics.'
          printf '%s\n' 'NOT PROVEN: a physical iPhone round-trip, handoff-directory filesystem existence beyond a successful listing operation, exact installed Capture build identity, authorization payload transfer/acceptance, signing/install custody, Bluetooth/Tuya/ES80 behavior, telemetry semantics, commands, or physical Capture GO.'
