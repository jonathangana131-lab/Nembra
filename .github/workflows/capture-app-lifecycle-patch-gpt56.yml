name: Capture app lifecycle patch (temporary)

on:
  push:
    branches:
      - recovery/v14-capture-app-lifecycle-consumption-sol

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-app-lifecycle-consumption-sol
          fetch-depth: 2

      - name: Verify exact staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c093d9fca66d14980f4c05057dd560409fb529de"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-app-lifecycle-patch-gpt56.yml"

      - name: Apply bounded Capture app repair
