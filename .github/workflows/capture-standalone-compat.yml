name: Capture Standalone Compatibility

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select installed Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          for app in /Applications/Xcode_26*.app /Applications/Xcode-26*.app /Applications/Xcode.app; do
            [[ -d "$app/Contents/Developer" ]] || continue
            version="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version | head -n 1)"
            if [[ "$version" =~ ^Xcode\ 26\. ]]; then
              selected="$app/Contents/Developer"
              break
            fi
          done

          if [[ -z "$selected" ]]; then
            echo 'ERROR: no installed Xcode 26.x toolchain was found on the macos-15 runner.'
            ls -1 /Applications | grep -E '^Xcode' || true
            exit 1
          fi

          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          echo "Selected DEVELOPER_DIR=$selected"

      - name: Verify Xcode 26 / Swift toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -Eq '^Xcode 26\.'

      - name: Test Tuya SDK account device-membership authority
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/NembraBluetoothCapture \
            --filter TuyaSDKAccountDeviceMembershipGateTests

      - name: Build standalone Capture for Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme "Nembra Capture" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build standalone Capture for generic iPhone
        run: |
          set -euo pipefail
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme "Nembra Capture" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
