name: Capture Standalone Compatibility

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # macos-15 still defaults to Xcode 16.4 even though Xcode 26.x is installed.
      # Capture's authority package declares swift-tools-version 6.2 and the
      # standalone project is an Xcode 26 field product, so using the default
      # toolchain makes package resolution fail as soon as the app links it.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize live Tuya account authority repair when absent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          if "sdk_account_authority_lost" in source:
              raise SystemExit(0)
          needle = '''                guard let self,
                      self.currentConnectionToken == token,
                      self.secureSessionEstablished,
                      let driver = self.driver else { return }

                let beforeObservation = await self.sessionLedger.currentPreflightSnapshot()
'''
          replacement = '''                guard let self,
                      self.currentConnectionToken == token,
                      self.secureSessionEstablished,
                      let driver = self.driver else { return }

                guard OfficialTuyaFactory.accountLoggedIn else {
                    self.sdkDeviceMembershipVerified = false
                    self.sdkLocalBLEOnline = false
                    self.membershipStatus = "Official Tuya SDK account authority disappeared during authenticated observation. Exact scooter membership must be verified again after relaunch/login."
                    try? await self.sessionLedger.endConnection(for: token)
                    await self.refreshLedgerSnapshot()
                    self.currentConnectionToken = nil
                    self.fail("Official Tuya SDK account authority disappeared during authenticated observation. Export diagnostics; do not promote the physical gate.", "sdk_account_authority_lost")
                    return
                }

                let beforeObservation = await self.sessionLedger.currentPreflightSnapshot()
'''
          if source.count(needle) != 1:
              raise SystemExit("Capture watchdog source drifted; refusing to guess a patch location")
          path.write_text(source.replace(needle, replacement, 1))
          PY
          if ! git diff --quiet -- NembraApp/App/NembraCaptureEntrypoint.swift; then
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add NembraApp/App/NembraCaptureEntrypoint.swift
            git commit -m "fix(capture): retire session when Tuya account authority disappears"
            git push origin HEAD:capture/one-time-ble-dump-gpt56
          fi
      - name: Verify Xcode 26 / Swift toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          swift --version
          [[ "$XCODE_VERSION" == Xcode\ 26.* ]]
      - name: Pin live Tuya account authority during authenticated observation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = source.index("    private func startWatchdog(token: TuyaReadOnlyConnectionToken) {")
          end = source.index("    private func refreshLedgerSnapshot() async {", start)
          watchdog = source[start:end]

          required = (
              "OfficialTuyaFactory.accountLoggedIn",
              "sdkDeviceMembershipVerified = false",
              "sdkLocalBLEOnline = false",
              "sessionLedger.endConnection(for: token)",
              "currentConnectionToken = nil",
          )
          missing = [needle for needle in required if needle not in watchdog]
          if missing:
              raise SystemExit(
                  "Authenticated observation must fail closed if official Tuya account authority disappears; "
                  "missing watchdog evidence: " + ", ".join(missing)
              )

          forbidden = (
              "publishDps",
              "publishDpsWithEnumMode",
              "queryDps",
              "resetFactory",
              "removeDevice",
              "removeHome",
              "writeValue(",
          )
          present = [needle for needle in forbidden if needle in watchdog]
          if present:
              raise SystemExit(
                  "Read-only Capture watchdog gained forbidden command authority: " + ", ".join(present)
              )
          PY
      - name: Test private Tuya app-identity generator
        run: |
          set -euo pipefail
          bash Scripts/test_capture_tuya_identity_provisioning.sh
      - name: Test Tuya SDK account device-membership authority
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/NembraBluetoothCapture \
            --filter TuyaSDKAccountDeviceMembershipGateTests
      - name: Build standalone Capture for Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme "Nembra Capture" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build standalone Capture for generic iPhone
        run: |
          set -euo pipefail
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme "Nembra Capture" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
