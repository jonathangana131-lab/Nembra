name: Capture Standalone Compatibility

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
      - capture/one-time-ble-auth-gpt56sol
  workflow_dispatch:

jobs:
  package-tests:
    name: Swift 6.2 package truth tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Test Bluetooth Capture package
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture

  standalone-build:
    name: Xcode 26-compatible standalone app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build standalone Capture for Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme "Nembra Capture" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build standalone Capture for generic iPhone
        run: |
          set -euo pipefail
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme "Nembra Capture" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
