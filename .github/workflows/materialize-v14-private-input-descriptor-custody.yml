name: Materialize V14 Private Input Descriptor Custody

on:
  push:
    branches:
      - sol/v14-capture-private-input-descriptor-custody-a5cb

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact live-product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a5cb12ed97241ba274d23f311d67cf84623ceb29"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-v14-private-input-descriptor-custody.yml"

      - name: Materialize descriptor-bound private file admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          helper = Path('Scripts/capture_tuya_private_input_provenance.py')
          source = helper.read_text(encoding='utf-8')
          start = source.index('def _require_regular_file(')
          end = source.index('\ndef _assert_internal_symlink(', start)
          replacement = base64.b64decode('').decode('utf-8')
          source = source[:start] + replacement + source[end + 1:]
          old_lock = '        "podfile_lock_sha256": hashlib.sha256(lockfile.read_bytes()).hexdigest()\n        if _require_regular_file(lockfile)\n        else "",\n'
          if source.count(old_lock) != 1:
              raise SystemExit(f'lockfile admission replacement count != 1: {source.count(old_lock)}')
          source = source.replace(old_lock, '        "podfile_lock_sha256": _read_stable_regular_file_sha256(lockfile)[1],\n', 1)
          helper.write_text(source, encoding='utf-8')

          tests = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py')
          test_source = tests.read_text(encoding='utf-8')
          import_anchor = 'import unittest\nfrom pathlib import Path\n'
          if test_source.count(import_anchor) != 1:
              raise SystemExit('test import anchor missing')
          test_source = test_source.replace(import_anchor, 'import unittest\nfrom pathlib import Path\nfrom unittest import mock\n', 1)
          new_tests = base64.b64decode('').decode('utf-8')
          insertion_anchor = '    def test_record_symlink_is_rejected(self) -> None:\n'
          if test_source.count(insertion_anchor) != 1:
              raise SystemExit('test insertion anchor missing')
          test_source = test_source.replace(insertion_anchor, new_tests + insertion_anchor, 1)
          tests.write_text(test_source, encoding='utf-8')
          PY

      - name: Validate focused provenance custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          source = Path('Scripts/capture_tuya_private_input_provenance.py').read_text(encoding='utf-8')
          assert 'os.open(path, flags)' in source
          assert 'os.fstat(descriptor)' in source
          assert 'os.read(descriptor, 1024 * 1024)' in source
          assert 'path.open("rb")' not in source
          assert 'lockfile.read_bytes()' not in source
          assert 'current_path.st_ino != after.st_ino' in source
          assert 'private build input changed while it was fingerprinted' in source
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'Scripts/capture_tuya_private_input_provenance.py' 'scripts/ci/tests/test_capture_tuya_private_input_provenance.py' | sort)"

      - name: Commit clean closure checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-v14-private-input-descriptor-custody.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(capture): bind private file fingerprints to descriptors"
          git push origin HEAD:sol/v14-capture-private-input-descriptor-custody-a5cb
