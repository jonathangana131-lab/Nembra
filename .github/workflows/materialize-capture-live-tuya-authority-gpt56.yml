name: Materialize Capture live Tuya authority watchdog

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authenticated observation authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          needle = '''                guard let self,
                      self.currentConnectionToken == token,
                      self.secureSessionEstablished,
                      let driver = self.driver else { return }

                let beforeObservation = await self.sessionLedger.currentPreflightSnapshot()
'''
          replacement = '''                guard let self,
                      self.currentConnectionToken == token,
                      self.secureSessionEstablished,
                      let driver = self.driver else { return }

                guard OfficialTuyaFactory.accountLoggedIn else {
                    self.sdkDeviceMembershipVerified = false
                    self.sdkLocalBLEOnline = false
                    self.membershipStatus = "Official Tuya SDK account authority disappeared during authenticated observation. Exact scooter membership must be verified again after relaunch/login."
                    try? await self.sessionLedger.endConnection(for: token)
                    await self.refreshLedgerSnapshot()
                    self.currentConnectionToken = nil
                    self.fail("Official Tuya SDK account authority disappeared during authenticated observation. Export diagnostics; do not promote the physical gate.", "sdk_account_authority_lost")
                    return
                }

                let beforeObservation = await self.sessionLedger.currentPreflightSnapshot()
'''
          if needle not in source:
              raise SystemExit("Capture watchdog source drifted; refusing to guess a patch location")
          if source.count(needle) != 1:
              raise SystemExit("Capture watchdog patch target is not unique; refusing to modify")
          source = source.replace(needle, replacement, 1)
          path.write_text(source)
          PY
      - name: Verify read-only authority boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          start = source.index("    private func startWatchdog(token: TuyaReadOnlyConnectionToken) {")
          end = source.index("    private func refreshLedgerSnapshot() async {", start)
          watchdog = source[start:end]
          required = (
              "OfficialTuyaFactory.accountLoggedIn",
              "sdkDeviceMembershipVerified = false",
              "sdkLocalBLEOnline = false",
              "sessionLedger.endConnection(for: token)",
              "currentConnectionToken = nil",
              "sdk_account_authority_lost",
          )
          missing = [x for x in required if x not in watchdog]
          if missing:
              raise SystemExit("missing fail-closed watchdog evidence: " + ", ".join(missing))
          forbidden = (
              "publishDps",
              "publishDpsWithEnumMode",
              "queryDps",
              "resetFactory",
              "removeDevice",
              "removeHome",
              "writeValue(",
              "disconnect",
          )
          present = [x for x in forbidden if x in watchdog]
          if present:
              raise SystemExit("watchdog gained forbidden physical authority: " + ", ".join(present))
          PY
      - name: Commit exact runtime repair and retire materializer
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-capture-live-tuya-authority-gpt56.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --cached --check
          git commit -m "fix(capture): retire session when Tuya account authority disappears"
          git push origin HEAD:capture/one-time-ble-dump-gpt56
