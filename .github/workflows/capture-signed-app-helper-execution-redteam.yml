name: Capture Signed App Helper Execution Red Team

on:
  push:
    branches:
      - adversarial/v14-capture-signed-app-helper-execution-subject-sol
  pull_request:
    paths:
      - scripts/field/install_one_time_capture.command
      - scripts/ci/capture_signed_app_install_custody.py
      - scripts/ci/tests/test_capture_signed_app_helper_execution_subject.py
      - .github/workflows/capture-signed-app-helper-execution-redteam.yml

permissions:
  contents: read

jobs:
  helper-execution-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact diagnostic head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile diagnostic
        run: python3 -m py_compile scripts/ci/tests/test_capture_signed_app_helper_execution_subject.py

      - name: Require accepted helper bytes at execution
        run: python3 -m unittest -v scripts.ci.tests.test_capture_signed_app_helper_execution_subject
