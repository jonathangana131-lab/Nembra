name: Capture TODAY Field Candidate Preflight QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/ci/es80_today_field_candidate_preflight.py
      - scripts/ci/tests/test_es80_today_field_candidate_preflight.py
      - scripts/ci/tests/test_es80_today_field_candidate_developer_dir_handoff.py
      - scripts/ci/tests/test_es80_today_field_source_scope.py
      - scripts/ci/tests/test_es80_today_private_helper_handoff_pin.py
      - scripts/ci/tests/test_es80_export_options_coherence.py
      - scripts/ci/tests/test_es80_private_field_runbook_production_entry.py
      - scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py
      - scripts/ci/es80_today_private_device_input.py
      - scripts/ci/tests/test_es80_today_private_device_input.py
      - scripts/ci/es80_retained_install_manifest.py
      - scripts/ci/tests/test_es80_retained_install_manifest.py
      - scripts/ci/es80_retained_install_cross_binding.py
      - scripts/ci/tests/test_es80_retained_install_cross_binding.py
      - scripts/ci/tests/test_es80_retained_install_installer_chronology.py
      - scripts/ci/es80_field_authorization_rendezvous.py
      - scripts/ci/tests/test_es80_field_authorization_rendezvous.py
      - scripts/ci/es80_sign_field_authorization_from_rendezvous.py
      - scripts/ci/tests/test_es80_sign_field_authorization_from_rendezvous.py
      - scripts/ci/tests/test_es80_sign_field_authorization_execution_custody.py
      - scripts/ci/tests/test_es80_rendezvous_signer_private_custody_boundary.py
      - NembraApp/App/NembraCaptureEntrypoint.swift
      - NembraApp/App/NembraCaptureFieldAuthorizationController.swift
      - NembraCapture.xcodeproj/project.pbxproj
      - Packages/NembraBluetoothCapture/Sources/NembraCaptureAppAuthorization/**
      - Packages/NembraBluetoothCapture/Tests/NembraCaptureAppAuthorizationTests/**
      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedFieldAuthorizationInboxAppAdapterSourceTests.swift
      - Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedFieldCapabilityAppWiringSourceTests.swift
      - scripts/field/install_one_time_capture.command
      - docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md
      - docs/ES80_AUTHENTICATED_STATIONARY_RETAINED_INSTALL_MANIFEST.md
      - docs/ES80_TODAY_SIGNED_FIELD_CANDIDATE_PRODUCTION.md
      - docs/ES80_TODAY_PRIVATE_DEVICE_INPUT_CUSTODY.md
      - docs/ES80_TODAY_PRIVATE_FIELD_RUNBOOK.md
      - .github/workflows/capture-app-authorization-close-one-shot.yml
      - .github/workflows/capture-app-authorization-race-safe-go.yml
      - .github/workflows/capture-today-field-candidate-preflight-qa.yml

permissions:
  contents: read

jobs:
  field-candidate-preflight:
    name: Validate non-authorizing private signing preflight
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: nembra-capture-today-field-preflight-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true
    env:
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      SOURCE_WORKFLOW: .github/workflows/capture-app-authorization-close-one-shot.yml
      MATERIALIZER_WORKFLOW: .github/workflows/capture-app-authorization-race-safe-go.yml

    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile preflight, retained-install contracts, private-input helper, and focused tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_today_field_candidate_preflight.py \
            scripts/ci/tests/test_es80_today_field_candidate_preflight.py \
            scripts/ci/tests/test_es80_today_field_candidate_developer_dir_handoff.py \
            scripts/ci/tests/test_es80_today_field_source_scope.py \
            scripts/ci/tests/test_es80_today_private_helper_handoff_pin.py \
            scripts/ci/tests/test_es80_export_options_coherence.py \
            scripts/ci/tests/test_es80_private_field_runbook_production_entry.py \
            scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py \
            scripts/ci/es80_today_private_device_input.py \
            scripts/ci/tests/test_es80_today_private_device_input.py \
            scripts/ci/es80_retained_install_manifest.py \
            scripts/ci/tests/test_es80_retained_install_manifest.py \
            scripts/ci/es80_retained_install_cross_binding.py \
            scripts/ci/tests/test_es80_retained_install_cross_binding.py \
            scripts/ci/tests/test_es80_retained_install_installer_chronology.py \
            scripts/ci/es80_field_authorization_rendezvous.py \
            scripts/ci/tests/test_es80_field_authorization_rendezvous.py \
            scripts/ci/es80_sign_field_authorization_from_rendezvous.py \
            scripts/ci/tests/test_es80_sign_field_authorization_from_rendezvous.py \
            scripts/ci/tests/test_es80_sign_field_authorization_execution_custody.py \
            scripts/ci/tests/test_es80_rendezvous_signer_private_custody_boundary.py

      - name: Run focused preflight, retained-install, app-wiring, and handoff regressions
        run: |
          set -euo pipefail
          python3 scripts/ci/es80_retained_install_manifest.py --self-test
          python3 scripts/ci/tests/test_es80_retained_install_manifest.py -v
          python3 scripts/ci/tests/test_es80_retained_install_cross_binding.py -v
          python3 scripts/ci/tests/test_es80_retained_install_installer_chronology.py -v
          python3 scripts/ci/es80_field_authorization_rendezvous.py --self-test
          python3 scripts/ci/tests/test_es80_field_authorization_rendezvous.py -v
          python3 scripts/ci/tests/test_es80_sign_field_authorization_from_rendezvous.py -v
          python3 scripts/ci/tests/test_es80_sign_field_authorization_execution_custody.py -v
          python3 scripts/ci/tests/test_es80_rendezvous_signer_private_custody_boundary.py -v
          python3 scripts/ci/tests/test_es80_today_field_candidate_preflight.py -v
          python3 scripts/ci/tests/test_es80_today_field_candidate_developer_dir_handoff.py -v
          python3 scripts/ci/tests/test_es80_today_field_source_scope.py -v
          python3 scripts/ci/tests/test_es80_today_private_helper_handoff_pin.py -v
          python3 scripts/ci/tests/test_es80_export_options_coherence.py -v
          python3 scripts/ci/tests/test_es80_private_field_runbook_production_entry.py -v
          python3 scripts/ci/tests/test_es80_today_private_device_input.py -v

      - name: Materialize canonical lifecycle transform for source contract
        shell: python
        run: |
          import os
          from pathlib import Path
          import textwrap

          workflow = Path(os.environ["MATERIALIZER_WORKFLOW"]).read_text(encoding="utf-8")
          marker = "      - name: Materialize canonical lifecycle transform\n"
          section = workflow.index(marker)
          run_marker = "        run: |\n"
          start = workflow.index(run_marker, section) + len(run_marker)
          end = workflow.index("\n      - name:", start)
          program = textwrap.dedent(workflow[start:end])
          required = [
              "SOURCE_WORKFLOW",
              "admitOFF1Start",
              "admitAuthenticationStart",
              "admitOfficialConnectionStart",
              "admitObservationStart",
              "freezeAcceptedArtifactForAuthorizationSeal",
              "sealAfterAcceptedArtifactFreeze",
              "app.write_text(source, encoding=\"utf-8\")",
          ]
          for token in required:
              if token not in program:
                  raise SystemExit(f"race-safe materializer missing required token: {token}")
          namespace = {
              "__name__": "__main__",
              "__file__": "<capture-today-field-preflight-materializer>",
          }
          exec(compile(program, namespace["__file__"], "exec", dont_inherit=True), namespace)

      - name: Run real-entrypoint lifecycle source contract
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE")" = 0
          python3 scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py -v
