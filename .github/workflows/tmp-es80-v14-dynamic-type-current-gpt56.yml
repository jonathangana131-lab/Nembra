name: "Temporary ES80 current Dynamic Type closure"

on:
  push:
    branches:
      - "product/es80-v14-dynamic-type-current/gpt56-thinking-go"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply guarded current Dynamic Type closure
        shell: bash
        env:
          EXPECTED_PARENT: "41bb8aec97f6fe26e6dd90b44c51f6e3d11f5ab7"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 scripts/ci/tmp_es80_v14_dynamic_type_current_gpt56.py
          git diff --check
          git config user.name "gpt56-thinking-go"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-es80-v14-dynamic-type-current-gpt56.yml
          git rm scripts/ci/tmp_es80_v14_dynamic_type_current_gpt56.py
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git add NembraUITests/ES80ResearchCaptureUITests.swift
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ES80CaptureDynamicTypeSourceAcceptanceTests.swift
          git commit -m "fix(capture): close current Dynamic Type layouts"
          git push origin HEAD:"${GITHUB_REF_NAME}"
