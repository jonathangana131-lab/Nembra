name: Capture accepted-root Xcode input grammar materialize once

on:
  push:
    branches:
      - repair/v17-capture-accepted-root-xcode-input-grammar-bf2f-sol-20260815

permissions:
  contents: write

env:
  EXACT_PARENT: bf2f1e1d718849ef6741ec532e28975527311e95
  BRANCH: repair/v17-capture-accepted-root-xcode-input-grammar-bf2f-sol-20260815
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-accepted-root-xcode-input-grammar-bf2f-sol-20260815
          fetch-depth: 0

      - name: Bind one-shot authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          actual="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/capture-accepted-root-xcode-input-grammar-materialize-once.yml scripts/ci/materialize_capture_accepted_root_xcode_input_grammar_once.py | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Materialize and self-test repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B scripts/ci/materialize_capture_accepted_root_xcode_input_grammar_once.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_root_build_composition.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_root_xcode_input_grammar.py
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Publish clean four-path repair lineage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nembra GO worker"
          git config user.email "nembra-go@users.noreply.github.com"
          authoring_head="$(git rev-parse HEAD)"
          staging="$RUNNER_TEMP/accepted-root-xcode-input-repair"
          mkdir -p "$staging/.github/workflows" "$staging/scripts/ci/tests" "$staging/scripts/ci"
          cp .github/workflows/capture-accepted-root-build-composition.yml "$staging/.github/workflows/"
          cp scripts/ci/capture_selected_xcode_build_orchestrator.py "$staging/scripts/ci/"
          cp scripts/ci/tests/test_capture_accepted_root_build_composition.py "$staging/scripts/ci/tests/"
          cp scripts/ci/tests/test_capture_accepted_root_xcode_input_grammar.py "$staging/scripts/ci/tests/"
          git reset --hard "$EXACT_PARENT"
          cp -R "$staging/." .
          chmod 0644 .github/workflows/capture-accepted-root-build-composition.yml
          chmod 0755 scripts/ci/capture_selected_xcode_build_orchestrator.py
          chmod 0755 scripts/ci/tests/test_capture_accepted_root_build_composition.py
          chmod 0755 scripts/ci/tests/test_capture_accepted_root_xcode_input_grammar.py
          product_paths=(
            .github/workflows/capture-accepted-root-build-composition.yml
            scripts/ci/capture_selected_xcode_build_orchestrator.py
            scripts/ci/tests/test_capture_accepted_root_build_composition.py
            scripts/ci/tests/test_capture_accepted_root_xcode_input_grammar.py
          )
          git add "${product_paths[@]}"
          actual="$(git diff --cached --name-only "$EXACT_PARENT" | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${product_paths[@]}" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test ! -e .github/workflows/capture-accepted-root-xcode-input-grammar-materialize-once.yml
          test ! -e scripts/ci/materialize_capture_accepted_root_xcode_input_grammar_once.py
          git diff --cached --check
          git commit -m "fix(capture): bind Xcode source inputs to accepted root"
          git push --force-with-lease="$BRANCH:$authoring_head" origin "HEAD:$BRANCH"
