name: Capture accepted-root Xcode input grammar materialize once

on:
  push:
    branches:
      - repair/v17-capture-accepted-root-xcode-input-grammar-bf2f-sol-20260815

permissions:
  contents: write

env:
  EXACT_PARENT: bf2f1e1d718849ef6741ec532e28975527311e95
  BRANCH: repair/v17-capture-accepted-root-xcode-input-grammar-bf2f-sol-20260815
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-accepted-root-xcode-input-grammar-bf2f-sol-20260815
          fetch-depth: 0

      - name: Bind one-shot authoring scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          actual="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/capture-accepted-root-xcode-input-grammar-materialize-once.yml scripts/ci/materialize_capture_accepted_root_xcode_input_grammar_once.py | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Materialize and self-test repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B scripts/ci/materialize_capture_accepted_root_xcode_input_grammar_once.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_root_build_composition.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_root_xcode_input_grammar.py
          git diff --check "$EXACT_PARENT"...HEAD

      - name: Commit clean repair and retire authoring helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nembra GO worker"
          git config user.email "nembra-go@users.noreply.github.com"
          rm .github/workflows/capture-accepted-root-xcode-input-grammar-materialize-once.yml
          rm scripts/ci/materialize_capture_accepted_root_xcode_input_grammar_once.py
          git add -A
          actual="$(git diff --cached --name-only "$EXACT_PARENT" | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/capture-accepted-root-build-composition.yml scripts/ci/capture_selected_xcode_build_orchestrator.py scripts/ci/tests/test_capture_accepted_root_build_composition.py scripts/ci/tests/test_capture_accepted_root_xcode_input_grammar.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git commit -m "fix(capture): bind Xcode source inputs to accepted root"
          git push origin "HEAD:$BRANCH"
