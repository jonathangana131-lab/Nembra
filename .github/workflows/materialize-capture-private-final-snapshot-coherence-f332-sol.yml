name: Materialize Capture Private Final Snapshot Coherence F332

on:
  push:
    branches:
      - "fix/v14-capture-private-final-snapshot-coherence-f332-sol"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Verify exact product parent
        shell: bash
        run: |
          set -euo pipefail
          product="f332b37671417038e1a210476bc9129e62c9bcc7"
          test "$(git rev-parse HEAD^)" = "$product"

      - name: Materialize coherent generation witness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Scripts/capture_tuya_private_input_provenance.py")
          source = path.read_text(encoding="utf-8")
          start = source.index("def _private_input_record_generation_snapshot(\n")
          end = source.index("\ndef build_record(\n", start)

          replacement = '''def _assert_tree_generation_snapshot_unchanged(
              root: Path,
              snapshot: tuple[tuple[object, ...], ...],
          ) -> None:
              """Revalidate every pathname and directory membership in one collected tree witness."""
              root_resolved = root.resolve(strict=True)
              expected_members: dict[str, list[str]] = {}

              for kind, relative, identity, symlink_target in snapshot:
                  relative_text = str(relative)
                  candidate = root if relative_text == "." else root / relative_text
                  _assert_unchanged_tree_entry(candidate, identity, str(kind))
                  if kind == "L":
                      if _assert_internal_symlink(candidate, root_resolved) != symlink_target:
                          raise ProvenanceError(
                              "private build tree symlink changed while its record generation was snapshotted"
                          )
                  if kind == "D":
                      expected_members.setdefault(relative_text, [])

                  if relative_text != ".":
                      parent, separator, name = relative_text.rpartition("/")
                      parent_relative = parent if separator else "."
                      expected_members.setdefault(parent_relative, []).append(name)

              for relative_text, members in expected_members.items():
                  directory = root if relative_text == "." else root / relative_text
                  expected = tuple(sorted(members, key=os.fsencode))
                  if _directory_member_names(directory) != expected:
                      raise ProvenanceError(
                          "private build tree membership changed while its record generation was snapshotted"
                      )


          def _private_input_record_generation_snapshot(
              *,
              lockfile: Path,
              security_podspec: Path,
              security_build: Path,
              identity_podspec: Path,
              identity_sources: Path,
          ) -> tuple[object, ...]:
              lockfile_identity = _regular_file_generation_identity(lockfile)
              security_podspec_identity = _regular_file_generation_identity(security_podspec)
              security_build_snapshot = _tree_generation_snapshot(security_build)
              identity_podspec_identity = _regular_file_generation_identity(identity_podspec)
              identity_sources_snapshot = _tree_generation_snapshot(identity_sources)

              snapshot = (
                  ("podfile_lock", lockfile_identity),
                  ("security_podspec", security_podspec_identity),
                  ("security_build", security_build_snapshot),
                  ("identity_podspec", identity_podspec_identity),
                  ("identity_sources", identity_sources_snapshot),
              )

              # The five observations above are sequential. Before returning them as one
              # generation witness, revalidate every collected tree pathname/membership
              # and each standalone file identity after all later collection has finished.
              _assert_tree_generation_snapshot_unchanged(
                  security_build,
                  security_build_snapshot,
              )
              _assert_tree_generation_snapshot_unchanged(
                  identity_sources,
                  identity_sources_snapshot,
              )
              if _regular_file_generation_identity(security_podspec) != security_podspec_identity:
                  raise ProvenanceError(
                      "private security podspec changed while the record generation was snapshotted"
                  )
              if _regular_file_generation_identity(identity_podspec) != identity_podspec_identity:
                  raise ProvenanceError(
                      "private identity podspec changed while the record generation was snapshotted"
                  )
              if _regular_file_generation_identity(lockfile) != lockfile_identity:
                  raise ProvenanceError(
                      "Podfile.lock changed while the private record generation was snapshotted"
                  )
              return snapshot
          '''

          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding="utf-8")
          PY

          red="221ef98a3a0b8f79715b167496940f38e509d358"
          git fetch --no-tags --depth=1 origin "$red"
          red_test="scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py"
          test ! -e "$red_test"
          git show "$red:$red_test" > "$red_test"

          cat > scripts/ci/tests/test_capture_tuya_private_input_record_tree_cross_authority.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import importlib.util
          import tempfile
          import unittest
          from pathlib import Path
          from unittest import mock

          ROOT = Path(__file__).resolve().parents[3]
          HELPER = ROOT / "Scripts" / "capture_tuya_private_input_provenance.py"
          SPEC = importlib.util.spec_from_file_location("capture_tuya_private_input_provenance", HELPER)
          if SPEC is None or SPEC.loader is None:
              raise RuntimeError("could not load provenance helper")
          provenance = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(provenance)

          class CrossAuthorityTreeCoherenceTests(unittest.TestCase):
              def test_later_tree_collection_cannot_hide_earlier_tree_child_mutate_restore(self) -> None:
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      security = root / "security"; security.mkdir()
                      identity = root / "identity"; identity.mkdir()
                      security_child = security / "blob.bin"; security_child.write_bytes(b"AAAA")
                      (identity / "identity.swift").write_text("identity", encoding="utf-8")
                      lockfile = root / "Podfile.lock"; lockfile.write_text("lock", encoding="utf-8")
                      security_podspec = root / "security.podspec"; security_podspec.write_text("s", encoding="utf-8")
                      identity_podspec = root / "identity.podspec"; identity_podspec.write_text("i", encoding="utf-8")
                      original_tree_snapshot = provenance._tree_generation_snapshot
                      calls = 0
                      mutated = False

                      def wrapped(path: Path):
                          nonlocal calls, mutated
                          calls += 1
                          result = original_tree_snapshot(path)
                          if calls == 2:
                              security_child.write_bytes(b"BBBB")
                              security_child.write_bytes(b"AAAA")
                              mutated = True
                          return result

                      with mock.patch.object(provenance, "_tree_generation_snapshot", side_effect=wrapped):
                          with self.assertRaises(provenance.ProvenanceError):
                              provenance._private_input_record_generation_snapshot(
                                  lockfile=lockfile,
                                  security_podspec=security_podspec,
                                  security_build=security,
                                  identity_podspec=identity_podspec,
                                  identity_sources=identity,
                              )
                      self.assertTrue(mutated)

          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Validate full provenance chronology suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_tree_generation.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_tree_cross_authority.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path("Scripts/capture_tuya_private_input_provenance.py").read_text(encoding="utf-8")
          start = source.index("def _private_input_record_generation_snapshot(")
          end = source.index("\ndef build_record(", start)
          snapshot = source[start:end]
          required = [
              "snapshot = (",
              "_assert_tree_generation_snapshot_unchanged(",
              "_regular_file_generation_identity(security_podspec) != security_podspec_identity",
              "_regular_file_generation_identity(identity_podspec) != identity_podspec_identity",
              "_regular_file_generation_identity(lockfile) != lockfile_identity",
              "return snapshot",
          ]
          missing = [token for token in required if token not in snapshot]
          if missing:
              raise SystemExit(f"missing final snapshot coherence invariants: {missing}")
          if "    return (\n" in snapshot:
              raise SystemExit("sequential direct-return generation snapshot remains")
          print("final private-input generation witness coherence: PASS")
          PY
          git diff --check

      - name: Commit durable path-disjoint repair
        shell: bash
        run: |
          set -euo pipefail
          product="f332b37671417038e1a210476bc9129e62c9bcc7"
          rm .github/workflows/materialize-capture-private-final-snapshot-coherence-f332-sol.yml
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$product" | sort)
          expected=(
            "Scripts/capture_tuya_private_input_provenance.py"
            "scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py"
            "scripts/ci/tests/test_capture_tuya_private_input_record_tree_cross_authority.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}" || { printf 'Unexpected effective paths:\n' >&2; printf '  %s\n' "${changed[@]}" >&2; exit 1; }
          git config user.name "Nembra V14 Sol"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(capture): make private generation snapshot self-coherent"
          git push origin HEAD:fix/v14-capture-private-final-snapshot-coherence-f332-sol
