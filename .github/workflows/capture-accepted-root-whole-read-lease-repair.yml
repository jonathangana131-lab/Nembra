name: Capture Accepted Root Whole Read Lease Repair

on:
  pull_request:
    paths:
      - scripts/ci/capture_selected_xcode_build_orchestrator.py
      - scripts/ci/tests/test_capture_accepted_root_build_composition.py
      - scripts/ci/tests/test_capture_accepted_root_whole_read_lease_repair.py
      - .github/workflows/capture-accepted-root-whole-read-lease-repair.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-accepted-root-whole-read-lease-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_PARENT: bf2f1e1d718849ef6741ec532e28975527311e95
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  repair:
    name: Prove whole sealed-root read/search lease
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact repair scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          actual="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-accepted-root-whole-read-lease-repair.yml \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_accepted_root_build_composition.py \
            scripts/ci/tests/test_capture_accepted_root_whole_read_lease_repair.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve selected-Xcode and strict composition regressions
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_root_build_composition.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Invert whole-root read-lease exploit
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_root_whole_read_lease_repair.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve authority boundary
        shell: bash
        run: |
          set -euo pipefail
          helper=scripts/ci/capture_selected_xcode_build_orchestrator.py
          grep -Fq 'private_subjects = (accepted_root,)' "$helper"
          grep -Fq 'lease_repo = accepted_root.parent' "$helper"
          echo "NEMBRA_ACCEPTED_ROOT_READ_BOUNDARY wholeRootReadLeaseProved=true writeAuthority=false installerWired=false signingAuthority=false installAuthority=false physicalAuthorityCreated=false"
