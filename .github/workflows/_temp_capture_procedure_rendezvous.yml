name: Temporary Capture procedure rendezvous

on:
  push:
    branches:
      - work/v14-capture-procedure-rendezvous-dee-sol

permissions:
  contents: write

jobs:
  apply-rendezvous:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v14-capture-procedure-rendezvous-dee-sol

      - name: Apply guarded procedure rendezvous
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/_temp_apply_capture_procedure_rendezvous.py
          python3 scripts/_temp_apply_capture_procedure_rendezvous.py

      - name: Validate portable contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/field/install_one_time_capture.command
          python3 - <<'PY'
          from pathlib import Path
          procedure = 'ES80-AUTHENTICATED-STATIONARY-v1'
          identity = Path('NembraApp/App/NembraCaptureBuildIdentity.swift').read_text()
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          project = Path('NembraCapture.xcodeproj/project.pbxproj').read_text()
          installer = Path('scripts/field/install_one_time_capture.command').read_text()
          runbook = Path('docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md').read_text()
          workflow = Path('.github/workflows/capture-field-build-provenance.yml').read_text()
          required = {
              'identity constant': f'static let fieldProcedureIdentifier = "{procedure}"' in identity,
              'identity authority': 'procedureIdentifier == Self.fieldProcedureIdentifier' in identity,
              'project plist': project.count(f'INFOPLIST_KEY_NembraCaptureProcedureIdentifier = "{procedure}";') == 2,
              'export field': 'let procedureIdentifier: String' in app,
              'export schema': 'schemaVersion: 10,' in app and 'schemaVersion: 9,' not in app,
              'export value': 'procedureIdentifier: buildIdentity.procedureIdentifier' in app,
              'app UI': 'LabeledContent("Procedure", value: test.fieldProcedureIdentifier)' in app,
              'runbook': f'PROCEDURE_ID: `{procedure}`' in runbook,
              'installer': f'PROCEDURE_ID="{procedure}"' in installer,
              'installer readback': 'plutil -extract NembraCaptureProcedureIdentifier raw -o - "$APP_INFO_PLIST"' in installer,
              'installer compare': '[[ "$BUILT_PROCEDURE_ID" == "$PROCEDURE_ID" ]]' in installer,
              'workflow PR SHA': 'github.event.pull_request.head.sha' in workflow,
              'workflow procedure test': 'TuyaFieldProcedureRendezvousSourceTests.swift' in workflow,
          }
          failed = [name for name, passed in required.items() if not passed]
          if failed:
              raise SystemExit('failed procedure contracts: ' + ', '.join(failed))
          PY
          git diff --check

      - name: Remove temporary patch transport
        run: |
          git rm .github/workflows/_temp_capture_procedure_rendezvous.yml
          git rm scripts/_temp_apply_capture_procedure_rendezvous.py

      - name: Commit product-only procedure rendezvous
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nembra-v14-recovery
          git config user.email actions@users.noreply.github.com
          git add \
            NembraApp/App/NembraCaptureBuildIdentity.swift \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            NembraCapture.xcodeproj/project.pbxproj \
            docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md \
            scripts/field/install_one_time_capture.command \
            .github/workflows/capture-field-build-provenance.yml \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(capture): bind exact stationary procedure identity'
          git push origin HEAD:work/v14-capture-procedure-rendezvous-dee-sol
