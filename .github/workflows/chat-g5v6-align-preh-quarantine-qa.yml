name: chat-g5v6 align pre-H quarantine QA
on:
  push:
    branches:
      - parallel/es80-preh-quarantine-qa-repair/chat-g5v6
    paths:
      - .github/workflows/chat-g5v6-align-preh-quarantine-qa.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: parallel/es80-preh-quarantine-qa-repair/chat-g5v6
          fetch-depth: 0
      - name: Align regression with irreversible raw-retirement quarantine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothPreHObservationRecoveryTests.swift')
          s = p.read_text()

          title_old = '@Test("committed Ready abort preserves exact identity and reopens only for bound fresh session")'
          title_new = '@Test("committed Ready abort preserves exact identity and raw retirement stays quarantined")'
          fn_old = 'func committedReadyAbortRequiresRetirementAndExactFreshSession() async throws {'
          fn_new = 'func committedReadyAbortRetirementKeepsQuarantineClosed() async throws {'
          for old, new in ((title_old, title_new), (fn_old, fn_new)):
              if s.count(old) != 1:
                  raise SystemExit(f'expected one match for {old!r}, got {s.count(old)}')
              s = s.replace(old, new, 1)

          start_token = '        try gate.completeAbortedObservationRecovery('
          next_test_token = '    @Test("canonical fence rejection proves zero Ready mutation and consumes one-shot admission")'
          start = s.find(start_token)
          next_test = s.find(next_test_token, start)
          if start < 0 or next_test < 0 or next_test <= start:
              raise SystemExit(f'could not locate stale reopen region: start={start} next_test={next_test}')

          replacement = '''        #expect(retirement.retainedPendingEvidenceCount == 0)\n        #expect(gate.phase == .abortQuarantined(abort))\n        #expect(!gate.resetForNewCaptureSession())\n        #expect(gate.permittedDrainUpperBound(firstPending: 4, pendingTail: 4) == nil)\n\n        let freshAuthority = PassiveCoreBluetoothArtifactAuthorityContext(\n            targetSessionGeneration: authority.targetSessionGeneration + 1,\n            authorityGeneration: 1\n        )\n        #expect(throws: PassiveCoreBluetoothObservationBoundaryQueueGate.StateError.invalidTransition) {\n            _ = try gate.begin(\n                .finiteAcquisitionReady,\n                through: 4,\n                authority: freshAuthority\n            )\n        }\n        #expect(gate.phase == .abortQuarantined(abort))\n    }\n\n'''
          s = s[:start] + replacement + s[next_test:]
          p.write_text(s)
          PY

          if git grep -n -E 'completeAbortedObservationRecovery|freshTargetSessionRequired' -- 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests' 'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture'; then
            echo 'stale raw-retirement reopen API remains' >&2
            exit 1
          fi
          git diff --check
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/chat-g5v6-align-preh-quarantine-qa.yml
          git config user.name 'nembra-chat-g5v6'
          git config user.email 'nembra-chat-g5v6@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothPreHObservationRecoveryTests.swift
          git commit -m 'test: keep raw pre-H retirement quarantine-closed'
          git push origin HEAD:parallel/es80-preh-quarantine-qa-repair/chat-g5v6
