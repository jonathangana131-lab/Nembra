name: Temporary ES80 V14 rider-language convergence

on:
  push:
    branches:
      - product/es80-v14-rider-language-convergence/gpt56-thinking-go

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Details truth and Simulator interruption copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/Features/Research/ES80CaptureShellView.swift')
          source = path.read_text()

          replacements = {
              'This artifact is passive software evidence. File and build hashes are software provenance, not independent field authorization. Repeated full-UUID correlation does not authenticate the physical ES80, and this screen does not assign GATT, Tuya/DP, battery, current, power, speed, regen, or command semantics.':
              'This artifact is passive software evidence. File and build hashes are software provenance, not independent field authorization. CoreBluetooth correlation uses full peripheral identity, but it does not authenticate the physical ES80. This screen does not assign GATT, Tuya/DP, battery, current, power, speed, regen, or command semantics.',
              'Simulator QA interruption fixture. This synthetic state represents a foreground-invalidated evidence life; it is not physical evidence.':
              'Simulator QA interruption fixture. This synthetic state represents a foreground interruption; it is not physical evidence.'
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one convergence anchor, found {count}: {old}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          git diff --check

          test ! -e .github/scripts/_temporary_es80_v14_rider_language_patch.py
          test ! -e .github/workflows/_temporary_es80_v14_rider_language_patch.yml

      - name: Commit product result and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_temporary_es80_v14_rider_language_convergence.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git diff --cached --check
          git commit -m 'fix(capture): close human-first rider language boundary'
          git push origin HEAD:product/es80-v14-rider-language-convergence/gpt56-thinking-go
