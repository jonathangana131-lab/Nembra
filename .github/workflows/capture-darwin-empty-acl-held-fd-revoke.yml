name: Capture Darwin Empty ACL Held-FD Revoke

on:
  pull_request:
    paths:
      - .github/workflows/capture-darwin-empty-acl-held-fd-revoke.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  classify-empty-baseline-revoke:
    if: github.head_ref == 'validation/v17-capture-empty-acl-fd-revoke-gpt56sol-20260817'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          parent='b87d375e5ae419fd5569c2cd63a6b42fc45174b0'
          /usr/bin/git merge-base --is-ancestor "$parent" HEAD
          changed="$(/usr/bin/git diff --name-only "$parent"...HEAD)"
          test "$changed" = '.github/workflows/capture-darwin-empty-acl-held-fd-revoke.yml'
          /usr/bin/git diff --check "$parent"...HEAD
          /usr/bin/git diff --quiet "$parent"...HEAD -- scripts/ci/capture_selected_xcode_build_orchestrator.py

      - name: Classify empty ACL set on held original descriptor
        id: oracle
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/true
          field_user="$(/usr/bin/id -un)"
          field_uid="$(/usr/bin/id -u)"
          field_gid="$(/usr/bin/id -g)"
          test "$field_uid" != '0'

          work="$(mktemp -d "$RUNNER_TEMP/nembra-empty-acl-fd.XXXXXX")"
          root="$(/usr/bin/sudo -n /usr/bin/mktemp -d /private/tmp/nembra-empty-acl-fd.XXXXXX)"
          trap '/usr/bin/sudo -n /bin/rm -rf "$root" >/dev/null 2>&1 || true; /bin/rm -rf "$work"' EXIT
          /usr/bin/sudo -n /bin/chmod 0711 "$root"
          subject="$root/accepted-root"
          moved="$root/accepted-root.moved"
          /usr/bin/sudo -n /bin/mkdir -m 0700 "$subject"

          cat > "$work/empty_acl_fd_revoke.c" <<'C'
          #include <sys/types.h>
          #include <sys/acl.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <dirent.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <grp.h>
          #include <stdbool.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static void die_errno(const char *label) {
              fprintf(stderr, "%s: %s\n", label, strerror(errno));
              exit(2);
          }

          static void fail(const char *message) {
              fprintf(stderr, "%s\n", message);
              exit(3);
          }

          static void require_same_identity(int fd, const char *path, const char *label) {
              struct stat by_fd;
              struct stat by_path;
              if (fstat(fd, &by_fd) != 0) die_errno("fstat");
              if (lstat(path, &by_path) != 0) die_errno("lstat");
              if (by_fd.st_dev != by_path.st_dev ||
                  by_fd.st_ino != by_path.st_ino ||
                  (by_fd.st_mode & S_IFMT) != (by_path.st_mode & S_IFMT)) {
                  fprintf(stderr, "%s: descriptor/path identity diverged\n", label);
                  exit(4);
              }
          }

          static int list_as(const char *path, uid_t uid, gid_t gid) {
              pid_t child = fork();
              if (child < 0) die_errno("fork access probe");
              if (child == 0) {
                  if (setgroups(0, NULL) != 0) _exit(120);
                  if (setgid(gid) != 0) _exit(121);
                  if (setuid(uid) != 0) _exit(122);
                  DIR *dir = opendir(path);
                  if (!dir) _exit(10);
                  while (readdir(dir) != NULL) { }
                  if (closedir(dir) != 0) _exit(11);
                  _exit(0);
              }
              int status = 0;
              if (waitpid(child, &status, 0) < 0) die_errno("waitpid access probe");
              if (!WIFEXITED(status)) return 125;
              return WEXITSTATUS(status);
          }

          static void run_chmod_add(const char *path, const char *principal) {
              char ace[1024];
              if (snprintf(
                      ace,
                      sizeof(ace),
                      "user:%s allow list,search,readattr,readextattr,readsecurity",
                      principal
                  ) >= (int)sizeof(ace)) {
                  fail("ACE is too long");
              }
              pid_t child = fork();
              if (child < 0) die_errno("fork chmod");
              if (child == 0) {
                  execl("/bin/chmod", "chmod", "+a", ace, path, (char *)NULL);
                  _exit(127);
              }
              int status = 0;
              if (waitpid(child, &status, 0) < 0) die_errno("waitpid chmod");
              if (!WIFEXITED(status) || WEXITSTATUS(status) != 0) {
                  fail("canonical-path chmod +a failed");
              }
          }

          static acl_t get_extended_acl(const char *path, int *saved_errno) {
              errno = 0;
              acl_t acl = acl_get_file(path, ACL_TYPE_EXTENDED);
              *saved_errno = errno;
              return acl;
          }

          static void require_no_extended_acl(const char *path, const char *label) {
              int saved_errno = 0;
              acl_t acl = get_extended_acl(path, &saved_errno);
              if (acl != NULL) {
                  ssize_t length = 0;
                  char *text = acl_to_text(acl, &length);
                  fprintf(stderr, "%s: expected absent extended ACL; text=%.*s\n",
                          label,
                          text ? (int)length : 0,
                          text ? text : "");
                  if (text) acl_free(text);
                  acl_free(acl);
                  exit(5);
              }
              printf("NEMBRA_EMPTY_ACL_ABSENT label=%s errno=%d\n", label, saved_errno);
          }

          int main(int argc, char **argv) {
              if (argc != 7) {
                  fprintf(stderr, "usage: %s PRINCIPAL UID GID SUBJECT MOVED REPLACEMENT\n", argv[0]);
                  return 64;
              }
              const char *principal = argv[1];
              uid_t uid = (uid_t)strtoul(argv[2], NULL, 10);
              gid_t gid = (gid_t)strtoul(argv[3], NULL, 10);
              const char *subject = argv[4];
              const char *moved = argv[5];
              const char *replacement = argv[6];

              require_no_extended_acl(subject, "baseline");
              if (list_as(subject, uid, gid) == 0) {
                  fail("field identity unexpectedly listed baseline 0700 subject");
              }

              int fd = open(subject, O_RDONLY | O_DIRECTORY | O_NOFOLLOW | O_CLOEXEC);
              if (fd < 0) die_errno("open accepted root");
              require_same_identity(fd, subject, "pre-grant");

              run_chmod_add(subject, principal);
              require_same_identity(fd, subject, "post-grant");

              int grant_errno = 0;
              acl_t granted = get_extended_acl(subject, &grant_errno);
              if (!granted) {
                  errno = grant_errno;
                  die_errno("path-native grant readback");
              }
              acl_free(granted);
              if (list_as(subject, uid, gid) != 0) {
                  fail("field identity could not list subject after canonical-path read/search grant");
              }

              if (rename(subject, moved) != 0) die_errno("rename accepted root");
              if (mkdir(replacement, 0700) != 0) die_errno("mkdir attacker replacement");
              require_same_identity(fd, moved, "post-replacement original identity");

              if (list_as(moved, uid, gid) != 0) {
                  fail("moved accepted object lost granted field access before revoke");
              }
              if (list_as(replacement, uid, gid) == 0) {
                  fail("attacker replacement unexpectedly inherited field access");
              }
              require_no_extended_acl(replacement, "replacement-before-revoke");

              acl_t empty = acl_init(0);
              if (!empty) die_errno("acl_init empty baseline");
              errno = 0;
              int set_result = acl_set_fd(fd, empty);
              int set_errno = errno;
              acl_free(empty);
              printf("NEMBRA_EMPTY_ACL_SET_FD result=%d errno=%d\n", set_result, set_errno);
              if (set_result != 0) {
                  errno = set_errno;
                  die_errno("acl_set_fd empty baseline restore");
              }

              require_same_identity(fd, moved, "post-revoke original identity");
              require_no_extended_acl(moved, "moved-after-revoke");
              require_no_extended_acl(replacement, "replacement-after-revoke");

              if (list_as(moved, uid, gid) == 0) {
                  fail("field identity retained list/search authority after empty ACL fd revoke");
              }
              if (list_as(replacement, uid, gid) == 0) {
                  fail("attacker replacement gained field access during fd revoke");
              }

              puts(
                  "NEMBRA_EMPTY_ACL_FD_REVOKE "
                  "baselineAbsent=true canonicalPathGrant=true separateUIDGrantObserved=true "
                  "pathReplaced=true originalIdentityRetained=true emptyAclSetFdSucceeded=true "
                  "originalReturnedToAbsentACL=true separateUIDRevoked=true replacementUntouched=true"
              );
              if (close(fd) != 0) die_errno("close accepted-root fd");
              return 0;
          }
          C

          /usr/bin/clang -Wall -Wextra -Werror "$work/empty_acl_fd_revoke.c" -o "$work/empty_acl_fd_revoke"

          set +e
          output="$(/usr/bin/sudo -n "$work/empty_acl_fd_revoke" \
            "$field_user" "$field_uid" "$field_gid" \
            "$subject" "$moved" "$subject" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$status" > "$RUNNER_TEMP/nembra-empty-acl-fd-status.txt"
          printf '%s\n' "$output" > "$RUNNER_TEMP/nembra-empty-acl-fd-output.txt"
          exit "$status"

      - name: Publish exact classifier result to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const statusPath = path.join(process.env.RUNNER_TEMP, 'nembra-empty-acl-fd-status.txt');
            const outputPath = path.join(process.env.RUNNER_TEMP, 'nembra-empty-acl-fd-output.txt');
            const status = fs.existsSync(statusPath) ? fs.readFileSync(statusPath, 'utf8').trim() : 'missing';
            let output = fs.existsSync(outputPath) ? fs.readFileSync(outputPath, 'utf8') : 'classifier did not persist output';
            output = output.slice(-12000).replaceAll('```', '~~~');
            const body = [
              `NEMBRA_EMPTY_ACL_FD_REVOKE_DIAGNOSTIC exactHead=${process.env.EXACT_HEAD} exit=${status}`,
              '',
              '```text',
              output,
              '```',
              '',
              'Validation only. Production `_PrivateReadLease` unchanged. PHYSICAL NO-GO.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Reassert classifier result after durable diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/nembra-empty-acl-fd-status.txt"
          test -f "$status_file"
          test "$(cat "$status_file")" = '0'

      - name: Preserve validation-only boundary
        if: always()
        shell: bash
        run: |
          echo 'NEMBRA_EMPTY_ACL_FD_REVOKE validationOnly=true productionLeaseChanged=false physicalAuthorityCreated=false'
          echo 'No install, device, Bluetooth, Tuya, DP, telemetry, command, or riding authority is created by this classifier.'