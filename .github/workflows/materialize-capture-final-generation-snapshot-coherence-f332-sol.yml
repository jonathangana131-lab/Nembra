name: Materialize Capture Final Generation Snapshot Coherence F332

on:
  push:
    branches:
      - fix/v14-capture-final-generation-snapshot-coherence-f332-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-final-generation-snapshot-coherence-f332-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact product lineage and materialize coherent witness
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f332b37671417038e1a210476bc9129e62c9bcc7 HEAD
          test "$(git diff --name-only f332b37671417038e1a210476bc9129e62c9bcc7 HEAD | sort)" = "$(printf '%s\n' '.github/workflows/materialize-capture-final-generation-snapshot-coherence-f332-sol.yml' 'scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py' | sort)"
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('Scripts/capture_tuya_private_input_provenance.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('def _private_input_record_generation_snapshot(')
          end = source.index('\ndef build_record(', start)
          current = source[start:end]
          expected = dedent('''\
          def _private_input_record_generation_snapshot(
              *,
              lockfile: Path,
              security_podspec: Path,
              security_build: Path,
              identity_podspec: Path,
              identity_sources: Path,
          ) -> tuple[object, ...]:
              return (
                  ("podfile_lock", _regular_file_generation_identity(lockfile)),
                  ("security_podspec", _regular_file_generation_identity(security_podspec)),
                  ("security_build", _tree_generation_snapshot(security_build)),
                  ("identity_podspec", _regular_file_generation_identity(identity_podspec)),
                  ("identity_sources", _tree_generation_snapshot(identity_sources)),
              )
          
          ''')
          if current != expected:
              raise SystemExit('current generation snapshot source drifted from reviewed parent')

          replacement = dedent('''\
          def _revalidate_tree_generation_snapshot(
              root: Path,
              snapshot: tuple[tuple[object, ...], ...],
          ) -> None:
              observed_directories: dict[str, Path] = {}
              expected_members: dict[str, list[str]] = {}

              for state in snapshot:
                  if len(state) != 4:
                      raise ProvenanceError("private build tree generation snapshot is malformed")
                  kind, relative, identity, symlink_target = state
                  if not isinstance(kind, str) or not isinstance(relative, str) or not isinstance(identity, tuple):
                      raise ProvenanceError("private build tree generation snapshot is malformed")
                  if kind not in {"D", "F", "L"}:
                      raise ProvenanceError("private build tree generation snapshot is malformed")

                  candidate = root if relative == "." else root / relative
                  _assert_unchanged_tree_entry(candidate, identity, kind)
                  if kind == "L":
                      if not isinstance(symlink_target, str):
                          raise ProvenanceError("private build tree generation snapshot is malformed")
                      try:
                          current_target = os.readlink(candidate)
                      except OSError as error:
                          raise ProvenanceError(
                              "private build tree changed after its record generation was collected"
                          ) from error
                      if current_target != symlink_target:
                          raise ProvenanceError(
                              "private build tree changed after its record generation was collected"
                          )
                  elif kind == "D":
                      observed_directories[relative] = candidate
                      expected_members[relative] = []

              if "." not in observed_directories:
                  raise ProvenanceError("private build tree generation snapshot is malformed")

              for state in snapshot:
                  _, relative, _, _ = state
                  if relative == ".":
                      continue
                  parent, _, name = relative.rpartition("/")
                  parent = parent or "."
                  if parent not in expected_members or not name:
                      raise ProvenanceError("private build tree generation snapshot is malformed")
                  expected_members[parent].append(name)

              for relative, directory in observed_directories.items():
                  members = tuple(sorted(expected_members[relative], key=os.fsencode))
                  if _directory_member_names(directory) != members:
                      raise ProvenanceError(
                          "private build tree changed after its record generation was collected"
                      )


          def _private_input_record_generation_snapshot(
              *,
              lockfile: Path,
              security_podspec: Path,
              security_build: Path,
              identity_podspec: Path,
              identity_sources: Path,
          ) -> tuple[object, ...]:
              lockfile_identity = _regular_file_generation_identity(lockfile)
              security_podspec_identity = _regular_file_generation_identity(security_podspec)
              security_build_snapshot = _tree_generation_snapshot(security_build)
              identity_podspec_identity = _regular_file_generation_identity(identity_podspec)
              identity_sources_snapshot = _tree_generation_snapshot(identity_sources)

              snapshot: tuple[object, ...] = (
                  ("podfile_lock", lockfile_identity),
                  ("security_podspec", security_podspec_identity),
                  ("security_build", security_build_snapshot),
                  ("identity_podspec", identity_podspec_identity),
                  ("identity_sources", identity_sources_snapshot),
              )

              # The five authorities above are collected sequentially. Revalidate every
              # earlier pathname and tree membership only after the last tree walk so the
              # returned tuple is one coherent whole-record generation witness.
              if _regular_file_generation_identity(lockfile) != lockfile_identity:
                  raise ProvenanceError("private build inputs changed while their generation snapshot was collected")
              if _regular_file_generation_identity(security_podspec) != security_podspec_identity:
                  raise ProvenanceError("private build inputs changed while their generation snapshot was collected")
              _revalidate_tree_generation_snapshot(security_build, security_build_snapshot)
              if _regular_file_generation_identity(identity_podspec) != identity_podspec_identity:
                  raise ProvenanceError("private build inputs changed while their generation snapshot was collected")
              _revalidate_tree_generation_snapshot(identity_sources, identity_sources_snapshot)

              return snapshot
          
          ''')
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY

      - name: Verify whole-authority coherence and current provenance suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_final_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_tree_generation.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Scripts/capture_tuya_private_input_provenance.py').read_text(encoding='utf-8')
          start = source.index('def _private_input_record_generation_snapshot(')
          end = source.index('\ndef build_record(', start)
          snapshot = source[start:end]
          for token in [
              '_revalidate_tree_generation_snapshot(security_build, security_build_snapshot)',
              '_revalidate_tree_generation_snapshot(identity_sources, identity_sources_snapshot)',
              '_regular_file_generation_identity(lockfile) != lockfile_identity',
              '_regular_file_generation_identity(security_podspec) != security_podspec_identity',
              '_regular_file_generation_identity(identity_podspec) != identity_podspec_identity',
              'return snapshot',
          ]:
              if token not in snapshot:
                  raise SystemExit(f'whole-authority generation witness missing: {token}')
          if '    return (\n' in snapshot:
              raise SystemExit('generation snapshot still returns sequentially without a named coherent witness')
          print('Capture final private-input generation snapshot coherence: PASS')
          PY
          git diff --check

      - name: Collapse helper into provenance repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-final-generation-snapshot-coherence-f332-sol.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): make private generation witness self-coherent'
          git push origin HEAD:fix/v14-capture-final-generation-snapshot-coherence-f332-sol
