name: tmp V14 Field Verified Git Source Contract

on:
  push:
    branches:
      - repair/v14-field-verified-git-source-contract-sol-1316vk
    paths:
      - .github/workflows/tmp-v14-field-verified-git-source-contract.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Bind exact construction parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '6b0c974d432205593f2d1157de06544a01145489'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/tmp-v14-field-verified-git-source-contract.yml'

      - name: Converge Field source contract to verified Git payload authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/capture-field-build-provenance.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          grep -Fq 'run_authority_git show "$SOURCE_SHA:scripts/ci/es80_signed_field_artifact_private_runner.py"' "$installer"\n'''
          new = '''          grep -Fq 'PRIVATE_DEVICE_RUNNER_RELATIVE="scripts/ci/es80_signed_field_artifact_private_runner.py"' "$installer"\n          grep -Fq 'read_verified_accepted_git_blob "$PRIVATE_DEVICE_RUNNER_RELATIVE" |' "$installer"\n          if grep -Fq 'run_authority_git show "$SOURCE_SHA:scripts/ci/es80_signed_field_artifact_private_runner.py"' "$installer"; then\n            echo 'ERROR: private intended-device reader must use independently verified accepted Git payload bytes, not raw git show execution.' >&2\n            exit 1\n          fi\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale private-runner git-show source contract')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'read_verified_accepted_git_blob "$PRIVATE_DEVICE_RUNNER_RELATIVE" |' .github/workflows/capture-field-build-provenance.yml
          if grep -Fq 'grep -Fq '\''run_authority_git show "$SOURCE_SHA:scripts/ci/es80_signed_field_artifact_private_runner.py"'\'' "$installer"' .github/workflows/capture-field-build-provenance.yml; then
            : # The only remaining occurrence is intentionally inside a negative if guard.
          fi
          git diff --check

      - name: Remove construction workflow and publish durable test-only repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-v14-field-verified-git-source-contract.yml
          test "$(git diff --name-only)" = '.github/workflows/capture-field-build-provenance.yml
          git config user.name 'nembra-swarm'
          git config user.email 'nembra-swarm@users.noreply.github.com'
          git add .github/workflows/capture-field-build-provenance.yml .github/workflows/tmp-v14-field-verified-git-source-contract.yml
          git commit -m 'Capture: converge Field verified Git source contract'
          git push origin HEAD:repair/v14-field-verified-git-source-contract-sol-1316vk
