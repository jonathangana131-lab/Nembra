name: Apply V14 current continuity mirror repair

on:
  push:
    branches: [repair/v14-capture-continuity-mirror-current-sol]
    paths:
      - '.github/workflows/apply-v14-continuity-mirror-current.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact current convergence input
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "$(git show 75e39f708f58734dd32bd61471bd13dada9d8546:NembraApp/App/NembraCaptureEntrypoint.swift | git hash-object --stdin)"
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelationRestartLifecycleSourceTests.swift

      - name: Transplant reviewed continuity mirror only
        run: |
          set -euo pipefail
          git fetch origin repair/v14-capture-continuity-mirror-live-sol
          git diff 675326ad788235a3035156750e95387645087cda..74dc360343ae56041739941a77ee1fc34f8351b5 -- \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift \
            | git apply --3way
          git diff --check
          grep -Fq 'mirrorAlreadyTerminalObservationContinuity' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'accepted_prefix_seal_continuity_invalidated' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'accepted_prefix_seal_lifecycle_rejected' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'active_generation_blocks_discovery_reset' NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAlreadyTerminalObservationContinuitySourceTests.swift

      - name: Assert mirror never re-terminalizes package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          a=s.index('private func mirrorAlreadyTerminalObservationContinuity')
          b=s.index('private func invalidateObservationContinuity', a)
          helper=s[a:b]
          assert 'sessionLedger.' not in helper
          assert 'currentConnectionToken = nil' in helper
          assert 'localBLESettlementToken = nil' in helper
          assert 'watchdog?.cancel()' in helper
          PY

      - name: Commit product and retire workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v14-continuity-mirror-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): mirror package-terminal continuity on current spine"
          git push origin HEAD:repair/v14-capture-continuity-mirror-current-sol
