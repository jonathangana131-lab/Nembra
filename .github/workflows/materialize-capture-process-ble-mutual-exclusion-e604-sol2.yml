name: Materialize Capture Process BLE Mutual Exclusion e604

on:
  push:
    branches:
      - fix/v14-capture-process-ble-mutual-exclusion-e604-sol2

permissions:
  contents: write

concurrency:
  group: capture-process-ble-mutual-exclusion-e604-sol2
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-process-ble-mutual-exclusion-e604-sol2
          fetch-depth: 0

      - name: Guard exact current-product parent and helper-only staging
        shell: bash
        run: |
          set -euo pipefail
          parent='e60494fd32a8b307cb825e5e47b0e393ff3509dd'
          test "$(git merge-base HEAD "$parent")" = "$parent"
          test "$(git rev-parse "$parent:NembraApp/App/NembraCaptureEntrypoint.swift")" = "$(git rev-parse HEAD:NembraApp/App/NembraCaptureEntrypoint.swift)"
          unexpected="$(git diff --name-only "$parent"...HEAD | grep -Ev '^(.github/workflows/materialize-capture-process-ble-mutual-exclusion-e604-sol2.yml|scripts/ci/materialize_capture_process_ble_mutual_exclusion_e604.py)$' || true)"
          test -z "$unexpected"

      - name: Materialize current-parent ownership repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_process_ble_mutual_exclusion_e604.py
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaProcessBLEMutualExclusionCurrentProductSourceTests.swift

      - name: Verify truth boundary and inherited current product
        shell: bash
        run: |
          set -euo pipefail
          app='NembraApp/App/NembraCaptureEntrypoint.swift'
          testfile='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaProcessBLEMutualExclusionCurrentProductSourceTests.swift'
          grep -Fq 'private let controllerOwnershipID = UUID()' "$app"
          grep -Fq 'OfficialTuyaFactory.claimPackageCorrelation(ownerID: controllerOwnershipID)' "$app"
          grep -Fq 'OfficialTuyaFactory.ownsPackageCorrelation(ownerID: controllerOwnershipID)' "$app"
          grep -Fq 'OfficialTuyaFactory.releasePackageCorrelation(ownerID: controllerOwnershipID)' "$app"
          grep -Fq 'guard packageCorrelationOwnerIsClear else { return nil }' "$app"
          grep -Fq 'packageCorrelationRetiredForProcess = true' "$app"
          grep -Fq 'sdk_local_ble_reacquired_during_target_correlation' "$app"
          grep -Fq 'sdk_local_ble_ownership_blocks_correlation_window' "$app"
          grep -Fq 'sdk_local_ble_ownership_invalidates_correlation_window' "$app"
          grep -Fq 'let appleNickname = credential.fullName?.nickname' "$app"
          grep -Fq 'procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier' "$app"
          grep -Fq 'self.sealedAcceptedExport = self.makeExport(' "$app"
          grep -Fq 'TuyaProcessBLEMutualExclusionCurrentProductSourceTests' "$testfile"
          controller="$(sed -n '/private final class SecureLinkController/,/private protocol OfficialTuyaDriver/p' "$app")"
          ! grep -Fq 'disconnectBLE' <<<"$controller"
          ! grep -Fq 'publishDps(' <<<"$controller"
          ! grep -Fq 'queryDps(' <<<"$controller"
          ! grep -Fq 'writeValue(' <<<"$controller"

      - name: Publish clean two-path successor
        shell: bash
        run: |
          set -euo pipefail
          parent='e60494fd32a8b307cb825e5e47b0e393ff3509dd'
          rm -f scripts/ci/materialize_capture_process_ble_mutual_exclusion_e604.py
          rm -f .github/workflows/materialize-capture-process-ble-mutual-exclusion-e604-sol2.yml
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$parent" | sort)
          expected=(
            'NembraApp/App/NembraCaptureEntrypoint.swift'
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaProcessBLEMutualExclusionCurrentProductSourceTests.swift'
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#wanted[@]}"
          for i in "${!wanted[@]}"; do test "${changed[$i]}" = "${wanted[$i]}"; done
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git commit -m 'fix(capture): make package and Tuya BLE ownership mutually exclusive'
          git push origin HEAD:fix/v14-capture-process-ble-mutual-exclusion-e604-sol2
