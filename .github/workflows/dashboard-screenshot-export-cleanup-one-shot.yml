name: Dashboard screenshot export cleanup one-shot

on:
  push:
    branches:
      - product/dashboard-battery-range-instrument-gpt56sol
    paths:
      - .github/workflows/dashboard-screenshot-export-cleanup-one-shot.yml

permissions:
  contents: write

concurrency:
  group: dashboard-screenshot-export-cleanup-one-shot
  cancel-in-progress: false

jobs:
  repair-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: product/dashboard-battery-range-instrument-gpt56sol
      CLOSURE: .github/workflows/dashboard-cockpit-product-closure.yml
      OLD_AUTHORING: .github/workflows/dashboard-battery-range-ui-evidence-once.yml
      SELF: .github/workflows/dashboard-screenshot-export-cleanup-one-shot.yml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind immutable Dashboard head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = '${{ github.sha }}'
          test -f "$OLD_AUTHORING"

      - name: Repair supported xcresult attachment export
        shell: python3
        run: |
          from pathlib import Path
          path = Path('.github/workflows/dashboard-cockpit-product-closure.yml')
          src = path.read_text(encoding='utf-8')
          old = '''          xcrun xcresulttool get test-results attachments \\
            --path /tmp/NembraDashboard.xcresult \\
            --output-path /tmp/NembraDashboardAttachments
'''
          new = '''          xcrun xcresulttool export attachments \\
            --path /tmp/NembraDashboard.xcresult \\
            --output-path /tmp/NembraDashboardAttachments
'''
          if src.count(old) != 1:
              raise SystemExit(f'xcresult attachment export anchor count={src.count(old)}')
          path.write_text(src.replace(old, new, 1), encoding='utf-8')

      - name: Enforce QA-only repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}')" = "$CLOSURE"
          grep -Fq 'xcrun xcresulttool export attachments' "$CLOSURE"
          grep -Fq 'test "$count" -ge 5' "$CLOSURE"

      - name: Publish clean product plus QA successor
        shell: bash
        run: |
          set -euo pipefail
          trigger='${{ github.sha }}'
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$trigger"
          rm -f "$OLD_AUTHORING" "$SELF"
          git add -- "$CLOSURE" "$OLD_AUTHORING" "$SELF"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Dashboard: use supported retained-screenshot export'
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$trigger" origin "HEAD:refs/heads/$TARGET_BRANCH"
