name: Materialize Capture View Exit Membership Race R2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'fix/v14-capture-view-exit-membership-race-r2-sol'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact parent and untouched product source
        shell: bash
        run: |
          set -euo pipefail
          parent='b59cd71272b465bcad70fcc3425382bb29541b2e'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = '.github/workflows/materialize-capture-view-exit-membership-race-r2-sol.yml'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift'

      - name: Apply deterministic hidden-start retirement repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')
          start_token = '    func abandonCorrelationForViewExit() {'
          end_token = '\n\n    var privateConfig: Bool'
          if source.count(start_token) != 1:
              raise SystemExit(f'expected one cleanup function, found {source.count(start_token)}')
          start = source.index(start_token)
          end = source.index(end_token, start)
          current = source[start:end]
          for required in (
              'guard processCorrelationLease != nil || correlationSession != nil else { return }',
              'abandonPackageCorrelation()',
              'target_correlation_abandoned_on_view_exit',
          ):
              if required not in current:
                  raise SystemExit(f'current active-correlation exit contract drifted: {required}')
          for unexpected in ('membershipRequestID = UUID()', 'membershipProbe = nil'):
              if unexpected in current:
                  raise SystemExit(f'hidden-start revocation already present; do not duplicate: {unexpected}')
          new = '''    func abandonCorrelationForViewExit() {
        // Secure Link can disappear while current-account membership enumeration is still
        // in flight, before OFF1 owns a scanner/lease. Revoke that callback authority first
        // so a late successful membership result cannot start hidden package correlation.
        membershipRequestID = UUID()
        membershipBusy = false
#if canImport(ThingSmartHomeKit)
        membershipProbe = nil
#endif

        guard processCorrelationLease != nil || correlationSession != nil else { return }
        // Preserve the accepted radio ordering: package transport retires first and the
        // owner-token lease releases inside abandonPackageCorrelation().
        abandonPackageCorrelation()
        phase = .failed
        message = "Bluetooth correlation was interrupted when Capture left Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."
        log("target_correlation_abandoned_on_view_exit")
    }'''
          path.write_text(source[:start] + new + source[end:], encoding='utf-8')
          PY

      - name: Verify strengthened lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('func abandonCorrelationForViewExit()')
          end = s.index('var privateConfig: Bool', start)
          cleanup = s[start:end]
          required = (
              'membershipRequestID = UUID()',
              'membershipBusy = false',
              'membershipProbe = nil',
              'guard processCorrelationLease != nil || correlationSession != nil else { return }',
              'abandonPackageCorrelation()',
              'target_correlation_abandoned_on_view_exit',
          )
          for needle in required:
              assert needle in cleanup, needle
          guard = cleanup.index('guard processCorrelationLease')
          assert cleanup.index('membershipRequestID = UUID()') < guard
          assert cleanup.index('membershipBusy = false') < guard
          assert cleanup.index('membershipProbe = nil') < guard
          assert 'releasePackageCorrelationLease()' not in cleanup
          for forbidden in ('connectBLE(', 'publishDps', 'writeValue', 'disconnect'):
              assert forbidden not in cleanup, forbidden
          print('view-exit hidden-start revocation contract: PASS')
          PY
          git diff --check

      - name: Collapse helper into clean two-path product repair
        shell: bash
        run: |
          set -euo pipefail
          parent='b59cd71272b465bcad70fcc3425382bb29541b2e'
          rm .github/workflows/materialize-capture-view-exit-membership-race-r2-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift
          git add -u .github/workflows/materialize-capture-view-exit-membership-race-r2-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' \
            commit -m 'fix(capture): cancel hidden correlation start on view exit'
          mapfile -t changed < <(git diff --name-only "$parent" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 2
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift'
          git diff --check "$parent" HEAD
          git push origin HEAD:${GITHUB_HEAD_REF}
