name: Capture Private Read Lease Held Symlink Bootstrap

on:
  pull_request:
    branches:
      - hardening/v17-capture-read-lease-held-descriptor-plan-sol-20260814
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'repair/v17-capture-read-lease-held-symlink-policy-sol-20260815'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Execute checked-in one-shot materializer as data
        shell: bash
        env:
          EXACT_PARENT: 474507966619ce39288b20de29066711088cd986
          MATERIALIZER: .github/workflows/capture-private-read-lease-held-symlink-policy-materialize-once.yml
          BOOTSTRAP: .github/workflows/capture-private-read-lease-held-symlink-policy-bootstrap.yml
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          mapfile -t authored < <(git diff --name-only "$EXACT_PARENT"...HEAD | sort)
          test "${#authored[@]}" -eq 2
          test "${authored[0]}" = "$BOOTSTRAP"
          test "${authored[1]}" = "$MATERIALIZER"

          python3 <<'PY'
          from pathlib import Path

          materializer = Path('.github/workflows/capture-private-read-lease-held-symlink-policy-materialize-once.yml')
          lines = materializer.read_text(encoding='utf-8').splitlines()
          marker = '        run: |'
          try:
              start = lines.index(marker) + 1
          except ValueError as error:
              raise SystemExit('materializer run block marker drifted') from error
          script_lines = []
          for line in lines[start:]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif not line:
                  script_lines.append('')
              else:
                  raise SystemExit(f'materializer run block indentation drifted: {line!r}')
          script = '\n'.join(script_lines) + '\n'
          old_initial = '''mapfile -t initial_paths < <(git diff --name-only "$EXACT_PARENT"...HEAD)
test "${#initial_paths[@]}" -eq 1
test "${initial_paths[0]}" = "$MATERIALIZER"
'''
          if script.count(old_initial) != 1:
              raise SystemExit('materializer initial-scope block drifted')
          script = script.replace(old_initial, ': # bootstrap already exact-bound initial scope\n', 1)
          old_final = 'mapfile -t final_paths < <(git diff --name-only "$EXACT_PARENT"...HEAD; git diff --name-only)'
          new_final = 'mapfile -t final_paths < <(git diff --name-only "$EXACT_PARENT")'
          if script.count(old_final) != 1:
              raise SystemExit('materializer final-scope block drifted')
          script = script.replace(old_final, new_final, 1)
          Path('/tmp/nembra-held-symlink-materialize.sh').write_text(script, encoding='utf-8')
          PY

          rm "$BOOTSTRAP"
          /bin/bash /tmp/nembra-held-symlink-materialize.sh
