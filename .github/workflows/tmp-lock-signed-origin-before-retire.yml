name: Temporary harden signed app origin lock order

on:
  push:
    branches:
      - repair/v14-signed-app-build-origin-custody-sol-20260811

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Run signed app origin lock-order hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPYCACHEPREFIX: /tmp/nembra-origin-lock-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact hardening head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Revoke build capability before descendant retirement
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          helper = Path('scripts/ci/capture_signed_app_build_origin_custody.py')
          lines = helper.read_text(encoding='utf-8').splitlines(keepends=True)
          wait = '        returncode = process.wait()\n'
          retire = '        _terminate_remaining_process_group(process.pid)\n'
          owner = '        os.chown(derived_root, 0, 0)\n'
          mode = '        os.chmod(derived_root, 0o700)\n'
          if lines.count(wait) != 1 or lines.count(retire) != 1 or lines.count(owner) != 1 or lines.count(mode) != 1:
              raise SystemExit('helper lock-order markers changed')
          wait_i = lines.index(wait)
          retire_i = lines.index(retire)
          owner_i = lines.index(owner)
          mode_i = lines.index(mode)
          if not (retire_i == wait_i + 1 and owner_i < mode_i):
              raise SystemExit('helper lock-order precondition changed')
          lines.pop(retire_i)
          mode_i = lines.index(mode)
          lines.insert(mode_i + 1, retire)
          old_comment = [
              '        # Revoke the transient filesystem capability before any bundle bytes are hashed or copied.\n',
              '        # External same-UID processes never possessed the supplementary gid, and ordinary build\n',
              '        # descendants have been retired before root closes traversal of the output root.\n',
          ]
          start = next((i for i in range(len(lines) - 2) if lines[i:i + 3] == old_comment), None)
          if start is None:
              raise SystemExit('helper authority comment precondition changed')
          new_comment = [
              '        # Revoke the transient filesystem capability at the first privileged instruction after the\n',
              '        # guarded build returns. The group-owner change removes the one-run gid from the root\n',
              '        # traversal decision; mode 0700 makes that closure explicit before descendant cleanup.\n',
          ]
          lines[start:start + 3] = new_comment
          helper.write_text(''.join(lines), encoding='utf-8')

          test = Path('scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py')
          lines = test.read_text(encoding='utf-8').splitlines(keepends=True)
          tuple_start = lines.index('        for name in (\n')
          retire_line = '            "retire",\n'
          owner_line = '            "lock_owner",\n'
          mode_line = '            "lock_mode",\n'
          retire_i = lines.index(retire_line, tuple_start)
          owner_i = lines.index(owner_line, tuple_start)
          mode_i = lines.index(mode_line, tuple_start)
          if not (retire_i + 1 == owner_i and owner_i + 1 == mode_i):
              raise SystemExit('regression lock-order precondition changed')
          lines.pop(retire_i)
          mode_i = lines.index(mode_line, tuple_start)
          lines.insert(mode_i + 1, retire_line)
          test.write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Validate hardening
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check

      - name: Publish non-workflow hardening
        shell: bash
        run: |
          set -euo pipefail
          git add \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          git diff --cached --check
          git config user.name 'nembra-sol-swarm'
          git config user.email 'nembra-sol-swarm@users.noreply.github.com'
          git commit -m 'Revoke build output authority before cleanup'
          git push origin HEAD:repair/v14-signed-app-build-origin-custody-sol-20260811
