name: Capture Final GO Authority Subject Custody

on:
  push:
    branches:
      - repair/v14-final-go-authority-subject-custody-sol
  pull_request:
    paths:
      - scripts/ci/es80_authenticated_stationary_final_go.py
      - scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
      - scripts/ci/tests/test_es80_final_go_authority_subject_custody.py
      - .github/workflows/capture-final-go-authority-subject-custody.yml

permissions:
  contents: read

jobs:
  authority-subject-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind diagnostic to exact head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Compile authority regression
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_final_go.py \
            scripts/ci/tests/test_es80_final_go_authority_subject_custody.py
      - name: Require pinned executable and replacement-blind Git subjects
        run: python3 scripts/ci/tests/test_es80_final_go_authority_subject_custody.py
