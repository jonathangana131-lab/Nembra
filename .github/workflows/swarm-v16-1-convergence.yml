name: Swarm V16.1 Retained Compatibility

on:
  pull_request:
    paths:
      - '.swarm/config.json'
      - 'SWARM_GO.md'
      - 'scripts/swarmcp/**'
      - 'scripts/swarm_v16_1_pr_admission.py'
      - 'scripts/ci/tests/test_swarm_v16_mission_graph.py'
      - 'scripts/ci/tests/test_swarm_v16_1_convergence.py'
      - 'scripts/ci/tests/test_swarm_v16_1_rollout.py'
      - '.github/workflows/swarm-v16-1-*.yml'
      - '.github/workflows/swarm-v16-2-*.yml'
  push:
    branches: [main]
    paths:
      - '.swarm/config.json'
      - 'SWARM_GO.md'
      - 'scripts/swarmcp/**'
      - 'scripts/swarm_v16_1_pr_admission.py'
      - 'scripts/ci/tests/test_swarm_v16_mission_graph.py'
      - 'scripts/ci/tests/test_swarm_v16_1_convergence.py'
      - 'scripts/ci/tests/test_swarm_v16_1_rollout.py'
      - '.github/workflows/swarm-v16-1-*.yml'
      - '.github/workflows/swarm-v16-2-*.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: swarm-v16-1-retained-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retained-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 2

      - name: Bind candidate head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile retained control plane
        run: python3 -m py_compile scripts/swarm_control.py scripts/swarm_v16_1_pr_admission.py scripts/swarmcp/*.py

      - name: Prove V16.1 convergence invariants remain enabled
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          cfg=json.load(open('.swarm/config.json'))
          v=cfg['v16']
          assert v['policyVersion'] in {'16.1','16.2'}
          c=v['convergence']
          assert c['oneBuilderBranchPerBlocker'] is True
          assert c['joinBeforeSuccessor'] is True
          assert c['maxDistinctAttemptBranchesPerBlocker']==2
          assert c['lowProgressAttemptsBeforeFreeze']==3
          assert c['automaticPRAdmission'] is True
          PY

      - name: Run retained V16/V16.1 suites
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_swarm_v16_mission_graph.py
          python3 scripts/ci/tests/test_swarm_v16_1_convergence.py
          python3 scripts/ci/tests/test_swarm_v16_1_rollout.py

      - name: Re-run retained adversarial simulations
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt, sys
          sys.path.insert(0,'scripts')
          import swarm_control as sc
          now=dt.datetime(2026,8,14,8,10,tzinfo=dt.timezone.utc)
          assert sc.run_v16_adversarial_simulation(30,now)['passed']
          assert sc.run_v16_1_adversarial_simulation(30,now)['passed']
          PY

      - name: Prove physical authority unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          cfg=json.load(open('.swarm/config.json'))
          assert cfg['physicalSafety']['schedulerMayPromotePhysicalGo'] is False
          assert cfg['v16']['physicalSafety']['schedulerMayPromotePhysicalGo'] is False
          assert cfg['v16']['physicalSafety']['commandsRequirePhysicalMapping'] is True
          PY
