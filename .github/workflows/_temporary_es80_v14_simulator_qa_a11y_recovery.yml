name: Temporary ES80 V14 Simulator QA accessibility recovery

on:
  push:
    branches:
      - recovery/es80-v14-simulator-qa-a11y/gpt56-thinking-go

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and assert exact product source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraApp.swift')
          text = path.read_text()
          lines = text.splitlines(keepends=True)
          candidates = []
          for index in range(len(lines) - 1):
              if lines[index].strip() != '.frame(maxWidth: .infinity, alignment: .leading)':
                  continue
              if lines[index + 1].strip() != '.contentShape(Rectangle())':
                  continue
              context = ''.join(lines[max(0, index - 30):index])
              if 'Text("Engineering details")' in context:
                  candidates.append(index)

          if len(candidates) != 1:
              print(f'::error::expected exactly one Engineering details frame/contentShape anchor; found {len(candidates)}')
              raise SystemExit(1)

          index = candidates[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          ending = '\r\n' if lines[index].endswith('\r\n') else '\n'
          lines.insert(index + 1, indent + '.frame(minHeight: 44)' + ending)
          text = ''.join(lines)

          required = (
              '#if DEBUG && targetEnvironment(simulator)',
              '--es80-passive-capture-simulator-qa',
              'PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()',
              'if PassiveBluetoothExperimentOneFieldExecutionGate.permitsPhysicalProcedure',
              '.frame(minHeight: 44)',
          )
          for token in required:
              if token not in text:
                  print(f'::error::missing required product/truth token: {token}')
                  raise SystemExit(1)
          if 'permitsPhysicalProcedure = true' in text:
              print('::error::forbidden physical-permission assignment detected')
              raise SystemExit(1)

          fixture = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneSimulatorQAFixture.swift').read_text()
          for token in ('physicalProcedurePermitted: false', 'mayUseBluetoothTransport: false'):
              if token not in fixture:
                  print(f'::error::missing synthetic fail-closed fixture token: {token}')
                  raise SystemExit(1)

          path.write_text(text)
          PY
          git diff --check

      - name: Commit exact accessibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NembraApp/App/NembraApp.swift
          git commit -m 'fix(capture): preserve locked disclosure hit target in Simulator QA'

      - name: Publish repaired product head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:recovery/es80-v14-simulator-qa-a11y/gpt56-thinking-go
