name: Materialize Capture Export Secret Promise CA43

on:
  push:
    branches:
      - sol/v14-capture-export-secret-promise-ca43

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          BASE=ca43d7943027f04a1dfe4ab5f777c24a167ea96b
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t paths < <(git diff --name-only "$BASE"...HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = ".github/workflows/materialize-capture-export-secret-promise-ca43.yml"

      - name: Apply fail-closed export secret promise repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = app.read_text()
          old = '''    private static let secretKeyFragments = [
                  "localkey",
                  "accesstoken",
                  "refreshtoken",
                  "sessionkey",
                  "authkey",
                  "seckey",
              ]'''
          new = '''    private static let secretKeyFragments = [
                  "localkey",
                  "sessionkey",
                  "appkey",
                  "appsecret",
                  "password",
                  "accounttoken",
                  "accesstoken",
                  "refreshtoken",
                  "authkey",
                  "seckey",
              ]'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one SmartLife secret fragment list, found {text.count(old)}")
          app.write_text(text.replace(old, new, 1))

          bridge = Path("NembraApp/Features/Research/TuyaAccountBridge.swift")
          bridge_text = bridge.read_text()
          old_bridge = '            let secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "sessionkey", "seckey", "authkey"]'
          new_bridge = '            let secretKeyFragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "seckey", "authkey"]'
          if bridge_text.count(old_bridge) != 1:
              raise SystemExit(f"expected one TuyaAccountBridge secret fragment list, found {bridge_text.count(old_bridge)}")
          bridge.write_text(bridge_text.replace(old_bridge, new_bridge, 1))

          test = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExportSecretPromiseCurrentProductSourceTests.swift")
          test.write_text(r'''import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Current Capture export secret promise")
          struct TuyaExportSecretPromiseCurrentProductSourceTests {
              private let promisedSecretFragments = [
                  "localkey",
                  "sessionkey",
                  "appkey",
                  "appsecret",
                  "password",
                  "accounttoken",
                  "accesstoken",
                  "refreshtoken",
                  "authkey",
                  "seckey",
              ]

              @Test("authenticated application update sanitizer covers every export-promised secret class")
              func applicationSanitizerMatchesExportPromise() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))
                  let makeExport = String(try section(
                      in: source,
                      from: "private func makeExport(exportedAt:",
                      to: "func prepareExport()"
                  ))
                  let prepareExport = String(try section(
                      in: source,
                      from: "func prepareExport()",
                      to: "private func abandonPackageCorrelation()"
                  ))

                  #expect(makeExport.contains("secretsRedacted: true"))
                  #expect(prepareExport.contains("No account UID, AppKey/AppSecret, password, account token, local_key, session key"))
                  for fragment in promisedSecretFragments {
                      #expect(driver.contains("\"\(fragment)\""), "missing application secret classifier fragment: \(fragment)")
                  }
                  #expect(driver.contains("String(describing: Self.redactApplicationSecrets(value))"))
                  #expect(driver.contains("onApplicationUpdate?(sanitized)"))
              }

              @Test("Tuya metadata sanitizer covers the same export-promised secret classes")
              func metadataSanitizerMatchesExportPromise() throws {
                  let source = try readRepositoryFile("NembraApp/Features/Research/TuyaAccountBridge.swift")
                  let redactor = String(try section(
                      in: source,
                      from: "private static func redactSecrets(_ object: Any) -> Any",
                      to: "private static func remoteMessage(_ object: [String: Any]) -> String"
                  ))

                  for fragment in promisedSecretFragments {
                      #expect(redactor.contains("\"\(fragment)\""), "missing metadata secret classifier fragment: \(fragment)")
                  }
                  #expect(redactor.contains("key.lowercased().filter"))
                  #expect(redactor.contains("redactSecrets(value)"))
                  #expect(redactor.contains("array.map(redactSecrets)"))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error { case sectionMissing }
          }
          ''')
          PY

      - name: Verify bounded truth repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text()
          bridge = Path("NembraApp/Features/Research/TuyaAccountBridge.swift").read_text()
          fragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "authkey", "seckey"]
          driver = app.split("@MainActor\nprivate final class SmartLifeDriver", 1)[1].split("#endif\n\nprivate enum AppleAccountAuthorizationError", 1)[0]
          redactor = bridge.split("private static func redactSecrets(_ object: Any) -> Any", 1)[1].split("private static func remoteMessage(_ object: [String: Any]) -> String", 1)[0]
          for fragment in fragments:
              assert f'"{fragment}"' in driver, fragment
              assert f'"{fragment}"' in redactor, fragment
          assert 'secretsRedacted: true' in app
          assert 'No account UID, AppKey/AppSecret, password, account token, local_key, session key' in app
          assert 'onApplicationUpdate?(sanitized)' in driver
          assert 'String(describing: Self.redactApplicationSecrets(value))' in driver
          PY
          git diff --check

      - name: Publish clean current-product donor
        shell: bash
        run: |
          set -euo pipefail
          BASE=ca43d7943027f04a1dfe4ab5f777c24a167ea96b
          WORKFLOW=.github/workflows/materialize-capture-export-secret-promise-ca43.yml
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExportSecretPromiseCurrentProductSourceTests.swift
          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            ".github/workflows/materialize-capture-export-secret-promise-ca43.yml"
            "NembraApp/App/NembraCaptureEntrypoint.swift"
            "NembraApp/Features/Research/TuyaAccountBridge.swift"
            "$TEST"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${staged[*]}" = "${expected_sorted[*]}"
          git commit -m "fix(capture): match export secret redaction promise"
          mapfile -t effective < <(git diff --name-only "$BASE"...HEAD | sort)
          expected_effective=(
            "NembraApp/App/NembraCaptureEntrypoint.swift"
            "NembraApp/Features/Research/TuyaAccountBridge.swift"
            "$TEST"
          )
          mapfile -t expected_effective_sorted < <(printf '%s\n' "${expected_effective[@]}" | sort)
          test "${effective[*]}" = "${expected_effective_sorted[*]}"
          git diff --check "$BASE"...HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
