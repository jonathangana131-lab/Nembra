name: Temporary Capture Root XXXL Base Sync

on:
  push:
    branches:
      - product/v14-capture-root-xxxl-recompose-sol

permissions:
  contents: write

jobs:
  sync-base:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge exact current Capture final base
        shell: bash
        run: |
          set -euo pipefail
          expected_base='8c87c0781c6f0f2aa82d8fd6b8e9c84bcdb5cf19'
          git fetch --no-tags origin agent/v14-capture-live-main-visual-acceptance-sol
          actual_base="$(git rev-parse FETCH_HEAD)"
          test "$actual_base" = "$expected_base"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$expected_base"
          git diff --check "$expected_base"...HEAD
          changed="$(git diff --name-only "$expected_base"...HEAD | sort)"
          expected=$'NembraApp/App/NembraCaptureEntrypoint.swift\nPackages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootAccessibilityXXXLRecompositionTests.swift\n.github/workflows/tmp-capture-root-xxxl-sync.yml'
          test "$changed" = "$(printf '%s\n' "$expected" | sort)"
          git push origin HEAD:${GITHUB_REF_NAME}
