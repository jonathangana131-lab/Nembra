name: Capture Private Read Lease Integrate Once

on:
  push:
    branches:
      - repair/v17-capture-private-read-lease-descriptor-60c-sol-20260814

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'nembra-swarm-materializer'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize exact build-principal lease window
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact patch anchor, found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          orchestrator = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          origin = Path("scripts/ci/capture_signed_app_build_origin_custody.py")
          tests = Path("scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py")

          replace_once(
              orchestrator,
              "class SelectedXcodeBuildOrchestratorError(RuntimeError):\n    pass\n",
              "class SelectedXcodeBuildOrchestratorError(RuntimeError):\n    pass\n\n\nPRIVATE_READ_RELATIVE_ROOTS = (\n    Path(\"LocalSecrets/TuyaSDK\"),\n    Path(\"LocalSecrets/TuyaRuntime\"),\n)\n",
          )
          replace_once(
              orchestrator,
              "    build_origin = _load_namespace(\n",
              "    repository = Path(os.getcwd())\n    private_read_lease = _PrivateReadLease(\n        tuple(repository / relative for relative in PRIVATE_READ_RELATIVE_ROOTS),\n        repository,\n    )\n\n    build_origin = _load_namespace(\n",
          )
          replace_once(
              orchestrator,
              "        fingerprint_helper_base64=install_custody_base64,\n    )\n",
              "        fingerprint_helper_base64=install_custody_base64,\n        private_read_lease=private_read_lease,\n    )\n",
          )

          replace_once(
              origin,
              "    fingerprint_helper_base64: str,\n) -> tuple[Path, str]:\n",
              "    fingerprint_helper_base64: str,\n    private_read_lease: object | None = None,\n) -> tuple[Path, str]:\n",
          )
          replace_once(
              origin,
              "    identity_created = False\n\n    try:\n",
              "    identity_created = False\n    private_read_lease_granted = False\n\n    try:\n",
          )
          replace_once(
              origin,
              "        build_groups = _attest_build_identity_groups(\n            build_name,\n            build_uid,\n            build_gid,\n            field_groups,\n            build_env,\n            home,\n        )\n\n        _create_apfs_image(image)\n",
              "        build_groups = _attest_build_identity_groups(\n            build_name,\n            build_uid,\n            build_gid,\n            field_groups,\n            build_env,\n            home,\n        )\n\n        if private_read_lease is not None:\n            grant = getattr(private_read_lease, \"grant\", None)\n            revoke = getattr(private_read_lease, \"revoke\", None)\n            if not callable(grant) or not callable(revoke):\n                raise BuildOriginCustodyError(\n                    \"private read-lease object does not expose exact grant/revoke lifecycle\"\n                )\n            grant(build_name)\n            private_read_lease_granted = True\n\n        _create_apfs_image(image)\n",
          )
          replace_once(
              origin,
              "        build = _run_exec_bound_build(\n            guarded_command,\n            name=build_name,\n            uid=build_uid,\n            gid=build_gid,\n            baseline_groups=build_groups,\n            environment=build_env,\n            cwd=Path(os.getcwd()),\n        )\n\n        # Revoke fresh pathname authority before interpreting status. Authority is\n",
              "        build = _run_exec_bound_build(\n            guarded_command,\n            name=build_name,\n            uid=build_uid,\n            gid=build_gid,\n            baseline_groups=build_groups,\n            environment=build_env,\n            cwd=Path(os.getcwd()),\n        )\n\n        if private_read_lease_granted:\n            private_read_lease.revoke()\n            private_read_lease_granted = False\n\n        # Revoke fresh pathname authority before interpreting status. Authority is\n",
          )
          replace_once(
              origin,
              "        retirement_error: BuildOriginCustodyError | None = None\n        # Forced detach is cleanup-only after acceptance has already failed. It is\n",
              "        retirement_error: BuildOriginCustodyError | None = None\n        lease_error: BuildOriginCustodyError | None = None\n        # Forced detach is cleanup-only after acceptance has already failed. It is\n",
          )
          replace_once(
              origin,
              "        if writable_device is not None:\n            _detach_apfs(writable_device, force=True)\n        if identity_created:\n",
              "        if writable_device is not None:\n            _detach_apfs(writable_device, force=True)\n        if private_read_lease_granted:\n            try:\n                private_read_lease.revoke()\n                private_read_lease_granted = False\n            except Exception as error:\n                lease_error = BuildOriginCustodyError(\n                    f\"private read lease did not revoke before build-principal retirement: {error}\"\n                )\n        if identity_created:\n",
          )
          replace_once(
              origin,
              "        if (failed_before_cleanup or retirement_error is not None) and stage_root is not None:\n            shutil.rmtree(stage_root, ignore_errors=True)\n        if retirement_error is not None:\n            raise retirement_error\n",
              "        if (\n            failed_before_cleanup\n            or lease_error is not None\n            or retirement_error is not None\n        ) and stage_root is not None:\n            shutil.rmtree(stage_root, ignore_errors=True)\n        if lease_error is not None:\n            raise lease_error\n        if retirement_error is not None:\n            raise retirement_error\n",
          )

          replace_once(
              tests,
              "def run_custodied_build(command, *, app_relative, fingerprint_helper_base64):\n",
              "def run_custodied_build(command, *, app_relative, fingerprint_helper_base64, private_read_lease):\n",
          )
          replace_once(
              tests,
              "    assert fingerprint_helper_base64 == INSTALL_BASE64\n    return Path(\"/private/tmp/nembra-authenticated-capture-install.fixture\"), \"b\" * 64\n",
              "    assert fingerprint_helper_base64 == INSTALL_BASE64\n    assert private_read_lease.__class__.__name__ == \"_PrivateReadLease\"\n    assert tuple(private_read_lease._subjects) == (\n        Path.cwd() / \"LocalSecrets/TuyaSDK\",\n        Path.cwd() / \"LocalSecrets/TuyaRuntime\",\n    )\n    return Path(\"/private/tmp/nembra-authenticated-capture-install.fixture\"), \"b\" * 64\n",
          )
          PY

      - name: Run portable exact contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py
          python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          git diff --check

      - name: Self-delete and publish integration
        shell: bash
        env:
          MATERIALIZER: .github/workflows/capture-private-read-lease-integrate-once.yml
          BRANCH: repair/v17-capture-private-read-lease-descriptor-60c-sol-20260814
        run: |
          set -euo pipefail
          git rm "$MATERIALIZER"
          git add \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            "$MATERIALIZER" \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/capture_signed_app_build_origin_custody.py \
            scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'nembra-swarm-materializer'
          git config user.email 'nembra-swarm@users.noreply.github.com'
          git commit -m 'Capture: wire private read lease to build principal'
          git push origin "HEAD:$BRANCH"