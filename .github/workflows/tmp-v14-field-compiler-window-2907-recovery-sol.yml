name: TMP V14 Field Compiler Window 2907 Recovery Sol

on:
  push:
    branches:
      - recovery/v14-field-compiler-window-2907-sol-20260811
    paths:
      - scripts/ci/tmp_materialize_field_compiler_window_2907_recovery_sol.py
      - .github/workflows/tmp-v14-field-compiler-window-2907-recovery-sol.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind exact recovery construction head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize selected convergence repair
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tmp_materialize_field_compiler_window_2907_recovery_sol.py
