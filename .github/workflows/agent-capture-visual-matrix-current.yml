name: Agent Capture visual matrix current

on:
  push:
    branches:
      - qa/es80-v14-capture-visual-matrix-current-gpt56

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/es80-v14-capture-visual-matrix-current-gpt56
          fetch-depth: 0

      - name: Apply current-head representative state matrix
        shell: bash
        run: |
          python3 -m py_compile .github/scripts/agent_capture_visual_matrix_current.py
          python3 .github/scripts/agent_capture_visual_matrix_current.py
          git diff --check
          grep -F 'testV14SimulatorQACapturesRepresentativeInProgressAndRecoveryStates' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -F 'scenario: "secondPoweredOff"' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -F 'scenario: "foregroundInterrupted"' NembraUITests/ES80ResearchCaptureUITests.swift
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -frontend -parse NembraUITests/ES80ResearchCaptureUITests.swift
          fi

      - name: Self-delete helper and checkpoint QA delta
        shell: bash
        run: |
          rm .github/workflows/agent-capture-visual-matrix-current.yml
          rm .github/scripts/agent_capture_visual_matrix_current.py
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add NembraUITests/ES80ResearchCaptureUITests.swift \
                  .github/workflows/agent-capture-visual-matrix-current.yml \
                  .github/scripts/agent_capture_visual_matrix_current.py
          git diff --cached --check
          git commit -m 'test(capture): retain representative Simulator visual states'
          git push origin HEAD:qa/es80-v14-capture-visual-matrix-current-gpt56
