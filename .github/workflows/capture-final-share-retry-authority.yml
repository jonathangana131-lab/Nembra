name: Capture Final Share Retry Authority QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - NembraApp/Features/Research/ES80CaptureShellView.swift
      - NembraUITests/ES80ResearchCaptureUITests.swift
      - .github/workflows/capture-final-share-retry-authority.yml

permissions:
  contents: read

jobs:
  exact-head-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          printf 'Expected exact PR head: %s\nActual checkout head: %s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Validate retained final Share retry authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          class ContractViolation(Exception):
              pass

          signature = "\n    private func prepareFinalShareForAnalysisAndSharing() {"
          next_member = "\n    private func restartExperiment() {"
          unsupported_extended_string = re.compile(r'#+"')

          def unique_offset(source: str, needle: str, label: str) -> int:
              matches = [match.start() for match in re.finditer(re.escape(needle), source)]
              if len(matches) != 1:
                  raise ContractViolation(
                      f"expected exactly one raw {label} boundary; found {len(matches)}"
                  )
              return matches[0]

          def authority_source(source: str) -> str:
              start = unique_offset(source, signature, "final Share function")
              end = unique_offset(source, next_member, "restartExperiment function")
              if end <= start:
                  raise ContractViolation("restartExperiment must follow final Share authority")
              return source[start:end]

          def mask_noncode(text: str) -> str:
              """Preserve offsets while hiding braces inside ordinary Swift comments/strings."""
              chars = list(text)
              masked = list(text)
              i = 0
              state = "code"
              block_depth = 0
              while i < len(chars):
                  if state == "code":
                      if text.startswith("//", i):
                          masked[i] = masked[i + 1] = " "
                          i += 2
                          state = "line-comment"
                          continue
                      if text.startswith("/*", i):
                          masked[i] = masked[i + 1] = " "
                          i += 2
                          state = "block-comment"
                          block_depth = 1
                          continue
                      if text.startswith('"""', i):
                          masked[i:i + 3] = "   "
                          i += 3
                          state = "multiline-string"
                          continue
                      if chars[i] == '"':
                          masked[i] = " "
                          i += 1
                          state = "string"
                          continue
                      i += 1
                      continue

                  if state == "line-comment":
                      if chars[i] == "\n":
                          state = "code"
                      else:
                          masked[i] = " "
                      i += 1
                      continue

                  if state == "block-comment":
                      if text.startswith("/*", i):
                          masked[i] = masked[i + 1] = " "
                          block_depth += 1
                          i += 2
                          continue
                      if text.startswith("*/", i):
                          masked[i] = masked[i + 1] = " "
                          block_depth -= 1
                          i += 2
                          if block_depth == 0:
                              state = "code"
                          continue
                      if chars[i] != "\n":
                          masked[i] = " "
                      i += 1
                      continue

                  if state == "string":
                      if chars[i] == "\\" and i + 1 < len(chars):
                          masked[i] = masked[i + 1] = " "
                          i += 2
                          continue
                      if chars[i] == '"':
                          masked[i] = " "
                          state = "code"
                      elif chars[i] != "\n":
                          masked[i] = " "
                      i += 1
                      continue

                  if state == "multiline-string":
                      if text.startswith('"""', i):
                          masked[i:i + 3] = "   "
                          i += 3
                          state = "code"
                          continue
                      if chars[i] != "\n":
                          masked[i] = " "
                      i += 1
                      continue

              if state in {"block-comment", "string", "multiline-string"}:
                  raise ContractViolation(f"unterminated Swift lexical state: {state}")
              return "".join(masked)

          retained_tuple = re.compile(
              r"if\s+finalShareData\s*!=\s*nil\s*,\s*"
              r"finalShareIntegrityReport\s*!=\s*nil\s*,\s*"
              r"finalShareFilename\s*!=\s*nil\s*\{\s*"
              r"sharePreparationWarning\s*=\s*nil\s*"
              r"return\s*\}",
              re.DOTALL,
          )
          mint_call = "coordinator.finalizedShareArtifactForCurrentApplication(setup: setup)"

          def depth_table(text: str) -> list[int]:
              masked = mask_noncode(text)
              depths = [0] * (len(masked) + 1)
              depth = 0
              for index, character in enumerate(masked):
                  depths[index] = depth
                  if character == "{":
                      depth += 1
                  elif character == "}":
                      depth -= 1
                      if depth < 0:
                          raise ContractViolation("unbalanced closing brace in function source")
              depths[len(masked)] = depth
              if depth != 0:
                  raise ContractViolation("unbalanced function source braces")
              return depths

          def validate(function_source: str) -> tuple[int, int]:
              # This authority checker intentionally supports only the ordinary Swift string forms
              # its small structural masker understands. Hash-delimited strings can legally contain
              # unescaped quote delimiters and would make a partial lexer unsafe. Multiline strings
              # can likewise contain escaped delimiter-shaped bytes. Neither form is needed by this
              # small production function, so fail closed instead of pretending to parse full Swift.
              if '"""' in function_source:
                  raise ContractViolation(
                      "final Share retry authority must not contain multiline Swift string delimiters"
                  )
              if unsupported_extended_string.search(function_source):
                  raise ContractViolation(
                      "final Share retry authority must not contain hash-delimited Swift string syntax"
                  )

              opening_brace = mask_noncode(function_source).find("{")
              if opening_brace < 0:
                  raise ContractViolation("missing function body")

              match = retained_tuple.search(function_source)
              if match is None:
                  raise ContractViolation(
                      "final Share retry must require retained bytes + integrity report + filename before returning"
                  )

              mint_index = function_source.find(mint_call)
              if mint_index < 0:
                  raise ContractViolation("missing package-owned final Share creation call")
              if match.start() >= mint_index:
                  raise ContractViolation(
                      "retained retry authority must execute before any final Share artifact creation"
                  )

              depths = depth_table(function_source)
              if depths[match.start()] != 1:
                  raise ContractViolation(
                      "retained retry branch must be a direct function-body statement, not nested in conditional/closure scope"
                  )

              line_start = function_source.rfind("\n", 0, match.start()) + 1
              if function_source[line_start:match.start()].strip():
                  raise ContractViolation(
                      "retained retry branch must begin as a direct if statement on its source line"
                  )

              return_index = function_source.find("return", match.start(), match.end())
              if return_index < 0 or depths[return_index] != 2:
                  raise ContractViolation(
                      "retained retry return must exit directly from the retained-tuple if branch"
                  )

              if depths[match.end()] != 1:
                  raise ContractViolation("retained retry branch must close back into the function body")

              return match.start(), match.end()

          source = Path("NembraApp/Features/Research/ES80CaptureShellView.swift").read_text()
          try:
              function_source = authority_source(source)
              branch_start, branch_end = validate(function_source)
          except ContractViolation as error:
              raise SystemExit(str(error)) from error

          # Red-team the checker itself with the exact false-green class found in review. If the
          # retained branch can be wrapped in an unreachable scope and still pass, this gate is not
          # authority evidence.
          nested = (
              function_source[:branch_start]
              + "if false {\n"
              + function_source[branch_start:branch_end]
              + "\n}\n"
              + function_source[branch_end:]
          )
          try:
              validate(nested)
          except ContractViolation:
              pass
          else:
              raise SystemExit("checker self-test accepted an unreachable nested retained retry branch")

          closure_wrapped = (
              function_source[:branch_start]
              + "let retainedRetryProbe = {\n"
              + function_source[branch_start:branch_end]
              + "\n}\n_ = retainedRetryProbe\n"
              + function_source[branch_end:]
          )
          try:
              validate(closure_wrapped)
          except ContractViolation:
              pass
          else:
              raise SystemExit("checker self-test accepted a closure-nested retained retry branch")

          # Swift hash-delimited multiline strings may legally contain bare triple-quote sequences.
          # The historical masker would exit the string on the first such sequence, treat the fake
          # branch below as code at depth 1, then re-enter on the second sequence and finish balanced
          # at the real hash-delimited closer. Remove the real branch so this fixture proves that only
          # string content cannot satisfy retry authority.
          without_real_branch = function_source[:branch_start] + function_source[branch_end:]
          insert_at = without_real_branch.find("\n", without_real_branch.find("{")) + 1
          raw_multiline_bypass = (
              without_real_branch[:insert_at]
              + '        let retainedRetryRawProbe = #"""\n'
              + 'first legal bare quotes inside raw content: """\n'
              + "        if finalShareData != nil,\n"
              + "           finalShareIntegrityReport != nil,\n"
              + "           finalShareFilename != nil {\n"
              + "            sharePreparationWarning = nil\n"
              + "            return\n"
              + "        }\n"
              + 'second legal bare quotes inside raw content: """\n'
              + '        """#\n'
              + "        _ = retainedRetryRawProbe\n"
              + without_real_branch[insert_at:]
          )
          try:
              validate(raw_multiline_bypass)
          except ContractViolation as error:
              if "multiline Swift string delimiters" not in str(error):
                  raise SystemExit(
                      "raw multiline self-test failed for an unrelated reason instead of the lexical fail-closed guard"
                  ) from error
          else:
              raise SystemExit(
                  "checker self-test accepted retained retry authority supplied only by raw multiline string content"
              )

          print("retained final Share retry control-flow source contract: PASS")
          PY