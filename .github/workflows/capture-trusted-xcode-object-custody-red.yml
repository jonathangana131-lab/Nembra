name: Capture Trusted Xcode Producer Object Custody Expected Red

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/capture-xcode27-trusted-command.yml
      - scripts/ci/tests/test_capture_trusted_xcode_git_object_custody_red.py
      - .github/workflows/capture-trusted-xcode-object-custody-red.yml

permissions:
  contents: read

jobs:
  expected-red:
    name: Prove pinned producer object bytes require re-authentication
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(/usr/bin/git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Compile object-custody regression
        run: python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_git_object_custody_red.py

      - name: Run object-custody regression
        run: python3 scripts/ci/tests/test_capture_trusted_xcode_git_object_custody_red.py -v
