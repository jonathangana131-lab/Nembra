name: Agent ES80 compose current provenance

on:
  push:
    branches:
      - integration/es80-v14-capture-flagship-provenance/chatgpt56

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-capture-flagship-provenance/chatgpt56
          fetch-depth: 0
      - name: Fetch exact current provenance successor
        shell: bash
        run: git fetch origin feature/es80-v14-external-build-record-v3-current-gpt56
      - name: Overlay exact comparator plus schema-v3 record parser
        shell: bash
        run: |
          git checkout 3a75d786ebb2811692690cbbb5db75f51b0733bd -- \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneSoftwareExportBuildReference.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneSoftwareExportBuildReferenceTests.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothCaptureExternalBuildRecord.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothCaptureExternalBuildRecordTests.swift
      - name: Verify exact-build rendezvous composition
        shell: bash
        run: |
          set -euo pipefail
          buildRef=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneSoftwareExportBuildReference.swift
          record=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothCaptureExternalBuildRecord.swift
          grep -F 'struct PassiveBluetoothExperimentOneSoftwareExportBuildReference' "$buildRef"
          grep -F 'decodeAndVerify' "$buildRef"
          grep -F 'struct PassiveBluetoothCaptureExternalBuildRecord' "$record"
          grep -F 'makeSoftwareExportBuildReference' "$record"
          grep -F 'schemaVersion' "$record"
          grep -F 'infoPlistSHA256' "$record"
          grep -F 'exactRecordSHA256' "$record"
          ! grep -F 'physicalGO' "$record"
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneSoftwareExportBuildReferenceTests.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothCaptureExternalBuildRecordTests.swift
          git diff --check
      - name: Remove temporary workflow and checkpoint provenance composition
        shell: bash
        run: |
          rm .github/workflows/agent-es80-compose-current-provenance.yml
          git config user.name 'nembra-go-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneSoftwareExportBuildReference.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothExperimentOneSoftwareExportBuildReferenceTests.swift \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothCaptureExternalBuildRecord.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveBluetoothCaptureExternalBuildRecordTests.swift \
            .github/workflows/agent-es80-compose-current-provenance.yml
          git commit -m 'feat(capture): converge current external build provenance on flagship'
          git push origin HEAD:integration/es80-v14-capture-flagship-provenance/chatgpt56