name: Validate Capture Visual Reanchor

on:
  push:
    branches:
      - qa/v14-capture-visual-current-194197ed-sol

permissions:
  contents: write

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact parent and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 194197ed62ccd4f7880e314ff70e5e0229cddc30 HEAD
          python3 -m py_compile scripts/ci/tests/test_capture_standalone_visual_evidence.py
          python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          git diff --check 194197ed62ccd4f7880e314ff70e5e0229cddc30...HEAD
          changed="$(git diff --name-only 194197ed62ccd4f7880e314ff70e5e0229cddc30...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-standalone-visual-evidence.yml' '.github/workflows/validate-capture-visual-reanchor.yml' 'scripts/ci/capture_standalone_visual_evidence.sh' 'scripts/ci/tests/test_capture_standalone_visual_evidence.py' | sort)"
          test "$changed" = "$expected"
      - name: Publish clean QA checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-capture-visual-reanchor.yml
          git diff --check
          git config user.name 'Nembra V14 Visual QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'qa(capture): validate current visual evidence contract'
          git push origin HEAD:qa/v14-capture-visual-current-194197ed-sol
