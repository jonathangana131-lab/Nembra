name: Materialize Capture Deterministic Key Custody 9695

on:
  push:
    branches:
      - recovery/v14-capture-deterministic-key-custody-9695-sol
    paths:
      - .nembra/materialize-capture-deterministic-key-custody-9695.trigger

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-deterministic-key-custody-9695-sol
          fetch-depth: 0

      - name: Guard exact product ancestry and Entrypoint blob
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9695af19c21c93b3eb4bc867613a6df0c9a3b3d4 HEAD
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "92a80b1c5c003b8d3847df93db98f6f7970b62b4"

      - name: Materialize deterministic application-key custody
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_capture_deterministic_key_custody_9695.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationDeterministicKeyCustodySourceTests.swift
          git diff --check

      - name: Remove scaffolding and verify exact effective scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/materialize_capture_deterministic_key_custody_9695.py
          rm -f .github/workflows/materialize-capture-deterministic-key-custody-9695.yml
          rm -f .nembra/materialize-capture-deterministic-key-custody-9695.trigger
          git diff --check
          mapfile -t paths < <(git diff --name-only 9695af19c21c93b3eb4bc867613a6df0c9a3b3d4 -- | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = "NembraApp/App/NembraCaptureEntrypoint.swift"
          test "${paths[1]}" = "Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationDeterministicKeyCustodySourceTests.swift"

      - name: Publish clean recovery checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(capture): canonicalize application key custody order"
          git push origin HEAD:recovery/v14-capture-deterministic-key-custody-9695-sol
