name: ES80 Horizon duration policy exact-product QA

on:
  push:
    branches:
      - cell/es80-duration-policy-single-source/ci/chat-g5v6-1

permissions:
  contents: read

jobs:
  duration-policy-qa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Verify exact product parent and workflow-only mirror
        env:
          EXPECTED_PRODUCT_SHA: da26dea2ed0f64ad0c98a835b0ce46f0ab07cebf
          EXPECTED_BASE_SHA: 704da146b69fcb41f6ffe489e982a06995daba9e
          EXPECTED_WORKFLOW_PATH: .github/workflows/qa-es80-duration-policy-single-source-chat-g5v6-1.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$EXPECTED_WORKFLOW_PATH"
          actual="$(git diff --name-only "$EXPECTED_BASE_SHA" "$EXPECTED_PRODUCT_SHA" | sort)"
          expected="$(printf '%s\n' \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationHorizonMinimumDurationGate.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationHorizonMinimumDurationGateTests.swift | sort)"
          test "$actual" = "$expected"
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Verify one Experiment One duration authority and passive surface
        run: |
          set -euo pipefail
          gate=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationHorizonMinimumDurationGate.swift
          policy=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneCaptureEvidenceAssessment.swift
          grep -q 'PassiveBluetoothExperimentOneCapturePolicy.minimumPostReadyObservationDurationNanoseconds' "$gate"
          test "$(grep -c '60_000_000_000' "$gate")" -eq 0
          test "$(grep -c 'minimumPostReadyObservationDurationNanoseconds: UInt64 = 60_000_000_000' "$policy")" -eq 1
          if grep -R --include='*.swift' -nE '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            exit 1
          fi
      - name: Run NembraCore tests
        run: swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors
      - name: Run full capture package tests
        run: swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors
      - name: Build capture package for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          xcodebuild -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
