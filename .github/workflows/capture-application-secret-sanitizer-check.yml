name: Validate Capture Application Secret Sanitizer

on:
  push:
    branches:
      - sol/v14-capture-application-secret-sanitizer-523
    paths:
      - .github/workflows/capture-application-secret-sanitizer-check.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-application-secret-sanitizer-523
          fetch-depth: 0

      - name: Guard additive package scope
        shell: bash
        run: |
          set -euo pipefail
          parent='52333deb09ea9a5964250097f83884d285f25d78'
          git merge-base --is-ancestor "$parent" HEAD
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-application-secret-sanitizer-check.yml' 'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift' | sort)"
          test "$actual" = "$expected"
          git diff --check "$parent"...HEAD

      - name: Compile and execute focused Swift harness
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/main.swift <<'SWIFT'
          import Foundation

          let sentinel = "SECRET-SENTINEL"
          let input: [AnyHashable: Any] = [
              "local_key": sentinel,
              "speed": 17,
              "payload": [
                  "ordinary": "kept",
                  "items": [
                      ["access-token": sentinel],
                      ["plain": "still-kept"],
                  ],
              ] as [String: Any],
          ]
          let output = TuyaApplicationUpdateSecretSanitizer.sanitize(input)
          precondition(output["local_key"] == "<redacted>")
          precondition(output["speed"] == "17")
          let payload = output["payload"] ?? ""
          precondition(payload.contains("<redacted>"))
          precondition(!payload.contains(sentinel))
          precondition(payload.contains("kept"))
          precondition(payload.contains("still-kept"))
          print("focused recursive secret sanitizer: PASS")
          SWIFT
          swiftc -warnings-as-errors \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaApplicationUpdateSecretSanitizer.swift \
            /tmp/main.swift \
            -o /tmp/capture-secret-sanitizer
          /tmp/capture-secret-sanitizer
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretSanitizerTests.swift

      - name: Publish clean package checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-application-secret-sanitizer-check.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(capture): retain validated sanitizer package slice"
          git push origin HEAD:sol/v14-capture-application-secret-sanitizer-523
