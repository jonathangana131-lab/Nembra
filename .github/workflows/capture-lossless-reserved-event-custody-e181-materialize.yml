name: Materialize Capture Lossless Reserved Event Custody e181

on:
  push:
    branches:
      - agent/v14-capture-lossless-reserved-event-custody-e181-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-lossless-reserved-event-custody-e181-sol
          fetch-depth: 0
      - name: Guard exact e181 product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='e18181d7cc06bb43d569eff07dbc5f3e2c3428ae'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Apply lossless reserved-field custody
        run: python3 scripts/ci/materialize_capture_lossless_reserved_event_custody_e181.py apply
      - name: Verify current source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_lossless_reserved_event_custody_e181.py verify
          python3 -m py_compile scripts/ci/materialize_capture_lossless_reserved_event_custody_e181.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyAdmissionRaceSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git diff --check
      - name: Preserve current product guards
        run: |
          grep -q 'redactedApplicationDescription' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -q 'liveTransportDriver.isLocallyConnected' NembraApp/App/NembraCaptureEntrypoint.swift
      - name: Publish clean six-path product delta
        shell: bash
        run: |
          set -euo pipefail
          parent='e18181d7cc06bb43d569eff07dbc5f3e2c3428ae'
          rm .github/workflows/capture-lossless-reserved-event-custody-e181-materialize.yml
          rm scripts/ci/materialize_capture_lossless_reserved_event_custody_e181.py
          git add -A
          changed="$(git diff --cached "$parent" --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyAdmissionRaceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$parent" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): preserve reserved SDK fields on transport-fresh product'
          git push origin HEAD:agent/v14-capture-lossless-reserved-event-custody-e181-sol
