name: Capture R3 Exact Parent Pin Materializer
on:
  push:
    branches: [repair/v14-r3-base-module-execution-sol-20260811]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-r3-base-module-execution-sol-20260811
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = Path('scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py')
          text = source.read_text(encoding='utf-8')
          anchor = 'BASE_MODULE_PATH = "scripts/ci/es80_authenticated_stationary_final_go.py"\n'
          replacement = anchor + 'PARENT_BASE_MODULE_GIT_BLOB = "b0664c734004c2265b05d23ec58756806ff62f2c"\n'
          if text.count(anchor) != 1 or 'PARENT_BASE_MODULE_GIT_BLOB' in text:
              raise SystemExit('R3 parent-blob constant anchor drifted')
          text = text.replace(anchor, replacement, 1)
          anchor = '    if not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", accepted_blob):\n        raise GeneratedSubjectGoError("authenticated-stationary Final-GO parent Git blob is invalid")\n'
          replacement = anchor + '    if accepted_blob != PARENT_BASE_MODULE_GIT_BLOB:\n        raise GeneratedSubjectGoError("authenticated-stationary Final-GO parent Git blob does not match exact accepted parent authority")\n'
          if text.count(anchor) != 1:
              raise SystemExit('R3 accepted-blob validation anchor drifted')
          source.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          test = Path('scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py')
          text = test.read_text(encoding='utf-8')
          anchor = 'BASE_RELATIVE = "scripts/ci/es80_authenticated_stationary_final_go.py"\n'
          if text.count(anchor) != 1:
              raise SystemExit('base test source anchor drifted')
          text = text.replace(anchor, anchor + 'BASE_SOURCE = REPOSITORY / BASE_RELATIVE\n', 1)
          old = base64.b64decode('ICAgICAgICAgICAgcjMucGFyZW50Lm1rZGlyKHBhcmVudHM9VHJ1ZSxleGlzdF9vaz1UcnVlKTsgcjMud3JpdGVfYnl0ZXMoUjNfU09VUkNFLnJlYWRfYnl0ZXMoKSk7IGJhc2Uud3JpdGVfdGV4dCgiIyEvdXNyL2Jpbi9lbnYgcHl0aG9uM1xuQkFTRV9NQVJLRVIgPSAnYWNjZXB0ZWQnXG4iLGVuY29kaW5nPSJ1dGYtOCIpCg==').decode()
          new = base64.b64decode('ICAgICAgICAgICAgcjMucGFyZW50Lm1rZGlyKHBhcmVudHM9VHJ1ZSxleGlzdF9vaz1UcnVlKTsgcjMud3JpdGVfYnl0ZXMoUjNfU09VUkNFLnJlYWRfYnl0ZXMoKSk7IGJhc2Uud3JpdGVfYnl0ZXMoQkFTRV9TT1VSQ0UucmVhZF9ieXRlcygpKQo=').decode()
          if text.count(old) != 1:
              raise SystemExit('base fixture anchor drifted')
          text = text.replace(old, new, 1)
          old = base64.b64decode('ICAgICAgICAgICAgc2VsZi5hc3NlcnRFcXVhbChnZXRhdHRyKGxvYWRlZCwiQkFTRV9NQVJLRVIiLE5vbmUpLCJhY2NlcHRlZCIpCg==').decode()
          new = base64.b64decode('ICAgICAgICAgICAgc2VsZi5hc3NlcnRFcXVhbChnZXRhdHRyKG1vZHVsZSwiUEFSRU5UX0JBU0VfTU9EVUxFX0dJVF9CTE9CIixOb25lKSxhY2NlcHRlZF9ibG9iKQogICAgICAgICAgICBzZWxmLmFzc2VydFRydWUoaGFzYXR0cihsb2FkZWQsIkdvRXJyb3IiKSkK').decode()
          if text.count(old) != 1:
              raise SystemExit('base loaded assertion anchor drifted')
          text = text.replace(old, new, 1)
          insert = base64.b64decode('').decode()
          marker = 'if __name__=="__main__":unittest.main(verbosity=2)\n'
          if text.count(marker) != 1:
              raise SystemExit('base test main marker drifted')
          test.write_text(text.replace(marker, insert + marker, 1), encoding='utf-8')
          PY
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py
          python3 scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py scripts/ci/tests/test_es80_generated_subject_base_module_execution_custody.py
          git commit -m 'Capture: pin R3 loader to exact parent blob'
          git push origin HEAD:repair/v14-r3-base-module-execution-sol-20260811
