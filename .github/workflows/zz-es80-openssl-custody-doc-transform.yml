name: Temporary ES80 OpenSSL custody doc alignment

on:
  push:
    branches:
      - docs/es80-v14-openssl-root-custody-gpt56-go

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align offline signing guide with root custody
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/ES80_FIELD_AUTHORIZATION_OFFLINE_SIGNING.md")
          text = path.read_text()

          old = """The temporary snapshot is operation-scoped and is destroyed with its temporary directory. Python never loads the private-key bytes into a Python `bytes` value.\n\n## One semantic parser\n"""
          new = """The temporary snapshot is operation-scoped and is destroyed with its temporary directory. Python never loads the private-key bytes into a Python `bytes` value.\n\n## OpenSSL executable custody\n\nThe signer never discovers OpenSSL from ambient `PATH`. It uses `/usr/bin/openssl` by default, or one explicit absolute `NEMBRA_OPENSSL` override supplied by the release-authority environment. The selected path must resolve outside the repository to one regular, executable, non-symlink file.\n\nBecause OpenSSL receives the inherited private-key descriptor, executable custody is part of the authority boundary. Before that descriptor is handed to any subprocess, the signer requires:\n\n- the OpenSSL executable itself to be owned by root;\n- the executable to have no group/other write bits;\n- every canonical ancestor directory up to the filesystem root to be a real directory owned by root;\n- every canonical ancestor directory to have no group/other write bits.\n\nA signing-user-owned executable is deliberately rejected even if its mode is `0755`: that same user could otherwise unlink or replace the checked program between validation and execution. The external P-256 private key remains separately required to be owned by the signing user and owner-private. Platforms that cannot expose the POSIX ownership needed to enforce this executable-custody contract fail closed.\n\nDo not point `NEMBRA_OPENSSL` at a user-managed toolchain, Homebrew cellar under a user-writable prefix, repository helper, shell wrapper, or other path the signing identity can replace. An override is acceptable only when its actual live executable and complete canonical parent chain satisfy the same root-custody checks.\n\n## One semantic parser\n"""
          if text.count(old) != 1:
              raise SystemExit("private-key snapshot insertion anchor drifted")
          text = text.replace(old, new, 1)

          old_tool = """- requires OpenSSL;\n- requires a P-256 / `prime256v1` private key;\n"""
          new_tool = """- uses `/usr/bin/openssl` by default and never searches ambient `PATH`;\n- accepts only an absolute explicit `NEMBRA_OPENSSL` override that passes the same custody checks;\n- requires the selected OpenSSL executable and every canonical parent directory to be root-owned and not group/world-writable;\n- requires a P-256 / `prime256v1` private key;\n"""
          if text.count(old_tool) != 1:
              raise SystemExit("OpenSSL tool-list anchor drifted")
          text = text.replace(old_tool, new_tool, 1)

          old_self = """The trusted exact-head Xcode 27 workflow compiles this signer and executes the self-test. A passing self-test is still software acceptance evidence only; it does not create or accept a production authority.\n"""
          new_self = """The trusted exact-head Xcode 27 workflow compiles the signer, executes the dedicated signer-custody source regression, and then executes the signer self-test. The source regression pins the no-ambient-PATH and root-owned executable/canonical-ancestor contract. A passing source regression or self-test is still software acceptance evidence only; neither creates or accepts a production authority.\n"""
          if text.count(old_self) != 1:
              raise SystemExit("exact-head signer-gate paragraph drifted")
          text = text.replace(old_self, new_self, 1)

          path.write_text(text)
          PY

      - name: Validate documentation against signer source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          doc = Path("docs/ES80_FIELD_AUTHORIZATION_OFFLINE_SIGNING.md").read_text()
          signer = Path("scripts/ci/es80_field_authorization_envelope.py").read_text()
          source_test = Path("scripts/ci/tests/test_es80_field_authorization_signer_custody_source.py").read_text()

          required_doc = [
              "## OpenSSL executable custody",
              "/usr/bin/openssl",
              "`NEMBRA_OPENSSL`",
              "owned by root",
              "signing-user-owned executable",
              "complete canonical parent chain",
              "signer-custody source regression",
          ]
          for phrase in required_doc:
              if phrase not in doc:
                  raise SystemExit(f"documented custody fact missing: {phrase}")

          required_source = [
              'DEFAULT_OPENSSL_PATH = "/usr/bin/openssl"',
              'os.environ.get("NEMBRA_OPENSSL", DEFAULT_OPENSSL_PATH)',
              "executable_stat.st_uid != 0",
              "directory_stat.st_uid != 0",
              "executable_stat.st_mode & 0o022",
              "directory_stat.st_mode & 0o022",
          ]
          for phrase in required_source:
              if phrase not in signer:
                  raise SystemExit(f"signer no longer supports documented custody fact: {phrase}")
          if "executable_stat.st_uid not in {0, signing_uid}" in signer:
              raise SystemExit("signer regressed to signing-user-owned OpenSSL acceptance")
          if "test_explicit_openssl_is_canonical_and_root_custodied" not in source_test:
              raise SystemExit("permanent root-custody source regression missing")
          PY
          git diff --check

      - name: Publish clean documentation checkpoint
        run: |
          rm .github/workflows/zz-es80-openssl-custody-doc-transform.yml
          git config user.name "Nembra V14 authority docs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(capture): document root-custodied OpenSSL"
          git push origin "HEAD:${GITHUB_REF_NAME}"
