name: Materialize Capture Application Secret Value Custody c38

on:
  push:
    branches:
      - fix/v14-capture-application-secret-value-custody-c38-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-application-secret-value-custody-c38-sol
          fetch-depth: 0

      - name: Guard exact lineage and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          base='c38cb8f4c66ec1e1e8f6cdbe7fb77955daf18b5e'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"...HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/scripts/materialize_capture_application_secret_value_custody_c38.py' \
            '.github/workflows/materialize-capture-application-secret-value-custody-c38.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Apply and verify exact-value custody
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize_capture_application_secret_value_custody_c38.py apply
          python3 .github/scripts/materialize_capture_application_secret_value_custody_c38.py verify
          python3 -m py_compile .github/scripts/materialize_capture_application_secret_value_custody_c38.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationSecretValueCustodySourceTests.swift
          git diff --check

      - name: Publish clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-application-secret-value-custody-c38.yml
          rm .github/scripts/materialize_capture_application_secret_value_custody_c38.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): bind private secrets to application event custody'
          git push origin HEAD:fix/v14-capture-application-secret-value-custody-c38-sol
