name: Capture Field Untracked Prearm Injection Red Team

on:
  pull_request:
    paths:
      - Scripts/capture_tuya_private_input_build_guard.py
      - scripts/field/install_one_time_capture.command
      - scripts/ci/tests/test_capture_field_untracked_prearm_injection_red_team.py
      - .github/workflows/capture-field-untracked-prearm-injection-red-team.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  untracked-prearm-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact diagnostic checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Require pre-arm untracked source rejection
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_untracked_prearm_injection_red_team.py
          /usr/bin/python3 scripts/ci/tests/test_capture_field_untracked_prearm_injection_red_team.py
          git diff --check
