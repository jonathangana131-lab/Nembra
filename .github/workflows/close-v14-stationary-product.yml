name: Close V14 stationary Capture product

on:
  push:
    branches: [integration/v14-capture-stationary-product-closure-sol]
    paths:
      - '.github/workflows/close-v14-stationary-product.yml'

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact convergence inputs
        run: |
          set -euo pipefail
          test "$(git hash-object NembraApp/App/NembraCaptureEntrypoint.swift)" = "be6f3271b83a7f23172b4d7eb0bfb675d2f98545"
          test "$(git hash-object Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift)" = "0950b34fbc56fdfd8ea2f723cedea21ede42c38c"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaExplicitCorrelatedTargetConfirmationSourceTests.swift)" = "50b374f32a42577387cd3add8ac2a16e6c786eda"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFreshTargetAndAcquisitionTerminalSourceTests.swift)" = "cc2963a2b7a784d7180d7638890f37c6e218f292"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaTransportSuccessAuthoritySourceTests.swift)" = "b0683c4942b8201dfd0ae2a857f1a1e2fe4b9d35"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldFinalAuthoritySourceTests.swift)" = "446fd0423b73f99e94c695701eba5e52bdbbdc5a"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldBuildPresentationAuthoritySourceTests.swift)" = "25802f079db374ec22d17bacaaf098413f6174bc"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCorrelatedTargetExportProvenanceSourceTests.swift)" = "1f331126d2d1bc2cf488c49fdf4e3d5515a117f5"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSessionTerminalRetirementSourceTests.swift)" = "9ba411557e8ee044dd73290f56a272f52bdad4a3"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticationFailureSourceRaceTests.swift)" = "af80404f40c3492de09566f3f994577ac402fdb4"
          test "$(git hash-object Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldGoPrerequisiteSourceTests.swift)" = "5841aa324871ae4eae3e14807696b8d1afb5b6aa"
          python3 -m py_compile .ci-patches/close-v14-stationary-product.py

      - name: Apply deterministic product closure
        run: |
          set -u
          set +e
          python3 .ci-patches/close-v14-stationary-product.py > .ci-patches/last-close-error.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci-patches/last-close-error.txt
            git commit -m "ci: persist stationary closure patch failure"
            git push origin HEAD:integration/v14-capture-stationary-product-closure-sol
            exit "$status"
          fi
          rm -f .ci-patches/last-close-error.txt
          git diff --check
          ! grep -Fq 'var likely: Bool { knownID }' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'accepted-prior-physical-corebluetooth-uuid' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'try? await sessionLedger.markAuthenticationFailed(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'try? await sessionLedger.markSourceAuthorityInvalidated(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'try? await sessionLedger.markObservationContinuityInvalidated(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq 'try? await sessionLedger.endConnection(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq '@Published private(set) var correlationProgress' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'func confirmCorrelatedTarget()' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'targetCorrelationOperatorConfirmed = true' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'markInternalLifecycleFailure(for: token)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'public func markInternalLifecycleFailure' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift

      - name: Commit product and retire patch machinery
        run: |
          set -euo pipefail
          rm .ci-patches/close-v14-stationary-product.py
          rm .github/workflows/close-v14-stationary-product.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): close stationary target and lifecycle product"
          git push origin HEAD:integration/v14-capture-stationary-product-closure-sol
