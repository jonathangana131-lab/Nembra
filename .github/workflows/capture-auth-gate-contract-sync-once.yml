name: Capture Auth Gate Contract Sync Once

on:
  push:
    branches:
      - capture/v14-auth-gate-contract-sync-gpt56sol-20260824
    paths:
      - '.github/workflows/capture-auth-gate-contract-sync-once.yml'

permissions:
  contents: write

concurrency:
  group: capture-auth-gate-contract-sync-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout exact writer subject
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize stricter physical-gate truth contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          physical_path = Path('docs/ES80_PHYSICAL_TRUTH_C7D09A22.md')
          stationary_path = Path('docs/ES80_AUTHENTICATED_STATIONARY_GATE_V14.md')
          tests_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyPreflightTests.swift')

          physical = physical_path.read_text()
          old_physical = '''The authenticated gate is accepted only when **both** conditions are demonstrated in the same real physical session:

          - at least one real, non-empty application notification payload is received from the selected scooter; and
          - the authenticated connection remains alive **beyond 30.0 seconds** (the observed unauthenticated rejection window).

          A longer observation window is encouraged, but the acceptance boundary is strictly `>30.0 s` plus real notify payload evidence. A connection that lasts longer without payloads, or payload-shaped simulator/test data without a surviving physical connection, does not close the gate.'''
          new_physical = '''The authenticated gate is accepted only when **all** of the canonical runtime conditions are demonstrated in the same real physical session and current authenticated generation:

          - at least **two** genuine, non-empty application notification payloads are admitted from the selected scooter so one bootstrap/state-replay callback cannot mint readiness;
          - the latest accepted application payload occurs at least **30 seconds after authentication**, proving that the application/notify path itself survived beyond the historical rejection region; and
          - the session proves at least **45 seconds** of authenticated continuity after authentication.

          These are minimum acceptance conditions, not an encouraged observation target. A connection that merely lasts beyond 30 seconds, a single early payload, 45 seconds without repeated accepted application evidence, or payload-shaped simulator/test data does not close the gate. The package-owned `TuyaAuthenticatedReadOnlyPreflight` remains authoritative if prose and implementation ever diverge.'''
          if physical.count(old_physical) != 1:
              raise SystemExit('C7D09A22 weak acceptance block drifted; refusing to patch')
          physical = physical.replace(old_physical, new_physical, 1)
          physical_path.write_text(physical)

          stationary = stationary_path.read_text()
          purpose_anchor = '''This document is a coordination/acceptance checkpoint only. It cannot authorize Bluetooth activity by itself. Only the final composed exact app build, with all required software/private-device gates accepted, may flip this gate to `GO`.'''
          floor = '''

          ### Canonical runtime readiness floor

          The package-owned `TuyaAuthenticatedReadOnlyPreflight` is the minimum software readiness gate. The same current SmartLife-authenticated generation must prove all of the following before stationary mapping can unlock:

          - at least **two** genuine, non-empty application notification payloads;
          - the latest accepted application payload occurs at least **30 seconds after authentication**; and
          - at least **45 seconds** of authenticated continuity after authentication.

          No document, UI timer, transport callback, or field procedure may authorize the next mapping rung on a weaker condition. If this prose and the package-owned preflight ever diverge, remain NO-GO and reconcile them before physical use.'''
          if stationary.count(purpose_anchor) != 1:
              raise SystemExit('stationary-gate purpose anchor drifted; refusing to patch')
          if '### Canonical runtime readiness floor' not in stationary:
              stationary = stationary.replace(purpose_anchor, purpose_anchor + floor, 1)

          old_step = '6. Keep the accepted authenticated session alive past the old approximately-30-second rejection region; the target gate is at least **45 seconds** of accepted authenticated continuity.'
          new_step = '6. Keep the accepted authenticated session alive for at least **45 seconds** after authentication, and require the latest accepted application payload to occur at least **30 seconds after authentication**; mere transport survival past the old rejection region is insufficient.'
          if stationary.count(old_step) != 1:
              raise SystemExit('stationary-gate observation step drifted; refusing to patch')
          stationary = stationary.replace(old_step, new_step, 1)

          old_pass = '''- at least **one genuine non-empty application notification payload** is admitted from the accepted physical FD50 device-to-app notification source; byte-exact evidence is preserved where the final GO contract requires it;
          - the authenticated connection remained continuously accepted beyond the old rejection window, with a target of at least **45 seconds**;'''
          new_pass = '''- at least **two** genuine, non-empty application notification payloads are admitted for the same current authenticated generation; byte-exact evidence is preserved where the final GO contract requires it;
          - the latest accepted application payload occurs at least **30 seconds after authentication**;
          - the authenticated connection remains continuously accepted for at least **45 seconds** after authentication;'''
          if stationary.count(old_pass) != 1:
              raise SystemExit('stationary-gate PASS block drifted; refusing to patch')
          stationary = stationary.replace(old_pass, new_pass, 1)
          stationary_path.write_text(stationary)

          tests = tests_path.read_text()
          if tests.startswith('import Testing\n'):
              tests = tests.replace('import Testing\n', 'import Foundation\nimport Testing\n', 1)
          elif not tests.startswith('import Foundation\nimport Testing\n'):
              raise SystemExit('preflight test imports drifted; refusing to patch')

          marker = '@Test("physical gate docs cannot weaken canonical runtime thresholds")'
          if marker not in tests:
              addition = r'''

              @Test("physical gate docs cannot weaken canonical runtime thresholds")
              func physicalGateDocsMatchRuntimeThresholds() throws {
                  #expect(TuyaAuthenticatedReadOnlyPreflight.minimumAuthenticatedApplicationPayloadCount == 2)
                  #expect(TuyaAuthenticatedReadOnlyPreflight.minimumPostAuthenticationPayloadSurvivalNanoseconds == 30_000_000_000)
                  #expect(TuyaAuthenticatedReadOnlyPreflight.minimumAuthenticatedConnectionNanoseconds == 45_000_000_000)

                  var repositoryRoot = URL(fileURLWithPath: #filePath)
                  for _ in 0..<5 {
                      repositoryRoot.deleteLastPathComponent()
                  }

                  let physicalTruth = try String(
                      contentsOf: repositoryRoot.appendingPathComponent("docs/ES80_PHYSICAL_TRUTH_C7D09A22.md"),
                      encoding: .utf8
                  )
                  let stationaryGate = try String(
                      contentsOf: repositoryRoot.appendingPathComponent("docs/ES80_AUTHENTICATED_STATIONARY_GATE_V14.md"),
                      encoding: .utf8
                  )

                  for document in [physicalTruth, stationaryGate] {
                      #expect(document.contains("at least **two** genuine, non-empty application notification payloads"))
                      #expect(document.contains("at least **30 seconds after authentication**"))
                      #expect(document.contains("at least **45 seconds** of authenticated continuity"))
                  }

                  #expect(!physicalTruth.contains("acceptance boundary is strictly `>30.0 s` plus real notify payload evidence"))
                  #expect(!stationaryGate.contains("at least **one genuine non-empty application notification payload**"))
              }
          '''
              closing = '\n}\n'
              index = tests.rfind(closing)
              if index < 0:
                  raise SystemExit('preflight test suite closing brace not found')
              tests = tests[:index] + addition + tests[index:]
          tests_path.write_text(tests)
          PY

      - name: Run focused canonical preflight contract
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          swift test --filter TuyaAuthenticatedReadOnlyPreflightTests

      - name: Retire writer and publish exact tested patch
        env:
          BRANCH: capture/v14-auth-gate-contract-sync-gpt56sol-20260824
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"
          rm .github/workflows/capture-auth-gate-contract-sync-once.yml
          git add docs/ES80_PHYSICAL_TRUTH_C7D09A22.md \
                  docs/ES80_AUTHENTICATED_STATIONARY_GATE_V14.md \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyPreflightTests.swift \
                  .github/workflows/capture-auth-gate-contract-sync-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture: align physical gate docs with canonical preflight'
          git push origin "HEAD:refs/heads/${BRANCH}"
