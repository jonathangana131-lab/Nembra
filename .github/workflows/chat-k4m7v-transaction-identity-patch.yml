name: chat-k4m7v queue transaction identity patch

on:
  push:
    branches:
      - 'parallel/es80-preh-observation-abort/chat-k4m7v'
    paths:
      - '.github/workflows/chat-k4m7v-transaction-identity-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/es80-preh-observation-abort/chat-k4m7v
          fetch-depth: 0
      - name: Bind abort proofs to exact gate transaction identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          gate_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift')
          gate = gate_path.read_text()
          if not gate.startswith('import Foundation\n'):
              gate = 'import Foundation\n\n' + gate

          gate = replace_once(
              gate,
              '''    struct Transaction: Equatable, Sendable {\n        let boundaryKind: BoundaryKind\n        let queueCutoff: UInt64\n        let authority: PassiveCoreBluetoothArtifactAuthorityContext\n        let revision: UInt64\n    }\n''',
              '''    struct Transaction: Equatable, Sendable {\n        let boundaryKind: BoundaryKind\n        let queueCutoff: UInt64\n        let authority: PassiveCoreBluetoothArtifactAuthorityContext\n        let revision: UInt64\n        /// Opaque process-local identity for this exact gate transaction. It is not\n        /// persisted evidence and carries no BLE/RF or scooter meaning. Its only\n        /// purpose is preventing a proof from another structurally identical gate\n        /// transaction from authorizing lifecycle mutation here.\n        let identity: UUID\n\n        init(\n            boundaryKind: BoundaryKind,\n            queueCutoff: UInt64,\n            authority: PassiveCoreBluetoothArtifactAuthorityContext,\n            revision: UInt64,\n            identity: UUID = UUID()\n        ) {\n            self.boundaryKind = boundaryKind\n            self.queueCutoff = queueCutoff\n            self.authority = authority\n            self.revision = revision\n            self.identity = identity\n        }\n    }\n''',
              'add transaction identity'
          )

          gate = replace_once(
              gate,
              '''              committedReadyTransaction.queueCutoff == committedReadyEpoch.queueCutoff,\n              committedReadyTransaction.revision == committedReadyEpoch.transactionRevision else {\n''',
              '''              committedReadyTransaction.queueCutoff == committedReadyEpoch.queueCutoff,\n              committedReadyTransaction.revision == committedReadyEpoch.transactionRevision,\n              committedReadyTransaction.identity == committedReadyEpoch.transactionIdentity else {\n''',
              'bind committed abort transaction identity'
          )

          gate = replace_once(
              gate,
              '''              current.authority == rejection.authority,\n              current.queueCutoff == rejection.queueCutoff,\n              current.revision == rejection.transactionRevision else {\n''',
              '''              current.authority == rejection.authority,\n              current.queueCutoff == rejection.queueCutoff,\n              current.revision == rejection.transactionRevision,\n              current.identity == rejection.transactionIdentity else {\n''',
              'bind uncommitted rejection transaction identity'
          )
          gate_path.write_text(gate)

          decision_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift')
          decision = decision_path.read_text()
          decision = replace_once(
              decision,
              '''        let transactionRevision: UInt64\n        let currentAuthority: PassiveCoreBluetoothArtifactAuthorityContext\n''',
              '''        let transactionRevision: UInt64\n        let transactionIdentity: UUID\n        let currentAuthority: PassiveCoreBluetoothArtifactAuthorityContext\n''',
              'add rejection transaction identity field'
          )
          decision = replace_once(
              decision,
              '''            transactionRevision = transaction.revision\n            self.currentAuthority = currentAuthority\n''',
              '''            transactionRevision = transaction.revision\n            transactionIdentity = transaction.identity\n            self.currentAuthority = currentAuthority\n''',
              'populate rejection transaction identity'
          )
          decision = replace_once(
              decision,
              '''        var observedAtDate: Date { readyDecision.observedAtDate }\n        var transactionRevision: UInt64 { readyTransaction.revision }\n''',
              '''        var observedAtDate: Date { readyDecision.observedAtDate }\n        var transactionRevision: UInt64 { readyTransaction.revision }\n        var transactionIdentity: UUID { readyTransaction.identity }\n''',
              'expose committed token transaction identity'
          )
          decision_path.write_text(decision)
          PY

          git rm .github/workflows/chat-k4m7v-transaction-identity-patch.yml
          git config user.name 'nembra-chat-k4m7v'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift \
                  Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift
          git commit -m 'fix: bind pre-H recovery to exact queue transaction identity'
          git push origin HEAD:parallel/es80-preh-observation-abort/chat-k4m7v
