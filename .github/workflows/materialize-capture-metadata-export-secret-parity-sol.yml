name: Materialize Capture Metadata Export Secret Parity

on:
  push:
    branches:
      - fix/v14-capture-metadata-export-secret-parity-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-metadata-export-secret-parity-sol
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize exact metadata classifier repair
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 870f20abe144fa7b6f9ac60bf4c0fe0a1792fb81 HEAD
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/Features/Research/TuyaAccountBridge.swift')
          source = path.read_text(encoding='utf-8')
          old = 'let secretKeyFragments = ["localkey", "accesstoken", "refreshtoken", "sessionkey", "seckey", "authkey"]'
          new = 'let secretKeyFragments = ["localkey", "sessionkey", "appkey", "appsecret", "password", "accounttoken", "accesstoken", "refreshtoken", "seckey", "authkey"]'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one narrow metadata classifier, found {source.count(old)}')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify fail-closed source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path('NembraApp/Features/Research/TuyaAccountBridge.swift').read_text(encoding='utf-8').lower()
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift').read_text(encoding='utf-8').lower()
          required = ['localkey','sessionkey','appkey','appsecret','password','accounttoken','accesstoken','refreshtoken','authkey','seckey']
          for token in required:
              if token not in bridge:
                  raise SystemExit(f'metadata bridge missing promised secret class: {token}')
              if f'body.contains("{token}")' not in test:
                  raise SystemExit(f'source regression missing promised secret class: {token}')
          if 'key.lowercased().filter { $0.isletter || $0.isnumber }' not in bridge:
              raise SystemExit('normalized-key classifier missing')
          if 'redactsecrets(value)' not in bridge or 'array.map(redactsecrets)' not in bridge:
              raise SystemExit('recursive sanitization missing')
          print('Capture metadata/export secret parity source contract: PASS')
          PY
          git diff --check

      - name: Collapse helper into product commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-capture-metadata-export-secret-parity-sol.yml
          git add NembraApp/Features/Research/TuyaAccountBridge.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataSecretRedactionSourceTests.swift
          git diff --cached --check
          git commit -m 'fix(capture): align metadata redaction with export promise'
          git push origin HEAD:fix/v14-capture-metadata-export-secret-parity-sol
