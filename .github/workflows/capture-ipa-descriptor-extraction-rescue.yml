name: Capture descriptor extraction rescue

on:
  push:
    branches:
      - fix/es80-v14-signed-ipa-descriptor-extraction/gpt56-thinking-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-v14-signed-ipa-descriptor-extraction/gpt56-thinking-go
          fetch-depth: 0

      - name: Execute reviewed transform from rejected workflow text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          source = Path('.github/workflows/capture-ipa-descriptor-extraction.yml').read_text(encoding='utf-8').splitlines()
          start = source.index('          from pathlib import Path')
          end = source.index('          PY', start)
          script_lines = []
          for line in source[start:end]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              else:
                  script_lines.append(line)
          patcher = Path('/tmp/nembra_descriptor_patch.py')
          patcher.write_text('\n'.join(script_lines) + '\n', encoding='utf-8')
          subprocess.run([sys.executable, '-m', 'py_compile', str(patcher)], check=True)
          subprocess.run([sys.executable, str(patcher)], check=True)
          PY
          test "$(stat -c '%a' scripts/ci/es80_signed_field_artifact_evidence.py)" = "755"
          test "$(stat -c '%a' scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py)" = "755"
          git diff --check

      - name: Commit product hardening and remove both harnesses
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-ipa-descriptor-extraction.yml
          rm .github/workflows/capture-ipa-descriptor-extraction-rescue.yml
          git config user.name "nembra-v14-transform"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ci/es80_signed_field_artifact_evidence.py scripts/ci/tests/test_es80_signed_field_artifact_exact_subject.py .github/workflows/capture-ipa-descriptor-extraction.yml .github/workflows/capture-ipa-descriptor-extraction-rescue.yml
          git diff --cached --check
          git commit -m "[Capture provenance v14] Extract exact IPA through one descriptor"
          git push origin HEAD:fix/es80-v14-signed-ipa-descriptor-extraction/gpt56-thinking-go
