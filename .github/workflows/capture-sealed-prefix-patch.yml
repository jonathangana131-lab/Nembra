name: Capture sealed prefix patch

on:
  push:
    branches:
      - integration/v14-capture-sealed-application-export-prefix-sol

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact source repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()

          replacements = [
              (
                  "    private var events: [Event] = []\n    private var watchdog: Task<Void, Never>?",
                  "    private var events: [Event] = []\n    private var sealedAcceptedEventPrefix: [Event]?\n    private var watchdog: Task<Void, Never>?",
              ),
              (
                  "                        try await sessionLedger.sealAcceptedObservation(for: token)\n                        self.currentConnectionToken = nil",
                  "                        try await sessionLedger.sealAcceptedObservation(for: token)\n                        self.sealedAcceptedEventPrefix = events\n                        self.currentConnectionToken = nil",
              ),
              (
                  "            events: events\n",
                  "            events: sealedAcceptedEventPrefix ?? (phase == .accepted ? [] : events)\n",
              ),
              (
                  "        exportData = nil\n        // Active authenticated generations must be terminally retired",
                  "        exportData = nil\n        sealedAcceptedEventPrefix = nil\n        // Active authenticated generations must be terminally retired",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement anchor, found {count}: {old!r}")
              source = source.replace(old, new, 1)

          required = [
              "private var sealedAcceptedEventPrefix: [Event]?",
              "self.sealedAcceptedEventPrefix = events",
              "events: sealedAcceptedEventPrefix ?? (phase == .accepted ? [] : events)",
              "sealedAcceptedEventPrefix = nil",
          ]
          for needle in required:
              if needle not in source:
                  raise SystemExit(f"missing repaired invariant: {needle}")

          path.write_text(source)
          PY

      - name: Self-retire patch workflow
        shell: bash
        run: git rm .github/workflows/capture-sealed-prefix-patch.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --cached --check
          git commit -m "fix(capture): freeze accepted application export prefix"
          git push origin HEAD:integration/v14-capture-sealed-application-export-prefix-sol
