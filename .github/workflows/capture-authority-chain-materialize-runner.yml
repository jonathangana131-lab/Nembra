name: Capture Authority Chain Materializer Runner

on:
  push:
    branches:
      - repair/v14-private-review-hmac-helper-execution-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-review-hmac-helper-execution-sol
          fetch-depth: 0
      - name: Execute reviewed authority-chain payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/capture-authority-chain-materialize.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          try:
              if workflow.count(start) != 1:
                  raise RuntimeError('materializer payload start is not unique')
              payload = workflow.split(start, 1)[1].split(end, 1)[0]
              prefix = "          "
              normalized = "\n".join(
                  line[len(prefix):] if line.startswith(prefix) else line
                  for line in payload.splitlines()
              )
              strict = '    if count != 1:\n        raise SystemExit(f"{label}: expected one match, found {count}")\n    return text.replace(old, new, 1)'
              compatible = '    if label == "bootstrap review helper output" and count == 2:\n        return text.replace(old, new, 1)\n    if count != 1:\n        raise SystemExit(f"{label}: expected one match, found {count}")\n    return text.replace(old, new, 1)'
              if normalized.count(strict) != 1:
                  raise RuntimeError('materializer replace_once definition changed unexpectedly')
              normalized = normalized.replace(strict, compatible, 1)
              replacement_sensitive = (
                  '    source = subprocess.check_output(\n'
                  '        ["/usr/bin/git", "show", f"{source_sha}:{relative_path}"],\n'
                  '        cwd=root,\n'
                  '        stderr=subprocess.DEVNULL,\n'
                  '    )'
              )
              replacement_blind = (
                  '    git_environment = {\n'
                  '        "GIT_NO_REPLACE_OBJECTS": "1",\n'
                  '        "GIT_CONFIG_NOSYSTEM": "1",\n'
                  '        "GIT_CONFIG_GLOBAL": "/dev/null",\n'
                  '        "LANG": "C",\n'
                  '        "LC_ALL": "C",\n'
                  '    }\n'
                  '    source = subprocess.check_output(\n'
                  '        ["/usr/bin/git", "show", f"{source_sha}:{relative_path}"],\n'
                  '        cwd=root,\n'
                  '        env=git_environment,\n'
                  '        stderr=subprocess.DEVNULL,\n'
                  '    )'
              )
              if normalized.count(replacement_sensitive) != 1:
                  raise RuntimeError('accepted-source Git execution authority changed unexpectedly')
              normalized = normalized.replace(replacement_sensitive, replacement_blind, 1)
              exec(compile(normalized, '<capture-authority-chain-materializer>', 'exec'), {})

              guard_path = Path('Scripts/capture_tuya_private_input_build_guard.py')
              guard = guard_path.read_text(encoding='utf-8')
              fixes = (
                  ('  raise BuildGuardError(f"accepted authority helper is not one regular single-link file: {filename}")', '            raise BuildGuardError(f"accepted authority helper is not one regular single-link file: {filename}")'),
                  ('  raise BuildGuardError(f"accepted authority helper size is outside the accepted bound: {filename}")', '            raise BuildGuardError(f"accepted authority helper size is outside the accepted bound: {filename}")'),
                  ('  chunk = os.read(descriptor, min(65_536, remaining))', '            chunk = os.read(descriptor, min(65_536, remaining))'),
                  ('  if not chunk:', '            if not chunk:'),
                  ('      raise BuildGuardError(f"accepted authority helper changed during descriptor read: {filename}")', '                raise BuildGuardError(f"accepted authority helper changed during descriptor read: {filename}")'),
                  ('  chunks.append(chunk)', '            chunks.append(chunk)'),
                  ('  remaining -= len(chunk)', '            remaining -= len(chunk)'),
                  ('  raise BuildGuardError(f"accepted authority helper changed during descriptor custody: {filename}")', '            raise BuildGuardError(f"accepted authority helper changed during descriptor custody: {filename}")'),
                  ('  # Compatibility only for isolated package/unit callers. The physical', '            # Compatibility only for isolated package/unit callers. The physical'),
                  ('  # field CLI requires accepted authority helpers before any access.', '            # field CLI requires accepted authority helpers before any access.'),
                  ('  self._module = _load_neighbor_module(self._filename, self._module_name)', '            self._module = _load_neighbor_module(self._filename, self._module_name)'),
              )
              for broken, corrected in fixes:
                  broken_count = guard.count(broken)
                  corrected_count = guard.count(corrected)
                  if broken_count == 1 and corrected_count == 0:
                      guard = guard.replace(broken, corrected, 1)
                  elif broken_count == 0 and corrected_count == 1:
                      continue
                  else:
                      raise RuntimeError(f'build-guard materialized indentation contract changed: {broken!r}')
              guard_path.write_text(guard, encoding='utf-8')
          except BaseException as error:
              message = f'{type(error).__name__}: {error}'.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error file=.github/workflows/capture-authority-chain-materialize-runner.yml::{message}')
              raise
          PY
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          bash -n scripts/field/install_one_time_capture.command
          python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_review_commitment.py
          python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_review_helper_execution_custody.py
          python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_git_replace_custody
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Scripts/bootstrap_capture_tuya_sdk.sh Scripts/capture_tuya_private_input_build_guard.py scripts/field/install_one_time_capture.command scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py scripts/ci/tests/test_capture_private_review_commitment.py scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py scripts/ci/tests/test_capture_private_review_helper_execution_custody.py Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldSDKDependencyProvenanceSourceTests.swift
          git diff --cached --quiet && { echo 'ERROR: materializer produced no production/test diff' >&2; exit 1; }
          git commit -m 'Capture: bind complete field authority helper chain'
          git push origin HEAD:repair/v14-private-review-hmac-helper-execution-sol
