name: Capture Authority Chain Materializer Runner

on:
  push:
    branches:
      - repair/v14-private-review-hmac-helper-execution-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-review-hmac-helper-execution-sol
          fetch-depth: 0
      - name: Execute reviewed authority-chain payload
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 - <<'PY'
          from pathlib import Path
          import traceback

          workflow = Path('.github/workflows/capture-authority-chain-materialize.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          try:
              if workflow.count(start) != 1:
                  raise RuntimeError('materializer payload start is not unique')
              payload = workflow.split(start, 1)[1].split(end, 1)[0]
              prefix = "          "
              normalized = "\n".join(
                  line[len(prefix):] if line.startswith(prefix) else line
                  for line in payload.splitlines()
              )
              exec(compile(normalized, '<capture-authority-materializer>', 'exec'), {})
          except Exception:
              Path('/tmp/capture-authority-materializer-error.txt').write_text(traceback.format_exc(), encoding='utf-8')
              raise
          PY
          then
            git reset --hard HEAD
            cp /tmp/capture-authority-materializer-error.txt .github/capture-authority-materializer-error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/capture-authority-materializer-error.txt
            git commit -m 'Capture: record authority materializer failure'
            git push origin HEAD:repair/v14-private-review-hmac-helper-execution-sol
            exit 1
          fi
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh
          bash -n scripts/field/install_one_time_capture.command
          python3 -m py_compile Scripts/capture_tuya_private_input_build_guard.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_review_commitment.py
          python3 -m py_compile scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py
          python3 -m py_compile scripts/ci/tests/test_capture_private_review_helper_execution_custody.py
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Scripts/bootstrap_capture_tuya_sdk.sh Scripts/capture_tuya_private_input_build_guard.py scripts/field/install_one_time_capture.command scripts/ci/tests/test_capture_private_review_downstream_helper_execution_custody.py scripts/ci/tests/test_capture_private_review_commitment.py scripts/ci/tests/test_capture_cocoapods_generated_build_subject.py scripts/ci/tests/test_capture_private_review_helper_execution_custody.py Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldSDKDependencyProvenanceSourceTests.swift
          git commit -m 'Capture: bind complete field authority helper chain'
          git push origin HEAD:repair/v14-private-review-hmac-helper-execution-sol
