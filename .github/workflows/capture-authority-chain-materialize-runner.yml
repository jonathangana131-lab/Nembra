name: TEMP Capture Authority Post-Repair

on:
  push:
    branches:
      - repair/v14-private-review-hmac-helper-execution-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-private-review-hmac-helper-execution-sol
          fetch-depth: 0
      - name: Remove stale worktree guard authority check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/field/install_one_time_capture.command')
          text = path.read_text(encoding='utf-8')
          stale = '[[ -f "$TUYA_BUILD_WINDOW_GUARD" ]] || die "Private Tuya build-window custody guard is missing from the accepted source."\n'
          replacement = 'GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git cat-file -e "$SOURCE_SHA:$TUYA_BUILD_WINDOW_GUARD_RELATIVE" 2>/dev/null || die "Private Tuya build-window custody guard is missing from the exact accepted Git source."\n'
          if text.count(stale) != 1:
              raise SystemExit(f'expected exactly one stale mutable guard check, found {text.count(stale)}')
          text = text.replace(stale, replacement, 1)
          if '$TUYA_BUILD_WINDOW_GUARD"' in text:
              raise SystemExit('stale undefined TUYA_BUILD_WINDOW_GUARD reference remains')
          path.write_text(text, encoding='utf-8')
          PY
          bash -n scripts/field/install_one_time_capture.command
          python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_git_replace_custody
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/field/install_one_time_capture.command
          git diff --cached --quiet && { echo 'ERROR: post-repair produced no installer diff' >&2; exit 1; }
          git commit -m 'Capture: bind guard presence check to accepted Git source'
          git push origin HEAD:repair/v14-private-review-hmac-helper-execution-sol
