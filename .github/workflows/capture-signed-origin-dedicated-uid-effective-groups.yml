name: Capture Signed Origin Dedicated UID Effective Groups

on:
  push:
    branches:
      - validation/v14-dedicated-uid-effective-groups-sol-20260812
    paths:
      - .github/workflows/capture-signed-origin-dedicated-uid-effective-groups.yml
      - scripts/ci/tests/test_capture_signed_app_dedicated_uid_effective_groups.py
  pull_request:
    paths:
      - .github/workflows/capture-signed-origin-dedicated-uid-effective-groups.yml
      - scripts/ci/tests/test_capture_signed_app_dedicated_uid_effective_groups.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-dedicated-uid-effective-groups-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  attest-effective-groups:
    name: Attest fresh build UID kernel groups
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Bind exact validation scope
        shell: bash
        env:
          EXACT_PARENT: 98fdc404048812f6d3af6791710c57ece21dafd3
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_HEAD_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          actual_paths="$RUNNER_TEMP/nembra-dedicated-groups-actual.txt"
          expected_paths="$RUNNER_TEMP/nembra-dedicated-groups-expected.txt"
          git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort > "$actual_paths"
          cat > "$expected_paths" <<'EOF'
          .github/workflows/capture-signed-origin-dedicated-uid-effective-groups.yml
          scripts/ci/tests/test_capture_signed_app_dedicated_uid_effective_groups.py
          EOF
          LC_ALL=C sort -o "$expected_paths" "$expected_paths"
          diff -u "$expected_paths" "$actual_paths"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile and source-audit attestor
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-dedicated-groups-pycache"
          /usr/bin/python3 -m py_compile \
            scripts/ci/tests/test_capture_signed_app_real_xcode_dedicated_uid_freeze.py \
            scripts/ci/tests/test_capture_signed_app_dedicated_uid_effective_groups.py
          probe='scripts/ci/tests/test_capture_signed_app_dedicated_uid_effective_groups.py'
          grep -Fq 'parent.structured_credentials(build_uid, build_gid, [])' "$probe"
          grep -Fq 'rawKernelSupplementaryGroups' "$probe"
          grep -Fq 'buildDirectoryServiceDistinctSupplementaryGroups' "$probe"
          grep -Fq 'productionShapedUnexpectedGroupsBeyondDirectoryService' "$probe"
          grep -Fq 'productionShapedMissingDirectoryServiceGroups' "$probe"
          grep -Fq 'productionShapedFieldOnlyGroupsLeaked' "$probe"
          grep -Fq 'effectiveZeroSupplementaryGroupsClaim' "$probe"
          grep -Fq 'sudoIdentityBoundDiagnostic' "$probe"
          grep -Fq 'physicalAuthorityCreated' "$probe"
          if grep -Fq 'preexec_fn=' "$probe"; then
            printf 'Effective-group attestation must not add opaque preexec credential demotion.\n' >&2
            exit 21
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run effective credential attestation
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/nembra-dedicated-uid-effective-groups.log"
          set +e
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_dedicated_uid_effective_groups.py 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'probe_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Seal retained classification
        if: always()
        shell: bash
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.probe_status }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/nembra-dedicated-uid-effective-groups.log"
          out="$RUNNER_TEMP/nembra-dedicated-uid-effective-groups.json"
          /usr/bin/python3 - "$log" "$out" "${PROBE_STATUS:-missing}" "$EXACT_HEAD" <<'PY'
          import hashlib, json, pathlib, sys
          log = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          status = sys.argv[3]
          head = sys.argv[4].lower()
          text = log.read_text(encoding="utf-8", errors="replace") if log.exists() else ""
          payload = {
              "schemaVersion": 2,
              "exactValidationHead": head,
              "exactAcceptedParent": "98fdc404048812f6d3af6791710c57ece21dafd3",
              "probeStatus": status,
              "successEvidence": [line for line in text.splitlines() if line.startswith("NEMBRA_DEDICATED_UID_EFFECTIVE_GROUPS_JSON=")],
              "redEvidence": [line for line in text.splitlines() if line.startswith("NEMBRA_DEDICATED_UID_EFFECTIVE_GROUPS_ERROR=")],
              "probeLogSHA256": hashlib.sha256(text.encode("utf-8")).hexdigest(),
              "physicalAuthorityCreated": False,
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Retain exact effective-group evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nembra-dedicated-uid-effective-groups-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nembra-dedicated-uid-effective-groups.log
            ${{ runner.temp }}/nembra-dedicated-uid-effective-groups.json
          if-no-files-found: error
          retention-days: 7

      - name: Require exact fresh-account effective credential baseline
        shell: bash
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.probe_status }}
        run: |
          set -euo pipefail
          test "${PROBE_STATUS:-missing}" = 0
          log="$RUNNER_TEMP/nembra-dedicated-uid-effective-groups.log"
          grep -q '^NEMBRA_DEDICATED_UID_EFFECTIVE_GROUPS_JSON=' "$log"
          grep -q '"productionShapedKernelGroupsAccepted": true' "$log"
          grep -q '"productionShapedDirectoryServiceBaselinePreservedExact": true' "$log"
          grep -q '"productionShapedUnexpectedGroupsBeyondDirectoryService": \[\]' "$log"
          grep -q '"productionShapedMissingDirectoryServiceGroups": \[\]' "$log"
          grep -q '"productionShapedFieldOnlyGroupsLeaked": \[\]' "$log"
          grep -q '"effectiveZeroSupplementaryGroupsClaim": false' "$log"
          grep -q '"physicalAuthorityCreated": false' "$log"

      - name: Diff hygiene
        if: always()
        shell: bash
        env:
          EXACT_PARENT: 98fdc404048812f6d3af6791710c57ece21dafd3
        run: |
          set -euo pipefail
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
