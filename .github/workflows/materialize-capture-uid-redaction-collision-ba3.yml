name: Materialize Capture UID Redaction Collision Hardening

on:
  push:
    branches:
      - fix/v14-capture-account-uid-redaction-collision-ba3-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v14-capture-account-uid-redaction-collision-ba3-sol
          fetch-depth: 0

      - name: Guard exact current product parent and construction scope
        shell: bash
        run: |
          set -euo pipefail
          base='ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"...HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/materialize-capture-uid-redaction-collision-ba3.yml
          scripts/ci/materialize_capture_uid_redaction_collision.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --quiet "$base" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDKeyCollisionSourceTests.swift

      - name: Apply collision-safe event custody repair
        run: python3 scripts/ci/materialize_capture_uid_redaction_collision.py apply

      - name: Validate focused source and portable behavior contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_uid_redaction_collision.py verify
          python3 -m py_compile scripts/ci/materialize_capture_uid_redaction_collision.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDKeyCollisionSourceTests.swift
          cat > /tmp/uid_collision_probe.swift <<'SWIFT'
          import Foundation

          func redact(_ update: [String: String], accountUID: String) -> [String: String] {
              var redacted: [String: String] = [:]
              redacted.reserveCapacity(update.count)
              for (key, value) in update {
                  var redactedKey = key.replacingOccurrences(
                      of: accountUID,
                      with: "<redacted-account-uid>",
                      options: [.caseInsensitive, .literal]
                  )
                  let redactedValue = value.replacingOccurrences(
                      of: accountUID,
                      with: "<redacted-account-uid>",
                      options: [.caseInsensitive, .literal]
                  )
                  if redacted[redactedKey] != nil {
                      var suffix = 2
                      while redacted["\(redactedKey)#\(suffix)"] != nil {
                          suffix += 1
                      }
                      redactedKey = "\(redactedKey)#\(suffix)"
                  }
                  redacted[redactedKey] = redactedValue
              }
              return redacted
          }

          let uid = "Acct-AbC-123"
          let input = [
              "owner-Acct-AbC-123": "first ACCT-ABC-123",
              "owner-<redacted-account-uid>": "second"
          ]
          let result = redact(input, accountUID: uid)
          precondition(result.count == 2)
          precondition(result["owner-<redacted-account-uid>"] != nil)
          precondition(result["owner-<redacted-account-uid>#2"] != nil)
          precondition(result.values.contains("first <redacted-account-uid>"))
          precondition(result.values.contains("second"))

          var reserved = redact(["generation": "forged"], accountUID: uid)
          reserved["generation"] = "42"
          precondition(reserved["generation"] == "42")
          print("UID-redacted key collision + trusted generation behavior: PASS")
          SWIFT
          swiftc -warnings-as-errors /tmp/uid_collision_probe.swift -o /tmp/uid_collision_probe
          /tmp/uid_collision_probe
          git diff --check

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          base='ba3a1eeae36caca6dd84beaabd0f15f4f0b57925'
          rm .github/workflows/materialize-capture-uid-redaction-collision-ba3.yml
          rm scripts/ci/materialize_capture_uid_redaction_collision.py
          git add -A
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          NembraApp/App/NembraCaptureEntrypoint.swift
          Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDKeyCollisionSourceTests.swift
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): preserve UID-redacted event key collisions'
          git diff --check "$base" HEAD
          git push origin HEAD:fix/v14-capture-account-uid-redaction-collision-ba3-sol
