name: V14 Capture Product Truth Sync

on:
  push:
    branches:
      - product/v14-capture-premium-secure-link-current-sol

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/v14-capture-premium-secure-link-current-sol
          fetch-depth: 0

      - name: Guard exact guided-product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "707511e073866704887f12a7164a1ad093fe660b"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/v14-capture-product-truth-sync.yml"

      - name: Carry accepted canonical procedure surfaces
        shell: bash
        run: |
          set -euo pipefail
          procedure_head="8b9c1cabeeffdec7cb12f9a74f53320c11e7eae0"
          for path in \
            NembraApp/App/NembraCaptureBuildIdentity.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldDependencyProvenanceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift \
            docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md \
            scripts/field/install_one_time_capture.command; do
            git show "$procedure_head:$path" > "$path"
          done

      - name: Bind procedure to guided Capture export and details
        shell: python
        run: |
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guard failed: expected one match, found {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "        let tuyaDependencyLockSHA256: String\n        let tuyaDeviceID: String",
              "        let tuyaDependencyLockSHA256: String\n        let procedureIdentifier: String\n        let tuyaDeviceID: String",
          )
          replace_once(
              "    var fieldBuildSourceCommitSHA: String { buildIdentity.sourceCommitSHA }\n    var sdkAccountLoggedIn: Bool",
              "    var fieldBuildSourceCommitSHA: String { buildIdentity.sourceCommitSHA }\n    var fieldProcedureIdentifier: String { NembraCaptureBuildIdentity.fieldProcedureIdentifier }\n    var sdkAccountLoggedIn: Bool",
          )
          replace_once("            schemaVersion: 9,", "            schemaVersion: 10,")
          replace_once(
              "            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n            tuyaDeviceID: deviceID,",
              "            tuyaDependencyLockSHA256: buildIdentity.tuyaDependencyLockSHA256,\n            procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier,\n            tuyaDeviceID: deviceID,",
          )
          replace_once(
              '                LabeledContent("Source commit", value: test.fieldBuildSourceCommitSHA)\n                LabeledContent("SDK account",',
              '                LabeledContent("Source commit", value: test.fieldBuildSourceCommitSHA)\n                LabeledContent("Procedure", value: test.fieldProcedureIdentifier)\n                LabeledContent("SDK account",',
          )
          replace_once(
              "Sanitized diagnostics ready with exact compiled source + reviewed Tuya dependency-lock provenance.",
              "Sanitized diagnostics ready with exact compiled source + reviewed Tuya dependency-lock + canonical stationary procedure provenance.",
          )

          path.write_text(text)

      - name: Verify truth-preserving convergence
        shell: bash
        run: |
          set -euo pipefail
          procedure='ES80-AUTHENTICATED-STATIONARY-v1'
          entrypoint='NembraApp/App/NembraCaptureEntrypoint.swift'
          identity='NembraApp/App/NembraCaptureBuildIdentity.swift'
          runbook='docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md'
          installer='scripts/field/install_one_time_capture.command'

          grep -Fq "static let fieldProcedureIdentifier = \"$procedure\"" "$identity"
          grep -Fq 'let procedureIdentifier: String' "$entrypoint"
          grep -Fq 'procedureIdentifier: NembraCaptureBuildIdentity.fieldProcedureIdentifier' "$entrypoint"
          grep -Fq 'LabeledContent("Procedure", value: test.fieldProcedureIdentifier)' "$entrypoint"
          grep -Fq 'schemaVersion: 10' "$entrypoint"
          ! grep -Fq 'schemaVersion: 9' "$entrypoint"
          grep -Fq "PROCEDURE_ID: \`$procedure\`" "$runbook"
          grep -Fq "PROCEDURE_ID=\"$procedure\"" "$installer"

          grep -Fq 'failedAttemptCanRestartFromOFF1' "$entrypoint"
          grep -Fq 'acceptedArtifactCanPrepareExport' "$entrypoint"
          grep -Fq 'CAPTURE SEALED' "$entrypoint"
          grep -Fq 'CAPTURE COMPLETE' "$entrypoint"
          grep -Fq 'Ready for analysis' "$entrypoint"
          grep -Fq 'Retry sealed export' "$entrypoint"
          grep -Fq 'self.sdkLocalBLEOnline = driver.isLocallyConnected(uuid: self.tuyaUUID)' "$entrypoint"
          grep -Fq 'self.sealedAcceptedExport = self.makeExport(' "$entrypoint"
          grep -Fq 'Engineering details' "$entrypoint"

          bash -n scripts/field/install_one_time_capture.command
          bash -n scripts/ci/capture_standalone_visual_evidence.sh
          /usr/bin/python3 scripts/ci/tests/test_capture_standalone_visual_evidence.py
          swiftc -parse "$identity"
          swiftc -parse "$entrypoint"
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaFieldProcedureRendezvousSourceTests.swift
          git diff --check

      - name: Commit clean guided-product convergence
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/v14-capture-product-truth-sync.yml
          git diff --check
          git config user.name 'nembra-go-bot'
          git config user.email 'nembra-go-bot@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -Fq 'v14-capture-product-truth-sync.yml'; then
            test "$(git diff --cached --name-status | grep 'v14-capture-product-truth-sync.yml')" != "A\t.github/workflows/v14-capture-product-truth-sync.yml"
          fi
          git commit -m 'fix(capture): converge guided product with procedure truth'
          git push origin HEAD:product/v14-capture-premium-secure-link-current-sol
