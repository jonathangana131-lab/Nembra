name: ES80 current pre-H observation abort exact-product QA

on:
  push:
    branches:
      - cell/es80-preh-observation-abort/ci/chat-g5t6-7aab

permissions:
  contents: read

jobs:
  preh-observation-abort-qa:
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Checkout validation mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify exact product parent and workflow-only delta
        env:
          EXPECTED_PRODUCT_SHA: 7aab62ce29870e1979178c9bc3a6b34950817b31
          EXPECTED_WORKFLOW_PATH: .github/workflows/qa-es80-preh-observation-abort-chat-g5t6-7aab.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$EXPECTED_WORKFLOW_PATH"

      - name: Report Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Reject application characteristic writes
        run: |
          set -euo pipefail
          if grep -R --include='*.swift' -nE '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Application characteristic-value write path detected.' >&2
            exit 1
          fi

      - name: Guard Swift Testing mutating reset assertions
        run: |
          set -euo pipefail
          if grep -R --include='*.swift' -nE '#expect\([^\n]*resetForNewCaptureSession[[:space:]]*\(' Packages/NembraBluetoothCapture/Tests; then
            echo 'Mutating resetForNewCaptureSession() remains directly inside #expect.' >&2
            exit 1
          fi

      - name: Verify one-shot replay contract is present
        run: |
          set -euo pipefail
          source='Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryTransactionDecision.swift'
          tests='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryMutationPermitTests.swift'
          test "$(grep -Fc 'try mutationPermit.claim()' "$source")" = '2'
          grep -Fq 'private static func classifyReadyAttempt' "$tests"
          grep -Fq 'private static func classifyHorizonAttempt' "$tests"
          grep -Fq 'readyConcurrentReplayIsOneShot' "$tests"
          grep -Fq 'horizonConcurrentReplayIsOneShot' "$tests"

      - name: Run NembraCore tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors

      - name: Run full capture package tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors

      - name: Build capture package for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
