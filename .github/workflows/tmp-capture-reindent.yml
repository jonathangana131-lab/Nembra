name: Temporary Capture Formatting Cleanup

on:
  push:
    branches:
      - "agent/capture-post-seal-transport-recheck-sol"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize inserted Swift indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text()
          start = source.index("                        guard self.currentConnectionToken == token,\n", source.index("try await sessionLedger.sealAcceptedObservation(for: token)"))
          end = source.index("                        guard self.buildIdentity.isAuthoritativeFieldBuild,\n", start)
          block = """                        guard self.currentConnectionToken == token,
                              self.driver === driver else {
                            self.currentConnectionToken = nil
                            self.localBLESettlementToken = nil
                            self.sdkLocalBLEOnline = false
                            self.driver = nil
                            self.phase = .failed
                            self.message = \"Authenticated-session ownership changed while canonical acceptance was sealing. Restart from OFF1; no accepted artifact was published.\"
                            self.log(\"session_owner_changed_during_acceptance_seal\", [
                                \"generation\": String(token.diagnosticGeneration)
                            ])
                            return
                        }
                        self.sdkLocalBLEOnline = driver.isLocallyConnected(uuid: self.tuyaUUID)
                        guard self.sdkLocalBLEOnline else {
                            self.currentConnectionToken = nil
                            self.localBLESettlementToken = nil
                            self.driver = nil
                            self.phase = .failed
                            self.message = \"Tuya local-BLE authority was no longer current after canonical sealing. Restart from OFF1; the sealed package chronology remains diagnostic only.\"
                            self.log(\"sdk_local_ble_offline_after_acceptance_seal\", [
                                \"generation\": String(token.diagnosticGeneration)
                            ])
                            return
                        }
          """
          path.write_text(source[:start] + block + source[end:])
          PY
          git diff --check
      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-capture-reindent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/tmp-capture-reindent.yml
          git commit -m "style(capture): normalize seal guard indentation"
          git push origin HEAD:agent/capture-post-seal-transport-recheck-sol
