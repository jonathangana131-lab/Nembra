name: VALIDATION ONLY - Trusted Xcode Bash Environment Custody Red

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/capture-xcode27-trusted-command.yml
      - scripts/ci/tests/test_capture_trusted_xcode_bash_environment_custody.py
      - .github/workflows/validation-trusted-xcode-bash-env-custody-expected-red.yml

permissions:
  contents: read

jobs:
  expected-red:
    name: Reject inherited Bash startup authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Compile Bash-environment custody regression
        run: python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_bash_environment_custody.py

      - name: Prove authority Bash cannot inherit candidate startup environment
        run: python3 scripts/ci/tests/test_capture_trusted_xcode_bash_environment_custody.py -v
