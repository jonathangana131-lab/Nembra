name: V14 Capture Timeout Quiescence One Shot

on:
  push:
    branches:
      - adversarial/v14-capture-sealed-application-export-prefix-gpt56sol

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: adversarial/v14-capture-sealed-application-export-prefix-gpt56sol
          fetch-depth: 0

      - name: Gate no-application timeout on admission quiescence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = path.read_text()
          old = '                if (self.canonicalObservedAgeSeconds ?? 0) > 60,\n                   self.applicationUpdateCount == 0 {\n'
          new = '                if self.applicationUpdateAdmissionsInFlight == 0,\n                   (self.canonicalObservedAgeSeconds ?? 0) > 60,\n                   self.applicationUpdateCount == 0 {\n'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'timeout anchor: expected one occurrence, found {count}')
          s = s.replace(old, new, 1)
          path.write_text(s)
          PY
          grep -F 'if self.applicationUpdateAdmissionsInFlight == 0,' NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --check

      - name: Retire helper and checkpoint timeout race repair
        run: |
          set -euo pipefail
          rm .github/workflows/v14-capture-timeout-quiescence-one-shot.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/v14-capture-timeout-quiescence-one-shot.yml
          git commit -m 'fix(capture): keep timeout behind application quiescence'
          git push origin HEAD:adversarial/v14-capture-sealed-application-export-prefix-gpt56sol
