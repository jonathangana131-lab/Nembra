name: TEMP V14 Real Xcode Unmount Credential Materializer

on:
  push:
    branches:
      - validation/v14-real-xcode-unmount-structured-minimal-groups-gpt56-go
    paths:
      - .github/workflows/tmp-v14-real-xcode-unmount-credential-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind constructor to exact #3009 validation parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "83cd182c45fc563978c5144e50171c57c2c3b744"
      - name: Replace opaque/full-group credential replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/ci/tests/test_capture_signed_app_real_xcode_unmount_freeze.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''def make_package(root: Path) -> None:\n'''
          helper = '''def structured_credentials(uid: int, gid: int, groups: list[int]) -> dict[str, object]:\n    return {\n        "user": uid,\n        "group": gid,\n        "extra_groups": sorted(set(groups)),\n    }\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("make_package anchor changed")
          text = text.replace(anchor, helper + anchor, 1)

          old_groups = '''        child_groups = sorted(set(normal_groups) | {capability_gid})\n'''
          new_groups = '''        # Only the fresh one-run capability is required as a supplementary\n        # group. Replaying unrelated hosted-runner groups can exceed macOS\n        # setgroups limits before Xcode starts and is not part of this oracle.\n        child_groups = [capability_gid]\n        ordinary_groups: list[int] = []\n'''
          if text.count(old_groups) != 1:
              raise SystemExit("child group construction changed")
          text = text.replace(old_groups, new_groups, 1)

          replacements = {
              "            preexec_fn=helper.drop(uid, gid, child_groups),\n": "            **structured_credentials(uid, gid, child_groups),\n",
              "            preexec_fn=helper.drop(uid, gid, normal_groups),\n": "            **structured_credentials(uid, gid, ordinary_groups),\n",
          }
          for old, new in replacements.items():
              count = text.count(old)
              expected = 2 if "child_groups" in old else 1
              if count != expected:
                  raise SystemExit(f"credential call count changed for {old.strip()}: {count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate focused recovery contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/nembra-real-xcode-credential-pycache"
          python3 -m py_compile scripts/ci/tests/test_capture_signed_app_real_xcode_unmount_freeze.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path("scripts/ci/tests/test_capture_signed_app_real_xcode_unmount_freeze.py").read_text(encoding="utf-8")
          assert "preexec_fn=helper.drop" not in text
          assert "child_groups = [capability_gid]" in text
          assert "ordinary_groups: list[int] = []" in text
          assert text.count("**structured_credentials(uid, gid, child_groups)") == 2
          assert text.count("**structured_credentials(uid, gid, ordinary_groups)") == 1
          assert '"nonForcedDetachReturnCode": detach.returncode' in text
          assert '"rootReadonlyAttackReturnCode": root_attack.returncode' in text
          assert '"readonlyAttackReturnCode": former_capability.returncode' in text
          PY
          git diff --check
      - name: Publish clean validation child
        shell: bash
        env:
          BRANCH: validation/v14-real-xcode-unmount-structured-minimal-groups-gpt56-go
        run: |
          set -euo pipefail
          git config user.name "Nembra Swarm"
          git config user.email "nembra-swarm@users.noreply.github.com"
          git add scripts/ci/tests/test_capture_signed_app_real_xcode_unmount_freeze.py
          git rm .github/workflows/tmp-v14-real-xcode-unmount-credential-materialize.yml
          git commit -m "test(capture): recover real-Xcode APFS credential launch"
          git push origin "HEAD:${BRANCH}"
