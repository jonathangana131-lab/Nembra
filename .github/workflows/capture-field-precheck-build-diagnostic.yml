name: Capture Field Precheck Build Diagnostic

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Replay provenance prechecks then retain stamped build log
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate private Tuya input provenance helper
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          bash -n Scripts/bootstrap_capture_tuya_sdk.sh

      - name: Validate signed Apple application identity custody
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          /usr/bin/python3 scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py
          bash -n scripts/field/install_one_time_capture.command

      - name: Build stamped standalone Simulator app after provenance prechecks
        id: build
        shell: bash
        run: |
          set -o pipefail
          sha="$(git rev-parse HEAD)"
          dependency_sha='abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789'
          procedure='ES80-AUTHENTICATED-STATIONARY-v1'
          label="capture-v14-${sha:0:12}"
          rm -rf /tmp/NembraCaptureProvenanceDerived
          log="$RUNNER_TEMP/capture-field-precheck-build-${sha}.log"
          set +e
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/NembraCaptureProvenanceDerived \
            CODE_SIGNING_ALLOWED=NO \
            NEMBRA_CAPTURE_BUILD_IDENTIFIER="$label" \
            NEMBRA_CAPTURE_BUILD_COMMIT_SHA="$sha" \
            NEMBRA_CAPTURE_TUYA_DEPENDENCY_LOCK_SHA256="$dependency_sha" \
            INFOPLIST_KEY_NembraCaptureProcedureIdentifier="$procedure" \
            build 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'log_path=%s\n' "$log" >> "$GITHUB_OUTPUT"
          printf 'build_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload precheck stamped build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-field-precheck-build-diagnostic-${{ github.sha }}
          path: ${{ steps.build.outputs.log_path }}
          if-no-files-found: error
          retention-days: 7
