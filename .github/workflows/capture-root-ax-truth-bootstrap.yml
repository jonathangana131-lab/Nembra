name: Capture Root AX Truth Bootstrap

on:
  push:
    branches:
      - fix/v14-capture-root-ax-truth-convergence-sol

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed root correction
        run: python3 scripts/ci/apply_capture_root_ax_truth_patch.py
      - name: Verify scoped result and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ci/apply_capture_root_ax_truth_patch.py
          rm -f .github/workflows/capture-root-ax-truth-bootstrap.yml
          git diff --check
          git status --short
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureP0RootVisualAcceptanceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureRootProductSurfaceSourceTests.swift \
            .github/workflows/capture-root-ax-truth-bootstrap.yml \
            scripts/ci/apply_capture_root_ax_truth_patch.py | sort)"
          test "$changed" = "$expected"
      - name: Commit product correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(capture): keep AX setup actionable and provenance truthful'
          git push origin HEAD:fix/v14-capture-root-ax-truth-convergence-sol
