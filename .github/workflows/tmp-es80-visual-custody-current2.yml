name: TEMP ES80 visual custody latest-spine reanchor

on:
  push:
    branches:
      - fix/es80-v14-simulator-visual-evidence-custody-current2/gpt56-thinking-go

permissions:
  contents: write

jobs:
  reanchor:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Copy validated final custody blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            fix/es80-v14-simulator-visual-evidence-custody-current/gpt56-thinking-go:refs/remotes/origin/custody-final
          git show refs/remotes/origin/custody-final:scripts/ci/xcode27_simulator_capture.sh \
            > scripts/ci/xcode27_simulator_capture.sh
          git show refs/remotes/origin/custody-final:scripts/ci/tests/test_xcode27_simulator_visual_evidence_descriptor_custody_source.py \
            > scripts/ci/tests/test_xcode27_simulator_visual_evidence_descriptor_custody_source.py
          bash -n scripts/ci/xcode27_simulator_capture.sh
          python3 scripts/ci/tests/test_xcode27_simulator_visual_evidence_descriptor_custody_source.py
          grep -q '^python3 scripts/ci/tests/test_xcode27_simulator_visual_evidence_descriptor_custody_source.py$' scripts/ci/xcode27_simulator_capture.sh
          git diff --check
          rm .github/workflows/tmp-es80-visual-custody-current2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[Capture visual QA v14] Bind retained Simulator evidence to descriptors"
          git push origin HEAD:${{ github.ref_name }}
