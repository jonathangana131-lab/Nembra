name: Nembra GO Materialize Post-DS Retirement

on:
  push:
    branches:
      - repair/v14-post-ds-retirement-production-sol-20260812-go2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-post-ds-retirement-production-sol-20260812-go2
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source carrier
        shell: bash
        env:
          EXACT_PARENT: 3568250ee02556185610dd895e3f6d1c8f28dd33
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          test "$(git diff --name-only "$EXACT_PARENT"...HEAD)" = '.github/workflows/nembra-go-materialize-post-ds-retirement.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize proved repair
        shell: bash
        env:
          PATCH_GZ_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip --decompress --stdout > "$RUNNER_TEMP/post-ds-patch.py"
          /usr/bin/python3 -B -I "$RUNNER_TEMP/post-ds-patch.py"
          /usr/bin/python3 -B -m py_compile scripts/ci/capture_signed_app_build_origin_custody.py scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          /usr/bin/python3 -B scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py
          grep -Fq 'def _direct_local_identity_record_exists(' scripts/ci/capture_signed_app_build_origin_custody.py
          grep -Fq 'final_kill = subprocess.run(' scripts/ci/capture_signed_app_build_origin_custody.py
          grep -Fq "grep -Fq '**_structured_credentials(uid, gid, ())' \"\$build_origin_custody\"" .github/workflows/capture-field-build-provenance.yml
          git diff --check

      - name: Commit production successor and remove materializer
        shell: bash
        env:
          EXACT_PARENT: 3568250ee02556185610dd895e3f6d1c8f28dd33
        run: |
          set -euo pipefail
          rm -f .github/workflows/nembra-go-materialize-post-ds-retirement.yml
          actual="$(git diff --name-only "$EXACT_PARENT" | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-field-build-provenance.yml' 'scripts/ci/capture_signed_app_build_origin_custody.py' 'scripts/ci/tests/test_capture_signed_app_pre_stage_origin.py' | sort)"
          test "$actual" = "$expected"
          git diff --check
          git config user.name 'nembra-go-sol'
          git config user.email 'nembra-go-sol@users.noreply.github.com'
          git add -A
          git commit -m 'Capture: compose post-DS build-principal retirement'
          git push origin HEAD:repair/v14-post-ds-retirement-production-sol-20260812-go2
