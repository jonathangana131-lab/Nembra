name: V14 Capture build-hook fix once

on:
  push:
    branches:
      - 'repair/v14-capture-build-hook-custody-current-main/gpt56-go'
    paths:
      - '.github/workflows/v14-capture-build-hook-fix-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Complete trusted scheme custody and rotate exact blob pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/capture-xcode27-trusted-command.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          old_import = '          import re\n          from pathlib import Path\n'
          new_import = '          import re\n          import xml.etree.ElementTree\n          from pathlib import Path\n'
          if workflow.count(old_import) != 1:
              raise SystemExit('expected exactly one trusted build-hook import seam')
          workflow = workflow.replace(old_import, new_import, 1)

          old_tail = '''          print("trusted Xcode build-hook fence accepted source-only app/test graph")
          PY
'''
          new_tail = '''          scheme_path = Path("Nembra.xcodeproj/xcshareddata/xcschemes/Nembra.xcscheme")
          try:
              scheme_root = xml.etree.ElementTree.parse(scheme_path).getroot()
          except (OSError, xml.etree.ElementTree.ParseError) as error:
              raise SystemExit(f"trusted Xcode authority cannot parse canonical scheme: {error}") from error

          scheme_execution_hooks = (
              ("ExecutionAction", scheme_root.iter("ExecutionAction")),
              ("PreActions", scheme_root.iter("PreActions")),
              ("PostActions", scheme_root.iter("PostActions")),
              ("ActionContent", scheme_root.iter("ActionContent")),
          )
          for marker, nodes in scheme_execution_hooks:
              if next(nodes, None) is not None:
                  raise SystemExit(f"trusted Xcode authority refuses scheme execution hook: {marker}")

          print("trusted Xcode build-hook fence accepted source-only app/test graph and hook-free scheme")
          PY
'''
          if workflow.count(old_tail) != 1:
              raise SystemExit('expected exactly one trusted build-hook fence tail')
          workflow_path.write_text(workflow.replace(old_tail, new_tail, 1), encoding='utf-8')
          PY

          new_blob="$(git hash-object .github/workflows/capture-xcode27-trusted-command.yml)"
          test "$new_blob" = "1dc2345425709e2d52c58967715e0cde571a3faa"
          export NEW_TRUSTED_WORKFLOW_BLOB="$new_blob"

          python3 - <<'PY'
          import os
          from pathlib import Path

          old = '4fd3cbd52a54c4450954206c70473acab6f677d9'
          new = os.environ['NEW_TRUSTED_WORKFLOW_BLOB']
          paths = (
              Path('scripts/ci/es80_today_trusted_capture_xcode_subject.py'),
              Path('.github/workflows/capture-today-final-go-qa.yml'),
              Path('.github/workflows/capture-today-trusted-default-xcode-subject-qa.yml'),
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one old trusted-workflow blob pin, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 -m py_compile scripts/ci/es80_today_trusted_capture_xcode_subject.py
          python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_build_hook_custody.py
          python3 scripts/ci/tests/test_capture_trusted_xcode_build_hook_custody.py -v
          grep -Fq "TRUSTED_WORKFLOW_BLOB_SHA = \"$new_blob\"" scripts/ci/es80_today_trusted_capture_xcode_subject.py
          grep -Fq "TRUSTED_WORKFLOW_BLOB_SHA = \"$new_blob\"" .github/workflows/capture-today-final-go-qa.yml
          grep -Fq "TRUSTED_WORKFLOW_BLOB_SHA = \"$new_blob\"" .github/workflows/capture-today-trusted-default-xcode-subject-qa.yml

          rm -- .github/workflows/v14-capture-build-hook-fix-once.yml
          git diff --check
          git status --short

          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add .github/workflows/capture-xcode27-trusted-command.yml \
                  .github/workflows/capture-today-final-go-qa.yml \
                  .github/workflows/capture-today-trusted-default-xcode-subject-qa.yml \
                  scripts/ci/es80_today_trusted_capture_xcode_subject.py \
                  .github/workflows/v14-capture-build-hook-fix-once.yml
          git diff --cached --check
          git commit -m 'fix(capture): fence trusted Xcode scheme hooks'
          git push origin HEAD:repair/v14-capture-build-hook-custody-current-main/gpt56-go
