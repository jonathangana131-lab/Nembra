name: V14 terminal fresh handoff runner

on:
  push:
    branches:
      - integration/es80-v14-terminal-fresh-handoff/gpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify staging lineage
        run: |
          set -euo pipefail
          base=fd24b375a5795653ca75a165e71b89944e40f03d
          git merge-base --is-ancestor "$base" HEAD
          test -f scripts/ci/v14_terminal_fresh_handoff_patch.py
      - name: Apply product patch
        run: |
          set -euo pipefail
          python3 scripts/ci/v14_terminal_fresh_handoff_patch.py
          git diff --check
          grep -q 'terminalResolvedFrontierNotApplied' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift
          grep -q 'installedRecorderIdentity: ObjectIdentifier(freshSession.recorder)' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
      - name: Commit product and remove staging files
        run: |
          set -euo pipefail
          rm .github/workflows/v14-terminal-fresh-handoff-gpt56.yml
          rm .github/workflows/v14-terminal-fresh-handoff-runner.yml
          rm scripts/ci/v14_terminal_fresh_handoff_patch.py
          git add -A
          git diff --cached --check
          git config user.name nembra-v14-gpt56
          git config user.email actions@users.noreply.github.com
          git commit -m 'Capture: consume terminal resolution into exact fresh recorder'
          git push origin HEAD:integration/es80-v14-terminal-fresh-handoff/gpt56-go
