name: Converge latest Capture canonical head onto main

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: write

jobs:
  converge:
    if: github.event.head_commit.message == 'GO converge latest Capture canonical head onto main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge exact main into latest canonical source head
        shell: bash
        run: |
          set -euo pipefail
          branch='capture/current-main-tuya-readonly-convergence-gpt56'
          expected_main='de37ee4769022d32765bf63340f8420ee7c0e04b'
          git fetch origin "$branch" main
          source_head="$(git rev-parse origin/$branch)"
          test "$(git rev-parse origin/main)" = "$expected_main"
          git checkout -B converge-source "$source_head"
          test -f .github/workflows/capture-main-converge-final.yml
          git config user.name nembra-go-worker
          git config user.email actions@users.noreply.github.com
          git merge --no-edit "$expected_main"
          git rm .github/workflows/capture-main-converge-final.yml
          git commit -m 'Capture V16.1: retire final main convergence runner'
          git diff --check HEAD~1 HEAD
          git merge-base --is-ancestor "$expected_main" HEAD
          git fetch origin "$branch" main
          test "$(git rev-parse origin/$branch)" = "$source_head"
          test "$(git rev-parse origin/main)" = "$expected_main"
          git push origin HEAD:"$branch"
