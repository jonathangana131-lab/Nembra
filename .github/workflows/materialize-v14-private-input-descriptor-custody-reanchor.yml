name: Materialize V14 Private Input Descriptor Custody Reanchor

on:
  push:
    branches:
      - sol/v14-capture-private-input-descriptor-custody-4a118

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4a11865c4b16b778aa03634e7ca3bdbc50b0432e"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/materialize-v14-private-input-descriptor-custody-reanchor.yml"

      - name: Apply validated two-file donor delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 4401e6a31e227273da20220d351b1b85e63faa5b
          git diff --binary a5cb12ed97241ba274d23f311d67cf84623ceb29..4401e6a31e227273da20220d351b1b85e63faa5b -- \
            Scripts/capture_tuya_private_input_provenance.py \
            scripts/ci/tests/test_capture_tuya_private_input_provenance.py | git apply --index
          /usr/bin/python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py
          /usr/bin/python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' 'Scripts/capture_tuya_private_input_provenance.py' 'scripts/ci/tests/test_capture_tuya_private_input_provenance.py' | sort)"
          test "$(git hash-object Scripts/capture_tuya_private_input_provenance.py)" = "$(git rev-parse 4401e6a31e227273da20220d351b1b85e63faa5b:Scripts/capture_tuya_private_input_provenance.py)"
          test "$(git hash-object scripts/ci/tests/test_capture_tuya_private_input_provenance.py)" = "$(git rev-parse 4401e6a31e227273da20220d351b1b85e63faa5b:scripts/ci/tests/test_capture_tuya_private_input_provenance.py)"

      - name: Commit clean current-product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-v14-private-input-descriptor-custody-reanchor.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(capture): bind private file fingerprints to descriptors"
          git push origin HEAD:sol/v14-capture-private-input-descriptor-custody-4a118
