name: Diagnose composed Capture r2 suites

on:
  push:
    branches:
      - capture/current-main-tuya-readonly-convergence-gpt56

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose composed Capture r2 suites'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: capture/current-main-tuya-readonly-convergence-gpt56
          fetch-depth: 0

      - name: Reuse reviewed r2 composition in working tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/capture-app-truth-repair-r2.yml').read_text()
          compose = source.index('      - name: Compose canonical Capture app truth\n')
          truth = source.index('      - name: Run focused truth contracts\n', compose)
          chunk = source[compose:truth]
          marker = '        run: |\n'
          if chunk.count(marker) != 1:
              raise SystemExit(f'compose run marker count: {chunk.count(marker)}')
          body = chunk.split(marker, 1)[1]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip() == '':
                  lines.append('')
              else:
                  raise SystemExit(f'unexpected compose indentation: {line!r}')
          Path('/tmp/nembra-compose-r2.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/nembra-compose-r2.sh

      - name: Run all focused filters with durable annotations
        shell: bash
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -uo pipefail
          failed=0
          for filter in \
            TuyaAuthenticatedReadOnlySessionLedgerTests \
            TuyaAuthenticatedTerminalHorizonTests \
            TuyaAuthenticatedReadOnlyHorizonTests \
            TuyaAuthenticatedReadOnlyHorizonTestsAppIntegration \
            TuyaAppIncompleteHorizonTerminalSourceTests \
            TuyaAlreadyTerminalObservationContinuitySourceTests \
            TuyaDeviceSharingAuthenticationAuthorityTests
          do
            if swift test --filter "$filter"; then
              echo "::notice title=Capture truth filter passed::$filter"
            else
              echo "::error title=Capture truth filter failed::$filter"
              failed=1
            fi
          done
          exit "$failed"
