name: V14 Capture Prune Stale Canonical Runs

on:
  push:
    branches:
      - ops/v14-capture-prune-stale-canonical-runs-sol
    paths:
      - '.github/workflows/v14-capture-prune-stale-canonical-runs.yml'

permissions:
  actions: write
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CANONICAL_BRANCH: agent/v14-capture-live-main-visual-acceptance-sol
      CURRENT_HEAD: 2b9ca55832a9dd6500c2e2bd3f168ab5be7d95ab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Cancel only stale queued runs from the canonical Capture branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CURRENT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          current_live="$(gh api "/repos/$REPO/git/ref/heads/$CANONICAL_BRANCH" --jq '.object.sha')"
          test "$current_live" = "$CURRENT_HEAD"

          stale_file="$(mktemp)"
          gh api --paginate "/repos/$REPO/actions/runs?status=queued&per_page=100" \
            --jq '.workflow_runs[] | select(.head_branch == env.CANONICAL_BRANCH and .head_sha != env.CURRENT_HEAD) | [.id, .head_sha, .name] | @tsv' \
            > "$stale_file"

          count=0
          while IFS=$'\t' read -r run_id head_sha workflow_name; do
            [[ -n "${run_id:-}" ]] || continue
            printf 'Cancelling stale queued canonical run %s %s %s\n' "$run_id" "$head_sha" "$workflow_name"
            gh api -X POST "/repos/$REPO/actions/runs/$run_id/cancel" >/dev/null
            count=$((count + 1))
          done < "$stale_file"

          printf 'Cancelled %s stale queued canonical Capture runs; preserved exact current head %s.\n' "$count" "$CURRENT_HEAD"

      - name: Self-delete maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v14-capture-prune-stale-canonical-runs.yml
          git config user.name 'Nembra Capture Closure'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'ci(capture): remove stale-run maintenance helper'
          git push origin HEAD:ops/v14-capture-prune-stale-canonical-runs-sol
