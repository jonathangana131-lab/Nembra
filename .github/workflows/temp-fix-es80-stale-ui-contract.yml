name: TEMP fix ES80 stale UI source contract

on:
  push:
    branches:
      - fix/es80-today-capture-visual-evidence-bc9a/chatgpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: fix/es80-today-capture-visual-evidence-bc9a/chatgpt56-go
          fetch-depth: 0

      - name: Replace only the demonstrated stale source assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraUITests/ES80ResearchCaptureUITests.swift")
          source = path.read_text(encoding="utf-8")
          old = '''        XCTAssertTrue(
              appSource.contains("if PassiveBluetoothExperimentOneFieldExecutionGate.permitsPhysicalProcedure"),
              "The normal research route must still be downstream of the package field gate."
          )
          XCTAssertTrue(
              appSource.contains("PassiveBluetoothExperimentOneCoordinator.makeAuthorizedES80()"),
              "The real field route must retain its package-owned attested factory."
          )'''
          # Preserve indentation exactly as it exists in the Swift source; tolerate the 8-space form
          # independently of YAML indentation.
          old = old.replace("          ", "        ", 1)
          old = old.replace("              ", "            ")
          old = old.replace("          )", "        )")
          new = '''        XCTAssertTrue(
            appSource.contains(".makeResearchAuthorizedES80ForCurrentApplication()"),
            "The real research route must construct only through the current package-owned research-authorized factory."
        )
        XCTAssertTrue(
            appSource.contains("ES80ExperimentOneFieldNoGoView()"),
            "Failure to obtain package research authority must keep the rider on the dedicated physical NO-GO surface."
        )'''

          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one stale source-contract block, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --name-only)" = "NembraUITests/ES80ResearchCaptureUITests.swift"
          grep -F '.makeResearchAuthorizedES80ForCurrentApplication()' NembraUITests/ES80ResearchCaptureUITests.swift
          grep -F 'ES80ExperimentOneFieldNoGoView()' NembraUITests/ES80ResearchCaptureUITests.swift
          ! grep -F 'makeAuthorizedES80()' NembraUITests/ES80ResearchCaptureUITests.swift
          ! grep -F 'if PassiveBluetoothExperimentOneFieldExecutionGate.permitsPhysicalProcedure' NembraUITests/ES80ResearchCaptureUITests.swift

      - name: Commit the focused test-contract repair
        run: |
          git config user.name "nembra-go-bot"
          git config user.email "nembra-go-bot@users.noreply.github.com"
          git add NembraUITests/ES80ResearchCaptureUITests.swift
          git commit -m "test(capture): refresh research-route source contract"
          git push origin HEAD:fix/es80-today-capture-visual-evidence-bc9a/chatgpt56-go
