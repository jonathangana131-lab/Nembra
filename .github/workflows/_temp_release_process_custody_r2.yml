name: Temp Release Process Custody R2

on:
  push:
    branches:
      - integration/es80-v14-release-process-custody-gpt56-go
    paths:
      - .github/workflows/_temp_release_process_custody_r2.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Close producer process authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/ci/xcode27_signed_field_candidate.sh")
          text = path.read_text(encoding="utf-8")

          prologue = "#!/bin/bash\nset -euo pipefail\n"
          replacement = '''#!/bin/bash\nset -euo pipefail\n\n# Release child processes never inherit caller executable-search semantics.\nPATH="/usr/bin:/bin:/usr/sbin:/sbin"\nexport PATH\n'''
          if text.count(prologue) != 1:
              raise SystemExit("could not uniquely locate producer prologue")
          text = text.replace(prologue, replacement, 1)

          old_python = '''PYTHON3="/usr/bin/python3"\nif [[ ! -x "$PYTHON3" || -L "$PYTHON3" ]]; then\n  echo "Signed field-candidate production requires the sealed system Python 3 at $PYTHON3." >&2\n  exit 2\nfi\n'''
          new_python = '''assert_root_custodied_executable() {\n  local executable_path="$1"\n  local executable_label="$2"\n  local current_path="$executable_path"\n  local owner_uid\n  local mode_digits\n  local writable_bits\n\n  if [[ "$executable_path" != /* || ! -f "$executable_path" || ! -x "$executable_path" || -L "$executable_path" ]]; then\n    echo "Signed field-candidate production requires $executable_label to be one absolute regular executable non-symlink: $executable_path" >&2\n    return 1\n  fi\n\n  while :; do\n    if [[ -L "$current_path" ]]; then\n      echo "$executable_label custody path must not contain symlinks: $current_path" >&2\n      return 1\n    fi\n    owner_uid="$(/usr/bin/stat -f %u "$current_path")" || return 1\n    mode_digits="$(/usr/bin/stat -f %Mp%Lp "$current_path")" || return 1\n    if [[ "$owner_uid" != "0" || ! "$mode_digits" =~ ^[0-7]{6}$ ]]; then\n      echo "$executable_label custody path must be root-owned with canonical mode metadata: $current_path" >&2\n      return 1\n    fi\n    writable_bits="${mode_digits: -2}"\n    if (( (8#$writable_bits & 8#22) != 0 )); then\n      echo "$executable_label custody path must not be group/world writable: $current_path" >&2\n      return 1\n    fi\n    [[ "$current_path" == "/" ]] && break\n    current_path="$(/usr/bin/dirname "$current_path")"\n  done\n}\n\nPYTHON3="/usr/bin/python3"\nif ! assert_root_custodied_executable "$PYTHON3" "Python 3"; then\n  exit 2\nfi\n\nrun_git() {\n  env -i \\\n    PATH=/usr/bin:/bin:/usr/sbin:/sbin \\\n    HOME=/var/empty \\\n    LC_ALL=C \\\n    GIT_CONFIG_NOSYSTEM=1 \\\n    GIT_CONFIG_GLOBAL=/dev/null \\\n    GIT_NO_REPLACE_OBJECTS=1 \\\n    /usr/bin/git "$@"\n}\n'''
          if text.count(old_python) != 1:
              raise SystemExit("could not uniquely locate current Python admission block")
          text = text.replace(old_python, new_python, 1)

          lines = []
          for line in text.splitlines(keepends=True):
              if line.lstrip().startswith("#") or "/usr/bin/git" in line or line.startswith("run_git()"):
                  lines.append(line)
                  continue
              lines.append(re.sub(r"(?<![/A-Za-z0-9_])git(?=\s)", "run_git", line))
          text = "".join(lines)

          old_xcode = '''run_xcodebuild() {\n  if [[ "$ALLOW_PROVISIONING_UPDATES" == "1" ]]; then\n    xcodebuild -allowProvisioningUpdates "$@"\n  else\n    xcodebuild "$@"\n  fi\n}\n'''
          new_xcode = '''DEVELOPER_DIR="$(env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin /usr/bin/xcode-select -p)"\nif [[ "$DEVELOPER_DIR" != /* || ! -d "$DEVELOPER_DIR" ]]; then\n  echo "Could not select one absolute installed Xcode developer directory." >&2\n  exit 6\nfi\n\nrun_xcodebuild() {\n  if [[ "${1:-}" == "-version" ]]; then\n    env -i \\\n      PATH=/usr/bin:/bin:/usr/sbin:/sbin \\\n      DEVELOPER_DIR="$DEVELOPER_DIR" \\\n      /usr/bin/xcodebuild "$@"\n  elif [[ "$ALLOW_PROVISIONING_UPDATES" == "1" ]]; then\n    env -i \\\n      PATH=/usr/bin:/bin:/usr/sbin:/sbin \\\n      DEVELOPER_DIR="$DEVELOPER_DIR" \\\n      /usr/bin/xcodebuild -allowProvisioningUpdates "$@"\n  else\n    env -i \\\n      PATH=/usr/bin:/bin:/usr/sbin:/sbin \\\n      DEVELOPER_DIR="$DEVELOPER_DIR" \\\n      /usr/bin/xcodebuild "$@"\n  fi\n}\n\nXCODE_VERSION_OUTPUT="$(run_xcodebuild -version)"\ncase "$XCODE_VERSION_OUTPUT" in\n  "Xcode 27"*) ;;\n  *)\n    echo "Signed field-candidate production requires the selected toolchain to report Xcode 27." >&2\n    printf '%s\\n' "$XCODE_VERSION_OUTPUT" >&2\n    exit 6\n    ;;\nesac\n'''
          if text.count(old_xcode) != 1:
              raise SystemExit("could not uniquely locate ambient Xcode wrapper")
          text = text.replace(old_xcode, new_xcode, 1)

          raw_git = [
              line for line in text.splitlines()
              if not line.lstrip().startswith("#")
              and "/usr/bin/git" not in line
              and re.search(r"(^|[;&|$(]\s*)git\s", line)
          ]
          if raw_git:
              raise SystemExit(f"raw Git invocation remains: {raw_git}")
          raw_xcode = [
              line for line in text.splitlines()
              if not line.lstrip().startswith("#")
              and "/usr/bin/xcodebuild" not in line
              and re.search(r"(^|[;&|$(]\s*)xcodebuild(?:\s|$)", line)
          ]
          if raw_xcode:
              raise SystemExit(f"raw Xcode invocation remains: {raw_xcode}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Wire custody contracts into exact-head gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/xcode27-pr-command.yml")
          text = path.read_text(encoding="utf-8")

          tests = '''          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_process_custody_source.py\n          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_process_custody_source.py\n          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_git_environment_custody_source.py\n          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_git_environment_custody_source.py\n          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_xcode_environment_custody_source.py\n          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_xcode_environment_custody_source.py\n'''

          fast_anchor = '          python3 scripts/ci/es80_field_authorization_envelope.py --self-test\n'
          if text.count(fast_anchor) < 1:
              raise SystemExit("could not locate Ubuntu authority-tooling anchor")
          text = text.replace(fast_anchor, fast_anchor + tests, 1)

          mac_anchor = '          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_intended_device.py\n'
          if text.count(mac_anchor) != 1:
              raise SystemExit("could not uniquely locate Mac producer-source anchor")
          text = text.replace(mac_anchor, mac_anchor + tests, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate portable release-process custody
        run: |
          bash -n scripts/ci/xcode27_signed_field_candidate.sh
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_process_custody_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_git_environment_custody_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_signed_field_candidate_xcode_environment_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_process_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_git_environment_custody_source.py
          python3 scripts/ci/tests/test_xcode27_signed_field_candidate_xcode_environment_custody_source.py
          git diff --check

      - name: Commit hardening and self-delete
        run: |
          rm .github/workflows/_temp_release_process_custody_r2.yml
          git config user.name "nembra-v14-bot"
          git config user.email "nembra-v14-bot@users.noreply.github.com"
          git add scripts/ci/xcode27_signed_field_candidate.sh \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_process_custody_source.py \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_git_environment_custody_source.py \
                  scripts/ci/tests/test_xcode27_signed_field_candidate_xcode_environment_custody_source.py \
                  .github/workflows/xcode27-pr-command.yml \
                  .github/workflows/_temp_release_process_custody_r2.yml
          git commit -m "[Capture red-team v14] Close release process semantic custody"
          git push origin HEAD:integration/es80-v14-release-process-custody-gpt56-go
