name: TEMP V14 Final GO control worktree custody
on:
  push:
    branches: [repair/v14-final-go-control-worktree-custody-sol]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply repair and validate authority suites
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/temp_v14_control_worktree_custody.py
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/es80_authenticated_stationary_signed_artifact.py scripts/ci/tests/test_es80_final_go_control_worktree_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact_device_custody.py
          python3 scripts/ci/tests/test_es80_final_go_control_worktree_custody.py
          git diff --check
      - name: Publish clean production repair
        shell: bash
        run: |
          set -euo pipefail
          base=1b1ebd2cdd6073e1411d10a622128bed4c96bafc
          rm -f scripts/ci/temp_v14_control_worktree_custody.py .github/workflows/temp-v14-final-go-control-worktree-custody.yml
          git add -A
          git diff --cached --check
          git config user.name nembra-v14-sol
          git config user.email nembra-v14-sol@users.noreply.github.com
          git commit -m 'fix(capture): bind Final-GO control worktree bytes'
          expected=$'.github/workflows/capture-authenticated-stationary-final-go.yml\nscripts/ci/es80_authenticated_stationary_final_go.py\nscripts/ci/tests/test_es80_final_go_control_worktree_custody.py'
          test "$(git diff --name-only "$base"..HEAD | sort)" = "$expected"
          git push origin HEAD:repair/v14-final-go-control-worktree-custody-sol
