name: chat-m6v2q terminal resolution gate

on:
  push:
    branches:
      - parallel/es80-terminal-fresh-reopen/chat-m6v2q-4
    paths:
      - .github/workflows/chat-m6v2q-terminal-resolution-gate.yml

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: parallel/es80-terminal-fresh-reopen/chat-m6v2q-4
          fetch-depth: 0

      - name: Require resolved-by-retirement authority before terminal reopen
        env:
          EXPECTED_PARENT: 2f92959437aa58034f1c93368f0a1d258a9ef9c2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          gate_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift')
          gate = gate_path.read_text()
          gate = gate.replace(
              '        case terminalQueueChangedAfterRetirement(expected: UInt64, actual: UInt64)\n        case retainedEvidenceRoutingRequired(retainedCount: Int)\n',
              '        case terminalQueueChangedAfterResolution(expected: UInt64, actual: UInt64)\n',
              1,
          )

          start = gate.index('    /// Reopens boundary admission after a completed terminal Horizon only when\n')
          end = gate.index('    /// Requests a fresh lifecycle grammar only when no observation transaction has\n', start)
          replacement = '''    /// Reopens boundary admission after a completed terminal Horizon only when\n    /// producer-issued queue-resolution proof matches the exact terminal transaction\n    /// and the controller has already created a strictly newer durable target\n    /// session/recorder generation.\n    ///\n    /// Resolution authority is intentionally stronger than the lower-level retirement\n    /// receipt. `PassiveCoreBluetoothTerminalQueueResolution` has already proven that\n    /// the complete post-H suffix was retired with zero retained evidence and that the\n    /// controller's prior globally-resolved frontier was exactly H. Those positions are\n    /// therefore resolved-by-retirement, never relabeled as recorder-written evidence.\n    ///\n    /// The call is synchronous and MainActor-isolated. The controller must resolve the\n    /// terminal queue and consume this receipt without an intervening `await`; any\n    /// callback that advances the global queue tail invalidates the receipt. On success\n    /// the exact fresh target-session generation is bound until its first Ready begins,\n    /// matching the pre-H recovery grammar. Transaction revision remains monotonic\n    /// because this gate instance is preserved.\n    @MainActor\n    mutating func reopenAfterTerminalQueueResolution(\n        _ resolution: PassiveCoreBluetoothTerminalQueueResolution.Receipt,\n        currentLastEnqueuedEventSequence: UInt64,\n        freshTargetSessionGeneration: UInt64\n    ) throws {\n        guard case let .terminal(transaction) = phase else {\n            throw StateError.invalidTransition\n        }\n        guard resolution.terminalTransactionRevision == transaction.revision,\n              resolution.horizonQueueCutoff == transaction.queueCutoff,\n              resolution.previouslyResolvedThroughQueueSequence == transaction.queueCutoff else {\n            throw StateError.staleTransaction\n        }\n        guard resolution.terminalAuthority == transaction.authority else {\n            throw StateError.authorityChanged\n        }\n        guard resolution.resolvedThroughQueueSequence == currentLastEnqueuedEventSequence else {\n            throw StateError.terminalQueueChangedAfterResolution(\n                expected: resolution.resolvedThroughQueueSequence,\n                actual: currentLastEnqueuedEventSequence\n            )\n        }\n        guard freshTargetSessionGeneration > transaction.authority.targetSessionGeneration else {\n            throw StateError.freshTargetSessionRequired\n        }\n\n        committedReadyTransaction = nil\n        requiredReadyTargetSessionGeneration = freshTargetSessionGeneration\n        phase = .awaitingReady\n    }\n\n'''
          gate = gate[:start] + replacement + gate[end:]
          gate = gate.replace(
              '    /// recovery or post-H terminal retirement recovery. Terminal artifact freeze alone\n    /// likewise stays closed until the receipt-gated transition above succeeds.\n',
              '    /// recovery or post-H resolved-by-retirement recovery. Terminal artifact freeze\n    /// alone likewise stays closed until the resolution-gated transition above succeeds.\n',
              1,
          )
          if 'reopenAfterTerminalQueueRetirement' in gate:
              raise SystemExit('lower-level retirement reopen API remains')
          if 'retainedEvidenceRoutingRequired(retainedCount' in gate:
              raise SystemExit('gate still duplicates lower-level retained-evidence policy')
          gate_path.write_text(gate)

          tests = textwrap.dedent(r'''\
          import Testing
          @testable import NembraBluetoothCapture

          @MainActor
          struct PassiveCoreBluetoothObservationBoundaryQueueGateFreshReopenTests {
              private typealias Gate = PassiveCoreBluetoothObservationBoundaryQueueGate
              private typealias Retirement = PassiveCoreBluetoothTerminalQueueRetirement
              private typealias Resolution = PassiveCoreBluetoothTerminalQueueResolution

              private struct Event: Equatable {
                  let queueSequence: UInt64
                  let authority: PassiveCoreBluetoothArtifactAuthorityContext
              }

              private let terminalAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                  targetSessionGeneration: 7,
                  authorityGeneration: 11
              )

              @Test
              func exactResolutionBindsExactFreshSessionAndPreservesRevision() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  var events = [
                      Event(queueSequence: 13, authority: terminalAuthority),
                      Event(queueSequence: 14, authority: terminalAuthority)
                  ]
                  let resolution = try resolutionReceipt(events: &events, currentTail: 14, gate: gate)
                  #expect(events.isEmpty)
                  #expect(resolution.previouslyResolvedThroughQueueSequence == 12)
                  #expect(resolution.resolvedThroughQueueSequence == 14)

                  try gate.reopenAfterTerminalQueueResolution(
                      resolution,
                      currentLastEnqueuedEventSequence: 14,
                      freshTargetSessionGeneration: 8
                  )
                  #expect(gate.phase == .awaitingReady)

                  let sealedSessionNewAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 7,
                      authorityGeneration: 12
                  )
                  let sealedError = captureGateError {
                      _ = try gate.begin(
                          .finiteAcquisitionReady,
                          through: 14,
                          authority: sealedSessionNewAuthority
                      )
                  }
                  #expect(sealedError == .freshTargetSessionRequired)

                  let unrelatedNewerSession = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 9,
                      authorityGeneration: 1
                  )
                  let unrelatedError = captureGateError {
                      _ = try gate.begin(
                          .finiteAcquisitionReady,
                          through: 14,
                          authority: unrelatedNewerSession
                      )
                  }
                  #expect(unrelatedError == .freshTargetSessionRequired)

                  let exactFreshAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 8,
                      authorityGeneration: 1
                  )
                  let nextReady = try gate.begin(
                      .finiteAcquisitionReady,
                      through: 14,
                      authority: exactFreshAuthority
                  )
                  #expect(nextReady.revision == terminal.horizon.revision + 1)
                  #expect(nextReady.revision == 3)
                  #expect(nextReady.authority == exactFreshAuthority)
              }

              @Test
              func terminalRecoveryRejectsNonFreshSessionBeforeMutation() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  var events: [Event] = []
                  let resolution = try resolutionReceipt(events: &events, currentTail: 12, gate: gate)

                  let error = captureGateError {
                      try gate.reopenAfterTerminalQueueResolution(
                          resolution,
                          currentLastEnqueuedEventSequence: 12,
                          freshTargetSessionGeneration: 7
                      )
                  }
                  #expect(error == .freshTargetSessionRequired)
                  #expect(gate.phase == .terminal(terminal.horizon))
              }

              @Test
              func normalResetCannotEraseTerminalFreshSessionBinding() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  var events: [Event] = []
                  let resolution = try resolutionReceipt(events: &events, currentTail: 12, gate: gate)

                  try gate.reopenAfterTerminalQueueResolution(
                      resolution,
                      currentLastEnqueuedEventSequence: 12,
                      freshTargetSessionGeneration: 8
                  )
                  let resetAccepted = gate.resetForNewCaptureSession()
                  #expect(resetAccepted)

                  let wrongAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 9,
                      authorityGeneration: 1
                  )
                  let wrongError = captureGateError {
                      _ = try gate.begin(
                          .finiteAcquisitionReady,
                          through: 12,
                          authority: wrongAuthority
                      )
                  }
                  #expect(wrongError == .freshTargetSessionRequired)

                  let exactAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 8,
                      authorityGeneration: 1
                  )
                  let accepted = try gate.begin(
                      .finiteAcquisitionReady,
                      through: 12,
                      authority: exactAuthority
                  )
                  #expect(accepted.authority == exactAuthority)
              }

              @Test
              func callbackArrivalAfterResolutionKeepsGateTerminal() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  var events = [
                      Event(queueSequence: 13, authority: terminalAuthority),
                      Event(queueSequence: 14, authority: terminalAuthority)
                  ]
                  let resolution = try resolutionReceipt(events: &events, currentTail: 14, gate: gate)

                  let error = captureGateError {
                      try gate.reopenAfterTerminalQueueResolution(
                          resolution,
                          currentLastEnqueuedEventSequence: 15,
                          freshTargetSessionGeneration: 8
                      )
                  }
                  #expect(error == .terminalQueueChangedAfterResolution(expected: 14, actual: 15))
                  #expect(gate.phase == .terminal(terminal.horizon))
                  #expect(gate.permittedDrainUpperBound(firstPending: 15, pendingTail: 15) == nil)
              }

              @Test
              func resolutionFromDifferentTerminalTransactionFailsAtomically() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  let otherTerminal = try terminalGate(horizonQueueCutoff: 13, authority: terminalAuthority)
                  var otherEvents: [Event] = []
                  let otherResolution = try resolutionReceipt(
                      events: &otherEvents,
                      currentTail: 13,
                      gate: otherTerminal.gate
                  )

                  let error = captureGateError {
                      try gate.reopenAfterTerminalQueueResolution(
                          otherResolution,
                          currentLastEnqueuedEventSequence: 13,
                          freshTargetSessionGeneration: 8
                      )
                  }
                  #expect(error == .staleTransaction)
                  #expect(gate.phase == .terminal(terminal.horizon))
              }

              @Test
              func resolutionFromDifferentArtifactAuthorityFailsAtomically() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  let otherAuthority = PassiveCoreBluetoothArtifactAuthorityContext(
                      targetSessionGeneration: 8,
                      authorityGeneration: 1
                  )
                  let otherTerminal = try terminalGate(horizonQueueCutoff: 12, authority: otherAuthority)
                  var otherEvents: [Event] = []
                  let otherResolution = try resolutionReceipt(
                      events: &otherEvents,
                      currentTail: 12,
                      gate: otherTerminal.gate
                  )

                  let error = captureGateError {
                      try gate.reopenAfterTerminalQueueResolution(
                          otherResolution,
                          currentLastEnqueuedEventSequence: 12,
                          freshTargetSessionGeneration: 9
                      )
                  }
                  #expect(error == .authorityChanged)
                  #expect(gate.phase == .terminal(terminal.horizon))
              }

              @Test
              func resolutionReceiptCannotBeReplayedAfterSuccessfulReopen() throws {
                  let terminal = try terminalGate(horizonQueueCutoff: 12, authority: terminalAuthority)
                  var gate = terminal.gate
                  var events: [Event] = []
                  let resolution = try resolutionReceipt(events: &events, currentTail: 12, gate: gate)

                  try gate.reopenAfterTerminalQueueResolution(
                      resolution,
                      currentLastEnqueuedEventSequence: 12,
                      freshTargetSessionGeneration: 8
                  )
                  let replayError = captureGateError {
                      try gate.reopenAfterTerminalQueueResolution(
                          resolution,
                          currentLastEnqueuedEventSequence: 12,
                          freshTargetSessionGeneration: 8
                      )
                  }
                  #expect(replayError == .invalidTransition)
                  #expect(gate.phase == .awaitingReady)
              }

              private func resolutionReceipt(
                  events: inout [Event],
                  currentTail: UInt64,
                  gate: Gate
              ) throws -> Resolution.Receipt {
                  let retirement = try Retirement.retire(
                      from: &events,
                      currentLastEnqueuedEventSequence: currentTail,
                      terminalGate: gate
                  ) { event in
                      Retirement.PendingEvidenceIdentity(
                          queueSequence: event.queueSequence,
                          authority: event.authority
                      )
                  }
                  return try Resolution.resolve(
                      currentResolvedThroughQueueSequence: retirement.horizonQueueCutoff,
                      retirementReceipt: retirement
                  )
              }

              private func terminalGate(
                  horizonQueueCutoff: UInt64,
                  authority: PassiveCoreBluetoothArtifactAuthorityContext
              ) throws -> (gate: Gate, horizon: Gate.Transaction) {
                  var gate = Gate()
                  let ready = try gate.begin(
                      .finiteAcquisitionReady,
                      through: 5,
                      authority: authority
                  )
                  try gate.markBoundaryRecorded(
                      ready,
                      lastProcessedQueueSequence: 5,
                      currentAuthority: authority
                  )
                  let horizon = try gate.begin(
                      .observationHorizon,
                      through: horizonQueueCutoff,
                      processedThrough: 8,
                      authority: authority
                  )
                  try gate.markBoundaryRecorded(
                      horizon,
                      lastProcessedQueueSequence: horizonQueueCutoff,
                      currentAuthority: authority
                  )
                  try gate.completeHorizonArtifactFreeze(
                      horizon,
                      currentAuthority: authority
                  )
                  return (gate, horizon)
              }

              private func captureGateError(
                  _ operation: () throws -> Void
              ) -> Gate.StateError? {
                  do {
                      try operation()
                      return nil
                  } catch {
                      return error as? Gate.StateError
                  }
              }
          }
          ''')
          Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateFreshReopenTests.swift').write_text(tests)
          PY

          git config user.name 'nembra-chat-m6v2q'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveCoreBluetoothObservationBoundaryQueueGate.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothObservationBoundaryQueueGateFreshReopenTests.swift
          git rm .github/workflows/chat-m6v2q-terminal-resolution-gate.yml
          git commit -m 'Require resolved FIFO authority before terminal reopen'
          git push origin HEAD:parallel/es80-terminal-fresh-reopen/chat-m6v2q-4
