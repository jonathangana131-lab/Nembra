name: Capture Symlink Lifetime Debug Publish Once

on:
  push:
    branches:
      - repair/v17-capture-read-lease-symlink-lifetime-sol-20260815
    paths:
      - .github/workflows/capture-symlink-lifetime-debug-publish-once.yml

permissions:
  contents: write

env:
  EXACT_PARENT: 16e6ccf5d9736a8c47d4e78eaba86f1cffd02e9c
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  materialize-and-preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reuse exact authoring transform
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/capture-symlink-lifetime-materialize-once.yml').read_text(encoding='utf-8')
          step = source.index('      - name: Materialize lifetime-bound namespace custody\n')
          anchor = "          /usr/bin/python3 -B - <<'PY'\n"
          start = source.index(anchor, step) + len(anchor)
          end = source.index('\n          PY\n', start)
          script = textwrap.dedent(source[start:end]) + '\n'
          compile(script, '<lifetime-materializer>', 'exec', dont_inherit=True)
          Path('/tmp/materialize.py').write_text(script, encoding='utf-8')
          PY
          /usr/bin/python3 -B /tmp/materialize.py
          git diff --check "$EXACT_PARENT"

      - name: Run focused candidate regressions without hiding failure
        id: focused
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_private_read_lease_component_walk.py

      - name: Publish inspectable non-workflow candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_component_walk.py
          git commit -m "Checkpoint private symlink lifetime candidate"
          git push origin HEAD:repair/v17-capture-read-lease-symlink-lifetime-sol-20260815

      - name: Keep construction evidence red if focused regressions failed
        if: steps.focused.outcome != 'success'
        shell: bash
        run: |
          echo '::error title=Lifetime candidate regression failed::Generated product bytes were preserved for inspection; this run is intentionally not acceptance.'
          exit 1
