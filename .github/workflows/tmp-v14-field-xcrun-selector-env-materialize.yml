name: TEMP V14 Field Xcrun Selector Env Materialize

on:
  pull_request:
    paths:
      - scripts/ci/tmp_materialize_field_xcrun_selector_env.py
      - .github/workflows/tmp-v14-field-xcrun-selector-env-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Bind exact construction checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize and validate xcrun selector fence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tmp_materialize_field_xcrun_selector_env.py
          python3 -m py_compile scripts/ci/tests/test_capture_field_xcrun_environment_authority.py
          python3 scripts/ci/tests/test_capture_field_xcrun_environment_authority.py
          if test -f scripts/ci/tests/test_capture_field_developer_dir_authority.py; then
            python3 scripts/ci/tests/test_capture_field_developer_dir_authority.py
          fi
          python3 scripts/ci/tests/test_capture_field_xcode_environment_authority.py
          bash -n scripts/field/install_one_time_capture.command
          git diff --check
      - name: Publish clean production successor
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -f scripts/ci/tmp_materialize_field_xcrun_selector_env.py
          rm -f .github/workflows/tmp-v14-field-xcrun-selector-env-materialize.yml
          git add scripts/field/install_one_time_capture.command \
                  scripts/ci/tests/test_capture_field_xcrun_environment_authority.py \
                  .github/workflows/capture-field-xcrun-environment-authority-redteam.yml \
                  scripts/ci/tmp_materialize_field_xcrun_selector_env.py \
                  .github/workflows/tmp-v14-field-xcrun-selector-env-materialize.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "nembra-swarm-bot"
          git config user.email "nembra-swarm-bot@users.noreply.github.com"
          git commit -m "Fence caller xcrun SDK and toolchain selectors"
          git push origin "HEAD:${HEAD_REF}"
