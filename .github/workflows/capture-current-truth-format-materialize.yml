name: Normalize Capture Current Truth Formatting

on:
  push:
    branches:
      - agent/capture-current-truth-convergence-1c40

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-current-truth-convergence-1c40
      - name: Normalize only reviewed cleanup blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = p.read_text(encoding='utf-8')
          replacements = {
          '''        if phase == .correlated || phase == .selected {
    resetDiscoverySessionOnly()
    phase = .failed
    message = "Correlated target authority ended with Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."
    log("target_correlation_authority_revoked_on_view_exit")
    return
}
          ''': '''        if phase == .correlated || phase == .selected {
            resetDiscoverySessionOnly()
            phase = .failed
            message = "Correlated target authority ended with Secure Link. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series."
            log("target_correlation_authority_revoked_on_view_exit")
            return
        }
          ''',
          '''        if phase == .correlated || phase == .selected {
    resetDiscoverySessionOnly()
    phase = .failed
    message = "Capture left the foreground after target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; pre-background target authority is never reusable evidence."
    log("foreground_integrity_lost_after_target_correlation")
    return
}
          ''': '''        if phase == .correlated || phase == .selected {
            resetDiscoverySessionOnly()
            phase = .failed
            message = "Capture left the foreground after target correlation. Restart from OFF1 with a fresh OFF1→ON1→OFF2→ON2 series; pre-background target authority is never reusable evidence."
            log("foreground_integrity_lost_after_target_correlation")
            return
        }
          ''',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit('reviewed cleanup formatting shape changed')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/capture-current-truth-format-materialize.yml').unlink()
          PY
          git diff --check
      - name: Verify effective scope
        shell: bash
        run: |
          set -euo pipefail
          base='1c40853f6991b4d09206df1d25ecff021458b7eb'
          test "$(git diff --name-only "$base" | sort)" = "$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundIntegrityCurrentSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift' | sort)"
      - name: Commit formatting correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(capture): normalize lifecycle cleanup formatting'
          git push origin HEAD:agent/capture-current-truth-convergence-1c40
