name: Bluetooth Capture Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'parallel/es80-corebluetooth-adapter/**'
      - 'feature/es80-corebluetooth-adapter-**'

permissions:
  contents: read

concurrency:
  group: nembra-bluetooth-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Build and test CoreBluetooth adapter
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Guard passive adapter against application writes
        run: |
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 capture adapter must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

      - name: Test NembraBluetoothCapture on macOS runner
        run: swift test --package-path Packages/NembraBluetoothCapture

      - name: Build NembraBluetoothCapture for iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          xcodebuild \
            -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
