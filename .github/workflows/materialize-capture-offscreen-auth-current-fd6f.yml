name: Materialize Current Capture Off-Screen Auth Retirement

on:
  push:
    branches: [agent/capture-offscreen-auth-current-fd6f]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capture-offscreen-auth-current-fd6f
          fetch-depth: 0
      - name: Apply exact-current repair without regressing newer navigation tests
        shell: bash
        run: |
          set -euo pipefail
          parent='fd6f7b508912d6a956d4ab2f9d5faf7c0049dd56'
          test "$(git rev-parse HEAD^)" = "$parent"
          test "$(git rev-parse HEAD:NembraApp/App/NembraCaptureEntrypoint.swift)" = '68612e5a9acaba9f1a90f3b6e9ad84ebb9b7ec52'

          # The reviewed source repair was materialized on b5b4e13e... from the identical
          # Entrypoint blob. Carry only that product file; retain the newer current-product tests.
          git checkout b5b4e13e889a8807efdc558c8de172544ffd0a79 -- NembraApp/App/NembraCaptureEntrypoint.swift

          python3 - <<'PY'
          from pathlib import Path
          tp=Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift')
          t=tp.read_text()
          marker='''    @Test("cleanup reuses transport-first package abandonment path")\n'''
          addition='''    @Test("view exit fences pending official ledger generation before SDK connect")\n    func viewExitFencesPendingOfficialAuthentication() throws {\n        let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")\n        let controller = String(try section(\n            in: source,\n            from: "private final class SecureLinkController",\n            to: "@MainActor\\nprivate protocol OfficialTuyaDriver"\n        ))\n        let cleanup = String(try section(\n            in: controller,\n            from: "func abandonCorrelationForViewExit()",\n            to: "var privateConfig: Bool"\n        ))\n        let begin = String(try section(\n            in: controller,\n            from: "private func beginOfficialConnection(candidate: Candidate)",\n            to: "private func authenticated(token: TuyaReadOnlyConnectionToken)"\n        ))\n\n        let requestRevoke = try requiredOffset(containing: "officialConnectionRequestID = UUID()", in: cleanup)\n        let tokenRetirement = try requiredOffset(containing: "if let token = currentConnectionToken", in: cleanup)\n        #expect(requestRevoke < tokenRetirement)\n        #expect(cleanup.contains("watchdog?.cancel()"))\n        #expect(cleanup.contains("invalidateInternalLifecycle("))\n        #expect(cleanup.contains("if phase == .authenticating"))\n        #expect(cleanup.contains("authentication_start_abandoned_on_view_exit"))\n        #expect(!cleanup.contains("disconnectBLE"))\n\n        #expect(begin.contains("let connectionRequestID = UUID()"))\n        #expect(begin.contains("officialConnectionRequestID = connectionRequestID"))\n        #expect(begin.components(separatedBy: "self.officialConnectionRequestID == connectionRequestID").count - 1 == 2)\n        let finalTokenFence = try requiredOffset(containing: "self.currentConnectionToken == token", in: begin)\n        let sdkConnect = try requiredOffset(containing: "newDriver.connect(", in: begin)\n        #expect(finalTokenFence < sdkConnect)\n    }\n\n'''
          if t.count(marker) != 1: raise SystemExit('current navigation test insertion anchor drifted')
          tp.write_text(t.replace(marker, addition + marker, 1))
          PY

          python3 - <<'PY'
          from pathlib import Path
          s=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          a=s.index('func abandonCorrelationForViewExit()'); b=s.index('var privateConfig: Bool',a); cleanup=s[a:b]
          for token in ('officialConnectionRequestID = UUID()','if let token = currentConnectionToken','invalidateInternalLifecycle(','if phase == .authenticating'):
              assert token in cleanup
          assert cleanup.index('officialConnectionRequestID = UUID()') < cleanup.index('if let token = currentConnectionToken')
          assert 'disconnectBLE' not in cleanup
          a=s.index('private func beginOfficialConnection(candidate: Candidate)'); b=s.index('private func authenticated(token:',a); begin=s[a:b]
          assert begin.count('self.officialConnectionRequestID == connectionRequestID') == 2
          assert begin.rindex('self.currentConnectionToken == token') < begin.index('newDriver.connect(')
          for forbidden in ('publishDps','writeValue','disconnectBLE'):
              assert forbidden not in begin
          print('current off-screen official-auth retirement: PASS')
          PY

          git diff --check
          rm .github/workflows/materialize-capture-offscreen-auth-current-fd6f.yml
          git config user.name nembra-v14-bot
          git config user.email nembra-v14-bot@users.noreply.github.com
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaNavigationBLELeaseRetirementSourceTests.swift .github/workflows/materialize-capture-offscreen-auth-current-fd6f.yml
          git diff --cached --check
          git commit -m 'fix(capture): retire off-screen official authentication'
          git push origin HEAD:agent/capture-offscreen-auth-current-fd6f
