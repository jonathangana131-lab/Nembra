name: Materialize Capture Account UID Custody Sol

on:
  push:
    branches:
      - fix/v14-capture-current-truth-closure-1c408-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify current donor and helper scope
        shell: bash
        run: |
          set -euo pipefail
          base='1c40853f6991b4d09206df1d25ecff021458b7eb'
          prior='3c64982ce4bb9433577672583d6e7fe24d591a90'
          test "$(git rev-parse HEAD^)" = "$prior"
          test "$(git merge-base HEAD "$base")" = "$base"
          git diff --quiet '460343632ca50e559a510b3214c37ed17b3c3200' HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          mapfile -t changed < <(git diff --name-only "$base"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 6
          test "${changed[0]}" = '.github/workflows/materialize-capture-account-uid-custody-sol.yml'
          test "${changed[1]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[2]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift'
          test "${changed[3]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift'
          test "${changed[4]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundPostCorrelationRevocationSourceTests.swift'
          test "${changed[5]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift'

      - name: Bind application export custody to verified account UID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          def mutate_section(text, start_marker, end_marker, mutation):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              changed = mutation(section)
              return text[:start] + changed + text[end:]

          def repair_receiver(section):
              old_guard = '              accountIdentityLeaseIsAuthorized,\n              let driver else {'
              new_guard = '              accountIdentityLeaseIsAuthorized,\n              let membershipAccountUID,\n              !membershipAccountUID.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty,\n              let driver else {'
              if section.count(old_guard) != 1:
                  raise SystemExit(f'expected one account-lease guard seam, found {section.count(old_guard)}')
              section = section.replace(old_guard, new_guard, 1)
              admission = '        applicationUpdateAdmissionsInFlight += 1\n'
              if section.count(admission) != 1:
                  raise SystemExit(f'expected one application admission seam, found {section.count(admission)}')
              export_safe = '        let exportSafeUpdate = Self.redactingVerifiedAccountUID(in: update, accountUID: membershipAccountUID)\n\n'
              section = section.replace(admission, export_safe + admission, 1)
              old_log = 'log("tuya_application_update", update.merging(['
              new_log = 'log("tuya_application_update", exportSafeUpdate.merging(['
              if section.count(old_log) != 1:
                  raise SystemExit(f'expected one application event custody seam, found {section.count(old_log)}')
              return section.replace(old_log, new_log, 1)

          source = mutate_section(
              source,
              '    private func receivedApplicationUpdate(',
              '    private func startWatchdog',
              repair_receiver,
          )

          marker = '    private func startWatchdog(token: TuyaReadOnlyConnectionToken) {\n'
          if source.count(marker) != 1:
              raise SystemExit(f'expected one watchdog marker, found {source.count(marker)}')
          lines = [
              '    private static func redactingVerifiedAccountUID(',
              '        in update: [String: String],',
              '        accountUID: String',
              '    ) -> [String: String] {',
              '        let uid = accountUID.trimmingCharacters(in: .whitespacesAndNewlines)',
              '        guard !uid.isEmpty else { return [:] }',
              '        let marker = "<redacted-account-uid>"',
              '        var sanitized: [String: String] = [:]',
              '        for key in update.keys.sorted() {',
              '            guard let value = update[key] else { continue }',
              '            let redactedKey = key.replacingOccurrences(of: uid, with: marker, options: [.literal])',
              '            let safeValue = value.replacingOccurrences(of: uid, with: marker, options: [.literal])',
              '            var safeKey = redactedKey',
              '            var collisionIndex = 2',
              '            while sanitized[safeKey] != nil {',
              '                safeKey = "\\(redactedKey)#\\(collisionIndex)"',
              '                collisionIndex += 1',
              '            }',
              '            sanitized[safeKey] = safeValue',
              '        }',
              '        return sanitized',
              '    }',
              '',
          ]
          helper = '\n'.join(lines) + '\n'
          source = source.replace(marker, helper + marker, 1)

          duplicate = '        "refreshtoken",\n        "sessionkey",\n        "authkey",\n'
          cleaned = '        "refreshtoken",\n        "authkey",\n'
          if source.count(duplicate) != 1:
              raise SystemExit(f'expected one duplicate sessionkey tail, found {source.count(duplicate)}')
          source = source.replace(duplicate, cleaned, 1)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Verify account identity and event provenance custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = s.index('    private func receivedApplicationUpdate(')
          end = s.index('    private func startWatchdog', start)
          admission = s[start:end]
          assert 'let membershipAccountUID' in admission
          assert 'let exportSafeUpdate = Self.redactingVerifiedAccountUID' in admission
          assert 'log("tuya_application_update", exportSafeUpdate.merging([' in admission
          assert 'log("tuya_application_update", update.merging([' not in admission
          assert ']) { _, trusted in trusted })' in admission
          assert 'private static func redactingVerifiedAccountUID' in admission
          assert 'key.replacingOccurrences(of: uid, with: marker, options: [.literal])' in admission
          assert 'value.replacingOccurrences(of: uid, with: marker, options: [.literal])' in admission
          assert '<redacted-account-uid>' in admission
          driver_start = s.index('@MainActor\nprivate final class SmartLifeDriver')
          driver_end = s.index('#endif\n\nprivate enum AppleAccountAuthorizationError', driver_start)
          driver = s[driver_start:driver_end]
          secret_start = driver.index('private static let secretKeyFragments')
          secret_end = driver.index('private static func redactApplicationSecrets', secret_start)
          fragments = driver[secret_start:secret_end]
          assert fragments.count('"sessionkey"') == 1
          assert '"uid",' not in fragments
          assert '"uid"\n' not in fragments
          print('Capture account-UID + reserved-event provenance custody contract: PASS')
          PY

      - name: Collapse helper to five product paths
        shell: bash
        run: |
          set -euo pipefail
          base='1c40853f6991b4d09206df1d25ecff021458b7eb'
          rm .github/workflows/materialize-capture-account-uid-custody-sol.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundPostCorrelationRevocationSourceTests.swift \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift
          git add -u .github/workflows/materialize-capture-account-uid-custody-sol.yml
          git diff --cached --check
          git -c user.name='nembra-sol' -c user.email='nembra-sol@users.noreply.github.com' commit -m 'fix(capture): scrub verified account UID before event custody'
          mapfile -t changed < <(git diff --name-only "$base" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = 5
          test "${changed[0]}" = 'NembraApp/App/NembraCaptureEntrypoint.swift'
          test "${changed[1]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift'
          test "${changed[2]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift'
          test "${changed[3]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureForegroundPostCorrelationRevocationSourceTests.swift'
          test "${changed[4]}" = 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkViewMembershipStatusRevocationSourceTests.swift'
          git diff --check "$base" HEAD
          git push origin HEAD:fix/v14-capture-current-truth-closure-1c408-sol
