name: Dashboard battery-range materialize once

on:
  push:
    branches:
      - product/dashboard-battery-range-instrument-gpt56sol
    paths:
      - '.github/workflows/dashboard-battery-range-materialize-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-battery-range-materialize-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authoring head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize battery-as-control cockpit instrument
        shell: python
        run: |
          from pathlib import Path

          path = Path('NembraApp/Features/Dashboard/DashboardView.swift')
          source = path.read_text()

          old_instrument = '''    private var batteryRangeInstrument: some View {
        Button {
            batteryReadout = batteryReadout == .charge ? .range : .charge
        } label: {
            VStack(alignment: .leading, spacing: 5) {
                HStack(spacing: 5) {
                    Image(systemName: batteryReadout == .charge ? batteryIcon : "location.fill")
                    Text(batteryReadout == .charge ? "BATTERY" : "RANGE")
                    Image(systemName: "arrow.left.arrow.right")
                        .font(.system(size: 8, weight: .bold))
                        .foregroundStyle(.tertiary)
                }
                .font(.caption2.weight(.bold))
                .tracking(1.1)
                .foregroundStyle(batteryInstrumentWarning ? Color.red : Color.secondary)

                Text(batteryPrimaryText)
                    .font(.title3.weight(.semibold).monospacedDigit())
                    .foregroundStyle(batteryPrimaryColor)
                    .contentTransition(reduceMotion ? .identity : .numericText())
                    .lineLimit(1)
                    .minimumScaleFactor(0.72)

                batteryChargeBar
                    .frame(width: 82)

                if isRetainedBatteryData, batteryPercent != nil {
                    Text("LAST KNOWN")
                        .font(.caption2.weight(.bold))
                        .tracking(1.0)
                        .foregroundStyle(.orange)
                } else if batteryReadout == .range {
                    Text("NOT CALIBRATED")
                        .font(.caption2.weight(.bold))
                        .tracking(0.8)
                        .foregroundStyle(.secondary)
                }
            }
            .frame(maxWidth: .infinity, alignment: .leading)
            .contentShape(Rectangle())
        }
        .buttonStyle(.plain)
        .frame(minWidth: 44, minHeight: 44, alignment: .leading)
        .sensoryFeedback(.selection, trigger: batteryReadout)
        .accessibilityElement(children: .ignore)
        .accessibilityLabel(batteryReadout == .charge ? "Battery" : "Estimated range")
        .accessibilityValue(batteryAccessibilityValue)
        .accessibilityHint("Double tap to switch between battery charge and range. Range remains unavailable until Nembra has verified battery evidence and a learned range model.")
        .accessibilityIdentifier("dashboard.battery-range")
    }

    private var batteryChargeBar: some View {
        GeometryReader { proxy in
            ZStack(alignment: .leading) {
                Capsule(style: .continuous)
                    .fill(Color.white.opacity(colorSchemeContrast == .increased ? 0.22 : 0.10))

                if let fill = batteryFillFraction {
                    Capsule(style: .continuous)
                        .fill(batteryInstrumentWarning ? Color.red : Color.white.opacity(isRetainedBatteryData ? 0.48 : 0.92))
                        .frame(width: max(2, proxy.size.width * fill))
                }
            }
        }
        .frame(height: colorSchemeContrast == .increased ? 5 : 3)
        .accessibilityHidden(true)
    }
'''

          new_instrument = '''    private var batteryRangeInstrument: some View {
        Button {
            batteryReadout = batteryReadout == .charge ? .range : .charge
        } label: {
            VStack(alignment: .leading, spacing: 7) {
                HStack(spacing: 10) {
                    batterySilhouette

                    VStack(alignment: .leading, spacing: 2) {
                        Text(batteryReadout == .charge ? "BATTERY" : "LEARNED RANGE")
                            .font(.caption2.weight(.bold))
                            .tracking(1.1)
                            .foregroundStyle(batteryInstrumentWarning ? Color.red : Color.secondary)

                        Text(batteryPrimaryText)
                            .font(.title3.weight(.semibold).monospacedDigit())
                            .foregroundStyle(batteryPrimaryColor)
                            .contentTransition(reduceMotion ? .identity : .numericText())
                            .lineLimit(1)
                            .minimumScaleFactor(0.72)
                    }
                }

                if isRetainedBatteryData, batteryPercent != nil {
                    Text("LAST KNOWN")
                        .font(.caption2.weight(.bold))
                        .tracking(1.0)
                        .foregroundStyle(.orange)
                } else if batteryReadout == .range {
                    Text("NOT CALIBRATED")
                        .font(.caption2.weight(.bold))
                        .tracking(0.8)
                        .foregroundStyle(.secondary)
                } else {
                    Text("TAP FOR RANGE")
                        .font(.caption2.weight(.bold))
                        .tracking(0.8)
                        .foregroundStyle(.tertiary)
                }
            }
            .frame(maxWidth: .infinity, alignment: .leading)
            .contentShape(Rectangle())
        }
        .buttonStyle(.plain)
        .frame(minWidth: 44, minHeight: 44, alignment: .leading)
        .sensoryFeedback(.selection, trigger: batteryReadout)
        .accessibilityElement(children: .ignore)
        .accessibilityLabel(batteryReadout == .charge ? "Battery" : "Learned range")
        .accessibilityValue(batteryAccessibilityValue)
        .accessibilityHint(batteryAccessibilityHint)
        .accessibilityIdentifier("dashboard.battery-range")
    }

    /// The battery body is the control and its fill always means charge, even when
    /// the adjacent readout is showing learned range. Missing evidence is rendered
    /// as an explicit dash inside an unfilled body so unknown can never resemble 0%.
    private var batterySilhouette: some View {
        ZStack(alignment: .leading) {
            RoundedRectangle(cornerRadius: 6, style: .continuous)
                .strokeBorder(
                    batterySilhouetteWarning ? Color.red : Color.white.opacity(
                        colorSchemeContrast == .increased ? 0.84 : 0.46
                    ),
                    lineWidth: colorSchemeContrast == .increased ? 2 : 1.25
                )

            if let fill = batteryFillFraction, fill > 0 {
                RoundedRectangle(cornerRadius: 3, style: .continuous)
                    .fill(
                        batterySilhouetteWarning
                            ? Color.red
                            : Color.white.opacity(isRetainedBatteryData ? 0.42 : 0.90)
                    )
                    .padding(3)
                    .scaleEffect(x: fill, y: 1, anchor: .leading)
            } else if batteryPercent == nil {
                Text("—")
                    .font(.caption.weight(.semibold).monospacedDigit())
                    .foregroundStyle(.secondary)
                    .frame(maxWidth: .infinity, maxHeight: .infinity)
            }
        }
        .frame(width: 56, height: 28)
        .overlay(alignment: .trailing) {
            Capsule(style: .continuous)
                .fill(
                    batterySilhouetteWarning
                        ? Color.red
                        : Color.white.opacity(colorSchemeContrast == .increased ? 0.84 : 0.46)
                )
                .frame(width: 3, height: 11)
                .offset(x: 5)
        }
        .accessibilityHidden(true)
    }
'''

          old_icon = '''    private var batteryIcon: String {
        guard let battery = batteryPercent else { return "battery.0percent" }
        return switch battery {
        case ...15: "battery.0percent"
        case ...35: "battery.25percent"
        case ...60: "battery.50percent"
        case ...85: "battery.75percent"
        default: "battery.100percent"
        }
    }

'''

          if source.count(old_instrument) != 1:
              raise SystemExit('expected exactly one canonical batteryRangeInstrument block')
          if source.count(old_icon) != 1:
              raise SystemExit('expected exactly one canonical batteryIcon block')

          source = source.replace(old_instrument, new_instrument)
          source = source.replace(old_icon, '')

          anchor = '''    private var batteryAccessibilityValue: String {
        switch batteryReadout {
'''
          if source.count(anchor) != 1:
              raise SystemExit('battery accessibility anchor moved')

          accessibility_hint = '''    private var batteryAccessibilityHint: String {
        switch batteryReadout {
        case .charge:
            "Double tap to show learned range."
        case .range:
            "Double tap to show battery charge."
        }
    }

'''
          source = source.replace(anchor, accessibility_hint + anchor)

          warning_anchor = '''    private var batteryInstrumentWarning: Bool {
        batteryReadout == .charge && isBatteryLow && !isRetainedBatteryData
    }

'''
          if source.count(warning_anchor) != 1:
              raise SystemExit('battery warning anchor moved')
          source = source.replace(
              warning_anchor,
              warning_anchor + '''    private var batterySilhouetteWarning: Bool {
        isBatteryLow && !isRetainedBatteryData
    }

'''
          )

          path.write_text(source)

      - name: Verify truth and presentation boundaries
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          source='NembraApp/Features/Dashboard/DashboardView.swift'
          grep -Fq 'private var batterySilhouette: some View' "$source"
          grep -Fq 'batteryReadout == .charge ? "BATTERY" : "LEARNED RANGE"' "$source"
          grep -Fq 'else if batteryPercent == nil' "$source"
          grep -Fq 'batterySilhouetteWarning' "$source"
          grep -Fq 'Double tap to show learned range.' "$source"
          grep -Fq 'Double tap to show battery charge.' "$source"
          test "$(grep -Fc 'battery.0percent' "$source" || true)" = 0
          test "$(grep -Fc 'arrow.left.arrow.right' "$source" || true)" = 0
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = 'NembraApp/Features/Dashboard/DashboardView.swift'

      - name: Publish direct product source and retire authoring workflow
        shell: bash
        env:
          TARGET_BRANCH: product/dashboard-battery-range-instrument-gpt56sol
          AUTHORING_WORKFLOW: .github/workflows/dashboard-battery-range-materialize-once.yml
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          rm -f "$AUTHORING_WORKFLOW"
          git add -- NembraApp/Features/Dashboard/DashboardView.swift "$AUTHORING_WORKFLOW"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Dashboard: make battery body the truthful range toggle'
          git push origin HEAD:"$TARGET_BRANCH"
