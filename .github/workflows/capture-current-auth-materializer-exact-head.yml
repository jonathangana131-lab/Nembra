name: Capture Current Authorization Materializer Exact-Head

on:
  pull_request:
    branches:
      - product/capture-1-0-main-20260818
    paths:
      - 'scripts/ci/es80_materialize_current_app_authorization.py'
      - 'scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py'
      - '.github/workflows/capture-app-authorization-close-one-shot.yml'
      - '.github/workflows/capture-current-auth-materializer-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-current-auth-materializer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-materialization:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      APP_SOURCE: NembraApp/App/NembraCaptureEntrypoint.swift
      EXPECTED_PREWIRING_BLOB: 627c17949d15aaf26ca28c12abb9bb684ab0e731
    steps:
      - name: Checkout immutable subject
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact subject and pre-wiring source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD:"$APP_SOURCE")" = "$EXPECTED_PREWIRING_BLOB"
          test -f .github/workflows/capture-app-authorization-close-one-shot.yml
          test -f scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize reviewed lifecycle under current authority contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m py_compile scripts/ci/es80_materialize_current_app_authorization.py
          /usr/bin/python3 -I scripts/ci/es80_materialize_current_app_authorization.py --repository-root .
          git diff --check
          test "$(git status --porcelain=v1 | awk '{print $2}' | sort | tr '\n' ' ' | sed 's/ $//')" = "$APP_SOURCE"
          test "$(grep -Fc 'isAuthoritativeFieldBuild = true' "$APP_SOURCE" || true)" = 0

      - name: Enforce current real-app lifecycle contract before publication
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/tests/test_es80_app_authorization_lifecycle_wiring.py

      - name: Run focused package authorization contracts
        working-directory: Packages/NembraBluetoothCapture
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter AuthenticatedStationaryCaptureAppSessionTests
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthorizationInboxAppAdapter
          swift test --filter CaptureSimulatorQAHarnessSourceTests_AuthenticatedFieldCapabilityAppWiring
          swift test --filter TuyaAuthenticatedFieldCapabilityArtifactFreezeSourceTests

      - name: Build generated standalone Capture on Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project NembraCapture.xcodeproj \
            -scheme 'Nembra Capture' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NembraCaptureCurrentAuthMaterializer" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Preserve non-authorizing boundary
        if: success()
        shell: bash
        run: |
          printf '%s\n' 'PROVEN: this exact source head deterministically materializes an app that passes the current lifecycle source contract, focused authorization contracts, and Xcode 27 build.'
          printf '%s\n' 'NOT PROVEN: field-build authority, production trust root/private key, installed-app transport, live iPhone/ES80 authorization, telemetry semantics, commands, or physical GO.'
