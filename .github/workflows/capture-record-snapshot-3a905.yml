name: Capture Record Snapshot 3A905
on:
  push:
    branches: [sol/v14-capture-record-snapshot-3a905-sol]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.actor != 'github-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-record-snapshot-3a905-sol
          fetch-depth: 0
      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='3a90503b9f668c1bc696fa32ee8937e646dff12d'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- Scripts/capture_tuya_private_input_provenance.py
          test -f scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
      - name: Apply and verify whole-record fence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_record_snapshot_3a905.py apply
          python3 scripts/ci/materialize_capture_record_snapshot_3a905.py verify
          python3 -m py_compile Scripts/capture_tuya_private_input_provenance.py scripts/ci/materialize_capture_record_snapshot_3a905.py scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python3 scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py
          git diff --check
      - name: Publish clean two-path result
        shell: bash
        run: |
          set -euo pipefail
          parent='3a90503b9f668c1bc696fa32ee8937e646dff12d'
          rm .github/workflows/capture-record-snapshot-3a905.yml
          rm scripts/ci/materialize_capture_record_snapshot_3a905.py
          git add -A
          changed="$(git diff --name-only "$parent" | sort)"
          expected="$(printf '%s\n' \
            'Scripts/capture_tuya_private_input_provenance.py' \
            'scripts/ci/tests/test_capture_tuya_private_input_record_snapshot_coherence.py' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m 'fix(capture): bind provenance record to one input snapshot'
          git push origin HEAD:sol/v14-capture-record-snapshot-3a905-sol
