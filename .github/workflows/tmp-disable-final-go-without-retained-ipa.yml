name: Temporary Final-GO retained IPA interlock

on:
  push:
    branches:
      - control/v14-auth-stationary-final-go-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Disable production GO without retained signed artifact authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'bccd27ca0c2b00e4224dba86b0bb0d1ef67ded4d'
          python3 - <<'PY'
          from pathlib import Path

          issuer_path=Path('scripts/ci/es80_authenticated_stationary_final_go.py')
          issuer=issuer_path.read_text()
          installer_end='    return {"authority":"accepted-candidate-private-installer-execution-v1","result":"success","sourceCommitSHA":source,"buildIdentifier":f"capture-v14-{source[:12]}","bundleIdentifier":BUNDLE,"procedureIdentifier":PROC,"baselineDevice":DEVICE,"baselineProductType":PRODUCT,"baselineOS":"iOS 27"}\n\ndef build(*,candidate_repo:Path,source:str,pr:int,runs:dict[str,int],artifact_id:int,review_id:int,archive:Path,device_file:Path,get=api,run_installer=installer,now=None):\n'
          replacement='    return {"authority":"accepted-candidate-private-installer-execution-v1","result":"success","sourceCommitSHA":source,"buildIdentifier":f"capture-v14-{source[:12]}","bundleIdentifier":BUNDLE,"procedureIdentifier":PROC,"baselineDevice":DEVICE,"baselineProductType":PRODUCT,"baselineOS":"iOS 27"}\n\ndef retained_signed_artifact_unimplemented(repo:Path,source:str,device:Path,install:dict[str,Any])->dict[str,Any]:\n    raise GoError("retained signed IPA production + independent reinspection is not implemented; physical GO remains disabled")\n\ndef build(*,candidate_repo:Path,source:str,pr:int,runs:dict[str,int],artifact_id:int,review_id:int,archive:Path,device_file:Path,get=api,run_installer=installer,inspect_signed_artifact=retained_signed_artifact_unimplemented,now=None):\n'
          if issuer.count(installer_end)!=1: raise SystemExit('issuer build seam changed')
          issuer=issuer.replace(installer_end,replacement,1)
          old='    if got!=expected: raise GoError("private installer result drifted")\n\n    post_ps,post_ws=public(source,pr,runs,get);'
          new='    if got!=expected: raise GoError("private installer result drifted")\n    signed=inspect_signed_artifact(candidate_repo,source,device_file,got)\n    required_signed={"authority":"nembra-authenticated-stationary-retained-signed-artifact-v1","sourceCommitSHA":source,"buildIdentifier":expected["buildIdentifier"],"bundleIdentifier":BUNDLE,"procedureIdentifier":PROC,"codesignVerified":True,"intendedDeviceIncluded":True,"physicalAuthorityCreated":False}\n    if not isinstance(signed,dict) or any(signed.get(k)!=v for k,v in required_signed.items()): raise GoError("retained signed artifact authority mismatch")\n    for key in ("tuyaDependencyLockSHA256","retainedIPASHA256","retainedAppTreeSHA256","embeddedProvisioningProfileSHA256","signingTeamIdentifier","applicationIdentifier"):\n        value=signed.get(key)\n        if not isinstance(value,str) or not value: raise GoError(f"retained signed artifact missing {key}")\n    if not HEX64.fullmatch(signed["tuyaDependencyLockSHA256"]) or not HEX64.fullmatch(signed["retainedIPASHA256"]) or not HEX64.fullmatch(signed["retainedAppTreeSHA256"]) or not HEX64.fullmatch(signed["embeddedProvisioningProfileSHA256"]): raise GoError("retained signed artifact digest invalid")\n\n    post_ps,post_ws=public(source,pr,runs,get);'
          if issuer.count(old)!=1: raise SystemExit('issuer install seam changed')
          issuer=issuer.replace(old,new,1)
          old_record='"candidateSource":cs,"privateFieldInstall":{**got,"intendedDeviceIdentifierSHA256":dh},"experiment":'
          new_record='"candidateSource":cs,"privateFieldInstall":{**got,"intendedDeviceIdentifierSHA256":dh},"retainedSignedFieldArtifact":signed,"experiment":'
          if issuer.count(old_record)!=1: raise SystemExit('issuer record seam changed')
          issuer_path.write_text(issuer.replace(old_record,new_record,1))

          test_path=Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go.py')
          test=test_path.read_text()
          inst=' def inst(self,repo,s,dev):return {\'authority\':\'accepted-candidate-private-installer-execution-v1\',\'result\':\'success\',\'sourceCommitSHA\':s,\'buildIdentifier\':f\'capture-v14-{s[:12]}\',\'bundleIdentifier\':go.BUNDLE,\'procedureIdentifier\':go.PROC,\'baselineDevice\':go.DEVICE,\'baselineProductType\':go.PRODUCT,\'baselineOS\':\'iOS 27\'}\n def build(self,**x):\n  a=dict(candidate_repo=self.repo,source=self.s,pr=self.pr,runs=self.ids,artifact_id=self.aid,review_id=self.rid,archive=self.arc,device_file=self.dev,get=self.get,run_installer=self.inst);a.update(x);return go.build(**a)\n'
          repl=' def inst(self,repo,s,dev):return {\'authority\':\'accepted-candidate-private-installer-execution-v1\',\'result\':\'success\',\'sourceCommitSHA\':s,\'buildIdentifier\':f\'capture-v14-{s[:12]}\',\'bundleIdentifier\':go.BUNDLE,\'procedureIdentifier\':go.PROC,\'baselineDevice\':go.DEVICE,\'baselineProductType\':go.PRODUCT,\'baselineOS\':\'iOS 27\'}\n def signed(self,repo,s,dev,install):return {\'authority\':\'nembra-authenticated-stationary-retained-signed-artifact-v1\',\'sourceCommitSHA\':s,\'buildIdentifier\':f\'capture-v14-{s[:12]}\',\'bundleIdentifier\':go.BUNDLE,\'procedureIdentifier\':go.PROC,\'tuyaDependencyLockSHA256\':\'a\'*64,\'retainedIPASHA256\':\'b\'*64,\'retainedAppTreeSHA256\':\'c\'*64,\'embeddedProvisioningProfileSHA256\':\'d\'*64,\'signingTeamIdentifier\':\'TEAM\',\'applicationIdentifier\':\'TEAM.\'+go.BUNDLE,\'codesignVerified\':True,\'intendedDeviceIncluded\':True,\'physicalAuthorityCreated\':False}\n def build(self,**x):\n  a=dict(candidate_repo=self.repo,source=self.s,pr=self.pr,runs=self.ids,artifact_id=self.aid,review_id=self.rid,archive=self.arc,device_file=self.dev,get=self.get,run_installer=self.inst,inspect_signed_artifact=self.signed);a.update(x);return go.build(**a)\n'
          if test.count(inst)!=1: raise SystemExit('test fixture seam changed')
          test=test.replace(inst,repl,1)
          anchor=' def test_go_scope_and_remote_review_custody(self):\n'
          addition=' def test_production_default_refuses_go_without_retained_signed_artifact_authority(self):\n  a=dict(candidate_repo=self.f.repo,source=self.f.s,pr=self.f.pr,runs=self.f.ids,artifact_id=self.f.aid,review_id=self.f.rid,archive=self.f.arc,device_file=self.f.dev,get=self.f.get,run_installer=self.f.inst)\n  self.no(lambda:go.build(**a))\n def test_malformed_retained_signed_artifact_authority_is_rejected(self):\n  def bad(r,s,d,i):x=self.f.signed(r,s,d,i);x["retainedIPASHA256"]="not-a-digest";return x\n  self.no(lambda:self.f.build(inspect_signed_artifact=bad))\n'+anchor
          if test.count(anchor)!=1: raise SystemExit('test insertion seam changed')
          test_path.write_text(test.replace(anchor,addition,1))
          PY
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          git diff --check

      - name: Commit interlock and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-disable-final-go-without-retained-ipa.yml
          git add scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          git diff --cached --check
          git commit -m 'fix(capture): block GO without retained signed artifact authority'
          git push origin HEAD:control/v14-auth-stationary-final-go-sol
