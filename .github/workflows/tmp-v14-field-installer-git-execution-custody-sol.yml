name: TEMP V14 Field Installer Git Execution Custody Sol

on:
  push:
    branches:
      - repair/v14-field-installer-git-execution-custody-sol-20260811
    paths:
      - .github/workflows/tmp-v14-field-installer-git-execution-custody-sol.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-field-installer-git-execution-custody-sol-20260811
          fetch-depth: 0
      - name: Materialize and validate repair
        run: python3 .swarm-tmp/v14-field-installer-git-execution-custody-sol.py
      - name: Publish product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/capture-field-build-provenance.yml
          git add Scripts/bootstrap_capture_tuya_sdk.sh
          git add scripts/ci/tests/test_capture_field_installer_git_authority_red_team.py
          git add scripts/field/install_one_time_capture.command
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 4
          git commit -m 'Capture: bind field installer source and bootstrap execution'
          git push origin HEAD:repair/v14-field-installer-git-execution-custody-sol-20260811