name: Materialize Accepted Capture Shell Restore

on:
  push:
    branches:
      - recovery/v14-capture-provenance-simulator-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/v14-capture-provenance-simulator-sol
          fetch-depth: 0

      - name: Restore exact accepted package-owned Capture shell
        shell: bash
        run: |
          set -euo pipefail
          path='NembraApp/Features/Research/ES80CaptureShellView.swift'
          expected_current_blob='73d6e6139f3b8049d70f4d3495831aa36d2741dd'
          accepted_head='a0f4a33451f61411d6e0541f2e70edea5438342d'
          expected_accepted_blob='28c2de451259ec51c68829f2eef6c0d125180e64'

          actual_current_blob="$(git hash-object "$path")"
          test "$actual_current_blob" = "$expected_current_blob"
          git cat-file -e "$accepted_head^{commit}"
          git show "$accepted_head:$path" > "$path"
          actual_accepted_blob="$(git hash-object "$path")"
          test "$actual_accepted_blob" = "$expected_accepted_blob"
          test "$(grep -Fc 'private func prepareFinalShareForAnalysisAndSharing() {' "$path")" = '1'
          grep -Fq 'import NembraBluetoothCapture' "$path"
          ! grep -Fq 'final class ES80GuidedBluetoothCapture' "$path"
          git diff --check

      - name: Commit restoration and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nembra Capture Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-accepted-capture-shell-restore.yml
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(capture): restore accepted package-owned product shell'
          git push origin HEAD:recovery/v14-capture-provenance-simulator-sol
