name: ES80 Experiment One post-admission rediscovery one-shot

on:
  push:
    branches:
      - agent/es80-experiment-one-post-admission-rediscovery-v14

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Assert exact staged ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=94cd75dd4d84c6edcad7a57875c1180f456f3890
          git merge-base --is-ancestor "$BASE" HEAD
          ACTUAL="$(git diff --name-only "$BASE" HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/es80-experiment-one-post-admission-rediscovery-once.yml' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift' \
            'scripts/ci/es80_experiment_one_post_admission_rediscovery_once.py' | sort)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Apply producer and controller repair
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python3 scripts/ci/es80_experiment_one_post_admission_rediscovery_once.py > transform-failure.txt 2>&1
          STATUS=$?
          if [[ "$STATUS" -eq 0 ]]; then
            rm transform-failure.txt
            git diff --check
          fi
          exit "$STATUS"

      - name: Persist exact transform failure for branch-local diagnosis
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add transform-failure.txt
          git commit -m 'Record Experiment One transform failure'
          git push origin HEAD:${GITHUB_REF_NAME}
          exit 1

      - name: Verify exact repair shape
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          RUN=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift
          CONTROLLER=Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          TEST=Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/ForegroundCoreBluetoothCaptureControllerExperimentOnePostAdmissionRediscoveryTests.swift
          test -f "$TEST"
          grep -F 'let issuedAtUptimeNanoseconds: UInt64' "$RUN"
          grep -F 'let issuedAtUptimeNanoseconds = DispatchTime.now().uptimeNanoseconds' "$RUN"
          grep -F 'case experimentOneRediscoveryRequired(UUID)' "$CONTROLLER"
          grep -F 'latestAdvertisement.receivedAtUptimeNanoseconds >= payload.issuedAtUptimeNanoseconds' "$CONTROLLER"
          test "$(grep -c 'admission.consume()' "$CONTROLLER")" -eq 1
          grep -F 'recorder = payload.recorder' "$CONTROLLER"

      - name: Commit product result and remove one-shot scaffolding
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/es80-experiment-one-post-admission-rediscovery-once.yml
          rm scripts/ci/es80_experiment_one_post_admission_rediscovery_once.py
          git config user.name 'nembra-v14-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          ACTUAL="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/es80-experiment-one-post-admission-rediscovery-once.yml' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/PassiveBluetoothExperimentOneRun.swift' \
            'scripts/ci/es80_experiment_one_post_admission_rediscovery_once.py' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git commit -m 'Require rediscovery after sealed Experiment One admission'
          git push origin HEAD:${GITHUB_REF_NAME}
