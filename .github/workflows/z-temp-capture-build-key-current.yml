name: Temporary Capture current-parent BUILD key repair

on:
  push:
    branches:
      - repair/capture-v14-ax-xxxl-build-key-current/gpt56-go

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Apply root-cause AX BUILD key repair and remove one-shot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("NembraApp/App/NembraApp.swift")
          source = path.read_text(encoding="utf-8")
          if source.count('Text("BUILD")') != 1:
              raise SystemExit(f'expected one BUILD key, found {source.count(chr(84)+"ext(\"BUILD\")")}')
          if 'Text("Final checks in progress.")' not in source:
              raise SystemExit("current-parent short AX status copy missing; refusing stale patch")
          start = source.index('Text("BUILD")')
          limit = source.find('if let buildIdentityVisualLabel', start)
          if limit < 0:
              raise SystemExit("BUILD value boundary missing")
          segment = source[start:limit]
          if '.fixedSize(horizontal: true, vertical: false)' in segment:
              raise SystemExit("BUILD key already repaired")
          marker = '.foregroundStyle(.secondary)'
          if segment.count(marker) != 1:
              raise SystemExit(f"expected one BUILD foreground marker, found {segment.count(marker)}")
          marker_at = source.index(marker, start, limit) + len(marker)
          indent = '\n                            .fixedSize(horizontal: true, vertical: false)'
          source = source[:marker_at] + indent + source[marker_at:]
          path.write_text(source, encoding="utf-8")
          PY
          rm -f .github/workflows/z-temp-capture-build-key-current.yml
          git config user.name "nembra-capture-recovery"
          git config user.email "nembra-capture-recovery@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): keep AX build key horizontal"
          git push origin HEAD:"${GITHUB_REF_NAME}"
