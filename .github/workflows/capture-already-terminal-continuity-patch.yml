name: Capture Already-Terminal Continuity Patch

on:
  push:
    branches:
      - agent/v14-capture-already-terminal-continuity-current-sol
    paths:
      - .github/workflows/capture-already-terminal-continuity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-already-terminal-continuity-current-sol
          fetch-depth: 0
      - name: Apply product repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_already_terminal_continuity_patch.py
          rm Scripts/apply_capture_already_terminal_continuity_patch.py
          rm .github/workflows/capture-already-terminal-continuity-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'mirrorAlreadyTerminalObservationContinuity'
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'accepted_prefix_seal_lifecycle_rejected'
          git commit -m "fix(capture): mirror package-terminal continuity once"
          git push origin HEAD:agent/v14-capture-already-terminal-continuity-current-sol
