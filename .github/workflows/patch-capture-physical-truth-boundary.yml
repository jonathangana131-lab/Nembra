name: Patch Capture physical-truth boundary

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
    paths:
      - .github/workflows/patch-capture-physical-truth-boundary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture/one-time-ble-dump-gpt56
          fetch-depth: 0

      - name: Apply fail-closed app integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          old_snapshot = '''    @Published private(set) var ledgerSnapshot = TuyaAuthenticatedReadOnlyPreflightSnapshot(
              authenticationState: .unavailable(reason: "No active Bluetooth connection."),
              connectionStartedAtUptimeNanoseconds: nil,
              authenticatedAtUptimeNanoseconds: nil,
              latestObservedUptimeNanoseconds: nil,
              applicationPayloadCount: 0,
              connectionGeneration: 0
          )'''
          new_snapshot = '''    @Published private(set) var ledgerSnapshot = TuyaAuthenticatedReadOnlyPreflightSnapshot.noActiveConnection'''

          old_event = '''                    self.log("authenticated_transparent_transport_acceptance", ['''
          new_event = '''                    self.log("authenticated_transparent_transport_survival", ['''

          old_message = '''                    self.message = "Authenticated Tuya receive bytes survived beyond the historical rejection window for generation \\(token.diagnosticGeneration). Physical transport acceptance is proven; raw FD50 characteristic custody and scooter DP semantics remain unassigned."'''
          new_message = '''                    self.message = "Authenticated Tuya receive bytes survived beyond the historical rejection window for generation \\(token.diagnosticGeneration). Documented Tuya transport survival is proven; C7D09A22 physical-first acceptance still requires retained raw FD50 characteristic notifications tied to this authenticated generation, and scooter DP semantics remain unassigned."'''

          replacements = [
              (old_snapshot, new_snapshot, "fail-closed bootstrap snapshot"),
              (old_event, new_event, "transport-survival event name"),
              (old_message, new_message, "transport-survival user message"),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {label} match, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          grep -F 'TuyaAuthenticatedReadOnlyPreflightSnapshot.noActiveConnection' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -F 'authenticated_transparent_transport_survival' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -F 'C7D09A22 physical-first acceptance still requires retained raw FD50 characteristic notifications' NembraApp/App/NembraCaptureEntrypoint.swift
          if grep -Fq 'Physical transport acceptance is proven' NembraApp/App/NembraCaptureEntrypoint.swift; then
            echo 'stale physical-acceptance wording remains' >&2
            exit 1
          fi

      - name: Commit exact patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-capture-physical-truth-boundary.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m "Physical truth: distinguish Tuya survival from physical GO"
          git push origin HEAD:capture/one-time-ble-dump-gpt56
