name: Patch Capture physical-truth boundary

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56
    paths:
      - .github/workflows/patch-capture-physical-truth-boundary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture/one-time-ble-dump-gpt56
          fetch-depth: 0

      - name: Apply fail-closed app integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text()

          snapshot_pattern = re.compile(
              r'@Published private\(set\) var ledgerSnapshot = TuyaAuthenticatedReadOnlyPreflightSnapshot\(\s*'
              r'authenticationState: \.unavailable\(reason: "No active Bluetooth connection\."\),\s*'
              r'connectionStartedAtUptimeNanoseconds: nil,\s*'
              r'authenticatedAtUptimeNanoseconds: nil,\s*'
              r'latestObservedUptimeNanoseconds: nil,\s*'
              r'applicationPayloadCount: 0,\s*'
              r'connectionGeneration: 0\s*\)'
          )
          text, snapshot_count = snapshot_pattern.subn(
              '@Published private(set) var ledgerSnapshot = TuyaAuthenticatedReadOnlyPreflightSnapshot.noActiveConnection',
              text,
              count=1,
          )
          if snapshot_count != 1:
              raise SystemExit(f"expected exactly one fail-closed bootstrap snapshot match, found {snapshot_count}")

          old_event = 'self.log("authenticated_transparent_transport_acceptance", ['
          new_event = 'self.log("authenticated_transparent_transport_survival", ['
          event_count = text.count(old_event)
          if event_count != 1:
              raise SystemExit(f"expected exactly one transport event match, found {event_count}")
          text = text.replace(old_event, new_event, 1)

          old_message_fragment = 'Physical transport acceptance is proven; raw FD50 characteristic custody and scooter DP semantics remain unassigned.'
          new_message_fragment = 'Documented Tuya transport survival is proven; C7D09A22 physical-first acceptance still requires retained raw FD50 characteristic notifications tied to this authenticated generation, and scooter DP semantics remain unassigned.'
          message_count = text.count(old_message_fragment)
          if message_count != 1:
              raise SystemExit(f"expected exactly one transport message match, found {message_count}")
          text = text.replace(old_message_fragment, new_message_fragment, 1)

          path.write_text(text)
          PY

          grep -F 'TuyaAuthenticatedReadOnlyPreflightSnapshot.noActiveConnection' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -F 'authenticated_transparent_transport_survival' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -F 'C7D09A22 physical-first acceptance still requires retained raw FD50 characteristic notifications' NembraApp/App/NembraCaptureEntrypoint.swift
          if grep -Fq 'Physical transport acceptance is proven' NembraApp/App/NembraCaptureEntrypoint.swift; then
            echo 'stale physical-acceptance wording remains' >&2
            exit 1
          fi

      - name: Commit exact patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-capture-physical-truth-boundary.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift
          git commit -m "Physical truth: distinguish Tuya survival from physical GO"
          git push origin HEAD:capture/one-time-ble-dump-gpt56
