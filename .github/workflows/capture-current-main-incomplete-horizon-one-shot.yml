name: Capture current-main incomplete horizon one-shot

on:
  push:
    branches:
      - capture/current-main-strict-tuya-preflight-gpt56sol
    paths:
      - .github/workflows/capture-current-main-incomplete-horizon-one-shot.yml

permissions:
  contents: write

concurrency:
  group: capture-current-main-incomplete-horizon-one-shot
  cancel-in-progress: false

jobs:
  materialize-test-publish:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TARGET_BRANCH: capture/current-main-strict-tuya-preflight-gpt56sol
      LEDGER: Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift
      TEST_FILE: Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedIncompleteObservationHorizonTests.swift
      SELF: .github/workflows/capture-current-main-incomplete-horizon-one-shot.yml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind immutable branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = '${{ github.sha }}'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize package-owned incomplete horizon enforcement
        shell: python3
        run: |
          from pathlib import Path

          path = Path("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift")
          src = path.read_text(encoding="utf-8")

          old = """        case observationContinuityInvalidated\n        case preflightNotReady\n"""
          new = """        case observationContinuityInvalidated\n        case incompleteObservationHorizonReached\n        case preflightNotReady\n"""
          if src.count(old) != 1:
              raise SystemExit(f"mutation-error anchor count={src.count(old)}")
          src = src.replace(old, new, 1)

          old = """        guard applicationPayloadCount < Int.max else {\n            throw MutationError.applicationPayloadCountExhausted\n        }\n        applicationPayloadCount += 1\n"""
          new = """        // A callback arriving at or beyond the package-owned incomplete-session horizon cannot\n        // bootstrap itself into acceptance. Evaluate retirement using the current evidence with\n        // `now` only as the candidate liveness receipt, before mutating payload count/timestamps.\n        // Canonically ready generations remain allowed to receive later read-only updates.\n        let preMutationHorizonSnapshot = TuyaAuthenticatedReadOnlyPreflightSnapshot(\n            authenticationState: authenticationState,\n            authenticationMethod: authenticationMethod,\n            connectionStartedAtUptimeNanoseconds: connectionStartedAtUptimeNanoseconds,\n            authenticatedAtUptimeNanoseconds: authenticatedAtUptimeNanoseconds,\n            latestObservedUptimeNanoseconds: now,\n            applicationPayloadCount: applicationPayloadCount,\n            latestApplicationPayloadUptimeNanoseconds: latestApplicationPayloadUptimeNanoseconds,\n            connectionGeneration: currentToken?.generation ?? generation\n        )\n        if TuyaAuthenticatedReadOnlyPreflight.shouldRetireIncompleteObservation(preMutationHorizonSnapshot) {\n            throw MutationError.incompleteObservationHorizonReached\n        }\n\n        guard applicationPayloadCount < Int.max else {\n            throw MutationError.applicationPayloadCountExhausted\n        }\n        applicationPayloadCount += 1\n"""
          if src.count(old) != 1:
              raise SystemExit(f"application-admission anchor count={src.count(old)}")
          src = src.replace(old, new, 1)

          old = """        let now = try nextMonotonicObservation()\n        try requireContinuousAuthenticatedObservation(at: now)\n        latestObservedUptimeNanoseconds = now\n    }\n\n    /// Seals a failed observation horizon while authenticated transport may still exist.\n"""
          new = """        let now = try nextMonotonicObservation()\n        try requireContinuousAuthenticatedObservation(at: now)\n        latestObservedUptimeNanoseconds = now\n\n        if TuyaAuthenticatedReadOnlyPreflight.shouldRetireIncompleteObservation(makeSnapshot()) {\n            throw MutationError.incompleteObservationHorizonReached\n        }\n    }\n\n    /// Seals a failed observation horizon while authenticated transport may still exist.\n"""
          if src.count(old) != 1:
              raise SystemExit(f"liveness-admission anchor count={src.count(old)}")
          src = src.replace(old, new, 1)
          path.write_text(src, encoding="utf-8")

          test = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedIncompleteObservationHorizonTests.swift")
          test.write_text(r'''import Foundation
import Testing
@testable import NembraBluetoothCapture

@Suite("Tuya authenticated incomplete observation horizon")
struct TuyaAuthenticatedIncompleteObservationHorizonTests {
    @Test("bootstrap-only generation retires at package-owned 60 second horizon")
    func bootstrapOnlyGenerationRetires() async throws {
        let clock = HorizonClock(1_000_000_000)
        let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
        let token = try await ledger.beginConnection()
        clock.set(1_100_000_000)
        try await ledger.markAuthenticationStarted(for: token)
        let authenticatedAt: UInt64 = 1_200_000_000
        clock.set(authenticatedAt)
        try await ledger.markAuthenticated(for: token, method: .smartLifeAppSDK)
        clock.set(authenticatedAt + 1_000_000_000)
        try await ledger.recordApplicationUpdate(isNonEmpty: true, for: token)

        try await pollContinuously(
            clock: clock,
            ledger: ledger,
            token: token,
            authenticatedAt: authenticatedAt,
            throughOffset: 55_000_000_000
        )
        clock.set(authenticatedAt + TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds)
        await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached) {
            try await ledger.observeCurrentConnection(for: token)
        }
        let snapshot = await ledger.currentPreflightSnapshot()
        #expect(snapshot.applicationPayloadCount == 1)
        #expect(snapshot.latestApplicationPayloadUptimeNanoseconds == authenticatedAt + 1_000_000_000)
        #expect(TuyaAuthenticatedReadOnlyPreflight.verdict(for: snapshot) != .readyForStationaryMapping)
    }

    @Test("deadline-crossing second callback is rejected before evidence mutation")
    func deadlineCrossingPayloadCannotManufactureReadiness() async throws {
        let clock = HorizonClock(2_000_000_000)
        let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
        let token = try await ledger.beginConnection()
        clock.set(2_100_000_000)
        try await ledger.markAuthenticationStarted(for: token)
        let authenticatedAt: UInt64 = 2_200_000_000
        clock.set(authenticatedAt)
        try await ledger.markAuthenticated(for: token, method: .smartLifeAppSDK)
        clock.set(authenticatedAt + 1_000_000_000)
        try await ledger.recordApplicationUpdate(isNonEmpty: true, for: token)
        try await pollContinuously(
            clock: clock,
            ledger: ledger,
            token: token,
            authenticatedAt: authenticatedAt,
            throughOffset: 55_000_000_000
        )

        let before = await ledger.currentPreflightSnapshot()
        clock.set(authenticatedAt + TuyaAuthenticatedReadOnlyPreflight.maximumIncompleteObservationNanoseconds)
        await #expect(throws: TuyaAuthenticatedReadOnlySessionLedger.MutationError.incompleteObservationHorizonReached) {
            try await ledger.recordApplicationUpdate(isNonEmpty: true, for: token)
        }
        let after = await ledger.currentPreflightSnapshot()
        #expect(after.applicationPayloadCount == before.applicationPayloadCount)
        #expect(after.latestApplicationPayloadUptimeNanoseconds == before.latestApplicationPayloadUptimeNanoseconds)
        #expect(TuyaAuthenticatedReadOnlyPreflight.verdict(for: after) != .readyForStationaryMapping)
    }

    @Test("canonically ready generation survives incomplete horizon")
    func readyGenerationSurvivesHorizon() async throws {
        let clock = HorizonClock(3_000_000_000)
        let ledger = TuyaAuthenticatedReadOnlySessionLedger(nowUptimeNanoseconds: clock.now)
        let token = try await ledger.beginConnection()
        clock.set(3_100_000_000)
        try await ledger.markAuthenticationStarted(for: token)
        let authenticatedAt: UInt64 = 3_200_000_000
        clock.set(authenticatedAt)
        try await ledger.markAuthenticated(for: token, method: .smartLifeAppSDK)
        clock.set(authenticatedAt + 1_000_000_000)
        try await ledger.recordApplicationUpdate(isNonEmpty: true, for: token)
        try await pollContinuously(
            clock: clock,
            ledger: ledger,
            token: token,
            authenticatedAt: authenticatedAt,
            throughOffset: 26_000_000_000
        )
        clock.set(authenticatedAt + TuyaAuthenticatedReadOnlyPreflight.minimumPostAuthenticationPayloadSurvivalNanoseconds)
        try await ledger.recordApplicationUpdate(isNonEmpty: true, for: token)
        try await pollContinuously(
            clock: clock,
            ledger: ledger,
            token: token,
            authenticatedAt: authenticatedAt,
            fromOffset: 35_000_000_000,
            throughOffset: 60_000_000_000
        )
        let snapshot = await ledger.currentPreflightSnapshot()
        #expect(snapshot.applicationPayloadCount == 2)
        #expect(TuyaAuthenticatedReadOnlyPreflight.verdict(for: snapshot) == .readyForStationaryMapping)
    }

    private func pollContinuously(
        clock: HorizonClock,
        ledger: TuyaAuthenticatedReadOnlySessionLedger,
        token: TuyaReadOnlyConnectionToken,
        authenticatedAt: UInt64,
        fromOffset: UInt64 = 6_000_000_000,
        throughOffset: UInt64
    ) async throws {
        var offset = fromOffset
        while offset <= throughOffset {
            clock.set(authenticatedAt + offset)
            try await ledger.observeCurrentConnection(for: token)
            offset += 5_000_000_000
        }
    }
}

private final class HorizonClock: @unchecked Sendable {
    private let lock = NSLock()
    private var value: UInt64

    init(_ value: UInt64) {
        self.value = value
    }

    func set(_ value: UInt64) {
        lock.lock()
        self.value = value
        lock.unlock()
    }

    func now() -> UInt64 {
        lock.lock()
        defer { lock.unlock() }
        return value
    }
}
''', encoding="utf-8")

      - name: Enforce exact product scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}' | sort)"
          expected="$(printf '%s\n%s\n' "$LEDGER" "$TEST_FILE" | sort)"
          test "$changed" = "$expected"
          grep -Fq 'case incompleteObservationHorizonReached' "$LEDGER"
          grep -Fq 'shouldRetireIncompleteObservation(preMutationHorizonSnapshot)' "$LEDGER"
          grep -Fq 'shouldRetireIncompleteObservation(makeSnapshot())' "$LEDGER"
          test "$(grep -Fc 'publishDps(' "$LEDGER")" = 0
          test "$(grep -Fc 'writeValue(' "$LEDGER")" = 0

      - name: Run focused package truth tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.app/Contents/Developer ]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          fi
          cd Packages/NembraBluetoothCapture
          swift test --filter TuyaAuthenticatedReadOnlyPreflightTests
          swift test --filter TuyaAuthenticatedIncompleteObservationHorizonTests
          swift test --filter TuyaAuthenticatedReadOnlySessionLedgerTests

      - name: Publish clean successor only if branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          trigger='${{ github.sha }}'
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$trigger"
          rm -f "$SELF"
          git add -- "$LEDGER" "$TEST_FILE" "$SELF"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture: enforce incomplete horizon in current-main ledger'
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$trigger" origin "HEAD:refs/heads/$TARGET_BRANCH"
