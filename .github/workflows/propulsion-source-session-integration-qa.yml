name: Propulsion Source Session Integration QA

on:
  push:
    branches:
      - qa/propulsion-source-session/chat-g5m7q-main2dd

permissions:
  contents: read

jobs:
  swift-test:
    name: Current-main NembraCore warnings-as-errors
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout integration mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify current-main composition and exact feature blobs
        env:
          EXPECTED_FEATURE_HEAD: e02345cc41238c1255acaa1afd818cbb26b8be6e
          EXPECTED_MAIN: 2dd466481cac5428a8fb6c0388495db3429eae65
          EXPECTED_COMPOSITION_HEAD: c5aefe7a2c817336781051239169531ad726080b
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_FEATURE_HEAD^{commit}"
          git cat-file -e "$EXPECTED_MAIN^{commit}"
          git cat-file -e "$EXPECTED_COMPOSITION_HEAD^{commit}"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_COMPOSITION_HEAD"
          test "$(git rev-parse "$EXPECTED_COMPOSITION_HEAD^")" = "$EXPECTED_MAIN"

          expected_files='Packages/NembraCore/Sources/NembraCore/PropulsionGaugeSourceSession.swift
          Packages/NembraCore/Tests/NembraCoreTests/PropulsionGaugeSourceSessionIdentityTests.swift
          Packages/NembraCore/Tests/NembraCoreTests/PropulsionGaugeSourceSessionTests.swift
          docs/PROPULSION_GAUGE_SOURCE_SESSION.md'
          changed="$(git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_COMPOSITION_HEAD")"
          test "$changed" = "$expected_files"

          for path in \
            Packages/NembraCore/Sources/NembraCore/PropulsionGaugeSourceSession.swift \
            Packages/NembraCore/Tests/NembraCoreTests/PropulsionGaugeSourceSessionIdentityTests.swift \
            Packages/NembraCore/Tests/NembraCoreTests/PropulsionGaugeSourceSessionTests.swift \
            docs/PROPULSION_GAUGE_SOURCE_SESSION.md
          do
            test "$(git rev-parse "$EXPECTED_FEATURE_HEAD:$path")" = "$(git rev-parse "$EXPECTED_COMPOSITION_HEAD:$path")"
          done

          workflow_only="$(git diff --name-only "$EXPECTED_COMPOSITION_HEAD" HEAD)"
          test "$workflow_only" = '.github/workflows/propulsion-source-session-integration-qa.yml'

      - name: Verify Swift toolchain
        run: |
          swift --version
          swift package --package-path Packages/NembraCore dump-package >/dev/null

      - name: Build and run NembraCore tests with warnings as errors
        working-directory: Packages/NembraCore
        run: swift test -Xswiftc -warnings-as-errors
