name: V14 Capture Cross-Controller BLE Reanchor R3

on:
  push:
    branches:
      - integration/v14-capture-cross-controller-ble-current-sol

permissions:
  contents: write

jobs:
  reanchor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-cross-controller-ble-current-sol
          fetch-depth: 0

      - name: Compose current language-polished product with BLE ownership fence
        shell: bash
        run: |
          set -euo pipefail
          prior='1a09a95e64354109939acfd10b1fae7c63b66d35'
          product='09f0e231bc2ea1b1bb03ddf8ab162b930b94ca07'
          test "$(git rev-parse HEAD^)" = "$prior"
          git fetch origin product/v14-capture-guided-truth-current-sol
          test "$(git rev-parse origin/product/v14-capture-guided-truth-current-sol)" = "$product"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit --no-ff "$product"

          rm .github/workflows/v14-capture-cross-controller-ble-reanchor-r3.yml
          git add -A
          git diff --cached --check
          git commit --amend --no-edit

          mapfile -t effective < <(git diff --name-only "$product" HEAD)
          test "${#effective[@]}" -eq 2
          printf '%s\n' "${effective[@]}" | grep -Fxq 'NembraApp/App/NembraCaptureEntrypoint.swift'
          printf '%s\n' "${effective[@]}" | grep -Fxq 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipSourceTests.swift'

          # Newly absorbed security + product-language contracts must survive unchanged.
          git diff --quiet "$product" HEAD -- NembraApp/Features/Research/TuyaAccountBridge.swift
          git diff --quiet "$product" HEAD -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCapturePrimaryLanguageSourceTests.swift
          grep -Fq 'accesstoken' NembraApp/Features/Research/TuyaAccountBridge.swift

          python3 - <<'PY'
          from pathlib import Path
          app=Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          begin=app[app.index('private func beginCorrelationSeries()'):app.index('func startNextCorrelationWindow()')]
          read='OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)'
          scanner='resetDiscoverySessionOnly()'
          assert read in begin and scanner in begin and begin.index(read) < begin.index(scanner)
          assert 'existing_sdk_local_ble_ownership_blocks_scan' in begin
          assert 'Package-owned correlation will not scan while Tuya still owns local BLE' in begin
          factory=app[app.index('private enum OfficialTuyaFactory'):]
          assert 'ThingSmartBLEManager.sharedInstance().deviceStatue(withUUID: uuid)' in factory
          language=Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCapturePrimaryLanguageSourceTests.swift').read_text()
          assert 'primary Capture guidance uses rider-facing language' in language
          print('language-polished cross-controller BLE composition: PASS')
          PY
          git diff --check "$product" HEAD
          git push origin HEAD:integration/v14-capture-cross-controller-ble-current-sol
