name: Materialize current Capture secret-custody repair

on:
  push:
    branches:
      - sol/v14-capture-app-secret-redaction-52333

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "52333deb09ea9a5964250097f83884d285f25d78"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/materialize-capture-secret-redaction-52333.yml"

      - name: Materialize fail-closed redaction and regression
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          source_path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = source_path.read_text()
          old = "\n".join([
              "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {",
              "        guard let dps, !dps.isEmpty else { return }",
              "        var sanitized: [String: String] = [:]",
              "        for (key, value) in dps {",
              "            sanitized[String(describing: key)] = String(describing: value)",
              "        }",
              "        onApplicationUpdate?(sanitized)",
              "    }",
          ])
          new = "\n".join([
              "    private static let secretKeyFragments = [",
              "        \"localkey\",",
              "        \"accesstoken\",",
              "        \"refreshtoken\",",
              "        \"authkey\",",
              "        \"seckey\"",
              "    ]",
              "",
              "    private static func isSecretKey(_ key: String) -> Bool {",
              "        let normalized = key.lowercased().filter { $0.isLetter || $0.isNumber }",
              "        return secretKeyFragments.contains { normalized.contains($0) }",
              "    }",
              "",
              "    private static func redactApplicationSecrets(_ object: Any) -> Any {",
              "        if let dictionary = object as? [AnyHashable: Any] {",
              "            var sanitized: [AnyHashable: Any] = [:]",
              "            sanitized.reserveCapacity(dictionary.count)",
              "            for (key, value) in dictionary {",
              "                let keyString = String(describing: key)",
              "                sanitized[key] = isSecretKey(keyString)",
              "                    ? \"<redacted>\"",
              "                    : redactApplicationSecrets(value)",
              "            }",
              "            return sanitized",
              "        }",
              "        if let array = object as? [Any] {",
              "            return array.map(redactApplicationSecrets)",
              "        }",
              "        return object",
              "    }",
              "",
              "    func device(_ device: ThingSmartDevice?, dpsUpdate dps: [AnyHashable: Any]?) {",
              "        guard let dps, !dps.isEmpty else { return }",
              "        var sanitized: [String: String] = [:]",
              "        sanitized.reserveCapacity(dps.count)",
              "        for (key, value) in dps {",
              "            let keyString = String(describing: key)",
              "            if Self.isSecretKey(keyString) {",
              "                sanitized[keyString] = \"<redacted>\"",
              "            } else {",
              "                sanitized[keyString] = String(describing: Self.redactApplicationSecrets(value))",
              "            }",
              "        }",
              "        onApplicationUpdate?(sanitized)",
              "    }",
          ])
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one unsanitized dpsUpdate body, found {source.count(old)}")
          source_path.write_text(source.replace(old, new))

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift")
          if test_path.exists():
              raise SystemExit("redaction source contract unexpectedly already exists")
          test_path.write_text(dedent(r'''\
          import Foundation
          import Testing
          @testable import NembraBluetoothCapture

          @Suite("Tuya authenticated application update secret redaction source contract")
          struct TuyaApplicationUpdateSecretRedactionSourceTests {
              @Test("authenticated application update details are recursively redacted before controller custody")
              func applicationUpdateCannotRetainCredentialShapedValues() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let driver = String(try section(
                      in: source,
                      from: "@MainActor\nprivate final class SmartLifeDriver",
                      to: "#endif\n\nprivate enum AppleAccountAuthorizationError"
                  ))

                  #expect(driver.contains("private static func redactApplicationSecrets(_ object: Any) -> Any"))
                  #expect(driver.contains("secretKeyFragments"))
                  #expect(driver.contains("localkey"))
                  #expect(driver.contains("accesstoken"))
                  #expect(driver.contains("refreshtoken"))
                  #expect(driver.contains("authkey"))
                  #expect(driver.contains("seckey"))
                  #expect(driver.contains("key.lowercased().filter"))
                  #expect(driver.contains("$0.isLetter || $0.isNumber"))
                  #expect(driver.contains("array.map(redactApplicationSecrets)"))
                  #expect(driver.contains("String(describing: Self.redactApplicationSecrets(value))"))
                  #expect(driver.contains("sanitized[keyString] = \"<redacted>\""))
                  #expect(driver.contains("onApplicationUpdate?(sanitized)"))
              }

              @Test("export redaction claim remains coupled to the application-event path")
              func exportRedactionClaimIncludesApplicationEvents() throws {
                  let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")
                  let export = String(try section(
                      in: source,
                      from: "private func makeExport(exportedAt:",
                      to: "func prepareExport()"
                  ))
                  let updates = String(try section(
                      in: source,
                      from: "private func receivedApplicationUpdate(",
                      to: "private func startWatchdog"
                  ))

                  #expect(export.contains("secretsRedacted: true"))
                  #expect(updates.contains("log(\"tuya_application_update\", update.merging(["))
              }

              private func section(in source: String, from start: String, to end: String) throws -> Substring {
                  guard let startRange = source.range(of: start),
                        let endRange = source.range(of: end, range: startRange.upperBound..<source.endIndex) else {
                      Issue.record("Expected source section missing: \(start) ... \(end)")
                      throw SourceContractError.sectionMissing
                  }
                  return source[startRange.lowerBound..<endRange.lowerBound]
              }

              private func readRepositoryFile(_ relativePath: String) throws -> String {
                  let repositoryRoot = URL(fileURLWithPath: #filePath)
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                      .deletingLastPathComponent()
                  return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)
              }

              private enum SourceContractError: Error {
                  case sectionMissing
              }
          }
          '''))

      - name: Validate construction scope and source contract
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift
          python - <<'PY'
          from pathlib import Path
          source = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          driver = source.split('@MainActor\nprivate final class SmartLifeDriver', 1)[1].split('#endif\n\nprivate enum AppleAccountAuthorizationError', 1)[0]
          required = [
              'private static func redactApplicationSecrets(_ object: Any) -> Any',
              'secretKeyFragments', 'localkey', 'accesstoken', 'refreshtoken', 'authkey', 'seckey',
              'key.lowercased().filter', '$0.isLetter || $0.isNumber',
              'array.map(redactApplicationSecrets)',
              'String(describing: Self.redactApplicationSecrets(value))',
              'sanitized[keyString] = "<redacted>"',
              'onApplicationUpdate?(sanitized)'
          ]
          missing = [item for item in required if item not in driver]
          if missing:
              raise SystemExit(f'missing source-contract anchors: {missing}')
          if driver.count('onApplicationUpdate?(sanitized)') != 1:
              raise SystemExit('controller application admission is not singular')
          if 'sanitized[String(describing: key)] = String(describing: value)' in driver:
              raise SystemExit('unsanitized application projection survived')
          test = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift').read_text()
          if 'secretsRedacted: true' not in test or 'tuya_application_update' not in test:
              raise SystemExit('export/event custody regression lost')
          PY
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' '.github/workflows/materialize-capture-secret-redaction-52333.yml' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift' | sort)"
          git diff --check

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-secret-redaction-52333.yml
          git config user.name "nembra-sol-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/materialize-capture-secret-redaction-52333.yml' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationUpdateSecretRedactionSourceTests.swift' | sort)"
          git commit -m "fix(capture): redact authenticated application secrets"
          git push origin HEAD:sol/v14-capture-app-secret-redaction-52333
