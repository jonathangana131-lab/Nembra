name: Capture R3 Generated Helper Execution Autopatch

on:
  push:
    branches:
      - control/v14-auth-stationary-generated-subject-r3-sol
    paths:
      - .github/workflows/capture-r3-generated-helper-execution-autopatch.yml

permissions:
  contents: write

jobs:
  apply-exact-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind patch job to exact staging head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply deterministic accepted-Git-helper repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/apply_r3_generated_helper_execution_fix.py

      - name: Check repaired diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/capture-r3-generated-helper-execution-autopatch.yml
          test ! -e scripts/ci/apply_r3_generated_helper_execution_fix.py
          git diff --name-only

      - name: Compile repaired authority surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py \
            scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py

      - name: Run core R3 authority tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py

      - name: Run generated workflow gate tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_workflow_gates.py

      - name: Run generated helper execution custody regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py

      - name: Commit and push only validated product-test repair
        shell: bash
        env:
          TARGET_BRANCH: control/v14-auth-stationary-generated-subject-r3-sol
        run: |
          set -euo pipefail
          git config user.name "Nembra Capture QA"
          git config user.email "capture@nembra.invalid"
          git add \
            scripts/ci/es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_authenticated_stationary_generated_subject_final_go.py \
            scripts/ci/tests/test_es80_generated_subject_helper_execution_custody.py
          git diff --cached --check
          git commit -m "fix(capture): execute accepted generated helper blob"
          git push origin "HEAD:${TARGET_BRANCH}"
