name: Temporary retained IPA path custody hardening

on:
  push:
    branches:
      - control/v14-auth-stationary-final-go-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reject repository-contained and symlink-aliased retained IPA paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '280db67127960c7007237f4d8e27a7187683b6e8'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/ci/es80_authenticated_stationary_signed_artifact.py');s=p.read_text()
          old='''    ipa = ipa.expanduser().resolve(strict=True)\n    metadata=ipa.lstat()\n    if ipa.name != IPA_NAME or ipa.is_symlink() or not stat.S_ISREG(metadata.st_mode) or stat.S_IMODE(metadata.st_mode) != 0o600 or metadata.st_uid != os.getuid() or metadata.st_nlink != 1:\n        raise SignedArtifactError("retained IPA custody is invalid")\n'''
          new='''    expanded_ipa = ipa.expanduser()\n    try:\n        path_metadata = expanded_ipa.lstat()\n    except OSError as error:\n        raise SignedArtifactError("retained IPA path is unavailable") from error\n    if stat.S_ISLNK(path_metadata.st_mode):\n        raise SignedArtifactError("retained IPA path must not be a symlink")\n    ipa = expanded_ipa.resolve(strict=True)\n    metadata=ipa.lstat()\n    try:\n        ipa.relative_to(repository)\n    except ValueError:\n        pass\n    else:\n        raise SignedArtifactError("retained IPA must remain outside repository")\n    if ipa.name != IPA_NAME or not stat.S_ISREG(metadata.st_mode) or stat.S_IMODE(metadata.st_mode) != 0o600 or metadata.st_uid != os.getuid() or metadata.st_nlink != 1:\n        raise SignedArtifactError("retained IPA custody is invalid")\n'''
          if s.count(old)!=1: raise SystemExit('reinspect custody seam changed')
          s=s.replace(old,new,1)
          old='''    parent = output.parent.resolve(strict=True)\n    output = parent / output.name\n    if output.name != IPA_NAME:\n'''
          new='''    parent = output.parent.resolve(strict=True)\n    try:\n        parent.relative_to(repository)\n    except ValueError:\n        pass\n    else:\n        raise SignedArtifactError("retained IPA output must remain outside repository")\n    output = parent / output.name\n    if output.name != IPA_NAME:\n'''
          if s.count(old)!=1: raise SystemExit('publish custody seam changed')
          p.write_text(s.replace(old,new,1))

          t=Path('scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py');q=t.read_text()
          anchor='''    def test_output_is_no_replace_and_canonical_filename_only(self) -> None:\n'''
          addition='''    def test_retained_ipa_must_stay_outside_repository_and_reinspection_rejects_symlink_alias(self) -> None:\n        inside=self.repo / signed.IPA_NAME\n        with mock.patch.dict(os.environ,{"TMPDIR":str(self.root / "tmp")},clear=False):\n            with self.assertRaises(signed.SignedArtifactError):\n                signed.retain_and_reinspect(self.repo,SOURCE,self.device,self.install_subject(),inside,runner=self.runner)\n        output=self.root / signed.IPA_NAME\n        with mock.patch.dict(os.environ,{"TMPDIR":str(self.root / "tmp")},clear=False):\n            signed.retain_and_reinspect(self.repo,SOURCE,self.device,self.install_subject(),output,runner=self.runner)\n        alias=self.root / "alias.ipa";alias.symlink_to(output)\n        with self.assertRaises(signed.SignedArtifactError):\n            signed.reinspect_retained(alias,self.repo,SOURCE,self.device,self.install_subject(),runner=self.runner)\n\n'''+anchor
          if q.count(anchor)!=1: raise SystemExit('test insertion seam changed')
          t.write_text(q.replace(anchor,addition,1))
          PY
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/es80_authenticated_stationary_signed_artifact.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          git diff --check
      - name: Commit hardening and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-v14-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-harden-retained-ipa-path-custody.yml
          git add scripts/ci/es80_authenticated_stationary_signed_artifact.py scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py
          git diff --cached --check
          git commit -m 'fix(capture): harden retained IPA path custody'
          git push origin HEAD:control/v14-auth-stationary-final-go-sol
