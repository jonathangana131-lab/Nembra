name: Materialize Capture Lossless Reserved Event Custody 29000

on:
  push:
    branches:
      - agent/v14-capture-lossless-reserved-event-custody-29000-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-lossless-reserved-event-custody-29000-sol
          fetch-depth: 0

      - name: Guard exact 29000 product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='29000f240d1b5710bbe116de94a22c030d10da8e'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Apply lossless reserved application-event custody
        run: python3 scripts/ci/materialize_capture_lossless_reserved_event_custody_29000.py apply

      - name: Verify current source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_lossless_reserved_event_custody_29000.py verify
          python3 -m py_compile scripts/ci/materialize_capture_lossless_reserved_event_custody_29000.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyAdmissionRaceSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git diff --check

      - name: Record Apple-only package gate boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '@preconcurrency import CoreBluetooth' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/CoreBluetoothCaptureMapping.swift
          echo 'CoreBluetooth package execution remains delegated to the trusted xcode-27 exact-head runner.'

      - name: Publish clean six-path product delta
        shell: bash
        run: |
          set -euo pipefail
          parent='29000f240d1b5710bbe116de94a22c030d10da8e'
          rm .github/workflows/capture-lossless-reserved-event-custody-29000-materialize.yml
          rm scripts/ci/materialize_capture_lossless_reserved_event_custody_29000.py
          git add -A
          changed="$(git diff --cached "$parent" --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyAdmissionRaceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$parent" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): preserve reserved application evidence after authority fencing'
          git push origin HEAD:agent/v14-capture-lossless-reserved-event-custody-29000-sol
