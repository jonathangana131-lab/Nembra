name: Capture Generated Root Generation Splice Red Team

on:
  push:
    branches:
      - redteam/v17-capture-generated-root-generation-splice-gpt56-go
  pull_request:
    paths:
      - scripts/ci/tests/test_capture_generated_root_generation_splice_red_team.py
      - .github/workflows/capture-generated-root-generation-splice-redteam.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-generated-root-generation-splice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ATTACKED_HEAD: 385e311807fbc832b03fe894eec19f4ed624167e

jobs:
  exploit-evidence:
    name: Root-generation splice evidence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation child
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$ATTACKED_HEAD")" = "$ATTACKED_HEAD"
          changed="$(git diff --name-only "$ATTACKED_HEAD"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-generated-root-generation-splice-redteam.yml \
            scripts/ci/tests/test_capture_generated_root_generation_splice_red_team.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$ATTACKED_HEAD"...HEAD

      - name: Compile root-generation oracle
        run: python3 -m py_compile scripts/ci/tests/test_capture_generated_root_generation_splice_red_team.py

      - name: Reproduce cross-subject root-generation splice
        run: python3 -B -I scripts/ci/tests/test_capture_generated_root_generation_splice_red_team.py

      - name: Preserve exploit-only truth boundary
        run: |
          printf '%s\n' \
            'successMeansExploitReproduced=true' \
            'productionFixIncluded=false' \
            'signingAuthority=false' \
            'installAuthority=false' \
            'bluetoothExecuted=false' \
            'physicalAuthorityCreated=false'
