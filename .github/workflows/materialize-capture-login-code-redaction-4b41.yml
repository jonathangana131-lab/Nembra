name: Materialize Capture Login Code Redaction 4b41

on:
  push:
    branches:
      - sol/v14-capture-login-code-redaction-repair-4b41

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-login-code-redaction-repair-4b41
          fetch-depth: 0

      - name: Guard exact lineage and pre-materialization scope
        shell: bash
        run: |
          set -euo pipefail
          base='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          testfile='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift'
          workflow='.github/workflows/materialize-capture-login-code-redaction-4b41.yml'
          test "$(git merge-base "$base" HEAD)" = "$base"
          mapfile -t paths < <(git diff --name-only "$base"...HEAD | sort)
          expected=("$workflow" "$testfile")
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${paths[@]}" > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Apply fail-closed verification-code scrub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = path.read_text()

          def replace_exact(old: str, new: str, count: int, label: str) -> None:
              global s
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count} occurrence(s), found {actual}')
              s = s.replace(old, new)

          replace_exact(
              'self?.finishLoginFailure(error, submittedIdentity: identity)',
              'self?.finishLoginFailure(error, submittedIdentity: identity, submittedVerificationCode: code)',
              2,
              'login failure callback'
          )
          replace_exact(
              'private func finishLoginFailure(_ error: Error?, submittedIdentity: String)',
              'private func finishLoginFailure(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String)',
              1,
              'finishLoginFailure signature'
          )
          replace_exact(
              'Self.redactedError(error, submittedIdentity: submittedIdentity)',
              'Self.redactedError(error, submittedIdentity: submittedIdentity, submittedVerificationCode: submittedVerificationCode)',
              1,
              'finishLoginFailure sanitizer call'
          )

          start_marker = '    private static func redactedError(_ error: Error?, submittedIdentity: String) -> String {'
          if s.count(start_marker) != 1:
              raise SystemExit(f'redactedError start: expected 1 occurrence, found {s.count(start_marker)}')
          start = s.index(start_marker)
          open_brace = s.index('{', start)
          depth = 0
          end = None
          for index in range(open_brace, len(s)):
              character = s[index]
              if character == '{':
                  depth += 1
              elif character == '}':
                  depth -= 1
                  if depth == 0:
                      end = index + 1
                      break
          if end is None:
              raise SystemExit('redactedError closing brace missing')
          old_function = s[start:end]
          for required in ('localizedDescription', 'submittedIdentity', '<redacted-account>'):
              if required not in old_function:
                  raise SystemExit(f'refusing unexpected redactedError implementation; missing {required}')

          new_function = '''    private static func redactedError(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String) -> String {
              let raw = error?.localizedDescription ?? "unknown error"
              let identity = submittedIdentity.trimmingCharacters(in: .whitespacesAndNewlines)
              let verificationCode = submittedVerificationCode.trimmingCharacters(in: .whitespacesAndNewlines)
              var redacted = raw
              if !identity.isEmpty {
                  redacted = redacted.replacingOccurrences(
                      of: identity,
                      with: "<redacted-account>",
                      options: [.caseInsensitive, .literal]
                  )
              }
              if !verificationCode.isEmpty {
                  redacted = redacted.replacingOccurrences(
                      of: verificationCode,
                      with: "<redacted-verification-code>",
                      options: [.literal]
                  )
              }
              return redacted
          }'''
          s = s[:start] + new_function + s[end:]
          path.write_text(s)
          PY

      - name: Validate intended source contract
        shell: bash
        run: |
          set -euo pipefail
          source='NembraApp/App/NembraCaptureEntrypoint.swift'
          testfile='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift'
          swiftc -parse "$source"
          swiftc -parse "$testfile"
          test "$(grep -Foc 'finishLoginFailure(error, submittedIdentity: identity, submittedVerificationCode: code)' "$source")" -eq 2
          test "$(grep -Foc 'private func finishLoginFailure(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String)' "$source")" -eq 1
          test "$(grep -Foc 'private static func redactedError(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String) -> String' "$source")" -eq 1
          grep -Fq 'let verificationCode = submittedVerificationCode.trimmingCharacters(in: .whitespacesAndNewlines)' "$source"
          grep -Fq 'of: verificationCode' "$source"
          grep -Fq 'with: "<redacted-verification-code>"' "$source"
          grep -Fq 'with: "<redacted-account>"' "$source"
          git diff --check

      - name: Publish clean donor checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-login-code-redaction-4b41.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift .github/workflows/materialize-capture-login-code-redaction-4b41.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): redact submitted verification codes from Tuya errors'
          git push origin HEAD:sol/v14-capture-login-code-redaction-repair-4b41
