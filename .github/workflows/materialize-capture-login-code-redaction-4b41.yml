name: Materialize Capture Login Code Redaction 4b41

on:
  push:
    branches:
      - sol/v14-capture-login-code-redaction-repair-4b41

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-login-code-redaction-repair-4b41
          fetch-depth: 0

      - name: Guard exact lineage and pre-materialization scope
        shell: bash
        run: |
          set -euo pipefail
          base='4b41c9ad783f568d0d353acc9f7016a9bd0b64c2'
          test='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift'
          workflow='.github/workflows/materialize-capture-login-code-redaction-4b41.yml'
          test "$(git merge-base "$base" HEAD)" = "$base"
          mapfile -t paths < <(git diff --name-only "$base"...HEAD | sort)
          expected=("$workflow" "$test")
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${paths[@]}" > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Apply fail-closed verification-code scrub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          s = path.read_text()

          old_call = 'self?.finishLoginFailure(error, submittedIdentity: identity)'
          new_call = 'self?.finishLoginFailure(error, submittedIdentity: identity, submittedVerificationCode: code)'
          if s.count(old_call) != 2:
              raise SystemExit(f'expected 2 login failure callbacks, found {s.count(old_call)}')
          s = s.replace(old_call, new_call)

          old_failure = '''    private func finishLoginFailure(_ error: Error?, submittedIdentity: String) {
              busy = false
              verificationCode = ""
              loggedIn = OfficialTuyaFactory.accountLoggedIn
              status = "Tuya SDK login failed: \\(Self.redactedError(error, submittedIdentity: submittedIdentity))"
          }
          '''
          new_failure = '''    private func finishLoginFailure(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String) {
              busy = false
              verificationCode = ""
              loggedIn = OfficialTuyaFactory.accountLoggedIn
              status = "Tuya SDK login failed: \\(Self.redactedError(error, submittedIdentity: submittedIdentity, submittedVerificationCode: submittedVerificationCode))"
          }
          '''
          if s.count(old_failure) != 1:
              raise SystemExit(f'expected exact finishLoginFailure body once, found {s.count(old_failure)}')
          s = s.replace(old_failure, new_failure)

          old_scrubber = '''    private static func redactedError(_ error: Error?, submittedIdentity: String) -> String {
              let raw = error?.localizedDescription ?? "unknown error"
              let identity = submittedIdentity.trimmingCharacters(in: .whitespacesAndNewlines)
              guard !identity.isEmpty else { return raw }
              return raw.replacingOccurrences(
                  of: identity,
                  with: "<redacted-account>",
                  options: [.caseInsensitive, .literal]
              )
          }
          '''
          new_scrubber = '''    private static func redactedError(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String) -> String {
              let raw = error?.localizedDescription ?? "unknown error"
              let identity = submittedIdentity.trimmingCharacters(in: .whitespacesAndNewlines)
              let verificationCode = submittedVerificationCode.trimmingCharacters(in: .whitespacesAndNewlines)
              var redacted = raw
              if !identity.isEmpty {
                  redacted = redacted.replacingOccurrences(
                      of: identity,
                      with: "<redacted-account>",
                      options: [.caseInsensitive, .literal]
                  )
              }
              if !verificationCode.isEmpty {
                  redacted = redacted.replacingOccurrences(
                      of: verificationCode,
                      with: "<redacted-verification-code>",
                      options: [.literal]
                  )
              }
              return redacted
          }
          '''
          if s.count(old_scrubber) != 1:
              raise SystemExit(f'expected exact redactedError body once, found {s.count(old_scrubber)}')
          s = s.replace(old_scrubber, new_scrubber)
          path.write_text(s)
          PY

      - name: Validate intended source contract
        shell: bash
        run: |
          set -euo pipefail
          source='NembraApp/App/NembraCaptureEntrypoint.swift'
          testfile='Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift'
          swiftc -parse "$source"
          swiftc -parse "$testfile"
          test "$(grep -Foc 'finishLoginFailure(error, submittedIdentity: identity, submittedVerificationCode: code)' "$source")" -eq 2
          grep -Fq 'private func finishLoginFailure(_ error: Error?, submittedIdentity: String, submittedVerificationCode: String)' "$source"
          grep -Fq 'let verificationCode = submittedVerificationCode.trimmingCharacters(in: .whitespacesAndNewlines)' "$source"
          grep -Fq 'of: verificationCode' "$source"
          grep -Fq 'with: "<redacted-verification-code>"' "$source"
          grep -Fq 'with: "<redacted-account>"' "$source"
          git diff --check

      - name: Publish clean donor checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capture-login-code-redaction-4b41.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaVerificationCodeRedactionSourceTests.swift .github/workflows/materialize-capture-login-code-redaction-4b41.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(capture): redact submitted verification codes from Tuya errors'
          git push origin HEAD:sol/v14-capture-login-code-redaction-repair-4b41
