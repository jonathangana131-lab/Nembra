name: Capture Secure Link readiness one-shot

on:
  push:
    branches:
      - capture/one-time-ble-dump-gpt56

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Capture: arm Secure Link readiness repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: capture/one-time-ble-dump-gpt56

      - name: Bind exact authoring parent and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fca44b23203c05de375f0f758e134b3ff4d7659c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/capture-secure-link-readiness-one-shot.yml"

      - name: Apply canonical Secure Link readiness presentation
        shell: python
        run: |
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          body = path.read_text()
          old = 'requirementRow("Scooter data received", ready: test.applicationUpdateCount > 0)'
          new = 'requirementRow("Scooter data received", ready: test.preflightVerdict == .readyForStationaryMapping)'
          count = body.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy readiness row, found {count}')
          body = body.replace(old, new)
          path.write_text(body)

      - name: Run focused product-truth regression
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture --filter TuyaSecureLinkProductSurfaceSourceTests

      - name: Enforce narrow product delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected=$'.github/workflows/capture-secure-link-readiness-one-shot.yml\nNembraApp/App/NembraCaptureEntrypoint.swift'
          test "$changed" = "$expected"
          ! grep -q 'publishDps(' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Publish coherent repair and retire one-shot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/capture-secure-link-readiness-one-shot.yml
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/capture-secure-link-readiness-one-shot.yml
          git commit -m "Capture: align Secure Link UI with canonical readiness"
          git push origin HEAD:capture/one-time-ble-dump-gpt56
