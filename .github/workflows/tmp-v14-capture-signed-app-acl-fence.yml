name: Temporary V14 Capture Signed App ACL Fence

on:
  push:
    branches:
      - repair/v14-capture-private-device-runner-execution-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v14-capture-private-device-runner-execution-sol
          fetch-depth: 0

      - name: Materialize and prove ACL-free stage contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '/usr/bin/ditto --noacl "$APP" "$APP_INSTALL_STAGE"' scripts/field/install_one_time_capture.command; then
            echo 'Permanent ACL fence is already materialized.'
            exit 0
          fi
          /usr/bin/python3 -B scripts/ci/tmp_materialize_signed_app_acl_fence.py
          /bin/bash -n scripts/field/install_one_time_capture.command
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_signed_app_install_custody.py

          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/source.app"
          printf 'accepted\n' > "$fixture/source.app/subject.txt"
          /bin/chmod +a "$(id -un) allow write,delete,add_file,add_subdirectory,file_inherit,directory_inherit" "$fixture/source.app"
          /usr/bin/find "$fixture/source.app" -acl -print -quit | grep -q .
          /usr/bin/ditto --noacl "$fixture/source.app" "$fixture/staged.app"
          test -z "$(/usr/bin/find "$fixture/staged.app" -acl -print -quit)"
          git diff --check

      - name: Commit installer product repair only
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/field/install_one_time_capture.command
          if git diff --cached --quiet; then
            echo 'No installer product change to publish.'
            exit 0
          fi
          git config user.name 'nembra-capture-bot'
          git config user.email 'nembra-capture-bot@users.noreply.github.com'
          git commit -m 'fix(capture): strip ACLs from protected signed-app stage'
          git push origin HEAD:repair/v14-capture-private-device-runner-execution-sol
