name: Materialize Capture Status Secret Custody

on:
  push:
    branches:
      - sol/v14-capture-status-secret-custody-20260810

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-status-secret-custody-20260810
          fetch-depth: 0

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          product_parent='e8acd80c6f220529a98a4a4829514829c3321daa'
          git merge-base --is-ancestor "$product_parent" HEAD
          git diff --quiet "$product_parent" HEAD -- NembraApp/Features/Research/TuyaAccountBridge.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift

      - name: Apply status secret-custody repair
        run: python3 scripts/ci/materialize_capture_status_secret_custody.py apply

      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_status_secret_custody.py verify
          python3 -m py_compile scripts/ci/materialize_capture_status_secret_custody.py
          swiftc -parse NembraApp/Features/Research/TuyaAccountBridge.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaMetadataStatusSecretRedactionSourceTests.swift
          git diff --check

      - name: Publish clean product bytes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-status-secret-custody-materialize.yml
          rm scripts/ci/materialize_capture_status_secret_custody.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): redact retained status metadata"
          git push origin HEAD:sol/v14-capture-status-secret-custody-20260810
