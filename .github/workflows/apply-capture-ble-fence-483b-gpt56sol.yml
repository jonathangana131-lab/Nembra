name: Apply Capture BLE fence 483b

on:
  push:
    branches:
      - tmp/v14-capture-ble-fence-483b-gpt56sol

permissions:
  contents: write

concurrency:
  group: capture-ble-fence-483b-gpt56sol
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/v14-capture-ble-fence-483b-gpt56sol
          fetch-depth: 0

      - name: Guard exact 483b product source
        shell: bash
        run: |
          set -euo pipefail
          parent='483b9fb943f1ba2825e24955b5a819fec7d2a449'
          test "$(git rev-parse HEAD^)" = "$parent"
          test "$(git rev-parse "$parent:NembraApp/App/NembraCaptureEntrypoint.swift")" = '9e9b7a2501ca0b82972463d6bfb53f4d4263401b'
          test "$(git rev-parse HEAD:NembraApp/App/NembraCaptureEntrypoint.swift)" = '9e9b7a2501ca0b82972463d6bfb53f4d4263401b'

      - name: Restore reviewed regression and apply observation-only fence
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          test_path = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipSourceTests.swift")
          reviewed = subprocess.check_output([
              "git", "show",
              "4051585975116eaa8d23fec5e76e80abb4116a39:Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipSourceTests.swift"
          ])
          test_path.write_bytes(reviewed)

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          text = path.read_text(encoding="utf-8")
          guard_anchor = "        guard currentConnectionToken == nil else {\n"
          guard_code = (
              "        guard !OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID) else {\n"
              "            failLocally(\n"
              "                \"Tuya still reports a current local-BLE session for this scooter. Power the scooter OFF and wait for that session to clear, or relaunch Capture. Package-owned correlation will not scan while Tuya still owns local BLE.\",\n"
              "                \"existing_sdk_local_ble_ownership_blocks_scan\"\n"
              "            )\n"
              "            return\n"
              "        }\n"
          )
          start = text.index("    private func beginCorrelationSeries()")
          end = text.index("    func startNextCorrelationWindow()", start)
          section = text[start:end]
          if section.count(guard_anchor) != 1 or "OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)" in section:
              raise SystemExit("unexpected beginCorrelationSeries source")
          text = text[:start] + section.replace(guard_anchor, guard_code + guard_anchor, 1) + text[end:]

          factory_anchor = "    static func make() -> OfficialTuyaDriver? {\n"
          factory_method = (
              "    static func isLocallyConnected(uuid: String) -> Bool {\n"
              "#if canImport(ThingSmartHomeKit) && canImport(NembraTuyaPrivateConfig)\n"
              "        guard bootstrap(), !uuid.isEmpty else { return false }\n"
              "        return ThingSmartBLEManager.sharedInstance().deviceStatue(withUUID: uuid)\n"
              "#else\n"
              "        return false\n"
              "#endif\n"
              "    }\n\n"
          )
          start = text.index("private enum OfficialTuyaFactory")
          end = text.index("#if canImport(ThingSmartHomeKit)\n@MainActor\nprivate final class OfficialTuyaMembershipProbe", start)
          section = text[start:end]
          if section.count(factory_anchor) != 1 or "static func isLocallyConnected(uuid: String) -> Bool" in section:
              raise SystemExit("unexpected OfficialTuyaFactory source")
          path.write_text(text[:start] + section.replace(factory_anchor, factory_method + factory_anchor, 1) + text[end:], encoding="utf-8")

      - name: Verify portable ownership contract
        shell: python
        run: |
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")
          start = app.index("private func beginCorrelationSeries()")
          end = app.index("func startNextCorrelationWindow()", start)
          begin = app[start:end]
          read = begin.index("OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)")
          scan = begin.index("resetDiscoverySessionOnly()")
          if read >= scan: raise SystemExit("ownership read must precede package scanner")
          for needle in ("existing_sdk_local_ble_ownership_blocks_scan", "Package-owned correlation will not scan while Tuya still owns local BLE", "return"):
              if needle not in begin[read:scan]: raise SystemExit("missing fail-closed contract: " + needle)
          for needle in ("disconnectBLE", "publishDps", "queryDps", "sessionLedger.endConnection"):
              if needle in begin: raise SystemExit("manufactured transport/command behavior: " + needle)
          factory = app[app.index("private enum OfficialTuyaFactory"):app.index("private final class OfficialTuyaMembershipProbe")]
          for needle in ("static func isLocallyConnected(uuid: String) -> Bool", "ThingSmartBLEManager.sharedInstance().deviceStatue(withUUID: uuid)"):
              if needle not in factory: raise SystemExit("missing official authority: " + needle)
          test = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipSourceTests.swift").read_text(encoding="utf-8")
          for needle in ("package correlation refuses to scan while Tuya still owns same-device local BLE", "global ownership read uses official Tuya manager", "pre-scan ownership gate does not manufacture disconnect or command"):
              if needle not in test: raise SystemExit("missing reviewed regression: " + needle)

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/apply-capture-ble-fence-483b-gpt56sol.yml
          git config user.name nembra-go-bot
          git config user.email nembra-go-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(capture): fence cross-controller Tuya BLE ownership' \
            -m 'Preserve current async account custody and Apple-backed account product bytes while refusing package-owned OFF1 scanning if official Tuya same-device local BLE is still online. Observation-only fail-closed gate; no disconnect, write, DP query/command, ledger terminal, or physical claim.'
          git push origin HEAD:tmp/v14-capture-ble-fence-483b-gpt56sol
