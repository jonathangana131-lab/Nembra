name: Diagnose Capture Producer Custody Tests

on:
  push:
    branches:
      - sol/v14-capture-producer-custody-gate-retirement-1558

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/ci/xcode27_signed_field_candidate.sh
      - run: bash -n scripts/ci/xcode27_today_research_field_candidate.sh

  python-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_xcode27_signed_field_candidate_python_custody_source.py
          - test_xcode27_signed_field_candidate_descriptor_subject_custody_source.py
          - test_xcode27_signed_field_candidate_process_startup_custody.py
          - test_xcode27_signed_field_candidate_source.py
          - test_xcode27_signed_field_candidate_intended_device.py
          - test_xcode27_signed_field_candidate_build_setting_authority.py
          - test_xcode27_today_research_field_candidate.py
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.test }}
        run: python3 scripts/ci/tests/${{ matrix.test }}
