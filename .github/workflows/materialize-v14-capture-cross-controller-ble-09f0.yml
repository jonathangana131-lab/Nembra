name: Materialize V14 Capture cross-controller BLE clearance

on:
  push:
    branches:
      - fix/v14-capture-cross-controller-ble-09f0-sol

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply observation-only pre-scan gate
        run: python3 scripts/ci/apply_v14_capture_cross_controller_ble_clearance.py
      - name: Validate exact authority boundary
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipSourceTests.swift
          python3 - <<'PY'
          from pathlib import Path
          app = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text(encoding='utf-8')
          start = app.index('private func beginCorrelationSeries()')
          end = app.index('func startNextCorrelationWindow()', start)
          body = app[start:end]
          read = body.index('OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)')
          scanner = body.index('resetDiscoverySessionOnly()')
          assert read < scanner
          assert 'existing_sdk_local_ble_ownership_blocks_scan' in body[read:scanner]
          assert 'return' in body[read:scanner]
          for forbidden in ('disconnectBLE','publishDps','queryDps','sessionLedger.endConnection'):
              assert forbidden not in body
          fstart = app.index('private enum OfficialTuyaFactory')
          fend = app.index('#if canImport(ThingSmartHomeKit)\n@MainActor\nprivate final class OfficialTuyaMembershipProbe', fstart)
          factory = app[fstart:fend]
          assert 'static func isLocallyConnected(uuid: String) -> Bool' in factory
          assert 'ThingSmartBLEManager.sharedInstance().deviceStatue(withUUID: uuid)' in factory
          assert 'test.canRestartFromFreshOFF1 && (!sdkAccount.loggedIn || !test.sdkAccountLoggedIn)' in app
          assert 'OFF → ON → OFF → ON signal pattern' in app
          PY
          git diff --check
      - name: Publish clean two-file repair
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/apply_v14_capture_cross_controller_ble_clearance.py
          rm .github/workflows/materialize-v14-capture-cross-controller-ble-09f0.yml
          git add -A
          git diff --cached --check
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): fence scan behind global Tuya BLE clearance'
          git push origin HEAD:fix/v14-capture-cross-controller-ble-09f0-sol
