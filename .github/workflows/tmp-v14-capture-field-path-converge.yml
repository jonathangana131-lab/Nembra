name: TEMP Capture Field Accepted Source Convergence

on:
  push:
    branches:
      - repair/v14-capture-vnode-attrib-successor-2838-sol

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-capture-vnode-attrib-successor-2838-sol
          fetch-depth: 0

      - name: Carry exact-source path custody onto selected successor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          installer_path = Path("scripts/field/install_one_time_capture.command")
          installer = installer_path.read_text(encoding="utf-8")
          old = '[[ -f "$ROOT/$TUYA_BUILD_WINDOW_GUARD_RELATIVE" ]] || die "Private Tuya build-window custody guard is missing from the accepted source."'
          new = 'GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git cat-file -e "$SOURCE_SHA:$TUYA_BUILD_WINDOW_GUARD_RELATIVE" 2>/dev/null || die "Private Tuya build-window custody guard is missing from the exact accepted Git source."'
          if installer.count(old) != 1:
              raise SystemExit(f"installer mutable guard precheck: expected 1 match, found {installer.count(old)}")
          installer_path.write_text(installer.replace(old, new, 1), encoding="utf-8")

          test_path = Path("scripts/ci/tests/test_capture_field_accepted_source_path_contract.py")
          test = test_path.read_text(encoding="utf-8")
          old = '''        self.assertIn(
            '[[ -f "$ROOT/$TUYA_BUILD_WINDOW_GUARD_RELATIVE" ]]',
            source,
        )
'''
          new = '''        self.assertIn(
            'GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git cat-file -e "$SOURCE_SHA:$TUYA_BUILD_WINDOW_GUARD_RELATIVE"',
            source,
        )
        self.assertNotIn(
            '[[ -f "$ROOT/$TUYA_BUILD_WINDOW_GUARD_RELATIVE" ]]',
            source,
            "field installer must not gate exact-source execution on mutable worktree guard presence",
        )
'''
          if test.count(old) != 1:
              raise SystemExit(f"accepted-source path regression: expected 1 mutable-presence assertion, found {test.count(old)}")
          test_path.write_text(test.replace(old, new, 1), encoding="utf-8")

          workflow_path = Path(".github/workflows/capture-field-build-provenance.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          trigger = '      - scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py\n      - scripts/ci/tests/test_tuya_account_transport_source.py\n'
          trigger_new = '      - scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py\n      - scripts/ci/tests/test_capture_field_accepted_source_path_contract.py\n      - scripts/ci/tests/test_tuya_account_transport_source.py\n'
          if workflow.count(trigger) != 1:
              raise SystemExit(f"field workflow path trigger insertion: expected 1 match, found {workflow.count(trigger)}")
          workflow = workflow.replace(trigger, trigger_new, 1)

          validation = '          /usr/bin/python3 -I scripts/ci/es80_signed_field_artifact_evidence.py --self-test\n          bash -n scripts/field/install_one_time_capture.command\n'
          validation_new = '          /usr/bin/python3 -I scripts/ci/es80_signed_field_artifact_evidence.py --self-test\n          bash -n scripts/field/install_one_time_capture.command\n          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_accepted_source_path_contract.py\n          /usr/bin/python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract\n'
          if workflow.count(validation) != 1:
              raise SystemExit(f"field workflow accepted-source test insertion: expected 1 match, found {workflow.count(validation)}")
          workflow_path.write_text(workflow.replace(validation, validation_new, 1), encoding="utf-8")
          PY

          git diff --check
          bash -n scripts/field/install_one_time_capture.command
          python3 -m py_compile scripts/ci/tests/test_capture_field_accepted_source_path_contract.py
          python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/field/install_one_time_capture.command \
            scripts/ci/tests/test_capture_field_accepted_source_path_contract.py \
            .github/workflows/capture-field-build-provenance.yml
          git commit -m "Capture: close field accepted-source path custody"

      - name: Remove materializer and publish clean convergence
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-v14-capture-field-path-converge.yml
          git commit -m "Capture: remove field path convergence materializer"
          git push origin HEAD:repair/v14-capture-vnode-attrib-successor-2838-sol
