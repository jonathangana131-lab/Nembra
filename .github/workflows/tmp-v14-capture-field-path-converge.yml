name: TEMP Capture Field Accepted Source Convergence

on:
  push:
    branches:
      - repair/v14-capture-vnode-attrib-successor-2838-sol

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v14-capture-vnode-attrib-successor-2838-sol
          fetch-depth: 0

      - name: Carry exact-source path custody onto selected successor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              Path("scripts/field/install_one_time_capture.command"),
              '[[ -f "$ROOT/$TUYA_BUILD_WINDOW_GUARD_RELATIVE" ]] || die "Private Tuya build-window custody guard is missing from the accepted source."',
              'GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git cat-file -e "$SOURCE_SHA:$TUYA_BUILD_WINDOW_GUARD_RELATIVE" 2>/dev/null || die "Private Tuya build-window custody guard is missing from the exact accepted Git source."',
              "installer mutable guard precheck",
          )

          old_test = (
              "        self.assertIn(\n"
              "            '[[ -f \"$ROOT/$TUYA_BUILD_WINDOW_GUARD_RELATIVE\" ]]',\n"
              "            source,\n"
              "        )\n"
          )
          new_test = (
              "        self.assertIn(\n"
              "            'GIT_NO_REPLACE_OBJECTS=1 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git cat-file -e \"$SOURCE_SHA:$TUYA_BUILD_WINDOW_GUARD_RELATIVE\"',\n"
              "            source,\n"
              "        )\n"
              "        self.assertNotIn(\n"
              "            '[[ -f \"$ROOT/$TUYA_BUILD_WINDOW_GUARD_RELATIVE\" ]]',\n"
              "            source,\n"
              "            \"field installer must not gate exact-source execution on mutable worktree guard presence\",\n"
              "        )\n"
          )
          replace_once(
              Path("scripts/ci/tests/test_capture_field_accepted_source_path_contract.py"),
              old_test,
              new_test,
              "accepted-source path regression",
          )

          trigger = (
              "      - scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py\n"
              "      - scripts/ci/tests/test_tuya_account_transport_source.py\n"
          )
          trigger_new = (
              "      - scripts/ci/tests/test_capture_apple_signin_field_entitlement_custody.py\n"
              "      - scripts/ci/tests/test_capture_field_accepted_source_path_contract.py\n"
              "      - scripts/ci/tests/test_tuya_account_transport_source.py\n"
          )
          replace_once(
              Path(".github/workflows/capture-field-build-provenance.yml"),
              trigger,
              trigger_new,
              "field workflow path trigger",
          )

          validation = (
              "          /usr/bin/python3 -I scripts/ci/es80_signed_field_artifact_evidence.py --self-test\n"
              "          bash -n scripts/field/install_one_time_capture.command\n"
          )
          validation_new = (
              "          /usr/bin/python3 -I scripts/ci/es80_signed_field_artifact_evidence.py --self-test\n"
              "          bash -n scripts/field/install_one_time_capture.command\n"
              "          /usr/bin/python3 -m py_compile scripts/ci/tests/test_capture_field_accepted_source_path_contract.py\n"
              "          /usr/bin/python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract\n"
          )
          replace_once(
              Path(".github/workflows/capture-field-build-provenance.yml"),
              validation,
              validation_new,
              "field workflow accepted-source test",
          )
          PY

          git diff --check
          bash -n scripts/field/install_one_time_capture.command
          python3 -m py_compile scripts/ci/tests/test_capture_field_accepted_source_path_contract.py
          python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/field/install_one_time_capture.command \
            scripts/ci/tests/test_capture_field_accepted_source_path_contract.py \
            .github/workflows/capture-field-build-provenance.yml
          git commit -m "Capture: close field accepted-source path custody"

      - name: Remove materializer and publish clean convergence
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-v14-capture-field-path-converge.yml
          git commit -m "Capture: remove field path convergence materializer"
          git push origin HEAD:repair/v14-capture-vnode-attrib-successor-2838-sol
