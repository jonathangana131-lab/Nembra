name: TMP Capture First-Fold VoiceOver Repair

on:
  push:
    branches:
      - polish/v14-capture-root-first-fold-sol-1311jx-20260811
    paths:
      - .github/workflows/tmp-v14-capture-first-fold-voiceover-repair.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: polish/v14-capture-root-first-fold-sol-1311jx-20260811

      - name: Bind materializer parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bcda13b6b575723da24259b9fe149558dd79aa3d"

      - name: Restore explicit spoken physical authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NembraApp/App/NembraCaptureEntrypoint.swift")
          source = path.read_text(encoding="utf-8")
          authority = "Link the Tuya Smart account that owns this scooter. Bluetooth and physical evidence stay locked until the reviewed field build and fresh scooter authority are verified."
          text_marker = f'                Text("{authority}")'
          label = f'                    .accessibilityLabel(Text(verbatim: "{authority}"))'
          if source.count(text_marker) != 1:
              raise SystemExit(f"expected one root hero authority Text, found {source.count(text_marker)}")
          if label in source:
              raise SystemExit("verbatim authority label already present")
          start = source.index(text_marker)
          end = source.index("\n            }", start)
          region = source[start:end]
          fixed = "                    .fixedSize(horizontal: false, vertical: true)"
          if region.count(fixed) != 1:
              raise SystemExit(f"expected one root hero fixedSize marker, found {region.count(fixed)}")
          region = region.replace(fixed, fixed + "\n" + label, 1)
          source = source[:start] + region + source[end:]
          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify spoken-authority contract shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path("NembraApp/App/NembraCaptureEntrypoint.swift").read_text(encoding="utf-8")
          marker = '.accessibilityLabel(Text(verbatim: "Link the Tuya Smart account that owns this scooter. Bluetooth and physical evidence stay locked until the reviewed field build and fresh scooter authority are verified."))'
          if app.count(marker) != 1:
              raise SystemExit("explicit verbatim authority label not materialized exactly once")
          test = Path("Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/CaptureFirstFoldVoiceOverSourceTests.swift").read_text(encoding="utf-8")
          for token in ("bluetooth", "physical evidence", "lock", "build", "scooter", "authority"):
              if f'normalized.contains("{token}")' not in test:
                  raise SystemExit(f"missing retained source-contract token: {token}")
          PY
          git diff --check

      - name: Publish clean successor
        shell: bash
        env:
          BRANCH: polish/v14-capture-root-first-fold-sol-1311jx-20260811
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-v14-capture-first-fold-voiceover-repair.yml
          git diff --check
          git config user.name "nembra-swarm"
          git config user.email "actions@users.noreply.github.com"
          git add NembraApp/App/NembraCaptureEntrypoint.swift .github/workflows/tmp-v14-capture-first-fold-voiceover-repair.yml
          git commit -m "Capture: preserve spoken authority after copy compaction"
          git push origin "HEAD:${BRANCH}"
