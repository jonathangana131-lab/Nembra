name: Materialize Capture Lossless Reserved Event Custody 4a118

on:
  push:
    branches:
      - agent/v14-capture-lossless-reserved-event-custody-4a118-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-lossless-reserved-event-custody-4a118-sol
          fetch-depth: 0

      - name: Guard exact 4a118 product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='4a11865c4b16b778aa03634e7ca3bdbc50b0432e'
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test -f Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift
          test -f Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift

      - name: Apply lossless reserved-field custody
        run: python3 scripts/ci/materialize_capture_lossless_reserved_event_custody_4a118.py apply

      - name: Verify exact source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_capture_lossless_reserved_event_custody_4a118.py verify
          python3 -m py_compile scripts/ci/materialize_capture_lossless_reserved_event_custody_4a118.py
          swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -parse Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyAdmissionRaceSourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift
          swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift
          git diff --check

      - name: Confirm Apple-only package gate boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '@preconcurrency import CoreBluetooth' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/CoreBluetoothCaptureMapping.swift
          echo 'NembraBluetoothCapture package execution is delegated to trusted xcode-27 exact-head prevalidation because Linux has no CoreBluetooth module.'

      - name: Publish clean product bytes
        shell: bash
        run: |
          set -euo pipefail
          parent='4a11865c4b16b778aa03634e7ca3bdbc50b0432e'
          rm .github/workflows/capture-lossless-reserved-event-custody-4a118-materialize.yml
          rm scripts/ci/materialize_capture_lossless_reserved_event_custody_4a118.py
          git add -A
          changed="$(git diff --cached "$parent" --name-only | sort)"
          expected="$(printf '%s\n' \
            'NembraApp/App/NembraCaptureEntrypoint.swift' \
            'Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedApplicationEventCustody.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedApplicationEventCustodyTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventCustodyAdmissionRaceSourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationAccountUIDExportCustodySourceTests.swift' \
            'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaApplicationEventMetadataPrecedenceSourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --cached "$parent" --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): preserve reserved application evidence in event custody'
          git push origin HEAD:agent/v14-capture-lossless-reserved-event-custody-4a118-sol
