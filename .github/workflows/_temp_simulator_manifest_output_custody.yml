name: Temp Simulator Manifest Output Custody

on:
  push:
    branches:
      - integration/es80-v14-simulator-manifest-output-custody-gpt56-go
    paths:
      - .github/workflows/_temp_simulator_manifest_output_custody.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Bind visual manifest publication to retained root descriptor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/xcode27_simulator_capture.sh")
          text = path.read_text(encoding="utf-8")

          invocation = '''VISUAL_EVIDENCE_MANIFEST="$ARTIFACTS_DIR/NembraCaptureSimulatorVisualEvidence.json"\npython3 - \\\n'''
          replacement = '''VISUAL_EVIDENCE_MANIFEST="$ARTIFACTS_DIR/NembraCaptureSimulatorVisualEvidence.json"\nVISUAL_EVIDENCE_MANIFEST_SHA256="$(python3 - \\\n'''
          if text.count(invocation) != 1:
              raise SystemExit("could not uniquely locate visual manifest Python invocation")
          text = text.replace(invocation, replacement)

          manifest_path = 'manifest_path = Path(manifest_path_text).resolve()\n'
          manifest_name = '''manifest_name = Path(manifest_path_text).name\nif manifest_name != "NembraCaptureSimulatorVisualEvidence.json":\n    raise SystemExit("unexpected Simulator visual-evidence manifest filename")\n'''
          if text.count(manifest_path) != 1:
              raise SystemExit("could not uniquely locate manifest pathname admission")
          text = text.replace(manifest_path, manifest_name)

          start_marker = "entries = []\ntry:\n    root_before = os.fstat(artifacts_fd)\n"
          end_marker = '''with manifest_path.open("xb") as handle:\n    handle.write(manifest_bytes)\nPY\n\nVISUAL_EVIDENCE_MANIFEST_SHA256="$(shasum -a 256 "$VISUAL_EVIDENCE_MANIFEST" | awk '{print $1}')"\n'''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate exact visual manifest publication block")
          end += len(end_marker)

          improved = '''entries = []\ntry:\n    root_before = os.fstat(artifacts_fd)\n    if not stat.S_ISDIR(root_before.st_mode):\n        raise SystemExit("Simulator artifact root is not one directory")\n\n    for artifact_kind, relative_root in (\n        ("simulatorScreenshot", "screenshots"),\n        ("xctestAttachment", "test-attachments"),\n    ):\n        entries.extend(\n            collect_directory(\n                artifacts_fd,\n                relative_root,\n                relative_root,\n                artifact_kind,\n            )\n        )\n\n    root_after = os.fstat(artifacts_fd)\n    if stable_identity(root_before) != stable_identity(root_after):\n        raise SystemExit("Simulator artifact root changed during visual-evidence enumeration")\n\n    entries.sort(key=lambda entry: (str(entry["relativePath"]), str(entry["artifactKind"])))\n\n    screenshot_entries = [entry for entry in entries if entry["artifactKind"] == "simulatorScreenshot"]\n    if not screenshot_entries:\n        raise SystemExit("visual evidence manifest requires at least one retained Simulator screenshot")\n    if any(entry["byteCount"] <= 0 for entry in entries):\n        raise SystemExit("visual evidence manifest refuses empty retained evidence files")\n\n    manifest = {\n        "schemaVersion": 1,\n        "authority": "simulator-visual-evidence-not-physical-authorization",\n        "buildIdentifier": build_identifier,\n        "buildInstanceID": build_instance_id,\n        "sourceCommitSHA": source_commit_sha,\n        "externalBuildRecordSHA256": external_build_record_sha256,\n        "files": entries,\n    }\n    manifest_bytes = json.dumps(manifest, indent=2, sort_keys=True).encode("utf-8") + b"\\n"\n    manifest_flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW\n    if hasattr(os, "O_CLOEXEC"):\n        manifest_flags |= os.O_CLOEXEC\n    try:\n        manifest_fd = os.open(manifest_name, manifest_flags, 0o600, dir_fd=artifacts_fd)\n    except OSError as exc:\n        raise SystemExit("could not publish Simulator visual-evidence manifest without replacement") from exc\n    try:\n        with os.fdopen(os.dup(manifest_fd), "wb", closefd=True) as handle:\n            handle.write(manifest_bytes)\n            handle.flush()\n            os.fsync(handle.fileno())\n        manifest_after = os.fstat(manifest_fd)\n        if (\n            not stat.S_ISREG(manifest_after.st_mode)\n            or manifest_after.st_size != len(manifest_bytes)\n            or manifest_after.st_nlink != 1\n        ):\n            raise SystemExit("published Simulator visual-evidence manifest identity is invalid")\n    finally:\n        os.close(manifest_fd)\n\n    print(hashlib.sha256(manifest_bytes).hexdigest())\nfinally:\n    os.close(artifacts_fd)\nPY\n)"\n'''
          text = text[:start] + improved + text[end:]

          bootstrap = 'python3 scripts/ci/tests/test_xcode27_simulator_visual_evidence_descriptor_custody_source.py\n'
          augmented = bootstrap + 'python3 scripts/ci/tests/test_xcode27_simulator_visual_manifest_output_custody_source.py\n'
          if text.count(bootstrap) != 1:
              raise SystemExit("could not uniquely locate visual custody bootstrap")
          text = text.replace(bootstrap, augmented)

          for forbidden in ('manifest_path.open("xb")', 'shasum -a 256 "$VISUAL_EVIDENCE_MANIFEST"'):
              if forbidden in text:
                  raise SystemExit(f"pathname manifest publication remains: {forbidden}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate source contracts and shell
        run: |
          bash -n scripts/ci/xcode27_simulator_capture.sh
          python3 -m py_compile scripts/ci/tests/test_xcode27_simulator_visual_evidence_descriptor_custody_source.py
          python3 -m py_compile scripts/ci/tests/test_xcode27_simulator_visual_manifest_output_custody_source.py
          python3 scripts/ci/tests/test_xcode27_simulator_visual_evidence_descriptor_custody_source.py
          python3 scripts/ci/tests/test_xcode27_simulator_visual_manifest_output_custody_source.py
          git diff --check

      - name: Commit hardened harness and self-delete transformer
        run: |
          rm .github/workflows/_temp_simulator_manifest_output_custody.yml
          git config user.name "nembra-v14-bot"
          git config user.email "nembra-v14-bot@users.noreply.github.com"
          git add scripts/ci/xcode27_simulator_capture.sh \
                  scripts/ci/tests/test_xcode27_simulator_visual_manifest_output_custody_source.py \
                  .github/workflows/_temp_simulator_manifest_output_custody.yml
          git commit -m "[Capture visual QA v14] Bind visual manifest publication to descriptor"
          git push origin HEAD:integration/es80-v14-simulator-manifest-output-custody-gpt56-go
