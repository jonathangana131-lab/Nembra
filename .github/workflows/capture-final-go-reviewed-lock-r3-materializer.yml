name: Capture Final GO Reviewed Lock R3 Materializer

on:
  push:
    branches:
      - recovery/v14-final-go-reviewed-lock-r3-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact accepted parent
        shell: bash
        run: |
          set -euo pipefail
          parent=ccab1d76b2cfe7448f012d5df8e622cbaf8d371d
          donor=7ca39be83842acb77e7c4eb46868d3348c8e4744
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          test "$(git diff --name-only "$parent" HEAD)" = '.github/workflows/capture-final-go-reviewed-lock-r3-materializer.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git cat-file -e "$donor^{commit}"

      - name: Materialize reviewed dependency-lock authority
        shell: bash
        run: |
          set -euo pipefail
          donor=7ca39be83842acb77e7c4eb46868d3348c8e4744
          cp scripts/ci/tests/test_es80_authenticated_stationary_final_go.py /tmp/current_tests.py
          cp scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py /tmp/current_env_tests.py
          git show "$donor":scripts/ci/es80_authenticated_stationary_final_go.py > /tmp/donor_issuer.py
          git show "$donor":scripts/ci/tests/test_es80_authenticated_stationary_final_go.py > /tmp/donor_tests.py
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import re

          def block(text, start, end):
              a=text.index(start); b=text.index(end,a); return text[a:b]

          issuer=Path('scripts/ci/es80_authenticated_stationary_final_go.py')
          cur=issuer.read_text(); donor=Path('/tmp/donor_issuer.py').read_text()

          old='INSTALLER="scripts/field/install_one_time_capture.command"; RUNBOOK="docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md"; IDENTITY="NembraApp/App/NembraCaptureBuildIdentity.swift"\n'
          new='INSTALLER="scripts/field/install_one_time_capture.command"; BOOTSTRAP="Scripts/bootstrap_capture_tuya_sdk.sh"; RUNBOOK="docs/CAPTURE_P0_SECURE_LINK_NEXT_TEST.md"; IDENTITY="NembraApp/App/NembraCaptureBuildIdentity.swift"\n'
          if cur.count(old)!=1: raise SystemExit('bootstrap constant anchor drift')
          cur=cur.replace(old,new,1)

          dep=block(donor,'def dependency_lock_review(','\ndef git(')
          if 'def dependency_lock_review(' in cur: raise SystemExit('dependency review already present')
          cur=cur.replace('\ndef git(','\n'+dep+'\ndef git(',1)

          cand=block(donor,'def candidate(','\ndef device_hash(')
          lock_line='    lock_contract='
          i=cand.index(lock_line); e=cand.index('\n',i)
          device_line='    device_contract=("NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256" in ins and "hmac.compare_digest(actual_digest, expected_digest)" in ins)\n'
          cand=cand[:e+1]+device_line+cand[e+1:]
          needle=' or not lock_contract: raise GoError("candidate carries wrong/retired/incomplete field authority")'
          repl=' or not lock_contract or not device_contract: raise GoError("candidate carries wrong/retired/incomplete field authority")'
          if cand.count(needle)!=1: raise SystemExit('candidate lock contract anchor drift')
          cand=cand.replace(needle,repl,1)
          c0=cur.index('def candidate('); c1=cur.index('\ndef device_hash(',c0)
          cur=cur[:c0]+cand+cur[c1:]

          c0=cur.index('def installer_environment('); c1=cur.index('\ndef retained_signed_artifact(',c0)
          merged='''def installer_environment(device:Path,device_digest:str,accepted_lock_sha:str)->dict[str,str]:
              account=pwd.getpwuid(os.getuid()); device_path=canonical_private_path(device,"private intended-device identifier")
              digest=device_digest.lower()
              if not HEX64.fullmatch(digest): raise GoError("private intended-device digest invalid")
              if not isinstance(accepted_lock_sha,str) or not HEX64.fullmatch(accepted_lock_sha): raise GoError("accepted Tuya dependency lock digest invalid")
              return {"PATH":TRUSTED_INSTALLER_PATH,"HOME":account.pw_dir,"USER":account.pw_name,"LOGNAME":account.pw_name,"LANG":"en_US.UTF-8","LC_ALL":"en_US.UTF-8","BASH_ENV":"/dev/null","ENV":"/dev/null","NEMBRA_INTENDED_FIELD_DEVICE_UDID_FILE":str(device_path),"NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256":digest,"NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256":accepted_lock_sha}

          def installer(repo:Path,source:str,device:Path,device_digest:str,accepted_lock_sha:str):
              root=repo.expanduser().resolve(strict=True); env=installer_environment(device,device_digest,accepted_lock_sha)
              try:p=subprocess.run(["/bin/bash","--noprofile","--norc","-p",str(root/INSTALLER),source],cwd=root,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              except OSError as e: raise GoError("private installer execution failed") from e
              if p.returncode or "SDK-INTEGRATED CAPTURE LAUNCHED" not in p.stdout or canon(git(root,"rev-parse","HEAD"),"post-install HEAD")!=source or git(root,"status","--porcelain=v1","--untracked-files=all"): raise GoError("private installer did not preserve exact accepted field subject")
              return {"authority":"accepted-candidate-private-installer-execution-v1","result":"success","sourceCommitSHA":source,"buildIdentifier":f"capture-v14-{source[:12]}","bundleIdentifier":BUNDLE,"procedureIdentifier":PROC,"acceptedTuyaDependencyLockSHA256":accepted_lock_sha,"baselineDevice":DEVICE,"baselineProductType":PRODUCT,"baselineOS":"iOS 27"}
          '''
          cur=cur[:c0]+merged+cur[c1:]

          build=block(donor,'def build(','\ndef publication(')
          if build.count('got=run_installer(candidate_repo,source,device_file,accepted_lock)')!=1: raise SystemExit('donor installer call drift')
          build=build.replace('got=run_installer(candidate_repo,source,device_file,accepted_lock)','got=run_installer(candidate_repo,source,device_file,dh,accepted_lock)',1)
          build=build.replace('stable_pr=("number","headSHA","headBranch","base","state","merged","draft")','stable_pr=("number","headSHA","headBranch","base","mainSHA","state","merged","draft")',1)
          c0=cur.index('def build('); c1=cur.index('\ndef publication(',c0)
          cur=cur[:c0]+build+cur[c1:]

          donor_main=donor[donor.index('def main('):]
          cur=cur[:cur.index('def main(')]+donor_main
          issuer.write_text(cur)

          donor_tests=Path('/tmp/donor_tests.py').read_text()
          current_tests=Path('/tmp/current_tests.py').read_text()
          tests=donor_tests

          # Preserve current exact-main API fixture.
          d0=tests.index(' def get(self,p):'); d1=tests.index(' def control(',d0)
          p0=current_tests.index(' def get(self,p):'); p1=current_tests.index(' def control(',p0)
          tests=tests[:d0]+current_tests[p0:p1]+tests[d1:]

          # Candidate fixture must satisfy both reviewed-lock and intended-device digest contracts.
          old="go.INSTALLER:f'PROCEDURE_ID=\"{go.PROC}\"\\nBUNDLE_ID=\"{go.BUNDLE}\"\\n'"
          new="go.INSTALLER:f'PROCEDURE_ID=\"{go.PROC}\"\\nBUNDLE_ID=\"{go.BUNDLE}\"\\n# NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256\\n# hmac.compare_digest(actual_digest, expected_digest)\\n\"$ROOT/Scripts/bootstrap_capture_tuya_sdk.sh\"\\n-- xcodebuild\\n'"
          if tests.count(old)!=1: raise SystemExit('donor installer fixture anchor drift')
          tests=tests.replace(old,new,1)

          # New installer injection carries both prechecked device digest and reviewed lock.
          tests=tests.replace('def inst(self,repo,s,dev,lock):','def inst(self,repo,s,dev,h,lock):\n  assert h==H(b\'device-token\')',1)
          tests=re.sub(r'def (\w+)\(r,s,d,lock\):',r'def \1(r,s,d,h,lock):',tests)
          tests=tests.replace('self.f.inst(r,s,d,lock)','self.f.inst(r,s,d,h,lock)')

          def method(text,name):
              start=text.index(f' def {name}(')
              ends=[x for x in (text.find('\n def ',start+1),text.find('\nif __name__',start+1)) if x!=-1]
              return text[start:min(ends)]+'\n'

          marker='\nif __name__'
          for name in ('test_go_control_plane_requires_exact_current_main_ancestor','test_current_main_is_bound_and_must_be_candidate_ancestor','test_post_install_current_main_drift_is_rejected'):
              if f' def {name}(' not in tests:
                  recovered=method(current_tests,name)
                  recovered=re.sub(r'def (\w+)\(r,s,d,h\):',r'def \1(r,s,d,h,lock):',recovered)
                  recovered=recovered.replace('self.f.inst(r,s,d,h)','self.f.inst(r,s,d,h,lock)')
                  tests=tests.replace(marker,'\n'+recovered+marker,1)

          extra='''
 def test_prechecked_device_digest_and_reviewed_lock_are_passed_to_installer(self):
  seen=[]
  def capture(r,s,d,h,lock):seen.append((h,lock));return self.f.inst(r,s,d,h,lock)
  self.assertEqual(self.f.build(run_installer=capture)['status'],'GO')
  self.assertEqual(seen,[(H(b'device-token'),'a'*64)])
 def test_candidate_requires_intended_device_digest_rendezvous(self):
  p=self.f.repo/go.INSTALLER;old=p.read_text();p.write_text(old.replace('NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256','missing-device-digest-marker'))
  subprocess.run(['/usr/bin/git','-C',str(self.f.repo),'add','.'],check=True);subprocess.run(['/usr/bin/git','-C',str(self.f.repo),'commit','-qm','remove digest marker'],check=True)
  s=subprocess.check_output(['/usr/bin/git','-C',str(self.f.repo),'rev-parse','HEAD'],text=True).strip();self.no(lambda:go.candidate(self.f.repo,s))
'''
          tests=tests.replace(marker,'\n'+extra+marker,1)
          Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go.py').write_text(tests)

          env_path=Path('scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py')
          env=Path('/tmp/current_env_tests.py').read_text()
          env=env.replace('GO.installer(repository, source, private_device, GO.device_hash(private_device))','GO.installer(repository, source, private_device, GO.device_hash(private_device), "a" * 64)')
          env=env.replace('env = GO.installer_environment(device, digest)','env = GO.installer_environment(device, digest, "a" * 64)')
          env=env.replace('GO.installer_environment(alias / "device", "a" * 64)','GO.installer_environment(alias / "device", "a" * 64, "b" * 64)')
          anchor='            self.assertEqual(env["NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256"], digest)\n'
          if env.count(anchor)!=1: raise SystemExit('environment assertion anchor drift')
          env=env.replace(anchor,anchor+'            self.assertEqual(env["NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256"], "a" * 64)\n',1)
          shell='                "[[ \\"${NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256:-}\\" =~ ^[0-9a-f]{64}$ ]] || exit 47\\n"\n'
          if env.count(shell)!=1: raise SystemExit('environment shell anchor drift')
          env=env.replace(shell,shell+'                "[[ \\"${NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256:-}\\" == '+"'"+'a'*64+"'"+' ]] || exit 48\\n"\n',1)
          env=env.replace('            os.environ["NEMBRA_TUYA_APP_KEY"] = "caller-key-must-not-cross"\n','            os.environ["NEMBRA_TUYA_APP_KEY"] = "caller-key-must-not-cross"\n            os.environ["NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256"] = "f" * 64\n',1)
          env_path.write_text(env)
          PY

      - name: Compile composed authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/es80_authenticated_stationary_signed_artifact.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py

      - name: Run Final-GO issuer red-team suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go.py

      - name: Run closed installer-environment custody suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py

      - name: Run retained signed-artifact custody suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_es80_authenticated_stationary_signed_artifact.py

      - name: Verify all authority invariants survived composition
        shell: bash
        run: |
          set -euo pipefail
          f=scripts/ci/es80_authenticated_stationary_final_go.py
          grep -Fq 'nembra-tuya-dependency-lock-review-github-v1' "$f"
          grep -Fq 'BOOTSTRAP="Scripts/bootstrap_capture_tuya_sdk.sh"' "$f"
          grep -Fq 'NEMBRA_CAPTURE_ACCEPTED_TUYA_LOCK_SHA256' "$f"
          grep -Fq 'NEMBRA_INTENDED_FIELD_DEVICE_UDID_SHA256' "$f"
          grep -Fq 'hmac.compare_digest(actual_digest, expected_digest)' "$f"
          grep -Fq 'retained signed artifact dependency lock does not match GitHub-accepted lock subject' "$f"
          grep -Fq 'candidate does not contain the exact current main authority' "$f"
          grep -Fq 'GO control plane does not contain the exact current main authority' "$f"
          grep -Fq 'stable_pr=("number","headSHA","headBranch","base","mainSHA","state","merged","draft")' "$f"
          grep -Fq 'candidate authority path has suppressed index worktree tracking' "$f"
          grep -Fq '["/bin/bash","--noprofile","--norc","-p"' "$f"
          grep -Fq -- '--dependency-lock-review-id' "$f"
          git diff --check

      - name: Publish clean reviewed-lock authority recovery
        shell: bash
        run: |
          set -euo pipefail
          parent=ccab1d76b2cfe7448f012d5df8e622cbaf8d371d
          git rm .github/workflows/capture-final-go-reviewed-lock-r3-materializer.yml
          git add scripts/ci/es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go.py scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py
          expected="$({ printf '%s\n' 'scripts/ci/es80_authenticated_stationary_final_go.py' 'scripts/ci/tests/test_es80_authenticated_stationary_final_go.py' 'scripts/ci/tests/test_es80_authenticated_stationary_final_go_installer_environment_custody.py'; } | sort)"
          actual="$(git diff --cached --name-only "$parent" | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name 'jonathangana131-lab'
          git config user.email 'jonathangana131@gmail.com'
          git commit -m 'fix(capture): bind reviewed Tuya lock on current Final GO'
          git push origin HEAD:recovery/v14-final-go-reviewed-lock-r3-sol
