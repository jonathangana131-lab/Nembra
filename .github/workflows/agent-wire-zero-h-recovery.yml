name: agent wire zero h recovery
on:
  push:
    branches: ['integration/es80-v14-controller-duration-gated/gpt56']
    paths: ['.github/workflows/agent-wire-zero-h-recovery.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/es80-v14-controller-duration-gated/gpt56
          fetch-depth: 0
      - name: Apply zero-H recovery consumer
        shell: bash
        run: |
          python3 .nembra/agent-wire-zero-h-recovery.py
          git rm .github/workflows/agent-wire-zero-h-recovery.yml
          git rm .nembra/agent-wire-zero-h-recovery.py
          git config user.name 'nembra-gpt56'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          git commit -m 'fix: quarantine zero-mutation Horizon rejection in controller'
          git push origin HEAD:integration/es80-v14-controller-duration-gated/gpt56
