name: Capture Trusted Xcode Runner Worktree Custody Expected Red

on:
  push:
    branches:
      - validation/v14-trusted-xcode-runner-worktree-custody/gpt56-go
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/capture-xcode27-trusted-command.yml
      - scripts/ci/es80_today_trusted_capture_xcode_subject.py
      - scripts/ci/tests/test_capture_trusted_xcode_runner_worktree_custody_expected_red.py
      - .github/workflows/capture-trusted-xcode-runner-worktree-custody-expected-red.yml

permissions:
  contents: read

jobs:
  expected-red:
    name: Reject mutable trusted Simulator runner worktree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable validation head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify immutable validation head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
      - name: Compile worktree-custody regression
        run: python3 -m py_compile scripts/ci/tests/test_capture_trusted_xcode_runner_worktree_custody_expected_red.py
      - name: Require final pre-execution runner byte custody
        run: python3 scripts/ci/tests/test_capture_trusted_xcode_runner_worktree_custody_expected_red.py -v
