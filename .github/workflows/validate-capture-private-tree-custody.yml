name: Validate Capture private tree snapshot custody

on:
  push:
    branches:
      - sol/v14-capture-private-tree-custody-29000

permissions:
  contents: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Verify exact reviewed donor head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "34346d3a05f96ad7a66beb5465a362c261f62c5e"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/validate-capture-private-tree-custody.yml"

      - name: Run focused provenance suite
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Scripts/capture_tuya_private_input_provenance.py scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python scripts/ci/tests/test_capture_tuya_private_input_provenance.py
          python - <<'PY'
          from pathlib import Path
          source = Path('Scripts/capture_tuya_private_input_provenance.py').read_text()
          tests = Path('scripts/ci/tests/test_capture_tuya_private_input_provenance.py').read_text()
          required_source = [
              '_stat_identity(current_path) != _stat_identity(after)',
              'O_NOFOLLOW',
              '_assert_unchanged_tree_entry',
              '_directory_member_names',
          ]
          required_tests = [
              'test_file_fingerprint_rejects_same_inode_metadata_drift_before_path_rendezvous',
              'fstat_then_chmod',
              'test_tree_rejects_file_replacement_after_individual_fingerprint',
              'test_tree_rejects_entry_added_after_directory_enumeration',
          ]
          missing = [x for x in required_source if x not in source] + [x for x in required_tests if x not in tests]
          if missing:
              raise SystemExit(f'missing provenance snapshot invariants: {missing}')
          PY
          git diff --check

      - name: Remove temporary validator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-capture-private-tree-custody.yml
          git config user.name "nembra-sol-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci(capture): retire private tree custody validator"
          git push origin HEAD:sol/v14-capture-private-tree-custody-29000
