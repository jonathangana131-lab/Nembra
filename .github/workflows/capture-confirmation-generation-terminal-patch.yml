name: Capture Confirmation Generation Terminal Patch

on:
  push:
    branches:
      - agent/v14-capture-app-internal-lifecycle-consumption-sol
    paths:
      - .github/workflows/capture-confirmation-generation-terminal-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v14-capture-app-internal-lifecycle-consumption-sol
          fetch-depth: 0
      - name: Apply repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_confirmation_generation_terminal_patch.py
          rm Scripts/apply_capture_confirmation_generation_terminal_patch.py
          rm .github/workflows/capture-confirmation-generation-terminal-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'active_generation_blocks_target_confirmation'
          git diff --cached -- NembraApp/App/NembraCaptureEntrypoint.swift | grep -q 'invalidateInternalLifecycle'
          git commit -m "fix(capture): retire active generation at confirmation"
          git push origin HEAD:agent/v14-capture-app-internal-lifecycle-consumption-sol
