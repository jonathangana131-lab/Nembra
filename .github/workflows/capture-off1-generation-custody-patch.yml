name: Capture OFF1 Generation Custody Patch

on:
  push:
    branches:
      - integration/v14-capture-off1-generation-custody-sol
    paths:
      - .github/workflows/capture-off1-generation-custody-patch.yml
      - Scripts/apply_capture_off1_generation_custody.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v14-capture-off1-generation-custody-sol
          fetch-depth: 0
      - name: Apply custody repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_capture_off1_generation_custody.py
          rm Scripts/apply_capture_off1_generation_custody.py
          rm .github/workflows/capture-off1-generation-custody-patch.yml
          git config user.name nembra-v14-integration
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): retire hidden generation before OFF1 restart"
          git push origin HEAD:integration/v14-capture-off1-generation-custody-sol
