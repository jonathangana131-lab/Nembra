name: Materialize Capture SDK Account Recovery

on:
  push:
    branches:
      - fix/v14-capture-sdk-account-recovery-5e960-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v14-capture-sdk-account-recovery-5e960-sol

      - name: Materialize reviewed account recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci/materialize_capture_sdk_account_recovery.py
          git diff --check
          swiftc -frontend -parse NembraApp/App/NembraCaptureEntrypoint.swift
          swiftc -frontend -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaSecureLinkAccountRecoverySourceTests.swift

      - name: Publish clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ci/materialize_capture_sdk_account_recovery.py .github/workflows/v14-materialize-capture-sdk-account-recovery.yml
          git config user.name "nembra-v14-bot"
          git config user.email "nembra-v14-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): recover from the wrong Tuya account"
          git push origin HEAD:fix/v14-capture-sdk-account-recovery-5e960-sol
