name: Capture Field Source Custody Current

on:
  pull_request:
    paths:
      - 'Scripts/bootstrap_capture_tuya_sdk.sh'
      - 'Scripts/capture_tuya_private_input_provenance.py'
      - 'Scripts/capture_tuya_private_input_build_guard.py'
      - 'scripts/field/install_one_time_capture.command'
      - 'scripts/ci/tests/test_capture_field_accepted_source_path_contract.py'
      - '.github/workflows/capture-field-build-provenance.yml'
      - '.github/workflows/capture-field-source-custody-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-source-contract:
    name: Reject mutable field authority execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind QA to exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Exercise accepted-source path regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/tests/test_capture_field_accepted_source_path_contract.py
          python3 -m unittest -v scripts.ci.tests.test_capture_field_accepted_source_path_contract

      - name: Require captured provenance-helper execution
        shell: bash
        run: |
          set -euo pipefail
          bootstrap='Scripts/bootstrap_capture_tuya_sdk.sh'
          grep -Fq 'run_accepted_python_helper() {' "$bootstrap"
          grep -Fq 'NEMBRA_CAPTURE_ACCEPTED_PROVENANCE_HELPER_SHA256' "$bootstrap"
          grep -Fq 'run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" snapshot \' "$bootstrap"
          grep -Fq 'run_accepted_python_helper "$PROVENANCE_HELPER" "$PROVENANCE_HELPER_SHA256" verify \' "$bootstrap"
          if grep -Fq '"$PROVENANCE_HELPER" snapshot' "$bootstrap"; then
            echo 'ERROR: provenance helper must not execute directly from its mutable worktree pathname.' >&2
            exit 1
          fi

      - name: Require accepted-Git build-guard execution
        shell: bash
        run: |
          set -euo pipefail
          installer='scripts/field/install_one_time_capture.command'
          grep -Fq 'run_accepted_source_python "$TUYA_BUILD_WINDOW_GUARD_RELATIVE" \' "$installer"
          if grep -Fq '/usr/bin/python3 -I "$TUYA_BUILD_WINDOW_GUARD"' "$installer"; then
            echo 'ERROR: build-window guard must execute from exact accepted Git bytes, not a mutable worktree pathname.' >&2
            exit 1
          fi
