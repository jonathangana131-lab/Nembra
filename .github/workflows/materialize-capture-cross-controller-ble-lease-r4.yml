name: Materialize Capture BLE Lease Cleanup R4

on:
  push:
    branches:
      - agent/capture-cross-controller-ble-lease

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/capture-cross-controller-ble-lease
      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "4a684517017c9a4b0f4491d3c92a02a307a31e81" ]]
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = source_path.read_text(encoding='utf-8')
          old = '"Tuya BLE ownership was already attempted in this app process. Relaunch Capture with the scooter OFF before a fresh OFF1→ON1→OFF2→ON2 series. Package-owned correlation cannot restart in-process after Tuya BLE ownership."'
          new = '"Package Bluetooth correlation is already active elsewhere in Capture, or Tuya BLE ownership was already attempted in this app process. Finish the active attempt or relaunch with the scooter OFF before a fresh OFF1→ON1→OFF2→ON2 series."'
          if source.count(old) != 1:
              raise SystemExit('process ownership blocker copy anchor drifted')
          source = source.replace(old, new, 1)

          old_fail = '''    private func failLocally(_ text: String, _ kind: String) {\n        if phase == .baseline || phase == .powerOn || phase == .scanning || phase == .correlated {\n            abandonPackageCorrelation()\n        }\n'''
          new_fail = '''    private func failLocally(_ text: String, _ kind: String) {\n        // A process lease is acquired before the first window advances presentation `phase`.\n        // Session construction/start failures must therefore release by lease ownership too.\n        if processCorrelationLease != nil || phase == .baseline || phase == .powerOn || phase == .scanning || phase == .correlated {\n            abandonPackageCorrelation()\n        }\n'''
          if source.count(old_fail) != 1:
              raise SystemExit('failLocally cleanup anchor drifted')
          source = source.replace(old_fail, new_fail, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipLeaseSourceTests.swift')
          test = test_path.read_text(encoding='utf-8')
          marker = '    @Test("scanner is retired before process lease release and successful series also releases")\n'
          if test.count(marker) != 1:
              raise SystemExit('test insertion marker drifted')
          addition = '''    @Test("pre-window failure cannot strand an acquired process lease")\n    func preWindowFailureReleasesLease() throws {\n        let source = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")\n        let failure = try section(\n            in: source,\n            from: "private func failLocally(_ text: String, _ kind: String)",\n            to: "private func log(_ kind: String"\n        )\n        #expect(failure.contains("if processCorrelationLease != nil || phase == .baseline"))\n        #expect(failure.contains("abandonPackageCorrelation()"))\n    }\n\n'''
          test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          git diff --check
          grep -Fq 'if processCorrelationLease != nil || phase == .baseline' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'Package Bluetooth correlation is already active elsewhere in Capture' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'pre-window failure cannot strand an acquired process lease' Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipLeaseSourceTests.swift
          rm .github/workflows/materialize-capture-cross-controller-ble-lease-r4.yml
          git config user.name 'nembra-v14-bot'
          git config user.email 'nembra-v14-bot@users.noreply.github.com'
          git add NembraApp/App/NembraCaptureEntrypoint.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipLeaseSourceTests.swift \
                  .github/workflows/materialize-capture-cross-controller-ble-lease-r4.yml
          git diff --cached --check
          git commit -m 'harden(capture): release pre-window BLE lease'
          git push origin HEAD:agent/capture-cross-controller-ble-lease
