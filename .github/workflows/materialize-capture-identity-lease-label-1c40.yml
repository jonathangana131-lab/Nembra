name: Materialize Capture Identity Lease Label 1c40

on:
  push:
    branches:
      - fix/v14-capture-identity-lease-label-1c40-sol

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact two-path repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          gate_path = Path('Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaSDKAccountIdentityLeaseGate.swift')
          test_path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAccountIdentityLeaseAppSourceIntegrationTests.swift')

          app = app_path.read_text(encoding='utf-8')
          gate = gate_path.read_text(encoding='utf-8')
          old = '            sdkIsLoggedIn: sdkAccountLoggedIn,'
          new = '            isLoggedIn: sdkAccountLoggedIn,'
          assert app.count(old) == 1, app.count(old)
          assert 'public init(\n            isLoggedIn: Bool,' in gate
          app_path.write_text(app.replace(old, new, 1), encoding='utf-8')

          test_path.write_text('''import Foundation\nimport Testing\n@testable import NembraBluetoothCapture\n\n@Suite("Tuya account identity lease app-source integration")\nstruct TuyaAccountIdentityLeaseAppSourceIntegrationTests {\n    @Test("Secure Link uses the package identity-lease snapshot initializer label")\n    func appCallSiteMatchesPackageInitializer() throws {\n        let app = try readRepositoryFile("NembraApp/App/NembraCaptureEntrypoint.swift")\n        let gate = try readRepositoryFile("Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaSDKAccountIdentityLeaseGate.swift")\n        #expect(gate.contains("public init(\\n            isLoggedIn: Bool,"))\n        #expect(app.contains("isLoggedIn: sdkAccountLoggedIn"))\n        #expect(!app.contains("sdkIsLoggedIn: sdkAccountLoggedIn"))\n    }\n\n    private func readRepositoryFile(_ relativePath: String) throws -> String {\n        let repositoryRoot = URL(fileURLWithPath: #filePath)\n            .deletingLastPathComponent()\n            .deletingLastPathComponent()\n            .deletingLastPathComponent()\n            .deletingLastPathComponent()\n            .deletingLastPathComponent()\n        return try String(contentsOf: repositoryRoot.appendingPathComponent(relativePath), encoding: .utf8)\n    }\n}\n''', encoding='utf-8')
          PY

          grep -Fq '            isLoggedIn: sdkAccountLoggedIn,' NembraApp/App/NembraCaptureEntrypoint.swift
          ! grep -Fq '            sdkIsLoggedIn: sdkAccountLoggedIn,' NembraApp/App/NembraCaptureEntrypoint.swift
          git diff --check
          rm .github/workflows/materialize-capture-identity-lease-label-1c40.yml
          git diff --check

      - name: Commit repair and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nembra-sol'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m '[Capture P0] Match identity-lease snapshot initializer label'
          git push origin HEAD:fix/v14-capture-identity-lease-label-1c40-sol
