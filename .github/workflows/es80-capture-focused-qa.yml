name: ES80 Capture Focused QA

on:
  push:
    branches:
      - 'cell/es80-passive-capture/ci/**'

permissions:
  contents: read

concurrency:
  group: nembra-es80-capture-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test passive CoreBluetooth package
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Checkout exact validation head with parent history
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify immutable checkout, exact product parent, and workflow-only delta
        run: |
          set -euo pipefail
          expected_product='ed6864eb8d253801592461f32d57c3a1db6826f8'
          expected_workflow='.github/workflows/es80-capture-focused-qa.yml'

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$expected_product"
          test "$(git diff --name-only HEAD^ HEAD)" = "$expected_workflow"

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Guard passive adapter against application writes
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 capture adapter must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

      - name: Test NembraBluetoothCapture with warnings as errors
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/NembraBluetoothCapture \
            -Xswiftc -warnings-as-errors

      - name: Build NembraBluetoothCapture for iOS Simulator with warnings as errors
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build
