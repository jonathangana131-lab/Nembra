name: ES80 Capture Focused QA

on:
  push:
    branches:
      - 'cell/es80-passive-capture/ci/**'

permissions:
  contents: read

concurrency:
  group: nembra-es80-capture-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test passive CoreBluetooth package
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify immutable checkout and exact product parent
        env:
          EXPECTED_PRODUCT_HEAD: a78f8cb28e630f2e520d9382e325ec84981b5eac
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          product_parent="$(git rev-parse HEAD^)"
          echo "workflow_head=$GITHUB_SHA"
          echo "actual=$actual_sha"
          echo "expected_product_parent=$EXPECTED_PRODUCT_HEAD"
          echo "actual_product_parent=$product_parent"
          test "$actual_sha" = "$GITHUB_SHA"
          test "$product_parent" = "$EXPECTED_PRODUCT_HEAD"

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Guard passive adapter against application writes
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.swift' -E '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            echo 'Passive ES80 capture adapter must not call CoreBluetooth writeValue.' >&2
            exit 1
          fi

      - name: Test NembraBluetoothCapture on macOS runner
        run: |
          set -euo pipefail
          swift test --package-path Packages/NembraBluetoothCapture

      - name: Build NembraBluetoothCapture for iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
