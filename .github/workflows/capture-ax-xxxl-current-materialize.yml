name: Materialize Current Capture AX Reflow

on:
  push:
    branches:
      - sol/v14-capture-ax-xxxl-current-194
    paths:
      - .github/workflows/capture-ax-xxxl-current-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v14-capture-ax-xxxl-current-194
          fetch-depth: 0

      - name: Guard exact current product parent
        shell: bash
        run: |
          set -euo pipefail
          parent='194197ed62ccd4f7880e314ff70e5e0229cddc30'
          git merge-base --is-ancestor "$parent" HEAD
          git diff --quiet "$parent" HEAD -- NembraApp/App/NembraCaptureEntrypoint.swift
          test ! -e Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureAccessibilityXXXLSourceTests.swift
          actual="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/capture-ax-xxxl-current-materialize.yml' 'scripts/ci/materialize_capture_ax_xxxl_current.py' | sort)"
          test "$actual" = "$expected"

      - name: Apply exact presentation-only reflow
        shell: bash
        run: |
          set -euo pipefail
          # Pin one unmistakable #2318 current-product ownership anchor in the helper.
          sed -i 's/PackageCorrelationOwnershipLease/private static var activePackageCorrelationOwner: UUID?/g' scripts/ci/materialize_capture_ax_xxxl_current.py
          python3 scripts/ci/materialize_capture_ax_xxxl_current.py apply
          python3 scripts/ci/materialize_capture_ax_xxxl_current.py verify

      - name: Validate source and scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/materialize_capture_ax_xxxl_current.py
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -parse NembraApp/App/NembraCaptureEntrypoint.swift
            swiftc -parse Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureAccessibilityXXXLSourceTests.swift
          fi
          git diff --check
          parent='194197ed62ccd4f7880e314ff70e5e0229cddc30'
          changed="$(git diff --name-only "$parent" HEAD | grep -v -E '^(\.github/workflows/capture-ax-xxxl-current-materialize.yml|scripts/ci/materialize_capture_ax_xxxl_current.py)$' | sort)"
          expected="$(printf '%s\n' 'NembraApp/App/NembraCaptureEntrypoint.swift' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCaptureAccessibilityXXXLSourceTests.swift' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$parent" -- scripts/field/install_one_time_capture.command
          grep -Fq 'private static var activePackageCorrelationOwner: UUID?' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'guard activePackageCorrelationOwner == nil,' NembraApp/App/NembraCaptureEntrypoint.swift

      - name: Publish clean AX checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-ax-xxxl-current-materialize.yml
          rm scripts/ci/materialize_capture_ax_xxxl_current.py
          rm -rf scripts/ci/__pycache__
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(capture): reflow guided progress for Accessibility"
          git push origin HEAD:sol/v14-capture-ax-xxxl-current-194
