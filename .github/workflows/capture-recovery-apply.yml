name: Capture recovery apply

on:
  push:
    branches:
      - repair/v16-tuya-horizon-terminal-owner-sol-r2

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Docs note 3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v16-tuya-horizon-terminal-owner-sol-r2
      - name: Apply reviewed recovery patch
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/ci/capture_horizon_recovery_patch.py
      - name: Validate intended lifecycle delta
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git diff -- Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift)"
          test -n "$(git diff -- Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonTests.swift)"
      - name: Save lifecycle repair
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonTests.swift
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '2'
          git commit -m 'Capture V16.1: close incomplete horizon lifecycle'
          git push origin HEAD:repair/v16-tuya-horizon-terminal-owner-sol-r2
