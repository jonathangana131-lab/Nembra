name: Capture recovery apply

on:
  push:
    branches:
      - repair/v16-tuya-horizon-terminal-owner-sol-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Docs note 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v16-tuya-horizon-terminal-owner-sol-recovery
      - name: Apply recovery patch
        run: |
          set -euo pipefail
          python3 scripts/ci/capture_horizon_recovery_patch.py
          git diff --check
      - name: Save recovery patch
        run: |
          set -euo pipefail
          git config user.name 'nembra-go-recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/TuyaAuthenticatedReadOnlySessionLedger.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlyHorizonTests.swift \
                  Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaAuthenticatedReadOnlySessionLedgerTests.swift
          git commit -m 'Capture V16.1: close incomplete horizon lifecycle'
          git push origin HEAD:repair/v16-tuya-horizon-terminal-owner-sol-recovery
