name: Capture Fold Accepted Root Workspace Fence Once

on:
  push:
    branches:
      - repair/v17-capture-accepted-root-workspace-fence-gpt56-sol
    paths:
      - .github/workflows/capture-fold-accepted-root-workspace-fence-once.yml

permissions:
  contents: write

env:
  EXACT_PARENT: bf2f1e1d718849ef6741ec532e28975527311e95

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-accepted-root-workspace-fence-gpt56-sol
          fetch-depth: 0

      - name: Bind one-shot authoring tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXACT_PARENT")" = "$EXACT_PARENT"
          changed="$(git diff --name-only "$EXACT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-fold-accepted-root-workspace-fence-once.yml \
            scripts/ci/fold_accepted_root_workspace_fence_once.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply exact accepted-root workspace fence
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -I scripts/ci/fold_accepted_root_workspace_fence_once.py

      - name: Verify permanent repair without bytecode artifacts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          /usr/bin/python3 -B -I - <<'PY'
          from pathlib import Path
          for raw in (
              "scripts/ci/capture_selected_xcode_build_orchestrator.py",
              "scripts/ci/tests/test_capture_accepted_root_build_composition.py",
          ):
              path = Path(raw)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          PY
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_accepted_root_build_composition.py
          /usr/bin/python3 -B -I scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          git diff --check
          test -z "$(find scripts/ci -type d -name __pycache__ -o -type f -name '*.pyc' -print)"

      - name: Publish clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-fold-accepted-root-workspace-fence-once.yml
          rm scripts/ci/fold_accepted_root_workspace_fence_once.py
          changed="$(git diff --name-only "$EXACT_PARENT" -- | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_accepted_root_build_composition.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$EXACT_PARENT" --
          test -z "$(find scripts/ci -type f -name '*.pyc' -print)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_accepted_root_build_composition.py
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/staged.txt"
          printf '%s\n' \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_accepted_root_build_composition.py | LC_ALL=C sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/staged.txt"
          git commit -m "fix(capture): bind strict workspace to accepted root"
          git push origin HEAD:repair/v17-capture-accepted-root-workspace-fence-gpt56-sol
