name: V14 Recovery Atomicity Patch

on:
  push:
    branches:
      - fix/es80-v14-recovery-failure-atomic-gpt56

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-v14-recovery-failure-atomic-gpt56
          fetch-depth: 0

      - name: Apply recovery atomicity transform
        run: python3 .github/scripts/v14_recovery_atomicity_patch.py

      - name: Validate transformed source contract
        shell: bash
        run: |
          grep -q 'var reopenedGate = observationBoundaryQueueGate' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          test "$(grep -c 'var reopenedGate = observationBoundaryQueueGate' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift)" -eq 2
          ! grep -q 'try observationBoundaryQueueGate.reopenAfterTerminalFreshTargetSession(' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift
          ! grep -q 'try observationBoundaryQueueGate.reopenAfterAbortedFreshTargetSession(' Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture/ForegroundCoreBluetoothCaptureController.swift

      - name: Remove one-shot editor files
        run: rm .github/workflows/v14-recovery-atomicity-patch.yml .github/scripts/v14_recovery_atomicity_patch.py

      - name: Commit transformed product tree
        shell: bash
        run: |
          git config user.name "nembra-go-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(capture): make fresh-session recovery publication atomic"
          git push origin HEAD:fix/es80-v14-recovery-failure-atomic-gpt56
