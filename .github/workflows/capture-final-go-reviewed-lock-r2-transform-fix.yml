name: Capture Final GO Reviewed Lock R2 Transform Fix

on:
  push:
    branches:
      - recovery/v14-final-go-reviewed-lock-r2-sol

permissions:
  contents: write

jobs:
  fix-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Patch recovery transform
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/capture-final-go-reviewed-lock-r2-materializer.yml')
          s=p.read_text()
          old="tests = tests.replace(marker, '\\n' + method(parent_tests, name) + marker, 1)"
          if s.count(old)!=1: raise SystemExit(f'expected one callback insertion, found {s.count(old)}')
          new="recovered = method(parent_tests, name)\n                  recovered = recovered.replace('def move_main(r,s,d):', 'def move_main(r,s,d,lock):').replace('self.f.inst(r,s,d)', 'self.f.inst(r,s,d,lock)')\n                  tests = tests.replace(marker, '\\n' + recovered + marker, 1)"
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify recovery transform
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "recovered = recovered.replace('def move_main(r,s,d):', 'def move_main(r,s,d,lock):')" .github/workflows/capture-final-go-reviewed-lock-r2-materializer.yml
          ! grep -Fq "tests = tests.replace(marker, '\\n' + method(parent_tests, name)" .github/workflows/capture-final-go-reviewed-lock-r2-materializer.yml
      - name: Publish transform fix and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/capture-final-go-reviewed-lock-r2-transform-fix.yml
          git config user.name 'jonathangana131-lab'
          git config user.email 'jonathangana131@gmail.com'
          git add .github/workflows/capture-final-go-reviewed-lock-r2-materializer.yml
          git commit -m 'ci(capture): fix reviewed-lock recovery callback signature'
          git push origin HEAD:recovery/v14-final-go-reviewed-lock-r2-sol
