name: Capture Final GO Reviewed Lock R2 Transform Fix

on:
  push:
    branches:
      - recovery/v14-final-go-reviewed-lock-r2-sol

permissions:
  contents: write

jobs:
  fix-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fix recovered callback signature and self-delete
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/capture-final-go-reviewed-lock-r2-materializer.yml')
          lines=p.read_text().splitlines()
          needle="                  tests = tests.replace(marker, '\\n' + method(parent_tests, name) + marker, 1)"
          hits=[i for i,line in enumerate(lines) if line==needle]
          if len(hits)!=1: raise SystemExit(f'recovery insertion line drift: {hits}')
          i=hits[0]
          lines[i:i+1]=[
              '                  recovered = method(parent_tests, name)',
              "                  recovered = recovered.replace('def move_main(r,s,d):', 'def move_main(r,s,d,lock):').replace('self.f.inst(r,s,d)', 'self.f.inst(r,s,d,lock)')",
              "                  tests = tests.replace(marker, '\\n' + recovered + marker, 1)",
          ]
          p.write_text('\n'.join(lines)+'\n')
          PY
          git rm .github/workflows/capture-final-go-reviewed-lock-r2-transform-fix.yml
          git config user.name 'jonathangana131-lab'
          git config user.email 'jonathangana131@gmail.com'
          git add .github/workflows/capture-final-go-reviewed-lock-r2-materializer.yml
          git commit -m 'ci(capture): fix reviewed-lock recovery callback signature'
          git push origin HEAD:recovery/v14-final-go-reviewed-lock-r2-sol
