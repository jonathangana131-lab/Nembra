name: ES80 pre-H quarantine repair exact-product QA

on:
  push:
    branches:
      - cell/es80-preh-quarantine-qa-repair/ci/chat-g5v6-1

permissions:
  contents: read

jobs:
  recovery-qa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - name: Verify exact product parent, effective scope, and workflow-only mirror
        env:
          EXPECTED_PRODUCT_SHA: d4512cfac39325bc65a9956e801072097b0d89a7
          EXPECTED_DEPENDENCY_SHA: 1e89aec08e2d26e6c89ad2efb71752191d2dc9a9
          EXPECTED_PRODUCT_PATH: Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothPreHObservationRecoveryTests.swift
          EXPECTED_WORKFLOW_PATH: .github/workflows/qa-es80-preh-quarantine-repair-chat-g5v6-1.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "$EXPECTED_WORKFLOW_PATH"
          test "$(git diff --name-only "$EXPECTED_DEPENDENCY_SHA" "$EXPECTED_PRODUCT_SHA")" = "$EXPECTED_PRODUCT_PATH"
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Reject application characteristic writes
        run: |
          set -euo pipefail
          if grep -R --include='*.swift' -nE '\.writeValue[[:space:]]*\(' Packages/NembraBluetoothCapture/Sources; then
            exit 1
          fi
      - name: Reject stale raw-retirement reopen contracts
        run: |
          set -euo pipefail
          ! git grep -n -E 'completeAbortedObservationRecovery|freshTargetSessionRequired' -- \
            Packages/NembraBluetoothCapture/Sources/NembraBluetoothCapture \
            Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests
      - name: Run NembraCore tests
        run: swift test --package-path Packages/NembraCore -Xswiftc -warnings-as-errors
      - name: Run full capture package tests
        run: swift test --package-path Packages/NembraBluetoothCapture -Xswiftc -warnings-as-errors
      - name: Build capture package for generic iOS Simulator
        working-directory: Packages/NembraBluetoothCapture
        run: |
          xcodebuild -scheme NembraBluetoothCapture \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
