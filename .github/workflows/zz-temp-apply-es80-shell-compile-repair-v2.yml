name: TEMP Apply ES80 shell compile repair v2

on:
  push:
    branches:
      - fix/es80-today-simulator-preflight-snapshot-0519-gpt56

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-today-simulator-preflight-snapshot-0519-gpt56
          fetch-depth: 0

      - name: Apply guarded compile-safe refactor
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/es80-shell-repair.py
          python3 /tmp/es80-shell-repair.py
          git diff --check
          test "$(git diff -- NembraApp/Features/Research/ES80CaptureShellView.swift | grep -c '^@@')" -ge 3

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nembra-v14-simulator-compile
          git config user.email nembra-v14-simulator-compile@users.noreply.github.com
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git commit -m "fix(capture): make Simulator shell conditionals compile-safe"
          git push origin HEAD:fix/es80-today-simulator-preflight-snapshot-0519-gpt56
