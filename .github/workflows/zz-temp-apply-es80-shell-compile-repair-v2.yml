name: TEMP Apply ES80 shell compile repair v2

on:
  push:
    branches:
      - fix/es80-today-simulator-preflight-snapshot-0519-gpt56

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/es80-today-simulator-preflight-snapshot-0519-gpt56
          fetch-depth: 0

      - name: Apply guarded compile-safe refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import re
          import subprocess

          carrier = subprocess.check_output([
              "git", "show",
              "f96f8f87d4afb01b8d078bcd3117f1b2f6f345a8:.github/workflows/zz-temp-apply-es80-shell-compile-repair-v2.yml"
          ], text=True)
          match = re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \\| base64 --decode", carrier)
          if match is None:
              raise SystemExit("encoded repair payload not found in durable carrier commit")
          script = base64.b64decode(match.group(1)).decode("utf-8")
          exec(compile(script, "es80-shell-repair.py", "exec"), {"__name__": "__main__"})
          PY

          git diff --check
          test -n "$(git diff -- NembraApp/Features/Research/ES80CaptureShellView.swift)"
          grep -q 'private var finalSharePrimaryAction: some View' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -q 'private var completionDescription: some View' NembraApp/Features/Research/ES80CaptureShellView.swift
          grep -q 'private var captureArtifactDetails: some View' NembraApp/Features/Research/ES80CaptureShellView.swift

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nembra-v14-simulator-compile
          git config user.email nembra-v14-simulator-compile@users.noreply.github.com
          git add NembraApp/Features/Research/ES80CaptureShellView.swift
          git commit -m "fix(capture): make Simulator shell conditionals compile-safe"
          git push origin HEAD:fix/es80-today-simulator-preflight-snapshot-0519-gpt56
