name: Capture Current Root Helper Sibling Bundle Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/capture-current-root-helper-sibling-bundle-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-current-root-helper-sibling-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXACT_ROOT_CUSTODY_PARENT: c4ae540b7e9217aaf92f469d564d055cd3b86b92
  ACCEPTED_INPUT_PARENT: dde5074c91c077911cd40bab615ad0d0d0a9b683
  ROOT_HELPER: scripts/ci/capture_accepted_build_root_custody.py
  SNAPSHOT_HELPER: scripts/ci/capture_accepted_build_input_snapshot.py

jobs:
  sealed-siblings:
    name: Exact sealed sibling pair defeats live helper poisoning
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact validation child
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$EXACT_ROOT_CUSTODY_PARENT")" = "$EXACT_ROOT_CUSTODY_PARENT"
          test "$(git merge-base "$EXACT_ROOT_CUSTODY_PARENT" "$ACCEPTED_INPUT_PARENT")" = "$ACCEPTED_INPUT_PARENT"
          changed="$(git diff --name-only "$EXACT_ROOT_CUSTODY_PARENT"...HEAD)"
          test "$changed" = '.github/workflows/capture-current-root-helper-sibling-bundle-validation.yml'
          git diff --check "$EXACT_ROOT_CUSTODY_PARENT"...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Root-seal exact current helper siblings
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nembra-current-root-helper-bundle"
          sudo rm -rf "$bundle"
          sudo mkdir -p "$bundle"
          git show "$EXACT_ROOT_CUSTODY_PARENT:$ROOT_HELPER" | sudo tee "$bundle/$(basename "$ROOT_HELPER")" >/dev/null
          git show "$ACCEPTED_INPUT_PARENT:$SNAPSHOT_HELPER" | sudo tee "$bundle/$(basename "$SNAPSHOT_HELPER")" >/dev/null

          root_oid="$(git rev-parse "$EXACT_ROOT_CUSTODY_PARENT:$ROOT_HELPER")"
          snapshot_oid="$(git rev-parse "$ACCEPTED_INPUT_PARENT:$SNAPSHOT_HELPER")"
          test "$(git hash-object "$bundle/$(basename "$ROOT_HELPER")")" = "$root_oid"
          test "$(git hash-object "$bundle/$(basename "$SNAPSHOT_HELPER")")" = "$snapshot_oid"
          test "$(git rev-parse "$EXACT_ROOT_CUSTODY_PARENT:$SNAPSHOT_HELPER")" = "$snapshot_oid"

          sudo chown -R root:root "$bundle"
          sudo chmod 0555 "$bundle"
          sudo chmod 0444 "$bundle/$(basename "$ROOT_HELPER")" "$bundle/$(basename "$SNAPSHOT_HELPER")"
          test "$(stat -c '%u:%g:%a' "$bundle")" = '0:0:555'
          test "$(stat -c '%u:%g:%a' "$bundle/$(basename "$ROOT_HELPER")")" = '0:0:444'
          test "$(stat -c '%u:%g:%a' "$bundle/$(basename "$SNAPSHOT_HELPER")")" = '0:0:444'

      - name: Poison live sibling and execute only sealed pair
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/nembra-current-root-helper-bundle"
          printf '%s\n' 'raise RuntimeError("MUTABLE_CHECKOUT_SNAPSHOT_EXECUTED")' > "$SNAPSHOT_HELPER"
          grep -q MUTABLE_CHECKOUT_SNAPSHOT_EXECUTED "$SNAPSHOT_HELPER"

          sudo /usr/bin/python3 -B -I "$bundle/$(basename "$ROOT_HELPER")" --help > "$RUNNER_TEMP/root-helper-help.txt"
          grep -q 'Create a root-custodied accepted Nembra Capture build root' "$RUNNER_TEMP/root-helper-help.txt"

          test "$(git hash-object "$bundle/$(basename "$ROOT_HELPER")")" = "$(git rev-parse "$EXACT_ROOT_CUSTODY_PARENT:$ROOT_HELPER")"
          test "$(git hash-object "$bundle/$(basename "$SNAPSHOT_HELPER")")" = "$(git rev-parse "$ACCEPTED_INPUT_PARENT:$SNAPSHOT_HELPER")"
          git checkout -- "$SNAPSHOT_HELPER"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve validation-only boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "$RUNNER_TEMP/nembra-current-root-helper-bundle"
          git checkout -- "$SNAPSHOT_HELPER" >/dev/null 2>&1 || true
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'NEMBRA_CURRENT_ROOT_HELPER_BUNDLE exactRootParent=true acceptedSnapshotParent=true bothBlobsExact=true rootSealed=true liveCheckoutPoisonIgnored=true productionWired=false signingAuthority=false installAuthority=false deviceTouched=false bluetoothTouched=false physicalAuthorityCreated=false'
