name: Capture exact-guard fixture compatibility one-shot

on:
  pull_request:
    paths:
      - .github/workflows/capture-exact-guard-fixture-compat-once.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'repair/v17-capture-exact-guard-fixture-compat-gpt56sol-go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact recovery branch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.head_ref }}" = "repair/v17-capture-exact-guard-fixture-compat-gpt56sol-go"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"

      - name: Update fixture constructor contract
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py")
          text = path.read_text()
          old = '''            def __init__(self, subjects, repo):
                self.subjects = tuple(subjects)
                self.repo = repo
                self._opened: list[object] = []
                self._principal = ""
                self.events: list[str] = []
                self.__class__.instances.append(self)
'''
          new = '''            def __init__(
                self,
                subjects,
                repo,
                *,
                use_native_darwin_acl: bool = False,
            ):
                self.subjects = tuple(subjects)
                self.repo = repo
                self.use_native_darwin_acl = use_native_darwin_acl
                self._opened: list[object] = []
                self._principal = ""
                self.events: list[str] = []
                self.__class__.instances.append(self)
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one FakeLease constructor anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old_assert = '''            self.assertEqual(len(FakeLease.instances), 1)
            self.assertEqual(
                FakeLease.instances[0].events,
                ["grant:nembrabuildfixture", "revoke"],
            )
'''
          new_assert = '''            self.assertEqual(len(FakeLease.instances), 1)
            self.assertFalse(FakeLease.instances[0].use_native_darwin_acl)
            self.assertEqual(
                FakeLease.instances[0].events,
                ["grant:nembrabuildfixture", "revoke"],
            )
'''
          if text.count(old_assert) != 1:
              raise SystemExit(f"expected one FakeLease assertion anchor, found {text.count(old_assert)}")
          path.write_text(text.replace(old_assert, new_assert, 1))

      - name: Run exact-guard regression
        run: |
          set -euo pipefail
          python3 scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py
          git diff --check

      - name: Publish fixture hardening and retire one-shot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          test "$changed" = "scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py"
          rm .github/workflows/capture-exact-guard-fixture-compat-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/tests/test_capture_selected_xcode_build_orchestrator.py \
                  .github/workflows/capture-exact-guard-fixture-compat-once.yml
          git diff --cached --check
          git commit -m "Capture: align exact-guard lease fixture contract"
          git push origin HEAD:repair/v17-capture-exact-guard-fixture-compat-gpt56sol-go
