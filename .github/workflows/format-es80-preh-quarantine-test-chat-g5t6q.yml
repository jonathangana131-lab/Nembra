name: chat-g5t6q pre-H quarantine test formatting

on:
  push:
    branches:
      - 'cell/es80-preh-quarantine-test-fix/chat-g5t6q'
    paths:
      - '.github/workflows/format-es80-preh-quarantine-test-chat-g5t6q.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cell/es80-preh-quarantine-test-fix/chat-g5t6q
          fetch-depth: 0
      - name: Normalize suite-member indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothPreHObservationRecoveryTests.swift')
          text = path.read_text()
          start_marker = '    @Test("committed Ready abort stays quarantined after raw FIFO retirement")\n'
          end_marker = '    @Test("canonical fence rejection proves zero Ready mutation and consumes one-shot admission")\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          normalized = textwrap.dedent(block)
          normalized = ''.join(('    ' + line if line.strip() else line) for line in normalized.splitlines(keepends=True))
          if normalized.count(start_marker) != 1:
              raise SystemExit('normalized block lost expected test marker')
          text = text[:start] + normalized + text[end:]
          path.write_text(text)
          PY

          git rm .github/workflows/format-es80-preh-quarantine-test-chat-g5t6q.yml
          git config user.name 'nembra-chat-g5t6q'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/PassiveCoreBluetoothPreHObservationRecoveryTests.swift
          git commit -m 'style: normalize pre-H quarantine regression'
          git push origin HEAD:cell/es80-preh-quarantine-test-fix/chat-g5t6q
