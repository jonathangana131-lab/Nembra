name: Capture Private Read Lease Chmod Recovery Once

on:
  push:
    branches:
      - repair/v17-capture-private-read-lease-descriptor-60c-sol-20260814

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Close post-mutation chmod failure rollback window
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/capture_selected_xcode_build_orchestrator.py")
          source = path.read_text(encoding="utf-8")
          old = '''\
                try:
                    _chmod_acl(descriptor, "+a", acl)
                except Exception:
                    os.close(descriptor)
                    raise

                self._opened.append((descriptor, before_acl, acl))
          '''
          new = '''\
                try:
                    _chmod_acl(descriptor, "+a", acl)
                except Exception:
                    # A command-level failure does not prove the kernel left the ACL
                    # unchanged. Keep descriptor custody until we can classify the
                    # post-call vnode. If mutation is observable (or inspection itself
                    # fails), the outer rollback still owns this exact descriptor.
                    self._opened.append((descriptor, before_acl, acl))
                    try:
                        after_failed_acl = _acl_listing(descriptor)
                    except Exception:
                        raise
                    if after_failed_acl == before_acl:
                        self._opened.pop()
                        os.close(descriptor)
                    raise

                self._opened.append((descriptor, before_acl, acl))
          '''
          if source.count(old) != 1:
              raise SystemExit("expected exactly one read-lease chmod admission block")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Prove portable rollback contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m py_compile \
            scripts/ci/capture_selected_xcode_build_orchestrator.py \
            scripts/ci/tests/test_capture_private_read_lease_rollback.py \
            scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py \
            scripts/ci/tests/test_capture_private_read_lease_build_window.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_rollback.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_host_ancestry.py
          python3 -B -I scripts/ci/tests/test_capture_private_read_lease_build_window.py
          git diff --check

      - name: Self-delete and publish hardened carrier
        shell: bash
        env:
          BRANCH: repair/v17-capture-private-read-lease-descriptor-60c-sol-20260814
          SELF: .github/workflows/capture-private-read-lease-chmod-recovery-once.yml
        run: |
          set -euo pipefail
          git rm "$SELF"
          git add scripts/ci/capture_selected_xcode_build_orchestrator.py
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$SELF" scripts/ci/capture_selected_xcode_build_orchestrator.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'nembra-swarm-materializer'
          git config user.email 'nembra-swarm@users.noreply.github.com'
          git commit -m 'Capture: rollback observable ACL after chmod failure'
          git push origin "HEAD:$BRANCH"
