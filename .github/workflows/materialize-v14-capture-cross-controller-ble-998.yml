name: Materialize Capture cross-controller BLE gate

on:
  push:
    branches:
      - product/v14-capture-cross-controller-ble-998-sol

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact current product ancestry
        shell: bash
        run: |
          set -euo pipefail
          base='998dca193619c38355d1bc5f71122b79bf17fb5a'
          test "$(git merge-base HEAD "$base")" = "$base"
          allowed="$(printf '%s\n' '.github/workflows/materialize-v14-capture-cross-controller-ble-998.yml' 'Packages/NembraBluetoothCapture/Tests/NembraBluetoothCaptureTests/TuyaCrossControllerBLEOwnershipSourceTests.swift' | sort)"
          test "$(git diff --name-only "$base" HEAD | sort)" = "$allowed"

      - name: Apply observation-only global Tuya BLE ownership gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('NembraApp/App/NembraCaptureEntrypoint.swift')
          source = path.read_text(encoding='utf-8')

          gate_anchor = '''        guard currentConnectionToken == nil else {\n'''
          gate = '''        guard !OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID) else {\n            failLocally(\n                "Tuya still reports a current local-BLE session for this scooter. Power the scooter OFF and wait for that session to clear, or relaunch Capture. Package-owned correlation will not scan while Tuya still owns local BLE.",\n                "existing_sdk_local_ble_ownership_blocks_scan"\n            )\n            return\n        }\n'''
          begin_start = source.index('    private func beginCorrelationSeries() {')
          begin_end = source.index('    func startNextCorrelationWindow()', begin_start)
          begin = source[begin_start:begin_end]
          if begin.count(gate_anchor) != 1:
              raise SystemExit(f'expected one current-generation guard in beginCorrelationSeries, found {begin.count(gate_anchor)}')
          if 'OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)' in begin:
              raise SystemExit('global Tuya BLE gate already present')
          begin = begin.replace(gate_anchor, gate + gate_anchor, 1)
          source = source[:begin_start] + begin + source[begin_end:]

          factory_anchor = '''    static func make() -> OfficialTuyaDriver? {\n'''
          helper = '''    static func isLocallyConnected(uuid: String) -> Bool {\n#if canImport(ThingSmartHomeKit) && canImport(NembraTuyaPrivateConfig)\n        guard bootstrap(), !uuid.isEmpty else { return false }\n        return ThingSmartBLEManager.sharedInstance().deviceStatue(withUUID: uuid)\n#else\n        return false\n#endif\n    }\n\n'''
          if source.count(factory_anchor) != 1:
              raise SystemExit(f'expected one OfficialTuyaFactory.make anchor, found {source.count(factory_anchor)}')
          if 'static func isLocallyConnected(uuid: String) -> Bool' in source:
              raise SystemExit('OfficialTuyaFactory local-BLE helper already present')
          source = source.replace(factory_anchor, helper + factory_anchor, 1)
          path.write_text(source, encoding='utf-8')
          PY

          grep -Fq 'OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'existing_sdk_local_ble_ownership_blocks_scan' NembraApp/App/NembraCaptureEntrypoint.swift
          grep -Fq 'ThingSmartBLEManager.sharedInstance().deviceStatue(withUUID: uuid)' NembraApp/App/NembraCaptureEntrypoint.swift
          # Preserve the current relaunch-only unresolved failure routing; stale #2284 removed these guards.
          test "$(grep -Fc 'test.canRestartFromFreshOFF1 && (!sdkAccount.loggedIn || !test.sdkAccountLoggedIn)' NembraApp/App/NembraCaptureEntrypoint.swift)" = 1
          test "$(grep -Fc 'test.canRestartFromFreshOFF1 && test.sdkAccountLoggedIn && (!test.sdkDeviceMembershipVerified || !test.accountIdentityLeaseIsAuthorized)' NembraApp/App/NembraCaptureEntrypoint.swift)" = 1
          # The gate is observation-only and must precede package discovery reset.
          python3 <<'PY'
          from pathlib import Path
          s = Path('NembraApp/App/NembraCaptureEntrypoint.swift').read_text()
          a = s.index('    private func beginCorrelationSeries() {')
          b = s.index('    func startNextCorrelationWindow()', a)
          body = s[a:b]
          assert body.index('OfficialTuyaFactory.isLocallyConnected(uuid: tuyaUUID)') < body.index('resetDiscoverySessionOnly()')
          for forbidden in ('disconnectBLE', 'publishDps', 'queryDps', 'sessionLedger.endConnection'):
              assert forbidden not in body
          PY
          git diff --check

      - name: Publish clean current-product successor
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/materialize-v14-capture-cross-controller-ble-998.yml'
          rm "$workflow"
          git add -A
          expected="$(printf '%s\n' "$workflow" 'NembraApp/App/NembraCaptureEntrypoint.swift' | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git config user.name 'nembra-v14-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(capture): gate correlation on global Tuya BLE ownership'
          git push origin HEAD:product/v14-capture-cross-controller-ble-998-sol
