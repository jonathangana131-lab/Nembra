name: Capture Visual Child Reanchor

on:
  push:
    branches:
      - agent/v14-capture-standalone-visual-exact-head

permissions:
  contents: write

jobs:
  reanchor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reanchor exact visual child without replaying stale product bytes
        shell: bash
        run: |
          set -euo pipefail
          desired_visual="25d6e6f9eb091ced9b1e3edb33f0203b02e179dd"
          expected_product="502cfc43d8943bacb446f287b58d46463df3a7ca"
          branch="agent/v14-capture-standalone-visual-exact-head"
          git merge-base --is-ancestor "$desired_visual" HEAD
          git fetch origin product/v14-capture-guided-truth-current-sol
          product="$(git rev-parse origin/product/v14-capture-guided-truth-current-sol)"
          test "$product" = "$expected_product"
          git config user.name "nembra-go-bot"
          git config user.email "nembra-go-bot@users.noreply.github.com"
          git reset --hard "$desired_visual"
          git merge --no-edit "$product"
          test "$(git show HEAD:.github/workflows/capture-standalone-visual-evidence.yml | head -n 1)" = "name: Capture Standalone Visual Evidence"
          git diff --check "$product"..HEAD
          changed="$(git diff --name-only "$product"..HEAD)"
          expected="$(printf '%s\n' '.github/workflows/capture-standalone-visual-evidence.yml' 'scripts/ci/capture_standalone_visual_evidence.sh' 'scripts/ci/tests/test_capture_standalone_visual_evidence.py')"
          test "$changed" = "$expected"
          git push --force-with-lease="refs/heads/$branch:$GITHUB_SHA" origin HEAD:"$branch"
