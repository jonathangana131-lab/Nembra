name: Capture Fold Live Post-Open Ancestor Revalidation Once

on:
  push:
    branches:
      - repair/v17-capture-post-open-ancestor-revalidation-f1be-gpt56-go
    paths:
      - .github/workflows/capture-fold-post-open-ancestor-revalidation-f1be-once.yml

permissions:
  contents: write

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/v17-capture-post-open-ancestor-revalidation-f1be-gpt56-go
          fetch-depth: 0

      - name: Bind exact live carrier
        shell: bash
        run: |
          set -euo pipefail
          attacked=f1be1b584e8b568fb8c3998adad3ee0b29004fdc
          test "$(git merge-base HEAD "$attacked")" = "$attacked"
          changed="$(git diff --name-only "$attacked"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/capture-fold-post-open-ancestor-revalidation-f1be-once.yml \
            scripts/ci/fold_post_open_ancestor_revalidation_once.py | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$attacked"...HEAD

      - name: Apply exact production transform
        run: python3 scripts/ci/fold_post_open_ancestor_revalidation_once.py

      - name: Verify permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          python3 scripts/ci/tests/test_capture_accepted_build_input_snapshot.py
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Publish permanent two-path repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/ci/capture_accepted_build_input_snapshot.py \
            scripts/ci/tests/test_capture_generated_shared_ancestor_continuity.py
          git rm \
            .github/workflows/capture-fold-post-open-ancestor-revalidation-f1be-once.yml \
            scripts/ci/fold_post_open_ancestor_revalidation_once.py
          git commit -m "fix(capture): revalidate live carrier ancestor after final child open"
          git push origin HEAD:repair/v17-capture-post-open-ancestor-revalidation-f1be-gpt56-go
